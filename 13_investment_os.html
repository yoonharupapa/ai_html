function bindSell(d){
  const reset = qs('#sReset');
  if(reset) reset.addEventListener('click', function(){
    if(confirm('진행 중인 매도 판단을 초기화할까?')){ S.sellDraft = null; save(); viewSell(); }
  });
  if(d.phase === 'type'){
    const hs = qs('#sHold');
    if(hs) hs.addEventListener('change', function(){
      const hld = S.holdings.find(function(x){ return x.id === hs.value; });
      if(!hld) return;
      d.holdingId = hld.id; d.asset = hld.name; d.assetType = hld.type;
      d.stockType = hld.stockType || ''; d.phase = sellEntryPhase(hld.type);
      save(); viewSell();
    });
    qsa('[data-t]').forEach(function(b){
      b.addEventListener('click', function(){
        d.asset = val('#sName') || d.asset || '(이름 없음)';
        d.assetType = b.dataset.t; d.phase = sellEntryPhase(d.assetType);
        save(); viewSell();
      });
    });
    return;
  }
  const go = qs('#sGo');
  if(go) go.addEventListener('click', function(){
    let err = null;
    if(d.phase === 'first'){
      d.firstAns = pfVal('sf');
      if(d.firstAns === null) err = '질문에 응답하라.';
      else d.phase = 'psych';
    } else if(d.phase === 'special'){
      d.spAlive = pfVal('sp1'); d.spRealized = pfVal('sp2');
      if(d.spAlive === null || d.spRealized === null) err = '두 질문 모두 응답하라.';
      else d.phase = 'psych';
    } else if(d.phase === 'theme'){
      d.themeAns = pfVal('th');
      if(d.themeAns === null) err = '코어인지 액티브 베팅인지 답하라.';
      else { d.themeCoreClaim = (d.themeAns === true); d.phase = 'matrix'; }
    } else if(d.phase === 'matrix'){
      if(d.assetType === '개별주') d.stockType = val('#sStock');
      d.thesis = val('#sThesis'); d.price = val('#sPrice');
      d.third = (d.thesis === '유지' && d.price) ? pfVal('s3') : null;
      d.sigSeen = (d.assetType === '개별주' && d.stockType && SELL_SIGNALS[d.stockType]) ? pfVal('sig') : null;
      d.taxOk = pfVal('tax');
      if(!d.thesis || !d.price) err = '가설 상태와 가격 상태를 선택하라.';
      else if(d.thesis === '유지' && d.third === null) err = '조건 질문에 응답하라.';
      else if(d.assetType === '개별주' && d.stockType && SELL_SIGNALS[d.stockType] && d.sigSeen === null) err = '매도 신호 관찰 여부에 응답하라.';
      else if(d.taxOk === null) err = '세금·거래비용 고려 여부에 응답하라.';
      else d.phase = 'psych';
    } else if(d.phase === 'psych'){
      let miss = false;
      PSYCH_FILTER.forEach(function(_, i){ const v = pfVal('py_' + i); if(v === null) miss = true; d.psych[i] = v; });
      if(miss) err = '5개 문항 모두 응답하라.';

  if(d.phase === 'matrix'){

      S.sells.push(rec);

/* ---------- 다운로드 ---------- */
function download(name, text, mime){
  if(typeof globalThis !== 'undefined' && globalThis.__IOS__)
    globalThis.__IOS__._lastDownload = { name:name, text:text };
  try{
    const blob = new Blob([text], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 200);
    return true;
  }catch(e){ return false; }
}

  S.temperature.forEach(function(x){
    L.push({ k:'시장온도', d:x.date, html:
      '<div class="li tl--temp"><div class="t"><span class="nm">[온도] ' + x.score100 + ' / 100</span>' +
      '<span><span class="badge mut">' + esc(x.regime) + '</span> <span class="xs mut">' + esc(x.date) + ' · ' + esc(x.confidence) + '</span></span></div>' +
      '<div class="sub">' + esc((x.evidence || '').slice(0, 110)) + '</div></div>' });
  });
  S.mistakes.forEach(function(x){
    L.push({ k:'실수', d:x.date, html:
      '<div class="li tl--mistake"><div class="t"><span class="nm">[실수] ' + esc(x.type) + (x.relatedAsset ? ' — ' + esc(x.relatedAsset) : '') + '</span>' +
      '<span><span class="badge bad">' + esc(x.cost || '비용 미기록') + '</span> <span class="xs mut">' + esc(x.date) + '</span></span></div>' +
      '<div class="sub">원인: ' + esc(x.cause || '—') + '</div>' +
      '<div class="sub">재발 방지: <b>' + esc(x.preventionRule || '—') + '</b></div>' +
      '<div class="btnrow" style="margin-top:6px"><button class="btn sm danger" data-mdel="' + x.id + '">삭제</button></div></div>' });
  });
  L.sort(function(a, b){ return a.d === b.d ? 0 : (a.d < b.d ? 1 : -1); });
  return (filter && filter !== '전체') ? L.filter(function(i){ return i.k === filter; }) : L;
}

function viewJournal(params){
  const mid = params.get('m'), sid = params.get('s');
  if(mid) return memoDetail(mid);
  if(sid) return sellDetail(sid);
  const f = params.get('f') || '전체';
  const items = journalItems(f);
  MAIN.innerHTML =
  '<div class="card"><h2>일지 — 투자 실험실 <span class="xs mut">기록 ' + items.length + '건</span></h2>' +
  '<div style="margin:6px 0 4px">' + J_FILTERS.map(function(x){
    return '<button class="chip' + (x === f ? ' on' : '') + '" data-f="' + x + '"' + (x === f ? ' style="border-color:var(--acc);color:var(--acc)"' : '') + '>' + x + '</button>'; }).join('') + '</div>' +
  '<details style="margin-top:8px"><summary class="sm" style="cursor:pointer;font-weight:600">＋ 실수 기록 추가 (실수 유형 9종)</summary>' +
  '<div style="margin-top:10px"><div class="grid2">' +
  field('유형 *', '<select id="mkType">' + selOpts(MISTAKE_TYPES, '', '선택…') + '</select>') +
  field('관련 자산', '<input type="text" id="mkAsset">') +
  field('비용·기회비용 (예: -120만원)', '<input type="text" id="mkCost">') +
  field('날짜', '<input type="date" id="mkDate" value="' + todayISO() + '">') +
  '</div>' +
  field('원인 — 무엇이 이 실수를 만들었나', '<textarea id="mkCause"></textarea>') +
  field('재발 방지 규칙 — 다음에 무엇을 다르게 하나 *', '<textarea id="mkPrev"></textarea>') +
  '<div class="btnrow"><button class="btn pri" id="mkAdd">기록</button></div><div id="mkMsg"></div></div></details></div>' +
  '<div id="jList">' + (items.length ? items.map(function(i){ return i.html; }).join('')
    : '<div class="card"><p class="mut sm">기록 없음. 매수 검토·매도 판단·점검·온도 기록이 자동으로 쌓인다.</p></div>') + '</div>';

  on('[data-f]', 'click', function(e){ goto('journal?f=' + encodeURIComponent(e.currentTarget.dataset.f)); });
  on('[data-open]', 'click', function(e){ goto(e.currentTarget.dataset.open); });
  on('[data-mdel]', 'click', function(e){
    e.stopPropagation();
    if(!confirm('실수 기록을 삭제할까?')) return;
    const id = e.currentTarget.dataset.mdel;
    S.mistakes = S.mistakes.filter(function(x){ return x.id !== id; });
    save(); viewJournal(new URLSearchParams('f=' + encodeURIComponent(f)));
  });
  const add = qs('#mkAdd');
  if(add) add.addEventListener('click', function(){
    const tp = val('#mkType'), pv = val('#mkPrev');
    if(!tp || !pv){ qs('#mkMsg').innerHTML = '<div class="alert warn" style="margin-top:8px">유형과 재발 방지 규칙은 필수다 — 규칙 없는 반성은 반복된다.</div>'; return; }
    S.mistakes.push({ id: uid(), schema:1, date: val('#mkDate') || todayISO(), type:tp,
      relatedAsset: val('#mkAsset'), cost: val('#mkCost'), cause: val('#mkCause'), preventionRule: pv });
    save(); viewJournal(new URLSearchParams('f=실수'));
  });
}

function memoDetail(id){
  const x = S.memos.find(function(v){ return v.id === id; });
  if(!x){ MAIN.innerHTML = '<div class="card">기록 없음. <a href="#journal">일지로</a></div>'; return; }
  MAIN.innerHTML = '<div class="card">' +
    '<div class="t" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2 style="margin:0">' + esc(x.asset) + ' <span class="xs mut">매수 검토 · ' + esc(x.date) + '</span></h2>' +
    stamp(badgeFor(x.verdict), x.verdict) + '</div><hr>' +
    '<div class="doc" style="border:0;padding:0;box-shadow:none">' + memoReportHtml(x).replace('<h1>', '<h4 style="display:none">').replace('</h1>', '</h4>') + '</div>' +
    '<div class="btnrow"><button class="btn pri" id="dPrint">인쇄 리포트 (PDF 저장)</button>' +
    '<a class="btn" href="#journal">← 일지</a><button class="btn danger sm" id="dDel" style="margin-left:auto">기록 삭제</button></div></div>';
  qs('#dPrint').addEventListener('click', function(){
    printDoc(x.asset + '_' + x.date + '_매수검토', memoReportHtml(x));
  });
  qs('#dDel').addEventListener('click', function(){
    if(!confirm('이 검토 기록을 삭제할까? 복구 불가.')) return;
    S.memos = S.memos.filter(function(v){ return v.id !== id; });
    save(); goto('journal');
  });
}
function sellDetail(id){
  const x = S.sells.find(function(v){ return v.id === id; });
  if(!x){ MAIN.innerHTML = '<div class="card">기록 없음. <a href="#journal">일지로</a></div>'; return; }
  MAIN.innerHTML = '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2 style="margin:0">' + esc(x.asset) + ' <span class="xs mut">매도 판단 · ' + esc(x.date) + '</span></h2>' +
    stamp(x.verdictCls, x.verdict) + '</div><hr>' +
    '<div class="doc" style="border:0;padding:0;box-shadow:none">' + sellReportHtml(x).replace('<h1>', '<h4 style="display:none">').replace('</h1>', '</h4>') + '</div>' +
    '<div class="btnrow"><button class="btn pri" id="dPrint">인쇄 리포트 (PDF 저장)</button>' +
    '<a class="btn" href="#journal">← 일지</a><button class="btn danger sm" id="dDel" style="margin-left:auto">기록 삭제</button></div></div>';
  qs('#dPrint').addEventListener('click', function(){ printDoc(x.asset + '_' + x.date + '_매도판단', sellReportHtml(x)); });
  qs('#dDel').addEventListener('click', function(){
    if(!confirm('이 판단 기록을 삭제할까? 복구 불가.')) return;
    S.sells = S.sells.filter(function(v){ return v.id !== id; });
    save(); goto('journal');
  });
}

/* ---------- 데이터: 백업 · CSV · 복원 · 초기화 ---------- */
const CSV_DEFS = [
  { key:'memos', label:'매수검토 (investment_memos)', fn:function(){
    const rows = [['id','date','asset','ticker','asset_type','stock_type','verdict','position_pct','emotion','pvv','leverage','level_snapshot','temp_score','temp_regime','next_review','valuation','market_expect','my_view','what_breaks','sell_rule','thesis']];
    S.memos.forEach(function(x){ const t = x.tempSnapshot || {};
      rows.push([x.id, x.date, x.asset, x.ticker, x.assetType, x.stockType, x.verdict, x.positionPct, x.emotion, x.pvv, x.leverage, x.levelSnapshot, t.score100, t.regime, x.nextReview, x.valuation, x.marketExpect, x.myView, x.whatBreaks, x.sellRule, x.thesis]); });
    return rows; } },
  { key:'gates', label:'체크리스트 결과 (checklist_results)', fn:function(){
    const rows = [['memo_id','date','asset','grp','item','pass','hard','fail_action','src']];
    S.memos.forEach(function(x){ (x.gates || []).forEach(function(g){
      rows.push([x.id, x.date, x.asset, g.grp, g.q, g.pass, g.hard, g.fail, g.src]); }); });
    return rows; } },
  { key:'temperature', label:'시장온도 (market_temperature)', fn:function(){
    const ks = TEMP10.map(function(t){ return t.k; });
    const rows = [['id','date','score100','regime','confidence','evidence'].concat(ks)];
    S.temperature.forEach(function(x){
      rows.push([x.id, x.date, x.score100, x.regime, x.confidence, x.evidence].concat(ks.map(function(k){ return (x.scores || {})[k]; }))); });
    return rows; } },
  { key:'holdings', label:'보유 (holdings)', fn:function(){
    const rows = [['id','name','ticker','type','stock_type','position_pct','status','added_at','last_review','next_review','thesis_state','sold_at','memo_id']];
    S.holdings.forEach(function(x){ rows.push([x.id, x.name, x.ticker, x.type, x.stockType, x.positionPct, x.status, x.addedAt, x.lastReview, x.nextReview, x.thesisState, x.soldAt, x.memoId]); });
    return rows; } },
  { key:'reviews', label:'점검 (reviews)', fn:function(){
    const rows = [['id','date','holding_id','holding_name','kind','thesis_status','issues','notes']];
    S.reviews.forEach(function(x){
      rows.push([x.id, x.date, x.holdingId, x.holdingName, x.kind, x.thesisStatus,
        x.items.map(function(i){ return i.q + ':' + i.status; }).join(' | '),
        x.items.map(function(i){ return i.note; }).filter(Boolean).join(' | ')]); });
    return rows; } },
  { key:'sells', label:'매도판단 (sell_decisions)', fn:function(){
    const rows = [['id','date','asset','asset_type','stock_type','holding_id','verdict','thesis','price','third','sig_seen','tax_ok','psych_flags','theme_core_claim','next_review','why']];
    S.sells.forEach(function(x){ const a = x.answers || {};
      rows.push([x.id, x.date, x.asset, x.assetType, x.stockType, x.holdingId, x.verdict, a.thesis, a.price, a.third, a.sigSeen, a.taxOk,
        (a.psych || []).map(function(p, i){ return p === true ? (i + 1) : null; }).filter(Boolean).join('+'), a.themeCoreClaim, x.nextReview, x.why]); });
    return rows; } },
  { key:'mistakes', label:'실수 (mistake_log)', fn:function(){
    const rows = [['id','date','type','related_asset','cost','cause','prevention_rule']];
    S.mistakes.forEach(function(x){ rows.push([x.id, x.date, x.type, x.relatedAsset, x.cost, x.cause, x.preventionRule]); });
    return rows; } }
];

function viewData(){
  const bytes = JSON.stringify(S).length;
  const bAt = S.settings.lastBackupAt;
  MAIN.innerHTML =
  '<div class="card card--vault"><h2>백업 — 1급 워크플로우</h2>' +
  '<p class="sm mut">기록은 이 브라우저 저장소에만 있다. 브라우저 데이터 삭제·기기 변경이 곧 기록 소멸이다 — JSON 백업이 유일한 보험이다.</p>' +
  '<p class="sm">현재 데이터 ' + (bytes / 1024).toFixed(1) + ' KB (한도 약 5MB) · 마지막 백업: ' + (bAt ? esc(bAt) + ' (' + daysFrom(bAt) + '일 전)' : '<b style="color:var(--bad)">없음</b>') + '</p>' +
  '<div class="btnrow"><button class="btn pri" id="bkGo">전체 백업 JSON 다운로드</button></div><div id="bkMsg"></div>' +
  '<hr><h3>복원</h3>' +
  '<div class="grid2">' +
  field('백업 파일 선택', '<input type="file" id="rsFile" accept=".json,application/json">') +
  field('또는 백업 내용 붙여넣기', '<textarea id="restoreText" placeholder="{ &quot;schema_version&quot;: 1, … }"></textarea>') +
  '</div>' +
  '<div class="btnrow"><button class="btn" id="restoreGo">복원 실행 (현재 데이터 대체)</button></div><div id="rsMsg"></div></div>' +
  '<div class="card"><h2>CSV 내보내기 <span class="xs mut">분석용 — pandas/SQLite 호환, 엑셀 한글 BOM</span></h2>' +
  '<div class="btnrow">' + CSV_DEFS.map(function(c){
    return '<button class="btn sm" data-csv="' + c.key + '">' + esc(c.label) + '</button>'; }).join('') + '</div>' +
  '<p class="xs mut" style="margin-top:8px">테이블 스키마는 합의 설계(investment_memos / checklist_results / market_temperature / reviews / sell_decisions / mistake_log)를 따른다. 데이터가 쌓이면 2~3차 분석 단계로 그대로 이주 가능.</p></div>' +
  '<div class="card card--dangerzone"><h2>위험 구역</h2>' +
  '<div class="btnrow"><button class="btn danger" id="wipeGo">전체 초기화</button></div><div id="wipeMsg"></div></div>';

  qs('#bkGo').addEventListener('click', function(){
    S.settings.lastBackupAt = todayISO(); save();
    download('investment_os_backup_' + todayISO() + '.json', JSON.stringify(S, null, 1), 'application/json');
    qs('#bkMsg').innerHTML = '<div class="alert ok" style="margin-top:10px">백업 파일 생성됨 — 클라우드/메신저 등 기기 밖 1곳에 보관하라.</div>';
  });
  function doRestore(text){
    let p;
    try{ p = JSON.parse(text); }
    catch(e){ qs('#rsMsg').innerHTML = '<div class="alert bad" style="margin-top:8px">JSON 해석 실패 — 파일이 손상됐거나 형식이 아니다.</div>'; return; }
    if(typeof p.schema_version !== 'number' || !p.memos || !p.temperature){
      qs('#rsMsg').innerHTML = '<div class="alert bad" style="margin-top:8px">이 앱의 백업 형식이 아니다 (schema_version 누락).</div>'; return;
    }
    if(p.schema_version > 1){
      qs('#rsMsg').innerHTML = '<div class="alert warn" style="margin-top:8px">상위 스키마(' + p.schema_version + ') 백업 — 신버전 앱에서 복원하라.</div>'; return;
    }
    if(!confirm('현재 데이터를 백업 내용으로 대체한다. 계속할까?')) return;
    S = Object.assign(defaultState(), p);
    save();
    qs('#rsMsg').innerHTML = '<div class="alert ok" style="margin-top:8px">복원 완료 — <a href="#home">홈</a> / <a href="#journal">일지</a>에서 확인.</div>';
  }
  qs('#restoreGo').addEventListener('click', function(){
    const t = val('#restoreText');
    if(t){ doRestore(t); return; }
    const f = qs('#rsFile').files && qs('#rsFile').files[0];
    if(!f){ qs('#rsMsg').innerHTML = '<div class="alert warn" style="margin-top:8px">파일을 선택하거나 내용을 붙여넣어라.</div>'; return; }
    const rd = new FileReader();
    rd.onload = function(){ doRestore(String(rd.result)); };
    rd.readAsText(f);
  });
  on('[data-csv]', 'click', function(e){
    const def = CSV_DEFS.find(function(c){ return c.key === e.currentTarget.dataset.csv; });
    download(def.key + '_' + todayISO() + '.csv', toCSV(def.fn()), 'text/csv;charset=utf-8');
  });
  qs('#wipeGo').addEventListener('click', function(){
    if(!confirm('모든 기록(일지·보유·온도·IPS·레벨)을 삭제한다. 백업은 받았는가?')) return;
    if(!confirm('정말 초기화할까? 복구 불가.')) return;
    S = defaultState(); save();
    qs('#wipeMsg').innerHTML = '<div class="alert ok" style="margin-top:8px">초기화됨. <a href="#home">홈으로</a></div>';
  });
}

registerRoute('journal', viewJournal);
registerRoute('data', viewData);

if (typeof globalThis !== 'undefined') {
  Object.assign(globalThis.__IOS__, { journalItems, memoReportHtml, sellReportHtml });
}
</script>
