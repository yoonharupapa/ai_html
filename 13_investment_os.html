<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>투자 운영 시스템</title>
<style>
/* ============================================================
   투자 운영 시스템 — Mission Control Chromatic (v2)
   예측이 아니라 절차 · 점수가 아니라 게이트 · 기록은 생존 장치
   ------------------------------------------------------------
   v2 핵심:
   ① 모듈 컬러 시스템 — 11개 탭이 각자 고유색을 가진다.
      JS 무변경: html:has(#tabs a[data-tab=…].on) 가 라우트를
      감지해 --ma(모듈 액센트)를 바꾸고, 파생 토큰은
      color-mix 로 자동 산출된다(미지원 브라우저는 amber 폴백).
   ② 타입 스케일 통일 — 2xs/xs/sm/md/lg/xl 6단으로 전 컴포넌트 정렬.
   ③ 인터랙션 레이어 — 카드 등장, 호버 리프트+글로우, 프레스,
      게이트 실패 셰이크, 판정 도장 팝, 니들 트랜지션.
      전부 prefers-reduced-motion 에서 비활성.
   ------------------------------------------------------------
   구토큰(--acc,--bad,--warn,--serif,--panel2,--mut …)은 JS 인라인이
   참조하므로 별칭 유지. --serif 는 상태값용 mono 로 재정의.
   selector 계약: JS 생성 class 전부 기존 이름 그대로.
   ============================================================ */

/* ---------- 1. 토큰 ---------- */
:root{
  /* 표면 — terminal */
  --bg:#0a0b0e;
  --surface:#11141b;          /* panel */
  --surface-subtle:#0c0e13;   /* panel2 / field */
  --surface-elevated:#161a24;
  --surface-head:#0d1018;     /* card header strip */
  --grid-line:rgba(255,255,255,.018);
  /* 잉크 */
  --ink:#D7DCE6;
  --ink-strong:#F3F6FB;
  --ink-muted:#8A93A5;
  --ink-faint:#5d6678;
  /* 선 */
  --line:#1e2330;
  --line-strong:#2c3342;
  --line-accent:#3c2f13;
  /* 상태 시맨틱 — 통과/조건부/중단/정보 (모듈색과 독립) */
  --ok:#3DDC97;     --ok-soft:rgba(61,220,151,.13);  --ok-bd:rgba(61,220,151,.5);
  --warn:#FFD23F;   --warn-soft:rgba(255,210,63,.13);--warn-bd:rgba(255,210,63,.5);
  --danger:#FF5C5C; --danger-soft:rgba(255,92,92,.13);--danger-bd:rgba(255,92,92,.55);
  --info:#45D6F4;   --info-soft:rgba(69,214,244,.13);--info-bd:rgba(69,214,244,.45);
  /* 검색 하이라이트 */
  --mark:rgba(255,178,36,.28);
  --mark-ink:#FFCE7A;
  --mark-glow:0 0 8px rgba(255,178,36,.35);
  /* 모듈 액센트 — 기본 amber, 라우트가 덮어씀(§1.5) */
  --ma:#FFB224;
  --ma-2:#FFCE7A;
  --ma-contrast:#0a0b0e;
  --ma-soft:rgba(255,178,36,.12);
  --ma-soft:color-mix(in srgb,var(--ma) 12%,transparent);
  --ma-bd:rgba(255,178,36,.45);
  --ma-bd:color-mix(in srgb,var(--ma) 46%,transparent);
  --ma-glow:0 0 10px rgba(255,178,36,.30);
  --ma-glow:0 0 10px color-mix(in srgb,var(--ma) 34%,transparent);
  --ma-wash:radial-gradient(1100px 420px at 72% -8%,
    color-mix(in srgb,var(--ma) 8%,transparent),transparent 70%);
  /* 타입 스케일 — 6단 통일 */
  --t-2xs:.7rem; --t-xs:.8rem; --t-sm:.875rem; --t-md:.95rem;
  --t-lg:1.06rem; --t-xl:1.32rem;
  /* 깊이 / 모서리 / 간격 */
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --lift:0 4px 14px rgba(0,0,0,.4);
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:44px;
  /* 글 — 외부 CDN 없음(오프라인 단일 HTML) */
  --fs:16px;
  --font-sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo",
    "Malgun Gothic","Noto Sans KR",system-ui,-apple-system,
    BlinkMacSystemFont,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,"Roboto Mono",
    Consolas,"D2Coding","Noto Sans Mono CJK KR",monospace;
  --sans:var(--font-sans);
  --mono:var(--font-mono);
  --serif:var(--font-mono);   /* 재정의: 표시값 폰트 = mono (JS 인라인 호환) */
  /* 레이아웃 상수 */
  --topbar-h:52px; --tabs-h:46px;
  color-scheme:dark;
  --card-px:22px; --card-pt:18px;

  /* ----- 구토큰 별칭 (JS 인라인 스타일 호환 — 삭제 금지) ----- */
  --panel:var(--surface); --panel2:var(--surface-subtle);
  --mut:var(--ink-muted); --acc:var(--ma); --accSoft:var(--ma-soft);
  --okSoft:var(--ok-soft); --warnSoft:var(--warn-soft);
  --bad:var(--danger); --badSoft:var(--danger-soft);
  --shadow:var(--shadow-sm);
  --accent:var(--ma); --accent-2:var(--ma-2); --accent-ink:var(--ma-2);
  --accent-soft:var(--ma-soft); --accent-bd:var(--ma-bd);
  --accent-fill:var(--ma); --accent-contrast:var(--ma-contrast);
}
html[data-theme="light"]{
  color-scheme:light;
  /* Daylight Console — 동일 구조, 주광 토큰. 발광→면 분리로 전환 */
  --bg:#eef0f4;
  --surface:#ffffff;
  --surface-subtle:#f4f6fa;
  --surface-elevated:#ffffff;
  --surface-head:#eef1f7;
  --grid-line:rgba(29,35,46,.04);
  --ink:#222a37;
  --ink-strong:#0e141d;
  --ink-muted:#5b6678;
  --ink-faint:#8c96a8;
  --line:#dadfe8;
  --line-strong:#c3cad7;
  --line-accent:#e7d3a2;
  --ok:#0E8A55;     --ok-soft:#e0f4ea;   --ok-bd:#97d6b6;
  --warn:#8F6C00;   --warn-soft:#f9f1cd; --warn-bd:#ddc15e;
  --danger:#C0392F; --danger-soft:#fbe5e2;--danger-bd:#eba49d;
  --info:#0E7D99;   --info-soft:#e1f2f8; --info-bd:#93cbdc;
  --mark:#ffe2a8;
  --mark-ink:#5c3c00;
  --mark-glow:none;
  --ma:#B06A00;
  --ma-2:#7a4a04;
  --ma-contrast:#ffffff;
  --ma-soft:#f7ead4;
  --ma-soft:color-mix(in srgb,var(--ma) 11%,#ffffff);
  --ma-bd:#dcb877;
  --ma-bd:color-mix(in srgb,var(--ma) 42%,#ffffff);
  --ma-glow:none;
  --ma-wash:radial-gradient(1100px 420px at 72% -8%,
    color-mix(in srgb,var(--ma) 6%,transparent),transparent 70%);
  --shadow-sm:0 1px 2px rgba(20,26,36,.08);
  --shadow-md:0 4px 14px rgba(20,26,36,.10);
  --lift:0 4px 14px rgba(20,26,36,.12);
}

/* ---------- 1.5 모듈 컬러 라우팅 — JS 무변경, .on 감지 ---------- */
/* 다크: 비비드 / 라이트: 동일 휴의 저명도 변형 */
html:has(#tabs a[data-tab="home"].on)    {--ma:#FFB224;--ma-2:#FFCE7A}
html:has(#tabs a[data-tab="reader"].on)  {--ma:#B49AFF;--ma-2:#D2C3FF}
html:has(#tabs a[data-tab="search"].on)  {--ma:#45D6F4;--ma-2:#9AE8FA}
html:has(#tabs a[data-tab="buy"].on)     {--ma:#FF8A4C;--ma-2:#FFB48A}
html:has(#tabs a[data-tab="temp"].on)    {--ma:#FF6E5E;--ma-2:#FFA398}
html:has(#tabs a[data-tab="sell"].on)    {--ma:#FF7BAC;--ma-2:#FFAACB}
html:has(#tabs a[data-tab="holdings"].on){--ma:#3DDC97;--ma-2:#8CEEC2}
html:has(#tabs a[data-tab="journal"].on) {--ma:#8B9DFF;--ma-2:#B7C2FF}
html:has(#tabs a[data-tab="ips"].on)     {--ma:#5EA8FF;--ma-2:#9CC8FF}
html:has(#tabs a[data-tab="level"].on)   {--ma:#FFD23F;--ma-2:#FFE389}
html:has(#tabs a[data-tab="data"].on)    {--ma:#2EE6C8;--ma-2:#85F2DF}
html[data-theme="light"]:has(#tabs a[data-tab="home"].on)    {--ma:#B06A00;--ma-2:#7a4a04}
html[data-theme="light"]:has(#tabs a[data-tab="reader"].on)  {--ma:#6B4FC8;--ma-2:#4d3699}
html[data-theme="light"]:has(#tabs a[data-tab="search"].on)  {--ma:#0E7D99;--ma-2:#0a5d73}
html[data-theme="light"]:has(#tabs a[data-tab="buy"].on)     {--ma:#C2510E;--ma-2:#933c08}
html[data-theme="light"]:has(#tabs a[data-tab="temp"].on)    {--ma:#C24437;--ma-2:#943126}
html[data-theme="light"]:has(#tabs a[data-tab="sell"].on)    {--ma:#C23D72;--ma-2:#962b56}
html[data-theme="light"]:has(#tabs a[data-tab="holdings"].on){--ma:#0E8A55;--ma-2:#0a6940}
html[data-theme="light"]:has(#tabs a[data-tab="journal"].on) {--ma:#4C5ED6;--ma-2:#3847a6}
html[data-theme="light"]:has(#tabs a[data-tab="ips"].on)     {--ma:#1A6AC9;--ma-2:#124e96}
html[data-theme="light"]:has(#tabs a[data-tab="level"].on)   {--ma:#8F6C00;--ma-2:#6b5100}
html[data-theme="light"]:has(#tabs a[data-tab="data"].on)    {--ma:#0B8C7A;--ma-2:#08695c}

/* ---------- 2. 베이스 ---------- */
*{box-sizing:border-box} html{font-size:var(--fs)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  line-height:1.7;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;
  word-break:keep-all;overflow-wrap:break-word;
  /* 모듈 컬러 앰비언트 워시 + 관제실 30px 그리드 */
  background-image:var(--ma-wash),
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:auto,30px 30px,30px 30px;
  background-attachment:fixed,scroll,scroll}
a{color:var(--info);text-decoration:none;transition:color .15s}
a:hover{text-decoration:underline}
button{font-family:inherit}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--surface-subtle);
  border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;
  color:var(--ma-2)}
::selection{background:var(--ma-soft);color:var(--ink-strong)}
:focus-visible{outline:2px solid var(--ma);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;
  border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ma-bd)}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes ledpulse{50%{opacity:.45}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}}
@keyframes breathe{50%{opacity:.55}}

/* 라우트 전환 — 콘텐츠 블록 순차 등장 */
#main>*{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
#main>*:nth-child(2){animation-delay:.05s}
#main>*:nth-child(3){animation-delay:.1s}
#main>*:nth-child(4){animation-delay:.15s}
#main>*:nth-child(n+5){animation-delay:.2s}

/* ---------- 3. 상단 바 — 커맨드 바 ---------- */
#topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border-bottom:1px solid var(--line-accent);
  display:flex;align-items:center;gap:8px;padding:0 14px}
#topbar .brand{font-family:var(--mono);font-weight:800;font-size:var(--t-md);
  letter-spacing:.05em;white-space:nowrap;line-height:1.2;
  color:var(--ma);
  background:linear-gradient(92deg,var(--ma) 30%,var(--ma-2) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
#topbar .brand::before{content:"▮ ";-webkit-text-fill-color:var(--ma);
  animation:blink 1.2s steps(1) infinite}
#topbar .brand small{font-family:var(--mono);font-weight:700;
  font-size:var(--t-2xs);margin-left:8px;letter-spacing:.05em;
  -webkit-text-fill-color:var(--info);color:var(--info)}
@media(max-width:520px){#topbar .brand small{display:none}}
#topbar .sp{flex:1}
.iconbtn{font-family:var(--mono);background:var(--surface-subtle);
  border:1px solid var(--line-strong);color:var(--ink-muted);
  border-radius:var(--radius-sm);padding:6px 11px;cursor:pointer;
  font-size:var(--t-xs);letter-spacing:.02em;white-space:nowrap;
  transition:color .15s,border-color .15s,transform .12s,box-shadow .15s}
.iconbtn:hover{border-color:var(--ma);color:var(--ma);
  transform:translateY(-1px);box-shadow:var(--ma-glow)}
.iconbtn:active{transform:none}

/* ---------- 4. 탭 내비 — 컬러 모듈 셀렉터 (메뉴 강조) ---------- */
#tabs{position:sticky;top:var(--topbar-h);z-index:29;display:flex;gap:3px;
  overflow-x:auto;background:var(--surface-head);
  border-bottom:1px solid var(--line);padding:0 10px;
  scrollbar-width:none;min-height:var(--tabs-h);align-items:stretch}
#tabs::-webkit-scrollbar{display:none}
#tabs a{--tabc:#FFB224;
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 13px;
  text-decoration:none;font-family:var(--mono);color:var(--ink-muted);
  font-size:.86rem;font-weight:600;letter-spacing:.03em;
  border-bottom:2px solid transparent;border-radius:6px 6px 0 0;
  white-space:nowrap;transition:color .15s,background .15s}
#tabs a::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;
  background:var(--tabc);opacity:.5;transition:opacity .15s,box-shadow .15s}
#tabs a:hover{color:var(--ink-strong);
  background:color-mix(in srgb,var(--tabc) 9%,transparent);text-decoration:none}
#tabs a:hover::before{opacity:.9}
#tabs a.on{color:var(--tabc);border-bottom-color:var(--tabc);font-weight:800;
  background:color-mix(in srgb,var(--tabc) 11%,transparent)}
#tabs a.on::before{opacity:1;box-shadow:0 0 8px var(--tabc)}
#tabs .sep{flex:0 0 auto;width:1px;background:var(--line-strong);margin:12px 6px}
/* 탭별 고유색 — 비활성 시에도 색 점으로 식별 */
#tabs a[data-tab="home"]    {--tabc:#FFB224}
#tabs a[data-tab="reader"]  {--tabc:#B49AFF}
#tabs a[data-tab="search"]  {--tabc:#45D6F4}
#tabs a[data-tab="buy"]     {--tabc:#FF8A4C}
#tabs a[data-tab="temp"]    {--tabc:#FF6E5E}
#tabs a[data-tab="sell"]    {--tabc:#FF7BAC}
#tabs a[data-tab="holdings"]{--tabc:#3DDC97}
#tabs a[data-tab="journal"] {--tabc:#8B9DFF}
#tabs a[data-tab="ips"]     {--tabc:#5EA8FF}
#tabs a[data-tab="level"]   {--tabc:#FFD23F}
#tabs a[data-tab="data"]    {--tabc:#2EE6C8}
html[data-theme="light"] #tabs a[data-tab="home"]    {--tabc:#B06A00}
html[data-theme="light"] #tabs a[data-tab="reader"]  {--tabc:#6B4FC8}
html[data-theme="light"] #tabs a[data-tab="search"]  {--tabc:#0E7D99}
html[data-theme="light"] #tabs a[data-tab="buy"]     {--tabc:#C2510E}
html[data-theme="light"] #tabs a[data-tab="temp"]    {--tabc:#C24437}
html[data-theme="light"] #tabs a[data-tab="sell"]    {--tabc:#C23D72}
html[data-theme="light"] #tabs a[data-tab="holdings"]{--tabc:#0E8A55}
html[data-theme="light"] #tabs a[data-tab="journal"] {--tabc:#4C5ED6}
html[data-theme="light"] #tabs a[data-tab="ips"]     {--tabc:#1A6AC9}
html[data-theme="light"] #tabs a[data-tab="level"]   {--tabc:#8F6C00}
html[data-theme="light"] #tabs a[data-tab="data"]    {--tabc:#0B8C7A}

/* ---------- 5. 레이아웃 / 카드 = 터미널 윈도 ---------- */
#main{max-width:880px;margin:0 auto;
  padding:var(--space-5) 14px calc(80px + env(safe-area-inset-bottom,0px))}
#foot{max-width:880px;margin:0 auto;
  padding:18px 14px calc(40px + env(safe-area-inset-bottom,0px));
  color:var(--ink-faint);font-size:var(--t-2xs);font-family:var(--mono);
  border-top:1px solid var(--line-accent);line-height:1.85;letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--radius-md);
  padding:var(--card-pt) var(--card-px) var(--space-4);
  margin:0 0 var(--space-4);box-shadow:var(--shadow-sm)}
@media(max-width:560px){:root{--card-px:15px;--card-pt:15px}}
.card h2{font-family:var(--mono);font-size:var(--t-lg);font-weight:800;
  color:var(--ink-strong);margin:0 0 12px;line-height:1.4;letter-spacing:.01em}
/* 첫 h2 = 모듈색 헤더 스트립 — LED + 그라데이션 + 풀폭 (헤드 강조) */
.card>h2:first-child{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--ma);
  margin:calc(-1 * var(--card-pt)) calc(-1 * var(--card-px)) 16px;
  padding:12px 16px;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--ma) 9%,var(--surface-head)),var(--surface-head));
  border-bottom:1px solid var(--ma-bd);
  border-radius:calc(var(--radius-md) - 1px) calc(var(--radius-md) - 1px) 0 0}
.card>h2:first-child::before{content:"";flex:none;width:9px;height:9px;
  border-radius:2px;background:var(--ma);box-shadow:0 0 9px var(--ma);
  animation:breathe 4s ease-in-out infinite}
.card h2 .xs{font-weight:600;font-size:var(--t-2xs);font-family:var(--mono);
  color:var(--ink-faint);letter-spacing:.05em}
.card>h2:first-child .xs{margin-left:auto;text-align:right}
.card h3{font-family:var(--mono);margin:18px 0 8px;font-size:var(--t-xs);
  font-weight:800;color:var(--ma);letter-spacing:.05em}
.card h3::before{content:"› ";color:var(--ma-2)}
.mut{color:var(--ink-muted)} .sm{font-size:var(--t-sm)} .xs{font-size:var(--t-xs)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.src{font-family:var(--mono);color:var(--ink-faint);font-size:var(--t-2xs);
  letter-spacing:.02em}
hr{border:0;border-top:1px solid var(--line);margin:var(--space-4) 0}

/* ---------- 6. 신조(운영 원칙) — 운영 선언부 ---------- */
.creed{position:relative;background:var(--surface);
  border:1px solid var(--line-strong);border-left:4px solid var(--ma);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  padding:var(--space-4) var(--space-5);margin:0 0 var(--space-4);
  box-shadow:var(--shadow-sm)}
.creed p{margin:6px 0;font-size:var(--t-md);line-height:1.9}
.creed p b{color:var(--ma-2)}
.creed .tag{font-family:var(--mono);font-size:var(--t-2xs);color:var(--ma);
  font-weight:800;letter-spacing:.26em;display:block;margin-bottom:9px}

/* ---------- 7. 도장(판정) = verdict state ---------- */
.stamp{display:inline-block;font-family:var(--mono);font-weight:800;
  letter-spacing:.06em;border:1px solid;border-radius:var(--radius-sm);
  padding:7px 16px;font-size:var(--t-md);line-height:1.35;
  font-variant-numeric:tabular-nums;background:var(--surface-head)}
.stamp.ok{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-soft)}
.stamp.warn{color:var(--warn);border-color:var(--warn-bd);background:var(--warn-soft)}
.stamp.bad{color:var(--danger);border-color:var(--danger-bd);background:var(--danger-soft)}
.stamp.big{font-size:1.42rem;padding:13px 28px;letter-spacing:.08em;
  animation:pop .26s cubic-bezier(.2,.8,.3,1.2) both}
.stamp.ok.big{box-shadow:0 0 16px var(--ok-soft)}
.stamp.warn.big{box-shadow:0 0 16px var(--warn-soft)}
/* EXECUTION HALT — 하드 게이트 보류는 정지 신호 */
.stamp.bad.big{box-shadow:0 0 16px rgba(255,92,92,.28);
  animation:pop .26s cubic-bezier(.2,.8,.3,1.2) both,
            ledpulse 1.6s ease-in-out .3s infinite}
html[data-theme="light"] .stamp.bad.big{box-shadow:0 0 0 3px var(--danger-soft)}

/* ---------- 8. 칩 / 배지 ---------- */
.chip{display:inline-block;font-family:var(--mono);border:1px solid var(--line-strong);
  border-radius:999px;padding:4px 12px;font-size:var(--t-xs);letter-spacing:.02em;
  background:var(--surface-head);color:var(--ink);margin:2px 4px 2px 0;
  transition:border-color .15s,color .15s,transform .12s,background .15s}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--ma);color:var(--ma);
  background:var(--ma-soft);transform:translateY(-1px)}
button.chip:active{transform:none}
.badge{display:inline-block;font-family:var(--mono);border:1px solid;
  border-radius:3px;padding:2px 8px;font-size:var(--t-2xs);font-weight:800;
  letter-spacing:.05em;vertical-align:middle}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-bd)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-bd)}
.badge.bad{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-bd)}
.badge.acc{background:var(--ma-soft);color:var(--ma-2);border-color:var(--ma-bd)}
.badge.mut{background:var(--surface-head);color:var(--ink-muted);
  border-color:var(--line-strong)}

/* ---------- 9. 폼 — 터미널 입력 ---------- */
label.f{display:block;margin:0 0 var(--space-3)}
label.f .lt{display:block;font-family:var(--mono);font-size:var(--t-xs);
  font-weight:600;color:var(--ink-muted);margin-bottom:5px;letter-spacing:.03em}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface-subtle);border:1px solid var(--line-strong);
  color:var(--ink);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:var(--t-md);font-family:var(--sans);
  transition:border-color .15s,box-shadow .15s,background .15s}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=file]{width:100%;font-size:var(--t-sm);color:var(--ink-muted)}
textarea{min-height:96px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--ma);outline:none;
  background:var(--surface);box-shadow:0 0 0 3px var(--ma-soft)}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
@media(max-width:560px){
  input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
}
.btn{display:inline-block;font-family:var(--mono);border:1px solid var(--line-strong);
  background:var(--surface-subtle);color:var(--ink);border-radius:var(--radius-sm);
  padding:9px 16px;font-size:var(--t-xs);font-weight:700;letter-spacing:.03em;
  cursor:pointer;text-decoration:none;line-height:1.5;
  transition:border-color .15s,color .15s,background .15s,
    transform .12s,box-shadow .15s}
.btn:hover{border-color:var(--ma);color:var(--ma);background:var(--ma-soft);
  text-decoration:none;transform:translateY(-1px);box-shadow:var(--ma-glow)}
.btn:active{transform:none;box-shadow:none}
/* 프라이머리 — 모듈색 채움: 화면마다 버튼 색이 바뀐다 */
.btn.pri{background:var(--ma);border-color:var(--ma);
  color:var(--ma-contrast)}
.btn.pri:hover{background:var(--ma-2);border-color:var(--ma-2);
  color:var(--ma-contrast);filter:saturate(1.15)}
html[data-theme="light"] .btn.pri:hover{background:var(--ma);filter:brightness(1.18)}
.btn.danger{color:var(--danger);border-color:var(--danger-bd);background:transparent}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);
  box-shadow:0 0 12px var(--danger-soft)}
.btn.sm{padding:5px 11px;font-size:var(--t-2xs)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--space-3);
  align-items:center}

/* ---------- 10. 통과/미충족 세그먼트 + 게이트 ---------- */
.pf{display:flex;gap:6px;margin-top:8px}
.pf label{flex:0 0 auto;font-family:var(--mono);border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);padding:8px 15px;font-size:var(--t-xs);
  font-weight:600;letter-spacing:.03em;cursor:pointer;
  background:var(--surface-subtle);color:var(--ink-muted);min-height:34px;
  transition:border-color .15s,background .15s,color .15s,transform .12s}
.pf label:hover{border-color:var(--ma);color:var(--ma);transform:translateY(-1px)}
.pf label:active{transform:none}
.pf input{position:absolute;opacity:0;width:0;height:0}
.pf label:has(input:checked){border-color:var(--ma);color:var(--ma-contrast);
  font-weight:800;background:var(--ma);box-shadow:var(--ma-glow)}
.pf label:has(input[value="1"]:checked)::before{content:"✓ "}
.pf.bad label:has(input[value="0"]:checked){border-color:var(--danger);
  color:#fff;background:var(--danger);box-shadow:0 0 10px var(--danger-soft)}
.pf.bad label:has(input[value="0"]:checked)::before{content:"✕ "}
.gateitem{border:1px solid var(--line-strong);border-radius:var(--radius-md);
  padding:13px 15px;margin:0 0 10px;background:var(--surface-subtle);
  transition:border-color .15s,background .15s}
.gateitem .q{font-size:var(--t-md);font-weight:700;line-height:1.6}
.gateitem .crit{font-size:var(--t-xs);color:var(--ink-muted);margin-top:4px;
  line-height:1.6}
.gateitem .fa{font-family:var(--mono);font-size:var(--t-xs);color:var(--danger);
  margin-top:8px;display:none;padding:9px 12px;background:var(--danger-soft);
  border:1px solid var(--danger-bd);border-radius:4px;font-weight:700;
  letter-spacing:.01em;line-height:1.6}
.gateitem .fa::before{content:"✕ "}
.gateitem.failed{border-color:var(--danger-bd);border-left:4px solid var(--danger);
  background:var(--danger-soft);animation:shake .28s ease}
.gateitem.failed .fa{display:block}

/* ---------- 11. 슬라이더(시장온도 항목) ---------- */
.sl{margin:0 0 4px;border:0;border-bottom:1px solid var(--line);padding:12px 2px 14px}
.sl:last-of-type{border-bottom:0}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sl .nm{font-size:var(--t-md);font-weight:700}
.sl .val{font-family:var(--mono);font-size:var(--t-lg);font-weight:800;
  color:var(--ma);min-width:2em;text-align:center;
  background:var(--ma-soft);border:1px solid var(--ma-bd);border-radius:4px;
  padding:1px 8px;font-variant-numeric:tabular-nums;transition:background .15s}
.sl .ends{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:var(--t-2xs);color:var(--ink-faint);margin-top:2px;letter-spacing:.02em}
.sl .ends span:first-child{color:var(--info)}
.sl .ends span:last-child{color:var(--danger)}
input[type=checkbox]{accent-color:var(--ma);width:16px;height:16px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ma);margin:8px 0 3px;height:24px;
  cursor:pointer}
input[type=range]::-webkit-slider-thumb{cursor:grab}
input[type=range]:active::-webkit-slider-thumb{cursor:grabbing}

/* ---------- 12. 리더 — reading room (터미널화 금지 구역) ---------- */
.reader{display:grid;grid-template-columns:248px 1fr;gap:var(--space-4)}
@media(max-width:760px){.reader{grid-template-columns:1fr}}
.toc{position:sticky;top:calc(var(--topbar-h) + var(--tabs-h) + 14px);
  align-self:start;
  max-height:calc(100vh - var(--topbar-h) - var(--tabs-h) - 30px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--radius-md);padding:8px;scrollbar-width:thin}
@media(max-width:760px){.toc{position:static;max-height:188px}}
.toc a{display:block;padding:7px 10px;border-radius:4px;color:var(--ink-muted);
  text-decoration:none;font-size:var(--t-xs);line-height:1.55;
  border-left:2px solid transparent;
  transition:background .15s,color .15s,border-color .15s}
.toc a:hover{background:var(--surface-subtle);color:var(--ink);
  border-left-color:var(--ma-bd);text-decoration:none}
.toc a.on{background:var(--ma-soft);color:var(--ma-2);font-weight:700;
  border-left-color:var(--ma)}
.bookchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;
  scrollbar-width:none}
.bookchips::-webkit-scrollbar{display:none}
.bookchips button{flex:0 0 auto}
.bookchips button.on{border-color:var(--ma);color:var(--ma);
  background:var(--ma-soft);font-weight:800}
/* 본문 — 장문 가독 우선: sans, 1rem, 행간 1.9, 폭 820px 제한 */
.doc{max-width:820px;background:var(--surface-elevated);
  border:1px solid var(--line-strong);border-radius:var(--radius-lg);
  padding:var(--space-6) var(--space-6) var(--space-7);box-shadow:var(--shadow-sm);
  font-size:1rem;line-height:1.9;overflow-wrap:break-word}
.doc h1{font-size:1.45rem;font-weight:800;margin:0 0 6px;line-height:1.45;
  letter-spacing:-.01em;color:var(--ink-strong);
  padding-left:12px;border-left:4px solid var(--ma)}
.doc .meta{font-family:var(--mono);color:var(--ink-faint);font-size:var(--t-2xs);
  letter-spacing:.04em;margin-bottom:var(--space-5);
  padding-bottom:var(--space-3);border-bottom:1px solid var(--ma-bd)}
.doc h4{margin:24px 0 8px;font-size:var(--t-lg);font-weight:800;
  color:var(--ma-2);padding-left:10px;border-left:3px solid var(--ma)}
.doc p{margin:10px 0;text-wrap:pretty}
.doc ul,.doc ol{padding-left:1.35em;margin:10px 0}
.doc li{margin:5px 0}
.doc li::marker{color:var(--ma)}
.doc blockquote{border-left:3px solid var(--ma);margin:14px 0;padding:9px 16px;
  color:var(--ink-muted);background:var(--ma-soft);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.doc details{border:1px solid var(--line-strong);border-radius:var(--radius-md);
  margin:10px 0;background:var(--surface-subtle);transition:border-color .15s}
.doc details:hover{border-color:var(--ma-bd)}
.doc details>summary{cursor:pointer;padding:11px 14px;font-weight:700;
  font-size:var(--t-md);list-style:none;line-height:1.55;transition:color .15s}
.doc details>summary::-webkit-details-marker{display:none}
.doc details>summary::before{content:"▸ ";color:var(--ma)}
.doc details[open]>summary::before{content:"▾ "}
.doc details[open]>summary{border-bottom:1px dashed var(--line-strong);
  color:var(--ma-2)}
.doc details>*:not(summary){margin-left:14px;margin-right:14px}
.doc details>div.tw{margin-left:14px;margin-right:14px}
mark,.doc mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;
  padding:0 3px;box-shadow:var(--mark-glow)}
.tw{overflow-x:auto;margin:12px 0}
.tw table{border-collapse:collapse;font-size:var(--t-sm);min-width:100%;
  line-height:1.65}
.tw th,.tw td{border:1px solid var(--line);padding:8px 11px;text-align:left;
  vertical-align:top}
.tw th{font-family:var(--mono);background:var(--surface-head);white-space:nowrap;
  font-size:var(--t-2xs);color:var(--ma-2);font-weight:700;letter-spacing:.04em}
.tw tr:hover td{background:var(--surface-subtle)}
.pn{display:flex;justify-content:space-between;margin-top:var(--space-4);gap:8px}

/* ---------- 13. 검색 — search console ---------- */
.hit{position:relative;border:1px solid var(--line-strong);
  border-radius:var(--radius-md);padding:13px 38px 13px 15px;margin:0 0 9px;
  background:var(--surface);cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .15s}
.hit:hover{border-color:var(--ma);box-shadow:var(--ma-glow),var(--lift);
  transform:translateY(-2px)}
.hit::after{content:"›";position:absolute;right:15px;top:50%;
  transform:translateY(-54%);color:var(--ink-faint);font-size:1.2rem;
  font-family:var(--mono);transition:color .15s,transform .15s}
.hit:hover::after{color:var(--ma);transform:translateY(-54%) translateX(3px)}
.hit .where{font-family:var(--mono);font-size:var(--t-2xs);color:var(--ma);
  font-weight:700;letter-spacing:.03em}
.hit .snip{font-size:var(--t-sm);color:var(--ink-muted);margin-top:5px;
  line-height:1.7}
.hit .snip mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;
  box-shadow:var(--mark-glow)}

/* ---------- 14. 리스트(일지·보유 큐) ---------- */
.li{border:1px solid var(--line-strong);border-radius:var(--radius-md);
  padding:13px 15px;margin:0 0 9px;background:var(--surface);
  transition:border-color .15s,box-shadow .15s,transform .15s}
.li .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
  flex-wrap:wrap}
.li .nm{font-weight:700;font-size:var(--t-md)}
.li .sub{font-size:var(--t-xs);color:var(--ink-muted);margin-top:4px;
  line-height:1.7}
.li[data-open]{cursor:pointer}
.li[data-open]:hover{border-color:var(--ma);
  box-shadow:var(--ma-glow),var(--lift);transform:translateY(-2px)}

/* 일지 타임라인 — 운영 로그. 노드색 = 발생 모듈색 */
#jList{position:relative;padding-left:20px}
#jList::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;
  border-radius:2px;
  background:linear-gradient(180deg,var(--ma-bd),var(--line-strong) 30%,
    var(--line-strong) 70%,transparent)}
#jList .li{position:relative}
#jList .li::before{content:"";position:absolute;left:-19.5px;top:18px;width:10px;
  height:10px;border-radius:50%;background:var(--ink-faint);
  border:2px solid var(--bg)}
#jList .tl--buy::before{background:#FF8A4C;box-shadow:0 0 8px rgba(255,138,76,.6)}
#jList .tl--sell::before{background:#FF7BAC;box-shadow:0 0 8px rgba(255,123,172,.6)}
#jList .tl--review::before{background:#3DDC97;box-shadow:0 0 8px rgba(61,220,151,.6)}
#jList .tl--temp::before{background:#FF6E5E;box-shadow:0 0 8px rgba(255,110,94,.6)}
#jList .tl--mistake::before{background:var(--danger);
  box-shadow:0 0 9px rgba(255,92,92,.7)}
#jList .tl--mistake{border-left:3px solid var(--danger-bd)}
html[data-theme="light"] #jList .li::before{box-shadow:none}
html[data-theme="light"] #jList .tl--buy::before{background:#C2510E}
html[data-theme="light"] #jList .tl--sell::before{background:#C23D72}
html[data-theme="light"] #jList .tl--review::before{background:#0E8A55}
html[data-theme="light"] #jList .tl--temp::before{background:#C24437}

/* ---------- 15. 알림 = callout (상태 글리프 포함) ---------- */
.alert{border-radius:var(--radius-sm);padding:12px 15px;font-size:var(--t-sm);
  margin:0 0 var(--space-3);border:1px solid;border-left-width:4px;
  line-height:1.65}
.alert::before{font-family:var(--mono);font-weight:800;margin-right:7px}
.alert a{font-weight:700}
.alert.bad{background:var(--danger-soft);border-color:var(--danger-bd);
  border-left-color:var(--danger);color:var(--danger)}
.alert.bad::before{content:"✕"}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-bd);
  border-left-color:var(--warn);color:var(--warn)}
.alert.warn::before{content:"▲"}
.alert.ok{background:var(--ok-soft);border-color:var(--ok-bd);
  border-left-color:var(--ok);color:var(--ok)}
.alert.ok::before{content:"✓"}
.alert.acc{background:var(--info-soft);border-color:var(--info-bd);
  border-left-color:var(--info);color:var(--info)}
.alert.acc::before{content:"›"}
html[data-theme="light"] .alert.bad{color:#9c2424}
html[data-theme="light"] .alert.warn{color:#6e5300}
html[data-theme="light"] .alert.ok{color:#0a6238}
html[data-theme="light"] .alert.acc{color:#095e74}

/* ---------- 16. 진행 단계(매수 위저드) = procedure tracker ---------- */
.steps{display:flex;gap:5px;margin:0 0 var(--space-4);flex-wrap:wrap;
  counter-reset:step}
.steps span{font-family:var(--mono);font-size:var(--t-2xs);padding:5px 10px;
  border-radius:var(--radius-sm);background:var(--surface-subtle);
  border:1px solid var(--line-strong);color:var(--ink-faint);
  counter-increment:step;line-height:1.5;white-space:nowrap;letter-spacing:.02em;
  transition:background .2s,color .2s,border-color .2s,box-shadow .2s}
.steps span::before{content:counter(step,decimal-leading-zero) " ";
  color:inherit;font-variant-numeric:tabular-nums}
.steps span.on{background:var(--ma);border-color:var(--ma);
  color:var(--ma-contrast);font-weight:800;box-shadow:var(--ma-glow)}
.steps span.done{border-color:var(--ok-bd);color:var(--ok);background:var(--ok-soft)}
.steps span.done::before{content:"✓ "}

/* ---------- 17. 대시보드(홈) = 상태판 ---------- */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:var(--space-4)}
.dash .d{background:var(--surface);border:1px solid var(--line-strong);
  border-top:3px solid var(--line-strong);border-radius:var(--radius-md);
  padding:13px 15px;box-shadow:var(--shadow-sm);
  transition:transform .15s,box-shadow .15s,border-color .15s}
.dash .d:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.dash .d .k{font-family:var(--mono);font-size:var(--t-2xs);
  color:var(--ink-faint);letter-spacing:.08em;font-weight:600}
.dash .d .v{font-family:var(--mono);font-size:var(--t-xl);font-weight:800;
  margin-top:6px;line-height:1.35;color:var(--ink-strong);
  font-variant-numeric:tabular-nums}
.dash .d .v a{text-decoration:none;border-bottom:1px dashed currentColor;
  color:inherit}
.dash .d .v.bad{color:var(--danger)} .dash .d .v.ok{color:var(--ok)}
.dash .d .v.warn{color:var(--warn)}
html[data-theme="light"] .dash .d .v.warn{color:#8F6C00}
/* 상태 LED — 판정은 JS, 표시는 CSS */
.dash .d .v.ok::before,.dash .d .v.warn::before,.dash .d .v.bad::before{
  content:"";display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:8px;vertical-align:2px;background:currentColor}
.dash .d .v.ok::before{box-shadow:0 0 8px var(--ok-bd)}
.dash .d .v.warn::before{box-shadow:0 0 8px var(--warn-bd)}
.dash .d .v.bad::before{box-shadow:0 0 9px var(--danger-bd);
  animation:ledpulse 1.25s ease-in-out infinite}
/* 상태판 상단 컬러 바 — 판정 로직 불변, 표시만 CSS */
.dash .d:has(.v.ok){border-top-color:var(--ok)}
.dash .d:has(.v.warn){border-top-color:var(--warn)}
.dash .d:has(.v.bad){border-color:var(--danger-bd);
  border-top-color:var(--danger);background:var(--danger-soft)}
/* 오늘의 운영 — 운영 큐 */
.todoq{margin:6px 0 2px;padding:0;list-style:none}
.todoq li{position:relative;padding:10px 6px 10px 26px;
  border-bottom:1px dashed var(--line);font-size:var(--t-md);line-height:1.65;
  border-radius:4px;transition:background .15s}
.todoq li:hover{background:var(--ma-soft)}
.todoq li:last-child{border-bottom:0}
.todoq li::before{content:"";position:absolute;left:6px;top:17px;width:9px;
  height:9px;border-radius:2px;border:2px solid var(--ma);background:transparent;
  transition:background .15s}
.todoq li:hover::before{background:var(--ma-soft)}
.todoq li.mut::before{border-color:var(--ok);background:var(--ok-soft)}
.todoq li a{font-weight:700;color:var(--info);text-decoration:none;
  border-bottom:1px solid var(--info-bd)}
.todoq li a:hover{border-bottom-color:var(--info);text-decoration:none}
/* 합의 원칙 접기 */
.prin{border:1px solid var(--line-strong);border-radius:var(--radius-md);
  margin:6px 0;background:var(--surface-subtle);transition:border-color .15s}
.prin:hover{border-color:var(--ma-bd)}
.prin>summary{cursor:pointer;padding:10px 14px;font-size:var(--t-md);
  list-style:none;line-height:1.6;transition:color .15s}
.prin>summary::-webkit-details-marker{display:none}
.prin>summary::before{content:"▸ ";color:var(--ma);font-family:var(--mono)}
.prin[open]>summary::before{content:"▾ "}
.prin>summary b{color:var(--ma-2)}
.prin[open]{background:var(--surface);border-color:var(--ma-bd)}
.prin>div{padding:0 14px 12px;color:var(--ink-muted);font-size:var(--t-sm);
  line-height:1.7}

/* ---------- 18. 온도 게이지 — risk posture, 예측 차트 아님 ---------- */
.gauge{height:15px;border-radius:var(--radius-sm);position:relative;
  margin:16px 0 7px;border:1px solid var(--line-strong);
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),
      rgba(0,0,0,.4) calc(20% - 1px) 20%),
    linear-gradient(90deg,
      #45D6F4 0%,#3DDC97 26%,#FFD23F 50%,#FF8A4C 72%,#FF5C5C 100%);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
html[data-theme="light"] .gauge{box-shadow:inset 0 1px 2px rgba(20,26,36,.25)}
.gauge .pin{position:absolute;top:-7px;width:3px;height:29px;
  background:var(--ink-strong);border-radius:2px;transform:translateX(-50%);
  box-shadow:0 0 0 2px var(--surface),0 0 9px rgba(243,246,251,.7);
  transition:left .35s cubic-bezier(.3,.7,.3,1)}
html[data-theme="light"] .gauge .pin{box-shadow:0 0 0 2px var(--surface)}
.gauge ~ .glab{display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:var(--t-2xs);color:var(--ink-faint);
  letter-spacing:.03em;font-weight:600}
.gauge ~ .glab span:first-child{color:var(--info)}
.gauge ~ .glab span:last-child{color:var(--danger)}

/* ---------- 19. 데이터 — 생존 장치 ---------- */
.card--vault{border-left:4px solid var(--ma)}
.card--dangerzone{position:relative;overflow:hidden;
  border-color:var(--danger-bd);
  background:linear-gradient(0deg,var(--danger-soft),transparent 65%)}
.card--dangerzone::after{content:"";position:absolute;left:0;right:0;top:0;
  height:6px;background:repeating-linear-gradient(135deg,
    var(--danger) 0 10px,transparent 10px 20px);opacity:.9;pointer-events:none}
.card--dangerzone h2,
.card--dangerzone>h2:first-child{color:var(--danger);
  border-bottom-color:var(--danger-bd);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--danger) 10%,var(--surface-head)),
    var(--surface-head))}
.card--dangerzone>h2:first-child::before{background:var(--danger);
  box-shadow:0 0 9px var(--danger);animation:ledpulse 1.4s ease-in-out infinite}
/* 디시전 티켓 절취선 (매수 판정 — 실행 구역 분리) */
hr.tk-perf{border:0;border-top:2px dashed var(--ma-bd);position:relative;
  margin:18px calc(-1 * var(--card-px));overflow:visible}
hr.tk-perf::before,hr.tk-perf::after{content:"";position:absolute;top:-8px;
  width:14px;height:14px;border-radius:50%;background:var(--bg);
  border:1px solid var(--line-strong)}
hr.tk-perf::before{left:-7px} hr.tk-perf::after{right:-7px}

/* ---------- 20. 인쇄 (기존 리포트 계약 유지) ---------- */
#print-area{display:none}
@media print{
  body{background:#fff;color:#000;background-image:none}
  #topbar,#tabs,#main,#foot{display:none!important}
  #print-area{display:block;font-size:12px;line-height:1.55;padding:0 6px}
  #print-area h1{font-size:18px;margin:0 0 2px}
  #print-area .stamp{transform:none;border-width:2px;background:none;
    box-shadow:none;animation:none}
  #print-area table{border-collapse:collapse;width:100%;font-size:11px}
  #print-area th,#print-area td{border:1px solid #999;padding:4px 6px;
    text-align:left}
  #print-area .sec{margin:10px 0 4px;font-weight:700;
    border-bottom:1px solid #000;font-size:12.5px}
  #print-area .ftr{margin-top:14px;font-size:9.5px;color:#444;
    border-top:1px solid #aaa;padding-top:6px}
}


/* ============================================================
   V3 Typography & Reader Data Layer — UI only
   목표: 더 심플한 고딕, 헤드/본문 위계 강화, 표 가독성 개선,
   색상/아이콘 기반 구분. DATA/판정/localStorage 로직 불변.
   ============================================================ */
:root{
  --font-sans:"SUIT Variable","SUIT","Pretendard Variable","Pretendard","Wanted Sans Variable","Wanted Sans","LINE Seed Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:"SUIT Variable","SUIT","Pretendard Variable","Pretendard","Wanted Sans Variable","Wanted Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-reader:"Pretendard Variable","Pretendard","SUIT Variable","SUIT","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --sans:var(--font-sans);
  --reader:var(--font-reader);
  --radius-md:10px;
  --radius-lg:14px;
}
body{
  font-family:var(--font-sans);
  font-weight:430;
  letter-spacing:-.012em;
  font-kerning:normal;
  font-optical-sizing:auto;
}
#main{max-width:960px}
#main:has(.reader){max-width:min(1180px, calc(100vw - 22px));}
#main:has(.reader) .reader{grid-template-columns:270px minmax(0,1fr);gap:20px}
@media(max-width:900px){
  #main:has(.reader){max-width:min(100%, calc(100vw - 14px));}
  #main:has(.reader) .reader{grid-template-columns:1fr;}
}

/* 앱 헤더/카드: mono 과다 사용을 줄이고, 고딕 display로 정돈 */
#topbar .brand{font-family:var(--font-display);font-weight:850;letter-spacing:-.02em;font-size:1.02rem;}
#topbar .brand small{font-family:var(--mono);letter-spacing:.02em;}
#tabs a{font-family:var(--font-display);font-weight:760;letter-spacing:-.015em;font-size:.9rem;}
.card{border-radius:var(--radius-lg);box-shadow:0 10px 30px rgba(0,0,0,.18);}
.card h2{font-family:var(--font-display);font-weight:850;letter-spacing:-.025em;font-size:1.14rem;}
.card>h2:first-child{padding:14px 18px;background:linear-gradient(90deg,color-mix(in srgb,var(--ma) 14%,var(--surface-head)),var(--surface-head) 68%);}
.card>h2:first-child::before{border-radius:999px;width:10px;height:10px;}
.card h2 .xs{font-family:var(--mono);letter-spacing:.02em;}
.card h3{font-family:var(--font-display);font-size:1rem;letter-spacing:-.02em;}

/* Reader: 본문은 고딕 서체를 더 명료하게, 헤드는 섹션 카드처럼 */
.doc{
  max-width:880px;
  width:100%;
  font-family:var(--reader);
  font-size:1.045rem;
  line-height:1.88;
  letter-spacing:-.018em;
  font-weight:430;
  color:color-mix(in srgb,var(--ink) 92%,var(--ink-strong));
  padding:30px clamp(18px,3.2vw,38px) 42px;
  border-radius:18px;
  border-color:color-mix(in srgb,var(--line-strong) 80%,var(--ma-bd));
}
.doc h1{
  font-family:var(--font-display);
  font-size:clamp(1.45rem,2.6vw,2.05rem);
  font-weight:900;
  line-height:1.32;
  letter-spacing:-.04em;
  padding:0 0 14px 0;
  border-left:0;
  border-bottom:2px solid var(--ma-bd);
  color:var(--ink-strong);
}
.doc h1::before{content:"📘";font-size:.82em;margin-right:.38em;vertical-align:.04em;}
.doc .meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 0 18px;margin-bottom:24px;
  border-bottom:1px dashed var(--line-strong);
  font-size:.78rem;
}
.doc p{margin:13px 0;}
.doc strong,.doc b{font-weight:850;color:var(--ink-strong);background:linear-gradient(transparent 60%, var(--ma-soft) 0);padding:0 2px;border-radius:2px;}
.doc code{font-size:.86em;border-color:var(--ma-bd);background:var(--ma-soft);color:var(--ma-2);}
.doc ul,.doc ol{padding-left:1.25em;margin:12px 0 16px;}
.doc li{margin:7px 0;padding-left:.12em;}
.doc li::marker{color:var(--ma);font-weight:900;}
.doc blockquote{
  margin:18px 0;padding:13px 18px 13px 20px;
  border-left:5px solid var(--ma);
  background:linear-gradient(90deg,var(--ma-soft),transparent 85%);
  color:color-mix(in srgb,var(--ink) 88%,var(--ma-2));
  border-radius:0 12px 12px 0;
}

/* makeCollapsibles 이후 summary가 실제 섹션 헤드가 된다 */
.doc details{
  border-radius:16px;
  border:1px solid color-mix(in srgb,var(--line-strong) 78%,var(--ma-bd));
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface-subtle) 88%,var(--ma-soft)),var(--surface-subtle));
  overflow:hidden;
  margin:14px 0;
}
.doc details:hover{border-color:var(--ma-bd);box-shadow:0 8px 22px rgba(0,0,0,.14);}
.doc details>summary{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  font-family:var(--font-display);
  font-size:1.04rem;
  font-weight:880;
  letter-spacing:-.03em;
  color:var(--ink-strong);
  background:linear-gradient(90deg,color-mix(in srgb,var(--ma) 13%,var(--surface-head)),var(--surface-head));
}
.doc details>summary::before{
  content:"§";
  display:inline-grid;place-items:center;
  width:30px;height:30px;
  border-radius:10px;
  background:var(--ma-soft);
  border:1px solid var(--ma-bd);
  color:var(--ma-2);
  font-family:var(--font-sans);
  font-size:1rem;
}
.doc details>summary[data-icon]::before{content:attr(data-icon);}
.doc details>summary::after{
  content:"펼치기";
  justify-self:end;
  font-family:var(--mono);
  font-size:.68rem;
  letter-spacing:.02em;
  color:var(--ink-faint);
  border:1px solid var(--line-strong);
  border-radius:999px;
  padding:3px 8px;
  background:var(--surface-subtle);
}
.doc details[open]>summary{color:var(--ma-2);border-bottom:1px solid var(--ma-bd);}
.doc details[open]>summary::after{content:"접기";color:var(--ma);border-color:var(--ma-bd);background:var(--ma-soft);}
.doc details>*:not(summary){margin-left:clamp(14px,2.5vw,24px);margin-right:clamp(14px,2.5vw,24px);}
.doc details>p:first-of-type{margin-top:18px;}

/* Reader table: 작은 표를 정보 카드/데이터 그리드처럼 보이게 */
.doc .tw{
  position:relative;
  margin:20px 0 24px;
  padding:0;
  border:1px solid color-mix(in srgb,var(--line-strong) 72%,var(--ma-bd));
  border-radius:16px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 86%,var(--ma-soft)),var(--surface));
  overflow:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 10px 24px rgba(0,0,0,.12);
}
.doc .tw .table-tools{
  position:sticky;left:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 13px;
  border-bottom:1px solid var(--line-strong);
  background:linear-gradient(90deg,color-mix(in srgb,var(--ma) 13%,var(--surface-head)),var(--surface-head));
  font-family:var(--mono);
  font-size:.72rem;
  color:var(--ink-muted);
  min-width:100%;
}
.doc .tw .table-title{display:flex;align-items:center;gap:7px;color:var(--ma-2);font-weight:800;letter-spacing:.02em;}
.doc .tw .table-hint{color:var(--ink-faint);font-size:.68rem;white-space:nowrap;}
.doc .tw table{
  border-collapse:separate;
  border-spacing:0;
  min-width:860px;
  width:max-content;
  max-width:none;
  font-size:.94rem;
  line-height:1.68;
}
.doc .tw:not(.tw--wide) table{width:100%;min-width:100%;}
.doc .tw th,.doc .tw td{
  border:0;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:11px 14px;
  vertical-align:top;
}
.doc .tw th:last-child,.doc .tw td:last-child{border-right:0;}
.doc .tw tr:last-child td{border-bottom:0;}
.doc .tw th{
  position:sticky;top:0;z-index:2;
  font-family:var(--font-display);
  font-size:.78rem;
  font-weight:850;
  letter-spacing:-.01em;
  color:var(--ma-2);
  background:color-mix(in srgb,var(--surface-head) 82%,var(--ma-soft));
  white-space:nowrap;
}
.doc .tw td{color:var(--ink);background:transparent;min-width:132px;}
.doc .tw tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-subtle) 68%,transparent);}
.doc .tw tbody tr:hover td{background:var(--ma-soft);}
.doc .tw th:first-child,.doc .tw td:first-child{
  position:sticky;left:0;z-index:1;
  min-width:154px;
  max-width:230px;
  font-weight:800;
  color:var(--ink-strong);
  background:color-mix(in srgb,var(--surface-head) 78%,var(--ma-soft));
}
.doc .tw th:first-child{z-index:4;color:var(--ma-2);}
.doc .tw td code{white-space:normal;}

/* 모바일/좁은 화면: wide table을 카드형 레코드로 전환 */
@media(max-width:820px){
  .doc{font-size:1rem;line-height:1.82;padding:22px 16px 34px;border-radius:14px;}
  .doc h1{font-size:1.48rem;}
  .doc details>summary{grid-template-columns:auto 1fr;}
  .doc details>summary::after{display:none;}
  .doc .tw.tw--wide{overflow:visible;padding:0 0 10px;border-radius:16px;}
  .doc .tw.tw--wide .table-tools{position:static;border-radius:16px 16px 0 0;}
  .doc .tw.tw--wide .table-hint{display:none;}
  .doc .tw.tw--wide table,
  .doc .tw.tw--wide thead,
  .doc .tw.tw--wide tbody,
  .doc .tw.tw--wide tr,
  .doc .tw.tw--wide th,
  .doc .tw.tw--wide td{display:block;width:100%;min-width:0;max-width:none;position:static;}
  .doc .tw.tw--wide thead{display:none;}
  .doc .tw.tw--wide tbody{padding:10px;}
  .doc .tw.tw--wide tr{
    border:1px solid color-mix(in srgb,var(--line-strong) 72%,var(--ma-bd));
    border-left:5px solid var(--ma);
    border-radius:14px;
    background:var(--surface);
    margin:0 0 12px;
    overflow:hidden;
    box-shadow:0 8px 18px rgba(0,0,0,.12);
  }
  .doc .tw.tw--wide td{
    display:grid;
    grid-template-columns:minmax(92px,34%) minmax(0,1fr);
    gap:10px;
    border:0;
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    background:transparent!important;
    font-size:.95rem;
  }
  .doc .tw.tw--wide td:last-child{border-bottom:0;}
  .doc .tw.tw--wide td::before{
    content:attr(data-label);
    font-family:var(--mono);
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.01em;
    color:var(--ma-2);
    line-height:1.5;
  }
  .doc .tw.tw--wide td:first-child{
    display:block;
    padding:12px 13px;
    background:linear-gradient(90deg,var(--ma-soft),transparent)!important;
    color:var(--ink-strong);
    font-size:1.02rem;
  }
  .doc .tw.tw--wide td:first-child::before{display:block;margin-bottom:4px;color:var(--ma);}
}

/* 검색 결과도 문서 앱처럼 조금 더 가볍게 */
.hit .where{font-family:var(--mono);font-size:.74rem;}
.hit .snip{font-size:.92rem;line-height:1.75;color:color-mix(in srgb,var(--ink-muted) 88%,var(--ink));}
.alert::before{font-family:var(--font-sans);}

</style>
</head>
