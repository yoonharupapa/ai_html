번역한 사례에 가깝다."},{"i":3,"title":"2. 이성적 과열: 주주의 수익은 기업의 수익과 일치해야 한다","html":"<ul>\n<li>시간이 흐르면 주주가 벌어들이는 수익의 총합은 필연적으로 기업이 벌어들이는 영업 수익과 일치하게 된다.<\/li>\n<li>주식시장 수익이 기업의 펀더멘털을 앞설 때가 종종 있지만 평균으로 회귀하는 경우가 대부분이다.<\/li>\n<li>연간 주식수익이 들쑥날쑥한 이유는 투자 경제학적 측면이 아닌 투자 심리 때문이며 주가수익률은 이러한 심리가 반영된 결과물이다.<\/li>\n<li>귀납적 추론 방식에 따라 과거 경험을 바탕으로 미래를 예측하는 것은 매우 위험하다.<\/li>\n<li>케인스는 장기적 관점에서의 주가 전망은 기업 가치와 투기 상황에 대한 예측에 바탕을 둔다고 설명했다.<\/li>\n<li>결과적으로 보면 총투자수익은 연간 8~13% 수준을 유지했으며 평균 투자수익률은 9%를 기록했다.<\/li>\n<li>평균 이하의 수익이 난 시기 다음에는 수익이 회복되는 시기가 뒤따랐고 반대의 경우에는 다시 수익이 평균을 밑도는 시기가 이어졌다.<\/li>\n<li>투자수익과 투기수익이 결합해 총시장수익을 만들어낸다.<\/li>\n<li>장기적 주식 수익을 좌우하는 것은 투자 심리가 아니라 투자 경제학적 여건이다.<\/li>\n<li>단기적 투자 심리 변화 예측은 불가능하지만 장기적 차원에서 투자 경제학적 여건에 대한 예측은 어느 정도 가능하다.<\/li>\n<li>실제 수익과 배당을 지급하는 실제 시장과 투자자의 기대감이 반영된 기대 시장이 있다.<\/li>\n<li>성공투자 전략은 기대 시장에서 벗어나 실제 시장에 베팅하는 것이라 할 수 있다.<\/li>\n<li>주식시장은 단기적 관점에서는 투표 집계기이고 장기적 관점에서 보면 저울이다. (벤저민 그레이엄)<\/li>\n<li>진정한 투자자는 주식시장에는 아예 신경을 쓰지 않고 배당수익과 기업의 경영 성과에만 관심을 둘 것이다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 투자수익 vs 투기수익<\/td>\n<td style=\"text-align: right;\">배당수익률 + 이익성장률 + PER변화<\/td>\n<td>장기<\/td>\n<td>보글의 대표 분해식<\/td>\n<td>장기수익은 기업현실과 시장기분의 합<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[2017 개정판 데이터][간접복원] 장기 미국 주식 명목수익<\/td>\n<td style=\"text-align: right;\">연 9%대 중후반 수준 <code>[간접복원]<\/code><\/td>\n<td>1900~2016 또는 1926~2016 계열<\/td>\n<td>투자수익(배당+이익성장) + 투기수익(PER변화)<\/td>\n<td>장기 성과의 대부분은 기업현실에서 발생한다는 보글 논지<\/td>\n<td>2017 개정판·장기시장 데이터 2차 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>S&amp;P 500 배당수익률<\/td>\n<td style=\"text-align: right;\">과거보다 높았음<\/td>\n<td style=\"text-align: right;\">2024년 1.18%, 2026년 약 1.1%<\/td>\n<td>낮아짐<\/td>\n<td>현대 미국 주식은 배당보다 자사주매입 비중이 커짐<\/td>\n<td>S&amp;P/FactSet/Investopedia 계열 인용<\/td>\n<\/tr>\n<tr>\n<td>2024 총주주환원수익률<\/td>\n<td style=\"text-align: right;\">배당 중심 시대와 다름<\/td>\n<td style=\"text-align: right;\">배당 1.3% + 자사주매입 1.9% = 3.2%<\/td>\n<td>구성 변경<\/td>\n<td>오늘의 “투자수익”은 배당만이 아니라 배당+매입으로 해석해야 더 정확<\/td>\n<td>S&amp;P buyback/dividend data 인용<\/td>\n<\/tr>\n<tr>\n<td>최근 10년 S&amp;P 수익 중 배당 기여<\/td>\n<td style=\"text-align: right;\">과거 세기 대비 축소<\/td>\n<td style=\"text-align: right;\">2013~2024 배당 기여 약 16%<\/td>\n<td>배당 기여 감소<\/td>\n<td>배당 재투자 중요성은 여전하지만, 미국 시장의 수익 구조는 변했다<\/td>\n<td>S&amp;P 장기수익 분해 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글의 분해식은 지금도 유효하다. 다만 2026년 미국 시장에선 배당수익률이 크게 낮아졌고, 기업은 더 많은 현금을 자사주매입으로 돌린다. 따라서 오늘 분해는 <strong>배당 중심에서 총주주환원 중심<\/strong>으로 보완할 필요가 있다.<\/li>\n<li>그래도 핵심은 같다. 장기 수익의 기반은 기업의 이익창출력이고, PER 변화는 결국 변덕이 크다. 그래서 시장 전체를 사는 전략이, 개별 기업 가치판단에서 반복적으로 실수하는 것보다 유리할 수 있다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>가치투자자는 시장가격이 장기간 내재가치에서 이탈할 수 있으므로, 전체를 사는 것보다 싸게 사는 것이 더 낫다고 주장할 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 반박은 맞는 말이지만, 평균 투자자가 그 이탈을 지속적으로 이용하기 어렵다는 것이다.<\/li>\n<li>또한 장기적으로는 밸류에이션 변화가 큰 잡음을 만들기 때문에, 기업 전체를 보유하는 편이 실수 확률을 줄인다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자도 미국 주식 기대수익을 볼 때 배당률만 보면 안 된다. 미국은 배당보다 자사주매입 비중이 훨씬 커졌다.<\/li>\n<li>반대로 한국 생활비 기준 현금흐름이 중요하면, 총수익과 현금수익의 차이를 별도로 봐야 한다.<\/li>\n<\/ul>","text":"시간이 흐르면 주주가 벌어들이는 수익의 총합은 필연적으로 기업이 벌어들이는 영업 수익과 일치하게 된다. 주식시장 수익이 기업의 펀더멘털을 앞설 때가 종종 있지만 평균으로 회귀하는 경우가 대부분이다. 연간 주식수익이 들쑥날쑥한 이유는 투자 경제학적 측면이 아닌 투자 심리 때문이며 주가수익률은 이러한 심리가 반영된 결과물이다. 귀납적 추론 방식에 따라 과거 경험을 바탕으로 미래를 예측하는 것은 매우 위험하다. 케인스는 장기적 관점에서의 주가 전망은 기업 가치와 투기 상황에 대한 예측에 바탕을 둔다고 설명했다. 결과적으로 보면 총투자수익은 연간 8~13% 수준을 유지했으며 평균 투자수익률은 9%를 기록했다. 평균 이하의 수익이 난 시기 다음에는 수익이 회복되는 시기가 뒤따랐고 반대의 경우에는 다시 수익이 평균을 밑도는 시기가 이어졌다. 투자수익과 투기수익이 결합해 총시장수익을 만들어낸다. 장기적 주식 수익을 좌우하는 것은 투자 심리가 아니라 투자 경제학적 여건이다. 단기적 투자 심리 변화 예측은 불가능하지만 장기적 차원에서 투자 경제학적 여건에 대한 예측은 어느 정도 가능하다. 실제 수익과 배당을 지급하는 실제 시장과 투자자의 기대감이 반영된 기대 시장이 있다. 성공투자 전략은 기대 시장에서 벗어나 실제 시장에 베팅하는 것이라 할 수 있다. 주식시장은 단기적 관점에서는 투표 집계기이고 장기적 관점에서 보면 저울이다. (벤저민 그레이엄) 진정한 투자자는 주식시장에는 아예 신경을 쓰지 않고 배당수익과 기업의 경영 성과에만 관심을 둘 것이다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 투자수익 vs 투기수익 배당수익률 + 이익성장률 + PER변화 장기 보글의 대표 분해식 장기수익은 기업현실과 시장기분의 합 원본 노트 기준선 [2017 개정판 데이터][간접복원] 장기 미국 주식 명목수익 연 9%대 중후반 수준 [간접복원] 1900~2016 또는 1926~2016 계열 투자수익(배당+이익성장) + 투기수익(PER변화) 장기 성과의 대부분은 기업현실에서 발생한다는 보글 논지 2017 개정판·장기시장 데이터 2차 인용 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 S&amp;P 500 배당수익률 과거보다 높았음 2024년 1.18%, 2026년 약 1.1% 낮아짐 현대 미국 주식은 배당보다 자사주매입 비중이 커짐 S&amp;P/FactSet/Investopedia 계열 인용 2024 총주주환원수익률 배당 중심 시대와 다름 배당 1.3% + 자사주매입 1.9% = 3.2% 구성 변경 오늘의 “투자수익”은 배당만이 아니라 배당+매입으로 해석해야 더 정확 S&amp;P buyback/dividend data 인용 최근 10년 S&amp;P 수익 중 배당 기여 과거 세기 대비 축소 2013~2024 배당 기여 약 16% 배당 기여 감소 배당 재투자 중요성은 여전하지만, 미국 시장의 수익 구조는 변했다 S&amp;P 장기수익 분해 인용 [보강 | 논리 전개] 보글의 분해식은 지금도 유효하다. 다만 2026년 미국 시장에선 배당수익률이 크게 낮아졌고, 기업은 더 많은 현금을 자사주매입으로 돌린다. 따라서 오늘 분해는 배당 중심에서 총주주환원 중심 으로 보완할 필요가 있다. 그래도 핵심은 같다. 장기 수익의 기반은 기업의 이익창출력이고, PER 변화는 결국 변덕이 크다. 그래서 시장 전체를 사는 전략이, 개별 기업 가치판단에서 반복적으로 실수하는 것보다 유리할 수 있다. [반론] 가치투자자는 시장가격이 장기간 내재가치에서 이탈할 수 있으므로, 전체를 사는 것보다 싸게 사는 것이 더 낫다고 주장할 수 있다. [보글 측 재반론] 보글식 반박은 맞는 말이지만, 평균 투자자가 그 이탈을 지속적으로 이용하기 어렵다는 것이다. 또한 장기적으로는 밸류에이션 변화가 큰 잡음을 만들기 때문에, 기업 전체를 보유하는 편이 실수 확률을 줄인다. [한국 투자자 적용] 한국 투자자도 미국 주식 기대수익을 볼 때 배당률만 보면 안 된다. 미국은 배당보다 자사주매입 비중이 훨씬 커졌다. 반대로 한국 생활비 기준 현금흐름이 중요하면, 총수익과 현금수익의 차이를 별도로 봐야 한다."},{"i":4,"title":"3. 투자자와 기업은 공동운명체: 오컴의 면도날","html":"<ul>\n<li>어떤 문제에 대한 해결책이 여럿 있을 때는 그 가운데 가장 단순한 것을 선택하라.<\/li>\n<li>주식시장에서 벌어들인 수익은 전체 주식투자자 집단이 벌어들인 총수익과 같다.<\/li>\n<li>장기적으로 주식시장 전체를 보유하는 것은 이기는 게임이고, 무모하게 주식시장을 이기려 드는 것은 지는 게임이다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 마이너스섬 구조<\/td>\n<td style=\"text-align: right;\">액티브 총합 = 시장, 비용 반영 후 &lt; 시장<\/td>\n<td>구조 명제<\/td>\n<td>시장 총수익 - 중개비용 - 운용비용 - 세금<\/td>\n<td>시장을 이기려는 총합은 비용 차감 후 시장에 못 미침<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[버핏/외부 인용] 버핏-헤지펀드 내기<\/td>\n<td style=\"text-align: right;\">인덱스 126%, 헤지펀드 묶음 36%<\/td>\n<td>2008-01-01~2017-12-31<\/td>\n<td>누적수익률, 비용 차감 후 투자자 실현수익<\/td>\n<td>비용·구조 차이가 장기적으로 결과를 크게 벌림<\/td>\n<td>Buffett vs Protégé 공개 결과<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>U.S. 대형주 액티브 연간 부진<\/td>\n<td style=\"text-align: right;\">다수 액티브가 시장에 뒤짐<\/td>\n<td style=\"text-align: right;\">2025년에 79% 언더퍼폼<\/td>\n<td>최신 수치 악화<\/td>\n<td>보글의 “대다수 액티브는 비용 후 패배” 명제가 최신 데이터에서도 유지<\/td>\n<td>SPIVA U.S. Scorecard Year-End 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>U.S. 대형주 장기 성공 확률<\/td>\n<td style=\"text-align: right;\">낮음<\/td>\n<td style=\"text-align: right;\">10년 기준 약 14%, 15년 기준 약 10%만 벤치마크 상회<\/td>\n<td>장기일수록 더 희소<\/td>\n<td>시간은 액티브 다수에게 우호적이지 않음<\/td>\n<td>SPIVA U.S. Scorecard Year-End 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>Morningstar 장기 성공률<\/td>\n<td style=\"text-align: right;\">낮음<\/td>\n<td style=\"text-align: right;\">대형주 액티브의 10년 성공률 8%<\/td>\n<td>측정법 다름<\/td>\n<td>SPIVA와 다른 방법론에서도 결론 동일<\/td>\n<td>Morningstar Active/Passive Barometer 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>이 장의 논리는 산수다. 시장 전체를 구성하는 모든 투자자의 보유를 합치면 <strong>시장 자체<\/strong>가 된다. 따라서 액티브 총합의 총수익은 시장과 같고, 거기서 보수·매매비용·세금이 빠지면 액티브 투자자 총합은 시장보다 낮아진다.<\/li>\n<li>인덱스펀드는 천재 전략이 아니라 <strong>비용을 적게 내는 방식으로 시장 몫을 지키는 구조<\/strong>다. 그래서 “평균을 산다”는 표현이 실제로는 “평균보다 살짝 위의 실현수익을 확보한다”는 뜻이 된다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>총합 산수는 맞지만, 투자자는 총합이 아니라 <strong>분포의 상단<\/strong>을 노린다. 문제는 평균이 아니라 우수 운용사를 선별하느냐라는 반론이 가능하다.<\/li>\n<li>또한 세금우대 계좌나 특정 비효율 시장에서는 액티브가 비용을 상쇄할 수 있다는 반론도 가능하다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 반박은 “상단 운용사 존재”와 “사전에 식별 가능”은 다른 문제라는 점이다. 선택편향·생존편향을 제거하면 성공 사례의 재현성은 크게 낮아진다.<\/li>\n<li>다만 채권처럼 구조적으로 덜 효율적인 시장에서는 액티브 성공 가능성이 상대적으로 높다는 점은 보글식 단순화의 약점이다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자도 원리는 같다. 국내 공모펀드·랩·자문·해외브로커 매매까지 모두 합치면 “총비용 후 마이너스섬”이라는 구조는 변하지 않는다.<\/li>\n<li>특히 잦은 해외주식 환전·단타·레버리지 활용은 비용과 행동 실수를 동시에 키운다. 최근 한국 개인투자자의 해외·레버리지 선호와 신용잔고 증가는 이 장의 경고를 더 현실적으로 만든다.<\/li>\n<\/ul>","text":"어떤 문제에 대한 해결책이 여럿 있을 때는 그 가운데 가장 단순한 것을 선택하라. 주식시장에서 벌어들인 수익은 전체 주식투자자 집단이 벌어들인 총수익과 같다. 장기적으로 주식시장 전체를 보유하는 것은 이기는 게임이고, 무모하게 주식시장을 이기려 드는 것은 지는 게임이다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 마이너스섬 구조 액티브 총합 = 시장, 비용 반영 후 &lt; 시장 구조 명제 시장 총수익 - 중개비용 - 운용비용 - 세금 시장을 이기려는 총합은 비용 차감 후 시장에 못 미침 원본 노트 기준선 [버핏/외부 인용] 버핏-헤지펀드 내기 인덱스 126%, 헤지펀드 묶음 36% 2008-01-01~2017-12-31 누적수익률, 비용 차감 후 투자자 실현수익 비용·구조 차이가 장기적으로 결과를 크게 벌림 Buffett vs Protégé 공개 결과 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 U.S. 대형주 액티브 연간 부진 다수 액티브가 시장에 뒤짐 2025년에 79% 언더퍼폼 최신 수치 악화 보글의 “대다수 액티브는 비용 후 패배” 명제가 최신 데이터에서도 유지 SPIVA U.S. Scorecard Year-End 2025 인용 U.S. 대형주 장기 성공 확률 낮음 10년 기준 약 14%, 15년 기준 약 10%만 벤치마크 상회 장기일수록 더 희소 시간은 액티브 다수에게 우호적이지 않음 SPIVA U.S. Scorecard Year-End 2025 인용 Morningstar 장기 성공률 낮음 대형주 액티브의 10년 성공률 8% 측정법 다름 SPIVA와 다른 방법론에서도 결론 동일 Morningstar Active/Passive Barometer 인용 [보강 | 논리 전개] 이 장의 논리는 산수다. 시장 전체를 구성하는 모든 투자자의 보유를 합치면 시장 자체 가 된다. 따라서 액티브 총합의 총수익은 시장과 같고, 거기서 보수·매매비용·세금이 빠지면 액티브 투자자 총합은 시장보다 낮아진다. 인덱스펀드는 천재 전략이 아니라 비용을 적게 내는 방식으로 시장 몫을 지키는 구조 다. 그래서 “평균을 산다”는 표현이 실제로는 “평균보다 살짝 위의 실현수익을 확보한다”는 뜻이 된다. [반론] 총합 산수는 맞지만, 투자자는 총합이 아니라 분포의 상단 을 노린다. 문제는 평균이 아니라 우수 운용사를 선별하느냐라는 반론이 가능하다. 또한 세금우대 계좌나 특정 비효율 시장에서는 액티브가 비용을 상쇄할 수 있다는 반론도 가능하다. [보글 측 재반론] 보글식 반박은 “상단 운용사 존재”와 “사전에 식별 가능”은 다른 문제라는 점이다. 선택편향·생존편향을 제거하면 성공 사례의 재현성은 크게 낮아진다. 다만 채권처럼 구조적으로 덜 효율적인 시장에서는 액티브 성공 가능성이 상대적으로 높다는 점은 보글식 단순화의 약점이다. [한국 투자자 적용] 한국 투자자도 원리는 같다. 국내 공모펀드·랩·자문·해외브로커 매매까지 모두 합치면 “총비용 후 마이너스섬”이라는 구조는 변하지 않는다. 특히 잦은 해외주식 환전·단타·레버리지 활용은 비용과 행동 실수를 동시에 키운다. 최근 한국 개인투자자의 해외·레버리지 선호와 신용잔고 증가는 이 장의 경고를 더 현실적으로 만든다."},{"i":5,"title":"4. 이기는 게임은 어떻게 해서 지는 게임이 되는가?: 간단한 산수의 잔인한 법칙","html":"<ul>\n<li>투자자 집단은 치르지 않아도 될 비용까지 지급할 때가 있고, 이러한 비용을 치르지 않아야 자신의 수익을 고스란히 챙길 수 있다.<\/li>\n<li>무언가를 이해하지 않아야 돈을 벌 수 있는 상황에서는 그 무언가를 이해하기가 정말 어렵다.<\/li>\n<li>장기적으로 볼 때 복리비용의 횡포가 복리수익의 마법을 압도한다.<\/li>\n<li>투자의 성패를 가르는 것은 바로 비용이다.<\/li>\n<li>지금도 그렇고 앞으로도 계속 펀드계의 대장은 인덱스펀드다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 비용의 복리<\/td>\n<td style=\"text-align: right;\">개념 핵심<\/td>\n<td>전권<\/td>\n<td>순수익률 = 총수익률 - 총비용률<\/td>\n<td>차이는 선형이 아니라 복리로 누적<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[추론] 7% 총수익, 연 0.05% 비용<\/td>\n<td style=\"text-align: right;\">약 28.8배<\/td>\n<td>50년, 명목, 세전<\/td>\n<td>10,000×(1.0695)^50<\/td>\n<td>초저비용 인덱스의 복리력<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<tr>\n<td>[추론] 7% 총수익, 연 1.50% 비용<\/td>\n<td style=\"text-align: right;\">약 14.5배<\/td>\n<td>50년, 명목, 세전<\/td>\n<td>10,000×(1.055)^50<\/td>\n<td>비용 1.45%p 차이로 최종자산은 거의 반토막<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<tr>\n<td>[추론] 7% 총수익, 연 2.50% 비용<\/td>\n<td style=\"text-align: right;\">약 9.0배<\/td>\n<td>50년, 명목, 세전<\/td>\n<td>10,000×(1.045)^50<\/td>\n<td>고비용 구조는 “복리의 적”<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>미국 펀드 전체 자산가중 평균 비용<\/td>\n<td style=\"text-align: right;\">높은 비용이 장기수익 잠식<\/td>\n<td style=\"text-align: right;\">2024년 0.34%<\/td>\n<td>역사적 하락<\/td>\n<td>산업 평균은 낮아졌지만, 비용 차이는 여전히 누적효과 큼<\/td>\n<td>Morningstar 2024 fee study 인용<\/td>\n<\/tr>\n<tr>\n<td>Vanguard 평균 비용<\/td>\n<td style=\"text-align: right;\">저비용 우위<\/td>\n<td style=\"text-align: right;\">2024년 평균 0.07%<\/td>\n<td>업계 평균 대비 매우 낮음<\/td>\n<td>보글의 비용 철학이 구조로 이어짐<\/td>\n<td>Vanguard/Reuters/Investopedia 인용<\/td>\n<\/tr>\n<tr>\n<td>ETF vs 뮤추얼펀드 세금드래그<\/td>\n<td style=\"text-align: right;\">세금도 비용<\/td>\n<td style=\"text-align: right;\">ETF 0.36% vs 뮤추얼펀드 1.28% 연간<\/td>\n<td>세금 격차 큼<\/td>\n<td>세금까지 포함하면 비용 차이는 더 커짐<\/td>\n<td>BofA/FT ETF tax drag 인용<\/td>\n<\/tr>\n<tr>\n<td>Vanguard 액티브 채권 vs 업계<\/td>\n<td style=\"text-align: right;\">채권도 비용 중요<\/td>\n<td style=\"text-align: right;\">0.10% vs 업계 0.53%<\/td>\n<td>채권 액티브도 비용 격차 큼<\/td>\n<td>채권에서 액티브가 유리해도 비용 통제가 필수<\/td>\n<td>Vanguard/Morningstar 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글의 “비용”은 단순 보수만이 아니다. 공식 보수, 판매수수료, 거래비용, 현금드래그, 세금, 자문보수까지 모두 합쳐야 실제 투자자 순수익률이 나온다.<\/li>\n<li>예를 들어 총수익률이 연 7%로 같아도 비용이 0.05%면 50년 뒤 10,000달러는 약 287,000달러가 되지만, 1.5% 비용이면 약 145,000달러, 2.5%면 약 90,000달러 수준으로 떨어진다. 차이는 수익률 1~2%p가 아니라 <strong>최종자산 몫의 상실<\/strong>이다. <code>[추론]<\/code><\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>최근 수수료 인하 경쟁으로 비용이 과거보다 훨씬 낮아졌기 때문에, 이제는 비용보다 <strong>알파의 품질<\/strong>이 더 중요하다는 반론이 가능하다.<\/li>\n<li>또 일부 투자자는 자문보수로 행동 통제를 사기 때문에, 단순 비용 비교는 불완전하다는 주장도 가능하다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>비용이 낮아졌다는 사실은 보글 논리를 무너뜨리지 않고 오히려 강화한다. 시장이 보글식 경쟁으로 비용을 낮췄다는 뜻이기 때문이다.<\/li>\n<li>자문이 행동 실수를 줄여준다면 보수의 일부는 가치가 있을 수 있다. 다만 그 경우에도 “총비용 대비 행동개선 효과”를 따져야 하며, 자문비용이 자산의 고정 퍼센트로 붙으면 장기 복리 측면에서는 여전히 큰 부담이 된다. <code>[후대 해석]<\/code><\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 총보수뿐 아니라 환전 스프레드, 해외거래 수수료, 양도세 신고 비용, 배당원천징수, 국내외 계좌 유형 차이까지 함께 봐야 한다.<\/li>\n<li>국내상장 ETF와 해외상장 ETF는 과세시점과 비용체감이 다를 수 있으므로, “눈에 보이는 보수 0.0x%”만 보고 판단하면 총비용을 놓치기 쉽다. 한국은 최근 해외주식 쏠림과 원화 약세 우려가 함께 나타났기 때문에 환비용 관리가 더 중요해졌다.<\/li>\n<\/ul>","text":"투자자 집단은 치르지 않아도 될 비용까지 지급할 때가 있고, 이러한 비용을 치르지 않아야 자신의 수익을 고스란히 챙길 수 있다. 무언가를 이해하지 않아야 돈을 벌 수 있는 상황에서는 그 무언가를 이해하기가 정말 어렵다. 장기적으로 볼 때 복리비용의 횡포가 복리수익의 마법을 압도한다. 투자의 성패를 가르는 것은 바로 비용이다. 지금도 그렇고 앞으로도 계속 펀드계의 대장은 인덱스펀드다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 비용의 복리 개념 핵심 전권 순수익률 = 총수익률 - 총비용률 차이는 선형이 아니라 복리로 누적 원본 노트 기준선 [추론] 7% 총수익, 연 0.05% 비용 약 28.8배 50년, 명목, 세전 10,000×(1.0695)^50 초저비용 인덱스의 복리력 산식 복원 [추론] 7% 총수익, 연 1.50% 비용 약 14.5배 50년, 명목, 세전 10,000×(1.055)^50 비용 1.45%p 차이로 최종자산은 거의 반토막 산식 복원 [추론] 7% 총수익, 연 2.50% 비용 약 9.0배 50년, 명목, 세전 10,000×(1.045)^50 고비용 구조는 “복리의 적” 산식 복원 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 미국 펀드 전체 자산가중 평균 비용 높은 비용이 장기수익 잠식 2024년 0.34% 역사적 하락 산업 평균은 낮아졌지만, 비용 차이는 여전히 누적효과 큼 Morningstar 2024 fee study 인용 Vanguard 평균 비용 저비용 우위 2024년 평균 0.07% 업계 평균 대비 매우 낮음 보글의 비용 철학이 구조로 이어짐 Vanguard/Reuters/Investopedia 인용 ETF vs 뮤추얼펀드 세금드래그 세금도 비용 ETF 0.36% vs 뮤추얼펀드 1.28% 연간 세금 격차 큼 세금까지 포함하면 비용 차이는 더 커짐 BofA/FT ETF tax drag 인용 Vanguard 액티브 채권 vs 업계 채권도 비용 중요 0.10% vs 업계 0.53% 채권 액티브도 비용 격차 큼 채권에서 액티브가 유리해도 비용 통제가 필수 Vanguard/Morningstar 인용 [보강 | 논리 전개] 보글의 “비용”은 단순 보수만이 아니다. 공식 보수, 판매수수료, 거래비용, 현금드래그, 세금, 자문보수까지 모두 합쳐야 실제 투자자 순수익률이 나온다. 예를 들어 총수익률이 연 7%로 같아도 비용이 0.05%면 50년 뒤 10,000달러는 약 287,000달러가 되지만, 1.5% 비용이면 약 145,000달러, 2.5%면 약 90,000달러 수준으로 떨어진다. 차이는 수익률 1~2%p가 아니라 최종자산 몫의 상실 이다. [추론] [반론] 최근 수수료 인하 경쟁으로 비용이 과거보다 훨씬 낮아졌기 때문에, 이제는 비용보다 알파의 품질 이 더 중요하다는 반론이 가능하다. 또 일부 투자자는 자문보수로 행동 통제를 사기 때문에, 단순 비용 비교는 불완전하다는 주장도 가능하다. [보글 측 재반론] 비용이 낮아졌다는 사실은 보글 논리를 무너뜨리지 않고 오히려 강화한다. 시장이 보글식 경쟁으로 비용을 낮췄다는 뜻이기 때문이다. 자문이 행동 실수를 줄여준다면 보수의 일부는 가치가 있을 수 있다. 다만 그 경우에도 “총비용 대비 행동개선 효과”를 따져야 하며, 자문비용이 자산의 고정 퍼센트로 붙으면 장기 복리 측면에서는 여전히 큰 부담이 된다. [후대 해석] [한국 투자자 적용] 한국 투자자는 총보수뿐 아니라 환전 스프레드, 해외거래 수수료, 양도세 신고 비용, 배당원천징수, 국내외 계좌 유형 차이까지 함께 봐야 한다. 국내상장 ETF와 해외상장 ETF는 과세시점과 비용체감이 다를 수 있으므로, “눈에 보이는 보수 0.0x%”만 보고 판단하면 총비용을 놓치기 쉽다. 한국은 최근 해외주식 쏠림과 원화 약세 우려가 함께 나타났기 때문에 환비용 관리가 더 중요해졌다."},{"i":6,"title":"5. 보이지 않는 비용의 위력: 펀드매니저 몫이 커질수록 투자자 몫은 줄어든다","html":"<ul>\n<li>비용이 중요하다. 그것도 그냥 중요한 것이 아니라 대단히 중요하다.<\/li>\n<li>저비용에 복리까지 불어나면 누적 수익률의 격차는 어마어마해진다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 보이는 비용<\/td>\n<td style=\"text-align: right;\">운용보수·판매수수료·거래비용<\/td>\n<td>전권<\/td>\n<td>펀드 총수익 - 명시비용<\/td>\n<td>펀드매니저와 판매망의 몫이 커질수록 투자자 순수익은 감소<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 보이지 않는 비용<\/td>\n<td style=\"text-align: right;\">회전율·스프레드·시장충격·세금·현금드래그<\/td>\n<td>전권<\/td>\n<td>명시비용 외 장기 순수익률 차감 요인<\/td>\n<td>공식 보수보다 실제 비용이 더 클 수 있음<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[추론] 7% 총수익, 연 0.05% 비용<\/td>\n<td style=\"text-align: right;\">약 28.8배<\/td>\n<td>50년, 명목, 세전, 배당 재투자 가정<\/td>\n<td>10,000×(1.0695)^50<\/td>\n<td>초저비용 구조의 장기 최종자산<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<tr>\n<td>[추론] 7% 총수익, 연 1.50% 비용<\/td>\n<td style=\"text-align: right;\">약 14.5배<\/td>\n<td>50년, 명목, 세전, 배당 재투자 가정<\/td>\n<td>10,000×(1.055)^50<\/td>\n<td>비용 1.45%p 차이로 최종자산이 크게 축소<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>미국 펀드 전체 자산가중 평균 비용<\/td>\n<td style=\"text-align: right;\">높은 비용이 장기수익 잠식<\/td>\n<td style=\"text-align: right;\">2024년 0.34%<\/td>\n<td>역사적 하락<\/td>\n<td>평균 비용은 낮아졌지만, 비용 차이는 긴 기간에 여전히 복리로 확대<\/td>\n<td>Morningstar 2024 fee study 인용<\/td>\n<\/tr>\n<tr>\n<td>Vanguard 평균 비용<\/td>\n<td style=\"text-align: right;\">저비용 우위<\/td>\n<td style=\"text-align: right;\">2024년 평균 0.07%<\/td>\n<td>업계 평균 대비 매우 낮음<\/td>\n<td>보글의 비용 철학이 실제 비용 구조로 이어짐<\/td>\n<td>Vanguard/Reuters/Investopedia 인용<\/td>\n<\/tr>\n<tr>\n<td>ETF vs 뮤추얼펀드 세금드래그<\/td>\n<td style=\"text-align: right;\">세금도 비용<\/td>\n<td style=\"text-align: right;\">ETF 0.36% vs 뮤추얼펀드 1.28% 연간<\/td>\n<td>세금 격차 큼<\/td>\n<td>비용은 보수뿐 아니라 과세 효율까지 포함해야 함<\/td>\n<td>BofA/FT ETF tax drag 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글이 말한 비용은 펀드 보수 하나가 아니다. 운용보수, 판매보수, 회전율에 따른 거래비용, 매매 스프레드, 세금, 현금 보유에 따른 기회비용, 자문보수까지 합쳐야 투자자 실현수익률이 나온다.<\/li>\n<li>펀드매니저의 몫은 투자자에게는 확정 비용이다. 반면 액티브 매니저가 만들어낼 초과수익은 불확실하다. 그래서 같은 시장수익률을 출발점으로 놓으면 저비용 구조가 장기적으로 더 유리해진다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>높은 보수를 받는 운용자가 실제 알파를 만든다면 비용은 단순 손실이 아니라 능력에 대한 가격일 수 있다.<\/li>\n<li>투자자문·리서치·세무관리·행동통제 서비스가 실제 매도 실수를 줄여준다면 총비용 일부는 정당화될 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글의 반박은 “서비스가 전부 무가치하다”가 아니라 “비용은 확정이고 알파는 불확실하다”는 것이다. 사전에 뛰어난 운용자를 골라 장기간 유지할 수 있어야 고비용 구조가 정당화된다.<\/li>\n<li>다만 행동 코칭이 실제로 폭락 매도를 막아준다면 자문비 일부는 가치가 있을 수 있다. 이 지점은 보글식 비용 최소화 논리의 예외 가능성으로 남는다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 총보수뿐 아니라 판매보수, 기타비용, 매매중개수수료, 환전 스프레드, 배당 원천징수, 해외주식 양도세 신고 비용, 연금계좌 과세효과를 함께 봐야 한다.<\/li>\n<li>국내상장 해외 ETF와 해외상장 ETF는 보수율이 비슷해 보여도 세금과 환전 구조가 다를 수 있다. 따라서 “TER가 낮다”만으로 보글식 저비용이라고 단정하기 어렵다.<\/li>\n<\/ul>","text":"비용이 중요하다. 그것도 그냥 중요한 것이 아니라 대단히 중요하다. 저비용에 복리까지 불어나면 누적 수익률의 격차는 어마어마해진다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 보이는 비용 운용보수·판매수수료·거래비용 전권 펀드 총수익 - 명시비용 펀드매니저와 판매망의 몫이 커질수록 투자자 순수익은 감소 원본 노트 기준선 [보글 본문] 보이지 않는 비용 회전율·스프레드·시장충격·세금·현금드래그 전권 명시비용 외 장기 순수익률 차감 요인 공식 보수보다 실제 비용이 더 클 수 있음 원본 노트 기준선 [추론] 7% 총수익, 연 0.05% 비용 약 28.8배 50년, 명목, 세전, 배당 재투자 가정 10,000×(1.0695)^50 초저비용 구조의 장기 최종자산 산식 복원 [추론] 7% 총수익, 연 1.50% 비용 약 14.5배 50년, 명목, 세전, 배당 재투자 가정 10,000×(1.055)^50 비용 1.45%p 차이로 최종자산이 크게 축소 산식 복원 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 미국 펀드 전체 자산가중 평균 비용 높은 비용이 장기수익 잠식 2024년 0.34% 역사적 하락 평균 비용은 낮아졌지만, 비용 차이는 긴 기간에 여전히 복리로 확대 Morningstar 2024 fee study 인용 Vanguard 평균 비용 저비용 우위 2024년 평균 0.07% 업계 평균 대비 매우 낮음 보글의 비용 철학이 실제 비용 구조로 이어짐 Vanguard/Reuters/Investopedia 인용 ETF vs 뮤추얼펀드 세금드래그 세금도 비용 ETF 0.36% vs 뮤추얼펀드 1.28% 연간 세금 격차 큼 비용은 보수뿐 아니라 과세 효율까지 포함해야 함 BofA/FT ETF tax drag 인용 [보강 | 논리 전개] 보글이 말한 비용은 펀드 보수 하나가 아니다. 운용보수, 판매보수, 회전율에 따른 거래비용, 매매 스프레드, 세금, 현금 보유에 따른 기회비용, 자문보수까지 합쳐야 투자자 실현수익률이 나온다. 펀드매니저의 몫은 투자자에게는 확정 비용이다. 반면 액티브 매니저가 만들어낼 초과수익은 불확실하다. 그래서 같은 시장수익률을 출발점으로 놓으면 저비용 구조가 장기적으로 더 유리해진다. [반론] 높은 보수를 받는 운용자가 실제 알파를 만든다면 비용은 단순 손실이 아니라 능력에 대한 가격일 수 있다. 투자자문·리서치·세무관리·행동통제 서비스가 실제 매도 실수를 줄여준다면 총비용 일부는 정당화될 수 있다. [보글 측 재반론] 보글의 반박은 “서비스가 전부 무가치하다”가 아니라 “비용은 확정이고 알파는 불확실하다”는 것이다. 사전에 뛰어난 운용자를 골라 장기간 유지할 수 있어야 고비용 구조가 정당화된다. 다만 행동 코칭이 실제로 폭락 매도를 막아준다면 자문비 일부는 가치가 있을 수 있다. 이 지점은 보글식 비용 최소화 논리의 예외 가능성으로 남는다. [한국 투자자 적용] 한국 투자자는 총보수뿐 아니라 판매보수, 기타비용, 매매중개수수료, 환전 스프레드, 배당 원천징수, 해외주식 양도세 신고 비용, 연금계좌 과세효과를 함께 봐야 한다. 국내상장 해외 ETF와 해외상장 ETF는 보수율이 비슷해 보여도 세금과 환전 구조가 다를 수 있다. 따라서 “TER가 낮다”만으로 보글식 저비용이라고 단정하기 어렵다."},{"i":7,"title":"6. 배당금은 누가 다 가져갔을까: 배당금 갉아 먹는 뮤추얼펀드","html":"<ul>\n<li>장기간에 걸쳐 복리의 마법이 발휘되면 배당금은 자산 가치를 엄청난 수준으로 끌어올린다.<\/li>\n<li>주가 변동에 따른 수익에서 눈을 돌려 배당수익에 집중하라.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 배당 재투자 효과<\/td>\n<td style=\"text-align: right;\">장기 총수익의 핵심 구성요소<\/td>\n<td>장기, 명목, 세전, 배당 재투자<\/td>\n<td>총수익 = 가격수익 + 배당수익 + 배당 재투자 복리<\/td>\n<td>배당은 단순 현금흐름이 아니라 장기 복리 엔진<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 펀드비용의 배당 잠식<\/td>\n<td style=\"text-align: right;\">비용이 배당수익 일부를 소비<\/td>\n<td>전권<\/td>\n<td>배당수익률 - 보수·거래비용·세금<\/td>\n<td>비용 수준이 높을수록 투자자의 배당 몫이 축소<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>S&amp;P 500 배당수익률<\/td>\n<td style=\"text-align: right;\">과거 장기수익에서 배당 비중 큼<\/td>\n<td style=\"text-align: right;\">2024년 1.18%, 2026년 약 1.1%<\/td>\n<td>과거보다 낮음<\/td>\n<td>현대 미국 주식은 배당보다 자사주매입 비중이 커짐<\/td>\n<td>S&amp;P/FactSet/Investopedia 계열 인용<\/td>\n<\/tr>\n<tr>\n<td>2024 총주주환원수익률<\/td>\n<td style=\"text-align: right;\">배당 중심 시대와 다름<\/td>\n<td style=\"text-align: right;\">배당 1.3% + 자사주매입 1.9% = 3.2%<\/td>\n<td>구성 변경<\/td>\n<td>오늘의 투자수익은 배당+자사주매입으로 봐야 더 정확<\/td>\n<td>S&amp;P buyback/dividend data 인용<\/td>\n<\/tr>\n<tr>\n<td>최근 10년 S&amp;P 수익 중 배당 기여<\/td>\n<td style=\"text-align: right;\">장기적으로 배당 중요<\/td>\n<td style=\"text-align: right;\">2013~2024 배당 기여 약 16%<\/td>\n<td>배당 기여 축소<\/td>\n<td>배당 재투자 중요성은 여전하지만 수익 구성은 달라짐<\/td>\n<td>S&amp;P 장기수익 분해 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글의 배당 논리는 가격 변동보다 기업이 실제로 주주에게 돌려주는 현금흐름에 초점을 맞춘다. 배당을 소비하지 않고 재투자하면 시간이 길어질수록 보유 주식 수와 미래 배당 기반이 함께 커진다.<\/li>\n<li>비용이 높은 펀드는 투자자가 받아야 할 배당의 일부를 매년 가져간다. 특히 배당수익률이 낮아진 현대 시장에서는 0.5~1.0%p 비용도 배당수익의 큰 비중을 잠식할 수 있다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>배당은 세금상 불리할 수 있고, 기업이 배당 대신 자사주매입이나 재투자로 더 높은 가치를 만들 수도 있다.<\/li>\n<li>배당수익률만 강조하면 성장성이 높은 기업이나 무배당 고품질 기업을 과소평가할 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글의 주장은 고배당주 선호가 아니라 “실제 기업 현금흐름에 집중하라”는 것이다. 배당, 이익성장, 자사주매입은 모두 장기 투자수익의 원천이다.<\/li>\n<li>다만 2017년 이후의 미국 시장에서는 배당만으로 투자수익을 설명하는 방식은 부족하다. 보글식 투자수익 개념은 총주주환원으로 확장해서 해석하는 편이 더 정확하다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 배당 원천징수, 금융소득종합과세 가능성, 연금계좌 내 과세이연 여부를 함께 고려해야 한다.<\/li>\n<li>해외 ETF의 배당은 원천징수와 국내 과세 체계가 겹칠 수 있다. 배당 재투자 효과를 얻으려면 비용과 세후 현금흐름을 함께 관리해야 한다.<\/li>\n<\/ul>","text":"장기간에 걸쳐 복리의 마법이 발휘되면 배당금은 자산 가치를 엄청난 수준으로 끌어올린다. 주가 변동에 따른 수익에서 눈을 돌려 배당수익에 집중하라. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 배당 재투자 효과 장기 총수익의 핵심 구성요소 장기, 명목, 세전, 배당 재투자 총수익 = 가격수익 + 배당수익 + 배당 재투자 복리 배당은 단순 현금흐름이 아니라 장기 복리 엔진 원본 노트 기준선 [보글 본문] 펀드비용의 배당 잠식 비용이 배당수익 일부를 소비 전권 배당수익률 - 보수·거래비용·세금 비용 수준이 높을수록 투자자의 배당 몫이 축소 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 S&amp;P 500 배당수익률 과거 장기수익에서 배당 비중 큼 2024년 1.18%, 2026년 약 1.1% 과거보다 낮음 현대 미국 주식은 배당보다 자사주매입 비중이 커짐 S&amp;P/FactSet/Investopedia 계열 인용 2024 총주주환원수익률 배당 중심 시대와 다름 배당 1.3% + 자사주매입 1.9% = 3.2% 구성 변경 오늘의 투자수익은 배당+자사주매입으로 봐야 더 정확 S&amp;P buyback/dividend data 인용 최근 10년 S&amp;P 수익 중 배당 기여 장기적으로 배당 중요 2013~2024 배당 기여 약 16% 배당 기여 축소 배당 재투자 중요성은 여전하지만 수익 구성은 달라짐 S&amp;P 장기수익 분해 인용 [보강 | 논리 전개] 보글의 배당 논리는 가격 변동보다 기업이 실제로 주주에게 돌려주는 현금흐름에 초점을 맞춘다. 배당을 소비하지 않고 재투자하면 시간이 길어질수록 보유 주식 수와 미래 배당 기반이 함께 커진다. 비용이 높은 펀드는 투자자가 받아야 할 배당의 일부를 매년 가져간다. 특히 배당수익률이 낮아진 현대 시장에서는 0.5~1.0%p 비용도 배당수익의 큰 비중을 잠식할 수 있다. [반론] 배당은 세금상 불리할 수 있고, 기업이 배당 대신 자사주매입이나 재투자로 더 높은 가치를 만들 수도 있다. 배당수익률만 강조하면 성장성이 높은 기업이나 무배당 고품질 기업을 과소평가할 수 있다. [보글 측 재반론] 보글의 주장은 고배당주 선호가 아니라 “실제 기업 현금흐름에 집중하라”는 것이다. 배당, 이익성장, 자사주매입은 모두 장기 투자수익의 원천이다. 다만 2017년 이후의 미국 시장에서는 배당만으로 투자수익을 설명하는 방식은 부족하다. 보글식 투자수익 개념은 총주주환원으로 확장해서 해석하는 편이 더 정확하다. [한국 투자자 적용] 한국 투자자는 배당 원천징수, 금융소득종합과세 가능성, 연금계좌 내 과세이연 여부를 함께 고려해야 한다. 해외 ETF의 배당은 원천징수와 국내 과세 체계가 겹칠 수 있다. 배당 재투자 효과를 얻으려면 비용과 세후 현금흐름을 함께 관리해야 한다."},{"i":8,"title":"7. 조삼모사를 경계하라: 발표되는 펀드수익이 모두 투자자의 몫은 아니다","html":"<ul>\n<li>주식형 펀드의 장기 수익은 주식시장 수익에 훨씬 못 미치며, 그 이유는 펀드비용 때문이다.<\/li>\n<li>고수익을 올리면 그 다음에는 평균수익 수준 혹은 그 밑으로 회귀하는 경향이 있다. (RTM)<\/li>\n<li>펀드업계가 역생산적인 투자자 정서를 이용해 역생산적인 판촉전을 벌이는 상황에서 좋은 결과를 기대하기는 어렵다.<\/li>\n<li>인덱스펀드의 장점은 비용 수준이 낮은 것 외에도 잘못된 펀드를 선택할 위험성을 낮춰준다는 데 있다.<\/li>\n<li>주식 투자자의 최대 적은 바로 비용과 감정이다.<\/li>\n<li>매수 후 보유? 그렇다. 특히 '보유'하라는 부분을 잊지 마라.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 평균회귀<\/td>\n<td style=\"text-align: right;\">상위 펀드의 미래 부진<\/td>\n<td>장기<\/td>\n<td>과거 상위권의 미래 사분위 하락<\/td>\n<td>우승자 추종 실패<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[버핏/외부 인용] Magellan 사례<\/td>\n<td style=\"text-align: right;\">지속적 초과수익이 드문 예외<\/td>\n<td>1984~2022 개별 연도표<\/td>\n<td>펀드 수익률 vs S&amp;P 500<\/td>\n<td>“스타 펀드”는 존재하지만 극소수<\/td>\n<td>Fidelity Magellan 성과표 2차 인용<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 생존편향 경고<\/td>\n<td style=\"text-align: right;\">생존한 승자만 보면 착시<\/td>\n<td>전권<\/td>\n<td>폐쇄/합병 제외 시 왜곡<\/td>\n<td>투자자 체감 확률 과대평가<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>U.S. 대형주 액티브 10년 성공률<\/td>\n<td style=\"text-align: right;\">낮음<\/td>\n<td style=\"text-align: right;\">8%<\/td>\n<td>장기적으로 매우 희박<\/td>\n<td>“스타를 사전에 고르기”가 매우 어려움<\/td>\n<td>Morningstar Active/Passive Barometer 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>대형성장 액티브 펀드 폐쇄율<\/td>\n<td style=\"text-align: right;\">생존편향 중대<\/td>\n<td style=\"text-align: right;\">20년간 약 65% 폐쇄, 1%만 패시브 평균 초과<\/td>\n<td>생존 자체가 드묾<\/td>\n<td>살아남은 소수만 보면 착시 발생<\/td>\n<td>Morningstar Active/Passive Barometer 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>SPIVA Persistence<\/td>\n<td style=\"text-align: right;\">상위권 유지 어려움<\/td>\n<td style=\"text-align: right;\">2020년 상위 사분위 중 2024년 말까지 상위 사분위 잔류 0개<\/td>\n<td>최신 확인<\/td>\n<td>“최근 승자=미래 승자” 가설 부정<\/td>\n<td>SPIVA Persistence Scorecard 2025 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>이 장은 보글 논리의 행동재무학 버전이다. 사람은 방금 이긴 펀드를 고르고 싶어 하지만, 자금이 몰린 뒤의 비용 증가·스타일 역풍·운용 규모 확대가 겹치며 평균회귀가 발생한다.<\/li>\n<li>Magellan 같은 예외적 성공 사례는 존재한다. 하지만 그런 사례는 <strong>선택편향의 유혹<\/strong>을 만든다. 투자자는 사후적으로 승자를 압도적으로 쉽게 떠올리지만, 사전에 승자를 정확히 고르는 일은 전혀 다른 문제다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>최고의 액티브 운용사는 실제로 존재하며, Magellan·Contrafund·Primecap 같은 사례는 단순한 운이 아니라는 반론이 가능하다.<\/li>\n<li>평균회귀가 있어도, 장기간 철학이 유지되는 하우스는 반복 가능성이 있다는 주장도 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 재반론은 예외의 존재를 인정하되, 투자자가 <strong>규모 확대·운용팀 변경·스타일 변질 이후에도<\/strong> 같은 성과를 누릴 확률은 매우 낮다는 점이다.<\/li>\n<li>Contrafund의 정밀 장기 수치처럼 일부 사례는 추가 1차 검증이 더 필요하다. 이 점은 미확인 항목으로 남긴다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자도 최근 수익률 상위 펀드·ETF·테마를 뒤쫓는 경향이 강하다. 그러나 특히 해외 성장주·반도체·레버리지 상품은 평균회귀가 더 가파를 수 있다.<\/li>\n<li>“최근 1년 성과 상위”는 상품 선택의 출발점이 아니라, 오히려 경계 신호로 보는 편이 보글식 원칙에 가깝다.<\/li>\n<\/ul>","text":"주식형 펀드의 장기 수익은 주식시장 수익에 훨씬 못 미치며, 그 이유는 펀드비용 때문이다. 고수익을 올리면 그 다음에는 평균수익 수준 혹은 그 밑으로 회귀하는 경향이 있다. (RTM) 펀드업계가 역생산적인 투자자 정서를 이용해 역생산적인 판촉전을 벌이는 상황에서 좋은 결과를 기대하기는 어렵다. 인덱스펀드의 장점은 비용 수준이 낮은 것 외에도 잘못된 펀드를 선택할 위험성을 낮춰준다는 데 있다. 주식 투자자의 최대 적은 바로 비용과 감정이다. 매수 후 보유? 그렇다. 특히 '보유'하라는 부분을 잊지 마라. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 평균회귀 상위 펀드의 미래 부진 장기 과거 상위권의 미래 사분위 하락 우승자 추종 실패 원본 노트 기준선 [버핏/외부 인용] Magellan 사례 지속적 초과수익이 드문 예외 1984~2022 개별 연도표 펀드 수익률 vs S&amp;P 500 “스타 펀드”는 존재하지만 극소수 Fidelity Magellan 성과표 2차 인용 [보글 본문] 생존편향 경고 생존한 승자만 보면 착시 전권 폐쇄/합병 제외 시 왜곡 투자자 체감 확률 과대평가 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 U.S. 대형주 액티브 10년 성공률 낮음 8% 장기적으로 매우 희박 “스타를 사전에 고르기”가 매우 어려움 Morningstar Active/Passive Barometer 2025 인용 대형성장 액티브 펀드 폐쇄율 생존편향 중대 20년간 약 65% 폐쇄, 1%만 패시브 평균 초과 생존 자체가 드묾 살아남은 소수만 보면 착시 발생 Morningstar Active/Passive Barometer 2025 인용 SPIVA Persistence 상위권 유지 어려움 2020년 상위 사분위 중 2024년 말까지 상위 사분위 잔류 0개 최신 확인 “최근 승자=미래 승자” 가설 부정 SPIVA Persistence Scorecard 2025 인용 [보강 | 논리 전개] 이 장은 보글 논리의 행동재무학 버전이다. 사람은 방금 이긴 펀드를 고르고 싶어 하지만, 자금이 몰린 뒤의 비용 증가·스타일 역풍·운용 규모 확대가 겹치며 평균회귀가 발생한다. Magellan 같은 예외적 성공 사례는 존재한다. 하지만 그런 사례는 선택편향의 유혹 을 만든다. 투자자는 사후적으로 승자를 압도적으로 쉽게 떠올리지만, 사전에 승자를 정확히 고르는 일은 전혀 다른 문제다. [반론] 최고의 액티브 운용사는 실제로 존재하며, Magellan·Contrafund·Primecap 같은 사례는 단순한 운이 아니라는 반론이 가능하다. 평균회귀가 있어도, 장기간 철학이 유지되는 하우스는 반복 가능성이 있다는 주장도 있다. [보글 측 재반론] 보글식 재반론은 예외의 존재를 인정하되, 투자자가 규모 확대·운용팀 변경·스타일 변질 이후에도 같은 성과를 누릴 확률은 매우 낮다는 점이다. Contrafund의 정밀 장기 수치처럼 일부 사례는 추가 1차 검증이 더 필요하다. 이 점은 미확인 항목으로 남긴다. [한국 투자자 적용] 한국 투자자도 최근 수익률 상위 펀드·ETF·테마를 뒤쫓는 경향이 강하다. 그러나 특히 해외 성장주·반도체·레버리지 상품은 평균회귀가 더 가파를 수 있다. “최근 1년 성과 상위”는 상품 선택의 출발점이 아니라, 오히려 경계 신호로 보는 편이 보글식 원칙에 가깝다."},{"i":9,"title":"8. 세금도 비용이다: 투자에도 세테크가 필요하다","html":"<ul>\n<li>인덱스펀드는 비용 수준이 극단적으로 낮기 때문에 배당수익을 훨씬 덜 소비한다.<\/li>\n<li>비용, 투자자에 불리한 펀드 선택, 부적절한 투자 시점 선택, 세금, 인플레이션 등이 펀드수익률을 잡아먹는다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 세금의 비용화<\/td>\n<td style=\"text-align: right;\">세금은 투자수익률 차감 요인<\/td>\n<td>전권<\/td>\n<td>세전수익률 - 세금 = 세후수익률<\/td>\n<td>세금은 보수처럼 장기 복리를 잠식<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 낮은 회전율의 세금 효율<\/td>\n<td style=\"text-align: right;\">인덱스펀드는 회전율 낮음<\/td>\n<td>장기 보유, 세전/세후 비교<\/td>\n<td>실현이익 발생 빈도 감소<\/td>\n<td>과세 시점을 늦추면 복리 기반이 유지<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ETF vs 뮤추얼펀드 세금드래그<\/td>\n<td style=\"text-align: right;\">세금도 비용<\/td>\n<td style=\"text-align: right;\">ETF 0.36% vs 뮤추얼펀드 1.28% 연간<\/td>\n<td>ETF 세효율 우위<\/td>\n<td>구조와 회전율이 세후수익률을 크게 바꿈<\/td>\n<td>BofA/FT ETF tax drag 인용<\/td>\n<\/tr>\n<tr>\n<td>TDF 과세계좌 세금사건<\/td>\n<td style=\"text-align: right;\">과세효율 중요<\/td>\n<td style=\"text-align: right;\">2021년 일부 펀드에서 자본이득 15.1% NAV 분배<\/td>\n<td>예외적 사고<\/td>\n<td>좋은 상품도 과세계좌에서 세금 이벤트를 만들 수 있음<\/td>\n<td>Vanguard TDF SEC/소송 보도<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글에게 세금은 투자와 별개의 사후 문제가 아니라 비용의 한 형태다. 자주 매매할수록 이익이 실현되고, 실현된 이익은 과세되어 재투자 원금을 줄인다.<\/li>\n<li>인덱스펀드의 낮은 회전율은 보수 절감뿐 아니라 과세이연 효과를 만든다. 이는 장기 보유자의 세후 복리에 직접 유리하다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>세금은 투자자의 계좌 유형과 거주지에 따라 달라지므로 미국 뮤추얼펀드 중심의 세금 논리를 모든 나라에 그대로 적용하기 어렵다.<\/li>\n<li>손실 실현, 세금 수확, 연금계좌 활용처럼 세금을 적극적으로 관리하면 액티브 전략도 세후 효율을 개선할 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 답은 단순하다. 세금 최적화 전략도 복잡성을 늘린다. 대다수 투자자에게는 낮은 회전율과 장기 보유가 가장 재현 가능한 세금 관리 방식이다.<\/li>\n<li>다만 세제는 국가별로 크게 다르므로, 세금 장은 미국 투자자 전제를 분리해 읽어야 한다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 일반계좌, 연금저축, IRP, ISA 등 계좌별 과세가 다르다. 동일 ETF라도 계좌 위치에 따라 세후 결과가 달라질 수 있다.<\/li>\n<li>해외상장 ETF와 국내상장 해외 ETF는 양도세·배당세·분배금 과세·손익통산 구조가 다르므로, 보글식 “저비용”은 반드시 세후 기준으로 재계산해야 한다.<\/li>\n<\/ul>","text":"인덱스펀드는 비용 수준이 극단적으로 낮기 때문에 배당수익을 훨씬 덜 소비한다. 비용, 투자자에 불리한 펀드 선택, 부적절한 투자 시점 선택, 세금, 인플레이션 등이 펀드수익률을 잡아먹는다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 세금의 비용화 세금은 투자수익률 차감 요인 전권 세전수익률 - 세금 = 세후수익률 세금은 보수처럼 장기 복리를 잠식 원본 노트 기준선 [보글 본문] 낮은 회전율의 세금 효율 인덱스펀드는 회전율 낮음 장기 보유, 세전/세후 비교 실현이익 발생 빈도 감소 과세 시점을 늦추면 복리 기반이 유지 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 ETF vs 뮤추얼펀드 세금드래그 세금도 비용 ETF 0.36% vs 뮤추얼펀드 1.28% 연간 ETF 세효율 우위 구조와 회전율이 세후수익률을 크게 바꿈 BofA/FT ETF tax drag 인용 TDF 과세계좌 세금사건 과세효율 중요 2021년 일부 펀드에서 자본이득 15.1% NAV 분배 예외적 사고 좋은 상품도 과세계좌에서 세금 이벤트를 만들 수 있음 Vanguard TDF SEC/소송 보도 [보강 | 논리 전개] 보글에게 세금은 투자와 별개의 사후 문제가 아니라 비용의 한 형태다. 자주 매매할수록 이익이 실현되고, 실현된 이익은 과세되어 재투자 원금을 줄인다. 인덱스펀드의 낮은 회전율은 보수 절감뿐 아니라 과세이연 효과를 만든다. 이는 장기 보유자의 세후 복리에 직접 유리하다. [반론] 세금은 투자자의 계좌 유형과 거주지에 따라 달라지므로 미국 뮤추얼펀드 중심의 세금 논리를 모든 나라에 그대로 적용하기 어렵다. 손실 실현, 세금 수확, 연금계좌 활용처럼 세금을 적극적으로 관리하면 액티브 전략도 세후 효율을 개선할 수 있다. [보글 측 재반론] 보글식 답은 단순하다. 세금 최적화 전략도 복잡성을 늘린다. 대다수 투자자에게는 낮은 회전율과 장기 보유가 가장 재현 가능한 세금 관리 방식이다. 다만 세제는 국가별로 크게 다르므로, 세금 장은 미국 투자자 전제를 분리해 읽어야 한다. [한국 투자자 적용] 한국 투자자는 일반계좌, 연금저축, IRP, ISA 등 계좌별 과세가 다르다. 동일 ETF라도 계좌 위치에 따라 세후 결과가 달라질 수 있다. 해외상장 ETF와 국내상장 해외 ETF는 양도세·배당세·분배금 과세·손익통산 구조가 다르므로, 보글식 “저비용”은 반드시 세후 기준으로 재계산해야 한다."},{"i":10,"title":"9. 좋은 시절이 다 갔을 때: 수익률은 살아 움직이는 존재다","html":"<ul>\n<li>장기적으로 주식시장의 수익 창출을 주도하는 것은 기업의 수익 성장과 배당수익으로 대표되는 사업 실적이다.<\/li>\n<li>오랜 기간 주식시장은 고수익 시대를 구가했고 향후 주식시장이 저수익 시대를 맞이하리라 예상된다.<\/li>\n<li>채권 수익은 구매할 당시의 금리가 가장 중요한 수익원이라 채권 수익률의 예측은 간단하다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 주식수익 분해<\/td>\n<td style=\"text-align: right;\">배당수익률 + 이익성장률 + PER 변화<\/td>\n<td>장기, 명목, 세전, 배당 재투자<\/td>\n<td>투자수익 + 투기수익<\/td>\n<td>장기수익은 기업성과, 단기수익은 투자심리에 더 크게 좌우<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 채권수익 예측<\/td>\n<td style=\"text-align: right;\">매수 당시 금리가 핵심<\/td>\n<td>채권 보유기간, 명목, 세전<\/td>\n<td>시작수익률이 장기 채권수익의 주요 설명변수<\/td>\n<td>채권은 주식보다 장기 기대수익 추정이 상대적으로 단순<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[2017 개정판 데이터][간접복원] 장기 미국 주식 명목수익<\/td>\n<td style=\"text-align: right;\">연 9%대 중후반 수준 <code>[간접복원]<\/code><\/td>\n<td>1900~2016 또는 1926~2016 계열<\/td>\n<td>투자수익 + 투기수익<\/td>\n<td>과거 고수익이 미래에도 그대로 반복된다는 보장은 없음<\/td>\n<td>2017 개정판·장기시장 데이터 2차 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>S&amp;P 500 배당수익률<\/td>\n<td style=\"text-align: right;\">과거보다 높았음<\/td>\n<td style=\"text-align: right;\">2024년 1.18%, 2026년 약 1.1%<\/td>\n<td>낮아짐<\/td>\n<td>과거 장기수익률을 그대로 기대하기 어려운 구조<\/td>\n<td>S&amp;P/FactSet/Investopedia 계열 인용<\/td>\n<\/tr>\n<tr>\n<td>2024 총주주환원수익률<\/td>\n<td style=\"text-align: right;\">배당 중심 시대와 다름<\/td>\n<td style=\"text-align: right;\">배당 1.3% + 자사주매입 1.9% = 3.2%<\/td>\n<td>구성 변화<\/td>\n<td>오늘의 투자수익은 배당보다 총주주환원으로 봐야 함<\/td>\n<td>S&amp;P buyback/dividend data 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글이 “좋은 시절이 다 갔다”고 말한 핵심은 비관론이 아니라 기대수익률의 산식 복원이다. 과거 수익률이 높았던 이유가 높은 배당수익률, 이익성장, PER 상승이었다면, 미래 수익률은 현재 배당수익률과 현재 밸류에이션에서 다시 계산해야 한다.<\/li>\n<li>채권은 주식보다 출발 금리의 설명력이 크다. 낮은 금리에서 산 채권은 장기 기대수익이 낮고, 높은 금리에서 산 채권은 장기 기대수익의 출발점이 높다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>장기 수익률 예측은 불확실하고, 낮은 배당수익률은 높은 이익성장이나 자사주매입으로 보완될 수 있다.<\/li>\n<li>밸류에이션이 높아도 기술혁신, 생산성 개선, 글로벌 이익 증가가 이어지면 과거보다 높은 수익률이 가능할 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글의 재반론은 예측을 하지 말라는 것이 아니라, 기대수익의 원천을 분해해 보라는 것이다. 투자수익은 기업현실에서 오고, 투기수익은 밸류에이션 변화에서 온다.<\/li>\n<li>PER 상승을 영구적 수익원처럼 기대하는 것은 위험하다. 장기 투자자는 배당, 이익성장, 비용 차감 후 수익을 더 보수적으로 봐야 한다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 미국 주식의 달러 수익률과 원화 환산 수익률을 분리해야 한다. 달러 기준 낮은 기대수익도 원화 약세기에는 크게 보일 수 있고, 반대도 가능하다.<\/li>\n<li>한국 채권이나 원화 현금성 자산은 원화 생활비 방어 역할을 한다. 기대수익률만이 아니라 생활통화와 변동성 완충 기능을 함께 고려해야 한다.<\/li>\n<\/ul>","text":"장기적으로 주식시장의 수익 창출을 주도하는 것은 기업의 수익 성장과 배당수익으로 대표되는 사업 실적이다. 오랜 기간 주식시장은 고수익 시대를 구가했고 향후 주식시장이 저수익 시대를 맞이하리라 예상된다. 채권 수익은 구매할 당시의 금리가 가장 중요한 수익원이라 채권 수익률의 예측은 간단하다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 주식수익 분해 배당수익률 + 이익성장률 + PER 변화 장기, 명목, 세전, 배당 재투자 투자수익 + 투기수익 장기수익은 기업성과, 단기수익은 투자심리에 더 크게 좌우 원본 노트 기준선 [보글 본문] 채권수익 예측 매수 당시 금리가 핵심 채권 보유기간, 명목, 세전 시작수익률이 장기 채권수익의 주요 설명변수 채권은 주식보다 장기 기대수익 추정이 상대적으로 단순 원본 노트 기준선 [2017 개정판 데이터][간접복원] 장기 미국 주식 명목수익 연 9%대 중후반 수준 [간접복원] 1900~2016 또는 1926~2016 계열 투자수익 + 투기수익 과거 고수익이 미래에도 그대로 반복된다는 보장은 없음 2017 개정판·장기시장 데이터 2차 인용 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 S&amp;P 500 배당수익률 과거보다 높았음 2024년 1.18%, 2026년 약 1.1% 낮아짐 과거 장기수익률을 그대로 기대하기 어려운 구조 S&amp;P/FactSet/Investopedia 계열 인용 2024 총주주환원수익률 배당 중심 시대와 다름 배당 1.3% + 자사주매입 1.9% = 3.2% 구성 변화 오늘의 투자수익은 배당보다 총주주환원으로 봐야 함 S&amp;P buyback/dividend data 인용 [보강 | 논리 전개] 보글이 “좋은 시절이 다 갔다”고 말한 핵심은 비관론이 아니라 기대수익률의 산식 복원이다. 과거 수익률이 높았던 이유가 높은 배당수익률, 이익성장, PER 상승이었다면, 미래 수익률은 현재 배당수익률과 현재 밸류에이션에서 다시 계산해야 한다. 채권은 주식보다 출발 금리의 설명력이 크다. 낮은 금리에서 산 채권은 장기 기대수익이 낮고, 높은 금리에서 산 채권은 장기 기대수익의 출발점이 높다. [반론] 장기 수익률 예측은 불확실하고, 낮은 배당수익률은 높은 이익성장이나 자사주매입으로 보완될 수 있다. 밸류에이션이 높아도 기술혁신, 생산성 개선, 글로벌 이익 증가가 이어지면 과거보다 높은 수익률이 가능할 수 있다. [보글 측 재반론] 보글의 재반론은 예측을 하지 말라는 것이 아니라, 기대수익의 원천을 분해해 보라는 것이다. 투자수익은 기업현실에서 오고, 투기수익은 밸류에이션 변화에서 온다. PER 상승을 영구적 수익원처럼 기대하는 것은 위험하다. 장기 투자자는 배당, 이익성장, 비용 차감 후 수익을 더 보수적으로 봐야 한다. [한국 투자자 적용] 한국 투자자는 미국 주식의 달러 수익률과 원화 환산 수익률을 분리해야 한다. 달러 기준 낮은 기대수익도 원화 약세기에는 크게 보일 수 있고, 반대도 가능하다. 한국 채권이나 원화 현금성 자산은 원화 생활비 방어 역할을 한다. 기대수익률만이 아니라 생활통화와 변동성 완충 기능을 함께 고려해야 한다."},{"i":11,"title":"10. 펀드 선택의 기준: 건초더미에서 바늘을 찾느니, 그 건초더미를 통째로 사는 게 쉽다","html":"<ul>\n<li>과거에 좋은 성과를 낸 펀드는 찾아내기 쉬우나 그 좋은 성과가 미래에도 계속 유지되리라는 보장은 없다.<\/li>\n<li>펀드의 존속 실패율이 거의 80%에 이른다.<\/li>\n<li>피델리티 마젤란펀드와 피델리티 콘트라펀드 단 2개의 펀드만 시장 평균을 2%p 이상 웃도는 성과를 냈다.<\/li>\n<li>지갑이 두둑해지자 성과가 저조해졌다. (워런 버핏)<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 펀드 존속 실패율<\/td>\n<td style=\"text-align: right;\">거의 80%<\/td>\n<td>보글 장기 표본<\/td>\n<td>폐쇄·합병·소멸 펀드 비율<\/td>\n<td>생존편향 제거 시 장기 펀드 선택 난도 증가<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 2%p 이상 초과 펀드<\/td>\n<td style=\"text-align: right;\">마젤란·콘트라펀드 2개<\/td>\n<td>보글 제시 장기 표본<\/td>\n<td>시장 평균 대비 연 2%p 이상 초과<\/td>\n<td>초과성과는 극소수 예외<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[버핏/외부 인용] Magellan 사례<\/td>\n<td style=\"text-align: right;\">지속적 초과수익이 드문 예외<\/td>\n<td>1984~2022 개별 연도표<\/td>\n<td>펀드 수익률 vs S&amp;P 500<\/td>\n<td>“스타 펀드”는 존재하지만 극소수<\/td>\n<td>Fidelity Magellan 성과표 2차 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>U.S. 대형주 액티브 10년 성공률<\/td>\n<td style=\"text-align: right;\">낮음<\/td>\n<td style=\"text-align: right;\">8%<\/td>\n<td>장기적으로 매우 희박<\/td>\n<td>“스타를 사전에 고르기”가 매우 어려움<\/td>\n<td>Morningstar Active/Passive Barometer 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>대형성장 액티브 펀드 폐쇄율<\/td>\n<td style=\"text-align: right;\">생존편향 중대<\/td>\n<td style=\"text-align: right;\">20년간 약 65% 폐쇄, 1%만 패시브 평균 초과<\/td>\n<td>생존 자체가 드묾<\/td>\n<td>살아남은 소수만 보면 착시 발생<\/td>\n<td>Morningstar Active/Passive Barometer 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>SPIVA Persistence<\/td>\n<td style=\"text-align: right;\">상위권 유지 어려움<\/td>\n<td style=\"text-align: right;\">2020년 상위 사분위 중 2024년 말까지 상위 사분위 잔류 0개<\/td>\n<td>최신 확인<\/td>\n<td>“최근 승자=미래 승자” 가설 부정<\/td>\n<td>SPIVA Persistence Scorecard 2025 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>이 장은 “펀드 선택의 문제”를 생존편향, 선택편향, 평균회귀의 문제로 바꿔 놓는다. 살아남은 펀드만 보면 훌륭한 펀드가 많아 보이지만, 폐쇄·합병된 펀드를 포함하면 투자자가 실제로 겪은 선택지는 훨씬 나빴다.<\/li>\n<li>마젤란펀드와 콘트라펀드 사례는 액티브 운용의 가능성을 보여주는 동시에, 그 가능성이 얼마나 예외적인지도 보여준다. 좋은 펀드를 사후적으로 발견하는 것과 사전에 선택하는 것은 완전히 다른 문제다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>최고의 액티브 운용사는 실제로 존재하며, 운용 철학과 조직문화가 일관되면 장기 알파가 가능하다는 반론이 있다.<\/li>\n<li>단순히 과거수익률만 보지 않고 운용 프로세스, 매니저 지분, 비용, 운용 규모, 스타일 일관성을 함께 보면 선별 가능성이 높아진다는 주장도 가능하다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 재반론은 “가능하다”와 “대다수 투자자가 성공할 확률이 높다”를 구분한다. 사전에 예외적 펀드를 고르고, 성과 부진기에도 유지하고, 규모 확대 이후에도 같은 우위를 누리는 것은 매우 어렵다.<\/li>\n<li>다만 정말로 검증 가능한 운용 철학과 낮은 비용을 갖춘 일부 액티브 펀드의 가능성은 완전히 부정하기 어렵다. 이 지점은 보글식 단순화의 남는 논점이다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자도 국내외 펀드 선택에서 생존편향을 크게 겪는다. 판매사 화면에는 대체로 살아남은 상품과 최근 성과가 좋은 상품이 전면에 배치된다.<\/li>\n<li>따라서 최근 성과, 테마 인기, 운용사 마케팅만으로 펀드를 고르는 것은 보글식 관점에서 경계해야 한다. 선택 기준은 비용, 분산, 회전율, 세후 구조, 장기 유지 가능성이 먼저다.<\/li>\n<\/ul>","text":"과거에 좋은 성과를 낸 펀드는 찾아내기 쉬우나 그 좋은 성과가 미래에도 계속 유지되리라는 보장은 없다. 펀드의 존속 실패율이 거의 80%에 이른다. 피델리티 마젤란펀드와 피델리티 콘트라펀드 단 2개의 펀드만 시장 평균을 2%p 이상 웃도는 성과를 냈다. 지갑이 두둑해지자 성과가 저조해졌다. (워런 버핏) [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 펀드 존속 실패율 거의 80% 보글 장기 표본 폐쇄·합병·소멸 펀드 비율 생존편향 제거 시 장기 펀드 선택 난도 증가 원본 노트 기준선 [보글 본문] 2%p 이상 초과 펀드 마젤란·콘트라펀드 2개 보글 제시 장기 표본 시장 평균 대비 연 2%p 이상 초과 초과성과는 극소수 예외 원본 노트 기준선 [버핏/외부 인용] Magellan 사례 지속적 초과수익이 드문 예외 1984~2022 개별 연도표 펀드 수익률 vs S&amp;P 500 “스타 펀드”는 존재하지만 극소수 Fidelity Magellan 성과표 2차 인용 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 U.S. 대형주 액티브 10년 성공률 낮음 8% 장기적으로 매우 희박 “스타를 사전에 고르기”가 매우 어려움 Morningstar Active/Passive Barometer 2025 인용 대형성장 액티브 펀드 폐쇄율 생존편향 중대 20년간 약 65% 폐쇄, 1%만 패시브 평균 초과 생존 자체가 드묾 살아남은 소수만 보면 착시 발생 Morningstar Active/Passive Barometer 2025 인용 SPIVA Persistence 상위권 유지 어려움 2020년 상위 사분위 중 2024년 말까지 상위 사분위 잔류 0개 최신 확인 “최근 승자=미래 승자” 가설 부정 SPIVA Persistence Scorecard 2025 인용 [보강 | 논리 전개] 이 장은 “펀드 선택의 문제”를 생존편향, 선택편향, 평균회귀의 문제로 바꿔 놓는다. 살아남은 펀드만 보면 훌륭한 펀드가 많아 보이지만, 폐쇄·합병된 펀드를 포함하면 투자자가 실제로 겪은 선택지는 훨씬 나빴다. 마젤란펀드와 콘트라펀드 사례는 액티브 운용의 가능성을 보여주는 동시에, 그 가능성이 얼마나 예외적인지도 보여준다. 좋은 펀드를 사후적으로 발견하는 것과 사전에 선택하는 것은 완전히 다른 문제다. [반론] 최고의 액티브 운용사는 실제로 존재하며, 운용 철학과 조직문화가 일관되면 장기 알파가 가능하다는 반론이 있다. 단순히 과거수익률만 보지 않고 운용 프로세스, 매니저 지분, 비용, 운용 규모, 스타일 일관성을 함께 보면 선별 가능성이 높아진다는 주장도 가능하다. [보글 측 재반론] 보글식 재반론은 “가능하다”와 “대다수 투자자가 성공할 확률이 높다”를 구분한다. 사전에 예외적 펀드를 고르고, 성과 부진기에도 유지하고, 규모 확대 이후에도 같은 우위를 누리는 것은 매우 어렵다. 다만 정말로 검증 가능한 운용 철학과 낮은 비용을 갖춘 일부 액티브 펀드의 가능성은 완전히 부정하기 어렵다. 이 지점은 보글식 단순화의 남는 논점이다. [한국 투자자 적용] 한국 투자자도 국내외 펀드 선택에서 생존편향을 크게 겪는다. 판매사 화면에는 대체로 살아남은 상품과 최근 성과가 좋은 상품이 전면에 배치된다. 따라서 최근 성과, 테마 인기, 운용사 마케팅만으로 펀드를 고르는 것은 보글식 관점에서 경계해야 한다. 선택 기준은 비용, 분산, 회전율, 세후 구조, 장기 유지 가능성이 먼저다."},{"i":12,"title":"11. 평균으로의 회귀: 어제의 승자가 내일의 패자일 수 있다","html":"<ul>\n<li>과거 성과를 바탕으로 펀드를 선택하는 것은 위험천만한 일이다.<\/li>\n<li>평균으로의 회귀(RTM) 원칙이 뮤추얼펀드 업계를 지배한다.<\/li>\n<li>과거 성과 하나만 보고 펀드를 고르는 것은 투자자가 할 수 있는 행동 중 가장 어리석은 행동이다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 평균회귀<\/td>\n<td style=\"text-align: right;\">상위 펀드의 미래 부진<\/td>\n<td>장기<\/td>\n<td>과거 상위권의 미래 사분위 하락<\/td>\n<td>우승자 추종 실패<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] RTM<\/td>\n<td style=\"text-align: right;\">Reversion to the Mean<\/td>\n<td>펀드 장기성과<\/td>\n<td>과거 고성과 이후 평균 또는 평균 이하로 회귀<\/td>\n<td>과거 성과 기반 선택의 실패 이유<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 생존편향 경고<\/td>\n<td style=\"text-align: right;\">생존한 승자만 보면 착시<\/td>\n<td>전권<\/td>\n<td>폐쇄/합병 제외 시 왜곡<\/td>\n<td>투자자 체감 확률 과대평가<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SPIVA Persistence<\/td>\n<td style=\"text-align: right;\">상위권 유지 어려움<\/td>\n<td style=\"text-align: right;\">2020년 상위 사분위 중 2024년 말까지 상위 사분위 잔류 0개<\/td>\n<td>최신 확인<\/td>\n<td>“최근 승자=미래 승자” 가설 부정<\/td>\n<td>SPIVA Persistence Scorecard 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>U.S. 대형주 액티브 장기 성공률<\/td>\n<td style=\"text-align: right;\">낮음<\/td>\n<td style=\"text-align: right;\">10년 기준 약 14%, 15년 기준 약 10%<\/td>\n<td>장기일수록 희소<\/td>\n<td>평균회귀와 비용이 장기 초과성과를 희석<\/td>\n<td>SPIVA U.S. Scorecard Year-End 2025 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>평균회귀는 단순한 통계 용어가 아니라 투자자 행동을 무너뜨리는 메커니즘이다. 펀드가 잘하면 자금이 몰리고, 규모가 커지고, 이전의 스타일 우위가 희석되며, 시장 환경이 바뀌면 과거 승자가 미래 패자가 된다.<\/li>\n<li>과거 수익률 상위 펀드를 사는 행위는 이미 가격과 기대가 올라간 자산을 사는 것과 비슷하다. 보글은 이 과정을 펀드업계의 판촉 논리와 투자자 감정이 결합한 실패 구조로 본다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>모든 평균회귀가 무작위는 아니다. 운용 능력, 리서치 조직, 투자 철학, 비용 통제, 장기 인센티브가 있는 펀드는 평균회귀를 덜 겪을 수 있다는 반론이 가능하다.<\/li>\n<li>과거 성과를 단독 기준이 아니라 질적 분석의 출발점으로 쓰면 의미가 있을 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글의 재반론은 과거 성과가 무가치하다는 것이 아니라, 과거 성과 하나만으로 미래를 예측하는 것은 위험하다는 것이다.<\/li>\n<li>운용 능력 분석은 가능하지만, 대다수 개인투자자에게 그 분석을 일관되게 수행하고 장기 부진기를 버티는 일은 매우 어렵다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자도 “최근 1년 수익률 1위” 상품에 끌리기 쉽다. 그러나 테마형 ETF와 액티브 펀드는 성과가 상단에 나타난 시점에 이미 기대가 상당히 반영돼 있을 수 있다.<\/li>\n<li>평균회귀 관점에서는 최근 성과표보다 운용 전략의 반복 가능성, 비용, 세후 구조, 변동성 감내 가능성을 먼저 봐야 한다.<\/li>\n<\/ul>","text":"과거 성과를 바탕으로 펀드를 선택하는 것은 위험천만한 일이다. 평균으로의 회귀(RTM) 원칙이 뮤추얼펀드 업계를 지배한다. 과거 성과 하나만 보고 펀드를 고르는 것은 투자자가 할 수 있는 행동 중 가장 어리석은 행동이다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 평균회귀 상위 펀드의 미래 부진 장기 과거 상위권의 미래 사분위 하락 우승자 추종 실패 원본 노트 기준선 [보글 본문] RTM Reversion to the Mean 펀드 장기성과 과거 고성과 이후 평균 또는 평균 이하로 회귀 과거 성과 기반 선택의 실패 이유 원본 노트 기준선 [보글 본문] 생존편향 경고 생존한 승자만 보면 착시 전권 폐쇄/합병 제외 시 왜곡 투자자 체감 확률 과대평가 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 SPIVA Persistence 상위권 유지 어려움 2020년 상위 사분위 중 2024년 말까지 상위 사분위 잔류 0개 최신 확인 “최근 승자=미래 승자” 가설 부정 SPIVA Persistence Scorecard 2025 인용 U.S. 대형주 액티브 장기 성공률 낮음 10년 기준 약 14%, 15년 기준 약 10% 장기일수록 희소 평균회귀와 비용이 장기 초과성과를 희석 SPIVA U.S. Scorecard Year-End 2025 인용 [보강 | 논리 전개] 평균회귀는 단순한 통계 용어가 아니라 투자자 행동을 무너뜨리는 메커니즘이다. 펀드가 잘하면 자금이 몰리고, 규모가 커지고, 이전의 스타일 우위가 희석되며, 시장 환경이 바뀌면 과거 승자가 미래 패자가 된다. 과거 수익률 상위 펀드를 사는 행위는 이미 가격과 기대가 올라간 자산을 사는 것과 비슷하다. 보글은 이 과정을 펀드업계의 판촉 논리와 투자자 감정이 결합한 실패 구조로 본다. [반론] 모든 평균회귀가 무작위는 아니다. 운용 능력, 리서치 조직, 투자 철학, 비용 통제, 장기 인센티브가 있는 펀드는 평균회귀를 덜 겪을 수 있다는 반론이 가능하다. 과거 성과를 단독 기준이 아니라 질적 분석의 출발점으로 쓰면 의미가 있을 수 있다. [보글 측 재반론] 보글의 재반론은 과거 성과가 무가치하다는 것이 아니라, 과거 성과 하나만으로 미래를 예측하는 것은 위험하다는 것이다. 운용 능력 분석은 가능하지만, 대다수 개인투자자에게 그 분석을 일관되게 수행하고 장기 부진기를 버티는 일은 매우 어렵다. [한국 투자자 적용] 한국 투자자도 “최근 1년 수익률 1위” 상품에 끌리기 쉽다. 그러나 테마형 ETF와 액티브 펀드는 성과가 상단에 나타난 시점에 이미 기대가 상당히 반영돼 있을 수 있다. 평균회귀 관점에서는 최근 성과표보다 운용 전략의 반복 가능성, 비용, 세후 구조, 변동성 감내 가능성을 먼저 봐야 한다."},{"i":13,"title":"12. 펀드 선택에 조언이 필요합니까?: 투자자문의 명암","html":"<ul>\n<li>공인투자자문가(RIA)는 투자자에게 큰 도움을 줄 수도 있다.<\/li>\n<li>자문가에게 지급하는 보수가 펀드수익률을 상당 부분 깎아먹는 것을 유의하라.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] RIA의 잠재 가치<\/td>\n<td style=\"text-align: right;\">정량보다 기능 중심<\/td>\n<td>전권<\/td>\n<td>자산배분·규율·행동통제 지원<\/td>\n<td>자문가는 도움이 될 수 있으나 비용을 초과해야 함<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[추론] 자문보수 1%p의 장기 비용<\/td>\n<td style=\"text-align: right;\">50년 후 최종자산 큰 차이<\/td>\n<td>50년, 명목, 세전, 배당 재투자<\/td>\n<td>7% 총수익에서 1%p 차감 시 10,000×(1.06)^50<\/td>\n<td>자문보수는 작은 비용이 아니라 복리 비용<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>미국 펀드 전체 자산가중 평균 비용<\/td>\n<td style=\"text-align: right;\">보수는 순수익률 차감<\/td>\n<td style=\"text-align: right;\">2024년 0.34%<\/td>\n<td>비용 하락<\/td>\n<td>자문보수가 붙으면 펀드 자체 비용보다 더 큰 차감요인이 될 수 있음<\/td>\n<td>Morningstar 2024 fee study 인용<\/td>\n<\/tr>\n<tr>\n<td>Vanguard 평균 비용<\/td>\n<td style=\"text-align: right;\">저비용 기준점<\/td>\n<td style=\"text-align: right;\">2024년 0.07%<\/td>\n<td>매우 낮음<\/td>\n<td>초저비용 상품 위에 자문비가 붙는 구조를 별도로 평가해야 함<\/td>\n<td>Vanguard/Reuters/Investopedia 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글은 자문가를 무조건 배척하지 않는다. 자문가가 투자자의 자산배분을 정리하고 폭락장 매도를 막고 세금·계좌 구조를 단순화한다면 실제 가치가 있을 수 있다.<\/li>\n<li>문제는 보수가 자산의 고정 비율로 계속 빠져나갈 때다. 자문가가 제공하는 행동개선 효과가 장기 복리비용보다 커야 자문은 순가치가 된다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>개인투자자는 스스로 행동을 통제하기 어렵기 때문에, 자문보수 1%가 폭락장 투매를 막는다면 충분히 싸다는 반론이 가능하다.<\/li>\n<li>복잡한 세금·상속·은퇴 인출·보험·연금 문제는 단순 인덱스 투자만으로 해결되지 않는다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글의 답은 자문을 쓰더라도 비용과 이해상충을 엄격히 보라는 것이다. 자문은 상품판매가 아니라 투자자 행동과 계획을 개선해야 한다.<\/li>\n<li>자문가가 고비용 상품을 권하거나 잦은 변경을 유도한다면, 자문은 알파가 아니라 비용층을 하나 더 얹는 행위가 된다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 은행·증권사 PB, 보험설계, 랩어카운트, 연금 컨설팅의 판매보수와 이해상충을 구분해야 한다.<\/li>\n<li>자문을 받더라도 “저비용·분산·장기·세후” 원칙을 훼손하는 상품 권유라면 보글식 관점에서는 경계해야 한다.<\/li>\n<\/ul>","text":"공인투자자문가(RIA)는 투자자에게 큰 도움을 줄 수도 있다. 자문가에게 지급하는 보수가 펀드수익률을 상당 부분 깎아먹는 것을 유의하라. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] RIA의 잠재 가치 정량보다 기능 중심 전권 자산배분·규율·행동통제 지원 자문가는 도움이 될 수 있으나 비용을 초과해야 함 원본 노트 기준선 [추론] 자문보수 1%p의 장기 비용 50년 후 최종자산 큰 차이 50년, 명목, 세전, 배당 재투자 7% 총수익에서 1%p 차감 시 10,000×(1.06)^50 자문보수는 작은 비용이 아니라 복리 비용 산식 복원 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 미국 펀드 전체 자산가중 평균 비용 보수는 순수익률 차감 2024년 0.34% 비용 하락 자문보수가 붙으면 펀드 자체 비용보다 더 큰 차감요인이 될 수 있음 Morningstar 2024 fee study 인용 Vanguard 평균 비용 저비용 기준점 2024년 0.07% 매우 낮음 초저비용 상품 위에 자문비가 붙는 구조를 별도로 평가해야 함 Vanguard/Reuters/Investopedia 인용 [보강 | 논리 전개] 보글은 자문가를 무조건 배척하지 않는다. 자문가가 투자자의 자산배분을 정리하고 폭락장 매도를 막고 세금·계좌 구조를 단순화한다면 실제 가치가 있을 수 있다. 문제는 보수가 자산의 고정 비율로 계속 빠져나갈 때다. 자문가가 제공하는 행동개선 효과가 장기 복리비용보다 커야 자문은 순가치가 된다. [반론] 개인투자자는 스스로 행동을 통제하기 어렵기 때문에, 자문보수 1%가 폭락장 투매를 막는다면 충분히 싸다는 반론이 가능하다. 복잡한 세금·상속·은퇴 인출·보험·연금 문제는 단순 인덱스 투자만으로 해결되지 않는다. [보글 측 재반론] 보글의 답은 자문을 쓰더라도 비용과 이해상충을 엄격히 보라는 것이다. 자문은 상품판매가 아니라 투자자 행동과 계획을 개선해야 한다. 자문가가 고비용 상품을 권하거나 잦은 변경을 유도한다면, 자문은 알파가 아니라 비용층을 하나 더 얹는 행위가 된다. [한국 투자자 적용] 한국 투자자는 은행·증권사 PB, 보험설계, 랩어카운트, 연금 컨설팅의 판매보수와 이해상충을 구분해야 한다. 자문을 받더라도 “저비용·분산·장기·세후” 원칙을 훼손하는 상품 권유라면 보글식 관점에서는 경계해야 한다."},{"i":14,"title":"13. Simple is Best: 전체 주식을 보유하는 인덱스펀드에 투자하기","html":"<ul>\n<li>비용이 중요, 과거 성과 기준 펀드 선택하지 않기, RTM<\/li>\n<li>펀드비용률, 판매보수, 회전비용, 세금 그리고 인플레이션 등의 비용들이 장기적으로 투자자산의 구매력을 약화시킨다.<\/li>\n<li>최대한 투자자산을 다각화하는 데 주력하고 투자에 따른 비용을 최소화하며 상식에 따라 행동하라.<\/li>\n<li>자신의 위험 감내 수준을 고려하고 투자 포트폴리오 중 주식의 비중을 신중하게 결정한 후 포지션을 꾸준히 밀고 나가라.<\/li>\n<li>최저 비용 인덱스펀드, 그리고 선취수수료를 부과하지 않는 펀드를 선택해야 한다.<\/li>\n<li>이길 가능성이 있는 시장 부문을 골라 베팅하는 행위는 도박이고 도박은 지는 게임이라는 사실을 명심하라.<\/li>\n<li>다들 선택하려 하는 인기 펀드에 투자하는 것은 필패 전략이다.<\/li>\n<li>복잡성을 피하고 단순성과 간소화 법칙에 의지한다면 성공투자의 단맛을 볼 수 있다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 단순성의 가치<\/td>\n<td style=\"text-align: right;\">숫자보다 구조<\/td>\n<td>전권<\/td>\n<td>저비용·광범위 분산·낮은 매매빈도<\/td>\n<td>설계가 단순할수록 지속 가능<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<ul>\n<li><code>[2017 이후 검증] 이 장은 원리 중심 장으로, 직접 비교 가능한 최신 수치가 제한적이다.<\/code><\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>단순함은 정보 부족의 결과가 아니라 <strong>통제 가능한 변수만 남기는 설계<\/strong>다. 투자에서 통제 가능한 것은 비용, 분산, 보유기간, 세금구조, 행동뿐이다.<\/li>\n<li>단순 포트폴리오는 대개 설명 가능하고, 설명 가능한 포트폴리오는 위기 때도 유지될 가능성이 높다. 보글식 우위는 종종 수학보다 실행력에서 나온다. <code>[후대 해석]<\/code><\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>지나친 단순화는 팩터·국제분산·세금최적화 같은 개선 여지를 놓치게 만든다는 반론이 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글은 개선 여지를 부정하기보다, 개선 시도가 복잡도와 행동오류를 늘려 실제 성과를 해칠 가능성을 더 높게 본다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자에게 단순함은 상품 수를 줄이는 것만 뜻하지 않는다. 계좌 구조, 세금 처리, 환전 빈도까지 단순화하는 것이 포함된다.<\/li>\n<li>특히 연금계좌·과세계좌·해외직접투자를 섞는 경우, 복잡성 비용이 생각보다 크다.<\/li>\n<\/ul>","text":"비용이 중요, 과거 성과 기준 펀드 선택하지 않기, RTM 펀드비용률, 판매보수, 회전비용, 세금 그리고 인플레이션 등의 비용들이 장기적으로 투자자산의 구매력을 약화시킨다. 최대한 투자자산을 다각화하는 데 주력하고 투자에 따른 비용을 최소화하며 상식에 따라 행동하라. 자신의 위험 감내 수준을 고려하고 투자 포트폴리오 중 주식의 비중을 신중하게 결정한 후 포지션을 꾸준히 밀고 나가라. 최저 비용 인덱스펀드, 그리고 선취수수료를 부과하지 않는 펀드를 선택해야 한다. 이길 가능성이 있는 시장 부문을 골라 베팅하는 행위는 도박이고 도박은 지는 게임이라는 사실을 명심하라. 다들 선택하려 하는 인기 펀드에 투자하는 것은 필패 전략이다. 복잡성을 피하고 단순성과 간소화 법칙에 의지한다면 성공투자의 단맛을 볼 수 있다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 단순성의 가치 숫자보다 구조 전권 저비용·광범위 분산·낮은 매매빈도 설계가 단순할수록 지속 가능 원본 노트 기준선 [2017 이후 검증] [2017 이후 검증] 이 장은 원리 중심 장으로, 직접 비교 가능한 최신 수치가 제한적이다. [보강 | 논리 전개] 단순함은 정보 부족의 결과가 아니라 통제 가능한 변수만 남기는 설계 다. 투자에서 통제 가능한 것은 비용, 분산, 보유기간, 세금구조, 행동뿐이다. 단순 포트폴리오는 대개 설명 가능하고, 설명 가능한 포트폴리오는 위기 때도 유지될 가능성이 높다. 보글식 우위는 종종 수학보다 실행력에서 나온다. [후대 해석] [반론] 지나친 단순화는 팩터·국제분산·세금최적화 같은 개선 여지를 놓치게 만든다는 반론이 있다. [보글 측 재반론] 보글은 개선 여지를 부정하기보다, 개선 시도가 복잡도와 행동오류를 늘려 실제 성과를 해칠 가능성을 더 높게 본다. [한국 투자자 적용] 한국 투자자에게 단순함은 상품 수를 줄이는 것만 뜻하지 않는다. 계좌 구조, 세금 처리, 환전 빈도까지 단순화하는 것이 포함된다. 특히 연금계좌·과세계좌·해외직접투자를 섞는 경우, 복잡성 비용이 생각보다 크다."},{"i":15,"title":"14. 채권펀드: 잔인한 산수의 법칙이 더 강하게 적용되는 또 다른 영역","html":"<ul>\n<li>채권시장에는 금리가 지배적인 영향을 미친다.<\/li>\n<li>장기간을 단기 단위로 잘라 살펴보면 채권 수익이 주식 수익을 앞섰던 기간 단위 수가 꽤 많았다.<\/li>\n<li>포트폴리오의 변동성이 줄어들면 시장이 폭락할 때 가치 하락으로 인한 손실을 방어할 수 있다.<\/li>\n<li>단기 포트폴리오는 수익률을 높이는 것보다 변동성 위험을 줄이는 데 초점을 맞추는 투자자에게 적합하다.<\/li>\n<li>장기 포트폴리오는 높은 위험 수준을 적절히 감내하면서 수익을 극대화하겠다는 투자자에게 적합하다.<\/li>\n<li>적정선에서 수익 기회와 시장 변동성 간의 균형점을 찾으려는 투자자는 중기 포트폴리오를 선택하는 것이 바람직하다.<\/li>\n<li>낯선 이여, 잊지 마라. 산수는 과학의 출발점이요, 안전의 어머니다.<\/li>\n<li>주식 인덱스펀드의 가치 요소와 채권 인덱스펀드의 가치 요소는 동일하다.<\/li>\n<li>폭넓은 다각화, 초저비용, 낮은 포트폴리오 회전율, 세금 효율성, 장기 보유 전략<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 채권수익의 원천<\/td>\n<td style=\"text-align: right;\">매수 당시 금리<\/td>\n<td>채권 보유기간, 명목, 세전<\/td>\n<td>시작수익률 ± 금리변동에 따른 가격효과<\/td>\n<td>채권 장기수익은 금리에서 크게 결정<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 채권펀드 비용 효과<\/td>\n<td style=\"text-align: right;\">주식보다 더 강하게 작동<\/td>\n<td>저수익 자산군<\/td>\n<td>순수익률 = 채권 총수익률 - 비용<\/td>\n<td>기대수익이 낮을수록 비용률이 수익에서 차지하는 비중이 큼<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[추론] 채권수익 4%, 비용 0.10%<\/td>\n<td style=\"text-align: right;\">순수익 3.90%<\/td>\n<td>30년, 명목, 세전<\/td>\n<td>10,000×(1.039)^30<\/td>\n<td>저비용 채권펀드의 누적효과<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<tr>\n<td>[추론] 채권수익 4%, 비용 0.75%<\/td>\n<td style=\"text-align: right;\">순수익 3.25%<\/td>\n<td>30년, 명목, 세전<\/td>\n<td>10,000×(1.0325)^30<\/td>\n<td>고비용 채권펀드의 비용잠식<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vanguard 액티브 채권 vs 업계<\/td>\n<td style=\"text-align: right;\">채권도 비용 중요<\/td>\n<td style=\"text-align: right;\">0.10% vs 업계 0.53%<\/td>\n<td>채권 액티브도 비용 격차 큼<\/td>\n<td>채권에서 액티브 성공 가능성이 있더라도 비용통제가 중요<\/td>\n<td>Vanguard/Morningstar 인용<\/td>\n<\/tr>\n<tr>\n<td>TDF 은퇴시점 배분<\/td>\n<td style=\"text-align: right;\">주식+채권 혼합<\/td>\n<td style=\"text-align: right;\">약 50% 주식 / 40% 채권 / 10% 단기 TIPS<\/td>\n<td>방어자산 세분화<\/td>\n<td>채권은 단순 수익자산이 아니라 변동성 완충자산<\/td>\n<td>Vanguard TDF glide path 자료 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>채권펀드에서 비용의 영향은 더 잔인하다. 기대수익률 자체가 주식보다 낮기 때문에 같은 0.5%p 비용도 전체 수익의 더 큰 비중을 가져간다.<\/li>\n<li>채권의 목적은 수익 극대화만이 아니다. 기간, 신용위험, 금리민감도, 포트폴리오 변동성 완충 기능을 함께 봐야 한다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>채권시장은 주식보다 덜 효율적인 구간이 있고, 신용분석·듀레이션 조절·섹터 선택으로 액티브 채권이 비용을 상쇄할 수 있다는 반론이 가능하다.<\/li>\n<li>인플레이션 급등기에는 명목채권이 방어자산 역할을 제대로 못할 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 답은 채권 액티브의 가능성을 완전히 부정하지 않더라도, 저비용·고품질·분산이 먼저라는 것이다. 채권에서 비용은 특히 확정적으로 수익을 깎는다.<\/li>\n<li>인플레이션 위험에는 TIPS나 단기채 등 구조적 보완이 필요할 수 있다. 이 지점은 단순 총채권 인덱스만으로 완전히 해결되지 않는다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자에게 채권은 원화 생활비 방어와 환율 변동 완충 역할을 한다. 해외채권 ETF는 금리위험에 환위험까지 더해질 수 있다.<\/li>\n<li>연금계좌에서 채권형 ETF나 TDF를 쓸 때는 보수, 듀레이션, 환헤지 여부, 과세이연 효과를 함께 봐야 한다.<\/li>\n<\/ul>","text":"채권시장에는 금리가 지배적인 영향을 미친다. 장기간을 단기 단위로 잘라 살펴보면 채권 수익이 주식 수익을 앞섰던 기간 단위 수가 꽤 많았다. 포트폴리오의 변동성이 줄어들면 시장이 폭락할 때 가치 하락으로 인한 손실을 방어할 수 있다. 단기 포트폴리오는 수익률을 높이는 것보다 변동성 위험을 줄이는 데 초점을 맞추는 투자자에게 적합하다. 장기 포트폴리오는 높은 위험 수준을 적절히 감내하면서 수익을 극대화하겠다는 투자자에게 적합하다. 적정선에서 수익 기회와 시장 변동성 간의 균형점을 찾으려는 투자자는 중기 포트폴리오를 선택하는 것이 바람직하다. 낯선 이여, 잊지 마라. 산수는 과학의 출발점이요, 안전의 어머니다. 주식 인덱스펀드의 가치 요소와 채권 인덱스펀드의 가치 요소는 동일하다. 폭넓은 다각화, 초저비용, 낮은 포트폴리오 회전율, 세금 효율성, 장기 보유 전략 [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 채권수익의 원천 매수 당시 금리 채권 보유기간, 명목, 세전 시작수익률 ± 금리변동에 따른 가격효과 채권 장기수익은 금리에서 크게 결정 원본 노트 기준선 [보글 본문] 채권펀드 비용 효과 주식보다 더 강하게 작동 저수익 자산군 순수익률 = 채권 총수익률 - 비용 기대수익이 낮을수록 비용률이 수익에서 차지하는 비중이 큼 원본 노트 기준선 [추론] 채권수익 4%, 비용 0.10% 순수익 3.90% 30년, 명목, 세전 10,000×(1.039)^30 저비용 채권펀드의 누적효과 산식 복원 [추론] 채권수익 4%, 비용 0.75% 순수익 3.25% 30년, 명목, 세전 10,000×(1.0325)^30 고비용 채권펀드의 비용잠식 산식 복원 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 Vanguard 액티브 채권 vs 업계 채권도 비용 중요 0.10% vs 업계 0.53% 채권 액티브도 비용 격차 큼 채권에서 액티브 성공 가능성이 있더라도 비용통제가 중요 Vanguard/Morningstar 인용 TDF 은퇴시점 배분 주식+채권 혼합 약 50% 주식 / 40% 채권 / 10% 단기 TIPS 방어자산 세분화 채권은 단순 수익자산이 아니라 변동성 완충자산 Vanguard TDF glide path 자료 인용 [보강 | 논리 전개] 채권펀드에서 비용의 영향은 더 잔인하다. 기대수익률 자체가 주식보다 낮기 때문에 같은 0.5%p 비용도 전체 수익의 더 큰 비중을 가져간다. 채권의 목적은 수익 극대화만이 아니다. 기간, 신용위험, 금리민감도, 포트폴리오 변동성 완충 기능을 함께 봐야 한다. [반론] 채권시장은 주식보다 덜 효율적인 구간이 있고, 신용분석·듀레이션 조절·섹터 선택으로 액티브 채권이 비용을 상쇄할 수 있다는 반론이 가능하다. 인플레이션 급등기에는 명목채권이 방어자산 역할을 제대로 못할 수 있다. [보글 측 재반론] 보글식 답은 채권 액티브의 가능성을 완전히 부정하지 않더라도, 저비용·고품질·분산이 먼저라는 것이다. 채권에서 비용은 특히 확정적으로 수익을 깎는다. 인플레이션 위험에는 TIPS나 단기채 등 구조적 보완이 필요할 수 있다. 이 지점은 단순 총채권 인덱스만으로 완전히 해결되지 않는다. [한국 투자자 적용] 한국 투자자에게 채권은 원화 생활비 방어와 환율 변동 완충 역할을 한다. 해외채권 ETF는 금리위험에 환위험까지 더해질 수 있다. 연금계좌에서 채권형 ETF나 TDF를 쓸 때는 보수, 듀레이션, 환헤지 여부, 과세이연 효과를 함께 봐야 한다."},{"i":16,"title":"15. 상장지수펀드(ETF): 데이트레이더를 위하여","html":"<ul>\n<li>빈번한 매매만 하지 않는다면 ETF 투자 자체가 잘못된 것은 아니지만 단기적 투기는 지는 게임이고 장기적 투자는 검증된 전략이다.<\/li>\n<li>인덱스펀드의 본질적 특성은 바로 저비용, 폭넓은 다각화, 장기 보유 등이다.<\/li>\n<li>ETF는 섹터, 팩터, 레버리지, 단기 매매를 훨씬 쉽게 만들어 투기성을 키운다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] ETF 비판 포인트<\/td>\n<td style=\"text-align: right;\">구조보다 거래행태<\/td>\n<td>전권<\/td>\n<td>일중거래 가능성 → 투기화<\/td>\n<td>인덱스 철학이 매매 습관에 의해 훼손될 수 있음<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ETF 규모 확대<\/td>\n<td style=\"text-align: right;\">ETF 대중화 초기<\/td>\n<td style=\"text-align: right;\">글로벌 ETF AUM 약 21.9조 달러<\/td>\n<td>대중화 심화<\/td>\n<td>상품 자체는 대성공이지만 거래행태 위험도 확대<\/td>\n<td>ETFGI/글로벌 ETF 보도 인용<\/td>\n<\/tr>\n<tr>\n<td>한국 레버리지 ETF 열풍<\/td>\n<td style=\"text-align: right;\">보글의 거래 위험 경계<\/td>\n<td style=\"text-align: right;\">2026년 5월 한국 개인 신용잔고 60조 원, 단일주 레버리지 ETF 급증<\/td>\n<td>투기 수단화<\/td>\n<td>보글의 우려가 한국 시장에서 더 직접적으로 보임<\/td>\n<td>Reuters Korea leverage ETF 보도<\/td>\n<\/tr>\n<tr>\n<td>고레버리지 ETF 규제 우려<\/td>\n<td style=\"text-align: right;\">투기 수단 확대<\/td>\n<td style=\"text-align: right;\">SEC가 2배 초과 고레버리지 ETF 심사 중단 통보<\/td>\n<td>구조적 우려 확인<\/td>\n<td>“ETF 자체는 중립, 상품 설계와 행동은 중립 아님”<\/td>\n<td>SEC 고레버리지 ETF 보도<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>ETF는 보글 논리와 충돌하지 않는다. 충돌하는 것은 <strong>ETF를 장기보유 도구가 아니라 단기거래 인터페이스로 사용하는 행동<\/strong>이다.<\/li>\n<li>동시에 ETF는 세금 효율 측면에서 강력하다. 미국에서 ETF 투자자는 평균 세금드래그 0.36%를 겪은 반면, 뮤추얼펀드는 1.28%였다. 즉 ETF는 <strong>행동에 따라 약이 되기도 하고 독이 되기도 한다.<\/strong><\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>ETF는 단순히 더 유연한 법적 포장일 뿐이며, 장기투자자에게는 전통 인덱스펀드보다 오히려 더 싸고 더 세금 효율적일 수 있다는 반론이 강하다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글도 광범위한 시장 ETF를 사서 오래 보유하는 행위 자체를 전면 부정한 것은 아니다.<\/li>\n<li>그의 초점은 <strong>도구가 인간 행동을 어떻게 바꾸는가<\/strong>였다. 이 점은 모바일·레버리지·옵션 결합이 일반화된 오늘 더 설득력이 있다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자에게 ETF는 매우 유용하지만, 동시에 레버리지·인버스·단일종목·테마형 ETF 접근성이 지나치게 쉬운 시장이기도 하다.<\/li>\n<li>한국어로 번역하면 보글의 메시지는 “ETF는 좋다. <strong>하지만 ETF를 주식처럼 다루면 나쁘다<\/strong>”에 가깝다.<\/li>\n<\/ul>","text":"빈번한 매매만 하지 않는다면 ETF 투자 자체가 잘못된 것은 아니지만 단기적 투기는 지는 게임이고 장기적 투자는 검증된 전략이다. 인덱스펀드의 본질적 특성은 바로 저비용, 폭넓은 다각화, 장기 보유 등이다. ETF는 섹터, 팩터, 레버리지, 단기 매매를 훨씬 쉽게 만들어 투기성을 키운다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] ETF 비판 포인트 구조보다 거래행태 전권 일중거래 가능성 → 투기화 인덱스 철학이 매매 습관에 의해 훼손될 수 있음 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 ETF 규모 확대 ETF 대중화 초기 글로벌 ETF AUM 약 21.9조 달러 대중화 심화 상품 자체는 대성공이지만 거래행태 위험도 확대 ETFGI/글로벌 ETF 보도 인용 한국 레버리지 ETF 열풍 보글의 거래 위험 경계 2026년 5월 한국 개인 신용잔고 60조 원, 단일주 레버리지 ETF 급증 투기 수단화 보글의 우려가 한국 시장에서 더 직접적으로 보임 Reuters Korea leverage ETF 보도 고레버리지 ETF 규제 우려 투기 수단 확대 SEC가 2배 초과 고레버리지 ETF 심사 중단 통보 구조적 우려 확인 “ETF 자체는 중립, 상품 설계와 행동은 중립 아님” SEC 고레버리지 ETF 보도 [보강 | 논리 전개] ETF는 보글 논리와 충돌하지 않는다. 충돌하는 것은 ETF를 장기보유 도구가 아니라 단기거래 인터페이스로 사용하는 행동 이다. 동시에 ETF는 세금 효율 측면에서 강력하다. 미국에서 ETF 투자자는 평균 세금드래그 0.36%를 겪은 반면, 뮤추얼펀드는 1.28%였다. 즉 ETF는 행동에 따라 약이 되기도 하고 독이 되기도 한다. [반론] ETF는 단순히 더 유연한 법적 포장일 뿐이며, 장기투자자에게는 전통 인덱스펀드보다 오히려 더 싸고 더 세금 효율적일 수 있다는 반론이 강하다. [보글 측 재반론] 보글도 광범위한 시장 ETF를 사서 오래 보유하는 행위 자체를 전면 부정한 것은 아니다. 그의 초점은 도구가 인간 행동을 어떻게 바꾸는가 였다. 이 점은 모바일·레버리지·옵션 결합이 일반화된 오늘 더 설득력이 있다. [한국 투자자 적용] 한국 투자자에게 ETF는 매우 유용하지만, 동시에 레버리지·인버스·단일종목·테마형 ETF 접근성이 지나치게 쉬운 시장이기도 하다. 한국어로 번역하면 보글의 메시지는 “ETF는 좋다. 하지만 ETF를 주식처럼 다루면 나쁘다 ”에 가깝다."},{"i":17,"title":"16. 시장을 이길 수밖에 없는 인덱스펀드: 새로운 패러다임의 출현?","html":"<ul>\n<li>스마트 베타 ETF는 전통적 의미의 인덱스는 아니고 실제로는 액티브 전략을 구사하는 펀드다.<\/li>\n<li>스마트 베타 ETF는 팩터 중심의 포트폴리오를 구축하는 데 초점을 둔다.<\/li>\n<li>가치, 모멘텀, 규모, 매출, 현금흐름, 순이익, 배당금 등 혼합적 요소에 가중치를 부여해 포트폴리오를 구성한다.<\/li>\n<li>전통적 인덱스펀드보다 돈을 훨씬 많이 벌 수 있다고 장담하는 달콤한 유혹에 절대 넘어가지 말라.<\/li>\n<li>좋은 계획을 망치는 가장 큰 적은 완벽한 계획을 꿈꾸는 것이다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 스마트 베타 비판<\/td>\n<td style=\"text-align: right;\">전통 인덱스가 아니라 액티브 전략<\/td>\n<td>전권<\/td>\n<td>팩터·가중치 변경·테마 노출<\/td>\n<td>시장 전체 보유 원칙에서 이탈 가능<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 완벽한 계획의 위험<\/td>\n<td style=\"text-align: right;\">정량보다 행동 원칙<\/td>\n<td>전권<\/td>\n<td>더 좋은 전략을 찾다가 단순한 좋은 전략을 망침<\/td>\n<td>복잡성 비용과 추적오차를 경계<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>상위 10종목 집중<\/td>\n<td style=\"text-align: right;\">버블 추종 비판과 연결<\/td>\n<td style=\"text-align: right;\">S&amp;P 500 상위 10개 약 38%<\/td>\n<td>집중 심화<\/td>\n<td>“지수는 버블도 담는다”는 비판이 과거보다 강해짐<\/td>\n<td>S&amp;P 500 concentration 자료 인용<\/td>\n<\/tr>\n<tr>\n<td>패시브 자산 확대<\/td>\n<td style=\"text-align: right;\">액티브 존재 필요 논쟁<\/td>\n<td style=\"text-align: right;\">미국 패시브 자산이 액티브를 2023년 말 추월<\/td>\n<td>구조 변화<\/td>\n<td>가격발견 기능 우려는 커졌지만, 시장이 아직 액티브를 필요로 하는 정도는 남아 있음<\/td>\n<td>Morningstar/industry flow 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글이 스마트 베타를 경계한 이유는 “팩터가 무조건 틀렸다”가 아니라, 그것이 투자자에게 전통적 인덱스처럼 보이지만 실제로는 특정 위험요인에 베팅하는 액티브 전략이기 때문이다.<\/li>\n<li>팩터 전략은 장기 프리미엄을 가질 수 있지만, 긴 부진구간과 높은 추적오차를 견뎌야 한다. 투자자가 그 차이를 이해하지 못하면 스마트 베타는 “시장 전체 보유”가 아니라 “포장된 성과추구”가 된다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>팩터 투자자는 가치, 규모, 수익성, 모멘텀 같은 요인이 장기적으로 보상받을 수 있으며, 시가총액 가중 인덱스의 과대평가 종목 편입 문제를 보완할 수 있다고 주장한다.<\/li>\n<li>스마트 베타도 투명한 룰과 낮은 비용으로 운용되면 순수 액티브보다 더 나은 절충안일 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 답은 “팩터가 존재할 수 있다”와 “대다수 투자자가 그 팩터를 끝까지 보유할 수 있다”는 별개라는 것이다. 추적오차를 견디지 못하면 팩터 전략은 매수고점·매도저점으로 끝날 수 있다.<\/li>\n<li>다만 시장집중도가 높아진 오늘날에는 순수 시가총액 가중의 약점이 더 뚜렷해진 것도 사실이다. 이 지점은 보글식 총시장 인덱스에 대한 현대적 보완 논점으로 남는다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자에게 스마트 베타 ETF는 매력적이지만, 상품명에 “인덱스”가 붙어도 실제로는 특정 팩터·섹터·테마에 베팅하는 경우가 많다.<\/li>\n<li>국내상장 ETF의 총보수, 기타비용, 추적오차, 세금, 환헤지 여부까지 확인하지 않으면 보글식 저비용 인덱스와 다른 상품을 같은 범주로 착각할 수 있다.<\/li>\n<\/ul>","text":"스마트 베타 ETF는 전통적 의미의 인덱스는 아니고 실제로는 액티브 전략을 구사하는 펀드다. 스마트 베타 ETF는 팩터 중심의 포트폴리오를 구축하는 데 초점을 둔다. 가치, 모멘텀, 규모, 매출, 현금흐름, 순이익, 배당금 등 혼합적 요소에 가중치를 부여해 포트폴리오를 구성한다. 전통적 인덱스펀드보다 돈을 훨씬 많이 벌 수 있다고 장담하는 달콤한 유혹에 절대 넘어가지 말라. 좋은 계획을 망치는 가장 큰 적은 완벽한 계획을 꿈꾸는 것이다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 스마트 베타 비판 전통 인덱스가 아니라 액티브 전략 전권 팩터·가중치 변경·테마 노출 시장 전체 보유 원칙에서 이탈 가능 원본 노트 기준선 [보글 본문] 완벽한 계획의 위험 정량보다 행동 원칙 전권 더 좋은 전략을 찾다가 단순한 좋은 전략을 망침 복잡성 비용과 추적오차를 경계 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 상위 10종목 집중 버블 추종 비판과 연결 S&amp;P 500 상위 10개 약 38% 집중 심화 “지수는 버블도 담는다”는 비판이 과거보다 강해짐 S&amp;P 500 concentration 자료 인용 패시브 자산 확대 액티브 존재 필요 논쟁 미국 패시브 자산이 액티브를 2023년 말 추월 구조 변화 가격발견 기능 우려는 커졌지만, 시장이 아직 액티브를 필요로 하는 정도는 남아 있음 Morningstar/industry flow 인용 [보강 | 논리 전개] 보글이 스마트 베타를 경계한 이유는 “팩터가 무조건 틀렸다”가 아니라, 그것이 투자자에게 전통적 인덱스처럼 보이지만 실제로는 특정 위험요인에 베팅하는 액티브 전략이기 때문이다. 팩터 전략은 장기 프리미엄을 가질 수 있지만, 긴 부진구간과 높은 추적오차를 견뎌야 한다. 투자자가 그 차이를 이해하지 못하면 스마트 베타는 “시장 전체 보유”가 아니라 “포장된 성과추구”가 된다. [반론] 팩터 투자자는 가치, 규모, 수익성, 모멘텀 같은 요인이 장기적으로 보상받을 수 있으며, 시가총액 가중 인덱스의 과대평가 종목 편입 문제를 보완할 수 있다고 주장한다. 스마트 베타도 투명한 룰과 낮은 비용으로 운용되면 순수 액티브보다 더 나은 절충안일 수 있다. [보글 측 재반론] 보글식 답은 “팩터가 존재할 수 있다”와 “대다수 투자자가 그 팩터를 끝까지 보유할 수 있다”는 별개라는 것이다. 추적오차를 견디지 못하면 팩터 전략은 매수고점·매도저점으로 끝날 수 있다. 다만 시장집중도가 높아진 오늘날에는 순수 시가총액 가중의 약점이 더 뚜렷해진 것도 사실이다. 이 지점은 보글식 총시장 인덱스에 대한 현대적 보완 논점으로 남는다. [한국 투자자 적용] 한국 투자자에게 스마트 베타 ETF는 매력적이지만, 상품명에 “인덱스”가 붙어도 실제로는 특정 팩터·섹터·테마에 베팅하는 경우가 많다. 국내상장 ETF의 총보수, 기타비용, 추적오차, 세금, 환헤지 여부까지 확인하지 않으면 보글식 저비용 인덱스와 다른 상품을 같은 범주로 착각할 수 있다."},{"i":18,"title":"17. 벤저민 그레이엄과 인덱스 투자전략: 워런 버핏이 들려준 이야기","html":"<ul>\n<li>적극적 투자자는 기업의 사업 현황을 비롯해 충분한 지식을 갖춰 그 주식의 가치를 제대로 평가할 수 있어야 한다.<\/li>\n<li>투자자는 방어적 포트폴리오에서 얻을 수 있는 그런대로 괜찮은 수익에 만족해야 한다.<\/li>\n<li>월가를 중심으로 한 금융계에 높은 수준의 소명의식과 직업적 사명감을 기대하지 마라.<\/li>\n<li>투자수익은 주식 매매가 아닌 주식 보유 중 이자와 배당금 그리고 장기적 가치 상승에 따른 이익을 챙기는 것이다.<\/li>\n<li>표준적, 보수적 투자 방식 더 나아가 상상력과 창의력은 배제한 전통적이고 현실적인 투자 방식을 고수하라.<\/li>\n<li>개별 종목을 선택하는 것보다는 투자 다각화에 초점을 맞추라.<\/li>\n<li>전통적 인덱스펀드의 중요한 특징 두 가지(폭넓은 투자 다각화, 비용) 때문에 전통적 인덱스펀드 선호도가 높아진다.<\/li>\n<li>대다수의 투자자가 성공하는 데 엄청난 용기와 지식, 판단력, 경험 등이 반드시 필요한 것은 아니다.<\/li>\n<li>자신의 능력치 이상을 욕심내지 않고 기준에서 벗어나지 않는 방어적 접근법으로 안전하게 행동한다면 성공할 수 있다.<\/li>\n<li>인덱스펀드에 투자하면 너무 쉽고 간단하게 만족스러운 성과를 얻을 수 있는데 위험과 비용을 부담할 필요가 없다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[버핏/외부 인용] 방어적 투자자와 인덱스<\/td>\n<td style=\"text-align: right;\">대다수에게 저비용 인덱스가 합리적<\/td>\n<td>장기, 세전/세후 모두 고려<\/td>\n<td>광범위 분산 + 낮은 비용<\/td>\n<td>그레이엄의 방어적 투자 원칙이 보글식 인덱스와 연결<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[버핏/외부 인용] 버핏-헤지펀드 내기<\/td>\n<td style=\"text-align: right;\">인덱스 126%, 헤지펀드 묶음 36%<\/td>\n<td>2008-01-01~2017-12-31, 누적, 비용 차감 후<\/td>\n<td>S&amp;P 500 인덱스펀드 vs 헤지펀드 포트폴리오<\/td>\n<td>복잡한 고비용 전략보다 단순 저비용 전략이 우세했던 실증 사례<\/td>\n<td>Buffett vs Protégé 공개 결과<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>U.S. 대형주 액티브 부진<\/td>\n<td style=\"text-align: right;\">대다수 패배<\/td>\n<td style=\"text-align: right;\">2025년 79% 언더퍼폼<\/td>\n<td>최신 재확인<\/td>\n<td>버핏의 보글 지지 논리가 최신 SPIVA에서도 유지<\/td>\n<td>SPIVA U.S. Scorecard Year-End 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>장기 성공률 희소<\/td>\n<td style=\"text-align: right;\">우수 운용사 선별 어려움<\/td>\n<td style=\"text-align: right;\">10년 8%~14%, 15년 약 10%<\/td>\n<td>장기일수록 희소<\/td>\n<td>그레이엄식 방어적 투자자는 시장을 이기기보다 실수 회피를 우선해야 함<\/td>\n<td>SPIVA/Morningstar 2025 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글이 그레이엄과 버핏을 연결하는 방식은 명확하다. 그레이엄의 방어적 투자자는 종목을 완벽하게 고르려 하지 않고, 충분히 분산하고, 과도한 비용을 피하고, 자신의 한계를 인정한다. 이것이 현대적으로는 저비용 인덱스펀드에 가깝다.<\/li>\n<li>버핏은 예외적 액티브 투자자이지만, 대다수 투자자에게는 저비용 인덱스를 권한다. 이는 “버핏처럼 하라”가 아니라 “버핏처럼 자신의 한계를 인정하라”는 메시지에 가깝다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>그레이엄과 버핏은 모두 능동적 가치투자의 대가다. 이들을 인덱스 투자 정당화에 쓰는 것은 과도한 해석이라는 반론이 가능하다.<\/li>\n<li>능력과 기질을 갖춘 소수 투자자는 인덱스보다 가치투자로 더 좋은 결과를 낼 수 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글은 소수의 능동적 투자자를 부정하지 않는다. 문제는 일반 투자자가 그런 능력과 기질, 시간, 비용통제, 세금효율을 모두 갖추었는가다.<\/li>\n<li>그레이엄의 방어적 투자자 개념은 “대다수는 단순하고 보수적인 길을 택하라”는 쪽에 더 가깝다. 이 점에서 인덱스 투자는 그레이엄의 후대적 구현으로 볼 수 있다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자가 가치투자를 하려면 회계, 사업분석, 밸류에이션, 심리통제, 세금까지 감당해야 한다. 이는 충분히 가치 있는 길일 수 있지만 기본값은 아니다.<\/li>\n<li>방어적 투자자라면 한국에서도 저비용·분산·장기 보유 원칙을 먼저 세우고, 개별종목이나 액티브 전략은 별도 학습과 검증 영역으로 분리하는 편이 보글식이다.<\/li>\n<\/ul>","text":"적극적 투자자는 기업의 사업 현황을 비롯해 충분한 지식을 갖춰 그 주식의 가치를 제대로 평가할 수 있어야 한다. 투자자는 방어적 포트폴리오에서 얻을 수 있는 그런대로 괜찮은 수익에 만족해야 한다. 월가를 중심으로 한 금융계에 높은 수준의 소명의식과 직업적 사명감을 기대하지 마라. 투자수익은 주식 매매가 아닌 주식 보유 중 이자와 배당금 그리고 장기적 가치 상승에 따른 이익을 챙기는 것이다. 표준적, 보수적 투자 방식 더 나아가 상상력과 창의력은 배제한 전통적이고 현실적인 투자 방식을 고수하라. 개별 종목을 선택하는 것보다는 투자 다각화에 초점을 맞추라. 전통적 인덱스펀드의 중요한 특징 두 가지(폭넓은 투자 다각화, 비용) 때문에 전통적 인덱스펀드 선호도가 높아진다. 대다수의 투자자가 성공하는 데 엄청난 용기와 지식, 판단력, 경험 등이 반드시 필요한 것은 아니다. 자신의 능력치 이상을 욕심내지 않고 기준에서 벗어나지 않는 방어적 접근법으로 안전하게 행동한다면 성공할 수 있다. 인덱스펀드에 투자하면 너무 쉽고 간단하게 만족스러운 성과를 얻을 수 있는데 위험과 비용을 부담할 필요가 없다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [버핏/외부 인용] 방어적 투자자와 인덱스 대다수에게 저비용 인덱스가 합리적 장기, 세전/세후 모두 고려 광범위 분산 + 낮은 비용 그레이엄의 방어적 투자 원칙이 보글식 인덱스와 연결 원본 노트 기준선 [버핏/외부 인용] 버핏-헤지펀드 내기 인덱스 126%, 헤지펀드 묶음 36% 2008-01-01~2017-12-31, 누적, 비용 차감 후 S&amp;P 500 인덱스펀드 vs 헤지펀드 포트폴리오 복잡한 고비용 전략보다 단순 저비용 전략이 우세했던 실증 사례 Buffett vs Protégé 공개 결과 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 U.S. 대형주 액티브 부진 대다수 패배 2025년 79% 언더퍼폼 최신 재확인 버핏의 보글 지지 논리가 최신 SPIVA에서도 유지 SPIVA U.S. Scorecard Year-End 2025 인용 장기 성공률 희소 우수 운용사 선별 어려움 10년 8%~14%, 15년 약 10% 장기일수록 희소 그레이엄식 방어적 투자자는 시장을 이기기보다 실수 회피를 우선해야 함 SPIVA/Morningstar 2025 인용 [보강 | 논리 전개] 보글이 그레이엄과 버핏을 연결하는 방식은 명확하다. 그레이엄의 방어적 투자자는 종목을 완벽하게 고르려 하지 않고, 충분히 분산하고, 과도한 비용을 피하고, 자신의 한계를 인정한다. 이것이 현대적으로는 저비용 인덱스펀드에 가깝다. 버핏은 예외적 액티브 투자자이지만, 대다수 투자자에게는 저비용 인덱스를 권한다. 이는 “버핏처럼 하라”가 아니라 “버핏처럼 자신의 한계를 인정하라”는 메시지에 가깝다. [반론] 그레이엄과 버핏은 모두 능동적 가치투자의 대가다. 이들을 인덱스 투자 정당화에 쓰는 것은 과도한 해석이라는 반론이 가능하다. 능력과 기질을 갖춘 소수 투자자는 인덱스보다 가치투자로 더 좋은 결과를 낼 수 있다. [보글 측 재반론] 보글은 소수의 능동적 투자자를 부정하지 않는다. 문제는 일반 투자자가 그런 능력과 기질, 시간, 비용통제, 세금효율을 모두 갖추었는가다. 그레이엄의 방어적 투자자 개념은 “대다수는 단순하고 보수적인 길을 택하라”는 쪽에 더 가깝다. 이 점에서 인덱스 투자는 그레이엄의 후대적 구현으로 볼 수 있다. [한국 투자자 적용] 한국 투자자가 가치투자를 하려면 회계, 사업분석, 밸류에이션, 심리통제, 세금까지 감당해야 한다. 이는 충분히 가치 있는 길일 수 있지만 기본값은 아니다. 방어적 투자자라면 한국에서도 저비용·분산·장기 보유 원칙을 먼저 세우고, 개별종목이나 액티브 전략은 별도 학습과 검증 영역으로 분리하는 편이 보글식이다."},{"i":19,"title":"18. 자산배분 I: 투자를 시작할 때, 자산이 증가하고 있을 때, 은퇴할 때","html":"<ul>\n<li>포트폴리오 수익률 차이의 94%는 자산 배분의 차이에서 비롯된다.<\/li>\n<li>주식펀드와 채권펀드 간 자산 할당 비율에 대한 고민이 수익률을 올리는 데 더 유리할 수 있다.<\/li>\n<li>시대에 따라 배당수익률과 채권 금리가 다르므로 시대 상황에 맞게 자산 배분을 해야 한다.<\/li>\n<li>자산 축적 단계에서는 주식 비율을 높이고 은퇴 단계에서는 채권 비율을 높여라.<\/li>\n<li>위험 감수 능력은 재정 상태, 미래의 재정적 부담, 재정적 의무 청산 시점 등 다양한 요소가 복합적으로 작용해 결정된다.<\/li>\n<li>위험을 감수하려는 의지는 어디까지나 각자의 선호도에 달린 문제다.<\/li>\n<li>주식과 채권 비율, 변동비율 vs 고정비율, 시장 상황에 따른 주식과 채권 비율의 전술적 배분 요소를 채택할지 여부<\/li>\n<li>내재 가치는 배당수익률과 수익성장률이며, 역사적으로 시장의 내재 가치는 국가의 경제성장률과 매우 높은 상관도를 보인다.<\/li>\n<li>내 투자전략은 지금까지 나온 전략 중 최악이다. 지금까지 나왔던 다른 모든 전략을 제외한다면 말이다. (처칠)<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 자산배분 설명력<\/td>\n<td style=\"text-align: right;\">94%<\/td>\n<td>보글 인용 연구 맥락<\/td>\n<td>포트폴리오 수익률 변동 또는 차이를 자산배분이 설명<\/td>\n<td>종목 선택보다 자산군 비중이 중요하다는 메시지<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 나이=채권 비중 규칙<\/td>\n<td style=\"text-align: right;\">규칙형 가이드<\/td>\n<td>전권<\/td>\n<td>예: 40세면 채권 40%<\/td>\n<td>단순 유지 가능성 강조<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 60:40 전통배분<\/td>\n<td style=\"text-align: right;\">대표 배분<\/td>\n<td>전권<\/td>\n<td>주식 60 / 채권 40<\/td>\n<td>행동 지속성과 방어력의 절충<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vanguard TDF 초기 배분<\/td>\n<td style=\"text-align: right;\">단순 주식·채권 혼합<\/td>\n<td style=\"text-align: right;\">약 90% 주식 / 10% 채권<\/td>\n<td>초기 더 공격적<\/td>\n<td>실제 상품은 나이=채권 규칙보다 더 세밀<\/td>\n<td>Vanguard TDF glide path 자료 인용<\/td>\n<\/tr>\n<tr>\n<td>목표시점 배분<\/td>\n<td style=\"text-align: right;\">60:40 계열 논리<\/td>\n<td style=\"text-align: right;\">약 50% 주식 / 40% 채권 / 10% 단기 TIPS<\/td>\n<td>은퇴시점 방어 강화<\/td>\n<td>은퇴 직전·직후 시퀀스 리스크를 반영<\/td>\n<td>Vanguard TDF glide path 자료 인용<\/td>\n<\/tr>\n<tr>\n<td>목표시점 이후<\/td>\n<td style=\"text-align: right;\">은퇴 이후 추가 보수화<\/td>\n<td style=\"text-align: right;\">약 30% 주식 / 50% 채권 / 20% 단기 TIPS<\/td>\n<td>“through”형 구조<\/td>\n<td>은퇴 후 인출기 위험 관리<\/td>\n<td>Vanguard TDF glide path 자료 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>보글이 자산배분을 강조한 이유는 초과수익보다 <strong>생존성<\/strong> 때문이다. 변동성 그 자체보다, 큰 하락장에서 전략을 버릴 가능성이 더 위험하다.<\/li>\n<li>“나이=채권”은 정밀 공식이 아니라 실행 규칙이다. 오늘날 TDF는 이를 더 세밀한 글라이드패스로 구현하지만, 철학은 같다. 투자자가 <strong>지속 가능한 위험만 지라<\/strong>는 것이다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>나이만으로 위험을 정하면 소득안정성, 연금 수준, 인간자본, 밸류에이션, 은퇴시점 등 핵심 변수를 무시한다는 반론이 있다.<\/li>\n<li>또한 100% 주식 인덱스가 장기 기대수익은 더 높으므로 젊은 투자자에겐 더 합리적이라는 주장도 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 답은 최적화보다 <strong>유지 가능성<\/strong>이다. 최고의 기대수익보다, 하락기에도 버릴 가능성이 낮은 배분이 실제로 더 낫다.<\/li>\n<li>다만 은퇴 직전 투자자에게는 시퀀스 리스크 때문에 보글식 단순 규칙보다 세밀한 인출·완충자산 설계가 더 필요할 수 있다. 이 지점은 TDF 연구가 보글을 보완한다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자에게 채권 비중은 단순히 수익률 문제가 아니라 <strong>원화 생활비 방어자산<\/strong> 문제이기도 하다.<\/li>\n<li>미국 달러 자산이 많더라도 은퇴 인출이 원화 기준이면, 환율과 금리, 국내 세제까지 반영한 혼합형 사고가 필요하다.<\/li>\n<\/ul>","text":"포트폴리오 수익률 차이의 94%는 자산 배분의 차이에서 비롯된다. 주식펀드와 채권펀드 간 자산 할당 비율에 대한 고민이 수익률을 올리는 데 더 유리할 수 있다. 시대에 따라 배당수익률과 채권 금리가 다르므로 시대 상황에 맞게 자산 배분을 해야 한다. 자산 축적 단계에서는 주식 비율을 높이고 은퇴 단계에서는 채권 비율을 높여라. 위험 감수 능력은 재정 상태, 미래의 재정적 부담, 재정적 의무 청산 시점 등 다양한 요소가 복합적으로 작용해 결정된다. 위험을 감수하려는 의지는 어디까지나 각자의 선호도에 달린 문제다. 주식과 채권 비율, 변동비율 vs 고정비율, 시장 상황에 따른 주식과 채권 비율의 전술적 배분 요소를 채택할지 여부 내재 가치는 배당수익률과 수익성장률이며, 역사적으로 시장의 내재 가치는 국가의 경제성장률과 매우 높은 상관도를 보인다. 내 투자전략은 지금까지 나온 전략 중 최악이다. 지금까지 나왔던 다른 모든 전략을 제외한다면 말이다. (처칠) [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 자산배분 설명력 94% 보글 인용 연구 맥락 포트폴리오 수익률 변동 또는 차이를 자산배분이 설명 종목 선택보다 자산군 비중이 중요하다는 메시지 원본 노트 기준선 [보글 본문] 나이=채권 비중 규칙 규칙형 가이드 전권 예: 40세면 채권 40% 단순 유지 가능성 강조 원본 노트 기준선 [보글 본문] 60:40 전통배분 대표 배분 전권 주식 60 / 채권 40 행동 지속성과 방어력의 절충 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 Vanguard TDF 초기 배분 단순 주식·채권 혼합 약 90% 주식 / 10% 채권 초기 더 공격적 실제 상품은 나이=채권 규칙보다 더 세밀 Vanguard TDF glide path 자료 인용 목표시점 배분 60:40 계열 논리 약 50% 주식 / 40% 채권 / 10% 단기 TIPS 은퇴시점 방어 강화 은퇴 직전·직후 시퀀스 리스크를 반영 Vanguard TDF glide path 자료 인용 목표시점 이후 은퇴 이후 추가 보수화 약 30% 주식 / 50% 채권 / 20% 단기 TIPS “through”형 구조 은퇴 후 인출기 위험 관리 Vanguard TDF glide path 자료 인용 [보강 | 논리 전개] 보글이 자산배분을 강조한 이유는 초과수익보다 생존성 때문이다. 변동성 그 자체보다, 큰 하락장에서 전략을 버릴 가능성이 더 위험하다. “나이=채권”은 정밀 공식이 아니라 실행 규칙이다. 오늘날 TDF는 이를 더 세밀한 글라이드패스로 구현하지만, 철학은 같다. 투자자가 지속 가능한 위험만 지라 는 것이다. [반론] 나이만으로 위험을 정하면 소득안정성, 연금 수준, 인간자본, 밸류에이션, 은퇴시점 등 핵심 변수를 무시한다는 반론이 있다. 또한 100% 주식 인덱스가 장기 기대수익은 더 높으므로 젊은 투자자에겐 더 합리적이라는 주장도 있다. [보글 측 재반론] 보글식 답은 최적화보다 유지 가능성 이다. 최고의 기대수익보다, 하락기에도 버릴 가능성이 낮은 배분이 실제로 더 낫다. 다만 은퇴 직전 투자자에게는 시퀀스 리스크 때문에 보글식 단순 규칙보다 세밀한 인출·완충자산 설계가 더 필요할 수 있다. 이 지점은 TDF 연구가 보글을 보완한다. [한국 투자자 적용] 한국 투자자에게 채권 비중은 단순히 수익률 문제가 아니라 원화 생활비 방어자산 문제이기도 하다. 미국 달러 자산이 많더라도 은퇴 인출이 원화 기준이면, 환율과 금리, 국내 세제까지 반영한 혼합형 사고가 필요하다."},{"i":20,"title":"19. 자산배분 II: 노후대비용 투자와 재무설계","html":"<ul>\n<li>수익률로만 봤을 때 저비용 S&amp;P500 인덱스펀드가 나을 수도 있지만 변동성을 고려하면 채권 혼합 인덱스펀드가 나은 선택이다.<\/li>\n<li>특히 시장 상황이 좋지 않을 때는 혼합 인덱스펀드가 훨씬 유리하다.<\/li>\n<li>장투 및 주기적인 폭락에 개의치 않을 투자자는 S&amp;P500 ETF 비율을 100%로 하는 것이 가장 좋은 선택지일 수 있다.<\/li>\n<li>소심한 투자자라면 주식과 채권의 비율이 60:40으로 고정된 혼합형 인덱스펀드가 최적의 선택지일 것이다.<\/li>\n<li>미국 시장 외 해외 주식에 투자할 이유가 없다.<\/li>\n<li>은퇴 시점에 다다를수록 점차 더 보수적으로 자산 배분 비율이 조정되는 타깃데이트펀드(TDF)도 고려해볼 수 있다.<\/li>\n<li>가능한 한 많은 정보, 지식을 바탕으로 적절한 판단을 내린 후 융통성을 발휘해 상황에 맞춰 비율을 조정하라.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 60:40 혼합형<\/td>\n<td style=\"text-align: right;\">주식 60 / 채권 40<\/td>\n<td>장기, 명목, 세전, 리밸런싱 가정<\/td>\n<td>주식 성장 + 채권 방어<\/td>\n<td>변동성을 견디기 어려운 투자자를 위한 단순 절충안<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 나이=채권 비중<\/td>\n<td style=\"text-align: right;\">예: 60세 전후 채권 60~70%<\/td>\n<td>은퇴 전후<\/td>\n<td>연령에 따른 위험 축소 규칙<\/td>\n<td>정밀 공식이 아니라 실행 가능한 휴리스틱<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[보글 본문] 해외주식 제한<\/td>\n<td style=\"text-align: right;\">미국 투자자는 해외 비중 낮게 또는 20% 이하<\/td>\n<td>미국 거주·달러 생활비 전제<\/td>\n<td>미국 기업의 글로벌 매출 간접 노출<\/td>\n<td>미국 투자자 관점의 자국 중심 논리<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vanguard TDF 초기 배분<\/td>\n<td style=\"text-align: right;\">단순 주식·채권 혼합<\/td>\n<td style=\"text-align: right;\">약 90% 주식 / 10% 채권<\/td>\n<td>초기 더 공격적<\/td>\n<td>실제 TDF는 나이 규칙보다 세밀한 글라이드패스 사용<\/td>\n<td>Vanguard TDF glide path 자료 인용<\/td>\n<\/tr>\n<tr>\n<td>목표시점 배분<\/td>\n<td style=\"text-align: right;\">은퇴시점 보수화<\/td>\n<td style=\"text-align: right;\">약 50% 주식 / 40% 채권 / 10% 단기 TIPS<\/td>\n<td>은퇴 직전 방어 강화<\/td>\n<td>시퀀스 리스크를 반영<\/td>\n<td>Vanguard TDF glide path 자료 인용<\/td>\n<\/tr>\n<tr>\n<td>FTSE All-World 내 미국 비중<\/td>\n<td style=\"text-align: right;\">미국 중심 사고<\/td>\n<td style=\"text-align: right;\">2025년 7월 기준 60% 초과<\/td>\n<td>미국 비중 매우 큼<\/td>\n<td>글로벌 시총 가중만 써도 미국이 코어가 됨<\/td>\n<td>FTSE All-World 구성 자료 인용<\/td>\n<\/tr>\n<tr>\n<td>MSCI World 내 미국 비중<\/td>\n<td style=\"text-align: right;\">미국 우위 지속<\/td>\n<td style=\"text-align: right;\">2026년 Reuters 보도 기준 70% 초과<\/td>\n<td>개발국 지수는 미국 편중 심함<\/td>\n<td>미국 예외주의가 지수에도 반영<\/td>\n<td>MSCI World/Reuters 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>이 장은 보글 원칙의 예외와 현실 조정을 다룬다. 수익률만 보면 100% 주식이 유리할 수 있지만, 은퇴 전후에는 큰 손실의 순서가 포트폴리오 생존성을 좌우한다.<\/li>\n<li>해외주식 불필요 주장은 미국 거주자, 달러 생활비, 미국 자본시장 우위라는 전제에서 강하다. 이 전제를 벗어나면 결론도 달라진다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>글로벌 분산 옹호자는 미국 기업의 해외매출이 해외주식 보유를 대체하지 못한다고 본다. 국가, 통화, 밸류에이션, 섹터 집중을 분산하려면 미국 외 자산도 필요하다는 반론이 강하다.<\/li>\n<li>자산배분론자는 나이만으로 채권 비중을 정하는 것은 인간자본, 연금, 부채, 은퇴시점, 위험선호를 무시한다고 비판한다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 재반론은 단순성이다. 너무 정교한 글로벌·전술 배분은 비용, 세금, 행동오류를 늘릴 수 있다.<\/li>\n<li>다만 한국 투자자에게 “미국 외 해외주식 불필요
