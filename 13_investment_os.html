r>\n<\/thead>\n<tbody>\n<tr>\n<td>로널드 리드<\/td>\n<td style=\"text-align: right;\">0, 9, 10<\/td>\n<td>외형보다 습관<\/td>\n<td>검소함과 장기 지속이 부를 만든다<\/td>\n<\/tr>\n<tr>\n<td>빌 게이츠와 켄트 에번스<\/td>\n<td style=\"text-align: right;\">2<\/td>\n<td>행운·경로의존성<\/td>\n<td>한 개인의 결과를 과도하게 일반화하지 말라<\/td>\n<\/tr>\n<tr>\n<td>라잣 굽타<\/td>\n<td style=\"text-align: right;\">3<\/td>\n<td>충분함의 부재, 지위 탐닉<\/td>\n<td>이미 가진 것을 걸지 말라<\/td>\n<\/tr>\n<tr>\n<td>버니 메이도프<\/td>\n<td style=\"text-align: right;\">3, 18<\/td>\n<td>탐욕·서사 신뢰<\/td>\n<td>너무 매끈한 수익 이야기를 경계하라<\/td>\n<\/tr>\n<tr>\n<td>워런 버핏<\/td>\n<td style=\"text-align: right;\">4<\/td>\n<td>시간의 힘<\/td>\n<td>수익률보다 투자 생명을 늘려라<\/td>\n<\/tr>\n<tr>\n<td>짐 사이먼스<\/td>\n<td style=\"text-align: right;\">4<\/td>\n<td>고수익의 한계와 구조 차이<\/td>\n<td>화려한 수익률보다 현실적 지속성이 중요<\/td>\n<\/tr>\n<tr>\n<td>제시 리버모어<\/td>\n<td style=\"text-align: right;\">5<\/td>\n<td>성과와 생존의 분리<\/td>\n<td>부자가 되는 것과 남는 것은 다르다<\/td>\n<\/tr>\n<tr>\n<td>하인츠 베르그륀<\/td>\n<td style=\"text-align: right;\">6<\/td>\n<td>소수 꼬리 성과<\/td>\n<td>몇 건의 대박이 전체를 지배한다<\/td>\n<\/tr>\n<tr>\n<td>디즈니 백설공주<\/td>\n<td style=\"text-align: right;\">6<\/td>\n<td>비대칭 보상<\/td>\n<td>작게 여러 번 지고 크게 한 번 이기는 구조<\/td>\n<\/tr>\n<tr>\n<td>닷컴 버블<\/td>\n<td style=\"text-align: right;\">15, 16<\/td>\n<td>시간지평 충돌, 서사 과열<\/td>\n<td>남의 게임을 따라 하지 말라<\/td>\n<\/tr>\n<tr>\n<td>1929 crash<\/td>\n<td style=\"text-align: right;\">12<\/td>\n<td>상상력 실패<\/td>\n<td>과거로 미래를 다 설명할 수 없다<\/td>\n<\/tr>\n<tr>\n<td>End-of-history illusion<\/td>\n<td style=\"text-align: right;\">14<\/td>\n<td>미래 자기 과소변화<\/td>\n<td>극단적 계획보다 유연한 계획<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"스토리/인물 관련 장 보여주는 인간 심리 투자 교훈 로널드 리드 0, 9, 10 외형보다 습관 검소함과 장기 지속이 부를 만든다 빌 게이츠와 켄트 에번스 2 행운·경로의존성 한 개인의 결과를 과도하게 일반화하지 말라 라잣 굽타 3 충분함의 부재, 지위 탐닉 이미 가진 것을 걸지 말라 버니 메이도프 3, 18 탐욕·서사 신뢰 너무 매끈한 수익 이야기를 경계하라 워런 버핏 4 시간의 힘 수익률보다 투자 생명을 늘려라 짐 사이먼스 4 고수익의 한계와 구조 차이 화려한 수익률보다 현실적 지속성이 중요 제시 리버모어 5 성과와 생존의 분리 부자가 되는 것과 남는 것은 다르다 하인츠 베르그륀 6 소수 꼬리 성과 몇 건의 대박이 전체를 지배한다 디즈니 백설공주 6 비대칭 보상 작게 여러 번 지고 크게 한 번 이기는 구조 닷컴 버블 15, 16 시간지평 충돌, 서사 과열 남의 게임을 따라 하지 말라 1929 crash 12 상상력 실패 과거로 미래를 다 설명할 수 없다 End-of-history illusion 14 미래 자기 과소변화 극단적 계획보다 유연한 계획"},{"i":24,"title":"하우절식 투자 원칙 20문장","html":"<ul>\n<li>남의 돈 행동을 평가하기 전에 그가 어떤 시대를 살았는지 먼저 본다.<\/li>\n<li>한 사람의 성공담보다 여러 사람에게 반복된 원칙을 더 신뢰한다.<\/li>\n<li>“충분함”을 정해 두지 않으면 수익이 아니라 욕망이 나를 운전한다.<\/li>\n<li>높은 수익률보다 긴 투자 생명이 복리에 더 중요하다.<\/li>\n<li>파산을 피하는 것이 비범한 한 번의 승리보다 중요하다.<\/li>\n<li>손익 구조는 적중률보다 중요하다.<\/li>\n<li>돈의 최고 용도는 시간 통제권을 늘리는 것이다.<\/li>\n<li>과시 소비는 대개 존경이 아니라 착시를 산다.<\/li>\n<li>진짜 부는 소비하지 않고 남겨 둔 자산이다.<\/li>\n<li>소득보다 저축률이 더 강한 통제 변수다.<\/li>\n<li>정서적으로 지속 가능한 전략이 장기적으로 더 합리적이다.<\/li>\n<li>미래를 정확히 맞히려 하기보다 놀라움을 견딜 구조를 만들어라.<\/li>\n<li>안전마진은 예측 실패를 허용하는 기술이다.<\/li>\n<li>미래의 내가 바뀔 것을 전제로 계획하라.<\/li>\n<li>변동성은 장기 수익의 입장료다.<\/li>\n<li>남과 다른 시간지평을 가졌다면 남과 다른 가격 판단을 해도 된다.<\/li>\n<li>비관이 더 똑똑해 보인다고 해서 더 정확한 것은 아니다.<\/li>\n<li>지나치게 매끈한 설명과 예측은 의심할 가치가 있다.<\/li>\n<li>투자 원칙은 많이 아는 것보다 꾸준히 지키는 것이 중요하다.<\/li>\n<li>대부분의 개인에게 단순하고 저비용이며 오래 유지할 수 있는 전략이 가장 강하다.<\/li>\n<\/ul>","text":"남의 돈 행동을 평가하기 전에 그가 어떤 시대를 살았는지 먼저 본다. 한 사람의 성공담보다 여러 사람에게 반복된 원칙을 더 신뢰한다. “충분함”을 정해 두지 않으면 수익이 아니라 욕망이 나를 운전한다. 높은 수익률보다 긴 투자 생명이 복리에 더 중요하다. 파산을 피하는 것이 비범한 한 번의 승리보다 중요하다. 손익 구조는 적중률보다 중요하다. 돈의 최고 용도는 시간 통제권을 늘리는 것이다. 과시 소비는 대개 존경이 아니라 착시를 산다. 진짜 부는 소비하지 않고 남겨 둔 자산이다. 소득보다 저축률이 더 강한 통제 변수다. 정서적으로 지속 가능한 전략이 장기적으로 더 합리적이다. 미래를 정확히 맞히려 하기보다 놀라움을 견딜 구조를 만들어라. 안전마진은 예측 실패를 허용하는 기술이다. 미래의 내가 바뀔 것을 전제로 계획하라. 변동성은 장기 수익의 입장료다. 남과 다른 시간지평을 가졌다면 남과 다른 가격 판단을 해도 된다. 비관이 더 똑똑해 보인다고 해서 더 정확한 것은 아니다. 지나치게 매끈한 설명과 예측은 의심할 가치가 있다. 투자 원칙은 많이 아는 것보다 꾸준히 지키는 것이 중요하다. 대부분의 개인에게 단순하고 저비용이며 오래 유지할 수 있는 전략이 가장 강하다."},{"i":25,"title":"출처 목록","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>출처명<\/th>\n<th>저자/기관<\/th>\n<th style=\"text-align: right;\">연도<\/th>\n<th>사용한 내용<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>원서/기준선<\/td>\n<td>업로드 노트 <code>독서_돈의_심리학.md<\/code><\/td>\n<td>사용자<\/td>\n<td style=\"text-align: right;\">2024<\/td>\  구분했는지: 예. <code>[하우절 본문]<\/code>, <code>[저자 인터뷰/외부 글]<\/code>, <code>[후대 해석]<\/code>, <code>[데이터]<\/code>, <code>[추론]<\/code>을 각 장의 설명 문맥에서 구분했다.<\/li>\n<\/ul>","text":"기존 불릿 보존 여부: 예. 업로드 노트의 기존 불릿은 삭제·요약·재배열 없이 그대로 유지했다. 장별 사례 복원 여부: 예. 다만 7, 11, 13, 18장은 본질적으로 논지 중심이어서 무리한 일화 추가를 피했고, 확인 미흡 항목은 명시적으로 표시했다. 장별 데이터 출처 표기 여부: 예. 데이터가 있는 장은 표와 주석으로 출처 성격을 표시했다. 불확실한 일화를 단정하지 않았는지: 예. 리처드 퍼스콘 세부 수치, 에이브러햄 저먼스키, 리크 게린 레버리지 원문, 11장·13장 특정 사례는 [불확실] 또는 [출처 추가 확인 필요] 로 표시했다. 책 본문과 후대 해석을 구분했는지: 예. [하우절 본문] , [저자 인터뷰/외부 글] , [후대 해석] , [데이터] , [추론] 을 각 장의 설명 문맥에서 구분했다."},{"i":27,"title":"Open questions / limitations","html":"<ul>\n<li>리처드 퍼스콘 대비 사례는 책에서 널리 언급되지만, 이번 조사에서는 파산 시점·금액·직위 서술의 원출처를 끝까지 확정하지 못했다.<\/li>\n<li>“에이브러햄 저먼스키”는 표기 자체가 2차 요약마다 다를 가능성이 있어, 신뢰 가능한 외부 확인이 필요하다.<\/li>\n<li>11장의 말라리아 요법 비유, 주택대출 조기상환 사례, 13장의 카드카운터 비유는 책 본문 원문 또는 저자 직접 발언과 대조하면 더 정확해질 수 있다.<\/li>\n<li>7장의 앵거스 캠벨 관련 연결은 서지 존재는 확인했지만, 하우절이 정확히 어떤 문맥으로 인용했는지 원서 대조가 남아 있다.<\/li>\n<\/ul>","text":"리처드 퍼스콘 대비 사례는 책에서 널리 언급되지만, 이번 조사에서는 파산 시점·금액·직위 서술의 원출처를 끝까지 확정하지 못했다. “에이브러햄 저먼스키”는 표기 자체가 2차 요약마다 다를 가능성이 있어, 신뢰 가능한 외부 확인이 필요하다. 11장의 말라리아 요법 비유, 주택대출 조기상환 사례, 13장의 카드카운터 비유는 책 본문 원문 또는 저자 직접 발언과 대조하면 더 정확해질 수 있다. 7장의 앵거스 캠벨 관련 연결은 서지 존재는 확인했지만, 하우절이 정확히 어떤 문맥으로 인용했는지 원서 대조가 남아 있다."},{"i":28,"title":"관련 노트","html":"<ul>\n<li>[[독서_돈의_심리학 (AI)|돈의 심리학 (AI 요약)]]<\/li>\n<\/ul>","text":"[[독서_돈의_심리학 (AI)|돈의 심리학 (AI 요약)]]"},{"i":29,"title":"추가 검증 반영 내역","html":"<ul>\n<li>기준 파일: <code>02_돈의심리학_deepresearch_v1.md<\/code><\/li>\n<li>추가 검증 파일: <code>02_돈의심리학_deepresearch_v1_add.md<\/code><\/li>\n<li>반영 방식: 기존 frontmatter, 제목, 장 헤더, 기존 불릿을 보존하고, 확인된 항목은 보강했으며 직접 원전 확인이 부족한 항목은 불확실 태그를 유지했다.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>검증 결과<\/th>\n<th>최종 처리<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>리처드 퍼스콘 사례<\/td>\n<td>서문의 일반 논지와 Ronald Read는 확인 가능하나 Fuscone 세부 파산 경로는 직접 잠금 실패<\/td>\n<td><code>[출처 추가 확인 필요]<\/code> 유지<\/td>\n<\/tr>\n<tr>\n<td>에이브러햄 저먼스키 표기<\/td>\n<td>고신뢰 자료로 확인 실 26.03.30<\/p>\n<hr />\n<p><em>기준선: 아래 각 장의 <code>기존 노트<\/code> 불릿은 업로드한 파일을 보존했고, 새로 추가한 것은 보강·연결·적용·검증 영역뿐이다.<\/em><\/p>","text":"title: \"[독서] 돈, 뜨겁게 사랑하고 차갑게 다루어라\" aliases: [\"돈, 뜨겁게 사랑하고 차갑게 다루어라\", \"코스톨라니\", \"앙드레 코스톨라니\"] type: book-note-personal category: 독서 author: 앙드레 코스톨라니 date_read: 2026-03-30 date: 2026-03-30 status: complete tags: - 독서 - 투자 - 심리 - 코스톨라니 읽은 날짜: 2026.03.30 기준선: 아래 각 장의 기존 노트 불릿은 업로드한 파일을 보존했고, 새로 추가한 것은 보강·연결·적용·검증 영역뿐이다."},{"i":1,"title":"0. 서문","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>특별한 비법이 있을 거라 기대하지 마십시오.<\/li>\n<li>특별한 비법은 존재하지 않으며, 이는 특정 주식을 팔아 대중에게서 돈을 뜯어내려는 은행이나 투자 관련 단체의 수작입니다.<\/li>\n<li>세계적인 우량주를 사들인 다음 약국에서 수면제를 사서 먹고 몇 년간 푹 자라.<\/li>\n<li>아이들의 교육에 투자하십시오!<\/li>\n<li>인생을 즐기십시오.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 서문은 책 전체의 운영 원칙을 먼저 못 박는다. 첫째, 증권시장은 비법 시장이 아니라 심리와 자금의 시장이다. 둘째, 좋은 자산을 적절한 가격에 샀다면 매일 흔들리지 말고 시간을 자기 편으로 돌려야 한다. 셋째, 투자 성과는 종목 추천보다 삶의 태도, 자금 구조, 인내의 문제에 더 가깝다.<\/li>\n<li>[코스톨라니 본문] 따라서 서문은 “비밀 공식 부정 → 우량 자산 + 시간 → 삶을 침식하지 않는 투자”라는 3단 구도를 제시한다. 이 책이 기계적 매매법이 아니라 투자자 훈련서라는 점도 여기서 분명해진다.<\/li>\n<li>[코스톨라니 본문] 적용 대상은 장기투자자와 순종투자자다. 단기투기꾼에게도 읽을 가치는 있지만, 이 장은 빠른 회전보다 느린 판단과 자본 보존을 전제로 한다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>장기투자<\/li>\n<li>정보/전문가 회의론<\/li>\n<li>10가지 권고·금기<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 교육 자료는 코스톨라니의 유명한 “수면제 시간”을 달걀 2단계와 5단계의 “서둘러 행동하지 말고 보유 혹은 대기하라”는 맥락으로 설명한다. 즉 이 표현은 무조건 잠들라는 뜻이 아니라, 이미 맞는 포지션을 잡았다면 과잉행동을 줄이라는 뜻에 가깝다. 다만 이번 조사에서 해당 표현의 독일어 원문을 1차 문헌으로 직접 확인하지는 못했다. [원어 확인 필요] (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 2020년대 기준으로 이 조언은 “광범위 ETF·현금흐름이 탄탄한 우량주·낮은 레버리지” 조합에 특히 유효하다. 금리 전환기와 AI·반도체 같은 대세 산업에서는 가격 변동성이 커도, 포지션이 맞다면 과도한 뉴스 소비와 잦은 매매가 오히려 성과를 깎는다. 반대로 질 낮은 테마주를 사 놓고 “수면제 투자”라고 부르는 것은 코스톨라니식이 아니다. 최근 한국 시장에서도 레버리지 ETF와 신용 융자 급증이 개인투자자 변동성을 키웠다. 이는 “가만히 있는 힘”이 아니라 “위험 구조를 잘못 설계한 결과”에 더 가깝다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“좋은 주식이면 아무 때나 사서 그냥 자면 된다”는 뜻이 아니다.<\/li>\n<li>“정보를 보지 말라”가 아니라, <strong>이미 시장에 녹아든 정보에 과잉반응하지 말라<\/strong>는 뜻이다.<\/li>\n<li>“수면제 투자”는 우량 자산·낮은 레버리지·긴 시간축이 전제될 때만 성립한다.<\/li>\n<\/ul>","text":"기존 노트 특별한 비법이 있을 거라 기대하지 마십시오. 특별한 비법은 존재하지 않으며, 이는 특정 주식을 팔아 대중에게서 돈을 뜯어내려는 은행이나 투자 관련 단체의 수작입니다. 세계적인 우량주를 사들인 다음 약국에서 수면제를 사서 먹고 몇 년간 푹 자라. 아이들의 교육에 투자하십시오! 인생을 즐기십시오. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 서문은 책 전체의 운영 원칙을 먼저 못 박는다. 첫째, 증권시장은 비법 시장이 아니라 심리와 자금의 시장이다. 둘째, 좋은 자산을 적절한 가격에 샀다면 매일 흔들리지 말고 시간을 자기 편으로 돌려야 한다. 셋째, 투자 성과는 종목 추천보다 삶의 태도, 자금 구조, 인내의 문제에 더 가깝다. [코스톨라니 본문] 따라서 서문은 “비밀 공식 부정 → 우량 자산 + 시간 → 삶을 침식하지 않는 투자”라는 3단 구도를 제시한다. 이 책이 기계적 매매법이 아니라 투자자 훈련서라는 점도 여기서 분명해진다. [코스톨라니 본문] 적용 대상은 장기투자자와 순종투자자다. 단기투기꾼에게도 읽을 가치는 있지만, 이 장은 빠른 회전보다 느린 판단과 자본 보존을 전제로 한다. [프레임워크 연결] 장기투자 정보/전문가 회의론 10가지 권고·금기 [일화] [후대 해석] 보어젠페어라크 교육 자료는 코스톨라니의 유명한 “수면제 시간”을 달걀 2단계와 5단계의 “서둘러 행동하지 말고 보유 혹은 대기하라”는 맥락으로 설명한다. 즉 이 표현은 무조건 잠들라는 뜻이 아니라, 이미 맞는 포지션을 잡았다면 과잉행동을 줄이라는 뜻에 가깝다. 다만 이번 조사에서 해당 표현의 독일어 원문을 1차 문헌으로 직접 확인하지는 못했다. [원어 확인 필요] (신뢰도 B) [현대적 적용] [현대 적용] 2020년대 기준으로 이 조언은 “광범위 ETF·현금흐름이 탄탄한 우량주·낮은 레버리지” 조합에 특히 유효하다. 금리 전환기와 AI·반도체 같은 대세 산업에서는 가격 변동성이 커도, 포지션이 맞다면 과도한 뉴스 소비와 잦은 매매가 오히려 성과를 깎는다. 반대로 질 낮은 테마주를 사 놓고 “수면제 투자”라고 부르는 것은 코스톨라니식이 아니다. 최근 한국 시장에서도 레버리지 ETF와 신용 융자 급증이 개인투자자 변동성을 키웠다. 이는 “가만히 있는 힘”이 아니라 “위험 구조를 잘못 설계한 결과”에 더 가깝다. [오해 방지] “좋은 주식이면 아무 때나 사서 그냥 자면 된다”는 뜻이 아니다. “정보를 보지 말라”가 아니라, 이미 시장에 녹아든 정보에 과잉반응하지 말라 는 뜻이다. “수면제 투자”는 우량 자산·낮은 레버리지·긴 시간축이 전제될 때만 성립한다."},{"i":2,"title":"1. 돈의 매력","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>돈에 대한 욕구는 경제적 진보의 원동력이고, 돈을 벌 수 있는 기회를 위해 자신의 창의성과 성실함을 바탕으로 위험을 감수한다.<\/li>\n<li>돈은 바닷물과 같다. 마시면 마실수록 오히려 갈증만 늘어난다. (쇼펜하우어)<\/li>\n<li>백만장자란 자신이 바라는 바를 성취하는 데 있어 어느 누구에게도 종속되지 않는 자신의 자본을 가진 사람이다.<\/li>\n<li>상승보다 하락하는 주가와 정면 승부를 봐야 하는 주식시장에서 마냥 돈을 좇으려 말고 오나시스의 말처럼 돈과 정면으로 부딪쳐야 한다.<\/li>\n<li>백만장자가 된다는 것은 '독립적'이라는 것을 의미하고 자린고비나 낭비벽이 심한 사람은 절대 독립적일 수 없다.<\/li>\n<li>부자가 되는 3가지 방법은 부자와의 결혼, 유망한 사업 아이템과 아이디어, 그리고 투자이다.<\/li>\n<li>투자는 과학이 아닌 예술이다. (모든 영역, 어떤 상황에서도 버텨내기)<\/li>\n<li>투자자란 지성인이며, 경제의 발전, 정치, 사회를 제대로 진단하고 그것을 통해 수익을 창출하기 위해 심사숙고하는 증권거래인이다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 돈을 ‘탐욕의 대상’이 아니라 ‘독립의 수단’으로 재정의한다. 코스톨라니에게 돈은 시장에서 오래 버틸 수 있는 시간, 남의 강요를 덜 받는 선택권, 그리고 생각을 실행할 자율성의 원천이다.<\/li>\n<li>[코스톨라니 본문] 따라서 “돈의 매력”은 단순한 축재 찬양이 아니라, 뒤 장들에서 반복되는 <strong>현금 여력·무차입·인내 가능성<\/strong>의 전제다. 돈이 없으면 생각이 맞아도 시장보다 먼저 굴복한다.<\/li>\n<li>[코스톨라니 본문] 이 장은 장기투자자와 순종투자자에게 직접 연결된다. 단기투기꾼도 참고할 수 있지만, 핵심은 “판단의 자유를 주는 자금 구조”다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>소신파/부화뇌동파<\/li>\n<li>장기투자<\/li>\n<li>10가지 권고·금기<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 요약은 코스톨라니의 네 가지 G를 “돈, 생각, 인내, 행운”으로 압축하면서, 특히 첫 번째 G인 돈을 <strong>자기 돈으로 버티는 능력<\/strong>으로 해석한다. 또한 그는 생애 두 차례 파산을 겪었고 그 경험이 이후의 보수적 자금 운용 철학에 영향을 줬다고 정리한다. 다만 이 파산 시점과 규모를 이번 조사에서 1차 회고 원문으로 직접 대조하지는 못했다. [원문 대조 필요] (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 이 장의 실전 번역은 명확하다. 생활비와 투자금을 섞지 말고, 레버리지를 성과 가속 장치가 아니라 <strong>오판 시 강제퇴장 장치<\/strong>로 봐야 한다. 한국 시장에서 신용 잔고와 레버리지형 ETF 참여가 급증할 때 개인투자자가 변동성에 취약해지는 모습은, 코스톨라니가 말한 “돈 없는 확신”의 위험을 현대적으로 보여준다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“돈이 많아야만 투자할 수 있다”는 뜻이 아니다.<\/li>\n<li>핵심은 <strong>절대 규모가 아니라 버틸 수 있는 구조<\/strong>다.<\/li>\n<li>돈 자체를 사랑하라는 것이 아니라, 돈을 통해 얻는 독립성을 중시하라는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 돈에 대한 욕구는 경제적 진보의 원동력이고, 돈을 벌 수 있는 기회를 위해 자신의 창의성과 성실함을 바탕으로 위험을 감수한다. 돈은 바닷물과 같다. 마시면 마실수록 오히려 갈증만 늘어난다. (쇼펜하우어) 백만장자란 자신이 바라는 바를 성취하는 데 있어 어느 누구에게도 종속되지 않는 자신의 자본을 가진 사람이다. 상승보다 하락하는 주가와 정면 승부를 봐야 하는 주식시장에서 마냥 돈을 좇으려 말고 오나시스의 말처럼 돈과 정면으로 부딪쳐야 한다. 백만장자가 된다는 것은 '독립적'이라는 것을 의미하고 자린고비나 낭비벽이 심한 사람은 절대 독립적일 수 없다. 부자가 되는 3가지 방법은 부자와의 결혼, 유망한 사업 아이템과 아이디어, 그리고 투자이다. 투자는 과학이 아닌 예술이다. (모든 영역, 어떤 상황에서도 버텨내기) 투자자란 지성인이며, 경제의 발전, 정치, 사회를 제대로 진단하고 그것을 통해 수익을 창출하기 위해 심사숙고하는 증권거래인이다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 돈을 ‘탐욕의 대상’이 아니라 ‘독립의 수단’으로 재정의한다. 코스톨라니에게 돈은 시장에서 오래 버틸 수 있는 시간, 남의 강요를 덜 받는 선택권, 그리고 생각을 실행할 자율성의 원천이다. [코스톨라니 본문] 따라서 “돈의 매력”은 단순한 축재 찬양이 아니라, 뒤 장들에서 반복되는 현금 여력·무차입·인내 가능성 의 전제다. 돈이 없으면 생각이 맞아도 시장보다 먼저 굴복한다. [코스톨라니 본문] 이 장은 장기투자자와 순종투자자에게 직접 연결된다. 단기투기꾼도 참고할 수 있지만, 핵심은 “판단의 자유를 주는 자금 구조”다. [프레임워크 연결] 소신파/부화뇌동파 장기투자 10가지 권고·금기 [일화] [후대 해석] 보어젠페어라크 요약은 코스톨라니의 네 가지 G를 “돈, 생각, 인내, 행운”으로 압축하면서, 특히 첫 번째 G인 돈을 자기 돈으로 버티는 능력 으로 해석한다. 또한 그는 생애 두 차례 파산을 겪었고 그 경험이 이후의 보수적 자금 운용 철학에 영향을 줬다고 정리한다. 다만 이 파산 시점과 규모를 이번 조사에서 1차 회고 원문으로 직접 대조하지는 못했다. [원문 대조 필요] (신뢰도 B) [현대적 적용] [현대 적용] 이 장의 실전 번역은 명확하다. 생활비와 투자금을 섞지 말고, 레버리지를 성과 가속 장치가 아니라 오판 시 강제퇴장 장치 로 봐야 한다. 한국 시장에서 신용 잔고와 레버리지형 ETF 참여가 급증할 때 개인투자자가 변동성에 취약해지는 모습은, 코스톨라니가 말한 “돈 없는 확신”의 위험을 현대적으로 보여준다. [오해 방지] “돈이 많아야만 투자할 수 있다”는 뜻이 아니다. 핵심은 절대 규모가 아니라 버틸 수 있는 구조 다. 돈 자체를 사랑하라는 것이 아니라, 돈을 통해 얻는 독립성을 중시하라는 뜻이다."},{"i":3,"title":"2. 증권 동물원","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>투기는 성경에도 기록되어 있을 만큼 인류의 역사만큼이나 오래된 것이다.<\/li>\n<li>인간은 놀이하는 존재(Homo ludens)로 태어났기에 놀면서 이기기도 하고 지기도 하는 인간(투기꾼)은 절대로 사라지지 않을 것이다.<\/li>\n<li>재정적인 여건이나 성격에 따라 투자가 달라진다. (가족, 자녀, 재산, 수입, 부동산 등)<\/li>\n<li>주식투자는 어느 정도의 위험을 감수해야 하고 돈을 쓰는 데 시간적 제한이 없어야 한다. (장기투자)<\/li>\n<li>지금까지 주식시장에서 보낸 80여 년의 경험으로 미뤄볼 때 장기적으로 성공한 단기투자자는 본 적이 없다.<\/li>\n<li>장기투자자는 적은 액수의 돈으로 짧은 시일 내에 백만장자 대열에 오를 수 없지만, 장기적으로 보면 상당한 자산을 축적할 수 있다.<\/li>\n<li>순종투자자는 단기투자자와 장기투자자의 중간쯤에 위치하며 자신만의 생각을 가지고 자금을 움직인다.<\/li>\n<li>(화폐, 신용정책, 금리정책, 경제성장, 국제사회에서의 위치, 무역수지, 사업 보고서 등)<\/li>\n<li>투자란 부와 파산 사이를 오가는 위험한 항해라서 훌륭한 배와 똑똑한 항해사가 무엇보다 필요하다. (돈, 인내, 강심장, 경험, 주체적 사고)<\/li>\n<li>인간은 일하는 인간, 생각하는 인간, 아무것도 안 하는 인간으로 나뉘며 순종투자자는 생각하는 인간에 포함된다.<\/li>\n<li>모든 것을 조금씩 아는 것은 아무것도 모르는 것과 같아서 투자자는 예리한 시각과 폭넓은 상식을 갖추고 다양한 경험을 쌓아야 한다.<\/li>\n<li>투자자의 무기는 첫 번째도 경험이고, 두 번째도 그리고 세 번째도 경험이다. (적어도 두 번 파산해보지 않은 사람은 투자자가 아니다.)<\/li>\n<li>장기적인 측면에서 현재의 손실 경험은 충분히 상쇄될 것이므로 주식투자로 본 손실은 경험적인 측면으로 보면 수익이다.<\/li>\n<li>심각한 손실을 경험한 후에야 비로소 밑바닥으로 되돌아가 무엇이 문제였는지 면밀히 분석해보게 된다. (손실 후 원인 분석 필수)<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 시장 참여자를 행태별로 나누는 기초 장이다. 코스톨라니는 “모든 투자자는 같지 않다”는 점을 전제로, 자금·성격·시간 제약에 따라 투자 방식이 달라져야 한다고 본다.<\/li>\n<li>[코스톨라니 본문] 특히 중요한 것은 장기투자자와 순종투자자의 구분이다. 노트 기준으로 순종투자자는 단기와 장기 사이에 있으면서도 <strong>자기 생각을 가진 사람<\/strong>이다. 따라서 여기서의 “순종”은 맹목 추종이 아니라, 무작정 매매하지 않고 주어진 환경에 맞춰 자기 판단을 운용하는 유형으로 읽는 편이 자연스럽다. 다만 해당 용어의 독일어 원문 대응은 이번 조사에서 확정하지 못했다. [원어 확인 필요]<\/li>\n<li>[코스톨라니 본문] 이 장의 역할은 이후의 소신파/부화뇌동파, 장기투자, 권고·금기 기준을 사람이해 프레임으로 묶는 데 있다. 대상은 장기투자자와 순종투자자이며, 단기투기꾼에게는 사실상 경고문이다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>소신파/부화뇌동파<\/li>\n<li>장기투자<\/li>\n<li>10가지 권고·금기<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 자료는 코스톨라니가 자기 돈, 자기 생각, 자기 인내 없이는 결국 “흔들리는 손”이 된다고 설명한다. 여기서 네 가지 G가 빠지면 판단이 맞아도 버티지 못하고 손실 매도로 끝난다는 해석이 붙는다. 이는 장기투자자와 순종투자자의 차이를 실전적으로 풀어 주는 2차 정리다. (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 2020년대 개인투자자 기준으로는 세 부류로 다시 번역할 수 있다.<\/li>\n<li>장기투자자: 광범위 ETF·품질주 중심, 리밸런싱 주기 길다.<\/li>\n<li>순종투자자: 거시 환경과 섹터 로테이션을 읽되 자기 가설이 있다.<\/li>\n<li>단기투기꾼: 레버리지·테마 추종·잦은 손바뀜이 많다.\n  한국 시장에서 개인의 고강도 회전매매와 레버리지 참여는 종종 마지막 유형으로 쏠린다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“경험이 중요하니 손실은 다 약이다”로 단순화하면 안 된다.<\/li>\n<li>코스톨라니는 손실을 미화하지 않았다. <strong>손실 뒤 원인 분석이 있어야 경험이 된다.<\/strong><\/li>\n<li>“순종투자자”를 남의 말을 잘 듣는 투자자로 해석하면 오독이다. 노트 문맥상 오히려 자기 생각을 가진 유형이다. [원어 확인 필요]<\/li>\n<\/ul>","text":"기존 노트 투기는 성경에도 기록되어 있을 만큼 인류의 역사만큼이나 오래된 것이다. 인간은 놀이하는 존재(Homo ludens)로 태어났기에 놀면서 이기기도 하고 지기도 하는 인간(투기꾼)은 절대로 사라지지 않을 것이다. 재정적인 여건이나 성격에 따라 투자가 달라진다. (가족, 자녀, 재산, 수입, 부동산 등) 주식투자는 어느 정도의 위험을 감수해야 하고 돈을 쓰는 데 시간적 제한이 없어야 한다. (장기투자) 지금까지 주식시장에서 보낸 80여 년의 경험으로 미뤄볼 때 장기적으로 성공한 단기투자자는 본 적이 없다. 장기투자자는 적은 액수의 돈으로 짧은 시일 내에 백만장자 대열에 오를 수 없지만, 장기적으로 보면 상당한 자산을 축적할 수 있다. 순종투자자는 단기투자자와 장기투자자의 중간쯤에 위치하며 자신만의 생각을 가지고 자금을 움직인다. (화폐, 신용정책, 금리정책, 경제성장, 국제사회에서의 위치, 무역수지, 사업 보고서 등) 투자란 부와 파산 사이를 오가는 위험한 항해라서 훌륭한 배와 똑똑한 항해사가 무엇보다 필요하다. (돈, 인내, 강심장, 경험, 주체적 사고) 인간은 일하는 인간, 생각하는 인간, 아무것도 안 하는 인간으로 나뉘며 순종투자자는 생각하는 인간에 포함된다. 모든 것을 조금씩 아는 것은 아무것도 모르는 것과 같아서 투자자는 예리한 시각과 폭넓은 상식을 갖추고 다양한 경험을 쌓아야 한다. 투자자의 무기는 첫 번째도 경험이고, 두 번째도 그리고 세 번째도 경험이다. (적어도 두 번 파산해보지 않은 사람은 투자자가 아니다.) 장기적인 측면에서 현재의 손실 경험은 충분히 상쇄될 것이므로 주식투자로 본 손실은 경험적인 측면으로 보면 수익이다. 심각한 손실을 경험한 후에야 비로소 밑바닥으로 되돌아가 무엇이 문제였는지 면밀히 분석해보게 된다. (손실 후 원인 분석 필수) [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 시장 참여자를 행태별로 나누는 기초 장이다. 코스톨라니는 “모든 투자자는 같지 않다”는 점을 전제로, 자금·성격·시간 제약에 따라 투자 방식이 달라져야 한다고 본다. [코스톨라니 본문] 특히 중요한 것은 장기투자자와 순종투자자의 구분이다. 노트 기준으로 순종투자자는 단기와 장기 사이에 있으면서도 자기 생각을 가진 사람 이다. 따라서 여기서의 “순종”은 맹목 추종이 아니라, 무작정 매매하지 않고 주어진 환경에 맞춰 자기 판단을 운용하는 유형으로 읽는 편이 자연스럽다. 다만 해당 용어의 독일어 원문 대응은 이번 조사에서 확정하지 못했다. [원어 확인 필요] [코스톨라니 본문] 이 장의 역할은 이후의 소신파/부화뇌동파, 장기투자, 권고·금기 기준을 사람이해 프레임으로 묶는 데 있다. 대상은 장기투자자와 순종투자자이며, 단기투기꾼에게는 사실상 경고문이다. [프레임워크 연결] 소신파/부화뇌동파 장기투자 10가지 권고·금기 [일화] [후대 해석] 보어젠페어라크 자료는 코스톨라니가 자기 돈, 자기 생각, 자기 인내 없이는 결국 “흔들리는 손”이 된다고 설명한다. 여기서 네 가지 G가 빠지면 판단이 맞아도 버티지 못하고 손실 매도로 끝난다는 해석이 붙는다. 이는 장기투자자와 순종투자자의 차이를 실전적으로 풀어 주는 2차 정리다. (신뢰도 B) [현대적 적용] [현대 적용] 2020년대 개인투자자 기준으로는 세 부류로 다시 번역할 수 있다. 장기투자자: 광범위 ETF·품질주 중심, 리밸런싱 주기 길다. 순종투자자: 거시 환경과 섹터 로테이션을 읽되 자기 가설이 있다. 단기투기꾼: 레버리지·테마 추종·잦은 손바뀜이 많다. 한국 시장에서 개인의 고강도 회전매매와 레버리지 참여는 종종 마지막 유형으로 쏠린다. [오해 방지] “경험이 중요하니 손실은 다 약이다”로 단순화하면 안 된다. 코스톨라니는 손실을 미화하지 않았다. 손실 뒤 원인 분석이 있어야 경험이 된다. “순종투자자”를 남의 말을 잘 듣는 투자자로 해석하면 오독이다. 노트 문맥상 오히려 자기 생각을 가진 유형이다. [원어 확인 필요]"},{"i":4,"title":"3. 투자, 무엇으로 할 것인가?","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>주식, 채권, 외환시장, 원자재시장 등 다양한 투자처가 있다.<\/li>\n<li>아주 큰 기회는 날마다 오지 않으므로 투자 대상으로 주식만이 아니라 다른 부문도 계산에 넣어볼 가치가 있다.<\/li>\n<li>채권은 일반적인 생각보다 훨씬 중요한 투자 대상이다.<\/li>\n<li>증권시장에서도 운전하는 법을 배울 때처럼 차의 보닛만 보고 있지 말고 고개를 들고 저 멀리 전방 300미터 앞을 주시하라.<\/li>\n<li>원자재 투자는 노련한 투자자만을 위한 것이므로 개인 투자자는 원자재 투자로 행운을 찾으려는 생각을 버려라.<\/li>\n<li>부동산은 자본이 많은 투자자를 위한 것이며 유일하게 수익이 발생하는 유가물 투자 대상이고, 1주택은 권하는 편이다.<\/li>\n<li>주식은 진정한 투자 대상 그 자체이며 주식의 장점은 장기적으로 상승운동을 한다는 것이다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 “무엇을 살 것인가”보다 먼저 “어디에 자본을 배치할 것인가”를 묻는다. 코스톨라니는 주식을 핵심 투자수단으로 보지만, 채권을 비롯한 다른 자산을 무시하지 않는다. 특히 채권을 중요한 투자 대상으로 보는 태도는 뒤 장의 금리·유동성 프레임과 직접 연결된다.<\/li>\n<li>[코스톨라니 본문] “보닛만 보지 말고 300미터 앞을 보라”는 문장은 자산 선택을 미시 데이터가 아니라 <strong>앞으로의 환경 변화<\/strong>에서 시작하라는 뜻이다. 즉 자산군→트렌드→종목 순서다.<\/li>\n<li>[코스톨라니 본문] 이 장은 장기투자자와 순종투자자에게 해당한다. 단기투기꾼은 자산군 간 경쟁을 수익률표로만 보지만, 코스톨라니는 자본이 어디로 몰릴지의 큰 지도를 먼저 본다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>금리<\/li>\n<li>돈+심리<\/li>\n<li>장기투자<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[전기적 일화] 전후 독일 채권 투자 일화는 이 장의 문제의식을 잘 보여 준다. 프랑스어·독일어 위키 계열 자료는 그가 전후 독일 재건을 믿고 Young Plan 계열 독일 채권성 자산에 투자해 큰 수익을 거뒀다고 서술한다. 다만 실제 체결 시점, 매입 단가, 정확한 종목 명칭은 이번 조사에서 1차 회고 원문으로 확인하지 못했다. 한편 Young Plan 자체가 1930년 헤이그 협정으로 확정된 국제 채무 구조였고, BIS와 독일 채무증서 체계가 존재했다는 역사적 배경은 미국 국무부 FRUS 문서로 확인된다. [원문 대조 필요] [출처 취약] (일화 신뢰도 C, 역사 배경 A)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 지금의 투자자는 주식만 볼 것이 아니라 <strong>주식과 채권의 상대매력<\/strong>, 현금성 자산 금리, 장기채 수익률, 달러 강세, 원자재 민감도까지 함께 봐야 한다. 특히 고금리 구간에서는 채권이 다시 주식의 경쟁자가 된다. 반대로 경기 둔화와 금리 하락이 겹치면 장기채와 성장주가 동시에 부각될 수 있다. ETF 시대에는 이 자산군 판단을 더 낮은 비용으로 실행할 수 있지만, 자산군 판단 자체를 건너뛰면 ETF도 결국 잘못된 타이밍의 포장지일 뿐이다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“주식이 최고 자산”을 “다른 자산은 무시하라”로 읽으면 안 된다.<\/li>\n<li>“원자재는 하지 말라”가 아니라, <strong>개인투자자가 행운 찾기 식으로 접근하지 말라<\/strong>는 뜻이다.<\/li>\n<li>자산군 판단 없는 종목 선택은 코스톨라니식이 아니다.<\/li>\n<\/ul>","text":"기존 노트 주식, 채권, 외환시장, 원자재시장 등 다양한 투자처가 있다. 아주 큰 기회는 날마다 오지 않으므로 투자 대상으로 주식만이 아니라 다른 부문도 계산에 넣어볼 가치가 있다. 채권은 일반적인 생각보다 훨씬 중요한 투자 대상이다. 증권시장에서도 운전하는 법을 배울 때처럼 차의 보닛만 보고 있지 말고 고개를 들고 저 멀리 전방 300미터 앞을 주시하라. 원자재 투자는 노련한 투자자만을 위한 것이므로 개인 투자자는 원자재 투자로 행운을 찾으려는 생각을 버려라. 부동산은 자본이 많은 투자자를 위한 것이며 유일하게 수익이 발생하는 유가물 투자 대상이고, 1주택은 권하는 편이다. 주식은 진정한 투자 대상 그 자체이며 주식의 장점은 장기적으로 상승운동을 한다는 것이다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 “무엇을 살 것인가”보다 먼저 “어디에 자본을 배치할 것인가”를 묻는다. 코스톨라니는 주식을 핵심 투자수단으로 보지만, 채권을 비롯한 다른 자산을 무시하지 않는다. 특히 채권을 중요한 투자 대상으로 보는 태도는 뒤 장의 금리·유동성 프레임과 직접 연결된다. [코스톨라니 본문] “보닛만 보지 말고 300미터 앞을 보라”는 문장은 자산 선택을 미시 데이터가 아니라 앞으로의 환경 변화 에서 시작하라는 뜻이다. 즉 자산군→트렌드→종목 순서다. [코스톨라니 본문] 이 장은 장기투자자와 순종투자자에게 해당한다. 단기투기꾼은 자산군 간 경쟁을 수익률표로만 보지만, 코스톨라니는 자본이 어디로 몰릴지의 큰 지도를 먼저 본다. [프레임워크 연결] 금리 돈+심리 장기투자 [일화] [전기적 일화] 전후 독일 채권 투자 일화는 이 장의 문제의식을 잘 보여 준다. 프랑스어·독일어 위키 계열 자료는 그가 전후 독일 재건을 믿고 Young Plan 계열 독일 채권성 자산에 투자해 큰 수익을 거뒀다고 서술한다. 다만 실제 체결 시점, 매입 단가, 정확한 종목 명칭은 이번 조사에서 1차 회고 원문으로 확인하지 못했다. 한편 Young Plan 자체가 1930년 헤이그 협정으로 확정된 국제 채무 구조였고, BIS와 독일 채무증서 체계가 존재했다는 역사적 배경은 미국 국무부 FRUS 문서로 확인된다. [원문 대조 필요] [출처 취약] (일화 신뢰도 C, 역사 배경 A) [현대적 적용] [현대 적용] 지금의 투자자는 주식만 볼 것이 아니라 주식과 채권의 상대매력 , 현금성 자산 금리, 장기채 수익률, 달러 강세, 원자재 민감도까지 함께 봐야 한다. 특히 고금리 구간에서는 채권이 다시 주식의 경쟁자가 된다. 반대로 경기 둔화와 금리 하락이 겹치면 장기채와 성장주가 동시에 부각될 수 있다. ETF 시대에는 이 자산군 판단을 더 낮은 비용으로 실행할 수 있지만, 자산군 판단 자체를 건너뛰면 ETF도 결국 잘못된 타이밍의 포장지일 뿐이다. [오해 방지] “주식이 최고 자산”을 “다른 자산은 무시하라”로 읽으면 안 된다. “원자재는 하지 말라”가 아니라, 개인투자자가 행운 찾기 식으로 접근하지 말라 는 뜻이다. 자산군 판단 없는 종목 선택은 코스톨라니식이 아니다."},{"i":5,"title":"4. 증권거래소 — 시장경제의 신경 체계","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>혼돈 속의 혼돈 (호세 드 라 베가) 읽어보기.<\/li>\n<li>증권시장에서 매우 뒤틀린 세계사의 거울을 발견할 수 있으며, 노련한 투자자만이 이를 알아채고 이해하여 커다란 특권을 누릴 수 있다.<\/li>\n<li>경제라는 주인과 증권시장이라는 개는 산책 시 목적지가 같음에도 불구하고 전혀 다른 이동 경로로 움직인다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 시장과 경제를 분리해서 보는 코스톨라니의 핵심 비유를 담는다. 주인인 경제와 개로 비유된 증권시장은 장기 목적지는 같지만, 단기 경로는 전혀 다르게 움직인다.<\/li>\n<li>[코스톨라니 본문] 따라서 경제가 좋아도 증시는 먼저 급락할 수 있고, 경제가 아직 나빠도 증시는 먼저 반등할 수 있다. 이 장은 이후의 달걀 6국면, 기정사실화, 돈+심리 프레임을 이해하는 토대다.<\/li>\n<li>[코스톨라니 본문] 적용 대상은 세 유형 모두지만, 특히 장기투자자와 순종투자자에게 중요하다. 단기투기꾼은 개의 궤적만 쫓기 쉽고, 장기투자자는 주인의 방향만 보고 개의 이탈을 견뎌야 한다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>달걀<\/li>\n<li>기정사실화<\/li>\n<li>장기투자<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 요약은 코스톨라니의 달걀 설명 말미에서 시장이 직선으로 움직이지 않고 “주인 주변을 도는 개”처럼 움직인다고 정리한다. 이는 경제와 시장의 시간차, 과장, 조정을 한 문장으로 압축한 비유다. (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 2020년대에는 이 비유가 더 강해졌다. 대형 기술주·ETF 자금 유입·중앙은행 기대가 겹치면 실물 경기보다 시장이 먼저 달리고, 반대로 장기금리 상승이나 지정학적 불안이 생기면 실적 둔화가 본격화되기 전에도 시장이 먼저 흔들린다. 최근 한국 증시가 미국 금리 우려와 반도체 심리 변화에 크게 흔들린 사례도, 실물과 시장의 경로 차이를 보여 준다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“결국 경제만 보면 된다”는 뜻이 아니다.<\/li>\n<li>“시장과 경제는 무관하다”는 뜻도 아니다.<\/li>\n<li>핵심은 <strong>장기 방향은 연결되어 있지만, 단기 경로는 심리와 자금이 왜곡한다<\/strong>는 점이다.<\/li>\n<\/ul>","text":"기존 노트 혼돈 속의 혼돈 (호세 드 라 베가) 읽어보기. 증권시장에서 매우 뒤틀린 세계사의 거울을 발견할 수 있으며, 노련한 투자자만이 이를 알아채고 이해하여 커다란 특권을 누릴 수 있다. 경제라는 주인과 증권시장이라는 개는 산책 시 목적지가 같음에도 불구하고 전혀 다른 이동 경로로 움직인다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 시장과 경제를 분리해서 보는 코스톨라니의 핵심 비유를 담는다. 주인인 경제와 개로 비유된 증권시장은 장기 목적지는 같지만, 단기 경로는 전혀 다르게 움직인다. [코스톨라니 본문] 따라서 경제가 좋아도 증시는 먼저 급락할 수 있고, 경제가 아직 나빠도 증시는 먼저 반등할 수 있다. 이 장은 이후의 달걀 6국면, 기정사실화, 돈+심리 프레임을 이해하는 토대다. [코스톨라니 본문] 적용 대상은 세 유형 모두지만, 특히 장기투자자와 순종투자자에게 중요하다. 단기투기꾼은 개의 궤적만 쫓기 쉽고, 장기투자자는 주인의 방향만 보고 개의 이탈을 견뎌야 한다. [프레임워크 연결] 달걀 기정사실화 장기투자 [일화] [후대 해석] 보어젠페어라크 요약은 코스톨라니의 달걀 설명 말미에서 시장이 직선으로 움직이지 않고 “주인 주변을 도는 개”처럼 움직인다고 정리한다. 이는 경제와 시장의 시간차, 과장, 조정을 한 문장으로 압축한 비유다. (신뢰도 B) [현대적 적용] [현대 적용] 2020년대에는 이 비유가 더 강해졌다. 대형 기술주·ETF 자금 유입·중앙은행 기대가 겹치면 실물 경기보다 시장이 먼저 달리고, 반대로 장기금리 상승이나 지정학적 불안이 생기면 실적 둔화가 본격화되기 전에도 시장이 먼저 흔들린다. 최근 한국 증시가 미국 금리 우려와 반도체 심리 변화에 크게 흔들린 사례도, 실물과 시장의 경로 차이를 보여 준다. [오해 방지] “결국 경제만 보면 된다”는 뜻이 아니다. “시장과 경제는 무관하다”는 뜻도 아니다. 핵심은 장기 방향은 연결되어 있지만, 단기 경로는 심리와 자금이 왜곡한다 는 점이다."},{"i":6,"title":"5. 주가를 움직이는 것들","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>모든 것은 공급과 수요에 달려 있다.<\/li>\n<li>주식시장은 아름다운 여자나 날씨만큼이나 변덕스러우므로 항상 냉철하게 대처하고, 논리적인 설명을 찾으려 하지 마라.<\/li>\n<li>주식이 바보보다 더 많은지, 아니면 바보가 주식보다 더 많은지 주변을 한번 둘러보아라.<\/li>\n<li>주가의 흐름은 주식을 팔려는 매도자가 주식을 사들이려는 매수자보다 더 급박한지 아닌지에 달려 있다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 가격의 직접 원인이 가치평가표가 아니라 <strong>당장의 손바뀜<\/strong>에 있음을 강조한다. 가치가 장기 기준이라면, 가격은 그 순간 누가 더 급한가의 함수다.<\/li>\n<li>[코스톨라니 본문] 그래서 코스톨라니는 “기업이 좋은가”와 별개로 “주식을 누가 들고 있는가”를 본다. 이 논리가 그대로 소신파/부화뇌동파, 달걀 6국면, 거래량 해석으로 이어진다.<\/li>\n<li>[코스톨라니 본문] 적용 대상은 세 유형 모두지만, 특히 순종투자자와 단기투기꾼에게 직접적이다. 장기투자자도 진입·추가매수·현금비중 판단에서는 이 장을 무시하면 안 된다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>소신파/부화뇌동파<\/li>\n<li>달걀<\/li>\n<li>돈+심리<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[전기적 일화] 코스톨라니의 편집자였던 볼프강 슈토크는 그를 회고하며, 시장은 결국 “주식이 더 많은가, 바보가 더 많은가”의 문제라는 그의 유명한 문장을 전한다. 이 일화는 특정 사건 설명보다 수급·군중심리 요약에 가깝다. (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[후대 해석] 현대 미시구조 연구도 자금 유입과 주문흐름이 가격을 밀어 올릴 수 있다는 관점을 강하게 뒷받침한다. 부샤우의 논문은 시장가치가 주문흐름에 비탄력적으로 반응할 수 있음을 정리하고, 한국 데이터 연구는 개인 대량매수가 오히려 노이즈 트레이더 성격을 띠고 기관의 강한 매수가 향후 수익률과 더 단조롭게 연결된다고 보고한다. 즉 코스톨라니식 “누가 들고 있나” 질문은 지금도 유효하다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>수급이 중요하다고 해서 기업 가치가 무의미한 것은 아니다.<\/li>\n<li>반대로 가치만 보면 된다고 해서 수급을 무시할 수도 없다.<\/li>\n<li>이 장은 “왜 오늘 움직였는가”의 설명이지 “영원히 가치가 필요 없다”는 선언이 아니다.<\/li>\n<\/ul>","text":"기존 노트 모든 것은 공급과 수요에 달려 있다. 주식시장은 아름다운 여자나 날씨만큼이나 변덕스러우므로 항상 냉철하게 대처하고, 논리적인 설명을 찾으려 하지 마라. 주식이 바보보다 더 많은지, 아니면 바보가 주식보다 더 많은지 주변을 한번 둘러보아라. 주가의 흐름은 주식을 팔려는 매도자가 주식을 사들이려는 매수자보다 더 급박한지 아닌지에 달려 있다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 가격의 직접 원인이 가치평가표가 아니라 당장의 손바뀜 에 있음을 강조한다. 가치가 장기 기준이라면, 가격은 그 순간 누가 더 급한가의 함수다. [코스톨라니 본문] 그래서 코스톨라니는 “기업이 좋은가”와 별개로 “주식을 누가 들고 있는가”를 본다. 이 논리가 그대로 소신파/부화뇌동파, 달걀 6국면, 거래량 해석으로 이어진다. [코스톨라니 본문] 적용 대상은 세 유형 모두지만, 특히 순종투자자와 단기투기꾼에게 직접적이다. 장기투자자도 진입·추가매수·현금비중 판단에서는 이 장을 무시하면 안 된다. [프레임워크 연결] 소신파/부화뇌동파 달걀 돈+심리 [일화] [전기적 일화] 코스톨라니의 편집자였던 볼프강 슈토크는 그를 회고하며, 시장은 결국 “주식이 더 많은가, 바보가 더 많은가”의 문제라는 그의 유명한 문장을 전한다. 이 일화는 특정 사건 설명보다 수급·군중심리 요약에 가깝다. (신뢰도 B) [현대적 적용] [후대 해석] 현대 미시구조 연구도 자금 유입과 주문흐름이 가격을 밀어 올릴 수 있다는 관점을 강하게 뒷받침한다. 부샤우의 논문은 시장가치가 주문흐름에 비탄력적으로 반응할 수 있음을 정리하고, 한국 데이터 연구는 개인 대량매수가 오히려 노이즈 트레이더 성격을 띠고 기관의 강한 매수가 향후 수익률과 더 단조롭게 연결된다고 보고한다. 즉 코스톨라니식 “누가 들고 있나” 질문은 지금도 유효하다. [오해 방지] 수급이 중요하다고 해서 기업 가치가 무의미한 것은 아니다. 반대로 가치만 보면 된다고 해서 수급을 무시할 수도 없다. 이 장은 “왜 오늘 움직였는가”의 설명이지 “영원히 가치가 필요 없다”는 선언이 아니다."},{"i":7,"title":"6. 장기적으로 영향을 미치는 요소들","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>전쟁 또는 평화 그리고 장기적인 경제 발전, 이 두 가지 요소가 주식시장에 흐르는 주제음악을 결정한다.<\/li>\n<li>상황이 불확실할수록 투자자는 주식투자를 하지 않고, 상황이 확실할수록 투자자가 늘어난다.<\/li>\n<li>근본적인 경제성장이 뒷받침되지 않았다면 GM, IBM, Microsoft의 주가는 오늘날처럼 오를 수 없었을 것이다.<\/li>\n<li>장기적 관점에서 주식시장은 경제와 떼어 놓을 수 없으므로 국가 경제 및 세계 경제의 \"미래\"를 면밀히 관찰하고 분석해야 한다.<\/li>\n<li>주식시장은 약간의 흔들림은 있어도 장기적으로는 성장하지만, 가끔 장애물이 등장하므로 그럴 때는 아주 노련하게 행동하며 적기를 기다려야 한다.<\/li>\n<li>극도의 안정성 추구는 경제 성장을 방해하며 5%의 실업률보다는 차라리 5%의 인플레이션이 낫다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 장기 주식시장의 대전제를 제시한다. 장기 방향은 전쟁·평화, 제도 안정, 생산성, 경제 발전의 흐름에 묶여 있다. 돈과 심리는 중기 변동을 만들지만, 장기 음악은 결국 실물과 제도가 만든다.<\/li>\n<li>[코스톨라니 본문] 그래서 그는 경제와 기업 이익의 장기 성장 가능성을 보되, 장애물 구간에서는 한동안 개가 주인에게서 크게 벗어날 수 있다는 점도 인정한다. 즉 장기 낙관과 중기 경계가 동시에 필요하다.<\/li>\n<li>[코스톨라니 본문] 이 장은 가장 전형적으로 장기투자자에게 해당한다. 순종투자자도 이 장을 기준선으로 삼아야 하며, 단기투기꾼은 대세를 거스를 때 특별히 위험해진다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>장기투자<\/li>\n<li>개와 주인 산책 비유<\/li>\n<li>돈+심리<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[전기적 일화] 공식 FIDUKA 홈페이지는 코스톨라니와 고트프리트 헬러가 1971년 FIDUKA를 공동으로 시작했고, 이미 초기부터 유럽·미국·아시아·신흥국을 넓게 바라보는 국제적 시각을 강조했다고 설명한다. 이는 그가 단기 팁보다 장기 구조 변화를 중시했다는 후대의 회사 서사와 맞닿는다. 또한 프랑스어 위키 계열 자료는 그가 전후 독일 재건에 강한 확신을 갖고 독일 관련 채권성 자산에 투자했다고 서술하지만, 세부 거래 기록은 이번 조사에서 직접 확인하지 못했다. [원문 대조 필요] (신뢰도 A/B, 일부 C)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 2020년대에는 지정학, 공급망 재편, AI 인프라 투자, 인구 구조, 에너지 전환 같은 장기 변수들이 이 장의 ‘주제음악’에 해당한다. IMF는 지정학적 위험이 주가 하락과 금융 불안정을 키울 수 있다고 경고했고, 동시에 장기금리는 대규모 투자 수요와 실질금리 변화에 영향을 받는다. 따라서 장기투자자는 개별 뉴스보다 구조 변화와 제도 지속성을 추적해야 한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“경제가 좋으니 무조건 주식”으로 단순화하면 안 된다.<\/li>\n<li>장기 낙관은 가능하지만, 중간의 조정·공황·과장국면은 반복된다.<\/li>\n<li>장기투자도 거시 구조를 읽지 않으면 단순 방치가 된다.<\/li>\n<\/ul>","text":"기존 노트 전쟁 또는 평화 그리고 장기적인 경제 발전, 이 두 가지 요소가 주식시장에 흐르는 주제음악을 결정한다. 상황이 불확실할수록 투자자는 주식투자를 하지 않고, 상황이 확실할수록 투자자가 늘어난다. 근본적인 경제성장이 뒷받침되지 않았다면 GM, IBM, Microsoft의 주가는 오늘날처럼 오를 수 없었을 것이다. 장기적 관점에서 주식시장은 경제와 떼어 놓을 수 없으므로 국가 경제 및 세계 경제의 \"미래\"를 면밀히 관찰하고 분석해야 한다. 주식시장은 약간의 흔들림은 있어도 장기적으로는 성장하지만, 가끔 장애물이 등장하므로 그럴 때는 아주 노련하게 행동하며 적기를 기다려야 한다. 극도의 안정성 추구는 경제 성장을 방해하며 5%의 실업률보다는 차라리 5%의 인플레이션이 낫다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 장기 주식시장의 대전제를 제시한다. 장기 방향은 전쟁·평화, 제도 안정, 생산성, 경제 발전의 흐름에 묶여 있다. 돈과 심리는 중기 변동을 만들지만, 장기 음악은 결국 실물과 제도가 만든다. [코스톨라니 본문] 그래서 그는 경제와 기업 이익의 장기 성장 가능성을 보되, 장애물 구간에서는 한동안 개가 주인에게서 크게 벗어날 수 있다는 점도 인정한다. 즉 장기 낙관과 중기 경계가 동시에 필요하다. [코스톨라니 본문] 이 장은 가장 전형적으로 장기투자자에게 해당한다. 순종투자자도 이 장을 기준선으로 삼아야 하며, 단기투기꾼은 대세를 거스를 때 특별히 위험해진다. [프레임워크 연결] 장기투자 개와 주인 산책 비유 돈+심리 [일화] [전기적 일화] 공식 FIDUKA 홈페이지는 코스톨라니와 고트프리트 헬러가 1971년 FIDUKA를 공동으로 시작했고, 이미 초기부터 유럽·미국·아시아·신흥국을 넓게 바라보는 국제적 시각을 강조했다고 설명한다. 이는 그가 단기 팁보다 장기 구조 변화를 중시했다는 후대의 회사 서사와 맞닿는다. 또한 프랑스어 위키 계열 자료는 그가 전후 독일 재건에 강한 확신을 갖고 독일 관련 채권성 자산에 투자했다고 서술하지만, 세부 거래 기록은 이번 조사에서 직접 확인하지 못했다. [원문 대조 필요] (신뢰도 A/B, 일부 C) [현대적 적용] [현대 적용] 2020년대에는 지정학, 공급망 재편, AI 인프라 투자, 인구 구조, 에너지 전환 같은 장기 변수들이 이 장의 ‘주제음악’에 해당한다. IMF는 지정학적 위험이 주가 하락과 금융 불안정을 키울 수 있다고 경고했고, 동시에 장기금리는 대규모 투자 수요와 실질금리 변화에 영향을 받는다. 따라서 장기투자자는 개별 뉴스보다 구조 변화와 제도 지속성을 추적해야 한다. [오해 방지] “경제가 좋으니 무조건 주식”으로 단순화하면 안 된다. 장기 낙관은 가능하지만, 중간의 조정·공황·과장국면은 반복된다. 장기투자도 거시 구조를 읽지 않으면 단순 방치가 된다."},{"i":8,"title":"7. 중기적으로 영향을 미치는 요소들","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>돈 + 심리 = 트렌드<\/li>\n<li>중기적 영향 요소인 돈과 심리에 의해 극단적인 변동성이 발생한다.<\/li>\n<li>주식시장에서 돈이란 산소 또는 차를 움직이는 휘발유 같은 것이므로 돈이 없으면 주식을 살 수 없어 주식 거래가 활발해질 수 없다.<\/li>\n<li>여론의 투자 심리가 부정적이어서 어느 누구도 주식을 사려고 하지 않는다면 주가가 상승할 수 없다.<\/li>\n<li>중기 주식 트렌드에서는 돈과 상상력이라는 두 요소, 특히 돈이 경제 기초지표보다 훨씬 더 결정적인 역할을 한다.<\/li>\n<li>중기적인 관점에서는 경기가 그리 중요하지 않다.<\/li>\n<li>인플레이션에 맞서기 위해 중앙은행에서 취하는 조치들만이 주식시장에 부정적인 영향을 미친다.<\/li>\n<li>디플레이션은 증권시장의 가장 큰 재해이나 오늘날 사실상 존재하지 않는다.<\/li>\n<li>금리는 경제발전의 모든 요소와 관련이 있고 임금 상승, 원자재 가격, 소비, 생산력 향상 등 여러 가지 요소에 의해 결정된다.<\/li>\n<li>금리가 떨어지면 '언제'나 '하지만' 같은 말은 꺼내지도 말고 곧장 주식시장에 뛰어들어야 한다.<\/li>\n<li>채권의 이자인 장기이자율(Obligation)은 높으면 높을수록 주식의 경쟁 상대가 된다.<\/li>\n<li>장기금리는 중앙은행이 아닌 수요와 공급에 의해 결정되며 단기금리와 장기금리는 서로 밀접한 관계에 있다.<\/li>\n<li>투자자는 항상 이 모든 것을 예민하게 관찰하며 거기서 자신만의 결론을 내야 하고 시장의 심리도 '분석'할 수 있어야 미래 트렌드 예측이 가능하다.<\/li>\n<li>증권시장은 그야말로 대중의 심리 그 자체이다.<\/li>\n<li>특정 상황에서 개인과 집단의 심리적 동기나 반응은 예측할 수 없지만 노련한 투자자는 개개인이 내리는 결정의 합의 강도는 예측할 수 있다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 책 전체의 실전 핵심이다. 중기 추세는 ‘기업의 본질가치’보다 먼저 <strong>돈의 양과 가격<\/strong>, 그리고 <strong>대중의 심리<\/strong>가 만든다. 여기서 돈은 통화량, 신용, 금리, 유동성, 자산 대체효과를 포함한다. 심리는 낙관·비관·공포·탐욕·대중 참여도를 포함한다.<\/li>\n<li>[코스톨라니 본문] “돈 + 심리 = 트렌드”는 관찰 프레임이지 공식 예측식이 아니다. 돈이 좋아도 심리가 최악이면 상승이 늦게 시작될 수 있고, 심리가 좋아도 돈이 빠지면 상승은 취약해진다. 이 때문에 그는 금리와 대중심리를 동시에 보라고 한다.<\/li>\n<li>[코스톨라니 본문] 적용 대상은 장기투자자보다는 순종투자자에게 직접적이며, 장기투자자에게는 비중 조절 도구다. 단기투기꾼도 이 프레임을 쓰지 않으면 노이즈를 추세로 오인하기 쉽다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>돈+심리<\/li>\n<li>금리<\/li>\n<li>기정사실화<\/li>\n<li>소신파/부화뇌동파<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 자료는 달걀과 더불어 네 가지 G를 코스톨라니의 두 번째 핵심 기초로 정리한다. 돈과 생각이 있어도 인내와 행운이 없으면 결국 흔들리는 손이 된다는 설명은, 중기 추세에서 맞는 방향을 읽어도 버틸 자본과 시간이 없으면 실패한다는 뜻으로 해석할 수 있다. (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 코스톨라니의 “금리 하락 시 주식시장 진입”은 지금도 유효하지만, 현대에는 다섯 가지 한계를 함께 붙여야 한다.<\/li>\n<li>첫째, 인플레이션 둔화에 따른 정상화 인하라면 주식에 우호적일 수 있다.<\/li>\n<li>둘째, 경기침체 대응성 인하라면 이익 추정치 하향이 주가를 눌러 금리 인하 효과를 상쇄할 수 있다.<\/li>\n<li>셋째, 금융위기성 긴급 인하·유동성 공급은 폭락을 멈출 수 있지만 대개 충격 이후에 나온다.<\/li>\n<li>넷째, 인하 기대가 이미 가격에 선반영됐으면 발표 후 오히려 무덤덤하거나 차익실현이 나온다.<\/li>\n<li>다섯째, 단기 정책금리가 내려도 장기금리·할인율은 재정, 실질성장, 기간프리미엄 때문에 다르게 움직일 수 있다.<\/li>\n<li>[추론] 따라서 실전에서는 “정책금리 방향”만 볼 것이 아니라, <strong>장단기금리의 동행 여부<\/strong>, <strong>신용 스프레드<\/strong>, <strong>대중 참여도<\/strong>, <strong>악재/호재에 대한 시장 반응<\/strong>을 같이 봐야 한다. 이게 코스톨라니 공식을 현대 시장용으로 번역한 최소 조건이다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“금리만 보면 된다”는 오독을 경계해야 한다.<\/li>\n<li>“돈이 많으면 무조건 상승”도 틀리다. 심리가 막혀 있으면 자금은 대기한다.<\/li>\n<li>“경기는 중요하지 않다”는 말은 <strong>중기 가격 형성에서의 우선순위<\/strong>를 말하는 것이지, 장기 펀더멘털 부정을 뜻하지 않는다.<\/li>\n<\/ul>","text":"기존 노트 돈 + 심리 = 트렌드 중기적 영향 요소인 돈과 심리에 의해 극단적인 변동성이 발생한다. 주식시장에서 돈이란 산소 또는 차를 움직이는 휘발유 같은 것이므로 돈이 없으면 주식을 살 수 없어 주식 거래가 활발해질 수 없다. 여론의 투자 심리가 부정적이어서 어느 누구도 주식을 사려고 하지 않는다면 주가가 상승할 수 없다. 중기 주식 트렌드에서는 돈과 상상력이라는 두 요소, 특히 돈이 경제 기초지표보다 훨씬 더 결정적인 역할을 한다. 중기적인 관점에서는 경기가 그리 중요하지 않다. 인플레이션에 맞서기 위해 중앙은행에서 취하는 조치들만이 주식시장에 부정적인 영향을 미친다. 디플레이션은 증권시장의 가장 큰 재해이나 오늘날 사실상 존재하지 않는다. 금리는 경제발전의 모든 요소와 관련이 있고 임금 상승, 원자재 가격, 소비, 생산력 향상 등 여러 가지 요소에 의해 결정된다. 금리가 떨어지면 '언제'나 '하지만' 같은 말은 꺼내지도 말고 곧장 주식시장에 뛰어들어야 한다. 채권의 이자인 장기이자율(Obligation)은 높으면 높을수록 주식의 경쟁 상대가 된다. 장기금리는 중앙은행이 아닌 수요와 공급에 의해 결정되며 단기금리와 장기금리는 서로 밀접한 관계에 있다. 투자자는 항상 이 모든 것을 예민하게 관찰하며 거기서 자신만의 결론을 내야 하고 시장의 심리도 '분석'할 수 있어야 미래 트렌드 예측이 가능하다. 증권시장은 그야말로 대중의 심리 그 자체이다. 특정 상황에서 개인과 집단의 심리적 동기나 반응은 예측할 수 없지만 노련한 투자자는 개개인이 내리는 결정의 합의 강도는 예측할 수 있다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 책 전체의 실전 핵심이다. 중기 추세는 ‘기업의 본질가치’보다 먼저 돈의 양과 가격 , 그리고 대중의 심리 가 만든다. 여기서 돈은 통화량, 신용, 금리, 유동성, 자산 대체효과를 포함한다. 심리는 낙관·비관·공포·탐욕·대중 참여도를 포함한다. [코스톨라니 본문] “돈 + 심리 = 트렌드”는 관찰 프레임이지 공식 예측식이 아니다. 돈이 좋아도 심리가 최악이면 상승이 늦게 시작될 수 있고, 심리가 좋아도 돈이 빠지면 상승은 취약해진다. 이 때문에 그는 금리와 대중심리를 동시에 보라고 한다. [코스톨라니 본문] 적용 대상은 장기투자자보다는 순종투자자에게 직접적이며, 장기투자자에게는 비중 조절 도구다. 단기투기꾼도 이 프레임을 쓰지 않으면 노이즈를 추세로 오인하기 쉽다. [프레임워크 연결] 돈+심리 금리 기정사실화 소신파/부화뇌동파 [일화] [후대 해석] 보어젠페어라크 자료는 달걀과 더불어 네 가지 G를 코스톨라니의 두 번째 핵심 기초로 정리한다. 돈과 생각이 있어도 인내와 행운이 없으면 결국 흔들리는 손이 된다는 설명은, 중기 추세에서 맞는 방향을 읽어도 버틸 자본과 시간이 없으면 실패한다는 뜻으로 해석할 수 있다. (신뢰도 B) [현대적 적용] [현대 적용] 코스톨라니의 “금리 하락 시 주식시장 진입”은 지금도 유효하지만, 현대에는 다섯 가지 한계를 함께 붙여야 한다. 첫째, 인플레이션 둔화에 따른 정상화 인하라면 주식에 우호적일 수 있다. 둘째, 경기침체 대응성 인하라면 이익 추정치 하향이 주가를 눌러 금리 인하 효과를 상쇄할 수 있다. 셋째, 금융위기성 긴급 인하·유동성 공급은 폭락을 멈출 수 있지만 대개 충격 이후에 나온다. 넷째, 인하 기대가 이미 가격에 선반영됐으면 발표 후 오히려 무덤덤하거나 차익실현이 나온다. 다섯째, 단기 정책금리가 내려도 장기금리·할인율은 재정, 실질성장, 기간프리미엄 때문에 다르게 움직일 수 있다. [추론] 따라서 실전에서는 “정책금리 방향”만 볼 것이 아니라, 장단기금리의 동행 여부 , 신용 스프레드 , 대중 참여도 , 악재/호재에 대한 시장 반응 을 같이 봐야 한다. 이게 코스톨라니 공식을 현대 시장용으로 번역한 최소 조건이다. [오해 방지] “금리만 보면 된다”는 오독을 경계해야 한다. “돈이 많으면 무조건 상승”도 틀리다. 심리가 막혀 있으면 자금은 대기한다. “경기는 중요하지 않다”는 말은 중기 가격 형성에서의 우선순위 를 말하는 것이지, 장기 펀더멘털 부정을 뜻하지 않는다."},{"i":9,"title":"8. 증권심리학","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>차트, 오실레이터, 모형이 아닌 증시의 매크로에 반응하는 강도, 시장의 기술적 이해는 '현재 증권의 대다수가 누구의 손에 있는가?'로 판단한다.<\/li>\n<li>소신파는 장기투자자를 지칭하고 돈, 생각, 인내, 행운 네 가지 요소를 가지고 있다.<\/li>\n<li>어떠한 상황이라도 빚을 내서 주식을 사는 것은 금물이라는 것!<\/li>\n<li>투자 시 심사숙고하는 동시에 상상력을 지녀야 하며 또한, 자신의 생각을 신뢰하고 신념을 가지고 흔들리지 않아야 한다.<\/li>\n<li>상상력은 지식보다 중요하다. (아인슈타인)<\/li>\n<li>증권거래소에서는 머리가 아니라 엉덩이로 돈을 버는 것이다.<\/li>\n<li>모든 투자시장의 강세장과 약세장은 조정국면, 적응국면 혹은 동행국면, 과장국면으로 구분된다. (코스톨라니의 달걀)<\/li>\n<li>월스트리트 또한 일방통행로가 아니다. 폭락은 예정된 일이다.<\/li>\n<li>한 명의 로스차일드가 강세장을 만들 수 있을지는 몰라도 약세장은 막을 수 없다.<\/li>\n<li>증시의 붐을 거치지 않은 공황은 없으며 공황으로 끝나지 않은 붐도 없다.<\/li>\n<li>성공 전략은 소신파에 속하면서 현재 경제 순환과 반대로 행동하는 것이며, 핵심은 현재 시장이 어느 국면에 위치하고 있는지 파악하는 것이다.<\/li>\n<li>손끝으로 전해지는, 이른바 '촉'이라고 부르는 그것은 오직 경험으로만 얻을 수 있는 것이다.<\/li>\n<li>실수는 투자에 필수적인 경험을 쌓는 데 필요하며, 각종 징후와 증상, 신호를 알아채고 과잉매수, 과잉매도가 일어난 상황을 조기에 파악하는 데 도움을 준다.<\/li>\n<li>악재에도 시장이 위축되지 않는다면 과잉매도, 호재성 소식에도 아무런 반응을 보이지 않는다면 과잉매수 상태를 의미한다.<\/li>\n<li>거래량이 증가하는데도 주가가 계속 하락한다면 다음 상승운동 국면이 시작될 때가 가까워졌다는 징조인 것이다.<\/li>\n<li>오랜 기간 거래량이 적은데도 시세가 지속적으로 하락한다면 이것은 시장에 좋지 않은 징조다.<\/li>\n<li>거래량이 많은 상황에서 주가가 계속 오른다면 이 또한 좋지 못한 징후다.<\/li>\n<li>가장 중요한 암시는 바로 일반적인 의견, 즉 일반인들까지 주식시장에 관심을 보이는 상황이다.<\/li>\n<li>시장의 순환에 역행하는 것이 가장 좋은 선택이며 훈련을 거듭하면서 냉정한 것을 넘어 냉소적이어야 한다.<\/li>\n<li>투자자는 용기도 있어야 하고, 적극적으로 참여해야 하며, 무엇보다 현명해야 하며 자신의 의견에 대한 배짱도 필요하다.<\/li>\n<li>하강운동의 과장국면에서 매수하는 데 성공했다면 주가가 계속 떨어지더라도 계속 보유할 수 있는 강한 주관을 지녀야 한다.<\/li>\n<li>전쟁이나 주요 정치적·경제적 결정, 금융 정책, 정권 교체 등 예측 불가능한 중대한 변수가 생기면 신속하게 결정 후 당장 던져버려야 한다.<\/li>\n<li>제3국면 초기에는 시세가 폭등하고 돈이라는 요소가 긍정적이면 그 상태가 상당 기간 유지되며, 잠시 어리석은 사람처럼 행동할 줄 알 정도로 지혜로워야 한다.<\/li>\n<li>절대 낙관적인 숫자와 예측에 현혹되지 말고 투자자는 아무도 보지 못하게 서둘러 조용히 시장의 뒷문으로 슬그머니 빠져나와야 한다.<\/li>\n<li>초보자는 약세장이 아니라 무조건 강세장에 투자하라.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 코스톨라니의 실전 매뉴얼에 가장 가깝다. 핵심 질문은 “지금 시장이 누구의 손에 있는가”다. 여기서 소신파는 하방 과장국면에서 모으고, 부화뇌동파는 상방 과장국면에서 뒤늦게 몰려든다.<\/li>\n<li>[코스톨라니 본문] 네 가지 요소인 돈, 생각, 인내, 행운은 소신파의 자격요건이다. 돈은 버티는 자본, 생각은 독자적 논리, 인내는 시간, 행운은 외생변수 통과 여부다. 이번 조사에서 접근 가능한 2차 독일어 자료는 ‘zittrige Hände’와 ‘Hartgesottene’ 혹은 ‘starke Hände’를 혼용하므로, 한국어의 소신파/부화뇌동파와 정확히 1:1 대응하는 원어는 보수적으로 유보한다. [원어 확인 필요]<\/li>\n<li>[코스톨라니 본문] 달걀 6국면은 이 장의 구조도다. 상승과 하락은 각각 조정–적응–과장으로 나뉘고, 각 국면에서 거래량·보유자 분포·뉴스 반응이 달라진다. 중요한 것은 예측이 아니라 현재 위치 판단이다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>달걀<\/li>\n<li>소신파/부화뇌동파<\/li>\n<li>돈+심리<\/li>\n<li>장기투자<\/li>\n<li>차트 비판<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 자료는 달걀 3단계 초입에서 “주식이 강한 손에서 흔들리는 손으로 넘어간다”고 정리하고, 심지어 집 청소를 해 주는 사람까지 어떤 주식을 사야 하는지 말하기 시작하면 과장국면의 신호라고 설명한다. 이는 대중 참여가 마지막 상승의 연료이자 종료 신호라는 코스톨라니식 심리 해석을 압축한 2차 설명이다. (신뢰도 B)<\/li>\n<li>[전기적 일화] 같은 자료는 1999년 휠체어에 앉은 코스톨라니가 인터넷 주식 군중심리를 경고했다고 적는다. 다만 실제 발언 매체와 원문은 이번 조사에서 직접 확인하지 못했다. [출처 취약] [원문 대조 필요] (신뢰도 B/C)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 최근 한국 시장의 개인 레버리지 ETF 열풍, 기록적 신용 잔고, 반도체 주도 과열과 급락은 이 장의 교과서적 사례다. 개인투자자 FOMO로 거래대금이 급증하고, 외부 금리 충격이 오자 변동성이 급격히 확대됐다. 한국 데이터 연구도 개인의 강한 매수는 종종 노이즈 트레이더 성격을 띠며, 뉴스 톤 역시 KOSPI200에 영향을 준다고 본다. 즉 “누가 들고 있는가”와 “뉴스에 어떻게 반응하는가”는 지금도 유효한 온도계다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“역발상만 하면 된다”는 식으로 읽으면 가장 위험하다.<\/li>\n<li>코스톨라니식 역행은 <strong>현금·가설·인내를 가진 역행<\/strong>이다.<\/li>\n<li>“호재에 반응 없으면 과잉매수, 악재에 반응 없으면 과잉매도”는 유용한 징후지만, 단일 신호로 확정할 수는 없다.<\/li>\n<\/ul>","text":"기존 노트 차트, 오실레이터, 모형이 아닌 증시의 매크로에 반응하는 강도, 시장의 기술적 이해는 '현재 증권의 대다수가 누구의 손에 있는가?'로 판단한다. 소신파는 장기투자자를 지칭하고 돈, 생각, 인내, 행운 네 가지 요소를 가지고 있다. 어떠한 상황이라도 빚을 내서 주식을 사는 것은 금물이라는 것! 투자 시 심사숙고하는 동시에 상상력을 지녀야 하며 또한, 자신의 생각을 신뢰하고 신념을 가지고 흔들리지 않아야 한다. 상상력은 지식보다 중요하다. (아인슈타인) 증권거래소에서는 머리가 아니라 엉덩이로 돈을 버는 것이다. 모든 투자시장의 강세장과 약세장은 조정국면, 적응국면 혹은 동행국면, 과장국면으로 구분된다. (코스톨라니의 달걀) 월스트리트 또한 일방통행로가 아니다. 폭락은 예정된 일이다. 한 명의 로스차일드가 강세장을 만들 수 있을지는 몰라도 약세장은 막을 수 없다. 증시의 붐을 거치지 않은 공황은 없으며 공황으로 끝나지 않은 붐도 없다. 성공 전략은 소신파에 속하면서 현재 경제 순환과 반대로 행동하는 것이며, 핵심은 현재 시장이 어느 국면에 위치하고 있는지 파악하는 것이다. 손끝으로 전해지는, 이른바 '촉'이라고 부르는 그것은 오직 경험으로만 얻을 수 있는 것이다. 실수는 투자에 필수적인 경험을 쌓는 데 필요하며, 각종 징후와 증상, 신호를 알아채고 과잉매수, 과잉매도가 일어난 상황을 조기에 파악하는 데 도움을 준다. 악재에도 시장이 위축되지 않는다면 과잉매도, 호재성 소식에도 아무런 반응을 보이지 않는다면 과잉매수 상태를 의미한다. 거래량이 증가하는데도 주가가 계속 하락한다면 다음 상승운동 국면이 시작될 때가 가까워졌다는 징조인 것이다. 오랜 기간 거래량이 적은데도 시세가 지속적으로 하락한다면 이것은 시장에 좋지 않은 징조다. 거래량이 많은 상황에서 주가가 계속 오른다면 이 또한 좋지 못한 징후다. 가장 중요한 암시는 바로 일반적인 의견, 즉 일반인들까지 주식시장에 관심을 보이는 상황이다. 시장의 순환에 역행하는 것이 가장 좋은 선택이며 훈련을 거듭하면서 냉정한 것을 넘어 냉소적이어야 한다. 투자자는 용기도 있어야 하고, 적극적으로 참여해야 하며, 무엇보다 현명해야 하며 자신의 의견에 대한 배짱도 필요하다. 하강운동의 과장국면에서 매수하는 데 성공했다면 주가가 계속 떨어지더라도 계속 보유할 수 있는 강한 주관을 지녀야 한다. 전쟁이나 주요 정치적·경제적 결정, 금융 정책, 정권 교체 등 예측 불가능한 중대한 변수가 생기면 신속하게 결정 후 당장 던져버려야 한다. 제3국면 초기에는 시세가 폭등하고 돈이라는 요소가 긍정적이면 그 상태가 상당 기간 유지되며, 잠시 어리석은 사람처럼 행동할 줄 알 정도로 지혜로워야 한다. 절대 낙관적인 숫자와 예측에 현혹되지 말고 투자자는 아무도 보지 못하게 서둘러 조용히 시장의 뒷문으로 슬그머니 빠져나와야 한다. 초보자는 약세장이 아니라 무조건 강세장에 투자하라. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 코스톨라니의 실전 매뉴얼에 가장 가깝다. 핵심 질문은 “지금 시장이 누구의 손에 있는가”다. 여기서 소신파는 하방 과장국면에서 모으고, 부화뇌동파는 상방 과장국면에서 뒤늦게 몰려든다. [코스톨라니 본문] 네 가지 요소인 돈, 생각, 인내, 행운은 소신파의 자격요건이다. 돈은 버티는 자본, 생각은 독자적 논리, 인내는 시간, 행운은 외생변수 통과 여부다. 이번 조사에서 접근 가능한 2차 독일어 자료는 ‘zittrige Hände’와 ‘Hartgesottene’ 혹은 ‘starke Hände’를 혼용하므로, 한국어의 소신파/부화뇌동파와 정확히 1:1 대응하는 원어는 보수적으로 유보한다. [원어 확인 필요] [코스톨라니 본문] 달걀 6국면은 이 장의 구조도다. 상승과 하락은 각각 조정–적응–과장으로 나뉘고, 각 국면에서 거래량·보유자 분포·뉴스 반응이 달라진다. 중요한 것은 예측이 아니라 현재 위치 판단이다. [프레임워크 연결] 달걀 소신파/부화뇌동파 돈+심리 장기투자 차트 비판 [일화] [후대 해석] 보어젠페어라크 자료는 달걀 3단계 초입에서 “주식이 강한 손에서 흔들리는 손으로 넘어간다”고 정리하고, 심지어 집 청소를 해 주는 사람까지 어떤 주식을 사야 하는지 말하기 시작하면 과장국면의 신호라고 설명한다. 이는 대중 참여가 마지막 상승의 연료이자 종료 신호라는 코스톨라니식 심리 해석을 압축한 2차 설명이다. (신뢰도 B) [전기적 일화] 같은 자료는 1999년 휠체어에 앉은 코스톨라니가 인터넷 주식 군중심리를 경고했다고 적는다. 다만 실제 발언 매체와 원문은 이번 조사에서 직접 확인하지 못했다. [출처 취약] [원문 대조 필요] (신뢰도 B/C) [현대적 적용] [현대 적용] 최근 한국 시장의 개인 레버리지 ETF 열풍, 기록적 신용 잔고, 반도체 주도 과열과 급락은 이 장의 교과서적 사례다. 개인투자자 FOMO로 거래대금이 급증하고, 외부 금리 충격이 오자 변동성이 급격히 확대됐다. 한국 데이터 연구도 개인의 강한 매수는 종종 노이즈 트레이더 성격을 띠며, 뉴스 톤 역시 KOSPI200에 영향을 준다고 본다. 즉 “누가 들고 있는가”와 “뉴스에 어떻게 반응하는가”는 지금도 유효한 온도계다. [오해 방지] “역발상만 하면 된다”는 식으로 읽으면 가장 위험하다. 코스톨라니식 역행은 현금·가설·인내를 가진 역행 이다. “호재에 반응 없으면 과잉매수, 악재에 반응 없으면 과잉매도”는 유용한 징후지만, 단일 신호로 확정할 수는 없다."},{"i":10,"title":"9. 정보의 정글","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>은행가와 브로커, 애널리스트, 경제학자들을 제외한 모든 곳에서 정보와 아이디어를 얻어야 한다.<\/li>\n<li>증권거래소에서 누구나 아는 뉴스라면 큰 의미가 없으며 이미 주가에 반영되어 있다.<\/li>\n<li>투자자는 뉴스를 알아야 할 뿐만 아니라 미리 예측할 수 있어야 하고, 또 중요도를 가려내 호재, 악재 여부를 판단하고 여론의 반응을 알아야 한다.<\/li>\n<li>말은 영리하게 하면서도 행동이 어리석은 사람이 있는가 하면 바보같이 말해도 행동만큼은 영리한 사람이 있다.<\/li>\n<li>기정사실화: 미래 기대 선반영에 의해 좋은 뉴스가 나오면 오히려 하락하고, 기대한 나쁜 뉴스가 현실화되면 오히려 반등할 수 있다.<\/li>\n<li>진정한 증권 지식이란 모든 세부 정보를 다 잊었을 때 남는 그것이다.<\/li>\n<li>세간에서 말하는 '특별한' 투자 조언의 경우 보통 그 반대로 하는 것이 좋다.<\/li>\n<li>공황이란 예상하지 못했던 것이 불현듯 최악의 결과와 함께 등장하는 경우를 의미한다.<\/li>\n<li>대단한 금융가도 최악의 투자자가 될 수 있다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장의 핵심은 “정보의 양”보다 “정보의 가격 반영 정도”다. 누구나 아는 뉴스는 정보가 아니라 이미 가격이 된 경우가 많다. 그래서 투자자는 뉴스 자체보다 <strong>시장 기대와 실제 결과의 차이<\/strong>, 그리고 발표 뒤 반응 강도를 봐야 한다.<\/li>\n<li>[코스톨라니 본문] ‘기정사실화’는 바로 그 메커니즘이다. 기대가 선반영됐으면 호재도 재료 소멸이 되고, 악재가 이미 충분히 반영됐으면 현실화 순간 반등이 나올 수 있다. 이 장은 돈+심리와 달걀을 연결하는 정보 해석 규칙이다.<\/li>\n<li>[코스톨라니 본문] 적용 대상은 순종투자자와 장기투자자 모두다. 장기투자자는 정보 소음을 걸러야 하고, 순종투자자는 기대-현실 괴리를 통해 포지션을 조정해야 한다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>기정사실화<\/li>\n<li>정보/전문가 회의론<\/li>\n<li>돈+심리<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 금리 결정 전후 시장을 분석한 연구는 발표 이후뿐 아니라 발표 이전에도 이미 ‘전조 충격’이 나타난다고 본다. 이는 코스톨라니의 선반영 직관과 상당히 잘 맞는 현대적 증거다. 발표 그 자체보다 그 이전의 포지셔닝과 기대 조정이 중요하다는 뜻이다. (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 한국 경제 뉴스에 대한 연구는 뉴스 제목의 부정성이 KOSPI200과 연결될 수 있음을 보여 주고, FOMC·중앙은행 이벤트 연구는 발표 전 기대와 발표 후 여진이 모두 중요하다고 본다. 실전에서는 “뉴스가 좋은가/나쁜가”보다 “시장 기대보다 얼마나 다른가, 그리고 시장이 그 뉴스를 어떻게 소화했는가”를 기록해야 한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“뉴스는 다 쓸모없다”는 뜻이 아니다.<\/li>\n<li>“애널리스트 반대로만 하면 된다”도 지나친 단순화다.<\/li>\n<li>기정사실화는 만능 역지표가 아니라 <strong>기대 수준과 포지셔닝을 함께 읽는 원리<\/strong>다.<\/li>\n<\/ul>","text":"기존 노트 은행가와 브로커, 애널리스트, 경제학자들을 제외한 모든 곳에서 정보와 아이디어를 얻어야 한다. 증권거래소에서 누구나 아는 뉴스라면 큰 의미가 없으며 이미 주가에 반영되어 있다. 투자자는 뉴스를 알아야 할 뿐만 아니라 미리 예측할 수 있어야 하고, 또 중요도를 가려내 호재, 악재 여부를 판단하고 여론의 반응을 알아야 한다. 말은 영리하게 하면서도 행동이 어리석은 사람이 있는가 하면 바보같이 말해도 행동만큼은 영리한 사람이 있다. 기정사실화: 미래 기대 선반영에 의해 좋은 뉴스가 나오면 오히려 하락하고, 기대한 나쁜 뉴스가 현실화되면 오히려 반등할 수 있다. 진정한 증권 지식이란 모든 세부 정보를 다 잊었을 때 남는 그것이다. 세간에서 말하는 '특별한' 투자 조언의 경우 보통 그 반대로 하는 것이 좋다. 공황이란 예상하지 못했던 것이 불현듯 최악의 결과와 함께 등장하는 경우를 의미한다. 대단한 금융가도 최악의 투자자가 될 수 있다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장의 핵심은 “정보의 양”보다 “정보의 가격 반영 정도”다. 누구나 아는 뉴스는 정보가 아니라 이미 가격이 된 경우가 많다. 그래서 투자자는 뉴스 자체보다 시장 기대와 실제 결과의 차이 , 그리고 발표 뒤 반응 강도를 봐야 한다. [코스톨라니 본문] ‘기정사실화’는 바로 그 메커니즘이다. 기대가 선반영됐으면 호재도 재료 소멸이 되고, 악재가 이미 충분히 반영됐으면 현실화 순간 반등이 나올 수 있다. 이 장은 돈+심리와 달걀을 연결하는 정보 해석 규칙이다. [코스톨라니 본문] 적용 대상은 순종투자자와 장기투자자 모두다. 장기투자자는 정보 소음을 걸러야 하고, 순종투자자는 기대-현실 괴리를 통해 포지션을 조정해야 한다. [프레임워크 연결] 기정사실화 정보/전문가 회의론 돈+심리 [일화] [후대 해석] 금리 결정 전후 시장을 분석한 연구는 발표 이후뿐 아니라 발표 이전에도 이미 ‘전조 충격’이 나타난다고 본다. 이는 코스톨라니의 선반영 직관과 상당히 잘 맞는 현대적 증거다. 발표 그 자체보다 그 이전의 포지셔닝과 기대 조정이 중요하다는 뜻이다. (신뢰도 B) [현대적 적용] [현대 적용] 한국 경제 뉴스에 대한 연구는 뉴스 제목의 부정성이 KOSPI200과 연결될 수 있음을 보여 주고, FOMC·중앙은행 이벤트 연구는 발표 전 기대와 발표 후 여진이 모두 중요하다고 본다. 실전에서는 “뉴스가 좋은가/나쁜가”보다 “시장 기대보다 얼마나 다른가, 그리고 시장이 그 뉴스를 어떻게 소화했는가”를 기록해야 한다. [오해 방지] “뉴스는 다 쓸모없다”는 뜻이 아니다. “애널리스트 반대로만 하면 된다”도 지나친 단순화다. 기정사실화는 만능 역지표가 아니라 기대 수준과 포지셔닝을 함께 읽는 원리 다."},{"i":11,"title":"10. 어떤 주식을 선택할 것인가","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>강세장에서는 최악인 종목을 선택했다고 해도 어느 정도 수익이 가능하고 약세장에서는 최고의 종목마저도 수익을 얻기가 어렵다.<\/li>\n<li>20년 미만 투자 경험이 있는 투자자라면 전반적인 주식 트렌드를 지켜본 후 주식 종목을 선정한다.<\/li>\n<li>누구나 아는 정보가 아닌 나만의 정보로 앞으로 가장 전망이 좋은 산업 분야를 알아내고 그 안에서 가장 유망한 기업을 걸러낸 뒤 그 주식을 사들여라.<\/li>\n<li>투자자는 성장 산업을 일반 대중보다 더 빨리 파악할 수 있어야 적정한 가격에 올라탈 기회가 생긴다.<\/li>\n<li>PER에 대한 판단도 오롯이 심리적인 문제이며 이러한 수치에만 의지한다면 주식시장에서 큰 수익을 올릴 기회를 놓칠 수 있다.<\/li>\n<li>턴어라운드 주식은 상승폭이 매우 크지만 회생 가능성의 근거가 가장 중요하며 가격이 싸다는 이유로 접근하면 안 된다.<\/li>\n<li>주식의 값은 오직 기업의 기초 지표와 미래 전망에 달려 있으므로 이러한 기준에 의거하여 투자자는 최대한 객관적으로 판단해야 한다.<\/li>\n<li>차트를 읽는다는 건 지식이 만들어낸 것을 찾는 일이며 차트를 살펴보면 그 안에서 어제와 오늘을 파악할 수 있지만 딱 거기까지다.<\/li>\n<li>헤드 앤 숄더 패턴, 이중 천장 패턴, 둥근 바닥 패턴 등 그로테스크한 형태의 차트에 유혹되는 것은 곧 돈을 버리는 길이다.<\/li>\n<li>차트를 신뢰하는 투자자의 가장 큰 불행은 차트를 통해 성공을 맛보고 나면 그 후로는 차트에 더욱 매달리게 된다는 것이다.<\/li>\n<li>M·W 이론: 마지막 상한가가 다음 시세에 초과되는 것이며 이러한 현상이 몇 차례 반복된다면 상승운동이 이어질 것이라는 결론을 내릴 수 있다.<\/li>\n<li>상승 차트가 몇 번 M의 형태를 보인다면 이것은 천장에 도달했으므로 더는 뚫고 올라갈 수 없다는 의미이다.<\/li>\n<li>W의 이중하락 형태가 반복되면 주가는 더는 내려갈 수 없는 바닥에 이른 것이다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장에서 코스톨라니는 종목 선택을 시장 국면 뒤에 둔다. 즉 강세장/약세장이라는 큰 물결이 먼저고, 산업과 기업은 그 다음이다. 그래서 경험이 부족한 투자자일수록 먼저 전반적 추세를 읽으라고 한다.<\/li>\n<li>[코스톨라니 본문] 차트에 대한 태도도 일관적이다. 차트는 과거와 현재의 형태를 보여 주는 보조도구일 뿐, 미래 예언기가 아니다. 노트에 나온 M·W 이론도 기계적 예측법이 아니라 <strong>천장/바닥 인식의 묘사적 언어<\/strong>로 읽는 것이 안전하다. 이번 조사에서는 해당 이론의 원어와 원문 맥락을 1차 자료로 확인하지 못했다. [원문 대조 필요]<\/li>\n<li>[코스톨라니 본문] 적용 대상은 순종투자자 중심이다. 장기투자자에게도 섹터와 성장 산업 판별에 중요하지만, 단기투기꾼식 패턴 매매를 정당화하는 장은 아니다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>차트 비판<\/li>\n<li>장기투자<\/li>\n<li>정보/전문가 회의론<\/li>\n<li>돈+심리<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 자료는 코스톨라니가 전후 밀라노에서 시장에서 가장 약한 자동차 종목인 이소타(Isotta)를 골라 150리라 부근에서 사들였고, 450리라가 되었을 때도 팔지 않고 추가 매수했으며, 훗날 1,500리라 수준에서 매도했다고 정리한다. 이 일화의 핵심은 ‘추천 종목 추종’이 아니라 ‘자기 생각 + 상상력’이다. 다만 거래연도와 정확한 종목 식별은 이번 조사에서 1차 자료로 직접 확인하지 못했다. [원문 대조 필요] (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 지금은 개별주 대신 ETF로 먼저 산업·국가·스타일에 올라타고, 그 다음에 개별주를 고르는 방식이 코스톨라니식 순서를 구현하기 쉽다. 예를 들어 AI, 반도체, 전력설비, 국방, 인도·미국 같은 성장 축을 먼저 보고, 그 안에서 밸류에이션과 경쟁우위를 비교하는 방식이다. 차트는 리스크 관리용 보조지표로는 쓸 수 있지만, 패턴 모양 자체를 미래 예언처럼 믿는 것은 위험하다. 기술적 규칙의 단기 유효성을 주장하는 연구도 있으나 데이터 스누핑과 시장 환경 의존성이 크고, 최근 candlestick 이미지 연구는 패턴 추가가 성능을 크게 개선하지 못했다고 본다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“PER은 의미 없다”가 아니라, <strong>PER만으로는 부족하다<\/strong>는 뜻이다.<\/li>\n<li>“차트는 다 쓸모없다”도 과장이다. 코스톨라니가 경계한 것은 차트를 신탁처럼 믿는 태도다.<\/li>\n<li>M·W 이론을 자동매매 공식처럼 설명하면 코스톨라니를 오독하게 된다.<\/li>\n<\/ul>","text":"기존 노트 강세장에서는 최악인 종목을 선택했다고 해도 어느 정도 수익이 가능하고 약세장에서는 최고의 종목마저도 수익을 얻기가 어렵다. 20년 미만 투자 경험이 있는 투자자라면 전반적인 주식 트렌드를 지켜본 후 주식 종목을 선정한다. 누구나 아는 정보가 아닌 나만의 정보로 앞으로 가장 전망이 좋은 산업 분야를 알아내고 그 안에서 가장 유망한 기업을 걸러낸 뒤 그 주식을 사들여라. 투자자는 성장 산업을 일반 대중보다 더 빨리 파악할 수 있어야 적정한 가격에 올라탈 기회가 생긴다. PER에 대한 판단도 오롯이 심리적인 문제이며 이러한 수치에만 의지한다면 주식시장에서 큰 수익을 올릴 기회를 놓칠 수 있다. 턴어라운드 주식은 상승폭이 매우 크지만 회생 가능성의 근거가 가장 중요하며 가격이 싸다는 이유로 접근하면 안 된다. 주식의 값은 오직 기업의 기초 지표와 미래 전망에 달려 있으므로 이러한 기준에 의거하여 투자자는 최대한 객관적으로 판단해야 한다. 차트를 읽는다는 건 지식이 만들어낸 것을 찾는 일이며 차트를 살펴보면 그 안에서 어제와 오늘을 파악할 수 있지만 딱 거기까지다. 헤드 앤 숄더 패턴, 이중 천장 패턴, 둥근 바닥 패턴 등 그로테스크한 형태의 차트에 유혹되는 것은 곧 돈을 버리는 길이다. 차트를 신뢰하는 투자자의 가장 큰 불행은 차트를 통해 성공을 맛보고 나면 그 후로는 차트에 더욱 매달리게 된다는 것이다. M·W 이론: 마지막 상한가가 다음 시세에 초과되는 것이며 이러한 현상이 몇 차례 반복된다면 상승운동이 이어질 것이라는 결론을 내릴 수 있다. 상승 차트가 몇 번 M의 형태를 보인다면 이것은 천장에 도달했으므로 더는 뚫고 올라갈 수 없다는 의미이다. W의 이중하락 형태가 반복되면 주가는 더는 내려갈 수 없는 바닥에 이른 것이다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장에서 코스톨라니는 종목 선택을 시장 국면 뒤에 둔다. 즉 강세장/약세장이라는 큰 물결이 먼저고, 산업과 기업은 그 다음이다. 그래서 경험이 부족한 투자자일수록 먼저 전반적 추세를 읽으라고 한다. [코스톨라니 본문] 차트에 대한 태도도 일관적이다. 차트는 과거와 현재의 형태를 보여 주는 보조도구일 뿐, 미래 예언기가 아니다. 노트에 나온 M·W 이론도 기계적 예측법이 아니라 천장/바닥 인식의 묘사적 언어 로 읽는 것이 안전하다. 이번 조사에서는 해당 이론의 원어와 원문 맥락을 1차 자료로 확인하지 못했다. [원문 대조 필요] [코스톨라니 본문] 적용 대상은 순종투자자 중심이다. 장기투자자에게도 섹터와 성장 산업 판별에 중요하지만, 단기투기꾼식 패턴 매매를 정당화하는 장은 아니다. [프레임워크 연결] 차트 비판 장기투자 정보/전문가 회의론 돈+심리 [일화] [후대 해석] 보어젠페어라크 자료는 코스톨라니가 전후 밀라노에서 시장에서 가장 약한 자동차 종목인 이소타(Isotta)를 골라 150리라 부근에서 사들였고, 450리라가 되었을 때도 팔지 않고 추가 매수했으며, 훗날 1,500리라 수준에서 매도했다고 정리한다. 이 일화의 핵심은 ‘추천 종목 추종’이 아니라 ‘자기 생각 + 상상력’이다. 다만 거래연도와 정확한 종목 식별은 이번 조사에서 1차 자료로 직접 확인하지 못했다. [원문 대조 필요] (신뢰도 B) [현대적 적용] [현대 적용] 지금은 개별주 대신 ETF로 먼저 산업·국가·스타일에 올라타고, 그 다음에 개별주를 고르는 방식이 코스톨라니식 순서를 구현하기 쉽다. 예를 들어 AI, 반도체, 전력설비, 국방, 인도·미국 같은 성장 축을 먼저 보고, 그 안에서 밸류에이션과 경쟁우위를 비교하는 방식이다. 차트는 리스크 관리용 보조지표로는 쓸 수 있지만, 패턴 모양 자체를 미래 예언처럼 믿는 것은 위험하다. 기술적 규칙의 단기 유효성을 주장하는 연구도 있으나 데이터 스누핑과 시장 환경 의존성이 크고, 최근 candlestick 이미지 연구는 패턴 추가가 성능을 크게 개선하지 못했다고 본다. [오해 방지] “PER은 의미 없다”가 아니라, PER만으로는 부족하다 는 뜻이다. “차트는 다 쓸모없다”도 과장이다. 코스톨라니가 경계한 것은 차트를 신탁처럼 믿는 태도다. M·W 이론을 자동매매 공식처럼 설명하면 코스톨라니를 오독하게 된다."},{"i":12,"title":"11. 머니매니저","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>너무 많이 아는 어리석은 자는 아예 무지한 사람보다 두 배는 더 어리석다. (몰리에르)<\/li>\n<li>헤지펀드, 그 이름만으로도 사기다.<\/li>\n<li>머니매니저, 브로커, 투자컨설턴트는 고객의 수익보다 잦은 거래를 유도해 본인의 수수료를 취한다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 이 장은 정보 비대칭과 대리인 문제를 다룬다. 코스톨라니는 중개인·조언자·전문가가 반드시 고객과 같은 인센티브를 가지지 않는다고 본다. 그래서 남의 확신을 빌려 쓰지 말고, 최종 판단을 외주화하지 말라고 경고한다.<\/li>\n<li>[코스톨라니 본문] 이 장의 역할은 정보의 정글 장을 인간 인센티브 차원에서 확장하는 것이다. 누군가의 말은 틀릴 수 있을 뿐 아니라, 구조적으로 거래를 늘릴 유인도 가질 수 있다.<\/li>\n<li>[코스톨라니 본문] 적용 대상은 세 유형 모두다. 특히 순종투자자가 남의 시스템에 의존하기 시작할 때 가장 필요하다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>정보/전문가 회의론<\/li>\n<li>10가지 권고·금기<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 공식 FIDUKA 홈페이지는 회사의 핵심 가치로 객관성, 독립성, 고객 이해 일치를 내세운다. 역으로 말하면, 코스톨라니와 헬러가 강조한 독립성은 그 당시에도 이미 업계의 일반적 인센티브 구조와 긴장관계에 있었다고 볼 수 있다. [추론] (신뢰도 A)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 현대 데이터도 코스톨라니의 경계심이 과도한 편견만은 아니었음을 시사한다. FT와 Barron’s는 장기적으로 sell-side 애널리스트의 호감도 높은 종목이 반드시 더 좋은 성과를 내지 못했고, 등급 변화도 미래 수익률 예측력이 약했다고 지적한다. 이는 전문가 의견을 완전히 버리라는 뜻이 아니라, <strong>원 자료와 인센티브 구조를 함께 보라<\/strong>는 뜻이다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>모든 전문가가 무가치하다는 뜻은 아니다.<\/li>\n<li>문제는 지식이 아니라 <strong>인센티브 불일치와 과신<\/strong>이다.<\/li>\n<li>전문가 의견은 입력값일 수 있지만, 결론을 대신해 주는 권위가 되어서는 안 된다.<\/li>\n<\/ul>","text":"기존 노트 너무 많이 아는 어리석은 자는 아예 무지한 사람보다 두 배는 더 어리석다. (몰리에르) 헤지펀드, 그 이름만으로도 사기다. 머니매니저, 브로커, 투자컨설턴트는 고객의 수익보다 잦은 거래를 유도해 본인의 수수료를 취한다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 이 장은 정보 비대칭과 대리인 문제를 다룬다. 코스톨라니는 중개인·조언자·전문가가 반드시 고객과 같은 인센티브를 가지지 않는다고 본다. 그래서 남의 확신을 빌려 쓰지 말고, 최종 판단을 외주화하지 말라고 경고한다. [코스톨라니 본문] 이 장의 역할은 정보의 정글 장을 인간 인센티브 차원에서 확장하는 것이다. 누군가의 말은 틀릴 수 있을 뿐 아니라, 구조적으로 거래를 늘릴 유인도 가질 수 있다. [코스톨라니 본문] 적용 대상은 세 유형 모두다. 특히 순종투자자가 남의 시스템에 의존하기 시작할 때 가장 필요하다. [프레임워크 연결] 정보/전문가 회의론 10가지 권고·금기 [일화] [후대 해석] 공식 FIDUKA 홈페이지는 회사의 핵심 가치로 객관성, 독립성, 고객 이해 일치를 내세운다. 역으로 말하면, 코스톨라니와 헬러가 강조한 독립성은 그 당시에도 이미 업계의 일반적 인센티브 구조와 긴장관계에 있었다고 볼 수 있다. [추론] (신뢰도 A) [현대적 적용] [현대 적용] 현대 데이터도 코스톨라니의 경계심이 과도한 편견만은 아니었음을 시사한다. FT와 Barron’s는 장기적으로 sell-side 애널리스트의 호감도 높은 종목이 반드시 더 좋은 성과를 내지 못했고, 등급 변화도 미래 수익률 예측력이 약했다고 지적한다. 이는 전문가 의견을 완전히 버리라는 뜻이 아니라, 원 자료와 인센티브 구조를 함께 보라 는 뜻이다. [오해 방지] 모든 전문가가 무가치하다는 뜻은 아니다. 문제는 지식이 아니라 인센티브 불일치와 과신 이다. 전문가 의견은 입력값일 수 있지만, 결론을 대신해 주는 권위가 되어서는 안 된다."},{"i":13,"title":"12. 모험을 하려는 사람들에게","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>한번 투자병에 걸린 사람은 쉽게 헤어나오지 못한다.<\/li>\n<li>나의 경험에서 무언가를 배울 수 있다면, 일부는 주식 노름꾼에서 현명한 투자자로 거듭날 수도 있을 것이다.<\/li>\n<li>증권을 제대로 이해하고 어느 정도 통달하려면, 많은 수업료를 지불해야 한다.<\/li>\n<li>한 번 잃어버린 돈을 되찾으려는 시도는 무모한 것이며 손실을 보았으면 그 즉시 인정하고 정리한 후 0에서부터 다시 시작해야 한다.<\/li>\n<li>올바르고 숙련된 투자자는 수익을 키우고 손실은 비교적 적은 상태에서 잘라낸다.<\/li>\n<li>작은 것에 집착하는 사람은 큰 것을 가질 자격이 없다.<\/li>\n<li>기왕 돼지고기를 먹으려면 가장 기름진 부위를 먹어라.<\/li>\n<li>투자자는 포커 플레이어처럼 패가 나빠도 적게 잃고, 패가 좋으면 많이 벌어야 한다.<\/li>\n<li>전문 증권거래인의 업무의 95%는 시간 낭비이며 투자에 있어 가장 중요한 것은 바로 생각이다.<\/li>\n<\/ul>\n<h3>[보강 | 코스톨라니 본문]<\/h3>\n<ul>\n<li>[코스톨라니 본문] 마지막 장은 위험관리 규율을 말한다. 손실 복구 집착, 잦은 행동, 작은 틱 집착을 버리고, 좋은 패일 때 크게 벌고 나쁜 패일 때 적게 잃는 확률 게임으로 시장을 보라고 한다.<\/li>\n<li>[코스톨라니 본문] 여기서 말하는 “수업료”는 무모한 손실의 낭만화가 아니라, 경험에서 규칙을 뽑아내는 과정이다. 손실 뒤 즉시 인정하고 0에서 다시 시작하라는 문장은 복수매매 금지 원칙과 같다.<\/li>\n<li>[코스톨라니 본문] 적용 대상은 단기투기꾼에게 가장 직접적이지만, 장기투자자와 순종투자자에게도 필수적이다. 아무리 좋은 철학도 손실 처리 습관이 나쁘면 무너진다.<\/li>\n<\/ul>\n<h3>[프레임워크 연결]<\/h3>\n<ul>\n<li>10가지 권고·금기<\/li>\n<li>소신파/부화뇌동파<\/li>\n<li>장기투자<\/li>\n<\/ul>\n<h3>[일화]<\/h3>\n<ul>\n<li>[후대 해석] 보어젠페어라크 자료는 코스톨라니가 생애 두 차례 파산을 겪었다고 요약한다. 이 사실이 정확한 시기와 금액까지는 이번 조사에서 확인되지 않았지만, 그의 저술이 손실을 숨기지 않고 경험을 강조하는 이유를 설명하는 후대 서사로 자주 활용된다. [원문 대조 필요] (신뢰도 B)<\/li>\n<\/ul>\n<h3>[현대적 적용]<\/h3>\n<ul>\n<li>[현대 적용] 이 장의 현대 번역은 명확하다.<\/li>\n<li>손실 난 포지션을 “평단 회복” 목표로 붙들지 말 것<\/li>\n<li>레버리지 포지션은 틀렸을 때 자동 청산 구조를 먼저 계산할 것<\/li>\n<li>매매 일지를 남겨 손실 원인을 행태·가설·리스크 설계 기준으로 분해할 것<\/li>\n<li>집중할 때는 과감히 하되, 그 집중은 확신이 아니라 <strong>검증된 가설과 자금 관리<\/strong> 위에 둘 것\n  한국 개인 레버리지 열풍은 수익 확대뿐 아니라 손실 확대, 강제 매매, 감정적 복수매매 위험을 동시에 키운다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“크게 벌어라”를 집중 몰빵으로 이해하면 안 된다.<\/li>\n<li>코스톨라니는 큰 베팅을 말했지, 근거 없는 도박을 말하지 않았다.<\/li>\n<li>손실 경험은 중요하지만, 같은 실수를 반복하면 그것은 경험이 아니라 중독이다.<\/li>\n<\/ul>","text":"기존 노트 한번 투자병에 걸린 사람은 쉽게 헤어나오지 못한다. 나의 경험에서 무언가를 배울 수 있다면, 일부는 주식 노름꾼에서 현명한 투자자로 거듭날 수도 있을 것이다. 증권을 제대로 이해하고 어느 정도 통달하려면, 많은 수업료를 지불해야 한다. 한 번 잃어버린 돈을 되찾으려는 시도는 무모한 것이며 손실을 보았으면 그 즉시 인정하고 정리한 후 0에서부터 다시 시작해야 한다. 올바르고 숙련된 투자자는 수익을 키우고 손실은 비교적 적은 상태에서 잘라낸다. 작은 것에 집착하는 사람은 큰 것을 가질 자격이 없다. 기왕 돼지고기를 먹으려면 가장 기름진 부위를 먹어라. 투자자는 포커 플레이어처럼 패가 나빠도 적게 잃고, 패가 좋으면 많이 벌어야 한다. 전문 증권거래인의 업무의 95%는 시간 낭비이며 투자에 있어 가장 중요한 것은 바로 생각이다. [보강 | 코스톨라니 본문] [코스톨라니 본문] 마지막 장은 위험관리 규율을 말한다. 손실 복구 집착, 잦은 행동, 작은 틱 집착을 버리고, 좋은 패일 때 크게 벌고 나쁜 패일 때 적게 잃는 확률 게임으로 시장을 보라고 한다. [코스톨라니 본문] 여기서 말하는 “수업료”는 무모한 손실의 낭만화가 아니라, 경험에서 규칙을 뽑아내는 과정이다. 손실 뒤 즉시 인정하고 0에서 다시 시작하라는 문장은 복수매매 금지 원칙과 같다. [코스톨라니 본문] 적용 대상은 단기투기꾼에게 가장 직접적이지만, 장기투자자와 순종투자자에게도 필수적이다. 아무리 좋은 철학도 손실 처리 습관이 나쁘면 무너진다. [프레임워크 연결] 10가지 권고·금기 소신파/부화뇌동파 장기투자 [일화] [후대 해석] 보어젠페어라크 자료는 코스톨라니가 생애 두 차례 파산을 겪었다고 요약한다. 이 사실이 정확한 시기와 금액까지는 이번 조사에서 확인되지 않았지만, 그의 저술이 손실을 숨기지 않고 경험을 강조하는 이유를 설명하는 후대 서사로 자주 활용된다. [원문 대조 필요] (신뢰도 B) [현대적 적용] [현대 적용] 이 장의 현대 번역은 명확하다. 손실 난 포지션을 “평단 회복” 목표로 붙들지 말 것 레버리지 포지션은 틀렸을 때 자동 청산 구조를 먼저 계산할 것 매매 일지를 남겨 손실 원인을 행태·가설·리스크 설계 기준으로 분해할 것 집중할 때는 과감히 하되, 그 집중은 확신이 아니라 검증된 가설과 자금 관리 위에 둘 것 한국 개인 레버리지 열풍은 수익 확대뿐 아니라 손실 확대, 강제 매매, 감정적 복수매매 위험을 동시에 키운다. [오해 방지] “크게 벌어라”를 집중 몰빵으로 이해하면 안 된다. 코스톨라니는 큰 베팅을 말했지, 근거 없는 도박을 말하지 않았다. 손실 경험은 중요하지만, 같은 실수를 반복하면 그것은 경험이 아니라 중독이다."},{"i":14,"title":"부록 1. 10가지 권고 사항","html":"<ul>\n<li>매입 시기가 되었다고 판단되면 어느 나라의 무슨 업종 주식을 매입할지 결정하라.<\/li>\n<li>압박감에 시달리지 않도록 돈을 충분히 확보하고 움직여라.<\/li>\n<li>인내심을 가져라. 모든 것이 당신의 생각과 다르게 진행될 수 있음을 잊어서는 안 된다.<\/li>\n<li>확신이 있다면 강경하고 고집스럽게 밀어붙여라.<\/li>\n<li>유연하게 행동하고 자신의 생각에 오류가 있을 수 있음을 인정하라.<\/li>\n<li>새로운 국면으로 접어드는 것이 보이면 그 즉시 팔아라.<\/li>\n<li>때때로 보유한 종목의 가치를 점검하면서 지금이라도 샀을 것인지 검토하라.<\/li>\n<li>대단한 상상이 가능할 때만 매수하라.<\/li>\n<li>예측하기 힘든 리스크까지 전부 계산하라.<\/li>\n<li>자신의 주장이 옳더라도 겸손하라.<\/li>\n<\/ul>","text":"매입 시기가 되었다고 판단되면 어느 나라의 무슨 업종 주식을 매입할지 결정하라. 압박감에 시달리지 않도록 돈을 충분히 확보하고 움직여라. 인내심을 가져라. 모든 것이 당신의 생각과 다르게 진행될 수 있음을 잊어서는 안 된다. 확신이 있다면 강경하고 고집스럽게 밀어붙여라. 유연하게 행동하고 자신의 생각에 오류가 있을 수 있음을 인정하라. 새로운 국면으로 접어드는 것이 보이면 그 즉시 팔아라. 때때로 보유한 종목의 가치를 점검하면서 지금이라도 샀을 것인지 검토하라. 대단한 상상이 가능할 때만 매수하라. 예측하기 힘든 리스크까지 전부 계산하라. 자신의 주장이 옳더라도 겸손하라."},{"i":15,"title":"부록 2. 10가지 금기 사항","html":"<ul>\n<li>무작정 추천을 따르거나, 은밀하게 오가는 정보에 귀 기울이지 마라.<\/li>\n<li>파는 사람이 왜 파는지, 또는 사는 사람이 왜 사는지 그들이 알고 있을 것이라 확신하지 마라.<\/li>\n<li>다른 사람들이 더 많이 알고 있을 것 같다고 그들의 말에 신경 쓰지 마라.<\/li>\n<li>손실을 다시 복구하려고 하지 마라.<\/li>\n<li>옛 시세에 연연하지 마라.<\/li>\n<li>주식을 사놓고 언젠가는 주가가 오를 것이라는 막연한 기대에 그 주식을 잊고 지내지 마라.<\/li>\n<li>지속적으로 미세한 시세 변화를 주시하거나 단조로운 장세의 변화에 기민하게 반응하지 마라.<\/li>\n<li>당장 어디서 수익 또는 손실이 일어났는지 시시때때로 계산하지 마라.<\/li>\n<li>단기 수익을 얻으려고 팔지 마라.<\/li>\n<li>정치적 성향, 다시 말해 지지나 반대에 의해 심리적 영향을 받지 마라.<\/li>\n<li>이익이 생겼다고 교만해지지 마라.<\/li>\n<\/ul>\n<hr />","text":"무작정 추천을 따르거나, 은밀하게 오가는 정보에 귀 기울이지 마라. 파는 사람이 왜 파는지, 또는 사는 사람이 왜 사는지 그들이 알고 있을 것이라 확신하지 마라. 다른 사람들이 더 많이 알고 있을 것 같다고 그들의 말에 신경 쓰지 마라. 손실을 다시 복구하려고 하지 마라. 옛 시세에 연연하지 마라. 주식을 사놓고 언젠가는 주가가 오를 것이라는 막연한 기대에 그 주식을 잊고 지내지 마라. 지속적으로 미세한 시세 변화를 주시하거나 단조로운 장세의 변화에 기민하게 반응하지 마라. 당장 어디서 수익 또는 손실이 일어났는지 시시때때로 계산하지 마라. 단기 수익을 얻으려고 팔지 마라. 정치적 성향, 다시 말해 지지나 반대에 의해 심리적 영향을 받지 마라. 이익이 생겼다고 교만해지지 마라."},{"i":16,"title":"관련 노트","html":"<ul>\n<li>[[독서_돈_뜨겁게_사랑하고_차갑게_다루어라 (AI)|돈, 뜨겁게 사랑하고 차갑게 다루어라 (AI 요약)]]<\/li>\n<\/ul>","text":"[[독서_돈_뜨겁게_사랑하고_차갑게_다루어라 (AI)|돈, 뜨겁게 사랑하고 차갑게 다루어라 (AI 요약)]]"},{"i":17,"title":"코스톨라니의 달걀 — 6국면 완전 정리","html":"<p>정리 기준: 업로드 노트의 달걀·소신파·거래량 문장과, 보어젠페어라크의 6단계 설명 및 도표를 대조해 재구성했다. 스크린샷 기준 원 도표는 1~6단계로 제시되며, 아래 A/B 표기는 후대 정리의 편의상 붙였다. 소신파/부화뇌동파의 독일어 대응은 접근 가능한 2차 자료에서 <code>Hartgesottene<\/code>, <code>starke Hände<\/code>, <code>zittrige Hände<\/code>가 혼용되어 정확 매핑을 유보한다. [원어 확인 필요]<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>국면<\/th>\n<th>방향<\/th>\n<th>심리 상태<\/th>\n<th>거래량<\/th>\n<th>주식 보유자 분포<\/th>\n<th>관찰 신호<\/th>\n<th>권장 행동<\/th>\n<th>오판 위험<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A1 조정국면<\/td>\n<td>상승 초입<\/td>\n<td>무관심·회의·체념<\/td>\n<td>이전 투매 뒤 높거나 불안정<\/td>\n<td>소신파 비중 확대 시작<\/td>\n<td>악재 둔감, 낙폭 둔화, 바닥권 형성<\/td>\n<td>분할 매수<\/td>\n<td>싸 보인다는 이유만으로 너무 일찍 매수<\/td>\n<\/tr>\n<tr>\n<td>A2 동행국면<\/td>\n<td>상승 추세<\/td>\n<td>불신 속 수용<\/td>\n<td>완만한 증가<\/td>\n<td>소신파 우위 유지, 대중 일부 진입<\/td>\n<td>가격이 천천히 우상향, 뉴스 해석 개선<\/td>\n<td>보유·선별적 추가매수<\/td>\n<td>초반 이익 실현으로 큰 추세를 놓침<\/td>\n<\/tr>\n<tr>\n<td>A3 과장국면<\/td>\n<td>상승 후기<\/td>\n<td>낙관·탐욕·군중 참여<\/td>\n<td>매우 큼<\/td>\n<td>부화뇌동파 비중 급증, 손바뀜 진행<\/td>\n<td>호재 과잉반응, 일반인 관심 폭증, 거래대금 폭발<\/td>\n<td>분할 매도·비중 축소<\/td>\n<td>“이번엔 다르다” 서사에 취해 늦게 탈출<\/td>\n<\/tr>\n<tr>\n<td>B1 조정국면<\/td>\n<td>하락 초입<\/td>\n<td>부정·불안·희망 공존<\/td>\n<td>하락일 고거래량<\/td>\n<td>아직 부화뇌동파 잔존<\/td>\n<td>좋은 뉴스에도 반등 짧음, 추세 이탈<\/td>\n<td>매도·리스크 축소<\/td>\n<td>일시 반등을 새로운 상승 시작으로 오판<\/td>\n<\/tr>\n<tr>\n<td>B2 동행국면<\/td>\n<td>하락 추세<\/td>\n<td>실망·무기력<\/td>\n<td>줄거나 반등 때만 증가<\/td>\n<td>약한 손의 청산이 계속<\/td>\n<td>장기 저점 갱신, 매수세 미약<\/td>\n<td>관망·현금 확보·짧은 채권 대기<\/td>\n<td>지루함에 못 이겨 근거 없는 저가매수<\/td>\n<\/tr>\n<tr>\n<td>B3 과장국면<\/td>\n<td>하락 후기<\/td>\n<td>공포·투매·혐오<\/td>\n<td>투매 시 급증 가능<\/td>\n<td>소신파가 다시 모을 준비<\/td>\n<td>악재에도 추가 급락 둔화, 강제매도 흔적<\/td>\n<td>분할 매수 시작<\/td>\n<td>시스템 리스크를 과소평가하고 성급히 몰빵<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol>\n<li>[코스톨라니 본문] 하락 과장국면의 끝에서는 부화뇌동파가 버티지 못해 손이 바뀐다. [후대 해석] 접근 가능한 독일어 2차 자료는 이 손바뀜을 “강한 손→흔들리는 손”, 혹은 그 반대로 설명하는데, 핵심은 충분한 자금과 인내를 가진 쪽으로 물량이 넘어간다는 점이다.<\/li>\n<li>[코스톨라니 본문] 시장이 회복되면 처음에는 소수만 믿고, 이후 돈이 풀리고 심리가 개선되면서 대중이 뒤늦게 유입된다. 이때 상승은 오히려 뉴스보다 <strong>참가자 확장<\/strong>으로 가속된다.<\/li>\n<li>[코스톨라니 본문] 강세장 과장국면에서는 거래량과 관심이 늘고, 대중 서사가 가격을 정당화하기 시작한다. [후대 해석] 청소해 주는 사람까지 종목을 추천하는지 보라는 예시는 이 국면의 과열 감지 장치다.<\/li>\n<li>[코스톨라니 본문] 하락 전환은 갑작스러워 보이지만, 실제로는 손바뀜이 끝난 뒤 더 살 사람이 줄고, 좋은 뉴스도 더 이상 가격을 못 올리는 순간부터 준비된다. 이것이 기정사실화와 연결된다.<\/li>\n<li>[코스톨라니 본문] 약세장 과장국면은 공포가 지배하지만, 바로 그 때문에 기대치가 낮아져 좋은 기회가 만들어진다. 다만 <strong>돈이 있는 소신파<\/strong>만 그 기회를 활용할 수 있다.<\/li>\n<li>[추론] 달걀은 미래를 맞히는 공식이 아니라, 현재 시장 위치를 추정하고 자신의 행동 규칙을 정렬하는 도구다. 현대 시장에서도 이 프레임은 금리·유동성·거래량·대중 참여·뉴스 반응을 함께 볼 때 가장 실용적이다.<\/li>\n<\/ol>","text":"정리 기준: 업로드 노트의 달걀·소신파·거래량 문장과, 보어젠페어라크의 6단계 설명 및 도표를 대조해 재구성했다. 스크린샷 기준 원 도표는 1~6단계로 제시되며, 아래 A/B 표기는 후대 정리의 편의상 붙였다. 소신파/부화뇌동파의 독일어 대응은 접근 가능한 2차 자료에서 Hartgesottene , starke Hände , zittrige Hände 가 혼용되어 정확 매핑을 유보한다. [원어 확인 필요] 국면 방향 심리 상태 거래량 주식 보유자 분포 관찰 신호 권장 행동 오판 위험 A1 조정국면 상승 초입 무관심·회의·체념 이전 투매 뒤 높거나 불안정 소신파 비중 확대 시작 악재 둔감, 낙폭 둔화, 바닥권 형성 분할 매수 싸 보인다는 이유만으로 너무 일찍 매수 A2 동행국면 상승 추세 불신 속 수용 완만한 증가 소신파 우위 유지, 대중 일부 진입 가격이 천천히 우상향, 뉴스 해석 개선 보유·선별적 추가매수 초반 이익 실현으로 큰 추세를 놓침 A3 과장국면 상승 후기 낙관·탐욕·군중 참여 매우 큼 부화뇌동파 비중 급증, 손바뀜 진행 호재 과잉반응, 일반인 관심 폭증, 거래대금 폭발 분할 매도·비중 축소 “이번엔 다르다” 서사에 취해 늦게 탈출 B1 조정국면 하락 초입 부정·불안·희망 공존 하락일 고거래량 아직 부화뇌동파 잔존 좋은 뉴스에도 반등 짧음, 추세 이탈 매도·리스크 축소 일시 반등을 새로운 상승 시작으로 오판 B2 동행국면 하락 추세 실망·무기력 줄거나 반등 때만 증가 약한 손의 청산이 계속 장기 저점 갱신, 매수세 미약 관망·현금 확보·짧은 채권 대기 지루함에 못 이겨 근거 없는 저가매수 B3 과장국면 하락 후기 공포·투매·혐오 투매 시 급증 가능 소신파가 다시 모을 준비 악재에도 추가 급락 둔화, 강제매도 흔적 분할 매수 시작 시스템 리스크를 과소평가하고 성급히 몰빵 [코스톨라니 본문] 하락 과장국면의 끝에서는 부화뇌동파가 버티지 못해 손이 바뀐다. [후대 해석] 접근 가능한 독일어 2차 자료는 이 손바뀜을 “강한 손→흔들리는 손”, 혹은 그 반대로 설명하는데, 핵심은 충분한 자금과 인내를 가진 쪽으로 물량이 넘어간다는 점이다. [코스톨라니 본문] 시장이 회복되면 처음에는 소수만 믿고, 이후 돈이 풀리고 심리가 개선되면서 대중이 뒤늦게 유입된다. 이때 상승은 오히려 뉴스보다 참가자 확장 으로 가속된다. [코스톨라니 본문] 강세장 과장국면에서는 거래량과 관심이 늘고, 대중 서사가 가격을 정당화하기 시작한다. [후대 해석] 청소해 주는 사람까지 종목을 추천하는지 보라는 예시는 이 국면의 과열 감지 장치다. [코스톨라니 본문] 하락 전환은 갑작스러워 보이지만, 실제로는 손바뀜이 끝난 뒤 더 살 사람이 줄고, 좋은 뉴스도 더 이상 가격을 못 올리는 순간부터 준비된다. 이것이 기정사실화와 연결된다. [코스톨라니 본문] 약세장 과장국면은 공포가 지배하지만, 바로 그 때문에 기대치가 낮아져 좋은 기회가 만들어진다. 다만 돈이 있는 소신파 만 그 기회를 활용할 수 있다. [추론] 달걀은 미래를 맞히는 공식이 아니라, 현재 시장 위치를 추정하고 자신의 행동 규칙을 정렬하는 도구다. 현대 시장에서도 이 프레임은 금리·유동성·거래량·대중 참여·뉴스 반응을 함께 볼 때 가장 실용적이다."},{"i":18,"title":"소신파 되기 체크리스트","html":"<p>정리 기준: 소신파의 네 요소는 업로드 노트와 독일어 2차 요약 PDF의 네 가지 G를 기준으로 재구성했다.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>요소<\/th>\n<th>의미<\/th>\n<th>자기진단 질문<\/th>\n<th>부족할 때 생기는 실패<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>돈<\/td>\n<td>틀려도 버틸 수 있는 자기 자본<\/td>\n<td>이 포지션이 30~50% 흔들려도 생활이 흔들리지 않는가<\/td>\n<td>강제 청산, 손절 후 재진입 실패, 공포성 매도<\/td>\n<\/tr>\n<tr>\n<td>생각<\/td>\n<td>남의 추천이 아닌 자기 논리<\/td>\n<td>내가 이 자산을 왜 사는지 3문장으로 설명 가능한가<\/td>\n<td>뉴스·전문가·커뮤니티에 휩쓸림<\/td>\n<\/tr>\n<tr>\n<td>인내<\/td>\n<td>가격보다 시간과 국면을 견디는 힘<\/td>\n<td>내 가설의 유효 기간을 미리 정했는가<\/td>\n<td>이익 조기 실현, 손실 구간 불필요한 포기<\/td>\n<\/tr>\n<tr>\n<td>행운<\/td>\n<td>외생 쇼크를 통과할 여지<\/td>\n<td>내 가설을 무너뜨릴 비예측 리스크를 상정했는가<\/td>\n<td>맞는 가설도 전쟁·정책 충격·유동성 경색에 파손<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"정리 기준: 소신파의 네 요소는 업로드 노트와 독일어 2차 요약 PDF의 네 가지 G를 기준으로 재구성했다. 요소 의미 자기진단 질문 부족할 때 생기는 실패 돈 틀려도 버틸 수 있는 자기 자본 이 포지션이 30~50% 흔들려도 생활이 흔들리지 않는가 강제 청산, 손절 후 재진입 실패, 공포성 매도 생각 남의 추천이 아닌 자기 논리 내가 이 자산을 왜 사는지 3문장으로 설명 가능한가 뉴스·전문가·커뮤니티에 휩쓸림 인내 가격보다 시간과 국면을 견디는 힘 내 가설의 유효 기간을 미리 정했는가 이익 조기 실현, 손실 구간 불필요한 포기 행운 외생 쇼크를 통과할 여지 내 가설을 무너뜨릴 비예측 리스크를 상정했는가 맞는 가설도 전쟁·정책 충격·유동성 경색에 파손"},{"i":19,"title":"돈·심리 매트릭스","html":"<p>다음 매트릭스는 코스톨라니의 “돈 + 심리 = 트렌드”를 현대 실전용으로 추론 정리한 것이다. 돈은 유동성·금리·신용·장기금리 상대매력을 포함하고, 심리는 대중 참여·뉴스 반응·투기성 자금 유입을 포함한다. [추론]<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>돈<\/th>\n<th>심리<\/th>\n<th>시장 상태<\/th>\n<th>전형적 투자자 행동<\/th>\n<th>코스톨라니식 해석<\/th>\n<th>권장 행동<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>긍정<\/td>\n<td>긍정<\/td>\n<td>강한 상승 혹은 후기 과열<\/td>\n<td>FOMO, 테마 확장, 약한 손 유입<\/td>\n<td>강세는 맞지만 후반부일수록 손바뀜을 의심<\/td>\n<td>보유하되 분할 매도 준비<\/td>\n<\/tr>\n<tr>\n<td>긍정<\/td>\n<td>부정<\/td>\n<td>상승 초입·불신 랠리<\/td>\n<td>뉴스 불신, 현금 과다, 회의적 반등<\/td>\n<td>가장 좋은 위험보상 구간이 되기 쉬움<\/td>\n<td>분할 매수·비중 확대<\/td>\n<\/tr>\n<tr>\n<td>부정<\/td>\n<td>긍정<\/td>\n<td>취약한 후기 강세<\/td>\n<td>좋은 스토리, 나쁜 유동성, 밸류 부담<\/td>\n<td>돈이 꺼지는데 심리만 버티는 국면<\/td>\n<td>비중 축소·현금 확보<\/td>\n<\/tr>\n<tr>\n<td>부정<\/td>\n<td>부정<\/td>\n<td>약세·공황·신용 경색<\/td>\n<td>투매, 환매, 복수매매<\/td>\n<td>바닥은 아니더라도 기회가 만들어질 수 있는 구간<\/td>\n<td>즉시 몰빵 금지, 관망 후 단계적 매수<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"다음 매트릭스는 코스톨라니의 “돈 + 심리 = 트렌드”를 현대 실전용으로 추론 정리한 것이다. 돈은 유동성·금리·신용·장기금리 상대매력을 포함하고, 심리는 대중 참여·뉴스 반응·투기성 자금 유입을 포함한다. [추론] 돈 심리 시장 상태 전형적 투자자 행동 코스톨라니식 해석 권장 행동 긍정 긍정 강한 상승 혹은 후기 과열 FOMO, 테마 확장, 약한 손 유입 강세는 맞지만 후반부일수록 손바뀜을 의심 보유하되 분할 매도 준비 긍정 부정 상승 초입·불신 랠리 뉴스 불신, 현금 과다, 회의적 반등 가장 좋은 위험보상 구간이 되기 쉬움 분할 매수·비중 확대 부정 긍정 취약한 후기 강세 좋은 스토리, 나쁜 유동성, 밸류 부담 돈이 꺼지는데 심리만 버티는 국면 비중 축소·현금 확보 부정 부정 약세·공황·신용 경색 투매, 환매, 복수매매 바닥은 아니더라도 기회가 만들어질 수 있는 구간 즉시 몰빵 금지, 관망 후 단계적 매수"},{"i":20,"title":"코스톨라니식 시장온도 점검표","html":"<ul>\n<li>금리: 정책금리의 방향보다 <strong>왜 움직이는지<\/strong>를 먼저 본다. 인플레이션 둔화의 정상화 인하인지, 침체·위기 대응 인하인지 구분한다. 장기금리가 안 내려오면 주식 할인율은 생각만큼 완화되지 않을 수 있다.<\/li>\n<li>유동성: 중앙은행 완화, 신용 팽창, ETF 자금 유입, 레버리지 확대가 동반되는지 본다. 돈이 들어오면 추세가 오래간다.<\/li>\n<li>거래량: 상승 말기의 고거래량은 과열 신호일 수 있고, 투매 말기의 고거래량은 손바뀜 시작일 수 있다. 거래량은 방향보다 맥락이 중요하다.<\/li>\n<li>대중 관심: 일반 뉴스, 커뮤니티, 주변인의 종목 대화가 급증하는가. 군중 참여는 보통 후기 신호다.<\/li>\n<li>뉴스 반응: 좋은 뉴스에도 못 오르면 과열, 나쁜 뉴스에도 덜 빠지면 바닥 근접 가능성을 의심한다.<\/li>\n<li>전문가 추천: 추천의 내용보다 인센티브 구조와 합의 쏠림을 본다. 만장일치 낙관은 종종 후기 신호다.<\/li>\n<li>신용거래: 빚이 늘수록 약한 손 비중이 늘어난다. 강세 후반부에는 상승을 키우지만 하락 전환 시 낙폭도 키운다.<\/li>\n<li>신규 상장/테마: IPO 과열, 특정 테마 ETF 급증, 단일 종목 레버리지 상품 확대는 유동성과 심리의 결합 신호다.<\/li>\n<li>악재와 호재에 대한 시장 반응: 재료의 절대 크기보다 기대 대비 반응을 기록한다. 이것이 기정사실화 판정의 실무다.<\/li>\n<li>소신파와 부화뇌동파의 손바뀜: 급락 뒤 버티는 장기 자금이 늘고 있는지, 급등 뒤 늦게 들어온 대중 자금이 늘고 있는지 본다. 최소한 “누가 이 물량을 들고 있나”를 계속 질문한다.<\/li>\n<\/ul>","text":"금리: 정책금리의 방향보다 왜 움직이는지 를 먼저 본다. 인플레이션 둔화의 정상화 인하인지, 침체·위기 대응 인하인지 구분한다. 장기금리가 안 내려오면 주식 할인율은 생각만큼 완화되지 않을 수 있다. 유동성: 중앙은행 완화, 신용 팽창, ETF 자금 유입, 레버리지 확대가 동반되는지 본다. 돈이 들어오면 추세가 오래간다. 거래량: 상승 말기의 고거래량은 과열 신호일 수 있고, 투매 말기의 고거래량은 손바뀜 시작일 수 있다. 거래량은 방향보다 맥락이 중요하다. 대중 관심: 일반 뉴스, 커뮤니티, 주변인의 종목 대화가 급증하는가. 군중 참여는 보통 후기 신호다. 뉴스 반응: 좋은 뉴스에도 못 오르면 과열, 나쁜 뉴스에도 덜 빠지면 바닥 근접 가능성을 의심한다. 전문가 추천: 추천의 내용보다 인센티브 구조와 합의 쏠림을 본다. 만장일치 낙관은 종종 후기 신호다. 신용거래: 빚이 늘수록 약한 손 비중이 늘어난다. 강세 후반부에는 상승을 키우지만 하락 전환 시 낙폭도 키운다. 신규 상장/테마: IPO 과열, 특정 테마 ETF 급증, 단일 종목 레버리지 상품 확대는 유동성과 심리의 결합 신호다. 악재와 호재에 대한 시장 반응: 재료의 절대 크기보다 기대 대비 반응을 기록한다. 이것이 기정사실화 판정의 실무다. 소신파와 부화뇌동파의 손바뀜: 급락 뒤 버티는 장기 자금이 늘고 있는지, 급등 뒤 늦게 들어온 대중 자금이 늘고 있는지 본다. 최소한 “누가 이 물량을 들고 있나”를 계속 질문한다."},{"i":21,"title":"10가지 권고·10가지 금기 실전 변환표","html":"<p>기준: 업로드 노트의 부록 불릿을 실전 운영 규칙으로 번역했다. 다만 입력 노트의 금기 리스트는 11행이므로, 기존 불릿을 보존하기 위해 아래 표에도 11행을 모두 반영했다. [원문 대조 필요]<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>원문 항목<\/th>\n<th>실전 의미<\/th>\n<th>행동 기준<\/th>\n<th>위반 시 위험<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>매입 시기가 되었다고 판단되면 어느 나라의 무슨 업종 주식을 매입할지 결정하라.<\/td>\n<td>종목보다 시장과 섹터가 먼저다<\/td>\n<td>자산군→국가→섹터→종목 순으로 결정<\/td>\n<td>좋은 종목을 나쁜 국면에 사게 됨<\/td>\n<\/tr>\n<tr>\n<td>압박감에 시달리지 않도록 돈을 충분히 확보하고 움직여라.<\/td>\n<td>생계자금과 투자자금 분리<\/td>\n<td>현금비중·비상자금 사전 확보<\/td>\n<td>저점에서 강제 매도<\/td>\n<\/tr>\n<tr>\n<td>인내심을 가져라. 모든 것이 당신의 생각과 다르게 진행될 수 있음을 잊어서는 안 된다.<\/td>\n<td>시간 오차를 감수하라<\/td>\n<td>가설 유효 기간을 미리 설정<\/td>\n<td>조급한 손절·조기익절<\/td>\n<\/tr>\n<tr>\n<td>확신이 있다면 강경하고 고집스럽게 밀어붙여라.<\/td>\n<td>맞는 가설에는 집중하라<\/td>\n<td>근거가 살아 있을 때만 비중 확대<\/td>\n<td>확신 부족으로 분산 과잉<\/td>\n<\/tr>\n<tr>\n<td>유연하게 행동하고 자신의 생각에 오류가 있을 수 있음을 인정하라.<\/td>\n<td>확신과 수정 가능성을 동시에 유지<\/td>\n<td>반증 조건을 미리 적어 둠<\/td>\n<td>고집과 소신을 혼동<\/td>\n<\/tr>\n<tr>\n<td>새로운 국면으로 접어드는 것이 보이면 그 즉시 팔아라.<\/td>\n<td>추세 전환 신호에 늦지 말라<\/td>\n<td>호재 둔감·과열 손바뀜·장기금리 급등 감지 시 축소<\/td>\n<td>후기 과열을 끝까지 보유<\/td>\n<\/tr>\n<tr>\n<td>때때로 보유한 종목의 가치를 점검하면서 지금이라도 샀을 것인지 검토하라.<\/td>\n<td>보유 사유를 재평가하라<\/td>\n<td>분기별로 “지금 처음 보면 살까?” 질문<\/td>\n<td>매몰비용 오류<\/td>\n<\/tr>\n<tr>\n<td>대단한 상상이 가능할 때만 매수하라.<\/td>\n<td>기대 변화가 큰 자산만 사라<\/td>\n<td>성장 서사의 질과 지속성 평가<\/td>\n<td>평범한 종목에 과도한 기대<\/td>\n<\/tr>\n<tr>\n<td>예측하기 힘든 리스크까지 전부 계산하라.<\/td>\n<td>꼬리위험을 상정하라<\/td>\n<td>전쟁·정책·유동성·환율 리스크 시나리오 작성<\/td>\n<td>한 번의 외생 쇼크로 가설 붕괴<\/td>\n<\/tr>\n<tr>\n<td>자신의 주장이 옳더라도 겸손하라.<\/td>\n<td>시장은 늘 더 복잡하다<\/td>\n<td>승리 뒤 레버리지 확대 자제<\/td>\n<td>과신, 규모 확대, 다음 사이클 손실<\/td>\n<\/tr>\n<tr>\n<td>무작정 추천을 따르거나, 은밀하게 오가는 정보에 귀 기울이지 마라.<\/td>\n<td>팁 추종 금지<\/td>\n<td>출처·인센티브 확인 전 매수 금지<\/td>\n<td>정보 사기, 늦은 진입<\/td>\n<\/tr>\n<tr>\n<td>파는 사람이 왜 파는지, 또는 사는 사람이 왜 사는지 그들이 알고 있을 것이라 확신하지 마라.<\/td>\n<td>타인의 거래를 의미화하지 말라<\/td>\n<td>거래 상대방의 우월정보 가정 금지<\/td>\n<td>과도한 신호 읽기<\/td>\n<\/tr>\n<tr>\n<td>다른 사람들이 더 많이 알고 있을 것 같다고 그들의 말에 신경 쓰지 마라.<\/td>\n<td>권위 편향 경계<\/td>\n<td>내 가설과 체크리스트 우선<\/td>\n<td>전문가 추종으로 논리 상실<\/td>\n<\/tr>\n<tr>\n<td>손실을 다시 복구하려고 하지 마라.<\/td>\n<td>복수매매 금지<\/td>\n<td>손실 뒤 포지션 축소·재설계<\/td>\n<td>더 큰 손실<\/td>\n<\/tr>\n<tr>\n<td>옛 시세에 연연하지 마라.<\/td>\n<td>앵커링 금지<\/td>\n<td>매수가 아닌 현재 확률 기준 판단<\/td>\n<td>200에서 샀으니 200 올 때까지 존버<\/td>\n<\/tr>\n<tr>\n<td>주식을 사놓고 언젠가는 주가가 오를 것이라는 막연한 기대에 그 주식을 잊고 지내지 마라.<\/td>\n<td>방치와 장기투자는 다르다<\/td>\n<td>가설·펀더멘털 재점검<\/td>\n<td>구조적 악화 종목 장기 보유<\/td>\n<\/tr>\n<tr>\n<td>지속적으로 미세한 시세 변화를 주시하거나 단조로운 장세의 변화에 기민하게 반응하지 마라.<\/td>\n<td>틱 단위 집착 금지<\/td>\n<td>관찰 주기를 늘리고 기준을 정함<\/td>\n<td>과매매·수수료 누적<\/td>\n<\/tr>\n<tr>\n<td>당장 어디서 수익 또는 손실이 일어났는지 시시때때로 계산하지 마라.<\/td>\n<td>P/L 중독 금지<\/td>\n<td>평가 빈도 제한<\/td>\n<td>감정 의사결정<\/td>\n<\/tr>\n<tr>\n<td>단기 수익을 얻으려고 팔지 마라.<\/td>\n<td>큰 추세를 놓치지 말라<\/td>\n<td>목표가보다 국면 변화 기준 활용<\/td>\n<td>2배 종목을 10%에서 매도<\/td>\n<\/tr>\n<tr>\n<td>정치적 성향, 다시 말해 지지나 반대에 의해 심리적 영향을 받지 마라.<\/td>\n<td>정치와 포지션을 분리하라<\/td>\n<td>정책효과와 가격반응을 분리 평가<\/td>\n<td>이념적 보유·매도<\/td>\n<\/tr>\n<tr>\n<td>이익이 생겼다고 교만해지지 마라.<\/td>\n<td>수익 뒤 규율 유지<\/td>\n<td>수익 후에도 원칙 동일 적용<\/td>\n<td>과신·레버리지 확대·회전 증가<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"기준: 업로드 노트의 부록 불릿을 실전 운영 규칙으로 번역했다. 다만 입력 노트의 금기 리스트는 11행이므로, 기존 불릿을 보존하기 위해 아래 표에도 11행을 모두 반영했다. [원문 대조 필요] 원문 항목 실전 의미 행동 기준 위반 시 위험 매입 시기가 되었다고 판단되면 어느 나라의 무슨 업종 주식을 매입할지 결정하라. 종목보다 시장과 섹터가 먼저다 자산군→국가→섹터→종목 순으로 결정 좋은 종목을 나쁜 국면에 사게 됨 압박감에 시달리지 않도록 돈을 충분히 확보하고 움직여라. 생계자금과 투자자금 분리 현금비중·비상자금 사전 확보 저점에서 강제 매도 인내심을 가져라. 모든 것이 당신의 생각과 다르게 진행될 수 있음을 잊어서는 안 된다. 시간 오차를 감수하라 가설 유효 기간을 미리 설정 조급한 손절·조기익절 확신이 있다면 강경하고 고집스럽게 밀어붙여라. 맞는 가설에는 집중하라 근거가 살아 있을 때만 비중 확대 확신 부족으로 분산 과잉 유연하게 행동하고 자신의 생각에 오류가 있을 수 있음을 인정하라. 확신과 수정 가능성을 동시에 유지 반증 조건을 미리 적어 둠 고집과 소신을 혼동 새로운 국면으로 접어드는 것이 보이면 그 즉시 팔아라. 추세 전환 신호에 늦지 말라 호재 둔감·과열 손바뀜·장기금리 급등 감지 시 축소 후기 과열을 끝까지 보유 때때로 보유한 종목의 가치를 점검하면서 지금이라도 샀을 것인지 검토하라. 보유 사유를 재평가하라 분기별로 “지금 처음 보면 살까?” 질문 매몰비용 오류 대단한 상상이 가능할 때만 매수하라. 기대 변화가 큰 자산만 사라 성장 서사의 질과 지속성 평가 평범한 종목에 과도한 기대 예측하기 힘든 리스크까지 전부 계산하라. 꼬리위험을 상정하라 전쟁·정책·유동성·환율 리스크 시나리오 작성 한 번의 외생 쇼크로 가설 붕괴 자신의 주장이 옳더라도 겸손하라. 시장은 늘 더 복잡하다 승리 뒤 레버리지 확대 자제 과신, 규모 확대, 다음 사이클 손실 무작정 추천을 따르거나, 은밀하게 오가는 정보에 귀 기울이지 마라. 팁 추종 금지 출처·인센티브 확인 전 매수 금지 정보 사기, 늦은 진입 파는 사람이 왜 파는지, 또는 사는 사람이 왜 사는지 그들이 알고 있을 것이라 확신하지 마라. 타인의 거래를 의미화하지 말라 거래 상대방의 우월정보 가정 금지 과도한 신호 읽기 다른 사람들이 더 많이 알고 있을 것 같다고 그들의 말에 신경 쓰지 마라. 권위 편향 경계 내 가설과 체크리스트 우선 전문가 추종으로 논리 상실 손실을 다시 복구하려고 하지 마라. 복수매매 금지 손실 뒤 포지션 축소·재설계 더 큰 손실 옛 시세에 연연하지 마라. 앵커링 금지 매수가 아닌 현재 확률 기준 판단 200에서 샀으니 200 올 때까지 존버 주식을 사놓고 언젠가는 주가가 오를 것이라는 막연한 기대에 그 주식을 잊고 지내지 마라. 방치와 장기투자는 다르다 가설·펀더멘털 재점검 구조적 악화 종목 장기 보유 지속적으로 미세한 시세 변화를 주시하거나 단조로운 장세의 변화에 기민하게 반응하지 마라. 틱 단위 집착 금지 관찰 주기를 늘리고 기준을 정함 과매매·수수료 누적 당장 어디서 수익 또는 손실이 일어났는지 시시때때로 계산하지 마라. P/L 중독 금지 평가 빈도 제한 감정 의사결정 단기 수익을 얻으려고 팔지 마라. 큰 추세를 놓치지 말라 목표가보다 국면 변화 기준 활용 2배 종목을 10%에서 매도 정치적 성향, 다시 말해 지지나 반대에 의해 심리적 영향을 받지 마라. 정치와 포지션을 분리하라 정책효과와 가격반응을 분리 평가 이념적 보유·매도 이익이 생겼다고 교만해지지 마라. 수익 뒤 규율 유지 수익 후에도 원칙 동일 적용 과신·레버리지 확대·회전 증가"},{"i":22,"title":"한계와 미확인 항목","html":"<ul>\n<li>[원어 확인 필요] 소신파/부화뇌동파의 정확한 독일어 원어는 접근 가능한 2차 자료에서 <code>Hartgesottene<\/code>, <code>starke Hände<\/code>, <code>zittrige Hände<\/code>가 혼용되어 1차 문헌 대조가 필요하다.<\/li>\n<li>[원문 대조 필요] M·W 이론의 원문 문맥과 독일어 표현을 이번 조사에서는 확인하지 못했다. 따라서 기계적 차트 예측법으로 단정하지 않았다.<\/li>\n<li>[출처 취약] 1929년 대공황 전후 공매도 세부 내역, 전후 독일·프랑스 채권 매입 단가, 러시아 제국 채권 관련 구체 사례는 A/B급 공개 1차 자료 확인이 충분하지 않았다. 이번 문서에서는 단정 대신 보수적으로 처리했다.<\/li>\n<li>[출처 취약] 13권, 8개 언어, 414개 칼럼 등 일부 생애 수치는 위키 계열 2차 자료 의존도가 높아 핵심 주장으로 사용하지 않았다.<\/li>\n<\/ul>","text":"[원어 확인 필요] 소신파/부화뇌동파의 정확한 독일어 원어는 접근 가능한 2차 자료에서 Hartgesottene , starke Hände , zittrige Hände 가 혼용되어 1차 문헌 대조가 필요하다. [원문 대조 필요] M·W 이론의 원문 문맥과 독일어 표현을 이번 조사에서는 확인하지 못했다. 따라서 기계적 차트 예측법으로 단정하지 않았다. [출처 취약] 1929년 대공황 전후 공매도 세부 내역, 전후 독일·프랑스 채권 매입 단가, 러시아 제국 채권 관련 구체 사례는 A/B급 공개 1차 자료 확인이 충분하지 않았다. 이번 문서에서는 단정 대신 보수적으로 처리했다. [출처 취약] 13권, 8개 언어, 414개 칼럼 등 일부 생애 수치는 위키 계열 2차 자료 의존도가 높아 핵심 주장으로 사용하지 않았다."},{"i":23,"title":"출처 목록","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>출처명<\/th>\n<th>저자/기관<\/th>\n<th style=\"text-align: right;\">연도<\/th>\n<th>사용한 내용<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>입력 자료<\/td>\n<td>독서_돈_뜨겁게_사랑하고_차갑게_다루어라.md<\/td>\n<td>사용자 업로드 파일<\/td>\n<td style=\"text-align: right;\">2026<\/td>\n<td>장별 기존 노트, 달걀·금리·심리·차트 관련 기준선<\/td>\n<td>입력 자료<\/td>\n<\/tr>\n<tr>\n<td>공식 기관<\/td>\n<td>Katalog der Deutschen Nationalbibliothek<\/td>\n<td>Deutsche Nationalbibliothek<\/td>\n<td style=\"text-align: right;\">2026<\/td>\n<td>저작·번역서 존재 확인, 서지 정보<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>공식 문서<\/td>\n<td>Historical Documents, FRUS: Hague reparations agreement<\/td>\n<td>U.S. Office of the Historian<\/td>\n<td style=\"text-align: right;\">1930/현행 공개<\/td>\n<td>Young Plan의 제도·채무 구조·시행 시점<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>공식 기관<\/td>\n<td>FIDUKA 홈페이지<\/td>\n<td>FIDUKA<\/td>\n<td style=\"text-align: right;\">2026<\/td>\n<td>1971 공동 창립, 운용 철학, 독립성 강조<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>2차 요약<\/td>\n<td>kostolany-web.pdf<\/td>\n<td>Börsenverlag<\/td>\n<td style=\"text-align: right;\">연도 미상<\/td>\n<td>달걀 6단계, 네 가지 G, 수면제 시간, 손바뀜 설명<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>전기 회고<\/td>\n<td>André Kostolany: Bonvivant und wacher Kopf<\/td>\n<td>Wolfgang Stock / STOCKPRESS<\/td>\n<td style=\"text-align: right;\">2010<\/td , 전후 독일·프랑스 채권, 1929년 공매도 등은 출처 등급과 불확실성 표기를 유지<\/td>\n<\/tr>\n<tr>\n<td>수면제 발언<\/td>\n<td>행동 원칙으로 사용 가능<\/td>\n<td>우량 자산·낮은 레버리지·긴 시간축이라는 전제와 함께 사용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>통합 Run 사용 메모<\/h3>\n<ul>\n<li>Run 7 통합 문서에서는 코스톨라니를 “시장 예측가”가 아니라 “돈·심리·손바뀜·국면을 관찰하는 투자 심리 사상가”로 다루는 것이 안전하다.<\/li>\n<li>생애 일화보다 달걀, 소신파, 돈+심리 매트릭스, 금리와 유동성, 기정사실화 원리를 중심 근거로 사용한다.<\/li>\n<\/ul>","text":"기준 파일: 03_돈뜨겁게사랑하고차갑게다루어라_deepresearch_v1.md 추가 검증 파일: 03_돈뜨겁게사랑하고차갑게다루어라_deepresearch_v1_add.md 확인 결과: 현재 업로드된 v1_add 는 v1 과 동일한 본문이므로, 별도 대체 패치 없이 v1 을 최종본 기준으로 유지했다. 편집 원칙: 기존 frontmatter, 제목, 장 헤더, 기존 불릿을 그대로 유지하고, 본문에 이미 들어 있는 [원어 확인 필요] , [원문 대조 필요] , [출처 취약] 표기를 제거하지 않았다. 항목 최종 처리 통합 Run 사용 방식 코스톨라니의 달걀 프레임워크로 사용 가능 기계적 예측 공식이 아니라 현재 시장 위치 판단 도구로만 사용 소신파/부화뇌동파 개념 프레임으로 사용 가능 독일어 원어는 [원어 확인 필요] 유지 돈 + 심리 = 트렌드 핵심 통합 프레임으로 사용 가능 금리·유동성·대중심리의 조합 모델로 활용 생애·투자 일화 보조 자료로만 사용 러시아 제국 채권, 전후 독일·프랑스 채권, 1929년 공매도 등은 출처 등급과 불확실성 표기를 유지 수면제 발언 행동 원칙으로 사용 가능 우량 자산·낮은 레버리지·긴 시간축이라는 전제와 함께 사용 통합 Run 사용 메모 Run 7 통합 문서에서는 코스톨라니를 “시장 예측가”가 아니라 “돈·심리·손바뀜·국면을 관찰하는 투자 심리 사상가”로 다루는 것이 안전하다. 생애 일화보다 달걀, 소신파, 돈+심리 매트릭스, 금리와 유동성, 기정사실화 원리를 중심 근거로 사용한다."}]},{"id":"04","title":"[독서] 모든 주식을 소유하라","short":"모든 주식을 소유하라","author":"보글","chapters":[{"i":0,"title":"문서 안내","html":"<hr />\n<p>title: \"[독서] 모든 주식을 소유하라\"\naliases: [\"모든 주식을 소유하라\", \"The Little Book of Common Sense Investing\", \"존 보글\", \"John Bogle\"]\ntype: book-note-personal\ncategory: 독서\nauthor: 존 보글 (John C. Bogle)\ndate_read: 2026-03-31\ndate: 2026-03-31\nstatus: complete\ntags:\n  - 독서\n  - 투자\n  - 인덱스펀드\n  - 패시브투자\n  - 존보글<\/p>\n<hr />\n<p><strong>읽은 날짜:<\/strong> 2026.03.31<\/p>\n<hr />","text":"title: \"[독서] 모든 주식을 소유하라\" aliases: [\"모든 주식을 소유하라\", \"The Little Book of Common Sense Investing\", \"존 보글\", \"John Bogle\"] type: book-note-personal category: 독서 author: 존 보글 (John C. Bogle) date_read: 2026-03-31 date: 2026-03-31 status: complete tags: - 독서 - 투자 - 인덱스펀드 - 패시브투자 - 존보글 읽은 날짜: 2026.03.31"},{"i":1,"title":"0. 서문","html":"<ul>\n<li>이기는 게임을 지는 게임으로 만들지 마라.<\/li>\n<li>워런 버핏이 언급했듯이 '상식에 기반을 둔 투자'를 하는 것이 가장 좋은 방법이다.<\/li>\n<li>이미 검증이 된 아주 확실한 성공투자 전략은 바로 저렴한 비용으로 미국 내 상장기업의 주식 전부를 고루 보유하는 것이다.<\/li>\n<li>인덱스펀드는 개별 주식 종목, 특정 시장 부문, 펀드매니저 등의 선택에 따른 위험을 제거해주고 주식시장 위험 하나만 남겨준다.<\/li>\n<li>복리수익의 기적, 복리비용의 횡포<\/li>\n<li>투자와 관련한 비용을 공제한 후, 시장을 이기겠다고 덤비는 투자 게임은 지는 게임이다.<\/li>\n<li>성공투자란 기업이 벌어들이는 수익 가운데 월가가 가져가는 수익을 최소화하고 일반 투자자가 가져가는 몫을 극대화하는 것을 의미한다.<\/li>\n<li>펀드투자자는 자신들이 우수한 펀드매니저를 쉽게 선택할 수 있다고 확신하지만 그것은 잘못된 생각이다.<\/li>\n<li>인덱스펀드를 샀으면 계속 얼쩡대며 머물러 있지 말고 그 즉시 카지노에서 나와라.<\/li>\n<li>투자에 관한 진실을 추구하는 일 외에 다른 속셈이 없고 기본적으로 내 생각과 다르지 않은 전문가의 말에 귀를 기울여라.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 핵심 명제<\/td>\n<td style=\"text-align: right;\">숫자 명제보다 구조 명제 중심<\/td>\n<td>전권<\/td>\n<td>시장 전체 보유 + 저비용 + 장기보유<\/td>\n<td>책 전체를 관통하는 운영 원칙<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[2017 개정판 데이터][간접복원] 개정판 반영 시점<\/td>\n<td style=\"text-align: right;\">2016년까지 업데이트<\/td>\n<td>1900~2016 또는 1926~2016 계열<\/td>\n<td>10주년 개정판, 차트·데이터 갱신<\/td>\n<td>이후 검증은 반드시 분리 필요<\/td>\n<td>Wiley/2017 개정판 메타<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<ul>\n<li><code>[2017 이후 검증] 이 장은 원리 중심 장으로, 직접 비교 가능한 최신 수치가 제한적이다.<\/code><\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>서문에서 중요한 것은 “인덱스가 평균이므로 평범하다”가 아니라, <strong>시장 총수익은 참가자 평균이지만 투자자 실현수익은 비용 차감 후 평균 이하<\/strong>가 된다는 구조다. 이후 장들에서 비용, 세금, 회전율, 행동오류가 모두 같은 방향으로 작동한다.<\/li>\n<li>보글의 논리는 EMH를 절대적으로 믿지 않아도 성립한다. 시장이 완전 효율적이지 않더라도, 대다수는 비용과 실수 때문에 시장을 이기지 못한다는 점이 핵심이다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>평균을 사는 전략은 구조적으로 초과수익 가능성을 포기하는 전략이라는 비판이 가능하다.<\/li>\n<li>시장이 비효율적이라면 평균이 아니라 <strong>선별 능력<\/strong>에 베팅하는 편이 합리적이라는 반론도 강하다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글의 재반론은 “초과수익이 원천적으로 불가능하다”가 아니라 “<strong>일반 투자자가 사전에 식별 가능한 방식으로, 비용 차감 후, 지속적으로<\/strong> 초과수익을 얻기는 매우 어렵다”는 것이다.<\/li>\n<li>다만 소수 예외의 존재 자체는 부정하지 않는다. 버핏이 바로 그 예외다. 문제는 예외를 사전에 식별하는 일이다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자에게도 원칙은 유효하지만, “시장 전체”의 범위는 미국 거주자 기준과 다를 수 있다. 한국 투자자는 원화 생활비, 해외자산 환노출, 국내 과세구조를 함께 봐야 한다.<\/li>\n<li>따라서 서문의 원칙은 “미국 인덱스냐 아니냐”보다 “<strong>저비용·광범위 분산·낮은 회전율·장기 유지 가능성<\/strong>”으로 재해석하는 것이 맞다.<\/li>\n<\/ul>","text":"이기는 게임을 지는 게임으로 만들지 마라. 워런 버핏이 언급했듯이 '상식에 기반을 둔 투자'를 하는 것이 가장 좋은 방법이다. 이미 검증이 된 아주 확실한 성공투자 전략은 바로 저렴한 비용으로 미국 내 상장기업의 주식 전부를 고루 보유하는 것이다. 인덱스펀드는 개별 주식 종목, 특정 시장 부문, 펀드매니저 등의 선택에 따른 위험을 제거해주고 주식시장 위험 하나만 남겨준다. 복리수익의 기적, 복리비용의 횡포 투자와 관련한 비용을 공제한 후, 시장을 이기겠다고 덤비는 투자 게임은 지는 게임이다. 성공투자란 기업이 벌어들이는 수익 가운데 월가가 가져가는 수익을 최소화하고 일반 투자자가 가져가는 몫을 극대화하는 것을 의미한다. 펀드투자자는 자신들이 우수한 펀드매니저를 쉽게 선택할 수 있다고 확신하지만 그것은 잘못된 생각이다. 인덱스펀드를 샀으면 계속 얼쩡대며 머물러 있지 말고 그 즉시 카지노에서 나와라. 투자에 관한 진실을 추구하는 일 외에 다른 속셈이 없고 기본적으로 내 생각과 다르지 않은 전문가의 말에 귀를 기울여라. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 핵심 명제 숫자 명제보다 구조 명제 중심 전권 시장 전체 보유 + 저비용 + 장기보유 책 전체를 관통하는 운영 원칙 원본 노트 기준선 [2017 개정판 데이터][간접복원] 개정판 반영 시점 2016년까지 업데이트 1900~2016 또는 1926~2016 계열 10주년 개정판, 차트·데이터 갱신 이후 검증은 반드시 분리 필요 Wiley/2017 개정판 메타 [2017 이후 검증] [2017 이후 검증] 이 장은 원리 중심 장으로, 직접 비교 가능한 최신 수치가 제한적이다. [보강 | 논리 전개] 서문에서 중요한 것은 “인덱스가 평균이므로 평범하다”가 아니라, 시장 총수익은 참가자 평균이지만 투자자 실현수익은 비용 차감 후 평균 이하 가 된다는 구조다. 이후 장들에서 비용, 세금, 회전율, 행동오류가 모두 같은 방향으로 작동한다. 보글의 논리는 EMH를 절대적으로 믿지 않아도 성립한다. 시장이 완전 효율적이지 않더라도, 대다수는 비용과 실수 때문에 시장을 이기지 못한다는 점이 핵심이다. [반론] 평균을 사는 전략은 구조적으로 초과수익 가능성을 포기하는 전략이라는 비판이 가능하다. 시장이 비효율적이라면 평균이 아니라 선별 능력 에 베팅하는 편이 합리적이라는 반론도 강하다. [보글 측 재반론] 보글의 재반론은 “초과수익이 원천적으로 불가능하다”가 아니라 “ 일반 투자자가 사전에 식별 가능한 방식으로, 비용 차감 후, 지속적으로 초과수익을 얻기는 매우 어렵다”는 것이다. 다만 소수 예외의 존재 자체는 부정하지 않는다. 버핏이 바로 그 예외다. 문제는 예외를 사전에 식별하는 일이다. [한국 투자자 적용] 한국 투자자에게도 원칙은 유효하지만, “시장 전체”의 범위는 미국 거주자 기준과 다를 수 있다. 한국 투자자는 원화 생활비, 해외자산 환노출, 국내 과세구조를 함께 봐야 한다. 따라서 서문의 원칙은 “미국 인덱스냐 아니냐”보다 “ 저비용·광범위 분산·낮은 회전율·장기 유지 가능성 ”으로 재해석하는 것이 맞다."},{"i":2,"title":"1. 우화: 고트락스 가문","html":"<ul>\n<li>투자 세계에서는 움직임이 증가할수록 수익은 감소한다.<\/li>\n<li>빈번한 매매 활동을 삼감으로써 중개 수수료 부담을 최소화해야 한다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] Gotrocks 우화<\/td>\n<td style=\"text-align: right;\">정량 예시의 비유<\/td>\n<td>전권<\/td>\n<td>기업이익은 가문에 귀속되지만, 거래가 늘수록 중개인이 몫을 가져감<\/td>\n<td>금융중개가 부를 이전하는 구조 설명<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<tr>\n<td>[추론] 연 7% 총수익 중 2% 중개비용·세금 유출<\/td>\n<td style=\"text-align: right;\">순수익 5%<\/td>\n<td>장기 명목<\/td>\n<td>7%-2%=5%<\/td>\n<td>소유자의 몫이 중개산업으로 이전<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<tr>\n<td>[추론] 50년 누적 몫 상실<\/td>\n<td style=\"text-align: right;\">29.5배 → 11.5배 안팎<\/td>\n<td>50년, 명목, 세전<\/td>\n<td>10,000×(1.07)^50 vs 10,000×(1.05)^50<\/td>\n<td>“가문 전체 수익이 중간비용에 잠식”<\/td>\n<td>산식 복원<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ETF 선택으로 절감된 투자자 비용<\/td>\n<td style=\"text-align: right;\">중개비용이 투자자 몫 침식<\/td>\n<td style=\"text-align: right;\">1993~2024 누적 약 2,500억 달러 절감<\/td>\n<td>구조 개선<\/td>\n<td>저비용·세효율 상품이 Gotrocks 구조 일부 완화<\/td>\n<td>BofA/FT ETF 세금·비용 분석 인용<\/td>\n<\/tr>\n<tr>\n<td>2024 업계 자산가중 평균 비용<\/td>\n<td style=\"text-align: right;\">계속 유출되는 몫<\/td>\n<td style=\"text-align: right;\">0.34%<\/td>\n<td>과거보다 낮음<\/td>\n<td>그래도 거대 자산 기준으로는 절대금액이 큼<\/td>\n<td>Morningstar 2024 fee study 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>Gotrocks 우화의 본질은 시장이 가치를 창출한다는 사실보다, <strong>그 가치를 누가 최종적으로 가져가느냐<\/strong>다. 기업은 이익과 배당을 창출하지만, 투자자가 과도하게 사고팔수록 금융산업이 그 몫을 더 많이 가져간다.<\/li>\n<li>거래가 많아질수록 정보우위가 강화되는 것이 아니라, 오히려 매매비용·세금·스프레드가 누적된다. 그래서 보글은 “보이지 않는 손”을 고전경제학의 효율이 아니라, <strong>보이지 않게 빠져나가는 비용의 손<\/strong>으로 본다. <code>[후대 해석]<\/code><\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>금융중개는 유동성·가격발견·위험분산·감시 기능을 제공하므로, 모든 중간비용을 착취로 보는 것은 과하다는 반론이 강하다.<\/li>\n<li>실제로 액티브가 전혀 없으면 시장이 망가질 수 있다는 보글 본인의 인정도 있다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보글식 반박은 “중개가 필요 없다”가 아니라 “<strong>필요한 중개 이상으로 과잉 중개가 발생하면 투자자의 몫이 줄어든다<\/strong>”는 것이다.<\/li>\n<li>이 반박은 설득력이 높지만, 시장 전반의 가격발견 기능을 누가 얼마나 부담해야 하는지에 대해서는 완전히 닫힌 해답이 아니다. 이 지점은 남는 논점이다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국에서도 빈번한 리밸런싱, 레버리지 ETF 단타, 국내외 테마 추종은 거래대금은 늘리지만 투자자의 실현수익을 해칠 가능성이 높다.<\/li>\n<li>최근 한국 개인투자자의 레버리지 선호와 신용잔고 급증은 Gotrocks 우화를 한국어로 번역한 사례에 가깝다.<\/li>\n<\/ul>","text":"투자 세계에서는 움직임이 증가할수록 수익은 감소한다. 빈번한 매매 활동을 삼감으로써 중개 수수료 부담을 최소화해야 한다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] Gotrocks 우화 정량 예시의 비유 전권 기업이익은 가문에 귀속되지만, 거래가 늘수록 중개인이 몫을 가져감 금융중개가 부를 이전하는 구조 설명 원본 노트 기준선 [추론] 연 7% 총수익 중 2% 중개비용·세금 유출 순수익 5% 장기 명목 7%-2%=5% 소유자의 몫이 중개산업으로 이전 산식 복원 [추론] 50년 누적 몫 상실 29.5배 → 11.5배 안팎 50년, 명목, 세전 10,000×(1.07)^50 vs 10,000×(1.05)^50 “가문 전체 수익이 중간비용에 잠식” 산식 복원 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 ETF 선택으로 절감된 투자자 비용 중개비용이 투자자 몫 침식 1993~2024 누적 약 2,500억 달러 절감 구조 개선 저비용·세효율 상품이 Gotrocks 구조 일부 완화 BofA/FT ETF 세금·비용 분석 인용 2024 업계 자산가중 평균 비용 계속 유출되는 몫 0.34% 과거보다 낮음 그래도 거대 자산 기준으로는 절대금액이 큼 Morningstar 2024 fee study 인용 [보강 | 논리 전개] Gotrocks 우화의 본질은 시장이 가치를 창출한다는 사실보다, 그 가치를 누가 최종적으로 가져가느냐 다. 기업은 이익과 배당을 창출하지만, 투자자가 과도하게 사고팔수록 금융산업이 그 몫을 더 많이 가져간다. 거래가 많아질수록 정보우위가 강화되는 것이 아니라, 오히려 매매비용·세금·스프레드가 누적된다. 그래서 보글은 “보이지 않는 손”을 고전경제학의 효율이 아니라, 보이지 않게 빠져나가는 비용의 손 으로 본다. [후대 해석] [반론] 금융중개는 유동성·가격발견·위험분산·감시 기능을 제공하므로, 모든 중간비용을 착취로 보는 것은 과하다는 반론이 강하다. 실제로 액티브가 전혀 없으면 시장이 망가질 수 있다는 보글 본인의 인정도 있다. [보글 측 재반론] 보글식 반박은 “중개가 필요 없다”가 아니라 “ 필요한 중개 이상으로 과잉 중개가 발생하면 투자자의 몫이 줄어든다 ”는 것이다. 이 반박은 설득력이 높지만, 시장 전반의 가격발견 기능을 누가 얼마나 부담해야 하는지에 대해서는 완전히 닫힌 해답이 아니다. 이 지점은 남는 논점이다. [한국 투자자 적용] 한국에서도 빈번한 리밸런싱, 레버리지 ETF 단타, 국내외 테마 추종은 거래대금은 늘리지만 투자자의 실현수익을 해칠 가능성이 높다. 최근 한국 개인투자자의 레버리지 선호와 신용잔고 급증은 Gotrocks 우화를 한국어로
