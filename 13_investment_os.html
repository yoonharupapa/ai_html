영웅","short":"전설로 떠나는 월가의 영웅","author":"린치","chapters":[{"i":0,"title":"문서 안내","html":"<hr />\n<p>title: \"[독서] 전설로 떠나는 월가의 영웅\"\naliases: [\"전설로 떠나는 월가의 영웅\", \"One Up On Wall Street\", \"피터 린치\"]\ntype: book-note-raw\ncategory: 독서\nauthor: 피터 린치\ndate_read: 2025-04-21\ndate: 2025-04-21\nstatus: complete\ntags:\n  - 독서\n  - 투자\n  - 원본노트\n  - 피터린치<\/p>\n<hr />\n<p><strong>2025.04.21<\/strong><\/p>","text":"title: \"[독서] 전설로 떠나는 월가의 영웅\" aliases: [\"전설로 떠나는 월가의 영웅\", \"One Up On Wall Street\", \"피터 린치\"] type: book-note-raw category: 독서 author: 피터 린치 date_read: 2025-04-21 date: 2025-04-21 status: complete tags: - 독서 - 투자 - 원본노트 - 피터린치 2025.04.21"},{"i":1,"title":"밀레니엄판 서문","html":"<ul>\n<li>사기가 꺾인 투자자들은 영원한 약세장이 없다는 사실을 상기해야 한다.<\/li>\n<li>현재 투자자들은 영원한 강세장은 존재하지 않는다는 것을 명심해야 한다.<\/li>\n<li>시장이 어떤 움직임을 보이든 인내심을 잃지 말아야 한다.<\/li>\n<li>위대한 투자자들의 공통점은 자신이 이해하지 못하는 주식은 보유하지 않는다는 점이다.<\/li>\n<li>새롭게 시장에 진입한 후 수익 증가를 바탕으로 주가를 올리는 성공적인 기업들이 나의 투자 대상이다.<\/li>\n<li>현재 결함을 안고 있지만 회생 단계에 접어든 기업들 또한 보유한다.<\/li>\n<li>주식투자의 성패를 결정하는 것은 결국 기업의 이익이라고 믿는다.<\/li>\n<li>아무리 탄탄한 회사의 주식이라도 너무 비싼 가격에 사들인다면 위험한 투자가 된다.<\/li>\n<li>곡괭이와 삽: 인터넷 = 택배, 네트워크 장비 제조업체, 공짜 인터넷주, 간접적으로 수익을 올리는 기업<\/li>\n<li>회사의 이익 전망, 재무 상태, 경쟁 상황, 확장 계획 등을 조사하기 전에는 절대로 투자해서는 안 된다.<\/li>\n<li>소매기업에 투자할 경우 분석해야 할 또 하나의 핵심은 이 회사가 확장의 마지막 단계에 접근했는지 여부를 파악하는 것이다.<\/li>\n<li>회사의 미래 성장 요인이 어디에 있는지, 성장 속도가 늦춰질 시점이 언제인지 추적해야 한다.<\/li>\n<li>우리는 투자하는 모든 종목에서 돈을 벌 필요는 없고 10개의 종목 중 6개만 오르면 만족스러운 실적을 올릴 수 있다.<\/li>\n<li>데이 트레이딩으로 생계를 유지할 확률은 경마장, 카지노, 비디오 포커로 돈을 벌 확률과 비슷한 수준이다.<\/li>\n<li>지수 종가보다 관심을 두어야 하는 것은 상승 종목 수와 하락 종목의 수다.<\/li>\n<li>12개월 뒤에 학자금이나 결혼비용으로 쓸 돈을 주식이나 펀드에 투자해서는 안 된다.<\/li>\n<li>장기투자를 한다면 시간은 결국 우리 편이 된다.<\/li>\n<li>폭락하기 직전에 시장에서 빠져나올 수 있다면 얼마나 완벽했을까? 하지만 폭락 시점을 예측할 수 있는 사람은 아무도 없다.<\/li>\n<li>용케 시장에서 빠져나와 폭락을 피한다고 해도 다음 반등장 전에 다시 진입할 수 있다고 누가 보장할 수 있을까?<\/li>\n<li>시장이 절대 과대평가되지 않는다는 말이 아니라, 시장이 과대평가되었다고 지레 걱정할 필요는 없다.<\/li>\n<li>강세장은 근심의 벽을 타고 오른다는 말이 있다.<\/li>\n<li>내일의 대박 종목을 계속 찾으라. 당신도 발견할 수 있다.<\/li>\n<\/ul>","text":"사기가 꺾인 투자자들은 영원한 약세장이 없다는 사실을 상기해야 한다. 현재 투자자들은 영원한 강세장은 존재하지 않는다는 것을 명심해야 한다. 시장이 어떤 움직임을 보이든 인내심을 잃지 말아야 한다. 위대한 투자자들의 공통점은 자신이 이해하지 못하는 주식은 보유하지 않는다는 점이다. 새롭게 시장에 진입한 후 수익 증가를 바탕으로 주가를 올리는 성공적인 기업들이 나의 투자 대상이다. 현재 결함을 안고 있지만 회생 단계에 접어든 기업들 또한 보유한다. 주식투자의 성패를 결정하는 것은 결국 기업의 이익이라고 믿는다. 아무리 탄탄한 회사의 주식이라도 너무 비싼 가격에 사들인다면 위험한 투자가 된다. 곡괭이와 삽: 인터넷 = 택배, 네트워크 장비 제조업체, 공짜 인터넷주, 간접적으로 수익을 올리는 기업 회사의 이익 전망, 재무 상태, 경쟁 상황, 확장 계획 등을 조사하기 전에는 절대로 투자해서는 안 된다. 소매기업에 투자할 경우 분석해야 할 또 하나의 핵심은 이 회사가 확장의 마지막 단계에 접근했는지 여부를 파악하는 것이다. 회사의 미래 성장 요인이 어디에 있는지, 성장 속도가 늦춰질 시점이 언제인지 추적해야 한다. 우리는 투자하는 모든 종목에서 돈을 벌 필요는 없고 10개의 종목 중 6개만 오르면 만족스러운 실적을 올릴 수 있다. 데이 트레이딩으로 생계를 유지할 확률은 경마장, 카지노, 비디오 포커로 돈을 벌 확률과 비슷한 수준이다. 지수 종가보다 관심을 두어야 하는 것은 상승 종목 수와 하락 종목의 수다. 12개월 뒤에 학자금이나 결혼비용으로 쓸 돈을 주식이나 펀드에 투자해서는 안 된다. 장기투자를 한다면 시간은 결국 우리 편이 된다. 폭락하기 직전에 시장에서 빠져나올 수 있다면 얼마나 완벽했을까? 하지만 폭락 시점을 예측할 수 있는 사람은 아무도 없다. 용케 시장에서 빠져나와 폭락을 피한다고 해도 다음 반등장 전에 다시 진입할 수 있다고 누가 보장할 수 있을까? 시장이 절대 과대평가되지 않는다는 말이 아니라, 시장이 과대평가되었다고 지레 걱정할 필요는 없다. 강세장은 근심의 벽을 타고 오른다는 말이 있다. 내일의 대박 종목을 계속 찾으라. 당신도 발견할 수 있다."},{"i":2,"title":"프롤로그","html":"<ul>\n<li>쓸데없는 걱정으로 좋은 포트폴리오, 좋은 휴가를 망치지 말라.<\/li>\n<li>우수한 기업을 찾아내는 방법에 대해 고민하는 것이 유익하다.<\/li>\n<li>결국 우수한 기업은 성공하고 열등한 기업은 실패한다.<\/li>\n<\/ul>","text":"쓸데없는 걱정으로 좋은 포트폴리오, 좋은 휴가를 망치지 말라. 우수한 기업을 찾아내는 방법에 대해 고민하는 것이 유익하다. 결국 우수한 기업은 성공하고 열등한 기업은 실패한다."},{"i":3,"title":"서문: 아마추어 투자자가 유리하다","html":"<ul>\n<li>첫 번째 비밀은 전문가의 말에 귀를 기울이지 말라는 것이다.<\/li>\n<li>아마추어 투자자는 전문투자자의 말에 귀를 기울일 때 어리석은 투자자가 될 수 있다.<\/li>\n<li>투자를 준비하는 단계부터 혼자 힘으로 조사해야 한다.<\/li>\n<li>텐베거 한 종목만 제대로 고른다면 나머지 종목 모두에서 실수를 저질러도 투자에 성공할 수 있다.<\/li>\n<li>엉뚱한 저가주에서만 텐베거가 나온다고 생각하는데 우리에게 익숙한 우량주에서도 나올 수 있다.<\/li>\n<li>상식의 위력: 우리가 모르는 회사보다는 친숙한 회사에 투자했을 때 더 높은 실적을 올릴 수 있다.<\/li>\n<li>유망기업을 찾아내는 일은 단지 첫 단계일 뿐이고 다음 단계는 조사이다.<\/li>\n<li>거의 알려지지 않은 비인기 종목을 찾아낸 다음 직접 조사하라.<\/li>\n<\/ul>","text":"첫 번째 비밀은 전문가의 말에 귀를 기울이지 말라는 것이다. 아마추어 투자자는 전문투자자의 말에 귀를 기울일 때 어리석은 투자자가 될 수 있다. 투자를 준비하는 단계부터 혼자 힘으로 조사해야 한다. 텐베거 한 종목만 제대로 고른다면 나머지 종목 모두에서 실수를 저질러도 투자에 성공할 수 있다. 엉뚱한 저가주에서만 텐베거가 나온다고 생각하는데 우리에게 익숙한 우량주에서도 나올 수 있다. 상식의 위력: 우리가 모르는 회사보다는 친숙한 회사에 투자했을 때 더 높은 실적을 올릴 수 있다. 유망기업을 찾아내는 일은 단지 첫 단계일 뿐이고 다음 단계는 조사이다. 거의 알려지지 않은 비인기 종목을 찾아낸 다음 직접 조사하라."},{"i":4,"title":"1. 펀드매니저가 된다","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>많은 소액 투자자들이 잘못된 시점에 시장을 비관 혹은 낙관하느라 강세장에 투자를 시작하고 약세장에 빠져나온다.<\/li>\n<li>돌이켜 보니 통계학보다는 역사와 철학 공부가 주식투자에 훨씬 도움이 되었다. 주식투자는 과학이 아니라 기술이다.<\/li>\n<li>월스트리트의 비논리성: 해가 떠오를 때마다 닭 우는 소리가 들린다는 이유로 닭이 울기 때문에 해가 떠오른다고 믿었다.<\/li>\n<li>도박하지 마라. 예금을 모두 털어 우량주를 산 다음 주가가 오를 때까지 보유한 뒤 팔아라. 주가가 오르지 않는다면 주식을 사지 마라.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 개인 투자자를 <code>자기 자본의 책임자<\/code>로 전환시키는 출발점이며, 프로세스 단계로는 자기진단과 운용 규율 설정에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 종목마다 <code>매수 전 가설<\/code>, <code>추가 매수 조건<\/code>, <code>매도 조건<\/code>, <code>검토 주기<\/code>를 사전에 적어 운용 규정을 만든다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 펀드매니저처럼 행동한다는 것은 빈번하게 거래한다는 뜻이 아니다.<\/li>\n<\/ul>","text":"기존 노트 많은 소액 투자자들이 잘못된 시점에 시장을 비관 혹은 낙관하느라 강세장에 투자를 시작하고 약세장에 빠져나온다. 돌이켜 보니 통계학보다는 역사와 철학 공부가 주식투자에 훨씬 도움이 되었다. 주식투자는 과학이 아니라 기술이다. 월스트리트의 비논리성: 해가 떠오를 때마다 닭 우는 소리가 들린다는 이유로 닭이 울기 때문에 해가 떠오른다고 믿었다. 도박하지 마라. 예금을 모두 털어 우량주를 산 다음 주가가 오를 때까지 보유한 뒤 팔아라. 주가가 오르지 않는다면 주식을 사지 마라. [구조화] [후대 해석] 이 장은 개인 투자자를 자기 자본의 책임자 로 전환시키는 출발점이며, 프로세스 단계로는 자기진단과 운용 규율 설정에 해당한다. [실전 적용] [현대 적용] 종목마다 매수 전 가설 , 추가 매수 조건 , 매도 조건 , 검토 주기 를 사전에 적어 운용 규정을 만든다. [오해 방지] [후대 해석] 펀드매니저처럼 행동한다는 것은 빈번하게 거래한다는 뜻이 아니다."},{"i":5,"title":"2. 월스트리트의 똑똑한 바보들","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>맥스 하이네, 마이클 프라이스, 존 네프, 켄 히브너, 피터 데로스, 조지 소로스, 지미 로저스, 워런 버핏 같은 탁월한 인물은 소수이다.<\/li>\n<li>위대한 발명이나 사상은 나이 서른 전에 이루어진다는 통속적인 이론이 있지만 위대한 투자는 나이, 천부적인 재능과 상관없다.<\/li>\n<li>월스트리트는 여러 가지 이유로 인해 뒷북치기 전문가이다.<\/li>\n<li>회사 이름은 아리송하고 하는 일은 모호하고 따분해 보이지만 높은 수익을 올리는 기업이 좋은 투자 대상이다.<\/li>\n<li>전통적인 펀드매니저들이 기피하는 아마추어처럼 사고하려는 노력이 필요하다.<\/li>\n<li>일반투자자는 기관에서 투자하는 것처럼 할 필요가 없고 기관처럼 투자한다면 실적도 기관처럼 나온다.<\/li>\n<li>이웃이나 일터에서 멋진 기회를 분석가나 펀드매니저보다 빨리 멋진 기회를 발견할 수 있다.<\/li>\n<li>주식 시장은 확신을 요구하고 확신이 없는 사람에게는 반드시 희생이 따른다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 기관의 구조적 한계를 설명하며, 프로세스 단계로는 종목 발굴과 독립 판단의 근거를 제공한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 아이디어 원천을 <code>업무 현장<\/code>, <code>생활 소비<\/code>, <code>공급망<\/code>, <code>현장 직원<\/code>, <code>고객 불만<\/code>으로 분류해 기록한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 전문가를 무시하라는 뜻이 아니라, 전문가 합의에 판단을 위임하지 말라는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 맥스 하이네, 마이클 프라이스, 존 네프, 켄 히브너, 피터 데로스, 조지 소로스, 지미 로저스, 워런 버핏 같은 탁월한 인물은 소수이다. 위대한 발명이나 사상은 나이 서른 전에 이루어진다는 통속적인 이론이 있지만 위대한 투자는 나이, 천부적인 재능과 상관없다. 월스트리트는 여러 가지 이유로 인해 뒷북치기 전문가이다. 회사 이름은 아리송하고 하는 일은 모호하고 따분해 보이지만 높은 수익을 올리는 기업이 좋은 투자 대상이다. 전통적인 펀드매니저들이 기피하는 아마추어처럼 사고하려는 노력이 필요하다. 일반투자자는 기관에서 투자하는 것처럼 할 필요가 없고 기관처럼 투자한다면 실적도 기관처럼 나온다. 이웃이나 일터에서 멋진 기회를 분석가나 펀드매니저보다 빨리 멋진 기회를 발견할 수 있다. 주식 시장은 확신을 요구하고 확신이 없는 사람에게는 반드시 희생이 따른다. [구조화] [후대 해석] 이 장은 기관의 구조적 한계를 설명하며, 프로세스 단계로는 종목 발굴과 독립 판단의 근거를 제공한다. [실전 적용] [현대 적용] 아이디어 원천을 업무 현장 , 생활 소비 , 공급망 , 현장 직원 , 고객 불만 으로 분류해 기록한다. [오해 방지] [후대 해석] 전문가를 무시하라는 뜻이 아니라, 전문가 합의에 판단을 위임하지 말라는 뜻이다."},{"i":6,"title":"3. 투자인가, 도박인가?","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>신사는 채권을 좋아한다. /앤드류 멜론<\/li>\n<li>역사적으로 주식투자는 채권투자보다 틀림없이 높은 수익을 보였다.<\/li>\n<li>주식을 보유하면 회사의 성장이 투자자의 몫이 되지만 채권 투자자는 언제든지 교체 가능한 자금 공급자에 불과하다.<\/li>\n<li>우량주를 장기 보유하는 것조차 위험하기는 마찬가지다.<\/li>\n<li>대기업이 소기업으로 전락하기도 하고 절대 망하지 않는 우량주 또한 존재하지 않는다.<\/li>\n<li>좋은 주식이라도 나쁜 시점에 나쁜 가격으로 매수하면 손실을 크게 본다.<\/li>\n<li>솔직히 말해서 투자와 도박을 깔끔하게 구분할 방법은 없다.<\/li>\n<li>주식은 실제로는 가장 위험한 시점에 신중한 투자로 인정받는 경향이 있다.<\/li>\n<li>투자자의 기술, 노력, 모험심에 따라 도박과 투자를 구분할 수 있다.<\/li>\n<li>매달 규칙적으로 스터드 포커를 하는 사람은 똑같은 행운아가 늘 돈을 번다는 사실을 깨닫게 된다.<\/li>\n<li>이 행운아는 카드패가 펼쳐질 때마다 확률을 조심스럽게 계산하고 또 계산해서 투자 수익을 극대화하는 사람이다.<\/li>\n<li>계속해서 이기는 사람은 상황이 유리해지면 판돈을 올리고 불리해지면 게임을 포기한다.<\/li>\n<li>계속해서 지는 사람은 기적을 바라며 패배의 스릴을 즐기다 매번 끝까지 가서 결국 비싼 대가를 치르고야 만다.<\/li>\n<li>주식시장에서 성공하는 사람들 역시 주기적으로 손실을 보고, 좌절을 맛보며, 예기치 못한 사건에 부딪히기도 하지만 게임을 포기하지 않는다.<\/li>\n<li>게임하는 법을 제대로 알고 있다면 분명히 주식시장은 늘 도전해볼 만한 도박이다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 투자와 도박을 가르는 기준을 설명하며, 프로세스 단계로는 리스크 관리와 포지션 판단에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 매수 전에 <code>이 기업이 잘되면 무엇이 개선되고, 잘못되면 무엇이 먼저 깨지는가<\/code>를 시나리오로 적는다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 변동성이 크면 무조건 도박이라는 뜻은 아니다.<\/li>\n<\/ul>","text":"기존 노트 신사는 채권을 좋아한다. /앤드류 멜론 역사적으로 주식투자는 채권투자보다 틀림없이 높은 수익을 보였다. 주식을 보유하면 회사의 성장이 투자자의 몫이 되지만 채권 투자자는 언제든지 교체 가능한 자금 공급자에 불과하다. 우량주를 장기 보유하는 것조차 위험하기는 마찬가지다. 대기업이 소기업으로 전락하기도 하고 절대 망하지 않는 우량주 또한 존재하지 않는다. 좋은 주식이라도 나쁜 시점에 나쁜 가격으로 매수하면 손실을 크게 본다. 솔직히 말해서 투자와 도박을 깔끔하게 구분할 방법은 없다. 주식은 실제로는 가장 위험한 시점에 신중한 투자로 인정받는 경향이 있다. 투자자의 기술, 노력, 모험심에 따라 도박과 투자를 구분할 수 있다. 매달 규칙적으로 스터드 포커를 하는 사람은 똑같은 행운아가 늘 돈을 번다는 사실을 깨닫게 된다. 이 행운아는 카드패가 펼쳐질 때마다 확률을 조심스럽게 계산하고 또 계산해서 투자 수익을 극대화하는 사람이다. 계속해서 이기는 사람은 상황이 유리해지면 판돈을 올리고 불리해지면 게임을 포기한다. 계속해서 지는 사람은 기적을 바라며 패배의 스릴을 즐기다 매번 끝까지 가서 결국 비싼 대가를 치르고야 만다. 주식시장에서 성공하는 사람들 역시 주기적으로 손실을 보고, 좌절을 맛보며, 예기치 못한 사건에 부딪히기도 하지만 게임을 포기하지 않는다. 게임하는 법을 제대로 알고 있다면 분명히 주식시장은 늘 도전해볼 만한 도박이다. [구조화] [후대 해석] 이 장은 투자와 도박을 가르는 기준을 설명하며, 프로세스 단계로는 리스크 관리와 포지션 판단에 해당한다. [실전 적용] [현대 적용] 매수 전에 이 기업이 잘되면 무엇이 개선되고, 잘못되면 무엇이 먼저 깨지는가 를 시나리오로 적는다. [오해 방지] [후대 해석] 변동성이 크면 무조건 도박이라는 뜻은 아니다."},{"i":7,"title":"4. 투자자의 자기진단","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>주식 매수 전 다음 3가지 질문부터 답해야 한다.<ul>\n<li>내 집이 있는가?<\/li>\n<li>나는 돈이 필요한가?<\/li>\n<li>내게 주식 투자자로서 성공할 자질이 있는가?<\/li>\n<\/ul>\n<\/li>\n<li>집을 고를 때는 몇 달의 시간을 쓰면서, 주식을 선택할 때에는 몇 분만 들인다.<\/li>\n<li>2~3년 뒤를 대비해 자녀의 대학 학비를 마련한다면 그 돈으로 주식을 매수해서는 안 된다.<\/li>\n<li>10~20년 뒤 주가는 비교적 쉽게 예측할 수 있으나 2~3년 뒤의 주가 전망은 차라리 동전을 던져서 판단하는 편이 낫다.<\/li>\n<li>잃더라도 가까운 장래에 일상생활에 영향을 받지 않을 만큼만 주식에 투자하라.<\/li>\n<li>투자자로서의 자질은 인내심, 자신감, 상식, 고통에 대한 내성, 초연함, 고집, 겸손, 유연성, 독자적으로 조사하려는 의지, 실수를 기꺼이 인정하는 태도, 전반적인 공포감을 무심하게 넘길 수 있는 태도 등이다.<\/li>\n<li>투자가 늦지 않으려면 완벽한 정보가 없는 상태에서 판단을 내리는 능력도 중요하다.<\/li>\n<li>인간 본성과 육감의 유혹을 이겨낼 수 있어야 한다.<\/li>\n<li>투자자 대부분이 주식 실적이 가장 좋았던 기간에 주식을 가장 두려워했고, 주식이 가장 나쁜 실적을 냈던 기간에 가장 대범하게 투자를 했다.<\/li>\n<li>인간은 태생적으로 투자 시점을 잘못 선택하기 쉽고 경솔한 투자자는 걱정과 충족감, 항복이라는 세 가지 감정 상태를 반복해서 경험한다.<\/li>\n<li>진정한 역발상 투자자는 시장이 가라앉을 때까지 기다렸다가 아무도 거들떠보지 않는 종목을 매수한다.<\/li>\n<li>자신의 육감을 믿지 말고, 자제력을 발휘해서 육감을 무시하고 회사 사정이 근본적으로 바뀌지 않는 한, 주식을 계속 보유하라.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 투자자 적합성을 먼저 점검하게 만들며, 프로세스 단계로는 자기진단 그 자체에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] <code>향후 12개월 필요 자금<\/code>, <code>2~3년 내 큰 지출<\/code>, <code>변동성 허용치<\/code>, <code>하락장 행동 패턴<\/code>을 사전에 점검한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 자기진단을 생략하면 좋은 종목도 나쁜 투자 경험으로 끝난다.<\/li>\n<\/ul>","text":"기존 노트 주식 매수 전 다음 3가지 질문부터 답해야 한다. 내 집이 있는가? 나는 돈이 필요한가? 내게 주식 투자자로서 성공할 자질이 있는가? 집을 고를 때는 몇 달의 시간을 쓰면서, 주식을 선택할 때에는 몇 분만 들인다. 2~3년 뒤를 대비해 자녀의 대학 학비를 마련한다면 그 돈으로 주식을 매수해서는 안 된다. 10~20년 뒤 주가는 비교적 쉽게 예측할 수 있으나 2~3년 뒤의 주가 전망은 차라리 동전을 던져서 판단하는 편이 낫다. 잃더라도 가까운 장래에 일상생활에 영향을 받지 않을 만큼만 주식에 투자하라. 투자자로서의 자질은 인내심, 자신감, 상식, 고통에 대한 내성, 초연함, 고집, 겸손, 유연성, 독자적으로 조사하려는 의지, 실수를 기꺼이 인정하는 태도, 전반적인 공포감을 무심하게 넘길 수 있는 태도 등이다. 투자가 늦지 않으려면 완벽한 정보가 없는 상태에서 판단을 내리는 능력도 중요하다. 인간 본성과 육감의 유혹을 이겨낼 수 있어야 한다. 투자자 대부분이 주식 실적이 가장 좋았던 기간에 주식을 가장 두려워했고, 주식이 가장 나쁜 실적을 냈던 기간에 가장 대범하게 투자를 했다. 인간은 태생적으로 투자 시점을 잘못 선택하기 쉽고 경솔한 투자자는 걱정과 충족감, 항복이라는 세 가지 감정 상태를 반복해서 경험한다. 진정한 역발상 투자자는 시장이 가라앉을 때까지 기다렸다가 아무도 거들떠보지 않는 종목을 매수한다. 자신의 육감을 믿지 말고, 자제력을 발휘해서 육감을 무시하고 회사 사정이 근본적으로 바뀌지 않는 한, 주식을 계속 보유하라. [구조화] [후대 해석] 이 장은 투자자 적합성을 먼저 점검하게 만들며, 프로세스 단계로는 자기진단 그 자체에 해당한다. [실전 적용] [현대 적용] 향후 12개월 필요 자금 , 2~3년 내 큰 지출 , 변동성 허용치 , 하락장 행동 패턴 을 사전에 점검한다. [오해 방지] [후대 해석] 자기진단을 생략하면 좋은 종목도 나쁜 투자 경험으로 끝난다."},{"i":8,"title":"5. 지금 시장이 좋은지 묻지 마라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>분명히 말할 수 있는 것은 주식시장을 예측한다고 해서 주식으로 돈을 벌 수 있는 것이 아니라는 사실이다.<\/li>\n<li>온갖 방법을 동원해도 일관성 있게 시장을 예측하지 못한다.<\/li>\n<li>금리와 주식시장 사이에는 밀접한 상관관계가 있지만 아무도 금리를 확실하게 예측할 수 없다.<\/li>\n<li>불황이 미리 정확히 예측하고 나에게 먼저 말해 줄 사람은 절대 없다.<\/li>\n<li>다음번은 지난번과 절대로 같지 않다.<\/li>\n<li>시장은 투자와 아무 상관없다.<\/li>\n<li>내가 아는 한, 주식시장은 존재하지 않는다. 누군가 바보 같은 제안을 하고 있는지 참고 삼아 살펴보는 장소에 불과하다. /워런 버핏<\/li>\n<li>만약 다음번 호황을 정확히 예측할 수 있거나 없거나 상관없이 항상 올바른 종목을 선택해야만 한다.<\/li>\n<li>시장을 정확히 판단하고서도 잘못된 종목 선택으로 번번이 재산을 날릴 수 있다.<\/li>\n<li>정말 좋은 회사를 찾았다면 시기가 너무 이르다거나 늦었다는 이유로 매수를 고민할 필요가 전혀 없다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 거시 예측을 프로세스 바깥으로 밀어내며, 프로세스 단계로는 매수 판단의 공통 규율에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 매수 메모에서 <code>시장 전망<\/code> 항목을 삭제하고 <code>기업 전망<\/code> 항목만 남긴다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 시장이 무의미하다는 말이 아니라, 시장 예측으로 초과수익을 일관되게 만들기 어렵다는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 분명히 말할 수 있는 것은 주식시장을 예측한다고 해서 주식으로 돈을 벌 수 있는 것이 아니라는 사실이다. 온갖 방법을 동원해도 일관성 있게 시장을 예측하지 못한다. 금리와 주식시장 사이에는 밀접한 상관관계가 있지만 아무도 금리를 확실하게 예측할 수 없다. 불황이 미리 정확히 예측하고 나에게 먼저 말해 줄 사람은 절대 없다. 다음번은 지난번과 절대로 같지 않다. 시장은 투자와 아무 상관없다. 내가 아는 한, 주식시장은 존재하지 않는다. 누군가 바보 같은 제안을 하고 있는지 참고 삼아 살펴보는 장소에 불과하다. /워런 버핏 만약 다음번 호황을 정확히 예측할 수 있거나 없거나 상관없이 항상 올바른 종목을 선택해야만 한다. 시장을 정확히 판단하고서도 잘못된 종목 선택으로 번번이 재산을 날릴 수 있다. 정말 좋은 회사를 찾았다면 시기가 너무 이르다거나 늦었다는 이유로 매수를 고민할 필요가 전혀 없다. [구조화] [후대 해석] 이 장은 거시 예측을 프로세스 바깥으로 밀어내며, 프로세스 단계로는 매수 판단의 공통 규율에 해당한다. [실전 적용] [현대 적용] 매수 메모에서 시장 전망 항목을 삭제하고 기업 전망 항목만 남긴다. [오해 방지] [후대 해석] 시장이 무의미하다는 말이 아니라, 시장 예측으로 초과수익을 일관되게 만들기 어렵다는 뜻이다."},{"i":9,"title":"1부 요약","html":"<ul>\n<li>전문가의 기술이나 지혜를 과대평가하지 마라.<\/li>\n<li>이미 알고 있는 지식을 이용하라.<\/li>\n<li>월스트리트에서 아직 발견하고 확인하지 못한 기회, 레이더 밖에 있는 기업을 찾아라.<\/li>\n<li>주식에 투자하기 전에 집에 투자하라.<\/li>\n<li>주식시장이 아니라 기업에 투자하라.<\/li>\n<li>주식의 단기 등락을 무시하라.<\/li>\n<li>주식에서 큰 이익을 얻을 수 있다.<\/li>\n<li>주식에서 큰 손실을 볼 수도 있다.<\/li>\n<li>경제를 예측하는 것은 소용없는 일이다.<\/li>\n<li>주식시장의 단기 방향을 예측해도 소용없다.<\/li>\n<li>주식투자의 장기 수익률은 비교적 예측하기 쉬우며, 채권투자의 장기 수익률보다 훨씬 높다.<\/li>\n<li>투자한 종목을 관리하는 것은 스터드 포커 게임을 하는 것과 같다.<\/li>\n<li>주식투자는 모든 사람이 할 적합한 성격을 지닌 것이 아니며, 인생의 모든 단계에서 할만한 것도 아니다.<\/li>\n<li>일반인은 투자 전문가보다 훨씬 먼저 흥미로운 기업이나 제품을 발견할 수 있다.<\/li>\n<li>특정 업종이나 제품의 강점을 보유하고 있다면 주식투자에 유리하다.<\/li>\n<li>주식시장에서는 손 안의 새 한 마리가 숲속의 새 열 마리보다 낫다.<\/li>\n<\/ul>","text":"전문가의 기술이나 지혜를 과대평가하지 마라. 이미 알고 있는 지식을 이용하라. 월스트리트에서 아직 발견하고 확인하지 못한 기회, 레이더 밖에 있는 기업을 찾아라. 주식에 투자하기 전에 집에 투자하라. 주식시장이 아니라 기업에 투자하라. 주식의 단기 등락을 무시하라. 주식에서 큰 이익을 얻을 수 있다. 주식에서 큰 손실을 볼 수도 있다. 경제를 예측하는 것은 소용없는 일이다. 주식시장의 단기 방향을 예측해도 소용없다. 주식투자의 장기 수익률은 비교적 예측하기 쉬우며, 채권투자의 장기 수익률보다 훨씬 높다. 투자한 종목을 관리하는 것은 스터드 포커 게임을 하는 것과 같다. 주식투자는 모든 사람이 할 적합한 성격을 지닌 것이 아니며, 인생의 모든 단계에서 할만한 것도 아니다. 일반인은 투자 전문가보다 훨씬 먼저 흥미로운 기업이나 제품을 발견할 수 있다. 특정 업종이나 제품의 강점을 보유하고 있다면 주식투자에 유리하다. 주식시장에서는 손 안의 새 한 마리가 숲속의 새 열 마리보다 낫다."},{"i":10,"title":"6. 10루타 종목을 찾아라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>텐베거 종목을 찾아보기에 가장 좋은 장소는 집 근처 혹은 쇼핑몰, 직장 주변을 뒤져보라.<\/li>\n<li>자기가 잘 아는 업종을 마다하고 다른 업종의 주식을 더 선호하는 이유를 모르겠다.<\/li>\n<li>강점이 있는 사람이 없는 사람보다 앞서 나가기에 유리한 법이다.<\/li>\n<li>일반인이 수익 개선을 예측하는 측면에서 전문가보다 훨씬 유리한 출발선을 선점할 수 있다.<\/li>\n<li>꼭 매출액 변화가 아니더라도 대차대조표에 나타나지 않는 엄청난 자산이 숨겨져 있을지도 모른다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 생활·업무 현장 기반의 아이디어 소싱을 다루며, 프로세스 단계로는 종목 발굴에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 투자 아이디어를 <code>내가 왜 남보다 빨리 봤는가<\/code>, <code>그 관찰이 매출·이익으로 연결되는가<\/code>, <code>이 현상이 일시적 유행인가<\/code>로 정리한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 자기가 자주 쓰는 제품이라는 사실만으로 텐베거가 되지 않는다.<\/li>\n<\/ul>","text":"기존 노트 텐베거 종목을 찾아보기에 가장 좋은 장소는 집 근처 혹은 쇼핑몰, 직장 주변을 뒤져보라. 자기가 잘 아는 업종을 마다하고 다른 업종의 주식을 더 선호하는 이유를 모르겠다. 강점이 있는 사람이 없는 사람보다 앞서 나가기에 유리한 법이다. 일반인이 수익 개선을 예측하는 측면에서 전문가보다 훨씬 유리한 출발선을 선점할 수 있다. 꼭 매출액 변화가 아니더라도 대차대조표에 나타나지 않는 엄청난 자산이 숨겨져 있을지도 모른다. [구조화] [후대 해석] 이 장은 생활·업무 현장 기반의 아이디어 소싱을 다루며, 프로세스 단계로는 종목 발굴에 해당한다. [실전 적용] [현대 적용] 투자 아이디어를 내가 왜 남보다 빨리 봤는가 , 그 관찰이 매출·이익으로 연결되는가 , 이 현상이 일시적 유행인가 로 정리한다. [오해 방지] [후대 해석] 자기가 자주 쓰는 제품이라는 사실만으로 텐베거가 되지 않는다."},{"i":11,"title":"7. 주식을 샀다. 그런데 어떤 유형일까?","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>어떤 경로로 종목을 발굴하더라도 성급하게 주식을 매수해서는 안 된다.<\/li>\n<li>주식을 조사할 때 첫 단계에서 확인할 사항은 다음과 같다.<ul>\n<li>이익이 얼마나 되는가? (특정 제품이 회사 매출에 차지하는 비율)<\/li>\n<li>대기업은 움직임이 둔하다 (조건이 동일하다면 소형주를 노리는 것이 유리)<\/li>\n<li>6가지 유형 (저성장주, 대형우량주, 고성장주, 경기순환주, 회생주, 자산주)<\/li>\n<li>저성장주에 투자해 시간을 낭비할 이유가 어디에 있는가?<\/li>\n<li>대형우량주를 보유했는데 1~2년 사이에 주가가 50% 상승하였다면, 검토 후 매도를 고려해 보아야 한다.<\/li>\n<li>대형우량주는 경기침체, 일시적으로 시장 상황이 좋지 않을 때 포트폴리오를 지켜주는 버팀목이 될 수 있다.<\/li>\n<li>고성장주는 연 20~25%의 성장률을 보이는 작고 적극적인 신생 기업이고 적절한 투자 시 텐베거 이상의 실적을 기대할 수 있다.<\/li>\n<li>고성장주가 꼭 고성장 업종에서만 나오는 것이 아니고 저성장 업종에서도 확장할 여지만 있으면 얼마든지 고성장주가 될 수 있다.<\/li>\n<li>고성장주는 자금부족이나 동력이 약해져 저성장주의 단계로 접어들면 주가는 내리막길을 걷는다.<\/li>\n<li>고성장주 투자 비결은 언제 성장을 멈출 것인지, 그만한 성장에 대해 얼마만큼의 대가를 치러야 할 지 파악하는 것이다.<\/li>\n<li>경기순환주는 사업이 확장과 수축을 되풀이하므로 시점 선택이 중요하다.<\/li>\n<li>회생주는 망가질 대로 망가지고 파산 가능성을 안고 있는 기업이고 큰 수익이 가능하지만 리스크가 크다.<\/li>\n<li>자산주란 월가는 모르지만 나만 알고 있는, 값있는 자산을 보유한 기업을 말한다.<\/li>\n<li>처음에 어떤 유형으로 분류된다고 해서 그것이 영원히 고정되는 것은 아니다.<\/li>\n<li>주식의 유형을 분류하는 것은 투자 논리를 개발하는 첫 단계이고 이후 어떤 논리가 성립될 것인지 알 수 있다.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 여섯 유형으로 기대수익과 점검 기준을 갈라 놓으며, 프로세스 단계로는 유형 분류에 직접 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 매수 전 문서에 반드시 6가지 유형 중 하나를 택하고, 복합형이면 주된 투자 논리를 기준으로 1차 분류한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 좋은 회사라는 말은 유형 분류를 대체하지 못한다.<\/li>\n<\/ul>","text":"기존 노트 어떤 경로로 종목을 발굴하더라도 성급하게 주식을 매수해서는 안 된다. 주식을 조사할 때 첫 단계에서 확인할 사항은 다음과 같다. 이익이 얼마나 되는가? (특정 제품이 회사 매출에 차지하는 비율) 대기업은 움직임이 둔하다 (조건이 동일하다면 소형주를 노리는 것이 유리) 6가지 유형 (저성장주, 대형우량주, 고성장주, 경기순환주, 회생주, 자산주) 저성장주에 투자해 시간을 낭비할 이유가 어디에 있는가? 대형우량주를 보유했는데 1~2년 사이에 주가가 50% 상승하였다면, 검토 후 매도를 고려해 보아야 한다. 대형우량주는 경기침체, 일시적으로 시장 상황이 좋지 않을 때 포트폴리오를 지켜주는 버팀목이 될 수 있다. 고성장주는 연 20~25%의 성장률을 보이는 작고 적극적인 신생 기업이고 적절한 투자 시 텐베거 이상의 실적을 기대할 수 있다. 고성장주가 꼭 고성장 업종에서만 나오는 것이 아니고 저성장 업종에서도 확장할 여지만 있으면 얼마든지 고성장주가 될 수 있다. 고성장주는 자금부족이나 동력이 약해져 저성장주의 단계로 접어들면 주가는 내리막길을 걷는다. 고성장주 투자 비결은 언제 성장을 멈출 것인지, 그만한 성장에 대해 얼마만큼의 대가를 치러야 할 지 파악하는 것이다. 경기순환주는 사업이 확장과 수축을 되풀이하므로 시점 선택이 중요하다. 회생주는 망가질 대로 망가지고 파산 가능성을 안고 있는 기업이고 큰 수익이 가능하지만 리스크가 크다. 자산주란 월가는 모르지만 나만 알고 있는, 값있는 자산을 보유한 기업을 말한다. 처음에 어떤 유형으로 분류된다고 해서 그것이 영원히 고정되는 것은 아니다. 주식의 유형을 분류하는 것은 투자 논리를 개발하는 첫 단계이고 이후 어떤 논리가 성립될 것인지 알 수 있다. [구조화] [후대 해석] 이 장은 여섯 유형으로 기대수익과 점검 기준을 갈라 놓으며, 프로세스 단계로는 유형 분류에 직접 해당한다. [실전 적용] [현대 적용] 매수 전 문서에 반드시 6가지 유형 중 하나를 택하고, 복합형이면 주된 투자 논리를 기준으로 1차 분류한다. [오해 방지] [후대 해석] 좋은 회사라는 말은 유형 분류를 대체하지 못한다."},{"i":12,"title":"8. 정말 멋진 완벽한 종목들!","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>사업의 기본을 이해하면 그 회사의 내용을 파악하기가 한결 쉬워진다.<\/li>\n<li>이런 회사는 바보라도 경영할 수 있겠다 싶은 단순한 사업을 하는 곳이 그 회사의 장점이 된다.<\/li>\n<li>따분하고 우스꽝스러운 이름은 주식을 몇 달러 싸게 살 수 있다.<\/li>\n<li>따분한 사업을 하면서 수익이 높고 대차대조표도 안정적이면 주식을 헐값에 살 수 있는 넉넉한 시간이 있다.<\/li>\n<li>사람들이 무시하고 구역질하며 외면하는 혐오스러운 사업일수록 이상적이다.<\/li>\n<li>대기업에서 분사하는 회사들은 대개 재무제표가 건전하고 독립된 회사로 성공할 요건을 잘 갖추고 있다.<\/li>\n<li>기관투자자가 보유하지 않고, 분석가가 조사하지 않은 회사는 투자 성공 가능성이 2배로 높아진다.<\/li>\n<li>유독 폐기물이나 마피아와 연관이 있다고 소문난 회사는 오해에 의해 주식 가치가 저평가되어 있을 수 있다.<\/li>\n<li>죽음과 관련된 음울한 사업을 하는 회사는 수익이 증가, 사업도 빠르게 성장하고 부채도 없어도 월가가 거들떠보지 않을 수 있다.<\/li>\n<li>성장이 정체된 업종이야말로 고성장주처럼 경쟁이 심하지 않아 대박 종목이 탄생 가능한 곳이다.<\/li>\n<li>채석장의 독점권, 제약 및 화학회사의 특정 제품 제조 기술 그리고 훌륭한 브랜드도 틈새를 확보한 회사다.<\/li>\n<li>약품, 청량음료, 면도날 또는 담배 등 지속적으로 구입하는 제품의 회사에 투자하라.<\/li>\n<li>스캐너제조사보다 스캐너를 설치하는 슈퍼마켓처럼 기술을 사용하는 회사에 투자하라.<\/li>\n<li>내부자가 주식을 매수하는 정보를 확인한다면, 이보다 확실한 성공 가능성은 없다.<\/li>\n<li>자사주 매입은 투자자들에게 보상하는 가장 단순하면서도 가장 좋은 방법이다.<\/li>\n<li>자사주 매입 대신 배당 인상, 신제품 개발, 신규 사업 진출, 기업 인수 등이 있다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 좋은 후보의 정성 신호를 모아 주며, 프로세스 단계로는 발굴과 초기 조사에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 후보 종목마다 <code>왜 따분한가<\/code>, <code>왜 무시받는가<\/code>, <code>왜 반복 구매가 가능한가<\/code>, <code>누가 주식을 사는가<\/code>를 적는다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 따분한 사업이 늘 좋은 사업은 아니다.<\/li>\n<\/ul>","text":"기존 노트 사업의 기본을 이해하면 그 회사의 내용을 파악하기가 한결 쉬워진다. 이런 회사는 바보라도 경영할 수 있겠다 싶은 단순한 사업을 하는 곳이 그 회사의 장점이 된다. 따분하고 우스꽝스러운 이름은 주식을 몇 달러 싸게 살 수 있다. 따분한 사업을 하면서 수익이 높고 대차대조표도 안정적이면 주식을 헐값에 살 수 있는 넉넉한 시간이 있다. 사람들이 무시하고 구역질하며 외면하는 혐오스러운 사업일수록 이상적이다. 대기업에서 분사하는 회사들은 대개 재무제표가 건전하고 독립된 회사로 성공할 요건을 잘 갖추고 있다. 기관투자자가 보유하지 않고, 분석가가 조사하지 않은 회사는 투자 성공 가능성이 2배로 높아진다. 유독 폐기물이나 마피아와 연관이 있다고 소문난 회사는 오해에 의해 주식 가치가 저평가되어 있을 수 있다. 죽음과 관련된 음울한 사업을 하는 회사는 수익이 증가, 사업도 빠르게 성장하고 부채도 없어도 월가가 거들떠보지 않을 수 있다. 성장이 정체된 업종이야말로 고성장주처럼 경쟁이 심하지 않아 대박 종목이 탄생 가능한 곳이다. 채석장의 독점권, 제약 및 화학회사의 특정 제품 제조 기술 그리고 훌륭한 브랜드도 틈새를 확보한 회사다. 약품, 청량음료, 면도날 또는 담배 등 지속적으로 구입하는 제품의 회사에 투자하라. 스캐너제조사보다 스캐너를 설치하는 슈퍼마켓처럼 기술을 사용하는 회사에 투자하라. 내부자가 주식을 매수하는 정보를 확인한다면, 이보다 확실한 성공 가능성은 없다. 자사주 매입은 투자자들에게 보상하는 가장 단순하면서도 가장 좋은 방법이다. 자사주 매입 대신 배당 인상, 신제품 개발, 신규 사업 진출, 기업 인수 등이 있다. [구조화] [후대 해석] 이 장은 좋은 후보의 정성 신호를 모아 주며, 프로세스 단계로는 발굴과 초기 조사에 해당한다. [실전 적용] [현대 적용] 후보 종목마다 왜 따분한가 , 왜 무시받는가 , 왜 반복 구매가 가능한가 , 누가 주식을 사는가 를 적는다. [오해 방지] [후대 해석] 따분한 사업이 늘 좋은 사업은 아니다."},{"i":13,"title":"9. 내가 기피하는 주식","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>가장 인기 있는 업종 중에서도 세간의 주목을 가장 많이 받고 있는 주식을 기피하라.<\/li>\n<li>인기 종목의 주가는 빠르게 상승하지만 상승할 때만큼이나 추락하는 속도도 빠르다.<\/li>\n<li>고성장 인기 업종에는 똑똑한 인재들이 구름처럼 몰려들고 특허 등이 없다면 후발 경쟁 업체의 모방으로 인해 사업에 치명타를 입힌다.<\/li>\n<li>제2의 아무개는 결코 아무개가 되는 법이 없다.<\/li>\n<li>자사주 매입이나 배당금 인상 대신 터무니없는 기업을 인수하면서 사업다악화하는 기업을 피하라.<\/li>\n<li>관련된 사업을 결합하여 전체가 함께 기대 이상의 시너지 효과를 볼 수 있는 인수도 있다.<\/li>\n<li>입소문만 화려하고 실체가 없는 소문주를 조심하여야 하고 수익이 나올 때까지 기다려도 늦지 않다.<\/li>\n<li>제품 중 25~50%를 한 기업 고객에만 판매하는 회사는 안정성이 떨어진다.<\/li>\n<li>이름이 멋진 주식을 조심하라.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 제외해야 할 후보를 미리 걸러내며, 프로세스 단계로는 발굴과 최종 점검의 음(-)의 필터에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 투자 검토 문서에 <code>버리는 이유<\/code> 섹션을 두고, 인기업종·사업다악화·단일 고객 의존을 별도 항목으로 체크한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] <code>남들이 다 산다<\/code>는 것은 품질 신호가 아니라 경쟁 심화 신호일 수 있다.<\/li>\n<\/ul>","text":"기존 노트 가장 인기 있는 업종 중에서도 세간의 주목을 가장 많이 받고 있는 주식을 기피하라. 인기 종목의 주가는 빠르게 상승하지만 상승할 때만큼이나 추락하는 속도도 빠르다. 고성장 인기 업종에는 똑똑한 인재들이 구름처럼 몰려들고 특허 등이 없다면 후발 경쟁 업체의 모방으로 인해 사업에 치명타를 입힌다. 제2의 아무개는 결코 아무개가 되는 법이 없다. 자사주 매입이나 배당금 인상 대신 터무니없는 기업을 인수하면서 사업다악화하는 기업을 피하라. 관련된 사업을 결합하여 전체가 함께 기대 이상의 시너지 효과를 볼 수 있는 인수도 있다. 입소문만 화려하고 실체가 없는 소문주를 조심하여야 하고 수익이 나올 때까지 기다려도 늦지 않다. 제품 중 25~50%를 한 기업 고객에만 판매하는 회사는 안정성이 떨어진다. 이름이 멋진 주식을 조심하라. [구조화] [후대 해석] 이 장은 제외해야 할 후보를 미리 걸러내며, 프로세스 단계로는 발굴과 최종 점검의 음(-)의 필터에 해당한다. [실전 적용] [현대 적용] 투자 검토 문서에 버리는 이유 섹션을 두고, 인기업종·사업다악화·단일 고객 의존을 별도 항목으로 체크한다. [오해 방지] [후대 해석] 남들이 다 산다 는 것은 품질 신호가 아니라 경쟁 심화 신호일 수 있다."},{"i":14,"title":"10. 이익이 가장 중요하다","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>결론은 이익과 자산으로 귀결되고 진정한 가치는 항상 승리한다.<\/li>\n<li>잠시 벗어날 수는 있지만 결국 어느 차트에서든 이익선과 주가선은 나란히 움직인다.<\/li>\n<li>기업이 무엇을 어떻게 하든 결국 주식의 운명을 결정하는 것은 이익이다.<\/li>\n<li>이익이 계속 증가함에 따라 주가가 오르고 낙관론에 의해 이익보다 주가가 과대평가된 후 이익이 무너지자 주가도 따라 무너진다.<\/li>\n<li>이익선(EPS* 15), PER는 회사의 수익 잠재력에 대비하여 주가의 적절성이나 과대평가, 과소평가 여부를 판단하는데 유용한 척도다.<\/li>\n<li>PER가 낮은 주식만 찾는 전략은 아무 의미가 없다. 사과를 오렌지와 비교해서는 곤란하다.<\/li>\n<li>PER에 너무 빠지는 것은 어리석은 일이지만, 결코 무시해서는 안 된다.<\/li>\n<li>주식 매수 전 PER의 수준을 가늠하기 위해 과거 몇 년 동안의 PER과 비교 후 가격이 적정한지 알아볼 수 있다.<\/li>\n<li>PER 관련 꼭 한 가지 기억할 것이 있다면, PER이 지나치게 높은 종목을 피해야 한다는 점이다.<\/li>\n<li>일부 종목이 이익에 비해 과대평가된 가격으로 거래되면, 다른 종목의 가격 또한 대부분 이익에 비해 부풀려져서 거래되는 경향이 있다.<\/li>\n<li>이자율이 낮으면 채권의 매력도가 떨어지므로 투자자들이 주식에 더 높은 값을 지불하기 때문에 이자율은 현재 PER에 큰 영향을 미친다.<\/li>\n<li>강세장에 나타나는 지나친 낙관주의 때문에 PER이 터무니없는 수준까지 올라가는 사태도 발생하고 이는 반드시 조정이 가해진다.<\/li>\n<li>미래 이익을 예측하는 최선의 방법은 경험에 비추어 현재 이익을 바탕으로 주식이 적절하게 평가되었는지 추측하는 정도다.<\/li>\n<li>회사는 기본적으로 비용 절감, 가격 인상, 신규 시장 진출, 기존 시장 매출 증대, 적자 사업 재활성화 혹은 중단, 매각 등의 방법으로 이익을 증대시킬 수 있다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 스토리를 숫자로 연결하며, 프로세스 단계로는 회사 이해와 숫자 확인에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 최소한 최근 5년 EPS 추세, 현재 PER, 과거 밴드, 동종업계 비교, 이익 증가 동인을 한 표에 정리한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] PER가 낮다고 자동으로 저평가가 아니다.<\/li>\n<\/ul>","text":"기존 노트 결론은 이익과 자산으로 귀결되고 진정한 가치는 항상 승리한다. 잠시 벗어날 수는 있지만 결국 어느 차트에서든 이익선과 주가선은 나란히 움직인다. 기업이 무엇을 어떻게 하든 결국 주식의 운명을 결정하는 것은 이익이다. 이익이 계속 증가함에 따라 주가가 오르고 낙관론에 의해 이익보다 주가가 과대평가된 후 이익이 무너지자 주가도 따라 무너진다. 이익선(EPS* 15), PER는 회사의 수익 잠재력에 대비하여 주가의 적절성이나 과대평가, 과소평가 여부를 판단하는데 유용한 척도다. PER가 낮은 주식만 찾는 전략은 아무 의미가 없다. 사과를 오렌지와 비교해서는 곤란하다. PER에 너무 빠지는 것은 어리석은 일이지만, 결코 무시해서는 안 된다. 주식 매수 전 PER의 수준을 가늠하기 위해 과거 몇 년 동안의 PER과 비교 후 가격이 적정한지 알아볼 수 있다. PER 관련 꼭 한 가지 기억할 것이 있다면, PER이 지나치게 높은 종목을 피해야 한다는 점이다. 일부 종목이 이익에 비해 과대평가된 가격으로 거래되면, 다른 종목의 가격 또한 대부분 이익에 비해 부풀려져서 거래되는 경향이 있다. 이자율이 낮으면 채권의 매력도가 떨어지므로 투자자들이 주식에 더 높은 값을 지불하기 때문에 이자율은 현재 PER에 큰 영향을 미친다. 강세장에 나타나는 지나친 낙관주의 때문에 PER이 터무니없는 수준까지 올라가는 사태도 발생하고 이는 반드시 조정이 가해진다. 미래 이익을 예측하는 최선의 방법은 경험에 비추어 현재 이익을 바탕으로 주식이 적절하게 평가되었는지 추측하는 정도다. 회사는 기본적으로 비용 절감, 가격 인상, 신규 시장 진출, 기존 시장 매출 증대, 적자 사업 재활성화 혹은 중단, 매각 등의 방법으로 이익을 증대시킬 수 있다. [구조화] [후대 해석] 이 장은 스토리를 숫자로 연결하며, 프로세스 단계로는 회사 이해와 숫자 확인에 해당한다. [실전 적용] [현대 적용] 최소한 최근 5년 EPS 추세, 현재 PER, 과거 밴드, 동종업계 비교, 이익 증가 동인을 한 표에 정리한다. [오해 방지] [후대 해석] PER가 낮다고 자동으로 저평가가 아니다."},{"i":15,"title":"11. 2분 연습","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>회사가 지속적인 번영과 성장을 가속화하기 위해 어떤 일을 하고, 어떻게 기대할 수 있을지 최대한 파악하는 스토리 파악 작업이 필요하다.<\/li>\n<li>자산주는 예외지만 한 회사의 이익이 계속 증가하려면 무엇인가 역동적인 움직임이 일어나야 한다.<\/li>\n<li>주식 매수 전 이 주식에 흥미를 느끼는 이유, 이 회사가 성공하기 위해 필요한 요건, 장래에 예상되는 걸림돌 등에 대해 2분 독백을 하라<\/li>\n<li>저성장주는 배당을 기대하기 때문에 투자를 할 것이고 독백에는 꾸준한 이익 증가, 높은 배당 수익률, 연속배당, 배당금액 상승<\/li>\n<li>경기순환주 독백에는 사업 환경, 재고, 물가에 초점을 맞춰야 한다.<\/li>\n<li>자산주 독백에는 사업부, 부동산 등의 자산의 내용과 가치를 주로 언급해야 한다.<\/li>\n<li>회생주 독백에는 회사 경영을 개선하기 위해 어떤 작업에 착수했으며, 그러한 계획이 지금까지 어떤 효과를 보고 있는지 집중한다.<\/li>\n<li>대형우량주 독백에는 PER, 최근 몇 달간 주가 급등 여부, 성장률 높이기 위한 전략 등에 대한 내용을 포함해야 한다.<\/li>\n<li>고성장주 독백에는 어디에서 어떤 방법으로 고속 성장을 지속할 수 있는가에 대해 고민해야 한다.<\/li>\n<li>종목 점검 시 경쟁자와 대화할 때 대개 특별한 이유 없이 경쟁사에 대해 부정적으로 말하지만 경쟁 기업을 인정한다면 그 경쟁 기업은 사업을 제대로 하고 있다고 믿어도 좋다.<\/li>\n<li>기술주 대비 호텔이나 음식점 체인의 경우는 기본적인 모델에 큰 차이가 없는 데다, 하룻밤 사이에 100여 개씩 우후죽순으로 지을 수도 없고 여러 지역에 분산된 업장은 서로 별다른 영향 없이 영업할 수 있다.<\/li>\n<li>투자자가 기업에 도취했을 때 큰 실수를 할 수 있다.<\/li>\n<li>검증되지 않은 기업에 대해서는 투자를 미루는 것이 좋고 이 아이디어가 다른 곳에서도 통할까? 라는 질문이 필요하다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 투자 논리를 짧게 압축하게 만들며, 프로세스 단계로는 2분 독백 작성과 최종 점검 사이에 위치한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 종목마다 6문장 이내 독백 문서를 작성하고, 유형별로 반드시 다른 질문을 던진다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 스토리를 잘 말하는 것과 스토리가 맞는 것은 다르다.<\/li>\n<\/ul>","text":"기존 노트 회사가 지속적인 번영과 성장을 가속화하기 위해 어떤 일을 하고, 어떻게 기대할 수 있을지 최대한 파악하는 스토리 파악 작업이 필요하다. 자산주는 예외지만 한 회사의 이익이 계속 증가하려면 무엇인가 역동적인 움직임이 일어나야 한다. 주식 매수 전 이 주식에 흥미를 느끼는 이유, 이 회사가 성공하기 위해 필요한 요건, 장래에 예상되는 걸림돌 등에 대해 2분 독백을 하라 저성장주는 배당을 기대하기 때문에 투자를 할 것이고 독백에는 꾸준한 이익 증가, 높은 배당 수익률, 연속배당, 배당금액 상승 경기순환주 독백에는 사업 환경, 재고, 물가에 초점을 맞춰야 한다. 자산주 독백에는 사업부, 부동산 등의 자산의 내용과 가치를 주로 언급해야 한다. 회생주 독백에는 회사 경영을 개선하기 위해 어떤 작업에 착수했으며, 그러한 계획이 지금까지 어떤 효과를 보고 있는지 집중한다. 대형우량주 독백에는 PER, 최근 몇 달간 주가 급등 여부, 성장률 높이기 위한 전략 등에 대한 내용을 포함해야 한다. 고성장주 독백에는 어디에서 어떤 방법으로 고속 성장을 지속할 수 있는가에 대해 고민해야 한다. 종목 점검 시 경쟁자와 대화할 때 대개 특별한 이유 없이 경쟁사에 대해 부정적으로 말하지만 경쟁 기업을 인정한다면 그 경쟁 기업은 사업을 제대로 하고 있다고 믿어도 좋다. 기술주 대비 호텔이나 음식점 체인의 경우는 기본적인 모델에 큰 차이가 없는 데다, 하룻밤 사이에 100여 개씩 우후죽순으로 지을 수도 없고 여러 지역에 분산된 업장은 서로 별다른 영향 없이 영업할 수 있다. 투자자가 기업에 도취했을 때 큰 실수를 할 수 있다. 검증되지 않은 기업에 대해서는 투자를 미루는 것이 좋고 이 아이디어가 다른 곳에서도 통할까? 라는 질문이 필요하다. [구조화] [후대 해석] 이 장은 투자 논리를 짧게 압축하게 만들며, 프로세스 단계로는 2분 독백 작성과 최종 점검 사이에 위치한다. [실전 적용] [현대 적용] 종목마다 6문장 이내 독백 문서를 작성하고, 유형별로 반드시 다른 질문을 던진다. [오해 방지] [후대 해석] 스토리를 잘 말하는 것과 스토리가 맞는 것은 다르다."},{"i":16,"title":"12. 사실을 확인하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>기업들은 거의 모든 정보를 투자설명서, 분기보고서, 연례보고서에 의무적으로 공개해야 한다.<\/li>\n<li>주식 중개인을 최대한 활용하여 정보를 얻어 내라.<\/li>\n<li>회사에 하고 싶은 구체적인 질문이 있다면 질문을 미묘하고 간접적인 형식으로 준비하여 홍보팀에 전화하라.<\/li>\n<li>미래 이익을 예측하는 것은 여간 힘든 일이 아니고 분석가들 사이에서도 예측의 내용은 천차만별이고 회사 입장에서도 확신할 수 없다.<\/li>\n<li>회사의 말은 믿을 만하다. 다만 이들이 사업 분야별로 사용하는 수식어는 천차만별이다.<\/li>\n<li>본사에 방문 후 회사의 분위기를 느끼고 검소함 등에서 회사의 이익에 대한 우선순위를 관찰하라.<\/li>\n<li>주주총회는 주요 인물들을 만날 수 있는 좋은 기회가 되고 때때로 회사 대표에게 받은 인상을 통해 회사의 전망을 감지하기도 한다.<\/li>\n<li>제품 발견 후 상점을 돌아다니며 제품을 체험하는 것이야말로 기본적인 투자 전략이라고 믿는다.<\/li>\n<li>매장에 줄지어 선 사람들을 지켜보거나 매장 직원들을 보고 확인할 수 있다.<\/li>\n<li>주변 사람이 평가했다는 이유만으로 종목 매수 기회를 놓치지 마라.<\/li>\n<li>연차보고서에서 중요한 것은 자산과 부채가 소개된 대차대조표다.<\/li>\n<li>회사의 현금성 자산 총액의 증가는 회사의 번영을 나타내는 확실한 신호다.<\/li>\n<li>부채 감소 역시 회사의 번영을 의미한다.<\/li>\n<li>현금성 자산 총액에서 장기부채를 빼면 순현금 보유량이 된다.<\/li>\n<li>회사를 분석하는 데 도움이 되는 중요한 숫자는 따로 존재한다. (다음 장)<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 공시·현장·회사 접촉으로 사실을 검증하게 하며, 프로세스 단계로는 조사와 회사 이해에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 공시 문서, IR 자료, 매장·제품 체험, 경쟁사 비교, 직원·고객 관찰 순으로 조사 루틴을 고정한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 회사가 말해 준다고 해서 바로 믿는 것이 아니라, 말과 숫자와 현장을 대조해야 한다.<\/li>\n<\/ul>","text":"기존 노트 기업들은 거의 모든 정보를 투자설명서, 분기보고서, 연례보고서에 의무적으로 공개해야 한다. 주식 중개인을 최대한 활용하여 정보를 얻어 내라. 회사에 하고 싶은 구체적인 질문이 있다면 질문을 미묘하고 간접적인 형식으로 준비하여 홍보팀에 전화하라. 미래 이익을 예측하는 것은 여간 힘든 일이 아니고 분석가들 사이에서도 예측의 내용은 천차만별이고 회사 입장에서도 확신할 수 없다. 회사의 말은 믿을 만하다. 다만 이들이 사업 분야별로 사용하는 수식어는 천차만별이다. 본사에 방문 후 회사의 분위기를 느끼고 검소함 등에서 회사의 이익에 대한 우선순위를 관찰하라. 주주총회는 주요 인물들을 만날 수 있는 좋은 기회가 되고 때때로 회사 대표에게 받은 인상을 통해 회사의 전망을 감지하기도 한다. 제품 발견 후 상점을 돌아다니며 제품을 체험하는 것이야말로 기본적인 투자 전략이라고 믿는다. 매장에 줄지어 선 사람들을 지켜보거나 매장 직원들을 보고 확인할 수 있다. 주변 사람이 평가했다는 이유만으로 종목 매수 기회를 놓치지 마라. 연차보고서에서 중요한 것은 자산과 부채가 소개된 대차대조표다. 회사의 현금성 자산 총액의 증가는 회사의 번영을 나타내는 확실한 신호다. 부채 감소 역시 회사의 번영을 의미한다. 현금성 자산 총액에서 장기부채를 빼면 순현금 보유량이 된다. 회사를 분석하는 데 도움이 되는 중요한 숫자는 따로 존재한다. (다음 장) [구조화] [후대 해석] 이 장은 공시·현장·회사 접촉으로 사실을 검증하게 하며, 프로세스 단계로는 조사와 회사 이해에 해당한다. [실전 적용] [현대 적용] 공시 문서, IR 자료, 매장·제품 체험, 경쟁사 비교, 직원·고객 관찰 순으로 조사 루틴을 고정한다. [오해 방지] [후대 해석] 회사가 말해 준다고 해서 바로 믿는 것이 아니라, 말과 숫자와 현장을 대조해야 한다."},{"i":17,"title":"13. 유명한 숫자들","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>해당 제품이나 서비스가 매출액에서 차지하는 비중<\/li>\n<li>공정하게 평가된 회사의 PER은 회사의 (이익)성장률과 같다.<\/li>\n<li>미래성장률의 경우에는 일반투자자들이나 전문투자자들이나 예측이 부정확하기는 마찬가지다.<\/li>\n<li>조금 더 복잡한 공식을 사용하면 배당까지 감안해서 이익성장률을 구할 수 있다. ( (장기성장률+배당수익률) / 10 = 이익성장률 )<\/li>\n<li>현금보유량이 항상 중요한 것은 아니고 비율이 중요하며 그래도 조사할 때는 항상 확인하는 편이 낫다.<\/li>\n<li>일반적으로 기업의 대차대조표의 왼쪽 면은 자산(재고, 외상매출금, 공장 및 장비 등)이고 오른쪽 면은 자산을 조달한 방법을 보여준다.<\/li>\n<li>회사의 재무 건전성을 신속하게 판단하는 방법은 대차대조표 오른쪽에 있는 지분과 부채를 비교하는 것이다.<\/li>\n<li>정상적으로 운영되는 기업의 대차대조표는 보통 주주 지분 75%와 부채 25% 정도로 구성된다.<\/li>\n<li>회생주나 문제 기업의 경우 부채에 특별히 관심을 가져야 하는 이유는 기업이 위기를 맞았을 때 생존과 파산을 결정하는 요소는 부채이기 때문이다.<\/li>\n<li>위기를 맞이했을 때 승자와 패자를 가르는 요소로써 부채의 규모만큼이나 부채의 종류도 중요하다. (은행대출금, 장기차입금)<\/li>\n<li>은행대출금은 은행이 요구하면 갚아야 하기에 위험하고 상업어음은 더 위험하다.<\/li>\n<li>장기차입금은 채무자가 이자만 계속 지급하면 상황이 아무리 암울해도 조기상환을 요구할 수 없고 대부분 장기 회사채 형태를 띤다.<\/li>\n<li>추가 수입을 원하는 투자자들은 대개 배당이 없는 주식보다 배당을 지급하는 주식을 좋아하고 배당 수입은 항상 도움이 된다.<\/li>\n<li>다만 진정한 쟁점은 배당이 회사의 가치와 주가에 장기적으로 어떤 영향을 미치느냐다.<\/li>\n<li>시장폭락 시 고배당주는 무배당주보다 선방한다. 특히 YOC가 좋아지며 특히 장기간 배당을 지급하고 증가시킨 우량주는 위기가 닥치면 사람들이 몰려드는 종목이 된다.<\/li>\n<li>배당을 지급하지 않는 소기업은 사업 확장에 돈을 투입하여 훨씬 빨리 성장한다.<\/li>\n<li>배당을 바라보고 주식을 매입할 생각이라면 경기침체와 난관을 맞이해도 배당을 지급할 회사인지 확인하라.<\/li>\n<li>장부가치를 보고 주식을 매입한다면 그 자산의 실제 가치가 무엇인지 자세히 파악하고 있어야 한다.<\/li>\n<li>장부가치는 실제 가치보다 부풀려지는 경우도 많지만 반대로 축소되는 경우도 많고 이 경우 엄청난 자산주를 손에 넣을 수 있다.<\/li>\n<li>토지, 목재, 석유, 귀금속 등 자연자원, 부동산, 브랜드 가치, 특허의약품, 독점영업권, 석유 재고, 모기업의 자회사의 숨은 자산, 다른 회사의 주식을 보유한 경우, 조세 감면도 회생기업에게는 값진 자산이 된다.<\/li>\n<li>현금 흐름은 사업의 결과로 회사가 벌어들이는 돈의 규모를 말한다.<\/li>\n<li>돈을 벌기 위해서 돈을 덜 써도 되는, 자본적 지출에 매달리지 않아도 되는 회사는 돈 벌기 쉬운 회사이다.<\/li>\n<li>현금 흐름 수치에 얽매일 필요는 없지만 참고한다면 그 수치가 정상적인 자본적 지출을 차감한 뒤 남는 잉여 현금 흐름인지 확인하라.<\/li>\n<li>이익은 보통 수준이지만 잉여 현금 흐름 때문에 투자가치가 뛰어난 종목도 종종 눈에 띈다.<\/li>\n<li>자산주에 몰두하는 투자자는 회사가 평범해서 변화가 없고 현금 흐름이 많으며 소유주가 사업 확장 생각이 없는 회사를 찾아라.<\/li>\n<li>제조 업체나 소매 업체 모두에게 재고 증가는 대개 나쁜 신호이며 재고가 매출보다 빠르게 증가한다면, 이것은 위험 신호다.<\/li>\n<li>재고 파악 시 흔히 사용하는 회계방법 두 가지를 간단히 들자면 후입선출법(LIFO)과 선입선출법(FIFO)을 꼽을 수 있다.<\/li>\n<li>올해와 작년을 기준으로 후입선출법이나 선입선출법의 가치를 비교해서 재고 규모의 증감 여부를 판단할 수 있다.<\/li>\n<li>자동차회사의 재고 증가는 크게 걱정하지 않아도 되지만 유행이 지난 의류는 큰 폭으로 가격을 인하하여도 팔리지 않는다.<\/li>\n<li>침체를 겪던 회사에서 재고가 감소하기 시작하면 이는 상황이 호전되었다는 첫 번째 증거다.<\/li>\n<li>회사가 직원들에게 주식 매입 선택권과 연금 혜택을 제공하고 있고 투자자들은 이러한 혜택의 영향을 검토할 필요가 있다.<\/li>\n<li>성장을 확장과 동일시하는 관점은 월가가 범하는 가장 흔한 착각이다.<\/li>\n<li>고객을 잃지 않으면서도 매년 가격을 올릴 수 있는 회사를 발견했다면, 이 회사는 기막힌 투자 대상이다.<\/li>\n<li>고성장주의 경우 빠른 이익 증가가 주가를 빠르게 끌어올릴 수 있다는 사실을 분명히 이해해야 한다.<\/li>\n<li>간단히 말해서 장기적으로 20% 성장기업이 시장에서 엄청난 이익을 올리는 비결이고 대박종목의 열쇠이다.<\/li>\n<li>요점이란 손익계산서 끝에 나오는 최종 숫자인 세후이익이다.<\/li>\n<li>세전이익률은 천차만별이므로 같은 업종에 속한 기업들을 비교해야 도움이 되고 이익률이 가장 높은 회사는 당연히 운영 비용이 가장 낮을 것이고 사업 환경이 악화되어도 생존할 가능성이 높아진다.<\/li>\n<li>사업 환경이 개선되어 실적이 향상되면, 세전이익률이 가장 낮은 기업이 가장 큰 혜택을 볼 수 있다.<\/li>\n<li>파산 직전까지 몰린 침체 기업이 경기가 회복되면 대박을 내기도 하고 이러한 현상은 자동차, 화학, 제지, 항공, 철강, 전자, 비철금속 업종에서 되풀이되고 있다.<\/li>\n<li>따라서 우리는 시장이 좋을 때나 나쁠 때나 장기간 보유할 주식으로는 비교적 이익률이 높은 종목을, 그리고 성공적인 회생주 중에서는 비교적 이익률이 낮은 종목을 발굴해야 한다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 핵심 지표를 유형별로 고르게 하며, 프로세스 단계로는 숫자 확인에 직접 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 종목별 핵심 지표를 <code>공통 6개<\/code>, <code>유형별 4개<\/code>로 나눠서 본다. 공통은 이익, 부채, 현금, 재고, 밸류에이션, 자본배분이다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 숫자를 많이 본다고 분석이 깊어지는 것은 아니다.<\/li>\n<\/ul>","text":"기존 노트 해당 제품이나 서비스가 매출액에서 차지하는 비중 공정하게 평가된 회사의 PER은 회사의 (이익)성장률과 같다. 미래성장률의 경우에는 일반투자자들이나 전문투자자들이나 예측이 부정확하기는 마찬가지다. 조금 더 복잡한 공식을 사용하면 배당까지 감안해서 이익성장률을 구할 수 있다. ( (장기성장률+배당수익률) / 10 = 이익성장률 ) 현금보유량이 항상 중요한 것은 아니고 비율이 중요하며 그래도 조사할 때는 항상 확인하는 편이 낫다. 일반적으로 기업의 대차대조표의 왼쪽 면은 자산(재고, 외상매출금, 공장 및 장비 등)이고 오른쪽 면은 자산을 조달한 방법을 보여준다. 회사의 재무 건전성을 신속하게 판단하는 방법은 대차대조표 오른쪽에 있는 지분과 부채를 비교하는 것이다. 정상적으로 운영되는 기업의 대차대조표는 보통 주주 지분 75%와 부채 25% 정도로 구성된다. 회생주나 문제 기업의 경우 부채에 특별히 관심을 가져야 하는 이유는 기업이 위기를 맞았을 때 생존과 파산을 결정하는 요소는 부채이기 때문이다. 위기를 맞이했을 때 승자와 패자를 가르는 요소로써 부채의 규모만큼이나 부채의 종류도 중요하다. (은행대출금, 장기차입금) 은행대출금은 은행이 요구하면 갚아야 하기에 위험하고 상업어음은 더 위험하다. 장기차입금은 채무자가 이자만 계속 지급하면 상황이 아무리 암울해도 조기상환을 요구할 수 없고 대부분 장기 회사채 형태를 띤다. 추가 수입을 원하는 투자자들은 대개 배당이 없는 주식보다 배당을 지급하는 주식을 좋아하고 배당 수입은 항상 도움이 된다. 다만 진정한 쟁점은 배당이 회사의 가치와 주가에 장기적으로 어떤 영향을 미치느냐다. 시장폭락 시 고배당주는 무배당주보다 선방한다. 특히 YOC가 좋아지며 특히 장기간 배당을 지급하고 증가시킨 우량주는 위기가 닥치면 사람들이 몰려드는 종목이 된다. 배당을 지급하지 않는 소기업은 사업 확장에 돈을 투입하여 훨씬 빨리 성장한다. 배당을 바라보고 주식을 매입할 생각이라면 경기침체와 난관을 맞이해도 배당을 지급할 회사인지 확인하라. 장부가치를 보고 주식을 매입한다면 그 자산의 실제 가치가 무엇인지 자세히 파악하고 있어야 한다. 장부가치는 실제 가치보다 부풀려지는 경우도 많지만 반대로 축소되는 경우도 많고 이 경우 엄청난 자산주를 손에 넣을 수 있다. 토지, 목재, 석유, 귀금속 등 자연자원, 부동산, 브랜드 가치, 특허의약품, 독점영업권, 석유 재고, 모기업의 자회사의 숨은 자산, 다른 회사의 주식을 보유한 경우, 조세 감면도 회생기업에게는 값진 자산이 된다. 현금 흐름은 사업의 결과로 회사가 벌어들이는 돈의 규모를 말한다. 돈을 벌기 위해서 돈을 덜 써도 되는, 자본적 지출에 매달리지 않아도 되는 회사는 돈 벌기 쉬운 회사이다. 현금 흐름 수치에 얽매일 필요는 없지만 참고한다면 그 수치가 정상적인 자본적 지출을 차감한 뒤 남는 잉여 현금 흐름인지 확인하라. 이익은 보통 수준이지만 잉여 현금 흐름 때문에 투자가치가 뛰어난 종목도 종종 눈에 띈다. 자산주에 몰두하는 투자자는 회사가 평범해서 변화가 없고 현금 흐름이 많으며 소유주가 사업 확장 생각이 없는 회사를 찾아라. 제조 업체나 소매 업체 모두에게 재고 증가는 대개 나쁜 신호이며 재고가 매출보다 빠르게 증가한다면, 이것은 위험 신호다. 재고 파악 시 흔히 사용하는 회계방법 두 가지를 간단히 들자면 후입선출법(LIFO)과 선입선출법(FIFO)을 꼽을 수 있다. 올해와 작년을 기준으로 후입선출법이나 선입선출법의 가치를 비교해서 재고 규모의 증감 여부를 판단할 수 있다. 자동차회사의 재고 증가는 크게 걱정하지 않아도 되지만 유행이 지난 의류는 큰 폭으로 가격을 인하하여도 팔리지 않는다. 침체를 겪던 회사에서 재고가 감소하기 시작하면 이는 상황이 호전되었다는 첫 번째 증거다. 회사가 직원들에게 주식 매입 선택권과 연금 혜택을 제공하고 있고 투자자들은 이러한 혜택의 영향을 검토할 필요가 있다. 성장을 확장과 동일시하는 관점은 월가가 범하는 가장 흔한 착각이다. 고객을 잃지 않으면서도 매년 가격을 올릴 수 있는 회사를 발견했다면, 이 회사는 기막힌 투자 대상이다. 고성장주의 경우 빠른 이익 증가가 주가를 빠르게 끌어올릴 수 있다는 사실을 분명히 이해해야 한다. 간단히 말해서 장기적으로 20% 성장기업이 시장에서 엄청난 이익을 올리는 비결이고 대박종목의 열쇠이다. 요점이란 손익계산서 끝에 나오는 최종 숫자인 세후이익이다. 세전이익률은 천차만별이므로 같은 업종에 속한 기업들을 비교해야 도움이 되고 이익률이 가장 높은 회사는 당연히 운영 비용이 가장 낮을 것이고 사업 환경이 악화되어도 생존할 가능성이 높아진다. 사업 환경이 개선되어 실적이 향상되면, 세전이익률이 가장 낮은 기업이 가장 큰 혜택을 볼 수 있다. 파산 직전까지 몰린 침체 기업이 경기가 회복되면 대박을 내기도 하고 이러한 현상은 자동차, 화학, 제지, 항공, 철강, 전자, 비철금속 업종에서 되풀이되고 있다. 따라서 우리는 시장이 좋을 때나 나쁠 때나 장기간 보유할 주식으로는 비교적 이익률이 높은 종목을, 그리고 성공적인 회생주 중에서는 비교적 이익률이 낮은 종목을 발굴해야 한다. [구조화] [후대 해석] 이 장은 핵심 지표를 유형별로 고르게 하며, 프로세스 단계로는 숫자 확인에 직접 해당한다. [실전 적용] [현대 적용] 종목별 핵심 지표를 공통 6개 , 유형별 4개 로 나눠서 본다. 공통은 이익, 부채, 현금, 재고, 밸류에이션, 자본배분이다. [오해 방지] [후대 해석] 숫자를 많이 본다고 분석이 깊어지는 것은 아니다."},{"i":18,"title":"14. 스토리를 재확인하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>몇 달에 한 번 정도는 분기보고서나 직접 이익이 예상대로 유지되고 있는지 조사해 보는 방법 등을 통해 회사의 스토리를 다시 확인해야 한다.<\/li>\n<li>특히 고성장주인 회사라면 어떤 전략으로 성장을 지속할 것인지에 대해서도 계속해서 질문을 던져야 한다.<\/li>\n<li>투자자는 주식을 주기적으로 점검하면서 회사가 이 생애 주기에 따라 다음 단계로 넘어가고 있는지 판단해야 한다.<\/li>\n<li>회사의 성장이 한계에 다다른 단계가 되면, 투자자는 이 회사가 어떤 새로운 계획을 갖고 있는지, 현실적으로 성공할 가능성이 있는지 생각해 보아야 한다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 보유 중 가설 점검을 담당하며, 프로세스 단계로는 보유 중 스토리 재확인에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 분기마다 <code>원래 산 이유<\/code>, <code>새로 좋아진 점<\/code>, <code>깨진 가설<\/code>, <code>다음 분기 확인 포인트<\/code>를 업데이트한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 스토리 점검 없는 장기보유는 린치식이 아니다.<\/li>\n<\/ul>","text":"기존 노트 몇 달에 한 번 정도는 분기보고서나 직접 이익이 예상대로 유지되고 있는지 조사해 보는 방법 등을 통해 회사의 스토리를 다시 확인해야 한다. 특히 고성장주인 회사라면 어떤 전략으로 성장을 지속할 것인지에 대해서도 계속해서 질문을 던져야 한다. 투자자는 주식을 주기적으로 점검하면서 회사가 이 생애 주기에 따라 다음 단계로 넘어가고 있는지 판단해야 한다. 회사의 성장이 한계에 다다른 단계가 되면, 투자자는 이 회사가 어떤 새로운 계획을 갖고 있는지, 현실적으로 성공할 가능성이 있는지 생각해 보아야 한다. [구조화] [후대 해석] 이 장은 보유 중 가설 점검을 담당하며, 프로세스 단계로는 보유 중 스토리 재확인에 해당한다. [실전 적용] [현대 적용] 분기마다 원래 산 이유 , 새로 좋아진 점 , 깨진 가설 , 다음 분기 확인 포인트 를 업데이트한다. [오해 방지] [후대 해석] 스토리 점검 없는 장기보유는 린치식이 아니다."},{"i":19,"title":"15. 최종 점검 목록","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>회사에 대해 많이 알면 알수록 좋지만, 학자들처럼 연차보고서를 꼼꼼하게 분석할 필요도 없고 일부 유명한 숫자는 특정 유형의 주식에만 적용되므로 무시해도 좋다.<\/li>\n<li>주식 전반<ul>\n<li>같은 업종의 비슷한 회사에 비해 이 회사의 PER이 높은가 아니면 낮은가?<\/li>\n<li>기관투자자의 보유 비중은 낮을수록 좋다.<\/li>\n<li>내부자들이 주식을 매입하고 있고 회사가 자사주를 매입한다면 둘 다 긍정적인 신호다.<\/li>\n<li>지금까지 이익 성장 실적은 어떠한가? 이익은 단발성인가, 지속성인가? (자산주는 유일하게 이익이 중요하지 않음)<\/li>\n<li>회사의 대차대조표가 건전한가, 아니면 취약한가? 재무 건전성 등급은 어떠한가?<\/li>\n<li>현금 보유량은 어떠한가?<\/li>\n<\/ul>\n<\/li>\n<li>저성장주<ul>\n<li>저성장주는 배당이 중요하므로 배당이 항상 지급되었는지, 꾸준하게 증가했는지 확인하라.<\/li>\n<li>가급적이면 배당이 이익에서 차지하는 비중도 확인해야 위기 시 이익이 줄어도 배당을 지급한 돈이 되기 때문이다.<\/li>\n<\/ul>\n<\/li>\n<li>대형우량주<ul>\n<li>좀처럼 망하는 일이 없는 대기업은 주가수익비율을 보면 현재 주가가 싼 것인지 비싼 것인지 판단할 수 있다.<\/li>\n<li>사업다악화로 장차 이익이 감소될 가능성이 있는지 확인하라.<\/li>\n<li>회사의 장기 성장률을 확인하고, 최근 몇 년 동안 동일한 탄력을 유지하고 있는지도 점검하라.<\/li>\n<li>이 주식을 영원히 보유할 계획이라면, 이전 침체기와 시장 폭락 시 실적이 어떠했는지 확인하라.<\/li>\n<\/ul>\n<\/li>\n<li>경기순환주<ul>\n<li>재고를 계속 자세히 지켜보고, 수요 공급 관계도 살펴보고 시장에 새로 진입하는 기업이 있는지 살피고 이는 대개 위험 신호다.<\/li>\n<li>경기가 회복되면 점차 PER이 내려갈 것을 예상하고 투자자들이 경기가 막바지에 이르렀다고 내다볼 때, 회사의 이익은 최대치에 이른다.<\/li>\n<li>투자한 경기순환주를 잘 알면 경기순환을 파악하는 데 유리하다.<\/li>\n<li>자동차 업종은 심각한 침체기를 겪을수록 그만큼 강력하게 회복되고 일시적인 부진은 더 길고 강력한 호황기가 이어진다.<\/li>\n<\/ul>\n<\/li>\n<li>고성장주<ul>\n<li>유망한 제품이 그 회사의 사업에서 차지하는 비중이 높은지 확인하라.<\/li>\n<li>최근 몇 년 동안 이익성장률이 얼마였는가? (20~25%를 선호하고 25%가 넘는 기업을 경계하라.)<\/li>\n<li>회사가 확장 능력을 입증하려면, 2개 이상의 도시에서 자사의 성공 공식을 복제하여 문을 연 매장을 성공적으로 운영할 수 있어야 한다.<\/li>\n<li>회사가 성장할 여지가 있어야 한다. (매장 확장 등)<\/li>\n<li>기관투자자나 분석가가 이 회사의 주식을 보유한 경우가 아직 소수에 불과하면 투자자에게 큰 이점이다.<\/li>\n<\/ul>\n<\/li>\n<li>회생주<ul>\n<li>회사가 보유한 현금과 부채를 분석해 채권자들이 자금을 회수해도 회사가 생존할 수 있는지가 가장 중요하다.<\/li>\n<li>부채구조는 어떠하고 문제를 해결하는 동안 얼마나 오랫동안 적자영업을 버텨낼 수 있는가?<\/li>\n<li>이미 파산했다면, 주주들에게 남은 몫은 얼마인가?<\/li>\n<li>회사가 어떤 방법으로 회생할 계획이고 무수익 사업을 처분했는가?<\/li>\n<li>이 사업이 회복되고 있는가?<\/li>\n<li>원가가 절감되고 있는가? 그렇다면 그 효과는 어떤가?<\/li>\n<\/ul>\n<\/li>\n<li>자산주<ul>\n<li>자산의 가치가 얼마인가? 숨은 자산이 있는가?<\/li>\n<li>자산에서 차감해야 하는 부채가 얼마인가? (채권자에게 우선권이 있음)<\/li>\n<li>회사가 새로 부채를 발생시켜 자산의 가치를 떨어뜨렸는가?<\/li>\n<li>주주들이 자산으로부터 이익을 취하는 데 도움이 되는 기업사냥꾼이 대기하고 있는가?<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 매수 직전의 go/no-go 판단을 담당하며, 프로세스 단계로는 최종 점검에 직접 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 매수 버튼 직전 체크리스트를 공통 문항과 유형별 문항으로 분리해 최소 1회 자가검토한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 체크리스트 통과가 곧 수익을 보장하지는 않는다.<\/li>\n<\/ul>","text":"기존 노트 회사에 대해 많이 알면 알수록 좋지만, 학자들처럼 연차보고서를 꼼꼼하게 분석할 필요도 없고 일부 유명한 숫자는 특정 유형의 주식에만 적용되므로 무시해도 좋다. 주식 전반 같은 업종의 비슷한 회사에 비해 이 회사의 PER이 높은가 아니면 낮은가? 기관투자자의 보유 비중은 낮을수록 좋다. 내부자들이 주식을 매입하고 있고 회사가 자사주를 매입한다면 둘 다 긍정적인 신호다. 지금까지 이익 성장 실적은 어떠한가? 이익은 단발성인가, 지속성인가? (자산주는 유일하게 이익이 중요하지 않음) 회사의 대차대조표가 건전한가, 아니면 취약한가? 재무 건전성 등급은 어떠한가? 현금 보유량은 어떠한가? 저성장주 저성장주는 배당이 중요하므로 배당이 항상 지급되었는지, 꾸준하게 증가했는지 확인하라. 가급적이면 배당이 이익에서 차지하는 비중도 확인해야 위기 시 이익이 줄어도 배당을 지급한 돈이 되기 때문이다. 대형우량주 좀처럼 망하는 일이 없는 대기업은 주가수익비율을 보면 현재 주가가 싼 것인지 비싼 것인지 판단할 수 있다. 사업다악화로 장차 이익이 감소될 가능성이 있는지 확인하라. 회사의 장기 성장률을 확인하고, 최근 몇 년 동안 동일한 탄력을 유지하고 있는지도 점검하라. 이 주식을 영원히 보유할 계획이라면, 이전 침체기와 시장 폭락 시 실적이 어떠했는지 확인하라. 경기순환주 재고를 계속 자세히 지켜보고, 수요 공급 관계도 살펴보고 시장에 새로 진입하는 기업이 있는지 살피고 이는 대개 위험 신호다. 경기가 회복되면 점차 PER이 내려갈 것을 예상하고 투자자들이 경기가 막바지에 이르렀다고 내다볼 때, 회사의 이익은 최대치에 이른다. 투자한 경기순환주를 잘 알면 경기순환을 파악하는 데 유리하다. 자동차 업종은 심각한 침체기를 겪을수록 그만큼 강력하게 회복되고 일시적인 부진은 더 길고 강력한 호황기가 이어진다. 고성장주 유망한 제품이 그 회사의 사업에서 차지하는 비중이 높은지 확인하라. 최근 몇 년 동안 이익성장률이 얼마였는가? (20~25%를 선호하고 25%가 넘는 기업을 경계하라.) 회사가 확장 능력을 입증하려면, 2개 이상의 도시에서 자사의 성공 공식을 복제하여 문을 연 매장을 성공적으로 운영할 수 있어야 한다. 회사가 성장할 여지가 있어야 한다. (매장 확장 등) 기관투자자나 분석가가 이 회사의 주식을 보유한 경우가 아직 소수에 불과하면 투자자에게 큰 이점이다. 회생주 회사가 보유한 현금과 부채를 분석해 채권자들이 자금을 회수해도 회사가 생존할 수 있는지가 가장 중요하다. 부채구조는 어떠하고 문제를 해결하는 동안 얼마나 오랫동안 적자영업을 버텨낼 수 있는가? 이미 파산했다면, 주주들에게 남은 몫은 얼마인가? 회사가 어떤 방법으로 회생할 계획이고 무수익 사업을 처분했는가? 이 사업이 회복되고 있는가? 원가가 절감되고 있는가? 그렇다면 그 효과는 어떤가? 자산주 자산의 가치가 얼마인가? 숨은 자산이 있는가? 자산에서 차감해야 하는 부채가 얼마인가? (채권자에게 우선권이 있음) 회사가 새로 부채를 발생시켜 자산의 가치를 떨어뜨렸는가? 주주들이 자산으로부터 이익을 취하는 데 도움이 되는 기업사냥꾼이 대기하고 있는가? [구조화] [후대 해석] 이 장은 매수 직전의 go/no-go 판단을 담당하며, 프로세스 단계로는 최종 점검에 직접 해당한다. [실전 적용] [현대 적용] 매수 버튼 직전 체크리스트를 공통 문항과 유형별 문항으로 분리해 최소 1회 자가검토한다. [오해 방지] [후대 해석] 체크리스트 통과가 곧 수익을 보장하지는 않는다."},{"i":20,"title":"2부 요약","html":"<ul>\n<li>투자하는 주식의 속성과 구체적인 투자 이유를 파악하라.<\/li>\n<li>주식의 유형을 분류하면 투자를 통해 어떤 결과를 기대할 수 있는지 알 수 있다.<\/li>\n<li>대기업은 주가의 움직임이 작고, 소기업은 주가의 움직임이 크다.<\/li>\n<li>특정 제품에서 이익을 기대한다면 회사의 규모를 고려하라.<\/li>\n<li>이미 이익을 내고 있는 기업이라면 사업 개념의 복제능력을 입증한 소기업을 찾아라.<\/li>\n<li>연성장률이 50~60퍼센트인 기업은 경계하라.<\/li>\n<li>인기 업종의 인기 종목을 피하라.<\/li>\n<li>사업다각화를 믿지 말라, 대개 사업다악화로 귀결된다.<\/li>\n<li>무모한 도박은 결코 보상받지 못한다.<\/li>\n<li>첫 번째 상승 국면을 놓치더라도 회사의 계획이 효과가 있는지 좀 더 지켜보는 편이 낫다.<\/li>\n<li>전문가들이 몇 달이나 몇 년 간 접근하지 않은 분야에서 상당히 값진 기본 정보를 얻을 수 있다.<\/li>\n<li>정보 제공자가 아무리 똑똑하고, 부유하며, 그가 전한 최신 정보가 정확한 것이었다고 하더라도 그의 정보를 그대로 믿어서는 안 된다.<\/li>\n<li>고리타분하고 평범해 보이며 월가가 아직 관심을 보이지 않는 단순한 회사에 투자하라.<\/li>\n<li>비성장 업종에서 적당한 속도(20~25%)로 성장하는 회사가 이상적인 투자대상이다.<\/li>\n<li>틈새를 확보한 회사를 찾아라.<\/li>\n<li>곤경에 빠진 회사의 침체된 주식을 매입하는 경우, 재무 상태가 건전한 회사를 고르고 은행부채가 많은 회사는 피하라.<\/li>\n<li>부채가 없는 회사는 망하지 않는다.<\/li>\n<li>경영능력이 중요할지는 몰라도, 파악하기가 아주 힘들다. 사장의 경력이나 말솜씨가 아니라 회사의 전망을 보고 주식을 매입하라.<\/li>\n<li>곤경에 빠진 회사가 회생하면 많은 돈을 벌 수 있다.<\/li>\n<li>PER을 세심하게 분석하라. 주가가 지나치게 과대평가되어 있다면, 만사가 잘 풀려나가도 한 푼도 벌지 못한다.<\/li>\n<li>회사의 스토리를 바탕으로 회사의 발전을 점검하라.<\/li>\n<li>계속해서 자사주를 매입하는 회사를 찾아라.<\/li>\n<li>회사의 과거 배당실적을 조사하고, 과거 침체기에 이익이 어떠했는지 확인하라.<\/li>\n<li>기관투자자의 보유량이 적거나 없는 회사를 찾아라.<\/li>\n<li>다른 조건이 동일하다면, 월급만 받는 경영진이 운영하는 회사보다 지분을 많이 보유한 경영진이 운영하는 회사가 낫다.<\/li>\n<li>내부자가 주식을 매입한다면 좋은 신호다. 특히 여러 명의 내부자가 동시에 매입하였다면 더욱 좋은 신호다.<\/li>\n<li>주식 연구에 적어도 매주 한 시간을 투자하라. 자신의 배당과 투자손익은 계산해 봐야 연구에 도움이 되지 않는다.<\/li>\n<li>인내심을 가져라. 서두른다고 주가가 오르는 것은 아니다.<\/li>\n<li>장부가치만 보고 주식을 매입하는 것은 위험한 착각이다. 실제 가치가 중요하다.<\/li>\n<li>의심스러우면 투자를 연기하라.<\/li>\n<li>새 종목을 고를 때 적어도 새 냉장고를 고르는 만큼의 시간과 노력을 기울여야 한다.<\/li>\n<\/ul>","text":"투자하는 주식의 속성과 구체적인 투자 이유를 파악하라. 주식의 유형을 분류하면 투자를 통해 어떤 결과를 기대할 수 있는지 알 수 있다. 대기업은 주가의 움직임이 작고, 소기업은 주가의 움직임이 크다. 특정 제품에서 이익을 기대한다면 회사의 규모를 고려하라. 이미 이익을 내고 있는 기업이라면 사업 개념의 복제능력을 입증한 소기업을 찾아라. 연성장률이 50~60퍼센트인 기업은 경계하라. 인기 업종의 인기 종목을 피하라. 사업다각화를 믿지 말라, 대개 사업다악화로 귀결된다. 무모한 도박은 결코 보상받지 못한다. 첫 번째 상승 국면을 놓치더라도 회사의 계획이 효과가 있는지 좀 더 지켜보는 편이 낫다. 전문가들이 몇 달이나 몇 년 간 접근하지 않은 분야에서 상당히 값진 기본 정보를 얻을 수 있다. 정보 제공자가 아무리 똑똑하고, 부유하며, 그가 전한 최신 정보가 정확한 것이었다고 하더라도 그의 정보를 그대로 믿어서는 안 된다. 고리타분하고 평범해 보이며 월가가 아직 관심을 보이지 않는 단순한 회사에 투자하라. 비성장 업종에서 적당한 속도(20~25%)로 성장하는 회사가 이상적인 투자대상이다. 틈새를 확보한 회사를 찾아라. 곤경에 빠진 회사의 침체된 주식을 매입하는 경우, 재무 상태가 건전한 회사를 고르고 은행부채가 많은 회사는 피하라. 부채가 없는 회사는 망하지 않는다. 경영능력이 중요할지는 몰라도, 파악하기가 아주 힘들다. 사장의 경력이나 말솜씨가 아니라 회사의 전망을 보고 주식을 매입하라. 곤경에 빠진 회사가 회생하면 많은 돈을 벌 수 있다. PER을 세심하게 분석하라. 주가가 지나치게 과대평가되어 있다면, 만사가 잘 풀려나가도 한 푼도 벌지 못한다. 회사의 스토리를 바탕으로 회사의 발전을 점검하라. 계속해서 자사주를 매입하는 회사를 찾아라. 회사의 과거 배당실적을 조사하고, 과거 침체기에 이익이 어떠했는지 확인하라. 기관투자자의 보유량이 적거나 없는 회사를 찾아라. 다른 조건이 동일하다면, 월급만 받는 경영진이 운영하는 회사보다 지분을 많이 보유한 경영진이 운영하는 회사가 낫다. 내부자가 주식을 매입한다면 좋은 신호다. 특히 여러 명의 내부자가 동시에 매입하였다면 더욱 좋은 신호다. 주식 연구에 적어도 매주 한 시간을 투자하라. 자신의 배당과 투자손익은 계산해 봐야 연구에 도움이 되지 않는다. 인내심을 가져라. 서두른다고 주가가 오르는 것은 아니다. 장부가치만 보고 주식을 매입하는 것은 위험한 착각이다. 실제 가치가 중요하다. 의심스러우면 투자를 연기하라. 새 종목을 고를 때 적어도 새 냉장고를 고르는 만큼의 시간과 노력을 기울여야 한다."},{"i":21,"title":"16. 포트폴리오 설계","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>높은 기대가 더 우려스러운 것은 현실성 없는 수익을 추구하면서 불필요한 위험을 떠안을지도 모른다는 사실 때문이다.<\/li>\n<li>장기적인 이익의 극대화는 시장이 좋을 때나 나쁠 때나 일정한 전략을 고수하는 경우에만 가능하다.<\/li>\n<li>주식 투자에서 일반적으로 기대할 수 있는 장기 수익률은 S&amp;P500 인덱스펀드의 영향으로 9~10%다.<\/li>\n<li>직접 종목을 선택한 보람이 있으려면 모든 비용과 수수료를 차감하고 복리로 연 12~15% 정도의 수익을 올릴 수 있어야 한다.<\/li>\n<li>주식을 장기적으로 보유하는 투자자는 단기적으로 사고 팔기를 반복하는 투자자보다 훨씬 높은 실적을 보인다.<\/li>\n<li>거래비용이 저렴해졌지만 소액 투자자가 주식을 사거나 팔려면 여전히 1~2% 정도의 비용이 든다.<\/li>\n<li>소액 투자자가 포트폴리오를 연 1회 회전시킨다면, 무려 4%를 수수료로 잃어버리는 셈이 된다.<\/li>\n<li>거래를 많이 할수록 인덱스펀드를 앞서기가 더 힘들어진다는 것도 고려해야 한다.<\/li>\n<li>종목의 수에 얽매이지 말고 종목의 내용을 사례별로 조사하라.<\/li>\n<li>투자자가 특정 분야에 강점이 있고, 모든 조사 기준을 충족하는 흥미로운 전망을 발견했다고 판단한다면, 해당되는 종목을 모두 보유하는 것이 최선이다.<\/li>\n<li>어리석은 분산 투자는 소액 투자자들을 괴롭힌다. 하지만 단 한 종목만 보유하는 것은 여전히 리스크가 크다.<\/li>\n<li>소규모 포트폴리오라면 3~10개 정도의 종목을 보유하면 마음이 편할 것 같다.<\/li>\n<li>텐배거에 도전한다면 보유 종목이 많을수록 텐배거 확률이 높아지고 뜻밖의 종목에서 대박종목이 나올 수도 있다.<\/li>\n<li>뜻밖의 호재가 어느 종목에서 터질 것인지 정확히 예측할 수 있는 방법이 없기 때문에 보유 종목이 많으면 호재를 잡을 가능성도 높아진다.<\/li>\n<li>보유 종목이 늘어날수록 종목별 자금배분의 유연성이 높아진다.<\/li>\n<li>자금을 여러 유형의 주식으로 분산하는 것도 손실 위험을 축소하는 방법이다.<\/li>\n<li>위험과 보상을 손쉽게 계량화할 방법은 없지만 포트폴리오 설계 시 대형우량주를 몇 개 포함시키면, 고성장주와 회생주 몇 종목을 안고 있는 동안의 불안감을 한시름 덜 수 있다.<\/li>\n<li>다시 말하지만 여기에서 핵심은 종목을 제대로 알고 매입하라는 것이다.<\/li>\n<li>포트폴리오 설계는 투자자의 나이에 따라 달라져야 한다.<\/li>\n<li>끊임없이 주식과 스토리를 점검하면서 상황 변화에 따라 포트폴리오 종목을 조정하지만 일부 현금 보유량 외에는 주식을 팔아 현금으로 보유하지 않는다.<\/li>\n<li>주식을 현금화한다는 것은 시장에서 빠져나간다는 것을 의미하고 상황에 따라 종목을 교체하되 시장에서 빠져나가지 마라.<\/li>\n<li>시장의 변동에 기계적으로 반응하며 오르는 주식은 팔고, 내리는 주식은 보유하는 전략은 꽃을 뽑아내고 잡초에 물을 주는 것이다.<\/li>\n<li>반대로 내리는 주식을 팔고 오르는 주식을 보유하는 대응 역시 크게 나을 것은 없고 기계적으로 반응하는 전략은 모두 실패한다.<\/li>\n<li>현재의 주가는 회사의 전망을 전혀 반영하지 못할 뿐 아니라, 오히려 회사의 기본과 반대 방향으로 움직이기도 한다.<\/li>\n<li>기계적인 반응보다 더 나은 전략은 회사의 스토리를 기본으로 주가 움직임에 따라 주식을 매입하거나 매도하는 방법이다.<\/li>\n<li>적절한 수익을 얻으면서 대형우량주를 몇 차례 반복하여 교체 매매하면 대박 종목 하나만큼 실적을 올릴 수 있다.<\/li>\n<li>고성장주의 이익이 계속 증가하고, 확장이 지속적으로 이루어지고 있으며, 이렇다 할 장애 요소가 보이지 않으면 계속 보유한다.<\/li>\n<li>다만 몇 달 간격으로 마치 처음 이 회사를 만난 사람처럼 스토리를 전반적으로 다시 점검한다.<\/li>\n<li>경기순환주와 회생주도 마찬가지로 기본이 나빠지고 가격이 오른 종목에서 빠져나와 기본이 좋아지고 가격이 내려간 종목을 선택해야 한다.<\/li>\n<li>좋은 주식의 가격이 내렸다면 내린 가격에 매도를 한 사람에게는 비극이고 주가 하락은 유망하지만 실적이 부진한 종목들을 싸게 살 수 있는 기회다.<\/li>\n<li>\"25% 손해 보면 팔겠다\"라는 치명적인 생각을 버리지 못하거나 25% 손해 봐도 사겠다고 확신하지 못한다면 주식에서 절대로 큰돈을 벌 수 없다.<\/li>\n<li>손실 제한 주문에 의지해서 하락위험을 방지할 방법도 없고, 주가상승에 대해 인위적인 목표가를 설정할 방법도 없다.<\/li>\n<li>원래의 스토리가 의미를 유지하는 한, 기다리면서 상황을 지켜보라. 몇 년 뒤에는 놀랄 만한 실적을 거둘 것이다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 비중, 종목 수, 회전율, 유형 분산을 설계하며, 프로세스 단계로는 포트폴리오 관리에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 핵심 보유군, 관찰 보유군, 실험 보유군으로 나누고 유형별 비중 상한을 정한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 종목 수가 많다고 자동으로 안전해지는 것은 아니다.<\/li>\n<\/ul>","text":"기존 노트 높은 기대가 더 우려스러운 것은 현실성 없는 수익을 추구하면서 불필요한 위험을 떠안을지도 모른다는 사실 때문이다. 장기적인 이익의 극대화는 시장이 좋을 때나 나쁠 때나 일정한 전략을 고수하는 경우에만 가능하다. 주식 투자에서 일반적으로 기대할 수 있는 장기 수익률은 S&amp;P500 인덱스펀드의 영향으로 9~10%다. 직접 종목을 선택한 보람이 있으려면 모든 비용과 수수료를 차감하고 복리로 연 12~15% 정도의 수익을 올릴 수 있어야 한다. 주식을 장기적으로 보유하는 투자자는 단기적으로 사고 팔기를 반복하는 투자자보다 훨씬 높은 실적을 보인다. 거래비용이 저렴해졌지만 소액 투자자가 주식을 사거나 팔려면 여전히 1~2% 정도의 비용이 든다. 소액 투자자가 포트폴리오를 연 1회 회전시킨다면, 무려 4%를 수수료로 잃어버리는 셈이 된다. 거래를 많이 할수록 인덱스펀드를 앞서기가 더 힘들어진다는 것도 고려해야 한다. 종목의 수에 얽매이지 말고 종목의 내용을 사례별로 조사하라. 투자자가 특정 분야에 강점이 있고, 모든 조사 기준을 충족하는 흥미로운 전망을 발견했다고 판단한다면, 해당되는 종목을 모두 보유하는 것이 최선이다. 어리석은 분산 투자는 소액 투자자들을 괴롭힌다. 하지만 단 한 종목만 보유하는 것은 여전히 리스크가 크다. 소규모 포트폴리오라면 3~10개 정도의 종목을 보유하면 마음이 편할 것 같다. 텐배거에 도전한다면 보유 종목이 많을수록 텐배거 확률이 높아지고 뜻밖의 종목에서 대박종목이 나올 수도 있다. 뜻밖의 호재가 어느 종목에서 터질 것인지 정확히 예측할 수 있는 방법이 없기 때문에 보유 종목이 많으면 호재를 잡을 가능성도 높아진다. 보유 종목이 늘어날수록 종목별 자금배분의 유연성이 높아진다. 자금을 여러 유형의 주식으로 분산하는 것도 손실 위험을 축소하는 방법이다. 위험과 보상을 손쉽게 계량화할 방법은 없지만 포트폴리오 설계 시 대형우량주를 몇 개 포함시키면, 고성장주와 회생주 몇 종목을 안고 있는 동안의 불안감을 한시름 덜 수 있다. 다시 말하지만 여기에서 핵심은 종목을 제대로 알고 매입하라는 것이다. 포트폴리오 설계는 투자자의 나이에 따라 달라져야 한다. 끊임없이 주식과 스토리를 점검하면서 상황 변화에 따라 포트폴리오 종목을 조정하지만 일부 현금 보유량 외에는 주식을 팔아 현금으로 보유하지 않는다. 주식을 현금화한다는 것은 시장에서 빠져나간다는 것을 의미하고 상황에 따라 종목을 교체하되 시장에서 빠져나가지 마라. 시장의 변동에 기계적으로 반응하며 오르는 주식은 팔고, 내리는 주식은 보유하는 전략은 꽃을 뽑아내고 잡초에 물을 주는 것이다. 반대로 내리는 주식을 팔고 오르는 주식을 보유하는 대응 역시 크게 나을 것은 없고 기계적으로 반응하는 전략은 모두 실패한다. 현재의 주가는 회사의 전망을 전혀 반영하지 못할 뿐 아니라, 오히려 회사의 기본과 반대 방향으로 움직이기도 한다. 기계적인 반응보다 더 나은 전략은 회사의 스토리를 기본으로 주가 움직임에 따라 주식을 매입하거나 매도하는 방법이다. 적절한 수익을 얻으면서 대형우량주를 몇 차례 반복하여 교체 매매하면 대박 종목 하나만큼 실적을 올릴 수 있다. 고성장주의 이익이 계속 증가하고, 확장이 지속적으로 이루어지고 있으며, 이렇다 할 장애 요소가 보이지 않으면 계속 보유한다. 다만 몇 달 간격으로 마치 처음 이 회사를 만난 사람처럼 스토리를 전반적으로 다시 점검한다. 경기순환주와 회생주도 마찬가지로 기본이 나빠지고 가격이 오른 종목에서 빠져나와 기본이 좋아지고 가격이 내려간 종목을 선택해야 한다. 좋은 주식의 가격이 내렸다면 내린 가격에 매도를 한 사람에게는 비극이고 주가 하락은 유망하지만 실적이 부진한 종목들을 싸게 살 수 있는 기회다. \"25% 손해 보면 팔겠다\"라는 치명적인 생각을 버리지 못하거나 25% 손해 봐도 사겠다고 확신하지 못한다면 주식에서 절대로 큰돈을 벌 수 없다. 손실 제한 주문에 의지해서 하락위험을 방지할 방법도 없고, 주가상승에 대해 인위적인 목표가를 설정할 방법도 없다. 원래의 스토리가 의미를 유지하는 한, 기다리면서 상황을 지켜보라. 몇 년 뒤에는 놀랄 만한 실적을 거둘 것이다. [구조화] [후대 해석] 이 장은 비중, 종목 수, 회전율, 유형 분산을 설계하며, 프로세스 단계로는 포트폴리오 관리에 해당한다. [실전 적용] [현대 적용] 핵심 보유군, 관찰 보유군, 실험 보유군으로 나누고 유형별 비중 상한을 정한다. [오해 방지] [후대 해석] 종목 수가 많다고 자동으로 안전해지는 것은 아니다."},{"i":22,"title":"17. 매매의 최적 시점","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>주식 매입의 최적 시점은 백화점에서 물건을 살 때처럼 좋은 물건이 좋은 가격에 나왔다는 확신이 드는 날이다.<\/li>\n<li>첫 번째는 연말 절세 매각기간인 10~12월 사이로, 개인들이 현금도 필요하고 Tax-Loss Harvesting 등의 이유로 주가가 하락할 수도 있다.<\/li>\n<li>기관투자자들도 다가오는 평가에 대비해 포트폴리오를 정리하면서 손해 본 종목들을 연말에 던져버린다.<\/li>\n<li>이렇게 매도가 또 다른 매도를 부추기는 사이, 정말로 좋은 종목들조차 터무니없는 수준으로 주가가 떨어지게 된다.<\/li>\n<li>두 번째는 몇 년마다 주식시장에 발생하는 붕괴, 폭락, 거품 붕괴, 일시적 하락, 대폭락 기간이다.<\/li>\n<li>이 기간 중 매도의 본능을 억누르고 용기를 발휘하여 이 두려운 상황에서 주식을 매입한다면 다시는 보기 힘든 기막힌 기회를 잡을 수 있을 것이다.<\/li>\n<li>때가 아닌데도 회의론자들이 매도를 외쳐대면, 아무리 사려 깊고 침착한 투자자들이라도 흔들리게 마련이다.<\/li>\n<li>이익은 기회가 있을 때 실현하고 손실 가능성을 감수하느니 확실한 이익을 보는 편이 항상 낫다.<\/li>\n<li>그러나 좋은 주식을 발굴해서 매입했고 모든 증거가 주가 상승을 지지하며 만사가 유리하게 진행되고 있는데도 그 시점에 매도는 부끄러운 일이다.<\/li>\n<li>내가 속을 위험이 있다고 느끼면 처음에 주식을 매입한 이유를 다시 떠올려라.<\/li>\n<li>진정한 매도 시점은 매수 시점을 생각하는 것과 똑같은 방법으로 매도 시점도 생각할 수 있다.<\/li>\n<li>저성장주 매도 시점<ul>\n<li>저성장주는 30~50% 상승하면 매도하고, 주가가 하락했더라도 기본이 악화되면 역시 매도한다.<\/li>\n<li>그 외에도 시장 점유율이 2년 연속 하락했고, 신제품 개발도 하지 않고, 연구개발비 지출도 삭감하고 더 이상 회사가 노력을 하지 않는 것으로 보일 때<\/li>\n<li>최근에 2개의 비관련 기업을 인수한 것은 사업다악화의 사례로 보이고 첨단기술 분야에서 추가로 인수 대상 기업을 물색 중이라고 발표할 때<\/li>\n<li>회사가 인수에 지나친 비용을 지출하여 대차대조표는 부채 없이 현금 비율이 높았던 상태에서 주가가 가파르게 하락하는데도 자사주를 매입할 잉여자금이 없을 때<\/li>\n<li>주가가 내려가도 배당수익률이 투자자들의 관심을 끌 만큼 높지 않다.<\/li>\n<\/ul>\n<\/li>\n<li>대형우량주 매도 시점<ul>\n<li>주가가 이익선 위로 올라가거나 주가수익비율이 정상적인 범위에서 크게 벗어나면 매도하고 기다렸다가 나중에 더 낮은 가격에 다시 매입하거나 다른 대형우량주를 매입하라.<\/li>\n<li>지난 2년 동안 도입된 신제품들의 실적이 엇갈리고 아직 시험 단계에 있는 다른 신제품들의 출시 시점이 늦을 때<\/li>\n<li>같은 업종의 비슷한 회사는 PER이 11~12인데 이 회사의 경우는 15이다.<\/li>\n<li>작년에 회사 주식을 매입한 임원이나 관리자가 한 사람도 없다.<\/li>\n<li>회사 이익의 25%를 차지하는 주요 사업부가 현재 진행 중인 경기침체에 취약하다.<\/li>\n<li>회사의 성장률이 하락하고, 지금은 원가 절감으로 이익을 유지하고 있고 더 이상 원가를 절감하기 어렵다.<\/li>\n<\/ul>\n<\/li>\n<li>경기순환주 매도 시점<ul>\n<li>매도하기 가장 좋은 시점은 경기 상승 순환이 끝나기 전이지만 누가 그 시점을 알겠는가?<\/li>\n<li>경기순환의 막바지 시점이 아니라면 매도의 최적 시점은 실제로 어떤 일이 잘못되기 시작할 때다.<\/li>\n<li>한 가지 분명한 매도 신호는 회사가 쌓여가는 재고를 처분하지 못하는 것이고 항상 재고 증가에 관심을 쏟아야 한다.<\/li>\n<li>상품 가격 하락 역시 매도 시점의 전조이고 선물가격이 현물가격보다 내려가는 것이다.<\/li>\n<li>기업 간의 경쟁은 가격 인하로 이익이 감소하여 경기순환주에 미치는 나쁜 신호다.<\/li>\n<li>노사의 임금과 복지혜택 요구, 제품에 대한 최종수요 감소, 비용 절감 없는 자본적 지출 예산 과다 확대, 원가절감 후에도 경쟁 심화 등<\/li>\n<\/ul>\n<\/li>\n<li>고성장주 매도 시점<ul>\n<li>핵심은 잠재적 텐배거 종목을 놓치지 않는 것이고 지켜 보아야 할 핵심 요소는 고속성장의 두 번째 단계가 언제 끝나는지 살펴보는 것이다.<\/li>\n<li>신규 매장 설립 중단, 기존 매장 노후화, 제품 선호도 하락 등은 매도를 고려해야 할 시점이다.<\/li>\n<li>월가 분석가 대다수가 이 주식을 최우선으로 추천하고 주식의 60%를 기관투자자들이 보유하고 있으며 기사의 내용이 회사의 칭찬으로 가득하다면 매도를 생각해야 할 시점이다.<\/li>\n<li>경기가 상승하면 PER이 낮아지는 경기순환주와 달리 고성장주는 대개 PER이 갈수록 터무니없고 비논리적인 수준까지 올라가기도 한다.<\/li>\n<li>지난 분기 동일 점포 매출 3% 감소, 신규매장 실적 기대 이하, 고위 임원과 핵심 직원 여럿이 경쟁회사로 이직<\/li>\n<li>다음 2년의 가장 낙관적인 EPS 성장 예측도 15~20%인데, 주식의 PER이 30에 거래되고 있다.<\/li>\n<\/ul>\n<\/li>\n<li>회생주 매도 시점<ul>\n<li>회생주 매도 최적의 시점은 회사가 회생한 다음이다.<\/li>\n<li>다섯 분기 연속으로 감소했던 부채가 지난 분기 보고서에 2,500만 달러 증가로 나왔다.<\/li>\n<li>재고가 매출보다 2배 빠른 속도로 증가하고 있다.<\/li>\n<li>이익 전망에 비해 PER이 부풀려졌다.<\/li>\n<li>회사의 핵심 사업부 제품의 50%를 단일 고객 기업 판매 중 이 고객 기업의 매출이 감소하고 있다.<\/li>\n<\/ul>\n<\/li>\n<li>자산주 매도 시점<ul>\n<li>회사에 정말로 숨은 자산이 있다면 기업사냥꾼을 기다리는 것이 가장 좋은 방법이다.<\/li>\n<li>회사가 흥청거리는 빚잔치를 하느라 자산가치가 줄어들지 않는 한, 자산주는 계속 보유해야 한다.<\/li>\n<li>주식이 실제 시장가치보다 10% 할인되어 거래되는데도 경영진은 사업다각화 자금을 조달하기 위해 주식의 10%를 발행한다고 발표한다.<\/li>\n<li>2,000만 달러에 팔린다고 기대했던 사업부가 실제로는 1,200만 달러에 팔린다.<\/li>\n<li>법인세율이 인하되어 회사의 이월 결손금 가치가 크게 하락한다.<\/li>\n<li>5년 전에 25%였던 기관투자자 보유 비중이 지금은 60%로 높아졌다.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 <code>언제 살지<\/code>와 <code>언제 팔지<\/code>를 스토리와 가격의 결합으로 판단하게 하며, 프로세스 단계로는 매수 집행과 유형별 매도에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 매수는 <code>가격이 내렸다<\/code>가 아니라 <code>스토리는 유지되는데 가격이 더 좋아졌다<\/code>일 때만 한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 주가가 빠졌다는 사실만으로 싸다고 볼 수 없다.<\/li>\n<\/ul>","text":"기존 노트 주식 매입의 최적 시점은 백화점에서 물건을 살 때처럼 좋은 물건이 좋은 가격에 나왔다는 확신이 드는 날이다. 첫 번째는 연말 절세 매각기간인 10~12월 사이로, 개인들이 현금도 필요하고 Tax-Loss Harvesting 등의 이유로 주가가 하락할 수도 있다. 기관투자자들도 다가오는 평가에 대비해 포트폴리오를 정리하면서 손해 본 종목들을 연말에 던져버린다. 이렇게 매도가 또 다른 매도를 부추기는 사이, 정말로 좋은 종목들조차 터무니없는 수준으로 주가가 떨어지게 된다. 두 번째는 몇 년마다 주식시장에 발생하는 붕괴, 폭락, 거품 붕괴, 일시적 하락, 대폭락 기간이다. 이 기간 중 매도의 본능을 억누르고 용기를 발휘하여 이 두려운 상황에서 주식을 매입한다면 다시는 보기 힘든 기막힌 기회를 잡을 수 있을 것이다. 때가 아닌데도 회의론자들이 매도를 외쳐대면, 아무리 사려 깊고 침착한 투자자들이라도 흔들리게 마련이다. 이익은 기회가 있을 때 실현하고 손실 가능성을 감수하느니 확실한 이익을 보는 편이 항상 낫다. 그러나 좋은 주식을 발굴해서 매입했고 모든 증거가 주가 상승을 지지하며 만사가 유리하게 진행되고 있는데도 그 시점에 매도는 부끄러운 일이다. 내가 속을 위험이 있다고 느끼면 처음에 주식을 매입한 이유를 다시 떠올려라. 진정한 매도 시점은 매수 시점을 생각하는 것과 똑같은 방법으로 매도 시점도 생각할 수 있다. 저성장주 매도 시점 저성장주는 30~50% 상승하면 매도하고, 주가가 하락했더라도 기본이 악화되면 역시 매도한다. 그 외에도 시장 점유율이 2년 연속 하락했고, 신제품 개발도 하지 않고, 연구개발비 지출도 삭감하고 더 이상 회사가 노력을 하지 않는 것으로 보일 때 최근에 2개의 비관련 기업을 인수한 것은 사업다악화의 사례로 보이고 첨단기술 분야에서 추가로 인수 대상 기업을 물색 중이라고 발표할 때 회사가 인수에 지나친 비용을 지출하여 대차대조표는 부채 없이 현금 비율이 높았던 상태에서 주가가 가파르게 하락하는데도 자사주를 매입할 잉여자금이 없을 때 주가가 내려가도 배당수익률이 투자자들의 관심을 끌 만큼 높지 않다. 대형우량주 매도 시점 주가가 이익선 위로 올라가거나 주가수익비율이 정상적인 범위에서 크게 벗어나면 매도하고 기다렸다가 나중에 더 낮은 가격에 다시 매입하거나 다른 대형우량주를 매입하라. 지난 2년 동안 도입된 신제품들의 실적이 엇갈리고 아직 시험 단계에 있는 다른 신제품들의 출시 시점이 늦을 때 같은 업종의 비슷한 회사는 PER이 11~12인데 이 회사의 경우는 15이다. 작년에 회사 주식을 매입한 임원이나 관리자가 한 사람도 없다. 회사 이익의 25%를 차지하는 주요 사업부가 현재 진행 중인 경기침체에 취약하다. 회사의 성장률이 하락하고, 지금은 원가 절감으로 이익을 유지하고 있고 더 이상 원가를 절감하기 어렵다. 경기순환주 매도 시점 매도하기 가장 좋은 시점은 경기 상승 순환이 끝나기 전이지만 누가 그 시점을 알겠는가? 경기순환의 막바지 시점이 아니라면 매도의 최적 시점은 실제로 어떤 일이 잘못되기 시작할 때다. 한 가지 분명한 매도 신호는 회사가 쌓여가는 재고를 처분하지 못하는 것이고 항상 재고 증가에 관심을 쏟아야 한다. 상품 가격 하락 역시 매도 시점의 전조이고 선물가격이 현물가격보다 내려가는 것이다. 기업 간의 경쟁은 가격 인하로 이익이 감소하여 경기순환주에 미치는 나쁜 신호다. 노사의 임금과 복지혜택 요구, 제품에 대한 최종수요 감소, 비용 절감 없는 자본적 지출 예산 과다 확대, 원가절감 후에도 경쟁 심화 등 고성장주 매도 시점 핵심은 잠재적 텐배거 종목을 놓치지 않는 것이고 지켜 보아야 할 핵심 요소는 고속성장의 두 번째 단계가 언제 끝나는지 살펴보는 것이다. 신규 매장 설립 중단, 기존 매장 노후화, 제품 선호도 하락 등은 매도를 고려해야 할 시점이다. 월가 분석가 대다수가 이 주식을 최우선으로 추천하고 주식의 60%를 기관투자자들이 보유하고 있으며 기사의 내용이 회사의 칭찬으로 가득하다면 매도를 생각해야 할 시점이다. 경기가 상승하면 PER이 낮아지는 경기순환주와 달리 고성장주는 대개 PER이 갈수록 터무니없고 비논리적인 수준까지 올라가기도 한다. 지난 분기 동일 점포 매출 3% 감소, 신규매장 실적 기대 이하, 고위 임원과 핵심 직원 여럿이 경쟁회사로 이직 다음 2년의 가장 낙관적인 EPS 성장 예측도 15~20%인데, 주식의 PER이 30에 거래되고 있다. 회생주 매도 시점 회생주 매도 최적의 시점은 회사가 회생한 다음이다. 다섯 분기 연속으로 감소했던 부채가 지난 분기 보고서에 2,500만 달러 증가로 나왔다. 재고가 매출보다 2배 빠른 속도로 증가하고 있다. 이익 전망에 비해 PER이 부풀려졌다. 회사의 핵심 사업부 제품의 50%를 단일 고객 기업 판매 중 이 고객 기업의 매출이 감소하고 있다. 자산주 매도 시점 회사에 정말로 숨은 자산이 있다면 기업사냥꾼을 기다리는 것이 가장 좋은 방법이다. 회사가 흥청거리는 빚잔치를 하느라 자산가치가 줄어들지 않는 한, 자산주는 계속 보유해야 한다. 주식이 실제 시장가치보다 10% 할인되어 거래되는데도 경영진은 사업다각화 자금을 조달하기 위해 주식의 10%를 발행한다고 발표한다. 2,000만 달러에 팔린다고 기대했던 사업부가 실제로는 1,200만 달러에 팔린다. 법인세율이 인하되어 회사의 이월 결손금 가치가 크게 하락한다. 5년 전에 25%였던 기관투자자 보유 비중이 지금은 60%로 높아졌다. [구조화] [후대 해석] 이 장은 언제 살지 와 언제 팔지 를 스토리와 가격의 결합으로 판단하게 하며, 프로세스 단계로는 매수 집행과 유형별 매도에 해당한다. [실전 적용] [현대 적용] 매수는 가격이 내렸다 가 아니라 스토리는 유지되는데 가격이 더 좋아졌다 일 때만 한다. [오해 방지] [후대 해석] 주가가 빠졌다는 사실만으로 싸다고 볼 수 없다."},{"i":23,"title":"18. 가장 어리석고 위험한 열두 가지 생각","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>사람들이 주식에 대해 말하는 가장 어리석은 속설 12가지는 다음과 같다.<\/li>\n<li>내릴 만큼 내렸으니 더는 안 내려 (1/10토막 난 이후는 그 속설이 맞을 수도 있다.)<\/li>\n<li>원칙적으로 주가가 얼마만큼 떨어질 것인지 짐작할 수 있는 규칙은 없다.<\/li>\n<li>바닥의 주식 낚시는 투자자에게 인기가 높지만 대개 낚이는 것은 주식이 아니라 투자자 자신이다.<\/li>\n<li>떨어지는 칼을 잡지 말고 칼이 땅에 꽂혀 잠시 부르르 떨다가 멈춘 다음에 잡는 편이 낫다.<\/li>\n<li>회생주를 노리고 있다면 단지 주가가 많이 떨어졌으니 오를 것 같다는 이유만으로 주식을 사서는 안 되고 사업의 회생 등의 근거가 있어야 한다. (그래도 주가는 등락을 거듭한 뒤에 상승하기 시작하고 오래 걸린다.)<\/li>\n<li>\"오를 만큼 올랐으니 더 오르지 못할 거야\"라는 생각은 스토리가 여전히 좋고 이익이 계속 성장하는 중이라면 맞지 않다.<\/li>\n<li>어느 주식이 10배로 뛰고 어느 주식이 5배로 뛸지 도무지 예측할 수 없고 내가 할 수 있는 일은 회사의 스토리가 유지되는 한 대박을 기대하면서 주식을 계속 보유하는 것뿐이다.<\/li>\n<li>주당 50달러에 샀든 1달러에 샀든 주식이 휴지가 되면 무일푼 거지 되기는 마찬가지다.<\/li>\n<li>결국 회복될 것이라는 말은 징기스칸도 우리 앞에 다시 나타나는 것과 같다.<\/li>\n<li>사람은 상황이 조금 나빠지면 더 이상 나빠질 리 없다고 생각하는 경향이 강하지만 바닥 아래에 지하실이 있다.<\/li>\n<li>\"10달러까지 반등하면 팔아야지\"라고 말하는 순간 이 주식은 9.75달러 바로 앞에서 횡보하다가 4달러, 1달러로 곤두박질칠 것이다.<\/li>\n<li>나는 주식을 더 매입할 만큼 그 회사에 대한 확신이 서지 않는다면, 즉시 팔아야 한다는 사실을 상기하라.<\/li>\n<li>공익사업주도 투자자의 선택 능력이나 운에 따라 크게 벌 수도 있고, 크게 잃을 수도 있는 종목이 되었다.<\/li>\n<li>새로운 상황을 즉시 파악하지 못한 투자자들은 틀림없이 금전적으로나 심리적으로나 끔찍한 고통을 겪을 수 있다.<\/li>\n<li>기업의 생리는 역동적이고 전망은 언제든지 변한다. 보유 중에 신경을 꺼도 되는 주식이란 세상에 존재하지 않는다.<\/li>\n<li>멋진 사건을 기다리다 지쳐 내가 매도하면 그 다음 날부터 기다리던 사건이 일어난다. (매도 후 번영)<\/li>\n<li>몇 년 동안 꼼짝하지 않는 주식은 사실 좋은 징조이고 차트가 따분한 모습을 보이면, 이 종목이 크게 상승하리라는 강력한 암시를 받는다.<\/li>\n<li>본인이 흥미를 느껴도 다른 사람들 모두 무시한다면 주식 보유에 엄청난 인내심이 필요하지만 기본이 탄탄한 회사라면 그 인내심은 결국 보상받는다.<\/li>\n<li>내가 주식을 사지 않아서 손해를 본 것은 한 푼도 없고 다른 사람이 얻은 이익을 자신의 손실로 여기는 태도는 뇌동매매로 손실을 볼 수 있다.<\/li>\n<li>꿩 대신 닭을 잡지 말고 조금 비싸게라도 원조 우량기업을 사는 편이 제2의 아무개를 싸게 사는 것보다 낫다.<\/li>\n<li>단기 주가 등락과 나의 투자 판단의 옳음은 상관 관계가 없고 단기 트레이더가 아니면 단기성과는 전혀 의미가 없다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 행동 오류를 차단하며, 프로세스 단계로는 보유 관리와 매도 판단의 심리 통제에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 투자 일지에 <code>내가 지금 하고 싶은 말<\/code>을 적고, 그것이 책에서 말한 위험한 문장인지 대조한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] <code>결국 회복된다<\/code>는 믿음은 실적 악화 기업에는 함정이 될 수 있다.<\/li>\n<\/ul>","text":"기존 노트 사람들이 주식에 대해 말하는 가장 어리석은 속설 12가지는 다음과 같다. 내릴 만큼 내렸으니 더는 안 내려 (1/10토막 난 이후는 그 속설이 맞을 수도 있다.) 원칙적으로 주가가 얼마만큼 떨어질 것인지 짐작할 수 있는 규칙은 없다. 바닥의 주식 낚시는 투자자에게 인기가 높지만 대개 낚이는 것은 주식이 아니라 투자자 자신이다. 떨어지는 칼을 잡지 말고 칼이 땅에 꽂혀 잠시 부르르 떨다가 멈춘 다음에 잡는 편이 낫다. 회생주를 노리고 있다면 단지 주가가 많이 떨어졌으니 오를 것 같다는 이유만으로 주식을 사서는 안 되고 사업의 회생 등의 근거가 있어야 한다. (그래도 주가는 등락을 거듭한 뒤에 상승하기 시작하고 오래 걸린다.) \"오를 만큼 올랐으니 더 오르지 못할 거야\"라는 생각은 스토리가 여전히 좋고 이익이 계속 성장하는 중이라면 맞지 않다. 어느 주식이 10배로 뛰고 어느 주식이 5배로 뛸지 도무지 예측할 수 없고 내가 할 수 있는 일은 회사의 스토리가 유지되는 한 대박을 기대하면서 주식을 계속 보유하는 것뿐이다. 주당 50달러에 샀든 1달러에 샀든 주식이 휴지가 되면 무일푼 거지 되기는 마찬가지다. 결국 회복될 것이라는 말은 징기스칸도 우리 앞에 다시 나타나는 것과 같다. 사람은 상황이 조금 나빠지면 더 이상 나빠질 리 없다고 생각하는 경향이 강하지만 바닥 아래에 지하실이 있다. \"10달러까지 반등하면 팔아야지\"라고 말하는 순간 이 주식은 9.75달러 바로 앞에서 횡보하다가 4달러, 1달러로 곤두박질칠 것이다. 나는 주식을 더 매입할 만큼 그 회사에 대한 확신이 서지 않는다면, 즉시 팔아야 한다는 사실을 상기하라. 공익사업주도 투자자의 선택 능력이나 운에 따라 크게 벌 수도 있고, 크게 잃을 수도 있는 종목이 되었다. 새로운 상황을 즉시 파악하지 못한 투자자들은 틀림없이 금전적으로나 심리적으로나 끔찍한 고통을 겪을 수 있다. 기업의 생리는 역동적이고 전망은 언제든지 변한다. 보유 중에 신경을 꺼도 되는 주식이란 세상에 존재하지 않는다. 멋진 사건을 기다리다 지쳐 내가 매도하면 그 다음 날부터 기다리던 사건이 일어난다. (매도 후 번영) 몇 년 동안 꼼짝하지 않는 주식은 사실 좋은 징조이고 차트가 따분한 모습을 보이면, 이 종목이 크게 상승하리라는 강력한 암시를 받는다. 본인이 흥미를 느껴도 다른 사람들 모두 무시한다면 주식 보유에 엄청난 인내심이 필요하지만 기본이 탄탄한 회사라면 그 인내심은 결국 보상받는다. 내가 주식을 사지 않아서 손해를 본 것은 한 푼도 없고 다른 사람이 얻은 이익을 자신의 손실로 여기는 태도는 뇌동매매로 손실을 볼 수 있다. 꿩 대신 닭을 잡지 말고 조금 비싸게라도 원조 우량기업을 사는 편이 제2의 아무개를 싸게 사는 것보다 낫다. 단기 주가 등락과 나의 투자 판단의 옳음은 상관 관계가 없고 단기 트레이더가 아니면 단기성과는 전혀 의미가 없다. [구조화] [후대 해석] 이 장은 행동 오류를 차단하며, 프로세스 단계로는 보유 관리와 매도 판단의 심리 통제에 해당한다. [실전 적용] [현대 적용] 투자 일지에 내가 지금 하고 싶은 말 을 적고, 그것이 책에서 말한 위험한 문장인지 대조한다. [오해 방지] [후대 해석] 결국 회복된다 는 믿음은 실적 악화 기업에는 함정이 될 수 있다."},{"i":24,"title":"19. 선물, 옵션, 공매도","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>시카고와 뉴욕의 보고서에 따르면 아마추어투자자의 80~95%가 선물과 옵션으로 손실을 본다고 한다.<\/li>\n<li>선물과 옵션의 승률은 카지노나 경마장에서 거둘 수 있는 최악의 승률보다도 못하다.<\/li>\n<li>종목에 대해 제대로 조사했는데도 보상을 받기는커녕 무일푼이 될 수 있고 결과적으로 시간과 돈, 재능을 철저하게 낭비한 셈이다.<\/li>\n<li>옵션의 또 다른 약점은 비용이 많이 든다는 것이고 국가 경제의 성장에 기여하는 주식 보유와 다르게 옵션은 제로섬 게임이다.<\/li>\n<li>워런 버핏은 주식 선물, 옵션을 불법화해야 한다고 했고 이에 동감한다.<\/li>\n<li>공매도 거래자는 빌린 물건을 아주 비싼 가격에 팔고 대신 같은 물건을 아주 싼 가격에 사서 돌려주어 그 차액을 챙기려고 한다.<\/li>\n<li>일반 주식은 마이너스가 되는 일은 없지만 공매도는 주식이 상승한다면 주가에는 천장이 없으므로 손실이 무한대이다.<\/li>\n<li>한마디로 정리하면 선물, 옵션, 공매도 절대 하지 마라.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 개인 투자 프로세스의 금지 영역을 명확히 하며, 프로세스 단계로는 리스크 한도와 투자 범위 설정에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 개인 운용 규정에 <code>레버리지 파생상품 금지<\/code>, <code>무기한 손실 가능 포지션 금지<\/code>, <code>만기 의존 구조 금지<\/code>를 명시한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 파생상품을 이해한다고 해서 개인 투자 프로세스에 꼭 도움이 되는 것은 아니다.<\/li>\n<\/ul>","text":"기존 노트 시카고와 뉴욕의 보고서에 따르면 아마추어투자자의 80~95%가 선물과 옵션으로 손실을 본다고 한다. 선물과 옵션의 승률은 카지노나 경마장에서 거둘 수 있는 최악의 승률보다도 못하다. 종목에 대해 제대로 조사했는데도 보상을 받기는커녕 무일푼이 될 수 있고 결과적으로 시간과 돈, 재능을 철저하게 낭비한 셈이다. 옵션의 또 다른 약점은 비용이 많이 든다는 것이고 국가 경제의 성장에 기여하는 주식 보유와 다르게 옵션은 제로섬 게임이다. 워런 버핏은 주식 선물, 옵션을 불법화해야 한다고 했고 이에 동감한다. 공매도 거래자는 빌린 물건을 아주 비싼 가격에 팔고 대신 같은 물건을 아주 싼 가격에 사서 돌려주어 그 차액을 챙기려고 한다. 일반 주식은 마이너스가 되는 일은 없지만 공매도는 주식이 상승한다면 주가에는 천장이 없으므로 손실이 무한대이다. 한마디로 정리하면 선물, 옵션, 공매도 절대 하지 마라. [구조화] [후대 해석] 이 장은 개인 투자 프로세스의 금지 영역을 명확히 하며, 프로세스 단계로는 리스크 한도와 투자 범위 설정에 해당한다. [실전 적용] [현대 적용] 개인 운용 규정에 레버리지 파생상품 금지 , 무기한 손실 가능 포지션 금지 , 만기 의존 구조 금지 를 명시한다. [오해 방지] [후대 해석] 파생상품을 이해한다고 해서 개인 투자 프로세스에 꼭 도움이 되는 것은 아니다."},{"i":25,"title":"20. 전문가 5만 명이 모두 틀릴 수도 있다","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>시장은 개별 종목과 마찬가지로 단기적으로는 일반적인 기대치와 반대 방향으로 움직이기도 한다.<\/li>\n<li>좋은 상품을 보유하는 한 소액 투자자들은 어떤 시장에서든지 버틸 수 있고 걱정해야 할 사람들은 똑똑한 바보, 전문 투자자들이다.<\/li>\n<li>소액 투자자들은 전문투자자들의 무리와 싸울 필요가 없고 출구에 군중이 몰릴 때는 입구로 조용히 걸어 들어가고, 입구에 군중이 몰릴 때는 출구로 걸어 나가면 그만이다.<\/li>\n<li>시장이 거래의 홍수인 지금에도 대박을 내는 종목들은 여전히 3~4년 보유한 종목 가운데서 나온다.<\/li>\n<li>주식시장은 근심의 벽을 타고 오른다는 말을 믿는가? 근심의 벽이 제법 높은 데다 매일 더 높아지고 있다는 사실에 주목하라.<\/li>\n<li>우리는 주식에 투자할 때 인간의 본성, 자본주의, 국가, 미래의 번영을 전반적으로 신뢰해야 한다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 군중과 분리된 확신 유지를 다루며, 프로세스 단계로는 보유 중 점검과 역발상 실행에 해당한다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>[현대 적용] 군중이 출구로 몰릴 때와 입구로 몰릴 때, 내 스토리와 숫자가 무엇을 말하는지 먼저 확인한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[후대 해석] 역발상은 군중의 반대편에 선다는 행위가 아니라 사실과 가격이 어긋났을 때만 의미가 있다.<\/li>\n<\/ul>","text":"기존 노트 시장은 개별 종목과 마찬가지로 단기적으로는 일반적인 기대치와 반대 방향으로 움직이기도 한다. 좋은 상품을 보유하는 한 소액 투자자들은 어떤 시장에서든지 버틸 수 있고 걱정해야 할 사람들은 똑똑한 바보, 전문 투자자들이다. 소액 투자자들은 전문투자자들의 무리와 싸울 필요가 없고 출구에 군중이 몰릴 때는 입구로 조용히 걸어 들어가고, 입구에 군중이 몰릴 때는 출구로 걸어 나가면 그만이다. 시장이 거래의 홍수인 지금에도 대박을 내는 종목들은 여전히 3~4년 보유한 종목 가운데서 나온다. 주식시장은 근심의 벽을 타고 오른다는 말을 믿는가? 근심의 벽이 제법 높은 데다 매일 더 높아지고 있다는 사실에 주목하라. 우리는 주식에 투자할 때 인간의 본성, 자본주의, 국가, 미래의 번영을 전반적으로 신뢰해야 한다. [구조화] [후대 해석] 이 장은 군중과 분리된 확신 유지를 다루며, 프로세스 단계로는 보유 중 점검과 역발상 실행에 해당한다. [실전 적용] [현대 적용] 군중이 출구로 몰릴 때와 입구로 몰릴 때, 내 스토리와 숫자가 무엇을 말하는지 먼저 확인한다. [오해 방지] [후대 해석] 역발상은 군중의 반대편에 선다는 행위가 아니라 사실과 가격이 어긋났을 때만 의미가 있다."},{"i":26,"title":"3부 요약","html":"<ul>\n<li>다음 달이나 내년, 또는 3년 뒤 어느 날 시장이 가파르게 하락할 수 있다.<\/li>\n<li>시장 하락은 우리가 좋아하는 주식을 살 수 있는 훌륭한 기회고 조정이 일어나면 탁월한 기업들도 헐값이 된다.<\/li>\n<li>1년이나 2년 후 시장의 방향을 예측하는 것은 불가능하다.<\/li>\n<li>남보다 앞서기 위해서 항상 옳은 판단을 해야 하는 것은 아니고 투자 인생 중 대부분의 시간에서도 꼭 옳아야 할 필요는 없다.<\/li>\n<li>대박 종목은 항상 뜻밖의 종목 가운데 나왔고, 인수 대상 종목은 더욱 뜻밖의 종목 가운데서 나왔다.<\/li>\n<li>큰 실적을 거두려면 몇 달이 아니라 몇 년을 기다려야 한다.<\/li>\n<li>유형이 다른 주식은 위험과 보상도 다르다.<\/li>\n<li>대형우량주에 투자하여 20~30% 가량의 수익을 몇 차례 반복하는 방법으로 큰돈을 벌 수 있다.<\/li>\n<li>주가는 회사의 기본과 반대 방향으로 움직이는 때도 더러 있지만, 장기적으로는 이익의 방향과 지속성을 따라간다.<\/li>\n<li>현재 실적이 부진한 기업은 실적이 더 나빠질 수도 있다.<\/li>\n<li>단지 주가가 올라간다는 이유로 나의 판단이 옳았다고 보면 안 된다.<\/li>\n<li>단지 주가가 내려간다는 이유로 나의 판단이 틀렸다고 보아서도 안 된다.<\/li>\n<li>대형 우량주의 기관투자 보유 비중이 높고, 월스트리트에서 많은 분석가가 조사 중이며 시장 평균보다 가격이 더 오른 상태이고, 주가가 과대평가되어 있다면, 이 회사의 주가는 앞으로 횡보하거나 하락한다.<\/li>\n<li>회사의 전망이 신통치 않은데도 단지 주가가 싸다는 이유로 매입하면 돈을 잃는다.<\/li>\n<li>탁월한 고성장주가 조금 과대평가된 것 같다는 이유만으로 매도해도 돈을 잃는다.<\/li>\n<li>기업이 성장하는 데는 이유가 있다. 고성장주라도 영원히 성장하는 것이 아니다.<\/li>\n<li>텐배거가 된 종목을 애초에 보유한 적이 없다면, 그 돈을 잃은 것이 아니다.<\/li>\n<li>주식은 주인이 누구인지 모른다.<\/li>\n<li>주식이 상승한다고 해서 안심하고 스토리 점검을 중단하면 안 된다.<\/li>\n<li>주식이 휴지가 되면 50달러이든 1달러이든 어느 가격에 매입했든지 투자자가 잃는 금액은 동일하다.<\/li>\n<li>기본에 바탕을 두고 조심스럽게 가지치기와 교체 매매를 하면, 실적을 향상시킬 수 있다.<\/li>\n<li>보유 중인 주식이 실제 가치를 벗어났고, 더 좋은 투자 대상이 나타났다면, 그 주식을 팔고 다른 종목으로 교체하라.<\/li>\n<li>유리한 카드가 나오면 판돈을 올리고, 불리한 카드가 나오면 판돈을 줄이라.<\/li>\n<li>우량주(꽃)를 뽑아내고 잡주(잡초)에 물을 준다면 실적을 개선할 수 없다.<\/li>\n<li>시장을 이길 수 없다고 생각되면, S&amp;P500 펀드에 투자하는 방법으로 시간과 돈을 절약하라.<\/li>\n<li>걱정할 일은 항상 생기는 법이다.<\/li>\n<li>새로운 아이디어에 항상 마음을 열어 놓으라.<\/li>\n<li>마음에 든다고 해서 모든 여자에게 입맞춤할 수는 없다. FOMO 없이 내가 잘 학습한 종목으로 시장을 이기는데 아무런 지장이 없다.<\/li>\n<\/ul>","text":"다음 달이나 내년, 또는 3년 뒤 어느 날 시장이 가파르게 하락할 수 있다. 시장 하락은 우리가 좋아하는 주식을 살 수 있는 훌륭한 기회고 조정이 일어나면 탁월한 기업들도 헐값이 된다. 1년이나 2년 후 시장의 방향을 예측하는 것은 불가능하다. 남보다 앞서기 위해서 항상 옳은 판단을 해야 하는 것은 아니고 투자 인생 중 대부분의 시간에서도 꼭 옳아야 할 필요는 없다. 대박 종목은 항상 뜻밖의 종목 가운데 나왔고, 인수 대상 종목은 더욱 뜻밖의 종목 가운데서 나왔다. 큰 실적을 거두려면 몇 달이 아니라 몇 년을 기다려야 한다. 유형이 다른 주식은 위험과 보상도 다르다. 대형우량주에 투자하여 20~30% 가량의 수익을 몇 차례 반복하는 방법으로 큰돈을 벌 수 있다. 주가는 회사의 기본과 반대 방향으로 움직이는 때도 더러 있지만, 장기적으로는 이익의 방향과 지속성을 따라간다. 현재 실적이 부진한 기업은 실적이 더 나빠질 수도 있다. 단지 주가가 올라간다는 이유로 나의 판단이 옳았다고 보면 안 된다. 단지 주가가 내려간다는 이유로 나의 판단이 틀렸다고 보아서도 안 된다. 대형 우량주의 기관투자 보유 비중이 높고, 월스트리트에서 많은 분석가가 조사 중이며 시장 평균보다 가격이 더 오른 상태이고, 주가가 과대평가되어 있다면, 이 회사의 주가는 앞으로 횡보하거나 하락한다. 회사의 전망이 신통치 않은데도 단지 주가가 싸다는 이유로 매입하면 돈을 잃는다. 탁월한 고성장주가 조금 과대평가된 것 같다는 이유만으로 매도해도 돈을 잃는다. 기업이 성장하는 데는 이유가 있다. 고성장주라도 영원히 성장하는 것이 아니다. 텐배거가 된 종목을 애초에 보유한 적이 없다면, 그 돈을 잃은 것이 아니다. 주식은 주인이 누구인지 모른다. 주식이 상승한다고 해서 안심하고 스토리 점검을 중단하면 안 된다. 주식이 휴지가 되면 50달러이든 1달러이든 어느 가격에 매입했든지 투자자가 잃는 금액은 동일하다. 기본에 바탕을 두고 조심스럽게 가지치기와 교체 매매를 하면, 실적을 향상시킬 수 있다. 보유 중인 주식이 실제 가치를 벗어났고, 더 좋은 투자 대상이 나타났다면, 그 주식을 팔고 다른 종목으로 교체하라. 유리한 카드가 나오면 판돈을 올리고, 불리한 카드가 나오면 판돈을 줄이라. 우량주(꽃)를 뽑아내고 잡주(잡초)에 물을 준다면 실적을 개선할 수 없다. 시장을 이길 수 없다고 생각되면, S&amp;P500 펀드에 투자하는 방법으로 시간과 돈을 절약하라. 걱정할 일은 항상 생기는 법이다. 새로운 아이디어에 항상 마음을 열어 놓으라. 마음에 든다고 해서 모든 여자에게 입맞춤할 수는 없다. FOMO 없이 내가 잘 학습한 종목으로 시장을 이기는데 아무런 지장이 없다."},{"i":27,"title":"에필로그: 성공의 순간을 만끽하라","html":"<ul>\n<li>이례적인 반등이 나타나기 전후에 모든 자금을 투자하고 성공을 만끽할 준비만 하면 된다.<\/li>\n<li>모든 것을 투자했으므로 주식을 더 사느라 서두를 필요도 없다.<\/li>\n<li>내가 충분히 질문을 던지면 내가 몰랐던 내용을 알게 될지도 모른다.<\/li>\n<li>주식에서 좋은 성과를 올리려면 우리는 항상 우선순위를 잘 지켜야 한다.<\/li>\n<\/ul>\n<hr />","text":"이례적인 반등이 나타나기 전후에 모든 자금을 투자하고 성공을 만끽할 준비만 하면 된다. 모든 것을 투자했으므로 주식을 더 사느라 서두를 필요도 없다. 내가 충분히 질문을 던지면 내가 몰랐던 내용을 알게 될지도 모른다. 주식에서 좋은 성과를 올리려면 우리는 항상 우선순위를 잘 지켜야 한다."},{"i":28,"title":"관련 노트","html":"<ul>\n<li>[[독서_현명한_투자자|현명한 투자자]]<\/li>\n<li>[[독서_돈의_심리학|돈의 심리학]]<\/li>\n<li>[[독서_레버리지|레버리지]]<\/li>\n<li>[[독서_모든_주식을_소유하라|모든 주식을 소유하라]]<\/li>\n<li>[[독서_How_to_Trade_in_Stocks|How to Trade in Stocks]]<\/li>\n<li>[[독서_돈_뜨겁게_사랑하고_차갑게_다루어라|돈, 뜨겁게 사랑하고 차갑게 다루어라]]<\/li>\n<li>[[독서_개장전_아직_켜지지_않은_모니터_앞에서|개장 전, 아직 켜지지 않은 모니터 앞에서]]<\/li>\n<\/ul>","text":"[[독서_현명한_투자자|현명한 투자자]] [[독서_돈의_심리학|돈의 심리학]] [[독서_레버리지|레버리지]] [[독서_모든_주식을_소유하라|모든 주식을 소유하라]] [[독서_How_to_Trade_in_Stocks|How to Trade in Stocks]] [[독서_돈_뜨겁게_사랑하고_차갑게_다루어라|돈, 뜨겁게 사랑하고 차갑게 다루어라]] [[독서_개장전_아직_켜지지_않은_모니터_앞에서|개장 전, 아직 켜지지 않은 모니터 앞에서]]"},{"i":29,"title":"린치 투자 프로세스 전체 지도","html":"<p>[후대 해석] 이 노트를 실전 운용 체계로 다시 엮으면, 린치의 개별 원칙은 다음 10단계 루틴으로 정리된다.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>해야 할 일<\/th>\n<th>관련 장<\/th>\n<th>산출물<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. 투자자 자기진단<\/td>\n<td>자금의 시간 지평, 생활 안정성, 감정 통제 가능성을 점검한다.<\/td>\n<td>4장, 5장, 1부 요약<\/td>\n<td>투자 가능 자금 범위<\/td>\n<\/tr>\n<tr>\n<td>2. 주변에서 아이디어 발견<\/td>\n<td>생활·업무 현장에서 먼저 보이는 제품, 서비스, 공급망 변화를 포착한다.<\/td>\n<td>서문, 2장, 6장, 8장<\/td>\n<td>관찰 기반 아이디어 목록<\/td>\n<\/tr>\n<tr>\n<td>3. 회사 이해<\/td>\n<td>이 회사가 무엇으로 돈을 버는지, 핵심 제품이 얼마나 중요한지 이해한다.<\/td>\n<td>8장, 10장, 12장<\/td>\n<td>사업 이해 메모<\/td>\n<\/tr>\n<tr>\n<td>4. 6가지 유형 분류<\/td>\n<td>저성장주, 대형우량주, 고성장주, 경기순환주, 회생주, 자산주 중 어디인지 정한다.<\/td>\n<td>7장, 15장<\/td>\n<td>유형 라벨과 기대수익 구조<\/td>\n<\/tr>\n<tr>\n<td>5. 2분 독백 작성<\/td>\n<td>왜 사는지, 무엇이 잘되어야 하는지, 무엇이 깨지면 틀리는지 말로 압축한다.<\/td>\n<td>11장<\/td>\n<td>투자 논리 2분 독백<\/td>\n<\/tr>\n<tr>\n<td>6. 숫자 확인<\/td>\n<td>이익, PER, 성장률, 부채, 현금, 재고, 배당, 자산가치, 현금흐름을 확인한다.<\/td>\n<td>10장, 12장, 13장, 15장<\/td>\n<td>핵심 지표 표<\/td>\n<\/tr>\n<tr>\n<td>7. 최종 점검<\/td>\n<td>유형별 체크리스트로 go/no-go를 결정한다.<\/td>\n<td>15장, 2부 요약<\/td>\n<td>매수 여부 결정<\/td>\n<\/tr>\n<tr>\n<td>8. 포트폴리오 구성<\/td>\n<td>종목 수, 유형 분산, 비중, 교체 규칙, 현금 운용 원칙을 정한다.<\/td>\n<td>16장<\/td>\n<td>포트폴리오 설계안<\/td>\n<\/tr>\n<tr>\n<td>9. 보유 중 스토리 재확인<\/td>\n<td>분기·반기·연간 단위로 산 이유가 유지되는지 확인한다.<\/td>\n<td>14장, 16장, 20장, 3부 요약<\/td>\n<td>보유 점검 기록<\/td>\n<\/tr>\n<tr>\n<td>10. 유형별 매도<\/td>\n<td>가격이 아니라 스토리 훼손, 과열, 회복 완료, 자산가치 실현 여부로 매도한다.<\/td>\n<td>17장, 18장<\/td>\n<td>매도/교체 판단<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"[후대 해석] 이 노트를 실전 운용 체계로 다시 엮으면, 린치의 개별 원칙은 다음 10단계 루틴으로 정리된다. 단계 해야 할 일 관련 장 산출물 1. 투자자 자기진단 자금의 시간 지평, 생활 안정성, 감정 통제 가능성을 점검한다. 4장, 5장, 1부 요약 투자 가능 자금 범위 2. 주변에서 아이디어 발견 생활·업무 현장에서 먼저 보이는 제품, 서비스, 공급망 변화를 포착한다. 서문, 2장, 6장, 8장 관찰 기반 아이디어 목록 3. 회사 이해 이 회사가 무엇으로 돈을 버는지, 핵심 제품이 얼마나 중요한지 이해한다. 8장, 10장, 12장 사업 이해 메모 4. 6가지 유형 분류 저성장주, 대형우량주, 고성장주, 경기순환주, 회생주, 자산주 중 어디인지 정한다. 7장, 15장 유형 라벨과 기대수익 구조 5. 2분 독백 작성 왜 사는지, 무엇이 잘되어야 하는지, 무엇이 깨지면 틀리는지 말로 압축한다. 11장 투자 논리 2분 독백 6. 숫자 확인 이익, PER, 성장률, 부채, 현금, 재고, 배당, 자산가치, 현금흐름을 확인한다. 10장, 12장, 13장, 15장 핵심 지표 표 7. 최종 점검 유형별 체크리스트로 go/no-go를 결정한다. 15장, 2부 요약 매수 여부 결정 8. 포트폴리오 구성 종목 수, 유형 분산, 비중, 교체 규칙, 현금 운용 원칙을 정한다. 16장 포트폴리오 설계안 9. 보유 중 스토리 재확인 분기·반기·연간 단위로 산 이유가 유지되는지 확인한다. 14장, 16장, 20장, 3부 요약 보유 점검 기록 10. 유형별 매도 가격이 아니라 스토리 훼손, 과열, 회복 완료, 자산가치 실현 여부로 매도한다. 17장, 18장 매도/교체 판단"},{"i":30,"title":"아마추어의 우위가 성립하는 조건과 성립하지 않는 조건","html":"<p>[린치 본문] 공식 출판사 소개와 발췌문이 요약하는 린치의 핵심은, 개인투자자가 일상에서 제품과 서비스를 먼저 발견하고 그 뒤 재무와 성장성을 점검함으로써 기회를 잡을 수 있다는 점이다. 동시에 그 페이지는 <code>좋아하는 가게<\/code>라는 이유만으로는 보유 근거가 아니며, 이익 전망·재무상태·경쟁·확장 계획을 조사해야 한다고 못 박는다.<\/p>\n<p>[현대 적용] 같은 출판사 발췌문은 과거 대비 정보 격차가 좁혀졌다고 적고 있다. 여기에 더해 최근 시장에서는 저비용 인덱스 자산이 초대형으로 커졌고, 2025년에는 미국 대형주 액티브 펀드의 다수가 S&amp;P 500을 밑돌았다는 보도가 있었다. 따라서 오늘의 개인투자자 우위는 <code>생활 현장의 발견 + 느린 자본 + 독립 조사 + 낮은 회전율<\/code>이 동시에 있을 때만 성립한다고 보는 편이 실무적으로 정확하다. 이는 원문과 최근 시장 구조를 함께 놓고 내린 추론이다.<\/p>\n<h3>성립하는 조건<\/h3>\n<ul>\n<li>[린치 본문] 내가 남보다 먼저 볼 수 있는 생활·업무 현장의 관찰 포인트가 있다.<\/li>\n<li>[린치 본문] 발견 뒤에 재무상태, 경쟁, 확장 계획까지 직접 조사한다.<\/li>\n<li>[후대 해석] 기관이 관심 갖기 전의 작고 따분한 기업, 혹은 커버리지가 얕은 영역을 본다.<\/li>\n<li>[후대 해석] 고회전 매매보다 몇 년 보유 가능한 스토리를 찾는다.<\/li>\n<li>[추론] 내 전문 분야나 소비 경험이 실적 변화로 이어질 가능성을 판단할 수 있다.<\/li>\n<li>[추론] 가격 규율이 있고, <code>좋은 회사<\/code>와 <code>좋은 주식<\/code>을 구분한다.<\/li>\n<\/ul>\n<h3>성립하지 않는 조건<\/h3>\n<ul>\n<li>[린치 본문] 좋아하는 제품이라는 이유만으로 바로 매수한다.<\/li>\n<li>[후대 해석] 이미 온 시장이 다 아는 인기 섹터의 인기 종목을 뒤늦게 추격한다.<\/li>\n<li>[후대 해석] 남의 추천을 빌려 확신만 얻고 본인 조사를 하지 않는다.<\/li>\n<li>[현대 적용] 저비용 인덱스라는 강한 기준 전략을 이길 정도의 초과 우위가 없는데도 개별주를 기본 전략으로 삼는다.<\/li>\n<li>[추론] 하락을 견딜 자금 구조와 감정 구조가 없어서 조금만 흔들려도 매도한다.<\/li>\n<li>[추론] 유형 분류 없이 모든 종목을 같은 논리로 다룬다.<\/li>\n<\/ul>","text":"[린치 본문] 공식 출판사 소개와 발췌문이 요약하는 린치의 핵심은, 개인투자자가 일상에서 제품과 서비스를 먼저 발견하고 그 뒤 재무와 성장성을 점검함으로써 기회를 잡을 수 있다는 점이다. 동시에 그 페이지는 좋아하는 가게 라는 이유만으로는 보유 근거가 아니며, 이익 전망·재무상태·경쟁·확장 계획을 조사해야 한다고 못 박는다. [현대 적용] 같은 출판사 발췌문은 과거 대비 정보 격차가 좁혀졌다고 적고 있다. 여기에 더해 최근 시장에서는 저비용 인덱스 자산이 초대형으로 커졌고, 2025년에는 미국 대형주 액티브 펀드의 다수가 S&amp;P 500을 밑돌았다는 보도가 있었다. 따라서 오늘의 개인투자자 우위는 생활 현장의 발견 + 느린 자본 + 독립 조사 + 낮은 회전율 이 동시에 있을 때만 성립한다고 보는 편이 실무적으로 정확하다. 이는 원문과 최근 시장 구조를 함께 놓고 내린 추론이다. 성립하는 조건 [린치 본문] 내가 남보다 먼저 볼 수 있는 생활·업무 현장의 관찰 포인트가 있다. [린치 본문] 발견 뒤에 재무상태, 경쟁, 확장 계획까지 직접 조사한다. [후대 해석] 기관이 관심 갖기 전의 작고 따분한 기업, 혹은 커버리지가 얕은 영역을 본다. [후대 해석] 고회전 매매보다 몇 년 보유 가능한 스토리를 찾는다. [추론] 내 전문 분야나 소비 경험이 실적 변화로 이어질 가능성을 판단할 수 있다. [추론] 가격 규율이 있고, 좋은 회사 와 좋은 주식 을 구분한다. 성립하지 않는 조건 [린치 본문] 좋아하는 제품이라는 이유만으로 바로 매수한다. [후대 해석] 이미 온 시장이 다 아는 인기 섹터의 인기 종목을 뒤늦게 추격한다. [후대 해석] 남의 추천을 빌려 확신만 얻고 본인 조사를 하지 않는다. [현대 적용] 저비용 인덱스라는 강한 기준 전략을 이길 정도의 초과 우위가 없는데도 개별주를 기본 전략으로 삼는다. [추론] 하락을 견딜 자금 구조와 감정 구조가 없어서 조금만 흔들려도 매도한다. [추론] 유형 분류 없이 모든 종목을 같은 논리로 다룬다."},{"i":31,"title":"6가지 종목 유형 완전 정리","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>유형<\/th>\n<th>핵심 특징<\/th>\n<th>기대 수익 구조<\/th>\n<th>핵심 확인 지표<\/th>\n<th>매수 기준<\/th>\n<th>보유 중 점검<\/th>\n<th>매도 기준<\/th>\n<th>주요 위험<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>저성장주<\/td>\n<td>성숙 산업, 낮은 성장, 배당 중심<\/td>\n<td>배당 + 제한적 자본차익<\/td>\n<td>배당수익률, 배당성향, 이익 안정성, 부채<\/td>\n<td>배당이 유지 가능하고 주가가 과도하게 비싸지 않을 때<\/td>\n<td>배당 유지, 시장점유율, R&amp;D·신제품 의지, 재무 악화 여부<\/td>\n<td>30~50% 상승 후 재평가, 기본 악화, 배당 매력 상실<\/td>\n<td>배당 함정, 사업다악화, 장기 정체<\/td>\n<\/tr>\n<tr>\n<td>대형우량주<\/td>\n<td>큰 규모, 비교적 안정, 완만한 성장<\/td>\n<td>20~50% 수준의 중간 수익 반복<\/td>\n<td>PER 밴드, 장기 성장률, 신규 성장동력, 경기침체 내구성<\/td>\n<td>일시적 악재로 과도하게 눌렸고 이익 기반이 유지될 때<\/td>\n<td>이익 성장 지속성, 신제품 성과, 원가절감 여지, 주요 사업부 위험<\/td>\n<td>PER 과열, 이익선 상회, 성장 둔화, 신규 전략 실패<\/td>\n<td>멀티플 압축, 사업다악화, 성장 둔화<\/td>\n<\/tr>\n<tr>\n<td>고성장주<\/td>\n<td>작은 규모, 높은 성장, 확장 여지 큼<\/td>\n<td>이익 성장 + 멀티플 확장으로 텐베거 가능<\/td>\n<td>매출/이익 성장률, 신규 점포·지역 복제, 핵심 제품 비중, 기관 보유 비중<\/td>\n<td>20~25% 내외의 높은 성장과 재현 가능한 확장 공식을 보일 때<\/td>\n<td>동일점포 매출, 신규 진출 성과, 인력 이탈, 성장 여지<\/td>\n<td>성장 2단계 종료 조짐, 과열 PER, 포화, 기관 과밀<\/td>\n<td>성장 둔화, 실행 실패, 과대평가<\/td>\n<\/tr>\n<tr>\n<td>경기순환주<\/td>\n<td>이익이 경기·수급·원자재 흐름에 민감<\/td>\n<td>사이클 전환 구간의 큰 변동 수익<\/td>\n<td>재고, 가격지표, 수요·공급, 신규 진입, 세전이익률<\/td>\n<td>침체 말기에 재고·수급 개선 신호가 보일 때<\/td>\n<td>재고 추이, 상품가격, 경쟁 심화, 수요 둔화<\/td>\n<td>재고 급증, 상품가격 하락, 경쟁 심화, 수요 둔화<\/td>\n<td>시점 오판, 사이클 종료 미인지, 과잉설비<\/td>\n<\/tr>\n<tr>\n<td>회생주<\/td>\n<td>부실·위기 후 회복 시도 기업<\/td>\n<td>생존 성공 시 큰 재평가<\/td>\n<td>현금, 부채 규모와 구조, 자산 매각, 비용 절감, 적자 지속 가능 기간<\/td>\n<td>파산 가능성이 낮아지고 회생 조치가 실제 숫자로 나타날 때<\/td>\n<td>부채 감소, 재고 정상화, 적자 축소, 핵심 사업 회복<\/td>\n<td>회생 완료 후 재평가, 부채 재증가, 재고 악화, 고객 집중 리스크 확대<\/td>\n<td>파산, 증자 희석, 거짓 회복<\/td>\n<\/tr>\n<tr>\n<td>자산주<\/td>\n<td>시장이 덜 반영한 숨은 자산 보유<\/td>\n<td>가치 실현 시 디스카운트 해소<\/td>\n<td>자산가치, 순부채, 지배구조, 자산 매각 가능성, 잠재 촉매<\/td>\n<td>자산가치 대비 큰 할인과 부채 통제가 함께 보일 때<\/td>\n<td>자산가치 유지, 부채 증가 여부, 가치 실현 촉매<\/td>\n<td>할인 축소, 자산 훼손, 무리한 증자·차입, 경영진의 가치 파괴<\/td>\n<td>가치 함정, 지배구조 문제, 촉매 부재<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"유형 핵심 특징 기대 수익 구조 핵심 확인 지표 매수 기준 보유 중 점검 매도 기준 주요 위험 저성장주 성숙 산업, 낮은 성장, 배당 중심 배당 + 제한적 자본차익 배당수익률, 배당성향, 이익 안정성, 부채 배당이 유지 가능하고 주가가 과도하게 비싸지 않을 때 배당 유지, 시장점유율, R&amp;D·신제품 의지, 재무 악화 여부 30~50% 상승 후 재평가, 기본 악화, 배당 매력 상실 배당 함정, 사업다악화, 장기 정체 대형우량주 큰 규모, 비교적 안정, 완만한 성장 20~50% 수준의 중간 수익 반복 PER 밴드, 장기 성장률, 신규 성장동력, 경기침체 내구성 일시적 악재로 과도하게 눌렸고 이익 기반이 유지될 때 이익 성장 지속성, 신제품 성과, 원가절감 여지, 주요 사업부 위험 PER 과열, 이익선 상회, 성장 둔화, 신규 전략 실패 멀티플 압축, 사업다악화, 성장 둔화 고성장주 작은 규모, 높은 성장, 확장 여지 큼 이익 성장 + 멀티플 확장으로 텐베거 가능 매출/이익 성장률, 신규 점포·지역 복제, 핵심 제품 비중, 기관 보유 비중 20~25% 내외의 높은 성장과 재현 가능한 확장 공식을 보일 때 동일점포 매출, 신규 진출 성과, 인력 이탈, 성장 여지 성장 2단계 종료 조짐, 과열 PER, 포화, 기관 과밀 성장 둔화, 실행 실패, 과대평가 경기순환주 이익이 경기·수급·원자재 흐름에 민감 사이클 전환 구간의 큰 변동 수익 재고, 가격지표, 수요·공급, 신규 진입, 세전이익률 침체 말기에 재고·수급 개선 신호가 보일 때 재고 추이, 상품가격, 경쟁 심화, 수요 둔화 재고 급증, 상품가격 하락, 경쟁 심화, 수요 둔화 시점 오판, 사이클 종료 미인지, 과잉설비 회생주 부실·위기 후 회복 시도 기업 생존 성공 시 큰 재평가 현금, 부채 규모와 구조, 자산 매각, 비용 절감, 적자 지속 가능 기간 파산 가능성이 낮아지고 회생 조치가 실제 숫자로 나타날 때 부채 감소, 재고 정상화, 적자 축소, 핵심 사업 회복 회생 완료 후 재평가, 부채 재증가, 재고 악화, 고객 집중 리스크 확대 파산, 증자 희석, 거짓 회복 자산주 시장이 덜 반영한 숨은 자산 보유 가치 실현 시 디스카운트 해소 자산가치, 순부채, 지배구조, 자산 매각 가능성, 잠재 촉매 자산가치 대비 큰 할인과 부채 통제가 함께 보일 때 자산가치 유지, 부채 증가 여부, 가치 실현 촉매 할인 축소, 자산 훼손, 무리한 증자·차입, 경영진의 가치 파괴 가치 함정, 지배구조 문제, 촉매 부재"},{"i":32,"title":"2분 독백 템플릿","html":"<h3>저성장주<\/h3>\n<ul>\n<li>나는 이 회사를 사는 이유가 무엇인가?<\/li>\n<li>배당은 안정적인가, 그리고 경기침체에도 유지 가능한가?<\/li>\n<li>이익이 꾸준히 증가하거나 최소한 유지되는가?<\/li>\n<li>시장점유율, 연구개발, 신제품 면에서 더 나빠질 조짐은 없는가?<\/li>\n<li>이 회사가 사업다악화로 가고 있지는 않은가?<\/li>\n<li>언제 팔 것인가? 배당 매력이 사라질 때인가, 30~50% 재평가가 끝났을 때인가?<\/li>\n<\/ul>\n<h3>대형우량주<\/h3>\n<ul>\n<li>나는 왜 이 대형우량주를 지금 사는가?<\/li>\n<li>시장은 무엇을 과도하게 걱정하고 있는가?<\/li>\n<li>현재 PER은 역사적 범위와 동종업계 대비 합리적인가?<\/li>\n<li>장기 성장률을 높일 현실적인 전략이 있는가?<\/li>\n<li>경기침체가 와도 버틸 수 있는가?<\/li>\n<li>언제 팔 것인가? 과열 평가, 성장 둔화, 신제품 실패, 핵심 사업부 악화 시인가?<\/li>\n<\/ul>\n<h3>고성장주<\/h3>\n<ul>\n<li>이 회사는 어디에서 어떤 방식으로 빠른 성장을 지속할 수 있는가?<\/li>\n<li>핵심 제품이나 점포 모델이 다른 지역에서도 복제 가능한가?<\/li>\n<li>성장률이 높은 이유는 구조적인가, 일시적인가?<\/li>\n<li>성장 여지가 실제로 얼마나 남아 있는가?<\/li>\n<li>시장 기대가 이미 너무 높아져 있지는 않은가?<\/li>\n<li>언제 팔 것인가? 성장 2단계 종료, 동일점포 매출 둔화, 인력 이탈, 과열 PER 발생 시인가?<\/li>\n<\/ul>\n<h3>경기순환주<\/h3>\n<ul>\n<li>이 회사는 어떤 경기 변수와 수급 변수에 가장 민감한가?<\/li>\n<li>지금은 사이클의 어디쯤인가?<\/li>\n<li>재고는 줄고 있는가, 늘고 있는가?<\/li>\n<li>상품 가격과 최종 수요는 어떤 신호를 보내는가?<\/li>\n<li>경쟁 심화나 신규 진입으로 이익이 훼손될 위험은 없는가?<\/li>\n<li>언제 팔 것인가? 재고가 쌓이고 가격이 꺾이며 수요가 둔화될 때인가?<\/li>\n<\/ul>\n<h3>회생주<\/h3>\n<ul>\n<li>이 회사는 왜 망가지게 되었고, 무엇이 회생의 핵심인가?<\/li>\n<li>살아남을 현금이 충분한가?<\/li>\n<li>부채의 규모뿐 아니라 구조도 버틸 만한가?<\/li>\n<li>어떤 비용 절감, 자산 매각, 사업 정리가 실제로 진행되고 있는가?<\/li>\n<li>핵심 사업이 정말 회복되고 있는가, 아니면 숫자만 꾸민 것인가?<\/li>\n<li>언제 팔 것인가? 회생이 완료되어 재평가가 끝났을 때, 혹은 생존 가설이 깨질 때인가?<\/li>\n<\/ul>\n<h3>자산주<\/h3>\n<ul>\n<li>시장이 놓친 자산은 정확히 무엇인가?<\/li>\n<li>그 자산은 얼마의 가치가 있고, 부채를 빼면 주주 몫이 얼마나 남는가?<\/li>\n<li>가치 실현의 촉매는 무엇인가? 매각, 분할, 청산, 기업사냥꾼, 지배구조 개선인가?<\/li>\n<li>경영진이 그 가치를 주주에게 돌려줄 의지가 있는가?<\/li>\n<li>새 차입이나 증자로 자산가치가 훼손될 위험은 없는가?<\/li>\n<li>언제 팔 것인가? 할인 폭이 충분히 해소되거나 자산가치 자체가 훼손될 때인가?<\/li>\n<\/ul>","text":"저성장주 나는 이 회사를 사는 이유가 무엇인가? 배당은 안정적인가, 그리고 경기침체에도 유지 가능한가? 이익이 꾸준히 증가하거나 최소한 유지되는가? 시장점유율, 연구개발, 신제품 면에서 더 나빠질 조짐은 없는가? 이 회사가 사업다악화로 가고 있지는 않은가? 언제 팔 것인가? 배당 매력이 사라질 때인가, 30~50% 재평가가 끝났을 때인가? 대형우량주 나는 왜 이 대형우량주를 지금 사는가? 시장은 무엇을 과도하게 걱정하고 있는가? 현재 PER은 역사적 범위와 동종업계 대비 합리적인가? 장기 성장률을 높일 현실적인 전략이 있는가? 경기침체가 와도 버틸 수 있는가? 언제 팔 것인가? 과열 평가, 성장 둔화, 신제품 실패, 핵심 사업부 악화 시인가? 고성장주 이 회사는 어디에서 어떤 방식으로 빠른 성장을 지속할 수 있는가? 핵심 제품이나 점포 모델이 다른 지역에서도 복제 가능한가? 성장률이 높은 이유는 구조적인가, 일시적인가? 성장 여지가 실제로 얼마나 남아 있는가? 시장 기대가 이미 너무 높아져 있지는 않은가? 언제 팔 것인가? 성장 2단계 종료, 동일점포 매출 둔화, 인력 이탈, 과열 PER 발생 시인가? 경기순환주 이 회사는 어떤 경기 변수와 수급 변수에 가장 민감한가? 지금은 사이클의 어디쯤인가? 재고는 줄고 있는가, 늘고 있는가? 상품 가격과 최종 수요는 어떤 신호를 보내는가? 경쟁 심화나 신규 진입으로 이익이 훼손될 위험은 없는가? 언제 팔 것인가? 재고가 쌓이고 가격이 꺾이며 수요가 둔화될 때인가? 회생주 이 회사는 왜 망가지게 되었고, 무엇이 회생의 핵심인가? 살아남을 현금이 충분한가? 부채의 규모뿐 아니라 구조도 버틸 만한가? 어떤 비용 절감, 자산 매각, 사업 정리가 실제로 진행되고 있는가? 핵심 사업이 정말 회복되고 있는가, 아니면 숫자만 꾸민 것인가? 언제 팔 것인가? 회생이 완료되어 재평가가 끝났을 때, 혹은 생존 가설이 깨질 때인가? 자산주 시장이 놓친 자산은 정확히 무엇인가? 그 자산은 얼마의 가치가 있고, 부채를 빼면 주주 몫이 얼마나 남는가? 가치 실현의 촉매는 무엇인가? 매각, 분할, 청산, 기업사냥꾼, 지배구조 개선인가? 경영진이 그 가치를 주주에게 돌려줄 의지가 있는가? 새 차입이나 증자로 자산가치가 훼손될 위험은 없는가? 언제 팔 것인가? 할인 폭이 충분히 해소되거나 자산가치 자체가 훼손될 때인가?"},{"i":33,"title":"린치식 매수 전 체크리스트","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>질문<\/th>\n<th>통과 기준<\/th>\n<th>실패 시 행동<\/th>\n<th>관련 장<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이 회사가 무엇으로 돈을 버는지 설명할 수 있는가?<\/td>\n<td>3문장 이내 설명 가능<\/td>\n<td>이해될 때까지 보류<\/td>\n<td>8장, 12장<\/td>\n<\/tr>\n<tr>\n<td>이 제품이나 서비스가 회사 매출에서 차지하는 비중은 얼마인가?<\/td>\n<td>핵심 제품 비중 파악<\/td>\n<td>제품 비중 확인 후 재검토<\/td>\n<td>7장, 13장<\/td>\n<\/tr>\n<tr>\n<td>이 회사는 6가지 유형 중 어디에 속하는가?<\/td>\n<td>1차 유형 분류 완료<\/td>\n<td>유형 분류 전 매수 금지<\/td>\n<td>7장<\/td>\n<\/tr>\n<tr>\n<td>이 회사의 성장 스토리는 무엇인가?<\/td>\n<td>구체적 성장 동인 1~3개 제시<\/td>\n<td>스토리 재정의<\/td>\n<td>10장, 11장<\/td>\n<\/tr>\n<tr>\n<td>이익은 증가하고 있는가?<\/td>\n<td>최근 수년간 추세 파악<\/td>\n<td>일회성 여부 확인<\/td>\n<td>10장<\/td>\n<\/tr>\n<tr>\n<td>PER은 성장률과 비교해 합리적인가?<\/td>\n<td>과열 아니고 역사·동종 비교 가능<\/td>\n<td>밸류에이션 재검토<\/td>\n<td>10장, 13장<\/td>\n<\/tr>\n<tr>\n<td>부채는 감당 가능한가?<\/td>\n<td>부채 규모와 구조 이해<\/td>\n<td>대차대조표 재점검<\/td>\n<td>12장, 13장<\/td>\n<\/tr>\n<tr>\n<td>재고가 위험 신호를 보내고 있지는 않은가?<\/td>\n<td>매출 대비 재고 악화 없음<\/td>\n<td>재고 추세 확인 후 보류<\/td>\n<td>13장, 15장<\/td>\n<\/tr>\n<tr>\n<td>내부자 매수나 자사주 매입이 있는가?<\/td>\n<td>긍정 신호 존재 여부 파악<\/td>\n<td>없더라도 중립 처리, 과신 금지<\/td>\n<td>8장, 15장<\/td>\n<\/tr>\n<tr>\n<td>기관투자자 보유 비중은 어느 정도인가?<\/td>\n<td>기관 과밀 여부 파악<\/td>\n<td>과밀이면 기대수익률 보수화<\/td>\n<td>8장, 15장<\/td>\n<\/tr>\n<tr>\n<td>내가 이 회사를 처음 발견한 이유가 아직 유효한가?<\/td>\n<td>발견 논리와 현재 숫자 연결<\/td>\n<td>발견 이유 재검증<\/td>\n<td>6장, 11장<\/td>\n<\/tr>\n<tr>\n<td>이 주식을 지금도 새로 살 것인가?<\/td>\n<td>예라고 답할 수 있음<\/td>\n<td>아니면 매수 금지<\/td>\n<td>18장<\/td>\n<\/tr>\n<tr>\n<td>내가 이 회사를 남보다 먼저 볼 수 있었던 이유가 있는가?<\/td>\n<td>개인적 우위 설명 가능<\/td>\n<td>단순 추격인지 점검<\/td>\n<td>서문, 6장<\/td>\n<\/tr>\n<tr>\n<td>좋은 회사와 좋은 주식을 구분했는가?<\/td>\n<td>품질과 가격을 분리 평가<\/td>\n<td>가격 재검토<\/td>\n<td>10장<\/td>\n<\/tr>\n<tr>\n<td>시장 전망이 아니라 기업 전망으로 사고 있는가?<\/td>\n<td>거시 예측 의존 낮음<\/td>\n<td>거시 의존 논리 삭제<\/td>\n<td>5장<\/td>\n<\/tr>\n<tr>\n<td>12개월 안에 쓸 돈이 아닌가?<\/td>\n<td>장기 자금임이 확인됨<\/td>\n<td>자금 분리<\/td>\n<td>4장<\/td>\n<\/tr>\n<tr>\n<td>내 성향상 이 변동성을 견딜 수 있는가?<\/td>\n<td>최대 손실 가정 견딜 수 있음<\/td>\n<td>비중 축소 또는 제외<\/td>\n<td>4장, 16장<\/td>\n<\/tr>\n<tr>\n<td>이 회사의 경쟁우위는 단순한 인기와 다른가?<\/td>\n<td>틈새·브랜드·원가·반복구매 근거 존재<\/td>\n<td>경쟁우위 재검토<\/td>\n<td>8장<\/td>\n<\/tr>\n<tr>\n<td>이익 증가는 어떤 방식으로 가능한가?<\/td>\n<td>비용절감/가격인상/확장 등 성장 동인이 명확<\/td>\n<td>실행 가능성 재검토<\/td>\n<td>10장<\/td>\n<\/tr>\n<tr>\n<td>소문이 아니라 확인 가능한 사실을 갖고 있는가?<\/td>\n<td>공시·현장·숫자 근거 보유<\/td>\n<td>사실 확인 루틴 재수행<\/td>\n<td>12장<\/td>\n<\/tr>\n<tr>\n<td>회사가 확장 공식을 복제할 수 있는가?<\/td>\n<td>고성장주라면 복제 증거 존재<\/td>\n<td>성장주 논리 수정<\/td>\n<td>15장<\/td>\n<\/tr>\n<tr>\n<td>이 회사는 인기 업종의 인기 종목이 아닌가?<\/td>\n<td>과열 대중성 낮음<\/td>\n<td>기대수익률 보수화 또는 제외<\/td>\n<td>9장<\/td>\n<\/tr>\n<tr>\n<td>제2의 아무개 논리로 사고 있지 않은가?<\/td>\n<td>독자적 경쟁력 확인<\/td>\n<td>비교 논리 폐기<\/td>\n<td>9장<\/td>\n<\/tr>\n<tr>\n<td>사업다각화가 아니라 사업다악화는 아닌가?<\/td>\n<td>인수·신사업의 경제성 확인<\/td>\n<td>경영진 자본배분 재평가<\/td>\n<td>9장, 17장<\/td>\n<\/tr>\n<tr>\n<td>단일 고객 의존이 과도하지 않은가?<\/td>\n<td>고객 집중도 허용 가능<\/td>\n<td>안정성 할인 적용<\/td>\n<td>9장, 17장<\/td>\n<\/tr>\n<tr>\n<td>현금 보유와 순현금 상태는 어떤가?<\/td>\n<td>현금 완충력 파악<\/td>\n<td>생존성 재평가<\/td>\n<td>12장, 13장<\/td>\n<\/tr>\n<tr>\n<td>배당이 핵심 논리라면 배당성향과 연속배당 기록을 확인했는가?<\/td>\n<td>저성장주 기준 충족<\/td>\n<td>배당 논리 폐기<\/td>\n<td>11장, 15장<\/td>\n<\/tr>\n<tr>\n<td>장
