많은 경우 무절제한 상황으로 인해 치명적인 결과가 발생할 것이다. 특히 기본적인 주기들은 결코 끝이 없고 주기는 절대로 멈추는 법이 없다. 과거에 대해 알고, 과거가 반복된다는 것을 이해하는 사람이라면 누구나 \"이번엔 달라\"라는 위험한 사고를 두려워해야 하고 이런 형태의 실수가 발생하면 반드시 알아볼 수 있어야 한다. 우리는 대체로 미래는 과거와 많이 비슷할 것이고, 상승 주기가 있고 하락 주기가 있을 것이라고 결론 내린다. 상황이 호전될 것이라고 주장하기에 적절한 때도 있는데, 이는 시세가 폭락해서 모두가 헐값에 자산을 팔고 있을 때다. 시세가 기록적인 수준을 보이고 있어서 과거에 한 번도 진실이 아니었던 것을 긍정적으로 합리화하는 것도 위험하다. 주기를 무시하고 추세를 추정하는 것은 투자자가 할 수 있는 가장 위험한 일 중 하나다. 사람들은 성공하는 기업들은 끝까지 성공하고, 초과 성과를 내는 투자는 끝까지 초과 성과를 내며, 그렇지 못한 기업이나 투자는 끝까지 실패할 것처럼 행동하나 현실은 이와 반대로 될 가능성이 크다. 두 번째나 세 번째로 도전하는 투자자들은 그쯤 되면 경험이 있으므로, 주기의 중단은 결코 일어나지 않는다는 것을 깨닫고, 그 깨달음을 유리하게 이용해야 한다. [구조화] [막스 본문] 주기는 예측의 도구가 아니라 과열과 침체를 읽는 사고틀이다. [추론] 이 장은 “이번엔 다르다”를 의심하는 장이며, 이어지는 9장 시계추와 15장 시장온도 점검표의 기반이 된다. [현대 적용] 신용 확장, 낮아진 기준, 넘치는 자본, 신상품 확산은 사이클 후반부의 반복 신호다. [실전 질문] 지금 시장은 어떤 주기를 타고 있는가? 참가자들은 현재 상태가 영구적이라고 가정하고 있지 않은가? 신용 기준은 강화되는가, 완화되는가? 자본이 부족해서 기회가 생기는가, 너무 많아서 가격이 망가지는가? “이번에는 다르다”는 어떤 서사로 정당화되고 있는가? [다른 책과의 연결] [후대 해석] 강한 연결: 코스톨라니(순환과 심리), 하우절(역사 반복과 인간 본성), 보글(주기 예측보다 규율), 그레이엄(인기와 비인기의 왕복). [오해 방지] [추론] 주기를 안다고 해서 전환 시점을 정밀 예측할 수 있는 것은 아니다. [추론] 주기 관찰은 전량 매수·전량 매도의 타이밍 기술이 아니라, 공격/방어 강도를 조절하는 기술이다."},{"i":10,"title":"09. 투자시장의 특성을 이해하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>시장 상황이 좋고 가격이 오르면, 투자자들은 신중함 따위는 잊고 매입을 서두르고 그러다 혼란의 시기가 도래하여 자산이 저가 매입 대상이 되면, 투자자들은 리스크를 감수할 의지를 잃고 매각을 서두른다. 이러한 현상은 계속될 것이다.<\/li>\n<li>증권시장의 심리 변화는 마치 시계추의 움직임을 닮았다. 시계추가 좌우로 움직이며 그리는 아치 모양의 중간 지점은 시계추의 평균적인 위치를 가장 잘 보여주지만 실상 그 지점에 머무는 시간은 매우 짧다. 대신 시계추는 거의 항상 아치의 한쪽 끝을 향해, 또는 반대쪽 끝을 향해 움직이고 있고 그러다 시계추가 어느 한끝에 다다를 때마다 추는 곧바로 다시 중심을 향해 움직인다.<\/li>\n<li>양극단을 오가는 규칙적인 움직임은 투자 세계에서 가장 신뢰할 수 있는 특징 중 하나이고 투자자 심리는 어느 한쪽으로 치우치지 않는 '중도'보다는 양극단에서 보내는 시간이 훨씬 많다.<\/li>\n<li>호황과 침체 사이, 긍정적 사건에 반색하는 것과 부정적 사건에 집착하는 것 사이, 고평가와 저평가 사이 그리고 추가로 탐욕 vs 공포 사이.<\/li>\n<li>탐욕 vs 공포 주기는 리스크에 대한 태도가 바뀌는 것에 달려 있다.<\/li>\n<li>탐욕이 만연하다는 것은 투자자들이 리스크에 대해 안심하는 수준이 높고, 수익에 대한 관심으로 리스크를 부담하겠다는 생각이 크다는 것을 의미한다.<\/li>\n<li>반대로 공포가 만연해 있는 것은 리스크 회피 수준이 높다는 것을 나타낸다.<\/li>\n<li>리스크에 대한 투자자들의 태도는 확실히 변동이 심하고 투자자들이 리스크를 꺼리지만, 보다 큰 예상 수익을 위해 리스크를 부담하도록 유인 또는 매수되어야 한다.<\/li>\n<li>리스크에 대한 태도에 가장 큰 영향을 미치는 것 중에 하나는 시계추의 움직임이다.<\/li>\n<li>투자의 주요 두 가지 리스크는 자금 손실에 대한 리스크와 기회를 놓치는 리스크이고 리스크를 제거하기 위해 두 가지 중 하나를 크게 제거하는 것은 가능하지만, 두 가지 다 제거할 수는 없다.<\/li>\n<li>대부분의 사람들은 시장 상황이 좋고 가격이 오르면 투자자들은 신중함 따위는 잊고 매입을 서두르고 그러다 혼란의 시기가 도래하여 자산이 저가 매입 대상이 되면, 투자자들은 리스크를 감수할 의지를 잃고 매각을 서두른다. 이러한 현상은 계속될 것이다.<\/li>\n<li>강세장 3단계<ul>\n<li>1단계: 소수의 미래 지향적인 사람들이 상황이 호전될 것이라고 믿기 시작할 때<\/li>\n<li>2단계: 대부분의 투자자들이 실제로 상황이 호전되고 있다는 것을 알게 될 때<\/li>\n<li>3단계: 모두가 상황이 계속해서 호전될 것이라는 결론을 내릴 때<\/li>\n<\/ul>\n<\/li>\n<li>\"현자가 시작한 일을 바보가 마지막에 뛰어들어 마무리한다.\" 가장 중요한 것은 초강세장의 후반기에 사람들은 호황이 끝없이 지속될 것이라고 추정하면서 기꺼이 높은 가격에 주가를 지불한다는 것이다.<\/li>\n<li>약세장 3단계<ul>\n<li>1단계: 소수의 신중한 투자자들이 강세가 만연해 있음에도 불구하고 상황이 언제나 장밋빛일 수는 없다는 것을 인식할 때<\/li>\n<li>2단계: 대부분의 투자자들이 상황이 악화되고 있음을 인식할 때<\/li>\n<li>3단계: 모든 사람이 상황이 악화될 수밖에 없음을 확신할 때<\/li>\n<\/ul>\n<\/li>\n<li>금융권이 종말을 맞이하지 않는다면, 3단계쯤 우리는 일생일대의 투자 기회를 맞이할 수 있을 것이며 경기의 바닥은 밀물 또한 있다는 것을 모두가 잊을 때 찾아오고, 우리는 그때를 위해 살고 있는 것이다.<\/li>\n<li>무슨 일이 일어나고 있고, 그것이 무엇을 내포하고 있는지를 인식하는 사람들에게 기회가 주어진다는 것이다.<\/li>\n<li>시계추의 한쪽 끝, 가장 암울한 시기에 앞으로 상황이 더없이 좋아질 것이라는 생각을 하기 위해 분석력, 객관성, 결의, 이왕이면 상상력도 필요하다.<\/li>\n<li>모두가 불가능한 것, 영원히 좋아지기만 할 것이라고 추정하고 가격을 정하면 뼈아픈 손실을 입는 상황이 발생할 것이다.<\/li>\n<li>시계추 핵심 내용 정리<ul>\n<li>공포와 탐욕처럼 극단적으로 대립되는 이론에서 시계추는 양극단 사이의 중간 지점에 주로 머문다. 그러나 그 시간은 길지 않다.<\/li>\n<li>투자자 심리가 작용하기 때문에 시계추는 평소 한쪽 끝에서 반대쪽 끝으로 왔다 갔다 한다.<\/li>\n<li>시계추는 한쪽 끝을 향해 계속 움직일 수 없고, 그 끝에 영원히 머물러 있을 수도 없다.<\/li>\n<li>시계추처럼 한쪽 끝을 향해 투자자 심리가 움직이면서 결국 역방향으로 되돌아가는 데 필요한 동력이 계속 만들어진다.<\/li>\n<li>때로 억제된 동력은 그 자체로 역방향 움직임의 원인이 된다. 즉 한쪽 끝을 향한 시계추의 움직임이 추의 중심을 바로잡아 준다.<\/li>\n<li>끝에서 되돌아올 때 추의 속도는 끝을 향해 갈 때보다 보통 더 빠르다. 그러므로 걸리는 시간도 더 짧다.<\/li>\n<\/ul>\n<\/li>\n<li>우리가 절대로 알 수 없는 것들<ul>\n<li>추가 아치를 그리며 얼마나 멀리 움직일 것인가.<\/li>\n<li>무엇이 움직이던 추를 멈추게 하고, 반대 방향으로 되돌아오게 하는가.<\/li>\n<li>방향 전환이 언제 일어날 것인가.<\/li>\n<li>반대 방향으로 얼마나 멀리 움직일 것인가.<\/li>\n<\/ul>\n<\/li>\n<li>강세장의 상황이 계속 유지되려면 시장 환경이 탐욕, 낙관주의, 과열, 확신, 리스크 허용, 쉽게 믿는 성향, 대담성, 공격성 등의 특징을 가져야 한다.<\/li>\n<li>그러나 이 같은 특징이 시장을 영원히 지배하지는 않을 것이며 공포, 비관주의, 분별력, 불확실성, 리스크 회피, 의심, 신중함, 절제 등에 자리를 내주게 된다.<\/li>\n<li>불황은 호황의 소산이기에, 불황의 원인은 반락이 시작된 특정 사건 때문이 아니라, 이전의 호황으로 인한 과열 때문이라는 분석이 더 정확하다.<\/li>\n<li>우리가 확신을 가져도 되는 몇 가지가 있는데, 그 중 하나는 극단적인 시장의 움직임에는 반전이 있을 것이고 시계추가 한쪽 방향으로 영원히 움직일 것이라고, 또는 그 끝에서 계속 머물 것이라고 믿는 사람들은 결국 막대한 손실을 입을 것이다.<\/li>\n<li>시계추의 움직임을 이해하는 사람들은 엄청난 이익을 얻을 수 있을 것이다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 시장 심리를 축으로 가격과 리스크가 오버슈트하는 방식, 즉 시계추를 설명한다.<\/li>\n<li>[추론] 8장이 구조적 주기라면 9장은 심리적 주기다. 두 장을 합쳐야 시장 행동 모델이 완성된다.<\/li>\n<li>[현대 적용] 시계추는 지수 방향보다 심리의 극단을 보는 도구다. “모두가 더 좋을 것이라 믿는가, 더 나쁠 것이라 믿는가”가 핵심이다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>지금 시계추는 어느 쪽 끝에 더 가까운가?<\/li>\n<li>강세장/약세장의 몇 단계에 와 있는가?<\/li>\n<li>시장의 확신은 합리적 판단인가, 가격 상승의 자기강화인가?<\/li>\n<li>기회 손실과 영구 손실 중 현재 더 큰 리스크는 무엇인가?<\/li>\n<li>내가 느끼는 감정은 시장의 어느 국면을 반영하는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 코스톨라니(낙관과 비관의 왕복), 하우절(심리 편향), 그레이엄(미스터 마켓), 보글(주기 예측 대신 규율 유지).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 시계추는 정확한 전환 시점을 주지 않는다.<\/li>\n<li>[추론] 막스의 시계추 이해는 거래 빈도 증가의 근거가 아니라, 극단 구간에서 태도 조절의 근거다.<\/li>\n<\/ul>","text":"기존 노트 시장 상황이 좋고 가격이 오르면, 투자자들은 신중함 따위는 잊고 매입을 서두르고 그러다 혼란의 시기가 도래하여 자산이 저가 매입 대상이 되면, 투자자들은 리스크를 감수할 의지를 잃고 매각을 서두른다. 이러한 현상은 계속될 것이다. 증권시장의 심리 변화는 마치 시계추의 움직임을 닮았다. 시계추가 좌우로 움직이며 그리는 아치 모양의 중간 지점은 시계추의 평균적인 위치를 가장 잘 보여주지만 실상 그 지점에 머무는 시간은 매우 짧다. 대신 시계추는 거의 항상 아치의 한쪽 끝을 향해, 또는 반대쪽 끝을 향해 움직이고 있고 그러다 시계추가 어느 한끝에 다다를 때마다 추는 곧바로 다시 중심을 향해 움직인다. 양극단을 오가는 규칙적인 움직임은 투자 세계에서 가장 신뢰할 수 있는 특징 중 하나이고 투자자 심리는 어느 한쪽으로 치우치지 않는 '중도'보다는 양극단에서 보내는 시간이 훨씬 많다. 호황과 침체 사이, 긍정적 사건에 반색하는 것과 부정적 사건에 집착하는 것 사이, 고평가와 저평가 사이 그리고 추가로 탐욕 vs 공포 사이. 탐욕 vs 공포 주기는 리스크에 대한 태도가 바뀌는 것에 달려 있다. 탐욕이 만연하다는 것은 투자자들이 리스크에 대해 안심하는 수준이 높고, 수익에 대한 관심으로 리스크를 부담하겠다는 생각이 크다는 것을 의미한다. 반대로 공포가 만연해 있는 것은 리스크 회피 수준이 높다는 것을 나타낸다. 리스크에 대한 투자자들의 태도는 확실히 변동이 심하고 투자자들이 리스크를 꺼리지만, 보다 큰 예상 수익을 위해 리스크를 부담하도록 유인 또는 매수되어야 한다. 리스크에 대한 태도에 가장 큰 영향을 미치는 것 중에 하나는 시계추의 움직임이다. 투자의 주요 두 가지 리스크는 자금 손실에 대한 리스크와 기회를 놓치는 리스크이고 리스크를 제거하기 위해 두 가지 중 하나를 크게 제거하는 것은 가능하지만, 두 가지 다 제거할 수는 없다. 대부분의 사람들은 시장 상황이 좋고 가격이 오르면 투자자들은 신중함 따위는 잊고 매입을 서두르고 그러다 혼란의 시기가 도래하여 자산이 저가 매입 대상이 되면, 투자자들은 리스크를 감수할 의지를 잃고 매각을 서두른다. 이러한 현상은 계속될 것이다. 강세장 3단계 1단계: 소수의 미래 지향적인 사람들이 상황이 호전될 것이라고 믿기 시작할 때 2단계: 대부분의 투자자들이 실제로 상황이 호전되고 있다는 것을 알게 될 때 3단계: 모두가 상황이 계속해서 호전될 것이라는 결론을 내릴 때 \"현자가 시작한 일을 바보가 마지막에 뛰어들어 마무리한다.\" 가장 중요한 것은 초강세장의 후반기에 사람들은 호황이 끝없이 지속될 것이라고 추정하면서 기꺼이 높은 가격에 주가를 지불한다는 것이다. 약세장 3단계 1단계: 소수의 신중한 투자자들이 강세가 만연해 있음에도 불구하고 상황이 언제나 장밋빛일 수는 없다는 것을 인식할 때 2단계: 대부분의 투자자들이 상황이 악화되고 있음을 인식할 때 3단계: 모든 사람이 상황이 악화될 수밖에 없음을 확신할 때 금융권이 종말을 맞이하지 않는다면, 3단계쯤 우리는 일생일대의 투자 기회를 맞이할 수 있을 것이며 경기의 바닥은 밀물 또한 있다는 것을 모두가 잊을 때 찾아오고, 우리는 그때를 위해 살고 있는 것이다. 무슨 일이 일어나고 있고, 그것이 무엇을 내포하고 있는지를 인식하는 사람들에게 기회가 주어진다는 것이다. 시계추의 한쪽 끝, 가장 암울한 시기에 앞으로 상황이 더없이 좋아질 것이라는 생각을 하기 위해 분석력, 객관성, 결의, 이왕이면 상상력도 필요하다. 모두가 불가능한 것, 영원히 좋아지기만 할 것이라고 추정하고 가격을 정하면 뼈아픈 손실을 입는 상황이 발생할 것이다. 시계추 핵심 내용 정리 공포와 탐욕처럼 극단적으로 대립되는 이론에서 시계추는 양극단 사이의 중간 지점에 주로 머문다. 그러나 그 시간은 길지 않다. 투자자 심리가 작용하기 때문에 시계추는 평소 한쪽 끝에서 반대쪽 끝으로 왔다 갔다 한다. 시계추는 한쪽 끝을 향해 계속 움직일 수 없고, 그 끝에 영원히 머물러 있을 수도 없다. 시계추처럼 한쪽 끝을 향해 투자자 심리가 움직이면서 결국 역방향으로 되돌아가는 데 필요한 동력이 계속 만들어진다. 때로 억제된 동력은 그 자체로 역방향 움직임의 원인이 된다. 즉 한쪽 끝을 향한 시계추의 움직임이 추의 중심을 바로잡아 준다. 끝에서 되돌아올 때 추의 속도는 끝을 향해 갈 때보다 보통 더 빠르다. 그러므로 걸리는 시간도 더 짧다. 우리가 절대로 알 수 없는 것들 추가 아치를 그리며 얼마나 멀리 움직일 것인가. 무엇이 움직이던 추를 멈추게 하고, 반대 방향으로 되돌아오게 하는가. 방향 전환이 언제 일어날 것인가. 반대 방향으로 얼마나 멀리 움직일 것인가. 강세장의 상황이 계속 유지되려면 시장 환경이 탐욕, 낙관주의, 과열, 확신, 리스크 허용, 쉽게 믿는 성향, 대담성, 공격성 등의 특징을 가져야 한다. 그러나 이 같은 특징이 시장을 영원히 지배하지는 않을 것이며 공포, 비관주의, 분별력, 불확실성, 리스크 회피, 의심, 신중함, 절제 등에 자리를 내주게 된다. 불황은 호황의 소산이기에, 불황의 원인은 반락이 시작된 특정 사건 때문이 아니라, 이전의 호황으로 인한 과열 때문이라는 분석이 더 정확하다. 우리가 확신을 가져도 되는 몇 가지가 있는데, 그 중 하나는 극단적인 시장의 움직임에는 반전이 있을 것이고 시계추가 한쪽 방향으로 영원히 움직일 것이라고, 또는 그 끝에서 계속 머물 것이라고 믿는 사람들은 결국 막대한 손실을 입을 것이다. 시계추의 움직임을 이해하는 사람들은 엄청난 이익을 얻을 수 있을 것이다. [구조화] [막스 본문] 이 장은 시장 심리를 축으로 가격과 리스크가 오버슈트하는 방식, 즉 시계추를 설명한다. [추론] 8장이 구조적 주기라면 9장은 심리적 주기다. 두 장을 합쳐야 시장 행동 모델이 완성된다. [현대 적용] 시계추는 지수 방향보다 심리의 극단을 보는 도구다. “모두가 더 좋을 것이라 믿는가, 더 나쁠 것이라 믿는가”가 핵심이다. [실전 질문] 지금 시계추는 어느 쪽 끝에 더 가까운가? 강세장/약세장의 몇 단계에 와 있는가? 시장의 확신은 합리적 판단인가, 가격 상승의 자기강화인가? 기회 손실과 영구 손실 중 현재 더 큰 리스크는 무엇인가? 내가 느끼는 감정은 시장의 어느 국면을 반영하는가? [다른 책과의 연결] [후대 해석] 강한 연결: 코스톨라니(낙관과 비관의 왕복), 하우절(심리 편향), 그레이엄(미스터 마켓), 보글(주기 예측 대신 규율 유지). [오해 방지] [추론] 시계추는 정확한 전환 시점을 주지 않는다. [추론] 막스의 시계추 이해는 거래 빈도 증가의 근거가 아니라, 극단 구간에서 태도 조절의 근거다."},{"i":11,"title":"10. 부정적 영향과 맞서라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>더 많이 바라는 욕망, 좋은 기회를 놓치는 것에 대한 두려움, 다른 사람과 비교하는 경향, 대중의 영향, 확실한 것에 대한 바람. 이러한 요소들은 어디에나 있다.<\/li>\n<li>이 같은 요소들은 한데 합쳐져 대부분의 투자자들과 시장에 엄청난 영향을 미치고 그로 인해 실수가 발생하고 그런 실수는 자주, 널리, 반복해서 일어난다.<\/li>\n<li>비효율성, 예를 들면 잘못된 가격, 잘못된 인식, 다른 이들이 하는 실수는 우수한 실적을 낼 수 있는 잠재적인 기회를 제공하고 이를 잘 활용하면 지속적으로 초과 실적을 낼 수 있는 유일한 방법이 될 수 있고 투자자 스스로 다른 이들과 차별화하려면 이런 실수를 하지 않아야 한다.<\/li>\n<li>투자는 인간이 하는 일이며, 인간 대부분이 자신의 감정과 심리를 따를 수밖에 없기 때문에 실수가 발생한다.<\/li>\n<li>많은 이들이 분석을 통해 비슷한 인지적 결론에 도달할 테지만, 저마다 심리로부터 영향을 받는 정도가 다르기 때문에 비슷하게 나온 결론을 가지고 만들 수 있는 결과는 매우 차이가 난다.<\/li>\n<li>가장 큰 투자 실수는 정보나 분석적인 요인에서 나오는 것이 아니라, 심리적인 요인에서 나온다.<\/li>\n<li>투자자들을 노력하게 만드는 첫 번째 감정은 돈에 대한 '욕망'으로, 이러한 욕망은 특히 탐욕으로 변한다.<\/li>\n<li>탐욕은 매우 강력한 힘을 가지고 있어서 상식, 리스크 회피, 신중함, 분별력, 논리, 고통스러운 과거의 교훈, 의지, 두려움, 그 밖에도 투자자들을 골치 아픈 문제로부터 멀어지게 해줄 수 있는 다른 모든 요소들을 충분히 이길 수 있다.<\/li>\n<li>탐욕과 낙관주의에 의해 행동 시 시간이 지나고 나면 무엇이 잘못되었는지 모두가 알게 될 것이다. 자신들의 기대가 비현실적이었고, 리스크가 무시되었다는 것을 말이다.<\/li>\n<li>탐욕의 반대는 '공포'로, 탐욕과 마찬가지로 과잉을 의미하며, 그런 점에서 패닉 상태에 더 가깝다.<\/li>\n<li>논리, 과거의 일, 전통적 기준을 고려하지 않고 묵살해버리고 현실 가능성 없는 제의를 수락하는 행위를 조심하라.<\/li>\n<li>\"자기기만보다 쉬운 것은 없다. 사람들은 각자의 바람을 위해 그것이 진실이라고 믿는다.\"<\/li>\n<li>투자는 진지하게 하는 것이지 재미를 위해서 하는 것이 아니기 때문에, 현실적으로 말이 안 되는 것이 있는지 계속해서 경계해야 한다. 다시 말해, 투자 프로세스에는 상당한 불신이 필요하고 충분히 의심하지 않으면 투자 손실이라는 결과가 발생하기 때문이다.<\/li>\n<li>IMF 사후 분석 두 가지 결론은 '의심스러울 정도로 좋았다.'와 '무슨 생각을 했던 것일까?'이다.<\/li>\n<li>투자자들이 착각에 빠지는 이유는 종종 탐욕에 이끌려 과거의 교훈을 너무 쉽게 무시하거나 외면하는 태도에 있다.<\/li>\n<li>\"과거 금융 사건에 대한 극도로 짧은 기억력\"이 시장 참여자가 과거의 패턴이 반복된다는 사실을 인식하지 못하게 만들고, 결국 이러한 현상이 불가피하게 되풀이된다는 점을 깨닫지 못하게 한다.<\/li>\n<li>투자만큼 역사를 반영하는 분야도 없고 과거의 경험은 그저 기억의 일부가 되어, 현재의 불가사의를 평가할 통찰력을 가지지 못한 사람들이나 의지하는 원초적 수단으로 평가절하된다.<\/li>\n<li>투자자들은 항상 묘책을 찾으며, 모든 사람들이 원하는 것은 위험을 감수하지 않고 부자가 되는 것이다. 그러나 묘책은 현실에 실재하지 않으며, 어떤 투자 전략도 리스크 없이 고수익을 내지 못한다.<\/li>\n<li>시장은 매우 역동적이며, 무엇보다 참가자에게 이례적인 수익을 낼 만한 기회를 주지 않는 방향으로 움직이고 묘책이 멀리 있지 않을 것이라는 믿음은 결국 감당할 수 없는 자본손실을 가져올 수 있다.<\/li>\n<li>\"가격 상승은 판단력을 흐리는 마약이다.\" 그러나 일이 터진 다음에는 열기는 거품이라고 불린다.<\/li>\n<li>다수의 견해에 저항하지 않고, 설사 그것이 확연하게 비현실적이라도 따라가는 경향이 있다.<\/li>\n<li>시장 심리를 따라야 한다는 압박감과 부를 얻고 싶다는 욕망이 합쳐지면, 사람들은 자신의 의지와 의심을 버리고 스스로에게 내재된 리스크 회피를 망각하며 이치에 안 맞는 것을 믿게 된다.<\/li>\n<li>'시기심': 탐욕의 영향이 얼마나 부정적이든 간에, 탐욕은 사람들에게 계속해서 더 많은 것을 바라게 할 것이고, 그 힘은 다른 사람들과의 비교를 통해 더욱 강해진다.<\/li>\n<li>우리 자신을 다른 사람들과 비교하는 경향과, 이런 경향이 생산적이고 분석적이어야 하는 프로세스에 미칠 수 있는 유해한 영향이 있다.<\/li>\n<li>자아는 단기간의 평가 및 비교, 신중하지 못한 투자자의 호실적 등의 상황에서 객관적으로 계산적인 태도를 유지하는 데 커다란 방해가 될 수 있다.<\/li>\n<li>신중한 투자자들은 잘 알려지지 않은 자산에 부지런히 투자하여, 호황에는 확실한 수익을 내고 불황에는 다른 사람들보다 손실을 적게 낼 수 있다.<\/li>\n<li>신중한 투자자들은 자신들이 얼마나 많이 모르는지 너무 잘 알고 있기 때문에, 가장 위험한 행동에 동참하지 않고 자신의 자아를 억제한다.<\/li>\n<li>포기는 주로 시장 주기의 후반부에 자주 나타나는 투자자의 행동이고 경제적, 심리적 압박감이 저항할 수 없을 정도가 되면 포기하고 시류에 편승한다.<\/li>\n<li>지나치게 고가인 주식이 더 비싸지거나, 너무 저가인 주식의 가격이 계속 하락하면서 옳은 일을 하기는 더 쉬워질 것이다. 전자는 팔고, 후자는 사면 되는 것인데 그러나 막상 현실에서는 말처럼 쉽지 않다.<\/li>\n<li>더 많이 바라는 욕망, 좋은 기회를 놓치는 데 대한 두려움, 다른 사람들과 비교하는 경향, 대중의 영향, 확실한 것에 대한 바람, 이런 요소들은 어디에나 있고 한데 합쳐져 대부분의 투자자들과 시장에 엄청난 영향을 미친다. 그로 인해 실수가 발생하고, 그런 실수는 자주, 널리, 반복해서 일어난다.<\/li>\n<li>투자자들이 상식을 포기하게 되는 원인은 탐욕, 공포, 시기심, 자기기만, 자아 등의 감정들 때문일 것이다.<\/li>\n<li>거품 속에서 금전적 손실을 피하려면, 탐욕과 인간의 오류가 긍정적인 요소를 지나치게 과대평가하고 부정적인 요소를 간과하게 만들 때 그 흐름에 휩쓸리지 않는 것이 핵심이다.<\/li>\n<li>시장 최고점에 도달했을 때 매수를 피하는 것은 어려운 일이며, 그보다 더 어려운 것은 매도하는 것이고 시장이 바닥을 찍었을 때 매도하지 않는 것은 어렵고, 그보다 훨씬 더 어려운 것은 매수하는 것이다.<\/li>\n<li>이에 대한 간단한 해결책 역시 없다. 언제 시장이 비이성적인 극단까지 간 것인지 말해줄 공식이란 없으며, 이런 결정을 내릴 때 옳은 결정을 내릴 수 있도록 당신을 지켜줄 소위 바보 방지 대책도 없고, 실패를 부추기는 감정으로부터 당신을 보호해줄 묘약 또한 없다.<\/li>\n<li>\"원래 쉬운 것이 아니다.\" (찰리 멍거)<\/li>\n<li>성공 가능성을 높이기 위해서는 아래와 같은 대책들을 준비해야 한다.<ul>\n<li>내재가치에 대해 확실히 이해해야 한다.<\/li>\n<li>가격이 가치와 멀어질 때 해야 하는 행동을 고수한다.<\/li>\n<li>과거의 주기를 충분히 숙지하여 시장이 과열되면 보상을 받는 것이 아니라, 결국에 대가를 치른다는 것을 알아야 한다.<\/li>\n<li>시장이 극단적인 상황일 때 투자 프로세스에 서서히 영향을 미치는 심리를 철저하게 이해한다.<\/li>\n<li>'믿기 어려울 정도로 좋은' 상황은, 말 그대로 대체로 믿으면 안 된다는 것을 꼭 기억한다.<\/li>\n<li>잘못 평가되고 있던 시장이 더욱 잘못 평가되는 동안, 언제나 그렇듯 기꺼이 잘못된 것을 보려는 마음을 갖는다.<\/li>\n<li>같은 마음인 친구들과 동료들로부터 지지를 주고받는다.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 비효율의 근본 원인을 심리에서 찾는다.<\/li>\n<li>[추론] 2차적 사고의 가장 현실적인 적은 정보 부족이 아니라 감정 오염이다.<\/li>\n<li>[현대 적용] 실무적으로는 FOMO, 비교 수익률 압박, 승자추종, 확신 과잉을 정기적으로 점검하는 감정 리스크 로그가 필요하다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 판단을 밀어붙이는 감정은 탐욕인가, 공포인가, 시기심인가?<\/li>\n<li>내가 지금 사실을 보는가, 내 바람을 보는가?<\/li>\n<li>남들이 버는 돈을 보고 기준을 낮추고 있지 않은가?<\/li>\n<li>시장이 말이 안 되는 방향으로 더 갈 때 버틸 준비가 있는가?<\/li>\n<li>내 판단을 지지하고 견제해줄 동료나 문서화된 원칙이 있는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 가장 강한 연결은 하우절과 코스톨라니다. 두 저자 모두 돈과 시장이 결국 인간 심리의 산물임을 강조한다. 그레이엄의 미스터 마켓도 여기와 연결된다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 심리 분석이 곧 단기 타이밍을 뜻하지는 않는다.<\/li>\n<li>[추론] 군중과 반대로 느낀다고 자동으로 옳아지는 것이 아니다. 감정을 거슬러도 가치 판단이 틀리면 손실이 난다.<\/li>\n<\/ul>","text":"기존 노트 더 많이 바라는 욕망, 좋은 기회를 놓치는 것에 대한 두려움, 다른 사람과 비교하는 경향, 대중의 영향, 확실한 것에 대한 바람. 이러한 요소들은 어디에나 있다. 이 같은 요소들은 한데 합쳐져 대부분의 투자자들과 시장에 엄청난 영향을 미치고 그로 인해 실수가 발생하고 그런 실수는 자주, 널리, 반복해서 일어난다. 비효율성, 예를 들면 잘못된 가격, 잘못된 인식, 다른 이들이 하는 실수는 우수한 실적을 낼 수 있는 잠재적인 기회를 제공하고 이를 잘 활용하면 지속적으로 초과 실적을 낼 수 있는 유일한 방법이 될 수 있고 투자자 스스로 다른 이들과 차별화하려면 이런 실수를 하지 않아야 한다. 투자는 인간이 하는 일이며, 인간 대부분이 자신의 감정과 심리를 따를 수밖에 없기 때문에 실수가 발생한다. 많은 이들이 분석을 통해 비슷한 인지적 결론에 도달할 테지만, 저마다 심리로부터 영향을 받는 정도가 다르기 때문에 비슷하게 나온 결론을 가지고 만들 수 있는 결과는 매우 차이가 난다. 가장 큰 투자 실수는 정보나 분석적인 요인에서 나오는 것이 아니라, 심리적인 요인에서 나온다. 투자자들을 노력하게 만드는 첫 번째 감정은 돈에 대한 '욕망'으로, 이러한 욕망은 특히 탐욕으로 변한다. 탐욕은 매우 강력한 힘을 가지고 있어서 상식, 리스크 회피, 신중함, 분별력, 논리, 고통스러운 과거의 교훈, 의지, 두려움, 그 밖에도 투자자들을 골치 아픈 문제로부터 멀어지게 해줄 수 있는 다른 모든 요소들을 충분히 이길 수 있다. 탐욕과 낙관주의에 의해 행동 시 시간이 지나고 나면 무엇이 잘못되었는지 모두가 알게 될 것이다. 자신들의 기대가 비현실적이었고, 리스크가 무시되었다는 것을 말이다. 탐욕의 반대는 '공포'로, 탐욕과 마찬가지로 과잉을 의미하며, 그런 점에서 패닉 상태에 더 가깝다. 논리, 과거의 일, 전통적 기준을 고려하지 않고 묵살해버리고 현실 가능성 없는 제의를 수락하는 행위를 조심하라. \"자기기만보다 쉬운 것은 없다. 사람들은 각자의 바람을 위해 그것이 진실이라고 믿는다.\" 투자는 진지하게 하는 것이지 재미를 위해서 하는 것이 아니기 때문에, 현실적으로 말이 안 되는 것이 있는지 계속해서 경계해야 한다. 다시 말해, 투자 프로세스에는 상당한 불신이 필요하고 충분히 의심하지 않으면 투자 손실이라는 결과가 발생하기 때문이다. IMF 사후 분석 두 가지 결론은 '의심스러울 정도로 좋았다.'와 '무슨 생각을 했던 것일까?'이다. 투자자들이 착각에 빠지는 이유는 종종 탐욕에 이끌려 과거의 교훈을 너무 쉽게 무시하거나 외면하는 태도에 있다. \"과거 금융 사건에 대한 극도로 짧은 기억력\"이 시장 참여자가 과거의 패턴이 반복된다는 사실을 인식하지 못하게 만들고, 결국 이러한 현상이 불가피하게 되풀이된다는 점을 깨닫지 못하게 한다. 투자만큼 역사를 반영하는 분야도 없고 과거의 경험은 그저 기억의 일부가 되어, 현재의 불가사의를 평가할 통찰력을 가지지 못한 사람들이나 의지하는 원초적 수단으로 평가절하된다. 투자자들은 항상 묘책을 찾으며, 모든 사람들이 원하는 것은 위험을 감수하지 않고 부자가 되는 것이다. 그러나 묘책은 현실에 실재하지 않으며, 어떤 투자 전략도 리스크 없이 고수익을 내지 못한다. 시장은 매우 역동적이며, 무엇보다 참가자에게 이례적인 수익을 낼 만한 기회를 주지 않는 방향으로 움직이고 묘책이 멀리 있지 않을 것이라는 믿음은 결국 감당할 수 없는 자본손실을 가져올 수 있다. \"가격 상승은 판단력을 흐리는 마약이다.\" 그러나 일이 터진 다음에는 열기는 거품이라고 불린다. 다수의 견해에 저항하지 않고, 설사 그것이 확연하게 비현실적이라도 따라가는 경향이 있다. 시장 심리를 따라야 한다는 압박감과 부를 얻고 싶다는 욕망이 합쳐지면, 사람들은 자신의 의지와 의심을 버리고 스스로에게 내재된 리스크 회피를 망각하며 이치에 안 맞는 것을 믿게 된다. '시기심': 탐욕의 영향이 얼마나 부정적이든 간에, 탐욕은 사람들에게 계속해서 더 많은 것을 바라게 할 것이고, 그 힘은 다른 사람들과의 비교를 통해 더욱 강해진다. 우리 자신을 다른 사람들과 비교하는 경향과, 이런 경향이 생산적이고 분석적이어야 하는 프로세스에 미칠 수 있는 유해한 영향이 있다. 자아는 단기간의 평가 및 비교, 신중하지 못한 투자자의 호실적 등의 상황에서 객관적으로 계산적인 태도를 유지하는 데 커다란 방해가 될 수 있다. 신중한 투자자들은 잘 알려지지 않은 자산에 부지런히 투자하여, 호황에는 확실한 수익을 내고 불황에는 다른 사람들보다 손실을 적게 낼 수 있다. 신중한 투자자들은 자신들이 얼마나 많이 모르는지 너무 잘 알고 있기 때문에, 가장 위험한 행동에 동참하지 않고 자신의 자아를 억제한다. 포기는 주로 시장 주기의 후반부에 자주 나타나는 투자자의 행동이고 경제적, 심리적 압박감이 저항할 수 없을 정도가 되면 포기하고 시류에 편승한다. 지나치게 고가인 주식이 더 비싸지거나, 너무 저가인 주식의 가격이 계속 하락하면서 옳은 일을 하기는 더 쉬워질 것이다. 전자는 팔고, 후자는 사면 되는 것인데 그러나 막상 현실에서는 말처럼 쉽지 않다. 더 많이 바라는 욕망, 좋은 기회를 놓치는 데 대한 두려움, 다른 사람들과 비교하는 경향, 대중의 영향, 확실한 것에 대한 바람, 이런 요소들은 어디에나 있고 한데 합쳐져 대부분의 투자자들과 시장에 엄청난 영향을 미친다. 그로 인해 실수가 발생하고, 그런 실수는 자주, 널리, 반복해서 일어난다. 투자자들이 상식을 포기하게 되는 원인은 탐욕, 공포, 시기심, 자기기만, 자아 등의 감정들 때문일 것이다. 거품 속에서 금전적 손실을 피하려면, 탐욕과 인간의 오류가 긍정적인 요소를 지나치게 과대평가하고 부정적인 요소를 간과하게 만들 때 그 흐름에 휩쓸리지 않는 것이 핵심이다. 시장 최고점에 도달했을 때 매수를 피하는 것은 어려운 일이며, 그보다 더 어려운 것은 매도하는 것이고 시장이 바닥을 찍었을 때 매도하지 않는 것은 어렵고, 그보다 훨씬 더 어려운 것은 매수하는 것이다. 이에 대한 간단한 해결책 역시 없다. 언제 시장이 비이성적인 극단까지 간 것인지 말해줄 공식이란 없으며, 이런 결정을 내릴 때 옳은 결정을 내릴 수 있도록 당신을 지켜줄 소위 바보 방지 대책도 없고, 실패를 부추기는 감정으로부터 당신을 보호해줄 묘약 또한 없다. \"원래 쉬운 것이 아니다.\" (찰리 멍거) 성공 가능성을 높이기 위해서는 아래와 같은 대책들을 준비해야 한다. 내재가치에 대해 확실히 이해해야 한다. 가격이 가치와 멀어질 때 해야 하는 행동을 고수한다. 과거의 주기를 충분히 숙지하여 시장이 과열되면 보상을 받는 것이 아니라, 결국에 대가를 치른다는 것을 알아야 한다. 시장이 극단적인 상황일 때 투자 프로세스에 서서히 영향을 미치는 심리를 철저하게 이해한다. '믿기 어려울 정도로 좋은' 상황은, 말 그대로 대체로 믿으면 안 된다는 것을 꼭 기억한다. 잘못 평가되고 있던 시장이 더욱 잘못 평가되는 동안, 언제나 그렇듯 기꺼이 잘못된 것을 보려는 마음을 갖는다. 같은 마음인 친구들과 동료들로부터 지지를 주고받는다. [구조화] [막스 본문] 이 장은 비효율의 근본 원인을 심리에서 찾는다. [추론] 2차적 사고의 가장 현실적인 적은 정보 부족이 아니라 감정 오염이다. [현대 적용] 실무적으로는 FOMO, 비교 수익률 압박, 승자추종, 확신 과잉을 정기적으로 점검하는 감정 리스크 로그가 필요하다. [실전 질문] 이 판단을 밀어붙이는 감정은 탐욕인가, 공포인가, 시기심인가? 내가 지금 사실을 보는가, 내 바람을 보는가? 남들이 버는 돈을 보고 기준을 낮추고 있지 않은가? 시장이 말이 안 되는 방향으로 더 갈 때 버틸 준비가 있는가? 내 판단을 지지하고 견제해줄 동료나 문서화된 원칙이 있는가? [다른 책과의 연결] [후대 해석] 가장 강한 연결은 하우절과 코스톨라니다. 두 저자 모두 돈과 시장이 결국 인간 심리의 산물임을 강조한다. 그레이엄의 미스터 마켓도 여기와 연결된다. [오해 방지] [추론] 심리 분석이 곧 단기 타이밍을 뜻하지는 않는다. [추론] 군중과 반대로 느낀다고 자동으로 옳아지는 것이 아니다. 감정을 거슬러도 가치 판단이 틀리면 손실이 난다."},{"i":12,"title":"11. 역투자란 무엇인가?","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>다른 사람들이 실의에 빠져 매도할 때 매수하는 것과, 다른 사람들이 장밋빛 꿈을 꾸며 매수할 때 매도하는 것은 비할 바 없는 용기를 필요로 하지만, 대신 가장 높은 수익을 제공하기도 한다.<\/li>\n<li>훌륭한 투자자들은 대부분의 유행을 좇는 사람들과는 정반대로 2차적 사고, 즉 더 복합적이고, 통찰력 있는 사고방식이 필요하다.<\/li>\n<li>추세나 시장의 견해는 맞서 싸워야 하고, 추세를 따르는 포트폴리오는 멀리해야 한다.<\/li>\n<li>시계추가 움직이고 시장이 주기를 따라 움직임에 따라 궁극적인 성공의 열쇠는 이런 움직임과 반대로 움직이는 데 있다.<\/li>\n<li>\"다른 이들이 업무를 수행할 때 신중함이 덜할수록, 우리는 업무를 수행함에 있어서 최대한 신중해야 한다.\" (워런 버핏)<\/li>\n<li>절박한 상황에 처했을 때 다수의 일원이 되는 것은 확실히 달가운 일은 아니지만, 그 상황을 피하려면 흔치 않은 기술, 통찰력, 자제심이 필요하다.<\/li>\n<li>집단 오류의 논리는 분명하고 거의 확실하다.<ul>\n<li>시장은 상승세에서 하락세로, 고평가에서 저평가로 극단적으로 왔다 갔다 한다.<\/li>\n<li>시장의 움직임은 '다수', '집단', 또는 '대중'의 행동에 의해 주도된다.<\/li>\n<li>강세장이 생기는 이유는 매도보다 매수하려는 사람이 더 많기 때문이거나, 매도하려는 사람들보다 매수하려는 사람들의 의욕이 더 강하기 때문이다.<\/li>\n<li>시세는 매도자들이 매수자로 역할을 전환하면서 오르고, 매수자들의 의욕이 강해질수록 매도자들의 의욕은 약해진다.<\/li>\n<li>시장의 극단은 변곡점을 나타낸다. 이는 상승세나 하락세가 극에 달했을 때 일어난다.<\/li>\n<li>시장이 고점에 이를 때쯤이면 모든 매수자가 희망을 품은 다수에 동참하고 있기 때문에, 이런 희망은 더 이상 지속되지 못하고 시세는 오를 대로 오른다.<\/li>\n<li>상황을 희망적으로 보는 사람이 추가로 나오지 않기 때문에 시세는 더 이상 오르지 않는다. 그리고 다음 날 누군가가 매수자에서 매도자로 바뀌면 시세는 떨어지기 시작할 것이다.<\/li>\n<li>그렇게 대다수의 믿음에서 비롯된 극단적인 상황에서 대부분의 사람들은 잘못된 행동을 하고 있다.<\/li>\n<li>따라서 성공 투자의 열쇠는 반대로 하는 것, 다수와 다른 길을 가는 데 있다.<\/li>\n<li>다른 사람들의 실수를 인지하는 사람들은 역투자를 통해 엄청난 수익을 올릴 수 있다.<\/li>\n<\/ul>\n<\/li>\n<li>다수에 동참하고 이런 주기의 극단적인 시기에 참여하는 것은 당신의 재정 건전성에 확실히 위험할 수 있다.<\/li>\n<li>\"싸게 사서 비싸게 팔라\"는 예로부터 내려온 격언이지만, 시장 주기에 통제되는 투자자들은 이와 반대로 하는 일이 매우 잦다.<\/li>\n<li>극단적 상황이 시장에 약 10년 정도에 한 번씩은 일어나고, 기회만 된다면 사람들이 매도할 때 사고, 매수할 때 팔아야 한다.<\/li>\n<li>다만 그렇게 역투자하는 것이 쉬울 것이라고 생각해서는 안 된다.<\/li>\n<li>그러기 위해서는 가격이 내재가치와 심각하게 동떨어진 사례를 감지할 수 있는 능력이 필요하고 배짱도 충분히 있어야 하며, 시장의 비효율성도 알아야 한다.<\/li>\n<li>이렇든 단호하게 행동하려면 그 기반이 되어줄 경험이 있어야 하고 자신을 이해해주고 끈기 있게 지지해줄 수 있는 지지 세력도 있어야 한다.<\/li>\n<li>시장이 이성으로 채워지기를 기다리는 동안 극단적인 상황을 잘 넘길 수 있는 시간이 충분하지 않으면 당신은 시장의 희생자가 될 것이다.<\/li>\n<li>평균 수심 1.5미터인 시냇물을 건너다가 물에 빠져 죽었다는 키가 180cm인 남자처럼 희생자가 될 수 있다. 그러나 시계추 같은 시장의 움직임에 주의를 기울인다면 종종 넝쿨째 굴러들어오는 기회를 잡을 수 있다.<\/li>\n<li>역투자의 폭넓은 개념을 수용하는 것과, 이를 실전에 적용하는 것은 완전히 별개다.<\/li>\n<li>우리는 시계추가 얼마나 멀리 움직일지, 또 방향을 전환해 반대 방향으로 얼마나 멀리 움직일지 전혀 모르지만 시장이 한 번 극단적인 상황에 이르고 나면, 결국 중간 지점을 향해 되돌아올 것이라는 점은 확실할 수 있다.<\/li>\n<li>추가 한 방향으로 영원히 움직일 것이라고, 또한 추가 끝에 다다르면 거기에 멈추어 설 것이라고 믿는 투자자들은 언제나 실망하게 되어 있다.<\/li>\n<li>시장에 영향을 미치는 많은 요인들에 내재된 변동성 때문에 어떠한 방법에도, 심지어 역투자마저도 완벽하게 신뢰할 수는 없다.<\/li>\n<li>역투자가 늘 수익을 안겨주는 전략은 아니다. 대부분의 시기에 역투자할 기회를 줄 만큼 시장이 과열된 상태가 아니다.<\/li>\n<li>과열이 진행될 때조차도 '너무 비싼' 가격과 '내일 떨어질' 가격은 완전히 다르다는 것을 기억해야 한다.<\/li>\n<li>시세는 너무 비싸거나, 너무 싼 채로 몇 년간 지속될 수 있다. 또한 그 상태에서 더 비싸지거나, 더 싸질 수도 있다.<\/li>\n<li>추세가 당신의 선택과 반대로 갈 때는 몹시 고통스러울 수 있다.<\/li>\n<li>모든 사람이 다수가 틀렸다는 결론에 도달하는 일이 가끔 있을 수 있다. 즉 역투자가 그 자체로 너무 유행이 되는 일이 있을 수 있는데, 그렇게 되면 다수가 역투자를 하는 것으로 오해받을 수 있다.<\/li>\n<li>다수와 반대로 투자하는 것만으로는 충분하지 않다. 앞서 말한 역투자와 관련된 어려움을 고려했을 때, 다수와는 다른 사고를 통해 수익 가능성을 파악할 때는 근거와 분석을 기반으로 해야 한다.<\/li>\n<li>다수가 하는 일과 단지 반대여서가 아니라, 그들이 왜 틀렸는지를 알기 때문에 그 일을 해야 하는 것이고 그래야만 당신의 견해를 확고하게 유지할 수 있을 것이고, 당신의 포지션이 실수로 드러나거나, 수익보다는 손실이 누적되어도 추가로 매수할 수 있을 것이다.<\/li>\n<li>성공적인 투자를 위해서는 다수의 의견과 반대여서 마음이 편치 않은 포지션을 고수해야 할 필요가 있다.<\/li>\n<li>대충하는 투자에는 별다른 반전이 없으며, 탄탄한 투자 의사결정 프로세스를 통해 나온 확신만이 투자자들로 하여금 투기성 초과량은 팔고, 체념 속에서 가격이 싸게 나온 물건을 사게 할 수 있다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 역투자는 군중 반대가 아니라 가치와 가격의 극단적 괴리에서 행동하는 것이다.<\/li>\n<li>[추론] 역투자의 핵심 요건은 독립 가치판단, 군중 오류 진단, 장기 자본, 심리적 지지, 무리 없는 레버리지 구조다.<\/li>\n<li>[막스 메모/인터뷰] 막스는 극단 구간에서 순응이 아니라 반대편 행동이 기회를 만든다고 했지만, 항상 그런 것은 아니며 대부분의 시간엔 컨센서스가 대략 맞다고도 강조했다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>다수가 틀렸다고 보는 근거는 무엇인가?<\/li>\n<li>가격과 가치의 괴리가 충분히 큰가?<\/li>\n<li>추가 하락이 와도 버틸 자본과 구조가 있는가?<\/li>\n<li>나는 왜 이 포지션을 유지할 수 있다고 믿는가?<\/li>\n<li>이 판단이 단지 반사적 반대심리인지, 아니면 분석에 근거한 것인지 구분했는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(비인기 속 가치), 코스톨라니(대중과 반대로), 하우절(남과 다르게 있을 심리), 린치(인기 없는 종목의 발견).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 역투자는 “무조건 반대로”가 아니다.<\/li>\n<li>[추론] 극단 가격이 더 극단으로 갈 수 있으므로, 시간과 자본 구조가 없으면 역투자도 파산 전략이 될 수 있다.<\/li>\n<\/ul>","text":"기존 노트 다른 사람들이 실의에 빠져 매도할 때 매수하는 것과, 다른 사람들이 장밋빛 꿈을 꾸며 매수할 때 매도하는 것은 비할 바 없는 용기를 필요로 하지만, 대신 가장 높은 수익을 제공하기도 한다. 훌륭한 투자자들은 대부분의 유행을 좇는 사람들과는 정반대로 2차적 사고, 즉 더 복합적이고, 통찰력 있는 사고방식이 필요하다. 추세나 시장의 견해는 맞서 싸워야 하고, 추세를 따르는 포트폴리오는 멀리해야 한다. 시계추가 움직이고 시장이 주기를 따라 움직임에 따라 궁극적인 성공의 열쇠는 이런 움직임과 반대로 움직이는 데 있다. \"다른 이들이 업무를 수행할 때 신중함이 덜할수록, 우리는 업무를 수행함에 있어서 최대한 신중해야 한다.\" (워런 버핏) 절박한 상황에 처했을 때 다수의 일원이 되는 것은 확실히 달가운 일은 아니지만, 그 상황을 피하려면 흔치 않은 기술, 통찰력, 자제심이 필요하다. 집단 오류의 논리는 분명하고 거의 확실하다. 시장은 상승세에서 하락세로, 고평가에서 저평가로 극단적으로 왔다 갔다 한다. 시장의 움직임은 '다수', '집단', 또는 '대중'의 행동에 의해 주도된다. 강세장이 생기는 이유는 매도보다 매수하려는 사람이 더 많기 때문이거나, 매도하려는 사람들보다 매수하려는 사람들의 의욕이 더 강하기 때문이다. 시세는 매도자들이 매수자로 역할을 전환하면서 오르고, 매수자들의 의욕이 강해질수록 매도자들의 의욕은 약해진다. 시장의 극단은 변곡점을 나타낸다. 이는 상승세나 하락세가 극에 달했을 때 일어난다. 시장이 고점에 이를 때쯤이면 모든 매수자가 희망을 품은 다수에 동참하고 있기 때문에, 이런 희망은 더 이상 지속되지 못하고 시세는 오를 대로 오른다. 상황을 희망적으로 보는 사람이 추가로 나오지 않기 때문에 시세는 더 이상 오르지 않는다. 그리고 다음 날 누군가가 매수자에서 매도자로 바뀌면 시세는 떨어지기 시작할 것이다. 그렇게 대다수의 믿음에서 비롯된 극단적인 상황에서 대부분의 사람들은 잘못된 행동을 하고 있다. 따라서 성공 투자의 열쇠는 반대로 하는 것, 다수와 다른 길을 가는 데 있다. 다른 사람들의 실수를 인지하는 사람들은 역투자를 통해 엄청난 수익을 올릴 수 있다. 다수에 동참하고 이런 주기의 극단적인 시기에 참여하는 것은 당신의 재정 건전성에 확실히 위험할 수 있다. \"싸게 사서 비싸게 팔라\"는 예로부터 내려온 격언이지만, 시장 주기에 통제되는 투자자들은 이와 반대로 하는 일이 매우 잦다. 극단적 상황이 시장에 약 10년 정도에 한 번씩은 일어나고, 기회만 된다면 사람들이 매도할 때 사고, 매수할 때 팔아야 한다. 다만 그렇게 역투자하는 것이 쉬울 것이라고 생각해서는 안 된다. 그러기 위해서는 가격이 내재가치와 심각하게 동떨어진 사례를 감지할 수 있는 능력이 필요하고 배짱도 충분히 있어야 하며, 시장의 비효율성도 알아야 한다. 이렇든 단호하게 행동하려면 그 기반이 되어줄 경험이 있어야 하고 자신을 이해해주고 끈기 있게 지지해줄 수 있는 지지 세력도 있어야 한다. 시장이 이성으로 채워지기를 기다리는 동안 극단적인 상황을 잘 넘길 수 있는 시간이 충분하지 않으면 당신은 시장의 희생자가 될 것이다. 평균 수심 1.5미터인 시냇물을 건너다가 물에 빠져 죽었다는 키가 180cm인 남자처럼 희생자가 될 수 있다. 그러나 시계추 같은 시장의 움직임에 주의를 기울인다면 종종 넝쿨째 굴러들어오는 기회를 잡을 수 있다. 역투자의 폭넓은 개념을 수용하는 것과, 이를 실전에 적용하는 것은 완전히 별개다. 우리는 시계추가 얼마나 멀리 움직일지, 또 방향을 전환해 반대 방향으로 얼마나 멀리 움직일지 전혀 모르지만 시장이 한 번 극단적인 상황에 이르고 나면, 결국 중간 지점을 향해 되돌아올 것이라는 점은 확실할 수 있다. 추가 한 방향으로 영원히 움직일 것이라고, 또한 추가 끝에 다다르면 거기에 멈추어 설 것이라고 믿는 투자자들은 언제나 실망하게 되어 있다. 시장에 영향을 미치는 많은 요인들에 내재된 변동성 때문에 어떠한 방법에도, 심지어 역투자마저도 완벽하게 신뢰할 수는 없다. 역투자가 늘 수익을 안겨주는 전략은 아니다. 대부분의 시기에 역투자할 기회를 줄 만큼 시장이 과열된 상태가 아니다. 과열이 진행될 때조차도 '너무 비싼' 가격과 '내일 떨어질' 가격은 완전히 다르다는 것을 기억해야 한다. 시세는 너무 비싸거나, 너무 싼 채로 몇 년간 지속될 수 있다. 또한 그 상태에서 더 비싸지거나, 더 싸질 수도 있다. 추세가 당신의 선택과 반대로 갈 때는 몹시 고통스러울 수 있다. 모든 사람이 다수가 틀렸다는 결론에 도달하는 일이 가끔 있을 수 있다. 즉 역투자가 그 자체로 너무 유행이 되는 일이 있을 수 있는데, 그렇게 되면 다수가 역투자를 하는 것으로 오해받을 수 있다. 다수와 반대로 투자하는 것만으로는 충분하지 않다. 앞서 말한 역투자와 관련된 어려움을 고려했을 때, 다수와는 다른 사고를 통해 수익 가능성을 파악할 때는 근거와 분석을 기반으로 해야 한다. 다수가 하는 일과 단지 반대여서가 아니라, 그들이 왜 틀렸는지를 알기 때문에 그 일을 해야 하는 것이고 그래야만 당신의 견해를 확고하게 유지할 수 있을 것이고, 당신의 포지션이 실수로 드러나거나, 수익보다는 손실이 누적되어도 추가로 매수할 수 있을 것이다. 성공적인 투자를 위해서는 다수의 의견과 반대여서 마음이 편치 않은 포지션을 고수해야 할 필요가 있다. 대충하는 투자에는 별다른 반전이 없으며, 탄탄한 투자 의사결정 프로세스를 통해 나온 확신만이 투자자들로 하여금 투기성 초과량은 팔고, 체념 속에서 가격이 싸게 나온 물건을 사게 할 수 있다. [구조화] [막스 본문] 역투자는 군중 반대가 아니라 가치와 가격의 극단적 괴리에서 행동하는 것이다. [추론] 역투자의 핵심 요건은 독립 가치판단, 군중 오류 진단, 장기 자본, 심리적 지지, 무리 없는 레버리지 구조다. [막스 메모/인터뷰] 막스는 극단 구간에서 순응이 아니라 반대편 행동이 기회를 만든다고 했지만, 항상 그런 것은 아니며 대부분의 시간엔 컨센서스가 대략 맞다고도 강조했다. [실전 질문] 다수가 틀렸다고 보는 근거는 무엇인가? 가격과 가치의 괴리가 충분히 큰가? 추가 하락이 와도 버틸 자본과 구조가 있는가? 나는 왜 이 포지션을 유지할 수 있다고 믿는가? 이 판단이 단지 반사적 반대심리인지, 아니면 분석에 근거한 것인지 구분했는가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(비인기 속 가치), 코스톨라니(대중과 반대로), 하우절(남과 다르게 있을 심리), 린치(인기 없는 종목의 발견). [오해 방지] [추론] 역투자는 “무조건 반대로”가 아니다. [추론] 극단 가격이 더 극단으로 갈 수 있으므로, 시간과 자본 구조가 없으면 역투자도 파산 전략이 될 수 있다."},{"i":13,"title":"12. 저가 매수 대상을 찾아라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>최고의 기회는 대개 다른 이들이 하지 않는 것에서 발견된다.<\/li>\n<li>현명한 포트폴리오 구축 프로세스는 가장 좋은 종목을 매입하기 위해 그보다 못한 종목을 매도하고, 최악의 종목은 피하는 것으로 이루어진다.<\/li>\n<li>잠재적인 투자 대상 목록, 목록에 있는 투자 대상의 내재가치 평가, 내재가치와 비교해서 가격이 어떠한지 판단하는 것, 각각에 포함된 리스크와 리스크를 포함했을 때 전체적인 포트폴리오에 미치는 영향에 대한 이해 등의 프로세스 구성 요소가 있다.<\/li>\n<li>프로세스의 첫 번째 단계는 고려 중인 사항들이 절대 기준을 만족하는지 확실히 하는 데 있다.<\/li>\n<li>수준 높은 투자자라면 자신이 생각하는 최소한의 기준을 충족시키는 투자 후보를 목록으로 만들고, 그 안에서 최고로 싸고 좋은 것을 고를 것이다.<\/li>\n<li>투자 고려 중인 후보군에서 마음이 편치 않은 리스크를 배제하고, 감수할 수 있는 리스크만 목록에 포함시키는 일을 맨 처음 해야 한다.<\/li>\n<li>배제를 고려할 만한 리스크는 과학기술의 발달로 진부화 리스크, 제품 인기가 사그라지는 리스크 등이 있다.<\/li>\n<li>특정 기업이 속해 있는 산업이 지나치게 예측 불가능하거나, 기업의 재정 상태가 충분히 투명하지 않은 경우 배제할 수 있다.<\/li>\n<li>리스크의 범위를 정해 놓고, 그 안에 속하는 자산만을 수용하는 것은 당연한 일이다.<\/li>\n<li>가능성 있는 후보를 골라낸 후 다음 단계는, 그 안에서 투자 대상을 선택하는 것이다.<\/li>\n<li>이를 위해서는 위험 대비 잠재 수익률이 가장 높은 것이나, 비용 대비 가치가 가장 높은 것을 골라야 한다.<\/li>\n<li>\"투자는 상대적인 선택의 훈련\"<\/li>\n<li>투자 프로세스는 정밀하고 훈련되어야 한다. 반드시 비교해야 한다.<\/li>\n<li>가격이 하락하거나 상승하거나, 따라서 장래 수익이 높거나 낮거나 상관없이 우리는 최고의 투자 대상을 찾아야 한다.<\/li>\n<li>우리가 시장을 바꿀 수 없는 이상 시장에 참가하고 싶다면, 존재하는 모든 가능성 중에서 최고를 선택할 수밖에 없다. 이것이 상대적 결정이다.<\/li>\n<li>우리의 목적은 좋은 자산을 찾는 것이 아니라, 성공적인 매입을 하는 것이다. '어떤 자산을 사느냐'가 중요한 것이 아니라, '그 자산에 얼마를 지불하느냐'가 중요하다.<\/li>\n<li>일반적으로 매입을 잘하려면 자산이 가치에 비해 가격이 낮고, 기대수익이 리스크에 비해 높아야 한다.<\/li>\n<li>저가의 자산을 찾으려면 자산이 인기 없는 이유가 무엇인지 반드시 알아야 한다.<\/li>\n<li>가치에 비해 가격은 싸고, 리스크에 비해 수익은 높게 만들어주는 것은 무엇인가?<\/li>\n<li>잠재적으로 저가에 매수할 수 있는 자산은 대체로 객관적인 결점을 드러낸다.<\/li>\n<li>어떤 자산군에 약점이 있을 수도 있고, 어떤 기업이 해당 산업에서 뒤처질 수도 있으며, 대차대조표에 과도한 레버리지가 이용되었을 수도 있고, 어떤 증권이 보유자에게 구조적인 보호책을 충분히 제공하지 못할 수도 있다.<\/li>\n<li>효율적 시장의 공정가격 책정 프로세스는 분석적이고 객관적인 사람들의 참여로 이루어지기 때문에, 싸고 좋은 자산은 대개 비합리성 또는 이해 부족에서 비롯된다.<\/li>\n<li>투자자들이 자산을 공정하게 보지 못하거나, 자산에 대해 철저히 이해하기 위해 겉이 아닌 속을 들여다보지 못할 때, 또는 자산을 가치 위주로 판단하지 않는 관행이나 편견, 비난을 극복하지 못했을 때 싸고 좋은 자산이 생기는 경우가 많다.<\/li>\n<li>시장에서 소외된 종목은 무시되거나 멸시된다.<\/li>\n<li>일반적 사고를 하는 사람들은 과거 가격이 저평가되었던 것을 오를 것이라는 표시로 보지 않고 걱정할 문제로 보는 경향이 있다.<\/li>\n<li>결과적으로 저가 자산은 인기를 끌지 못한다. 따라서 자본으로부터 소외되고, 이를 보유해야 할 이유를 찾기도 힘들다.<\/li>\n<li>우리의 목표는 절대로 공정하게 가격이 매겨진 자산이 아니다. 우리의 목표는 가격이 가치보다 싼 자산을 찾는 것이다.<\/li>\n<li>그런 자산은 다음과 같은 자산들 중에서 찾아보기를 권한다.<ul>\n<li>사람들이 잘 모르고 제대로 이해하지 못하는 것<\/li>\n<li>외견상 기본적으로 미심쩍은 것<\/li>\n<li>논쟁의 여지가 있거나, 볼품없거나, 투자하기 겁나는 것<\/li>\n<li>'훌륭한' 포트폴리오에 포함시키기에는 부적절하다고 여겨지는 것<\/li>\n<li>평가가 제대로 이루어지지 않고, 인기 없고, 사랑받지 못하는 것<\/li>\n<li>볼품없는 수익을 기록한 것<\/li>\n<li>투자가 계속되지 못하고 최근에 중단된 것<\/li>\n<\/ul>\n<\/li>\n<li>위 사항을 요약한다면, '저가 매수의 기회가 존재하기 위해 필요한 조건은 자산에 대한 투자자들의 인식이 실제보다 훨씬 나빠야 한다'라고 할 수 있다.<\/li>\n<li>결국 모두가 어떤 자산에 호감을 느껴 기꺼이 투자에 동참하기를 원한다면, 그 자산의 가격은 싸지 않을 것이다.<\/li>\n<li>투자에서 싸고 좋은 자산은 고품질이어야 할 필요는 없다. 사실, 자산의 품질이 낮아 사람들이 겁먹고 도망갈수록 더 싸지는 경향이 있다.<\/li>\n<li>우리가 제안받는 많은 '특별한 거래'가 믿기 힘들 정도로 좋다는 점에서, 이 거래들을 피하는 것이 투자 성공에 필수적이다.<\/li>\n<li>너무나 많은 것들이 그렇듯, 우리를 적극적인 투자자로 만드는 낙관주의와 효율적 시장가설에 나오는 회의주의가 균형을 이루어야 한다.<\/li>\n<li>투자자들이 심리적 부담감, 분석상의 실수, 불확실한 것을 멀리하는 경향으로 인해 실수를 할 수밖에 없는 것은 자명하다.<\/li>\n<li>이러한 실수들은 2차적 사고를 하는 사람들로 하여금 다른 이들의 잘못을 볼 수 있도록 저가 매수의 기회를 만들어준다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 저가 매수 대상은 “좋아 보이는 자산”이 아니라 “남들이 과도하게 싫어하는 자산”에서 나온다.<\/li>\n<li>[추론] 이 장의 요지는 bargain hunting이 아니라 screening discipline이다. 먼저 제외하고, 남은 후보 중 가장 싼 것을 산다.<\/li>\n<li>[현대 적용] 저가 매수는 스토리 투자보다 이유 투자다. 왜 싼지 설명 못하면 싼 게 아니라 함정일 수 있다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 자산은 왜 인기가 없는가?<\/li>\n<li>그 비인기 요인은 일시적인가, 구조적인가?<\/li>\n<li>시장이 이 자산을 실제보다 더 나쁘게 보고 있는가?<\/li>\n<li>내가 감수하지 못할 리스크는 애초에 배제했는가?<\/li>\n<li>후보군 안에서 비용 대비 가치가 가장 높은 것은 무엇인가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(담배꽁초·안전마진), 린치(남들이 모르는 종목), 코스톨라니(대중의 외면), 하우절(불편한 곳에 기회).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 싸다고 다 좋은 것이 아니다. 막스는 먼저 배제 기준을 세우라고 한다.<\/li>\n<li>[추론] 인기 없다는 이유만으로 사면 안 된다. 가치 대비 저렴함이 확인돼야 한다.<\/li>\n<\/ul>","text":"기존 노트 최고의 기회는 대개 다른 이들이 하지 않는 것에서 발견된다. 현명한 포트폴리오 구축 프로세스는 가장 좋은 종목을 매입하기 위해 그보다 못한 종목을 매도하고, 최악의 종목은 피하는 것으로 이루어진다. 잠재적인 투자 대상 목록, 목록에 있는 투자 대상의 내재가치 평가, 내재가치와 비교해서 가격이 어떠한지 판단하는 것, 각각에 포함된 리스크와 리스크를 포함했을 때 전체적인 포트폴리오에 미치는 영향에 대한 이해 등의 프로세스 구성 요소가 있다. 프로세스의 첫 번째 단계는 고려 중인 사항들이 절대 기준을 만족하는지 확실히 하는 데 있다. 수준 높은 투자자라면 자신이 생각하는 최소한의 기준을 충족시키는 투자 후보를 목록으로 만들고, 그 안에서 최고로 싸고 좋은 것을 고를 것이다. 투자 고려 중인 후보군에서 마음이 편치 않은 리스크를 배제하고, 감수할 수 있는 리스크만 목록에 포함시키는 일을 맨 처음 해야 한다. 배제를 고려할 만한 리스크는 과학기술의 발달로 진부화 리스크, 제품 인기가 사그라지는 리스크 등이 있다. 특정 기업이 속해 있는 산업이 지나치게 예측 불가능하거나, 기업의 재정 상태가 충분히 투명하지 않은 경우 배제할 수 있다. 리스크의 범위를 정해 놓고, 그 안에 속하는 자산만을 수용하는 것은 당연한 일이다. 가능성 있는 후보를 골라낸 후 다음 단계는, 그 안에서 투자 대상을 선택하는 것이다. 이를 위해서는 위험 대비 잠재 수익률이 가장 높은 것이나, 비용 대비 가치가 가장 높은 것을 골라야 한다. \"투자는 상대적인 선택의 훈련\" 투자 프로세스는 정밀하고 훈련되어야 한다. 반드시 비교해야 한다. 가격이 하락하거나 상승하거나, 따라서 장래 수익이 높거나 낮거나 상관없이 우리는 최고의 투자 대상을 찾아야 한다. 우리가 시장을 바꿀 수 없는 이상 시장에 참가하고 싶다면, 존재하는 모든 가능성 중에서 최고를 선택할 수밖에 없다. 이것이 상대적 결정이다. 우리의 목적은 좋은 자산을 찾는 것이 아니라, 성공적인 매입을 하는 것이다. '어떤 자산을 사느냐'가 중요한 것이 아니라, '그 자산에 얼마를 지불하느냐'가 중요하다. 일반적으로 매입을 잘하려면 자산이 가치에 비해 가격이 낮고, 기대수익이 리스크에 비해 높아야 한다. 저가의 자산을 찾으려면 자산이 인기 없는 이유가 무엇인지 반드시 알아야 한다. 가치에 비해 가격은 싸고, 리스크에 비해 수익은 높게 만들어주는 것은 무엇인가? 잠재적으로 저가에 매수할 수 있는 자산은 대체로 객관적인 결점을 드러낸다. 어떤 자산군에 약점이 있을 수도 있고, 어떤 기업이 해당 산업에서 뒤처질 수도 있으며, 대차대조표에 과도한 레버리지가 이용되었을 수도 있고, 어떤 증권이 보유자에게 구조적인 보호책을 충분히 제공하지 못할 수도 있다. 효율적 시장의 공정가격 책정 프로세스는 분석적이고 객관적인 사람들의 참여로 이루어지기 때문에, 싸고 좋은 자산은 대개 비합리성 또는 이해 부족에서 비롯된다. 투자자들이 자산을 공정하게 보지 못하거나, 자산에 대해 철저히 이해하기 위해 겉이 아닌 속을 들여다보지 못할 때, 또는 자산을 가치 위주로 판단하지 않는 관행이나 편견, 비난을 극복하지 못했을 때 싸고 좋은 자산이 생기는 경우가 많다. 시장에서 소외된 종목은 무시되거나 멸시된다. 일반적 사고를 하는 사람들은 과거 가격이 저평가되었던 것을 오를 것이라는 표시로 보지 않고 걱정할 문제로 보는 경향이 있다. 결과적으로 저가 자산은 인기를 끌지 못한다. 따라서 자본으로부터 소외되고, 이를 보유해야 할 이유를 찾기도 힘들다. 우리의 목표는 절대로 공정하게 가격이 매겨진 자산이 아니다. 우리의 목표는 가격이 가치보다 싼 자산을 찾는 것이다. 그런 자산은 다음과 같은 자산들 중에서 찾아보기를 권한다. 사람들이 잘 모르고 제대로 이해하지 못하는 것 외견상 기본적으로 미심쩍은 것 논쟁의 여지가 있거나, 볼품없거나, 투자하기 겁나는 것 '훌륭한' 포트폴리오에 포함시키기에는 부적절하다고 여겨지는 것 평가가 제대로 이루어지지 않고, 인기 없고, 사랑받지 못하는 것 볼품없는 수익을 기록한 것 투자가 계속되지 못하고 최근에 중단된 것 위 사항을 요약한다면, '저가 매수의 기회가 존재하기 위해 필요한 조건은 자산에 대한 투자자들의 인식이 실제보다 훨씬 나빠야 한다'라고 할 수 있다. 결국 모두가 어떤 자산에 호감을 느껴 기꺼이 투자에 동참하기를 원한다면, 그 자산의 가격은 싸지 않을 것이다. 투자에서 싸고 좋은 자산은 고품질이어야 할 필요는 없다. 사실, 자산의 품질이 낮아 사람들이 겁먹고 도망갈수록 더 싸지는 경향이 있다. 우리가 제안받는 많은 '특별한 거래'가 믿기 힘들 정도로 좋다는 점에서, 이 거래들을 피하는 것이 투자 성공에 필수적이다. 너무나 많은 것들이 그렇듯, 우리를 적극적인 투자자로 만드는 낙관주의와 효율적 시장가설에 나오는 회의주의가 균형을 이루어야 한다. 투자자들이 심리적 부담감, 분석상의 실수, 불확실한 것을 멀리하는 경향으로 인해 실수를 할 수밖에 없는 것은 자명하다. 이러한 실수들은 2차적 사고를 하는 사람들로 하여금 다른 이들의 잘못을 볼 수 있도록 저가 매수의 기회를 만들어준다. [구조화] [막스 본문] 저가 매수 대상은 “좋아 보이는 자산”이 아니라 “남들이 과도하게 싫어하는 자산”에서 나온다. [추론] 이 장의 요지는 bargain hunting이 아니라 screening discipline이다. 먼저 제외하고, 남은 후보 중 가장 싼 것을 산다. [현대 적용] 저가 매수는 스토리 투자보다 이유 투자다. 왜 싼지 설명 못하면 싼 게 아니라 함정일 수 있다. [실전 질문] 이 자산은 왜 인기가 없는가? 그 비인기 요인은 일시적인가, 구조적인가? 시장이 이 자산을 실제보다 더 나쁘게 보고 있는가? 내가 감수하지 못할 리스크는 애초에 배제했는가? 후보군 안에서 비용 대비 가치가 가장 높은 것은 무엇인가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(담배꽁초·안전마진), 린치(남들이 모르는 종목), 코스톨라니(대중의 외면), 하우절(불편한 곳에 기회). [오해 방지] [추론] 싸다고 다 좋은 것이 아니다. 막스는 먼저 배제 기준을 세우라고 한다. [추론] 인기 없다는 이유만으로 사면 안 된다. 가치 대비 저렴함이 확인돼야 한다."},{"i":14,"title":"13. 인내심을 가지고 기회를 기다려라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>시장은 그다지 협조적인 기구가 아니다. 시장은 당신이 필요로 한다는 이유만으로 고수익을 제공하지는 않는다.<\/li>\n<li>언제나 최고의 결과만 나오는 일이란 세상에 없고 상황에 따라 아무것도 안 하는 것이 최선의 방법일 수도 있다는 것이다.<\/li>\n<li>인내심을 가지고 기회를 기다리는 것이, 즉 저가 매수를 기다리는 것이 최고의 전략이 되는 경우가 많다.<\/li>\n<li>투자 대상을 뒤쫓는 것보다, 투자 대상이 당신 눈앞에 나타날 때까지 기다리는 것이 중요하다.<\/li>\n<li>어떤 자산을 매입해야겠다고 처음부터 정해 놓지 말고, 매도자가 팔아야겠다고 한 것에서 자산을 고른다면 더 싸게 살 수 있다.<\/li>\n<li>시장 상황을 인식하고 그에 따라 행동하는 것은 투자 성공에 있어 필수적이다.<\/li>\n<li>투자 실패를 불러올 수 있는 행동으로는 시장 상황을 인식하지 않고 행동하고 시장 상황과 무관하게 행동하는 것 그리고 그 상황을 우리가 어느 정도는 바꿀 수 있다고 믿는 것 등이 있다.<\/li>\n<li>무상(無常)은 주기가 상승하고 하락하고, 모든 것이 왔다가 가고, 우리의 상황이 변하는 것은 우리의 능력 밖이라는 것을 의미한다.<\/li>\n<li>그러므로 우리는 인식하고 인정하고 대처하고 대응해야 한다. 투자의 본질 또한 이런 것이 아니겠는가?<\/li>\n<li>우리가 할 수 있는 일이라고는 상황을 있는 그대로 인식하고 주어진 상황을 고려하여, 우리가 할 수 있는 최고의 결정을 하는 것이다.<\/li>\n<li>\"투자는 아웃되지 않기 위해 꼭 방망이를 휘두를 필요가 없다는 점에서 가장 좋은 사업이다. 누구도 스트라이크를 외치지 않으므로 잃는 것은 기회뿐 불이익은 전혀 없다. 당신은 계속해서 마음이 드는 공이 오기를 기다리면 된다. 그리고 내야수, 외야수들이 잠들면 방망이를 휘둘러라.\"<\/li>\n<li>투자에 관해 가장 좋은 점 한 가지는, 실제 불이익은 손해 보는 투자에만 있다는 것이다. 손해 볼 투자를 하지 않았다고 해서 불이익을 당하는 일은 없다. 물론 보상도 없기는 하지만 말이다.<\/li>\n<li>투자자들은 대체로 경쟁 심리가 있고 그 이유는 돈 때문이다. 따라서 수익을 낼 수 있는 기회를 놓치는 것에 온전히 마음 편할 사람은 없다.<\/li>\n<li>리스크가 제어된 상태에서 수익을 낼 수 있는 기회가 있을 때에만 방망이는 어깨에서 떨어질 수 있다. 기회는 그때뿐이다.<\/li>\n<li>기회를 선별하는 한 가지 방법은 우리가 저수익 상황에 있는지, 아니면 고수익 상황에 있는지를 확인하기 위해 모든 노력을 아끼지 않는 것이다.<\/li>\n<li>자산 가격이 비싸면 리스크는 높고 예상 수익이 낮은 것은 피할 수 없다.<\/li>\n<li>낮은 수익을 제공할 것으로 예상되는 시장에서 어떻게 대처할 것인가?<ul>\n<li>그렇지 않은 것처럼 투자한다: '바란다고 해서 현실이 바뀌지 않는다'라는 점이다.<\/li>\n<li>무조건 투자한다: 절대적으로 매력적이지 않은 자산이라도 그런대로 괜찮은 상대 수익을 올리기 위해 노력한다.<\/li>\n<li>무조건 투자한다: 단기적으로 나타나는 리스크는 무시하고, 장기적인 결과에 집중한다.<\/li>\n<li>현금을 보유한다: 연금계리 가정이나 소비 성향을 충족시켜야 하는 사람들, 자신의 돈이 놀고 있지 않기를 바라는 사람들, 또는 자신은 벌지 못하는 돈을 남들이 버는 것을 오랫동안 지켜봐야 한다면 마음이 편치 않을 사람들에게는 단기적인 리스크를 무시하는 것이 쉽지 않다.<\/li>\n<li>당신의 투자를 '특별한 틈새나 특별한 사람들'에게 집중한다: 포트폴리오 규모가 커지면 지속적으로 특별하기가 힘들어지고 대단히 재능 있고 절제력 있으며 지구력까지 갖춘 매니저를 찾기란 쉽지 않다.<\/li>\n<\/ul>\n<\/li>\n<li>다른 사람들이 리스크를 놓고 감수하겠다고 당신과 경쟁할 때가 아니라, 도망치고 있을 때 리스크를 감수해야 한다.<\/li>\n<li>저수익 환경에서 고수익을 비틀어 짜내기 위해서는 조류를 거슬러 헤엄칠 수 있는 능력과, 상대적으로 적은 유망 자산을 발굴할 수 있는 능력이 필요하다. 그러기 위해서는 탁월한 기술과, 높은 리스크 감수, 운 등이 모두 기반이 되어야 한다.<\/li>\n<li>반면 고수익 환경은 싼 가격에 매입해서도 제법 괜찮은 수익을 올릴 수 있는 기회를 제공하며, 대개 낮은 리스크로도 달성될 수 있다.<\/li>\n<li>가장 확실한 매입 기회는 자산 보유자가 어쩔 수 없이 팔게 되었을 때 생기고, 그런 위기 상황에서는 드물게 최고의 매입 기회들이 대거 나타난다.<\/li>\n<li>때때로 보유자들은 다음과 같은 이유로 매도할 수밖에 없게 된다.<ul>\n<li>그들이 관리하는 자금이 회수되는 경우<\/li>\n<li>그들의 포트폴리오 보유 자산이 기존 신용등급에 미달되거나 허용되는 비중을 초과하는 등 투자 방침을 위반하는 경우<\/li>\n<li>자산가치가 대출기관과의 계약에서 동의한 요구 조건을 만족시키지 못해서 마진콜을 받는 경우<\/li>\n<\/ul>\n<\/li>\n<li>적극적인 투자 관리의 진짜 목적은 자산 가치보다 싸게 사는 것이다.<\/li>\n<li>위기가 진행되는 동안 중요한 것은, 매각을 하게 만드는 영향으로부터 완전히 벗어나서, 매수할 수 있는 위치에 있는 것이다.<\/li>\n<li>그러기 위해서는 가치에 대한 확고한 신뢰, 레버리지를 거의 또는 전혀 이용하지 않는 것, 장기적으로 투자할 수 있는 자본, 강한 배짱 등이 투자자에게 필요하다.<\/li>\n<li>역투자가다운 태도와 튼튼한 대차대조표가 기반이 되는 인내심 있는 기회주의는 위기 상황에서도 놀라운 수익을 낼 수 있다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 “언제든 투자해야 한다”는 강박을 거부하고, 기다림 자체를 전략으로 만든다.<\/li>\n<li>[추론] 인내는 소극성이 아니라 선택권 보존이다. 현금, 낮은 레버리지, 장기 자본은 기다릴 권리를 사는 비용이다.<\/li>\n<li>[현대 적용] 저수익 환경에서의 무리한 목표수익 추구는 리스크 확대 압력으로 이어지므로, 기회 부족을 인정하는 의사결정이 중요하다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>지금은 휘둘러야 하는 공인가, 보내야 하는 공인가?<\/li>\n<li>내가 기다리지 못하는 이유는 기회 부족인가, 성과 압박인가?<\/li>\n<li>강제매도 상황을 활용할 현금과 대차대조표가 있는가?<\/li>\n<li>현재 시장의 기대수익이 내가 감수할 리스크를 정당화하는가?<\/li>\n<li>내 자본은 충분히 장기적인가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 보글(불필요한 매매 자제), 하우절(인내의 심리적 비용), 그레이엄(가격이 기회를 줄 때만 행동), 코스톨라니(참고 기다리는 능력).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 기다림은 영원한 현금 보유를 뜻하지 않는다.<\/li>\n<li>[추론] 인내는 비관론이 아니라, 비싸고 불리한 환경에서 무리하지 않는 규율이다.<\/li>\n<\/ul>","text":"기존 노트 시장은 그다지 협조적인 기구가 아니다. 시장은 당신이 필요로 한다는 이유만으로 고수익을 제공하지는 않는다. 언제나 최고의 결과만 나오는 일이란 세상에 없고 상황에 따라 아무것도 안 하는 것이 최선의 방법일 수도 있다는 것이다. 인내심을 가지고 기회를 기다리는 것이, 즉 저가 매수를 기다리는 것이 최고의 전략이 되는 경우가 많다. 투자 대상을 뒤쫓는 것보다, 투자 대상이 당신 눈앞에 나타날 때까지 기다리는 것이 중요하다. 어떤 자산을 매입해야겠다고 처음부터 정해 놓지 말고, 매도자가 팔아야겠다고 한 것에서 자산을 고른다면 더 싸게 살 수 있다. 시장 상황을 인식하고 그에 따라 행동하는 것은 투자 성공에 있어 필수적이다. 투자 실패를 불러올 수 있는 행동으로는 시장 상황을 인식하지 않고 행동하고 시장 상황과 무관하게 행동하는 것 그리고 그 상황을 우리가 어느 정도는 바꿀 수 있다고 믿는 것 등이 있다. 무상(無常)은 주기가 상승하고 하락하고, 모든 것이 왔다가 가고, 우리의 상황이 변하는 것은 우리의 능력 밖이라는 것을 의미한다. 그러므로 우리는 인식하고 인정하고 대처하고 대응해야 한다. 투자의 본질 또한 이런 것이 아니겠는가? 우리가 할 수 있는 일이라고는 상황을 있는 그대로 인식하고 주어진 상황을 고려하여, 우리가 할 수 있는 최고의 결정을 하는 것이다. \"투자는 아웃되지 않기 위해 꼭 방망이를 휘두를 필요가 없다는 점에서 가장 좋은 사업이다. 누구도 스트라이크를 외치지 않으므로 잃는 것은 기회뿐 불이익은 전혀 없다. 당신은 계속해서 마음이 드는 공이 오기를 기다리면 된다. 그리고 내야수, 외야수들이 잠들면 방망이를 휘둘러라.\" 투자에 관해 가장 좋은 점 한 가지는, 실제 불이익은 손해 보는 투자에만 있다는 것이다. 손해 볼 투자를 하지 않았다고 해서 불이익을 당하는 일은 없다. 물론 보상도 없기는 하지만 말이다. 투자자들은 대체로 경쟁 심리가 있고 그 이유는 돈 때문이다. 따라서 수익을 낼 수 있는 기회를 놓치는 것에 온전히 마음 편할 사람은 없다. 리스크가 제어된 상태에서 수익을 낼 수 있는 기회가 있을 때에만 방망이는 어깨에서 떨어질 수 있다. 기회는 그때뿐이다. 기회를 선별하는 한 가지 방법은 우리가 저수익 상황에 있는지, 아니면 고수익 상황에 있는지를 확인하기 위해 모든 노력을 아끼지 않는 것이다. 자산 가격이 비싸면 리스크는 높고 예상 수익이 낮은 것은 피할 수 없다. 낮은 수익을 제공할 것으로 예상되는 시장에서 어떻게 대처할 것인가? 그렇지 않은 것처럼 투자한다: '바란다고 해서 현실이 바뀌지 않는다'라는 점이다. 무조건 투자한다: 절대적으로 매력적이지 않은 자산이라도 그런대로 괜찮은 상대 수익을 올리기 위해 노력한다. 무조건 투자한다: 단기적으로 나타나는 리스크는 무시하고, 장기적인 결과에 집중한다. 현금을 보유한다: 연금계리 가정이나 소비 성향을 충족시켜야 하는 사람들, 자신의 돈이 놀고 있지 않기를 바라는 사람들, 또는 자신은 벌지 못하는 돈을 남들이 버는 것을 오랫동안 지켜봐야 한다면 마음이 편치 않을 사람들에게는 단기적인 리스크를 무시하는 것이 쉽지 않다. 당신의 투자를 '특별한 틈새나 특별한 사람들'에게 집중한다: 포트폴리오 규모가 커지면 지속적으로 특별하기가 힘들어지고 대단히 재능 있고 절제력 있으며 지구력까지 갖춘 매니저를 찾기란 쉽지 않다. 다른 사람들이 리스크를 놓고 감수하겠다고 당신과 경쟁할 때가 아니라, 도망치고 있을 때 리스크를 감수해야 한다. 저수익 환경에서 고수익을 비틀어 짜내기 위해서는 조류를 거슬러 헤엄칠 수 있는 능력과, 상대적으로 적은 유망 자산을 발굴할 수 있는 능력이 필요하다. 그러기 위해서는 탁월한 기술과, 높은 리스크 감수, 운 등이 모두 기반이 되어야 한다. 반면 고수익 환경은 싼 가격에 매입해서도 제법 괜찮은 수익을 올릴 수 있는 기회를 제공하며, 대개 낮은 리스크로도 달성될 수 있다. 가장 확실한 매입 기회는 자산 보유자가 어쩔 수 없이 팔게 되었을 때 생기고, 그런 위기 상황에서는 드물게 최고의 매입 기회들이 대거 나타난다. 때때로 보유자들은 다음과 같은 이유로 매도할 수밖에 없게 된다. 그들이 관리하는 자금이 회수되는 경우 그들의 포트폴리오 보유 자산이 기존 신용등급에 미달되거나 허용되는 비중을 초과하는 등 투자 방침을 위반하는 경우 자산가치가 대출기관과의 계약에서 동의한 요구 조건을 만족시키지 못해서 마진콜을 받는 경우 적극적인 투자 관리의 진짜 목적은 자산 가치보다 싸게 사는 것이다. 위기가 진행되는 동안 중요한 것은, 매각을 하게 만드는 영향으로부터 완전히 벗어나서, 매수할 수 있는 위치에 있는 것이다. 그러기 위해서는 가치에 대한 확고한 신뢰, 레버리지를 거의 또는 전혀 이용하지 않는 것, 장기적으로 투자할 수 있는 자본, 강한 배짱 등이 투자자에게 필요하다. 역투자가다운 태도와 튼튼한 대차대조표가 기반이 되는 인내심 있는 기회주의는 위기 상황에서도 놀라운 수익을 낼 수 있다. [구조화] [막스 본문] 이 장은 “언제든 투자해야 한다”는 강박을 거부하고, 기다림 자체를 전략으로 만든다. [추론] 인내는 소극성이 아니라 선택권 보존이다. 현금, 낮은 레버리지, 장기 자본은 기다릴 권리를 사는 비용이다. [현대 적용] 저수익 환경에서의 무리한 목표수익 추구는 리스크 확대 압력으로 이어지므로, 기회 부족을 인정하는 의사결정이 중요하다. [실전 질문] 지금은 휘둘러야 하는 공인가, 보내야 하는 공인가? 내가 기다리지 못하는 이유는 기회 부족인가, 성과 압박인가? 강제매도 상황을 활용할 현금과 대차대조표가 있는가? 현재 시장의 기대수익이 내가 감수할 리스크를 정당화하는가? 내 자본은 충분히 장기적인가? [다른 책과의 연결] [후대 해석] 강한 연결: 보글(불필요한 매매 자제), 하우절(인내의 심리적 비용), 그레이엄(가격이 기회를 줄 때만 행동), 코스톨라니(참고 기다리는 능력). [오해 방지] [추론] 기다림은 영원한 현금 보유를 뜻하지 않는다. [추론] 인내는 비관론이 아니라, 비싸고 불리한 환경에서 무리하지 않는 규율이다."},{"i":15,"title":"14. 내가 아는 한 가지는 내가 모른다는 것이다","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>세상에는 두 가지 부류의 예측자가 있다. 모르는 사람들과, 자신이 모른다는 사실조차 모르는 사람들이다.<\/li>\n<li>무엇인가를 모를 수도 있다는 생각은 우리를 두렵게 만든다. 하지만 그보다 더 두려운 것은 세상이 어떻게 돌아가고 있는지 자신이 정확히 알고 있다고 믿는 사람들에 의해 세상이 움직인다는 것이다.<\/li>\n<li>금전적 손실을 입는 사람들에는 두 부류가 있다. 아무것도 모르는 사람들과, 모든 것을 아는 사람들이다.<\/li>\n<li>거시적 미래가 무엇을 쥐고 있는지 알기 어렵고, 그와 관련된 문제들을 투자를 하며 계속해서 유리한 조건으로 바꿀 수 있는 뛰어난 지혜를 가진 사람은 매우 드물다.<\/li>\n<li>우리가 작은 그림에 집중할수록 그것에 대해 더 많이 알게 된다. 부단한 노력과 기술로 각각의 기업과 증권에 대해 다른 사람들보다 더 많이 지속적으로 알 수 있지만, 시장과 경제에 대해서는 노력과 기술이 그만큼 빛을 발하지 못하므로 '알 수 있는 것을 알려고' 노력하라고 제안한다.<\/li>\n<li>투자자들은 자신이 현재 주기와 시계추의 어디쯤 서 있는지 파악하기 위해 노력을 해야 한다. 그런 노력이 미래를 바꾸거나 미래에 대해 알 수 있도록 만들지는 않을 것이나, 예상되는 상황에 준비할 수 있도록 도와줄 것이다.<\/li>\n<li>예측은 대체로 큰 차이로 빗나갔고 예측은 실질적으로 유용하지도 않았으며 대부분의 예측은 추정을 기반으로 했고 예측에 성공한 전문가도 있었지만 예측에서 중요한 것은 한 번이 아니라 지속적으로 옳은 것이지만 꾸준히 하기는 불가능하다.<\/li>\n<li>\"정확한 예측을 하기는 어렵다. 특히 미래에 관해서는 그렇다.\"<\/li>\n<li>투자 결과는 전적으로 미래에 어떤 일이 일어나느냐에 따라 결정될 것이고, '정상적'인 상황에서는 대체로 무슨 일이 일어날지 알 수 있다는 점이다. 하지만 아는 것이 결정적인 차이를 만들 수 있는 상황에서는 무슨 일이 일어날지 잘 모른다는 점이다.<\/li>\n<li>대개 사람들은 최근의 과거와 매우 유사한 미래를 예상하고 이런 예측이 꼭 틀리지는 않는 것이, 미래에 최근의 과거가 재연되는 경우가 많다는 점이다.<\/li>\n<li>그러나 과거의 경험을 기반으로 추론하는 예측은 별로 가치가 없고 미래가 과거와 비슷하게 나타나면 그럴 것이라고 정확히 예측한 사람들도 큰 수익을 올리지는 못할 것이다.<\/li>\n<li>그러나 가끔은 미래가 과거와 매우 다르게 나타날 때가 있고 예측 전문가들의 역량이 빛을 발하는 것은 바로 이때이고 예측 전문가들이 틀릴 가능성이 가장 큰 것도 바로 이때이다.<\/li>\n<li>주요 사건들을 정확히 예측하는 것은 가능하지만 같은 사람들이 계속해서 그러지는 못할 것이다.<\/li>\n<li>결국 예측은 거의 가치가 없다고 봐야 한다.<\/li>\n<li>꼭 해야 할 질문은 '예측 전문가들이 가끔은 옳은가?'가 아니라, '전체 예측이 지속적으로 유용한가?'이다.<\/li>\n<li>'나는 안다 (I know)' 유파<ul>\n<li>이들은 경제, 금리, 시장이 앞으로 어떤 방향으로 나아갈지를 아는 것과, 유행하는 메인스트림 주식이 투자 성공에 필수라고 생각한다.<\/li>\n<li>이들은 미래를 아는 것이 가능하다고 믿는다.<\/li>\n<li>자신이 예측할 수 있다는 것을 안다.<\/li>\n<li>이들은 다른 많은 사람들도 예측을 시도한다는 것을 알지만, 모두가 동시에 성공하거나, 소수만이 성공할 수 있다고 생각하고 물론 자신들은 성공하는 소수에 속한다.<\/li>\n<li>미래에 대한 자신의 의견을 바탕으로 투자하는 것에 거리낌이 없다.<\/li>\n<li>이들은 다른 사람들과 자신의 견해를 기꺼이 나누고자 한다. 정확한 예측은 대단히 가치가 있어서, 이를 대가 없이 나누지 않아야 함에도 말이다.<\/li>\n<li>예측 전문가로서 후일 자신의 기록을 엄격한 잣대로 평가하려 하지 않는다.<\/li>\n<\/ul>\n<\/li>\n<li>'나는 모른다(I don't know)' 유파<ul>\n<li>'나는 모른다(I don't know)' 유파의 입장에서 '확신'이란 단어는, 특히 거시적 미래에 관련하여 입에 올리기 조심스럽다.<\/li>\n<li>'나는 모른다' 지지자들은 일반적으로 우리는 미래를 알 수 없으며, 미래에 대해 알 필요도 없고, 미래를 모르는 상황에서 투자에 최선을 다하는 것이 적절한 목표라고 믿는다.<\/li>\n<\/ul>\n<\/li>\n<li>미래를 알 수 없다면, 우리는 그 사실을 직시하고 예측보다 나은 대안을 찾아야 한다. 투자 세계에서는 어떤 한계가 주어지더라도, 이를 인정하고 수용하는 것이 부인하고 맞서는 것보다 훨씬 낫다.<\/li>\n<li>투자자들이 가능성과 결과가 다를 수 있다는 것을 망각하는 순간 가장 큰 문제가 발생한다는 것이다.<\/li>\n<li>미리 아는 것에는 다음과 같은 한계가 있음을 잊으면 안 된다.<ul>\n<li>투자자들이 확률분포의 모양을 확실히 알 수 있다고, 그리고 안다고 믿을 때<\/li>\n<li>가능성이 가장 큰 결과가 나타날 것이라고 추정할 때<\/li>\n<li>예상 결과가 정확히 실제 결과를 나타낸다고 추정할 때<\/li>\n<li>아마도 가장 중요한 것으로, 뜻밖의 결과가 발생할 수도 있다는 가능성을 무시할 때<\/li>\n<\/ul>\n<\/li>\n<li>이러한 한계를 대수롭지 않게 생각하는 경솔한 투자자들은 포트폴리오 단계에서부터 실수를 하는 경향이 있고, 가끔 커다란 손실을 입는다.<\/li>\n<li>당신은 미래를 예측할 수 있다고 생각한다면 한 가지 가능성에 따라 단정적으로 행동할 것이고, 미래를 예측할 수 없다고 생각한다면 한 가지 가능성에 얽매이지 않고 매우 다양한 방식으로 행동할 것이다.<\/li>\n<li>투자자들은 미래를 알 수 있는 것으로 보느냐, 아니면 알 수 없는 것으로 보느냐 하는 중요한 질문에 답할 수 있어야 한다.<\/li>\n<li>미래를 모르는 상황에서 미래를 자신이 안다고 느끼는 투자자들은 종목을 정하고, 포지션에 집중하고, 보유 자산에 레버리지를 투입하고, 앞으로의 성장에 의지하며 단정적으로 행동하면서 리스크를 증가시킬 것이다.<\/li>\n<li>미래가 무엇을 쥐고 있는지 모른다고 느끼는 사람들은 분산투자를 하고, 리스크에 대비하고, 레버리지 사용을 줄이거나 아예 하지 않고, 미래가치보다는 현재가치를 중요시하고, 자본구조를 탄탄히 하고, 가능성 있는 여러 결과에 단단히 대비할 것이다.<\/li>\n<li>미래를 알 수 있는 것으로 본 투자자들은 위기가 발생하기 직전 몇 년 동안은 훨씬 좋은 성과를 올렸지만 미래를 알 수 없는 것으로 본 투자자들은 위기가 발생했을 때 이에 훨씬 잘 대비되어 있었고, 쓸 수 있는 자금도 더 많아서 이 자금을 가지고 최악의 상황에서 매입함으로써 수익을 올릴 수 있었다.<\/li>\n<li>불가지론자로서 알 수 없는 미래에 투자하는 것은 가능성이 낮은 일이지만, 미래를 알기 어려운 상황에서 마치 미래를 아는 것처럼 투자하는 것은 미친 짓이나 다름없다.<\/li>\n<li>\"몰라서 문제가 되는 것이 아니다. 확실히 알고 있는 것이 사실이 아니라는 것이 문제다.\"<\/li>\n<li>알 수 있는 것, 또는 할 수 있는 것을 과대평가하는 것은 대단히 위험할 수 있다. 자신이 알 수 있는 것의 한계를 인정하는 것은 상당한 강점이 될 수 있다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 막스 철학의 인식론적 중심이다. 알 수 없는 것을 알 수 있다고 가정하지 말라는 것이다.<\/li>\n<li>[막스 메모/인터뷰] 막스는 2021년 <code>Thinking About Macro<\/code>, 2022년 <code>The Illusion of Knowledge<\/code>, 2025년 <code>Nobody Knows (Yet Again)<\/code>에서 거시 미래는 중요하지만 대체로 알 수 없고, 확신 대신 가드레일과 확률적 사고가 필요하다고 반복했다.<\/li>\n<li>[추론] 따라서 “나는 모른다” 유파의 포트폴리오 원칙은 분산, 레버리지 절제, 현재가치 중시, 시나리오 대비, 생존성 우선이다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>내가 아는 것과 모르는 것을 명확히 분리했는가?<\/li>\n<li>이 판단은 미시 분석에 근거하는가, 거시 확신에 근거하는가?<\/li>\n<li>단일 시나리오가 빗나가면 포트폴리오는 얼마나 망가지는가?<\/li>\n<li>가장 가능성 높은 결과 외의 대안 시나리오를 적어보았는가?<\/li>\n<li>나는 의견을 갖고 있는가, 아니면 그 의견이 맞다고 과신하고 있는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 보글(예측 대신 구조), 하우절(room for error), 그레이엄(안전마진), 코스톨라니(확신보다 유연성).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] “나는 모른다”는 무지나 무기력이 아니다. 과신을 버리고 구조를 설계하는 적극적 태도다.<\/li>\n<li>[추론] 예측을 부정한다고 해서 현재 위치 판단까지 포기하는 것은 아니다. 막스는 예측보다 관찰을 택한다.<\/li>\n<\/ul>","text":"기존 노트 세상에는 두 가지 부류의 예측자가 있다. 모르는 사람들과, 자신이 모른다는 사실조차 모르는 사람들이다. 무엇인가를 모를 수도 있다는 생각은 우리를 두렵게 만든다. 하지만 그보다 더 두려운 것은 세상이 어떻게 돌아가고 있는지 자신이 정확히 알고 있다고 믿는 사람들에 의해 세상이 움직인다는 것이다. 금전적 손실을 입는 사람들에는 두 부류가 있다. 아무것도 모르는 사람들과, 모든 것을 아는 사람들이다. 거시적 미래가 무엇을 쥐고 있는지 알기 어렵고, 그와 관련된 문제들을 투자를 하며 계속해서 유리한 조건으로 바꿀 수 있는 뛰어난 지혜를 가진 사람은 매우 드물다. 우리가 작은 그림에 집중할수록 그것에 대해 더 많이 알게 된다. 부단한 노력과 기술로 각각의 기업과 증권에 대해 다른 사람들보다 더 많이 지속적으로 알 수 있지만, 시장과 경제에 대해서는 노력과 기술이 그만큼 빛을 발하지 못하므로 '알 수 있는 것을 알려고' 노력하라고 제안한다. 투자자들은 자신이 현재 주기와 시계추의 어디쯤 서 있는지 파악하기 위해 노력을 해야 한다. 그런 노력이 미래를 바꾸거나 미래에 대해 알 수 있도록 만들지는 않을 것이나, 예상되는 상황에 준비할 수 있도록 도와줄 것이다. 예측은 대체로 큰 차이로 빗나갔고 예측은 실질적으로 유용하지도 않았으며 대부분의 예측은 추정을 기반으로 했고 예측에 성공한 전문가도 있었지만 예측에서 중요한 것은 한 번이 아니라 지속적으로 옳은 것이지만 꾸준히 하기는 불가능하다. \"정확한 예측을 하기는 어렵다. 특히 미래에 관해서는 그렇다.\" 투자 결과는 전적으로 미래에 어떤 일이 일어나느냐에 따라 결정될 것이고, '정상적'인 상황에서는 대체로 무슨 일이 일어날지 알 수 있다는 점이다. 하지만 아는 것이 결정적인 차이를 만들 수 있는 상황에서는 무슨 일이 일어날지 잘 모른다는 점이다. 대개 사람들은 최근의 과거와 매우 유사한 미래를 예상하고 이런 예측이 꼭 틀리지는 않는 것이, 미래에 최근의 과거가 재연되는 경우가 많다는 점이다. 그러나 과거의 경험을 기반으로 추론하는 예측은 별로 가치가 없고 미래가 과거와 비슷하게 나타나면 그럴 것이라고 정확히 예측한 사람들도 큰 수익을 올리지는 못할 것이다. 그러나 가끔은 미래가 과거와 매우 다르게 나타날 때가 있고 예측 전문가들의 역량이 빛을 발하는 것은 바로 이때이고 예측 전문가들이 틀릴 가능성이 가장 큰 것도 바로 이때이다. 주요 사건들을 정확히 예측하는 것은 가능하지만 같은 사람들이 계속해서 그러지는 못할 것이다. 결국 예측은 거의 가치가 없다고 봐야 한다. 꼭 해야 할 질문은 '예측 전문가들이 가끔은 옳은가?'가 아니라, '전체 예측이 지속적으로 유용한가?'이다. '나는 안다 (I know)' 유파 이들은 경제, 금리, 시장이 앞으로 어떤 방향으로 나아갈지를 아는 것과, 유행하는 메인스트림 주식이 투자 성공에 필수라고 생각한다. 이들은 미래를 아는 것이 가능하다고 믿는다. 자신이 예측할 수 있다는 것을 안다. 이들은 다른 많은 사람들도 예측을 시도한다는 것을 알지만, 모두가 동시에 성공하거나, 소수만이 성공할 수 있다고 생각하고 물론 자신들은 성공하는 소수에 속한다. 미래에 대한 자신의 의견을 바탕으로 투자하는 것에 거리낌이 없다. 이들은 다른 사람들과 자신의 견해를 기꺼이 나누고자 한다. 정확한 예측은 대단히 가치가 있어서, 이를 대가 없이 나누지 않아야 함에도 말이다. 예측 전문가로서 후일 자신의 기록을 엄격한 잣대로 평가하려 하지 않는다. '나는 모른다(I don't know)' 유파 '나는 모른다(I don't know)' 유파의 입장에서 '확신'이란 단어는, 특히 거시적 미래에 관련하여 입에 올리기 조심스럽다. '나는 모른다' 지지자들은 일반적으로 우리는 미래를 알 수 없으며, 미래에 대해 알 필요도 없고, 미래를 모르는 상황에서 투자에 최선을 다하는 것이 적절한 목표라고 믿는다. 미래를 알 수 없다면, 우리는 그 사실을 직시하고 예측보다 나은 대안을 찾아야 한다. 투자 세계에서는 어떤 한계가 주어지더라도, 이를 인정하고 수용하는 것이 부인하고 맞서는 것보다 훨씬 낫다. 투자자들이 가능성과 결과가 다를 수 있다는 것을 망각하는 순간 가장 큰 문제가 발생한다는 것이다. 미리 아는 것에는 다음과 같은 한계가 있음을 잊으면 안 된다. 투자자들이 확률분포의 모양을 확실히 알 수 있다고, 그리고 안다고 믿을 때 가능성이 가장 큰 결과가 나타날 것이라고 추정할 때 예상 결과가 정확히 실제 결과를 나타낸다고 추정할 때 아마도 가장 중요한 것으로, 뜻밖의 결과가 발생할 수도 있다는 가능성을 무시할 때 이러한 한계를 대수롭지 않게 생각하는 경솔한 투자자들은 포트폴리오 단계에서부터 실수를 하는 경향이 있고, 가끔 커다란 손실을 입는다. 당신은 미래를 예측할 수 있다고 생각한다면 한 가지 가능성에 따라 단정적으로 행동할 것이고, 미래를 예측할 수 없다고 생각한다면 한 가지 가능성에 얽매이지 않고 매우 다양한 방식으로 행동할 것이다. 투자자들은 미래를 알 수 있는 것으로 보느냐, 아니면 알 수 없는 것으로 보느냐 하는 중요한 질문에 답할 수 있어야 한다. 미래를 모르는 상황에서 미래를 자신이 안다고 느끼는 투자자들은 종목을 정하고, 포지션에 집중하고, 보유 자산에 레버리지를 투입하고, 앞으로의 성장에 의지하며 단정적으로 행동하면서 리스크를 증가시킬 것이다. 미래가 무엇을 쥐고 있는지 모른다고 느끼는 사람들은 분산투자를 하고, 리스크에 대비하고, 레버리지 사용을 줄이거나 아예 하지 않고, 미래가치보다는 현재가치를 중요시하고, 자본구조를 탄탄히 하고, 가능성 있는 여러 결과에 단단히 대비할 것이다. 미래를 알 수 있는 것으로 본 투자자들은 위기가 발생하기 직전 몇 년 동안은 훨씬 좋은 성과를 올렸지만 미래를 알 수 없는 것으로 본 투자자들은 위기가 발생했을 때 이에 훨씬 잘 대비되어 있었고, 쓸 수 있는 자금도 더 많아서 이 자금을 가지고 최악의 상황에서 매입함으로써 수익을 올릴 수 있었다. 불가지론자로서 알 수 없는 미래에 투자하는 것은 가능성이 낮은 일이지만, 미래를 알기 어려운 상황에서 마치 미래를 아는 것처럼 투자하는 것은 미친 짓이나 다름없다. \"몰라서 문제가 되는 것이 아니다. 확실히 알고 있는 것이 사실이 아니라는 것이 문제다.\" 알 수 있는 것, 또는 할 수 있는 것을 과대평가하는 것은 대단히 위험할 수 있다. 자신이 알 수 있는 것의 한계를 인정하는 것은 상당한 강점이 될 수 있다. [구조화] [막스 본문] 이 장은 막스 철학의 인식론적 중심이다. 알 수 없는 것을 알 수 있다고 가정하지 말라는 것이다. [막스 메모/인터뷰] 막스는 2021년 Thinking About Macro , 2022년 The Illusion of Knowledge , 2025년 Nobody Knows (Yet Again) 에서 거시 미래는 중요하지만 대체로 알 수 없고, 확신 대신 가드레일과 확률적 사고가 필요하다고 반복했다. [추론] 따라서 “나는 모른다” 유파의 포트폴리오 원칙은 분산, 레버리지 절제, 현재가치 중시, 시나리오 대비, 생존성 우선이다. [실전 질문] 내가 아는 것과 모르는 것을 명확히 분리했는가? 이 판단은 미시 분석에 근거하는가, 거시 확신에 근거하는가? 단일 시나리오가 빗나가면 포트폴리오는 얼마나 망가지는가? 가장 가능성 높은 결과 외의 대안 시나리오를 적어보았는가? 나는 의견을 갖고 있는가, 아니면 그 의견이 맞다고 과신하고 있는가? [다른 책과의 연결] [후대 해석] 강한 연결: 보글(예측 대신 구조), 하우절(room for error), 그레이엄(안전마진), 코스톨라니(확신보다 유연성). [오해 방지] [추론] “나는 모른다”는 무지나 무기력이 아니다. 과신을 버리고 구조를 설계하는 적극적 태도다. [추론] 예측을 부정한다고 해서 현재 위치 판단까지 포기하는 것은 아니다. 막스는 예측보다 관찰을 택한다."},{"i":16,"title":"15. 우리가 어디에 있는지 파악하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>우리가 어디로 가고 있는지 전혀 알 수 없어도, 우리가 지금 어디에 있는지는 잘 알고 있어야 한다.<\/li>\n<li>시장 주기는 투자자에게 힘겨운 도전 대상이다. 이는 다음과 같은 점에서 그렇다.<ul>\n<li>주기의 상승과 하락을 피할 수 없다.<\/li>\n<li>주기는 투자자들이 내는 실적에 상당한 영향을 미친다.<\/li>\n<li>주기는 그 규모와 특히 타이밍에 관해서는 예측 불가능하다.<\/li>\n<\/ul>\n<\/li>\n<li>우리는 시장 주기가 커다란 영향력을 가지고 있지만, 전체적으로 알 수 없는 그 힘에 대처해야 하지만 그 중요성에 비해 흔히 그렇듯 확실한 답이 없다.<\/li>\n<li>주기가 예측 불가능하다는 것을 인정하기보다는, 미래를 예측하기 위한 노력을 두 배로 늘림으로써 예측과의 전투에 추가 자원을 쏟아붓고 자신이 내린 결론에 대해 더 확신하는 것이다.<\/li>\n<li>우리가 주기에 대해 예측할 수 있는 단 한 가지는 바로 주기의 불가피성이다.<\/li>\n<li>우리가 할 수 있는 일은 미래를 알 수 없음을 인정하고 단념하고서 주기를 그냥 무시하고 주기를 예측하려고 노력하는 대신, 우량 투자를 해서 이를 계속 보유하면 된다.<\/li>\n<li>언제 보유량을 늘리고 줄여야 하는지, 또는 언제 태도를 좀 더 공격적으로 하고 좀 더 방어적으로 해야 할지 우리는 알지 못하므로, 주기와 주기의 심원한 효과를 완전히 무시하고 단순하게 투자할 수도 있다.<\/li>\n<li>각각의 주기에서 우리가 현재 어디쯤 서 있는지, 서 있는 자리에서 어떤 행동을 해야 하는지 파악하고자 노력하는 것이 가장 옳은 방법이다.<\/li>\n<li>투자 세계에서는 주기만큼 신뢰할 만한 것이 없다. 기본 원칙, 심리, 가격, 수익은 등락을 거듭하며 투자자로 하여금 실수를 하게 만들거나, 다른 이들의 실수로부터 수익을 올릴 수 있는 기회를 제공할 것이다.<\/li>\n<li>우리는 추세가 얼마나 멀리 갈지, 언제 변할지, 무엇이 추세를 변하게 만들지, 또는 상황이 반대 방향으로 얼마나 멀리 갈 것인지 알 수 없지만 모든 추세가 그리 오래가지는 않을 것이라고 확신한다.<\/li>\n<li>우리가 어디로 가고 있는지는 전혀 알 수 없어도, 우리가 지금 어디에 있는지는 잘 알고 있어야 한다는 것이다.<\/li>\n<li>주기가 변하는 타이밍과 규모를 예측할 수 없다면, 우리가 현재 주기의 어디쯤 위치하고 있는지 확인하고, 그에 따라 행동하려고 노력하는 것이 절대적으로 필요하다.<\/li>\n<li>시장이 극단적으로 되는 상황을 경계하고, 그에 따라 행동을 조절하고, 무엇보다 수많은 투자자들로 하여금 고점과 저점에서 커다란 실수를 하게 만드는 다수의 행동에 동조하지 않는 것이다.<\/li>\n<li>현재 위치를 알면 미래에 일어날 일들과, 그에 대해 무엇을 할 수 있을지에 대해 통찰할 수 있는 값진 기회가 제공될 것이다.<\/li>\n<li>주기를 이해하고 현재 우리의 현재 위치를 이해하는 데에는 노력이 필요하다.<ul>\n<li>무슨 일이 일어나고 있는지 늘 주의를 기울여야 한다.<\/li>\n<li>\"과거를 기억하지 못하는 사람들 때문에 과거가 반복된다.\"<\/li>\n<li>미래를 아는 것은 확실히 어려운 일이지만, 현재를 이해하는 것은 그다지 어렵지만은 않다. '시장 온도를 측정'하기만 하면 된다.<\/li>\n<li>우리 모두는 매체의 보도를 접하지만 그중에서 매일의 사건이 시장 참가자들의 심리나 투자 분위기에 대해 무엇을 암시하고 있는지, 그에 따라 우리는 어떤 행동을 해야 하는지를 알려고 노력하는 사람들은 과연 얼마나 될까?<\/li>\n<li>우리는 주변에서 일어나고 있는 일이 무엇을 암시하는지 이해하려고 노력해야 한다.<\/li>\n<li>다른 사람들이 무작정 확신하고 공격적으로 매수할 때 우리는 매우 신중하게 행동하고 다른 사람들이 공포심에 아무것도 하지 않거나, 패닉 상태에서 매도할 때 우리는 공격적으로 행동해야 한다.<\/li>\n<li>낙관적인가 비관적인가, 시장 참여를 유도하는가 피하라고 하는가, 새로운 투자 전략들이 쉽게 수용되는가 묵살되는가, 증권 상품들과 펀드 개설은 부를 창출할 수 있는 기회로 인식되는가 잠재적 위험으로 인식되는가, 신용 주기가 자본 이용을 용이하게 하는가 불가능하게 하는가, 주가수익률은 과거 기록과 비교하여 높은가 낮은가, 수익률 스프레드가 큰가 작은가 등을 살필 수 있고 이는 예측을 필요로 하지 않고 현재를 관찰하여 훌륭한 투자 결정을 내릴 수 있다.<\/li>\n<li>중요한 것은 이런 사항들을 기록하고, 그 기록을 바탕으로 무엇을 해야 할지 결정하는 것이다. 매일 우리가 행동해야 할 필요는 없지만 시장이 극단적인 상황에 있고, 시장의 성명이 매우 중요한 시점에서는 필요한 행동을 취할 필요가 있다.<\/li>\n<li>2007년에서 2008년까지는 시장과 시장 참가자들에게 매우 고통스러운 시간이 되었거나, 또는 우리 인생에서 가장 커다란 학습 경험이 되었다고 볼 수 있고 그 시기에 대해 두 가지 모두라고 생각하거나 차라리 후자였다고 생각해야 더 나은 투자자가 될 수 있다.<\/li>\n<li>현재를 정확히 관찰하는 것의 중요성과 미래를 예측하려는 어리석음을 입증하고자 할 때, 엄청난 파국을 몰고 오는 신용 위기보다 더 좋은 사례는 없다.<\/li>\n<li>신중한 투자자는 그들에게 있어 세상에서 가장 두려운 말, 즉 지나치게 많은 액수의 돈이 소수의 거래에 치중된다는 말로 이런 시장 상황을 적절하게 파악한다.<\/li>\n<li>성사 중에 있는 거래의 수가 증가할수록, 거래가 용이할수록, 자본비용이 감소할수록, 매입 중인 자산가가 연이은 거래마다 오를수록 자금 제공을 위한 경쟁은 늘어난다. 자금이 한 데로 몰리면서 이 모든 일이 일어나는 것이다.<\/li>\n<li>물건을 만들어 오랜 기간 더 많이 팔고 싶다면, 즉 경쟁업체들로부터 지속적으로 시장점유율을 선점하고 싶다면 제품의 질을 향상시키려고 노력할 것이다.<\/li>\n<li>차별화가 불가능한 일반재는 보통 구매자들은 가장 낮은 가격을 제시하는 제품을 선택하는 경향이 있고 그 제품을 더 많이 팔려면 가격을 내리는 것이다.<\/li>\n<li>자금을 싸게 만드는 한 가지 방법은 대출 이자율을 낮추는 것이거나 당신이 매입하는 자산에 좀 더 비싼 가격이 붙는 것에 동의하는 것이고 이는 낮은 예상 수익을 예상하고 대비해야 한다.<\/li>\n<li>신중한 투자자들이라면 묘책을 바라는 사람들의 욕심이 너무 커졌으며, 이는 탐욕이 공포를 이겼다는 것을 의미하고 의심하지 않는 시장이 등장했다는 신호라는 것을 알아차렸을 것이다.<\/li>\n<li>시장이 과열되어 있는 동안 실제로 해야 할 일은 시장의 온도를 측정하고, 상황이 지속될 경우 시장에서 나오는 것뿐이었다.<\/li>\n<li>가속 페달을 밟을 것인가, 말 것인가에 대한 부담감은 도로가 비어 있는지, 아니면 붐비는지에 따라 다르고 어떤 겉옷을 입을 것인가는 날씨에 따라 다르다. 투자와 관련된 우리의 행동도 똑같이 투자 기후에 따라 영향을 받을 수밖에 없지 않겠는가?<\/li>\n<li>대부분의 사람들은 자신이 생각하는 미래를 기반으로 포트폴리오를 조정하려고 한다. 동시에 많은 사람들이 눈앞에 놓인 상황이 그렇게 좋지는 않음을 인정할 것이다. 그런 점에서 나는 미래를 예측하는 것을 반대하며, 현재 상황과 그것이 의미하는 바에 따라 행동할 것을 주장한다.<\/li>\n<li>시장의 온도 파악 시 경기, 전망, 대출기관, 자본, 금리, 스프레드, 투자자심리, 자산 보유주, 매각자, 시장, 펀드, 최근 실적, 자산가, 예상 수익, 리스크, 일반적 특징 등을 살펴 판단하여 투자 여부를 판단해야 한다.<\/li>\n<li>위험 요소인지 기회 요소인지 또 이와 관련해 무엇을 해야 하는지는 주위에서 무슨 일이 일어나고 있는지 이해하려고 노력하고, 그에 따라 행동해야 한다.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 예측 대신 관찰을 택한다. 핵심은 “어디로 갈까?”가 아니라 “지금 얼마나 뜨겁나?”다.<\/li>\n<li>[막스 메모/인터뷰] 막스는 <code>Taking the Temperature<\/code>에서 강한 콜은 극단 구간에서만 가능했고, 그 근거는 미래 예측이 아니라 낮은 회의·낮은 공포·낮은 리스크 회피·얇은 리스크 프리미엄 같은 현재 신호의 관찰이라고 설명했다.<\/li>\n<li>[추론] 이 장은 책 전체를 실무 체크리스트로 바꾸는 허브다. 아래 <code>시장온도 점검표<\/code>는 이 장의 실행 버전이다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>지금 시장은 뜨거운가, 차가운가, 중립인가?<\/li>\n<li>뉴스는 위험을 확대 해석하는가, 축소 해석하는가?<\/li>\n<li>자본조달은 쉬운가, 어려운가?<\/li>\n<li>투자자들은 확신이 많은가, 의심이 많은가?<\/li>\n<li>지금 필요한 것은 공격인가, 방어인가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 코스톨라니(분위기 읽기), 하우절(서사와 심리), 보글(예측보다 규율), 그레이엄(극단 구간의 미스터 마켓 활용).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 현재 위치 파악은 시장 예언이 아니다.<\/li>\n<li>[추론] 시장온도는 전량 매매 신호가 아니라 기준 강화/완화의 근거다.<\/li>\n<\/ul>","text":"기존 노트 우리가 어디로 가고 있는지 전혀 알 수 없어도, 우리가 지금 어디에 있는지는 잘 알고 있어야 한다. 시장 주기는 투자자에게 힘겨운 도전 대상이다. 이는 다음과 같은 점에서 그렇다. 주기의 상승과 하락을 피할 수 없다. 주기는 투자자들이 내는 실적에 상당한 영향을 미친다. 주기는 그 규모와 특히 타이밍에 관해서는 예측 불가능하다. 우리는 시장 주기가 커다란 영향력을 가지고 있지만, 전체적으로 알 수 없는 그 힘에 대처해야 하지만 그 중요성에 비해 흔히 그렇듯 확실한 답이 없다. 주기가 예측 불가능하다는 것을 인정하기보다는, 미래를 예측하기 위한 노력을 두 배로 늘림으로써 예측과의 전투에 추가 자원을 쏟아붓고 자신이 내린 결론에 대해 더 확신하는 것이다. 우리가 주기에 대해 예측할 수 있는 단 한 가지는 바로 주기의 불가피성이다. 우리가 할 수 있는 일은 미래를 알 수 없음을 인정하고 단념하고서 주기를 그냥 무시하고 주기를 예측하려고 노력하는 대신, 우량 투자를 해서 이를 계속 보유하면 된다. 언제 보유량을 늘리고 줄여야 하는지, 또는 언제 태도를 좀 더 공격적으로 하고 좀 더 방어적으로 해야 할지 우리는 알지 못하므로, 주기와 주기의 심원한 효과를 완전히 무시하고 단순하게 투자할 수도 있다. 각각의 주기에서 우리가 현재 어디쯤 서 있는지, 서 있는 자리에서 어떤 행동을 해야 하는지 파악하고자 노력하는 것이 가장 옳은 방법이다. 투자 세계에서는 주기만큼 신뢰할 만한 것이 없다. 기본 원칙, 심리, 가격, 수익은 등락을 거듭하며 투자자로 하여금 실수를 하게 만들거나, 다른 이들의 실수로부터 수익을 올릴 수 있는 기회를 제공할 것이다. 우리는 추세가 얼마나 멀리 갈지, 언제 변할지, 무엇이 추세를 변하게 만들지, 또는 상황이 반대 방향으로 얼마나 멀리 갈 것인지 알 수 없지만 모든 추세가 그리 오래가지는 않을 것이라고 확신한다. 우리가 어디로 가고 있는지는 전혀 알 수 없어도, 우리가 지금 어디에 있는지는 잘 알고 있어야 한다는 것이다. 주기가 변하는 타이밍과 규모를 예측할 수 없다면, 우리가 현재 주기의 어디쯤 위치하고 있는지 확인하고, 그에 따라 행동하려고 노력하는 것이 절대적으로 필요하다. 시장이 극단적으로 되는 상황을 경계하고, 그에 따라 행동을 조절하고, 무엇보다 수많은 투자자들로 하여금 고점과 저점에서 커다란 실수를 하게 만드는 다수의 행동에 동조하지 않는 것이다. 현재 위치를 알면 미래에 일어날 일들과, 그에 대해 무엇을 할 수 있을지에 대해 통찰할 수 있는 값진 기회가 제공될 것이다. 주기를 이해하고 현재 우리의 현재 위치를 이해하는 데에는 노력이 필요하다. 무슨 일이 일어나고 있는지 늘 주의를 기울여야 한다. \"과거를 기억하지 못하는 사람들 때문에 과거가 반복된다.\" 미래를 아는 것은 확실히 어려운 일이지만, 현재를 이해하는 것은 그다지 어렵지만은 않다. '시장 온도를 측정'하기만 하면 된다. 우리 모두는 매체의 보도를 접하지만 그중에서 매일의 사건이 시장 참가자들의 심리나 투자 분위기에 대해 무엇을 암시하고 있는지, 그에 따라 우리는 어떤 행동을 해야 하는지를 알려고 노력하는 사람들은 과연 얼마나 될까? 우리는 주변에서 일어나고 있는 일이 무엇을 암시하는지 이해하려고 노력해야 한다. 다른 사람들이 무작정 확신하고 공격적으로 매수할 때 우리는 매우 신중하게 행동하고 다른 사람들이 공포심에 아무것도 하지 않거나, 패닉 상태에서 매도할 때 우리는 공격적으로 행동해야 한다. 낙관적인가 비관적인가, 시장 참여를 유도하는가 피하라고 하는가, 새로운 투자 전략들이 쉽게 수용되는가 묵살되는가, 증권 상품들과 펀드 개설은 부를 창출할 수 있는 기회로 인식되는가 잠재적 위험으로 인식되는가, 신용 주기가 자본 이용을 용이하게 하는가 불가능하게 하는가, 주가수익률은 과거 기록과 비교하여 높은가 낮은가, 수익률 스프레드가 큰가 작은가 등을 살필 수 있고 이는 예측을 필요로 하지 않고 현재를 관찰하여 훌륭한 투자 결정을 내릴 수 있다. 중요한 것은 이런 사항들을 기록하고, 그 기록을 바탕으로 무엇을 해야 할지 결정하는 것이다. 매일 우리가 행동해야 할 필요는 없지만 시장이 극단적인 상황에 있고, 시장의 성명이 매우 중요한 시점에서는 필요한 행동을 취할 필요가 있다. 2007년에서 2008년까지는 시장과 시장 참가자들에게 매우 고통스러운 시간이 되었거나, 또는 우리 인생에서 가장 커다란 학습 경험이 되었다고 볼 수 있고 그 시기에 대해 두 가지 모두라고 생각하거나 차라리 후자였다고 생각해야 더 나은 투자자가 될 수 있다. 현재를 정확히 관찰하는 것의 중요성과 미래를 예측하려는 어리석음을 입증하고자 할 때, 엄청난 파국을 몰고 오는 신용 위기보다 더 좋은 사례는 없다. 신중한 투자자는 그들에게 있어 세상에서 가장 두려운 말, 즉 지나치게 많은 액수의 돈이 소수의 거래에 치중된다는 말로 이런 시장 상황을 적절하게 파악한다. 성사 중에 있는 거래의 수가 증가할수록, 거래가 용이할수록, 자본비용이 감소할수록, 매입 중인 자산가가 연이은 거래마다 오를수록 자금 제공을 위한 경쟁은 늘어난다. 자금이 한 데로 몰리면서 이 모든 일이 일어나는 것이다. 물건을 만들어 오랜 기간 더 많이 팔고 싶다면, 즉 경쟁업체들로부터 지속적으로 시장점유율을 선점하고 싶다면 제품의 질을 향상시키려고 노력할 것이다. 차별화가 불가능한 일반재는 보통 구매자들은 가장 낮은 가격을 제시하는 제품을 선택하는 경향이 있고 그 제품을 더 많이 팔려면 가격을 내리는 것이다. 자금을 싸게 만드는 한 가지 방법은 대출 이자율을 낮추는 것이거나 당신이 매입하는 자산에 좀 더 비싼 가격이 붙는 것에 동의하는 것이고 이는 낮은 예상 수익을 예상하고 대비해야 한다. 신중한 투자자들이라면 묘책을 바라는 사람들의 욕심이 너무 커졌으며, 이는 탐욕이 공포를 이겼다는 것을 의미하고 의심하지 않는 시장이 등장했다는 신호라는 것을 알아차렸을 것이다. 시장이 과열되어 있는 동안 실제로 해야 할 일은 시장의 온도를 측정하고, 상황이 지속될 경우 시장에서 나오는 것뿐이었다. 가속 페달을 밟을 것인가, 말 것인가에 대한 부담감은 도로가 비어 있는지, 아니면 붐비는지에 따라 다르고 어떤 겉옷을 입을 것인가는 날씨에 따라 다르다. 투자와 관련된 우리의 행동도 똑같이 투자 기후에 따라 영향을 받을 수밖에 없지 않겠는가? 대부분의 사람들은 자신이 생각하는 미래를 기반으로 포트폴리오를 조정하려고 한다. 동시에 많은 사람들이 눈앞에 놓인 상황이 그렇게 좋지는 않음을 인정할 것이다. 그런 점에서 나는 미래를 예측하는 것을 반대하며, 현재 상황과 그것이 의미하는 바에 따라 행동할 것을 주장한다. 시장의 온도 파악 시 경기, 전망, 대출기관, 자본, 금리, 스프레드, 투자자심리, 자산 보유주, 매각자, 시장, 펀드, 최근 실적, 자산가, 예상 수익, 리스크, 일반적 특징 등을 살펴 판단하여 투자 여부를 판단해야 한다. 위험 요소인지 기회 요소인지 또 이와 관련해 무엇을 해야 하는지는 주위에서 무슨 일이 일어나고 있는지 이해하려고 노력하고, 그에 따라 행동해야 한다. [구조화] [막스 본문] 이 장은 예측 대신 관찰을 택한다. 핵심은 “어디로 갈까?”가 아니라 “지금 얼마나 뜨겁나?”다. [막스 메모/인터뷰] 막스는 Taking the Temperature 에서 강한 콜은 극단 구간에서만 가능했고, 그 근거는 미래 예측이 아니라 낮은 회의·낮은 공포·낮은 리스크 회피·얇은 리스크 프리미엄 같은 현재 신호의 관찰이라고 설명했다. [추론] 이 장은 책 전체를 실무 체크리스트로 바꾸는 허브다. 아래 시장온도 점검표 는 이 장의 실행 버전이다. [실전 질문] 지금 시장은 뜨거운가, 차가운가, 중립인가? 뉴스는 위험을 확대 해석하는가, 축소 해석하는가? 자본조달은 쉬운가, 어려운가? 투자자들은 확신이 많은가, 의심이 많은가? 지금 필요한 것은 공격인가, 방어인가? [다른 책과의 연결] [후대 해석] 강한 연결: 코스톨라니(분위기 읽기), 하우절(서사와 심리), 보글(예측보다 규율), 그레이엄(극단 구간의 미스터 마켓 활용). [오해 방지] [추론] 현재 위치 파악은 시장 예언이 아니다. [추론] 시장온도는 전량 매매 신호가 아니라 기준 강화/완화의 근거다."},{"i":17,"title":"16. 행운의 존재를 가볍게 보지 마라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>가끔씩 누군가가 있을 수 없거나 불확실한 결과에 위험한 내기를 해서 천재처럼 보이는 것으로 결말이 날 때가 있다. 그러나 이는 실력이 아니라, '운'이나 대담성 때문에 일어난 일이라는 것을 알아야 한다.<\/li>\n<li>사실 투자의 많은 부분이 '운'에 좌우된다. 우리가 투자자로서 누리는 성공의 많은 부분이 주사위를 던져 얻는 것과 마찬가지이기 때문이다.<\/li>\n<li>임의성 또는 운은 우리 삶 속에서 결과에 커다란 영향을 미치기에, 임의의 사건들에 좌우되는 결과들은, 그렇지 않은 결과들과 차별되어야 한다.<\/li>\n<li>투자 실적이 반복될 가능성이 있는지를 고려할 때, 매니저의 실적에서 임의성이 미치는 영향과, 그 실적이 기술에서 나오는 것인지, 아니면 단순히 운 때문인지 생각해봐야 한다.<\/li>\n<li>\"러시안 룰렛으로 1000만 달러를 버는 것과, 성실하고 솜씨 좋은 치과 치료로 1000만 달러를 버는 것은 다른 가치를 지닌다. 똑같은 돈이지만 한쪽이 임의성에 의존하는 정도가 다른 쪽에 비해 훨씬 크다는 것이다.\"<\/li>\n<li>모든 실적을 고려할 때는 이미 일어난 '눈에 보이는 역사'처럼, 필시 일어날 수도 있었을 다른 결과와 비교해야 한다. (대체 역사)<\/li>\n<li>\"확실히 내가 문제를 판단하는 방식은 확률론적인 성질을 띠고 있다. 즉 \"확률적으로 어떤 일이 일어날 수 있었을까?\" 하는 관념에 의존한다.\"<\/li>\n<li>가끔씩 누군가 있을 수 없거나 불확실한 결과에 위험한 내기를 해서 천재처럼 보이는 것으로 결말이 날 때가 있다. 그러나 이는 실력이 아니라, 운이나 대담성 때문에 일어난 일이라는 것을 알아야 한다.<\/li>\n<li>단기적으로 봤을 때, 많은 투자 성공이 운이 맞아떨어진 데서 나온 것일 수 있다.<\/li>\n<li>수익의 핵심은 공격성, 타이밍, 기술에 있으며, 적당한 시기에 충분히 공격적인 사람에게는 많은 기술이 필요하지 않다고 말한다.<\/li>\n<li>\"시장에서 일정 시간에 가장 수익성이 좋은 거래인들은 상승장에 가장 잘 어울릴 것이다. 그러나 이는 임의적이라는 특성 때문에 치과의사들이나 피아니스트들에게는 자주 일어나지 않는다.\"<\/li>\n<li>경기가 호황일 때 가장 큰 수익이 종종 가장 많은 리스크를 감수한 사람들에게 간다는 것에서 이를 쉽게 확인할 수 있다. 그러나 이들이 최고의 투자자들이라는 증거는 어디에도 없다.<\/li>\n<li>임의성은 소수의 사람들만 제대로 평가할 수 있는 정도로 투자 실적에 기여한다. 그 결과 훨씬 성공적인 전략 안에 숨어 있는 위험들이 종종 과소평가된다.<\/li>\n<li>투자자들은 언제나 '잘못된 이유'로 옳다(또는 틀리다).<\/li>\n<li>투자 결정의 적절성은 결과로 판단해서는 안 된다. 적절한 결정이 종종 실패하기도 하고, 적절하지 못한 결정이 성공하기도 한다.<\/li>\n<li>임의성 하나만으로 단기적으로는 그 어떤 결과도 나올 수 있다. 그러나 확실히 시가 변동이 매니저의 공이라고 말할 수는 없다.<\/li>\n<li>투자자들은 종종 있지도 않은 공적을 인정 받는다. 한 번의 대성공으로도 명성을 쌓기는 충분하지만, 한 번의 성공은 확실히 임의성만으로도 가능하다. 다만 연달아 한두 번 이상 옳은 사람은 몇 안 된다.<\/li>\n<li>특정 매니저의 능력을 판단하기 전에 매니저에 대한 충분한 관찰(다년간의 데이터)이 필요하다.<\/li>\n<li>'대체 역사(일어날 수도 있었던 다른 사건들)'는 아주 매력적인 개념이며 특히 투자와도 관련 있다.<\/li>\n<li>탈레브는 이미 일어난 사건이 일어날 가능성이 있었던 사건들의 일부에 지나지 않는 것임을 지적한다. 어떤 전략이나 행동이 효과적이었다는 사실이, 이미 드러난 상황에서 그 배후의 결정이 현명했다는 것을 꼭 입증하는 것은 아니다.<\/li>\n<li>궁극적으로 결정을 성공적으로 만들었던 것은 어쩌면 전혀 일어날 것 같지 않은 사건, 즉 단지 운의 문제였을 수도 있다는 것이다.<\/li>\n<li>운 좋게 끝은 났지만 매우 불확실했던 결과에 내기를 한 것에 대해 결정의 당사자는 얼마큼의 공로를 인정받아야 하는 걸까?<\/li>\n<li>좋은 결정이란 논리적이고, 현명하며, 상황을 충분히 인지한 사람이 미래를 알 수 없는 상황에서 그 순간의 상황에 맞게 하는 것이다.<\/li>\n<li>의사결정의 적절성과 관련이 있게 될 많은 부분을 우리는 미리 알 수 없거나, 수량화할 수 없고 심지어 일이 벌어지고 난 후에도, 누가 확실한 분석을 바탕으로 좋은 결정을 내렸으나 생각지도 못한 사건으로 불이익을 당했는지, 그리고 누가 무모한 시도로부터 이익을 얻었는지 확실히 하기 어려울 수 있다.<\/li>\n<li>누가 최고의 결정을 내렸는지 또한 알기 어렵다. 반면 누가 가장 수익성 있는 결정을 내렸는지 알기 쉽게 만들면 과거의 결과는 쉽게 평가할 수 있다.<\/li>\n<li>장기적으로 봤을 때 좋은 결정이 수익을 창출해줄 것이라는 믿음에 대해 마땅한 대안이 없다. 그러나 단기적으로는 다른 사람들이 냉정하지 못할 때 우리는 냉정해야 한다.<\/li>\n<li>'나는 안다' 유파의 투자자들은 미래를 아는 것이 가능하다고 생각하고 그들은 가장 그럴듯한 미래를 예상한 다음, 나머지 가능성들은 무시한 채 예상되는 하나의 시나리오상에서 수익을 최대화할 수 있는 포트폴리오를 설계한다.<\/li>\n<li>'나는 모른다' 유파는 주어진 상태에서 최선을 다하는 투자자들은 자신들이 가능성 있다고 생각하는 시나리오상에서 좋은 결과가 나올 수 있고, 여타의 상황에서도 그렇게 나쁜 결과를 내지는 않을 정도의 포트폴리오를 설계하는 데 역점을 둔다.<\/li>\n<li>'나는 안다' 유파의 투자자들은 주사위가 어떻게 나올지를 예측하고, 자신의 성공이 미래를 예견하는 자신의 뛰어난 감각 때문이라고 생각하고 상황이 뜻대로 되지 않을 때면 불운을 탓한다.<\/li>\n<li>확률론적으로 접근하는 '나는 모른다' 유파의 투자자들은 결과가 대체로 신의 뜻에 달려 있다고 생각하기 때문에, 투자자들에게 돌아가는 공이나 책임이 적당히 제한되어야 한다(특히 단기적으로 봤을 때)고 생각한다.<\/li>\n<li>'나는 안다' 유파에서는 주사위를 한두 번 던져서 나온 결과를 토대로, 구성원을 승자와 패자로 신속하고 단호하게 나눈다.<\/li>\n<li>'나는 모른다' 유파는 구성원들의 실력을 판단하기 위해서는 주사위를 단 한 번이 아니라 충분히 많이 던져야 한다고 믿는다. 이들은 신중하고 주어진 상황에서 최선을 다하는 자신들의 방식이 한동안은 눈에 띄지 않는 결과를 낼 수 있음을 인정한다.<\/li>\n<li>믿기 어려울 정도로 좋은 결과와 나쁜 결과는 단지 동전의 앞뒷면일 뿐이고 단기 수익과 단기 손실은 둘 다 실제 투자 능력을 보여주지는 않는다.<\/li>\n<li>일어난 사건들(일어나지 않은 다른 가능성들도)이 실제로 포트폴리오 매니저의 시야 안에 있었던 것일까? 다른 사건이 대신 일어났다면 성과는 어땠을까? 그 다른 사건들이 바로 탈레브의 '대체 역사'이다.<\/li>\n<li>임의성이 투자 결과에 얼마나 지대한 영향을 끼치는지를 깨닫고 나면, 당신은 모든 것을 매우 다른 시각으로 볼 수 있을 것이다.<\/li>\n<li>'나는 안다' 유파의 행동은 미래는 하나이며, 그 미래를 알 수 있고 정복할 수 있다는 견해를 기반으로 하지만 '나는 모른다' 유파는 확률분포의 측면에서 미래의 사건을 생각한다.<\/li>\n<li>우리는 알기 어려운 거시경제와 광범위한 시장 성과로부터 예상할 수 있는 것을 기반으로 결정을 내리기보다는, 알 수 있는 것 중에서 가치를 찾고자 노력하며 시간을 보내야 한다.<\/li>\n<li>정확히 미래가 어떤 모습일지 모른다는 것을 감안하면, 우리는 가치를 확고히 하며, 분석을 통해 얻은 의견을 가지는 한편, 기회가 스스로 찾아왔을 때 자산을 가치보다 더 싸게 매수함으로써 가치가 우리편이 되도록 만들어야 한다.<\/li>\n<li>많은 결과들이 우리에게 불리할 가능성이 크므로 우리는 방어적 투자를 해야 한다. 유리한 결과 아래서 최대한의 수익을 보장하는 것보다 불리한 결과 아래서 확실히 살아남는 것이 더 중요하다.<\/li>\n<li>성공 기회를 늘리려면 시장의 극단적인 상황에 있을 때 다수와 반대로 행동하는 것, 즉 약세장에서는 공격적으로 강세장에서는 신중하게 행동해야 한다.<\/li>\n<li>결과의 매우 불확실한 특성을 감안하여 우리는 여러 전략들과 그에 따르는 결과들이 좋든, 나쁘든 많은 시도를 통해 효력이 입증될 때까지 의심의 눈으로 봐야 한다.<\/li>\n<li>리스크를 합리적인 선에서 존중하기, 미래가 무엇을 쥐고 있을지 모른다는 것을 인식하기, 우리가 할 수 있는 최선은 미래를 확률분포로 보고 그에 따라 투자하는 것임을 이해하기, 함정을 피하는 데 역점을 두기 등이 신중한 투자에서 가장 중요한 요소들이다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 결과보다 과정, 성공보다 재현 가능성에 주목하게 만든다.<\/li>\n<li>[추론] 단기 성과 평가가 강할수록 운과 실력을 혼동하고, 그 혼동이 과도한 자기확신과 레버리지로 이어진다.<\/li>\n<li>[현대 적용] 투자 검토에서는 “수익률”과 별도로 “그 의사결정이 다른 대체 역사에서도 합리적이었는가?”를 문서화해야 한다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이번 성과는 실력인가, 우연한 환경 적합성인가?<\/li>\n<li>반대 시나리오가 실현됐다면 이 결정은 어떻게 보였을까?<\/li>\n<li>나는 결과로 사람을 평가하는가, 과정으로 평가하는가?<\/li>\n<li>최근의 성공이 더 큰 리스크를 정당화한다고 착각하고 있지 않은가?<\/li>\n<li>충분한 기간과 충분한 표본 없이 실력을 단정하고 있지 않은가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 하우절(행운과 위험), 보글(단기 성과 숭배 경계), 그레이엄(과정 중심), 코스톨라니(시장의 우연성 인식).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 운의 존재를 인정하는 것은 분석 무용론이 아니다.<\/li>\n<li>[추론] 결과가 좋다고 좋은 결정이 아니고, 결과가 나쁘다고 나쁜 결정도 아니다.<\/li>\n<\/ul>","text":"기존 노트 가끔씩 누군가가 있을 수 없거나 불확실한 결과에 위험한 내기를 해서 천재처럼 보이는 것으로 결말이 날 때가 있다. 그러나 이는 실력이 아니라, '운'이나 대담성 때문에 일어난 일이라는 것을 알아야 한다. 사실 투자의 많은 부분이 '운'에 좌우된다. 우리가 투자자로서 누리는 성공의 많은 부분이 주사위를 던져 얻는 것과 마찬가지이기 때문이다. 임의성 또는 운은 우리 삶 속에서 결과에 커다란 영향을 미치기에, 임의의 사건들에 좌우되는 결과들은, 그렇지 않은 결과들과 차별되어야 한다. 투자 실적이 반복될 가능성이 있는지를 고려할 때, 매니저의 실적에서 임의성이 미치는 영향과, 그 실적이 기술에서 나오는 것인지, 아니면 단순히 운 때문인지 생각해봐야 한다. \"러시안 룰렛으로 1000만 달러를 버는 것과, 성실하고 솜씨 좋은 치과 치료로 1000만 달러를 버는 것은 다른 가치를 지닌다. 똑같은 돈이지만 한쪽이 임의성에 의존하는 정도가 다른 쪽에 비해 훨씬 크다는 것이다.\" 모든 실적을 고려할 때는 이미 일어난 '눈에 보이는 역사'처럼, 필시 일어날 수도 있었을 다른 결과와 비교해야 한다. (대체 역사) \"확실히 내가 문제를 판단하는 방식은 확률론적인 성질을 띠고 있다. 즉 \"확률적으로 어떤 일이 일어날 수 있었을까?\" 하는 관념에 의존한다.\" 가끔씩 누군가 있을 수 없거나 불확실한 결과에 위험한 내기를 해서 천재처럼 보이는 것으로 결말이 날 때가 있다. 그러나 이는 실력이 아니라, 운이나 대담성 때문에 일어난 일이라는 것을 알아야 한다. 단기적으로 봤을 때, 많은 투자 성공이 운이 맞아떨어진 데서 나온 것일 수 있다. 수익의 핵심은 공격성, 타이밍, 기술에 있으며, 적당한 시기에 충분히 공격적인 사람에게는 많은 기술이 필요하지 않다고 말한다. \"시장에서 일정 시간에 가장 수익성이 좋은 거래인들은 상승장에 가장 잘 어울릴 것이다. 그러나 이는 임의적이라는 특성 때문에 치과의사들이나 피아니스트들에게는 자주 일어나지 않는다.\" 경기가 호황일 때 가장 큰 수익이 종종 가장 많은 리스크를 감수한 사람들에게 간다는 것에서 이를 쉽게 확인할 수 있다. 그러나 이들이 최고의 투자자들이라는 증거는 어디에도 없다. 임의성은 소수의 사람들만 제대로 평가할 수 있는 정도로 투자 실적에 기여한다. 그 결과 훨씬 성공적인 전략 안에 숨어 있는 위험들이 종종 과소평가된다. 투자자들은 언제나 '잘못된 이유'로 옳다(또는 틀리다). 투자 결정의 적절성은 결과로 판단해서는 안 된다. 적절한 결정이 종종 실패하기도 하고, 적절하지 못한 결정이 성공하기도 한다. 임의성 하나만으로 단기적으로는 그 어떤 결과도 나올 수 있다. 그러나 확실히 시가 변동이 매니저의 공이라고 말할 수는 없다. 투자자들은 종종 있지도 않은 공적을 인정 받는다. 한 번의 대성공으로도 명성을 쌓기는 충분하지만, 한 번의 성공은 확실히 임의성만으로도 가능하다. 다만 연달아 한두 번 이상 옳은 사람은 몇 안 된다. 특정 매니저의 능력을 판단하기 전에 매니저에 대한 충분한 관찰(다년간의 데이터)이 필요하다. '대체 역사(일어날 수도 있었던 다른 사건들)'는 아주 매력적인 개념이며 특히 투자와도 관련 있다. 탈레브는 이미 일어난 사건이 일어날 가능성이 있었던 사건들의 일부에 지나지 않는 것임을 지적한다. 어떤 전략이나 행동이 효과적이었다는 사실이, 이미 드러난 상황에서 그 배후의 결정이 현명했다는 것을 꼭 입증하는 것은 아니다. 궁극적으로 결정을 성공적으로 만들었던 것은 어쩌면 전혀 일어날 것 같지 않은 사건, 즉 단지 운의 문제였을 수도 있다는 것이다. 운 좋게 끝은 났지만 매우 불확실했던 결과에 내기를 한 것에 대해 결정의 당사자는 얼마큼의 공로를 인정받아야 하는 걸까? 좋은 결정이란 논리적이고, 현명하며, 상황을 충분히 인지한 사람이 미래를 알 수 없는 상황에서 그 순간의 상황에 맞게 하는 것이다. 의사결정의 적절성과 관련이 있게 될 많은 부분을 우리는 미리 알 수 없거나, 수량화할 수 없고 심지어 일이 벌어지고 난 후에도, 누가 확실한 분석을 바탕으로 좋은 결정을 내렸으나 생각지도 못한 사건으로 불이익을 당했는지, 그리고 누가 무모한 시도로부터 이익을 얻었는지 확실히 하기 어려울 수 있다. 누가 최고의 결정을 내렸는지 또한 알기 어렵다. 반면 누가 가장 수익성 있는 결정을 내렸는지 알기 쉽게 만들면 과거의 결과는 쉽게 평가할 수 있다. 장기적으로 봤을 때 좋은 결정이 수익을 창출해줄 것이라는 믿음에 대해 마땅한 대안이 없다. 그러나 단기적으로는 다른 사람들이 냉정하지 못할 때 우리는 냉정해야 한다. '나는 안다' 유파의 투자자들은 미래를 아는 것이 가능하다고 생각하고 그들은 가장 그럴듯한 미래를 예상한 다음, 나머지 가능성들은 무시한 채 예상되는 하나의 시나리오상에서 수익을 최대화할 수 있는 포트폴리오를 설계한다. '나는 모른다' 유파는 주어진 상태에서 최선을 다하는 투자자들은 자신들이 가능성 있다고 생각하는 시나리오상에서 좋은 결과가 나올 수 있고, 여타의 상황에서도 그렇게 나쁜 결과를 내지는 않을 정도의 포트폴리오를 설계하는 데 역점을 둔다. '나는 안다' 유파의 투자자들은 주사위가 어떻게 나올지를 예측하고, 자신의 성공이 미래를 예견하는 자신의 뛰어난 감각 때문이라고 생각하고 상황이 뜻대로 되지 않을 때면 불운을 탓한다. 확률론적으로 접근하는 '나는 모른다' 유파의 투자자들은 결과가 대체로 신의 뜻에 달려 있다고 생각하기 때문에, 투자자들에게 돌아가는 공이나 책임이 적당히 제한되어야 한다(특히 단기적으로 봤을 때)고 생각한다. '나는 안다' 유파에서는 주사위를 한두 번 던져서 나온 결과를 토대로, 구성원을 승자와 패자로 신속하고 단호하게 나눈다. '나는 모른다' 유파는 구성원들의 실력을 판단하기 위해서는 주사위를 단 한 번이 아니라 충분히 많이 던져야 한다고 믿는다. 이들은 신중하고 주어진 상황에서 최선을 다하는 자신들의 방식이 한동안은 눈에 띄지 않는 결과를 낼 수 있음을 인정한다. 믿기 어려울 정도로 좋은 결과와 나쁜 결과는 단지 동전의 앞뒷면일 뿐이고 단기 수익과 단기 손실은 둘 다 실제 투자 능력을 보여주지는 않는다. 일어난 사건들(일어나지 않은 다른 가능성들도)이 실제로 포트폴리오 매니저의 시야 안에 있었던 것일까? 다른 사건이 대신 일어났다면 성과는 어땠을까? 그 다른 사건들이 바로 탈레브의 '대체 역사'이다. 임의성이 투자 결과에 얼마나 지대한 영향을 끼치는지를 깨닫고 나면, 당신은 모든 것을 매우 다른 시각으로 볼 수 있을 것이다. '나는 안다' 유파의 행동은 미래는 하나이며, 그 미래를 알 수 있고 정복할 수 있다는 견해를 기반으로 하지만 '나는 모른다' 유파는 확률분포의 측면에서 미래의 사건을 생각한다. 우리는 알기 어려운 거시경제와 광범위한 시장 성과로부터 예상할 수 있는 것을 기반으로 결정을 내리기보다는, 알 수 있는 것 중에서 가치를 찾고자 노력하며 시간을 보내야 한다. 정확히 미래가 어떤 모습일지 모른다는 것을 감안하면, 우리는 가치를 확고히 하며, 분석을 통해 얻은 의견을 가지는 한편, 기회가 스스로 찾아왔을 때 자산을 가치보다 더 싸게 매수함으로써 가치가 우리편이 되도록 만들어야 한다. 많은 결과들이 우리에게 불리할 가능성이 크므로 우리는 방어적 투자를 해야 한다. 유리한 결과 아래서 최대한의 수익을 보장하는 것보다 불리한 결과 아래서 확실히 살아남는 것이 더 중요하다. 성공 기회를 늘리려면 시장의 극단적인 상황에 있을 때 다수와 반대로 행동하는 것, 즉 약세장에서는 공격적으로 강세장에서는 신중하게 행동해야 한다. 결과의 매우 불확실한 특성을 감안하여 우리는 여러 전략들과 그에 따르는 결과들이 좋든, 나쁘든 많은 시도를 통해 효력이 입증될 때까지 의심의 눈으로 봐야 한다. 리스크를 합리적인 선에서 존중하기, 미래가 무엇을 쥐고 있을지 모른다는 것을 인식하기, 우리가 할 수 있는 최선은 미래를 확률분포로 보고 그에 따라 투자하는 것임을 이해하기, 함정을 피하는 데 역점을 두기 등이 신중한 투자에서 가장 중요한 요소들이다. [구조화] [막스 본문] 이 장은 결과보다 과정, 성공보다 재현 가능성에 주목하게 만든다. [추론] 단기 성과 평가가 강할수록 운과 실력을 혼동하고, 그 혼동이 과도한 자기확신과 레버리지로 이어진다. [현대 적용] 투자 검토에서는 “수익률”과 별도로 “그 의사결정이 다른 대체 역사에서도 합리적이었는가?”를 문서화해야 한다. [실전 질문] 이번 성과는 실력인가, 우연한 환경 적합성인가? 반대 시나리오가 실현됐다면 이 결정은 어떻게 보였을까? 나는 결과로 사람을 평가하는가, 과정으로 평가하는가? 최근의 성공이 더 큰 리스크를 정당화한다고 착각하고 있지 않은가? 충분한 기간과 충분한 표본 없이 실력을 단정하고 있지 않은가? [다른 책과의 연결] [후대 해석] 강한 연결: 하우절(행운과 위험), 보글(단기 성과 숭배 경계), 그레이엄(과정 중심), 코스톨라니(시장의 우연성 인식). [오해 방지] [추론] 운의 존재를 인정하는 것은 분석 무용론이 아니다. [추론] 결과가 좋다고 좋은 결정이 아니고, 결과가 나쁘다고 나쁜 결정도 아니다."},{"i":18,"title":"17. 방어적으로 투자하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>세상에는 나이 든 투자자도 있고 대담한 투자자도 있지만, 나이 들고 대담한 투자자는 없다.<\/li>\n<li>\"돈을 버는 것과 손실을 피하는 것 중에 무엇이 더 중요한가?\"라는 질문에 다들 \"그야 둘 다지.\"라는 대답이 이어진다.<\/li>\n<li>문제는 수익 창출과 손실 회피 두 마리 토끼를 동시에 잡을 수 없고 둘 사이에 적당한 균형을 이루는 것이 필요하다. 그리고 이에 대한 결정은 의식적이고 합리적으로 해야 한다.<\/li>\n<li>이 결정을 균형 잡힌 시각으로 보는 최고의 방법은, 이 문제를 '공격 대 방어'의 개념으로 생각하는 것이고 이를 위한 최고의 방법 중 하나는 스포츠에 비유하여 생각해보는 것이다.<\/li>\n<li>프로 테니스는 '승자의 게임'으로 가장 많은 득점을 하는 선수가 경기에서 우승하고 상대 선수의 공을 대부분 받아치며, 공을 가지고 거의 항상 자신이 원하는 대로 한다.<\/li>\n<li>아마추어 테니스는 '패자의 게임'으로 이 경기의 승자는 가장 적은 실수를 하는 사람이며, 상대의 공이 네트에 걸리거나 코트 밖으로 나갈 때까지 어떻게든 공을 받아 넘기기만 하면 되고 즉 상대방의 실수로 득점하여 경기에서 이긴다.<\/li>\n<li>메인스트림 주식시장에서 공격적으로 득점을 추구하는 투자자는 수익을 올리지 못할 것이라는 결론에 이르게 했다. 대신 점수를 잃지 않으려는 노력을 해야 한다는 것이다.<\/li>\n<li>중요한 것은 매우 실력 있는 투자자들이라 하더라도 공을 놓칠 수 있고, 지나치게 공격적인 스매싱 때문에 경기에서 패할 수도 있다는 것이다. 그러므로 방어는 일이 잘못되지 않도록 상당한 주의를 기울이는 실력이 출중한 모든 투자자들의 경기에서 중요한 일부분이다.<\/li>\n<li>스포츠와 투자의 공통적인 특징<ul>\n<li>경쟁적이다: 성공과 실패의 차이가 명확하다.<\/li>\n<li>숫자로 표현할 수 있다: 그러므로 결과를 확실히 알 수 있다.<\/li>\n<li>실력 위주다: 장기적으로 뛰어난 투자자들이 더 나은 수익을 낸다.<\/li>\n<li>단체 지향적이다: 효율적인 단체가 한 명의 개인보다 더 많은 것을 성취한다.<\/li>\n<li>만족스러울 수 있고 즐길 수 있다: 다만 경쟁에서 이겨야 더 그럴 수 있다.<\/li>\n<\/ul>\n<\/li>\n<li>스포츠와 투자의 공통적인 부정적인 면<ul>\n<li>공격성에 대한 프리미엄이 있을 수 있지만, 장기적으로는 별로 도움이 안 된다.<\/li>\n<li>운 나쁘게 공이 원치 않는 방향으로 튀면 좌절할 수 있다.<\/li>\n<li>단기간의 성공이 기록(실적)의 지속성과 일관성에 대한 충분한 확인을 거치지 않고 실력으로 인식될 수 있다.<\/li>\n<\/ul>\n<\/li>\n<li>투자는 공수 전환이 있는 미식축구보다 공격과 수비로 팀을 나누지 않고 동시에 해야 하면서 모든 만일의 사태에 대처할 수 있으면서 또한 11명의 선수 모두가 잠재적으로 골을 넣을 수 있어야 하며, 상대 팀이 득점을 못하도록 해야 하는 일반 축구와 좀 더 비슷하다.<\/li>\n<li>감독은 자기 팀이 공격적인 경기를 할 것인지, 방어적인 경기를 할 것인지, 아니면 공격과 방어를 균형있게 할 것인지 결정해야 하고 경기 도중 선수 교체 기회가 많지 않다는 것을 알기 때문에 이길 수 있는 라인업을 갖추고 큰 변화 없이 경기를 운영한다.<\/li>\n<li>그때그때 시장 상황에 맞게 작전을 바꿀 능력이 있는 사람은 많지 않기 때문에, 투자자들은 되도록 다양한 시나리오에 적용할 수 있는 전략 한 가지에 전념해야 한다.<\/li>\n<li>호황기에 뒤처지지 않고, 불황기에 남보다 더 나은 성과를 낼 수 있다면, 우리는 전체 주기를 통틀어 평균 이하의 변동성으로 평균 이상의 성과를 낼 것이고, 다른 사람들이 괴로워할 때 우리 고객들은 미소 지을 수 있을 것이다.<\/li>\n<li>공격과 방어 중에 올바른 선택이란 없다. 성공으로 가는 길에는 다양한 방법이 있을 수 있고, 자신의 성격과 성향, 자신의 능력을 믿는 정도, 자신이 몸담고 있는 시장과 자신에게 일을 맡긴 고객들의 특징을 모두 고려하여 결정해야 할 문제다.<\/li>\n<li>투자에서 공격은 평균 이상의 수익을 추구하기 위해 공격적인 전략을 채택하고 높은 위험을 감수하는 것을 의미하고 방어적인 투자는 올바른 결정을 내리는 것보다는 잘못된 결정을 피하는 것에 더 초점을 맞춘다.<\/li>\n<li>방어적 투자는 단순히 부정적이거나 소극적으로 나쁜 결과를 피하는 것이 아니고 오히려 보다 높은 수익을 추구하는 또 다른 방식으로 볼 수 있다.<\/li>\n<li>손실을 최소화하는 방식으로 접근하며, 꾸준하고 안정적인 성과를 목표로 하고 포트폴리오에서 하락 종목을 제외하고 손실이 큰 해 및 시장 붕괴로부터 포트폴리오를 보호하는 것이다.<\/li>\n<li>이는 철저한 사전 조사, 높은 투자 기준 적용, 지나치게 낙관적인 전망 및 불확실한 요소에 과도한 베팅을 피하는 것 역시 중요한 요소이며 포트폴리오의 신중한 분산, 전체적인 리스크 관리, 그리고 안전 자산 비중 확대가 필요하다.<\/li>\n<li>투자자들은 뜻밖의 상황에도 대비해야 하지만 말처럼 쉽진 않고 이를 간단하게 답할 수 있는 문제도 아니다. 리스크의 양, 수익 추구 정도, 안전도, 잠재 수익의 포기 정도에는 정답은 없고 균형이 있을 뿐이다.<\/li>\n<li>\"불리한 환경에서 살아남을 수 있는 능력을 확실히 하는 것과 유리한 환경에서 수익을 극대화하는 것은 양립될 수 없기 때문에, 투자자들은 이 두 가지 사이에서 하나를 선택해야 한다.\"<\/li>\n<li>미래가 기대에 못 미치는 경우에도 결과가 웬만하려면 오차 범위 즉 '안전마진'이 중요하다.<\/li>\n<li>당신이 100달러 가치가 있을 것으로 추정되는 자산을 90달러에 산다면 나쁘지 않은 기회를 잡은 것이다. 그러나 90달러 대신 70달러에 산다면 손실 가능성은 더 줄어든다.<\/li>\n<li>공격적인 전략을 통해 수익을 극대화하고, 오차 범위를 통해 보호막을 쌓는 것이다. 그러나 두 가지 모두를 최대한으로 할 수는 없다. 무엇을 선택할 것인가? 공격인가, 방어인가, 아니면 둘 다인가 그러면 어떤 비율로 할 것인가?<\/li>\n<li>수익을 내는 것은 앞으로 일어날 일에 대해 옳은 판단을 하는 것과 대체로 관계가 있는 반면, 손실은 자산가치가 존재하는지, 군중의 기대가 적당한지, 가격이 낮은지를 확인하는 것으로 최소화할 수 있다. 일관성을 가지고 할 수 있는 일은 방어이다.<\/li>\n<li>수익을 위해 애쓰는 것과 리스크를 제한하는 것 사이에, 즉 공격과 방어 사이에 의도적인 균형이 이루어져야 한다.<\/li>\n<li>손실을 회피하는 것만으로는 충분하지 않고 수익 가능성 또한 존재해야 하고 핵심은 바로 '균형'이다.<\/li>\n<li>투자자들이 더 큰 수익을 바란다면, 일반적으로 더 많은 불확실성을, 즉 더 많은 리스크를 감수해야 한다. 어느 정도의 공격이 필요하고, 공격은 불확실성을 증가시킨다. 그리고 의도적이고 현명한 결정을 해야 한다.<\/li>\n<li>가장 돋보이는 투자 이력을 가진 투자자들의 경력들이 매우 짧고 그들이 홈런을 치는 데 실패해서 끝난 게 아니고 삼진을 너무 많이 당해서 경기에서 제외되었을 것이다. 이를테면 상승 종목이 부족했던 것이 아니라 하락 종목이 너무 많았던 것이다.<\/li>\n<li>미래를 정확히 맞힐 수 있다고 생각하고 포트폴리오를 집중 후 많은 금액을 투자하거나, 보유 자산을 너무 자주 바꾸거나 마켓 타이밍 전략으로 과도한 거래비용을 초래하며, 리스크에 대비하지 않고 희망회로로 포트폴리오를 구성하는 오류를 범했다.<\/li>\n<li>\"하락 종목을 피한다면 상승 종목은 알아서 잘할 것\"이라는 확고한 믿음이 필요하고 홈런이 아니라 타율을 중요시해야 한다.<\/li>\n<li>공격적인 전술, 리스크 감수, 기술적으로 어려운 분야에서의 활동은 그에 필요한 능력 없이 시도해서는 안 되는 행동들이다.<\/li>\n<li>전문적인 기술 외에도 공격적인 투자는 결단력, 인내심, 신뢰할 수 있는 자본을 필요로 하고 난관에 부딪혔을 때 이를 극복하려면 이런 요소들이 필요하다.<\/li>\n<li>탁월한 성과를 위한 노력과 관련하여 핵심은 최고가 되기를 망설이지 말아야 한다는 것이다.<\/li>\n<li>투자자가 내려야 할 가장 근본적인 결정 중에는 포트폴리오를 가지고 얼마나 멀리 모험을 할 것인가의 문제가 포함되어야 한다. 분산투자, 손실 회피, 실적 부진 예방에 얼마나 큰 비중을 둘 것이며, 더 좋은 실적을 내기 위해서 이런 것들을 얼마나 희생하느냐 하는 것이다.<\/li>\n<li>신중함은 우리를 실수로부터 멀어지도록 해주지만, 대단한 성과로부터도 멀어지게 할 수 있다.<\/li>\n<li>조심스럽게 투자하고, 좋은 가치와 상당한 안전마진을 고수하며, 자신이 모르는 것과 제어할 수 없는 것을 늘 의식하는 것은 최고의 투자자들이 가진 특징이다.<\/li>\n<li>투자에서는 거의 모든 것들이 양날의 검이다. 리스크, 집중투자, 레버리지 등이 해당되며 유일한 예외는 개인의 진짜 실력이다.<\/li>\n<li>공격이 종종 충족되지 않는 목표들로 채워지는 반면, 방어는 좋은 성과를 지속적으로 제공한다고 생각하며 방어가 최선의 선택이라고 생각한다.<\/li>\n<li>방어적으로 투자를 하다 보면 다른 투자자들보다 홈런을 적게 때릴 수도 있다. 하지만 삼진 아웃을 당할 가능성도 적고, 병살타로 이닝을 마무리하는 일도 더 적을 것이다.<\/li>\n<li>'방어 투자'란 두려움을 가지고 투자하라! 손실 가능성에 대해 걱정하라! 당신이 모르는 무언가가 있음을 걱정하라! 당신이 수준 높은 결정을 내릴 수는 있으나 불운이나 깜짝 놀랄 사건들 때문에 큰 타격을 입을 수도 있음을 걱정하라!<\/li>\n<li>두려움을 가지고 하는 투자에는 자만심이 생기지 않을 것이고, 지속적인 경계심과 심리적인 아드레날린이 계속 작용할 것이며, 충분한 안전마진을 고집할 수 있게 될 것이고, 당신의 포트폴리오가 뜻밖의 상황에 대비할 수 있는 가능성을 높여줄 것이다.<\/li>\n<li>그리고 상황이 순조롭다면 상승 종목들은 가만 놔두어도 알아서 잘할 것이다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 방어투자는 소극적 회피가 아니라 장기 복리의 생존 기술이다.<\/li>\n<li>[막스 메모/인터뷰] 막스는 2023년과 2024년 메모에서 “패자 수를 줄이는 것”과 “리스크의 불가결성”을 함께 말한다. 즉 방어는 리스크 회피가 아니라, 감수하는 리스크의 질과 손실 규모를 통제하는 것이다.<\/li>\n<li>[추론] 실무적으로는 안전마진, 분산, 유동성, 저레버리지, 높은 허들, 시나리오 점검이 방어투자의 다섯 기둥이다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 투자는 불리한 시나리오에서도 살아남는가?<\/li>\n<li>가격이 가치보다 충분히 낮은가?<\/li>\n<li>레버리지가 수익 보완장치가 아니라 파산 증폭기가 될 수 있지 않은가?<\/li>\n<li>상승장에서 뒤처질 가능성을 감수하고도 하락장에서 방어할 준비가 되어 있는가?<\/li>\n<li>나는 홈런보다 타율을 우선하는 구조를 실제로 갖췄는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(안전마진), 보글(낮은 비용과 생존), 하우절(게임에서 오래 남기), 코스톨라니(과열 구간의 절제).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 방어투자는 수익 포기가 아니라 큰 손실 회피를 통한 비대칭 추구다.<\/li>\n<li>[추론] 방어투자는 영구적 초저위험 포지션이 아니라, 사이클과 가격에 따라 보호막을 강화하는 태도다.<\/li>\n<\/ul>","text":"기존 노트 세상에는 나이 든 투자자도 있고 대담한 투자자도 있지만, 나이 들고 대담한 투자자는 없다. \"돈을 버는 것과 손실을 피하는 것 중에 무엇이 더 중요한가?\"라는 질문에 다들 \"그야 둘 다지.\"라는 대답이 이어진다. 문제는 수익 창출과 손실 회피 두 마리 토끼를 동시에 잡을 수 없고 둘 사이에 적당한 균형을 이루는 것이 필요하다. 그리고 이에 대한 결정은 의식적이고 합리적으로 해야 한다. 이 결정을 균형 잡힌 시각으로 보는 최고의 방법은, 이 문제를 '공격 대 방어'의 개념으로 생각하는 것이고 이를 위한 최고의 방법 중 하나는 스포츠에 비유하여 생각해보는 것이다. 프로 테니스는 '승자의 게임'으로 가장 많은 득점을 하는 선수가 경기에서 우승하고 상대 선수의 공을 대부분 받아치며, 공을 가지고 거의 항상 자신이 원하는 대로 한다. 아마추어 테니스는 '패자의 게임'으로 이 경기의 승자는 가장 적은 실수를 하는 사람이며, 상대의 공이 네트에 걸리거나 코트 밖으로 나갈 때까지 어떻게든 공을 받아 넘기기만 하면 되고 즉 상대방의 실수로 득점하여 경기에서 이긴다. 메인스트림 주식시장에서 공격적으로 득점을 추구하는 투자자는 수익을 올리지 못할 것이라는 결론에 이르게 했다. 대신 점수를 잃지 않으려는 노력을 해야 한다는 것이다. 중요한 것은 매우 실력 있는 투자자들이라 하더라도 공을 놓칠 수 있고, 지나치게 공격적인 스매싱 때문에 경기에서 패할 수도 있다는 것이다. 그러므로 방어는 일이 잘못되지 않도록 상당한 주의를 기울이는 실력이 출중한 모든 투자자들의 경기에서 중요한 일부분이다. 스포츠와 투자의 공통적인 특징 경쟁적이다: 성공과 실패의 차이가 명확하다. 숫자로 표현할 수 있다: 그러므로 결과를 확실히 알 수 있다. 실력 위주다: 장기적으로 뛰어난 투자자들이 더 나은 수익을 낸다. 단체 지향적이다: 효율적인 단체가 한 명의 개인보다 더 많은 것을 성취한다. 만족스러울 수 있고 즐길 수 있다: 다만 경쟁에서 이겨야 더 그럴 수 있다. 스포츠와 투자의 공통적인 부정적인 면 공격성에 대한 프리미엄이 있을 수 있지만, 장기적으로는 별로 도움이 안 된다. 운 나쁘게 공이 원치 않는 방향으로 튀면 좌절할 수 있다. 단기간의 성공이 기록(실적)의 지속성과 일관성에 대한 충분한 확인을 거치지 않고 실력으로 인식될 수 있다. 투자는 공수 전환이 있는 미식축구보다 공격과 수비로 팀을 나누지 않고 동시에 해야 하면서 모든 만일의 사태에 대처할 수 있으면서 또한 11명의 선수 모두가 잠재적으로 골을 넣을 수 있어야 하며, 상대 팀이 득점을 못하도록 해야 하는 일반 축구와 좀 더 비슷하다. 감독은 자기 팀이 공격적인 경기를 할 것인지, 방어적인 경기를 할 것인지, 아니면 공격과 방어를 균형있게 할 것인지 결정해야 하고 경기 도중 선수 교체 기회가 많지 않다는 것을 알기 때문에 이길 수 있는 라인업을 갖추고 큰 변화 없이 경기를 운영한다. 그때그때 시장 상황에 맞게 작전을 바꿀 능력이 있는 사람은 많지 않기 때문에, 투자자들은 되도록 다양한 시나리오에 적용할 수 있는 전략 한 가지에 전념해야 한다. 호황기에 뒤처지지 않고, 불황기에 남보다 더 나은 성과를 낼 수 있다면, 우리는 전체 주기를 통틀어 평균 이하의 변동성으로 평균 이상의 성과를 낼 것이고, 다른 사람들이 괴로워할 때 우리 고객들은 미소 지을 수 있을 것이다. 공격과 방어 중에 올바른 선택이란 없다. 성공으로 가는 길에는 다양한 방법이 있을 수 있고, 자신의 성격과 성향, 자신의 능력을 믿는 정도, 자신이 몸담고 있는 시장과 자신에게 일을 맡긴 고객들의 특징을 모두 고려하여 결정해야 할 문제다. 투자에서 공격은 평균 이상의 수익을 추구하기 위해 공격적인 전략을 채택하고 높은 위험을 감수하는 것을 의미하고 방어적인 투자는 올바른 결정을 내리는 것보다는 잘못된 결정을 피하는 것에 더 초점을 맞춘다. 방어적 투자는 단순히 부정적이거나 소극적으로 나쁜 결과를 피하는 것이 아니고 오히려 보다 높은 수익을 추구하는 또 다른 방식으로 볼 수 있다. 손실을 최소화하는 방식으로 접근하며, 꾸준하고 안정적인 성과를 목표로 하고 포트폴리오에서 하락 종목을 제외하고 손실이 큰 해 및 시장 붕괴로부터 포트폴리오를 보호하는 것이다. 이는 철저한 사전 조사, 높은 투자 기준 적용, 지나치게 낙관적인 전망 및 불확실한 요소에 과도한 베팅을 피하는 것 역시 중요한 요소이며 포트폴리오의 신중한 분산, 전체적인 리스크 관리, 그리고 안전 자산 비중 확대가 필요하다. 투자자들은 뜻밖의 상황에도 대비해야 하지만 말처럼 쉽진 않고 이를 간단하게 답할 수 있는 문제도 아니다. 리스크의 양, 수익 추구 정도, 안전도, 잠재 수익의 포기 정도에는 정답은 없고 균형이 있을 뿐이다. \"불리한 환경에서 살아남을 수 있는 능력을 확실히 하는 것과 유리한 환경에서 수익을 극대화하는 것은 양립될 수 없기 때문에, 투자자들은 이 두 가지 사이에서 하나를 선택해야 한다.\" 미래가 기대에 못 미치는 경우에도 결과가 웬만하려면 오차 범위 즉 '안전마진'이 중요하다. 당신이 100달러 가치가 있을 것으로 추정되는 자산을 90달러에 산다면 나쁘지 않은 기회를 잡은 것이다. 그러나 90달러 대신 70달러에 산다면 손실 가능성은 더 줄어든다. 공격적인 전략을 통해 수익을 극대화하고, 오차 범위를 통해 보호막을 쌓는 것이다. 그러나 두 가지 모두를 최대한으로 할 수는 없다. 무엇을 선택할 것인가? 공격인가, 방어인가, 아니면 둘 다인가 그러면 어떤 비율로 할 것인가? 수익을 내는 것은 앞으로 일어날 일에 대해 옳은 판단을 하는 것과 대체로 관계가 있는 반면, 손실은 자산가치가 존재하는지, 군중의 기대가 적당한지, 가격이 낮은지를 확인하는 것으로 최소화할 수 있다. 일관성을 가지고 할 수 있는 일은 방어이다. 수익을 위해 애쓰는 것과 리스크를 제한하는 것 사이에, 즉 공격과 방어 사이에 의도적인 균형이 이루어져야 한다. 손실을 회피하는 것만으로는 충분하지 않고 수익 가능성 또한 존재해야 하고 핵심은 바로 '균형'이다. 투자자들이 더 큰 수익을 바란다면, 일반적으로 더 많은 불확실성을, 즉 더 많은 리스크를 감수해야 한다. 어느 정도의 공격이 필요하고, 공격은 불확실성을 증가시킨다. 그리고 의도적이고 현명한 결정을 해야 한다. 가장 돋보이는 투자 이력을 가진 투자자들의 경력들이 매우 짧고 그들이 홈런을 치는 데 실패해서 끝난 게 아니고 삼진을 너무 많이 당해서 경기에서 제외되었을 것이다. 이를테면 상승 종목이 부족했던 것이 아니라 하락 종목이 너무 많았던 것이다. 미래를 정확히 맞힐 수 있다고 생각하고 포트폴리오를 집중 후 많은 금액을 투자하거나, 보유 자산을 너무 자주 바꾸거나 마켓 타이밍 전략으로 과도한 거래비용을 초래하며, 리스크에 대비하지 않고 희망회로로 포트폴리오를 구성하는 오류를 범했다. \"하락 종목을 피한다면 상승 종목은 알아서 잘할 것\"이라는 확고한 믿음이 필요하고 홈런이 아니라 타율을 중요시해야 한다. 공격적인 전술, 리스크 감수, 기술적으로 어려운 분야에서의 활동은 그에 필요한 능력 없이 시도해서는 안 되는 행동들이다. 전문적인 기술 외에도 공격적인 투자는 결단력, 인내심, 신뢰할 수 있는 자본을 필요로 하고 난관에 부딪혔을 때 이를 극복하려면 이런 요소들이 필요하다. 탁월한 성과를 위한 노력과 관련하여 핵심은 최고가 되기를 망설이지 말아야 한다는 것이다. 투자자가 내려야 할 가장 근본적인 결정 중에는 포트폴리오를 가지고 얼마나 멀리 모험을 할 것인가의 문제가 포함되어야 한다. 분산투자, 손실 회피, 실적 부진 예방에 얼마나 큰 비중을 둘 것이며, 더 좋은 실적을 내기 위해서 이런 것들을 얼마나 희생하느냐 하는 것이다. 신중함은 우리를 실수로부터 멀어지도록 해주지만, 대단한 성과로부터도 멀어지게 할 수 있다. 조심스럽게 투자하고, 좋은 가치와 상당한 안전마진을 고수하며, 자신이 모르는 것과 제어할 수 없는 것을 늘 의식하는 것은 최고의 투자자들이 가진 특징이다. 투자에서는 거의 모든 것들이 양날의 검이다. 리스크, 집중투자, 레버리지 등이 해당되며 유일한 예외는 개인의 진짜 실력이다. 공격이 종종 충족되지 않는 목표들로 채워지는 반면, 방어는 좋은 성과를 지속적으로 제공한다고 생각하며 방어가 최선의 선택이라고 생각한다. 방어적으로 투자를 하다 보면 다른 투자자들보다 홈런을 적게 때릴 수도 있다. 하지만 삼진 아웃을 당할 가능성도 적고, 병살타로 이닝을 마무리하는 일도 더 적을 것이다. '방어 투자'란 두려움을 가지고 투자하라! 손실 가능성에 대해 걱정하라! 당신이 모르는 무언가가 있음을 걱정하라! 당신이 수준 높은 결정을 내릴 수는 있으나 불운이나 깜짝 놀랄 사건들 때문에 큰 타격을 입을 수도 있음을 걱정하라! 두려움을 가지고 하는 투자에는 자만심이 생기지 않을 것이고, 지속적인 경계심과 심리적인 아드레날린이 계속 작용할 것이며, 충분한 안전마진을 고집할 수 있게 될 것이고, 당신의 포트폴리오가 뜻밖의 상황에 대비할 수 있는 가능성을 높여줄 것이다. 그리고 상황이 순조롭다면 상승 종목들은 가만 놔두어도 알아서 잘할 것이다. [구조화] [막스 본문] 방어투자는 소극적 회피가 아니라 장기 복리의 생존 기술이다. [막스 메모/인터뷰] 막스는 2023년과 2024년 메모에서 “패자 수를 줄이는 것”과 “리스크의 불가결성”을 함께 말한다. 즉 방어는 리스크 회피가 아니라, 감수하는 리스크의 질과 손실 규모를 통제하는 것이다. [추론] 실무적으로는 안전마진, 분산, 유동성, 저레버리지, 높은 허들, 시나리오 점검이 방어투자의 다섯 기둥이다. [실전 질문] 이 투자는 불리한 시나리오에서도 살아남는가? 가격이 가치보다 충분히 낮은가? 레버리지가 수익 보완장치가 아니라 파산 증폭기가 될 수 있지 않은가? 상승장에서 뒤처질 가능성을 감수하고도 하락장에서 방어할 준비가 되어 있는가? 나는 홈런보다 타율을 우선하는 구조를 실제로 갖췄는가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(안전마진), 보글(낮은 비용과 생존), 하우절(게임에서 오래 남기), 코스톨라니(과열 구간의 절제). [오해 방지] [추론] 방어투자는 수익 포기가 아니라 큰 손실 회피를 통한 비대칭 추구다. [추론] 방어투자는 영구적 초저위험 포지션이 아니라, 사이클과 가격에 따라 보호막을 강화하는 태도다."},{"i":19,"title":"18. 보이지 않는 함정을 피하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>투자자는 큰 실수를 피하기만 하면, 몇 가지만 제대로 하면 된다.<\/li>\n<li>손실을 피하는 노력이, 무리하여 좋은 실적을 올리려는 노력보다 중요하다는 것이다. 무리하게 실적을 위해 노력하는 것은 단기적으로는 성공할 수 있겠지만, 가끔 시도해서 실패할 경우 영영 회복이 불가능할 수도 있다.<\/li>\n<li>손실 회피의 노력은 좀 더 자주 성공할 수 있고, 결과를 더 신뢰할 수 있으며, 실패해도 무리한 실적을 추구하다 실패했을 때보다는 훨씬 견딜 만한 결과로 나타날 것이다.<\/li>\n<li>손실을 피하려면 무엇보다 손실을 유발시키는 함정들을 이해하고 그로부터 멀어질 필요가 있고 투자의 함정에는 많은 종류가 존재한다.<\/li>\n<li>실수의 원천이 주로 분석적·지능적이거나, 심리적·감정적이 되는 데 있다고 생각하고 그 밖에도 잘못된 분석 프로세스를 적용하거나, 계산에서 실수를 하거나, 했어야 하는 일을 하지 않고 넘어간 것 등이 있을 수 있고 이 외에도 무궁무진하게 많다.<\/li>\n<li>좀 더 언급하고 싶은 유형 중 하나는 바로 '상상력 부족'이고 이는 발생 가능한 결과의 범위를 전체적으로 그려보지 못하거나, 좀 더 극단적으로 발생하는 결과에 대해 충분히 이해하지 못하는 것이다.<\/li>\n<li>실수를 유발하는 심리적·감정적 요인은 탐욕과 공포, 불신의 유예와 의심, 자아와 시기심, 리스크 감수를 통해 고수익을 올리고 싶은 욕구, 자신의 예지를 과대평가하는 경향 등이다.<\/li>\n<li>또 하나의 중요한 함정은 시장 주기와 열기를 인지하지 못하고, 이와 반대 방향으로 움직이는 것이다. 이것은 실수의 잦은 원인이 되는 것은 아니지만 한 번 발생하면 가장 큰 실수를 초래한다.<\/li>\n<li>군중심리가 가진 영향력은 실로 대단해서 군중을 이루는 구성원들을 어쩔 수 없이 순응하고, 굴복하게 만들고, 거의 저항할 수 없게 만든다. 그렇기 때문에 더더욱 투자자들은 이에 반드시 저항해야 한다.<\/li>\n<li>투자는 대체로 미래를 상대하는 것이며 투자를 하려면, 우리는 미래의 상황이 어떨 것 같은지에 대한 견해를 가지고 있어야 하지만 우리에게는 미래가 과거와 매우 비슷할 것이라고 추정하는 것 외에는 별다른 선택의 여지가 없다.<\/li>\n<li>중요한 금융 현상들은 대체로 긴 주기를 따르기 때문에, 극단적인 사건을 경험한 사람들은 종종 다음번 사건이 일어나기 전에 은퇴하거나 사망하는 일이 많고 금융과 관련한 기억들의 수명은 극단적으로 짧다. 그리고 설사 기억한다고 해도 저금리 대출 약속 앞에 연기처럼 사라져 버린다.<\/li>\n<li>대부분의 경우 미래는 과거와 흡사하기 때문에 추론이 해가 될 것은 없다. 그러나 미래가 과거와 달라지는 터닝 포인트에서 추론은 실패하고, 거액의 손실액이 발생하거나, 역시 거액의 수익 창출 기회가 사라진다.<\/li>\n<li>뜻밖의 상황들이 발생하고, 단기간의 결과는 장기간의 가능성에서 빗나갈 수 있으며, 사건이란 원래 줄지어 발생한다.<\/li>\n<li>무슨 일이 '일어날 것'이라고 지나치게 의지했다가는, 예측이 실패했을 경우 큰 낭패를 볼 수 있다. 주위에서 흔히 볼 수 있는 정상적인 결과에 너무 의지해서는 안 되고 아웃라이어, 즉 드물게 발생하는 결과도 감안해야 한다.<\/li>\n<li>성공할 것으로 예상될 때만 투자를 하며, 가능성 있는 시나리오를 집중적으로 분석할 것이다. 그러나 다른 가능성을 배제한 채 예상되는 시나리오만 고집하거나, 부정적인 결과가 발생했을 때 큰 피해를 입을 수 있을 정도로 시나리오를 리스크와 레버리지를 가득 채워서도 안 된다.<\/li>\n<li>금융위기는 대체로 이전에는 한 번도 일어난 적 없었던 사건들이 이를 견디지 못하도록 설계된 리스크가 크고 부채가 많은 구조와 충돌하기 때문에 발생한다.<\/li>\n<li>어떤 일이 일어날 리 없다는 추정에 그 어떤 일이 일어날 가능성이 있다면 그 추정은 소용없는 것이 된다. 그 일이 일어날 리 없다고 믿는 사람들이 마음 놓고 위험한 행동을 함으로써 결국 상황이 바뀌기 때문이다.<\/li>\n<li>함정을 피하는 것이 중요하기는 하지만, 피하는 정도에도 한계는 있어야 할 것이다. 그리고 그 기준은 투자자마다 다르다.<\/li>\n<li>자산에는 예상되는 수익과 리스크가 있으며, 이를 짐작하는 것이 가능하다는 것을 모두가 알고 있다.<\/li>\n<li>그러나 자산의 상관관계를 이해하는 사람은 드물다. 상관관계의 영향력을 이해하고 예측하는 것은 리스크 제어와 포트폴리오 관리의 중요한 측면이지만, 이를 성공적으로 수행하기는 매우 어렵다.<\/li>\n<li>상상력 부족은 미래에 발생 가능한 극단적인 사건들을 예상하지 못하는 것에 첫 번째 원인이 있고, 그런 극단적인 사건들 때문에 연쇄적으로 발생하게 될 결과에 대해 이해하지 못하는 것에 두 번째 원인이 있다.<\/li>\n<li>많은 면에서 심리적 영향은 투자 실수를 유발하는 가장 흥미로운 요소에 속하며, 증권 가격에 지대한 영향을 끼칠 수 있고 이로 인해 자산 가격을 너무 높거나 너무 낮게 만들 수 있다. 이로 인해 거품과 붕괴가 생겨난다.<\/li>\n<li>투자자들은 어떻게 해서 심리적 영향의 피해를 입을까?<ul>\n<li>심리에 굴복함으로써 피해를 입는다.<\/li>\n<li>다른 이들의 굴복으로 왜곡된 시장에 상황을 모르는 채로 참가함으로써 피해를 입는다.<\/li>\n<li>그런 왜곡이 존재하는 시기를 기회로 삼지 못함으로써 피해를 입는다.<\/li>\n<\/ul>\n<\/li>\n<li>탐욕이 과도해지면 증권 가격은 지나치게 오르는 경향이 있고, 따라서 예상 수익은 낮아지고 리스크는 높아진다. 이렇게 해서 문제의 자산은 투자 실수로 드러나고 손실이 나기를 기다리거나, 이를 기회로 삼을 다른 사람의 매입을 기다리게 된다.<\/li>\n<li>심리에 굴복하여 다른 이들의 탐욕에 동참하여 그 자산을 높은 가격임에도 불구하고 매입을 하게 되면 실망할 일만 남게 된다.<\/li>\n<li>실력 있는 투자자들은 단순히 실수를 피하는 것을 넘어 이를 적극적으로 활용하려 한다. 과대평가되었을 때 단순히 매도하는 것을 넘어, 주가가 하락할 가능성을 활용해 공매도를 통해 수익을 추구할 수도 있다.<\/li>\n<li>강세장에서 충분히 의심하지 않고 다음의 개념들을 받아들이면 종종 거품과 붕괴의 원인이 되는 심리에 기인하는 함정이다.<ul>\n<li>최근의 상황들이 세상을 바꿀 것이다.<\/li>\n<li>과거에는 규칙이었던 패턴(경기 주기의 등락 등)들이 더 이상 발생하지 않을 것이다.<\/li>\n<li>규칙이 변했다. (기업의 신뢰 여부, 기업 부채보유의 가치 여부 결정 기준 등)<\/li>\n<li>전통적인 가치 규범이 더 이상 의미가 없다. (PER, 채권 수익률 스프레드, 부동산의 자본화율 등)<\/li>\n<\/ul>\n<\/li>\n<li>시계추가 움직이는 방식 때문에 투자자들이 너무 믿고 필요한 행동을 하지 않음으로써 충분한 의심을 하지 않게 되면, 이러한 실수들이 한꺼번에 자주 발생한다.<\/li>\n<li>함정을 피하고자 할 때 꼭 필요한 첫 번째 단계는 함정을 찾는 것이다. 중요한 것은 함정을 예측하려고 노력하는 것이다.<\/li>\n<li>시장은 매일매일 수업이 이루어지는 교실과 같아서 성공적인 투자를 하려면 관찰과 학습이 중요하다.<\/li>\n<li>위기로부터 우리가 배우는 것, 또는 배워야 하는 것<ul>\n<li>과도한 자본 가용성은 자본이 가지 말아야 할 곳으로 흘러가게 하고 자본이 부족하고 수요가 많은 경우 정상적인 투자를 하게 되고, 너무 많은 자본이 너무 적은 아이디어를 좇다보면, 그럴 가치가 없는 곳에까지 투자가 이루어진다.<\/li>\n<li>자본이 가지 말아야 할 곳으로 가게 되면 안 좋은 일이 생긴다. 자본이 넘치는 시기에는 대출부적격자까지 돈을 빌릴 수 있고 체납, 파산, 손실과 같은 결과를 피할
