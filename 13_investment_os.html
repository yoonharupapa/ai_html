”를 그대로 적용하는 것은 충분하지 않다. 이 지점은 보글의 미국 투자자 전제가 드러나는 한계다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 원화 생활비, 달러 자산, 환노출, 환헤지 비용, 국내상장 ETF와 해외상장 ETF의 세금 차이, 연금계좌 편입 가능성을 함께 고려해야 한다.<\/li>\n<li>한국 주식시장만으로는 글로벌 시가총액 분산이 부족하고, 미국 100%도 국가·통화 편중이 크다. 따라서 보글의 원칙은 “미국만 보유”가 아니라 “낮은 비용으로 넓게 분산하고 오래 유지”로 재해석하는 것이 더 적절하다.<\/li>\n<\/ul>","text":"수익률로만 봤을 때 저비용 S&amp;P500 인덱스펀드가 나을 수도 있지만 변동성을 고려하면 채권 혼합 인덱스펀드가 나은 선택이다. 특히 시장 상황이 좋지 않을 때는 혼합 인덱스펀드가 훨씬 유리하다. 장투 및 주기적인 폭락에 개의치 않을 투자자는 S&amp;P500 ETF 비율을 100%로 하는 것이 가장 좋은 선택지일 수 있다. 소심한 투자자라면 주식과 채권의 비율이 60:40으로 고정된 혼합형 인덱스펀드가 최적의 선택지일 것이다. 미국 시장 외 해외 주식에 투자할 이유가 없다. 은퇴 시점에 다다를수록 점차 더 보수적으로 자산 배분 비율이 조정되는 타깃데이트펀드(TDF)도 고려해볼 수 있다. 가능한 한 많은 정보, 지식을 바탕으로 적절한 판단을 내린 후 융통성을 발휘해 상황에 맞춰 비율을 조정하라. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 60:40 혼합형 주식 60 / 채권 40 장기, 명목, 세전, 리밸런싱 가정 주식 성장 + 채권 방어 변동성을 견디기 어려운 투자자를 위한 단순 절충안 원본 노트 기준선 [보글 본문] 나이=채권 비중 예: 60세 전후 채권 60~70% 은퇴 전후 연령에 따른 위험 축소 규칙 정밀 공식이 아니라 실행 가능한 휴리스틱 원본 노트 기준선 [보글 본문] 해외주식 제한 미국 투자자는 해외 비중 낮게 또는 20% 이하 미국 거주·달러 생활비 전제 미국 기업의 글로벌 매출 간접 노출 미국 투자자 관점의 자국 중심 논리 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 Vanguard TDF 초기 배분 단순 주식·채권 혼합 약 90% 주식 / 10% 채권 초기 더 공격적 실제 TDF는 나이 규칙보다 세밀한 글라이드패스 사용 Vanguard TDF glide path 자료 인용 목표시점 배분 은퇴시점 보수화 약 50% 주식 / 40% 채권 / 10% 단기 TIPS 은퇴 직전 방어 강화 시퀀스 리스크를 반영 Vanguard TDF glide path 자료 인용 FTSE All-World 내 미국 비중 미국 중심 사고 2025년 7월 기준 60% 초과 미국 비중 매우 큼 글로벌 시총 가중만 써도 미국이 코어가 됨 FTSE All-World 구성 자료 인용 MSCI World 내 미국 비중 미국 우위 지속 2026년 Reuters 보도 기준 70% 초과 개발국 지수는 미국 편중 심함 미국 예외주의가 지수에도 반영 MSCI World/Reuters 인용 [보강 | 논리 전개] 이 장은 보글 원칙의 예외와 현실 조정을 다룬다. 수익률만 보면 100% 주식이 유리할 수 있지만, 은퇴 전후에는 큰 손실의 순서가 포트폴리오 생존성을 좌우한다. 해외주식 불필요 주장은 미국 거주자, 달러 생활비, 미국 자본시장 우위라는 전제에서 강하다. 이 전제를 벗어나면 결론도 달라진다. [반론] 글로벌 분산 옹호자는 미국 기업의 해외매출이 해외주식 보유를 대체하지 못한다고 본다. 국가, 통화, 밸류에이션, 섹터 집중을 분산하려면 미국 외 자산도 필요하다는 반론이 강하다. 자산배분론자는 나이만으로 채권 비중을 정하는 것은 인간자본, 연금, 부채, 은퇴시점, 위험선호를 무시한다고 비판한다. [보글 측 재반론] 보글식 재반론은 단순성이다. 너무 정교한 글로벌·전술 배분은 비용, 세금, 행동오류를 늘릴 수 있다. 다만 한국 투자자에게 “미국 외 해외주식 불필요”를 그대로 적용하는 것은 충분하지 않다. 이 지점은 보글의 미국 투자자 전제가 드러나는 한계다. [한국 투자자 적용] 한국 투자자는 원화 생활비, 달러 자산, 환노출, 환헤지 비용, 국내상장 ETF와 해외상장 ETF의 세금 차이, 연금계좌 편입 가능성을 함께 고려해야 한다. 한국 주식시장만으로는 글로벌 시가총액 분산이 부족하고, 미국 100%도 국가·통화 편중이 크다. 따라서 보글의 원칙은 “미국만 보유”가 아니라 “낮은 비용으로 넓게 분산하고 오래 유지”로 재해석하는 것이 더 적절하다."},{"i":21,"title":"20. 투자의 황금률: 시장과 시간의 검증을 거친 투자 원칙","html":"<ul>\n<li>인덱스 전략이 지금까지 나온 투자전략 가운데 최고가 아닐지도 모르지만 이보다 못한 전략은 수없이 많다.<\/li>\n<li>대다수 투자자의 경우 보통주는 인덱스펀드 형태로 보유하는 것이 최선이라는 사실을 알게 될 것이다. (워런 버핏)<\/li>\n<li>투자에 성공하고 싶다면 우선 앞으로 주식과 채권의 수익률이 어떻게 될지 알 수 없다는 사실부터 인정해야 한다.<\/li>\n<li>투자 시작 시점은 가능한 한 빠를수록 좋고 그때부터 꾸준히 자금을 비축해둬야 한다.<\/li>\n<li>투자에는 위험이 따르지만 투자를 하지 않으면 재정난을 겪을 것이 뻔하다.<\/li>\n<li>주식과 채권시장의 수익원을 알고 있다. 그리고 투자에 대한 통찰력은 여기서부터 시작된다.<\/li>\n<li>개별주 종목 선정 위험은 전통적 인덱스펀드를 통한 다각화 전략으로 충분히 극복할 수 있고 시장 위험만 남게 된다.<\/li>\n<li>비용이 중요하고 특히 장기적으로 수익에 엄청난 영향을 미치므로 반드시 비용을 최소화해야 한다.<\/li>\n<li>세금도 중요하고 이 또한 최소화해야 한다.<\/li>\n<li>시장을 이기는 것도 투자 시점을 정확히 선택하는 것도 자기모순적이고 다수는 절대로 이를 달성할 수 없다.<\/li>\n<li>우리는 미래를 모르지만 현명하게 자산을 배분하고 합리적으로 투자를 선택하면 위기를 잘 극복할 수 있다.<\/li>\n<li>성공투자의 목적을 달성하게 해주는 확실한 투자방식은 전통적 인덱스펀드밖에 없다고 본다.<\/li>\n<li>부자가 되고 싶으면 돈을 벌 생각만 하지 말고 저축할 생각도 해라.<\/li>\n<li>시간이 곧 돈이라는 사실을 잊지 말고 잃어버린 시간은 절대로 다시 찾을 수 없다.<\/li>\n<li>투자를 하지 않으면 돈을 모을 수 없고 돈을 모으지 못하면 재정적으로 안정된 미래를 담보할 수 없다.<\/li>\n<li>복리는 기적을 만든다. 시간은 우리 편이다. 시간이 기적을 만들 수 있도록 그 기회를 만들어줘라.<\/li>\n<li>작은 비용이라도 우습게보지 마라. 작은 구멍 하나가 큰 배를 침몰시킨다.<\/li>\n<li>고생을 하지 않으면 얻는 것도 없다. 고기를 잡고 싶으면 뭔가를 미끼로 내놓아야 한다.<\/li>\n<li>투자와 관련한 가장 큰 위험은 시장변동성 같은 단기적 위험이 아니라 투자를 하지 않아서 기회를 놓치는 장기적 관점의 위험이다.<\/li>\n<li>지식에 투자할 때 가장 많은 이자가 붙는다. 열심히 공부한 자에게 지식이 주어지고 신중한 자에게 부가 주어진다.<\/li>\n<li>지식은 열심히 공부한 자의 몫이고 부는 신중한 자의 몫이다. 지갑을 비우고 머리를 채워라. 지식은 아무도 빼앗아가지 못한다.<\/li>\n<li>투자자로 성공하려면 정보와 지식이 필요하다. 정말 중요한 것은 위험과 비용에 관한 정보다.<\/li>\n<li>자신이 시장보다 더 많이 안다고 생각하지 말고 수많은 사람이 수긍하는 생각에 따라 행동하라.<\/li>\n<li>보는 것은 쉬워도 예측하는 것은 어렵고 모르는 것을 알아내려면 지혜가 있어야 한다.<\/li>\n<li>근면, 인내, 검약이 부를 만들어준다. 무슨 일이 있어도 자신의 계획을 밀고 나가고 장기적 관점에서 생각하라.<\/li>\n<li>현명한 투자자의 가장 귀한 자산은 바로 인내와 끈기다. \"현재 포지션을 끝까지 유지하라.\"<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 최종 결론<\/td>\n<td style=\"text-align: right;\">저비용·분산·장기·규율<\/td>\n<td>전권<\/td>\n<td>원칙 총정리<\/td>\n<td>책의 최종 투자 운영체계<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 원자료<\/th>\n<th style=\"text-align: right;\">최신 업데이트<\/th>\n<th>차이<\/th>\n<th>해석<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>U.S. 대형주 액티브 부진<\/td>\n<td style=\"text-align: right;\">대다수 패배<\/td>\n<td style=\"text-align: right;\">2025년 79% 언더퍼폼<\/td>\n<td>최신 재확인<\/td>\n<td>결론 유지<\/td>\n<td>SPIVA U.S. Scorecard Year-End 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>장기 성공률 희소<\/td>\n<td style=\"text-align: right;\">우수 운용사 선별 어려움<\/td>\n<td style=\"text-align: right;\">10년 8%~14%, 15년 약 10%<\/td>\n<td>방법론 달라도 방향 동일<\/td>\n<td>“평균을 싼 값에”가 여전히 강함<\/td>\n<td>SPIVA/Morningstar 2025 인용<\/td>\n<\/tr>\n<tr>\n<td>비용 절감 추세<\/td>\n<td style=\"text-align: right;\">비용 중요<\/td>\n<td style=\"text-align: right;\">2024 평균 비용 0.34%, Vanguard 0.07%<\/td>\n<td>산업 전반 개선<\/td>\n<td>보글이 시장 구조 자체를 바꿔놓음<\/td>\n<td>Morningstar/Vanguard 2024 자료 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>2017년 이후 실증은 보글의 결론을 대체로 강화했다. 비용은 더 중요해졌고, 초저비용 인덱스는 더 싸졌으며, 액티브의 장기 성공 확률은 여전히 낮다.<\/li>\n<li>달라진 점도 있다. 미국 시장 집중도가 커졌고, 배당보다 자사주매입 비중이 높아졌으며, ETF와 TDF 같은 포장 구조가 복잡해졌다. 따라서 보글의 결론은 유지되지만, <strong>적용 방식은 2026년식으로 업데이트<\/strong>해야 한다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>미국만 사도 되는가, 시가총액 가중이 최선인가, 채권은 어떻게 둘 것인가, ETF가 행동오류를 키우는가 등은 현재 더 치열한 반론 지점이다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>그래도 가장 강한 핵심은 그대로다. 비용과 행동오류를 제어하지 못하면, 더 세련된 전략도 투자자에게 돌아오는 몫은 줄어든다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 보글 원칙을 그대로 수입하기보다, 원화 생활비·미국 편중·국내 세제를 반영해 재해석해야 한다.<\/li>\n<li>하지만 재해석의 방향도 결국 저비용·낮은 회전율·장기 유지 가능성으로 수렴한다.<\/li>\n<\/ul>","text":"인덱스 전략이 지금까지 나온 투자전략 가운데 최고가 아닐지도 모르지만 이보다 못한 전략은 수없이 많다. 대다수 투자자의 경우 보통주는 인덱스펀드 형태로 보유하는 것이 최선이라는 사실을 알게 될 것이다. (워런 버핏) 투자에 성공하고 싶다면 우선 앞으로 주식과 채권의 수익률이 어떻게 될지 알 수 없다는 사실부터 인정해야 한다. 투자 시작 시점은 가능한 한 빠를수록 좋고 그때부터 꾸준히 자금을 비축해둬야 한다. 투자에는 위험이 따르지만 투자를 하지 않으면 재정난을 겪을 것이 뻔하다. 주식과 채권시장의 수익원을 알고 있다. 그리고 투자에 대한 통찰력은 여기서부터 시작된다. 개별주 종목 선정 위험은 전통적 인덱스펀드를 통한 다각화 전략으로 충분히 극복할 수 있고 시장 위험만 남게 된다. 비용이 중요하고 특히 장기적으로 수익에 엄청난 영향을 미치므로 반드시 비용을 최소화해야 한다. 세금도 중요하고 이 또한 최소화해야 한다. 시장을 이기는 것도 투자 시점을 정확히 선택하는 것도 자기모순적이고 다수는 절대로 이를 달성할 수 없다. 우리는 미래를 모르지만 현명하게 자산을 배분하고 합리적으로 투자를 선택하면 위기를 잘 극복할 수 있다. 성공투자의 목적을 달성하게 해주는 확실한 투자방식은 전통적 인덱스펀드밖에 없다고 본다. 부자가 되고 싶으면 돈을 벌 생각만 하지 말고 저축할 생각도 해라. 시간이 곧 돈이라는 사실을 잊지 말고 잃어버린 시간은 절대로 다시 찾을 수 없다. 투자를 하지 않으면 돈을 모을 수 없고 돈을 모으지 못하면 재정적으로 안정된 미래를 담보할 수 없다. 복리는 기적을 만든다. 시간은 우리 편이다. 시간이 기적을 만들 수 있도록 그 기회를 만들어줘라. 작은 비용이라도 우습게보지 마라. 작은 구멍 하나가 큰 배를 침몰시킨다. 고생을 하지 않으면 얻는 것도 없다. 고기를 잡고 싶으면 뭔가를 미끼로 내놓아야 한다. 투자와 관련한 가장 큰 위험은 시장변동성 같은 단기적 위험이 아니라 투자를 하지 않아서 기회를 놓치는 장기적 관점의 위험이다. 지식에 투자할 때 가장 많은 이자가 붙는다. 열심히 공부한 자에게 지식이 주어지고 신중한 자에게 부가 주어진다. 지식은 열심히 공부한 자의 몫이고 부는 신중한 자의 몫이다. 지갑을 비우고 머리를 채워라. 지식은 아무도 빼앗아가지 못한다. 투자자로 성공하려면 정보와 지식이 필요하다. 정말 중요한 것은 위험과 비용에 관한 정보다. 자신이 시장보다 더 많이 안다고 생각하지 말고 수많은 사람이 수긍하는 생각에 따라 행동하라. 보는 것은 쉬워도 예측하는 것은 어렵고 모르는 것을 알아내려면 지혜가 있어야 한다. 근면, 인내, 검약이 부를 만들어준다. 무슨 일이 있어도 자신의 계획을 밀고 나가고 장기적 관점에서 생각하라. 현명한 투자자의 가장 귀한 자산은 바로 인내와 끈기다. \"현재 포지션을 끝까지 유지하라.\" [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 최종 결론 저비용·분산·장기·규율 전권 원칙 총정리 책의 최종 투자 운영체계 원본 노트 기준선 [2017 이후 검증] 항목 보글 원자료 최신 업데이트 차이 해석 출처 U.S. 대형주 액티브 부진 대다수 패배 2025년 79% 언더퍼폼 최신 재확인 결론 유지 SPIVA U.S. Scorecard Year-End 2025 인용 장기 성공률 희소 우수 운용사 선별 어려움 10년 8%~14%, 15년 약 10% 방법론 달라도 방향 동일 “평균을 싼 값에”가 여전히 강함 SPIVA/Morningstar 2025 인용 비용 절감 추세 비용 중요 2024 평균 비용 0.34%, Vanguard 0.07% 산업 전반 개선 보글이 시장 구조 자체를 바꿔놓음 Morningstar/Vanguard 2024 자료 인용 [보강 | 논리 전개] 2017년 이후 실증은 보글의 결론을 대체로 강화했다. 비용은 더 중요해졌고, 초저비용 인덱스는 더 싸졌으며, 액티브의 장기 성공 확률은 여전히 낮다. 달라진 점도 있다. 미국 시장 집중도가 커졌고, 배당보다 자사주매입 비중이 높아졌으며, ETF와 TDF 같은 포장 구조가 복잡해졌다. 따라서 보글의 결론은 유지되지만, 적용 방식은 2026년식으로 업데이트 해야 한다. [반론] 미국만 사도 되는가, 시가총액 가중이 최선인가, 채권은 어떻게 둘 것인가, ETF가 행동오류를 키우는가 등은 현재 더 치열한 반론 지점이다. [보글 측 재반론] 그래도 가장 강한 핵심은 그대로다. 비용과 행동오류를 제어하지 못하면, 더 세련된 전략도 투자자에게 돌아오는 몫은 줄어든다. [한국 투자자 적용] 한국 투자자는 보글 원칙을 그대로 수입하기보다, 원화 생활비·미국 편중·국내 세제를 반영해 재해석해야 한다. 하지만 재해석의 방향도 결국 저비용·낮은 회전율·장기 유지 가능성으로 수렴한다."},{"i":22,"title":"99. 복습: 이제 어떻게 해야 하나?","html":"<ul>\n<li>자본주의가 주는 보상을 거두는 성공 투자 전략은 주식을 매매하는 것이 아니라 기업을 보유하는 것이다.<\/li>\n<li>전체 시장 인덱스펀드에 투자해서 전체 기업을 소유하는 방법이 완전한 위험 축소 전략이다.<\/li>\n<li>총수익에서 비용을 공제한 순수익이 투자자들의 몫이다.<\/li>\n<li>주식 투자자에게 최대의 적은 비용과 감정이다.<\/li>\n<li>개별주, 액티브펀드, 고비용 인덱스펀드, ETF, 상품펀드, 헤지펀드, 헤지 재간접 펀드에 절대 투자하지 마라.<\/li>\n<li>국제 투자를 가미할 필요는 없지만 원한다면 포트폴리오에서 20%를 넘기지 마라.<\/li>\n<li>가치주 펀드와 소형주 펀드 등에 펀드 나누기를 할 필요가 전혀 없다.<\/li>\n<li>인플레이션 연계 채권에 투자하면 장기적으로 화폐의 구매력을 탁월하게 유지할 수 있다.<\/li>\n<li>주먹구구식으로 스무 살이면 채권 비율을 20%, 환갑이라면 70%를 보유하는 식으로 자산 배분이 가능하다.<\/li>\n<\/ul>\n<h3>[데이터 | 보글 원자료]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">보글 제시 수치<\/th>\n<th>기준 기간<\/th>\n<th>산식/정의<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>[보글 본문] 복습 질문 4개<\/td>\n<td style=\"text-align: right;\">개념 점검형<\/td>\n<td>전권<\/td>\n<td>비용·ETF·해외분산·액티브<\/td>\n<td>책의 핵심 논점 요약<\/td>\n<td>원본 노트 기준선<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[2017 이후 검증]<\/h3>\n<ul>\n<li>왜 인덱스펀드가 액티브를 이기기 쉬운가 → SPIVA 2025와 Morningstar 2025 모두 대형주 액티브의 장기 승률이 매우 낮음을 보여준다.<\/li>\n<li>비용이 장기 수익률에 미치는 영향은 → 평균 비용 차이와 세금드래그 차이가 복리로 커진다.<\/li>\n<li>ETF를 왜 경계했는가 → 상품보다 거래행태가 문제였다. 최근 레버리지 ETF 열풍이 이를 보여준다.<\/li>\n<li>해외분산은 어떻게 다른가 → 미국 투자자 전제에선 보글 논리가 강하지만, 한국 투자자에겐 그대로 적용되기 어렵다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li>이 네 문항을 이해하면 보글 책의 80% 이상을 이해한 셈이다. 액티브 부진의 원인은 실력 부족만이 아니라 비용·세금·행동오류의 합성이다. ETF는 약이면서 독이고, 해외분산은 거주국 통화와 자산구조에 따라 결론이 달라진다.<\/li>\n<\/ul>\n<h3>[반론]<\/h3>\n<ul>\n<li>최신 시장구조에서는 미국 집중과 ETF 진화로 인해 보글 원칙도 보완이 필요하다는 반론이 가능하다.<\/li>\n<\/ul>\n<h3>[보글 측 재반론]<\/h3>\n<ul>\n<li>보완은 필요하지만, 핵심은 아직 바뀌지 않았다. 저비용·분산·장기·규율은 여전히 가장 재현 가능한 기본값이다.<\/li>\n<\/ul>\n<h3>[한국 투자자 적용]<\/h3>\n<ul>\n<li>한국 투자자는 복습 문항 네 개에 “환율·연금계좌·원화 인출”을 추가하면 실무형 복습이 된다.<\/li>\n<\/ul>","text":"자본주의가 주는 보상을 거두는 성공 투자 전략은 주식을 매매하는 것이 아니라 기업을 보유하는 것이다. 전체 시장 인덱스펀드에 투자해서 전체 기업을 소유하는 방법이 완전한 위험 축소 전략이다. 총수익에서 비용을 공제한 순수익이 투자자들의 몫이다. 주식 투자자에게 최대의 적은 비용과 감정이다. 개별주, 액티브펀드, 고비용 인덱스펀드, ETF, 상품펀드, 헤지펀드, 헤지 재간접 펀드에 절대 투자하지 마라. 국제 투자를 가미할 필요는 없지만 원한다면 포트폴리오에서 20%를 넘기지 마라. 가치주 펀드와 소형주 펀드 등에 펀드 나누기를 할 필요가 전혀 없다. 인플레이션 연계 채권에 투자하면 장기적으로 화폐의 구매력을 탁월하게 유지할 수 있다. 주먹구구식으로 스무 살이면 채권 비율을 20%, 환갑이라면 70%를 보유하는 식으로 자산 배분이 가능하다. [데이터 | 보글 원자료] 항목 보글 제시 수치 기준 기간 산식/정의 의미 출처 [보글 본문] 복습 질문 4개 개념 점검형 전권 비용·ETF·해외분산·액티브 책의 핵심 논점 요약 원본 노트 기준선 [2017 이후 검증] 왜 인덱스펀드가 액티브를 이기기 쉬운가 → SPIVA 2025와 Morningstar 2025 모두 대형주 액티브의 장기 승률이 매우 낮음을 보여준다. 비용이 장기 수익률에 미치는 영향은 → 평균 비용 차이와 세금드래그 차이가 복리로 커진다. ETF를 왜 경계했는가 → 상품보다 거래행태가 문제였다. 최근 레버리지 ETF 열풍이 이를 보여준다. 해외분산은 어떻게 다른가 → 미국 투자자 전제에선 보글 논리가 강하지만, 한국 투자자에겐 그대로 적용되기 어렵다. [보강 | 논리 전개] 이 네 문항을 이해하면 보글 책의 80% 이상을 이해한 셈이다. 액티브 부진의 원인은 실력 부족만이 아니라 비용·세금·행동오류의 합성이다. ETF는 약이면서 독이고, 해외분산은 거주국 통화와 자산구조에 따라 결론이 달라진다. [반론] 최신 시장구조에서는 미국 집중과 ETF 진화로 인해 보글 원칙도 보완이 필요하다는 반론이 가능하다. [보글 측 재반론] 보완은 필요하지만, 핵심은 아직 바뀌지 않았다. 저비용·분산·장기·규율은 여전히 가장 재현 가능한 기본값이다. [한국 투자자 적용] 한국 투자자는 복습 문항 네 개에 “환율·연금계좌·원화 인출”을 추가하면 실무형 복습이 된다."},{"i":23,"title":"보글 핵심 수치 한눈에 보기","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>주제<\/th>\n<th style=\"text-align: right;\">보글 원자료 수치<\/th>\n<th style=\"text-align: right;\">최신 수치<\/th>\n<th>기준 기간<\/th>\n<th>핵심 의미<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>장기 주식수익 분해<\/td>\n<td style=\"text-align: right;\">[2017 개정판 데이터][간접복원] 장기 명목수익 연 9%대 중후반 수준, 배당+이익성장이 핵심<\/td>\n<td style=\"text-align: right;\">2024~2026 배당수익률은 1.1%~1.3% 수준, 대신 자사주매입 포함 총주주환원수익률 3.2%<\/td>\n<td>장기 역사 vs 2024~2026<\/td>\n<td>현대 미국시장은 “배당 중심”보다 “총주주환원 중심”으로 읽어야 함<\/td>\n<td>2017 개정판·S&amp;P 배당/자사주매입 자료<\/td>\n<\/tr>\n<tr>\n<td>투자수익 vs 투기수익<\/td>\n<td style=\"text-align: right;\">[보글 본문] 배당수익률 + 이익성장률 + PER 변화<\/td>\n<td style=\"text-align: right;\">Fama도 시장효율은 현실이 아닌 가설이라 인정<\/td>\n<td>장기 개념 vs 2024 인터뷰<\/td>\n<td>시장이 완전 효율적이지 않아도 보글 프레임은 유지<\/td>\n<td>Bogle/Fama 관련 자료<\/td>\n<\/tr>\n<tr>\n<td>비용의 복리 효과<\/td>\n<td style=\"text-align: right;\">[추론] 7% 총수익, 50년: 0.05% 비용 28.8배, 1.5% 비용 14.5배, 2.5% 비용 9.0배<\/td>\n<td style=\"text-align: right;\">2024 미국 평균 비용 0.34%, Vanguard 평균 0.07%<\/td>\n<td>50년 시뮬레이션, 2024 실제 비용<\/td>\n<td>비용 몇 bp 차이도 긴 시간엔 큰 몫 차이<\/td>\n<td>산식 복원·Morningstar·Vanguard<\/td>\n<\/tr>\n<tr>\n<td>펀드 생존율<\/td>\n<td style=\"text-align: right;\">[보글 본문] 생존편향 경고<\/td>\n<td style=\"text-align: right;\">국제주식 액티브 10년 생존율 40%, 대형성장 펀드 20년 가까운 기간에 65% 폐쇄<\/td>\n<td>10년~20년<\/td>\n<td>살아남은 승자만 보면 착시 발생<\/td>\n<td>Morningstar Active/Passive Barometer 2025<\/td>\n<\/tr>\n<tr>\n<td>시장 초과 펀드 비율<\/td>\n<td style=\"text-align: right;\">[보글 본문] 소수만 장기 초과<\/td>\n<td style=\"text-align: right;\">U.S. 대형주 2025년 21%만 초과, 10년 약 14%, 15년 약 10%<\/td>\n<td>2025, 10년, 15년<\/td>\n<td>대다수 액티브는 장기로 갈수록 불리<\/td>\n<td>SPIVA U.S. Scorecard Year-End 2025<\/td>\n<\/tr>\n<tr>\n<td>SPIVA 최신 결과<\/td>\n<td style=\"text-align: right;\">[보글 본문] 액티브 다수 부진<\/td>\n<td style=\"text-align: right;\">SPIVA U.S. Scorecard Year-End 2025에서 U.S. 대형주 79% 언더퍼폼<\/td>\n<td>2025 연말<\/td>\n<td>최신 공식 계열 지표도 보글 결론 지지<\/td>\n<td>S&amp;P Dow Jones Indices SPIVA<\/td>\n<\/tr>\n<tr>\n<td>버핏 헤지펀드 내기<\/td>\n<td style=\"text-align: right;\">인덱스 우위 논지에 부합<\/td>\n<td style=\"text-align: right;\">인덱스 126%, 헤지펀드 포트폴리오 36%, 최종 기부금 약 222만 달러<\/td>\n<td>2008~2017<\/td>\n<td>비용 높은 복잡 전략의 장기 부진을 상징<\/td>\n<td>Buffett vs Protégé 공개 결과<\/td>\n<\/tr>\n<tr>\n<td>배당 재투자의 효과<\/td>\n<td style=\"text-align: right;\">[후대 해석] 역사적으로 배당 기여 비중이 컸음<\/td>\n<td style=\"text-align: right;\">1930s~2000s 장기 평균에서 배당 기여가 총수익의 약 50.8%<\/td>\n<td>역사 장기<\/td>\n<td>배당 재투자는 여전히 중요하나, 최근엔 매입 비중 증가<\/td>\n<td>S&amp;P/장기수익 분석<\/td>\n<\/tr>\n<tr>\n<td>세금의 비용화<\/td>\n<td style=\"text-align: right;\">[보글 본문] 세금도 비용<\/td>\n<td style=\"text-align: right;\">ETF 세금드래그 0.36%, 뮤추얼펀드 1.28%<\/td>\n<td>1993~2024 누적 연구<\/td>\n<td>세금은 보수 못지않게 큰 장기 비용<\/td>\n<td>BofA/FT ETF tax drag<\/td>\n<\/tr>\n<tr>\n<td>채권펀드 비용 효과<\/td>\n<td style=\"text-align: right;\">[보글 본문] 채권도 비용 중요<\/td>\n<td style=\"text-align: right;\">Morningstar 10년 액티브 채권 성공률 42%, Vanguard 액티브 채권 비용 0.10% vs 업계 0.53%<\/td>\n<td>10년, 2025<\/td>\n<td>채권에선 액티브 여지가 있어도 비용 통제가 핵심<\/td>\n<td>Morningstar/Vanguard<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"주제 보글 원자료 수치 최신 수치 기준 기간 핵심 의미 출처 장기 주식수익 분해 [2017 개정판 데이터][간접복원] 장기 명목수익 연 9%대 중후반 수준, 배당+이익성장이 핵심 2024~2026 배당수익률은 1.1%~1.3% 수준, 대신 자사주매입 포함 총주주환원수익률 3.2% 장기 역사 vs 2024~2026 현대 미국시장은 “배당 중심”보다 “총주주환원 중심”으로 읽어야 함 2017 개정판·S&amp;P 배당/자사주매입 자료 투자수익 vs 투기수익 [보글 본문] 배당수익률 + 이익성장률 + PER 변화 Fama도 시장효율은 현실이 아닌 가설이라 인정 장기 개념 vs 2024 인터뷰 시장이 완전 효율적이지 않아도 보글 프레임은 유지 Bogle/Fama 관련 자료 비용의 복리 효과 [추론] 7% 총수익, 50년: 0.05% 비용 28.8배, 1.5% 비용 14.5배, 2.5% 비용 9.0배 2024 미국 평균 비용 0.34%, Vanguard 평균 0.07% 50년 시뮬레이션, 2024 실제 비용 비용 몇 bp 차이도 긴 시간엔 큰 몫 차이 산식 복원·Morningstar·Vanguard 펀드 생존율 [보글 본문] 생존편향 경고 국제주식 액티브 10년 생존율 40%, 대형성장 펀드 20년 가까운 기간에 65% 폐쇄 10년~20년 살아남은 승자만 보면 착시 발생 Morningstar Active/Passive Barometer 2025 시장 초과 펀드 비율 [보글 본문] 소수만 장기 초과 U.S. 대형주 2025년 21%만 초과, 10년 약 14%, 15년 약 10% 2025, 10년, 15년 대다수 액티브는 장기로 갈수록 불리 SPIVA U.S. Scorecard Year-End 2025 SPIVA 최신 결과 [보글 본문] 액티브 다수 부진 SPIVA U.S. Scorecard Year-End 2025에서 U.S. 대형주 79% 언더퍼폼 2025 연말 최신 공식 계열 지표도 보글 결론 지지 S&amp;P Dow Jones Indices SPIVA 버핏 헤지펀드 내기 인덱스 우위 논지에 부합 인덱스 126%, 헤지펀드 포트폴리오 36%, 최종 기부금 약 222만 달러 2008~2017 비용 높은 복잡 전략의 장기 부진을 상징 Buffett vs Protégé 공개 결과 배당 재투자의 효과 [후대 해석] 역사적으로 배당 기여 비중이 컸음 1930s~2000s 장기 평균에서 배당 기여가 총수익의 약 50.8% 역사 장기 배당 재투자는 여전히 중요하나, 최근엔 매입 비중 증가 S&amp;P/장기수익 분석 세금의 비용화 [보글 본문] 세금도 비용 ETF 세금드래그 0.36%, 뮤추얼펀드 1.28% 1993~2024 누적 연구 세금은 보수 못지않게 큰 장기 비용 BofA/FT ETF tax drag 채권펀드 비용 효과 [보글 본문] 채권도 비용 중요 Morningstar 10년 액티브 채권 성공률 42%, Vanguard 액티브 채권 비용 0.10% vs 업계 0.53% 10년, 2025 채권에선 액티브 여지가 있어도 비용 통제가 핵심 Morningstar/Vanguard"},{"i":24,"title":"보글 반대 진영의 최선의 반론과 보글 측 재반론","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>쟁점<\/th>\n<th>반론<\/th>\n<th>반론의 근거<\/th>\n<th>보글 측 재반론<\/th>\n<th>남는 논점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>액티브 운용은 완전히 불가능한가<\/td>\n<td>아니다. 버핏, Magellan, 일부 하우스는 실제로 장기 초과수익을 냈다.<\/td>\n<td>버핏의 장기 실적, Magellan·Primecap 같은 예외 사례<\/td>\n<td>예외는 존재하지만, 일반 투자자가 사전에 비용 차감 후 그 예외를 식별하기 어렵다. SPIVA·Morningstar는 장기 성공 확률이 매우 낮음을 보여준다.<\/td>\n<td>소수 예외의 재현성은 완전히 부정할 수 없다.<\/td>\n<\/tr>\n<tr>\n<td>소형가치·팩터 투자는 보글식 시장전체 인덱스보다 나은가<\/td>\n<td>장기 팩터 프리미엄이 존재할 수 있다.<\/td>\n<td>학계의 팩터 연구 전통, 가치·소형 프리미엄 논의<\/td>\n<td>보글은 팩터가 있어도 비용·추적오차·긴 부진구간을 개인이 버티기 어렵다고 본다.<\/td>\n<td>팩터는 이론상 강하지만 실무 실행 난도가 높다.<\/td>\n<\/tr>\n<tr>\n<td>미국만으로 충분한가<\/td>\n<td>아니다. 미국 편중과 메가캡 집중은 현재 과도하다.<\/td>\n<td>FTSE All-World 미국 비중 60%+, MSCI World 70%+, S&amp;P 상위 10개 38%<\/td>\n<td>미국 투자자에겐 생활통화와 자산통화가 같고, 미국 기업의 글로벌 매출이 간접 국제노출을 제공한다.<\/td>\n<td>한국 투자자에게는 이 재반론이 약하다.<\/td>\n<\/tr>\n<tr>\n<td>S&amp;P500이면 충분한가, 전체시장 인덱스가 나은가<\/td>\n<td>전체시장이 더 넓고 보글 취지에 더 가깝다.<\/td>\n<td>S&amp;P 500은 미국 시총 약 80%, Russell 3000은 약 98%<\/td>\n<td>S&amp;P 500도 충분히 저비용·낮은 마찰의 핵심 코어가 될 수 있다.<\/td>\n<td>집중도 상승 국면에선 전체시장 선호 논리가 더 강해졌다.<\/td>\n<\/tr>\n<tr>\n<td>ETF는 나쁜가, ETF 거래행태가 나쁜가<\/td>\n<td>ETF 자체는 더 싸고 세금 효율적이다.<\/td>\n<td>ETF 세금드래그 0.36% vs 뮤추얼펀드 1.28%<\/td>\n<td>보글의 핵심 비판 대상은 ETF의 일중거래 가능성이 유발하는 투기 행동이다.<\/td>\n<td>장기보유 ETF는 보글 철학과 양립 가능하다.<\/td>\n<\/tr>\n<tr>\n<td>채권 비중은 나이 규칙으로 충분한가<\/td>\n<td>아니다. 은퇴소득, 연금, 통화, 밸류에이션을 봐야 한다.<\/td>\n<td>현대 TDF는 훨씬 정교한 글라이드패스 사용<\/td>\n<td>나이 규칙은 정밀 최적화가 아니라 유지 가능한 출발점이다.<\/td>\n<td>은퇴 직전·직후엔 더 정교한 현금흐름 설계가 필요하다.<\/td>\n<\/tr>\n<tr>\n<td>TDF는 좋은 단순화인가<\/td>\n<td>대체로 좋지만 세금·설계·개인 상황을 단순화한다.<\/td>\n<td>Vanguard TDF는 90/10→50/40/10→30/50/20, 그러나 과세계좌 세금사건도 발생<\/td>\n<td>연금계좌 등에서는 매우 유용한 자동화 장치다.<\/td>\n<td>과세계좌, 특수 소득구조에는 주의가 필요하다.<\/td>\n<\/tr>\n<tr>\n<td>세금과 비용 중 무엇이 더 중요한가<\/td>\n<td>세금이 더 클 수 있다.<\/td>\n<td>ETF vs 뮤추얼펀드 세금드래그 격차 0.92%p<\/td>\n<td>보글식으론 둘 다 비용이다. 투자자가 통제 가능한 총마찰을 모두 낮춰야 한다.<\/td>\n<td>계좌 유형과 국가에 따라 우선순위가 달라진다.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"쟁점 반론 반론의 근거 보글 측 재반론 남는 논점 액티브 운용은 완전히 불가능한가 아니다. 버핏, Magellan, 일부 하우스는 실제로 장기 초과수익을 냈다. 버핏의 장기 실적, Magellan·Primecap 같은 예외 사례 예외는 존재하지만, 일반 투자자가 사전에 비용 차감 후 그 예외를 식별하기 어렵다. SPIVA·Morningstar는 장기 성공 확률이 매우 낮음을 보여준다. 소수 예외의 재현성은 완전히 부정할 수 없다. 소형가치·팩터 투자는 보글식 시장전체 인덱스보다 나은가 장기 팩터 프리미엄이 존재할 수 있다. 학계의 팩터 연구 전통, 가치·소형 프리미엄 논의 보글은 팩터가 있어도 비용·추적오차·긴 부진구간을 개인이 버티기 어렵다고 본다. 팩터는 이론상 강하지만 실무 실행 난도가 높다. 미국만으로 충분한가 아니다. 미국 편중과 메가캡 집중은 현재 과도하다. FTSE All-World 미국 비중 60%+, MSCI World 70%+, S&amp;P 상위 10개 38% 미국 투자자에겐 생활통화와 자산통화가 같고, 미국 기업의 글로벌 매출이 간접 국제노출을 제공한다. 한국 투자자에게는 이 재반론이 약하다. S&amp;P500이면 충분한가, 전체시장 인덱스가 나은가 전체시장이 더 넓고 보글 취지에 더 가깝다. S&amp;P 500은 미국 시총 약 80%, Russell 3000은 약 98% S&amp;P 500도 충분히 저비용·낮은 마찰의 핵심 코어가 될 수 있다. 집중도 상승 국면에선 전체시장 선호 논리가 더 강해졌다. ETF는 나쁜가, ETF 거래행태가 나쁜가 ETF 자체는 더 싸고 세금 효율적이다. ETF 세금드래그 0.36% vs 뮤추얼펀드 1.28% 보글의 핵심 비판 대상은 ETF의 일중거래 가능성이 유발하는 투기 행동이다. 장기보유 ETF는 보글 철학과 양립 가능하다. 채권 비중은 나이 규칙으로 충분한가 아니다. 은퇴소득, 연금, 통화, 밸류에이션을 봐야 한다. 현대 TDF는 훨씬 정교한 글라이드패스 사용 나이 규칙은 정밀 최적화가 아니라 유지 가능한 출발점이다. 은퇴 직전·직후엔 더 정교한 현금흐름 설계가 필요하다. TDF는 좋은 단순화인가 대체로 좋지만 세금·설계·개인 상황을 단순화한다. Vanguard TDF는 90/10→50/40/10→30/50/20, 그러나 과세계좌 세금사건도 발생 연금계좌 등에서는 매우 유용한 자동화 장치다. 과세계좌, 특수 소득구조에는 주의가 필요하다. 세금과 비용 중 무엇이 더 중요한가 세금이 더 클 수 있다. ETF vs 뮤추얼펀드 세금드래그 격차 0.92%p 보글식으론 둘 다 비용이다. 투자자가 통제 가능한 총마찰을 모두 낮춰야 한다. 계좌 유형과 국가에 따라 우선순위가 달라진다."},{"i":25,"title":"한국 투자자용 보글 원칙 재해석","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>보글 원칙<\/th>\n<th>미국 투자자 전제<\/th>\n<th>한국 투자자 적용<\/th>\n<th>주의점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>시장 전체를 사라<\/td>\n<td>미국 시장만으로도 거대한 자본시장과 달러 기반 글로벌 노출 확보<\/td>\n<td>한국 투자자는 미국·한국·글로벌 중 “전체”의 범위를 별도로 정의해야 함<\/td>\n<td>미국 단일시장 = 성장 노출 강함, 그러나 국가·통화 편중 존재<\/td>\n<\/tr>\n<tr>\n<td>비용을 최소화하라<\/td>\n<td>초저비용 인덱스·ETF 접근성 높음<\/td>\n<td>보수뿐 아니라 환전·해외거래수수료·세금·계좌관리 비용을 함께 봐야 함<\/td>\n<td>눈에 보이는 TER만 비교하면 총비용을 놓치기 쉬움<\/td>\n<\/tr>\n<tr>\n<td>오래 보유하라<\/td>\n<td>달러 생활비와 달러 자산이 대체로 일치<\/td>\n<td>원화 생활비 기준이면 환율 변동이 체감 변동성을 크게 좌우<\/td>\n<td>장기 보유가 환리스크를 제거하지는 않음<\/td>\n<\/tr>\n<tr>\n<td>해외분산은 선택<\/td>\n<td>미국 대기업 이미 글로벌 매출 보유<\/td>\n<td>한국 투자자에겐 해외분산이 선택이 아니라 거의 기본 검토 항목<\/td>\n<td>한국 시장 시총 비중과 원화 통화 특성 반영 필요<\/td>\n<\/tr>\n<tr>\n<td>ETF도 괜찮다<\/td>\n<td>장기 보유 시 세금 효율 높음<\/td>\n<td>국내상장 ETF와 해외상장 ETF의 과세 구조 차이를 먼저 이해<\/td>\n<td>레버리지·인버스·단일종목 ETF는 보글 철학과 거리 멂<\/td>\n<\/tr>\n<tr>\n<td>자산배분하라<\/td>\n<td>은퇴 자산과 생활통화가 미국 중심<\/td>\n<td>한국 은퇴자는 원화 지출, 연금 규칙, 세후 인출을 함께 설계<\/td>\n<td>100% 미국 주식은 기대수익은 높아도 인출 안정성은 별개<\/td>\n<\/tr>\n<tr>\n<td>연금계좌를 활용하라<\/td>\n<td>401(k), IRA 인프라 발달<\/td>\n<td>연금저축·퇴직연금·ISA·과세계좌를 역할별로 나눠야 함<\/td>\n<td>상품보다 계좌 우선 순서가 실무적으로 중요<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"보글 원칙 미국 투자자 전제 한국 투자자 적용 주의점 시장 전체를 사라 미국 시장만으로도 거대한 자본시장과 달러 기반 글로벌 노출 확보 한국 투자자는 미국·한국·글로벌 중 “전체”의 범위를 별도로 정의해야 함 미국 단일시장 = 성장 노출 강함, 그러나 국가·통화 편중 존재 비용을 최소화하라 초저비용 인덱스·ETF 접근성 높음 보수뿐 아니라 환전·해외거래수수료·세금·계좌관리 비용을 함께 봐야 함 눈에 보이는 TER만 비교하면 총비용을 놓치기 쉬움 오래 보유하라 달러 생활비와 달러 자산이 대체로 일치 원화 생활비 기준이면 환율 변동이 체감 변동성을 크게 좌우 장기 보유가 환리스크를 제거하지는 않음 해외분산은 선택 미국 대기업 이미 글로벌 매출 보유 한국 투자자에겐 해외분산이 선택이 아니라 거의 기본 검토 항목 한국 시장 시총 비중과 원화 통화 특성 반영 필요 ETF도 괜찮다 장기 보유 시 세금 효율 높음 국내상장 ETF와 해외상장 ETF의 과세 구조 차이를 먼저 이해 레버리지·인버스·단일종목 ETF는 보글 철학과 거리 멂 자산배분하라 은퇴 자산과 생활통화가 미국 중심 한국 은퇴자는 원화 지출, 연금 규칙, 세후 인출을 함께 설계 100% 미국 주식은 기대수익은 높아도 인출 안정성은 별개 연금계좌를 활용하라 401(k), IRA 인프라 발달 연금저축·퇴직연금·ISA·과세계좌를 역할별로 나눠야 함 상품보다 계좌 우선 순서가 실무적으로 중요"},{"i":26,"title":"출처 목록","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>출처명<\/th>\n<th>저자/기관<\/th>\n<th>연도/기준일<\/th>\n<th>사용한 내용<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>기준선<\/td>\n<td>원본 <code>독서_모든_주식을_소유하라.md<\/code><\/td>\n<td>사용자 업로드<\/td>\n<td>2026-03-31<\/td>\n<td>기존 frontmatter·제목·장 헤더·불릿·관련 노트 기준선<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>보강본<\/td>\n<td><code>04_모든주식을소유하라_deepresearch_v1
