 수 없다.<\/li>\n<li>자본이 과잉 공급되면 투자자들은 낮은 수익과 좁은 오차 범위를 허용하는 것으로 거래를 위한 경쟁을 한다. 그러나 생각해보면, 무엇인가에 더 높은 금액을 제시할수록 수중에 있는 돈은 줄어든다.<\/li>\n<li>만연한 리스크 경시로 커다란 리스크가 발생한다. 이런 식의 주기에서 사람들은 대출자에게 좀 더 우호적인 부채에 자금을 공급하고 있기 때문에, 바이아웃 거래가 점점 늘어나는 레버리지를 감당해줄 수 있을 것이라고 생각한다. 결국 뜻밖의 사건으로 인한 리스크나 과다차입 자본구조에 내재된 위험을 무시하게 된다.<\/li>\n<li>기업실사가 충분하지 않으면 투자 손실을 가져온다. 손실을 피할 수 있는 최고의 방어는 통찰력 있는 분석과 '오차 범위'를 강조하는 것이다. 그러나 사람들은 돈을 잃는 것에 대한 걱정이 아니라, 기회를 놓치는 것에 대해 걱정한다.<\/li>\n<li>경기가 좋을 때에는 자본이 혁신적인 투자에 몰리는데, 많은 경우 오래 견디지 못하고 사라진다. 열기가 신중함을 밀어내고, 사람들은 이해되지 않는 새로운 투자상품을 받아들이게 된다. 그리고 나중에 대체 무슨 생각을 했던 것일까 궁금해한다.<\/li>\n<li>포트폴리오에 퍼져 있는 숨은 폴트라인으로 인해 서로 관련 없어 보이는 자산 가격이 같은 방향으로 움직이도록 할 수 있다. 투자의 기대 수익률과 리스크를 평가하는 것은 비교적 쉽지만, 특정 자산이 다른 자산과 어떤 상관관계를 형성하며 움직일지 예측하는 것은 훨씬 어렵다.<\/li>\n<li>특히 시장 위기 상황에서는 자산 간 상관관계가 급격히 상승하는 경향이 있으며, 투자자들이 이를 과소평가하는 경우가 매우 많다.<\/li>\n<li>포트폴리오는 평소에는 자산군, 업종, 지역 측면에서 분산 투자가 이루어진 것처럼 보일 수 있다. 그러나 시장 변동성에 확대되는 국면에서는 비펀더멘털 요인이 지배적인 영향을 미칠 수 있다. 예를 들어 마진콜이나 시장 유동성 경색, 전반적인 위험 회피 심리와 같은 요인들은 모든 자산에 광범위한 영향을 미치며 동반 하락을 초래할 수 있다.<\/li>\n<li>심리적, 기술적 요인들이 펀더멘털을 압도할 수 있다. 장기적으로 가치의 창출과 파괴는 경제 추세, 기업 소득, 제품 수요, 관리 능숙도 같은 펀더멘털에 의해 결정되나 단기적으로 시장은 자산의 공급과 수요에 영향을 미치는 투자자 심리와 기술적 요인에 즉각 반응한다.<\/li>\n<li>단기적으로 봤을 때 확신이 다른 어떤 요인보다 문제가 된다고 생각한다. 확신 하나로 예측할 수 없고, 비합리적인 결과가 얼마든지 발생할 수 있기 때문이다.<\/li>\n<li>시장은 변하면서 각종 모델들이 틀렸음을 증명한다. 퀀트가 어려움을 겪는 이유는 컴퓨터는 패턴의 변화와 미래에 있을지도 모를 비정상적인 시기를 예측할 수 없다. 따라서 과거 기준에 대한 신뢰도를 대체로 과대평가한다.<\/li>\n<li>레버리지는 결과를 확대할 뿐 부가가치를 창출하지는 않는다. 약정 수익이 높거나 리스크 프리미엄이 큰 저가의 자산에 투자하기 위해 레버리지를 이용하는 것은 좋은 생각일 수 있으나 반대로 약정 수익이 낮거나 제 값을 다 주거나 심지어 가치보다 비싼 가격을 주어야 하는 자산을 추가 매입하고자 레버리지를 이용하는 것은 위험할 수 있다.<\/li>\n<li>과잉은 바로잡힌다. 투자자 심리가 극단적으로 장밋빛이고, 시세가 이상적인 상태를 가정하여 책정되면 상황이 늘 좋을 것이라는 추정을 기반으로, 이미 상황은 자본 파괴를 향해 가고 있는 것이다.<\/li>\n<li>투자자들의 추정이 너무 낙관적임이 드러날 때, 부정적인 사건이 일어날 때, 아니면 단지 너무 비싼 가격이 제 무게를 감당 못해 폭락할 때도 자본 파괴가 일어날 수 있다.<\/li>\n<\/ul>\n<\/li>\n<li>\"투자 가능한 자금에 대한 수요·공급 균형과, 그 자금을 이용하고 싶은 열망과 관련하여 주변에서 무슨 일이 일어나고 있는지 촉각을 곤두세워야 한다\"는 것이다.<\/li>\n<li>쓸 수 있는 자금이 거의 없을 때, 그 자금을 쓰려면 얼마나 많이 망설이게 되는지 우리는 알고 있다. 또한 충분히 가치 있는 투자 대상이 임자 없이 방치될 수 있고, 영업 실적이 경제 전반에 걸쳐 부진할 수 있다는 것을 안다. 이를 신용경색이라고 한다.<\/li>\n<li>\"너무 많은 자본이 너무 적은 아이디어를 좇는다\"의 경우에도 당신의 투자 건전성이 위험해질 수 있으므로 이를 꼭 인식하고 대처해야 한다.<\/li>\n<li>위기를 앞두고 투자자들이 할 수 있는 행동<ul>\n<li>다른 이들의 경솔하고 조심성 없는 행동에 주의를 기울인다.<\/li>\n<li>불황에 심리적으로 대비한다.<\/li>\n<li>자산을 매각한다 (리스크가 큰 것만이라도 매각한다).<\/li>\n<li>레버리지를 줄인다.<\/li>\n<li>현금을 보유한다.<\/li>\n<li>포트폴리오의 방어성을 높인다.<\/li>\n<\/ul>\n<\/li>\n<li>위기는 잠재적인 함정들이 나타나면서 고조되었다. 무엇보다 손절매의 가능성이 있었고, 그로 인해 지갑을 닫고 투자 기회를 놓치게 될 가능성이 있었다.<\/li>\n<li>상대적으로 손실이 없는 시기에 사람들은 리스크를 변동성 정도로 생각하고, 그 정도는 감수할 수 있다고 착각하는 경향이 있다.<\/li>\n<li>변동성을 감수할 수 있는 능력과 평정심을 유지할 수 있는 능력이 과대평가된 것이라면, 시세가 최악일 때 그것이 실수였음이 밝혀진다. 그리하여 확신과 결의가 사라지면, 투자자들은 저점에서 매도함으로써 하향 변동성을 영구 손실로 바꾸어 버리고, 경기가 회복되고 나서도 적극적인 시장 참여는 불가능해진다.<\/li>\n<li>영구적이고 포트폴리오에 커다란 영향을 미친다는 이유로 영구 손실은 투자에서 가장 큰 실수가 된다. 특히 경제 주기와 같은 방향으로 움직였을 때 발생할 수 있는 가장 운 나쁜 상황이다.<\/li>\n<li>주기와 반대로 움직이는 행동은 최근 경제위기로부터 온전히 영향을 받지 않기 위해 꼭 필요한 요소였기 때문에, 주기와 같은 방향으로 움직인 것이 가장 큰 잠재적 함정을 만들었다.<\/li>\n<li>시세가 올랐을 때 낙관적인 입장을 유지했던 투자자들은 불황과 뒤이은 반등에 가장 준비가 안 되어 있었다.<\/li>\n<li>시세 하락은 심리적으로 가장 큰 영향을 미쳤고 마진콜과 담보물 압수는 부채가 들어간 증권에 치명적이었다. 문제가 있는 보유 자산에 대한 해결책을 마련해야 했고 늘 그렇듯 많은 사람들이 자신감 상실로 적기에 하면 좋은 일을 하지 못했다.<\/li>\n<li>방어적인 성향의 전문 투자자들은 하락장에서 평정심을 유지할 수 있고, 저가 매도를 하게 만드는 심리적 압박감에 저항할 수 있게 해주며 폭락장에서 저가 매수를 통해 보다 큰 수익을 올릴 수 있게 해준다. 따라서 회복장에서도 더 좋은 성과를 낸다.<\/li>\n<li>다음은 실수에 필요한 일반적인 요소들이다.<ul>\n<li>분석 과정에서 정보, 또는 계산에 실수가 생기면 가치평가는 정확하지 않게 된다.<\/li>\n<li>가능한 모든 상황, 또는 그로 인한 결과가 과소평가된다.<\/li>\n<li>탐욕, 공포, 시기, 자아, 불신의 유예, 순응 및 굴복, 또는 이 모든 것들의 결합은 극단을 향해 움직인다.<\/li>\n<li>결과적으로 리스크 감수나 리스크 회피가 과도해진다.<\/li>\n<li>가격과 가치 사이에 상당한 차이가 생긴다.<\/li>\n<li>그리고 투자자들은 이 차이를 알아차리지 못한다. 어쩌면 더 큰 차이가 나는 데 한몫한다.<\/li>\n<\/ul>\n<\/li>\n<li>2차적 사고를 하는 사람들은 다른 투자자들의 실수뿐만 아니라, 분석 실수에도 주의를 기울인다. 시장이 지나치게 과열되었거나, 냉각된 상황에서 가치에 비해 너무 저가이거나, 고가인 자산을 알아본다.<\/li>\n<li>다른 사람들이 하는 실수를 피하기로 방침을 세우고, 이를 충분히 기회로 삼는다.<\/li>\n<li>투자 실수로 인한 결과는 간단히 정의할 수 있다. 바로 내재가치와 다른 가격이다. 그러나 실제 결과를 감지하고, 그에 대해 조치를 취하는 것은 그렇게 간단하지 않다.<\/li>\n<li>늘 상황을 의식하고, 유연하게 행동하고, 환경에 적응하고, 환경으로부터 필요한 힌트를 얻는 데 집중하는 사고방식을 가져야 한다.<\/li>\n<li>투자 결과를 향상시킬 수 있는 한 가지 방법은 무엇이 '오늘의 실수'가 될 수 있을지에 대해 생각해보고, 그 실수를 하지 않기 위해 노력하는 것이다.<\/li>\n<li>투자 실수가 행동의 누락에서 비롯되는 경우도 있다. 꼭 했어야 하는 일을 하지 않은 것이다. 그러나 오늘날 실수가 행동을 하는 데서 비롯된다고 생각한다. 하지 말았어야 할 일을 하는 것이다.<\/li>\n<li>어떤 행동을 해서 실수가 생길 때도 있고 어떤 행동을 하지 않아서 실수가 생길 때도 있지만, 눈에 띄는 실수가 없을 때도 있다는 것을 유념해야 한다.<\/li>\n<li>투자자 심리가 평정 상태에 있을 때 공포와 탐욕은 균형을 이루고, 자산 가격은 가치에 비례하여 공정할 것이다. 이 경우 꼭 해야 하는 행동이 없을 수도 있다는 것을 알아야 한다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 막스의 함정 목록은 사실상 손실의 발생 메커니즘 지도다.<\/li>\n<li>[추론] 이 장은 분석 실수, 심리 실수, 구조 실수, 주기 실수, 상상력 부족을 하나의 실패 체계로 묶는다.<\/li>\n<li>[현대 적용] 포트폴리오 리뷰에서는 종목별 아이디어 검토보다 <code>숨은 상관관계<\/code>, <code>레버리지<\/code>, <code>유동성 환상<\/code>, <code>새로운 상품에 대한 미숙한 신뢰<\/code>를 따로 점검해야 한다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>내가 빠뜨린 시나리오는 무엇인가?<\/li>\n<li>포트폴리오의 숨은 공통 노출은 무엇인가?<\/li>\n<li>“절대 안 일어난다”는 믿음 위에 세운 가정이 있는가?<\/li>\n<li>시장 열기를 체계적으로 점검하고 있는가?<\/li>\n<li>오늘의 실수는 행동 부족인가, 과잉 행동인가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 하우절(예상 밖 사건과 인간 행동), 코스톨라니(군중심리), 그레이엄(과대평가/과소평가), 보글(복잡성 과잉 회피).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 함정 회피는 영원한 소극성으로 흐르면 안 된다.<\/li>\n<li>[추론] “새롭다”는 이유만으로 기회가 되는 것이 아니라, 테스트되지 않았다는 점이 오히려 경고일 수 있다.<\/li>\n<\/ul>","text":"기존 노트 투자자는 큰 실수를 피하기만 하면, 몇 가지만 제대로 하면 된다. 손실을 피하는 노력이, 무리하여 좋은 실적을 올리려는 노력보다 중요하다는 것이다. 무리하게 실적을 위해 노력하는 것은 단기적으로는 성공할 수 있겠지만, 가끔 시도해서 실패할 경우 영영 회복이 불가능할 수도 있다. 손실 회피의 노력은 좀 더 자주 성공할 수 있고, 결과를 더 신뢰할 수 있으며, 실패해도 무리한 실적을 추구하다 실패했을 때보다는 훨씬 견딜 만한 결과로 나타날 것이다. 손실을 피하려면 무엇보다 손실을 유발시키는 함정들을 이해하고 그로부터 멀어질 필요가 있고 투자의 함정에는 많은 종류가 존재한다. 실수의 원천이 주로 분석적·지능적이거나, 심리적·감정적이 되는 데 있다고 생각하고 그 밖에도 잘못된 분석 프로세스를 적용하거나, 계산에서 실수를 하거나, 했어야 하는 일을 하지 않고 넘어간 것 등이 있을 수 있고 이 외에도 무궁무진하게 많다. 좀 더 언급하고 싶은 유형 중 하나는 바로 '상상력 부족'이고 이는 발생 가능한 결과의 범위를 전체적으로 그려보지 못하거나, 좀 더 극단적으로 발생하는 결과에 대해 충분히 이해하지 못하는 것이다. 실수를 유발하는 심리적·감정적 요인은 탐욕과 공포, 불신의 유예와 의심, 자아와 시기심, 리스크 감수를 통해 고수익을 올리고 싶은 욕구, 자신의 예지를 과대평가하는 경향 등이다. 또 하나의 중요한 함정은 시장 주기와 열기를 인지하지 못하고, 이와 반대 방향으로 움직이는 것이다. 이것은 실수의 잦은 원인이 되는 것은 아니지만 한 번 발생하면 가장 큰 실수를 초래한다. 군중심리가 가진 영향력은 실로 대단해서 군중을 이루는 구성원들을 어쩔 수 없이 순응하고, 굴복하게 만들고, 거의 저항할 수 없게 만든다. 그렇기 때문에 더더욱 투자자들은 이에 반드시 저항해야 한다. 투자는 대체로 미래를 상대하는 것이며 투자를 하려면, 우리는 미래의 상황이 어떨 것 같은지에 대한 견해를 가지고 있어야 하지만 우리에게는 미래가 과거와 매우 비슷할 것이라고 추정하는 것 외에는 별다른 선택의 여지가 없다. 중요한 금융 현상들은 대체로 긴 주기를 따르기 때문에, 극단적인 사건을 경험한 사람들은 종종 다음번 사건이 일어나기 전에 은퇴하거나 사망하는 일이 많고 금융과 관련한 기억들의 수명은 극단적으로 짧다. 그리고 설사 기억한다고 해도 저금리 대출 약속 앞에 연기처럼 사라져 버린다. 대부분의 경우 미래는 과거와 흡사하기 때문에 추론이 해가 될 것은 없다. 그러나 미래가 과거와 달라지는 터닝 포인트에서 추론은 실패하고, 거액의 손실액이 발생하거나, 역시 거액의 수익 창출 기회가 사라진다. 뜻밖의 상황들이 발생하고, 단기간의 결과는 장기간의 가능성에서 빗나갈 수 있으며, 사건이란 원래 줄지어 발생한다. 무슨 일이 '일어날 것'이라고 지나치게 의지했다가는, 예측이 실패했을 경우 큰 낭패를 볼 수 있다. 주위에서 흔히 볼 수 있는 정상적인 결과에 너무 의지해서는 안 되고 아웃라이어, 즉 드물게 발생하는 결과도 감안해야 한다. 성공할 것으로 예상될 때만 투자를 하며, 가능성 있는 시나리오를 집중적으로 분석할 것이다. 그러나 다른 가능성을 배제한 채 예상되는 시나리오만 고집하거나, 부정적인 결과가 발생했을 때 큰 피해를 입을 수 있을 정도로 시나리오를 리스크와 레버리지를 가득 채워서도 안 된다. 금융위기는 대체로 이전에는 한 번도 일어난 적 없었던 사건들이 이를 견디지 못하도록 설계된 리스크가 크고 부채가 많은 구조와 충돌하기 때문에 발생한다. 어떤 일이 일어날 리 없다는 추정에 그 어떤 일이 일어날 가능성이 있다면 그 추정은 소용없는 것이 된다. 그 일이 일어날 리 없다고 믿는 사람들이 마음 놓고 위험한 행동을 함으로써 결국 상황이 바뀌기 때문이다. 함정을 피하는 것이 중요하기는 하지만, 피하는 정도에도 한계는 있어야 할 것이다. 그리고 그 기준은 투자자마다 다르다. 자산에는 예상되는 수익과 리스크가 있으며, 이를 짐작하는 것이 가능하다는 것을 모두가 알고 있다. 그러나 자산의 상관관계를 이해하는 사람은 드물다. 상관관계의 영향력을 이해하고 예측하는 것은 리스크 제어와 포트폴리오 관리의 중요한 측면이지만, 이를 성공적으로 수행하기는 매우 어렵다. 상상력 부족은 미래에 발생 가능한 극단적인 사건들을 예상하지 못하는 것에 첫 번째 원인이 있고, 그런 극단적인 사건들 때문에 연쇄적으로 발생하게 될 결과에 대해 이해하지 못하는 것에 두 번째 원인이 있다. 많은 면에서 심리적 영향은 투자 실수를 유발하는 가장 흥미로운 요소에 속하며, 증권 가격에 지대한 영향을 끼칠 수 있고 이로 인해 자산 가격을 너무 높거나 너무 낮게 만들 수 있다. 이로 인해 거품과 붕괴가 생겨난다. 투자자들은 어떻게 해서 심리적 영향의 피해를 입을까? 심리에 굴복함으로써 피해를 입는다. 다른 이들의 굴복으로 왜곡된 시장에 상황을 모르는 채로 참가함으로써 피해를 입는다. 그런 왜곡이 존재하는 시기를 기회로 삼지 못함으로써 피해를 입는다. 탐욕이 과도해지면 증권 가격은 지나치게 오르는 경향이 있고, 따라서 예상 수익은 낮아지고 리스크는 높아진다. 이렇게 해서 문제의 자산은 투자 실수로 드러나고 손실이 나기를 기다리거나, 이를 기회로 삼을 다른 사람의 매입을 기다리게 된다. 심리에 굴복하여 다른 이들의 탐욕에 동참하여 그 자산을 높은 가격임에도 불구하고 매입을 하게 되면 실망할 일만 남게 된다. 실력 있는 투자자들은 단순히 실수를 피하는 것을 넘어 이를 적극적으로 활용하려 한다. 과대평가되었을 때 단순히 매도하는 것을 넘어, 주가가 하락할 가능성을 활용해 공매도를 통해 수익을 추구할 수도 있다. 강세장에서 충분히 의심하지 않고 다음의 개념들을 받아들이면 종종 거품과 붕괴의 원인이 되는 심리에 기인하는 함정이다. 최근의 상황들이 세상을 바꿀 것이다. 과거에는 규칙이었던 패턴(경기 주기의 등락 등)들이 더 이상 발생하지 않을 것이다. 규칙이 변했다. (기업의 신뢰 여부, 기업 부채보유의 가치 여부 결정 기준 등) 전통적인 가치 규범이 더 이상 의미가 없다. (PER, 채권 수익률 스프레드, 부동산의 자본화율 등) 시계추가 움직이는 방식 때문에 투자자들이 너무 믿고 필요한 행동을 하지 않음으로써 충분한 의심을 하지 않게 되면, 이러한 실수들이 한꺼번에 자주 발생한다. 함정을 피하고자 할 때 꼭 필요한 첫 번째 단계는 함정을 찾는 것이다. 중요한 것은 함정을 예측하려고 노력하는 것이다. 시장은 매일매일 수업이 이루어지는 교실과 같아서 성공적인 투자를 하려면 관찰과 학습이 중요하다. 위기로부터 우리가 배우는 것, 또는 배워야 하는 것 과도한 자본 가용성은 자본이 가지 말아야 할 곳으로 흘러가게 하고 자본이 부족하고 수요가 많은 경우 정상적인 투자를 하게 되고, 너무 많은 자본이 너무 적은 아이디어를 좇다보면, 그럴 가치가 없는 곳에까지 투자가 이루어진다. 자본이 가지 말아야 할 곳으로 가게 되면 안 좋은 일이 생긴다. 자본이 넘치는 시기에는 대출부적격자까지 돈을 빌릴 수 있고 체납, 파산, 손실과 같은 결과를 피할 수 없다. 자본이 과잉 공급되면 투자자들은 낮은 수익과 좁은 오차 범위를 허용하는 것으로 거래를 위한 경쟁을 한다. 그러나 생각해보면, 무엇인가에 더 높은 금액을 제시할수록 수중에 있는 돈은 줄어든다. 만연한 리스크 경시로 커다란 리스크가 발생한다. 이런 식의 주기에서 사람들은 대출자에게 좀 더 우호적인 부채에 자금을 공급하고 있기 때문에, 바이아웃 거래가 점점 늘어나는 레버리지를 감당해줄 수 있을 것이라고 생각한다. 결국 뜻밖의 사건으로 인한 리스크나 과다차입 자본구조에 내재된 위험을 무시하게 된다. 기업실사가 충분하지 않으면 투자 손실을 가져온다. 손실을 피할 수 있는 최고의 방어는 통찰력 있는 분석과 '오차 범위'를 강조하는 것이다. 그러나 사람들은 돈을 잃는 것에 대한 걱정이 아니라, 기회를 놓치는 것에 대해 걱정한다. 경기가 좋을 때에는 자본이 혁신적인 투자에 몰리는데, 많은 경우 오래 견디지 못하고 사라진다. 열기가 신중함을 밀어내고, 사람들은 이해되지 않는 새로운 투자상품을 받아들이게 된다. 그리고 나중에 대체 무슨 생각을 했던 것일까 궁금해한다. 포트폴리오에 퍼져 있는 숨은 폴트라인으로 인해 서로 관련 없어 보이는 자산 가격이 같은 방향으로 움직이도록 할 수 있다. 투자의 기대 수익률과 리스크를 평가하는 것은 비교적 쉽지만, 특정 자산이 다른 자산과 어떤 상관관계를 형성하며 움직일지 예측하는 것은 훨씬 어렵다. 특히 시장 위기 상황에서는 자산 간 상관관계가 급격히 상승하는 경향이 있으며, 투자자들이 이를 과소평가하는 경우가 매우 많다. 포트폴리오는 평소에는 자산군, 업종, 지역 측면에서 분산 투자가 이루어진 것처럼 보일 수 있다. 그러나 시장 변동성에 확대되는 국면에서는 비펀더멘털 요인이 지배적인 영향을 미칠 수 있다. 예를 들어 마진콜이나 시장 유동성 경색, 전반적인 위험 회피 심리와 같은 요인들은 모든 자산에 광범위한 영향을 미치며 동반 하락을 초래할 수 있다. 심리적, 기술적 요인들이 펀더멘털을 압도할 수 있다. 장기적으로 가치의 창출과 파괴는 경제 추세, 기업 소득, 제품 수요, 관리 능숙도 같은 펀더멘털에 의해 결정되나 단기적으로 시장은 자산의 공급과 수요에 영향을 미치는 투자자 심리와 기술적 요인에 즉각 반응한다. 단기적으로 봤을 때 확신이 다른 어떤 요인보다 문제가 된다고 생각한다. 확신 하나로 예측할 수 없고, 비합리적인 결과가 얼마든지 발생할 수 있기 때문이다. 시장은 변하면서 각종 모델들이 틀렸음을 증명한다. 퀀트가 어려움을 겪는 이유는 컴퓨터는 패턴의 변화와 미래에 있을지도 모를 비정상적인 시기를 예측할 수 없다. 따라서 과거 기준에 대한 신뢰도를 대체로 과대평가한다. 레버리지는 결과를 확대할 뿐 부가가치를 창출하지는 않는다. 약정 수익이 높거나 리스크 프리미엄이 큰 저가의 자산에 투자하기 위해 레버리지를 이용하는 것은 좋은 생각일 수 있으나 반대로 약정 수익이 낮거나 제 값을 다 주거나 심지어 가치보다 비싼 가격을 주어야 하는 자산을 추가 매입하고자 레버리지를 이용하는 것은 위험할 수 있다. 과잉은 바로잡힌다. 투자자 심리가 극단적으로 장밋빛이고, 시세가 이상적인 상태를 가정하여 책정되면 상황이 늘 좋을 것이라는 추정을 기반으로, 이미 상황은 자본 파괴를 향해 가고 있는 것이다. 투자자들의 추정이 너무 낙관적임이 드러날 때, 부정적인 사건이 일어날 때, 아니면 단지 너무 비싼 가격이 제 무게를 감당 못해 폭락할 때도 자본 파괴가 일어날 수 있다. \"투자 가능한 자금에 대한 수요·공급 균형과, 그 자금을 이용하고 싶은 열망과 관련하여 주변에서 무슨 일이 일어나고 있는지 촉각을 곤두세워야 한다\"는 것이다. 쓸 수 있는 자금이 거의 없을 때, 그 자금을 쓰려면 얼마나 많이 망설이게 되는지 우리는 알고 있다. 또한 충분히 가치 있는 투자 대상이 임자 없이 방치될 수 있고, 영업 실적이 경제 전반에 걸쳐 부진할 수 있다는 것을 안다. 이를 신용경색이라고 한다. \"너무 많은 자본이 너무 적은 아이디어를 좇는다\"의 경우에도 당신의 투자 건전성이 위험해질 수 있으므로 이를 꼭 인식하고 대처해야 한다. 위기를 앞두고 투자자들이 할 수 있는 행동 다른 이들의 경솔하고 조심성 없는 행동에 주의를 기울인다. 불황에 심리적으로 대비한다. 자산을 매각한다 (리스크가 큰 것만이라도 매각한다). 레버리지를 줄인다. 현금을 보유한다. 포트폴리오의 방어성을 높인다. 위기는 잠재적인 함정들이 나타나면서 고조되었다. 무엇보다 손절매의 가능성이 있었고, 그로 인해 지갑을 닫고 투자 기회를 놓치게 될 가능성이 있었다. 상대적으로 손실이 없는 시기에 사람들은 리스크를 변동성 정도로 생각하고, 그 정도는 감수할 수 있다고 착각하는 경향이 있다. 변동성을 감수할 수 있는 능력과 평정심을 유지할 수 있는 능력이 과대평가된 것이라면, 시세가 최악일 때 그것이 실수였음이 밝혀진다. 그리하여 확신과 결의가 사라지면, 투자자들은 저점에서 매도함으로써 하향 변동성을 영구 손실로 바꾸어 버리고, 경기가 회복되고 나서도 적극적인 시장 참여는 불가능해진다. 영구적이고 포트폴리오에 커다란 영향을 미친다는 이유로 영구 손실은 투자에서 가장 큰 실수가 된다. 특히 경제 주기와 같은 방향으로 움직였을 때 발생할 수 있는 가장 운 나쁜 상황이다. 주기와 반대로 움직이는 행동은 최근 경제위기로부터 온전히 영향을 받지 않기 위해 꼭 필요한 요소였기 때문에, 주기와 같은 방향으로 움직인 것이 가장 큰 잠재적 함정을 만들었다. 시세가 올랐을 때 낙관적인 입장을 유지했던 투자자들은 불황과 뒤이은 반등에 가장 준비가 안 되어 있었다. 시세 하락은 심리적으로 가장 큰 영향을 미쳤고 마진콜과 담보물 압수는 부채가 들어간 증권에 치명적이었다. 문제가 있는 보유 자산에 대한 해결책을 마련해야 했고 늘 그렇듯 많은 사람들이 자신감 상실로 적기에 하면 좋은 일을 하지 못했다. 방어적인 성향의 전문 투자자들은 하락장에서 평정심을 유지할 수 있고, 저가 매도를 하게 만드는 심리적 압박감에 저항할 수 있게 해주며 폭락장에서 저가 매수를 통해 보다 큰 수익을 올릴 수 있게 해준다. 따라서 회복장에서도 더 좋은 성과를 낸다. 다음은 실수에 필요한 일반적인 요소들이다. 분석 과정에서 정보, 또는 계산에 실수가 생기면 가치평가는 정확하지 않게 된다. 가능한 모든 상황, 또는 그로 인한 결과가 과소평가된다. 탐욕, 공포, 시기, 자아, 불신의 유예, 순응 및 굴복, 또는 이 모든 것들의 결합은 극단을 향해 움직인다. 결과적으로 리스크 감수나 리스크 회피가 과도해진다. 가격과 가치 사이에 상당한 차이가 생긴다. 그리고 투자자들은 이 차이를 알아차리지 못한다. 어쩌면 더 큰 차이가 나는 데 한몫한다. 2차적 사고를 하는 사람들은 다른 투자자들의 실수뿐만 아니라, 분석 실수에도 주의를 기울인다. 시장이 지나치게 과열되었거나, 냉각된 상황에서 가치에 비해 너무 저가이거나, 고가인 자산을 알아본다. 다른 사람들이 하는 실수를 피하기로 방침을 세우고, 이를 충분히 기회로 삼는다. 투자 실수로 인한 결과는 간단히 정의할 수 있다. 바로 내재가치와 다른 가격이다. 그러나 실제 결과를 감지하고, 그에 대해 조치를 취하는 것은 그렇게 간단하지 않다. 늘 상황을 의식하고, 유연하게 행동하고, 환경에 적응하고, 환경으로부터 필요한 힌트를 얻는 데 집중하는 사고방식을 가져야 한다. 투자 결과를 향상시킬 수 있는 한 가지 방법은 무엇이 '오늘의 실수'가 될 수 있을지에 대해 생각해보고, 그 실수를 하지 않기 위해 노력하는 것이다. 투자 실수가 행동의 누락에서 비롯되는 경우도 있다. 꼭 했어야 하는 일을 하지 않은 것이다. 그러나 오늘날 실수가 행동을 하는 데서 비롯된다고 생각한다. 하지 말았어야 할 일을 하는 것이다. 어떤 행동을 해서 실수가 생길 때도 있고 어떤 행동을 하지 않아서 실수가 생길 때도 있지만, 눈에 띄는 실수가 없을 때도 있다는 것을 유념해야 한다. 투자자 심리가 평정 상태에 있을 때 공포와 탐욕은 균형을 이루고, 자산 가격은 가치에 비례하여 공정할 것이다. 이 경우 꼭 해야 하는 행동이 없을 수도 있다는 것을 알아야 한다. [구조화] [막스 본문] 막스의 함정 목록은 사실상 손실의 발생 메커니즘 지도다. [추론] 이 장은 분석 실수, 심리 실수, 구조 실수, 주기 실수, 상상력 부족을 하나의 실패 체계로 묶는다. [현대 적용] 포트폴리오 리뷰에서는 종목별 아이디어 검토보다 숨은 상관관계 , 레버리지 , 유동성 환상 , 새로운 상품에 대한 미숙한 신뢰 를 따로 점검해야 한다. [실전 질문] 내가 빠뜨린 시나리오는 무엇인가? 포트폴리오의 숨은 공통 노출은 무엇인가? “절대 안 일어난다”는 믿음 위에 세운 가정이 있는가? 시장 열기를 체계적으로 점검하고 있는가? 오늘의 실수는 행동 부족인가, 과잉 행동인가? [다른 책과의 연결] [후대 해석] 강한 연결: 하우절(예상 밖 사건과 인간 행동), 코스톨라니(군중심리), 그레이엄(과대평가/과소평가), 보글(복잡성 과잉 회피). [오해 방지] [추론] 함정 회피는 영원한 소극성으로 흐르면 안 된다. [추론] “새롭다”는 이유만으로 기회가 되는 것이 아니라, 테스트되지 않았다는 점이 오히려 경고일 수 있다."},{"i":20,"title":"19. 부가가치를 창출하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>부가가치를 창출한 투자자의 성과는 비대칭적이다. 그들이 내는 시장수익률은 그들이 입는 손실률보다 높다. 불리한 환경에서 손해를 보기보다, 유리한 환경에서 수익을 늘리려면 믿을 수 있는 것은 기술밖에 없다. 이것이 우리가 추구하는 투자의 비대칭이다.<\/li>\n<li>리스크와 수익 면에서 시장과 비슷한 성과를 내는 것은 그리 어렵지 않다. 어려운 것은 시장보다 잘하는 것, 부가가치를 창출하는 것이고 그러기 위해서는 뛰어난 투자 기술과 탁월한 통찰력이 필요하다.<\/li>\n<li>'베타'는 시장 추세에 대한 포트폴리오의 상대적 민감도를 측정하는 것이고 '알파'는 개인 투자 기술이나, 또는 시장 추세와 상관없이 성과를 올리는 능력이다.<\/li>\n<li>인덱스펀드로 환원율에 준하여 특정 시장지수의 모든 주식을 보유하면 선택한 지수의 특징들, 예를 들면 상승 잠재력, 하락 위험, 베타 즉 변동성, 성장성, 고평가 또는 저평가, 시장의 건전성을 그대로 반영하면서 수익을 내게 해준다.<\/li>\n<li>적극적 투자를 통해 초과 성과를 시도할 수 있고 이들은 수없이 많은 선택을 할 수 있다. 포트폴리오를 시장지수보다 공격적으로 할지 방어적으로 구성할지 결정할 수 있고, 포지션을 계속 유지할 것인지, 아니면 마켓 타이밍에 맞출 것인지를 결정할 수 있다.<\/li>\n<li>공격적인 투자를 선택하면 다른 주식보다 전형적으로 지수의 변동이 큰 주식에 집중하거나 레버리지를 이용함으로써 포트폴리오의 시장 민감도를 증가시킬 수 있다. 이런 방법으로 포트폴리오의 '체계적' 리스크, 즉 베타를 높일 수 있다.<\/li>\n<li>적극적인 투자자들이라면 종목 선택 능력을 개발하기 위해 지수로부터 멀어지기로 결정하고 지수의 일부 종목을 추가 매입하고, 다른 종목들은 비중을 줄이거나 배제한 다음, 지수에 해당되지 않는 종목을 일부 추가 매입할 수 있다.<\/li>\n<li>자신의 포트폴리오가 개별 기업들에 일어나는 특정 사건에 노출되도록, 따라서 전체 지수가 아닌 특정 종목에만 영향을 미치는 주가 동향에 노출되도록 할 것이다. 투자자들에게 탁월한 통찰력이 없다면 지수로부터의 일탈은 무의미한 결과를 낳을 것이다.<\/li>\n<li>공격적인 투자자들은 활황에서는 시장지수보다 높은 수익을 올리지만, 불황에는 더 큰 손실을 감수할 것을 예상해야 한다. 이것이 베타의 출발점이다. 베타는 이론상 상대적 변동성이나, 시장 수익에 대한 포트폴리오 수익의 상대적 민감도를 의미한다.<\/li>\n<li>체계적 위험은 시장 전체에 영향을 미치는 거시적 요인으로, 회피할 수 없는 위험이기 때문에 투자자들이 이에 대한 보상을 받는 반면 비체계적 위험은 개별 종목이나 특정 산업에 한정된 리스크로, 포트폴리오의 분산투자를 통해 제거할 수 있고 이론적으로 비체계적 위험을 감수한다고 해서 추가적인 수익으로 보상받을 이유가 없다.<\/li>\n<li>y = α + βx<\/li>\n<li>위험도가 높은 포트폴리오로 수익률 18%를 올린 투자자가 그보다 위험도가 낮은 포트폴리오로 수익률 15%를 올릴 매니저보다 꼭 뛰어난 것은 아니다.<\/li>\n<li>위험 조정 수익률을 통해서만 우리는 투자자가 탁월한 통찰력이나 투자 기술, 즉 알파를 가졌는지 결정할 수 있을 것이다. 즉 투자자가 부가가치를 창출하는지 아닌지를 말이다.<\/li>\n<li>'시장을 이기는 것'과 '성공적인 투자'는 서로 별개일 수 있다. 중요한 것은 다만 수익이 아니라, 수익을 올리기 위해 얼마큼의 리스크를 감수했느냐 하는 것이다.<\/li>\n<li>투자자의 기술을 평가할 때, 방어적인 투자자와 공격적인 투자자의 기록을 비교하는 프로세스를 '스타일 조정'이라고 부르기도 한다.<\/li>\n<li>한 해의 실적만으로 기술에 대해 다 알 수 있는 것이 없다. 진짜 문제는 장기적으로, 그리고 자신의 투자 스타일과 맞지 않는 환경에서 투자자들이 어떤 성과를 내느냐다.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">구분<\/th>\n<th style=\"text-align: left;\">공격적 투자자<\/th>\n<th style=\"text-align: left;\">방어적 투자자<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>기술 없음<\/strong><\/td>\n<td style=\"text-align: left;\">시세 상승 - 큰 수익<\/td>\n<td style=\"text-align: left;\">시세 하락 - 손실이 크지 않음<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\">시세 하락 - 큰 손실<\/td>\n<td style=\"text-align: left;\">시세 상승 - 수익도 크지 않음<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>기술 있음<\/strong><\/td>\n<td style=\"text-align: left;\">시세 상승 - 큰 수익<\/td>\n<td style=\"text-align: left;\">시세 하락 - 손실이 크지 않음<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\">시세 하락 - 위의 수익에 비해 적은 손실<\/td>\n<td style=\"text-align: left;\">시세 상승 - 상당한 수익<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>위 표의 핵심은 실적의 대칭 또는 비대칭이다. 기술이 부족한 투자자들은 단순히 시장 수익을 올리고, 자기 스타일에 따른다. 기술이 없는 경우, 공격적인 투자자들은 양쪽 방향으로 많이 움직이고, 방어적인 투자자들은 조금 움직인다.<\/li>\n<li>기술이 없는 투자자들은 자신이 선택한 스타일 이상으로는 수익에 아무런 기여도 못한다. 각각 자신의 스타일이 유리할 때는 좋은 실적을 올리지만, 유리하지 못할 때는 실적도 좋지 못하다.<\/li>\n<li>부가가치를 창출한 기술이 있는 투자자들의 실적은 비대칭적이다. 이들이 올리는 시장 수익률은 손실률보다 높다. 기술을 가진 공격적인 투자자들은 상승 장세에서는 큰 수익을 내며, 그에 상응하는 하락 장세에서는 수익을 상쇄할 정도로 큰 손실을 입지 않는다.<\/li>\n<li>투자에서는 모든 것이 양날의 검과 같아서 탁월한 기술만을 제외하고는 모든 것이 대칭적으로 작용한다. 우리가 의지할 수 있는 것은 기술밖에 없다. 이것이 우리가 추구하는 투자의 불균형이다. 탁월한 기술은 이를 위한 필수 조건이다.<\/li>\n<li>경기가 좋은 해에는 평균 수익만으로도 충분하다. 그러나 시장을 꼭 이겨야 할 때가 있는데, 바로 불황인 해다.<\/li>\n<li>시장 성과가 좋을 때 함께 좋으려면, 포트폴리오는 충분한 양의 베타와 시장 포트폴리오와의 상관관계를 포함해야 한다. 그러나 베타와 상관관계가 상승 장세에서 우리를 돕는다면, 하락 장세에서는 해가 될 것이 당연하지 않은가?<\/li>\n<li>시세 하락할 때는 평균 이하의 손실을 기록하고, 시세가 상승할 때는 큰 수익을 달성하는 결과를 지속적으로 낼 수 있다면, 이는 단 한 가지 덕분일 것이다. 알파, 즉 기술이다.<\/li>\n<li>비대칭 즉 스타일만으로 투자했을 때 나올 수 있는 성과에 비해 하락세에서보다는 상승세에서 더 좋은 실적을 올리는 것은 모든 투자자의 목표가 되어야 한다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 알파는 단순 초과수익이 아니라, 감수한 리스크와 스타일을 감안한 비대칭 성과다.<\/li>\n<li>[추론] 이 장은 “성과의 크기”보다 “성과의 형태”를 보라고 요구한다. 좋은 투자자는 상승장에서 너무 무모하지 않고, 하락장에서 너무 많이 잃지 않는다.<\/li>\n<li>[현대 적용] 매니저 평가에서는 최근 1년 수익률이 아니라, 스타일 조정 후 장기 하방 통제와 회복력까지 봐야 한다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>내 성과는 알파인가, 베타 확대의 결과인가?<\/li>\n<li>상승장 수익이 하락장 손실을 정당화하는가?<\/li>\n<li>내 스타일과 맞지 않는 환경에서 나는 어떤 성과를 냈는가?<\/li>\n<li>위험 조정 후에도 초과성과가 남는가?<\/li>\n<li>이 성과는 재현 가능한가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 보글(베타의 현실 인정), 그레이엄(알파는 규율에서), 하우절(성과 평가의 왜곡 경계), 린치(실제 종목 우위가 있을 때만 일탈).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 시장을 이겼다고 해서 곧 잘한 투자가 아니다.<\/li>\n<li>[추론] 공격성은 기술이 아니다. 기술 없는 공격성은 베타 증폭일 뿐이다.<\/li>\n<\/ul>","text":"기존 노트 부가가치를 창출한 투자자의 성과는 비대칭적이다. 그들이 내는 시장수익률은 그들이 입는 손실률보다 높다. 불리한 환경에서 손해를 보기보다, 유리한 환경에서 수익을 늘리려면 믿을 수 있는 것은 기술밖에 없다. 이것이 우리가 추구하는 투자의 비대칭이다. 리스크와 수익 면에서 시장과 비슷한 성과를 내는 것은 그리 어렵지 않다. 어려운 것은 시장보다 잘하는 것, 부가가치를 창출하는 것이고 그러기 위해서는 뛰어난 투자 기술과 탁월한 통찰력이 필요하다. '베타'는 시장 추세에 대한 포트폴리오의 상대적 민감도를 측정하는 것이고 '알파'는 개인 투자 기술이나, 또는 시장 추세와 상관없이 성과를 올리는 능력이다. 인덱스펀드로 환원율에 준하여 특정 시장지수의 모든 주식을 보유하면 선택한 지수의 특징들, 예를 들면 상승 잠재력, 하락 위험, 베타 즉 변동성, 성장성, 고평가 또는 저평가, 시장의 건전성을 그대로 반영하면서 수익을 내게 해준다. 적극적 투자를 통해 초과 성과를 시도할 수 있고 이들은 수없이 많은 선택을 할 수 있다. 포트폴리오를 시장지수보다 공격적으로 할지 방어적으로 구성할지 결정할 수 있고, 포지션을 계속 유지할 것인지, 아니면 마켓 타이밍에 맞출 것인지를 결정할 수 있다. 공격적인 투자를 선택하면 다른 주식보다 전형적으로 지수의 변동이 큰 주식에 집중하거나 레버리지를 이용함으로써 포트폴리오의 시장 민감도를 증가시킬 수 있다. 이런 방법으로 포트폴리오의 '체계적' 리스크, 즉 베타를 높일 수 있다. 적극적인 투자자들이라면 종목 선택 능력을 개발하기 위해 지수로부터 멀어지기로 결정하고 지수의 일부 종목을 추가 매입하고, 다른 종목들은 비중을 줄이거나 배제한 다음, 지수에 해당되지 않는 종목을 일부 추가 매입할 수 있다. 자신의 포트폴리오가 개별 기업들에 일어나는 특정 사건에 노출되도록, 따라서 전체 지수가 아닌 특정 종목에만 영향을 미치는 주가 동향에 노출되도록 할 것이다. 투자자들에게 탁월한 통찰력이 없다면 지수로부터의 일탈은 무의미한 결과를 낳을 것이다. 공격적인 투자자들은 활황에서는 시장지수보다 높은 수익을 올리지만, 불황에는 더 큰 손실을 감수할 것을 예상해야 한다. 이것이 베타의 출발점이다. 베타는 이론상 상대적 변동성이나, 시장 수익에 대한 포트폴리오 수익의 상대적 민감도를 의미한다. 체계적 위험은 시장 전체에 영향을 미치는 거시적 요인으로, 회피할 수 없는 위험이기 때문에 투자자들이 이에 대한 보상을 받는 반면 비체계적 위험은 개별 종목이나 특정 산업에 한정된 리스크로, 포트폴리오의 분산투자를 통해 제거할 수 있고 이론적으로 비체계적 위험을 감수한다고 해서 추가적인 수익으로 보상받을 이유가 없다. y = α + βx 위험도가 높은 포트폴리오로 수익률 18%를 올린 투자자가 그보다 위험도가 낮은 포트폴리오로 수익률 15%를 올릴 매니저보다 꼭 뛰어난 것은 아니다. 위험 조정 수익률을 통해서만 우리는 투자자가 탁월한 통찰력이나 투자 기술, 즉 알파를 가졌는지 결정할 수 있을 것이다. 즉 투자자가 부가가치를 창출하는지 아닌지를 말이다. '시장을 이기는 것'과 '성공적인 투자'는 서로 별개일 수 있다. 중요한 것은 다만 수익이 아니라, 수익을 올리기 위해 얼마큼의 리스크를 감수했느냐 하는 것이다. 투자자의 기술을 평가할 때, 방어적인 투자자와 공격적인 투자자의 기록을 비교하는 프로세스를 '스타일 조정'이라고 부르기도 한다. 한 해의 실적만으로 기술에 대해 다 알 수 있는 것이 없다. 진짜 문제는 장기적으로, 그리고 자신의 투자 스타일과 맞지 않는 환경에서 투자자들이 어떤 성과를 내느냐다. 구분 공격적 투자자 방어적 투자자 기술 없음 시세 상승 - 큰 수익 시세 하락 - 손실이 크지 않음 시세 하락 - 큰 손실 시세 상승 - 수익도 크지 않음 기술 있음 시세 상승 - 큰 수익 시세 하락 - 손실이 크지 않음 시세 하락 - 위의 수익에 비해 적은 손실 시세 상승 - 상당한 수익 위 표의 핵심은 실적의 대칭 또는 비대칭이다. 기술이 부족한 투자자들은 단순히 시장 수익을 올리고, 자기 스타일에 따른다. 기술이 없는 경우, 공격적인 투자자들은 양쪽 방향으로 많이 움직이고, 방어적인 투자자들은 조금 움직인다. 기술이 없는 투자자들은 자신이 선택한 스타일 이상으로는 수익에 아무런 기여도 못한다. 각각 자신의 스타일이 유리할 때는 좋은 실적을 올리지만, 유리하지 못할 때는 실적도 좋지 못하다. 부가가치를 창출한 기술이 있는 투자자들의 실적은 비대칭적이다. 이들이 올리는 시장 수익률은 손실률보다 높다. 기술을 가진 공격적인 투자자들은 상승 장세에서는 큰 수익을 내며, 그에 상응하는 하락 장세에서는 수익을 상쇄할 정도로 큰 손실을 입지 않는다. 투자에서는 모든 것이 양날의 검과 같아서 탁월한 기술만을 제외하고는 모든 것이 대칭적으로 작용한다. 우리가 의지할 수 있는 것은 기술밖에 없다. 이것이 우리가 추구하는 투자의 불균형이다. 탁월한 기술은 이를 위한 필수 조건이다. 경기가 좋은 해에는 평균 수익만으로도 충분하다. 그러나 시장을 꼭 이겨야 할 때가 있는데, 바로 불황인 해다. 시장 성과가 좋을 때 함께 좋으려면, 포트폴리오는 충분한 양의 베타와 시장 포트폴리오와의 상관관계를 포함해야 한다. 그러나 베타와 상관관계가 상승 장세에서 우리를 돕는다면, 하락 장세에서는 해가 될 것이 당연하지 않은가? 시세 하락할 때는 평균 이하의 손실을 기록하고, 시세가 상승할 때는 큰 수익을 달성하는 결과를 지속적으로 낼 수 있다면, 이는 단 한 가지 덕분일 것이다. 알파, 즉 기술이다. 비대칭 즉 스타일만으로 투자했을 때 나올 수 있는 성과에 비해 하락세에서보다는 상승세에서 더 좋은 실적을 올리는 것은 모든 투자자의 목표가 되어야 한다. [구조화] [막스 본문] 알파는 단순 초과수익이 아니라, 감수한 리스크와 스타일을 감안한 비대칭 성과다. [추론] 이 장은 “성과의 크기”보다 “성과의 형태”를 보라고 요구한다. 좋은 투자자는 상승장에서 너무 무모하지 않고, 하락장에서 너무 많이 잃지 않는다. [현대 적용] 매니저 평가에서는 최근 1년 수익률이 아니라, 스타일 조정 후 장기 하방 통제와 회복력까지 봐야 한다. [실전 질문] 내 성과는 알파인가, 베타 확대의 결과인가? 상승장 수익이 하락장 손실을 정당화하는가? 내 스타일과 맞지 않는 환경에서 나는 어떤 성과를 냈는가? 위험 조정 후에도 초과성과가 남는가? 이 성과는 재현 가능한가? [다른 책과의 연결] [후대 해석] 강한 연결: 보글(베타의 현실 인정), 그레이엄(알파는 규율에서), 하우절(성과 평가의 왜곡 경계), 린치(실제 종목 우위가 있을 때만 일탈). [오해 방지] [추론] 시장을 이겼다고 해서 곧 잘한 투자가 아니다. [추론] 공격성은 기술이 아니다. 기술 없는 공격성은 베타 증폭일 뿐이다."},{"i":21,"title":"20. 모든 원칙을 준수하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>성공적인 투자, 또는 성공적인 투자 경력을 위한 최고의 기반은 가치다. 즉 당신이 매입을 고려하는 자산이 가치가 있는지 잘 알아야 한다.<\/li>\n<li>가치를 구성하는 요소에는 많은 것들이 있으며, 이를 검토하는 방법도 많이 있다. 아주 간단히 말하자면, 기업의 현금 보유량, 보유하고 있는 유형자산의 가치, 기업이나 자산의 현금 창출 능력, 그리고 이런 것들이 증가할 가능성이다.<\/li>\n<li>우수한 투자 실적을 달성하려면 자산가치에 대한 통찰력이 탁월해야 한다. 따라서 다른 이들은 모르는 것을 알아야 하고, 투자 대상을 다른 시각으로 보거나, 투자 대상을 분석하는 능력이 남보다 뛰어나야 한다. 세 가지 다 가능하다면 이상적이다.<\/li>\n<li>가치에 대한 견해는 확고한 사실적, 분석적 기반을 바탕으로 해야 하며 흔들림 없이 견지되어야 한다. 그래야만 언제 매매해야 하는지에 대한 확신이 생긴다.<\/li>\n<li>가치에 대한 확실한 이해만이 모두가 끝없이 오르기만 할 것이라고 생각하는 고평가된 자산으로 차익 실현을 할 수 있는 자제심과, 매일 시세가 하락하는 위기에서도 자산을 보유한 채 '물타기'를 할 수 있는 배짱을 갖게 될 것이다.<\/li>\n<li>가격과 가치 사이의 관계는 투자 성공에서 가장 중요한 핵심이다. 가치보다 낮은 가격으로 매입하는 것이 수익을 창출하는 가장 신뢰할 만한 방법이다. 드물기는 하지만 가치보다 높은 가격으로 매입해서 수익을 올리는 경우도 많다.<\/li>\n<li>자산을 가치 이하로 매각하게 하는 원인은 절호의 매입 기회는 주로 인식이 현실을 과소평가하기 때문에 존재한다. 좋은 자산은 누가 봐도 쉽게 알 수 있지만, 저가의 자산을 찾는 일에는 예리한 통찰력이 필요하다.<\/li>\n<li>투자자들은 종종 객관적인 우수성을 투자 기회로 오인한다. 최고의 투자자는 자신의 목표가 저가 매입 기회를 찾는 것이지, 좋은 자산을 찾는 것이 아님을 절대로 잊지 않는다.<\/li>\n<li>가격이 가치 이하일 때 매입하는 것은 수익 가능성 창출뿐만 아니라, 리스크를 제한하는 데 중요한 요소이기도 하다. 고성장에 대한 비용을 따로 지불하지 않고, 한창 상승 추세를 타느라 과열된 시장에 참여하지 않는 것도 리스크를 제한할 수 있는 방법이다.<\/li>\n<li>가격과 가치 사이의 관계는 심리와 기술적 요소, 즉 단기적으로 펀더멘털을 좌우하는 힘에 영향을 받는다. 이 두 가지 요소로 인해 가격 변동이 극심해지는 경우 고수익을 올릴 수도, 커다란 손실을 볼 수도 있다. 이때 가치의 개념을 고수하고 심리와 기술적 요인을 극복해야 한다.<\/li>\n<li>경제와 시장은 등락을 반복하여 순환한다. 대부분 사람들은 지금의 상태가 계속될 것이라고 믿는다. 이러한 생각은 시세에 악영향을 미쳐 극단적인 평가가 나오게 한다. 그리고 대부분의 투자자들이 피하기 힘든 거품과 패닉 상태를 야기하기 때문에 커다란 위험의 원인이 된다.<\/li>\n<li>투자를 하는 군중심리는 시계추처럼 규칙적인 패턴으로 움직인다. 낙관하다 비관하고, 곧잘 믿다가 이내 의심하고, 기회를 놓칠 것을 두려워하다 돈을 잃을 것을 두려워하고, 따라서 매입을 열망하던 상황에서 매각이 다급한 상황으로 바뀐다.<\/li>\n<li>군중의 일부가 되는 것은 결국 실패의 공식에 스스로를 대입하는 것밖에 안 된다. 반면, 극단적인 상황에서 2차적 사고를 하면 손실을 피하는 데 도움이 되고, 결국 성공에 이르게 된다.<\/li>\n<li>투자자들의 위험 회피 수준이 때에 따라 부족하기도, 과하기도 하다. 그 점에 있어서 투자자 심리의 변동은 시세 거품과 폭락을 야기하는 데 커다란 역할을 한다.<\/li>\n<li>심리적인 영향력이 결코 과소평가되어서는 안 된다. 탐욕, 공포, 불신의 유예, 순응, 시기심, 자아, 굴복은 모두 인간의 본성의 일부이며, 특히 극단적인 상황에서나 군중 사이에 이런 심리가 작용하면 이들은 그에 따라 행동할 수밖에 없다.<\/li>\n<li>다른 사람들에게도 심리적인 영향을 미칠 것이고, 신중한 투자자도 느끼게 될 것이다. 우리 누구도 이런 투자자 심리로부터 면역성이 있거나 단절될 수 있기를 기대해서는 안 된다.<\/li>\n<li>그리고 이런 심리를 느끼게 되더라도 굴복해서는 안 된다. 그보다는 그것이 어떤 심리인지 있는 그대로를 인식하고, 그 심리에 저항해야 한다. 이성으로 감정을 극복해야 한다.<\/li>\n<li>대부분의 추세는 강세든 약세든, 결국 도를 지나치게 되어 이를 빨리 눈치챈 사람들에게는 이익을 주지만, 마지막에 동참하는 사람들에게는 불이익을 준다.<\/li>\n<li>\"현자가 시작한 일을 바보가 마지막에 뛰어들어 마무리한다.\" 과열된 상황에 저항할 수 있는 흔치 않은 능력은 성공한 대부분의 투자자들이 가지고 있는 중요한 특징이다.<\/li>\n<li>과열된 시장 상황이 언제 식을지, 반대로 하락세가 언제 오를지를 아는 것은 불가능하다. 하지만 우리가 어디를 향해 가고 있는지는 모르더라도, 우리가 현재 어디에 있는지는 알아야 한다.<\/li>\n<li>주변 사람들의 행동을 통해 시장이 현재 주기의 어디쯤 와 있는지를 추측할 수 있다. 다른 투자자들이 태평할 때 우리는 주의를 기울여야 하고, 그들이 패닉 상태에 있을 때 우리는 공격적으로 변해야 한다.<\/li>\n<li>2차적 투자라고 해서 항상 수익을 창출하는 것은 아니다. 매매에 있어 절호의 기회는 극단적인 평가와 관련 있는데, 말 그대로 극단적인 상황은 자주 발생하지 않는다.<\/li>\n<li>우리들 중에 몇 년에 한 번씩만 기꺼이 투자할 수 있는 사람은 얼마 안 되므로, 우리는 주기상 적절한 시기에 매매해야 한다. 따라서 언제 상황이 우리에게 불리한지를 깨닫고, 그럴 때는 좀 더 신중해져야 한다.<\/li>\n<li>확실한 가치, 가치에 비해 낮은 가격, 비관적인 군중심리를 기반으로 매입하면 최고의 결과를 얻을 것이다. 그렇지만 상황이 우리에게 유리하게 되기까지 오랫동안 불리할 수도 있다. 가격이 너무 싸다는 것이 '곧' 오른다는 의미는 아니기 때문이다.<\/li>\n<li>\"시대를 너무 앞서 나가면 오히려 일을 그르칠 수 있다\" 자신의 판단이 옳았음이 입증될 때까지 충분히 오랫동안 포지션을 유지하려면 인내심과 배짱이 필요하다.<\/li>\n<li>가치를 수량화하여 가격이 적당할 때 이를 추구하는 것 외에도, 성공적인 투자자들은 리스크라는 대상에 대해 믿을 만한 전략을 가지고 있어야 한다. 가장 문제가 큰 리스크는 영구 손실이라는 것을 이해해야 한다.<\/li>\n<li>더 많은 리스크를 감수하는 것을 거부하고, 리스크가 클수록 가능한 결과의 범위도 넓어지고 손실 가능성도 커진다는 것을 알아야 한다.<\/li>\n<li>각각의 투자 대상에 존재하는 손실 가능성에 대해 이해하고, 손실에 대한 보상이 충분하고도 남을 때만 리스크를 감수해야 한다.<\/li>\n<li>대부분의 투자자들은 수익의 기회를 지나치게 단순하게 생각하고 그 기회를 잡기 위해 급급해 한다. 어떤 투자자들은 좀 더 심오한 통찰력을 갖고서 리스크를 이해하는 것이 수익을 이해하는 것만큼 중요하다는 사실을 깨닫는다. 그러나 포트폴리오의 전반적인 위험도를 제어하는 핵심 요소, 즉 상관관계를 제대로 평가하는 데 필요한 상식과 노력을 기울이는 투자자는 드물다.<\/li>\n<li>포트폴리오마다 상관관계에 차이가 있기 때문에, 절대적 위험도가 같은 개별 종목들이 다른 방식으로 결합되어 포트폴리오를 구성하면 전체 위험도는 매우 다양해질 수 있다. 분산투자가 효과적이려면, 포트폴리오 종목들의 특정 사건에 서로 다르게 반응할 수 있어야 한다는 것을 이해하는 사람은 많지 않다.<\/li>\n<li>\"우리가 하락 종목만 피한다면 상승 종목은 알아서 잘할 것\" 심각한 손실을 낼 가능성이 없는 종목만으로 분산투자하는 포트폴리오는 투자 성공을 위해 더없이 좋은 출발점이다.<\/li>\n<li>리스크 제어는 방어 투자의 핵심으로, 방어적인 투자자들은 옳은 일을 하려고 노력하는 것보다 잘못된 일을 하지 않는 것에 큰 비중을 둔다.<\/li>\n<li>어려운 환경에서 살아남는 능력을 확실히 하는 것과, 강세장에서 수익을 극대화하는 것은, 기본적으로 양립할 수 없는 문제이므로 투자자들은 그 두 가지를 놓고 어떤 식으로 균형을 이룰 것인지 결정해야 한다.<\/li>\n<li>안전마진은 방어 투자에서 매우 중요한 요소이다. 미래가 바라는 대로만 된다면야 대부분의 투자가 성공적일 것이지만, 미래가 뜻대로 되지 않을 때라도 성과가 웬만하려면 안전마진이 필요하다.<\/li>\n<li>투자자는 이론보다는 현실에서 지속적인 유형의 가치를 고집함으로써 안전마진을 획득할 수 있다. 즉 가격이 가치 이하일 때만 매입하거나, 레버리지를 피하거나, 분산투자하는 것이다.<\/li>\n<li>\"평균 수심 150cm의 시냇물을 건너다가 물에 빠져 죽었다는 키가 180cm인 남자를 절대로 잊지 마라\" 안전마진은 당신에게 버틸 수 있는 힘을 주고, 저점의 상황들을 헤쳐 나갈 수 있게 해준다.<\/li>\n<li>리스크 제어와 안전마진은 포트폴리오에 항상 존재하고 있어야 한다. 이 두 가지가 '보이지 않는 자산'임을 꼭 기억하기 바란다.<\/li>\n<li>투자시장은 대부분의 시기에 상황이 좋은 편이지만, 방어의 가치가 명백해지는 시기는 불황일 때뿐이다. 따라서 상황이 좋을 때 방어적인 투자자는 자신의 수익이 비록 최대치보다 낮더라도, 리스크 보호책이 가동 중인 상태에서 달성되었다는 것에 만족해야 한다.<\/li>\n<li>투자 성공에 꼭 필요한 요소 중에 하나는, 거시적 미래라는 관점에서 앞으로 무슨 일이 일어날지 우리가 알 수 없다는 사실을 깨닫는 것이다. 경제, 금리, 시가총액에 앞으로 무슨 일이 발생할지에 대해 시장 예측보다 많이 아는 사람은 있다고 해도 드물다.<\/li>\n<li>투자자는 산업, 기업, 증권 등 '알 수 있는 것들'을 앎으로써 경쟁에서 우위를 점할 수 있도록 노력해야 한다. 초점을 좁힐수록 다른 사람들은 모르는 것을 알 수 있는 가능성은 커진다.<\/li>\n<li>많은 투자자들이 스스로를 과대평가하여 경제와 시장이 어떤 미래를 향해 가고 있는지 안다고 추정하고 그에 따라 행동한다. 그러나 자신의 예측을 기반으로 공격적인 행동을 하는 이들이 바라는 만큼의 수익을 얻는 경우는 드물고 틀린 예측을 소신으로 삼는 투자는 심각한 손실을 입히는 원인이 된다.<\/li>\n<li>경제 예측과 투자관리 두 가지 측면에서 대개 정확한 예측을 하는 사람이 있다고는 해도, 동일 인물이 두 번 그렇게 하는 일은 드물다는 점에 주목할 필요가 있다. 가장 성공적인 투자자들은 '대체로 정확한' 예측을 하는데, 이 경우가 나머지보다 훨씬 낫다.<\/li>\n<li>성공적인 투자에 중요한 한 가지는 경기 변동, 기업들이 겪는 진통, 시세의 급격한 등락, 다른 투자자들이 쉽게 잘 믿는 것 들에서 흔히 생기는 함정을 피하는 것이다. 이를 성공적으로 해낼 수 있는 확실한 방법은 없지만 이러한 잠재적 위험의 희생양이 되지 않으려면 그런 위험을 인식하는 것이다.<\/li>\n<li>하락장에서 자신의 손실을 제한하는 방어적인 투자자들이나, 상승장에서 상당한 수익을 올리는 공격적인 투자자들이나 자신이 기술을 보유하고 있음을 증명하지는 못했고 이들이 실제로 부가가치를 가지고 있다는 판단은 자신의 투자 스타일에 맞지 않는 환경에서 이들이 어떤 성과를 내는지 봐야 한다.<\/li>\n<li>공격적인 투자자가 시장이 하향세로 돌아설 때 이미 낸 수익을 도로 잃지 않을 수 있는가? 방어적인 투자자는 시장이 상승세일 때 적극적으로 참여할 것인가? 이런 종류의 비대칭이 진짜 기술을 나타낸다.<\/li>\n<li>투자자가 하락 종목보다 상승 종목을 더 많이 보유하고 있는가? 상승 종목에 대한 수익이 하락 종목에 대한 손실보다 큰가? 경기가 좋을 때 올린 수익이 경기가 나쁠 때 입은 손해보다 큰가? 투자자의 장기 성과가 투자 스타일만으로 올린 성과보다 나은가? 이러한 것들이 탁월한 투자자임을 입증하는 요소이다.<\/li>\n<li>남다른 통찰력을 가진 투자자들만이 미래의 사건들을 좌우하는 확률분포를 주기적으로 예측할 수 있으며, 잠재 수익이 확률분포도의 좌측 꼬리에 숨어 있는 리스크를 보상하는 때가 언제인지 감지할 수 있다.<\/li>\n<li>성공적인 투자에 필요한 조건을 간략하게 설명한 이 문장(수익 가능성의 범위와 뜻밖의 상황이 전개될 리스크를 이해한다는 가정 아래)은 주목해야 마땅한 요소들을 정확히 보여준다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 마지막 장은 개별 원칙을 다시 한 몸으로 묶는다.<\/li>\n<li>[추론] 막스 철학의 핵심 흐름은 <code>2차적 사고 → 가치 → 가격 → 리스크 → 주기/심리 → 역투자 → 불가지론 → 방어 → 비대칭 성과<\/code>다.<\/li>\n<li>[현대 적용] 실무에서는 종목 보고서보다 체크리스트 기반 투자 메모가 더 중요해진다. 좋은 결정은 많은 원칙을 동시에 위반하지 않는 결정이다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 투자에서 내가 위반하고 있는 막스 원칙은 무엇인가?<\/li>\n<li>가치 판단, 가격 판단, 리스크 판단, 심리 판단이 서로 일관적인가?<\/li>\n<li>지금 내 태도는 지나치게 공격적인가, 지나치게 방어적인가?<\/li>\n<li>이 포지션은 내가 모르는 것에 과도하게 의존하는가?<\/li>\n<li>하락장에서 살아남고 상승장에서 충분히 참여하는 구조인가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 이 장은 그레이엄·린치·보글·하우절·코스톨라니를 모두 연결하는 종합 장이다. 다섯 권의 핵심은 결국 가격, 심리, 안전마진, 생존, 군중으로 수렴한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 막스 철학을 단일한 가치주 교리로 축소하면 안 된다.<\/li>\n<li>[추론] 주기 관찰을 기계적 시장 타이밍으로, 방어를 영구적 소극성으로, 역투자를 무조건 반대로 하는 것으로 왜곡하면 전체 체계가 무너진다.<\/li>\n<\/ul>\n<hr />","text":"기존 노트 성공적인 투자, 또는 성공적인 투자 경력을 위한 최고의 기반은 가치다. 즉 당신이 매입을 고려하는 자산이 가치가 있는지 잘 알아야 한다. 가치를 구성하는 요소에는 많은 것들이 있으며, 이를 검토하는 방법도 많이 있다. 아주 간단히 말하자면, 기업의 현금 보유량, 보유하고 있는 유형자산의 가치, 기업이나 자산의 현금 창출 능력, 그리고 이런 것들이 증가할 가능성이다. 우수한 투자 실적을 달성하려면 자산가치에 대한 통찰력이 탁월해야 한다. 따라서 다른 이들은 모르는 것을 알아야 하고, 투자 대상을 다른 시각으로 보거나, 투자 대상을 분석하는 능력이 남보다 뛰어나야 한다. 세 가지 다 가능하다면 이상적이다. 가치에 대한 견해는 확고한 사실적, 분석적 기반을 바탕으로 해야 하며 흔들림 없이 견지되어야 한다. 그래야만 언제 매매해야 하는지에 대한 확신이 생긴다. 가치에 대한 확실한 이해만이 모두가 끝없이 오르기만 할 것이라고 생각하는 고평가된 자산으로 차익 실현을 할 수 있는 자제심과, 매일 시세가 하락하는 위기에서도 자산을 보유한 채 '물타기'를 할 수 있는 배짱을 갖게 될 것이다. 가격과 가치 사이의 관계는 투자 성공에서 가장 중요한 핵심이다. 가치보다 낮은 가격으로 매입하는 것이 수익을 창출하는 가장 신뢰할 만한 방법이다. 드물기는 하지만 가치보다 높은 가격으로 매입해서 수익을 올리는 경우도 많다. 자산을 가치 이하로 매각하게 하는 원인은 절호의 매입 기회는 주로 인식이 현실을 과소평가하기 때문에 존재한다. 좋은 자산은 누가 봐도 쉽게 알 수 있지만, 저가의 자산을 찾는 일에는 예리한 통찰력이 필요하다. 투자자들은 종종 객관적인 우수성을 투자 기회로 오인한다. 최고의 투자자는 자신의 목표가 저가 매입 기회를 찾는 것이지, 좋은 자산을 찾는 것이 아님을 절대로 잊지 않는다. 가격이 가치 이하일 때 매입하는 것은 수익 가능성 창출뿐만 아니라, 리스크를 제한하는 데 중요한 요소이기도 하다. 고성장에 대한 비용을 따로 지불하지 않고, 한창 상승 추세를 타느라 과열된 시장에 참여하지 않는 것도 리스크를 제한할 수 있는 방법이다. 가격과 가치 사이의 관계는 심리와 기술적 요소, 즉 단기적으로 펀더멘털을 좌우하는 힘에 영향을 받는다. 이 두 가지 요소로 인해 가격 변동이 극심해지는 경우 고수익을 올릴 수도, 커다란 손실을 볼 수도 있다. 이때 가치의 개념을 고수하고 심리와 기술적 요인을 극복해야 한다. 경제와 시장은 등락을 반복하여 순환한다. 대부분 사람들은 지금의 상태가 계속될 것이라고 믿는다. 이러한 생각은 시세에 악영향을 미쳐 극단적인 평가가 나오게 한다. 그리고 대부분의 투자자들이 피하기 힘든 거품과 패닉 상태를 야기하기 때문에 커다란 위험의 원인이 된다. 투자를 하는 군중심리는 시계추처럼 규칙적인 패턴으로 움직인다. 낙관하다 비관하고, 곧잘 믿다가 이내 의심하고, 기회를 놓칠 것을 두려워하다 돈을 잃을 것을 두려워하고, 따라서 매입을 열망하던 상황에서 매각이 다급한 상황으로 바뀐다. 군중의 일부가 되는 것은 결국 실패의 공식에 스스로를 대입하는 것밖에 안 된다. 반면, 극단적인 상황에서 2차적 사고를 하면 손실을 피하는 데 도움이 되고, 결국 성공에 이르게 된다. 투자자들의 위험 회피 수준이 때에 따라 부족하기도, 과하기도 하다. 그 점에 있어서 투자자 심리의 변동은 시세 거품과 폭락을 야기하는 데 커다란 역할을 한다. 심리적인 영향력이 결코 과소평가되어서는 안 된다. 탐욕, 공포, 불신의 유예, 순응, 시기심, 자아, 굴복은 모두 인간의 본성의 일부이며, 특히 극단적인 상황에서나 군중 사이에 이런 심리가 작용하면 이들은 그에 따라 행동할 수밖에 없다. 다른 사람들에게도 심리적인 영향을 미칠 것이고, 신중한 투자자도 느끼게 될 것이다. 우리 누구도 이런 투자자 심리로부터 면역성이 있거나 단절될 수 있기를 기대해서는 안 된다. 그리고 이런 심리를 느끼게 되더라도 굴복해서는 안 된다. 그보다는 그것이 어떤 심리인지 있는 그대로를 인식하고, 그 심리에 저항해야 한다. 이성으로 감정을 극복해야 한다. 대부분의 추세는 강세든 약세든, 결국 도를 지나치게 되어 이를 빨리 눈치챈 사람들에게는 이익을 주지만, 마지막에 동참하는 사람들에게는 불이익을 준다. \"현자가 시작한 일을 바보가 마지막에 뛰어들어 마무리한다.\" 과열된 상황에 저항할 수 있는 흔치 않은 능력은 성공한 대부분의 투자자들이 가지고 있는 중요한 특징이다. 과열된 시장 상황이 언제 식을지, 반대로 하락세가 언제 오를지를 아는 것은 불가능하다. 하지만 우리가 어디를 향해 가고 있는지는 모르더라도, 우리가 현재 어디에 있는지는 알아야 한다. 주변 사람들의 행동을 통해 시장이 현재 주기의 어디쯤 와 있는지를 추측할 수 있다. 다른 투자자들이 태평할 때 우리는 주의를 기울여야 하고, 그들이 패닉 상태에 있을 때 우리는 공격적으로 변해야 한다. 2차적 투자라고 해서 항상 수익을 창출하는 것은 아니다. 매매에 있어 절호의 기회는 극단적인 평가와 관련 있는데, 말 그대로 극단적인 상황은 자주 발생하지 않는다. 우리들 중에 몇 년에 한 번씩만 기꺼이 투자할 수 있는 사람은 얼마 안 되므로, 우리는 주기상 적절한 시기에 매매해야 한다. 따라서 언제 상황이 우리에게 불리한지를 깨닫고, 그럴 때는 좀 더 신중해져야 한다. 확실한 가치, 가치에 비해 낮은 가격, 비관적인 군중심리를 기반으로 매입하면 최고의 결과를 얻을 것이다. 그렇지만 상황이 우리에게 유리하게 되기까지 오랫동안 불리할 수도 있다. 가격이 너무 싸다는 것이 '곧' 오른다는 의미는 아니기 때문이다. \"시대를 너무 앞서 나가면 오히려 일을 그르칠 수 있다\" 자신의 판단이 옳았음이 입증될 때까지 충분히 오랫동안 포지션을 유지하려면 인내심과 배짱이 필요하다. 가치를 수량화하여 가격이 적당할 때 이를 추구하는 것 외에도, 성공적인 투자자들은 리스크라는 대상에 대해 믿을 만한 전략을 가지고 있어야 한다. 가장 문제가 큰 리스크는 영구 손실이라는 것을 이해해야 한다. 더 많은 리스크를 감수하는 것을 거부하고, 리스크가 클수록 가능한 결과의 범위도 넓어지고 손실 가능성도 커진다는 것을 알아야 한다. 각각의 투자 대상에 존재하는 손실 가능성에 대해 이해하고, 손실에 대한 보상이 충분하고도 남을 때만 리스크를 감수해야 한다. 대부분의 투자자들은 수익의 기회를 지나치게 단순하게 생각하고 그 기회를 잡기 위해 급급해 한다. 어떤 투자자들은 좀 더 심오한 통찰력을 갖고서 리스크를 이해하는 것이 수익을 이해하는 것만큼 중요하다는 사실을 깨닫는다. 그러나 포트폴리오의 전반적인 위험도를 제어하는 핵심 요소, 즉 상관관계를 제대로 평가하는 데 필요한 상식과 노력을 기울이는 투자자는 드물다. 포트폴리오마다 상관관계에 차이가 있기 때문에, 절대적 위험도가 같은 개별 종목들이 다른 방식으로 결합되어 포트폴리오를 구성하면 전체 위험도는 매우 다양해질 수 있다. 분산투자가 효과적이려면, 포트폴리오 종목들의 특정 사건에 서로 다르게 반응할 수 있어야 한다는 것을 이해하는 사람은 많지 않다. \"우리가 하락 종목만 피한다면 상승 종목은 알아서 잘할 것\" 심각한 손실을 낼 가능성이 없는 종목만으로 분산투자하는 포트폴리오는 투자 성공을 위해 더없이 좋은 출발점이다. 리스크 제어는 방어 투자의 핵심으로, 방어적인 투자자들은 옳은 일을 하려고 노력하는 것보다 잘못된 일을 하지 않는 것에 큰 비중을 둔다. 어려운 환경에서 살아남는 능력을 확실히 하는 것과, 강세장에서 수익을 극대화하는 것은, 기본적으로 양립할 수 없는 문제이므로 투자자들은 그 두 가지를 놓고 어떤 식으로 균형을 이룰 것인지 결정해야 한다. 안전마진은 방어 투자에서 매우 중요한 요소이다. 미래가 바라는 대로만 된다면야 대부분의 투자가 성공적일 것이지만, 미래가 뜻대로 되지 않을 때라도 성과가 웬만하려면 안전마진이 필요하다. 투자자는 이론보다는 현실에서 지속적인 유형의 가치를 고집함으로써 안전마진을 획득할 수 있다. 즉 가격이 가치 이하일 때만 매입하거나, 레버리지를 피하거나, 분산투자하는 것이다. \"평균 수심 150cm의 시냇물을 건너다가 물에 빠져 죽었다는 키가 180cm인 남자를 절대로 잊지 마라\" 안전마진은 당신에게 버틸 수 있는 힘을 주고, 저점의 상황들을 헤쳐 나갈 수 있게 해준다. 리스크 제어와 안전마진은 포트폴리오에 항상 존재하고 있어야 한다. 이 두 가지가 '보이지 않는 자산'임을 꼭 기억하기 바란다. 투자시장은 대부분의 시기에 상황이 좋은 편이지만, 방어의 가치가 명백해지는 시기는 불황일 때뿐이다. 따라서 상황이 좋을 때 방어적인 투자자는 자신의 수익이 비록 최대치보다 낮더라도, 리스크 보호책이 가동 중인 상태에서 달성되었다는 것에 만족해야 한다. 투자 성공에 꼭 필요한 요소 중에 하나는, 거시적 미래라는 관점에서 앞으로 무슨 일이 일어날지 우리가 알 수 없다는 사실을 깨닫는 것이다. 경제, 금리, 시가총액에 앞으로 무슨 일이 발생할지에 대해 시장 예측보다 많이 아는 사람은 있다고 해도 드물다. 투자자는 산업, 기업, 증권 등 '알 수 있는 것들'을 앎으로써 경쟁에서 우위를 점할 수 있도록 노력해야 한다. 초점을 좁힐수록 다른 사람들은 모르는 것을 알 수 있는 가능성은 커진다. 많은 투자자들이 스스로를 과대평가하여 경제와 시장이 어떤 미래를 향해 가고 있는지 안다고 추정하고 그에 따라 행동한다. 그러나 자신의 예측을 기반으로 공격적인 행동을 하는 이들이 바라는 만큼의 수익을 얻는 경우는 드물고 틀린 예측을 소신으로 삼는 투자는 심각한 손실을 입히는 원인이 된다. 경제 예측과 투자관리 두 가지 측면에서 대개 정확한 예측을 하는 사람이 있다고는 해도, 동일 인물이 두 번 그렇게 하는 일은 드물다는 점에 주목할 필요가 있다. 가장 성공적인 투자자들은 '대체로 정확한' 예측을 하는데, 이 경우가 나머지보다 훨씬 낫다. 성공적인 투자에 중요한 한 가지는 경기 변동, 기업들이 겪는 진통, 시세의 급격한 등락, 다른 투자자들이 쉽게 잘 믿는 것 들에서 흔히 생기는 함정을 피하는 것이다. 이를 성공적으로 해낼 수 있는 확실한 방법은 없지만 이러한 잠재적 위험의 희생양이 되지 않으려면 그런 위험을 인식하는 것이다. 하락장에서 자신의 손실을 제한하는 방어적인 투자자들이나, 상승장에서 상당한 수익을 올리는 공격적인 투자자들이나 자신이 기술을 보유하고 있음을 증명하지는 못했고 이들이 실제로 부가가치를 가지고 있다는 판단은 자신의 투자 스타일에 맞지 않는 환경에서 이들이 어떤 성과를 내는지 봐야 한다. 공격적인 투자자가 시장이 하향세로 돌아설 때 이미 낸 수익을 도로 잃지 않을 수 있는가? 방어적인 투자자는 시장이 상승세일 때 적극적으로 참여할 것인가? 이런 종류의 비대칭이 진짜 기술을 나타낸다. 투자자가 하락 종목보다 상승 종목을 더 많이 보유하고 있는가? 상승 종목에 대한 수익이 하락 종목에 대한 손실보다 큰가? 경기가 좋을 때 올린 수익이 경기가 나쁠 때 입은 손해보다 큰가? 투자자의 장기 성과가 투자 스타일만으로 올린 성과보다 나은가? 이러한 것들이 탁월한 투자자임을 입증하는 요소이다. 남다른 통찰력을 가진 투자자들만이 미래의 사건들을 좌우하는 확률분포를 주기적으로 예측할 수 있으며, 잠재 수익이 확률분포도의 좌측 꼬리에 숨어 있는 리스크를 보상하는 때가 언제인지 감지할 수 있다. 성공적인 투자에 필요한 조건을 간략하게 설명한 이 문장(수익 가능성의 범위와 뜻밖의 상황이 전개될 리스크를 이해한다는 가정 아래)은 주목해야 마땅한 요소들을 정확히 보여준다. [구조화] [막스 본문] 마지막 장은 개별 원칙을 다시 한 몸으로 묶는다. [추론] 막스 철학의 핵심 흐름은 2차적 사고 → 가치 → 가격 → 리스크 → 주기/심리 → 역투자 → 불가지론 → 방어 → 비대칭 성과 다. [현대 적용] 실무에서는 종목 보고서보다 체크리스트 기반 투자 메모가 더 중요해진다. 좋은 결정은 많은 원칙을 동시에 위반하지 않는 결정이다. [실전 질문] 이 투자에서 내가 위반하고 있는 막스 원칙은 무엇인가? 가치 판단, 가격 판단, 리스크 판단, 심리 판단이 서로 일관적인가? 지금 내 태도는 지나치게 공격적인가, 지나치게 방어적인가? 이 포지션은 내가 모르는 것에 과도하게 의존하는가? 하락장에서 살아남고 상승장에서 충분히 참여하는 구조인가? [다른 책과의 연결] [후대 해석] 이 장은 그레이엄·린치·보글·하우절·코스톨라니를 모두 연결하는 종합 장이다. 다섯 권의 핵심은 결국 가격, 심리, 안전마진, 생존, 군중으로 수렴한다. [오해 방지] [추론] 막스 철학을 단일한 가치주 교리로 축소하면 안 된다. [추론] 주기 관찰을 기계적 시장 타이밍으로, 방어를 영구적 소극성으로, 역투자를 무조건 반대로 하는 것으로 왜곡하면 전체 체계가 무너진다."},{"i":22,"title":"관련 노트","html":"<ul>\n<li>[[독서_현명한_투자자|현명한 투자자]]<\/li>\n<li>[[독서_돈의_심리학|돈의 심리학]]<\/li>\n<li>[[독서_돈_뜨겁게_사랑하고_차갑게_다루어라|돈, 뜨겁게 사랑하고 차갑게 다루어라]]<\/li>\n<li>[[독서_모든_주식을_소유하라|모든 주식을 소유하라]]<\/li>\n<li>[[독서_전설로_떠나는_월가의_영웅|전설로 떠나는 월가의 영웅]]<\/li>\n<li>[[독서_How_to_Trade_in_Stocks|How to Trade in Stocks]]<\/li>\n<li>[[독서_레버리지|레버리지]]<\/li>\n<li>[[독서_개장전_아직_켜지지_않은_모니터_앞에서|개장 전, 아직 켜지지 않은 모니터 앞에서]]<\/li>\n<\/ul>","text":"[[독서_현명한_투자자|현명한 투자자]] [[독서_돈의_심리학|돈의 심리학]] [[독서_돈_뜨겁게_사랑하고_차갑게_다루어라|돈, 뜨겁게 사랑하고 차갑게 다루어라]] [[독서_모든_주식을_소유하라|모든 주식을 소유하라]] [[독서_전설로_떠나는_월가의_영웅|전설로 떠나는 월가의 영웅]] [[독서_How_to_Trade_in_Stocks|How to Trade in Stocks]] [[독서_레버리지|레버리지]] [[독서_개장전_아직_켜지지_않은_모니터_앞에서|개장 전, 아직 켜지지 않은 모니터 앞에서]]"},{"i":23,"title":"막스 핵심 개념 지도","html":"<p>[막스 본문] 아래 지도는 각 장의 핵심을 의사결정 흐름으로 재배치한 것이다. [막스 메모/인터뷰] 보강에는 거시 불가지론, 시장온도, 리스크 통제, 신규 자본·좁은 스프레드·완화된 안전장치 같은 후속 메모의 반복 논점을 반영했다.<\/p>\n<p>2차적 사고 [01]\n├─ 시장 효율성 존중 [02]\n│  └─ 비효율이 남는 조건 탐색 [02][10][18]\n├─ 내재가치 평가 [03]\n│  └─ 가격과 가치의 괴리 판단 [04]\n│     └─ 저가 매수 후보 선별 [12]\n├─ 리스크 정의 [05]\n│  ├─ 리스크 인식 [06]\n│  ├─ 리스크 제어 [07]\n│  └─ 방어투자·안전마진 [17][20]\n├─ 주기 이해 [08]\n│  └─ 시계추와 심리 [09]\n│     └─ 시장온도 측정 [15]\n├─ 부정적 영향 저항 [10]\n│  └─ 역투자 실행 [11]\n│     └─ 인내와 기회 대기 [13]\n├─ 나는 모른다 유파 [14]\n│  └─ 운·확률분포·대체 역사 [16]\n└─ 비대칭 성과 창출 [19]\n   └─ 모든 원칙의 통합 [20]<\/p>","text":"[막스 본문] 아래 지도는 각 장의 핵심을 의사결정 흐름으로 재배치한 것이다. [막스 메모/인터뷰] 보강에는 거시 불가지론, 시장온도, 리스크 통제, 신규 자본·좁은 스프레드·완화된 안전장치 같은 후속 메모의 반복 논점을 반영했다. 2차적 사고 [01] ├─ 시장 효율성 존중 [02] │ └─ 비효율이 남는 조건 탐색 [02][10][18] ├─ 내재가치 평가 [03] │ └─ 가격과 가치의 괴리 판단 [04] │ └─ 저가 매수 후보 선별 [12] ├─ 리스크 정의 [05] │ ├─ 리스크 인식 [06] │ ├─ 리스크 제어 [07] │ └─ 방어투자·안전마진 [17][20] ├─ 주기 이해 [08] │ └─ 시계추와 심리 [09] │ └─ 시장온도 측정 [15] ├─ 부정적 영향 저항 [10] │ └─ 역투자 실행 [11] │ └─ 인내와 기회 대기 [13] ├─ 나는 모른다 유파 [14] │ └─ 운·확률분포·대체 역사 [16] └─ 비대칭 성과 창출 [19] └─ 모든 원칙의 통합 [20]"},{"i":24,"title":"2차적 사고 질문표","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>질문<\/th>\n<th>의미<\/th>\n<th>관련 장<\/th>\n<th>실제 적용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>시장은 무엇을 이미 가격에 반영하고 있는가?<\/td>\n<td>컨센서스와 가격 합의를 먼저 본다<\/td>\n<td>01, 04<\/td>\n<td>밸류에이션·뉴스·포지셔닝을 함께 본다<\/td>\n<\/tr>\n<tr>\n<td>내 생각은 시장의 생각과 어떻게 다른가?<\/td>\n<td>우위의 위치를 명확히 한다<\/td>\n<td>01, 02<\/td>\n<td>투자 메모 첫 줄에 차별점 한 문장 작성<\/td>\n<\/tr>\n<tr>\n<td>내가 맞을 확률은 얼마인가?<\/td>\n<td>단일 시나리오 과신을 줄인다<\/td>\n<td>01, 14, 16<\/td>\n<td>대안 시나리오와 확률 범위를 적는다<\/td>\n<\/tr>\n<tr>\n<td>내가 틀리면 손실은 얼마인가?<\/td>\n<td>좌측 꼬리를 먼저 본다<\/td>\n<td>05, 07, 17<\/td>\n<td>손절이 아니라 구조 손상 한도를 계산<\/td>\n<\/tr>\n<tr>\n<td>가격은 가치보다 충분히 낮은가?<\/td>\n<td>수익 원천이 가격-가치 수렴인지 확인<\/td>\n<td>03, 04, 12<\/td>\n<td>밸류에이션 앵커와 할인폭 명시<\/td>\n<\/tr>\n<tr>\n<td>이 투자의 리스크는 눈에 보이는가, 숨어 있는가?<\/td>\n<td>변동성 밖의 리스크를 점검<\/td>\n<td>05, 06, 18<\/td>\n<td>유동성·레버리지·상관관계 별도 점검<\/td>\n<\/tr>\n<tr>\n<td>모두가 동의하는 아이디어라면 왜 아직도 싼가?<\/td>\n<td>값싼 이유가 진짜 오판인지 확인<\/td>\n<td>02, 12<\/td>\n<td>소외 이유·편견·강제매도 여부 확인<\/td>\n<\/tr>\n<tr>\n<td>내가 이 자산을 파는 사람보다 더 많이 아는가?<\/td>\n<td>정보우위 환상을 경계<\/td>\n<td>02<\/td>\n<td>상대방의 매도 동기 분해<\/td>\n<\/tr>\n<tr>\n<td>이 기회가 정말 좋은데 왜 남들이 이미 가져가지 않았는가?<\/td>\n<td>비효율의 원인을 찾는다<\/td>\n<td>02, 12<\/td>\n<td>구조적 제약·복잡성·비인기 여부 확인<\/td>\n<\/tr>\n<tr>\n<td>지금 필요한 것은 공격인가, 방어인가?<\/td>\n<td>현재 위치에 따라 태도 조절<\/td>\n<td>15, 17<\/td>\n<td>시장온도 체크 후 허들 조정<\/td>\n<\/tr>\n<tr>\n<td>시장의 심리가 지나치게 낙관적이거나 비관적인가?<\/td>\n<td>가격 형성의 심리 엔진 파악<\/td>\n<td>01, 09, 10<\/td>\n<td>심리 로그 작성<\/td>\n<\/tr>\n<tr>\n<td>가격을 움직이는 기술적 요인은 무엇인가?<\/td>\n<td>펀더멘털 외 수급 요인 확인<\/td>\n<td>04, 13<\/td>\n<td>ETF 유입, 환매, 마진콜, 강제청산 점검<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"질문 의미 관련 장 실제 적용 시장은 무엇을 이미 가격에 반영하고 있는가? 컨센서스와 가격 합의를 먼저 본다 01, 04 밸류에이션·뉴스·포지셔닝을 함께 본다 내 생각은 시장의 생각과 어떻게 다른가? 우위의 위치를 명확히 한다 01, 02 투자 메모 첫 줄에 차별점 한 문장 작성 내가 맞을 확률은 얼마인가? 단일 시나리오 과신을 줄인다 01, 14, 16 대안 시나리오와 확률 범위를 적는다 내가 틀리면 손실은 얼마인가? 좌측 꼬리를 먼저 본다 05, 07, 17 손절이 아니라 구조 손상 한도를 계산 가격은 가치보다 충분히 낮은가? 수익 원천이 가격-가치 수렴인지 확인 03, 04, 12 밸류에이션 앵커와 할인폭 명시 이 투자의 리스크는 눈에 보이는가, 숨어 있는가? 변동성 밖의 리스크를 점검 05, 06, 18 유동성·레버리지·상관관계 별도 점검 모두가 동의하는 아이디어라면 왜 아직도 싼가? 값싼 이유가 진짜 오판인지 확인 02, 12 소외 이유·편견·강제매도 여부 확인 내가 이 자산을 파는 사람보다 더 많이 아는가? 정보우위 환상을 경계 02 상대방의 매도 동기 분해 이 기회가 정말 좋은데 왜 남들이 이미 가져가지 않았는가? 비효율의 원인을 찾는다 02, 12 구조적 제약·복잡성·비인기 여부 확인 지금 필요한 것은 공격인가, 방어인가? 현재 위치에 따라 태도 조절 15, 17 시장온도 체크 후 허들 조정 시장의 심리가 지나치게 낙관적이거나 비관적인가? 가격 형성의 심리 엔진 파악 01, 09, 10 심리 로그 작성 가격을 움직이는 기술적 요인은 무엇인가? 펀더멘털 외 수급 요인 확인 04, 13 ETF 유입, 환매, 마진콜, 강제청산 점검"},{"i":25,"title":"리스크 체계화 표","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>리스크 유형<\/th>\n<th>막스의 정의<\/th>\n<th>관찰 신호<\/th>\n<th>통제 방법<\/th>\n<th>관련 장<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>영구 손실<\/td>\n<td>자본이 회복 불가능하게 훼손될 위험<\/td>\n<td>부도, 희석, 구조 붕괴<\/td>\n<td>안전마진, 저레버리지, 포지션 제한<\/td>\n<td>05, 17, 20<\/td>\n<\/tr>\n<tr>\n<td>변동성<\/td>\n<td>가격 요동 자체<\/td>\n<td>큰 일일 변동, 감정 압박<\/td>\n<td>유동성 확보, 심리 점검<\/td>\n<td>05, 18<\/td>\n<\/tr>\n<tr>\n<td>목표 미달<\/td>\n<td>필요한 수익을 내지 못할 위험<\/td>\n<td>기대수익 저하, 과도한 보수성<\/td>\n<td>자산배분 재점검, 목표 현실화<\/td>\n<td>05, 17<\/td>\n<\/tr>\n<tr>\n<td>유동성<\/td>\n<td>원할 때 팔 수 없는 위험<\/td>\n<td>거래 부진, 환매 압력<\/td>\n<td>현금 버퍼, 만기 분산<\/td>\n<td>05, 13, 18<\/td>\n<\/tr>\n<tr>\n<td>레버리지<\/td>\n<td>결과 확대 장치가 파산 증폭기로 변하는 위험<\/td>\n<td>마진콜, 담보가치 하락<\/td>\n<td>무·저레버리지, 커버리지 점검<\/td>\n<td>05, 07, 18<\/td>\n<\/tr>\n<tr>\n<td>상관관계<\/td>\n<td>위기 시 함께 무너질 위험<\/td>\n<td>평시 분산처럼 보여도 동반 하락<\/td>\n<td>숨은 공통노출 점검<\/td>\n<td>18, 20<\/td>\n<\/tr>\n<tr>\n<td>과잉 낙관<\/td>\n<td>리스크가 낮다고 믿는 착시<\/td>\n<td>낮은 공포, 높은 확신<\/td>\n<td>허들 상향, 방어 강화<\/td>\n<td>06, 09, 15<\/td>\n<\/t 수하지 않는 것도 하나의 선택임을 인정했는가?<\/td>\n<td>무행동 선택 가능<\/td>\n<td>강박 매수 금지<\/td>\n<td>13, 17<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"질문 통과 기준 실패 시 행동 관련 장 이 투자는 불리한 시나리오에서도 살아남는가? 생존 가능 포지션 축소/배제 17, 20 손실 가능성이 수익 가능성보다 과소평가되어 있지 않은가? 대칭 왜곡 없음 허들 상향 05, 17 가격이 가치보다 충분히 낮은가? 할인폭 확보 대기 03, 04, 17 안전마진이 있는가? 평가 오차 흡수 가능 진입 보류 17, 20 레버리지가 있는가? 없어도 성립 차입 축소 07, 17, 18 유동성 위기에서 팔아야 하는 구조인가? 강제매도 가능성 낮음 현금/만기 구조 조정 05, 13 내가 알 수 없는 것에 과도하게 의존하고 있지 않은가? 미지 변수 통제 가능 확신 하향 14, 17 다른 투자자들이 리스크를 무시하고 있지는 않은가? 시장 경계 존재 방어 강화 06, 15 이 자산의 인기가 가격을 올린 것은 아닌가? 인기보다 가치 우위 가격 재평가 04, 06 나는 시장 주기의 어디쯤 있다고 판단하는가? 온도 측정 완료 공격/방어 조정 08, 15 수익 원천이 명확한가? 가치 수렴이 핵심 스토리 의존 배제 04, 12 추가 하락 시 버틸 자본이 있는가? 현금·인내 확보 규모 축소 11, 13 최악의 경우 손실 한도를 알고 있는가? 최대손실 추정 재검토 05, 07 이 포지션은 포트폴리오 상관관계를 악화시키는가? 숨은 공통노출 낮음 다른 종목과 묶어 재설계 18, 20 투자 근거가 가격 상승 자체에 기대고 있지 않은가? 펀더멘털 앵커 존재 매수 금지 04, 10 강제매도 주체가 존재하는가? 구조적 기회 확인 후보 유지 04, 13 이 자산이 싼 이유를 설명할 수 있는가? 이유가 명확 함정 가능성 재검토 12 그 싼 이유가 구조적 파산 신호는 아닌가? 회복 가능성 있음 배제 12, 18 대안 시나리오를 적어보았는가? 3개 이상 작성 후 재심사 14, 16 가장 중요한 가정이 무엇인지 아는가? 핵심 가정 1~3개 명시 메모 보완 03, 14 내가 틀렸을 때 무엇이 먼저 보일지 아는가? 조기 경보 신호 설정 모니터링 항목 추가 05, 07 이 아이디어가 컨센서스와 어떻게 다른가? 차별점 명확 진입 보류 01, 02 내가 가진 우위는 반복 가능한가? 정보/분석 우위 검증 베팅 규모 축소 01, 02 시장이 지금 리스크를 과소평가하는가? 온도 과열 없음 또는 할인 큼 방어 강화 06, 15 이 투자에 FOMO가 개입했는가? 감정 개입 낮음 쿨다운 기간 부여 10 최근 성과가 내 확신을 과도하게 키웠는가? 과정 중심 유지 검증 강화 16 이 포지션 규모는 내 확신보다 큰가? 규모와 확신 일치 규모 축소 07, 17 현금흐름·대차대조표가 버팀목이 되는가? 자금조달 내구성 확보 배제 또는 할인 요구 확대 03, 17 보유 기간을 충분히 길게 가정했는가? 정상화까지 버틸 수 있음 자본 구조 재조정 03, 13 반대 의견을 문서화했는가? 반대 논거 존재 투자위원회 재검토 10, 18 장기적으로 이 결정이 살아남는 종류의 판단인가? 과정상 합리적 보류/폐기 16, 17 매수하지 않는 것도 하나의 선택임을 인정했는가? 무행동 선택 가능 강박 매수 금지 13, 17"},{"i":31,"title":"막스와 다른 5권 연결표","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>막스 개념<\/th>\n<th>그레이엄<\/th>\n<th>린치<\/th>\n<th>보글<\/th>\n<th>하우절<\/th>\n<th>코스톨라니<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2차적 사고<\/td>\n<td>독립 판단<\/td>\n<td>남들이 안 보는 것<\/td>\n<td>평균을 이길 근거 질문<\/td>\n<td>사고의 깊이보다 행동 규율<\/td>\n<td>대중과 분리된 판단<\/td>\n<\/tr>\n \/li>\n<li>최근 성과로 인한 과신을 차단한다.<\/li>\n<li>포트폴리오 집중도를 낮춘다.<\/li>\n<li>“지금 필요한 것은 공격인가, 방어인가?”를 다시 묻는다.<\/li>\n<\/ul>\n<h3>시장 공포 시 해야 할 일 10개<\/h3>\n<ul>\n<li>강제매도와 구조적 매도자를 찾는다.<\/li>\n<li>가치 앵커를 다시 확인한다.<\/li>\n<li>장기 자본과 현금 버퍼를 활용한다.<\/li>\n<li>단기 뉴스와 장기 가치 판단을 분리한다.<\/li>\n<li>패닉 매도의 영구 손실화를 경계한다.<\/li>\n<li>후보군 우선순위를 미리 정한 순서대로 집행한다.<\/li>\n<li>추가 하락 가능성을 인정한 채 규모를 조절한다.<\/li>\n<li>레버리지 없는 강점을 활용한다.<\/li>\n<li>군중이 틀릴 수 있는 지점을 찾는다.<\/li>\n<li>두려움이 가장 클수록 체크리스트를 더 엄격히 적용한다.<\/li>\n<\/ul>","text":"막스의 한 문장 핵심 좋은 투자는 미래를 안다고 가정하는 것이 아니라, 가치·가격·리스크·심리·주기를 함께 보며 큰 실수를 피하는 구조를 만드는 일이다. 투자자가 기억할 10문장 가격보다 좋은 이야기는 없다. 좋은 자산이 아니라 좋은 매입이 중요하다. 시장과 다르게 생각해야 하지만, 더 정확해야만 의미가 있다. 가치 없는 확신은 위험하다. 비싼 가격은 좋은 자산도 나쁜 투자로 만든다. 리스크는 대개 편안한 시기에 쌓인다. 주기는 예측 대상이 아니라 경계 대상이다. 역투자는 반대 행동이 아니라 독립 가치판단이다. 기다림은 전략이다. 시장을 이기는 것보다 먼저 살아남아야 한다. 리스크 관리자가 기억할 10문장 리스크는 변동성보다 영구 손실에 가깝다. 보이지 않는 리스크가 대개 더 위험하다. 리스크 인식 없는 리스크 제어는 불가능하다. 레버리지는 가치를 만들지 않고 결과만 확대한다. 상관관계는 위기 때 진짜 모습을 드러낸다. 얇은 리스크 프리미엄은 경고다. 안전마진은 보이지 않는 자산이다. 방어는 수익 포기가 아니라 복리 보호다. 결과가 좋다고 결정이 좋았던 것은 아니다. 큰 손실을 피하면 나머지는 시간이 돕는다. 시장 과열 시 해야 할 일 10개 할인율과 기대수익을 다시 계산한다. 신규 투자 허들을 올린다. 레버리지를 줄인다. 유동성 환상을 경계한다. 밸류에이션 프리미엄 정당화 서사를 의심한다. 군중이 무시하는 리스크를 적는다. 현금 보유의 불편함을 견딘다. 최근 성과로 인한 과신을 차단한다. 포트폴리오 집중도를 낮춘다. “지금 필요한 것은 공격인가, 방어인가?”를 다시 묻는다. 시장 공포 시 해야 할 일 10개 강제매도와 구조적 매도자를 찾는다. 가치 앵커를 다시 확인한다. 장기 자본과 현금 버퍼를 활용한다. 단기 뉴스와 장기 가치 판단을 분리한다. 패닉 매도의 영구 손실화를 경계한다. 후보군 우선순위를 미리 정한 순서대로 집행한다. 추가 하락 가능성을 인정한 채 규모를 조절한다. 레버리지 없는 강점을 활용한다. 군중이 틀릴 수 있는 지점을 찾는다. 두려움이 가장 클수록 체크리스트를 더 엄격히 적용한다."},{"i":33,"title":"검증 체크리스트","html":"<ul>\n<li>기존 불릿 보존 여부: 예<\/li>\n<li>2차적 사고 질문표 완성 여부: 예<\/li>\n<li>시장온도 점검표 완성 여부: 예<\/li>\n<li>리스크 체계화표 완성 여부: 예<\/li>\n<li>역투자 조건표 완성 여부: 예<\/li>\n<li>다른 5권과 연결표 완성 여부: 예<\/li>\n<li>막스의 주기 관찰을 시장 예측으로 왜곡하지 않았는지: 예, <code>현재 위치 파악<\/code>과 <code>공격/방어 강도 조절<\/code>로만 사용하고 기계적 타이밍 규칙으로 쓰지 않음.<\/li>\n<\/ul>","text":"기존 불릿 보존 여부: 예 2차적 사고 질문표 완성 여부: 예 시장온도 점검표 완성 여부: 예 리스크 체계화표 완성 여부: 예 역투자 조건표 완성 여부: 예 다른 5권과 연결표 완성 여부: 예 막스의 주기 관찰을 시장 예측으로 왜곡하지 않았는지: 예, 현재 위치 파악 과 공격/방어 강도 조절 로만 사용하고 기계적 타이밍 규칙으로 쓰지 않음."}]},{"id":"99","title":"[통합] 투자 고전 6권 통합 지식체계_Run7_최종","short":"통합 지식체계","author":"6권 통합","chapters":[{"i":0,"title":"문서 안내","html":"<hr />\n<p>title: \"[통합] 투자 고전 6권 통합 지식체계_Run7_최종\"\naliases:\n  - 투자 고전 6권 통합 지식체계\n  - 투자 고전 통합\n  - Run7 투자 통합 노트\ntype: synthesis-note\ncategory: 독서\ndate: 2026-06-10\nstatus: final\nsource_scope: \"검수 완료 Deep Research v2 최종본 6개만 사용\"\ntags:\n  - 독서\n  - 투자\n  - 통합지식체계\n  - 가치투자\n  - 인덱스투자\n  - 투자심리\n  - 리스크관리\n  - 시장주기\n  - 실행체계<\/p>\n<hr />\n<p>이 문서는 검수 완료된 투자 고전 6권 최종본만을 기준 자료로 삼아 작성한 통합 지식체계다. 목적은 책별 재요약이 아니라, 여섯 책의 원칙을 <strong>교차 비교·충돌 해부·실행 체계<\/strong>로 재구성하는 것이다.<\/p>\n<p>기준 자료:<\/p>\n<ul>\n<li>벤저민 그레이엄, 『현명한 투자자』 → 이하 (그레이엄 n장)<\/li>\n<li>모건 하우절, 『돈의 심리학』 → 이하 (하우절 n장)<\/li>\n<li>앙드레 코스톨라니, 『돈, 뜨겁게 사랑하고 차갑게 다루어라』 → 이하 (코스톨라니 n장)<\/li>\n<li>존 보글, 『모든 주식을 소유하라』 → 이하 (보글 n장)<\/li>\n<li>피터 린치, 『전설로 떠나는 월가의 영웅』 → 이하 (린치 n장)<\/li>\n<li>하워드 막스, 『투자에 대한 생각』 → 이하 (막스 n장)<\/li>\n<\/ul>","text":"title: \"[통합] 투자 고전 6권 통합 지식체계_Run7_최종\" aliases: - 투자 고전 6권 통합 지식체계 - 투자 고전 통합 - Run7 투자 통합 노트 type: synthesis-note category: 독서 date: 2026-06-10 status: final source_scope: \"검수 완료 Deep Research v2 최종본 6개만 사용\" tags: - 독서 - 투자 - 통합지식체계 - 가치투자 - 인덱스투자 - 투자심리 - 리스크관리 - 시장주기 - 실행체계 이 문서는 검수 완료된 투자 고전 6권 최종본만을 기준 자료로 삼아 작성한 통합 지식체계다. 목적은 책별 재요약이 아니라, 여섯 책의 원칙을 교차 비교·충돌 해부·실행 체계 로 재구성하는 것이다. 기준 자료: 벤저민 그레이엄, 『현명한 투자자』 → 이하 (그레이엄 n장) 모건 하우절, 『돈의 심리학』 → 이하 (하우절 n장) 앙드레 코스톨라니, 『돈, 뜨겁게 사랑하고 차갑게 다루어라』 → 이하 (코스톨라니 n장) 존 보글, 『모든 주식을 소유하라』 → 이하 (보글 n장) 피터 린치, 『전설로 떠나는 월가의 영웅』 → 이하 (린치 n장) 하워드 막스, 『투자에 대한 생각』 → 이하 (막스 n장)"},{"i":1,"title":"0. 문서 사용법과 가드레일","html":"<h3>0-1. 출처 표기 규칙<\/h3>\n<p>이 문서의 주 출처는 반드시 <strong>책과 장<\/strong>으로 표기한다.<\/p>\n<ul>\n<li><code>린치 부록: 매도 판단표<\/code>처럼 보강 노트 말미의 편집 섹션명을 주 출처로 쓰지 않는다.<\/li>\n<li>해당 내용은 가능한 한 <code>린치 7·14·17장<\/code>, <code>막스 08·09·15·17장<\/code>, <code>코스톨라니 7·8장<\/code>, <code>보글 13·18~20장<\/code>, <code>그레이엄 1·4·8·20장<\/code>처럼 책과 장으로 환원한다.<\/li>\n<li>보강 노트의 편집 표·체크리스트는 이 문서의 구조화에 도움을 준 보조 자료일 뿐, 저자의 원문 주장처럼 쓰지 않는다.<\/li>\n<\/ul>\n<h3>0-2. 확실성 표기<\/h3>\n<ul>\n<li>[명시] 해당 책의 해당 장에서 직접 확인되는 주장.<\/li>\n<li>[간접] 두 권 이상의 주장을 연결해 도출한 해석.<\/li>\n<li>[현대 적용] 책의 원칙을 오늘의 개인투자자 환경으로 번역한 적용.<\/li>\n<li>[추론] 이 문서에서 새로 구성한 운영 규칙. 저자의 직접 발언이 아니다.<\/li>\n<\/ul>\n<h3>0-3. 불확실 항목 처리<\/h3>\n<p>다음 항목은 통합 문서의 핵심 근거로 쓰지 않는다.<\/p>\n<ul>\n<li>그레이엄 16~18장의 세부 기업명·전환증권·사례는 원서 대조 성격이 남아 있으므로, 통합 원칙의 중심 근거로 삼지 않는다. 확실하게 쓰는 축은 투자/투기 구분, 방어적 투자, Mr. Market, 안전마진, 가격과 가치, 채권/주식 기본 배분이다. (그레이엄 1·4·8·20장)<\/li>\n<li>하우절의 일부 인물 사례와 세부 파산 경로는 불확실 태그가 남아 있으므로, 행동·생존·복리·충분함·다른 게임 같은 핵심 원칙 중심으로만 사용한다. (하우절 0·3~6·10~13·16·19장)<\/li>\n<li>코스톨라니의 원어 표현·생애 일화·채권 일화는 보조로만 다룬다. 핵심 근거는 달걀, 소신파/부화뇌동파, 돈+심리, 금리와 유동성, 기정사실화, 손바뀜 원리다. (코스톨라니 5·7·8장)<\/li>\n<li>보글은 “개별주 절대 금지”가 아니라 “대다수 투자자에게 저비용 전체시장 인덱스가 기본 해법”으로 표현한다. (보글 0·3~5·10~13·18~20장)<\/li>\n<li>린치의 아마추어 우위는 조건부다. “아는 회사면 사도 된다”가 아니라 “먼저 발견할 수 있지만 반드시 조사해야 한다”로 쓴다. (린치 서문·4·6·7·10~17장)<\/li>\n<li>막스의 주기 관찰은 시장 타이밍 공식이 아니다. “현재 위치 파악 → 공격/방어 강도 조절”로만 사용한다. (막스 08·09·14·15·17장)<\/li>\n<\/ul>\n<hr />","text":"0-1. 출처 표기 규칙 이 문서의 주 출처는 반드시 책과 장 으로 표기한다. 린치 부록: 매도 판단표 처럼 보강 노트 말미의 편집 섹션명을 주 출처로 쓰지 않는다. 해당 내용은 가능한 한 린치 7·14·17장 , 막스 08·09·15·17장 , 코스톨라니 7·8장 , 보글 13·18~20장 , 그레이엄 1·4·8·20장 처럼 책과 장으로 환원한다. 보강 노트의 편집 표·체크리스트는 이 문서의 구조화에 도움을 준 보조 자료일 뿐, 저자의 원문 주장처럼 쓰지 않는다. 0-2. 확실성 표기 [명시] 해당 책의 해당 장에서 직접 확인되는 주장. [간접] 두 권 이상의 주장을 연결해 도출한 해석. [현대 적용] 책의 원칙을 오늘의 개인투자자 환경으로 번역한 적용. [추론] 이 문서에서 새로 구성한 운영 규칙. 저자의 직접 발언이 아니다. 0-3. 불확실 항목 처리 다음 항목은 통합 문서의 핵심 근거로 쓰지 않는다. 그레이엄 16~18장의 세부 기업명·전환증권·사례는 원서 대조 성격이 남아 있으므로, 통합 원칙의 중심 근거로 삼지 않는다. 확실하게 쓰는 축은 투자/투기 구분, 방어적 투자, Mr. Market, 안전마진, 가격과 가치, 채권/주식 기본 배분이다. (그레이엄 1·4·8·20장) 하우절의 일부 인물 사례와 세부 파산 경로는 불확실 태그가 남아 있으므로, 행동·생존·복리·충분함·다른 게임 같은 핵심 원칙 중심으로만 사용한다. (하우절 0·3~6·10~13·16·19장) 코스톨라니의 원어 표현·생애 일화·채권 일화는 보조로만 다룬다. 핵심 근거는 달걀, 소신파/부화뇌동파, 돈+심리, 금리와 유동성, 기정사실화, 손바뀜 원리다. (코스톨라니 5·7·8장) 보글은 “개별주 절대 금지”가 아니라 “대다수 투자자에게 저비용 전체시장 인덱스가 기본 해법”으로 표현한다. (보글 0·3~5·10~13·18~20장) 린치의 아마추어 우위는 조건부다. “아는 회사면 사도 된다”가 아니라 “먼저 발견할 수 있지만 반드시 조사해야 한다”로 쓴다. (린치 서문·4·6·7·10~17장) 막스의 주기 관찰은 시장 타이밍 공식이 아니다. “현재 위치 파악 → 공격/방어 강도 조절”로만 사용한다. (막스 08·09·14·15·17장)"},{"i":2,"title":"1. 사상 지도","html":"<h3>1-1. 6권은 여섯 개의 책이 아니라 하나의 투자 운영체계다<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>층위<\/th>\n<th>핵심 질문<\/th>\n<th>대표 저자<\/th>\n<th>통합 해석<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>투자 행위의 정의<\/td>\n<td>무엇이 투자이고 무엇이 투기인가<\/td>\n<td>그레이엄, 린치, 막스<\/td>\n<td>철저한 분석, 가격 규율, 리스크 판단, 원금 안전 구조가 없으면 장기 보유도 투기다. (그레이엄 1장, 린치 3·4장, 막스 01·05장)<\/td>\n<\/tr>\n<tr>\n<td>기본 전략<\/td>\n<td>대다수 투자자의 기본값은 무엇인가<\/td>\n<td>보글, 그레이엄, 하우절<\/td>\n<td>저비용·분산·장기·낮은 행동오류가 기본값이다. 개별주·주기 대응은 예외 경로다. (보글 13·18~20장, 그레이엄 4·5장, 하우절 11·19·20장)<\/td>\n<\/tr>\n<tr>\n<td>가격 판단<\/td>\n<td>좋은 자산과 좋은 투자는 어떻게 다른가<\/td>\n<td>그레이엄, 린치, 막스<\/td>\n<td>좋은 회사라도 비싸면 나쁜 투자다. 가격은 수익률의 출발점이자 리스크의 원천이다. (그레이엄 8·20장, 린치 10장, 막스 03·04장)<\/td>\n<\/tr>\n<tr>\n<td>심리와 행동<\/td>\n<td>왜 아는 대로 하지 못하는가<\/td>\n<td>하우절, 코스톨라니, 막스<\/td>\n<td>시장은 정보처리 장치이자 감정증폭 장치다. 투자자는 정보 우위만큼 감정 지연 능력이 필요하다. (하우절 0·11·15~18장, 코스톨라니 7·8장, 막스 10·11장)<\/td>\n<\/tr>\n<tr>\n<td>시장 주기<\/td>\n<td>언제 공격하고 언제 방어할 것인가<\/td>\n<td>막스, 코스톨라니, 그레이엄<\/td>\n<td>주기는 맞히는 것이 아니라 온도를 재는 것이다. 목적은 전량 매수·매도가 아니라 공격/방어 강도 조절이다. (막스 08·09·15·17장, 코스톨라니 7·8장, 그레이엄 3·8장)<\/td>\n<\/tr>\n<tr>\n<td>종목 선택<\/td>\n<td>개별주 우위는 어디서 생기는가<\/td>\n<td>린치, 그레이엄, 막스<\/td>\n<td>생활·업무 관찰은 시작점일 뿐이다. 사업 이해, 유형 분류, 숫자 검증, 가격-가치 괴리, 리스크 보상이 모두 필요하다. (린치 6~17장, 그레이엄 13~15·20장, 막스 01~05·12장)<\/td>\n<\/tr>\n<tr>\n<td>복리 지속<\/td>\n<td>무엇이 투자자를 게임에서 퇴장시키는가<\/td>\n<td>하우절, 보글, 막스, 코스톨라니<\/td>\n<td>레버리지, 비용, 과잉매매, 단기자금, 남의 게임 추종, 충분함 부재가 복리를 중단시킨다. (하우절 3·5·13·16장, 보글 1·4~8·15장, 막스 05~07·18장, 코스톨라니 1·2·8장)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>1-2. 여섯 저자의 좌표<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>저자<\/th>\n<th>한 줄 정체성<\/th>\n<th>주된 분석 단위<\/th>\n<th>가장 경계하는 것<\/th>\n<th>가장 강한 도구<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>그레이엄<\/td>\n<td>가격과 가치를 분리한 가치투자의 원류<\/td>\n<td>기업 가치, 재무안전성, 가격<\/td>\n<td>투기 심리, 비싼 우량주, 안전마진 부재<\/td>\n<td>투자/투기 구분, Mr. Market, 안전마진 (그레이엄 1·8·20장)<\/td>\n<\/tr>\n<tr>\n<td>하우절<\/td>\n<td>돈과 행동의 심리학자<\/td>\n<td>투자자 자신, 시간, 행동<\/td>\n<td>비교심리, 충분함 부재, 다른 게임 추종<\/td>\n<td>생존, 복리, 안전마진, 합리성 (하우절 3~6·11·13·16장)<\/td>\n<\/tr>\n<tr>\n<td>코스톨라니<\/td>\n<td>군중심리와 유동성의 관찰자<\/td>\n<td>돈, 심리, 손바뀜, 국면<\/td>\n<td>빚, 부화뇌동, 대중 열광<\/td>\n<td>돈+심리=트렌드, 달걀, 소신파 (코스톨라니 5·7·8장)<\/td>\n<\/tr>\n<tr>\n<td>보글<\/td>\n<td>비용과 구조의 수학자<\/td>\n<td>시장 전체, 비용, 세금, 회전율<\/td>\n<td>비용, 펀드 선택, 과거 성과 추종, ETF 단타화<\/td>\n<td>저비용 전체시장 인덱스, 장기 보유, 자산배분 (보글 3~5·10~15·18~20장)<\/td>\n<\/tr>\n<tr>\n<td>린치<\/td>\n<td>현장 발굴형 종목 실무자<\/td>\n<td>개별 기업의 사업과 숫자<\/td>\n<td>조사 없는 친숙함, 인기주, 스토리 붕괴<\/td>\n<td>6가지 유형, 2분 독백, 유형별 매도 (린치 6~17장)<\/td>\n<\/tr>\n<tr>\n<td>막스<\/td>\n<td>리스크와 주기의 사상가<\/td>\n<td>가격-가치-심리-주기의 상호작용<\/td>\n<td>1차적 사고, 리스크 불감, 무조건 역발상<\/td>\n<td>2차적 사고, 리스크 제어, 시장온도, 방어투자 (막스 01~07·15·17~20장)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>1-3. 핵심 축 6개<\/h3>\n<h4>축 A. 가격-가치 축<\/h4>\n<p>[명시] 그레이엄은 투자와 투기를 “철저한 분석, 원금 안전, 만족스러운 수익”으로 구분하고, 안전마진을 가치와 가격 사이의 완충폭으로 본다. (그레이엄 1·20장)<\/p>\n<p>[명시] 막스는 투자의 성공이 “좋은 자산”보다 “좋은 매입”에서 나온다고 본다. 가격이 가치보다 낮아야 기대수익이 리스크를 보상할 수 있다. (막스 03·04·05장)<\/p>\n<p>[명시] 린치는 좋은 회사도 너무 비싸게 사면 위험한 투자라고 본다. 이익선, PER, 성장률, 유형 분류는 가격 검증을 위한 도구다. (린치 밀레니엄판 서문, 린치 10·17장)<\/p>\n<p>[간접] 세 저자는 “좋은 회사”와 “좋은 주식”을 분리한다. 좋은 회사는 품질 판단이고, 좋은 주식은 품질에 가격이 붙은 뒤의 판단이다.<\/p>\n<h4>축 B. 비용-구조 축<\/h4>\n<p>[명시] 보글은 투자자 집단이 비용 차감 후 시장 평균보다 낮아지는 구조를 강조한다. 운용보수, 판매보수, 거래비용, 세금, 회전율, 행동오류가 모두 투자자의 몫을 줄인다. (보글 1·3~8장)<\/p>\n<p>[명시] 그레이엄의 방어적 투자자는 단순한 포트폴리오와 비용·기질·분산 통제를 중시한다. (그레이엄 0·4·5장)<\/p>\n<p>[명시] 하우절은 수학적으로 최적이어도 감정적으로 지속할 수 없으면 실패한다고 본다. (하우절 11·19장)<\/p>\n<p>[간접] 비용은 숫자로 보이는 안전마진 침식이다. 수수료 1%p는 연간 지출이 아니라 장기 복리 소유권의 이전이다. (보글 4·5장, 그레이엄 20장, 하우절 4장)<\/p>\n<h4>축 C. 행동-심리 축<\/h4>\n<p>[명시] 하우절은 금융이 소프트 스킬이며, 사람은 자신이 겪은 경험에 따라 위험을 다르게 해석한다고 본다. (하우절 0·1장)<\/p>\n<p>[명시] 코스톨라니는 돈+심리=트렌드, 소신파/부화뇌동파, 대중심리의 순환을 강조한다. (코스톨라니 7·8장)<\/p>\n<p>[명시] 막스는 탐욕·공포·시기·순응이 가격과 가치의 괴리를 만든다고 본다. (막스 10·11·15·18장)<\/p>\n<p>[간접] 시장은 정보 처리 장치이면서 감정 증폭 장치다. 투자자는 정보 우위만이 아니라 감정 지연 능력을 가져야 한다.<\/p>\n<h4>축 D. 주기-온도 축<\/h4>\n<p>[명시] 막스는 주기와 시계추를 예측 공식이 아니라 현재 위치 파악과 공격/방어 강도 조절 도구로 쓴다. (막스 08·09·15·17장)<\/p>\n<p>[명시] 코스톨라니의 달걀은 시장의 국면을 심리·거래량·손바뀜으로 보는 관찰 도구다. 기계적 매매 공식으로 쓰면 안 된다. (코스톨라니 7·8장)<\/p>\n<p>[명시] 그레이엄은 강세장의 높은 PER, 낮은 배당수익률, 신용거래 투기, 부실기업 공모를 경고 신호로 본다. (그레이엄 3·8장)<\/p>\n<p>[간접] 주기 판단의 목적은 내일의 지수 예측이 아니라 지금 신규 매수 허들을 높일지 낮출지, 레버리지를 제거할지, 현금을 어떻게 쓸지 정하는 것이다.<\/p>\n<h4>축 E. 우위-재현성 축<\/h4>\n<p>[명시] 린치는 개인투자자가 생활·업무 현장에서 먼저 기업을 발견할 수 있다고 본다. 그러나 발견은 시작점일 뿐이고, 이익 전망·재무상태·경쟁·확장 계획을 조사해야 한다. (린치 서문·6·11~15장)<\/p>\n<p>[명시] 보글은 대다수 투자자가 비용 차감 후 지속적으로 시장을 이기기 어렵다고 본다. 예외가 있다는 사실은 예외를 사전에 식별할 수 있다는 뜻이 아니다. (보글 3·10·11·13장)<\/p>\n<p>[명시] 막스는 시장과 다르게 생각하는 것만으로는 부족하고, 다르면서 더 정확해야 한다고 본다. (막스 01·02장)<\/p>\n<p>[간접] 린치와 보글은 모순이 아니라 순서다. 보글은 기본값이고, 린치는 기본값을 이탈하려면 필요한 검증 절차다.<\/p>\n<h4>축 F. 생존-복리 축<\/h4>\n<p>[명시] 하우절은 부자가 되는 기술과 부자로 남는 기술을 구분하고, 생존을 전략의 기본으로 본다. (하우절 5장)<\/p>\n<p>[명시] 그레이엄의 안전마진은 예측을 불필요하게 만드는 오차 흡수 장치다. (그레이엄 20장)<\/p>\n<p>[명시] 막스는 리스크를 변동성보다 영구 손실 가능성에 가깝게 본다. (막스 05장)<\/p>\n<p>[명시] 코스톨라니는 빚 없이, 자기 돈·자기 생각·인내를 가진 소신파가 되어야 한다고 본다. (코스톨라니 1·2·8장)<\/p>\n<p>[간접] 복리의 첫 번째 조건은 고수익률이 아니라 게임에서 퇴장하지 않는 것이다.<\/p>\n<hr />","text":"1-1. 6권은 여섯 개의 책이 아니라 하나의 투자 운영체계다 층위 핵심 질문 대표 저자 통합 해석 투자 행위의 정의 무엇이 투자이고 무엇이 투기인가 그레이엄, 린치, 막스 철저한 분석, 가격 규율, 리스크 판단, 원금 안전 구조가 없으면 장기 보유도 투기다. (그레이엄 1장, 린치 3·4장, 막스 01·05장) 기본 전략 대다수 투자자의 기본값은 무엇인가 보글, 그레이엄, 하우절 저비용·분산·장기·낮은 행동오류가 기본값이다. 개별주·주기 대응은 예외 경로다. (보글 13·18~20장, 그레이엄 4·5장, 하우절 11·19·20장) 가격 판단 좋은 자산과 좋은 투자는 어떻게 다른가 그레이엄, 린치, 막스 좋은 회사라도 비싸면 나쁜 투자다. 가격은 수익률의 출발점이자 리스크의 원천이다. (그레이엄 8·20장, 린치 10장, 막스 03·04장) 심리와 행동 왜 아는 대로 하지 못하는가 하우절, 코스톨라니, 막스 시장은 정보처리 장치이자 감정증폭 장치다. 투자자는 정보 우위만큼 감정 지연 능력이 필요하다. (하우절 0·11·15~18장, 코스톨라니 7·8장, 막스 10·11장) 시장 주기 언제 공격하고 언제 방어할 것인가 막스, 코스톨라니, 그레이엄 주기는 맞히는 것이 아니라 온도를 재는 것이다. 목적은 전량 매수·매도가 아니라 공격/방어 강도 조절이다. (막스 08·09·15·17장, 코스톨라니 7·8장, 그레이엄 3·8장) 종목 선택 개별주 우위는 어디서 생기는가 린치, 그레이엄, 막스 생활·업무 관찰은 시작점일 뿐이다. 사업 이해, 유형 분류, 숫자 검증, 가격-가치 괴리, 리스크 보상이 모두 필요하다. (린치 6~17장, 그레이엄 13~15·20장, 막스 01~05·12장) 복리 지속 무엇이 투자자를 게임에서 퇴장시키는가 하우절, 보글, 막스, 코스톨라니 레버리지, 비용, 과잉매매, 단기자금, 남의 게임 추종, 충분함 부재가 복리를 중단시킨다. (하우절 3·5·13·16장, 보글 1·4~8·15장, 막스 05~07·18장, 코스톨라니 1·2·8장) 1-2. 여섯 저자의 좌표 저자 한 줄 정체성 주된 분석 단위 가장 경계하는 것 가장 강한 도구 그레이엄 가격과 가치를 분리한 가치투자의 원류 기업 가치, 재무안전성, 가격 투기 심리, 비싼 우량주, 안전마진 부재 투자/투기 구분, Mr. Market, 안전마진 (그레이엄 1·8·20장) 하우절 돈과 행동의 심리학자 투자자 자신, 시간, 행동 비교심리, 충분함 부재, 다른 게임 추종 생존, 복리, 안전마진, 합리성 (하우절 3~6·11·13·16장) 코스톨라니 군중심리와 유동성의 관찰자 돈, 심리, 손바뀜, 국면 빚, 부화뇌동, 대중 열광 돈+심리=트렌드, 달걀, 소신파 (코스톨라니 5·7·8장) 보글 비용과 구조의 수학자 시장 전체, 비용, 세금, 회전율 비용, 펀드 선택, 과거 성과 추종, ETF 단타화 저비용 전체시장 인덱스, 장기 보유, 자산배분 (보글 3~5·10~15·18~20장) 린치 현장 발굴형 종목 실무자 개별 기업의 사업과 숫자 조사 없는 친숙함, 인기주, 스토리 붕괴 6가지 유형, 2분 독백, 유형별 매도 (린치 6~17장) 막스 리스크와 주기의 사상가 가격-가치-심리-주기의 상호작용 1차적 사고, 리스크 불감, 무조건 역발상 2차적 사고, 리스크 제어, 시장온도, 방어투자 (막스 01~07·15·17~20장) 1-3. 핵심 축 6개 축 A. 가격-가치 축 [명시] 그레이엄은 투자와 투기를 “철저한 분석, 원금 안전, 만족스러운 수익”으로 구분하고, 안전마진을 가치와 가격 사이의 완충폭으로 본다. (그레이엄 1·20장) [명시] 막스는 투자의 성공이 “좋은 자산”보다 “좋은 매입”에서 나온다고 본다. 가격이 가치보다 낮아야 기대수익이 리스크를 보상할 수 있다. (막스 03·04·05장) [명시] 린치는 좋은 회사도 너무 비싸게 사면 위험한 투자라고 본다. 이익선, PER, 성장률, 유형 분류는 가격 검증을 위한 도구다. (린치 밀레니엄판 서문, 린치 10·17장) [간접] 세 저자는 “좋은 회사”와 “좋은 주식”을 분리한다. 좋은 회사는 품질 판단이고, 좋은 주식은 품질에 가격이 붙은 뒤의 판단이다. 축 B. 비용-구조 축 [명시] 보글은 투자자 집단이 비용 차감 후 시장 평균보다 낮아지는 구조를 강조한다. 운용보수, 판매보수, 거래비용, 세금, 회전율, 행동오류가 모두 투자자의 몫을 줄인다. (보글 1·3~8장) [명시] 그레이엄의 방어적 투자자는 단순한 포트폴리오와 비용·기질·분산 통제를 중시한다. (그레이엄 0·4·5장) [명시] 하우절은 수학적으로 최적이어도 감정적으로 지속할 수 없으면 실패한다고 본다. (하우절 11·19장) [간접] 비용은 숫자로 보이는 안전마진 침식이다. 수수료 1%p는 연간 지출이 아니라 장기 복리 소유권의 이전이다. (보글 4·5장, 그레이엄 20장, 하우절 4장) 축 C. 행동-심리 축 [명시] 하우절은 금융이 소프트 스킬이며, 사람은 자신이 겪은 경험에 따라 위험을 다르게 해석한다고 본다. (하우절 0·1장) [명시] 코스톨라니는 돈+심리=트렌드, 소신파/부화뇌동파, 대중심리의 순환을 강조한다. (코스톨라니 7·8장) [명시] 막스는 탐욕·공포·시기·순응이 가격과 가치의 괴리를 만든다고 본다. (막스 10·11·15·18장) [간접] 시장은 정보 처리 장치이면서 감정 증폭 장치다. 투자자는 정보 우위만이 아니라 감정 지연 능력을 가져야 한다. 축 D. 주기-온도 축 [명시] 막스는 주기와 시계추를 예측 공식이 아니라 현재 위치 파악과 공격/방어 강도 조절 도구로 쓴다. (막스 08·09·15·17장) [명시] 코스톨라니의 달걀은 시장의 국면을 심리·거래량·손바뀜으로 보는 관찰 도구다. 기계적 매매 공식으로 쓰면 안 된다. (코스톨라니 7·8장) [명시] 그레이엄은 강세장의 높은 PER, 낮은 배당수익률, 신용거래 투기, 부실기업 공모를 경고 신호로 본다. (그레이엄 3·8장) [간접] 주기 판단의 목적은 내일의 지수 예측이 아니라 지금 신규 매수 허들을 높일지 낮출지, 레버리지를 제거할지, 현금을 어떻게 쓸지 정하는 것이다. 축 E. 우위-재현성 축 [명시] 린치는 개인투자자가 생활·업무 현장에서 먼저 기업을 발견할 수 있다고 본다. 그러나 발견은 시작점일 뿐이고, 이익 전망·재무상태·경쟁·확장 계획을 조사해야 한다. (린치 서문·6·11~15장) [명시] 보글은 대다수 투자자가 비용 차감 후 지속적으로 시장을 이기기 어렵다고 본다. 예외가 있다는 사실은 예외를 사전에 식별할 수 있다는 뜻이 아니다. (보글 3·10·11·13장) [명시] 막스는 시장과 다르게 생각하는 것만으로는 부족하고, 다르면서 더 정확해야 한다고 본다. (막스 01·02장) [간접] 린치와 보글은 모순이 아니라 순서다. 보글은 기본값이고, 린치는 기본값을 이탈하려면 필요한 검증 절차다. 축 F. 생존-복리 축 [명시] 하우절은 부자가 되는 기술과 부자로 남는 기술을 구분하고, 생존을 전략의 기본으로 본다. (하우절 5장) [명시] 그레이엄의 안전마진은 예측을 불필요하게 만드는 오차 흡수 장치다. (그레이엄 20장) [명시] 막스는 리스크를 변동성보다 영구 손실 가능성에 가깝게 본다. (막스 05장) [명시] 코스톨라니는 빚 없이, 자기 돈·자기 생각·인내를 가진 소신파가 되어야 한다고 본다. (코스톨라니 1·2·8장) [간접] 복리의 첫 번째 조건은 고수익률이 아니라 게임에서 퇴장하지 않는 것이다."},{"i":3,"title":"2. 핵심 쟁점 교차 매트릭스","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>쟁점<\/th>\n<th>그레이엄<\/th>\n<th>하우절<\/th>\n<th>코스톨라니<\/th>\n<th>보글<\/th>\n<th>린치<\/th>\n<th>막스<\/th>\n<th>통합 결론<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>투자와 투기<\/td>\n<td>분석·원금 안전·충분한 수익 없으면 투기. (1장)<\/td>\n<td>행동이 무너지면 지식도 무용. (0·19장)<\/td>\n<td>단기투기꾼은 사라지지 않지만 장기 성공은 어렵다. (2장)<\/td>\n<td>과도한 매매는 카지노에 머무는 것. (0·1장)<\/td>\n<td>기술·노력·확률 계산이 도박과 투자를 가른다. (3장)<\/td>\n<td>2차적 사고와 가치 판단 없이는 평균 이상 불가. (01~04장)<\/td>\n<td>외형이 아니라 의사결정 기준이 투자와 투기를 가른다.<\/td>\n<\/tr>\n<tr>\n<td>가격<\/td>\n<td>가치보다 싸게 사야 한다. (8·20장)<\/td>\n<td>변동성은 입장료지만 파산은 피해야 한다. (13·15장)<\/td>\n<td>가격은 수급과 군중의 손바뀜에 흔들린다. (5·8장)<\/td>\n<td>시장 전체를 싸게 보유하려면 비용을 낮춰야 한다. (4·5장)<\/td>\n<td>좋은 회사도 비싸면 위험. (10·17장)<\/td>\n<td>좋은 자산보다 좋은 매입. (04장)<\/td>\n<td>가격은 수익률의 출발점이자 리스크의 원천이다.<\/td>\n<\/tr>\n<tr>\n<td>리스크<\/td>\n<td>안전마진 부족과 원금 안전 훼손. (1·20장)<\/td>\n<td>생존 실패, 레버리지, 충분함 부재. (3·5·13장)<\/td>\n<td>빚, 군중, 돈 없는 확신. (1·8장)<\/td>\n<td>비용·세금·시장위험·행동오류. (4~8·13장)<\/td>\n<td>모르는 회사, 나쁜 가격, 부채, 유형 오판. (4·9·13·15장)<\/td>\n<td>영구 손실, 보이지 않는 리스크, 과열. (05~07·18장)<\/td>\n<td>리스크는 변동성 자체보다 복리 중단 가능성이다.<\/td>\n<\/tr>\n<tr>\n<td>예측<\/td>\n<td>시장 예측보다 가격 규율. (3·8장)<\/td>\n<td>미래는 놀라움을 만든다. (12·18장)<\/td>\n<td>금리·돈·심리를 관찰하되 공식화 금지. (7·8장)<\/td>\n<td>예측 대신 전체시장 보유. (13·20장)<\/td>\n<td>시장을 묻지 말고 기업을 보라. (5장)<\/td>\n<td>“나는 모른다”를 전제로 준비. (14~16장)<\/td>\n<td>예측은 보조 정보이고, 구조와 준비가 핵심이다.<\/td>\n<\/tr>\n<tr>\n<td>종목 선택<\/td>\n<td>방어 기준, 염가, 안전마진. (5·14·15·20장)<\/td>\n<td>한 사례보다 반복 원칙. (2장)<\/td>\n<td>종목보다 국면·심리·자금 확인. (5·7·8장)<\/td>\n<td>대다수는 종목 선택보다 전체시장. (10·13장)<\/td>\n<td>6유형, 2분 독백, 숫자 확인. (7·11~15장)<\/td>\n<td>비효율 조건과 가치 괴리. (02~04·12장)<\/td>\n<td>개별주는 발견→조사→가격→생존 절차가 있을 때만 정당화된다.<\/td>\n<\/tr>\n<tr>\n<td>분산<\/td>\n<td>방어적 투자자는 충분한 분산. (5장)<\/td>\n<td>꼬리 성과와 생존을 위해 포트폴리오로 봐야 함. (6·19장)<\/td>\n<td>소신파도 돈과 인내가 필요. (8장)<\/td>\n<td>광범위 분산이 기본. (13장)<\/td>\n<td>너무 많은 종목은 관리 불능, 유형 분산 필요. (16장)<\/td>\n<td>상관관계와 숨은 공통노출 점검. (18·20장)<\/td>\n<td>분산은 무지의 고백이 아니라 생존 설계다.<\/td>\n<\/tr>\n<tr>\n<td>매도<\/td>\n<td>가치·가격·안전마진 기준. (8·20장)<\/td>\n<td>본전 심리와 정체성 변화 경계. (14·19장)<\/td>\n<td>국면 변화와 손바뀜을 관찰. (8장)<\/td>\n<td>장기 보유가 원칙, 빈번한 매도 금지. (13·20장)<\/td>\n<td>유형별 스토리 훼손·과열·회복 완료. (17장)<\/td>\n<td>시장온도, 가치 수렴, 리스크 보상 변화. (15·17장)<\/td>\n<td>매도는 가격 반응이 아니라 가설 변화와 리스크 보상 변화다.<\/td>\n<\/tr>\n<tr>\n<td>개인투자자 우위<\/td>\n<td>공격적 투자자는 더 많은 노력 필요. (7·15장)<\/td>\n<td>각자 다른 게임을 한다. (16장)<\/td>\n<td>자기 돈·자기 생각·자기 인내. (2·8장)<\/td>\n<td>대다수는 우위를 식별하기 어렵다. (10~11장)<\/td>\n<td>생활 관찰+조사에서 조건부 우위. (서문·6장)<\/td>\n<td>우위가 무엇인지 증명해야 함. (01~02장)<\/td>\n<td>우위는 느낌이 아니라 반복 가능한 구조여야 한다.<\/td>\n<\/tr>\n<tr>\n<td>한국 투자자 적용<\/td>\n<td>수치 기계 적용 주의. (5·13장)<\/td>\n<td>생활비·저축률·밤잠 중요. (10·11·16장)<\/td>\n<td>레버리지·대중심리·금리 민감도 점검. (7·8장)<\/td>\n<td>미국 투자자 전제와 한국 투자자 전제 분리. (18~20장)<\/td>\n<td>국내 정보우위 가능하나 지배구조·유동성 확인. (12~16장)<\/td>\n<td>시장온도와 방어성 조절. (15·17장)<\/td>\n<td>통화·세금·계좌·시장구조를 원칙 위에 얹어야 한다.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />","text":"쟁점 그레이엄 하우절 코스톨라니 보글 린치 막스 통합 결론 투자와 투기 분석·원금 안전·충분한 수익 없으면 투기. (1장) 행동이 무너지면 지식도 무용. (0·19장) 단기투기꾼은 사라지지 않지만 장기 성공은 어렵다. (2장) 과도한 매매는 카지노에 머무는 것. (0·1장) 기술·노력·확률 계산이 도박과 투자를 가른다. (3장) 2차적 사고와 가치 판단 없이는 평균 이상 불가. (01~04장) 외형이 아니라 의사결정 기준이 투자와 투기를 가른다. 가격 가치보다 싸게 사야 한다. (8·20장) 변동성은 입장료지만 파산은 피해야 한다. (13·15장) 가격은 수급과 군중의 손바뀜에 흔들린다. (5·8장) 시장 전체를 싸게 보유하려면 비용을 낮춰야 한다. (4·5장) 좋은 회사도 비싸면 위험. (10·17장) 좋은 자산보다 좋은 매입. (04장) 가격은 수익률의 출발점이자 리스크의 원천이다. 리스크 안전마진 부족과 원금 안전 훼손. (1·20장) 생존 실패, 레버리지, 충분함 부재. (3·5·13장) 빚, 군중, 돈 없는 확신. (1·8장) 비용·세금·시장위험·행동오류. (4~8·13장) 모르는 회사, 나쁜 가격, 부채, 유형 오판. (4·9·13·15장) 영구 손실, 보이지 않는 리스크, 과열. (05~07·18장) 리스크는 변동성 자체보다 복리 중단 가능성이다. 예측 시장 예측보다 가격 규율. (3·8장) 미래는 놀라움을 만든다. (12·18장) 금리·돈·심리를 관찰하되 공식화 금지. (7·8장) 예측 대신 전체시장 보유. (13·20장) 시장을 묻지 말고 기업을 보라. (5장) “나는 모른다”를 전제로 준비. (14~16장) 예측은 보조 정보이고, 구조와 준비가 핵심이다. 종목 선택 방어 기준, 염가, 안전마진. (5·14·15·20장) 한 사례보다 반복 원칙. (2장) 종목보다 국면·심리·자금 확인. (5·7·8장) 대다수는 종목 선택보다 전체시장. (10·13장) 6유형, 2분 독백, 숫자 확인. (7·11~15장) 비효율 조건과 가치 괴리. (02~04·12장) 개별주는 발견→조사→가격→생존 절차가 있을 때만 정당화된다. 분산 방어적 투자자는 충분한 분산. (5장) 꼬리 성과와 생존을 위해 포트폴리오로 봐야 함. (6·19장) 소신파도 돈과 인내가 필요. (8장) 광범위 분산이 기본. (13장) 너무 많은 종목은 관리 불능, 유형 분산 필요. (16장) 상관관계와 숨은 공통노출 점검. (18·20장) 분산은 무지의 고백이 아니라 생존 설계다. 매도 가치·가격·안전마진 기준. (8·20장) 본전 심리와 정체성 변화 경계. (14·19장) 국면 변화와 손바뀜을 관찰. (8장) 장기 보유가 원칙, 빈번한 매도 금지. (13·20장) 유형별 스토리 훼손·과열·회복 완료. (17장) 시장온도, 가치 수렴, 리스크 보상 변화. (15·17장) 매도는 가격 반응이 아니라 가설 변화와 리스크 보상 변화다. 개인투자자 우위 공격적 투자자는 더 많은 노력 필요. (7·15장) 각자 다른 게임을 한다. (16장) 자기 돈·자기 생각·자기 인내. (2·8장) 대다수는 우위를 식별하기 어렵다. (10~11장) 생활 관찰+조사에서 조건부 우위. (서문·6장) 우위가 무엇인지 증명해야 함. (01~02장) 우위는 느낌이 아니라 반복 가능한 구조여야 한다. 한국 투자자 적용 수치 기계 적용 주의. (5·13장) 생활비·저축률·밤잠 중요. (10·11·16장) 레버리지·대중심리·금리 민감도 점검. (7·8장) 미국 투자자 전제와 한국 투자자 전제 분리. (18~20장) 국내 정보우위 가능하나 지배구조·유동성 확인. (12~16장) 시장온도와 방어성 조절. (15·17장) 통화·세금·계좌·시장구조를 원칙 위에 얹어야 한다."},{"i":4,"title":"3. 6권 합의 원칙 Top 10","html":"<p>합의 강도 표기:<\/p>\n<ul>\n<li>●●●: 6권 전부에서 명시 또는 강한 간접 합의.<\/li>\n<li>●●○: 5권 내외에서 강하게 합의하고 1권은 조건부.<\/li>\n<li>●○○: 일부 충돌이 있으나 실행 체계상 결합 가능.<\/li>\n<\/ul>\n<h3>3-1. 합의 원칙 표<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">순위<\/th>\n<th>통합 원칙<\/th>\n<th>합의 강도<\/th>\n<th>근거<\/th>\n<th>실행 번역<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td>투자 성과의 1차 방어선은 자기 자신이다.<\/td>\n<td>●●●<\/td>\n<td>그레이엄은 자기 자신을 가장 위험한 적으로 보고, 하우절은 행동이 지식보다 중요하다고 하며, 막스는 탐욕·공포·순응을 함정으로 본다. (그레이엄 0·8장, 하우절 0·19장, 막스 10·18장)<\/td>\n<td>투자정책서, 매수/매도 체크리스트, 뉴스 소비 제한, 사전 규칙.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>좋은 자산보다 좋은 가격이 우선이다.<\/td>\n<td>●●●<\/td>\n<td>그레이엄 안전마진, 막스 가격-가치 관계, 린치의 비싼 우량주 경고가 일치한다. (그레이엄 8·20장, 막스 03~04장, 린치 10·17장)<\/td>\n<td>가격 없이 “좋은 회사”라고 쓰인 투자 메모는 반려한다.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td>생존이 복리의 전제다.<\/td>\n<td>●●●<\/td>\n<td>하우절은 생존을 전략의 기본으로 보고, 막스는 영구 손실을 중시하며, 코스톨라니는 빚 없는 소신파를 강조한다. (하우절 4~5·13장, 막스 05·17장, 코스톨라니 1·8장)<\/td>\n<td>레버리지 제한, 현금 쿠션, 손실 시 행동 규칙, 최대낙폭 가정.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td>비용은 확정 손실이고 알파는 불확실하다.<\/td>\n<td>●●●<\/td>\n<td>보글의 비용 복리, 그레이엄의 방어적 단순성, 하우절의 지속 가능성이 연결된다. (보글 1~5장, 그레이엄 4·9장, 하우절 4·11장)<\/td>\n<td>보수·세금·환전·거래비용·회전율을 매수 전 표준 항목으로 계산한다.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td>시장 예측보다 준비와 구조가 중요하다.<\/td>\n<td>●●○<\/td>\n<td>린치는 시장을 묻지 말라고 하고, 막스는 “나는 모른다”를 강조하며, 보글은 예측 대신 전체시장 보유를 제시한다. (린치 5장, 막스 14~16장, 보글 13·20장)<\/td>\n<td>전망보다 시나리오, 현금, 리밸런싱 규칙을 먼저 쓴다.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td>대다수에게 기본값은 단순·분산·저비용·장기다.<\/td>\n<td>●●○<\/td>\n<td>보글의 기본 해법, 그레이엄의 방어적 투자, 하우절의 적당히 합리적 전략이 합쳐진다. (보글 13·20장, 그레이엄 4~5장, 하우절 11·20장)<\/td>\n<td>코어는 저비용 광범위 분산, 개별주는 위성 전략으로 제한.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td>개별주 초과수익은 가능하지만 조건부다.<\/td>\n<td>●●○<\/td>\n<td>린치는 아마추어 우위를 말하지만, 보글은 대다수의 장기 언더퍼폼을 지적하고, 막스는 시장과 다르고 더 정확해야 한다고 본다. (린치 서문·6~15장, 보글 10~11장, 막스 01~02장)<\/td>\n<td>“내가 왜 예외인가”를 정보·분석·행동·시간 중 하나로 증명한다.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td>주기는 맞히는 것이 아니라 온도를 재는 것이다.<\/td>\n<td>●●○<\/td>\n<td>막스의 시장온도, 코스톨라니의 달걀, 그레이엄의 강세장 경고 신호가 연결된다. (막스 08·15장, 코스톨라니 7~8장, 그레이엄 3·8장)<\/td>\n<td>공격/방어 레버를 조정하되 전량 진입·전량 이탈 공식으로 쓰지 않는다.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td>매도는 주가가 아니라 가설로 판단한다.<\/td>\n<td>●●○<\/td>\n<td>린치는 유형별 스토리 훼손을, 막스는 가격-가치·리스크 보상 변화를, 코스톨라니는 국면 변화를 본다. (린치 14·17장, 막스 04·15·17장, 코스톨라니 8장)<\/td>\n<td>매도 판단 트리를 “가격 하락/상승”이 아니라 “가설 유지/훼손”으로 만든다.<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td>나와 다른 게임을 하는 사람의 신호를 따라가지 말라.<\/td>\n<td>●●●<\/td>\n<td>하우절의 다른 게임, 린치의 자기진단, 보글의 펀드 추종 경고, 막스의 군중심리 경계가 일치한다. (하우절 16장, 린치 4장, 보글 7·10~11장, 막스 10~11장)<\/td>\n<td>내 시간지평·현금 필요·감정 내성·세금 조건을 문서화한다.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3-2. 핵심 문장<\/h3>\n<p>[추론] 투자란 “무엇을 살까”보다 먼저 “어떤 게임을, 어떤 비용으로, 어떤 시간 지평에서, 어떤 손실을 견디며, 어떤 기준으로 반복할 것인가”를 정하는 일이다. 이 문장은 하우절의 행동론, 보글의 비용론, 그레이엄의 안전마진, 막스의 리스크론, 린치의 조사론, 코스톨라니의 심리·주기론을 하나로 묶는다. (하우절 16·19장, 보글 3~5장, 그레이엄 20장, 막스 05·17장, 린치 11~16장, 코스톨라니 7~8장)<\/p>\n<hr />","text":"합의 강도 표기: ●●●: 6권 전부에서 명시 또는 강한 간접 합의. ●●○: 5권 내외에서 강하게 합의하고 1권은 조건부. ●○○: 일부 충돌이 있으나 실행 체계상 결합 가능. 3-1. 합의 원칙 표 순위 통합 원칙 합의 강도 근거 실행 번역 1 투자 성과의 1차 방어선은 자기 자신이다. ●●● 그레이엄은 자기 자신을 가장 위험한 적으로 보고, 하우절은 행동이 지식보다 중요하다고 하며, 막스는 탐욕·공포·순응을 함정으로 본다. (그레이엄 0·8장, 하우절 0·19장, 막스 10·18장) 투자정책서, 매수/매도 체크리스트, 뉴스 소비 제한, 사전 규칙. 2 좋은 자산보다 좋은 가격이 우선이다. ●●● 그레이엄 안전마진, 막스 가격-가치 관계, 린치의 비싼 우량주 경고가 일치한다. (그레이엄 8·20장, 막스 03~04장, 린치 10·17장) 가격 없이 “좋은 회사”라고 쓰인 투자 메모는 반려한다. 3 생존이 복리의 전제다. ●●● 하우절은 생존을 전략의 기본으로 보고, 막스는 영구 손실을 중시하며, 코스톨라니는 빚 없는 소신파를 강조한다. (하우절 4~5·13장, 막스 05·17장, 코스톨라니 1·8장) 레버리지 제한, 현금 쿠션, 손실 시 행동 규칙, 최대낙폭 가정. 4 비용은 확정 손실이고 알파는 불확실하다. ●●● 보글의 비용 복리, 그레이엄의 방어적 단순성, 하우절의 지속 가능성이 연결된다. (보글 1~5장, 그레이엄 4·9장, 하우절 4·11장) 보수·세금·환전·거래비용·회전율을 매수 전 표준 항목으로 계산한다. 5 시장 예측보다 준비와 구조가 중요하다. ●●○ 린치는 시장을 묻지 말라고 하고, 막스는 “나는 모른다”를 강조하며, 보글은 예측 대신 전체시장 보유를 제시한다. (린치 5장, 막스 14~16장, 보글 13·20장) 전망보다 시나리오, 현금, 리밸런싱 규칙을 먼저 쓴다. 6 대다수에게 기본값은 단순·분산·저비용·장기다. ●●○ 보글의 기본 해법, 그레이엄의 방어적 투자, 하우절의 적당히 합리적 전략이 합쳐진다. (보글 13·20장, 그레이엄 4~5장, 하우절 11·20장) 코어는 저비용 광범위 분산, 개별주는 위성 전략으로 제한. 7 개별주 초과수익은 가능하지만 조건부다. ●●○ 린치는 아마추어 우위를 말하지만, 보글은 대다수의 장기 언더퍼폼을 지적하고, 막스는 시장과 다르고 더 정확해야 한다고 본다. (린치 서문·6~15장, 보글 10~11장, 막스 01~02장) “내가 왜 예외인가”를 정보·분석·행동·시간 중 하나로 증명한다. 8 주기는 맞히는 것이 아니라 온도를 재는 것이다. ●●○ 막스의 시장온도, 코스톨라니의 달걀, 그레이엄의 강세장 경고 신호가 연결된다. (막스 08·15장, 코스톨라니 7~8장, 그레이엄 3·8장) 공격/방어 레버를 조정하되 전량 진입·전량 이탈 공식으로 쓰지 않는다. 9 매도는 주가가 아니라 가설로 판단한다. ●●○ 린치는 유형별 스토리 훼손을, 막스는 가격-가치·리스크 보상 변화를, 코스톨라니는 국면 변화를 본다. (린치 14·17장, 막스 04·15·17장, 코스톨라니 8장) 매도 판단 트리를 “가격 하락/상승”이 아니라 “가설 유지/훼손”으로 만든다. 10 나와 다른 게임을 하는 사람의 신호를 따라가지 말라. ●●● 하우절의 다른 게임, 린치의 자기진단, 보글의 펀드 추종 경고, 막스의 군중심리 경계가 일치한다. (하우절 16장, 린치 4장, 보글 7·10~11장, 막스 10~11장) 내 시간지평·현금 필요·감정 내성·세금 조건을 문서화한다. 3-2. 핵심 문장 [추론] 투자란 “무엇을 살까”보다 먼저 “어떤 게임을, 어떤 비용으로, 어떤 시간 지평에서, 어떤 손실을 견디며, 어떤 기준으로 반복할 것인가”를 정하는 일이다. 이 문장은 하우절의 행동론, 보글의 비용론, 그레이엄의 안전마진, 막스의 리스크론, 린치의 조사론, 코스톨라니의 심리·주기론을 하나로 묶는다. (하우절 16·19장, 보글 3~5장, 그레이엄 20장, 막스 05·17장, 린치 11~16장, 코스톨라니 7~8장)"},{"i":5,"title":"4. 정면 충돌 지점 해부","html":"<p>이 절은 Run 7의 핵심이다. 여섯 권은 겉으로는 자주 충돌한다. 그러나 충돌의 대부분은 “원칙의 충돌”이라기보다 “적용 대상, 투자자 능력, 시간지평, 비용 구조, 시장온도”의 차이에서 발생한다.<\/p>\n<h3>4-1. 린치의 개별주 발굴 vs 보글의 인덱스 기본 해법<\/h3>\n<h4>전선<\/h4>\n<p>린치는 개인투자자가 생활·업무 현장에서 월가보다 먼저 좋은 기업을 발견할 수 있다고 본다. 그는 6가지 유형, 2분 독백, 숫자 확인, 유형별 매도를 통해 텐베거를 찾을 수 있다고 말한다. (린치 서문·6~17장)<\/p>\n<p>보글은 대다수 투자자가 비용 차감 후 시장을 이기기 어렵고, 바늘을 찾기보다 건초더미를 사는 편이 합리적이라고 본다. (보글 3·10·11·13장)<\/p>\n<h4>양측 최강 논거<\/h4>\n<p>린치 측 최강 논거:<\/p>\n<ul>\n<li>기관은 제약이 많고, 이미 알려진 대형주·인기주에 몰리기 쉽다. (린치 2장)<\/li>\n<li>개인은 직장, 소비, 지역, 공급망, 고객 경험에서 조기 신호를 볼 수 있다. (린치 6장)<\/li>\n<li>그러나 유망기업 발견은 첫 단계일 뿐이다. 이익 전망, 재무상태, 경쟁, 확장 계획을 조사하기 전에는 투자해서는 안 된다. (린치 서문·11~15장)<\/li>\n<li>종목 유형이 다르면 성공 조건과 매도 조건도 다르다. (린치 7·17장)<\/li>\n<\/ul>\n<p>보글 측 최강 논거:<\/p>\n<ul>\n<li>시장 참가자 전체의 평균은 시장이고, 비용 차감 후 평균 투자자는 시장보다 낮아진다. (보글 3~5장)<\/li>\n<li>과거 성과가 좋은 펀드·매니저를 사전에 골라 장기간 유지하기는 어렵다. (보글 10·11장)<\/li>\n<li>거래가 늘수록 비용·세금·감정 실수가 누적된다. (보글 1·4·7·8장)<\/li>\n<li>전체시장을 저비용으로 오래 보유하면 종목·매니저 선택 위험을 제거하고 시장위험만 남긴다. (보글 13장)<\/li>\n<\/ul>\n<h4>실은 합의하는 것<\/h4>\n<p>둘 다 “조사 없는 확신”을 싫어한다.<\/p>\n<ul>\n<li>린치는 “아는 회사”라는 친숙함만으로 사지 말라고 한다. (린치 서문·11장)<\/li>\n<li>보글은 대다수가 자신이 평균 이상이라고 착각한다고 본다. (보글 10·11장)<\/li>\n<li>막스는 이 논쟁에 판정 기준을 준다. 시장과 다르게 생각하는 것만으로는 부족하고, 다르면서 더 정확해야 한다. (막스 01·02장)<\/li>\n<li>하우절은 또 다른 판정 기준을 준다. 내가 감정적으로 견딜 수 없는 전략은 수학적으로 맞아도 내 전략이 아니다. (하우절 11·16장)<\/li>\n<li>그레이엄은 최종 제한을 준다. 분석·원금 안전·만족스러운 수익 구조가 없으면 투자라고 부르기 어렵다. (그레이엄 1장)<\/li>\n<\/ul>\n<h4>판정 변수<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>변수<\/th>\n<th>질문<\/th>\n<th>보글 쪽으로 기울 때<\/th>\n<th>린치 쪽으로 열릴 때<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>시간<\/td>\n<td>나는 기업을 지속적으로 추적할 시간이 있는가?<\/td>\n<td>분기 실적·공시·스토리 점검 불가<\/td>\n<td>정기 점검 가능<\/td>\n<\/tr>\n<tr>\n<td>분석<\/td>\n<td>재무제표와 사업 모델을 해석할 수 있는가?<\/td>\n<td>PER·부채·이익 질 해석 불가<\/td>\n<td>이익·현금흐름·부채·경쟁 확인 가능<\/td>\n<\/tr>\n<tr>\n<td>우위<\/td>\n<td>내가 남보다 먼저 또는 다르게 볼 근거가 있는가?<\/td>\n<td>단순 뉴스·커뮤니티 추종<\/td>\n<td>업무·소비·공급망·비인기 영역의 관찰 우위<\/td>\n<\/tr>\n<tr>\n<td>기질<\/td>\n<td>하락장에서 스토리와 가격을 구분할 수 있는가?<\/td>\n<td>가격 하락에 즉시 흔들림<\/td>\n<td>가설 유지/훼손을 분리 가능<\/td>\n<\/tr>\n<tr>\n<td>비용<\/td>\n<td>거래 회전율을 낮게 유지할 수 있는가?<\/td>\n<td>잦은 매매·세금·환전 비용 큼<\/td>\n<td>낮은 회전율 유지<\/td>\n<\/tr>\n<tr>\n<td>실패 비용<\/td>\n<td>틀렸을 때 포트폴리오가 생존하는가?<\/td>\n<td>집중·레버리지·단기자금<\/td>\n<td>위성 비중 제한, 무레버리지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>실행 절충<\/h4>\n<p>[추론] 통합 원칙은 다음이다.<\/p>\n<ul>\n<li>기본 포트폴리오는 보글식 저비용·광범위·장기 구조로 둔다. (보글 13·18~20장)<\/li>\n<li>개별주는 린치식 2분 독백과 유형 분류, 그레이엄식 가격/가치, 막스식 리스크 보상, 하우절식 지속 가능성을 통과한 경우에만 위성으로 둔다. (린치 7·11~17장, 그레이엄 20장, 막스 04~07장, 하우절 11·13장)<\/li>\n<li>개별주 비중은 확신이 아니라 오판 시 생존 가능성으로 정한다. (하우절 5·13장, 막스 17장)<\/li>\n<\/ul>\n<h4>판정<\/h4>\n<p>린치와 보글의 충돌은 승패가 아니라 순서다. 보글은 기본값을 정하고, 린치는 기본값을 이탈하려면 필요한 절차를 정한다. 막스는 우위의 질을 묻고, 그레이엄은 가격과 안전마진을 묻고, 하우절은 지속 가능성을 묻는다.<\/p>\n<hr />\n<h3>4-2. 코스톨라니의 금리·달걀 프레임 vs 그레이엄·린치·막스의 예측 회의론<\/h3>\n<h4>전선<\/h4>\n<p>코스톨라니는 돈과 심리가 중기 추세를 만든다고 본다. 금리와 유동성, 대중심리, 손바뀜, 달걀 국면을 관찰해야 한다고 말한다. (코스톨라니 5·7·8장)<\/p>\n<p>반면 그레이엄, 린치, 막스는 시장·금리·거시 예측을 일관된 초과수익 원천으로 보지 않는다. 그레이엄은 가격과 가치에 집중하고, 린치는 시장을 묻지 말고 기업을 보라고 하며, 막스는 미래를 맞히려 하지 말고 현재 위치를 파악하라고 한다. (그레이엄 3·8·20장, 린치 5장, 막스 14·15장)<\/p>\n<h4>정밀 판정<\/h4>\n<p>이 충돌은 “예측을 할 것인가 말 것인가”가 아니라 “거시·심리 정보를 어디에 쓸 것인가”의 문제다.<\/p>\n<ul>\n<li>코스톨라니는 거시와 심리를 버리라고 하지 않는다. 그는 돈+심리=트렌드라는 프레임으로 중기 흐름을 관찰한다. (코스톨라니 7장)<\/li>\n<li>그레이엄은 가격 변동에 대응하되, 대응 기준을 예측이 아니라 가격과 가치에 둔다. (그레이엄 8·20장)<\/li>\n<li>린치는 시장이 좋은지보다 기업이 좋은지, 그리고 가격이 합리적인지를 보라고 한다. (린치 5·10~12장)<\/li>\n<li>막스는 미래를 맞히려 하지 말고 현재 시장의 온도를 재서 공격과 방어의 강도를 조절하라고 한다. (막스 14·15·17장)<\/li>\n<\/ul>\n<h4>허용되는 사용과 금지되는 사용<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>도구<\/th>\n<th>허용되는 사용<\/th>\n<th>금지되는 사용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>코스톨라니 달걀<\/td>\n<td>현재 시장이 무관심·불신·과열·투매 중 어디에 가까운지 보는 온도계. (코스톨라니 8장)<\/td>\n<td>A1이면 무조건 매수, A3이면 무조건 매도 같은 기계적 공식.<\/td>\n<\/tr>\n<tr>\n<td>금리 관찰<\/td>\n<td>주식과 채권의 상대 매력, 유동성, 신용환경을 점검. (코스톨라니 7장, 보글 14·18장)<\/td>\n<td>“금리 인하=무조건 주식 매수” 식의 단선적 예측.<\/td>\n<\/tr>\n<tr>\n<td>막스 시장온도<\/td>\n<td>리스크 프리미엄, 신용, 레버리지, 낙관·비관을 보고 공격/방어 조절. (막스 15·17장)<\/td>\n<td>지수 고점·저점 타이밍 도구.<\/td>\n<\/tr>\n<tr>\n<td>그레이엄 가격 신호<\/td>\n<td>과열 시 기대수익률을 낮추고 리밸런싱. (그레이엄 3·8장)<\/td>\n<td>고평가 판단만으로 전량 현금화.<\/td>\n<\/tr>\n<tr>\n<td>린치 기업 중심<\/td>\n<td>기업 스토리와 숫자를 우선. (린치 5·11~15장)<\/td>\n<td>금리 변화가 기업 실적·PER에 주는 영향을 완전히 무시.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>실행 결론<\/h4>\n<p>[추론] 코스톨라니의 금리·달걀 프레임은 매수/매도 버튼이 아니다. 그것은 신규 매수 허들, 현금 사용 속도, 레버리지 허용 여부, 포지션 집중도를 조절하는 온도계다.<\/p>\n<ul>\n<li>금리 하락은 주식에 우호적일 수 있지만, 이미 가격에 반영되었는지 확인해야 한다. (코스톨라니 7장, 막스 04장)<\/li>\n<li>금리 하락의 원인이 경기 붕괴라면 유동성 호재와 실적 악재가 동시에 존재할 수 있다. [추론] (코스톨라니 7장, 막스 15장)<\/li>\n<li>시장이 뜨거우면 신규 매수 허들을 올리고, 레버리지와 집중을 줄인다. (막스 15·17장, 그레이엄 8장)<\/li>\n<li>시장이 차가우면 현금과 후보군을 사용하되, 가치와 생존성을 더 엄격히 확인한다. (막스 11~13·17장, 그레이엄 20장)<\/li>\n<\/ul>\n<h4>판정<\/h4>\n<p>코스톨라니는 예측가로 쓰면 위험하고, 관찰자로 쓰면 강력하다. 막스는 이 관찰을 실행 규율로 번역한다. 그레이엄은 가격 규율을, 린치는 기업 검증을 붙인다.<\/p>\n<hr />\n<h3>4-3. 자산배분: 그레이엄 50:50, 보글 생애주기, 린치 주식 중심, 하우절 밤잠, 막스 방어투자<\/h3>\n<h4>전선<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>저자<\/th>\n<th>자산배분 관점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>그레이엄<\/td>\n<td>방어적 투자자는 우량채권과 우량주를 균형 있게 보유한다. 50:50은 기준점이며, 과열·침체에 따라 범위 안에서 조절한다. (그레이엄 4장)<\/td>\n<\/tr>\n<tr>\n<td>보글<\/td>\n<td>주식·채권 인덱스와 생애주기 자산배분을 중시한다. 낮은 비용과 단순성을 우선한다. (보글 14·18~20장)<\/td>\n<\/tr>\n<tr>\n<td>린치<\/td>\n<td>장기적으로 주식의 성장성을 강조하지만, 12개월~2·3년 내 필요한 돈은 주식에 넣지 말라고 한다. (린치 밀레니엄판 서문, 린치 4장)<\/td>\n<\/tr>\n<tr>\n<td>하우절<\/td>\n<td>수학적으로 최적보다 밤잠을 잘 수 있는 합리적 전략이 낫다. (하우절 11장)<\/td>\n<\/tr>\n<tr>\n<td>막스<\/td>\n<td>시장온도와 리스크 보상에 따라 공격/방어 강도를 조절한다. (막스 15·17장)<\/td>\n<\/tr>\n<tr>\n<td>코스톨라니<\/td>\n<td>주식은 핵심 투자수단이지만 채권·금리·돈의 흐름도 중요하다. (코스톨라니 3·7장)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>실제 충돌의 핵심<\/h4>\n<p>이 충돌은 “정답 비중”의 충돌이 아니라 “비중을 정하는 기준”의 충돌이다.<\/p>\n<ul>\n<li>그레이엄의 50:50은 최적화된 수익률 공식이 아니라 감정 폭주를 막는 기준점이다. (그레이엄 4장)<\/li>\n<li>보글의 자산배분은 시장 예측보다 지속 가능한 포트폴리오 구조를 중시한다. (보글 18~20장)<\/li>\n<li>린치의 주식 중심성은 장기자금이라는 전제가 붙는다. 12개월 뒤 학비·결혼비용으로 쓸 돈은 주식에 넣지 말라고 한다. (린치 밀레니엄판 서문, 린치 4장)<\/li>\n<li>하우절의 밤잠 기준은 숫자 최적화보다 행동 지속성을 우선한다. (하우절 11장)<\/li>\n<li>막스의 방어투자는 과열기에 큰 손실을 줄이고, 공포기에 기회를 잡을 수 있게 하는 동적 강도 조절이다. (막스 15·17장)<\/li>\n<\/ul>\n<h4>통합 자산배분 질문 5개<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>질문<\/th>\n<th>연결 저자<\/th>\n<th>판단 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이 돈은 언제 필요한가?<\/td>\n<td>린치, 보글, 하우절<\/td>\n<td>12개월~3년 내 필요 자금은 위험자산에서 분리. (린치 4장, 보글 18~19장, 하우절 10·13장)<\/td>\n<\/tr>\n<tr>\n<td>하락장에서 나는 실제로 무엇을 할 사람인가?<\/td>\n<td>하우절, 그레이엄<\/td>\n<td>이론적 위험성향보다 과거 행동과 밤잠 기준. (하우절 1·11장, 그레이엄 4장)<\/td>\n<\/tr>\n<tr>\n<td>시장온도는 어떤가?<\/td>\n<td>막스, 코스톨라니, 그레이엄<\/td>\n<td>뜨거우면 방어 강화, 차가우면 선별적 공격. (막스 15·17장, 코스톨라니 8장, 그레이엄 8장)<\/td>\n<\/tr>\n<tr>\n<td>비용·세금·계좌 구조는 어떤가?<\/td>\n<td>보글<\/td>\n<td>같은 자산배분도 계좌와 비용에 따라 순수익이 달라진다. (보글 4~8·18~20장)<\/td>\n<\/tr>\n<tr>\n<td>내 초과수익 우위는 존재하는가?<\/td>\n<td>린치, 막스, 보글<\/td>\n<td>우위가 없으면 개별주 비중을 줄이고 전체시장 비중을 높인다. (린치 6~15장, 막스 01~02장, 보글 10~13장)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>실행 결론<\/h4>\n<p>[추론] 자산배분의 순서는 다음이다.<\/p>\n<ol>\n<li>생활비·비상금·단기자금 분리.<\/li>\n<li>장기자금의 저비용 분산 포트폴리오 구축.<\/li>\n<li>감정적으로 유지 가능한 주식/채권/현금 비중 설정.<\/li>\n<li>시장온도에 따라 신규 매수 허들과 리밸런싱 속도 조절.<\/li>\n<li>개별주 위성 비중은 검증된 우위와 생존 가능성으로 제한.<\/li>\n<\/ol>\n<p>공격적 투자자는 주식 비중이 높은 사람이 아니라, 하락장에도 분석·현금·기질·시간을 유지할 수 있는 사람이다. (그레이엄 7·15장, 막스 17장, 코스톨라니 8장)<\/p>\n<hr />\n<h3>4-4. 린치 유형별 매도 vs 보글 장기보유 vs 코스톨라니 국면 전환 vs 막스 시장온도<\/h3>\n<h4>전선<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>관점<\/th>\n<th>매도 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>린치<\/td>\n<td>유형별 스토리 훼손, 과열, 성장 둔화, 회복 완료, 자산가치 실현. (린치 14·17장)<\/td>\n<\/tr>\n<tr>\n<td>보글<\/td>\n<td>낮은 비용으로 전체시장을 오래 보유하라. 빈번한 매매는 수익을 갉아먹는다. (보글 1·13·20장)<\/td>\n<\/tr>\n<tr>\n<td>코스톨라니<\/td>\n<td>손바뀜, 대중 참여, 국면 변화, 과장국면을 관찰하라. (코스톨라니 5·8장)<\/td>\n<\/tr>\n<tr>\n<td>막스<\/td>\n<td>가격-가치 관계와 리스크 보상, 시장온도에 따라 공격/방어를 조절하라. (막스 04·15·17장)<\/td>\n<\/tr>\n<tr>\n<td>그레이엄<\/td>\n<td>Mr. Market의 가격 제안을 이용하되 휘둘리지 말라. (그레이엄 8장)<\/td>\n<\/tr>\n<tr>\n<td>하우절<\/td>\n<td>다른 게임의 신호에 설득되지 말라. 변동성은 벌금이 아니라 수수료다. (하우절 15~16장)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>실제 충돌의 핵심<\/h4>\n<p>매도에는 두 종류가 있다.<\/p>\n<ol>\n<li>소유권 자체를 팔아야 하는 매도. 개별 기업의 투자 가설이 훼손되었거나, 가격이 가치 대비 과도해졌거나, 리스크 보상이 사라진 경우다. (린치 17장, 그레이엄 20장, 막스 04장)<\/li>\n<li>포트폴리오의 강도를 조절하는 매도. 시장온도가 높아져 기대수익률이 낮고 좌측 꼬리 리스크가 커질 때, 전체 위험 노출을 줄이는 경우다. (막스 15·17장, 코스톨라니 8장, 그레이엄 8장)<\/li>\n<\/ol>\n<p>보글의 장기보유는 첫 번째 매도 판단이 필요 없는 “시장 전체 소유”에 가장 잘 맞는다. 그러나 개별주를 보유할 때 보글식 장기보유를 그대로 적용하면, 훼손된 기업을 영구 보유하는 오류가 생긴다. (보글 13·20장, 린치 17장)<\/p>\n<h4>대상별 매도 기준<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>보유 대상<\/th>\n<th>기본 매도 기준<\/th>\n<th>관련 저자<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전체시장 인덱스 코어<\/td>\n<td>자산배분·생활자금·세금·은퇴 현금흐름 변화가 아니면 매도 최소화<\/td>\n<td>보글 13·18~20장, 하우절 11·19장<\/td>\n<\/tr>\n<tr>\n<td>개별 우량주<\/td>\n<td>이익선·PER·성장 둔화·경쟁우위 변화·과열 여부<\/td>\n<td>린치 10·14·17장, 그레이엄 13~14장<\/td>\n<\/tr>\n<tr>\n<td>가치주·염가주<\/td>\n<td>가치 수렴, 안전마진 축소, 가치훼손, 자본배분 악화<\/td>\n<td>그레이엄 15·20장, 막스 04·12장<\/td>\n<\/tr>\n<tr>\n<td>회생주·자산주<\/td>\n<td>회생 완료, 자산가치 실현, 부채 재악화, 촉매 소멸<\/td>\n<td>린치 15·17장, 그레이엄 15장<\/td>\n<\/tr>\n<tr>\n<td>고성장주<\/td>\n<td>성장 공식 훼손, 확장 여지 감소, 과열 PER, 기관 과밀<\/td>\n<td>린치 7·11·15·17장, 막스 04장<\/td>\n<\/tr>\n<tr>\n<td>전체 위험 노출<\/td>\n<td>시장온도 과열, 리스크 프리미엄 축소, 레버리지 확대, FOMO<\/td>\n<td>막스 15·17장, 코스톨라니 7~8장, 그레이엄 8장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>실행 결론<\/h4>\n<p>[추론] 인덱스는 보글식으로 오래 보유한다. 단, 자산배분 변화와 생활자금 필요는 예외다. (보글 13·18~20장)<\/p>\n<p>개별주는 린치식으로 보유 중 스토리를 재확인하고, 유형별 매도 기준을 적용한다. (린치 14·17장)<\/p>\n<p>시장 전체가 과열되면 막스·코스톨라니식으로 신규 매수 허들을 높이고 위험 노출을 낮춘다. 단, 이것은 시장 예측이 아니라 리스크 보상 변화에 대한 조절이다. (막스 15·17장, 코스톨라니 8장)<\/p>\n<hr />\n<h3>4-5. 보글의 미국 중심 주장 vs 한국 투자자 관점<\/h3>\n<h4>전선<\/h4>\n<p>보글의 원전적 맥락은 미국 투자자에게 강하다. 미국 시장은 거대하고, 달러 생활비와 달러 자산이 일치하며, 미국 대기업은 글로벌 매출 노출을 가진다. 그러나 한국 투자자는 원화 생활비, 환율, 국내외 세금, 계좌 구조, 연금저축·IRP·ISA, 국내 기업 지배구조, 국내시장 규모 문제를 별도로 고려해야 한다. [현대 적용] (보글 4·8·13·18~20장, 하우절 11·16장)<\/p>\n<h4>통합 판정<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>보글 원칙<\/th>\n<th>한국식 재해석<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>시장 전체를 사라. (보글 13장)<\/td>\n<td>“미국 전체”가 아니라 “내 생활통화와 장기 목표에 맞는 글로벌 소유권”을 정의한다.<\/td>\n<\/tr>\n<tr>\n<td>비용을 최소화하라. (보글 4~5장)<\/td>\n<td>TER만 보지 말고 환전 스프레드, 배당 원천징수, 양도세, 금융소득, 계좌 과세를 함께 본다.<\/td>\n<\/tr>\n<tr>\n<td>오래 보유하라. (보글 20장)<\/td>\n<td>장기 보유가 환리스크를 제거하지 않는다. 원화 지출 계획과 함께 설계한다.<\/td>\n<\/tr>\n<tr>\n<td>ETF도 괜찮다. (보글 15장)<\/td>\n<td>레버리지·인버스·테마·단일종목 ETF는 보글식 인덱스가 아니라 거래 도구다.<\/td>\n<\/tr>\n<tr>\n<td>자산배분하라. (보글 18~19장)<\/td>\n<td>은퇴자는 원화 인출, 세금, 건강보험료, 연금계좌 규칙까지 고려한다.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>다른 저자와의 연결<\/h4>\n<ul>\n<li>그레이엄: 한국 개별주에 그레이엄식 기준을 적용할 때 PER/PBR, 배당기록, 재무건전성 수치를 기계적으로 쓰지 말고 산업·회계·지배구조 차이를 반영한다. [현대 적용] (그레이엄 5·13~14장)<\/li>\n<li>린치: 한국 투자자는 생활·업무 현장에서 국내 기업 정보우위를 가질 수 있지만, 지배구조·유동성·단일 고객·계열 거래를 더 엄격히 봐야 한다. [현대 적용] (린치 6·12~15장)<\/li>\n<li>하우절: 원화 생활비와 달러 자산의 변동성은 심리적 체감 손실을 키울 수 있다. 밤잠 기준이 중요하다. (하우절 11·16장)<\/li>\n<li>막스: 한국 시장도 글로벌 유동성, 달러금리, 산업 사이클, 개인 레버리지에 영향을 받으므로 시장온도 점검이 필요하다. [현대 적용] (막스 15·18장)<\/li>\n<li>코스톨라니: 돈+심리 프레임은 한국의 개인투자자 쏠림, 신용잔고, 테마 확산에도 적용 가능하다. 단, 일화가 아니라 프레임워크 중심으로만 쓴다. [현대 적용] (코스톨라니 7~8장)<\/li>\n<\/ul>\n<hr />\n<h3>4-6. 리스크 정의의 차이<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>저자<\/th>\n<th>리스크 정의<\/th>\n<th>장점<\/th>\n<th>오용 위험<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>그레이엄<\/td>\n<td>안전마진 부족, 원금 안전 훼손. (1·20장)<\/td>\n<td>가격과 가치에 기반한 실전성<\/td>\n<td>가치추정이 틀리면 안전마진도 착시<\/td>\n<\/tr>\n<tr>\n<td>하우절<\/td>\n<td>생존 실패, 레버리지, 충분함 부재, 다른 게임 추종. (3·5·13·16장)<\/td>\n<td>인간 행동과 재무생활 전체 포함<\/td>\n<td>지나치게 보수적으로 읽으면 성장 기회 회피<\/td>\n<\/tr>\n<tr>\n<td>코스톨라니<\/td>\n<td>빚, 군중심리, 돈 없는 확신, 손바뀜. (1·2·8장)<\/td>\n<td>시장 심리와 유동성의 위험 포착<\/td>\n<td>달걀을 예측 공식으로 오용할 위험<\/td>\n<\/tr>\n<tr>\n<td>보글<\/td>\n<td>시장위험은 남기되 종목·매니저·비용·세금·감정 위험 제거. (0·4~8·13장)<\/td>\n<td>대다수 투자자에게 실행성 높음<\/td>\n<td>시장 전체 고평가·국가 집중 리스크는 남음<\/td>\n<\/tr>\n<tr>\n<td>린치<\/td>\n<td>모르는 기업, 나쁜 가격, 부채, 유형 오판, 스토리 훼손. (4·7·9·13·15·17장)<\/td>\n<td>개별주 실무 점검에 강함<\/td>\n<td>개인의 “안다”는 착각이 위험<\/td>\n<\/tr>\n<tr>\n<td>막스<\/td>\n<td>변동성보다 영구 손실, 보이지 않는 리스크, 과열기 축적. (05~07·18장)<\/td>\n<td>리스크의 비가시성과 주기성 설명<\/td>\n<td>과도한 리스크 인식이 실행 마비로 이어질 수 있음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>통합 정의<\/h4>\n<p>[추론] 리스크란 단기 변동성이 아니라, “내가 계획한 복리를 중단시키는 사건·구조·행동의 총합”이다.<\/p>\n<p>다만 “변동성은 리스크가 아니다”라고 단순화해서는 안 된다. 막스식 정의로는 변동성 자체가 영구 손실은 아니지만, 보글·하우절·그레이엄식 실행 체계에서는 변동성이 행동오류를 유발하는 경로 위험이다. 즉 변동성은 독립적 원인이라기보다 레버리지, 단기 필요자금, 밤잠 손상, 리밸런싱 실패와 결합할 때 복리 중단 위험으로 바뀐다. (막스 05장, 하우절 11·15장, 보글 18~20장, 그레이엄 4·8장)<\/p>\n<p>리스크 구성 요소:<\/p>\n<ul>\n<li>가격 리스크: 가치보다 비싸게 사는 것. (그레이엄 20장, 막스 04장, 린치 10장)<\/li>\n<li>행동 리스크: 공포·탐욕·비교·FOMO·본전 심리. (하우절 3·15~18장, 막스 10장, 코스톨라니 8장)<\/li>\n<li>구조 리스크: 레버리지, 강제매도, 유동성 부족, 세금·비용, 단일 고객, 부채. (막스 07·18장, 보글 4~8장, 린치 9·13장)<\/li>\n<li>지식 리스크: 모르는 기업, 모르는 상품, 모르는 게임. (린치 4·12장, 하우절 16장, 그레이엄 1장)<\/li>\n<li>주기 리스크: 편안한 시기에 쌓여 불황에 드러나는 위험. (막스 06·15장, 코스톨라니 7~8장)<\/li>\n<li>시간 리스크: 단기 필요자금을 변동성 자산에 넣는 것. (린치 4장, 하우절 10·13장, 보글 18~19장)<\/li>\n<
