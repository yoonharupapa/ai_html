 구분했는지<\/li>\n<li>구분함. 각 장에 <code>[보강 | 그레이엄 본문]<\/code>과 <code>[츠바이크 주석]<\/code>을 분리함.<\/li>\n<li>후대 해석을 그레이엄 원 주장처럼 쓰지 않았는지<\/li>\n<li>구분함. <code>[후대 연구]<\/code>, <code>[현대 적용]<\/code>, <code>[추론]<\/code>, <code>[원서 대조 필요]<\/code>를 명시함.<\/li>\n<li>공개 질문 / 한계<\/li>\n<li>웹에서 원서 본문 페이지를 직접 전면 대조하지 못한 부분은 추정으로 채우지 않고 남겨두었음. 특히 17~18장의 전체 사례명, 16장의 세부 논거는 최종 원문 대조가 필요함.<\/li>\n<\/ul>","text":"기존 불릿 보존 여부 보존함. 기존 frontmatter, 제목, 장 헤더, 기존 불릿, 관련 노트 섹션을 유지했고, 누락 장만 신규 삽입함. 신규 작성한 장 목록 9장, 14장, 16장, 17장, 18장, 19장 출처가 붙은 수치 목록 채권/주식 50:50 및 25~75 해석 최근 20년 연속 배당 최근 10년 적자 없음 EPS 10년 성장률 33% 이상 PER 15 이하 PBR 1.5 이하 PER×PBR 22.5 이하 NCAV 정의 및 실증 요약 성장주 평가 공식 V = EPS × (8.5 + 2g) 의 맥락과 한계 출처 확인이 필요한 항목 목록 16장 그레이엄 본문의 경고 문장 세부 17장 네 번째 사례 기업명 18장 8쌍 전체 기업명 10~30개 보유종목 수의 원서 직접 문구 그레이엄 본문과 츠바이크 주석을 구분했는지 구분함. 각 장에 [보강 | 그레이엄 본문] 과 [츠바이크 주석] 을 분리함. 후대 해석을 그레이엄 원 주장처럼 쓰지 않았는지 구분함. [후대 연구] , [현대 적용] , [추론] , [원서 대조 필요] 를 명시함. 공개 질문 / 한계 웹에서 원서 본문 페이지를 직접 전면 대조하지 못한 부분은 추정으로 채우지 않고 남겨두었음. 특히 17~18장의 전체 사례명, 16장의 세부 논거는 최종 원문 대조가 필요함."},{"i":28,"title":"추가 검증 반영 내역","html":"<ul>\n<li>기준 파일: <code>01_현명한투자자_deepresearch_v1.md<\/code><\/li>\n<li>추가 검증 파일: <code>01_현명한투자자_deepresearch_v1_add.md<\/code><\/li>\n<li>반영 방식: 기존 frontmatter, 제목, 장 헤더, 기존 불릿을 보존하고, 검증 패치는 단정 완화·불확실성 유지·보수적 대체 문단 중심으로 반영했다.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>위치<\/th>\n<th>반영 내용<\/th>\n<th>최종 처리<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5장 방어적 투자자의 주식 투자<\/td>\n<td><code>10~30개<\/code> 분산 문구가 원문 직문인지 후대 수량화인지 불확실<\/td>\n<td><code>10~30개<\/code>는 잠정 채택, <code>[최종 원서 대조 필요]<\/code> 유지<\/td>\n<\/tr>\n<tr>\n<td>16장 전환증권과 신주인수권<\/td>\n<td>전환증권·워런트를 “채권 안전 + 주식 상방”으로 단정하는 표현 완화<\/td>\n<td>발행사 건전성, 전환가, 콜조항, 희석효과 중심으로 재정리. 세부 원문 어조는 <code>[최종 원서 대조 필요]<\/code><\/td>\n<\/tr>\n<tr>\n<td>17장 네 가지 기업 사례<\/td>\n<td>Penn Central, Ling-Temco-Vought, NVF는 보수적으로 활용 가능하나 네 번째 기업명 미확정<\/td>\n<td>네 번째 사례 기업명은 추정하지 않고 <code>[최종 원서 대조 필요]<\/code> 유지<\/td>\n<\/tr>\n<tr>\n<td>18장 8쌍 기업 비교<\/td>\n<td>8쌍 전체 기업명과 개별 교훈 미확정<\/td>\n<td>비교 사례장의 일반 교훈만 사용하고, 실명·개별 교훈은 <code>[최종 원서 대조 필요]<\/code> 유지<\/td>\n<\/tr>\n<tr>\n<td>기타 잔여 항목<\/td>\n<td>2·6·9·10·14·15장 및 개념사전 일부<\/td>\n<td>의미상 큰 오류는 보이지 않으나 단정형 확대 보강은 피하고 <code>[최종 원서 대조 필요]<\/code> 유지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>통합 Run 사용 메모<\/h3>\n<ul>\n<li>Run 7 통합 문서에서는 16~18장의 세부 기업명·원문 어조를 그레이엄의 확정 주장처럼 쓰지 말 것.<\/li>\n<li>그레이엄 파트의 핵심 근거는 투자/투기 구분, 방어적 투자자 기준, Mr. Market, 안전마진, 가격과 가치 구분, 비용·기질·분산 원칙으로 삼는 것이 안전하다.<\/li>\n<\/ul>","text":"기준 파일: 01_현명한투자자_deepresearch_v1.md 추가 검증 파일: 01_현명한투자자_deepresearch_v1_add.md 반영 방식: 기존 frontmatter, 제목, 장 헤더, 기존 불릿을 보존하고, 검증 패치는 단정 완화·불확실성 유지·보수적 대체 문단 중심으로 반영했다. 위치 반영 내용 최종 처리 5장 방어적 투자자의 주식 투자 10~30개 분산 문구가 원문 직문인지 후대 수량화인지 불확실 10~30개 는 잠정 채택, [최종 원서 대조 필요] 유지 16장 전환증권과 신주인수권 전환증권·워런트를 “채권 안전 + 주식 상방”으로 단정하는 표현 완화 발행사 건전성, 전환가, 콜조항, 희석효과 중심으로 재정리. 세부 원문 어조는 [최종 원서 대조 필요] 17장 네 가지 기업 사례 Penn Central, Ling-Temco-Vought, NVF는 보수적으로 활용 가능하나 네 번째 기업명 미확정 네 번째 사례 기업명은 추정하지 않고 [최종 원서 대조 필요] 유지 18장 8쌍 기업 비교 8쌍 전체 기업명과 개별 교훈 미확정 비교 사례장의 일반 교훈만 사용하고, 실명·개별 교훈은 [최종 원서 대조 필요] 유지 기타 잔여 항목 2·6·9·10·14·15장 및 개념사전 일부 의미상 큰 오류는 보이지 않으나 단정형 확대 보강은 피하고 [최종 원서 대조 필요] 유지 통합 Run 사용 메모 Run 7 통합 문서에서는 16~18장의 세부 기업명·원문 어조를 그레이엄의 확정 주장처럼 쓰지 말 것. 그레이엄 파트의 핵심 근거는 투자/투기 구분, 방어적 투자자 기준, Mr. Market, 안전마진, 가격과 가치 구분, 비용·기질·분산 원칙으로 삼는 것이 안전하다."}]},{"id":"02","title":"[독서] 돈의 심리학","short":"돈의 심리학","author":"하우절","chapters":[{"i":0,"title":"문서 안내","html":"<hr />\n<p>title: \"[독서] 돈의 심리학\"\naliases: [\"돈의 심리학\", \"The Psychology of Money\", \"모건 하우절\"]\ntype: book-note-personal\ncategory: 독서\nauthor: 모건 하우절\ndate_read: 2024-11-09\ndate: 2024-11-09\nstatus: complete\ntags:\n  - 독서\n  - 투자\n  - 심리\n  - 복리\n  - 모건하우절<\/p>\n<hr />\n<p><strong>읽은 날짜:<\/strong> 2024.11.09<\/p>\n<p>기준선은 사용자가 업로드한 독서 노트를 그대로 보존했고, 아래 추가 블록만 장별로 증설했다. 기존 불릿은 원문을 삭제·요약·재배열하지 않았다.<\/p>","text":"title: \"[독서] 돈의 심리학\" aliases: [\"돈의 심리학\", \"The Psychology of Money\", \"모건 하우절\"] type: book-note-personal category: 독서 author: 모건 하우절 date_read: 2024-11-09 date: 2024-11-09 status: complete tags: - 독서 - 투자 - 심리 - 복리 - 모건하우절 읽은 날짜: 2024.11.09 기준선은 사용자가 업로드한 독서 노트를 그대로 보존했고, 아래 추가 블록만 장별로 증설했다. 기존 불릿은 원문을 삭제·요약·재배열하지 않았다."},{"i":1,"title":"0. 서문","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>금융은 소프트 스킬이고 아는 것보다 행동이 더 중요<\/li>\n<li>역사가 반복되는 것이 아니다. 사람이 반복 하는 것이다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 로널드 리드는 버몬트의 주유소 직원·청소부로 일하며 조용히 배당주 중심의 장기투자를 이어 갔고, 2014년 사망 후 약 800만 달러의 유산이 드러났다. 반면 리처드 퍼스콘 대비 사례는 책과 2차 요약물에 반복 등장하지만, 이번 조사에서는 그의 파산 경위와 수치를 고신뢰 원자료로 끝까지 확인하지 못해 세부는 <code>[불확실] [출처 추가 확인 필요]<\/code>로 둔다. 로널드 리드 쪽 사실관계는 신뢰도 높은 보도로 확인된다.<\/li>\n<li>상황: 리드는 검소하게 살며 투자 결과를 겉으로 거의 드러내지 않았고, 사후 브래틀버러 병원에 480만 달러, 도서관에 120만 달러를 남겼다. 이 대비는 “보이는 지위”와 “행동이 만든 결과”가 다르다는 하우절의 서문 문제의식을 강화한다.<\/li>\n<li>결과: 금융 성과는 고급 학위, 직함, 외형적 성공보다 꾸준함·절제·시간·행동 통제에서 더 크게 갈린다. 이는 책 전체에서 반복되는 “돈 문제는 IQ보다 행동”이라는 프레임의 출발점이다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 금융은 수학 문제이기 전에 행동 문제다. <code>[후대 해석]<\/code> 서문은 독자에게 “누가 똑똑해 보이는가”가 아니라 “누가 오래 살아남는가”를 보라는 기준을 먼저 심어 준다.<\/li>\n<li>출처: TIME, Reuters/2차 종합 전기 자료, 《The Psychology of Money》 개요 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>로널드 리드 추정 유산<\/td>\n<td style=\"text-align: right;\">약 $8M<\/td>\n<td>2014 사망 시점<\/td>\n<td>낮은 소득·낮은 과시와 높은 자산은 동시에 가능<\/td>\n<td>TIME / Reuters 계열 보도<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>브래틀버러 병원 기부<\/td>\n<td style=\"text-align: right;\">$4.8M<\/td>\n<td>2015 공개<\/td>\n<td>“보이는 소비”가 아니라 “축적된 자본”이 지역사회 영향력으로 전환<\/td>\n<td>TIME / Reuters 계열 보도<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>브룩스 도서관 기부<\/td>\n<td style=\"text-align: right;\">$1.2M<\/td>\n<td>2015 공개<\/td>\n<td>무소비 자산이 장기 선택권과 기여로 바뀜<\/td>\n<td>TIME / Reuters 계열 보도<\/td>\n<td>A-B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 위 수치는 로널드 리드 사례를 통해 “외형보다 행동”이라는 서문 메시지를 계량적으로 보여 준다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 서문은 금융 성공을 “지식의 축적”보다 “행동의 반복”으로 설명하는 프롤로그다.<\/li>\n<li><code>[추론]<\/code> 이 프레임이 중요한 이유는 투자 의사결정이 대부분 불완전정보·감정·사회적 비교 속에서 이뤄지기 때문이다. 즉, 아는 것이 많아도 공포·과시·질투를 관리하지 못하면 성과가 무너진다.<\/li>\n<li><code>[후대 해석]<\/code> 서문의 핵심은 “금융문해력”을 무시하라는 뜻이 아니라, 데이터와 모델 위에 행동 통제라는 상위 레이어가 있다는 뜻이다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 저축, 소비, 포트폴리오 전반<\/li>\n<li>행동 체크리스트<\/li>\n<li>성과보다 습관을 점검한다.<\/li>\n<li>보여주는 재무목표보다 유지 가능한 재무행동을 먼저 설계한다.<\/li>\n<li>투자 원칙을 “수익률 목표”가 아니라 “버틸 수 있는 행동 규칙”으로 적는다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“행동이 중요하다”는 말은 데이터와 분석이 불필요하다는 뜻이 아니다.<\/li>\n<li>서문을 잘못 읽으면 “아무렇게나 해도 된다”로 오해할 수 있다. 하우절의 요지는 반대로, 분석 위에 행동 통제가 없으면 분석도 무력해진다는 점이다.<\/li>\n<\/ul>","text":"기존 노트 금융은 소프트 스킬이고 아는 것보다 행동이 더 중요 역사가 반복되는 것이 아니다. 사람이 반복 하는 것이다. [사례] 인물/사건: 로널드 리드는 버몬트의 주유소 직원·청소부로 일하며 조용히 배당주 중심의 장기투자를 이어 갔고, 2014년 사망 후 약 800만 달러의 유산이 드러났다. 반면 리처드 퍼스콘 대비 사례는 책과 2차 요약물에 반복 등장하지만, 이번 조사에서는 그의 파산 경위와 수치를 고신뢰 원자료로 끝까지 확인하지 못해 세부는 [불확실] [출처 추가 확인 필요] 로 둔다. 로널드 리드 쪽 사실관계는 신뢰도 높은 보도로 확인된다. 상황: 리드는 검소하게 살며 투자 결과를 겉으로 거의 드러내지 않았고, 사후 브래틀버러 병원에 480만 달러, 도서관에 120만 달러를 남겼다. 이 대비는 “보이는 지위”와 “행동이 만든 결과”가 다르다는 하우절의 서문 문제의식을 강화한다. 결과: 금융 성과는 고급 학위, 직함, 외형적 성공보다 꾸준함·절제·시간·행동 통제에서 더 크게 갈린다. 이는 책 전체에서 반복되는 “돈 문제는 IQ보다 행동”이라는 프레임의 출발점이다. 이 장의 교훈과 연결: [하우절 본문] 금융은 수학 문제이기 전에 행동 문제다. [후대 해석] 서문은 독자에게 “누가 똑똑해 보이는가”가 아니라 “누가 오래 살아남는가”를 보라는 기준을 먼저 심어 준다. 출처: TIME, Reuters/2차 종합 전기 자료, 《The Psychology of Money》 개요 자료. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 로널드 리드 추정 유산 약 $8M 2014 사망 시점 낮은 소득·낮은 과시와 높은 자산은 동시에 가능 TIME / Reuters 계열 보도 A-B 브래틀버러 병원 기부 $4.8M 2015 공개 “보이는 소비”가 아니라 “축적된 자본”이 지역사회 영향력으로 전환 TIME / Reuters 계열 보도 A-B 브룩스 도서관 기부 $1.2M 2015 공개 무소비 자산이 장기 선택권과 기여로 바뀜 TIME / Reuters 계열 보도 A-B 데이터 주석: 위 수치는 로널드 리드 사례를 통해 “외형보다 행동”이라는 서문 메시지를 계량적으로 보여 준다. [보강 | 논리 전개] [하우절 본문] 서문은 금융 성공을 “지식의 축적”보다 “행동의 반복”으로 설명하는 프롤로그다. [추론] 이 프레임이 중요한 이유는 투자 의사결정이 대부분 불완전정보·감정·사회적 비교 속에서 이뤄지기 때문이다. 즉, 아는 것이 많아도 공포·과시·질투를 관리하지 못하면 성과가 무너진다. [후대 해석] 서문의 핵심은 “금융문해력”을 무시하라는 뜻이 아니라, 데이터와 모델 위에 행동 통제라는 상위 레이어가 있다는 뜻이다. [실전 적용] 적용 영역: 저축, 소비, 포트폴리오 전반 행동 체크리스트 성과보다 습관을 점검한다. 보여주는 재무목표보다 유지 가능한 재무행동을 먼저 설계한다. 투자 원칙을 “수익률 목표”가 아니라 “버틸 수 있는 행동 규칙”으로 적는다. [오해 방지] “행동이 중요하다”는 말은 데이터와 분석이 불필요하다는 뜻이 아니다. 서문을 잘못 읽으면 “아무렇게나 해도 된다”로 오해할 수 있다. 하우절의 요지는 반대로, 분석 위에 행동 통제가 없으면 분석도 무력해진다는 점이다."},{"i":2,"title":"1. 아무도 미치지 않았다 (No one's Crazy)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>겪어 봐야만 이해할 수 있는 교훈도 있다.<\/li>\n<li>개별 투자자의 위험 선호도는 개인의 경험에 좌우되는 것<\/li>\n<li>서로 다른 경험에서 서로 다른 합리성이 나온다<\/li>\n<li>지능도, 교육도 아닌 투자 성향은 순전히 우연에 좌우될 뿐<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[하우절 본문]<\/code> 이 장은 특정 영웅 서사보다 세대별 경험 차이에 초점을 둔다. <code>[데이터]<\/code> 울리케 말멘디어와 동료들의 경험효과 연구는 개인이 겪은 거시경제 충격이 이후 위험인식과 자산선호를 오래 바꾼다고 설명한다.<\/li>\n<li>상황: 높은 인플레이션을 직접 겪은 세대, 대폭락을 직접 본 세대, 장기강세장만 경험한 세대는 같은 자산을 보고도 기대수익·위험을 다르게 해석한다.<\/li>\n<li>결과: 누군가가 과도하게 보수적이거나 지나치게 공격적으로 보이는 이유는 지능 부족이 아니라, 그 사람이 표본으로 삼는 과거가 다르기 때문일 수 있다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 타인의 포트폴리오를 비웃기 전에 그 사람이 어떤 시대를 통과했는지 봐야 한다.<\/li>\n<li>출처: 말멘디어 연구, FT 해설, 역사적 시장 데이터.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>미국 연간 인플레이션<\/td>\n<td style=\"text-align: right;\">11.3%<\/td>\n<td>1979<\/td>\n<td>고인플레이션 경험은 물가·채권·현금 선호를 바꿀 수 있음<\/td>\n<td>미국 경제통계 요약<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>미국 연간 인플레이션<\/td>\n<td style=\"text-align: right;\">13.5%<\/td>\n<td>1980<\/td>\n<td>1970년대 말~1980년대 초 경험 세대의 위험 인식 강화<\/td>\n<td>미국 경제통계 요약<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>S&amp;P 500 최대 낙폭<\/td>\n<td style=\"text-align: right;\">-56.8%<\/td>\n<td>2007~2009<\/td>\n<td>시장 붕괴를 직접 겪은 세대의 주식 회피를 설명하는 강한 경험 표본<\/td>\n<td>S&amp;P 500 역사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>경험효과 연구 표본<\/td>\n<td style=\"text-align: right;\">19,000명+<\/td>\n<td>연구 종합 설명<\/td>\n<td>사람들은 미래의 자신을 과소변화로 가정하고 최근/강한 경험을 과대반영<\/td>\n<td>학술 요약<\/td>\n<td>A-B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 高인플레이션과 대폭락은 단순한 숫자가 아니라 세대별 “정서적 기준점”이 된다. 하우절의 논지는 이 경험 표본이 합리성의 출발점을 바꾼다는 데 있다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 같은 데이터도 사람마다 다르게 읽히는 이유는 “무엇을 정상으로 배웠는가”가 다르기 때문이다.<\/li>\n<li><code>[추론]<\/code> 투자에서 합리성은 보편적 공식을 따르기보다, 개인이 겪은 손실·실업·인플레이션·강세장의 감정 기억 위에서 형성된다. 그래서 남의 포트폴리오를 그대로 복제하면 높은 확률로 중도 이탈이 생긴다.<\/li>\n<li><code>[후대 해석]<\/code> 행동재무에서 경험효과는 리스크 허용도 설문보다 더 설명력이 크다. 실제로 사람은 자신이 살아낸 거시경제를 기준으로 기대를 만든다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 매수, 매도, 포트폴리오, 폭락 대응<\/li>\n<li>행동 체크리스트<\/li>\n<li>내 투자 성향의 기준 사건 3개를 적는다. 예: 외환위기, 2008, 2020.<\/li>\n<li>리스크 허용도는 “이론상”이 아니라 “실제 -30%에서 행동할 수 있나”로 측정한다.<\/li>\n<li>타인의 공격적/보수적 전략을 따라 하기 전에 내 경험 편향을 점검한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 “모두 자기 사정이 있으니 어떤 투자도 다 맞다”는 상대주의가 아니다.<\/li>\n<li>하우절의 핵심은 각자의 맥락을 인정하되, 그 맥락 때문에 생기는 편향을 의식적으로 관리하라는 것이다.<\/li>\n<\/ul>","text":"기존 노트 겪어 봐야만 이해할 수 있는 교훈도 있다. 개별 투자자의 위험 선호도는 개인의 경험에 좌우되는 것 서로 다른 경험에서 서로 다른 합리성이 나온다 지능도, 교육도 아닌 투자 성향은 순전히 우연에 좌우될 뿐 [사례] 인물/사건: [하우절 본문] 이 장은 특정 영웅 서사보다 세대별 경험 차이에 초점을 둔다. [데이터] 울리케 말멘디어와 동료들의 경험효과 연구는 개인이 겪은 거시경제 충격이 이후 위험인식과 자산선호를 오래 바꾼다고 설명한다. 상황: 높은 인플레이션을 직접 겪은 세대, 대폭락을 직접 본 세대, 장기강세장만 경험한 세대는 같은 자산을 보고도 기대수익·위험을 다르게 해석한다. 결과: 누군가가 과도하게 보수적이거나 지나치게 공격적으로 보이는 이유는 지능 부족이 아니라, 그 사람이 표본으로 삼는 과거가 다르기 때문일 수 있다. 이 장의 교훈과 연결: [하우절 본문] 타인의 포트폴리오를 비웃기 전에 그 사람이 어떤 시대를 통과했는지 봐야 한다. 출처: 말멘디어 연구, FT 해설, 역사적 시장 데이터. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 미국 연간 인플레이션 11.3% 1979 고인플레이션 경험은 물가·채권·현금 선호를 바꿀 수 있음 미국 경제통계 요약 B 미국 연간 인플레이션 13.5% 1980 1970년대 말~1980년대 초 경험 세대의 위험 인식 강화 미국 경제통계 요약 B S&amp;P 500 최대 낙폭 -56.8% 2007~2009 시장 붕괴를 직접 겪은 세대의 주식 회피를 설명하는 강한 경험 표본 S&amp;P 500 역사 자료 B 경험효과 연구 표본 19,000명+ 연구 종합 설명 사람들은 미래의 자신을 과소변화로 가정하고 최근/강한 경험을 과대반영 학술 요약 A-B 데이터 주석: 高인플레이션과 대폭락은 단순한 숫자가 아니라 세대별 “정서적 기준점”이 된다. 하우절의 논지는 이 경험 표본이 합리성의 출발점을 바꾼다는 데 있다. [보강 | 논리 전개] [하우절 본문] 같은 데이터도 사람마다 다르게 읽히는 이유는 “무엇을 정상으로 배웠는가”가 다르기 때문이다. [추론] 투자에서 합리성은 보편적 공식을 따르기보다, 개인이 겪은 손실·실업·인플레이션·강세장의 감정 기억 위에서 형성된다. 그래서 남의 포트폴리오를 그대로 복제하면 높은 확률로 중도 이탈이 생긴다. [후대 해석] 행동재무에서 경험효과는 리스크 허용도 설문보다 더 설명력이 크다. 실제로 사람은 자신이 살아낸 거시경제를 기준으로 기대를 만든다. [실전 적용] 적용 영역: 매수, 매도, 포트폴리오, 폭락 대응 행동 체크리스트 내 투자 성향의 기준 사건 3개를 적는다. 예: 외환위기, 2008, 2020. 리스크 허용도는 “이론상”이 아니라 “실제 -30%에서 행동할 수 있나”로 측정한다. 타인의 공격적/보수적 전략을 따라 하기 전에 내 경험 편향을 점검한다. [오해 방지] 이 장은 “모두 자기 사정이 있으니 어떤 투자도 다 맞다”는 상대주의가 아니다. 하우절의 핵심은 각자의 맥락을 인정하되, 그 맥락 때문에 생기는 편향을 의식적으로 관리하라는 것이다."},{"i":3,"title":"2. 어디까지가 행운이고, 어디부터가 리스크일까 (Luck & Risk)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>겉으로 보이는 것만큼 좋은 경우도, 나쁜 경우도 결코 없다.<\/li>\n<li>성공은 온전히 실력이 아니고 실패도 무능의 증거가 아니다.<\/li>\n<li>특정 개인이나 사례보다 더 큰 패턴에 주목하라.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 빌 게이츠와 켄트 에번스. 게이츠는 레이크사이드 시절 가장 가까운 친구이자 첫 협업 파트너였던 켄트 에번스를 잃었고, 이후 폴 앨런과 더 깊게 연결되며 다른 경로를 탔다. 게이츠 본인도 에번스가 살아 있었다면 자신의 진로와 회사의 초기 형태가 달라졌을 수 있다고 회고했다.<\/li>\n<li>상황: 둘 다 비범한 재능을 가졌지만, 한 사람은 산악사고로 사라졌고 다른 사람은 역사상 드문 컴퓨터 혁명의 한복판에 남았다. 이 차이는 실력만으로 설명되지 않는다.<\/li>\n<li>결과: 우리는 성공담을 볼 때 능력을 과대평가하고, 실패담을 볼 때 무능을 과대추정한다. 하지만 큰 성과는 실력과 우연의 곱이고, 실패도 실수와 악운의 곱일 때가 많다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 한 개인을 영웅·패자로 단정하기보다, 비슷한 조건의 여러 사례에서 반복되는 패턴을 보라는 장이다.<\/li>\n<li>출처: 빌 게이츠 전기/회고 인터뷰, 폴 앨런·게이츠 초기 이력 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<ul>\n<li><code>[데이터]<\/code> 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 성공 사례를 교과서처럼 복사하려는 태도는 위험하다. 성공자에게조차 복제 불가능한 우연이 섞여 있기 때문이다.<\/li>\n<li><code>[추론]<\/code> 투자에서도 특정 스타 매니저 한 명을 따라 하기보다, 장기적으로 여러 사람에게 재현된 원칙—분산, 비용 통제, 생존, 시간—을 따르는 편이 합리적이다.<\/li>\n<li><code>[후대 해석]<\/code> 이 장은 겸손을 요구한다. 내 수익이 실력만이 아니듯, 타인의 실패도 전부 인격적 결함이 아닐 수 있다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 비교심리, 매니저 평가<\/li>\n<li>행동 체크리스트<\/li>\n<li>한 명의 대가보다 장기 재현 원칙을 우선한다.<\/li>\n<li>1년 성과보다 10년 생존 기록을 본다.<\/li>\n<li>성공 사례를 볼 때 “여기에 우연이 얼마나 섞였나?”를 먼저 묻는다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 “운이 전부다”라는 허무주의가 아니다.<\/li>\n<li>하우절의 요지는 실력을 무시하라는 것이 아니라, 결과를 과도하게 도덕화하거나 확신형으로 해석하지 말라는 것이다.<\/li>\n<\/ul>","text":"기존 노트 겉으로 보이는 것만큼 좋은 경우도, 나쁜 경우도 결코 없다. 성공은 온전히 실력이 아니고 실패도 무능의 증거가 아니다. 특정 개인이나 사례보다 더 큰 패턴에 주목하라. [사례] 인물/사건: 빌 게이츠와 켄트 에번스. 게이츠는 레이크사이드 시절 가장 가까운 친구이자 첫 협업 파트너였던 켄트 에번스를 잃었고, 이후 폴 앨런과 더 깊게 연결되며 다른 경로를 탔다. 게이츠 본인도 에번스가 살아 있었다면 자신의 진로와 회사의 초기 형태가 달라졌을 수 있다고 회고했다. 상황: 둘 다 비범한 재능을 가졌지만, 한 사람은 산악사고로 사라졌고 다른 사람은 역사상 드문 컴퓨터 혁명의 한복판에 남았다. 이 차이는 실력만으로 설명되지 않는다. 결과: 우리는 성공담을 볼 때 능력을 과대평가하고, 실패담을 볼 때 무능을 과대추정한다. 하지만 큰 성과는 실력과 우연의 곱이고, 실패도 실수와 악운의 곱일 때가 많다. 이 장의 교훈과 연결: [하우절 본문] 한 개인을 영웅·패자로 단정하기보다, 비슷한 조건의 여러 사례에서 반복되는 패턴을 보라는 장이다. 출처: 빌 게이츠 전기/회고 인터뷰, 폴 앨런·게이츠 초기 이력 자료. [데이터] [데이터] 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다. [보강 | 논리 전개] [하우절 본문] 성공 사례를 교과서처럼 복사하려는 태도는 위험하다. 성공자에게조차 복제 불가능한 우연이 섞여 있기 때문이다. [추론] 투자에서도 특정 스타 매니저 한 명을 따라 하기보다, 장기적으로 여러 사람에게 재현된 원칙—분산, 비용 통제, 생존, 시간—을 따르는 편이 합리적이다. [후대 해석] 이 장은 겸손을 요구한다. 내 수익이 실력만이 아니듯, 타인의 실패도 전부 인격적 결함이 아닐 수 있다. [실전 적용] 적용 영역: 포트폴리오, 비교심리, 매니저 평가 행동 체크리스트 한 명의 대가보다 장기 재현 원칙을 우선한다. 1년 성과보다 10년 생존 기록을 본다. 성공 사례를 볼 때 “여기에 우연이 얼마나 섞였나?”를 먼저 묻는다. [오해 방지] 이 장은 “운이 전부다”라는 허무주의가 아니다. 하우절의 요지는 실력을 무시하라는 것이 아니라, 결과를 과도하게 도덕화하거나 확신형으로 해석하지 말라는 것이다."},{"i":4,"title":"3. 결코 채워지지 않는 것 (Never Enough)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>필요하지 않은 것을 위해 내가 가진 것, 필요로 하는 것을 걸 이유는 없다<\/li>\n<li>가장 어려운 것은 멈출 수 있는 골대를 세우는 일<\/li>\n<li>문제는 남과 비교하는 것<\/li>\n<li>라스베이거스에서 이기는 유일한 방법은 들어오자마자 나가는 것<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 라잣 굽타는 맥킨지 글로벌 수장과 유수 기관 이사를 지낸 인물이었지만 2012년 내부자거래 사건으로 유죄 평결을 받고 징역 2년과 벌금 500만 달러를 선고받았다. 버니 메이도프는 2009년 150년형을 선고받았고, 이후 검증된 직접 피해 손실 기준으로 약 175억 달러 중 2025년까지 152.6억 달러가 회수됐다.<\/li>\n<li>상황: 두 사례 모두 “이미 많은 것을 가진 사람”이 더 얻으려다 기존의 평판·자산·자유를 잃는 구조를 보여 준다. 하우절이 말하는 “충분함”의 부재가 실제로 어떻게 파국으로 이어지는지를 극단적으로 드러낸다.<\/li>\n<li>결과: 더 큰 수익 그 자체보다, 비교심리와 과시욕이 의사결정을 오염시키는 순간 파산·범죄·사회적 몰락 가능성이 커진다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 이미 필요한 만큼 가진 상태에서 더 가지려는 욕심이 가장 비싼 리스크다.<\/li>\n<li>출처: Gupta 사건 자료, Madoff 사건·회수금 보도.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>라잣 굽타 형량<\/td>\n<td style=\"text-align: right;\">2년<\/td>\n<td>2012<\/td>\n<td>지위가 높아도 “더 원함”이 법적 몰락으로 연결될 수 있음<\/td>\n<td>사건 자료<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>라잣 굽타 벌금<\/td>\n<td style=\"text-align: right;\">$5M<\/td>\n<td>2012<\/td>\n<td>탐욕의 직접 비용<\/td>\n<td>사건 자료<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>메이도프 형량<\/td>\n<td style=\"text-align: right;\">150년<\/td>\n<td>2009<\/td>\n<td>“충분함 모름”의 극단적 결과<\/td>\n<td>사건 자료<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>메이도프 직접 피해 검증 손실<\/td>\n<td style=\"text-align: right;\">약 $17.5B<\/td>\n<td>2025 기준 회수 공시<\/td>\n<td>허구 수익 추구가 실현 손실로 귀결<\/td>\n<td>Reuters<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>메이도프 회수액<\/td>\n<td style=\"text-align: right;\">$15.26B<\/td>\n<td>2025<\/td>\n<td>회수는 가능했지만 원래의 신뢰와 시간은 복구 불가<\/td>\n<td>Reuters<\/td>\n<td>A<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 이 장의 숫자는 “얼마나 많이 잃었나”보다, 이미 사회적·재무적 성공을 이룬 사람도 ‘충분함의 부재’로 모든 것을 걸 수 있다는 점을 보여 준다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 하우절의 핵심은 탐욕 비판이 아니라 기준점 부재 비판이다.<\/li>\n<li><code>[추론]<\/code> 돈의 심리학에서 가장 위험한 상태는 가난이 아니라 “더 가져야만 내가 괜찮아진다”는 내면 규칙이다. 이 규칙은 레버리지, 무리한 집중, 도덕적 타협을 정당화한다.<\/li>\n<li><code>[후대 해석]<\/code> “Enough”는 수익률 목표가 아니라 중단 규칙이다. 언제 안 할 것인지, 얼마를 잃으면 멈출 것인지가 먼저다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 매수, 매도, 비교심리, 레버리지<\/li>\n<li>행동 체크리스트<\/li>\n<li>“내게 충분한 자산 수준”과 “추가 리스크를 감수하지 않을 선”을 문장으로 적는다.<\/li>\n<li>타인의 소비·성과를 기준점으로 삼지 않는다.<\/li>\n<li>원금 보호보다 더 중요한 것은 “인생 전체 기능 보호”임을 기억한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 성장을 멈추라는 뜻이 아니다.<\/li>\n<li>잘못 읽으면 “돈을 더 벌려는 노력은 다 탐욕”이 되지만, 하우절의 요지는 목표 없는 추격이 이미 가진 것을 위태롭게 만든다는 점이다.<\/li>\n<\/ul>","text":"기존 노트 필요하지 않은 것을 위해 내가 가진 것, 필요로 하는 것을 걸 이유는 없다 가장 어려운 것은 멈출 수 있는 골대를 세우는 일 문제는 남과 비교하는 것 라스베이거스에서 이기는 유일한 방법은 들어오자마자 나가는 것 [사례] 인물/사건: 라잣 굽타는 맥킨지 글로벌 수장과 유수 기관 이사를 지낸 인물이었지만 2012년 내부자거래 사건으로 유죄 평결을 받고 징역 2년과 벌금 500만 달러를 선고받았다. 버니 메이도프는 2009년 150년형을 선고받았고, 이후 검증된 직접 피해 손실 기준으로 약 175억 달러 중 2025년까지 152.6억 달러가 회수됐다. 상황: 두 사례 모두 “이미 많은 것을 가진 사람”이 더 얻으려다 기존의 평판·자산·자유를 잃는 구조를 보여 준다. 하우절이 말하는 “충분함”의 부재가 실제로 어떻게 파국으로 이어지는지를 극단적으로 드러낸다. 결과: 더 큰 수익 그 자체보다, 비교심리와 과시욕이 의사결정을 오염시키는 순간 파산·범죄·사회적 몰락 가능성이 커진다. 이 장의 교훈과 연결: [하우절 본문] 이미 필요한 만큼 가진 상태에서 더 가지려는 욕심이 가장 비싼 리스크다. 출처: Gupta 사건 자료, Madoff 사건·회수금 보도. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 라잣 굽타 형량 2년 2012 지위가 높아도 “더 원함”이 법적 몰락으로 연결될 수 있음 사건 자료 A-B 라잣 굽타 벌금 $5M 2012 탐욕의 직접 비용 사건 자료 A-B 메이도프 형량 150년 2009 “충분함 모름”의 극단적 결과 사건 자료 A-B 메이도프 직접 피해 검증 손실 약 $17.5B 2025 기준 회수 공시 허구 수익 추구가 실현 손실로 귀결 Reuters A 메이도프 회수액 $15.26B 2025 회수는 가능했지만 원래의 신뢰와 시간은 복구 불가 Reuters A 데이터 주석: 이 장의 숫자는 “얼마나 많이 잃었나”보다, 이미 사회적·재무적 성공을 이룬 사람도 ‘충분함의 부재’로 모든 것을 걸 수 있다는 점을 보여 준다. [보강 | 논리 전개] [하우절 본문] 하우절의 핵심은 탐욕 비판이 아니라 기준점 부재 비판이다. [추론] 돈의 심리학에서 가장 위험한 상태는 가난이 아니라 “더 가져야만 내가 괜찮아진다”는 내면 규칙이다. 이 규칙은 레버리지, 무리한 집중, 도덕적 타협을 정당화한다. [후대 해석] “Enough”는 수익률 목표가 아니라 중단 규칙이다. 언제 안 할 것인지, 얼마를 잃으면 멈출 것인지가 먼저다. [실전 적용] 적용 영역: 매수, 매도, 비교심리, 레버리지 행동 체크리스트 “내게 충분한 자산 수준”과 “추가 리스크를 감수하지 않을 선”을 문장으로 적는다. 타인의 소비·성과를 기준점으로 삼지 않는다. 원금 보호보다 더 중요한 것은 “인생 전체 기능 보호”임을 기억한다. [오해 방지] 이 장은 성장을 멈추라는 뜻이 아니다. 잘못 읽으면 “돈을 더 벌려는 노력은 다 탐욕”이 되지만, 하우절의 요지는 목표 없는 추격이 이미 가진 것을 위태롭게 만든다는 점이다."},{"i":5,"title":"4. 시간이 너희를 부유케 하리니 (Confounding Compounding)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>어마한 결과를 가져오기 위해 반드시 어마한 힘이 필요한 것은 아니다.<\/li>\n<li>워렌버핏 성공의 이유는 단지 훌륭한 투자자라서가 아니고 어릴 때부터 훌륭한 투자자 였기 때문 (복리)<\/li>\n<li>꽤 괜찮은 수익률을 계속해서 올리는 게 더 훌륭한 투자 (지속성)<\/li>\n<li>그러니 '닥치고 기다려라'.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 워런 버핏은 11세에 첫 주식을 샀고, 1962년에 백만장자가 됐다. 2025년 기준 배런스는 그의 현재 부의 약 95%가 65세 이후 만들어졌다고 정리한다. 반면 짐 사이먼스의 메달리온 펀드는 1988~2018년 연평균 약 39% 순수익률을 냈지만, 버핏의 독특한 압도성은 수익률뿐 아니라 비정상적으로 긴 시간에 있었다.<\/li>\n<li>상황: 버핏의 신화는 “천재의 한 방”보다 “아주 오랜 기간 복리의 작동을 방해하지 않은 것”에 가깝다. 사이먼스는 더 높은 수익률을 냈지만 투자 가능 기간과 구조가 다르다.<\/li>\n<li>결과: 복리의 위력은 높은 수익률에서만 오지 않는다. 중간에 깨지지 않는 지속 기간이 훨씬 큰 차이를 만든다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 버핏을 흉내 내는 가장 현실적 방법은 천재가 되는 것이 아니라 투자 생명을 길게 갖는 것이다.<\/li>\n<li>출처: Buffett 약력, Barron’s, WSJ/Jim Simons 관련 기사.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>버핏 첫 주식 매수 나이<\/td>\n<td style=\"text-align: right;\">11세<\/td>\n<td>어린 시절<\/td>\n<td>복리의 핵심 변수는 시작 시점<\/td>\n<td>약력 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>버핏 백만장자 도달<\/td>\n<td style=\"text-align: right;\">1962년<\/td>\n<td>32세 전후<\/td>\n<td>장기 복리가 일찍 가동됨<\/td>\n<td>약력 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>버핏 현재 부 중 65세 이후 형성<\/td>\n<td style=\"text-align: right;\">약 95%<\/td>\n<td>2025 기사 기준<\/td>\n<td>시간의 길이가 실력만큼 중요<\/td>\n<td>Barron’s<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>메달리온 순수익률<\/td>\n<td style=\"text-align: right;\">연 39%<\/td>\n<td>1988~2018<\/td>\n<td>고수익률도 강력하지만 시간 우위와 별개 변수<\/td>\n<td>WSJ<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: <code>[추론]<\/code> 버핏 사례의 요지는 “99%가 50세 이후”라는 인터넷 요약 문구를 그대로 반복하는 것이 아니라, 현재 확인 가능한 고신뢰 보도 기준으로도 그의 부 대부분이 고령 이후 형성됐다는 사실이다. 즉, 핵심 메시지는 숫자의 미세한 차이가 아니라 시간 우위다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 복리는 속도가 아니라 지속성의 함수다.<\/li>\n<li><code>[추론]<\/code> 투자자는 대개 더 높은 수익률을 찾느라 복리의 가장 중요한 원재료인 시간을 스스로 끊는다. 과잉매매, 전략교체, 레버리지가 대표적이다.<\/li>\n<li><code>[후대 해석]<\/code> 이 장의 ‘빙하기 비유’는 거대한 변화가 단일 이벤트가 아니라 오랜 누적으로 만들어진다는 뜻으로 읽는 것이 정확하다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 매수, 매도, 포트폴리오, 저축<\/li>\n<li>행동 체크리스트<\/li>\n<li>연환산 수익률보다 투자 지속 가능 연수를 관리한다.<\/li>\n<li>전략 교체 기준을 높인다.<\/li>\n<li>자동이체·적립식·저비용 구조를 우선 설계한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“닥치고 기다려라”는 아무 자산이나 사서 방치하라는 뜻이 아니다.<\/li>\n<li>질 나쁜 자산을 오래 들고 있는 것과 좋은 자산을 오래 버티는 것은 다르다. 하우절의 메시지는 ‘시간 + 생존 가능한 구조’다.<\/li>\n<\/ul>","text":"기존 노트 어마한 결과를 가져오기 위해 반드시 어마한 힘이 필요한 것은 아니다. 워렌버핏 성공의 이유는 단지 훌륭한 투자자라서가 아니고 어릴 때부터 훌륭한 투자자 였기 때문 (복리) 꽤 괜찮은 수익률을 계속해서 올리는 게 더 훌륭한 투자 (지속성) 그러니 '닥치고 기다려라'. [사례] 인물/사건: 워런 버핏은 11세에 첫 주식을 샀고, 1962년에 백만장자가 됐다. 2025년 기준 배런스는 그의 현재 부의 약 95%가 65세 이후 만들어졌다고 정리한다. 반면 짐 사이먼스의 메달리온 펀드는 1988~2018년 연평균 약 39% 순수익률을 냈지만, 버핏의 독특한 압도성은 수익률뿐 아니라 비정상적으로 긴 시간에 있었다. 상황: 버핏의 신화는 “천재의 한 방”보다 “아주 오랜 기간 복리의 작동을 방해하지 않은 것”에 가깝다. 사이먼스는 더 높은 수익률을 냈지만 투자 가능 기간과 구조가 다르다. 결과: 복리의 위력은 높은 수익률에서만 오지 않는다. 중간에 깨지지 않는 지속 기간이 훨씬 큰 차이를 만든다. 이 장의 교훈과 연결: [하우절 본문] 버핏을 흉내 내는 가장 현실적 방법은 천재가 되는 것이 아니라 투자 생명을 길게 갖는 것이다. 출처: Buffett 약력, Barron’s, WSJ/Jim Simons 관련 기사. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 버핏 첫 주식 매수 나이 11세 어린 시절 복리의 핵심 변수는 시작 시점 약력 자료 B 버핏 백만장자 도달 1962년 32세 전후 장기 복리가 일찍 가동됨 약력 자료 B 버핏 현재 부 중 65세 이후 형성 약 95% 2025 기사 기준 시간의 길이가 실력만큼 중요 Barron’s B 메달리온 순수익률 연 39% 1988~2018 고수익률도 강력하지만 시간 우위와 별개 변수 WSJ B 데이터 주석: [추론] 버핏 사례의 요지는 “99%가 50세 이후”라는 인터넷 요약 문구를 그대로 반복하는 것이 아니라, 현재 확인 가능한 고신뢰 보도 기준으로도 그의 부 대부분이 고령 이후 형성됐다는 사실이다. 즉, 핵심 메시지는 숫자의 미세한 차이가 아니라 시간 우위다. [보강 | 논리 전개] [하우절 본문] 복리는 속도가 아니라 지속성의 함수다. [추론] 투자자는 대개 더 높은 수익률을 찾느라 복리의 가장 중요한 원재료인 시간을 스스로 끊는다. 과잉매매, 전략교체, 레버리지가 대표적이다. [후대 해석] 이 장의 ‘빙하기 비유’는 거대한 변화가 단일 이벤트가 아니라 오랜 누적으로 만들어진다는 뜻으로 읽는 것이 정확하다. [실전 적용] 적용 영역: 매수, 매도, 포트폴리오, 저축 행동 체크리스트 연환산 수익률보다 투자 지속 가능 연수를 관리한다. 전략 교체 기준을 높인다. 자동이체·적립식·저비용 구조를 우선 설계한다. [오해 방지] “닥치고 기다려라”는 아무 자산이나 사서 방치하라는 뜻이 아니다. 질 나쁜 자산을 오래 들고 있는 것과 좋은 자산을 오래 버티는 것은 다르다. 하우절의 메시지는 ‘시간 + 생존 가능한 구조’다."},{"i":6,"title":"5. 부자가 될 것인가, 부자로 남을 것인가 (Getting Wealthy vs. Staying Wealthy)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>돈을 버는 재주와 돈을 지키는 재주는 다르다.<\/li>\n<li>겸손, 돈이 빨리 사라질 수 있음을 두려워 할 줄 알아야 한다.<\/li>\n<li>투자든, 커리어든, 사업이든 생존이 나의 전략에서 기본 중의 기본이 되어야 한다.<\/li>\n<li>워렌버핏은 빚에 흥분하지 않았고 스쳐 지나가는 한 가지 트렌드에 집착하지 않았다.<\/li>\n<li>워렌버핏은 남의 돈에 의존하지 않았고 스스로를 녹초로 만들거나 중도 포기하지 않았다.<\/li>\n<li>파산하지만 않는다면 결국엔 가장 큰 수익을 얻는다.<\/li>\n<li>계획이 계획대로 되지 않을 때를 대비한 계획을 세운다.<\/li>\n<li>안전마진은 생존 확률을 높임으로써 주어진 리스크 수준에서 성공 확률을 높이는 것<\/li>\n<li>미래에 대해 낙관적이면서 동시에 비관적이어야 한다.<\/li>\n<li>자만 때문에 그토록 많은 똑똑한 사람이 부서졌고 자만하지 않는 법의 가치는 priceless<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 제시 리버모어는 1929년 폭락 때 약 1억 달러를 벌었다고 알려졌지만, 생애 전체로 보면 여러 차례 파산과 재기를 반복한 끝에 1940년 부채가 자산을 초과한 상태에서 생을 마감했다. 릭 게린은 워런 버핏의 1984년 컬럼비아 비즈니스스쿨 원문에서 직접 언급된 Graham 계열 투자자이며, Pacific Partners의 1965~1983년 성과 기록도 확인된다. 다만 “릭 게린이 레버리지 때문에 무너졌다”는 대중적 일화는 이번 재검토에서 직접 1차 출처로 잠기지 않았으므로 <code>[출처 추가 확인 필요]<\/code>로 남긴다. <code>에이브러햄 저먼스키<\/code> 표기는 고신뢰 자료로 확인되지 않았으므로 <code>[불확실]<\/code> 처리한다.<\/li>\n<li>상황: 큰돈을 버는 기술은 공격성·집중·타이밍에서 오지만, 부를 지키는 기술은 그 반대편인 겸손·분산·현금·저레버리지·회복탄력성에서 나온다.<\/li>\n<li>결과: 극단 성과를 낸 사람도 생존 규율이 약하면 복리가 중도 종료된다. “부자가 되는 것”과 “부자로 남는 것”은 별도 역량이다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 파산을 피하는 것이 장기 기대수익률을 높이는 가장 현실적인 전략이다.<\/li>\n<li>출처: 제시 리버모어 전기, Buffett의 ‘Superinvestors’ 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>리버모어 1929년 이익<\/td>\n<td style=\"text-align: right;\">약 $100M<\/td>\n<td>1929<\/td>\n<td>돈을 “버는” 재주는 압도적이었음<\/td>\n<td>전기/해설<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>리버모어 말년 상태<\/td>\n<td style=\"text-align: right;\">부채 &gt; 자산<\/td>\n<td>1940<\/td>\n<td>생존 규율 부재는 부의 지속을 깨뜨림<\/td>\n<td>전기 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>Rick Guerin Pacific Partners Overall Partnership 누적수익률<\/td>\n<td style=\"text-align: right;\">22,200.0%<\/td>\n<td>1965~1983<\/td>\n<td>버핏이 제시한 Graham 계열 투자자 성과 기록<\/td>\n<td>Buffett, <em>The Superinvestors of Graham-and-Doddsville<\/em><\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>Rick Guerin Pacific Partners Overall Partnership 연복리<\/td>\n<td style=\"text-align: right;\">32.9%<\/td>\n<td>1965~1983<\/td>\n<td>큰돈을 버는 능력 자체는 확인됨<\/td>\n<td>Buffett 원문<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>Rick Guerin Pacific Partners Limited Partners 연복리<\/td>\n<td style=\"text-align: right;\">23.6%<\/td>\n<td>1965~1983<\/td>\n<td>투자자 몫 기준 성과<\/td>\n<td>Buffett 원문<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>같은 기간 S&amp;P 500 연복리<\/td>\n<td style=\"text-align: right;\">7.8%<\/td>\n<td>1965~1983<\/td>\n<td>비교 기준<\/td>\n<td>Buffett 원문<\/td>\n<td>A-B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 리버모어와 게린은 “성과의 크기”와 “지속성의 크기”가 다를 수 있음을 상징한다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 돈을 지키는 기술의 중심은 비관주의가 아니라 생존주의다.<\/li>\n<li><code>[추론]<\/code> 시장은 맞고 틀림의 게임이 아니라 탈락 여부의 게임이다. 예상이 맞아도 레버리지가 크면 한 번의 충격으로 퇴장할 수 있다.<\/li>\n<li><code>[후대 해석]<\/code> 이 장은 Buffett류 보수주의의 핵심을 설명한다. 크게 이기는 비밀은 자주 안 죽는 것이다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 현금관리, 레버리지, 폭락 대응<\/li>\n<li>행동 체크리스트<\/li>\n<li>레버리지 비중과 강제청산 가능성을 수치로 계산한다.<\/li>\n<li>현금·단기채·비상자금을 “낮은 수익 자산”이 아니라 “생존 자산”으로 본다.<\/li>\n<li>포트폴리오 목표에 최대손실 한도를 포함한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>생존을 중시한다고 해서 영구적으로 현금만 들고 있으라는 뜻은 아니다.<\/li>\n<li>하우절의 요지는 리스크를 0으로 만들라는 것이 아니라, 단 한 번의 실수로 게임에서 퇴장하지 않게 설계하라는 것이다.<\/li>\n<\/ul>\n<h3>[추가 검증 반영]<\/h3>\n<ul>\n<li>Rick Guerin의 실존과 성과는 워런 버핏의 1984년 원문으로 확인된다. 다만 “레버리지 때문에 무너졌다”는 일화는 이번 재검토에서 직접 출처를 잠그지 못했으므로 하우절 본문 사례처럼 단정하지 않는다.<\/li>\n<li><code>에이브러햄 저먼스키<\/code> 표기는 이번 재검토에서 1차 출처로 확인되지 않았다. Chapter 5의 검증 가능한 인물은 Jesse Livermore와 Rick Guerin이며, 유사 서사 후보로 A.E. Lefcourt가 있으나 이는 <code>[추론]<\/code> 수준이므로 현재는 <code>[불확실]<\/code> 태그를 유지한다.<\/li>\n<\/ul>","text":"기존 노트 돈을 버는 재주와 돈을 지키는 재주는 다르다. 겸손, 돈이 빨리 사라질 수 있음을 두려워 할 줄 알아야 한다. 투자든, 커리어든, 사업이든 생존이 나의 전략에서 기본 중의 기본이 되어야 한다. 워렌버핏은 빚에 흥분하지 않았고 스쳐 지나가는 한 가지 트렌드에 집착하지 않았다. 워렌버핏은 남의 돈에 의존하지 않았고 스스로를 녹초로 만들거나 중도 포기하지 않았다. 파산하지만 않는다면 결국엔 가장 큰 수익을 얻는다. 계획이 계획대로 되지 않을 때를 대비한 계획을 세운다. 안전마진은 생존 확률을 높임으로써 주어진 리스크 수준에서 성공 확률을 높이는 것 미래에 대해 낙관적이면서 동시에 비관적이어야 한다. 자만 때문에 그토록 많은 똑똑한 사람이 부서졌고 자만하지 않는 법의 가치는 priceless [사례] 인물/사건: 제시 리버모어는 1929년 폭락 때 약 1억 달러를 벌었다고 알려졌지만, 생애 전체로 보면 여러 차례 파산과 재기를 반복한 끝에 1940년 부채가 자산을 초과한 상태에서 생을 마감했다. 릭 게린은 워런 버핏의 1984년 컬럼비아 비즈니스스쿨 원문에서 직접 언급된 Graham 계열 투자자이며, Pacific Partners의 1965~1983년 성과 기록도 확인된다. 다만 “릭 게린이 레버리지 때문에 무너졌다”는 대중적 일화는 이번 재검토에서 직접 1차 출처로 잠기지 않았으므로 [출처 추가 확인 필요] 로 남긴다. 에이브러햄 저먼스키 표기는 고신뢰 자료로 확인되지 않았으므로 [불확실] 처리한다. 상황: 큰돈을 버는 기술은 공격성·집중·타이밍에서 오지만, 부를 지키는 기술은 그 반대편인 겸손·분산·현금·저레버리지·회복탄력성에서 나온다. 결과: 극단 성과를 낸 사람도 생존 규율이 약하면 복리가 중도 종료된다. “부자가 되는 것”과 “부자로 남는 것”은 별도 역량이다. 이 장의 교훈과 연결: [하우절 본문] 파산을 피하는 것이 장기 기대수익률을 높이는 가장 현실적인 전략이다. 출처: 제시 리버모어 전기, Buffett의 ‘Superinvestors’ 자료. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 리버모어 1929년 이익 약 $100M 1929 돈을 “버는” 재주는 압도적이었음 전기/해설 B 리버모어 말년 상태 부채 &gt; 자산 1940 생존 규율 부재는 부의 지속을 깨뜨림 전기 자료 B Rick Guerin Pacific Partners Overall Partnership 누적수익률 22,200.0% 1965~1983 버핏이 제시한 Graham 계열 투자자 성과 기록 Buffett, The Superinvestors of Graham-and-Doddsville A-B Rick Guerin Pacific Partners Overall Partnership 연복리 32.9% 1965~1983 큰돈을 버는 능력 자체는 확인됨 Buffett 원문 A-B Rick Guerin Pacific Partners Limited Partners 연복리 23.6% 1965~1983 투자자 몫 기준 성과 Buffett 원문 A-B 같은 기간 S&amp;P 500 연복리 7.8% 1965~1983 비교 기준 Buffett 원문 A-B 데이터 주석: 리버모어와 게린은 “성과의 크기”와 “지속성의 크기”가 다를 수 있음을 상징한다. [보강 | 논리 전개] [하우절 본문] 돈을 지키는 기술의 중심은 비관주의가 아니라 생존주의다. [추론] 시장은 맞고 틀림의 게임이 아니라 탈락 여부의 게임이다. 예상이 맞아도 레버리지가 크면 한 번의 충격으로 퇴장할 수 있다. [후대 해석] 이 장은 Buffett류 보수주의의 핵심을 설명한다. 크게 이기는 비밀은 자주 안 죽는 것이다. [실전 적용] 적용 영역: 포트폴리오, 현금관리, 레버리지, 폭락 대응 행동 체크리스트 레버리지 비중과 강제청산 가능성을 수치로 계산한다. 현금·단기채·비상자금을 “낮은 수익 자산”이 아니라 “생존 자산”으로 본다. 포트폴리오 목표에 최대손실 한도를 포함한다. [오해 방지] 생존을 중시한다고 해서 영구적으로 현금만 들고 있으라는 뜻은 아니다. 하우절의 요지는 리스크를 0으로 만들라는 것이 아니라, 단 한 번의 실수로 게임에서 퇴장하지 않게 설계하라는 것이다. [추가 검증 반영] Rick Guerin의 실존과 성과는 워런 버핏의 1984년 원문으로 확인된다. 다만 “레버리지 때문에 무너졌다”는 일화는 이번 재검토에서 직접 출처를 잠그지 못했으므로 하우절 본문 사례처럼 단정하지 않는다. 에이브러햄 저먼스키 표기는 이번 재검토에서 1차 출처로 확인되지 않았다. Chapter 5의 검증 가능한 인물은 Jesse Livermore와 Rick Guerin이며, 유사 서사 후보로 A.E. Lefcourt가 있으나 이는 [추론] 수준이므로 현재는 [불확실] 태그를 유지한다."},{"i":7,"title":"6. 꼬리가 몸통을 흔든다 (Tails, You Win)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>맞는가, 틀린가 그것이 중요한 것이 아니고 맞았을 때 크게 벌고, 틀렸을 때 작게 잃는 구조가 중요 (조지소로스)<\/li>\n<li>주변 사람들이 모두 미쳐갈 때 평범한 것을 할 수 있는 사람이 전쟁의 천재 (나폴레옹)<\/li>\n<li>지루한 시간이 끝도 없이 계속되다가 간간히 끼어드는 공포의 순간에 내가 보이는 반응이 성공을 좌우<\/li>\n<li>투자 업계에서 끝내주는 사람이라면 열 번 중에 여섯 번을 맞히겠죠. (피터린치)<\/li>\n<li>크게 이기는 그 순간에 집중하라.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 하인츠 베르그륀은 수십 년에 걸쳐 모은 컬렉션 165점을 2000년 독일 정부에 상징적 가격으로 넘겼는데, 그 가치는 당시 약 7.5억 유로로 추정됐다. 이 포트폴리오의 명성은 극소수의 피카소·클레·마티스 명작이 사실상 몸통을 결정했다. 디즈니의 1937년 애니메이션 《백설공주와 일곱 난쟁이》는 제작비 150만 달러로 당시로선 대형 베팅이었지만, 초창기 국제 흥행이 800만 달러를 넘기며 회사의 미래를 바꿨다.<\/li>\n<li>상황: 대부분의 수집품·프로젝트·투자는 평범하지만, 몇 건의 거대한 히트가 전체 성과를 압도한다.<\/li>\n<li>결과: 정답 비율보다 손익 구조가 중요하다. 많은 보통 결과 속에서 드문 대성공이 전체를 먹여 살린다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 투자에서 “꼬리 사건”은 예외가 아니라 장기성과의 핵심 엔진이다.<\/li>\n<li>출처: Berggruen 컬렉션 자료, Snow White 흥행 자료, VC power-law 해설.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>베르그륀 컬렉션 작품 수<\/td>\n<td style=\"text-align: right;\">165점<\/td>\n<td>2000 거래 시점<\/td>\n<td>극소수 핵심 작품이 컬렉션 가치를 대표<\/td>\n<td>미술관/전기 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>베르그륀 컬렉션 추정 가치<\/td>\n<td style=\"text-align: right;\">€750M<\/td>\n<td>2000<\/td>\n<td>포트폴리오의 가치는 일부 압도적 작품에 집중<\/td>\n<td>미술관/전기 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>백설공주 제작비<\/td>\n<td style=\"text-align: right;\">$1.5M<\/td>\n<td>1937<\/td>\n<td>당시 디즈니에게 큰 단일 베팅<\/td>\n<td>영화사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>백설공주 초기 국제 흥행<\/td>\n<td style=\"text-align: right;\">$8M+<\/td>\n<td>초기 개봉기<\/td>\n<td>한 번의 히트가 회사 체급을 바꿈<\/td>\n<td>영화사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: <code>[후대 해석]<\/code> VC·창업·주식·예술 컬렉션 모두 분포가 정규분포보다 “두꺼운 오른쪽 꼬리”를 띠는 경우가 많다. WSJ와 NBER 해설도 벤처에서 power law winner가 전체 수익을 좌우한다고 정리한다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 자주 맞히는 사람보다, 맞았을 때 크게 벌고 틀렸을 때 작게 잃는 사람이 유리하다.<\/li>\n<li><code>[추론]<\/code> 장기 투자성과는 평균적 타율보다 꼬리의 크기에 의해 지배된다. 그래서 분산과 손절 규율은 “좋은 꼬리를 살리고 나쁜 꼬리를 제한”하는 장치다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 매수/매도, 리스크 관리<\/li>\n<li>행동 체크리스트<\/li>\n<li>손실 상한을 정하고, 수익 상한은 함부로 자르지 않는다.<\/li>\n<li>홈런 자산이 나왔을 때 너무 빨리 전량 매도하지 않는다.<\/li>\n<li>다수의 소규모 실패를 감당할 구조를 만든다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 무모한 복권형 베팅을 권하는 것이 아니다.<\/li>\n<li>꼬리 수익을 노린다는 것은 손실 통제 아래서 큰 우승자를 놓치지 않는 구조를 말한다.<\/li>\n<\/ul>","text":"기존 노트 맞는가, 틀린가 그것이 중요한 것이 아니고 맞았을 때 크게 벌고, 틀렸을 때 작게 잃는 구조가 중요 (조지소로스) 주변 사람들이 모두 미쳐갈 때 평범한 것을 할 수 있는 사람이 전쟁의 천재 (나폴레옹) 지루한 시간이 끝도 없이 계속되다가 간간히 끼어드는 공포의 순간에 내가 보이는 반응이 성공을 좌우 투자 업계에서 끝내주는 사람이라면 열 번 중에 여섯 번을 맞히겠죠. (피터린치) 크게 이기는 그 순간에 집중하라. [사례] 인물/사건: 하인츠 베르그륀은 수십 년에 걸쳐 모은 컬렉션 165점을 2000년 독일 정부에 상징적 가격으로 넘겼는데, 그 가치는 당시 약 7.5억 유로로 추정됐다. 이 포트폴리오의 명성은 극소수의 피카소·클레·마티스 명작이 사실상 몸통을 결정했다. 디즈니의 1937년 애니메이션 《백설공주와 일곱 난쟁이》는 제작비 150만 달러로 당시로선 대형 베팅이었지만, 초창기 국제 흥행이 800만 달러를 넘기며 회사의 미래를 바꿨다. 상황: 대부분의 수집품·프로젝트·투자는 평범하지만, 몇 건의 거대한 히트가 전체 성과를 압도한다. 결과: 정답 비율보다 손익 구조가 중요하다. 많은 보통 결과 속에서 드문 대성공이 전체를 먹여 살린다. 이 장의 교훈과 연결: [하우절 본문] 투자에서 “꼬리 사건”은 예외가 아니라 장기성과의 핵심 엔진이다. 출처: Berggruen 컬렉션 자료, Snow White 흥행 자료, VC power-law 해설. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 베르그륀 컬렉션 작품 수 165점 2000 거래 시점 극소수 핵심 작품이 컬렉션 가치를 대표 미술관/전기 자료 B 베르그륀 컬렉션 추정 가치 €750M 2000 포트폴리오의 가치는 일부 압도적 작품에 집중 미술관/전기 자료 B 백설공주 제작비 $1.5M 1937 당시 디즈니에게 큰 단일 베팅 영화사 자료 B 백설공주 초기 국제 흥행 $8M+ 초기 개봉기 한 번의 히트가 회사 체급을 바꿈 영화사 자료 B 데이터 주석: [후대 해석] VC·창업·주식·예술 컬렉션 모두 분포가 정규분포보다 “두꺼운 오른쪽 꼬리”를 띠는 경우가 많다. WSJ와 NBER 해설도 벤처에서 power law winner가 전체 수익을 좌우한다고 정리한다. [보강 | 논리 전개] [하우절 본문] 자주 맞히는 사람보다, 맞았을 때 크게 벌고 틀렸을 때 작게 잃는 사람이 유리하다. [추론] 장기 투자성과는 평균적 타율보다 꼬리의 크기에 의해 지배된다. 그래서 분산과 손절 규율은 “좋은 꼬리를 살리고 나쁜 꼬리를 제한”하는 장치다. [실전 적용] 적용 영역: 포트폴리오, 매수/매도, 리스크 관리 행동 체크리스트 손실 상한을 정하고, 수익 상한은 함부로 자르지 않는다. 홈런 자산이 나왔을 때 너무 빨리 전량 매도하지 않는다. 다수의 소규모 실패를 감당할 구조를 만든다. [오해 방지] 이 장은 무모한 복권형 베팅을 권하는 것이 아니다. 꼬리 수익을 노린다는 것은 손실 통제 아래서 큰 우승자를 놓치지 않는 구조를 말한다."},{"i":8,"title":"7. '돈이 있다'는 의미 (Freedom)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>내 시간을 내 뜻대로 쓸 수 있다는 게 돈이 주는 가장 큰 배당금이다.<\/li>\n<li>원하는 것을, 원할 때, 원하는 사람과 함께할 수 있는게 사람을 행복하게 만드는 가장 뚜렷한 변수<\/li>\n<li>사람들은 자신에게 통제권이 있다고 느끼고 싶어하고 통제권을 잃으면 원래 하려고 했던 일조차 싫어한다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[저자 인터뷰/외부 글]<\/code> 하우절은 책 출간 후 인터뷰들에서도 “돈에서 내가 원한 것은 독립성”이라고 반복해 왔고, “매일 내가 원하는 일을 할 수 있는 상태”를 최고의 배당으로 설명했다.<\/li>\n<li>상황: 많은 투자 조언이 총자산을 목표로 삼지만, 하우절은 돈의 최종 용도를 ‘시간 통제권’으로 재정의한다.<\/li>\n<li>결과: 자유는 고가 소비가 아니라 거절권, 이동권, 휴식권, 관계 선택권으로 체감된다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 돈의 가장 높은 ROI는 더 많이 갖는 것이 아니라 더 많이 통제하는 것이다. <code>[출처 추가 확인 필요]<\/code> 앵거스 캠벨의 원문 맥락은 이번 조사에서 서지 수준까지만 확인했고, 이 장의 정확한 문구 매핑은 후속 원서 대조가 남는다.<\/li>\n<li>출처: 하우절 인터뷰, Campbell 저작 존재 확인 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<ul>\n<li><code>[데이터]<\/code> 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 자유는 소비의 부산물이 아니라 저축과 선택권의 부산물이다.<\/li>\n<li><code>[추론]<\/code> 월급 외 소득, 충분한 현금, 낮은 생활비는 모두 시간 통제권을 늘린다. 그래서 자유는 자산총액보다 고정비 구조와 더 밀접하다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 저축, 현금관리, 커리어/포트폴리오<\/li>\n<li>행동 체크리스트<\/li>\n<li>재무목표를 순자산이 아니라 “버틸 수 있는 개월 수”로 본다.<\/li>\n<li>생활비 고정비를 줄여 독립성 레버리지를 높인다.<\/li>\n<li>수익률보다 시간 회수에 기여하는 자산 배분을 점검한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>자유를 강조한다고 해서 조기은퇴만이 답이라는 뜻은 아니다.<\/li>\n<li>핵심은 “무엇을 할 자유가 있는가”이지 “일을 완전히 안 하는가”가 아니다.<\/li>\n<\/ul>","text":"기존 노트 내 시간을 내 뜻대로 쓸 수 있다는 게 돈이 주는 가장 큰 배당금이다. 원하는 것을, 원할 때, 원하는 사람과 함께할 수 있는게 사람을 행복하게 만드는 가장 뚜렷한 변수 사람들은 자신에게 통제권이 있다고 느끼고 싶어하고 통제권을 잃으면 원래 하려고 했던 일조차 싫어한다. [사례] 인물/사건: [저자 인터뷰/외부 글] 하우절은 책 출간 후 인터뷰들에서도 “돈에서 내가 원한 것은 독립성”이라고 반복해 왔고, “매일 내가 원하는 일을 할 수 있는 상태”를 최고의 배당으로 설명했다. 상황: 많은 투자 조언이 총자산을 목표로 삼지만, 하우절은 돈의 최종 용도를 ‘시간 통제권’으로 재정의한다. 결과: 자유는 고가 소비가 아니라 거절권, 이동권, 휴식권, 관계 선택권으로 체감된다. 이 장의 교훈과 연결: [하우절 본문] 돈의 가장 높은 ROI는 더 많이 갖는 것이 아니라 더 많이 통제하는 것이다. [출처 추가 확인 필요] 앵거스 캠벨의 원문 맥락은 이번 조사에서 서지 수준까지만 확인했고, 이 장의 정확한 문구 매핑은 후속 원서 대조가 남는다. 출처: 하우절 인터뷰, Campbell 저작 존재 확인 자료. [데이터] [데이터] 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다. [보강 | 논리 전개] [하우절 본문] 자유는 소비의 부산물이 아니라 저축과 선택권의 부산물이다. [추론] 월급 외 소득, 충분한 현금, 낮은 생활비는 모두 시간 통제권을 늘린다. 그래서 자유는 자산총액보다 고정비 구조와 더 밀접하다. [실전 적용] 적용 영역: 저축, 현금관리, 커리어/포트폴리오 행동 체크리스트 재무목표를 순자산이 아니라 “버틸 수 있는 개월 수”로 본다. 생활비 고정비를 줄여 독립성 레버리지를 높인다. 수익률보다 시간 회수에 기여하는 자산 배분을 점검한다. [오해 방지] 자유를 강조한다고 해서 조기은퇴만이 답이라는 뜻은 아니다. 핵심은 “무엇을 할 자유가 있는가”이지 “일을 완전히 안 하는가”가 아니다."},{"i":9,"title":"8. 페라리가 주는 역설 (Man in the Car Paradox)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>너는 비싼 차, 고급 시계, 강남 아파트를 원하지 않고 네가 원하는 것은 남들로부터의 존경과 칭찬이다.<\/li>\n<li>존경과 칭찬이 목표라면 슈퍼카보다 겸손, 친절, 공감이 더 많은 존경을 가져다 줄 것<\/li>\n<li>아무도 당신의 물건을 보고 당신을 존경하지 않는다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[해당 장은 사례보다 논지 중심]<\/code> 하우절은 특정 한 대의 차보다 “보는 쪽의 심리”를 문제 삼는다. <code>[후대 해석]<\/code> 길로비치의 ‘spotlight effect’는 사람들이 자신이 타인에게 훨씬 더 많이 주목받는다고 과대평가한다는 점을 설명하며, 이 장의 심리 구조와 잘 맞닿아 있다.<\/li>\n<li>상황: 우리는 비싼 물건을 통해 존경을 사려 하지만, 실제 타인은 그 물건을 부러워할 뿐 그 소유자를 깊이 존경하지는 않는다.<\/li>\n<li>결과: 과시 소비는 인정 욕구를 채우는 듯 보이지만, 실은 비교를 더 자극해 추가 소비를 부른다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 물건을 통해 얻으려는 존경은 대부분 착시다. 존경은 소유보다 태도, 관계, 신뢰에서 생긴다.<\/li>\n<li>출처: Housel 인터뷰, spotlight effect 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<ul>\n<li><code>[데이터]<\/code> 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[추론]<\/code> 소비는 두 가지 용도가 있다. 기능 효용과 지위 신호다. 이 장은 후자가 기대만큼 존경을 만들어 주지 않는다는 점을 지적한다.<\/li>\n<li><code>[후대 해석]<\/code> 사회심리의 스포트라이트 효과를 적용하면, 내가 생각하는 ‘타인의 시선’은 실제보다 과장돼 있다. 그래서 지위소비의 효율은 낮다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 소비, 비교심리<\/li>\n<li>행동 체크리스트<\/li>\n<li>큰 지출 전 “이게 기능 때문인가, 인정 욕구 때문인가”를 구분한다.<\/li>\n<li>남에게 보이는 소비보다 반복 사용가치가 큰 소비를 우선한다.<\/li>\n<li>과시 물건 대신 관계·건강·시간 절감에 돈을 배분한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 좋은 차나 좋은 집을 사지 말라는 금욕주의가 아니다.<\/li>\n<li>핵심은 소비의 목적을 혼동하지 말라는 점이다. 기능을 위해 사는 것과 존경을 사는 것은 다르다.<\/li>\n<\/ul>","text":"기존 노트 너는 비싼 차, 고급 시계, 강남 아파트를 원하지 않고 네가 원하는 것은 남들로부터의 존경과 칭찬이다. 존경과 칭찬이 목표라면 슈퍼카보다 겸손, 친절, 공감이 더 많은 존경을 가져다 줄 것 아무도 당신의 물건을 보고 당신을 존경하지 않는다. [사례] 인물/사건: [해당 장은 사례보다 논지 중심] 하우절은 특정 한 대의 차보다 “보는 쪽의 심리”를 문제 삼는다. [후대 해석] 길로비치의 ‘spotlight effect’는 사람들이 자신이 타인에게 훨씬 더 많이 주목받는다고 과대평가한다는 점을 설명하며, 이 장의 심리 구조와 잘 맞닿아 있다. 상황: 우리는 비싼 물건을 통해 존경을 사려 하지만, 실제 타인은 그 물건을 부러워할 뿐 그 소유자를 깊이 존경하지는 않는다. 결과: 과시 소비는 인정 욕구를 채우는 듯 보이지만, 실은 비교를 더 자극해 추가 소비를 부른다. 이 장의 교훈과 연결: [하우절 본문] 물건을 통해 얻으려는 존경은 대부분 착시다. 존경은 소유보다 태도, 관계, 신뢰에서 생긴다. 출처: Housel 인터뷰, spotlight effect 자료. [데이터] [데이터] 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다. [보강 | 논리 전개] [추론] 소비는 두 가지 용도가 있다. 기능 효용과 지위 신호다. 이 장은 후자가 기대만큼 존경을 만들어 주지 않는다는 점을 지적한다. [후대 해석] 사회심리의 스포트라이트 효과를 적용하면, 내가 생각하는 ‘타인의 시선’은 실제보다 과장돼 있다. 그래서 지위소비의 효율은 낮다. [실전 적용] 적용 영역: 소비, 비교심리 행동 체크리스트 큰 지출 전 “이게 기능 때문인가, 인정 욕구 때문인가”를 구분한다. 남에게 보이는 소비보다 반복 사용가치가 큰 소비를 우선한다. 과시 물건 대신 관계·건강·시간 절감에 돈을 배분한다. [오해 방지] 이 장은 좋은 차나 좋은 집을 사지 말라는 금욕주의가 아니다. 핵심은 소비의 목적을 혼동하지 말라는 점이다. 기능을 위해 사는 것과 존경을 사는 것은 다르다."},{"i":10,"title":"9. 부의 정의 (Wealth is What You Don't See)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>부는 눈에 보이지 않고 부는 구매하지 않은 좋은차, 좋은 시계, 좋은 옷이며 부란 그런것으로 바꾸지 않은 금전적 자산<\/li>\n<li>부자가 되는 유일한 방법은 가진 돈을 쓰지 않는 것이다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[해당 장은 사례보다 논지 중심]<\/code> 이 장의 외부 데이터는 “보이는 소비”보다 “보이지 않는 완충자산”이 실제 재무건전성을 만든다는 점을 뒷받침하는 데 쓰는 편이 정확하다. 2023년 연준 조사에서 63%만이 400달러 비상지출을 현금·예금·즉시상환 가능한 신용으로 감당할 수 있었고, 55%만이 3개월 생활비 수준의 비상자금을 보유했다고 답했다.<\/li>\n<li>상황: 겉으로 잘 사는 것처럼 보여도 보이지 않는 완충자산이 없으면 실제 부는 약하다.<\/li>\n<li>결과: 소비하지 않은 돈은 장래 현금흐름 충격을 흡수하고, 협상력과 선택권을 만든다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 부는 보유자산 중 “아직 쓰지 않은 부분”이다. <code>[후대 해석]<\/code> 현대 가계 데이터는 이 정의가 단순한 수사가 아니라 실질적 회복력 개념임을 보여 준다.<\/li>\n<li>출처: 연준 SHED 요약 보도, Housel 해설 기사.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>$400 비상지출 감당 가능<\/td>\n<td style=\"text-align: right;\">63%<\/td>\n<td>2023 조사/2024 보도<\/td>\n<td>가시적 소비와 무관하게 유동성 부족 가구가 많음<\/td>\n<td>연준 SHED<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>$400 비상지출 감당 곤란/차입 필요<\/td>\n<td style=\"text-align: right;\">37%<\/td>\n<td>2023 조사/2025 해설<\/td>\n<td>“보이지 않는 현금”의 부재가 실제 취약성<\/td>\n<td>연준 SHED<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>3개월 비상자금 보유<\/td>\n<td style=\"text-align: right;\">55%<\/td>\n<td>2023 조사/2025 해설<\/td>\n<td>진짜 부는 비상시 지속 능력<\/td>\n<td>연준 SHED<\/td>\n<td>A<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 이 수치는 “좋은 차”보다 “생활 충격 흡수 능력”이 더 직접적인 부의 지표임을 보여 준다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 부는 과소비의 반대말이다.<\/li>\n<li><code>[추론]<\/code> 자산은 두 얼굴이 있다. 보여 주는 자산과 버티게 하는 자산이다. 하우절은 후자를 부의 본질로 본다.<\/li>\n<li><code>[후대 해석]<\/code> 순자산보다 유동성, 유동성보다 행동 유연성이 중요하다는 점에서 이 장은 자유 장과 직접 연결된다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 저축, 현금관리, 소비<\/li>\n<li>행동 체크리스트<\/li>\n<li>순자산만 보지 말고 즉시 사용 가능한 완충자산을 별도 관리한다.<\/li>\n<li>보상 소비를 줄이고 비상자금을 우선 축적한다.<\/li>\n<li>연간 소득 증가분의 일부를 생활수준이 아니라 저축률 향상에 배정한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 아무 것도 쓰지 말라는 극단적 금욕이 아니다.<\/li>\n<li>핵심은 “쓸 수 있는데 안 쓴 자산”이 진짜 선택권을 만든다는 점이다. 목적 있는 소비와 과시 소비는 구분해야 한다.<\/li>\n<\/ul>","text":"기존 노트 부는 눈에 보이지 않고 부는 구매하지 않은 좋은차, 좋은 시계, 좋은 옷이며 부란 그런것으로 바꾸지 않은 금전적 자산 부자가 되는 유일한 방법은 가진 돈을 쓰지 않는 것이다. [사례] 인물/사건: [해당 장은 사례보다 논지 중심] 이 장의 외부 데이터는 “보이는 소비”보다 “보이지 않는 완충자산”이 실제 재무건전성을 만든다는 점을 뒷받침하는 데 쓰는 편이 정확하다. 2023년 연준 조사에서 63%만이 400달러 비상지출을 현금·예금·즉시상환 가능한 신용으로 감당할 수 있었고, 55%만이 3개월 생활비 수준의 비상자금을 보유했다고 답했다. 상황: 겉으로 잘 사는 것처럼 보여도 보이지 않는 완충자산이 없으면 실제 부는 약하다. 결과: 소비하지 않은 돈은 장래 현금흐름 충격을 흡수하고, 협상력과 선택권을 만든다. 이 장의 교훈과 연결: [하우절 본문] 부는 보유자산 중 “아직 쓰지 않은 부분”이다. [후대 해석] 현대 가계 데이터는 이 정의가 단순한 수사가 아니라 실질적 회복력 개념임을 보여 준다. 출처: 연준 SHED 요약 보도, Housel 해설 기사. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 $400 비상지출 감당 가능 63% 2023 조사/2024 보도 가시적 소비와 무관하게 유동성 부족 가구가 많음 연준 SHED A $400 비상지출 감당 곤란/차입 필요 37% 2023 조사/2025 해설 “보이지 않는 현금”의 부재가 실제 취약성 연준 SHED A 3개월 비상자금 보유 55% 2023 조사/2025 해설 진짜 부는 비상시 지속 능력 연준 SHED A 데이터 주석: 이 수치는 “좋은 차”보다 “생활 충격 흡수 능력”이 더 직접적인 부의 지표임을 보여 준다. [보강 | 논리 전개] [하우절 본문] 부는 과소비의 반대말이다. [추론] 자산은 두 얼굴이 있다. 보여 주는 자산과 버티게 하는 자산이다. 하우절은 후자를 부의 본질로 본다. [후대 해석] 순자산보다 유동성, 유동성보다 행동 유연성이 중요하다는 점에서 이 장은 자유 장과 직접 연결된다. [실전 적용] 적용 영역: 저축, 현금관리, 소비 행동 체크리스트 순자산만 보지 말고 즉시 사용 가능한 완충자산을 별도 관리한다. 보상 소비를 줄이고 비상자금을 우선 축적한다. 연간 소득 증가분의 일부를 생활수준이 아니라 저축률 향상에 배정한다. [오해 방지] 이 장은 아무 것도 쓰지 말라는 극단적 금욕이 아니다. 핵심은 “쓸 수 있는데 안 쓴 자산”이 진짜 선택권을 만든다는 점이다. 목적 있는 소비와 과시 소비는 구분해야 한다."},{"i":11,"title":"10. 뭐, 저축을 하라고? (Save Money)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>부를 쌓는 것은 소득, 투자수익률과 거의 관계가 없고 저축률과 관계가 깊다.<\/li>\n<li>소득이 높지 않아도 부를 쌓을 수 있지만, 저축률이 높지 않고서는 부를 쌓을 수 없다.<\/li>\n<li>저축을 늘리는 가장 좋은 방법은 소득을 늘리는 것이 아니라 겸손을 늘리는 것이다.<\/li>\n<li>이유 없는 저축은 가장 강력한 대비책이며 예측 불가능 세계에서 선택권과 유연성을 사는 행위<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[해당 장은 사례보다 논지 중심]<\/code> 연준 조사에서 34%는 가구 월소득이 늘었다고 답했지만 38%는 지출도 늘었다고 답했다. 즉, 소득 증가가 곧 자산 증가로 이어지지 않는다. 하우절이 강조하는 것은 투자수익률보다 먼저 저축률과 생활양식 관리다.<\/li>\n<li>상황: 소득이 올라도 생활수준이 같이 오르면 자산 축적은 정체된다.<\/li>\n<li>결과: 이유 없는 저축은 예측 불가능한 충격에 대한 옵션 프리미엄 역할을 한다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 저축은 남는 돈의 처리 방식이 아니라 독립성을 사는 행위다.<\/li>\n<li>출처: 연준 SHED 요약 보도, Housel 인터뷰.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>월소득 증가 응답<\/td>\n<td style=\"text-align: right;\">34%<\/td>\n<td>2023 조사<\/td>\n<td>소득 증가는 제한적<\/td>\n<td>연준 SHED<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>월지출 증가 응답<\/td>\n<td style=\"text-align: right;\">38%<\/td>\n<td>2023 조사<\/td>\n<td>생활수준 상승이 자산 형성을 잠식<\/td>\n<td>연준 SHED<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>$400 비상비용 즉시 대응 가능<\/td>\n<td style=\"text-align: right;\">63%<\/td>\n<td>2023 조사<\/td>\n<td>저축률이 낮으면 작은 충격도 재무 스트레스가 됨<\/td>\n<td>연준 SHED<\/td>\n<td>A<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 저축률이 중요한 이유는 기대수익률보다 내가 통제할 수 있는 변수이기 때문이다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 저축은 단순한 부 축적이 아니라 미래의 불확실성에 대한 적응력이다.<\/li>\n<li><code>[추론]<\/code> 투자수익률은 시장이 정하지만 저축률은 생활양식이 정한다. 그래서 통제 가능성과 재현성 면에서 저축률이 우선순위가 된다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 저축, 현금관리, 생활비 설계<\/li>\n<li>행동 체크리스트<\/li>\n<li>저축 금액이 아니라 저축률을 KPI로 본다.<\/li>\n<li>급여 인상분의 일정 비율은 자동저축으로 고정한다.<\/li>\n<li>“목적 없는 저축 계정”을 별도 운용한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 수익률을 포기하라는 뜻이 아니다.<\/li>\n<li>다만 수익률 최적화보다 저축률 안정화가 먼저라는 우선순위를 말한다.<\/li>\n<\/ul>","text":"기존 노트 부를 쌓는 것은 소득, 투자수익률과 거의 관계가 없고 저축률과 관계가 깊다. 소득이 높지 않아도 부를 쌓을 수 있지만, 저축률이 높지 않고서는 부를 쌓을 수 없다. 저축을 늘리는 가장 좋은 방법은 소득을 늘리는 것이 아니라 겸손을 늘리는 것이다. 이유 없는 저축은 가장 강력한 대비책이며 예측 불가능 세계에서 선택권과 유연성을 사는 행위 [사례] 인물/사건: [해당 장은 사례보다 논지 중심] 연준 조사에서 34%는 가구 월소득이 늘었다고 답했지만 38%는 지출도 늘었다고 답했다. 즉, 소득 증가가 곧 자산 증가로 이어지지 않는다. 하우절이 강조하는 것은 투자수익률보다 먼저 저축률과 생활양식 관리다. 상황: 소득이 올라도 생활수준이 같이 오르면 자산 축적은 정체된다. 결과: 이유 없는 저축은 예측 불가능한 충격에 대한 옵션 프리미엄 역할을 한다. 이 장의 교훈과 연결: [하우절 본문] 저축은 남는 돈의 처리 방식이 아니라 독립성을 사는 행위다. 출처: 연준 SHED 요약 보도, Housel 인터뷰. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 월소득 증가 응답 34% 2023 조사 소득 증가는 제한적 연준 SHED A 월지출 증가 응답 38% 2023 조사 생활수준 상승이 자산 형성을 잠식 연준 SHED A $400 비상비용 즉시 대응 가능 63% 2023 조사 저축률이 낮으면 작은 충격도 재무 스트레스가 됨 연준 SHED A 데이터 주석: 저축률이 중요한 이유는 기대수익률보다 내가 통제할 수 있는 변수이기 때문이다. [보강 | 논리 전개] [하우절 본문] 저축은 단순한 부 축적이 아니라 미래의 불확실성에 대한 적응력이다. [추론] 투자수익률은 시장이 정하지만 저축률은 생활양식이 정한다. 그래서 통제 가능성과 재현성 면에서 저축률이 우선순위가 된다. [실전 적용] 적용 영역: 저축, 현금관리, 생활비 설계 행동 체크리스트 저축 금액이 아니라 저축률을 KPI로 본다. 급여 인상분의 일정 비율은 자동저축으로 고정한다. “목적 없는 저축 계정”을 별도 운용한다. [오해 방지] 이 장은 수익률을 포기하라는 뜻이 아니다. 다만 수익률 최적화보다 저축률 안정화가 먼저라는 우선순위를 말한다."},{"i":12,"title":"11. 적당히 합리적인 게 나을까, 철저히 이성적인 게 좋을까 (Reasonable > Rational)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>폭락 앞에서 멀쩡한 정신을 유지할 수 있는 투자자가 없고 그래서 숫자에 기반한 이성적 전략만으로는 버틸 수 없다.<\/li>\n<li>꽤 적당히 합리적인 것을 목표를 삼는 것이 냉철하게 이성적인 것보다 이롭다.<\/li>\n<li>수학적으로 정교하지만 정서적으로 힘든 투자법보다 밤잠을 자게 해주는 전략이 장기적으로 유리하다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[해당 장은 사례보다 논지 중심]<\/code> 11장의 검증 가능한 핵심은, 수학적으로 최적인 전략보다 감정적으로 지속 가능한 전략이 장기적으로 더 실용적일 수 있다는 점이다. 하우절은 돈을 다루는 방식이 밤잠을 잘 수 있게 해야 하며, 차갑게 이성적인 선택만을 목표로 하기보다 “꽤 합리적인” 선택을 오래 유지하는 편이 실제 투자 성과에 더 유리할 수 있다고 설명한다. 다만 말라리아 요법과 주택담보대출 조기상환의 구체 사례는 이번 재검토에서 원전 확인이 끝나지 않았으므로 <code>[출처 추가 확인 필요]<\/code>를 유지한다.<\/li>\n<li>상황: 이 장의 핵심은 사람은 계산기처럼 살지 않는다는 사실이다.<\/li>\n<li>결과: 수학적으로 최적이어도 지속 불가능하면 실제 성과는 나빠진다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 버틸 수 있는 전략이 결국 더 이성적이다.<\/li>\n<li>출처: 책 일반 개요, 하우절 장기·단순 전략 인터뷰.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<ul>\n<li><code>[데이터]<\/code> 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 합리성은 인간의 감정 제약을 무시한 최적화가 아니라, 감정을 포함해도 유지되는 규칙이다.<\/li>\n<li><code>[추론]<\/code> 투자전략은 백테스트 최고값보다 실제 실행 지속률이 중요하다. 밤잠을 못 자게 하는 전략은 결국 포기·과잉매매·저점매도로 무너질 가능성이 높다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 폭락 대응<\/li>\n<li>행동 체크리스트<\/li>\n<li>최대 기대수익이 아니라 최대 지속가능 전략을 선택한다.<\/li>\n<li>자산배분의 목적을 “버티기”까지 포함해 재설계한다.<\/li>\n<li>폭락 시 내가 실제로 할 행동을 미리 문서화한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>적당히 합리적이라는 말은 아무 근거 없는 감정매매를 정당화하지 않는다.<\/li>\n<li>핵심은 감정을 무시하지 말고 구조 안으로 포함하라는 것이다.<\/li>\n<\/ul>\n<h3>[추가 검증 반영]<\/h3>\n<ul>\n<li>11장의 핵심 명제인 “차갑게 이성적인 것보다 지속 가능한 수준에서 합리적인 편이 낫다”는 방향은 확인 가능하다. 다만 말라리아 요법·주택담보대출 조기상환의 구체 사례는 원서 페이지 직접 확인 전까지 사례 수준에서 단정하지 않는다.<\/li>\n<\/ul>","text":"기존 노트 폭락 앞에서 멀쩡한 정신을 유지할 수 있는 투자자가 없고 그래서 숫자에 기반한 이성적 전략만으로는 버틸 수 없다. 꽤 적당히 합리적인 것을 목표를 삼는 것이 냉철하게 이성적인 것보다 이롭다. 수학적으로 정교하지만 정서적으로 힘든 투자법보다 밤잠을 자게 해주는 전략이 장기적으로 유리하다. [사례] 인물/사건: [해당 장은 사례보다 논지 중심] 11장의 검증 가능한 핵심은, 수학적으로 최적인 전략보다 감정적으로 지속 가능한 전략이 장기적으로 더 실용적일 수 있다는 점이다. 하우절은 돈을 다루는 방식이 밤잠을 잘 수 있게 해야 하며, 차갑게 이성적인 선택만을 목표로 하기보다 “꽤 합리적인” 선택을 오래 유지하는 편이 실제 투자 성과에 더 유리할 수 있다고 설명한다. 다만 말라리아 요법과 주택담보대출 조기상환의 구체 사례는 이번 재검토에서 원전 확인이 끝나지 않았으므로 [출처 추가 확인 필요] 를 유지한다. 상황: 이 장의 핵심은 사람은 계산기처럼 살지 않는다는 사실이다. 결과: 수학적으로 최적이어도 지속 불가능하면 실제 성과는 나빠진다. 이 장의 교훈과 연결: [하우절 본문] 버틸 수 있는 전략이 결국 더 이성적이다. 출처: 책 일반 개요, 하우절 장기·단순 전략 인터뷰. [데이터] [데이터] 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다. [보강 | 논리 전개] [하우절 본문] 합리성은 인간의 감정 제약을 무시한 최적화가 아니라, 감정을 포함해도 유지되는 규칙이다. [추론] 투자전략은 백테스트 최고값보다 실제 실행 지속률이 중요하다. 밤잠을 못 자게 하는 전략은 결국 포기·과잉매매·저점매도로 무너질 가능성이 높다. [실전 적용] 적용 영역: 포트폴리오, 폭락 대응 행동 체크리스트 최대 기대수익이 아니라 최대 지속가능 전략을 선택한다. 자산배분의 목적을 “버티기”까지 포함해 재설계한다. 폭락 시 내가 실제로 할 행동을 미리 문서화한다. [오해 방지] 적당히 합리적이라는 말은 아무 근거 없는 감정매매를 정당화하지 않는다. 핵심은 감정을 무시하지 말고 구조 안으로 포함하라는 것이다. [추가 검증 반영] 11장의 핵심 명제인 “차갑게 이성적인 것보다 지속 가능한 수준에서 합리적인 편이 낫다”는 방향은 확인 가능하다. 다만 말라리아 요법·주택담보대출 조기상환의 구체 사례는 원서 페이지 직접 확인 전까지 사례 수준에서 단정하지 않는다."},{"i":13,"title":"12. 한 번도 일어난 적 없는 일은 반드시 일어나게 마련이다 (Surprise!)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>분석의 실패가 아니다. 상상력의 실패다.<\/li>\n<li>예상치 못한 일에 배워야 할 교훈은 '세상에는 놀랄 일이 생긴다.'<\/li>\n<li>전자에 감정이 있었다면 물리학이 얼마나 더 어려웠을지 상상해보라 (리처드파인만)<\/li>\n<li>과거에 의존하면 미래를 바꾸어 놓을 이례적인 사건을 놓칠 가능성이 크다.<\/li>\n<li>사람들의 탐욕이나 공포 같은 기본적인 인간 심리는 변하지 않아서 참고 해야한다.<\/li>\n<li>이번에도 과거와 절대 다르지 않을 것 이라는 사고는 투자를 할 때 가장 위험한 태도<\/li>\n<li>확실한 건, 세상에는 예측불허한 일이 생긴다는 그 사실뿐이다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 1929년 미국 증시 붕괴 전에는 신용과 낙관이 극단적으로 팽창했고, 1929년 8월 기준 브로커 대출이 85억 달러를 넘었다. 2007~2009년에는 S&amp;P 500이 고점 대비 56.8% 하락했다. 두 사건 모두 후행적으로는 설명이 넘치지만, 사전에는 다수가 “이번에는 다르다”는 서사를 믿었다.<\/li>\n<li>상황: 과거 데이터는 과거에 발생한 놀라움만 담고 있고, 미래에 등장할 새로운 놀라움은 담지 못한다.<\/li>\n<li>결과: 예측 실패의 상당 부분은 정보 부족보다 상상력 부족에서 온다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 이 장의 교훈은 “정확한 미래 예측”이 아니라 “놀라움이 생길 때도 버틸 구조”다.<\/li>\n<li>출처: 1929 crash 자료, S&amp;P bear market 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>브로커 대출<\/td>\n<td style=\"text-align: right;\">$8.5B+<\/td>\n<td>1929년 8월<\/td>\n<td>과도한 낙관은 레버리지와 함께 온다<\/td>\n<td>1929 crash 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>S&amp;P 500 최대 낙폭<\/td>\n<td style=\"text-align: right;\">-56.8%<\/td>\n<td>2007~2009<\/td>\n<td>고품질 자산도 예측 밖 충격에 크게 흔들림<\/td>\n<td>S&amp;P 역사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 이 장의 숫자는 “블랙스완을 맞히라”가 아니라, 놀라움이 구조적으로 반복된다는 점을 상기시킨다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 역사 공부는 예측 기계가 아니라 인간 본성의 반복을 보는 도구다.<\/li>\n<li><code>[추론]<\/code> 탐욕·공포·확증편향은 반복되지만, 충격의 구체적 형태는 반복되지 않는다. 그래서 사건 예측보다 회복력 설계가 중요하다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 현금관리, 폭락 대응<\/li>\n<li>행동 체크리스트<\/li>\n<li>예상 시나리오가 아닌 비예상 시나리오를 위해 현금·분산을 둔다.<\/li>\n<li>스트레스 테스트를 “내 예상이 틀렸을 때” 중심으로 만든다.<\/li>\n<li>리스크 관리 규칙을 호황기에 미리 적어 둔다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 분석 무용론이 아니다.<\/li>\n<li>분석은 필요하지만, 분석으로 제거할 수 없는 놀라움이 남는다는 전제를 잊지 말라는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 분석의 실패가 아니다. 상상력의 실패다. 예상치 못한 일에 배워야 할 교훈은 '세상에는 놀랄 일이 생긴다.' 전자에 감정이 있었다면 물리학이 얼마나 더 어려웠을지 상상해보라 (리처드파인만) 과거에 의존하면 미래를 바꾸어 놓을 이례적인 사건을 놓칠 가능성이 크다. 사람들의 탐욕이나 공포 같은 기본적인 인간 심리는 변하지 않아서 참고 해야한다. 이번에도 과거와 절대 다르지 않을 것 이라는 사고는 투자를 할 때 가장 위험한 태도 확실한 건, 세상에는 예측불허한 일이 생긴다는 그 사실뿐이다. [사례] 인물/사건: 1929년 미국 증시 붕괴 전에는 신용과 낙관이 극단적으로 팽창했고, 1929년 8월 기준 브로커 대출이 85억 달러를 넘었다. 2007~2009년에는 S&amp;P 500이 고점 대비 56.8% 하락했다. 두 사건 모두 후행적으로는 설명이 넘치지만, 사전에는 다수가 “이번에는 다르다”는 서사를 믿었다. 상황: 과거 데이터는 과거에 발생한 놀라움만 담고 있고, 미래에 등장할 새로운 놀라움은 담지 못한다. 결과: 예측 실패의 상당 부분은 정보 부족보다 상상력 부족에서 온다. 이 장의 교훈과 연결: [하우절 본문] 이 장의 교훈은 “정확한 미래 예측”이 아니라 “놀라움이 생길 때도 버틸 구조”다. 출처: 1929 crash 자료, S&amp;P bear market 자료. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 브로커 대출 $8.5B+ 1929년 8월 과도한 낙관은 레버리지와 함께 온다 1929 crash 자료 B S&amp;P 500 최대 낙폭 -56.8% 2007~2009 고품질 자산도 예측 밖 충격에 크게 흔들림 S&amp;P 역사 자료 B 데이터 주석: 이 장의 숫자는 “블랙스완을 맞히라”가 아니라, 놀라움이 구조적으로 반복된다는 점을 상기시킨다. [보강 | 논리 전개] [하우절 본문] 역사 공부는 예측 기계가 아니라 인간 본성의 반복을 보는 도구다. [추론] 탐욕·공포·확증편향은 반복되지만, 충격의 구체적 형태는 반복되지 않는다. 그래서 사건 예측보다 회복력 설계가 중요하다. [실전 적용] 적용 영역: 포트폴리오, 현금관리, 폭락 대응 행동 체크리스트 예상 시나리오가 아닌 비예상 시나리오를 위해 현금·분산을 둔다. 스트레스 테스트를 “내 예상이 틀렸을 때” 중심으로 만든다. 리스크 관리 규칙을 호황기에 미리 적어 둔다. [오해 방지] 이 장은 분석 무용론이 아니다. 분석은 필요하지만, 분석으로 제거할 수 없는 놀라움이 남는다는 전제를 잊지 말라는 뜻이다."},{"i":14,"title":"13. 안전마진 (Room for Error)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>아무리 내가 옳다 해도 내 앞에 있는 칩을 몽땅 걸 수 있는 순간은 없다.<\/li>\n<li>안전마진의 목적은 예측을 불필요하게 만들기 위한 것.<\/li>\n<li>행복해지는 최선의 길은 목표를 낮추는 것이다. (찰리멍거)<\/li>\n<li>미래 수익률 추산 시 역으로 실수의 여지를 이용하라 (역사적 평균보다 1/3 더 낮다고 가정하기)<\/li>\n<li>리스크를 과소평가 하지 말고 또, 레버리지는 악마다.<\/li>\n<li>돈과 관련된 Single point of failure 는 월급에 의존 하여 이유 없는 저축을 하지 않는 것<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[해당 장은 사례보다 논지 중심]<\/code> 카드카운터 비유는 안전마진과 생존을 설명하는 <code>[후대 해석]<\/code>으로는 적절하다. 실제 카드카운팅은 플레이어 우위가 생길 때만 베팅을 키우고, 우위가 약하면 규모를 줄이는 구조를 가진다. 다만 이 비유가 하우절의 원문 사례인지 여부는 이번 재검토에서 직접 확인하지 못했으므로 <code>[출처 추가 확인 필요]<\/code>를 유지한다.<\/li>\n<li>상황: 미래는 틀릴 가능성이 기본값이므로, 예측 정밀도보다 오차 허용폭이 먼저다.<\/li>\n<li>결과: 안전마진은 수익률을 깎는 장치가 아니라 파산 확률을 낮추는 장치다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 안전마진의 목적은 내 예측이 틀려도 살아남게 하는 것이다.<\/li>\n<li>출처: 책 일반 개요, Housel 장기·생존 인터뷰.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<ul>\n<li><code>[데이터]<\/code> 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 안전마진은 ‘정답 확률 극대화’가 아니라 ‘오답 비용 최소화’다.<\/li>\n<li><code>[추론]<\/code> 투자에서 치명상은 늘 단일고장점(single point of failure)에서 발생한다. 소득원 하나, 자산군 하나, 대출 구조 하나에 모두 걸려 있으면 작은 오류가 큰 파산으로 번진다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 현금관리, 레버리지<\/li>\n<li>행동 체크리스트<\/li>\n<li>기대수익률 가정치를 의도적으로 보수화한다.<\/li>\n<li>단일소득·단일자산·단일대출 의존도를 낮춘다.<\/li>\n<li>현금 쿠션과 재투자 여력을 함께 둔다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>안전마진은 겁먹고 투자하지 말라는 뜻이 아니다.<\/li>\n<li>오히려 더 오래 투자하기 위해 미리 실수 예산을 확보하라는 뜻이다.<\/li>\n<\/ul>\n<h3>[추가 검증 반영]<\/h3>\n<ul>\n<li>카드카운터 비유는 하우절 본문 사례로 확정하지 않고 <code>[후대 해석]<\/code> 또는 <code>[출처 추가 확인 필요]<\/code>로 분리한다. 비유의 수학적 구조는 안전마진 설명에 유용하지만, 원문 사례 여부는 추가 대조가 필요하다.<\/li>\n<\/ul>","text":"기존 노트 아무리 내가 옳다 해도 내 앞에 있는 칩을 몽땅 걸 수 있는 순간은 없다. 안전마진의 목적은 예측을 불필요하게 만들기 위한 것. 행복해지는 최선의 길은 목표를 낮추는 것이다. (찰리멍거) 미래 수익률 추산 시 역으로 실수의 여지를 이용하라 (역사적 평균보다 1/3 더 낮다고 가정하기) 리스크를 과소평가 하지 말고 또, 레버리지는 악마다. 돈과 관련된 Single point of failure 는 월급에 의존 하여 이유 없는 저축을 하지 않는 것 [사례] 인물/사건: [해당 장은 사례보다 논지 중심] 카드카운터 비유는 안전마진과 생존을 설명하는 [후대 해석] 으로는 적절하다. 실제 카드카운팅은 플레이어 우위가 생길 때만 베팅을 키우고, 우위가 약하면 규모를 줄이는 구조를 가진다. 다만 이 비유가 하우절의 원문 사례인지 여부는 이번 재검토에서 직접 확인하지 못했으므로 [출처 추가 확인 필요] 를 유지한다. 상황: 미래는 틀릴 가능성이 기본값이므로, 예측 정밀도보다 오차 허용폭이 먼저다. 결과: 안전마진은 수익률을 깎는 장치가 아니라 파산 확률을 낮추는 장치다. 이 장의 교훈과 연결: [하우절 본문] 안전마진의 목적은 내 예측이 틀려도 살아남게 하는 것이다. 출처: 책 일반 개요, Housel 장기·생존 인터뷰. [데이터] [데이터] 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다. [보강 | 논리 전개] [하우절 본문] 안전마진은 ‘정답 확률 극대화’가 아니라 ‘오답 비용 최소화’다. [추론] 투자에서 치명상은 늘 단일고장점(single point of failure)에서 발생한다. 소득원 하나, 자산군 하나, 대출 구조 하나에 모두 걸려 있으면 작은 오류가 큰 파산으로 번진다. [실전 적용] 적용 영역: 포트폴리오, 현금관리, 레버리지 행동 체크리스트 기대수익률 가정치를 의도적으로 보수화한다. 단일소득·단일자산·단일대출 의존도를 낮춘다. 현금 쿠션과 재투자 여력을 함께 둔다. [오해 방지] 안전마진은 겁먹고 투자하지 말라는 뜻이 아니다. 오히려 더 오래 투자하기 위해 미리 실수 예산을 확보하라는 뜻이다. [추가 검증 반영] 카드카운터 비유는 하우절 본문 사례로 확정하지 않고 [후대 해석] 또는 [출처 추가 확인 필요] 로 분리한다. 비유의 수학적 구조는 안전마진 설명에 유용하지만, 원문 사례 여부는 추가 대조가 필요하다."},{"i":15,"title":"14. 과거의 나 vs. 미래의 나 (You'll Change)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>사람들은 자신의 미래를 예측하는 능력이 형편없다.<\/li>\n<li>복리의 첫 번째 규칙은 \"절대 불필요하게 중단하지 않는 것.\" (찰리멍거)<\/li>\n<li>금융 계획에서 양극단은 피해야 한다.<\/li>\n<li>적당한 연간 저축, 자유시간, 가족과 함께 보내는 것을 목표로 잡으면 후회를 피할 가능성이 높아진다.<\/li>\n<li>우리의 마음이 변한다는 현실을 받아들여야 한다.<\/li>\n<li>매몰비용에 매이지 말고 목표가 바뀌면 더 빨리 결단을 내리고 빨리 업데이트 하라.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 심리학의 ‘end-of-history illusion’ 연구는 18세부터 68세까지 19,000명 이상을 분석해, 사람들은 과거의 변화는 크게 인식하면서도 미래의 변화는 과소추정하는 경향이 있음을 보여 줬다.<\/li>\n<li>상황: 오늘의 취향·욕망·직업관·가족관계가 미래에도 거의 그대로일 것이라고 믿기 쉽다.<\/li>\n<li>결과: 너무 극단적인 재무계획은 미래의 내가 바뀌는 순간 후회와 비용을 크게 만든다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 탄력적 계획이 극단적 최적화보다 낫다.<\/li>\n<li>출처: End-of-history illusion 연구 요약.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>연구 참가자 수<\/td>\n<td style=\"text-align: right;\">19,000명+<\/td>\n<td>2013 연구<\/td>\n<td>미래의 자기 변화를 체계적으로 과소추정<\/td>\n<td>연구 요약<\/td>\n<td>A-B<\/td>\n<\/tr>\n<tr>\n<td>연령 범위<\/td>\n<td style=\"text-align: right;\">18~68세<\/td>\n<td>연구 표본<\/td>\n<td>연령과 무관하게 착시가 나타남<\/td>\n<td>연구 요약<\/td>\n<td>A-B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 이 장의 계량 근거는 “지금 원하는 것”이 장기계획의 단단한 기반이 아니라는 점이다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 장기 복리는 중단하지 않는 것이 핵심이지만, 인간은 변한다.<\/li>\n<li><code>[추론]<\/code> 그래서 복리를 극대화하는 진짜 방법은 완벽한 계획을 세우는 것이 아니라, 변화해도 깨지지 않는 중간 정도의 계획을 두는 것이다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 저축, 자산배분, 인생계획<\/li>\n<li>행동 체크리스트<\/li>\n<li>10년 후에도 유지 가능한 생활수준 가정을 잡는다.<\/li>\n<li>너무 빡빡한 FIRE식 목표나 너무 공격적 리스크 계획을 경계한다.<\/li>\n<li>계획을 매몰비용 없이 정기 업데이트한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>마음이 변하니 계획이 무의미하다는 뜻은 아니다.<\/li>\n<li>오히려 변화 가능성을 반영하는 유연한 계획이 더 현실적이라는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 사람들은 자신의 미래를 예측하는 능력이 형편없다. 복리의 첫 번째 규칙은 \"절대 불필요하게 중단하지 않는 것.\" (찰리멍거) 금융 계획에서 양극단은 피해야 한다. 적당한 연간 저축, 자유시간, 가족과 함께 보내는 것을 목표로 잡으면 후회를 피할 가능성이 높아진다. 우리의 마음이 변한다는 현실을 받아들여야 한다. 매몰비용에 매이지 말고 목표가 바뀌면 더 빨리 결단을 내리고 빨리 업데이트 하라. [사례] 인물/사건: 심리학의 ‘end-of-history illusion’ 연구는 18세부터 68세까지 19,000명 이상을 분석해, 사람들은 과거의 변화는 크게 인식하면서도 미래의 변화는 과소추정하는 경향이 있음을 보여 줬다. 상황: 오늘의 취향·욕망·직업관·가족관계가 미래에도 거의 그대로일 것이라고 믿기 쉽다. 결과: 너무 극단적인 재무계획은 미래의 내가 바뀌는 순간 후회와 비용을 크게 만든다. 이 장의 교훈과 연결: [하우절 본문] 탄력적 계획이 극단적 최적화보다 낫다. 출처: End-of-history illusion 연구 요약. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 연구 참가자 수 19,000명+ 2013 연구 미래의 자기 변화를 체계적으로 과소추정 연구 요약 A-B 연령 범위 18~68세 연구 표본 연령과 무관하게 착시가 나타남 연구 요약 A-B 데이터 주석: 이 장의 계량 근거는 “지금 원하는 것”이 장기계획의 단단한 기반이 아니라는 점이다. [보강 | 논리 전개] [하우절 본문] 장기 복리는 중단하지 않는 것이 핵심이지만, 인간은 변한다. [추론] 그래서 복리를 극대화하는 진짜 방법은 완벽한 계획을 세우는 것이 아니라, 변화해도 깨지지 않는 중간 정도의 계획을 두는 것이다. [실전 적용] 적용 영역: 저축, 자산배분, 인생계획 행동 체크리스트 10년 후에도 유지 가능한 생활수준 가정을 잡는다. 너무 빡빡한 FIRE식 목표나 너무 공격적 리스크 계획을 경계한다. 계획을 매몰비용 없이 정기 업데이트한다. [오해 방지] 마음이 변하니 계획이 무의미하다는 뜻은 아니다. 오히려 변화 가능성을 반영하는 유연한 계획이 더 현실적이라는 뜻이다."},{"i":16,"title":"15. 보이지 않는 가격표 (Nothing's Free)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>모든 것에는 가격이 있지만 그러나 모든 가격이 가격표에 표시되는 것은 아니다.<\/li>\n<li>뭐든 밖에서 보면 쉬워 보이는 법<\/li>\n<li>성공적인 가치 투자는 변동성, 공포, 의심, 불확실성, 후회의 형태로 비용을 지불한다.<\/li>\n<li>시장의 변동성에 의한 손실은 범칙금이 아니라 수수료 일 뿐이다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 닷컴 버블 후 나스닥은 2000년 3월 고점 대비 2002년 10월까지 78% 하락했다. S&amp;P 500도 2007년 10월부터 2009년 3월까지 56.8% 하락했다. 둘 다 “장기적으로 좋은 자산”에 투자해도 중간 과정의 가격표는 심각한 공포라는 점을 보여 준다.<\/li>\n<li>상황: 사람들은 장기 수익률은 부러워하지만, 그 수익률을 얻기 위해 중간에 지불해야 하는 변동성의 감정 비용은 과소평가한다.<\/li>\n<li>결과: 변동성을 벌금으로 보면 전략을 포기하고, 수수료로 보면 견딜 수 있다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 좋은 자산의 장기 초과수익은 불편함의 대가다.<\/li>\n<li>출처: Nasdaq/S&amp;P 역사 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>나스닥 최대 낙폭<\/td>\n<td style=\"text-align: right;\">-78%<\/td>\n<td>2000~2002<\/td>\n<td>우량 성장 스토리도 감정 비용은 막대함<\/td>\n<td>Nasdaq 역사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>S&amp;P 500 최대 낙폭<\/td>\n<td style=\"text-align: right;\">-56.8%<\/td>\n<td>2007~2009<\/td>\n<td>폭락은 장기 수익의 “입장료”일 수 있음<\/td>\n<td>S&amp;P 역사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 변동성은 사후에만 견딜 만해 보인다. 실시간으로는 늘 벌금처럼 느껴진다. 하우절은 이 착시를 깨려 한다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 시장 수익은 무료가 아니다. 가격표가 숫자가 아닌 감정으로 붙어 있을 뿐이다.<\/li>\n<li><code>[추론]<\/code> 장기 투자자가 해야 할 일은 이 가격을 없애는 것이 아니라, 감당 가능한 수준으로 설계하는 것이다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 폭락 대응<\/li>\n<li>행동 체크리스트<\/li>\n<li>최대낙폭(MDD)을 미리 알고 투자한다.<\/li>\n<li>낙폭 시 추가 매수/보유/리밸런싱 규칙을 사전에 쓴다.<\/li>\n<li>변동성 비용을 버틸 수 있게 주식 비중을 조절한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 변동성이 크면 다 좋은 자산이라는 뜻이 아니다.<\/li>\n<li>변동성은 필요조건도 충분조건도 아니다. 단지 좋은 장기 자산조차 공짜로 주어지지 않는다는 의미다.<\/li>\n<\/ul>","text":"기존 노트 모든 것에는 가격이 있지만 그러나 모든 가격이 가격표에 표시되는 것은 아니다. 뭐든 밖에서 보면 쉬워 보이는 법 성공적인 가치 투자는 변동성, 공포, 의심, 불확실성, 후회의 형태로 비용을 지불한다. 시장의 변동성에 의한 손실은 범칙금이 아니라 수수료 일 뿐이다. [사례] 인물/사건: 닷컴 버블 후 나스닥은 2000년 3월 고점 대비 2002년 10월까지 78% 하락했다. S&amp;P 500도 2007년 10월부터 2009년 3월까지 56.8% 하락했다. 둘 다 “장기적으로 좋은 자산”에 투자해도 중간 과정의 가격표는 심각한 공포라는 점을 보여 준다. 상황: 사람들은 장기 수익률은 부러워하지만, 그 수익률을 얻기 위해 중간에 지불해야 하는 변동성의 감정 비용은 과소평가한다. 결과: 변동성을 벌금으로 보면 전략을 포기하고, 수수료로 보면 견딜 수 있다. 이 장의 교훈과 연결: [하우절 본문] 좋은 자산의 장기 초과수익은 불편함의 대가다. 출처: Nasdaq/S&amp;P 역사 자료. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 나스닥 최대 낙폭 -78% 2000~2002 우량 성장 스토리도 감정 비용은 막대함 Nasdaq 역사 자료 B S&amp;P 500 최대 낙폭 -56.8% 2007~2009 폭락은 장기 수익의 “입장료”일 수 있음 S&amp;P 역사 자료 B 데이터 주석: 변동성은 사후에만 견딜 만해 보인다. 실시간으로는 늘 벌금처럼 느껴진다. 하우절은 이 착시를 깨려 한다. [보강 | 논리 전개] [하우절 본문] 시장 수익은 무료가 아니다. 가격표가 숫자가 아닌 감정으로 붙어 있을 뿐이다. [추론] 장기 투자자가 해야 할 일은 이 가격을 없애는 것이 아니라, 감당 가능한 수준으로 설계하는 것이다. [실전 적용] 적용 영역: 포트폴리오, 폭락 대응 행동 체크리스트 최대낙폭(MDD)을 미리 알고 투자한다. 낙폭 시 추가 매수/보유/리밸런싱 규칙을 사전에 쓴다. 변동성 비용을 버틸 수 있게 주식 비중을 조절한다. [오해 방지] 이 장은 변동성이 크면 다 좋은 자산이라는 뜻이 아니다. 변동성은 필요조건도 충분조건도 아니다. 단지 좋은 장기 자산조차 공짜로 주어지지 않는다는 의미다."},{"i":17,"title":"16. 너와 나는 다른 게임을 하고 있다 (You & Me)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>투자자들은 자신도 모르게 나와 다른 게임을 하는 투자자로부터 신호를 읽는다.<\/li>\n<li>자산에는 단일한 합리적 가격이 있다는 개념은 막대한 손해를 끼치고 있는 개념이다.<\/li>\n<li>서로 다른 목표와 시간 계획을 가지고 있다면 서로 다른 합리적 가격이 있다. (버블)<\/li>\n<li>내가 어떤 게임을 하는지 파악하기 위해 많은 노력을 기울이고 나와 다른 사람들의 행동에 설득 당하지 않기<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 닷컴 버블에서 나스닥은 1995년부터 2000년 3월 고점까지 약 600% 상승했고, 1999년 한 해만 85.6% 상승했다. 같은 해 S&amp;P 500은 19.5% 상승했지만, 더 많은 종목이 하락한 가운데도 자금은 인터넷·고속성장 테마로 쏠렸다. 이는 장기 투자자, 단기 투기자, 신규 개인투자자가 서로 다른 시간지평으로 같은 자산을 가격 매긴 전형적 사례다.<\/li>\n<li>상황: 내 목표가 10년 보유인데 시장 가격은 10일 보유자의 행동으로 흔들릴 수 있다.<\/li>\n<li>결과: 같은 자산에도 단일한 합리 가격은 없다. 누가 무슨 게임을 하느냐에 따라 ‘합리적’ 가격이 달라진다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 남의 시간지평에서 나온 가격 신호를 내 의사결정 규칙으로 채택하면 버블과 공포에 휘말린다.<\/li>\n<li>출처: dot-com bubble, Nasdaq performance 자료.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>나스닥 상승폭<\/td>\n<td style=\"text-align: right;\">+600%<\/td>\n<td>1995~2000 고점<\/td>\n<td>장기가치보다 단기 기대가 가격을 지배한 시기<\/td>\n<td>역사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>나스닥 연간 상승률<\/td>\n<td style=\"text-align: right;\">+85.6%<\/td>\n<td>1999<\/td>\n<td>“다른 게임”의 열기가 극단화<\/td>\n<td>역사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>S&amp;P 500 연간 상승률<\/td>\n<td style=\"text-align: right;\">+19.5%<\/td>\n<td>1999<\/td>\n<td>같은 시장 안에서도 시간지평별 가격화가 다름<\/td>\n<td>역사 자료<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 닷컴 버블은 하우절이 말한 “서로 다른 시간지평의 충돌”이 가격에 어떻게 반영되는지 보여 준다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 버블은 사람들이 멍청해서 생기는 것이 아니라, 각자 다른 게임 규칙으로 같은 표를 읽기 때문에 생긴다.<\/li>\n<li><code>[추론]<\/code> 포트폴리오 규칙은 내 투자기간에 맞아야 한다. 30년 투자자가 3일 투자자의 행동을 따라가면 구조적으로 불리하다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 매수, 매도, 포트폴리오<\/li>\n<li>행동 체크리스트<\/li>\n<li>내 보유기간과 매매 빈도를 명확히 적는다.<\/li>\n<li>가격 급등락의 원인이 장기 펀더멘털인지, 단기 흐름인지 구분한다.<\/li>\n<li>커뮤니티·뉴스의 속도에 내 전략을 맞추지 않는다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 시장가격을 무시하라는 뜻이 아니다.<\/li>\n<li>시장가격이 전달하는 정보의 시간지평을 구분하라는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 투자자들은 자신도 모르게 나와 다른 게임을 하는 투자자로부터 신호를 읽는다. 자산에는 단일한 합리적 가격이 있다는 개념은 막대한 손해를 끼치고 있는 개념이다. 서로 다른 목표와 시간 계획을 가지고 있다면 서로 다른 합리적 가격이 있다. (버블) 내가 어떤 게임을 하는지 파악하기 위해 많은 노력을 기울이고 나와 다른 사람들의 행동에 설득 당하지 않기 [사례] 인물/사건: 닷컴 버블에서 나스닥은 1995년부터 2000년 3월 고점까지 약 600% 상승했고, 1999년 한 해만 85.6% 상승했다. 같은 해 S&amp;P 500은 19.5% 상승했지만, 더 많은 종목이 하락한 가운데도 자금은 인터넷·고속성장 테마로 쏠렸다. 이는 장기 투자자, 단기 투기자, 신규 개인투자자가 서로 다른 시간지평으로 같은 자산을 가격 매긴 전형적 사례다. 상황: 내 목표가 10년 보유인데 시장 가격은 10일 보유자의 행동으로 흔들릴 수 있다. 결과: 같은 자산에도 단일한 합리 가격은 없다. 누가 무슨 게임을 하느냐에 따라 ‘합리적’ 가격이 달라진다. 이 장의 교훈과 연결: [하우절 본문] 남의 시간지평에서 나온 가격 신호를 내 의사결정 규칙으로 채택하면 버블과 공포에 휘말린다. 출처: dot-com bubble, Nasdaq performance 자료. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 나스닥 상승폭 +600% 1995~2000 고점 장기가치보다 단기 기대가 가격을 지배한 시기 역사 자료 B 나스닥 연간 상승률 +85.6% 1999 “다른 게임”의 열기가 극단화 역사 자료 B S&amp;P 500 연간 상승률 +19.5% 1999 같은 시장 안에서도 시간지평별 가격화가 다름 역사 자료 B 데이터 주석: 닷컴 버블은 하우절이 말한 “서로 다른 시간지평의 충돌”이 가격에 어떻게 반영되는지 보여 준다. [보강 | 논리 전개] [하우절 본문] 버블은 사람들이 멍청해서 생기는 것이 아니라, 각자 다른 게임 규칙으로 같은 표를 읽기 때문에 생긴다. [추론] 포트폴리오 규칙은 내 투자기간에 맞아야 한다. 30년 투자자가 3일 투자자의 행동을 따라가면 구조적으로 불리하다. [실전 적용] 적용 영역: 매수, 매도, 포트폴리오 행동 체크리스트 내 보유기간과 매매 빈도를 명확히 적는다. 가격 급등락의 원인이 장기 펀더멘털인지, 단기 흐름인지 구분한다. 커뮤니티·뉴스의 속도에 내 전략을 맞추지 않는다. [오해 방지] 이 장은 시장가격을 무시하라는 뜻이 아니다. 시장가격이 전달하는 정보의 시간지평을 구분하라는 뜻이다."},{"i":18,"title":"17. 비판주의의 유혹 (The Seduction of Pessimism)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>낙관주의는 제품 홍보처럼 들리고 비관주의는 나를 도와주려는 말처럼 들린다.<\/li>\n<li>손실을 극도로 싫어하는 것이 진화 과정에서 만들어진 생존책이라고 주장 (대니얼카너먼)<\/li>\n<li>단기간 주가가 40% 하락하면 사람들은 크게 동요하지만 6년간 140%가 올라도 아무도 눈치채지 못한다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: 2026년 6월 5일 나스닥은 하루에 4.2%, S&amp;P 500은 2.6% 하락하며 강한 헤드라인을 만들었다. 그러나 그 직전 두 달간 S&amp;P 500은 약 19.5% 올라 1950년 이후 손꼽히는 강한 랠리 중 하나였다. 사람들의 주목은 느린 상승보다 빠른 하락에 훨씬 더 크게 반응한다.<\/li>\n<li>상황: 비관은 즉시성과 선명도가 높고, 낙관은 서서히 누적되기 때문에 덜 극적으로 보인다.<\/li>\n<li>결과: 비관론은 더 지적으로 들리고, 더 현실적인 충고처럼 받아들여진다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 투자자는 뉴스의 속도와 복리의 속도가 다르다는 점을 이해해야 한다.<\/li>\n<li>출처: Reuters/AP/MarketWatch 최근 시장 보도.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>나스닥 일간 하락<\/td>\n<td style=\"text-align: right;\">-4.2%<\/td>\n<td>2026-06-05<\/td>\n<td>급락은 주목과 감정 반응을 즉시 유발<\/td>\n<td>AP<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>S&amp;P 500 일간 하락<\/td>\n<td style=\"text-align: right;\">-2.6%<\/td>\n<td>2026-06-05<\/td>\n<td>손실 뉴스는 속도가 빠름<\/td>\n<td>AP<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>S&amp;P 500 두 달 상승<\/td>\n<td style=\"text-align: right;\">약 +19.5%<\/td>\n<td>2026년 봄<\/td>\n<td>큰 상승도 느리게 오면 덜 체감<\/td>\n<td>MarketWatch<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 한 번의 큰 하락은 뉴스가 되고, 긴 기간의 큰 상승은 배경이 된다. 하우절의 비관주의 유혹 논리와 정확히 맞닿는다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 사람은 손실회피 성향 때문에 비관에 더 민감하다.<\/li>\n<li><code>[추론]<\/code> 미디어 구조도 비관을 강화한다. 급락은 즉시 보도 가능하지만, 장기복리는 느리고 지루해 보도 친화적이지 않다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 매수, 매도, 뉴스 소비<\/li>\n<li>행동 체크리스트<\/li>\n<li>단기 뉴스와 장기 추세를 별도 화면으로 본다.<\/li>\n<li>폭락 기사 소비량을 제한한다.<\/li>\n<li>기대수익을 월간 뉴스가 아니라 장기 보유 전제로 평가한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장은 비관을 무시하고 무조건 낙관하라는 뜻이 아니다.<\/li>\n<li>비관이 더 “똑똑해 보인다”는 심리 프리미엄을 경계하라는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 낙관주의는 제품 홍보처럼 들리고 비관주의는 나를 도와주려는 말처럼 들린다. 손실을 극도로 싫어하는 것이 진화 과정에서 만들어진 생존책이라고 주장 (대니얼카너먼) 단기간 주가가 40% 하락하면 사람들은 크게 동요하지만 6년간 140%가 올라도 아무도 눈치채지 못한다. [사례] 인물/사건: 2026년 6월 5일 나스닥은 하루에 4.2%, S&amp;P 500은 2.6% 하락하며 강한 헤드라인을 만들었다. 그러나 그 직전 두 달간 S&amp;P 500은 약 19.5% 올라 1950년 이후 손꼽히는 강한 랠리 중 하나였다. 사람들의 주목은 느린 상승보다 빠른 하락에 훨씬 더 크게 반응한다. 상황: 비관은 즉시성과 선명도가 높고, 낙관은 서서히 누적되기 때문에 덜 극적으로 보인다. 결과: 비관론은 더 지적으로 들리고, 더 현실적인 충고처럼 받아들여진다. 이 장의 교훈과 연결: [하우절 본문] 투자자는 뉴스의 속도와 복리의 속도가 다르다는 점을 이해해야 한다. 출처: Reuters/AP/MarketWatch 최근 시장 보도. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 나스닥 일간 하락 -4.2% 2026-06-05 급락은 주목과 감정 반응을 즉시 유발 AP A S&amp;P 500 일간 하락 -2.6% 2026-06-05 손실 뉴스는 속도가 빠름 AP A S&amp;P 500 두 달 상승 약 +19.5% 2026년 봄 큰 상승도 느리게 오면 덜 체감 MarketWatch B 데이터 주석: 한 번의 큰 하락은 뉴스가 되고, 긴 기간의 큰 상승은 배경이 된다. 하우절의 비관주의 유혹 논리와 정확히 맞닿는다. [보강 | 논리 전개] [하우절 본문] 사람은 손실회피 성향 때문에 비관에 더 민감하다. [추론] 미디어 구조도 비관을 강화한다. 급락은 즉시 보도 가능하지만, 장기복리는 느리고 지루해 보도 친화적이지 않다. [실전 적용] 적용 영역: 매수, 매도, 뉴스 소비 행동 체크리스트 단기 뉴스와 장기 추세를 별도 화면으로 본다. 폭락 기사 소비량을 제한한다. 기대수익을 월간 뉴스가 아니라 장기 보유 전제로 평가한다. [오해 방지] 이 장은 비관을 무시하고 무조건 낙관하라는 뜻이 아니다. 비관이 더 “똑똑해 보인다”는 심리 프리미엄을 경계하라는 뜻이다."},{"i":19,"title":"18. 간절하면 믿게 되는 법이죠 (When You'll Believe Anything)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>경제와 투자를 움직이는 가장 강력한 힘은 눈에 보이는 물리적 팩트나 자산이 아니라 보이지 않는 내러티브<\/li>\n<li>우리의 시장 예측은 아주, 아주 형편없다.<\/li>\n<li>리스크란 내가 모든 경우의 수를 다 생각했다고 여길 때 남은 것이다.<\/li>\n<li>우리는 예측, 통제 가능한 세상에 살고 있다는 믿음이 필요해서 그것을 약속하는 사람들에게 의지한다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[해당 장은 사례보다 논지 중심]<\/code> 이 장은 특정 일화보다 “왜 인간이 내러티브를 필요로 하는가”를 설명하는 철학적 장에 가깝다. <code>[후대 해석]<\/code> 메이도프 사건은 일관된 수익 서사가 얼마나 강하게 사람을 안심시키는지 보여 주는 보조 사례로 읽을 수 있으나, 이는 장 본문의 직접 사례라기보다 응용 해석에 가깝다.<\/li>\n<li>상황: 불확실성이 클수록 사람은 숫자보다 이해 가능한 이야기, 예측 가능한 설명, 확실한 약속에 끌린다.<\/li>\n<li>결과: 시장 예측과 경제 담론은 종종 데이터보다 서사의 설득력으로 소비된다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 리스크는 “내가 다 안다”는 감각 바깥에 남는 잔여물이다.<\/li>\n<li>출처: 책 개요, Madoff 보조 사례.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<ul>\n<li><code>[데이터]<\/code> 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 인간은 무작위 세계를 견디기 어려워해 설명 가능한 내러티브를 만들어 낸다.<\/li>\n<li><code>[추론]<\/code> 투자자의 핵심 방어는 예측 정확도 향상이 아니라, 내러티브의 매혹 앞에서 포지션 규모를 제한하는 것이다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 매수, 매도, 정보판별<\/li>\n<li>행동 체크리스트<\/li>\n<li>너무 매끈한 전망은 한 번 더 의심한다.<\/li>\n<li>“왜 이 이야기를 믿고 싶은가”를 자문한다.<\/li>\n<li>서사 강도와 무관하게 분산·현금 규칙을 유지한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이야기가 중요하다고 해서 데이터가 무의미한 것은 아니다.<\/li>\n<li>문제는 데이터를 압도하는 이야기의 매혹이지, 이야기 자체가 아니다.<\/li>\n<\/ul>","text":"기존 노트 경제와 투자를 움직이는 가장 강력한 힘은 눈에 보이는 물리적 팩트나 자산이 아니라 보이지 않는 내러티브 우리의 시장 예측은 아주, 아주 형편없다. 리스크란 내가 모든 경우의 수를 다 생각했다고 여길 때 남은 것이다. 우리는 예측, 통제 가능한 세상에 살고 있다는 믿음이 필요해서 그것을 약속하는 사람들에게 의지한다. [사례] 인물/사건: [해당 장은 사례보다 논지 중심] 이 장은 특정 일화보다 “왜 인간이 내러티브를 필요로 하는가”를 설명하는 철학적 장에 가깝다. [후대 해석] 메이도프 사건은 일관된 수익 서사가 얼마나 강하게 사람을 안심시키는지 보여 주는 보조 사례로 읽을 수 있으나, 이는 장 본문의 직접 사례라기보다 응용 해석에 가깝다. 상황: 불확실성이 클수록 사람은 숫자보다 이해 가능한 이야기, 예측 가능한 설명, 확실한 약속에 끌린다. 결과: 시장 예측과 경제 담론은 종종 데이터보다 서사의 설득력으로 소비된다. 이 장의 교훈과 연결: [하우절 본문] 리스크는 “내가 다 안다”는 감각 바깥에 남는 잔여물이다. 출처: 책 개요, Madoff 보조 사례. [데이터] [데이터] 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다. [보강 | 논리 전개] [하우절 본문] 인간은 무작위 세계를 견디기 어려워해 설명 가능한 내러티브를 만들어 낸다. [추론] 투자자의 핵심 방어는 예측 정확도 향상이 아니라, 내러티브의 매혹 앞에서 포지션 규모를 제한하는 것이다. [실전 적용] 적용 영역: 매수, 매도, 정보판별 행동 체크리스트 너무 매끈한 전망은 한 번 더 의심한다. “왜 이 이야기를 믿고 싶은가”를 자문한다. 서사 강도와 무관하게 분산·현금 규칙을 유지한다. [오해 방지] 이야기가 중요하다고 해서 데이터가 무의미한 것은 아니다. 문제는 데이터를 압도하는 이야기의 매혹이지, 이야기 자체가 아니다."},{"i":20,"title":"19. 돈에 대한 보편적인 진실 몇 가지 (All Together Now)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>우리는 같은 이야기를 들어도 다른 결론에 도달할 수 있다.<\/li>\n<li>일이 잘 풀릴 때는 겸손을 찾기 위해 노력하고, 일이 잘못될 때는 용서와 연민을 찾기 위해 최선을 다하라.<\/li>\n<li>저축이란 나의 자존심과 소득 사이에 생긴 틈이고, 부는 눈에 잘 보이지 않는다. (절약, 저축)<\/li>\n<li>투자는 밤잠을 설치지 않고 안심할 수 있는 방법을 찾아야 한다.<\/li>\n<li>더 나은 투자자가 되는 가장 강력한 조치는 시간을 보는 눈을 넓히는 것이다.<\/li>\n<li>개별 투자를 보지 말고 전체 포트폴리오를 살피고 손익비가 중요하다.<\/li>\n<li>내가 원할 때, 원하는 것을, 원하는 사람과, 원하는 만큼 오랫동안 할 수 있는 것이 돈이 주는 가장 큰 배당금<\/li>\n<li>그냥 저축하라. 특별히 용도를 정해두지 않은 저축은 최악의 순간 최고의 대비책이다.<\/li>\n<li>가치 있는 것 중에 공짜는 없고 투자는 불확실성, 의심, 후회 등의 수수료가 발생하고 이것은 벌금이 아니다.<\/li>\n<li>실수의 여지에 항상 대비하면 파산하지 않고 게임을 계속 이어 나갈 수 있고 복리의 마법을 만들어준다.<\/li>\n<li>시간이 지나면 누구나 목표, 욕망이 바뀐다. 과거의 투자 결정이 극단적이면 후회할 가능성도 커진다.<\/li>\n<li>리스크를 피하지 말고 받아들이고 리스크를 좋아하라. (단 레버리지, 몰빵 등 과도한 리스크 주의)<\/li>\n<li>다른 사람의 움직임에 부화뇌동하지 않고 나와 다른 게임을 하는 사람들의 영향을 받지 않게끔 하라.<\/li>\n<li>돈 문제는 각자 의견이 다르고 이 혼란을 존중해라. 하나의 정답은 없고 오직 나에게 맞는 답이 있을 뿐이다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[해당 장은 사례보다 논지 중심]<\/code> 이 장은 앞선 18개 장의 스토리를 행동원칙으로 묶는 통합 장이다.<\/li>\n<li>상황: 각 장에서 따로 봤던 겸손, 저축, 자유, 장기, 안전마진, 변동성 수용, 비교심리 억제가 하나의 운영체계로 연결된다.<\/li>\n<li>결과: 좋은 투자자는 더 많은 정보를 가진 사람이 아니라, 더 일관된 행동 규칙을 가진 사람에 가깝다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 돈에 대한 보편 진실은 정답이 하나라는 뜻이 아니라, 반복적으로 유효한 행동 프레임이 있다는 뜻이다.<\/li>\n<li>출처: 책 개요 및 하우절 인터뷰 요지.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<ul>\n<li><code>[데이터]<\/code> 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다.<\/li>\n<\/ul>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[추론]<\/code> 이 장은 책 전체를 하나의 정책 문서로 바꾸면 다음과 같다: 저축률을 높이고, 자유를 사며, 파산을 피하고, 복리를 방해하지 말고, 남의 게임을 따라 하지 말라.<\/li>\n<li><code>[후대 해석]<\/code> 개인투자자가 가장 실수하기 쉬운 지점은 장별 교훈을 따로 좋은 말로 소비하고 통합 규칙으로 바꾸지 못하는 것이다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 전 영역<\/li>\n<li>행동 체크리스트<\/li>\n<li>개인 투자정책서(IPS)를 작성한다.<\/li>\n<li>목표수익률 외에 최대손실·현금비중·리밸런싱 규칙을 문서화한다.<\/li>\n<li>자산보다 행동 규율을 정기 점검한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>통합 원칙은 고정교리여야 한다는 뜻이 아니다.<\/li>\n<li>원칙은 단순하되, 개인 맥락에 맞게 조정 가능해야 한다.<\/li>\n<\/ul>","text":"기존 노트 우리는 같은 이야기를 들어도 다른 결론에 도달할 수 있다. 일이 잘 풀릴 때는 겸손을 찾기 위해 노력하고, 일이 잘못될 때는 용서와 연민을 찾기 위해 최선을 다하라. 저축이란 나의 자존심과 소득 사이에 생긴 틈이고, 부는 눈에 잘 보이지 않는다. (절약, 저축) 투자는 밤잠을 설치지 않고 안심할 수 있는 방법을 찾아야 한다. 더 나은 투자자가 되는 가장 강력한 조치는 시간을 보는 눈을 넓히는 것이다. 개별 투자를 보지 말고 전체 포트폴리오를 살피고 손익비가 중요하다. 내가 원할 때, 원하는 것을, 원하는 사람과, 원하는 만큼 오랫동안 할 수 있는 것이 돈이 주는 가장 큰 배당금 그냥 저축하라. 특별히 용도를 정해두지 않은 저축은 최악의 순간 최고의 대비책이다. 가치 있는 것 중에 공짜는 없고 투자는 불확실성, 의심, 후회 등의 수수료가 발생하고 이것은 벌금이 아니다. 실수의 여지에 항상 대비하면 파산하지 않고 게임을 계속 이어 나갈 수 있고 복리의 마법을 만들어준다. 시간이 지나면 누구나 목표, 욕망이 바뀐다. 과거의 투자 결정이 극단적이면 후회할 가능성도 커진다. 리스크를 피하지 말고 받아들이고 리스크를 좋아하라. (단 레버리지, 몰빵 등 과도한 리스크 주의) 다른 사람의 움직임에 부화뇌동하지 않고 나와 다른 게임을 하는 사람들의 영향을 받지 않게끔 하라. 돈 문제는 각자 의견이 다르고 이 혼란을 존중해라. 하나의 정답은 없고 오직 나에게 맞는 답이 있을 뿐이다. [사례] 인물/사건: [해당 장은 사례보다 논지 중심] 이 장은 앞선 18개 장의 스토리를 행동원칙으로 묶는 통합 장이다. 상황: 각 장에서 따로 봤던 겸손, 저축, 자유, 장기, 안전마진, 변동성 수용, 비교심리 억제가 하나의 운영체계로 연결된다. 결과: 좋은 투자자는 더 많은 정보를 가진 사람이 아니라, 더 일관된 행동 규칙을 가진 사람에 가깝다. 이 장의 교훈과 연결: [하우절 본문] 돈에 대한 보편 진실은 정답이 하나라는 뜻이 아니라, 반복적으로 유효한 행동 프레임이 있다는 뜻이다. 출처: 책 개요 및 하우절 인터뷰 요지. [데이터] [데이터] 이 장은 정량 데이터보다 사례와 논리 중심으로 전개된다. [보강 | 논리 전개] [추론] 이 장은 책 전체를 하나의 정책 문서로 바꾸면 다음과 같다: 저축률을 높이고, 자유를 사며, 파산을 피하고, 복리를 방해하지 말고, 남의 게임을 따라 하지 말라. [후대 해석] 개인투자자가 가장 실수하기 쉬운 지점은 장별 교훈을 따로 좋은 말로 소비하고 통합 규칙으로 바꾸지 못하는 것이다. [실전 적용] 적용 영역: 전 영역 행동 체크리스트 개인 투자정책서(IPS)를 작성한다. 목표수익률 외에 최대손실·현금비중·리밸런싱 규칙을 문서화한다. 자산보다 행동 규율을 정기 점검한다. [오해 방지] 통합 원칙은 고정교리여야 한다는 뜻이 아니다. 원칙은 단순하되, 개인 맥락에 맞게 조정 가능해야 한다."},{"i":21,"title":"20. 나의 투자 이야기 (Confessions)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>나는 부자가 되려고 했던 것은 아니다. 나는 그저 독립성을 갖고 싶었다. (찰리멍거)<\/li>\n<li>소득 수준과 상관없이 독립을 좌우하는 것은 저축률이고 생활양식 기대치를 낮추는 것이 저축률을 좌우한다.<\/li>\n<li>젊은 나이에 세워놓은 생활양식 욕구에 대한 골대를 옮기지 않고 많은 저축으로 독립성을 확보하라.<\/li>\n<li>진정한 성공이란 극심한 경쟁의 쳇바퀴에서 빠져나와 내 활동을 마음의 평화에 맞추는 것이다. (나심 탈레브)<\/li>\n<li>복리의 첫 번째 규칙은 절대로 쓸데없이 손대지 않는 것이다. (찰리멍거)<\/li>\n<li>대부분의 사람은 저비용 인덱스펀드 적립식 투자가 장기 전략이 성공 확률이 가장 높다.<\/li>\n<li>투자 노력과 투자 결과 사이에는 상관성이 거의 없다.<\/li>\n<\/ul>\n<h3>[사례]<\/h3>\n<ul>\n<li>인물/사건: <code>[하우절 본문]<\/code> 책의 고백 장은 저자의 개인 철학을 공개하는 장이다. <code>[저자 인터뷰/외부 글]<\/code> 책 출간 이후 하우절은 인터뷰에서 “돈에서 원한 것은 독립성”이며, 자신은 인덱스펀드에 정기적으로 투자하고 수십 년 보유하는 단순한 구조를 선호한다고 말했다. 그는 2025년 인터뷰에서 “50년 보유를 희망하는 인덱스펀드 적립식”과 “복잡성보다 endurance 극대화”를 직접 설명했다.<\/li>\n<li>상황: 책 시점의 철학과 이후 인터뷰의 표현은 매우 일관되지만, 이것을 “현재 포트폴리오 전체 공개”로 단정하는 것은 과도하다.<\/li>\n<li>결과: 하우절의 일관된 축은 독립성, 낮은 생활수준 기대치, 높은 저축률, 단순한 인덱스 전략, 장기 보유다.<\/li>\n<li>이 장의 교훈과 연결: <code>[하우절 본문]<\/code> 대부분의 개인투자자에게 복잡성은 알파가 아니라 이탈 위험이다. <code>[저자 인터뷰/외부 글]<\/code> 이후 발언들도 이 철학을 대체로 강화한다.<\/li>\n<li>출처: MarketWatch, Barron’s, Kiplinger/FT 인터뷰.<\/li>\n<\/ul>\n<h3>[데이터]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">수치<\/th>\n<th>기준 기간<\/th>\n<th>의미<\/th>\n<th>출처<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>하우절이 언급한 보유 시계<\/td>\n<td style=\"text-align: right;\">약 50년<\/td>\n<td>2025 인터뷰<\/td>\n<td>단기 예측보다 지속성 중시<\/td>\n<td>MarketWatch/Barron’s<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>전략 표현<\/td>\n<td style=\"text-align: right;\">정기적 인덱스펀드 적립<\/td>\n<td>2024~2025 인터뷰<\/td>\n<td>대부분의 개인에게 단순성이 생존 확률을 높임<\/td>\n<td>Barron’s/MarketWatch<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>데이터 주석: 이 수치는 “하우절의 현재 전 자산배분”이 아니라, 책 이후 인터뷰에서 반복 확인되는 철학적 방향성이다. 사용자는 이를 현재 포트폴리오 확정 정보로 읽으면 안 된다.<\/p>\n<h3>[보강 | 논리 전개]<\/h3>\n<ul>\n<li><code>[하우절 본문]<\/code> 개인적 고백 장은 책의 모든 메시지를 저자 자신의 운영 원칙으로 번역한다.<\/li>\n<li><code>[저자 인터뷰/외부 글]<\/code> 이후 발언을 종합하면 그는 시장 예측보다 인덱스 적립, 독립성, 인내, 단순성, 낮은 복잡성을 우선한다.<\/li>\n<li><code>[후대 해석]<\/code> 하우절의 영향력은 “무엇을 살까”보다 “어떤 태도로 살까”를 바꿨다는 데 있다.<\/li>\n<\/ul>\n<h3>[실전 적용]<\/h3>\n<ul>\n<li>적용 영역: 포트폴리오, 저축, 생활양식<\/li>\n<li>행동 체크리스트<\/li>\n<li>저비용·장기보유·자동화 가능한 전략을 우선한다.<\/li>\n<li>생활양식 욕구의 골대를 자주 올리지 않는다.<\/li>\n<li>복잡성을 줄여 장기 지속 가능성을 높인다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 장을 “무조건 인덱스만 사라”로 단순화하면 오독이다.<\/li>\n<li>정확한 뜻은 대부분의 사람에게 단순한 저비용 장기 전략의 성공확률이 높다는 것이다. 예외는 있으나, 예외를 일반 규칙으로 착각하지 말아야 한다.<\/li>\n<\/ul>","text":"기존 노트 나는 부자가 되려고 했던 것은 아니다. 나는 그저 독립성을 갖고 싶었다. (찰리멍거) 소득 수준과 상관없이 독립을 좌우하는 것은 저축률이고 생활양식 기대치를 낮추는 것이 저축률을 좌우한다. 젊은 나이에 세워놓은 생활양식 욕구에 대한 골대를 옮기지 않고 많은 저축으로 독립성을 확보하라. 진정한 성공이란 극심한 경쟁의 쳇바퀴에서 빠져나와 내 활동을 마음의 평화에 맞추는 것이다. (나심 탈레브) 복리의 첫 번째 규칙은 절대로 쓸데없이 손대지 않는 것이다. (찰리멍거) 대부분의 사람은 저비용 인덱스펀드 적립식 투자가 장기 전략이 성공 확률이 가장 높다. 투자 노력과 투자 결과 사이에는 상관성이 거의 없다. [사례] 인물/사건: [하우절 본문] 책의 고백 장은 저자의 개인 철학을 공개하는 장이다. [저자 인터뷰/외부 글] 책 출간 이후 하우절은 인터뷰에서 “돈에서 원한 것은 독립성”이며, 자신은 인덱스펀드에 정기적으로 투자하고 수십 년 보유하는 단순한 구조를 선호한다고 말했다. 그는 2025년 인터뷰에서 “50년 보유를 희망하는 인덱스펀드 적립식”과 “복잡성보다 endurance 극대화”를 직접 설명했다. 상황: 책 시점의 철학과 이후 인터뷰의 표현은 매우 일관되지만, 이것을 “현재 포트폴리오 전체 공개”로 단정하는 것은 과도하다. 결과: 하우절의 일관된 축은 독립성, 낮은 생활수준 기대치, 높은 저축률, 단순한 인덱스 전략, 장기 보유다. 이 장의 교훈과 연결: [하우절 본문] 대부분의 개인투자자에게 복잡성은 알파가 아니라 이탈 위험이다. [저자 인터뷰/외부 글] 이후 발언들도 이 철학을 대체로 강화한다. 출처: MarketWatch, Barron’s, Kiplinger/FT 인터뷰. [데이터] 항목 수치 기준 기간 의미 출처 신뢰도 하우절이 언급한 보유 시계 약 50년 2025 인터뷰 단기 예측보다 지속성 중시 MarketWatch/Barron’s B 전략 표현 정기적 인덱스펀드 적립 2024~2025 인터뷰 대부분의 개인에게 단순성이 생존 확률을 높임 Barron’s/MarketWatch B 데이터 주석: 이 수치는 “하우절의 현재 전 자산배분”이 아니라, 책 이후 인터뷰에서 반복 확인되는 철학적 방향성이다. 사용자는 이를 현재 포트폴리오 확정 정보로 읽으면 안 된다. [보강 | 논리 전개] [하우절 본문] 개인적 고백 장은 책의 모든 메시지를 저자 자신의 운영 원칙으로 번역한다. [저자 인터뷰/외부 글] 이후 발언을 종합하면 그는 시장 예측보다 인덱스 적립, 독립성, 인내, 단순성, 낮은 복잡성을 우선한다. [후대 해석] 하우절의 영향력은 “무엇을 살까”보다 “어떤 태도로 살까”를 바꿨다는 데 있다. [실전 적용] 적용 영역: 포트폴리오, 저축, 생활양식 행동 체크리스트 저비용·장기보유·자동화 가능한 전략을 우선한다. 생활양식 욕구의 골대를 자주 올리지 않는다. 복잡성을 줄여 장기 지속 가능성을 높인다. [오해 방지] 이 장을 “무조건 인덱스만 사라”로 단순화하면 오독이다. 정확한 뜻은 대부분의 사람에게 단순한 저비용 장기 전략의 성공확률이 높다는 것이다. 예외는 있으나, 예외를 일반 규칙으로 착각하지 말아야 한다."},{"i":22,"title":"20개 교훈 1줄 요약표","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">장<\/th>\n<th>핵심 문장<\/th>\n<th>핵심 사례<\/th>\n<th>핵심 데이터<\/th>\n<th>실전 행동<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td>사람은 자신이 겪은 경제를 기준으로 위험을 해석한다<\/td>\n<td>세대별 경험효과<\/td>\n<td>인플레이션 11.3%, 13.5%, S&amp;P -56.8%<\/td>\n<td>내 경험 편향을 먼저 적기<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>성공과 실패는 실력과 우연의 공동 산물이다<\/td>\n<td>빌 게이츠·켄트 에번스<\/td>\n<td>정량보다 논지 중심<\/td>\n<td>한 사람보다 반복 원칙 보기<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td>“충분함”이 없으면 이미 가진 것도 잃는다<\/td>\n<td>라잣 굽타, 버니 메이도프<\/td>\n<td>2년형, 150년형, $17.5B loss<\/td>\n<td>중단 규칙 먼저 세우기<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td>복리의 진짜 엔진은 고수익보다 긴 시간이다<\/td>\n<td>워런 버핏, 짐 사이먼스<\/td>\n<td>버핏 부의 95%가 65세 이후<\/td>\n<td>전략 교체 빈도 줄이기<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td>부를 얻는 기술과 지키는 기술은 다르다<\/td>\n<td>제시 리버모어<\/td>\n<td>$100M vs 말년 부채초과<\/td>\n<td>파산 확률 낮추기<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td>몇 번의 대성공이 전체 수익을 결정한다<\/td>\n<td>베르그륀, 백설공주<\/td>\n<td>€750M, $8M+ gross<\/td>\n<td>손실은 작게, 승자는 길게<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td>돈의 최고 배당은 시간 통제권이다<\/td>\n<td>하우절 인터뷰<\/td>\n<td>정량보다 논지 중심<\/td>\n<td>독립성 중심 저축<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td>과시 소비는 존경이 아니라 착시를 산다<\/td>\n<td>스포트라이트 효과<\/td>\n<td>정량보다 논지 중심<\/td>\n<td>지출 목적 분리<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td>부는 소비하지 않고 남겨 둔 자산이다<\/td>\n<td>연준 비상자금 현실<\/td>\n<td>63%, 37%, 55%<\/td>\n<td>유동성 KPI 만들기<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td>저축률은 수익률보다 통제 가능한 변수다<\/td>\n<td>소득 상승 vs 지출 상승<\/td>\n<td>34% vs 38%<\/td>\n<td>자동저축 세팅<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">11<\/td>\n<td>지속 가능한 전략이 최적 전략보다 낫다<\/td>\n<td>논지 중심<\/td>\n<td>정량보다 논지 중심<\/td>\n<td>버틸 수 있는 자산배분<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">12<\/td>\n<td>미래의 문제는 데이터 부족보다 상상력 부족이다<\/td>\n<td>1929, 2008<\/td>\n<td>$8.5B margin, -56.8%<\/td>\n<td>놀라움 대비 구조 만들기<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">13<\/td>\n<td>안전마진은 맞히기보다 살아남기 위한 장치다<\/td>\n<td>논지 중심<\/td>\n<td>정량보다 논지 중심<\/td>\n<td>보수적 가정과 현금 쿠션<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">14<\/td>\n<td>미래의 나는 지금의 나와 꽤 다를 것이다<\/td>\n<td>End-of-history illusion<\/td>\n<td>19,000명+<\/td>\n<td>유연한 계획 유지<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">15<\/td>\n<td>변동성은 벌금이 아니라 입장료다<\/td>\n<td>나스닥·S&amp;P 대폭락<\/td>\n<td>-78%, -56.8%<\/td>\n<td>MDD 감내 범위 설정<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">16<\/td>\n<td>시장엔 단일한 합리 가격이 없다<\/td>\n<td>닷컴 버블<\/td>\n<td>+600%, +85.6%<\/td>\n<td>내 시간지평 명문화<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">17<\/td>\n<td>비관은 빠르고 낙관은 느려서 더 설득력 있어 보인다<\/td>\n<td>2026 급락 vs 직전 랠리<\/td>\n<td>-4.2%, -2.6%, +19.5%<\/td>\n<td>뉴스 속도와 복리 속도 분리<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">18<\/td
