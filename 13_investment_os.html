<script type="application/json" id="DATA">{"built_at":"2026-06-10","chars":324190,"books":[{"id":"01","title":"[독서] 현명한 투자자","short":"현명한 투자자","author":"그레이엄","chapters":[{"i":0,"title":"문서 안내","html":"<hr />\n<p>title: \"[독서] 현명한 투자자\"\naliases: [\"현명한 투자자\", \"The Intelligent Investor\", \"벤저민 그레이엄\"]\ntype: book-note-personal\ncategory: 독서\nauthor: 벤저민 그레이엄\ndate_read: 2024-10-30\ndate: 2024-10-30\nstatus: complete\ntags:\n  - 독서\n  - 투자\n  - 가치투자\n  - 방어적투자\n  - 벤저민그레이엄<\/p>\n<hr />\n<p><strong>읽은 날짜:<\/strong> 2024.10.30<\/p>\n<hr />","text":"title: \"[독서] 현명한 투자자\" aliases: [\"현명한 투자자\", \"The Intelligent Investor\", \"벤저민 그레이엄\"] type: book-note-personal category: 독서 author: 벤저민 그레이엄 date_read: 2024-10-30 date: 2024-10-30 status: complete tags: - 독서 - 투자 - 가치투자 - 방어적투자 - 벤저민그레이엄 읽은 날짜: 2024.10.30"},{"i":1,"title":"0. 서문","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>정액매수적립식(Dollar Cost Averaging) 투자가 유리<\/li>\n<li>우량주라면 언제 어떤 가격에 사도 아무 문제가 없다는 \"착각\"<\/li>\n<li>성장 전망이 확실하다고 해서 투자 수익도 확실한 것은 아님<\/li>\n<li>전문가들조차 가장 유망한 산업에서 가장 유망한 기업을 선정해서 집중적으로 투자할 방법은 없다<\/li>\n<li>투자를 위협하는 가장 위험한 적은 바로 자기 자신<\/li>\n<li>화려하고 위험한 성장주보다 방어적 투자 전략이 더 좋은 실적을 거두기 쉽다<\/li>\n<li>포트폴리오 전략은 단순해야 좋다<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 서문과 도입부의 핵심은 “좋은 종목”보다 “좋은 투자 행위”가 더 중요하다는 점이다. 그레이엄은 투자 성패를 가르는 1차 변수를 정보량보다 기질, 절제, 가격 규율로 본다. 그래서 책 전체가 “무엇을 살까”보다 “어떤 기준으로 사고, 언제 무시하고, 어떻게 버틸까”에 더 많은 지면을 쓴다. 이 관점에서 정액매수, 분산, 가격 규율, 시장 소음 차단은 모두 하나의 체계로 연결된다.<\/p>\n<p>[그레이엄 본문] 특히 워런 버핏이 이 책에서 가장 중요하다고 짚은 부분이 8장과 20장이라는 점은 의미가 크다. 하나는 시장가격에 대한 태도, 다른 하나는 그 가격을 잘못 지불했을 때 버텨주는 보호장치다. 즉, 이 책의 핵심 구조는 “시장에 휘둘리지 않는 법”과 “틀려도 크게 망하지 않는 법”의 결합이다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>정액매수적립식<\/td>\n<td style=\"text-align: right;\">정기적 동일 금액 매수<\/td>\n<td>가격 예측을 버리고 평균 매입단가를 평탄화<\/td>\n<td>방어적 투자자 중심<\/td>\n<td>고평가 국면에서도 자동 매수가 진행되므로 자산배분 규율과 함께 써야 함<\/td>\n<td>Graham 1949/1973, 현대 해설<\/td>\n<\/tr>\n<tr>\n<td>핵심 장<\/td>\n<td style=\"text-align: right;\">8장, 20장<\/td>\n<td>시장 태도와 안전마진이 책의 축<\/td>\n<td>전 투자자<\/td>\n<td>개별 종목 발굴보다 행동 규율 우선<\/td>\n<td>Buffett 서문<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>위 표의 정리 근거는 그레이엄의 정액매수 개념, 버핏 서문, 그리고 2003년 개정판의 해설 자료에 기반한다.<\/p>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 제이슨 츠바이크는 그레이엄의 통찰이 오래 살아남는 이유를 “시장 구조”보다 “인간 본성”에 있다고 본다. 그는 현대판 해설에서 닷컴 버블, 암호자산, 과도한 자기확신, 타인 비교, 수수료 누수 같은 문제를 연결해, 본문이 단지 1970년대 미국 주식시장 이야기로 국한되지 않는다고 해석한다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날 “정액매수”는 인덱스 ETF 적립식으로 가장 실무적으로 구현되기 쉽다. 다만 그레이엄은 자동매수 자체보다, 가격 예측·군중 추종을 버리는 훈련 효과를 더 중시한 것으로 읽는 편이 정확하다.<\/li>\n<li>[현대 적용] “단순한 포트폴리오”는 정보 부족이 아니라 실수 최소화를 위한 설계다. 앱 알림, 실시간 수익률 비교, 커뮤니티 매매 아이디어는 모두 그레이엄이 경계한 투기적 환경을 더 자극하는 방향으로 작동한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>정액매수는 “무슨 자산이든 사면 된다”는 뜻이 아니다. 자산 자체가 과도하게 비싸거나 구조적으로 부실하면 적립은 위험을 분산하지 못한다.<\/li>\n<li>단순한 전략은 “생각 없는 전략”이 아니다. 매수·보유·리밸런싱 규칙을 미리 정해 감정 개입을 줄이는 방식이다.<\/li>\n<li>성장 전망과 투자 수익률은 동일하지 않다. 높은 기대는 대개 이미 높은 가격에 반영되어 있다.<\/li>\n<\/ul>","text":"기존 노트 정액매수적립식(Dollar Cost Averaging) 투자가 유리 우량주라면 언제 어떤 가격에 사도 아무 문제가 없다는 \"착각\" 성장 전망이 확실하다고 해서 투자 수익도 확실한 것은 아님 전문가들조차 가장 유망한 산업에서 가장 유망한 기업을 선정해서 집중적으로 투자할 방법은 없다 투자를 위협하는 가장 위험한 적은 바로 자기 자신 화려하고 위험한 성장주보다 방어적 투자 전략이 더 좋은 실적을 거두기 쉽다 포트폴리오 전략은 단순해야 좋다 [보강 | 그레이엄 본문] [그레이엄 본문] 서문과 도입부의 핵심은 “좋은 종목”보다 “좋은 투자 행위”가 더 중요하다는 점이다. 그레이엄은 투자 성패를 가르는 1차 변수를 정보량보다 기질, 절제, 가격 규율로 본다. 그래서 책 전체가 “무엇을 살까”보다 “어떤 기준으로 사고, 언제 무시하고, 어떻게 버틸까”에 더 많은 지면을 쓴다. 이 관점에서 정액매수, 분산, 가격 규율, 시장 소음 차단은 모두 하나의 체계로 연결된다. [그레이엄 본문] 특히 워런 버핏이 이 책에서 가장 중요하다고 짚은 부분이 8장과 20장이라는 점은 의미가 크다. 하나는 시장가격에 대한 태도, 다른 하나는 그 가격을 잘못 지불했을 때 버텨주는 보호장치다. 즉, 이 책의 핵심 구조는 “시장에 휘둘리지 않는 법”과 “틀려도 크게 망하지 않는 법”의 결합이다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 정액매수적립식 정기적 동일 금액 매수 가격 예측을 버리고 평균 매입단가를 평탄화 방어적 투자자 중심 고평가 국면에서도 자동 매수가 진행되므로 자산배분 규율과 함께 써야 함 Graham 1949/1973, 현대 해설 핵심 장 8장, 20장 시장 태도와 안전마진이 책의 축 전 투자자 개별 종목 발굴보다 행동 규율 우선 Buffett 서문 위 표의 정리 근거는 그레이엄의 정액매수 개념, 버핏 서문, 그리고 2003년 개정판의 해설 자료에 기반한다. [츠바이크 주석] [츠바이크 주석] 제이슨 츠바이크는 그레이엄의 통찰이 오래 살아남는 이유를 “시장 구조”보다 “인간 본성”에 있다고 본다. 그는 현대판 해설에서 닷컴 버블, 암호자산, 과도한 자기확신, 타인 비교, 수수료 누수 같은 문제를 연결해, 본문이 단지 1970년대 미국 주식시장 이야기로 국한되지 않는다고 해석한다. [현대적 적용 논점] [현대 적용] 오늘날 “정액매수”는 인덱스 ETF 적립식으로 가장 실무적으로 구현되기 쉽다. 다만 그레이엄은 자동매수 자체보다, 가격 예측·군중 추종을 버리는 훈련 효과를 더 중시한 것으로 읽는 편이 정확하다. [현대 적용] “단순한 포트폴리오”는 정보 부족이 아니라 실수 최소화를 위한 설계다. 앱 알림, 실시간 수익률 비교, 커뮤니티 매매 아이디어는 모두 그레이엄이 경계한 투기적 환경을 더 자극하는 방향으로 작동한다. [오해 방지] 정액매수는 “무슨 자산이든 사면 된다”는 뜻이 아니다. 자산 자체가 과도하게 비싸거나 구조적으로 부실하면 적립은 위험을 분산하지 못한다. 단순한 전략은 “생각 없는 전략”이 아니다. 매수·보유·리밸런싱 규칙을 미리 정해 감정 개입을 줄이는 방식이다. 성장 전망과 투자 수익률은 동일하지 않다. 높은 기대는 대개 이미 높은 가격에 반영되어 있다."},{"i":2,"title":"1. 투자와 투기","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>투자: 철저한 분석을 통해서 원금의 안전과 충분한 수익을 약속받는 행위<\/li>\n<li>보수적인 관점에서 보면, 비전문가의 신용거래는 사실상 투기<\/li>\n<li>금리가 바뀌면 장기 채권의 가격은 매우 큰 폭으로 바뀐다<\/li>\n<li>채권 50% : 주식 50% 비중<\/li>\n<li>순유동자산가치(NCAV)에도 못 미치는 염가 종목<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장의 중심 정의는 매우 엄격하다. 투자란 “철저한 분석”, “원금 안전”, “만족스러운 수익”을 동시에 요구한다. 이 셋 중 하나라도 빠지면 그레이엄은 그것을 투기로 분류한다. 따라서 위험자산을 샀다는 사실만으로 투자가 되는 것이 아니라, 무엇을 얼마에 왜 사는지에 대한 분석과 가격 규율이 필수다.<\/p>\n<p>[그레이엄 본문] 그레이엄은 “투기 자체”를 절대악으로 취급하지는 않지만, 투자와 섞을 때 가장 위험하다고 본다. 자신의 투기 자금, 투자 자금, 판단 기준이 분리되어 있지 않으면 투자자 스스로가 가격 변동의 노예가 된다. 비전문가의 신용거래를 사실상 투기로 보는 이유도, 가격 예측 실패가 곧 강제 청산으로 이어질 수 있기 때문이다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>채권 50% : 주식 50%<\/td>\n<td style=\"text-align: right;\">기본 균형점<\/td>\n<td>예측보다 규율을 우선하는 기본 배분점<\/td>\n<td>방어적 투자자<\/td>\n<td>실제 원문은 주식 25~75% 범위 운영이 핵심이며 50:50은 기준점 성격<\/td>\n<td>Graham 1973, 후대 해설<\/td>\n<\/tr>\n<tr>\n<td>NCAV<\/td>\n<td style=\"text-align: right;\">유동자산 - 총부채<\/td>\n<td>기업 청산가치에 가까운 보수적 하한선<\/td>\n<td>공격적 투자자 중심<\/td>\n<td>현대에는 상장폐지·유동성·거래비용을 함께 봐야 함<\/td>\n<td>Security Analysis, NCAV 연구<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>위 수치의 의미는 “예측을 포기한 규율”과 “보수적 가치 하한선”의 결합으로 이해해야 한다. 50:50은 예측 능력의 증거가 아니라 예측 무력성에 대한 방어선이고, NCAV는 성장 서사를 제거했을 때 남는 자산 완충 장치다.<\/p>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크는 현대 투자자가 투자와 투기를 구분하지 못하는 가장 큰 이유로 “라벨 오류”를 지적한다. 장기투자라는 이름을 붙여도, 실제 판단 근거가 가격 상승 기대나 타인 추종이면 본질은 투기라는 것이다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] ETF, 옵션, 레버리지 상품은 외형상 “투자 상품”이지만, 사용 방식에 따라 완전히 투기화된다. 상품의 법적 형태보다 자금조달 구조와 의사결정 기준이 더 중요하다.<\/li>\n<li>[현대 적용] 장기채권도 안전자산으로만 보면 오해가 생긴다. 금리 변동에 따른 가격 민감도는 여전히 크므로, “신용안전”과 “가격안전”을 분리해서 봐야 한다. [추론] 이 점은 오늘날 장기국채 ETF에도 그대로 적용된다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“오래 들고 있으면 투자”가 아니다.<\/li>\n<li>“우량주면 비싸게 사도 괜찮다”는 말은 그레이엄의 정의와 정반대다.<\/li>\n<li>NCAV는 만능 가치평가식이 아니라, 극도로 보수적인 하한선이다. 적자 지속, 사기, 청산비용, 유동성 문제를 무시하면 오용된다.<\/li>\n<\/ul>","text":"기존 노트 투자: 철저한 분석을 통해서 원금의 안전과 충분한 수익을 약속받는 행위 보수적인 관점에서 보면, 비전문가의 신용거래는 사실상 투기 금리가 바뀌면 장기 채권의 가격은 매우 큰 폭으로 바뀐다 채권 50% : 주식 50% 비중 순유동자산가치(NCAV)에도 못 미치는 염가 종목 [보강 | 그레이엄 본문] [그레이엄 본문] 이 장의 중심 정의는 매우 엄격하다. 투자란 “철저한 분석”, “원금 안전”, “만족스러운 수익”을 동시에 요구한다. 이 셋 중 하나라도 빠지면 그레이엄은 그것을 투기로 분류한다. 따라서 위험자산을 샀다는 사실만으로 투자가 되는 것이 아니라, 무엇을 얼마에 왜 사는지에 대한 분석과 가격 규율이 필수다. [그레이엄 본문] 그레이엄은 “투기 자체”를 절대악으로 취급하지는 않지만, 투자와 섞을 때 가장 위험하다고 본다. 자신의 투기 자금, 투자 자금, 판단 기준이 분리되어 있지 않으면 투자자 스스로가 가격 변동의 노예가 된다. 비전문가의 신용거래를 사실상 투기로 보는 이유도, 가격 예측 실패가 곧 강제 청산으로 이어질 수 있기 때문이다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 채권 50% : 주식 50% 기본 균형점 예측보다 규율을 우선하는 기본 배분점 방어적 투자자 실제 원문은 주식 25~75% 범위 운영이 핵심이며 50:50은 기준점 성격 Graham 1973, 후대 해설 NCAV 유동자산 - 총부채 기업 청산가치에 가까운 보수적 하한선 공격적 투자자 중심 현대에는 상장폐지·유동성·거래비용을 함께 봐야 함 Security Analysis, NCAV 연구 위 수치의 의미는 “예측을 포기한 규율”과 “보수적 가치 하한선”의 결합으로 이해해야 한다. 50:50은 예측 능력의 증거가 아니라 예측 무력성에 대한 방어선이고, NCAV는 성장 서사를 제거했을 때 남는 자산 완충 장치다. [츠바이크 주석] [츠바이크 주석] 츠바이크는 현대 투자자가 투자와 투기를 구분하지 못하는 가장 큰 이유로 “라벨 오류”를 지적한다. 장기투자라는 이름을 붙여도, 실제 판단 근거가 가격 상승 기대나 타인 추종이면 본질은 투기라는 것이다. [현대적 적용 논점] [현대 적용] ETF, 옵션, 레버리지 상품은 외형상 “투자 상품”이지만, 사용 방식에 따라 완전히 투기화된다. 상품의 법적 형태보다 자금조달 구조와 의사결정 기준이 더 중요하다. [현대 적용] 장기채권도 안전자산으로만 보면 오해가 생긴다. 금리 변동에 따른 가격 민감도는 여전히 크므로, “신용안전”과 “가격안전”을 분리해서 봐야 한다. [추론] 이 점은 오늘날 장기국채 ETF에도 그대로 적용된다. [오해 방지] “오래 들고 있으면 투자”가 아니다. “우량주면 비싸게 사도 괜찮다”는 말은 그레이엄의 정의와 정반대다. NCAV는 만능 가치평가식이 아니라, 극도로 보수적인 하한선이다. 적자 지속, 사기, 청산비용, 유동성 문제를 무시하면 오용된다."},{"i":3,"title":"2. 투자와 인플레이션","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>주식이 채권보다 훨씬 유리하다는 말은 터무니없는 소리<\/li>\n<li>인플레이션이 이익을 높여주지 않는다<\/li>\n<li>발을 들여놓기 전에 자신이 감당할 수 있는지 확인하라<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장의 요지는 “주식=자동 인플레이션 헤지”라는 단순화를 경계하는 데 있다. 명목 매출과 이익이 늘어도, 자본적 지출 증가, 재고·운전자본 부담, 밸류에이션 축소가 겹치면 실질 수익은 기대보다 훨씬 낮아질 수 있다. 따라서 그레이엄은 자산군 우열보다 가격과 재무구조를 함께 보려 했다. [원서 대조 필요]<\/p>\n<p>[현대 적용] 오늘날 인플레이션 국면에서도 같은 경고가 유효하다. 주식은 장기적으로 실물자산 성격을 일부 갖지만, 모든 산업과 종목이 같은 전가력(pricing power)을 갖는 것은 아니다. 따라서 “주식이면 인플레이션 방어”가 아니라 “어떤 기업이 원가 상승을 가격에 반영할 수 있는가”가 핵심 질문이 된다. [추론]<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>정량 임계치 중심 아님<\/td>\n<td style=\"text-align: right;\">해당 없음<\/td>\n<td>자산군 상대우위보다 가격·실질수익이 핵심<\/td>\n<td>전 투자자<\/td>\n<td>실질금리, 세후수익, 비용 반영 필요<\/td>\n<td>Graham 해설, 현대 칼럼<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크의 현대 해석은 “인플레이션보다 더 확실한 것은 비용”이라는 방향에 가깝다. 실질수익을 깎는 요소로 수수료, 과도한 매매, 세금, 기대수익 과대평가를 강조한다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 인플레이션 방어는 자산 이름이 아니라 현금흐름 구조, 가격 전가력, 밸런스시트, 듀레이션으로 판단해야 한다.<\/li>\n<li>[현대 적용] 방어적 투자자에게는 인플레이션 “전망”보다, 주식·채권의 사전 목표비중과 리밸런싱 규칙이 실전적으로 더 중요하다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“주식은 인플레이션에 무조건 강하다”는 일반화는 위험하다.<\/li>\n<li>물가가 오른다고 기업가치가 같은 비율로 늘어나는 것은 아니다.<\/li>\n<li>금리 상승기에는 장기채권도, 고PER 주식도 동시에 압박받을 수 있다. [추론]<\/li>\n<\/ul>","text":"기존 노트 주식이 채권보다 훨씬 유리하다는 말은 터무니없는 소리 인플레이션이 이익을 높여주지 않는다 발을 들여놓기 전에 자신이 감당할 수 있는지 확인하라 [보강 | 그레이엄 본문] [그레이엄 본문] 이 장의 요지는 “주식=자동 인플레이션 헤지”라는 단순화를 경계하는 데 있다. 명목 매출과 이익이 늘어도, 자본적 지출 증가, 재고·운전자본 부담, 밸류에이션 축소가 겹치면 실질 수익은 기대보다 훨씬 낮아질 수 있다. 따라서 그레이엄은 자산군 우열보다 가격과 재무구조를 함께 보려 했다. [원서 대조 필요] [현대 적용] 오늘날 인플레이션 국면에서도 같은 경고가 유효하다. 주식은 장기적으로 실물자산 성격을 일부 갖지만, 모든 산업과 종목이 같은 전가력(pricing power)을 갖는 것은 아니다. 따라서 “주식이면 인플레이션 방어”가 아니라 “어떤 기업이 원가 상승을 가격에 반영할 수 있는가”가 핵심 질문이 된다. [추론] [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 정량 임계치 중심 아님 해당 없음 자산군 상대우위보다 가격·실질수익이 핵심 전 투자자 실질금리, 세후수익, 비용 반영 필요 Graham 해설, 현대 칼럼 [츠바이크 주석] [츠바이크 주석] 츠바이크의 현대 해석은 “인플레이션보다 더 확실한 것은 비용”이라는 방향에 가깝다. 실질수익을 깎는 요소로 수수료, 과도한 매매, 세금, 기대수익 과대평가를 강조한다. [현대적 적용 논점] [현대 적용] 인플레이션 방어는 자산 이름이 아니라 현금흐름 구조, 가격 전가력, 밸런스시트, 듀레이션으로 판단해야 한다. [현대 적용] 방어적 투자자에게는 인플레이션 “전망”보다, 주식·채권의 사전 목표비중과 리밸런싱 규칙이 실전적으로 더 중요하다. [오해 방지] “주식은 인플레이션에 무조건 강하다”는 일반화는 위험하다. 물가가 오른다고 기업가치가 같은 비율로 늘어나는 것은 아니다. 금리 상승기에는 장기채권도, 고PER 주식도 동시에 압박받을 수 있다. [추론]"},{"i":4,"title":"3. 지난 100년의 주가 흐름과 현재의 주가 수준","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>신중한 투자자라면 주식 시장의 역사를 충분히 파악하고 있어야 한다<\/li>\n<li>주가, 이익, 배당 사이의 상호 관계도 파악<\/li>\n<li>주가가 지나치게 높은 수준에서 형성 중이면 투자를 연기<\/li>\n<li>상승 종목을 찾아내거나 초과수익을 내려고 시도하지 말라 (일관된 전략 유지)<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장은 “역사적 망각”을 방지하는 장이다. 그레이엄은 장기 차트 자체보다, 특정 시기마다 가격·이익·배당의 관계가 어떻게 일그러졌는지를 보라고 요구한다. 즉, 과거 고평가 국면의 공통점은 미래 성장 기대가 가격에 과도하게 선반영되고, 배당수익률과 이익수익률이 비정상적으로 얇아지는 데 있었다.<\/p>\n<p>[그레이엄 본문] 여기서 “투자를 연기”하라는 말은 영구적 시장예측이 아니라, 과도한 기대가 붙은 가격을 거부하라는 가격 규율에 가깝다. 그레이엄은 장기적으로도 시장의 큰 흐름을 맞히는 능력을 전제하지 않았고, 오히려 역사상 널리 알려진 쉬운 공식은 대중화되는 순간 효력이 약해진다고 경고했다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>고평가 경고 신호<\/td>\n<td style=\"text-align: right;\">높은 PER, 낮은 배당수익률 등<\/td>\n<td>가격이 이익·배당을 앞질렀는지 점검<\/td>\n<td>전 투자자<\/td>\n<td>금리 수준과 산업구성 변화 반영 필요<\/td>\n<td>Graham 1973, 현대 해설<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크는 닷컴 버블과 이후의 반복되는 투기 사이클을 연결하면서, “이번에는 다르다”는 문장이 가장 위험한 신호라고 해석한다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날에는 개별 종목보다 지수 수준의 집중도도 함께 봐야 한다. 대형 기술주의 비중 확대는 지수 자체에 밸류에이션 편향을 만들 수 있다.<\/li>\n<li>[현대 적용] “역사적 평균 회귀”는 가능성이지만 타이밍 도구는 아니다. 그레이엄식 해석은 가격이 높을수록 기대수익률을 낮추고, 포지션 규모를 보수적으로 조정하는 쪽에 가깝다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>역사 공부는 차트 패턴 암기가 아니다.<\/li>\n<li>“시장이 비싸 보이니 전량 현금화”가 그레이엄의 유일한 처방은 아니다.<\/li>\n<li>초과수익 추구보다 규칙 일관성이 우선이다.<\/li>\n<\/ul>","text":"기존 노트 신중한 투자자라면 주식 시장의 역사를 충분히 파악하고 있어야 한다 주가, 이익, 배당 사이의 상호 관계도 파악 주가가 지나치게 높은 수준에서 형성 중이면 투자를 연기 상승 종목을 찾아내거나 초과수익을 내려고 시도하지 말라 (일관된 전략 유지) [보강 | 그레이엄 본문] [그레이엄 본문] 이 장은 “역사적 망각”을 방지하는 장이다. 그레이엄은 장기 차트 자체보다, 특정 시기마다 가격·이익·배당의 관계가 어떻게 일그러졌는지를 보라고 요구한다. 즉, 과거 고평가 국면의 공통점은 미래 성장 기대가 가격에 과도하게 선반영되고, 배당수익률과 이익수익률이 비정상적으로 얇아지는 데 있었다. [그레이엄 본문] 여기서 “투자를 연기”하라는 말은 영구적 시장예측이 아니라, 과도한 기대가 붙은 가격을 거부하라는 가격 규율에 가깝다. 그레이엄은 장기적으로도 시장의 큰 흐름을 맞히는 능력을 전제하지 않았고, 오히려 역사상 널리 알려진 쉬운 공식은 대중화되는 순간 효력이 약해진다고 경고했다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 고평가 경고 신호 높은 PER, 낮은 배당수익률 등 가격이 이익·배당을 앞질렀는지 점검 전 투자자 금리 수준과 산업구성 변화 반영 필요 Graham 1973, 현대 해설 [츠바이크 주석] [츠바이크 주석] 츠바이크는 닷컴 버블과 이후의 반복되는 투기 사이클을 연결하면서, “이번에는 다르다”는 문장이 가장 위험한 신호라고 해석한다. [현대적 적용 논점] [현대 적용] 오늘날에는 개별 종목보다 지수 수준의 집중도도 함께 봐야 한다. 대형 기술주의 비중 확대는 지수 자체에 밸류에이션 편향을 만들 수 있다. [현대 적용] “역사적 평균 회귀”는 가능성이지만 타이밍 도구는 아니다. 그레이엄식 해석은 가격이 높을수록 기대수익률을 낮추고, 포지션 규모를 보수적으로 조정하는 쪽에 가깝다. [추론] [오해 방지] 역사 공부는 차트 패턴 암기가 아니다. “시장이 비싸 보이니 전량 현금화”가 그레이엄의 유일한 처방은 아니다. 초과수익 추구보다 규칙 일관성이 우선이다."},{"i":5,"title":"4. 일반 투자자의 포트폴리오 전략: 방어적 투자","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>방어적 투자자는 우량 등급 채권과 우량주로 포트폴리오 구성<\/li>\n<li>주식의 비중이 50% 이상으로 확대하기 적절한 시점은 약세장이 장기간 이어져서 '저평가 주식'이 증가하는 때<\/li>\n<li>주식의 비중을 50% 미만으로 축소하기에 적절한 시점은 주가가 지나치게 상승하여 위험한 수준에 도달했다고 판단될 때<\/li>\n<li>인간의 본성을 정면으로 거슬러야 하므로 실제로 실행하기는 어려움<\/li>\n<li>우선주는 저평가된 경우가 아니면 매수해서는 안 됨<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 방어적 투자자는 “수익 최대화”보다 “실수 최소화”에 초점을 둔다. 그래서 종목보다 자산배분이 먼저 나온다. 그레이엄이 주식과 채권을 함께 두는 이유는 예측력을 전제하지 않기 때문이다. 어느 자산이 다음 5년을 이길지 확신할 수 없으므로, 투자자는 미리 정한 범위 내에서 균형을 유지하고 극단적 포지션을 피해야 한다.<\/p>\n<p>[그레이엄 본문] 50:50은 “최적화된 한 점”이라기보다 판단 흔들림을 줄이는 기준점이다. 약세장이 길어지고 저평가가 늘면 주식 비중을 늘릴 수 있고, 과열·고평가가 심해지면 줄일 수 있지만, 이 역시 25~75% 범위라는 안전레일 안에서 이뤄져야 한다는 것이 후대 해설의 일반적 복원이다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>주식/채권 기본 배분<\/td>\n<td style=\"text-align: right;\">50% : 50%<\/td>\n<td>예측보다 규율 우선의 기준점<\/td>\n<td>방어적 투자자<\/td>\n<td>실제 운용 범위는 대체로 25~75%로 이해<\/td>\n<td>Graham 해설<\/td>\n<\/tr>\n<tr>\n<td>우량 등급 채권<\/td>\n<td style=\"text-align: right;\">투자적격 중심<\/td>\n<td>원금 방어와 변동성 완충<\/td>\n<td>방어적 투자자<\/td>\n<td>장기채는 금리 민감도 높음<\/td>\n<td>Graham 해설<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>위 비중은 리스크 감수 성향이 아니라 “행동 규율”의 문제로 읽는 편이 정확하다. 그레이엄은 위험이 높아서 수익이 높아진다고 보지 않았고, 투자자가 쏟는 지적 노력과 절제가 결과를 가른다고 보았다.<\/p>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크는 현대 방어적 투자자의 실전 도구로 인덱스 펀드와 낮은 비용을 반복해서 연결한다. 본문이 직접 인덱스 펀드를 말하지는 않지만, “평균을 얻고 실수하지 말라”는 정신에는 잘 부합한다고 본다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날 방어적 투자자의 채권 버킷은 개별채권보다 국채·우량채 ETF로 구현하는 경우가 많다. 다만 신용위험과 듀레이션 위험을 구분해야 한다.<\/li>\n<li>[현대 적용] 우선주는 여전히 구조를 잘못 이해하면 “채권도 주식도 아닌 중간 위험”이 될 수 있다. 금리 민감도와 발행 조건을 확인해야 한다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>50:50은 시장전망을 맞히는 전술이 아니라, 틀려도 무너지지 않는 구조다.<\/li>\n<li>방어적 투자자는 “겁이 많은 투자자”가 아니라 “체계 밖의 실수를 줄이려는 투자자”다.<\/li>\n<li>우선주를 “배당이 높으니 안전하다”라고 보면 안 된다.<\/li>\n<\/ul>","text":"기존 노트 방어적 투자자는 우량 등급 채권과 우량주로 포트폴리오 구성 주식의 비중이 50% 이상으로 확대하기 적절한 시점은 약세장이 장기간 이어져서 '저평가 주식'이 증가하는 때 주식의 비중을 50% 미만으로 축소하기에 적절한 시점은 주가가 지나치게 상승하여 위험한 수준에 도달했다고 판단될 때 인간의 본성을 정면으로 거슬러야 하므로 실제로 실행하기는 어려움 우선주는 저평가된 경우가 아니면 매수해서는 안 됨 [보강 | 그레이엄 본문] [그레이엄 본문] 방어적 투자자는 “수익 최대화”보다 “실수 최소화”에 초점을 둔다. 그래서 종목보다 자산배분이 먼저 나온다. 그레이엄이 주식과 채권을 함께 두는 이유는 예측력을 전제하지 않기 때문이다. 어느 자산이 다음 5년을 이길지 확신할 수 없으므로, 투자자는 미리 정한 범위 내에서 균형을 유지하고 극단적 포지션을 피해야 한다. [그레이엄 본문] 50:50은 “최적화된 한 점”이라기보다 판단 흔들림을 줄이는 기준점이다. 약세장이 길어지고 저평가가 늘면 주식 비중을 늘릴 수 있고, 과열·고평가가 심해지면 줄일 수 있지만, 이 역시 25~75% 범위라는 안전레일 안에서 이뤄져야 한다는 것이 후대 해설의 일반적 복원이다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 주식/채권 기본 배분 50% : 50% 예측보다 규율 우선의 기준점 방어적 투자자 실제 운용 범위는 대체로 25~75%로 이해 Graham 해설 우량 등급 채권 투자적격 중심 원금 방어와 변동성 완충 방어적 투자자 장기채는 금리 민감도 높음 Graham 해설 위 비중은 리스크 감수 성향이 아니라 “행동 규율”의 문제로 읽는 편이 정확하다. 그레이엄은 위험이 높아서 수익이 높아진다고 보지 않았고, 투자자가 쏟는 지적 노력과 절제가 결과를 가른다고 보았다. [츠바이크 주석] [츠바이크 주석] 츠바이크는 현대 방어적 투자자의 실전 도구로 인덱스 펀드와 낮은 비용을 반복해서 연결한다. 본문이 직접 인덱스 펀드를 말하지는 않지만, “평균을 얻고 실수하지 말라”는 정신에는 잘 부합한다고 본다. [현대적 적용 논점] [현대 적용] 오늘날 방어적 투자자의 채권 버킷은 개별채권보다 국채·우량채 ETF로 구현하는 경우가 많다. 다만 신용위험과 듀레이션 위험을 구분해야 한다. [현대 적용] 우선주는 여전히 구조를 잘못 이해하면 “채권도 주식도 아닌 중간 위험”이 될 수 있다. 금리 민감도와 발행 조건을 확인해야 한다. [추론] [오해 방지] 50:50은 시장전망을 맞히는 전술이 아니라, 틀려도 무너지지 않는 구조다. 방어적 투자자는 “겁이 많은 투자자”가 아니라 “체계 밖의 실수를 줄이려는 투자자”다. 우선주를 “배당이 높으니 안전하다”라고 보면 안 된다."},{"i":6,"title":"5. 방어적 투자자의 주식 투자","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>주식 선정 4대 기준<\/li>\n<li>충분하지만 과도하지 않게 분산투자 한다 (10~30개 이하)<\/li>\n<li>재무구조가 건전한 유명 대기업 중에서만 선정<\/li>\n<li>장기간 지속적으로 배당금을 지급한 기업 중에서만 선정<\/li>\n<li>과거 7년 평균 이익을 고려해서 매수 상한선 설정 (7년 평균 이익의 25배 이하 AND 최근 12개월 이익의 20배 이하)<\/li>\n<li>연 1회 포트폴리오 점검 및 변경<\/li>\n<li>은행 부채를 포함한 총자본 중 보통주 자본(보통주, 보통주자본잉여금, 이익잉여금)의 비중으로 재무구조의 건전성 확인 (제조업 50%)<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 방어적 투자자의 주식 선택은 “훌륭한 기업을 아무 가격에나 사라”가 아니라, “기초체력이 검증된 기업을 과도한 가격이 아닐 때 사라”는 구조다. 즉, 질과 가격을 둘 다 본다. 여기서 질은 재무건전성·이익안정성·배당기록으로, 가격은 평균이익 대비 적정 배수와 자산가치 대비 배수로 제어한다.<\/p>\n<p>[그레이엄 본문] 방어적 투자자의 분산은 원문상 “충분하되 과도하지 않게”라는 취지로 이해하는 것이 우선이다. 널리 인용되는 2차 자료는 이를 10~30개 보유로 정리하지만, 이번 검토에서는 원문 페이지 직접 확인을 끝내지 못했으므로 10~30개는 잠정 채택하고 <code>[최종 원서 대조 필요]<\/code>로 표기하는 편이 안전하다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>분산 수<\/td>\n<td style=\"text-align: right;\">10~30개 <code>[잠정 채택 · 최종 원서 대조 필요]<\/code><\/td>\n<td>개별 사고 위험 완화, 과잉 분산 방지<\/td>\n<td>방어적 투자자<\/td>\n<td>ETF 활용 시 개별종목 수 대신 팩터 노출로 관리 가능<\/td>\n<td>2차 자료·후대 해설<\/td>\n<\/tr>\n<tr>\n<td>과거 7년 평균 이익 25배 이하<\/td>\n<td style=\"text-align: right;\">P/E 상한<\/td>\n<td>경기순환 왜곡 완화<\/td>\n<td>방어적 투자자<\/td>\n<td>현재 실무에선 3년 또는 5년 평균, CAPE류 보정 병행<\/td>\n<td>Graham 원칙<\/td>\n<\/tr>\n<tr>\n<td>최근 12개월 이익 20배 이하<\/td>\n<td style=\"text-align: right;\">최신 수익 기준 상한<\/td>\n<td>최근 실적 과열 방지<\/td>\n<td>방어적 투자자<\/td>\n<td>일회성 이익·회계 왜곡 점검 필요<\/td>\n<td>Graham 원칙<\/td>\n<\/tr>\n<tr>\n<td>제조업 보통주 자본 비중 50% 이상<\/td>\n<td style=\"text-align: right;\">건전성 점검<\/td>\n<td>타인자본 의존도 억제<\/td>\n<td>방어적 투자자<\/td>\n<td>은행·플랫폼·자산경량 업종에는 직접 적용 어려움<\/td>\n<td>사용자 노트 + 그레이엄 취지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>이 장의 수치들은 “훌륭한 기업이라도 비싸게 사면 방어적이지 않다”는 원칙을 실무 규칙으로 만든 것이다. 평균이익을 쓰는 이유는 경기순환·특별손익의 노이즈를 줄이기 위해서다.<\/p>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대 해설의 핵심은 “방어적 투자자는 평균을 이기는 것보다 평균 이하로 망하지 않는 것”에 가깝다는 점이다. 그래서 비용과 세금이 누적되는 빈번한 회전매매보다, 정기 점검과 낮은 비용 구조를 더 중시한다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날 PBR 기준은 무형자산 비중이 큰 플랫폼·소프트웨어 기업에 그대로 적용하기 어렵다. 저PBR이 곧 저평가가 아니고, 고PBR이 곧 과대평가도 아니다. [추론]<\/li>\n<li>[현대 적용] 장기 현금배당 기록은 자사주 매입이 배당을 일부 대체한 시장에서는 선별력이 줄 수도 있다. 다만 방어적 투자자 관점에서는 여전히 현금흐름 규율의 좋은 대리변수다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>10~30개는 마법 숫자가 아니다. 핵심은 “충분하지만 과도하지 않은 분산”이다.<\/li>\n<li>평균이익 배수를 쓸 때 경기 민감 업종은 더 긴 평균 기간이 필요할 수 있다.<\/li>\n<li>재무건전성을 부채비율 하나로만 보면 은행, 보험, 리스업 등에서 오류가 커진다. [추론]<\/li>\n<\/ul>","text":"기존 노트 주식 선정 4대 기준 충분하지만 과도하지 않게 분산투자 한다 (10~30개 이하) 재무구조가 건전한 유명 대기업 중에서만 선정 장기간 지속적으로 배당금을 지급한 기업 중에서만 선정 과거 7년 평균 이익을 고려해서 매수 상한선 설정 (7년 평균 이익의 25배 이하 AND 최근 12개월 이익의 20배 이하) 연 1회 포트폴리오 점검 및 변경 은행 부채를 포함한 총자본 중 보통주 자본(보통주, 보통주자본잉여금, 이익잉여금)의 비중으로 재무구조의 건전성 확인 (제조업 50%) [보강 | 그레이엄 본문] [그레이엄 본문] 방어적 투자자의 주식 선택은 “훌륭한 기업을 아무 가격에나 사라”가 아니라, “기초체력이 검증된 기업을 과도한 가격이 아닐 때 사라”는 구조다. 즉, 질과 가격을 둘 다 본다. 여기서 질은 재무건전성·이익안정성·배당기록으로, 가격은 평균이익 대비 적정 배수와 자산가치 대비 배수로 제어한다. [그레이엄 본문] 방어적 투자자의 분산은 원문상 “충분하되 과도하지 않게”라는 취지로 이해하는 것이 우선이다. 널리 인용되는 2차 자료는 이를 10~30개 보유로 정리하지만, 이번 검토에서는 원문 페이지 직접 확인을 끝내지 못했으므로 10~30개는 잠정 채택하고 [최종 원서 대조 필요] 로 표기하는 편이 안전하다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 분산 수 10~30개 [잠정 채택 · 최종 원서 대조 필요] 개별 사고 위험 완화, 과잉 분산 방지 방어적 투자자 ETF 활용 시 개별종목 수 대신 팩터 노출로 관리 가능 2차 자료·후대 해설 과거 7년 평균 이익 25배 이하 P/E 상한 경기순환 왜곡 완화 방어적 투자자 현재 실무에선 3년 또는 5년 평균, CAPE류 보정 병행 Graham 원칙 최근 12개월 이익 20배 이하 최신 수익 기준 상한 최근 실적 과열 방지 방어적 투자자 일회성 이익·회계 왜곡 점검 필요 Graham 원칙 제조업 보통주 자본 비중 50% 이상 건전성 점검 타인자본 의존도 억제 방어적 투자자 은행·플랫폼·자산경량 업종에는 직접 적용 어려움 사용자 노트 + 그레이엄 취지 이 장의 수치들은 “훌륭한 기업이라도 비싸게 사면 방어적이지 않다”는 원칙을 실무 규칙으로 만든 것이다. 평균이익을 쓰는 이유는 경기순환·특별손익의 노이즈를 줄이기 위해서다. [츠바이크 주석] [츠바이크 주석] 현대 해설의 핵심은 “방어적 투자자는 평균을 이기는 것보다 평균 이하로 망하지 않는 것”에 가깝다는 점이다. 그래서 비용과 세금이 누적되는 빈번한 회전매매보다, 정기 점검과 낮은 비용 구조를 더 중시한다. [현대적 적용 논점] [현대 적용] 오늘날 PBR 기준은 무형자산 비중이 큰 플랫폼·소프트웨어 기업에 그대로 적용하기 어렵다. 저PBR이 곧 저평가가 아니고, 고PBR이 곧 과대평가도 아니다. [추론] [현대 적용] 장기 현금배당 기록은 자사주 매입이 배당을 일부 대체한 시장에서는 선별력이 줄 수도 있다. 다만 방어적 투자자 관점에서는 여전히 현금흐름 규율의 좋은 대리변수다. [추론] [오해 방지] 10~30개는 마법 숫자가 아니다. 핵심은 “충분하지만 과도하지 않은 분산”이다. 평균이익 배수를 쓸 때 경기 민감 업종은 더 긴 평균 기간이 필요할 수 있다. 재무건전성을 부채비율 하나로만 보면 은행, 보험, 리스업 등에서 오류가 커진다. [추론]"},{"i":7,"title":"6. 공격적 투자자의 포트폴리오 전략: 삼가야 할 투자","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>비우량 등급 채권을 액면가와 비슷한 가격에 매수하면 가격이 대폭 하락할 가능성이 매우 크다 (70% 이하 금액에 매수)<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장은 공격적 투자자라 해도 “아무 위험이나 감수하는 사람”이 아님을 분명히 한다. 그레이엄이 경계한 대상은 첫째, 보상 대비 위험이 과도한 저급채권을 제값에 사는 행위, 둘째, 화제가 된 신규 발행물과 품질 미달 이슈를 낙관 서사만 보고 사는 행위다. [원서 대조 필요]<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>70% 이하 금액에 매수<\/td>\n<td style=\"text-align: right;\">사용자 노트 기준<\/td>\n<td>저급채권은 충분한 가격할인이 있어야 위험 보상 가능<\/td>\n<td>공격적 투자자<\/td>\n<td>실제 적정 할인율은 회수가능가치, 듀레이션, 조항에 따라 다름<\/td>\n<td>사용자 노트, Graham 취지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크식 현대 해석으로 옮기면, “높은 쿠폰”이나 “높은 분배율”만 보고 저신용 상품을 사는 행위는 전형적인 착시다. 표면수익률은 높아도 원금 손실 확률이 높으면 투자 전체는 방어적이지 않다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날의 고수익 채권 ETF, 사모대출, 구조화 크레딧도 동일한 질문으로 봐야 한다. “수익률이 왜 이렇게 높나?”가 출발점이다.<\/li>\n<li>[현대 적용] 공격적 투자자는 위험 자체가 아니라 “가격이 그 위험을 충분히 반영했는가”를 본다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>공격적 투자자는 투기꾼이 아니다.<\/li>\n<li>액면가 근처의 저급채권은 “아래는 채권이 보호하고 위는 쿠폰이 준다”는 착시를 만들기 쉽다.<\/li>\n<li>수익률이 높다고 안전마진이 생기는 것은 아니다. 가격과 회수가능가치가 중요하다. [추론]<\/li>\n<\/ul>","text":"기존 노트 비우량 등급 채권을 액면가와 비슷한 가격에 매수하면 가격이 대폭 하락할 가능성이 매우 크다 (70% 이하 금액에 매수) [보강 | 그레이엄 본문] [그레이엄 본문] 이 장은 공격적 투자자라 해도 “아무 위험이나 감수하는 사람”이 아님을 분명히 한다. 그레이엄이 경계한 대상은 첫째, 보상 대비 위험이 과도한 저급채권을 제값에 사는 행위, 둘째, 화제가 된 신규 발행물과 품질 미달 이슈를 낙관 서사만 보고 사는 행위다. [원서 대조 필요] [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 70% 이하 금액에 매수 사용자 노트 기준 저급채권은 충분한 가격할인이 있어야 위험 보상 가능 공격적 투자자 실제 적정 할인율은 회수가능가치, 듀레이션, 조항에 따라 다름 사용자 노트, Graham 취지 [츠바이크 주석] [츠바이크 주석] 츠바이크식 현대 해석으로 옮기면, “높은 쿠폰”이나 “높은 분배율”만 보고 저신용 상품을 사는 행위는 전형적인 착시다. 표면수익률은 높아도 원금 손실 확률이 높으면 투자 전체는 방어적이지 않다. [현대적 적용 논점] [현대 적용] 오늘날의 고수익 채권 ETF, 사모대출, 구조화 크레딧도 동일한 질문으로 봐야 한다. “수익률이 왜 이렇게 높나?”가 출발점이다. [현대 적용] 공격적 투자자는 위험 자체가 아니라 “가격이 그 위험을 충분히 반영했는가”를 본다. [오해 방지] 공격적 투자자는 투기꾼이 아니다. 액면가 근처의 저급채권은 “아래는 채권이 보호하고 위는 쿠폰이 준다”는 착시를 만들기 쉽다. 수익률이 높다고 안전마진이 생기는 것은 아니다. 가격과 회수가능가치가 중요하다. [추론]"},{"i":8,"title":"7. 공격적 투자자의 포트폴리오 전략: 해볼 만한 투자","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>성장주 투자를 추천하지 않음<\/li>\n<li>소외된 대형주에 투자 (과거의 평균 PER보다 낮아야 함)<\/li>\n<li>염가 종목 매수 (내재가치 평가)<\/li>\n<li>트레이딩, 단기 종목 선정, 장기 종목 선정 삼가<\/li>\n<li>외국 채권, 일반 우선주, 비우량주를 제값을 다 치르고 사서는 안 됨<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 공격적 투자자의 장점은 더 큰 위험 감수 성향이 아니라 더 많은 시간, 훈련, 독립적 분석 능력이다. 그레이엄은 여기서 성장주 추격보다, 시장에서 외면된 대형주, 저평가 종목, 특수상황, 자산가치 대비 할인 종목처럼 분석 가능한 비효율을 찾는 쪽을 선호한다.<\/p>\n<p>[그레이엄 본문] 즉, “공격적”이란 높은 베타를 사는 것이 아니라 시장이 싫어하는 곳에서 가격-가치 괴리를 탐지하는 것이다. 이 지점에서 그레이엄의 후기 사고는 개별 천재주 발굴보다, 단순 기준에 맞는 저평가 종목 집합을 사는 “그룹 접근법”으로 이동한다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>소외된 대형주<\/td>\n<td style=\"text-align: right;\">과거 평균 PER 이하 등<\/td>\n<td>기대 축소가 가격에 반영된 우량주 탐색<\/td>\n<td>공격적 투자자<\/td>\n<td>구조적 쇠퇴 산업과 단순 저평가를 구분해야 함<\/td>\n<td>Graham 취지<\/td>\n<\/tr>\n<tr>\n<td>염가 종목<\/td>\n<td style=\"text-align: right;\">내재가치 대비 할인<\/td>\n<td>안전마진 확보<\/td>\n<td>공격적 투자자<\/td>\n<td>가치 함정 점검 필요<\/td>\n<td>Graham/NCAV 연구<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대 해설 관점에서는 공격적 투자자가 실제로 우월한 성과를 내려면 정보가 아니라 행동 통제가 더 중요하다. 시끄러운 시장에서 더 많이 거래하는 사람이 아니라, 더 좋은 필터를 가진 사람이 유리하다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날 공격적 투자자의 실전 도구는 개별종목 분석 외에도 정량 스크리닝, 팩터, 이벤트드리븐 전략으로 넓어졌지만, 거래비용과 세금 차감 후 성과를 봐야 한다.<\/li>\n<li>[현대 적용] “성장주 비추천”은 성장 자체를 부정하는 말이 아니라, 성장 기대가 가격에 과잉 반영된 종목을 경계하라는 뜻이다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>공격적 투자자가 성장주를 전혀 사지 말라는 뜻은 아니다.<\/li>\n<li>저PER은 출발점이지 결론이 아니다.<\/li>\n<li>트레이딩 능력과 분석 능력을 혼동하면 그레이엄식 공격적 투자가 단기 투기로 변질된다.<\/li>\n<\/ul>","text":"기존 노트 성장주 투자를 추천하지 않음 소외된 대형주에 투자 (과거의 평균 PER보다 낮아야 함) 염가 종목 매수 (내재가치 평가) 트레이딩, 단기 종목 선정, 장기 종목 선정 삼가 외국 채권, 일반 우선주, 비우량주를 제값을 다 치르고 사서는 안 됨 [보강 | 그레이엄 본문] [그레이엄 본문] 공격적 투자자의 장점은 더 큰 위험 감수 성향이 아니라 더 많은 시간, 훈련, 독립적 분석 능력이다. 그레이엄은 여기서 성장주 추격보다, 시장에서 외면된 대형주, 저평가 종목, 특수상황, 자산가치 대비 할인 종목처럼 분석 가능한 비효율을 찾는 쪽을 선호한다. [그레이엄 본문] 즉, “공격적”이란 높은 베타를 사는 것이 아니라 시장이 싫어하는 곳에서 가격-가치 괴리를 탐지하는 것이다. 이 지점에서 그레이엄의 후기 사고는 개별 천재주 발굴보다, 단순 기준에 맞는 저평가 종목 집합을 사는 “그룹 접근법”으로 이동한다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 소외된 대형주 과거 평균 PER 이하 등 기대 축소가 가격에 반영된 우량주 탐색 공격적 투자자 구조적 쇠퇴 산업과 단순 저평가를 구분해야 함 Graham 취지 염가 종목 내재가치 대비 할인 안전마진 확보 공격적 투자자 가치 함정 점검 필요 Graham/NCAV 연구 [츠바이크 주석] [츠바이크 주석] 현대 해설 관점에서는 공격적 투자자가 실제로 우월한 성과를 내려면 정보가 아니라 행동 통제가 더 중요하다. 시끄러운 시장에서 더 많이 거래하는 사람이 아니라, 더 좋은 필터를 가진 사람이 유리하다. [현대적 적용 논점] [현대 적용] 오늘날 공격적 투자자의 실전 도구는 개별종목 분석 외에도 정량 스크리닝, 팩터, 이벤트드리븐 전략으로 넓어졌지만, 거래비용과 세금 차감 후 성과를 봐야 한다. [현대 적용] “성장주 비추천”은 성장 자체를 부정하는 말이 아니라, 성장 기대가 가격에 과잉 반영된 종목을 경계하라는 뜻이다. [오해 방지] 공격적 투자자가 성장주를 전혀 사지 말라는 뜻은 아니다. 저PER은 출발점이지 결론이 아니다. 트레이딩 능력과 분석 능력을 혼동하면 그레이엄식 공격적 투자가 단기 투기로 변질된다."},{"i":9,"title":"8. 투자와 시장 변동성","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>장기 채권은 시장 가격이 비교적 큰 폭으로 변동할 수 있고, 주식도 마찬가지 (투자자는 가격 변동성 유념)<\/li>\n<li>수익 기회를 잡는 방법: 시점 선택 AND 가격 선택<\/li>\n<li>강세장의 특징: 역사적 고점, 높은 PER, 채권 수익률보다 낮은 배당 수익률, 신용거래 투기 증가, 부실기업의 신주 공모 성행<\/li>\n<li>주가 상승 시 가끔 보유 주식 매도 후 채권 매수, 하락 시 반대 실행<\/li>\n<li>투기꾼: 주가 흐름을 예측해서 이익을 얻는 것<\/li>\n<li>투자자: 적정 주식을 적정 가격에 매수해서 보유하는 것<\/li>\n<li>주가가 대폭 상승한 직후에는 절대 매수하지 말고, 주가가 대폭 하락한 경우에는 절대 매도하지 말라<\/li>\n<li>훌륭한 경영자는 훌륭한 주가를 만들어내고, 형편없는 경영자는 형편없는 주가를 만들어 낸다<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장의 핵심은 Mr. Market 우화다. 시장은 동업자의 가치평가 제안자로 취급해야지, 지시자로 취급하면 안 된다. 그는 매일 가격을 제시하지만, 당신이 응답할 의무는 없다. 따라서 가격 변동은 위험 그 자체가 아니라, 가치와 분리된 가격을 만났을 때만 기회가 된다.<\/p>\n<p>[그레이엄 본문] 그레이엄은 이 장에서 “timing(예측)”보다 “pricing(가격 규율)”을 선호한다. 시장 방향을 맞히는 일은 쉽지 않고, 누구나 따라 할 수 있는 단순 공식은 널리 퍼지는 순간 효력이 줄어든다고 보았다. 그래서 진짜 투자자는 강세장·약세장이 아니라, 현재 제시된 가격이 내재가치 대비 싸거나 비싼지를 본다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>timing vs pricing<\/td>\n<td style=\"text-align: right;\">개념 구분<\/td>\n<td>방향 예측보다 가격-가치 비교를 우선<\/td>\n<td>전 투자자<\/td>\n<td>차트·뉴스 해석을 가치판단과 혼동하지 말 것<\/td>\n<td>Graham 1973<\/td>\n<\/tr>\n<tr>\n<td>강세장 경고 신호<\/td>\n<td style=\"text-align: right;\">높은 PER, 낮은 배당수익률 등<\/td>\n<td>위험한 낙관의 징후<\/td>\n<td>전 투자자<\/td>\n<td>금리 환경과 지수 집중도 함께 점검<\/td>\n<td>Graham 해설<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크는 이 장을 현대 투자자에게 가장 중요한 장으로 다룬다. 그의 해석은 “남들이 팔아서 나도 파는 구조”에서 벗어나 개인의 재무목표와 시간지평으로 성과를 재정의하라는 데 있다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 실시간 시세와 푸시 알림은 Mr. Market의 방문 빈도를 과거보다 훨씬 높였다. 따라서 오늘날의 실전 규율은 “언제 거래할지”보다 “언제 화면을 끌지”에 가깝다. [추론]<\/li>\n<li>[현대 적용] 리밸런싱은 그레이엄식 pricing 규율의 현대적 약식 구현이라고 볼 수 있다. 비중이 과도하게 오른 자산을 줄이고, 눌린 자산을 늘리는 행위가 자동으로 “낙관에 덜 사고 비관에 더 사는” 구조를 만든다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>Mr. Market은 “무조건 역추세 매매하라”는 비유가 아니다.<\/li>\n<li>가격이 내려갔다고 자동으로 싸진 것이 아니다. 가치 판단이 먼저다.<\/li>\n<li>훌륭한 경영과 훌륭한 주가 사이에는 긴 시차가 존재할 수 있다. 단기 주가는 감정이, 장기 주가는 사업성과가 더 많이 좌우한다.<\/li>\n<\/ul>","text":"기존 노트 장기 채권은 시장 가격이 비교적 큰 폭으로 변동할 수 있고, 주식도 마찬가지 (투자자는 가격 변동성 유념) 수익 기회를 잡는 방법: 시점 선택 AND 가격 선택 강세장의 특징: 역사적 고점, 높은 PER, 채권 수익률보다 낮은 배당 수익률, 신용거래 투기 증가, 부실기업의 신주 공모 성행 주가 상승 시 가끔 보유 주식 매도 후 채권 매수, 하락 시 반대 실행 투기꾼: 주가 흐름을 예측해서 이익을 얻는 것 투자자: 적정 주식을 적정 가격에 매수해서 보유하는 것 주가가 대폭 상승한 직후에는 절대 매수하지 말고, 주가가 대폭 하락한 경우에는 절대 매도하지 말라 훌륭한 경영자는 훌륭한 주가를 만들어내고, 형편없는 경영자는 형편없는 주가를 만들어 낸다 [보강 | 그레이엄 본문] [그레이엄 본문] 이 장의 핵심은 Mr. Market 우화다. 시장은 동업자의 가치평가 제안자로 취급해야지, 지시자로 취급하면 안 된다. 그는 매일 가격을 제시하지만, 당신이 응답할 의무는 없다. 따라서 가격 변동은 위험 그 자체가 아니라, 가치와 분리된 가격을 만났을 때만 기회가 된다. [그레이엄 본문] 그레이엄은 이 장에서 “timing(예측)”보다 “pricing(가격 규율)”을 선호한다. 시장 방향을 맞히는 일은 쉽지 않고, 누구나 따라 할 수 있는 단순 공식은 널리 퍼지는 순간 효력이 줄어든다고 보았다. 그래서 진짜 투자자는 강세장·약세장이 아니라, 현재 제시된 가격이 내재가치 대비 싸거나 비싼지를 본다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 timing vs pricing 개념 구분 방향 예측보다 가격-가치 비교를 우선 전 투자자 차트·뉴스 해석을 가치판단과 혼동하지 말 것 Graham 1973 강세장 경고 신호 높은 PER, 낮은 배당수익률 등 위험한 낙관의 징후 전 투자자 금리 환경과 지수 집중도 함께 점검 Graham 해설 [츠바이크 주석] [츠바이크 주석] 츠바이크는 이 장을 현대 투자자에게 가장 중요한 장으로 다룬다. 그의 해석은 “남들이 팔아서 나도 파는 구조”에서 벗어나 개인의 재무목표와 시간지평으로 성과를 재정의하라는 데 있다. [현대적 적용 논점] [현대 적용] 실시간 시세와 푸시 알림은 Mr. Market의 방문 빈도를 과거보다 훨씬 높였다. 따라서 오늘날의 실전 규율은 “언제 거래할지”보다 “언제 화면을 끌지”에 가깝다. [추론] [현대 적용] 리밸런싱은 그레이엄식 pricing 규율의 현대적 약식 구현이라고 볼 수 있다. 비중이 과도하게 오른 자산을 줄이고, 눌린 자산을 늘리는 행위가 자동으로 “낙관에 덜 사고 비관에 더 사는” 구조를 만든다. [추론] [오해 방지] Mr. Market은 “무조건 역추세 매매하라”는 비유가 아니다. 가격이 내려갔다고 자동으로 싸진 것이 아니다. 가치 판단이 먼저다. 훌륭한 경영과 훌륭한 주가 사이에는 긴 시차가 존재할 수 있다. 단기 주가는 감정이, 장기 주가는 사업성과가 더 많이 좌우한다."},{"i":10,"title":"9. 펀드 투자 (Investing in Investment Funds) [번역 제목 차이 가능]","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>[기존 개인 노트 없음]<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장은 개별 종목 분석 역량이 부족한 투자자가 펀드를 이용할 때 무엇을 봐야 하는지를 다룬다. 핵심 논리는 세 가지로 복원된다. 첫째, 펀드는 분산과 전문운용의 장점을 줄 수 있지만, 그 자체로 우월한 성과를 보장하지는 않는다. 둘째, 과거 성과를 이유로 인기 펀드에 비싸게 들어가는 행태는 개별종목 추격매수와 본질적으로 비슷하다. 셋째, 폐쇄형 펀드(closed-end fund)는 자산가치 대비 할인·할증이라는 추가 변수를 가지므로 구조를 이해하지 못하면 불리한 가격에 살 수 있다. [원서 대조 필요]<\/p>\n<p>[그레이엄 본문] 방어적 투자자에게 이 장이 중요한 이유는 “평균 수익을 낮은 실수로 얻는 우회로”를 제공하기 때문이다. 원문은 인덱스 펀드 시대 이전 문맥이지만, 오늘날 독자에게는 저비용 분산형 펀드가 가장 가까운 대응물이다. 다만 그레이엄 정신에 맞는 선택 기준은 화려한 마케팅이 아니라 비용, 구조, 투자정책, 운용 일관성이다. [추론]<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>개방형 펀드<\/td>\n<td style=\"text-align: right;\">NAV 기준 설정<\/td>\n<td>환매는 순자산가치 중심<\/td>\n<td>방어적 투자자<\/td>\n<td>ETF는 장중 거래되므로 시장가격 괴리 가능<\/td>\n<td>Open-end fund<\/td>\n<\/tr>\n<tr>\n<td>폐쇄형 펀드<\/td>\n<td style=\"text-align: right;\">NAV 대비 할인/할증 가능<\/td>\n<td>구조 자체가 기회이자 함정<\/td>\n<td>공격적 투자자 포함<\/td>\n<td>할인이 오래 지속될 수 있음<\/td>\n<td>Closed-end fund<\/td>\n<\/tr>\n<tr>\n<td>판매보수(load)<\/td>\n<td style=\"text-align: right;\">존재 가능<\/td>\n<td>수익률을 시작부터 잠식<\/td>\n<td>전 투자자<\/td>\n<td>저비용·무판매보수 선호가 유리<\/td>\n<td>Zero-load, index-fund 자료<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크의 현대적 해석은 이 장에서 특히 분명하다. 낮은 비용, 광범위한 분산, 자기과신 억제를 고려하면 많은 개인투자자에게 인덱스 펀드가 합리적 기본값이라는 방향으로 읽을 수 있다. 다만 그는 인덱스라도 구조·추적오차·비용을 보라고 강조한다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 1973년의 투자신탁/뮤추얼펀드 논의는 오늘날 ETF까지 확장해서 읽는 편이 실무적이다. 다만 ETF는 장중 프리미엄·디스카운트, 유동성, 세금 효율 등 별도 고려가 필요하다.<\/li>\n<li>[현대 적용] 비용은 확정 손실이고 초과성과는 불확실하다. 이 점에서 낮은 총보수와 낮은 회전율은 오늘날에도 그레이엄식 방어성에 부합한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>펀드는 “쉬운 상품”이 아니라 “실수를 줄여주는 구조”일 뿐이다.<\/li>\n<li>폐쇄형 펀드 할인은 자동 매수 신호가 아니다. 할인 원인이 비용, 레버리지, 유동성, 기초자산 불투명성일 수 있다.<\/li>\n<li>인덱스 펀드는 시장을 이기려는 수단이 아니라 시장 평균을 높은 순수익률로 확보하려는 수단이다.<\/li>\n<\/ul>","text":"기존 노트 [기존 개인 노트 없음] [보강 | 그레이엄 본문] [그레이엄 본문] 이 장은 개별 종목 분석 역량이 부족한 투자자가 펀드를 이용할 때 무엇을 봐야 하는지를 다룬다. 핵심 논리는 세 가지로 복원된다. 첫째, 펀드는 분산과 전문운용의 장점을 줄 수 있지만, 그 자체로 우월한 성과를 보장하지는 않는다. 둘째, 과거 성과를 이유로 인기 펀드에 비싸게 들어가는 행태는 개별종목 추격매수와 본질적으로 비슷하다. 셋째, 폐쇄형 펀드(closed-end fund)는 자산가치 대비 할인·할증이라는 추가 변수를 가지므로 구조를 이해하지 못하면 불리한 가격에 살 수 있다. [원서 대조 필요] [그레이엄 본문] 방어적 투자자에게 이 장이 중요한 이유는 “평균 수익을 낮은 실수로 얻는 우회로”를 제공하기 때문이다. 원문은 인덱스 펀드 시대 이전 문맥이지만, 오늘날 독자에게는 저비용 분산형 펀드가 가장 가까운 대응물이다. 다만 그레이엄 정신에 맞는 선택 기준은 화려한 마케팅이 아니라 비용, 구조, 투자정책, 운용 일관성이다. [추론] [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 개방형 펀드 NAV 기준 설정 환매는 순자산가치 중심 방어적 투자자 ETF는 장중 거래되므로 시장가격 괴리 가능 Open-end fund 폐쇄형 펀드 NAV 대비 할인/할증 가능 구조 자체가 기회이자 함정 공격적 투자자 포함 할인이 오래 지속될 수 있음 Closed-end fund 판매보수(load) 존재 가능 수익률을 시작부터 잠식 전 투자자 저비용·무판매보수 선호가 유리 Zero-load, index-fund 자료 [츠바이크 주석] [츠바이크 주석] 츠바이크의 현대적 해석은 이 장에서 특히 분명하다. 낮은 비용, 광범위한 분산, 자기과신 억제를 고려하면 많은 개인투자자에게 인덱스 펀드가 합리적 기본값이라는 방향으로 읽을 수 있다. 다만 그는 인덱스라도 구조·추적오차·비용을 보라고 강조한다. [현대적 적용 논점] [현대 적용] 1973년의 투자신탁/뮤추얼펀드 논의는 오늘날 ETF까지 확장해서 읽는 편이 실무적이다. 다만 ETF는 장중 프리미엄·디스카운트, 유동성, 세금 효율 등 별도 고려가 필요하다. [현대 적용] 비용은 확정 손실이고 초과성과는 불확실하다. 이 점에서 낮은 총보수와 낮은 회전율은 오늘날에도 그레이엄식 방어성에 부합한다. [오해 방지] 펀드는 “쉬운 상품”이 아니라 “실수를 줄여주는 구조”일 뿐이다. 폐쇄형 펀드 할인은 자동 매수 신호가 아니다. 할인 원인이 비용, 레버리지, 유동성, 기초자산 불투명성일 수 있다. 인덱스 펀드는 시장을 이기려는 수단이 아니라 시장 평균을 높은 순수익률로 확보하려는 수단이다."},{"i":11,"title":"10. 투자 조언","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>유서 깊고 평판 높은 유료 투자자문사를 선택하는 편이 좋음<\/li>\n<li>무료 자료는 형편없음<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장의 중심은 “자문을 누구에게 받을 것이냐”보다 “자문에 무엇을 기대할 것이냐”다. 그레이엄은 조언자가 미래를 맞혀줄 것이라는 환상을 경계한다. 좋은 조언자는 예언자가 아니라, 자산배분·가격 규율·행동 통제·세금·비용 같은 기본 원칙을 지키게 만드는 사람에 더 가깝다. [원서 대조 필요]<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>정량 기준 중심 아님<\/td>\n<td style=\"text-align: right;\">해당 없음<\/td>\n<td>조언의 질은 예측력보다 정직성·이해상충 관리가 핵심<\/td>\n<td>전 투자자<\/td>\n<td>수수료 체계와 판매유인 확인 필요<\/td>\n<td>Graham 취지, 현대 비용 자료<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대판 해석에서 츠바이크는 비용이 성과를 잠식하는 구조를 자주 지적한다. 따라서 자문사의 “명성”만이 아니라, 실제 보수체계와 상품판매 유인을 봐야 한다는 쪽으로 읽는 것이 적절하다.<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날에는 유료 자문사와 무료 커뮤니티 사이에 로보어드바이저, 인플루언서, 유튜브, 리서치 구독, 소셜미디어가 끼어 있다. 무료라고 해서 항상 나쁘지는 않지만, 대부분은 이해상충과 선동 리스크가 더 높다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>유료라고 자동으로 양질의 자문이 아니다.<\/li>\n<li>무료 자료가 모두 형편없는 것도 아니다. 다만 판매유인·정확성·책임소재가 불명확할 가능성이 크다.<\/li>\n<li>좋은 자문은 “무엇을 사라”보다 “어떻게 망하지 않을까”를 먼저 이야기한다. [추론]<\/li>\n<\/ul>","text":"기존 노트 유서 깊고 평판 높은 유료 투자자문사를 선택하는 편이 좋음 무료 자료는 형편없음 [보강 | 그레이엄 본문] [그레이엄 본문] 이 장의 중심은 “자문을 누구에게 받을 것이냐”보다 “자문에 무엇을 기대할 것이냐”다. 그레이엄은 조언자가 미래를 맞혀줄 것이라는 환상을 경계한다. 좋은 조언자는 예언자가 아니라, 자산배분·가격 규율·행동 통제·세금·비용 같은 기본 원칙을 지키게 만드는 사람에 더 가깝다. [원서 대조 필요] [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 정량 기준 중심 아님 해당 없음 조언의 질은 예측력보다 정직성·이해상충 관리가 핵심 전 투자자 수수료 체계와 판매유인 확인 필요 Graham 취지, 현대 비용 자료 [츠바이크 주석] [츠바이크 주석] 현대판 해석에서 츠바이크는 비용이 성과를 잠식하는 구조를 자주 지적한다. 따라서 자문사의 “명성”만이 아니라, 실제 보수체계와 상품판매 유인을 봐야 한다는 쪽으로 읽는 것이 적절하다. [현대적 적용 논점] [현대 적용] 오늘날에는 유료 자문사와 무료 커뮤니티 사이에 로보어드바이저, 인플루언서, 유튜브, 리서치 구독, 소셜미디어가 끼어 있다. 무료라고 해서 항상 나쁘지는 않지만, 대부분은 이해상충과 선동 리스크가 더 높다. [추론] [오해 방지] 유료라고 자동으로 양질의 자문이 아니다. 무료 자료가 모두 형편없는 것도 아니다. 다만 판매유인·정확성·책임소재가 불명확할 가능성이 크다. 좋은 자문은 “무엇을 사라”보다 “어떻게 망하지 않을까”를 먼저 이야기한다. [추론]"},{"i":12,"title":"11. 초보 투자자의 증권 분석","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>채권 분석: 이자보상비율(영업이익을 이자 비용으로 나눈 값)<\/li>\n<li>주식 분석: 미래 일정 기간의 이익 추정치(과거 판매량, 판매 가격, 영업 이익률 데이터 사용)에 적정 자본화계수를 곱해서 산출<\/li>\n<li>과거 실적 가치 산출 후 미래 상황 변화를 고려해 과거 실적 가치 조정 검토<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장은 “초보 투자자도 최소한의 분석은 해야 한다”는 요구다. 채권에서는 이자보상비율처럼 지급능력을 보고, 주식에서는 미래 이익 추정치에 자본화계수를 적용해 가치 범위를 계산하지만, 그레이엄은 이 과정이 정밀 숫자 놀음이 아니라 보수적 추정이어야 한다고 본다. 가치평가의 핵심 입력은 장기성장성, 경영의 질, 재무건전성, 자본구조, 배당기록, 현재 배당률 등이다.<\/p>\n<p>[그레이엄 본문] 여기서 중요한 점은 “계산 결과의 정밀함”이 아니라 “가정의 보수성”이다. 그레이엄은 가치가 하나의 정답 점으로 산출된다고 보지 않았고, 추정오차를 안전마진으로 흡수하려 했다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이자보상비율<\/td>\n<td style=\"text-align: right;\">영업이익 / 이자비용<\/td>\n<td>채권·부채 상환 여력 점검<\/td>\n<td>채권 및 주식 분석<\/td>\n<td>EBITDA 대체 사용 시 과대평가 주의<\/td>\n<td>Graham/현대 재무분석<\/td>\n<\/tr>\n<tr>\n<td>자본화계수<\/td>\n<td style=\"text-align: right;\">성장·질·재무에 따른 배수<\/td>\n<td>같은 EPS라도 질에 따라 가치 차이 발생<\/td>\n<td>주식 분석<\/td>\n<td>무형자산·주주환원 정책 반영 필요<\/td>\n<td>The Intelligent Investor 해설<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>위 장의 실무 메시지는 “예상 EPS를 단순히 높은 배수에 곱하는 행위”를 경계하는 것이다. 자본화계수는 성장률 하나가 아니라 질적 요소의 집합 함수다.<\/p>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크는 현대 투자자가 가치평가를 지나치게 정밀한 모델로 착각하는 경향을 비판하는 쪽에 가깝다. 데이터와 모델이 많아질수록 오히려 가정 과신이 커질 수 있다는 점에서, 그레이엄의 보수적 추정 정신을 복권시킨다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 회계상 자본화된 무형자산, SBC(주식보상), 조정 EBITDA 남용은 현대 분석에서 특히 주의할 항목이다. [추론]<\/li>\n<li>[현대 적용] 초보 투자자의 적정 대응은 정교한 DCF보다, 재무 건전성·현금흐름·희석 여부·자본배분 기록을 먼저 점검하는 것이다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>가치평가는 소수점 둘째 자리까지 맞히는 작업이 아니다.<\/li>\n<li>이자보상비율이 높아도 현금흐름 질이 나쁘면 안심할 수 없다.<\/li>\n<li>성장성이 높다고 자본화계수를 무한히 높이면 그 순간 투기가 된다.<\/li>\n<\/ul>","text":"기존 노트 채권 분석: 이자보상비율(영업이익을 이자 비용으로 나눈 값) 주식 분석: 미래 일정 기간의 이익 추정치(과거 판매량, 판매 가격, 영업 이익률 데이터 사용)에 적정 자본화계수를 곱해서 산출 과거 실적 가치 산출 후 미래 상황 변화를 고려해 과거 실적 가치 조정 검토 [보강 | 그레이엄 본문] [그레이엄 본문] 이 장은 “초보 투자자도 최소한의 분석은 해야 한다”는 요구다. 채권에서는 이자보상비율처럼 지급능력을 보고, 주식에서는 미래 이익 추정치에 자본화계수를 적용해 가치 범위를 계산하지만, 그레이엄은 이 과정이 정밀 숫자 놀음이 아니라 보수적 추정이어야 한다고 본다. 가치평가의 핵심 입력은 장기성장성, 경영의 질, 재무건전성, 자본구조, 배당기록, 현재 배당률 등이다. [그레이엄 본문] 여기서 중요한 점은 “계산 결과의 정밀함”이 아니라 “가정의 보수성”이다. 그레이엄은 가치가 하나의 정답 점으로 산출된다고 보지 않았고, 추정오차를 안전마진으로 흡수하려 했다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 이자보상비율 영업이익 / 이자비용 채권·부채 상환 여력 점검 채권 및 주식 분석 EBITDA 대체 사용 시 과대평가 주의 Graham/현대 재무분석 자본화계수 성장·질·재무에 따른 배수 같은 EPS라도 질에 따라 가치 차이 발생 주식 분석 무형자산·주주환원 정책 반영 필요 The Intelligent Investor 해설 위 장의 실무 메시지는 “예상 EPS를 단순히 높은 배수에 곱하는 행위”를 경계하는 것이다. 자본화계수는 성장률 하나가 아니라 질적 요소의 집합 함수다. [츠바이크 주석] [츠바이크 주석] 츠바이크는 현대 투자자가 가치평가를 지나치게 정밀한 모델로 착각하는 경향을 비판하는 쪽에 가깝다. 데이터와 모델이 많아질수록 오히려 가정 과신이 커질 수 있다는 점에서, 그레이엄의 보수적 추정 정신을 복권시킨다. [추론] [현대적 적용 논점] [현대 적용] 회계상 자본화된 무형자산, SBC(주식보상), 조정 EBITDA 남용은 현대 분석에서 특히 주의할 항목이다. [추론] [현대 적용] 초보 투자자의 적정 대응은 정교한 DCF보다, 재무 건전성·현금흐름·희석 여부·자본배분 기록을 먼저 점검하는 것이다. [오해 방지] 가치평가는 소수점 둘째 자리까지 맞히는 작업이 아니다. 이자보상비율이 높아도 현금흐름 질이 나쁘면 안심할 수 없다. 성장성이 높다고 자본화계수를 무한히 높이면 그 순간 투기가 된다."},{"i":13,"title":"12. 주당순이익 EPS","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>1년 실적을 너무 진지하게 받아들이지 말라<\/li>\n<li>단기 실적에 관심이 쏠릴 때는 EPS라는 함정을 조심하라<\/li>\n<li>여러 가지 사유로 인해 희석 효과가 발생할 수 있음<\/li>\n<li>평균 EPS (과거 7년) 활용 가능<\/li>\n<li>과거 성장률 계산: 최근 3년 평균 EPS와 10년 전 기준 3년 평균 EPS 비교<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장은 EPS를 부정하는 장이 아니라, EPS를 맥락 없이 숭배하지 말라는 장이다. 일회성 손익, 회계정책, 희석증권, 경기순환이 개입하면 단년도 EPS는 기업의 정상수익력을 왜곡할 수 있다. 그래서 그레이엄은 평균 EPS와 장기 비교를 통해 정상화된 수익력을 보려 했다.<\/p>\n<p>[그레이엄 본문] 이 장은 뒤의 성장주 평가 공식과도 연결된다. 그레이엄 자신도 단순 공식은 대중화될수록 위험해지고, 부채·질·안전성 같은 전제조건을 무시하면 오용된다고 보았다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>평균 EPS<\/td>\n<td style=\"text-align: right;\">과거 7년 평균 등<\/td>\n<td>경기·일회성 요인 완화<\/td>\n<td>전 투자자<\/td>\n<td>7년은 업종별로 조정 가능<\/td>\n<td>Graham 원칙<\/td>\n<\/tr>\n<tr>\n<td>성장률 계산<\/td>\n<td style=\"text-align: right;\">최근 3년 평균 vs 10년 전 3년 평균<\/td>\n<td>일시 급등락보다 장기 추세 확인<\/td>\n<td>전 투자자<\/td>\n<td>인수합병·회계기준 변경 반영 필요<\/td>\n<td>Graham 원칙<\/td>\n<\/tr>\n<tr>\n<td>희석 효과<\/td>\n<td style=\"text-align: right;\">옵션·워런트·전환증권<\/td>\n<td>실제 주당가치 하락 가능성<\/td>\n<td>전 투자자<\/td>\n<td>SBC 많은 기술주는 필수 점검<\/td>\n<td>Dilutive security<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대 주석 관점에서 EPS 함정은 더 커졌다. 스톡옵션 기반 보상, 자사주 매입에 의한 분모 축소, 조정 EPS 남용이 모두 단기 숫자를 더 좋게 보이게 만들 수 있기 때문이다. [현대 적용]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 희석주식수(diluted shares outstanding)를 보지 않으면 EPS 품질을 놓친다.<\/li>\n<li>[현대 적용] 평균 EPS는 경기순환주, 원자재주, 금융주의 정상화 분석에 특히 유용하다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>EPS 성장률이 높다고 자동으로 좋은 투자대상은 아니다.<\/li>\n<li>희석을 무시한 EPS는 실제 주주가치와 괴리될 수 있다.<\/li>\n<li>평균 EPS를 쓰더라도 사업구조가 바뀐 회사는 과거 평균 자체가 무의미해질 수 있다.<\/li>\n<\/ul>","text":"기존 노트 1년 실적을 너무 진지하게 받아들이지 말라 단기 실적에 관심이 쏠릴 때는 EPS라는 함정을 조심하라 여러 가지 사유로 인해 희석 효과가 발생할 수 있음 평균 EPS (과거 7년) 활용 가능 과거 성장률 계산: 최근 3년 평균 EPS와 10년 전 기준 3년 평균 EPS 비교 [보강 | 그레이엄 본문] [그레이엄 본문] 이 장은 EPS를 부정하는 장이 아니라, EPS를 맥락 없이 숭배하지 말라는 장이다. 일회성 손익, 회계정책, 희석증권, 경기순환이 개입하면 단년도 EPS는 기업의 정상수익력을 왜곡할 수 있다. 그래서 그레이엄은 평균 EPS와 장기 비교를 통해 정상화된 수익력을 보려 했다. [그레이엄 본문] 이 장은 뒤의 성장주 평가 공식과도 연결된다. 그레이엄 자신도 단순 공식은 대중화될수록 위험해지고, 부채·질·안전성 같은 전제조건을 무시하면 오용된다고 보았다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 평균 EPS 과거 7년 평균 등 경기·일회성 요인 완화 전 투자자 7년은 업종별로 조정 가능 Graham 원칙 성장률 계산 최근 3년 평균 vs 10년 전 3년 평균 일시 급등락보다 장기 추세 확인 전 투자자 인수합병·회계기준 변경 반영 필요 Graham 원칙 희석 효과 옵션·워런트·전환증권 실제 주당가치 하락 가능성 전 투자자 SBC 많은 기술주는 필수 점검 Dilutive security [츠바이크 주석] [츠바이크 주석] 현대 주석 관점에서 EPS 함정은 더 커졌다. 스톡옵션 기반 보상, 자사주 매입에 의한 분모 축소, 조정 EPS 남용이 모두 단기 숫자를 더 좋게 보이게 만들 수 있기 때문이다. [현대 적용] [현대적 적용 논점] [현대 적용] 희석주식수(diluted shares outstanding)를 보지 않으면 EPS 품질을 놓친다. [현대 적용] 평균 EPS는 경기순환주, 원자재주, 금융주의 정상화 분석에 특히 유용하다. [추론] [오해 방지] EPS 성장률이 높다고 자동으로 좋은 투자대상은 아니다. 희석을 무시한 EPS는 실제 주주가치와 괴리될 수 있다. 평균 EPS를 쓰더라도 사업구조가 바뀐 회사는 과거 평균 자체가 무의미해질 수 있다."},{"i":14,"title":"13. 상장회사 비교 분석","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>충분한 규모 / 매우 건전한 재무 상태 / 최근 10년간 적자 없음 / 최근 20년간 연속 배당<\/li>\n<li>EPS 10년 성장률이 33% 이상 / PER 15 이하 (최근 3년 평균 이익 기준) / PBR 1.5 이하<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장은 단순히 네 회사를 비교하는 사례장이 아니라, 방어적 투자 기준이 실제 기업 비교에서 어떻게 작동하는지 보여주는 전환 장이다. 즉, 숫자는 체크리스트가 아니라 탈락 필터다. 훌륭한 이야기 대신 규모, 건전성, 적자 부재, 장기 배당, 성장, 적정 가격이 동시에 맞아야 한다는 점을 강조한다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>최근 20년 연속 배당<\/td>\n<td style=\"text-align: right;\">20년<\/td>\n<td>자본배분 규율과 현금창출력 검증<\/td>\n<td>방어적 투자자<\/td>\n<td>자사주매입 대체 기업은 불리<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>최근 10년 적자 없음<\/td>\n<td style=\"text-align: right;\">10년<\/td>\n<td>경기침체 포함 이익안정성<\/td>\n<td>방어적 투자자<\/td>\n<td>금융위기·팬데믹 등 충격 기간 해석 필요<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>EPS 10년 성장률 33% 이상<\/td>\n<td style=\"text-align: right;\">10년간 3분의 1 이상<\/td>\n<td>성장은 필요하지만 과도한 기대 아님<\/td>\n<td>방어적 투자자<\/td>\n<td>기저효과·M&amp;A 왜곡 점검<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>PER 15 이하<\/td>\n<td style=\"text-align: right;\">최근 3년 평균 이익 기준<\/td>\n<td>가격 상한선<\/td>\n<td>방어적 투자자<\/td>\n<td>금리·섹터에 따라 기계적 적용 금지<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>PBR 1.5 이하<\/td>\n<td style=\"text-align: right;\">장부가치 기준<\/td>\n<td>자산 대비 과도한 가격 방지<\/td>\n<td>방어적 투자자<\/td>\n<td>무형자산 기업엔 한계 큼<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>PER×PBR 22.5 이하<\/td>\n<td style=\"text-align: right;\">15×1.5<\/td>\n<td>둘 중 하나가 높을 때 상호 보정<\/td>\n<td>방어적 투자자<\/td>\n<td>후대에는 Graham Number로 파생 사용<\/td>\n<td>Graham 기준, 후대 파생<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>위 기준 6개는 14장의 7대 선정 기준과 실질적으로 같은 체계를 공유하며, 13장은 그 기준을 사례 비교에 적용해 보는 가교 역할을 한다.<\/p>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대 해설에서는 이 숫자들을 “시장 평균보다 싼가?” 정도의 가벼운 스크린으로 쓰는 것이 아니라, 업종 특성과 회계 왜곡을 교차 점검하는 출발점으로 이해해야 한다는 방향이 강하다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 20년 연속 배당, PBR 1.5 이하, 10년 무적자는 오늘날 미국 대형 성장주 시장에서는 매우 엄격한 조건이 되었다. [추론] 이는 무형자산 경제, 고수익 저자본 구조, 자사주 매입 중심 환원정책, 장기 저금리 이후의 높은 밸류에이션 체제가 겹쳤기 때문이다.<\/li>\n<li>[후대 연구] PER×PBR 22.5는 후대에 “Graham Number”로 단순화되었지만, 그레이엄 본인이 공식을 분명히 제시한 것은 아니고, 원래는 개별 기준의 결합 논리에서 파생된 것이다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>기준을 몇 개 통과했다고 자동 매수는 아니다.<\/li>\n<li>PER 15, PBR 1.5, 22.5는 시대불변의 자연상수가 아니다.<\/li>\n<li>기준을 모두 완화하면 더는 그레이엄식 방어 기준이 아니다.<\/li>\n<\/ul>","text":"기존 노트 충분한 규모 / 매우 건전한 재무 상태 / 최근 10년간 적자 없음 / 최근 20년간 연속 배당 EPS 10년 성장률이 33% 이상 / PER 15 이하 (최근 3년 평균 이익 기준) / PBR 1.5 이하 [보강 | 그레이엄 본문] [그레이엄 본문] 이 장은 단순히 네 회사를 비교하는 사례장이 아니라, 방어적 투자 기준이 실제 기업 비교에서 어떻게 작동하는지 보여주는 전환 장이다. 즉, 숫자는 체크리스트가 아니라 탈락 필터다. 훌륭한 이야기 대신 규모, 건전성, 적자 부재, 장기 배당, 성장, 적정 가격이 동시에 맞아야 한다는 점을 강조한다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 최근 20년 연속 배당 20년 자본배분 규율과 현금창출력 검증 방어적 투자자 자사주매입 대체 기업은 불리 Graham 기준 최근 10년 적자 없음 10년 경기침체 포함 이익안정성 방어적 투자자 금융위기·팬데믹 등 충격 기간 해석 필요 Graham 기준 EPS 10년 성장률 33% 이상 10년간 3분의 1 이상 성장은 필요하지만 과도한 기대 아님 방어적 투자자 기저효과·M&amp;A 왜곡 점검 Graham 기준 PER 15 이하 최근 3년 평균 이익 기준 가격 상한선 방어적 투자자 금리·섹터에 따라 기계적 적용 금지 Graham 기준 PBR 1.5 이하 장부가치 기준 자산 대비 과도한 가격 방지 방어적 투자자 무형자산 기업엔 한계 큼 Graham 기준 PER×PBR 22.5 이하 15×1.5 둘 중 하나가 높을 때 상호 보정 방어적 투자자 후대에는 Graham Number로 파생 사용 Graham 기준, 후대 파생 위 기준 6개는 14장의 7대 선정 기준과 실질적으로 같은 체계를 공유하며, 13장은 그 기준을 사례 비교에 적용해 보는 가교 역할을 한다. [츠바이크 주석] [츠바이크 주석] 현대 해설에서는 이 숫자들을 “시장 평균보다 싼가?” 정도의 가벼운 스크린으로 쓰는 것이 아니라, 업종 특성과 회계 왜곡을 교차 점검하는 출발점으로 이해해야 한다는 방향이 강하다. [추론] [현대적 적용 논점] [현대 적용] 20년 연속 배당, PBR 1.5 이하, 10년 무적자는 오늘날 미국 대형 성장주 시장에서는 매우 엄격한 조건이 되었다. [추론] 이는 무형자산 경제, 고수익 저자본 구조, 자사주 매입 중심 환원정책, 장기 저금리 이후의 높은 밸류에이션 체제가 겹쳤기 때문이다. [후대 연구] PER×PBR 22.5는 후대에 “Graham Number”로 단순화되었지만, 그레이엄 본인이 공식을 분명히 제시한 것은 아니고, 원래는 개별 기준의 결합 논리에서 파생된 것이다. [오해 방지] 기준을 몇 개 통과했다고 자동 매수는 아니다. PER 15, PBR 1.5, 22.5는 시대불변의 자연상수가 아니다. 기준을 모두 완화하면 더는 그레이엄식 방어 기준이 아니다."},{"i":15,"title":"14. 방어적 투자자의 종목 선정 (Stock Selection for the Defensive Investor)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>[기존 개인 노트 없음]<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 14장은 방어적 투자자를 위한 7대 종목 선정 기준의 본체다. 원문의 취지는 “정교한 분석 없이도 재무적으로 튼튼하고 가격이 과도하지 않은 보통주 집합을 만들 수 있는가”에 있다. 다시 말해, 개별 종목 예언 대신 탈락 기준 집합을 사용해 평균 이상의 생존성을 확보하려는 설계다.<\/p>\n<p>[그레이엄 본문] 7대 기준은 대략 다음과 같이 복원된다. 적정한 기업 규모, 충분히 강한 재무상태, 최근 10년간 적자 없음, 최근 20년간 연속 배당, 최근 10년 EPS 33% 이상 성장, 평균이익 기준 PER 15 이하, PBR 1.5 이하 또는 둘의 곱 22.5 이하. 이 기준은 “훌륭한 회사”보다 “망하기 어려운 회사를 비싸지 않게 사기”에 초점을 둔다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>적정 규모<\/td>\n<td style=\"text-align: right;\">산업기업 매출 1억달러, 공익기업 5천만달러<\/td>\n<td>소형주의 취약성 회피<\/td>\n<td>방어적 투자자<\/td>\n<td>1970년대 달러 기준이므로 명목치 그대로 쓰면 왜곡 큼<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>재무상태<\/td>\n<td style=\"text-align: right;\">총자산 ≥ 총부채의 2배 [요약 복원]<\/td>\n<td>재무충격 흡수력<\/td>\n<td>방어적 투자자<\/td>\n<td>금융·플랫폼 업종은 보정 필요<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>최근 10년 적자 없음<\/td>\n<td style=\"text-align: right;\">10년<\/td>\n<td>장기 이익안정성<\/td>\n<td>방어적 투자자<\/td>\n<td>일회성 회계손실 해석 필요<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>최근 20년 연속 배당<\/td>\n<td style=\"text-align: right;\">20년<\/td>\n<td>현금창출·주주환원 규율<\/td>\n<td>방어적 투자자<\/td>\n<td>배당보다 자사주를 선호하는 기업 불리<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>EPS 10년 성장률 33% 이상<\/td>\n<td style=\"text-align: right;\">1/3 이상<\/td>\n<td>방어성과 성장성의 최소 결합<\/td>\n<td>방어적 투자자<\/td>\n<td>낮은 기준이지만 경기효과 점검 필요<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>PER 15 이하<\/td>\n<td style=\"text-align: right;\">최근 3년 평균 이익 기준<\/td>\n<td>가격 상한<\/td>\n<td>방어적 투자자<\/td>\n<td>금리와 업종성격 보정 필요<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>PBR 1.5 이하<\/td>\n<td style=\"text-align: right;\">장부가치 기준<\/td>\n<td>자산 대비 과대지급 방지<\/td>\n<td>방어적 투자자<\/td>\n<td>무형자산 비중 높은 업종엔 부정확<\/td>\n<td>Graham 기준<\/td>\n<\/tr>\n<tr>\n<td>PER×PBR 22.5 이하<\/td>\n<td style=\"text-align: right;\">15×1.5<\/td>\n<td>두 기준의 상호보정<\/td>\n<td>방어적 투자자<\/td>\n<td>후대 “Graham Number”는 파생 해석<\/td>\n<td>Graham 기준, 후대 파생<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>이 표는 1973년판 14장 기준을 요약한 2차 자료를 토대로 정리했다. 다만 재무상태 항목의 문장 표현은 번역·요약에 따라 다를 수 있어 [원서 대조 필요]로 둔다.<\/p>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 이 기준을 오늘날 기계적으로 적용하면 통과 종목 수가 크게 줄어든다는 점이 현대 해설의 핵심 쟁점이다. 그 이유는 기준이 틀려서라기보다, 시장이 무형자산·네트워크 효과·저배당/자사주 환원·고수익 저자본 구조로 이동했기 때문이다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[후대 연구/추론] 방어적 기준의 통과 종목 수 축소 논쟁은 “그레이엄이 낡았는가”보다 “회계와 산업구조가 바뀌었는가”의 문제에 가깝다. 특히 PBR과 장기 현금배당 기준이 현대 성장/플랫폼 기업을 많이 탈락시킨다.<\/li>\n<li>[현대 적용] 따라서 현대 실무에서는 PBR 대신 EV/EBIT, FCF yield, ROIC, 순현금, 희석보정 등을 추가로 보는 경우가 많지만, 이는 그레이엄 원문이 아니라 후대 확장이다. [후대 연구]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>이 기준은 공격적 투자자를 위한 초과수익 공식이 아니다.<\/li>\n<li>통과 종목이 거의 없다고 기준이 자동으로 무효가 되는 것은 아니다.<\/li>\n<li>반대로 기준을 시대에 맞춘다며 다 풀어버리면 안전마진이 사라진다.<\/li>\n<\/ul>","text":"기존 노트 [기존 개인 노트 없음] [보강 | 그레이엄 본문] [그레이엄 본문] 14장은 방어적 투자자를 위한 7대 종목 선정 기준의 본체다. 원문의 취지는 “정교한 분석 없이도 재무적으로 튼튼하고 가격이 과도하지 않은 보통주 집합을 만들 수 있는가”에 있다. 다시 말해, 개별 종목 예언 대신 탈락 기준 집합을 사용해 평균 이상의 생존성을 확보하려는 설계다. [그레이엄 본문] 7대 기준은 대략 다음과 같이 복원된다. 적정한 기업 규모, 충분히 강한 재무상태, 최근 10년간 적자 없음, 최근 20년간 연속 배당, 최근 10년 EPS 33% 이상 성장, 평균이익 기준 PER 15 이하, PBR 1.5 이하 또는 둘의 곱 22.5 이하. 이 기준은 “훌륭한 회사”보다 “망하기 어려운 회사를 비싸지 않게 사기”에 초점을 둔다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 적정 규모 산업기업 매출 1억달러, 공익기업 5천만달러 소형주의 취약성 회피 방어적 투자자 1970년대 달러 기준이므로 명목치 그대로 쓰면 왜곡 큼 Graham 기준 재무상태 총자산 ≥ 총부채의 2배 [요약 복원] 재무충격 흡수력 방어적 투자자 금융·플랫폼 업종은 보정 필요 Graham 기준 최근 10년 적자 없음 10년 장기 이익안정성 방어적 투자자 일회성 회계손실 해석 필요 Graham 기준 최근 20년 연속 배당 20년 현금창출·주주환원 규율 방어적 투자자 배당보다 자사주를 선호하는 기업 불리 Graham 기준 EPS 10년 성장률 33% 이상 1/3 이상 방어성과 성장성의 최소 결합 방어적 투자자 낮은 기준이지만 경기효과 점검 필요 Graham 기준 PER 15 이하 최근 3년 평균 이익 기준 가격 상한 방어적 투자자 금리와 업종성격 보정 필요 Graham 기준 PBR 1.5 이하 장부가치 기준 자산 대비 과대지급 방지 방어적 투자자 무형자산 비중 높은 업종엔 부정확 Graham 기준 PER×PBR 22.5 이하 15×1.5 두 기준의 상호보정 방어적 투자자 후대 “Graham Number”는 파생 해석 Graham 기준, 후대 파생 이 표는 1973년판 14장 기준을 요약한 2차 자료를 토대로 정리했다. 다만 재무상태 항목의 문장 표현은 번역·요약에 따라 다를 수 있어 [원서 대조 필요]로 둔다. [츠바이크 주석] [츠바이크 주석] 이 기준을 오늘날 기계적으로 적용하면 통과 종목 수가 크게 줄어든다는 점이 현대 해설의 핵심 쟁점이다. 그 이유는 기준이 틀려서라기보다, 시장이 무형자산·네트워크 효과·저배당/자사주 환원·고수익 저자본 구조로 이동했기 때문이다. [추론] [현대적 적용 논점] [후대 연구/추론] 방어적 기준의 통과 종목 수 축소 논쟁은 “그레이엄이 낡았는가”보다 “회계와 산업구조가 바뀌었는가”의 문제에 가깝다. 특히 PBR과 장기 현금배당 기준이 현대 성장/플랫폼 기업을 많이 탈락시킨다. [현대 적용] 따라서 현대 실무에서는 PBR 대신 EV/EBIT, FCF yield, ROIC, 순현금, 희석보정 등을 추가로 보는 경우가 많지만, 이는 그레이엄 원문이 아니라 후대 확장이다. [후대 연구] [오해 방지] 이 기준은 공격적 투자자를 위한 초과수익 공식이 아니다. 통과 종목이 거의 없다고 기준이 자동으로 무효가 되는 것은 아니다. 반대로 기준을 시대에 맞춘다며 다 풀어버리면 안전마진이 사라진다."},{"i":16,"title":"15. 공격적 투자자의 종목 선정","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>차익거래, 청산, 순수 헤지, 염가종목<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 15장은 공격적 투자자가 실제로 초과수익을 기대할 만한 영역을 제시한다. 대표 범주는 염가 종목, 특별상황(합병·청산·재편), 차익거래, 헤지 성격의 거래다. 공통점은 모두 “가격 괴리의 원천이 무엇인지 설명 가능하다”는 점이다. 즉, 방향 예측보다 구조적 비효율을 노린다. [원서 대조 필요]<\/p>\n<p>[그레이엄 본문] 이 장의 공격성은 레버리지나 빈번한 매매가 아니라 사건 분석과 조건부 확률 계산에 가깝다. 그래서 공격적 투자자는 보통 투자자보다 더 사업적으로, 더 계약적으로 생각해야 한다. [추론]<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NCAV/염가 종목<\/td>\n<td style=\"text-align: right;\">시가총액 &lt; NCAV<\/td>\n<td>자산가치 하한선 활용<\/td>\n<td>공격적 투자자<\/td>\n<td>유동성·상장폐지·거래비용 필수 반영<\/td>\n<td>Security Analysis, NCAV 연구<\/td>\n<\/tr>\n<tr>\n<td>특별상황<\/td>\n<td style=\"text-align: right;\">정량 임계치보다 사건구조 중요<\/td>\n<td>가격 회복의 촉매 존재<\/td>\n<td>공격적 투자자<\/td>\n<td>이벤트 실패 확률과 시간비용 고려<\/td>\n<td>Graham 취지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대판 독자에게 이 장은 가장 오용되기 쉬운 장이다. 츠바이크는 개인투자자가 “special situations”를 듣자마자 복잡한 이벤트드리븐 거래로 달려가기보다, 자신의 분석역량 범위를 먼저 인정해야 한다는 방향으로 해석하는 것이 안전하다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[후대 연구] NCAV 전략은 미국, 일본, 영국 등에서 역사적으로 초과성과가 보고되었지만, 표본이 주로 소형·저유동성·곤경기업에 치우쳐 있어 실행 제약이 크다.<\/li>\n<li>[현대 적용] 특별상황 투자는 정보우위보다 문서 읽기, 구조 이해, 포지션 크기 통제가 더 중요하다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>차익거래는 무위험이 아니다.<\/li>\n<li>염가 종목은 대부분 “원래부터 문제가 있는 회사”들이다.<\/li>\n<li>공격적 투자자는 기회가 없을 때 쉬는 능력도 포함한다. [추론]<\/li>\n<\/ul>","text":"기존 노트 차익거래, 청산, 순수 헤지, 염가종목 [보강 | 그레이엄 본문] [그레이엄 본문] 15장은 공격적 투자자가 실제로 초과수익을 기대할 만한 영역을 제시한다. 대표 범주는 염가 종목, 특별상황(합병·청산·재편), 차익거래, 헤지 성격의 거래다. 공통점은 모두 “가격 괴리의 원천이 무엇인지 설명 가능하다”는 점이다. 즉, 방향 예측보다 구조적 비효율을 노린다. [원서 대조 필요] [그레이엄 본문] 이 장의 공격성은 레버리지나 빈번한 매매가 아니라 사건 분석과 조건부 확률 계산에 가깝다. 그래서 공격적 투자자는 보통 투자자보다 더 사업적으로, 더 계약적으로 생각해야 한다. [추론] [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 NCAV/염가 종목 시가총액 &lt; NCAV 자산가치 하한선 활용 공격적 투자자 유동성·상장폐지·거래비용 필수 반영 Security Analysis, NCAV 연구 특별상황 정량 임계치보다 사건구조 중요 가격 회복의 촉매 존재 공격적 투자자 이벤트 실패 확률과 시간비용 고려 Graham 취지 [츠바이크 주석] [츠바이크 주석] 현대판 독자에게 이 장은 가장 오용되기 쉬운 장이다. 츠바이크는 개인투자자가 “special situations”를 듣자마자 복잡한 이벤트드리븐 거래로 달려가기보다, 자신의 분석역량 범위를 먼저 인정해야 한다는 방향으로 해석하는 것이 안전하다. [추론] [현대적 적용 논점] [후대 연구] NCAV 전략은 미국, 일본, 영국 등에서 역사적으로 초과성과가 보고되었지만, 표본이 주로 소형·저유동성·곤경기업에 치우쳐 있어 실행 제약이 크다. [현대 적용] 특별상황 투자는 정보우위보다 문서 읽기, 구조 이해, 포지션 크기 통제가 더 중요하다. [추론] [오해 방지] 차익거래는 무위험이 아니다. 염가 종목은 대부분 “원래부터 문제가 있는 회사”들이다. 공격적 투자자는 기회가 없을 때 쉬는 능력도 포함한다. [추론]"},{"i":17,"title":"16. 전환증권과 신주인수권 (Convertible Issues and Warrants)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>[기존 개인 노트 없음]<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 16장은 전환증권과 워런트를 공짜 상하방 결합상품으로 보지 말라는 장으로 정리하는 편이 안전하다. 전환증권은 일반적으로 동일 신용위험의 일반채보다 수익률이 낮고, 워런트·전환권은 보통주 수와 희석 EPS에 영향을 줄 수 있다. 따라서 핵심은 발행사 건전성, 전환가, 콜조항, 희석효과다. 세부 사례와 원문 어조는 <code>[최종 원서 대조 필요]<\/code>로 남긴다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전환증권<\/td>\n<td style=\"text-align: right;\">채권/우선주 + 보통주 전환권<\/td>\n<td>하방방어와 상방참여를 동시에 표방<\/td>\n<td>전 투자자<\/td>\n<td>전환가, 콜조항, 신용위험 따로 봐야 함<\/td>\n<td>일반 금융정의<\/td>\n<\/tr>\n<tr>\n<td>신주인수권<\/td>\n<td style=\"text-align: right;\">특정 가격에 신주 매수 권리<\/td>\n<td>레버리지성 강한 파생 노출<\/td>\n<td>공격적 투자자<\/td>\n<td>희석효과·만기·행사가 중요<\/td>\n<td>Dilutive security<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대 해석으로 옮기면, 구조가 복잡할수록 판매는 쉬워지고 이해는 어려워진다. 이는 오늘날 전환사채 펀드, 구조화채권, 옵션 부가상품에도 그대로 적용되는 경고다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 전환증권은 금리·크레딧·주가 변동성의 혼합상품이므로 단일 자산군으로 착각하면 안 된다.<\/li>\n<li>[현대 적용] 워런트는 EPS 희석과 주주가치 이전 문제를 함께 봐야 한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“전환 가능”이라는 말이 곧 안전을 뜻하지 않는다.<\/li>\n<li>워런트는 저렴한 옵션이 아니라, 발행사와 기존주주 모두에게 영향을 주는 구조다.<\/li>\n<li>구조가 복잡할수록 안전마진이 커지는 것이 아니라, 이해부족 리스크가 커질 수 있다. [추론]<\/li>\n<\/ul>","text":"기존 노트 [기존 개인 노트 없음] [보강 | 그레이엄 본문] [그레이엄 본문] 16장은 전환증권과 워런트를 공짜 상하방 결합상품으로 보지 말라는 장으로 정리하는 편이 안전하다. 전환증권은 일반적으로 동일 신용위험의 일반채보다 수익률이 낮고, 워런트·전환권은 보통주 수와 희석 EPS에 영향을 줄 수 있다. 따라서 핵심은 발행사 건전성, 전환가, 콜조항, 희석효과다. 세부 사례와 원문 어조는 [최종 원서 대조 필요] 로 남긴다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 전환증권 채권/우선주 + 보통주 전환권 하방방어와 상방참여를 동시에 표방 전 투자자 전환가, 콜조항, 신용위험 따로 봐야 함 일반 금융정의 신주인수권 특정 가격에 신주 매수 권리 레버리지성 강한 파생 노출 공격적 투자자 희석효과·만기·행사가 중요 Dilutive security [츠바이크 주석] [츠바이크 주석] 현대 해석으로 옮기면, 구조가 복잡할수록 판매는 쉬워지고 이해는 어려워진다. 이는 오늘날 전환사채 펀드, 구조화채권, 옵션 부가상품에도 그대로 적용되는 경고다. [추론] [현대적 적용 논점] [현대 적용] 전환증권은 금리·크레딧·주가 변동성의 혼합상품이므로 단일 자산군으로 착각하면 안 된다. [현대 적용] 워런트는 EPS 희석과 주주가치 이전 문제를 함께 봐야 한다. [오해 방지] “전환 가능”이라는 말이 곧 안전을 뜻하지 않는다. 워런트는 저렴한 옵션이 아니라, 발행사와 기존주주 모두에게 영향을 주는 구조다. 구조가 복잡할수록 안전마진이 커지는 것이 아니라, 이해부족 리스크가 커질 수 있다. [추론]"},{"i":18,"title":"17. 네 가지 유익한 기업 사례 (Four Extremely Instructive Case Histories) [번역 제목 차이 가능]","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>[기존 개인 노트 없음]<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 17장은 스크린 규칙을 무시했을 때 실제로 어떤 종류의 재앙이 발생하는지 보여주는 사례장으로 읽는 것이 적절하다. 이번 조사에서 신뢰 가능하게 교차확인한 기업은 Penn Central, Ling-Temco-Vought, NVF이며, 나머지 1개 사례의 정확한 기업명은 [원서 대조 필요]로 남긴다. 이 장의 공통 교훈은 최근의 외형 성장, 대형화, 화려한 자본거래, 회계상 숫자가 투자적격성을 대체하지 못한다는 점이다.<\/p>\n<p>[그레이엄 본문] Penn Central은 대형 기업이라도 재무·사업 구조가 약하면 붕괴할 수 있음을 보여준다. Ling-Temco-Vought는 콩글로머리트 확장과 차입 성장의 취약성을 드러낸다. NVF/Sharon Steel 사례는 인수·회계·지배구조가 결합될 때 숫자가 얼마나 왜곡될 수 있는지를 경고한다. [원서 대조 필요]<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>사례 분석<\/td>\n<td style=\"text-align: right;\">정량 스크린만으로 포착 어려운 질적 리스크 점검<\/td>\n<td>회계, 지배구조, 차입, 과대서사 확인<\/td>\n<td>전 투자자<\/td>\n<td>정성 리스크를 숫자보다 우선 볼 때가 있음<\/td>\n<td>Graham 사례장<\/td>\n<\/tr>\n<tr>\n<td>NVF/Sharon Steel<\/td>\n<td style=\"text-align: right;\">적대적 인수·회계 이슈<\/td>\n<td>겉보기 거래구조와 실제 경제가치 분리<\/td>\n<td>공격적 투자자<\/td>\n<td>M&amp;A 회계·희석·지배주주 사익편취 점검<\/td>\n<td>사례/부록 관련 자료<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대판에서는 이 장을 엔론, 월드컴, SPAC, 롤업, 과도한 스토리 주식 같은 현대 사례와 연결해서 읽는 것이 자연스럽다. 겉보기 성장과 자본시장 인기만으로 투자적격성을 판단하면 안 된다는 메시지는 오히려 지금 더 강하다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 사례장 분석은 오늘날 “숫자+내러티브+거버넌스”의 3요소 점검으로 번역할 수 있다.<\/li>\n<li>[현대 적용] 대형주, 유명 경영진, 복잡한 인수 구조는 안전판이 아니라 오히려 경고 표지일 수 있다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>사례장은 역사 이야기 모음이 아니다. 투자기준 위반의 비용을 보여주는 장이다.<\/li>\n<li>큰 회사라고 안전하지 않다.<\/li>\n<li>회계상 이익과 주주가치가 항상 일치하지 않는다.<\/li>\n<\/ul>\n<h3>[추가 검증 반영]<\/h3>\n<ul>\n<li>17장은 적어도 Penn Central, Ling-Temco-Vought, NVF 계열 사례를 통해 외형 성장, 차입 확대, 복잡한 자본거래가 투자 적격성을 보장하지 않는다는 교훈을 준다고 정리한다. 다만 접근 가능한 A·B 자료만으로 네 번째 사례 기업명은 확정하지 못했으므로 <code>[최종 원서 대조 필요]<\/code>를 유지한다.<\/li>\n<\/ul>","text":"기존 노트 [기존 개인 노트 없음] [보강 | 그레이엄 본문] [그레이엄 본문] 17장은 스크린 규칙을 무시했을 때 실제로 어떤 종류의 재앙이 발생하는지 보여주는 사례장으로 읽는 것이 적절하다. 이번 조사에서 신뢰 가능하게 교차확인한 기업은 Penn Central, Ling-Temco-Vought, NVF이며, 나머지 1개 사례의 정확한 기업명은 [원서 대조 필요]로 남긴다. 이 장의 공통 교훈은 최근의 외형 성장, 대형화, 화려한 자본거래, 회계상 숫자가 투자적격성을 대체하지 못한다는 점이다. [그레이엄 본문] Penn Central은 대형 기업이라도 재무·사업 구조가 약하면 붕괴할 수 있음을 보여준다. Ling-Temco-Vought는 콩글로머리트 확장과 차입 성장의 취약성을 드러낸다. NVF/Sharon Steel 사례는 인수·회계·지배구조가 결합될 때 숫자가 얼마나 왜곡될 수 있는지를 경고한다. [원서 대조 필요] [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 사례 분석 정량 스크린만으로 포착 어려운 질적 리스크 점검 회계, 지배구조, 차입, 과대서사 확인 전 투자자 정성 리스크를 숫자보다 우선 볼 때가 있음 Graham 사례장 NVF/Sharon Steel 적대적 인수·회계 이슈 겉보기 거래구조와 실제 경제가치 분리 공격적 투자자 M&amp;A 회계·희석·지배주주 사익편취 점검 사례/부록 관련 자료 [츠바이크 주석] [츠바이크 주석] 현대판에서는 이 장을 엔론, 월드컴, SPAC, 롤업, 과도한 스토리 주식 같은 현대 사례와 연결해서 읽는 것이 자연스럽다. 겉보기 성장과 자본시장 인기만으로 투자적격성을 판단하면 안 된다는 메시지는 오히려 지금 더 강하다. [추론] [현대적 적용 논점] [현대 적용] 사례장 분석은 오늘날 “숫자+내러티브+거버넌스”의 3요소 점검으로 번역할 수 있다. [현대 적용] 대형주, 유명 경영진, 복잡한 인수 구조는 안전판이 아니라 오히려 경고 표지일 수 있다. [추론] [오해 방지] 사례장은 역사 이야기 모음이 아니다. 투자기준 위반의 비용을 보여주는 장이다. 큰 회사라고 안전하지 않다. 회계상 이익과 주주가치가 항상 일치하지 않는다. [추가 검증 반영] 17장은 적어도 Penn Central, Ling-Temco-Vought, NVF 계열 사례를 통해 외형 성장, 차입 확대, 복잡한 자본거래가 투자 적격성을 보장하지 않는다는 교훈을 준다고 정리한다. 다만 접근 가능한 A·B 자료만으로 네 번째 사례 기업명은 확정하지 못했으므로 [최종 원서 대조 필요] 를 유지한다."},{"i":19,"title":"18. 8쌍의 기업 비교 (A Comparison of Eight Pairs of Companies)","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>[기존 개인 노트 없음]<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 18장은 이름, 업종, 유행이 비슷해 보여도 투자 결과가 크게 갈릴 수 있음을 보여주는 비교 사례장이다. 이번 조사에서는 8쌍 전체 기업명을 원서 본문 기준으로 끝까지 교차확인하지 못해 [원서 대조 필요]로 남긴다. 다만 장의 논리 구조는 분명하다. 같은 시기 시장에서 비슷하게 취급된 기업이라도, 수익의 질, 재무구조, 자본배분, 성장의 대가, 회계 신뢰성에 따라 가치와 위험은 크게 달라진다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>쌍 비교 방법<\/td>\n<td style=\"text-align: right;\">업종/명칭 유사 기업 대조<\/td>\n<td>표면 유사성과 실제 가치 차이 분리<\/td>\n<td>전 투자자<\/td>\n<td>AI, 바이오, 플랫폼 등 테마주 비교에 유효<\/td>\n<td>Graham 비교장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대적으로는 같은 테마 ETF 편입 종목, 같은 “AI 수혜주”, 같은 “고배당주” 안에서도 질 차이가 크다는 식으로 읽을 수 있다. 집단 레이블은 분석을 생략하게 만드는 가장 쉬운 지름길이다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 피어 비교는 유용하지만, 시장이 둘 다 비싸게 만들 수도 있고 둘 다 싸게 만들 수도 있다. 결국 절대가격 판단이 필요하다.<\/li>\n<li>[현대 적용] 스타일 박스나 섹터 분류보다 현금흐름 질과 희석 구조를 깊게 봐야 한다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>“같은 업종 평균보다 싸다”는 말만으로는 부족하다.<\/li>\n<li>비교대상이 잘못되면 가치평가 전체가 왜곡된다.<\/li>\n<li>이번 답변에서 8쌍 전체 기업명은 [원서 대조 필요]이며, 추정으로 채우지 않았다.<\/li>\n<\/ul>\n<h3>[추가 검증 반영]<\/h3>\n<ul>\n<li>18장은 표면상 비슷한 기업이라도 수익의 질, 재무구조, 자본배분에 따라 투자 결과가 크게 달라진다는 비교 사례장으로만 요약하고, 8쌍의 전체 기업명과 개별 교훈은 <code>[최종 원서 대조 필요]<\/code>로 남긴다.<\/li>\n<\/ul>","text":"기존 노트 [기존 개인 노트 없음] [보강 | 그레이엄 본문] [그레이엄 본문] 18장은 이름, 업종, 유행이 비슷해 보여도 투자 결과가 크게 갈릴 수 있음을 보여주는 비교 사례장이다. 이번 조사에서는 8쌍 전체 기업명을 원서 본문 기준으로 끝까지 교차확인하지 못해 [원서 대조 필요]로 남긴다. 다만 장의 논리 구조는 분명하다. 같은 시기 시장에서 비슷하게 취급된 기업이라도, 수익의 질, 재무구조, 자본배분, 성장의 대가, 회계 신뢰성에 따라 가치와 위험은 크게 달라진다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 쌍 비교 방법 업종/명칭 유사 기업 대조 표면 유사성과 실제 가치 차이 분리 전 투자자 AI, 바이오, 플랫폼 등 테마주 비교에 유효 Graham 비교장 [츠바이크 주석] [츠바이크 주석] 현대적으로는 같은 테마 ETF 편입 종목, 같은 “AI 수혜주”, 같은 “고배당주” 안에서도 질 차이가 크다는 식으로 읽을 수 있다. 집단 레이블은 분석을 생략하게 만드는 가장 쉬운 지름길이다. [추론] [현대적 적용 논점] [현대 적용] 피어 비교는 유용하지만, 시장이 둘 다 비싸게 만들 수도 있고 둘 다 싸게 만들 수도 있다. 결국 절대가격 판단이 필요하다. [현대 적용] 스타일 박스나 섹터 분류보다 현금흐름 질과 희석 구조를 깊게 봐야 한다. [추론] [오해 방지] “같은 업종 평균보다 싸다”는 말만으로는 부족하다. 비교대상이 잘못되면 가치평가 전체가 왜곡된다. 이번 답변에서 8쌍 전체 기업명은 [원서 대조 필요]이며, 추정으로 채우지 않았다. [추가 검증 반영] 18장은 표면상 비슷한 기업이라도 수익의 질, 재무구조, 자본배분에 따라 투자 결과가 크게 달라진다는 비교 사례장으로만 요약하고, 8쌍의 전체 기업명과 개별 교훈은 [최종 원서 대조 필요] 로 남긴다."},{"i":20,"title":"19. 주주와 경영진, 배당 정책 (Shareholders and Managements: Dividend Policy) [번역 제목 차이 가능]","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>[기존 개인 노트 없음]<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 이 장에서 그레이엄은 주주가 수동적 구경꾼이 아니라고 본다. 경영 성과가 절대적으로 나쁘거나, 유사 기업 대비 열위이거나, 장기 주가 성과가 실망스럽다면 주주는 경영진에 문제를 제기할 권리가 있다. 이는 오늘날의 행동주의까지 가지 않더라도, 최소한 주주가 경영 판단을 검증해야 한다는 입장이다.<\/p>\n<p>[그레이엄 본문] 배당정책에 대해서는, 이익 유보가 무조건 선이라는 통념을 거부한다. 회사가 유보이익을 실제로 높은 수익률의 성장에 재투자해 주주가치를 늘릴 수 있을 때만 유의미하다. 그렇지 않다면 이익은 원칙적으로 주주 몫이고, 현금배당은 경영진의 자본배분이 검증되지 않았을 때 오히려 더 신뢰할 수 있는 환원수단이 된다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>주주의 문제제기 조건<\/td>\n<td style=\"text-align: right;\">성과 부진, 동종사 대비 열위, 장기 주가 부진<\/td>\n<td>주주의 감시 권한 정당화<\/td>\n<td>전 투자자<\/td>\n<td>단기 주가만으로 경영진 평가 금지<\/td>\n<td>Graham 해설<\/td>\n<\/tr>\n<tr>\n<td>배당 정책<\/td>\n<td style=\"text-align: right;\">유보이익의 생산적 사용 여부<\/td>\n<td>이익유보 정당성 판단 기준<\/td>\n<td>전 투자자<\/td>\n<td>자사주 매입도 총환원 관점에서 함께 봐야 함<\/td>\n<td>Graham 해설<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 현대 해석에서는 배당뿐 아니라 자사주 매입, 스톡옵션 보상, M&amp;A, 레버리지까지 모두 자본배분 문제로 묶는다. 따라서 현대 독자는 “배당성향” 하나만이 아니라 총주주환원과 희석을 함께 봐야 한다. [현대 적용]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 오늘날 성장기업이 무배당이어도 반드시 반주주적인 것은 아니다. 문제는 유보이익의 ROI다.<\/li>\n<li>[현대 적용] 자사주 매입은 주주환원이 될 수도 있고, 고평가 구간에서 EPS 부양용 기계가 될 수도 있다. [추론]<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>그레이엄은 무조건 고배당만을 찬양한 것이 아니다.<\/li>\n<li>배당이 적어도 높은 재투자 수익률을 실제로 입증하면 정당화될 수 있다.<\/li>\n<li>반대로 “성장투자 중”이라는 말만으로 이익 유보가 정당화되지는 않는다.<\/li>\n<\/ul>","text":"기존 노트 [기존 개인 노트 없음] [보강 | 그레이엄 본문] [그레이엄 본문] 이 장에서 그레이엄은 주주가 수동적 구경꾼이 아니라고 본다. 경영 성과가 절대적으로 나쁘거나, 유사 기업 대비 열위이거나, 장기 주가 성과가 실망스럽다면 주주는 경영진에 문제를 제기할 권리가 있다. 이는 오늘날의 행동주의까지 가지 않더라도, 최소한 주주가 경영 판단을 검증해야 한다는 입장이다. [그레이엄 본문] 배당정책에 대해서는, 이익 유보가 무조건 선이라는 통념을 거부한다. 회사가 유보이익을 실제로 높은 수익률의 성장에 재투자해 주주가치를 늘릴 수 있을 때만 유의미하다. 그렇지 않다면 이익은 원칙적으로 주주 몫이고, 현금배당은 경영진의 자본배분이 검증되지 않았을 때 오히려 더 신뢰할 수 있는 환원수단이 된다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 주주의 문제제기 조건 성과 부진, 동종사 대비 열위, 장기 주가 부진 주주의 감시 권한 정당화 전 투자자 단기 주가만으로 경영진 평가 금지 Graham 해설 배당 정책 유보이익의 생산적 사용 여부 이익유보 정당성 판단 기준 전 투자자 자사주 매입도 총환원 관점에서 함께 봐야 함 Graham 해설 [츠바이크 주석] [츠바이크 주석] 현대 해석에서는 배당뿐 아니라 자사주 매입, 스톡옵션 보상, M&amp;A, 레버리지까지 모두 자본배분 문제로 묶는다. 따라서 현대 독자는 “배당성향” 하나만이 아니라 총주주환원과 희석을 함께 봐야 한다. [현대 적용] [현대적 적용 논점] [현대 적용] 오늘날 성장기업이 무배당이어도 반드시 반주주적인 것은 아니다. 문제는 유보이익의 ROI다. [현대 적용] 자사주 매입은 주주환원이 될 수도 있고, 고평가 구간에서 EPS 부양용 기계가 될 수도 있다. [추론] [오해 방지] 그레이엄은 무조건 고배당만을 찬양한 것이 아니다. 배당이 적어도 높은 재투자 수익률을 실제로 입증하면 정당화될 수 있다. 반대로 “성장투자 중”이라는 말만으로 이익 유보가 정당화되지는 않는다."},{"i":21,"title":"20. 안전마진","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>채권의 여분의 가치(쿠션) 추산: 일정 기간의 평균 주가 '기업가치' / '부채'와 '영업이익' / '이자 비용'<\/li>\n<li>성장주는 가격이 높아 안전마진 확보가 어렵고 저평가 종목이나 염가 종목은 안전마진 확보 가능<\/li>\n<li>안전마진을 갖춘 종목의 수가 증가할수록 이익이 날 가능성이 증가<\/li>\n<li>가장 사업처럼 하는 투자가 가장 현명한 투자<\/li>\n<\/ul>\n<h3>[보강 | 그레이엄 본문]<\/h3>\n<p>[그레이엄 본문] 안전마진은 이 책의 중심 개념이다. 핵심은 “정확히 맞히는 능력”이 아니라 “틀려도 견디는 구조”다. 내재가치보다 충분히 낮은 가격에 사면, 미래 추정이 다소 빗나가도 손실 가능성을 줄일 수 있다. 그래서 안전마진은 오차를 제거하는 기법이 아니라 오차를 흡수하는 장치다.<\/p>\n<p>[그레이엄 본문] 그레이엄은 특히 성장주처럼 기대가 높은 종목은 작은 실망에도 가격이 크게 조정될 수 있어 안전마진 확보가 어렵다고 본다. 반대로 염가 종목, NCAV 종목, 보수적 가격의 우량주는 기대가 얇고 가격이 낮아 비교적 큰 완충 장치를 갖기 쉽다. 다만 안전마진은 “싸면 다 된다”가 아니라, 가격과 가치의 차이를 포트폴리오 수준에서 반복적으로 확보하는 개념이다.<\/p>\n<h3>[수치·공식]<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th style=\"text-align: right;\">원문 기준<\/th>\n<th>의미<\/th>\n<th>적용 대상<\/th>\n<th>현대 적용 시 주의점<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>안전마진<\/td>\n<td style=\"text-align: right;\">내재가치 - 시장가격<\/td>\n<td>평가오차·악재를 흡수하는 완충폭<\/td>\n<td>전 투자자<\/td>\n<td>가치추정 자체가 부정확하면 완충폭도 착시일 수 있음<\/td>\n<td>Graham/Dodd<\/td>\n<\/tr>\n<tr>\n<td>이자보상/부채쿠션<\/td>\n<td style=\"text-align: right;\">채권 분석에서 사용<\/td>\n<td>채권의 안전마진은 수익성 대비 부채부담으로 측정<\/td>\n<td>채권/주식 분석<\/td>\n<td>경기급변 업종은 평균 수치 사용 권장<\/td>\n<td>Graham 해설<\/td>\n<\/tr>\n<tr>\n<td>NCAV 할인<\/td>\n<td style=\"text-align: right;\">시가총액 &lt; NCAV<\/td>\n<td>가장 보수적 안전마진 형태 중 하나<\/td>\n<td>공격적 투자자<\/td>\n<td>실행제약 큼<\/td>\n<td>NCAV 연구<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>[츠바이크 주석]<\/h3>\n<p>[츠바이크 주석] 츠바이크는 안전마진을 현대적으로 “투자자가 통제할 수 있는 거의 유일한 방어선”으로 해석한다. 미래 금리, 경기, 군중심리는 통제할 수 없지만, 지불 가격과 비용 구조, 포지션 크기는 통제할 수 있다. [추론]<\/p>\n<h3>[현대적 적용 논점]<\/h3>\n<ul>\n<li>[현대 적용] 안전마진은 개별 종목 할인율만이 아니라, 낮은 비용, 낮은 레버리지, 세금 효율, 분산, 리밸런싱 규율을 포함하는 포트폴리오 개념으로 확장해 읽는 것이 실무적이다. [후대 해석]<\/li>\n<li>[후대 연구] 버핏의 「The Superinvestors of Graham-and-Doddsville」는 안전마진 원리가 단순 우연이 아니라 반복 가능한 투자철학일 수 있음을 방어하는 텍스트다. 그는 시장 효율성 가설에 맞서, 서로 독립적인 여러 가치투자자가 장기간 시장을 상회한 사례를 제시했다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>안전마진은 특정 할인율 숫자 하나가 아니다.<\/li>\n<li>가치추정이 부실하면 싼 가격처럼 보여도 실제 안전마진이 없을 수 있다.<\/li>\n<li>“좋은 회사니까 안전마진이 필요 없다”는 해석은 그레이엄과 정반대다.<\/li>\n<\/ul>\n<hr />","text":"기존 노트 채권의 여분의 가치(쿠션) 추산: 일정 기간의 평균 주가 '기업가치' / '부채'와 '영업이익' / '이자 비용' 성장주는 가격이 높아 안전마진 확보가 어렵고 저평가 종목이나 염가 종목은 안전마진 확보 가능 안전마진을 갖춘 종목의 수가 증가할수록 이익이 날 가능성이 증가 가장 사업처럼 하는 투자가 가장 현명한 투자 [보강 | 그레이엄 본문] [그레이엄 본문] 안전마진은 이 책의 중심 개념이다. 핵심은 “정확히 맞히는 능력”이 아니라 “틀려도 견디는 구조”다. 내재가치보다 충분히 낮은 가격에 사면, 미래 추정이 다소 빗나가도 손실 가능성을 줄일 수 있다. 그래서 안전마진은 오차를 제거하는 기법이 아니라 오차를 흡수하는 장치다. [그레이엄 본문] 그레이엄은 특히 성장주처럼 기대가 높은 종목은 작은 실망에도 가격이 크게 조정될 수 있어 안전마진 확보가 어렵다고 본다. 반대로 염가 종목, NCAV 종목, 보수적 가격의 우량주는 기대가 얇고 가격이 낮아 비교적 큰 완충 장치를 갖기 쉽다. 다만 안전마진은 “싸면 다 된다”가 아니라, 가격과 가치의 차이를 포트폴리오 수준에서 반복적으로 확보하는 개념이다. [수치·공식] 항목 원문 기준 의미 적용 대상 현대 적용 시 주의점 출처 안전마진 내재가치 - 시장가격 평가오차·악재를 흡수하는 완충폭 전 투자자 가치추정 자체가 부정확하면 완충폭도 착시일 수 있음 Graham/Dodd 이자보상/부채쿠션 채권 분석에서 사용 채권의 안전마진은 수익성 대비 부채부담으로 측정 채권/주식 분석 경기급변 업종은 평균 수치 사용 권장 Graham 해설 NCAV 할인 시가총액 &lt; NCAV 가장 보수적 안전마진 형태 중 하나 공격적 투자자 실행제약 큼 NCAV 연구 [츠바이크 주석] [츠바이크 주석] 츠바이크는 안전마진을 현대적으로 “투자자가 통제할 수 있는 거의 유일한 방어선”으로 해석한다. 미래 금리, 경기, 군중심리는 통제할 수 없지만, 지불 가격과 비용 구조, 포지션 크기는 통제할 수 있다. [추론] [현대적 적용 논점] [현대 적용] 안전마진은 개별 종목 할인율만이 아니라, 낮은 비용, 낮은 레버리지, 세금 효율, 분산, 리밸런싱 규율을 포함하는 포트폴리오 개념으로 확장해 읽는 것이 실무적이다. [후대 해석] [후대 연구] 버핏의 「The Superinvestors of Graham-and-Doddsville」는 안전마진 원리가 단순 우연이 아니라 반복 가능한 투자철학일 수 있음을 방어하는 텍스트다. 그는 시장 효율성 가설에 맞서, 서로 독립적인 여러 가치투자자가 장기간 시장을 상회한 사례를 제시했다. [오해 방지] 안전마진은 특정 할인율 숫자 하나가 아니다. 가치추정이 부실하면 싼 가격처럼 보여도 실제 안전마진이 없을 수 있다. “좋은 회사니까 안전마진이 필요 없다”는 해석은 그레이엄과 정반대다."},{"i":22,"title":"관련 노트","html":"<ul>\n<li>[[독서_현명한_투자자 (AI)|현명한 투자자 (AI 요약)]]<\/li>\n<\/ul>","text":"[[독서_현명한_투자자 (AI)|현명한 투자자 (AI 요약)]]"},{"i":23,"title":"핵심 기준 종합표","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>방어적 투자자<\/th>\n<th>공격적 투자자<\/th>\n<th>관련 장<\/th>\n<th>핵심 수치<\/th>\n<th>현대 적용 시 조정 논점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>기본 자산배분<\/td>\n<td>우량채권+우량주, 균형 유지<\/td>\n<td>더 넓은 기회 탐색 가능<\/td>\n<td>4, 7<\/td>\n<td>50:50 기준점, 25~75 범위 해석<\/td>\n<td>ETF·채권 듀레이션·세금 반영<\/td>\n<\/tr>\n<tr>\n<td>주식 선택<\/td>\n<td>대형, 건전, 장기 배당, 낮은 가격<\/td>\n<td>염가주, 특수상황, 저평가 대형주<\/td>\n<td>5, 14, 15<\/td>\n<td>10년 무적자, 20년 배당, PER 15, PBR 1.5, 22.5<\/td>\n<td>무형자산·자사주매입·회계 차이 보정<\/td>\n<\/tr>\n<tr>\n<td>분산<\/td>\n<td>충분하되 과도하지 않게<\/td>\n<td>기회 집중 가능하나 역량 필요<\/td>\n<td>5, 15<\/td>\n<td>10~30개 [후대 해석]<\/td>\n<td>ETF·팩터·사이즈 제약 고려<\/td>\n<\/tr>\n<tr>\n<td>가치평가<\/td>\n<td>평균이익·재무건전성 중시<\/td>\n<td>NCAV·특수상황·할인율 중시<\/td>\n<td>11, 12, 15, 20<\/td>\n<td>평균 EPS, NCAV<\/td>\n<td>희석·SBC·조정 EBITDA 점검<\/td>\n<\/tr>\n<tr>\n<td>시장 태도<\/td>\n<td>예측보다 리밸런싱·가격 규율<\/td>\n<td>가격 괴리 활용<\/td>\n<td>8, 20<\/td>\n<td>timing보다 pricing<\/td>\n<td>실시간 시세·과잉행동 통제 필요<\/td>\n<\/tr>\n<tr>\n<td>펀드 활용<\/td>\n<td>저비용 분산형 펀드에 적합<\/td>\n<td>구조 이해 시 폐쇄형 할인 등도 활용 가능<\/td>\n<td>9<\/td>\n<td>수수료·할인/할증<\/td>\n<td>비용, 추적오차, 유동성 점검<\/td>\n<\/tr>\n<tr>\n<td>지배구조/배당<\/td>\n<td>배당과 자본배분 점검<\/td>\n<td>특수상황에서 더 중요<\/td>\n<td>19<\/td>\n<td>유보이익 정당성<\/td>\n<td>자사주·희석·M&amp;A까지 확장 검토<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>이 종합표는 그레이엄의 방어적/공격적 투자자 구분, 14장의 7대 방어 기준, 20장의 안전마진, 그리고 후대 해석을 합쳐 재구성한 것이다.<\/p>","text":"구분 방어적 투자자 공격적 투자자 관련 장 핵심 수치 현대 적용 시 조정 논점 기본 자산배분 우량채권+우량주, 균형 유지 더 넓은 기회 탐색 가능 4, 7 50:50 기준점, 25~75 범위 해석 ETF·채권 듀레이션·세금 반영 주식 선택 대형, 건전, 장기 배당, 낮은 가격 염가주, 특수상황, 저평가 대형주 5, 14, 15 10년 무적자, 20년 배당, PER 15, PBR 1.5, 22.5 무형자산·자사주매입·회계 차이 보정 분산 충분하되 과도하지 않게 기회 집중 가능하나 역량 필요 5, 15 10~30개 [후대 해석] ETF·팩터·사이즈 제약 고려 가치평가 평균이익·재무건전성 중시 NCAV·특수상황·할인율 중시 11, 12, 15, 20 평균 EPS, NCAV 희석·SBC·조정 EBITDA 점검 시장 태도 예측보다 리밸런싱·가격 규율 가격 괴리 활용 8, 20 timing보다 pricing 실시간 시세·과잉행동 통제 필요 펀드 활용 저비용 분산형 펀드에 적합 구조 이해 시 폐쇄형 할인 등도 활용 가능 9 수수료·할인/할증 비용, 추적오차, 유동성 점검 지배구조/배당 배당과 자본배분 점검 특수상황에서 더 중요 19 유보이익 정당성 자사주·희석·M&amp;A까지 확장 검토 이 종합표는 그레이엄의 방어적/공격적 투자자 구분, 14장의 7대 방어 기준, 20장의 안전마진, 그리고 후대 해석을 합쳐 재구성한 것이다."},{"i":24,"title":"그레이엄 핵심 개념 사전","html":"<h3>투자와 투기<\/h3>\n<p>투자는 철저한 분석, 원금 안전, 만족스러운 수익이라는 세 요건을 충족하는 행위다. 이 셋 중 하나라도 빠지면 그레이엄은 투기라고 본다. 따라서 “상승 가능성이 커 보인다”는 판단만으로는 투자라고 부를 수 없다. 이 정의는 오늘날에도 유효하다. 장기보유, 유명종목, ETF라는 외형보다, 판단 기준과 가격 규율이 핵심이기 때문이다.<\/p>\n<h3>방어적 투자자<\/h3>\n<p>방어적 투자자는 귀찮음과 불안, 큰 실수를 최소화하려는 사람이다. 높은 수익을 포기하는 대신 예측과 감정의 개입을 줄인다. 우량채권과 우량주, 분산, 낮은 비용, 정기 리밸런싱이 이 유형에 어울린다. 현대에는 광범위한 저비용 인덱스 펀드가 그레이엄 정신과 잘 맞는 도구로 자주 해석된다.<\/p>\n<h3>공격적 투자자<\/h3>\n<p>공격적 투자자는 더 높은 위험을 좋아하는 사람이 아니라, 더 많은 시간과 분석노력을 기꺼이 투입하는 사람이다. 특수상황, 염가 종목, 저평가 대형주처럼 가격 왜곡을 포착해 초과수익을 노린다. 그러나 이 유형은 더 자주 거래하는 사람과 다르다. 오히려 더 적게 움직이되, 움직일 때는 더 깊게 분석해야 한다.<\/p>\n<h3>안전마진<\/h3>\n<p>안전마진은 내재가치와 지불가격 사이의 완충폭이다. 그레이엄은 미래를 정확히 맞히는 능력보다, 틀렸을 때도 감당 가능한 가격을 더 중요하게 본다. 그래서 안전마진은 가치평가 정확도의 대체재가 아니라 보완재다. NCAV, 낮은 PER/PBR, 재무건전성, 포트폴리오 분산은 모두 이 개념의 실무 구현이다.<\/p>\n<h3>Mr. Market<\/h3>\n<p>Mr. Market은 매일 가격을 제안하는 감정적 동업자다. 그는 기분에 따라 지나치게 낙관적이거나 비관적일 수 있다. 핵심은 그가 늘 말을 걸어와도, 당신은 응답할 의무가 없다는 점이다. 이 비유는 시장가격을 가치의 지시자라고 보지 말고, 필요할 때 이용하는 도구로 보라는 뜻이다.<\/p>\n<h3>NCAV<\/h3>\n<p>NCAV는 유동자산에서 총부채를 뺀 값으로, 매우 보수적인 자산가치 하한선이다. 시가총액이 NCAV보다 낮다면, 그 회사는 청산가치에 가까운 수준보다 더 싸게 거래된다는 신호가 될 수 있다. 다만 이런 종목은 대개 소형주, 유동성 부족, 구조적 부실기업이 많아 실행 난도가 높다. 연구상 초과성과가 보고되지만, 거래비용과 상장폐지 반영 여부를 반드시 확인해야 한다.<\/p>\n<h3>염가 종목<\/h3>\n<p>염가 종목은 단순히 많이 떨어진 종목이 아니라, 사업가치·자산가치에 비해 가격이 지나치게 낮은 종목이다. 그레이엄은 이런 종목이 대중에게 인기가 없기 때문에 오히려 기회가 생긴다고 봤다. 그러나 “염가”와 “불량”은 자주 같이 다니므로, 재무·거버넌스·청산가능성을 따로 점검해야 한다.<\/p>\n<h3>성장주에 대한 그레이엄의 경계<\/h3>\n<p>그레이엄은 성장 자체를 싫어한 것이 아니라, 성장 기대가 이미 가격에 과도하게 반영된 상태를 경계했다. 성장주는 계산상 작은 실망에도 밸류에이션이 크게 훼손될 수 있어 안전마진 확보가 어렵다. 이후 후대 투자자들은 질 좋은 성장주에 더 열린 태도를 보였지만, 가격 규율을 버리면 그것은 더 이상 그레이엄식 접근이 아니다.<\/p>\n<h3>채권과 주식의 기본 배분<\/h3>\n<p>그레이엄의 기본 배분 논리는 예측보다 규율이다. 어느 자산이 더 좋을지 확신하지 못하므로, 주식과 채권을 함께 보유하고 과열·침체에 따라 제한된 범위에서 조정한다. 후대 해설에서는 50:50 기준점과 25~75 범위가 널리 알려져 있다. 이는 최적화 공식이 아니라 감정 폭주를 막는 구조다.<\/p>\n<h3>주주와 경영진<\/h3>\n<p>그레이엄은 주주를 소극적 소비자가 아니라 기업의 실제 소유자로 본다. 성과가 부진하고 자본배분이 나쁘다면, 주주는 경영진에게 책임을 물을 권리가 있다. 이는 훗날 행동주의와도 연결되지만, 그레이엄의 핵심은 선동이 아니라 검증이다. 결과, 비교, 장기 주가, 배당정책을 함께 보아야 한다.<\/p>\n<h3>배당 정책<\/h3>\n<p>배당은 단순한 현금 유출이 아니라 경영진의 자본배분 실적표다. 이익을 유보하는 것이 정당하려면, 그 돈이 주주에게 더 높은 가치로 돌아와야 한다. 그렇지 않다면 배당이 더 합리적일 수 있다. 현대에는 자사주 매입도 함께 봐야 하지만, 희석과 고평가 매입이 섞이면 주주가치 이전이 될 수 있다.<\/p>\n<h3>전환증권과 신주인수권<\/h3>\n<p>전환증권과 워런트는 겉보기에 매력적이다. 하방은 제한되고 상방은 열려 있는 것처럼 보이기 때문이다. 그러나 실제론 발행사의 신용, 전환가, 희석효과, 콜조항, 만기 구조가 수익과 위험을 좌우한다. 그레이엄의 경고를 현대적으로 번역하면, 이해하기 어려운 구조일수록 안전하다고 믿지 말라는 뜻이다. [원서 대조 필요]<\/p>","text":"투자와 투기 투자는 철저한 분석, 원금 안전, 만족스러운 수익이라는 세 요건을 충족하는 행위다. 이 셋 중 하나라도 빠지면 그레이엄은 투기라고 본다. 따라서 “상승 가능성이 커 보인다”는 판단만으로는 투자라고 부를 수 없다. 이 정의는 오늘날에도 유효하다. 장기보유, 유명종목, ETF라는 외형보다, 판단 기준과 가격 규율이 핵심이기 때문이다. 방어적 투자자 방어적 투자자는 귀찮음과 불안, 큰 실수를 최소화하려는 사람이다. 높은 수익을 포기하는 대신 예측과 감정의 개입을 줄인다. 우량채권과 우량주, 분산, 낮은 비용, 정기 리밸런싱이 이 유형에 어울린다. 현대에는 광범위한 저비용 인덱스 펀드가 그레이엄 정신과 잘 맞는 도구로 자주 해석된다. 공격적 투자자 공격적 투자자는 더 높은 위험을 좋아하는 사람이 아니라, 더 많은 시간과 분석노력을 기꺼이 투입하는 사람이다. 특수상황, 염가 종목, 저평가 대형주처럼 가격 왜곡을 포착해 초과수익을 노린다. 그러나 이 유형은 더 자주 거래하는 사람과 다르다. 오히려 더 적게 움직이되, 움직일 때는 더 깊게 분석해야 한다. 안전마진 안전마진은 내재가치와 지불가격 사이의 완충폭이다. 그레이엄은 미래를 정확히 맞히는 능력보다, 틀렸을 때도 감당 가능한 가격을 더 중요하게 본다. 그래서 안전마진은 가치평가 정확도의 대체재가 아니라 보완재다. NCAV, 낮은 PER/PBR, 재무건전성, 포트폴리오 분산은 모두 이 개념의 실무 구현이다. Mr. Market Mr. Market은 매일 가격을 제안하는 감정적 동업자다. 그는 기분에 따라 지나치게 낙관적이거나 비관적일 수 있다. 핵심은 그가 늘 말을 걸어와도, 당신은 응답할 의무가 없다는 점이다. 이 비유는 시장가격을 가치의 지시자라고 보지 말고, 필요할 때 이용하는 도구로 보라는 뜻이다. NCAV NCAV는 유동자산에서 총부채를 뺀 값으로, 매우 보수적인 자산가치 하한선이다. 시가총액이 NCAV보다 낮다면, 그 회사는 청산가치에 가까운 수준보다 더 싸게 거래된다는 신호가 될 수 있다. 다만 이런 종목은 대개 소형주, 유동성 부족, 구조적 부실기업이 많아 실행 난도가 높다. 연구상 초과성과가 보고되지만, 거래비용과 상장폐지 반영 여부를 반드시 확인해야 한다. 염가 종목 염가 종목은 단순히 많이 떨어진 종목이 아니라, 사업가치·자산가치에 비해 가격이 지나치게 낮은 종목이다. 그레이엄은 이런 종목이 대중에게 인기가 없기 때문에 오히려 기회가 생긴다고 봤다. 그러나 “염가”와 “불량”은 자주 같이 다니므로, 재무·거버넌스·청산가능성을 따로 점검해야 한다. 성장주에 대한 그레이엄의 경계 그레이엄은 성장 자체를 싫어한 것이 아니라, 성장 기대가 이미 가격에 과도하게 반영된 상태를 경계했다. 성장주는 계산상 작은 실망에도 밸류에이션이 크게 훼손될 수 있어 안전마진 확보가 어렵다. 이후 후대 투자자들은 질 좋은 성장주에 더 열린 태도를 보였지만, 가격 규율을 버리면 그것은 더 이상 그레이엄식 접근이 아니다. 채권과 주식의 기본 배분 그레이엄의 기본 배분 논리는 예측보다 규율이다. 어느 자산이 더 좋을지 확신하지 못하므로, 주식과 채권을 함께 보유하고 과열·침체에 따라 제한된 범위에서 조정한다. 후대 해설에서는 50:50 기준점과 25~75 범위가 널리 알려져 있다. 이는 최적화 공식이 아니라 감정 폭주를 막는 구조다. 주주와 경영진 그레이엄은 주주를 소극적 소비자가 아니라 기업의 실제 소유자로 본다. 성과가 부진하고 자본배분이 나쁘다면, 주주는 경영진에게 책임을 물을 권리가 있다. 이는 훗날 행동주의와도 연결되지만, 그레이엄의 핵심은 선동이 아니라 검증이다. 결과, 비교, 장기 주가, 배당정책을 함께 보아야 한다. 배당 정책 배당은 단순한 현금 유출이 아니라 경영진의 자본배분 실적표다. 이익을 유보하는 것이 정당하려면, 그 돈이 주주에게 더 높은 가치로 돌아와야 한다. 그렇지 않다면 배당이 더 합리적일 수 있다. 현대에는 자사주 매입도 함께 봐야 하지만, 희석과 고평가 매입이 섞이면 주주가치 이전이 될 수 있다. 전환증권과 신주인수권 전환증권과 워런트는 겉보기에 매력적이다. 하방은 제한되고 상방은 열려 있는 것처럼 보이기 때문이다. 그러나 실제론 발행사의 신용, 전환가, 희석효과, 콜조항, 만기 구조가 수익과 위험을 좌우한다. 그레이엄의 경고를 현대적으로 번역하면, 이해하기 어려운 구조일수록 안전하다고 믿지 말라는 뜻이다. [원서 대조 필요]"},{"i":25,"title":"한 페이지 요약","html":"<h3>이 책의 한 문장 핵심<\/h3>\n<p>시장가격을 예언하려 하지 말고, 분석 가능한 가치보다 충분히 싸게 사서, 감정과 과신으로부터 자기 자신을 방어하라.<\/p>\n<h3>개인투자자가 반드시 기억해야 할 10문장<\/h3>\n<ul>\n<li>투자는 종목명이 아니라 행위 기준으로 정의된다.<\/li>\n<li>평균 수익을 안정적으로 얻는 것은 생각보다 매우 어렵고, 그래서 가치가 높다.<\/li>\n<li>시장은 늘 말을 걸지만, 매번 응답할 필요는 없다.<\/li>\n<li>가격이 가치보다 중요해지는 순간, 투기가 시작된다.<\/li>\n<li>성장 전망이 밝아도 투자 수익률은 낮을 수 있다.<\/li>\n<li>좋은 기업도 너무 비싸면 나쁜 투자다.<\/li>\n<li>안전마진은 미래를 맞히는 기술이 아니라 틀렸을 때 버티는 장치다.<\/li>\n<li>장기 배당과 이익안정성은 주주에게 실질적인 검증 기록이다.<\/li>\n<li>비용은 확정 손실이고, 초과성과는 불확실하다.<\/li>\n<li>가장 사업처럼 하는 투자가 가장 현명한 투자다.<\/li>\n<\/ul>\n<h3>실제 투자 체크리스트 10개<\/h3>\n<ul>\n<li>지금 이 매수 판단의 근거가 가치인가, 가격상승 기대인가.<\/li>\n<li>이 종목의 최근 10년 적자 여부와 현금흐름 질은 어떤가.<\/li>\n<li>최근 20년 배당 또는 이에 준하는 주주환원 기록이 있는가.<\/li>\n<li>희석주식수와 스톡옵션 보상을 확인했는가.<\/li>\n<li>현재 PER, PBR, EV/FCF가 역사적 범위에서 어느 수준인가. [후대 적용]<\/li>\n<li>이 회사의 부채 구조와 이자보상 여력은 충분한가.<\/li>\n<li>내가 계산한 가치보다 가격이 얼마나 낮은가.<\/li>\n<li>이 아이디어를 남이 사서가 아니라 내 분석으로 설명할 수 있는가.<\/li>\n<li>매수 후에도 3년, 5년, 10년 보유 논리가 유지되는가.<\/li>\n<li>이 거래에 들어가는 비용·세금·슬리피지를 반영했는가.<\/li>\n<\/ul>\n<h3>절대 하지 말아야 할 행동 10개<\/h3>\n<ul>\n<li>주가가 많이 올랐다는 이유만으로 매수하지 말 것.<\/li>\n<li>주가가 많이 내렸다는 이유만으로 자동 매도하지 말 것.<\/li>\n<li>평균 회귀를 타이밍 공식처럼 취급하지 말 것.<\/li>\n<li>EPS 1년치만 보고 기업가치를 단정하지 말 것.<\/li>\n<li>“좋은 회사니까 비싸도 괜찮다”는 말을 믿지 말 것.<\/li>\n<li>높은 배당률, 높은 쿠폰, 높은 분배율만 보고 안전하다고 착각하지 말 것.<\/li>\n<li>구조가 복잡한 상품을 이해 없이 사지 말 것.<\/li>\n<li>무료 커뮤니티의 확신을 자기 분석으로 착각하지 말 것. [추론]<\/li>\n<li>비용과 세금을 무시한 백테스트를 실전 성과로 오해하지 말 것.<\/li>\n<li>투자와 투기 자금을 섞지 말 것.<\/li>\n<\/ul>","text":"이 책의 한 문장 핵심 시장가격을 예언하려 하지 말고, 분석 가능한 가치보다 충분히 싸게 사서, 감정과 과신으로부터 자기 자신을 방어하라. 개인투자자가 반드시 기억해야 할 10문장 투자는 종목명이 아니라 행위 기준으로 정의된다. 평균 수익을 안정적으로 얻는 것은 생각보다 매우 어렵고, 그래서 가치가 높다. 시장은 늘 말을 걸지만, 매번 응답할 필요는 없다. 가격이 가치보다 중요해지는 순간, 투기가 시작된다. 성장 전망이 밝아도 투자 수익률은 낮을 수 있다. 좋은 기업도 너무 비싸면 나쁜 투자다. 안전마진은 미래를 맞히는 기술이 아니라 틀렸을 때 버티는 장치다. 장기 배당과 이익안정성은 주주에게 실질적인 검증 기록이다. 비용은 확정 손실이고, 초과성과는 불확실하다. 가장 사업처럼 하는 투자가 가장 현명한 투자다. 실제 투자 체크리스트 10개 지금 이 매수 판단의 근거가 가치인가, 가격상승 기대인가. 이 종목의 최근 10년 적자 여부와 현금흐름 질은 어떤가. 최근 20년 배당 또는 이에 준하는 주주환원 기록이 있는가. 희석주식수와 스톡옵션 보상을 확인했는가. 현재 PER, PBR, EV/FCF가 역사적 범위에서 어느 수준인가. [후대 적용] 이 회사의 부채 구조와 이자보상 여력은 충분한가. 내가 계산한 가치보다 가격이 얼마나 낮은가. 이 아이디어를 남이 사서가 아니라 내 분석으로 설명할 수 있는가. 매수 후에도 3년, 5년, 10년 보유 논리가 유지되는가. 이 거래에 들어가는 비용·세금·슬리피지를 반영했는가. 절대 하지 말아야 할 행동 10개 주가가 많이 올랐다는 이유만으로 매수하지 말 것. 주가가 많이 내렸다는 이유만으로 자동 매도하지 말 것. 평균 회귀를 타이밍 공식처럼 취급하지 말 것. EPS 1년치만 보고 기업가치를 단정하지 말 것. “좋은 회사니까 비싸도 괜찮다”는 말을 믿지 말 것. 높은 배당률, 높은 쿠폰, 높은 분배율만 보고 안전하다고 착각하지 말 것. 구조가 복잡한 상품을 이해 없이 사지 말 것. 무료 커뮤니티의 확신을 자기 분석으로 착각하지 말 것. [추론] 비용과 세금을 무시한 백테스트를 실전 성과로 오해하지 말 것. 투자와 투기 자금을 섞지 말 것."},{"i":26,"title":"출처 목록","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>출처명<\/th>\n<th>저자/기관<\/th>\n<th style=\"text-align: right;\">연도<\/th>\n<th>사용한 내용<\/th>\n<th>신뢰도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>원서/개정판<\/td>\n<td>The Intelligent Investor Revised Edition<\/td>\n<td>Benjamin Graham, Jason Zweig, Warren Buffett, HarperCollins<\/td>\n<td style=\"text-align: right;\">2003<\/td>\n<td>장 구성, 핵심 논지, 버핏 서문 관련 2차 확인<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>학술/기관<\/td>\n<td>Security Analysis<\/td>\n<td>Benjamin Graham, David Dodd, McGraw-Hill<\/td>\n<td style=\"text-align: right;\">1934/후속판<\/td>\n<td>투자 정의, 안전마진, NCAV의 사상적 원형<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>기관/전문가<\/td>\n<td>Ben Graham Was a Quant<\/td>\n<td>CFA Institute / Ronald Moy<\/td>\n<td style=\"text-align: right;\">2011<\/td>\n<td>그레이엄 방법론의 구조와 영향<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>학술 요약<\/td>\n<td>Review of The Intelligent Investor<\/td>\n<td>Kenneth D. Roose, The Journal of Finance<\/td>\n<td style=\"text-align: right;\">1955<\/td>\n<td>책의 성격과 당시 평가<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>강연/에세이<\/td>\n<td>The Superinvestors of Graham-and-Doddsville<\/td>\n<td>Warren Buffett / Columbia Business School Hermes<\/td>\n<td style=\"text-align: right;\">1984<\/td>\n<td>가치투자 옹호 논지, 제시된 슈퍼투자자 사례<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>연구 요약<\/td>\n<td>Net Current Asset Value<\/td>\n<td>관련 학술논문 종합 인용<\/td>\n<td style=\"text-align: right;\">최근 갱신본<\/td>\n<td>NCAV
