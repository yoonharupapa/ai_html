 설명 가능 단순 추격인지 점검 서문, 6장 좋은 회사와 좋은 주식을 구분했는가? 품질과 가격을 분리 평가 가격 재검토 10장 시장 전망이 아니라 기업 전망으로 사고 있는가? 거시 예측 의존 낮음 거시 의존 논리 삭제 5장 12개월 안에 쓸 돈이 아닌가? 장기 자금임이 확인됨 자금 분리 4장 내 성향상 이 변동성을 견딜 수 있는가? 최대 손실 가정 견딜 수 있음 비중 축소 또는 제외 4장, 16장 이 회사의 경쟁우위는 단순한 인기와 다른가? 틈새·브랜드·원가·반복구매 근거 존재 경쟁우위 재검토 8장 이익 증가는 어떤 방식으로 가능한가? 비용절감/가격인상/확장 등 성장 동인이 명확 실행 가능성 재검토 10장 소문이 아니라 확인 가능한 사실을 갖고 있는가? 공시·현장·숫자 근거 보유 사실 확인 루틴 재수행 12장 회사가 확장 공식을 복제할 수 있는가? 고성장주라면 복제 증거 존재 성장주 논리 수정 15장 이 회사는 인기 업종의 인기 종목이 아닌가? 과열 대중성 낮음 기대수익률 보수화 또는 제외 9장 제2의 아무개 논리로 사고 있지 않은가? 독자적 경쟁력 확인 비교 논리 폐기 9장 사업다각화가 아니라 사업다악화는 아닌가? 인수·신사업의 경제성 확인 경영진 자본배분 재평가 9장, 17장 단일 고객 의존이 과도하지 않은가? 고객 집중도 허용 가능 안정성 할인 적용 9장, 17장 현금 보유와 순현금 상태는 어떤가? 현금 완충력 파악 생존성 재평가 12장, 13장 배당이 핵심 논리라면 배당성향과 연속배당 기록을 확인했는가? 저성장주 기준 충족 배당 논리 폐기 11장, 15장 장부가치가 아니라 실제 자산가치를 보고 있는가? 자산의 실질가치 추정 자산주 판단 보류 13장, 15장 잉여현금흐름을 대략이라도 확인했는가? 자본적지출 후 현금창출력 파악 현금흐름 검토 13장 세전이익률은 같은 업종 내에서 어떤 위치인가? 동종 비교 완료 업종 비교 후 재판단 13장 회생주라면 채권자보다 주주 몫이 남을 가능성이 있는가? 생존가설 설명 가능 회생주 제외 15장, 17장 자산주라면 가치 실현 촉매가 있는가? 촉매 존재 또는 경영진 의지 확인 가치 함정 경계 15장, 17장 2분 독백을 막힘없이 할 수 있는가? 이유·조건·위험·매도 기준 설명 가능 독백 다시 작성 11장 내가 모르는 핵심 질문이 남아 있는가? 치명적 공백 없음 의심스러우면 연기 12장, 2부 요약 첫 번째 상승 국면을 놓쳐도 괜찮은가? 조급함 없이 기다릴 수 있음 FOMO 제거 2부 요약 매수 후 점검 주기를 정했는가? 월간·분기·연간 루틴 설정 루틴 작성 후 매수 14장, 16장 이 아이디어가 다른 곳에서도 통할까를 검토했는가? 사업 모델 확장성 확인 스토리 보수화 11장 비슷한 다른 후보보다 이것이 나은 이유가 있는가? 상대 비교 우위 설명 가능 후보군 비교 15장, 16장"},{"i":34,"title":"린치식 보유 중 점검 루틴","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>점검 주기<\/th>\n<th>점검 항목<\/th>\n<th>관련 장<\/th>\n<th>조치<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>월간<\/td>\n<td>원래 산 이유가 유지되는가, 큰 뉴스가 숫자에 어떤 의미를 갖는가<\/td>\n<td>14장, 18장<\/td>\n<td>스토리 변화가 없으면 관망<\/td>\n<\/tr>\n<tr>\n<td>월간<\/td>\n<td>주가가 아니라 사업 관련 체크포인트만 기록했는가<\/td>\n<td>5장, 14장<\/td>\n<td>가격 집착 시 기록 방식 수정<\/td>\n<\/tr>\n<tr>\n<td>분기<\/td>\n<td>실적, EPS, 매출, 재고, 부채, 현금, 핵심 제품 비중 변화 확인<\/td>\n<td>10장, 13장, 14장<\/td>\n<td>가설이 강화/약화되는지 판정<\/td>\n<\/tr>\n<tr>\n<td>분기<\/td>\n<td>고성장주의 동일점포 매출, 신규 확장 성과, 인력 이탈 확인<\/td>\n<td>11장, 15장, 17장<\/td>\n<td>성장 둔화 신호면 비중 재평가<\/td>\n<\/tr>\n<tr>\n<td>반기<\/td>\n<td>경쟁 환경, 신규 진입, 가격 경쟁, 제품 선호도 변화 확인<\/td>\n<td>8장, 14장, 17장<\/td>\n<td>경쟁우위 약화 시 경계<\/td>\n<\/tr>\n<tr>\n<td>반기<\/td>\n<td>자본배분 점검: 자사주 매입, 배당, 인수, 차입 변화<\/td>\n<td>8장, 9장, 16장<\/td>\n<td>사업다악화 조짐이면 경고<\/td>\n<\/tr>\n<tr>\n<td>연간<\/td>\n<td>유형 재분류가 필요한가 확인<\/td>\n<td>7장, 14장<\/td>\n<td>유형 변경 시 체크리스트 재작성<\/td>\n<\/tr>\n<tr>\n<td>연간<\/td>\n<td>포트폴리오 비중과 유형 분산이 아직 적절한가<\/td>\n<td>16장<\/td>\n<td>비중 조정 또는 교체<\/td>\n<\/tr>\n<tr>\n<td>폭락장<\/td>\n<td>스토리 손상인가, 단순 가격 하락인가 구분<\/td>\n<td>5장, 17장, 20장<\/td>\n<td>스토리 유지 시 재매수 검토<\/td>\n<\/tr>\n<tr>\n<td>폭락장<\/td>\n<td>12개월 내 현금 필요 여부가 바뀌었는가<\/td>\n<td>4장<\/td>\n<td>필요 자금이면 위험 축소<\/td>\n<\/tr>\n<tr>\n<td>급등 후<\/td>\n<td>주가가 이익선과 PER 범위를 과도하게 앞질렀는가<\/td>\n<td>10장, 17장<\/td>\n<td>부분 매도 또는 관찰 강화<\/td>\n<\/tr>\n<tr>\n<td>급등 후<\/td>\n<td>언론·기관 과밀·과도한 찬사가 생겼는가<\/td>\n<td>8장, 17장<\/td>\n<td>고성장주라면 과열 점검<\/td>\n<\/tr>\n<tr>\n<td>스토리 변화 시<\/td>\n<td><code>지금도 새로 살 것인가<\/code>에 답해 본다<\/td>\n<td>18장<\/td>\n<td>아니면 매도 검토<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"점검 주기 점검 항목 관련 장 조치 월간 원래 산 이유가 유지되는가, 큰 뉴스가 숫자에 어떤 의미를 갖는가 14장, 18장 스토리 변화가 없으면 관망 월간 주가가 아니라 사업 관련 체크포인트만 기록했는가 5장, 14장 가격 집착 시 기록 방식 수정 분기 실적, EPS, 매출, 재고, 부채, 현금, 핵심 제품 비중 변화 확인 10장, 13장, 14장 가설이 강화/약화되는지 판정 분기 고성장주의 동일점포 매출, 신규 확장 성과, 인력 이탈 확인 11장, 15장, 17장 성장 둔화 신호면 비중 재평가 반기 경쟁 환경, 신규 진입, 가격 경쟁, 제품 선호도 변화 확인 8장, 14장, 17장 경쟁우위 약화 시 경계 반기 자본배분 점검: 자사주 매입, 배당, 인수, 차입 변화 8장, 9장, 16장 사업다악화 조짐이면 경고 연간 유형 재분류가 필요한가 확인 7장, 14장 유형 변경 시 체크리스트 재작성 연간 포트폴리오 비중과 유형 분산이 아직 적절한가 16장 비중 조정 또는 교체 폭락장 스토리 손상인가, 단순 가격 하락인가 구분 5장, 17장, 20장 스토리 유지 시 재매수 검토 폭락장 12개월 내 현금 필요 여부가 바뀌었는가 4장 필요 자금이면 위험 축소 급등 후 주가가 이익선과 PER 범위를 과도하게 앞질렀는가 10장, 17장 부분 매도 또는 관찰 강화 급등 후 언론·기관 과밀·과도한 찬사가 생겼는가 8장, 17장 고성장주라면 과열 점검 스토리 변화 시 지금도 새로 살 것인가 에 답해 본다 18장 아니면 매도 검토"},{"i":35,"title":"린치식 매도 판단표","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>유형<\/th>\n<th>매도 신호<\/th>\n<th>보유 가능 조건<\/th>\n<th>관련 장<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>저성장주<\/td>\n<td>30~50% 재평가 완료, 배당 매력 감소, 시장점유율 하락, 사업다악화<\/td>\n<td>배당 유지 가능, 기본 안정, 저평가 지속<\/td>\n<td>15장, 17장<\/td>\n<\/tr>\n<tr>\n<td>대형우량주<\/td>\n<td>PER 과열, 이익선 상회, 성장 둔화, 신제품 실패, 핵심 사업부 악화<\/td>\n<td>정상 밸류에이션, 완만한 성장 지속, 침체 내구성 유지<\/td>\n<td>15장, 17장<\/td>\n<\/tr>\n<tr>\n<td>고성장주<\/td>\n<td>성장 2단계 종료 조짐, 동일점포 매출 둔화, 신규 확장 실패, 인력 이탈, 기관 과밀, 과열 PER<\/td>\n<td>성장 여지 충분, 확장 공식 재현 가능, 이익 증가 지속<\/td>\n<td>15장, 17장<\/td>\n<\/tr>\n<tr>\n<td>경기순환주<\/td>\n<td>재고 증가, 상품가격 하락, 경쟁 심화, 최종 수요 감소, 과잉 CAPEX<\/td>\n<td>사이클 초중반, 재고 통제, 수급 개선<\/td>\n<td>15장, 17장<\/td>\n<\/tr>\n<tr>\n<td>회생주<\/td>\n<td>회생 완료로 재평가 종료, 부채 재증가, 재고 악화, 단일 고객 의존 심화<\/td>\n<td>부채 감소 지속, 사업 회복 진전, 생존가설 유지<\/td>\n<td>15장, 17장<\/td>\n<\/tr>\n<tr>\n<td>자산주<\/td>\n<td>할인 해소, 자산가치 훼손, 과도한 차입·증자, 가치 파괴적 자본배분<\/td>\n<td>숨은 자산 유지, 순부채 통제, 촉매 유효<\/td>\n<td>15장, 17장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"유형 매도 신호 보유 가능 조건 관련 장 저성장주 30~50% 재평가 완료, 배당 매력 감소, 시장점유율 하락, 사업다악화 배당 유지 가능, 기본 안정, 저평가 지속 15장, 17장 대형우량주 PER 과열, 이익선 상회, 성장 둔화, 신제품 실패, 핵심 사업부 악화 정상 밸류에이션, 완만한 성장 지속, 침체 내구성 유지 15장, 17장 고성장주 성장 2단계 종료 조짐, 동일점포 매출 둔화, 신규 확장 실패, 인력 이탈, 기관 과밀, 과열 PER 성장 여지 충분, 확장 공식 재현 가능, 이익 증가 지속 15장, 17장 경기순환주 재고 증가, 상품가격 하락, 경쟁 심화, 최종 수요 감소, 과잉 CAPEX 사이클 초중반, 재고 통제, 수급 개선 15장, 17장 회생주 회생 완료로 재평가 종료, 부채 재증가, 재고 악화, 단일 고객 의존 심화 부채 감소 지속, 사업 회복 진전, 생존가설 유지 15장, 17장 자산주 할인 해소, 자산가치 훼손, 과도한 차입·증자, 가치 파괴적 자본배분 숨은 자산 유지, 순부채 통제, 촉매 유효 15장, 17장"},{"i":36,"title":"린치가 피하라는 것들","html":"<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>금기<\/th>\n<th>이유<\/th>\n<th>관련 장<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>인기 업종의 인기 종목<\/td>\n<td>기대가 이미 높아 작은 실망에도 크게 무너질 수 있다<\/td>\n<td>9장<\/td>\n<\/tr>\n<tr>\n<td>제2의 아무개<\/td>\n<td>원조의 경쟁우위를 복제하지 못하는 경우가 많다<\/td>\n<td>9장, 18장<\/td>\n<\/tr>\n<tr>\n<td>사업다악화<\/td>\n<td>엉뚱한 인수와 확장은 이익과 집중도를 해친다<\/td>\n<td>9장, 17장<\/td>\n<\/tr>\n<tr>\n<td>실체 없는 소문주<\/td>\n<td>숫자와 이익이 없는 기대만 남아 있을 수 있다<\/td>\n<td>9장<\/td>\n<\/tr>\n<tr>\n<td>과도한 부채<\/td>\n<td>경기 악화와 회생 실패 때 주주를 먼저 압박한다<\/td>\n<td>13장, 15장<\/td>\n<\/tr>\n<tr>\n<td>선물<\/td>\n<td>조사 우위를 살리기 어렵고 구조적으로 불리하다<\/td>\n<td>19장<\/td>\n<\/tr>\n<tr>\n<td>옵션<\/td>\n<td>시간가치와 비용이 커서 조사 성과를 훼손할 수 있다<\/td>\n<td>19장<\/td>\n<\/tr>\n<tr>\n<td>공매도<\/td>\n<td>손실이 무한대로 열려 있고 버티기 어렵다<\/td>\n<td>19장<\/td>\n<\/tr>\n<tr>\n<td>시장 예측<\/td>\n<td>일관된 초과수익 원천이 되기 어렵다<\/td>\n<td>5장<\/td>\n<\/tr>\n<tr>\n<td>손절률에 따른 기계적 매도<\/td>\n<td>스토리와 가치 판단을 지워 버린다<\/td>\n<td>16장, 18장<\/td>\n<\/tr>\n<tr>\n<td>조사 없는 매수<\/td>\n<td>호감과 소문을 투자로 오해하게 만든다<\/td>\n<td>서문, 12장<\/td>\n<\/tr>\n<tr>\n<td>바닥 추정 매수<\/td>\n<td>주가가 많이 빠졌다는 사실만으로는 근거가 되지 않는다<\/td>\n<td>18장<\/td>\n<\/tr>\n<tr>\n<td>본전 심리 매도<\/td>\n<td>가격 기준이 스토리 기준을 대체해 버린다<\/td>\n<td>18장<\/td>\n<\/tr>\n<tr>\n<td>FOMO 추격<\/td>\n<td>내 분석이 아니라 남의 이익을 쫓는 행동이 된다<\/td>\n<td>18장, 3부 요약<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"금기 이유 관련 장 인기 업종의 인기 종목 기대가 이미 높아 작은 실망에도 크게 무너질 수 있다 9장 제2의 아무개 원조의 경쟁우위를 복제하지 못하는 경우가 많다 9장, 18장 사업다악화 엉뚱한 인수와 확장은 이익과 집중도를 해친다 9장, 17장 실체 없는 소문주 숫자와 이익이 없는 기대만 남아 있을 수 있다 9장 과도한 부채 경기 악화와 회생 실패 때 주주를 먼저 압박한다 13장, 15장 선물 조사 우위를 살리기 어렵고 구조적으로 불리하다 19장 옵션 시간가치와 비용이 커서 조사 성과를 훼손할 수 있다 19장 공매도 손실이 무한대로 열려 있고 버티기 어렵다 19장 시장 예측 일관된 초과수익 원천이 되기 어렵다 5장 손절률에 따른 기계적 매도 스토리와 가치 판단을 지워 버린다 16장, 18장 조사 없는 매수 호감과 소문을 투자로 오해하게 만든다 서문, 12장 바닥 추정 매수 주가가 많이 빠졌다는 사실만으로는 근거가 되지 않는다 18장 본전 심리 매도 가격 기준이 스토리 기준을 대체해 버린다 18장 FOMO 추격 내 분석이 아니라 남의 이익을 쫓는 행동이 된다 18장, 3부 요약"},{"i":37,"title":"린치 vs 보글 비교 준비표","html":"<p>[후대 해석] 보글의 인덱스 투자론은 시장 전체를 아주 낮은 비용으로 오래 보유하자는 주장이고, 린치는 생활·업무 현장에서 생기는 관찰 우위와 종목 분류·스토리 점검을 통해 평균 이상을 노릴 수 있다고 본다. 다만 최근의 액티브 부진 보도와 초대형 저비용 ETF의 팽창은, 보글식 인덱스가 오늘날에도 여전히 매우 강한 기본 전략임을 보여준다.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>쟁점<\/th>\n<th>린치 입장<\/th>\n<th>보글과 충돌할 지점<\/th>\n<th>실제 숨은 전제<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>개인투자자의 우위<\/td>\n<td>생활 반경에서 먼저 발견하고 직접 조사하면 우위가 생긴다<\/td>\n<td>보글은 평균 투자자가 그 우위를 안정적으로 재현하기 어렵다고 본다<\/td>\n<td>개인에게 실제 관찰 우위와 조사 습관이 있어야 한다<\/td>\n<\/tr>\n<tr>\n<td>개별주 투자 가능성<\/td>\n<td>가능하다. 다만 유형 분류와 숫자 점검이 필수다<\/td>\n<td>보글은 대부분에게 시장 전체 보유가 더 낫다고 본다<\/td>\n<td>시간·관심·규율이 충분해야 한다<\/td>\n<\/tr>\n<tr>\n<td>인덱스 대비 초과수익<\/td>\n<td>몇 개의 큰 승자로 달성 가능하다<\/td>\n<td>보글은 비용 차감 후 초과수익 지속이 매우 어렵다고 본다<\/td>\n<td>텐베거 몇 개를 버틸 수 있어야 한다<\/td>\n<\/tr>\n<tr>\n<td>분석 시간<\/td>\n<td>직접 조사와 현장 관찰이 필요하다<\/td>\n<td>보글은 그 시간을 줄이고 체계적 시장 보유를 택한다<\/td>\n<td>투자자가 공부를 즐기고 지속할 수 있어야 한다<\/td>\n<\/tr>\n<tr>\n<td>분산<\/td>\n<td>과도한 분산은 비효율이지만 한 종목 몰빵도 위험하다<\/td>\n<td>보글은 광범위한 시장 분산을 선호한다<\/td>\n<td>투자자가 종목 수보다 이해도를 우선시해야 한다<\/td>\n<\/tr>\n<tr>\n<td>매도<\/td>\n<td>유형별로 과열·스토리 훼손·회복 완료 시 매도한다<\/td>\n<td>보글은 개별 매도 판단 자체를 최소화한다<\/td>\n<td>매도 기준을 사전에 문서화해야 한다<\/td>\n<\/tr>\n<tr>\n<td>비용<\/td>\n<td>개별주도 저회전이면 비용을 낮출 수 있다<\/td>\n<td>보글은 구조적으로 더 낮은 비용과 세금 효율을 중시한다<\/td>\n<td>자주 거래하지 않아야 한다<\/td>\n<\/tr>\n<tr>\n<td>감정 통제<\/td>\n<td>스토리와 사실을 반복 점검해 감정을 통제한다<\/td>\n<td>보글은 단순한 규칙으로 감정 개입 자체를 줄인다<\/td>\n<td>복잡성을 버틸 성향이 있어야 한다<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","text":"[후대 해석] 보글의 인덱스 투자론은 시장 전체를 아주 낮은 비용으로 오래 보유하자는 주장이고, 린치는 생활·업무 현장에서 생기는 관찰 우위와 종목 분류·스토리 점검을 통해 평균 이상을 노릴 수 있다고 본다. 다만 최근의 액티브 부진 보도와 초대형 저비용 ETF의 팽창은, 보글식 인덱스가 오늘날에도 여전히 매우 강한 기본 전략임을 보여준다. 쟁점 린치 입장 보글과 충돌할 지점 실제 숨은 전제 개인투자자의 우위 생활 반경에서 먼저 발견하고 직접 조사하면 우위가 생긴다 보글은 평균 투자자가 그 우위를 안정적으로 재현하기 어렵다고 본다 개인에게 실제 관찰 우위와 조사 습관이 있어야 한다 개별주 투자 가능성 가능하다. 다만 유형 분류와 숫자 점검이 필수다 보글은 대부분에게 시장 전체 보유가 더 낫다고 본다 시간·관심·규율이 충분해야 한다 인덱스 대비 초과수익 몇 개의 큰 승자로 달성 가능하다 보글은 비용 차감 후 초과수익 지속이 매우 어렵다고 본다 텐베거 몇 개를 버틸 수 있어야 한다 분석 시간 직접 조사와 현장 관찰이 필요하다 보글은 그 시간을 줄이고 체계적 시장 보유를 택한다 투자자가 공부를 즐기고 지속할 수 있어야 한다 분산 과도한 분산은 비효율이지만 한 종목 몰빵도 위험하다 보글은 광범위한 시장 분산을 선호한다 투자자가 종목 수보다 이해도를 우선시해야 한다 매도 유형별로 과열·스토리 훼손·회복 완료 시 매도한다 보글은 개별 매도 판단 자체를 최소화한다 매도 기준을 사전에 문서화해야 한다 비용 개별주도 저회전이면 비용을 낮출 수 있다 보글은 구조적으로 더 낮은 비용과 세금 효율을 중시한다 자주 거래하지 않아야 한다 감정 통제 스토리와 사실을 반복 점검해 감정을 통제한다 보글은 단순한 규칙으로 감정 개입 자체를 줄인다 복잡성을 버틸 성향이 있어야 한다"},{"i":38,"title":"한 페이지 요약","html":"<h3>린치의 한 문장 핵심<\/h3>\n<ul>\n<li>[후대 해석] 개인투자자는 자신이 먼저 보는 현실 세계의 단서를 기업의 이익·유형·가격과 연결할 수 있을 때만 시장 평균을 넘어설 기회를 얻는다.<\/li>\n<\/ul>\n<h3>개인투자자가 기억할 10문장<\/h3>\n<ul>\n<li>주식은 종이 조각이 아니라 기업이다.<\/li>\n<li>발견은 출발점이지 매수 신호가 아니다.<\/li>\n<li>시장 예측보다 기업 이해가 중요하다.<\/li>\n<li>종목은 반드시 6가지 유형 중 하나로 분류해야 한다.<\/li>\n<li>같은 회사라도 가격이 비싸면 나쁜 투자가 될 수 있다.<\/li>\n<li>좋은 스토리는 2분 안에 설명되어야 한다.<\/li>\n<li>이익, 부채, 재고, 현금은 스토리를 검증하는 숫자다.<\/li>\n<li>장기보유는 무관심이 아니라 반복 점검이다.<\/li>\n<li>매도는 손익률이 아니라 스토리 훼손과 과열로 판단한다.<\/li>\n<li>기본 전략으로 인덱스를 이길 자신이 없으면 인덱스가 훌륭한 답이다.<\/li>\n<\/ul>\n<h3>개별주 투자자가 반드시 할 10가지<\/h3>\n<ul>\n<li>투자 전에 자기 자금의 시간 지평을 점검한다.<\/li>\n<li>생활·업무 현장에서 투자 아이디어를 기록한다.<\/li>\n<li>회사가 돈 버는 구조를 3문장으로 설명한다.<\/li>\n<li>6가지 유형 중 어디인지 분류한다.<\/li>\n<li>2분 독백을 작성한다.<\/li>\n<li>핵심 제품 비중과 성장 동인을 확인한다.<\/li>\n<li>이익, PER, 부채, 현금, 재고를 점검한다.<\/li>\n<li>유형별 매수·보유·매도 기준을 따로 만든다.<\/li>\n<li>분기마다 스토리를 재확인한다.<\/li>\n<li>더 좋은 대안이 생기면 교체를 검토한다.<\/li>\n<\/ul>\n<h3>개별주 투자자가 절대 하지 말아야 할 10가지<\/h3>\n<ul>\n<li>좋아하는 제품이라는 이유만으로 매수하지 말 것<\/li>\n<li>인기 업종의 인기 종목을 추격하지 말 것<\/li>\n<li>제2의 아무개 논리로 사지 말 것<\/li>\n<li>사업다악화를 성장으로 오해하지 말 것<\/li>\n<li>조사 없이 소문으로 사지 말 것<\/li>\n<li>주가가 빠졌다는 이유만으로 싸다고 생각하지 말 것<\/li>\n<li>손절률 규칙만으로 기계적으로 팔지 말 것<\/li>\n<li>본전 심리로 의사결정하지 말 것<\/li>\n<li>선물·옵션·공매도에 기대지 말 것<\/li>\n<li>시장 방향 예측을 핵심 전략으로 삼지 말 것<\/li>\n<\/ul>","text":"린치의 한 문장 핵심 [후대 해석] 개인투자자는 자신이 먼저 보는 현실 세계의 단서를 기업의 이익·유형·가격과 연결할 수 있을 때만 시장 평균을 넘어설 기회를 얻는다. 개인투자자가 기억할 10문장 주식은 종이 조각이 아니라 기업이다. 발견은 출발점이지 매수 신호가 아니다. 시장 예측보다 기업 이해가 중요하다. 종목은 반드시 6가지 유형 중 하나로 분류해야 한다. 같은 회사라도 가격이 비싸면 나쁜 투자가 될 수 있다. 좋은 스토리는 2분 안에 설명되어야 한다. 이익, 부채, 재고, 현금은 스토리를 검증하는 숫자다. 장기보유는 무관심이 아니라 반복 점검이다. 매도는 손익률이 아니라 스토리 훼손과 과열로 판단한다. 기본 전략으로 인덱스를 이길 자신이 없으면 인덱스가 훌륭한 답이다. 개별주 투자자가 반드시 할 10가지 투자 전에 자기 자금의 시간 지평을 점검한다. 생활·업무 현장에서 투자 아이디어를 기록한다. 회사가 돈 버는 구조를 3문장으로 설명한다. 6가지 유형 중 어디인지 분류한다. 2분 독백을 작성한다. 핵심 제품 비중과 성장 동인을 확인한다. 이익, PER, 부채, 현금, 재고를 점검한다. 유형별 매수·보유·매도 기준을 따로 만든다. 분기마다 스토리를 재확인한다. 더 좋은 대안이 생기면 교체를 검토한다. 개별주 투자자가 절대 하지 말아야 할 10가지 좋아하는 제품이라는 이유만으로 매수하지 말 것 인기 업종의 인기 종목을 추격하지 말 것 제2의 아무개 논리로 사지 말 것 사업다악화를 성장으로 오해하지 말 것 조사 없이 소문으로 사지 말 것 주가가 빠졌다는 이유만으로 싸다고 생각하지 말 것 손절률 규칙만으로 기계적으로 팔지 말 것 본전 심리로 의사결정하지 말 것 선물·옵션·공매도에 기대지 말 것 시장 방향 예측을 핵심 전략으로 삼지 말 것"},{"i":39,"title":"검증 체크리스트","html":"<ul>\n<li>기존 frontmatter 보존 여부: 완료<\/li>\n<li>기존 제목 보존 여부: 완료<\/li>\n<li>기존 장 헤더 보존 여부: 완료<\/li>\n<li>기존 불릿 보존 여부: 완료<\/li>\n<li>관련 노트 섹션 보존 여부: 완료<\/li>\n<li>6가지 유형 표 완성 여부: 완료<\/li>\n<li>2분 독백 템플릿 완성 여부: 완료<\/li>\n<li>매수·보유·매도 체크리스트 완성 여부: 완료<\/li>\n<li>아마추어의 우위를 조건부로 정리했는지 여부: 완료<\/li>\n<li>린치 주장을 과장하지 않았는지 점검 여부: 완료<\/li>\n<li>린치 본문 / 후대 해석 / 현대 적용 / 추론 구분 여부: 완료<\/li>\n<li>보글과 비교할 준비가 되었는지 여부: 완료<\/li>\n<li>기준 원본 대조 여부:<\/li>\n<\/ul>","text":"기존 frontmatter 보존 여부: 완료 기존 제목 보존 여부: 완료 기존 장 헤더 보존 여부: 완료 기존 불릿 보존 여부: 완료 관련 노트 섹션 보존 여부: 완료 6가지 유형 표 완성 여부: 완료 2분 독백 템플릿 완성 여부: 완료 매수·보유·매도 체크리스트 완성 여부: 완료 아마추어의 우위를 조건부로 정리했는지 여부: 완료 린치 주장을 과장하지 않았는지 점검 여부: 완료 린치 본문 / 후대 해석 / 현대 적용 / 추론 구분 여부: 완료 보글과 비교할 준비가 되었는지 여부: 완료 기준 원본 대조 여부:"}]},{"id":"06","title":"[독서] 투자에 대한 생각","short":"투자에 대한 생각","author":"막스","chapters":[{"i":0,"title":"문서 안내","html":"<hr />\n<p>title: \"[독서] 투자에 대한 생각\"\naliases: [\"투자에 대한 생각\", \"The Most Important Thing\", \"하워드 막스\", \"Howard Marks\"]\ntype: book-note-personal\ncategory: 독서\nauthor: 하워드 막스\ndate_read: 2026-05-11\ndate_started: 2025-04-24\ndate: 2026-05-11\nstatus: complete\ntags:\n  - 독서\n  - 투자\n  - 가치투자\n  - 리스크\n  - 2차적사고\n  - 시계추\n  - 역투자\n  - 안전마진\n  - 방어투자\n  - 시장주기\n  - 인식론\n  - 하워드막스<\/p>\n<hr />\n<p><strong>저자:<\/strong> 하워드 막스\n<strong>읽은 기간:<\/strong> 2025.04.24 ~ 2026.05.11\n<strong>키워드:<\/strong> 2차적 사고, 가치, 리스크, 시계추, 역투자, 안전마진, 방어 투자, 시장 주기<\/p>\n<hr />\n<blockquote>\n<p>편집 표기 규칙\n- <code>[막스 본문]<\/code>은 아래 <code>### 기존 노트<\/code>에 그대로 보존한 장별 핵심을 바탕으로 한 구조화다.\n- <code>[막스 메모/인터뷰]<\/code>는 Oaktree 공식 메모를 보조 근거로 쓴 부분이다.\n- <code>[후대 해석]<\/code>은 다른 투자 저작과의 연결이다.\n- <code>[현대 적용]<\/code>은 오늘의 투자 실무로 번역한 부분이다.\n- <code>[추론]<\/code>은 위 자료들을 연결해 의사결정 프레임으로 재구성한 편집 판단이다.\n- 장별 기존 불릿은 삭제·요약·재배열하지 않았다.\n- 보조 리서치에는 Oaktree의 <code>Thinking About Macro<\/code>, <code>The Illusion of Knowledge<\/code>, <code>Taking the Temperature<\/code>, <code>Fewer Losers, or More Winners?<\/code>, <code>The Indispensability of Risk<\/code>, <code>Nobody Knows (Yet Again)<\/code>, <code>What’s Going on in Private Credit?<\/code>를 사용했다.<\/p>\n<\/blockquote>","text":"title: \"[독서] 투자에 대한 생각\" aliases: [\"투자에 대한 생각\", \"The Most Important Thing\", \"하워드 막스\", \"Howard Marks\"] type: book-note-personal category: 독서 author: 하워드 막스 date_read: 2026-05-11 date_started: 2025-04-24 date: 2026-05-11 status: complete tags: - 독서 - 투자 - 가치투자 - 리스크 - 2차적사고 - 시계추 - 역투자 - 안전마진 - 방어투자 - 시장주기 - 인식론 - 하워드막스 저자: 하워드 막스 읽은 기간: 2025.04.24 ~ 2026.05.11 키워드: 2차적 사고, 가치, 리스크, 시계추, 역투자, 안전마진, 방어 투자, 시장 주기 편집 표기 규칙 - [막스 본문] 은 아래 ### 기존 노트 에 그대로 보존한 장별 핵심을 바탕으로 한 구조화다. - [막스 메모/인터뷰] 는 Oaktree 공식 메모를 보조 근거로 쓴 부분이다. - [후대 해석] 은 다른 투자 저작과의 연결이다. - [현대 적용] 은 오늘의 투자 실무로 번역한 부분이다. - [추론] 은 위 자료들을 연결해 의사결정 프레임으로 재구성한 편집 판단이다. - 장별 기존 불릿은 삭제·요약·재배열하지 않았다. - 보조 리서치에는 Oaktree의 Thinking About Macro , The Illusion of Knowledge , Taking the Temperature , Fewer Losers, or More Winners? , The Indispensability of Risk , Nobody Knows (Yet Again) , What’s Going on in Private Credit? 를 사용했다."},{"i":1,"title":"00. 서문","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>성공적인 투자를 위해서는 서로 다른 여러 측면을 동시에 신중하게 살펴야 하고 어느 하나만 빠뜨려도 결과는 만족스럽지 못할 수 있다.<\/li>\n<li>벽돌 하나하나가 모여 튼튼한 벽이 되고 집이 되듯이, 가장 중요한 것 하나하나가 모여 성공적인 투자의 기반이 되어줄 것이다.<\/li>\n<li>사실 내가 가장 확실히 하고 싶은 것은 투자가 얼마나 복잡한 것인가를 사람들에게 이해시키는 것이다.<\/li>\n<li>리스크는 투자에서 가장 흥미롭고, 도전할 만하고, 또 꼭 필요한 측면이기 때문이다.<\/li>\n<li>성공의 비결은 바로 40년 넘게 갈고닦아온 문화와 가치를 공유하는 매우 숙련된 개인들에 의해 양심적으로 시행되어온 우리만의 효과적인 투자철학이다.<\/li>\n<li>철학은 다양한 원천으로부터 오랜 시간 축적된 사고의 총체여야 하고 삶의 교훈을 통한 배움 없이는 유용한 철학도 생기지 않는다.<\/li>\n<li>철학은 조금만 깨어 있는 정신으로 인생을 살면 가질 수 있으나 다만 세상에 무슨 일이 일어나고 있는지 그로 인한 결과가 어떤 상황으로 이어질지를 인식하고 있어야 비슷한 상황이 재발했을 때 앞서 얻은 교훈이 도움이 될 수 있다.<\/li>\n<li>그렇지 못할 경우 대부분의 투자자들은 호황과 불황이 반복되는 경제 주기 속에서 반복적인 희생양이 될 수밖에 없다.<\/li>\n<li>가장 값진 교훈은 불황에서 얻을 수 있고 호황은 쓸모없는 교훈만 준다.<\/li>\n<li>추천 도서<ul>\n<li>찰스 엘리스의 패자의 게임 (기사)<\/li>\n<li>존 케네스 갤브레이스의 금융 도취의 짧은 역사<\/li>\n<li>나심 니콜라스 탈레브의 행운에 속지 마라<\/li>\n<\/ul>\n<\/li>\n<li>훌륭한 사상가들로부터의 가르침<ul>\n<li>존 갤브레이스: 인간의 약점<\/li>\n<li>워런 버핏: 인내와 역발상<\/li>\n<li>찰리 멍거: 합당한 기대의 중요성<\/li>\n<li>브루스 뉴버그: 잠재 시나리오와 그에 따른 결과<\/li>\n<li>마이클 밀켄: 의식적인 리스크 감수<\/li>\n<li>릭 케인: 덫을 놓는 것<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 서문은 단일 비법이 아니라 여러 “가장 중요한 것”이 동시에 맞물려야 한다는 선언이다.<\/li>\n<li>[막스 본문] 막스 철학의 출발점은 복잡성의 인정, 리스크의 중심화, 불황에서 배우는 태도다.<\/li>\n<li>[추론] 이 장은 나머지 20개 장을 개별 교훈의 목록이 아니라 하나의 운영체계로 읽게 만드는 메타 프레임이다.<\/li>\n<li>[현대 적용] 실무적으로는 “좋은 아이디어”보다 “좋은 아이디어를 망치지 않는 조직·문화·자본 구조”를 먼저 점검하라는 뜻이다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>내 투자 프로세스에서 빠지면 전체 성과를 무너뜨릴 핵심 벽돌은 무엇인가?<\/li>\n<li>나는 수익 창출보다 손실 회피를 얼마나 체계적으로 다루고 있는가?<\/li>\n<li>호황에서 배운 낙관적 교훈을 불황에서도 그대로 믿고 있지 않은가?<\/li>\n<li>내가 따르는 투자 철학은 사건별 임기응변인가, 반복 가능한 원칙인가?<\/li>\n<li>내 팀이나 나의 의사결정 문화는 과신을 줄이고 반대 의견을 보호하는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(원칙 기반 가치투자), 보글(시장을 이기기보다 실수 줄이기), 하우절(복잡계·심리), 코스톨라니(군중과 주기), 린치(관찰과 상식). 이 장은 다섯 권의 접점 역할을 한다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] “가장 중요한 것”은 하나의 만능 공식이 아니라 상황마다 중요도가 달라지는 원칙 묶음이다.<\/li>\n<li>[추론] 불황에서 배운다는 말은 침체를 선호하라는 뜻이 아니라, 가격·심리·리스크가 진실을 드러내는 구간을 중시하라는 뜻이다.<\/li>\n<\/ul>","text":"기존 노트 성공적인 투자를 위해서는 서로 다른 여러 측면을 동시에 신중하게 살펴야 하고 어느 하나만 빠뜨려도 결과는 만족스럽지 못할 수 있다. 벽돌 하나하나가 모여 튼튼한 벽이 되고 집이 되듯이, 가장 중요한 것 하나하나가 모여 성공적인 투자의 기반이 되어줄 것이다. 사실 내가 가장 확실히 하고 싶은 것은 투자가 얼마나 복잡한 것인가를 사람들에게 이해시키는 것이다. 리스크는 투자에서 가장 흥미롭고, 도전할 만하고, 또 꼭 필요한 측면이기 때문이다. 성공의 비결은 바로 40년 넘게 갈고닦아온 문화와 가치를 공유하는 매우 숙련된 개인들에 의해 양심적으로 시행되어온 우리만의 효과적인 투자철학이다. 철학은 다양한 원천으로부터 오랜 시간 축적된 사고의 총체여야 하고 삶의 교훈을 통한 배움 없이는 유용한 철학도 생기지 않는다. 철학은 조금만 깨어 있는 정신으로 인생을 살면 가질 수 있으나 다만 세상에 무슨 일이 일어나고 있는지 그로 인한 결과가 어떤 상황으로 이어질지를 인식하고 있어야 비슷한 상황이 재발했을 때 앞서 얻은 교훈이 도움이 될 수 있다. 그렇지 못할 경우 대부분의 투자자들은 호황과 불황이 반복되는 경제 주기 속에서 반복적인 희생양이 될 수밖에 없다. 가장 값진 교훈은 불황에서 얻을 수 있고 호황은 쓸모없는 교훈만 준다. 추천 도서 찰스 엘리스의 패자의 게임 (기사) 존 케네스 갤브레이스의 금융 도취의 짧은 역사 나심 니콜라스 탈레브의 행운에 속지 마라 훌륭한 사상가들로부터의 가르침 존 갤브레이스: 인간의 약점 워런 버핏: 인내와 역발상 찰리 멍거: 합당한 기대의 중요성 브루스 뉴버그: 잠재 시나리오와 그에 따른 결과 마이클 밀켄: 의식적인 리스크 감수 릭 케인: 덫을 놓는 것 [구조화] [막스 본문] 서문은 단일 비법이 아니라 여러 “가장 중요한 것”이 동시에 맞물려야 한다는 선언이다. [막스 본문] 막스 철학의 출발점은 복잡성의 인정, 리스크의 중심화, 불황에서 배우는 태도다. [추론] 이 장은 나머지 20개 장을 개별 교훈의 목록이 아니라 하나의 운영체계로 읽게 만드는 메타 프레임이다. [현대 적용] 실무적으로는 “좋은 아이디어”보다 “좋은 아이디어를 망치지 않는 조직·문화·자본 구조”를 먼저 점검하라는 뜻이다. [실전 질문] 내 투자 프로세스에서 빠지면 전체 성과를 무너뜨릴 핵심 벽돌은 무엇인가? 나는 수익 창출보다 손실 회피를 얼마나 체계적으로 다루고 있는가? 호황에서 배운 낙관적 교훈을 불황에서도 그대로 믿고 있지 않은가? 내가 따르는 투자 철학은 사건별 임기응변인가, 반복 가능한 원칙인가? 내 팀이나 나의 의사결정 문화는 과신을 줄이고 반대 의견을 보호하는가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(원칙 기반 가치투자), 보글(시장을 이기기보다 실수 줄이기), 하우절(복잡계·심리), 코스톨라니(군중과 주기), 린치(관찰과 상식). 이 장은 다섯 권의 접점 역할을 한다. [오해 방지] [추론] “가장 중요한 것”은 하나의 만능 공식이 아니라 상황마다 중요도가 달라지는 원칙 묶음이다. [추론] 불황에서 배운다는 말은 침체를 선호하라는 뜻이 아니라, 가격·심리·리스크가 진실을 드러내는 구간을 중시하라는 뜻이다."},{"i":2,"title":"01. 심층적으로 생각하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>누구나 좋은 성과를 낼 수는 없다. 일반 투자자도 최소한의 노력과 실력으로 제법 괜찮은 성과를 거둘 수는 있지만 많은 실전 경험과 예지를 갖춰야 한다 (벤저민 그레이엄)<\/li>\n<li>모든 것은 가능한 간단하게 만들어야 하지만, 지나치게 간단해서도 안 된다. (알버트 아인슈타인)<\/li>\n<li>쉽게 여기지 마라. 쉽다고 생각하는 사람이 어리석다. (찰리 멍거)<\/li>\n<li>훌륭한 투자자가 될 수 있는 조건을 가진 사람은 많지 않고 배우면 가능한 사람도 있겠지만 이는 모든 사람에게 해당되는 것은 아니며 가능한 사람일지라도 투자의 모든 것을 알 수는 없다.<\/li>\n<li>효과적인 투자 전략이라도 경우에 따라 유효할 뿐 매번 효과적이지는 않기 때문이고 투자를 한 가지 알고리즘으로 간소화할 수도 없고 투자의 대가라 해도 항상 옳을 수는 없다.<\/li>\n<li>환경은 통제 불가능하고 상황이 똑같이 반복되는 일은 드물기 때문에 투자에서 늘 적용 가능한 규칙이란 없다.<\/li>\n<li>투자자 심리가 시장에서 중요한 요소로 작용하고 많은 변수에 영향을 받기 때문에 인과관계를 신뢰할 수 없다.<\/li>\n<li>한 가지 투자 전략이 한동안은 효과가 있겠지만, 너도나도 그 전략을 따르면서 결국 실효성이 떨어지고, 새로운 투자 전략의 필요성이 다시 대두된다.<\/li>\n<li>실수가 발생할 수 있다는 점에서 투자는 과학보다 예술에 가깝다.<\/li>\n<li>누구나 평균 수익은 달성할 수 있지만 성공하는 투자는 운이 됐든, 탁월한 통찰력이 됐든 둘 중 하나는 필요하다.<\/li>\n<li>요행보다 통찰력에 집중해야 하며 통찰력은 누가 가르친다고 해서 생기는 것이 아니며 투자에 대한 이해력이 그저 남들보다 뛰어난 사람들이 있는 것뿐이다.<\/li>\n<li>남보다 한발 앞선 사람이 승자가 될 것이며 투자는 다른 분야와 다르게 통찰력 있는 사고, 바로 2차적 사고가 더 중요하다.<\/li>\n<li>평균 이상의 지속적인 수익을 올리기 위해 꼭 탁월한 통찰력, 직관, 가치에 대한 감각, 심리 파악 능력 등을 가질 수 있는 사람은 많지 않다.<\/li>\n<li>다른 투자자들이 생각하지 못하는 것을 생각하고, 못 보는 것을 보고 그들에게 없는 통찰력을 발휘하며, 그들과 다르게 반응하고 행동해야 한다.<\/li>\n<li>옳은 판단을 하는 것은 성공 투자를 위한 필요조건이지 충분조건이 아니고 다른 투자자들보다 더 옳은 판단, 즉 남들과 다르게 생각해야 한다.<\/li>\n<li>2차적 사고는 심오하고 복합적이며 난해하다.<\/li>\n<li>2차적 사고<ul>\n<li>예측 가능한 결과에는 어떠한 것들이 있는가?<\/li>\n<li>그중 어떤 결과가 나올 것이라고 생각하는가?<\/li>\n<li>내 예측이 맞을 가능성은 얼마나 되는가?<\/li>\n<li>시장은 어떻게 예측하는가?<\/li>\n<li>시장의 예측과 내 예측은 어떻게 다른가?<\/li>\n<li>자산의 현재 가격은 시장이 예측하는 미래 가격에 비해 적절하고 나의 예측과 비교해서는 어떠한가?<\/li>\n<li>가격에 반영된 시장 심리가 지나치게 낙관적이거나 비관적이지는 않은가?<\/li>\n<li>시장의 예측이 맞다면, 또는 내 예측이 맞다면 자산 가격은 어떻게 될 것인가?<\/li>\n<\/ul>\n<\/li>\n<li>투자를 단순화하려고 최선을 다하는 사람들은 투자의 복잡성을 이해하지 못하는 사람들이다.<\/li>\n<li>투자자 집단이 곧 시장이기 때문에 모든 투자자들이 시장을 이길 수 있는 것도 아니므로 자신이 상위 절반에 들어갈 수 있는 마땅한 근거가 있는지 스스로 물어봐야 한다.<\/li>\n<li>보통의 투자자들보다 좋은 성과를 내기 위해서는 시장의 예측을 뛰어넘을 수 있어야 하는데 내가 그렇게 할 수 있는지 그렇다면 왜 그렇게 생각하는지 질문하라.<\/li>\n<li>문제는 정확한 판단 아래 남들과 다른 예측을 했을 때만 이례적인 성과를 기대할 수 있지만 남들과 다른 예측을 하기 어렵고 그 예측이 정확하기도 어렵고 그에 따라 행동하기도 어렵다.<\/li>\n<li>다른 사람들과 같은 방식으로 투자를 해서는 그들보다 나은 성과를 기대할 수 없고 차별화를 위해 사고의 내용과 과정이 남달라야 한다.<\/li>\n<li>물론 쉽지는 않은 일이지만 월등한 투자 성과를 달성하려면 가치에 대한 관점이 남다르고 정확해야 한다는 것이다.<\/li>\n<li>효율적인 시장에서 저가 매수의 기회는 소수만 가능한 방법이긴 하지만 남다른 분석력과 통찰력, 예지력을 발휘해야만 한다.<\/li>\n<li>누구나 성공적인 투자자가 될 수는 없지만 1차적 사고를 하는 투자자들이 대부분이고 그로 인해 2차적 사고를 하는 사람들의 수익이 증가한다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 전체 책의 운영체계다. 뒤의 모든 장은 결국 2차적 사고의 재료이거나 검증 장치다.<\/li>\n<li>[추론] 2차적 사고는 “복잡하게 생각하라”가 아니라 “시장 기대, 내 기대, 가격, 실패 확률, 실패 비용을 동시에 계산하라”는 뜻이다.<\/li>\n<li>[현대 적용] 오늘의 실무 언어로 바꾸면, 2차적 사고는 <code>가정-컨센서스-가격 반영도-대안 시나리오-좌측 꼬리<\/code>를 한 장표에 놓고 보는 투자 메모다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>시장은 무엇을 이미 가격에 반영하고 있는가?<\/li>\n<li>내 생각은 컨센서스와 정확히 어디서 다른가?<\/li>\n<li>내가 틀릴 가능성은 얼마나 되며, 틀렸을 때 손실은 얼마인가?<\/li>\n<li>내가 가진 우위는 정보인가, 해석인가, 심리인가?<\/li>\n<li>이 아이디어는 단지 “좋아 보이는가”, 아니면 “가격까지 포함해 좋아 보이는가”?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(독립 판단), 린치(남들이 안 보는 곳 보기), 하우절(군중과 감정), 코스톨라니(대중과 반대로 생각하기). 보글은 여기서 “시장 평균을 이기려면 왜 내가 예외인지 먼저 증명하라”는 반대편 경계선이 된다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 2차적 사고는 단순한 역발상이 아니다. 남들과 반대면 자동으로 2차적 사고가 되는 것이 아니다.<\/li>\n<li>[추론] 지적 복잡성 자체가 우위가 아니다. 복잡하게 계산해도 가격에 없는 우위가 없으면 평균 회귀한다.<\/li>\n<\/ul>","text":"기존 노트 누구나 좋은 성과를 낼 수는 없다. 일반 투자자도 최소한의 노력과 실력으로 제법 괜찮은 성과를 거둘 수는 있지만 많은 실전 경험과 예지를 갖춰야 한다 (벤저민 그레이엄) 모든 것은 가능한 간단하게 만들어야 하지만, 지나치게 간단해서도 안 된다. (알버트 아인슈타인) 쉽게 여기지 마라. 쉽다고 생각하는 사람이 어리석다. (찰리 멍거) 훌륭한 투자자가 될 수 있는 조건을 가진 사람은 많지 않고 배우면 가능한 사람도 있겠지만 이는 모든 사람에게 해당되는 것은 아니며 가능한 사람일지라도 투자의 모든 것을 알 수는 없다. 효과적인 투자 전략이라도 경우에 따라 유효할 뿐 매번 효과적이지는 않기 때문이고 투자를 한 가지 알고리즘으로 간소화할 수도 없고 투자의 대가라 해도 항상 옳을 수는 없다. 환경은 통제 불가능하고 상황이 똑같이 반복되는 일은 드물기 때문에 투자에서 늘 적용 가능한 규칙이란 없다. 투자자 심리가 시장에서 중요한 요소로 작용하고 많은 변수에 영향을 받기 때문에 인과관계를 신뢰할 수 없다. 한 가지 투자 전략이 한동안은 효과가 있겠지만, 너도나도 그 전략을 따르면서 결국 실효성이 떨어지고, 새로운 투자 전략의 필요성이 다시 대두된다. 실수가 발생할 수 있다는 점에서 투자는 과학보다 예술에 가깝다. 누구나 평균 수익은 달성할 수 있지만 성공하는 투자는 운이 됐든, 탁월한 통찰력이 됐든 둘 중 하나는 필요하다. 요행보다 통찰력에 집중해야 하며 통찰력은 누가 가르친다고 해서 생기는 것이 아니며 투자에 대한 이해력이 그저 남들보다 뛰어난 사람들이 있는 것뿐이다. 남보다 한발 앞선 사람이 승자가 될 것이며 투자는 다른 분야와 다르게 통찰력 있는 사고, 바로 2차적 사고가 더 중요하다. 평균 이상의 지속적인 수익을 올리기 위해 꼭 탁월한 통찰력, 직관, 가치에 대한 감각, 심리 파악 능력 등을 가질 수 있는 사람은 많지 않다. 다른 투자자들이 생각하지 못하는 것을 생각하고, 못 보는 것을 보고 그들에게 없는 통찰력을 발휘하며, 그들과 다르게 반응하고 행동해야 한다. 옳은 판단을 하는 것은 성공 투자를 위한 필요조건이지 충분조건이 아니고 다른 투자자들보다 더 옳은 판단, 즉 남들과 다르게 생각해야 한다. 2차적 사고는 심오하고 복합적이며 난해하다. 2차적 사고 예측 가능한 결과에는 어떠한 것들이 있는가? 그중 어떤 결과가 나올 것이라고 생각하는가? 내 예측이 맞을 가능성은 얼마나 되는가? 시장은 어떻게 예측하는가? 시장의 예측과 내 예측은 어떻게 다른가? 자산의 현재 가격은 시장이 예측하는 미래 가격에 비해 적절하고 나의 예측과 비교해서는 어떠한가? 가격에 반영된 시장 심리가 지나치게 낙관적이거나 비관적이지는 않은가? 시장의 예측이 맞다면, 또는 내 예측이 맞다면 자산 가격은 어떻게 될 것인가? 투자를 단순화하려고 최선을 다하는 사람들은 투자의 복잡성을 이해하지 못하는 사람들이다. 투자자 집단이 곧 시장이기 때문에 모든 투자자들이 시장을 이길 수 있는 것도 아니므로 자신이 상위 절반에 들어갈 수 있는 마땅한 근거가 있는지 스스로 물어봐야 한다. 보통의 투자자들보다 좋은 성과를 내기 위해서는 시장의 예측을 뛰어넘을 수 있어야 하는데 내가 그렇게 할 수 있는지 그렇다면 왜 그렇게 생각하는지 질문하라. 문제는 정확한 판단 아래 남들과 다른 예측을 했을 때만 이례적인 성과를 기대할 수 있지만 남들과 다른 예측을 하기 어렵고 그 예측이 정확하기도 어렵고 그에 따라 행동하기도 어렵다. 다른 사람들과 같은 방식으로 투자를 해서는 그들보다 나은 성과를 기대할 수 없고 차별화를 위해 사고의 내용과 과정이 남달라야 한다. 물론 쉽지는 않은 일이지만 월등한 투자 성과를 달성하려면 가치에 대한 관점이 남다르고 정확해야 한다는 것이다. 효율적인 시장에서 저가 매수의 기회는 소수만 가능한 방법이긴 하지만 남다른 분석력과 통찰력, 예지력을 발휘해야만 한다. 누구나 성공적인 투자자가 될 수는 없지만 1차적 사고를 하는 투자자들이 대부분이고 그로 인해 2차적 사고를 하는 사람들의 수익이 증가한다. [구조화] [막스 본문] 이 장은 전체 책의 운영체계다. 뒤의 모든 장은 결국 2차적 사고의 재료이거나 검증 장치다. [추론] 2차적 사고는 “복잡하게 생각하라”가 아니라 “시장 기대, 내 기대, 가격, 실패 확률, 실패 비용을 동시에 계산하라”는 뜻이다. [현대 적용] 오늘의 실무 언어로 바꾸면, 2차적 사고는 가정-컨센서스-가격 반영도-대안 시나리오-좌측 꼬리 를 한 장표에 놓고 보는 투자 메모다. [실전 질문] 시장은 무엇을 이미 가격에 반영하고 있는가? 내 생각은 컨센서스와 정확히 어디서 다른가? 내가 틀릴 가능성은 얼마나 되며, 틀렸을 때 손실은 얼마인가? 내가 가진 우위는 정보인가, 해석인가, 심리인가? 이 아이디어는 단지 “좋아 보이는가”, 아니면 “가격까지 포함해 좋아 보이는가”? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(독립 판단), 린치(남들이 안 보는 곳 보기), 하우절(군중과 감정), 코스톨라니(대중과 반대로 생각하기). 보글은 여기서 “시장 평균을 이기려면 왜 내가 예외인지 먼저 증명하라”는 반대편 경계선이 된다. [오해 방지] [추론] 2차적 사고는 단순한 역발상이 아니다. 남들과 반대면 자동으로 2차적 사고가 되는 것이 아니다. [추론] 지적 복잡성 자체가 우위가 아니다. 복잡하게 계산해도 가격에 없는 우위가 없으면 평균 회귀한다."},{"i":3,"title":"02. 시장의 효율성을 이해하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>이론적으로는 이론과 실제 사이에 차이가 없지만, 실제로는 차이가 있다. (요기 베라)<\/li>\n<li>효율적 시장가설이 주장하는 것<ul>\n<li>시장에는 많은 참가자가 있으며, 이들은 관련 정보에 대체로 균등하게 접근하고 이들은 현명하고, 객관적이며, 의욕이 넘치고 노력을 아끼지 않는다.<\/li>\n<li>이들이 사용하는 분석 모델은 널리 알려져 있고, 이미 사용하고 있다.<\/li>\n<li>시장 참가자들의 집단적인 노력 때문에 각 자산의 시장 가격에 모든 정보가 즉시, 그리고 충분히 반영되며 이들이 지나치게 저가인 자산은 즉시 매수하고, 반대로 너무 고가인 자산은 즉시 매도할 것이기 때문에 자산 가격은 공정하게 매겨진다.<\/li>\n<li>시장 가격은 자산의 내재가치를 정확하게 평가한 것이며 어떤 참가자도 평가가 잘못된 경우를 지속적으로 발견하여 그로부터 이익을 보는 일은 있을 수 없다.<\/li>\n<li>자산은 다른 자산과 비교하여 적정한 위험 조정 수익을 낼 것으로 기대되는 가격에 팔리며 위험 자산일수록 매수자의 관심을 유발하기 위해 높은 수익을 제시해야 한다.<\/li>\n<li>리스크가 증가하지 않으면 수익도 증가하지 않을 것이다.<\/li>\n<\/ul>\n<\/li>\n<li>투자자들은 모든 새로운 정보를 평가할 때 최선의 노력을 기울이기 때문에 자산 가격은 해당 정보의 중요도에 대한 시장의 관점을 즉각 반영한다는 데 동의한다.<\/li>\n<li>그러나 이런 시장의 견해가 꼭 맞을 것이라고 생각하지는 않는다.<\/li>\n<li>시장을 이기기 위해서는 독창적이고 차별화된 시각, 즉 시장의 예측과 다른 견해를 가져야만 한다.<\/li>\n<li>핵심은 좀 더 효율적인 시장이 종종 자산을 잘못 평가하더라도, 시장의 예측과 다르면서 좀 더 정확한 견해를 지속적으로 갖기란 쉽지 않다는 점이다.<\/li>\n<li>시장이 옳지 않더라도 주류 시장을 이기기가 몹시 어려운 이유는 대부분 다른 사람들과 같은 정보를 가지고 같은 심리적 영향을 받기 때문이다.<\/li>\n<li>세상에 공짜 점심은 없다. 즉 위험을 무분별하게 수용해서는 절대로 안 된다.<\/li>\n<li>정말로 시장을 이길 수 없는가? 라는 질문에 답도 \"예\", \"아니오\"로 대답할 수 없는 문제다.<\/li>\n<li>일부 자산군은 매우 효율적이고 대부분 아래와 같은 특징을 가지고 있다.<ul>\n<li>자산군이 잘 알려져 있고 이를 추종하는 사람이 많다.<\/li>\n<li>사회적으로 용납되고, 논란의 여지가 없으며, 금기시되지 않는다.<\/li>\n<li>적어도 표면상으로 자산의 장점이 확실하고 이해하기도 쉽다.<\/li>\n<li>자산군과 그 구성 요소에 대한 정보가 공평하게 공개된다.<\/li>\n<\/ul>\n<\/li>\n<li>환율로 예를 들자면 통화 대 통화의 흐름을 결정하는 것은 미래 성장률과 물가상승률이고 어떤 한 사람이 다른 사람들보다 이에 대해 훨씬 더 많이 아는 것이 불가능하다.<\/li>\n<li>2차적 사고를 하는 사람들은 우수한 성과를 올리기 위해 자신이 각각의 정보나 분석, 또는 두 가지 모두에서 더 탁월한 능력이 있어야 한다는 것을 알고 판단 착오를 하지 않기 위해 조심한다.<\/li>\n<li>투자와 관련된 판단을 할 때 하는 첫 번째 질문은 \"그건 누구나 다 아는 내용 아닌가요?\"<\/li>\n<li>2차적 사고를 하는 사람들의 이론에는 비효율성이 존재한다. 시장이 투자자에게 기회가 될 수도 있는 실수를 종종 한다는 말이다.<\/li>\n<li>시장의 실수는 바로 객관성과 관련이 되어 있고 탐욕, 공포, 시기 그 밖에 다른 감정에 영향을 받는 인간은 커다란 실수를 할 수 있다.<\/li>\n<li>비효율적 시장은 아래와 같이 특징지을 수 있다.<ul>\n<li>정보 입수와 분석이 매우 불완전하기 때문에, 시장 가격이 때로 자산의 내재가치보다 훨씬 높거나 훨씬 낮은 경우가 생길 수 있다.<\/li>\n<li>자산은 종종 공정하지 않은 가격으로 평가되기 때문에, 하나의 자산군이 다른 자산군에 비해 지나치게 높거나 지나치게 낮은 위험 조정 수익을 낼 수 있다.<\/li>\n<li>상당히 잘못된 평가가 있을 수 있고, 기술, 통찰력, 정보 접근 등에 있어서 시장 참가자들 간에 차이가 있기 때문에, 잘못된 평가를 발견하고 그로부터 지속적으로 이익을 취할 수 있는 가능성이 있다.<\/li>\n<li>비효율적 시장 참가자들은 기술의 차이를 바탕으로 어떤 이들은 승자가 되고, 어떤 이들은 패자가 되는 근본적인 원인, 잘못된 가격을 제공한다.<\/li>\n<li>비효율적 시장에서 누군가가 매수를 잘했다면, 다른 누군가가 너무 싸게 팔았다는 의미이다.<\/li>\n<li>모든 게임에는 얼간이가 한 명씩 있는데, 당신이 45분 동안 게임을 하고도 누가 얼간이인지 알아내지 못했다면, 얼간이는 바로 당신이다.<\/li>\n<\/ul>\n<\/li>\n<li>어떤 시장도 완전히 효율적이거나 비효율적이지 않고 단지 정도의 문제일 뿐이다.<\/li>\n<li>시장 비효율성이 제공하는 투자 기회를 높게 평가하지만, 동시에 시장 효율성도 존중하고 특히 주류 증권시장은 매우 효율적이어서 이 안에서 투자 우위를 찾으려는 노력은 대부분 시간 낭비일 가능성이 크다.<\/li>\n<li>기본적으로 시장은 효율적이며, 이는 초과 수익 창출을 어렵게 만든다고 가정하는 것이 원칙이나 특정한 상황에서 시장이 비효율적이라는 확실한 근거가 있다면 그 기회를 활용할 수 있다.<\/li>\n<li>시장의 실수와 가격 오류가 이미 투자자들에 의해 제거된 것은 아닌지, 아직 시장에 비효율성이 남아 있다면 그 이유는 무엇인가? 라는 질문을 해야 한다.<ul>\n<li>가격을 올릴 만반의 준비가 된 투자자들이 다수 있음에도 불구하고 저가 매수의 기회가 존재해야 하는 이유는 무엇인가?<\/li>\n<li>리스크에 비해 수익이 매우 높다면 보이지 않는 리스크를 간과하고 있는 것은 아닌가?<\/li>\n<li>자산을 팔려는 사람이 당신에게 초과 수익을 제공할 수 있는 가격에 왜 자산을 내놓으려 하겠는가?<\/li>\n<li>자산을 매각하는 사람보다 당신이 정말로 그 자산에 대해 더 많이 알고 있는가?<\/li>\n<li>정말 괜찮은 제안이라면 왜 다른 누군가가 이미 채가지 않았는가?<\/li>\n<\/ul>\n<\/li>\n<li>지금 효율성이 존재한다고 해서 앞으로도 계속 그럴 것이라고 생각해서는 안 된다는 것이다.<\/li>\n<li>비효율성은 성공적인 투자를 위한 필요조건이며 기본 프로세스에 존재하는 비효율성을, 즉 불완전성과 잘못된 가격을 이용할 수 있어야 한다.<\/li>\n<li>비효율성이 존재한다고 해도 그것만으로 초과 성과가 나오는 충분조건은 될 수 없고 가격이 공정하지 않고 실수가 있을 수 있기에 어떤 자산은 가격이 너무 낮고 어떤 자산은 너무 높을 수 있다.<\/li>\n<li>이때 비싼 것보다 싼 것을 꾸준히 매입하기 위해서는 다른 투자자들보다 통찰력에서 앞서야 최고의 투자 대상을 발견할 수 있다.<\/li>\n<li>모험을 하지 않을 사람들의 기권이 모험을 할 사람들에게 기회를 줄 것이다.<\/li>\n<li>시장 효율성의 개념에도 일리가 있으므로, 노력과 기술이 최고의 결과를 약속하는 비교적 비효율적인 시장에서도 노력을 제한할 필요가 있다는 결론이다.<\/li>\n<li>이론이 우리의 결정에 필요한 정보를 제공해야지 결정을 좌우해서는 안 된다고 생각하지만 이론을 전적으로 무시한다면 큰 실수를 저지를 수 있다.<\/li>\n<li>다른 사람들보다 많이 아는 것이 가능하고, 투자 인구가 조밀한 시장을 계속 이기는 것이 가능하다는 생각은 스스로에게 독이 될 수 있다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 막스는 시장 비효율을 믿지만, 효율성을 과소평가하지 말라고 경고한다.<\/li>\n<li>[추론] 이 장의 핵심은 “어디서나 알파를 찾겠다”가 아니라 “효율적인 곳에서는 겸손하고, 비효율적인 곳에서는 선택적으로 공격하라”다.<\/li>\n<li>[현대 적용] 상장 대형주·거시 예측처럼 경쟁이 밀집된 영역은 평균 회귀가 강하고, 구조적 강제매도·이해 부족·비인기 영역은 선택적 기회를 만들 수 있다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 정보는 누구나 이미 알고 있는가?<\/li>\n<li>이 시장에서 내가 평균보다 더 잘할 근거는 무엇인가?<\/li>\n<li>왜 이 가격 오류가 아직 남아 있는가?<\/li>\n<li>상대방이 파는 이유는 무엇이며, 그 이유가 정보 우위인가 구조적 강제인가?<\/li>\n<li>높은 기대수익처럼 보이는 것이 사실은 높은 숨은 리스크는 아닌가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 보글(주류 시장 효율 존중), 그레이엄(미스터 마켓의 오판), 린치(비주류 정보의 실마리), 코스톨라니(군중심리의 가격 왜곡).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 시장이 비효율적이라는 말은 “쉽게 이길 수 있다”는 뜻이 아니다.<\/li>\n<li>[추론] 비효율은 필요조건일 뿐 충분조건이 아니다. 우위 없는 비관습 투자는 그냥 비관습적 실수일 수 있다.<\/li>\n<\/ul>","text":"기존 노트 이론적으로는 이론과 실제 사이에 차이가 없지만, 실제로는 차이가 있다. (요기 베라) 효율적 시장가설이 주장하는 것 시장에는 많은 참가자가 있으며, 이들은 관련 정보에 대체로 균등하게 접근하고 이들은 현명하고, 객관적이며, 의욕이 넘치고 노력을 아끼지 않는다. 이들이 사용하는 분석 모델은 널리 알려져 있고, 이미 사용하고 있다. 시장 참가자들의 집단적인 노력 때문에 각 자산의 시장 가격에 모든 정보가 즉시, 그리고 충분히 반영되며 이들이 지나치게 저가인 자산은 즉시 매수하고, 반대로 너무 고가인 자산은 즉시 매도할 것이기 때문에 자산 가격은 공정하게 매겨진다. 시장 가격은 자산의 내재가치를 정확하게 평가한 것이며 어떤 참가자도 평가가 잘못된 경우를 지속적으로 발견하여 그로부터 이익을 보는 일은 있을 수 없다. 자산은 다른 자산과 비교하여 적정한 위험 조정 수익을 낼 것으로 기대되는 가격에 팔리며 위험 자산일수록 매수자의 관심을 유발하기 위해 높은 수익을 제시해야 한다. 리스크가 증가하지 않으면 수익도 증가하지 않을 것이다. 투자자들은 모든 새로운 정보를 평가할 때 최선의 노력을 기울이기 때문에 자산 가격은 해당 정보의 중요도에 대한 시장의 관점을 즉각 반영한다는 데 동의한다. 그러나 이런 시장의 견해가 꼭 맞을 것이라고 생각하지는 않는다. 시장을 이기기 위해서는 독창적이고 차별화된 시각, 즉 시장의 예측과 다른 견해를 가져야만 한다. 핵심은 좀 더 효율적인 시장이 종종 자산을 잘못 평가하더라도, 시장의 예측과 다르면서 좀 더 정확한 견해를 지속적으로 갖기란 쉽지 않다는 점이다. 시장이 옳지 않더라도 주류 시장을 이기기가 몹시 어려운 이유는 대부분 다른 사람들과 같은 정보를 가지고 같은 심리적 영향을 받기 때문이다. 세상에 공짜 점심은 없다. 즉 위험을 무분별하게 수용해서는 절대로 안 된다. 정말로 시장을 이길 수 없는가? 라는 질문에 답도 \"예\", \"아니오\"로 대답할 수 없는 문제다. 일부 자산군은 매우 효율적이고 대부분 아래와 같은 특징을 가지고 있다. 자산군이 잘 알려져 있고 이를 추종하는 사람이 많다. 사회적으로 용납되고, 논란의 여지가 없으며, 금기시되지 않는다. 적어도 표면상으로 자산의 장점이 확실하고 이해하기도 쉽다. 자산군과 그 구성 요소에 대한 정보가 공평하게 공개된다. 환율로 예를 들자면 통화 대 통화의 흐름을 결정하는 것은 미래 성장률과 물가상승률이고 어떤 한 사람이 다른 사람들보다 이에 대해 훨씬 더 많이 아는 것이 불가능하다. 2차적 사고를 하는 사람들은 우수한 성과를 올리기 위해 자신이 각각의 정보나 분석, 또는 두 가지 모두에서 더 탁월한 능력이 있어야 한다는 것을 알고 판단 착오를 하지 않기 위해 조심한다. 투자와 관련된 판단을 할 때 하는 첫 번째 질문은 \"그건 누구나 다 아는 내용 아닌가요?\" 2차적 사고를 하는 사람들의 이론에는 비효율성이 존재한다. 시장이 투자자에게 기회가 될 수도 있는 실수를 종종 한다는 말이다. 시장의 실수는 바로 객관성과 관련이 되어 있고 탐욕, 공포, 시기 그 밖에 다른 감정에 영향을 받는 인간은 커다란 실수를 할 수 있다. 비효율적 시장은 아래와 같이 특징지을 수 있다. 정보 입수와 분석이 매우 불완전하기 때문에, 시장 가격이 때로 자산의 내재가치보다 훨씬 높거나 훨씬 낮은 경우가 생길 수 있다. 자산은 종종 공정하지 않은 가격으로 평가되기 때문에, 하나의 자산군이 다른 자산군에 비해 지나치게 높거나 지나치게 낮은 위험 조정 수익을 낼 수 있다. 상당히 잘못된 평가가 있을 수 있고, 기술, 통찰력, 정보 접근 등에 있어서 시장 참가자들 간에 차이가 있기 때문에, 잘못된 평가를 발견하고 그로부터 지속적으로 이익을 취할 수 있는 가능성이 있다. 비효율적 시장 참가자들은 기술의 차이를 바탕으로 어떤 이들은 승자가 되고, 어떤 이들은 패자가 되는 근본적인 원인, 잘못된 가격을 제공한다. 비효율적 시장에서 누군가가 매수를 잘했다면, 다른 누군가가 너무 싸게 팔았다는 의미이다. 모든 게임에는 얼간이가 한 명씩 있는데, 당신이 45분 동안 게임을 하고도 누가 얼간이인지 알아내지 못했다면, 얼간이는 바로 당신이다. 어떤 시장도 완전히 효율적이거나 비효율적이지 않고 단지 정도의 문제일 뿐이다. 시장 비효율성이 제공하는 투자 기회를 높게 평가하지만, 동시에 시장 효율성도 존중하고 특히 주류 증권시장은 매우 효율적이어서 이 안에서 투자 우위를 찾으려는 노력은 대부분 시간 낭비일 가능성이 크다. 기본적으로 시장은 효율적이며, 이는 초과 수익 창출을 어렵게 만든다고 가정하는 것이 원칙이나 특정한 상황에서 시장이 비효율적이라는 확실한 근거가 있다면 그 기회를 활용할 수 있다. 시장의 실수와 가격 오류가 이미 투자자들에 의해 제거된 것은 아닌지, 아직 시장에 비효율성이 남아 있다면 그 이유는 무엇인가? 라는 질문을 해야 한다. 가격을 올릴 만반의 준비가 된 투자자들이 다수 있음에도 불구하고 저가 매수의 기회가 존재해야 하는 이유는 무엇인가? 리스크에 비해 수익이 매우 높다면 보이지 않는 리스크를 간과하고 있는 것은 아닌가? 자산을 팔려는 사람이 당신에게 초과 수익을 제공할 수 있는 가격에 왜 자산을 내놓으려 하겠는가? 자산을 매각하는 사람보다 당신이 정말로 그 자산에 대해 더 많이 알고 있는가? 정말 괜찮은 제안이라면 왜 다른 누군가가 이미 채가지 않았는가? 지금 효율성이 존재한다고 해서 앞으로도 계속 그럴 것이라고 생각해서는 안 된다는 것이다. 비효율성은 성공적인 투자를 위한 필요조건이며 기본 프로세스에 존재하는 비효율성을, 즉 불완전성과 잘못된 가격을 이용할 수 있어야 한다. 비효율성이 존재한다고 해도 그것만으로 초과 성과가 나오는 충분조건은 될 수 없고 가격이 공정하지 않고 실수가 있을 수 있기에 어떤 자산은 가격이 너무 낮고 어떤 자산은 너무 높을 수 있다. 이때 비싼 것보다 싼 것을 꾸준히 매입하기 위해서는 다른 투자자들보다 통찰력에서 앞서야 최고의 투자 대상을 발견할 수 있다. 모험을 하지 않을 사람들의 기권이 모험을 할 사람들에게 기회를 줄 것이다. 시장 효율성의 개념에도 일리가 있으므로, 노력과 기술이 최고의 결과를 약속하는 비교적 비효율적인 시장에서도 노력을 제한할 필요가 있다는 결론이다. 이론이 우리의 결정에 필요한 정보를 제공해야지 결정을 좌우해서는 안 된다고 생각하지만 이론을 전적으로 무시한다면 큰 실수를 저지를 수 있다. 다른 사람들보다 많이 아는 것이 가능하고, 투자 인구가 조밀한 시장을 계속 이기는 것이 가능하다는 생각은 스스로에게 독이 될 수 있다. [구조화] [막스 본문] 막스는 시장 비효율을 믿지만, 효율성을 과소평가하지 말라고 경고한다. [추론] 이 장의 핵심은 “어디서나 알파를 찾겠다”가 아니라 “효율적인 곳에서는 겸손하고, 비효율적인 곳에서는 선택적으로 공격하라”다. [현대 적용] 상장 대형주·거시 예측처럼 경쟁이 밀집된 영역은 평균 회귀가 강하고, 구조적 강제매도·이해 부족·비인기 영역은 선택적 기회를 만들 수 있다. [실전 질문] 이 정보는 누구나 이미 알고 있는가? 이 시장에서 내가 평균보다 더 잘할 근거는 무엇인가? 왜 이 가격 오류가 아직 남아 있는가? 상대방이 파는 이유는 무엇이며, 그 이유가 정보 우위인가 구조적 강제인가? 높은 기대수익처럼 보이는 것이 사실은 높은 숨은 리스크는 아닌가? [다른 책과의 연결] [후대 해석] 강한 연결: 보글(주류 시장 효율 존중), 그레이엄(미스터 마켓의 오판), 린치(비주류 정보의 실마리), 코스톨라니(군중심리의 가격 왜곡). [오해 방지] [추론] 시장이 비효율적이라는 말은 “쉽게 이길 수 있다”는 뜻이 아니다. [추론] 비효율은 필요조건일 뿐 충분조건이 아니다. 우위 없는 비관습 투자는 그냥 비관습적 실수일 수 있다."},{"i":4,"title":"03. 가치란 무엇인가?","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>투자에서 확실히 성공하려면, 가장 먼저 내재가치의 정확한 평가가 이루어져야 하고 정확한 내재가치 평가 없이 투자자로서 지속적인 성공을 희망하는 것은 말 그대로 희망일 뿐이다.<\/li>\n<li>가장 오래되고 가장 단순한 투자 규칙이 있는데 \"그것은 바로 싸게 사서 비싸게 팔라\"는 것이다.<\/li>\n<li>비싼 것과 싼 것에 객관적인 기준이 있어야 하는데 그 기준은 자산의 내재가치를 바탕으로 할 때 가장 효과적이다.<\/li>\n<li>내재가치보다 싼 가격에 사서 그보다 비싸게 팔면 된다.<\/li>\n<li>내재가치는 기업의 가치를 분석하는 기본적 분석과 증권 가격의 동향을 분석하는 기술적 분석 크게 두 가지 기본적인 유형으로 나뉠 수 있다.<\/li>\n<li>투자에는 두 가지 기본적인 선택이 가능하다. 증권의 기본적인 내재가치를 분석해서 가치와 동떨어질 때 매매하거나, 미래의 증권 가격 동향을 예측하여 매매를 결정하는 것이다.<\/li>\n<li>기술적 분석 또는 과거의 주가 동향 분석은 오래전부터 꾸준히 실시되어 왔지만 현재는 하향세에 있고 그 이유 중 하나는 랜덤워크 가설에 있다.<\/li>\n<li>기술적 분석과 마찬가지로 과거의 주가 동향에 의지하는 또 다른 유형으로 주가 흐름을 좇아가는 모멘텀 투자가 있다.<\/li>\n<li>10달러에 산 주식을 11달러에 팔고 그 다음주에 다시 그 주식을 24달러에 사서 25달러에 팔아치우고 또 같은 주식을 39달러에 사서 곧바로 40달러에 파는 사람들이다.<\/li>\n<li>이 과정에서 자신의 실수를 발견하지 못한 투자자라면 더 이상 이 책을 읽는 수고를 하지 않기를 바란다.<\/li>\n<li>기본적 분석 과정에 충실하지 않은 모멘텀 투자와 같은 단순한 투자 방식을 제외하면, 우리에게는 기본적 분석에 속하는 두 가지 전략 \"가치투자\"와 \"성장투자\"가 있다.<\/li>\n<li>가치투자자의 목적은 증권 가격이 현재의 내재가치보다 쌀 때 사는 것이고, 성장투자자의 목적은 미래에 가치가 빠르게 상승할 증권을 찾는 데 있다.<\/li>\n<li>가치투자자의 현명한 투자는 내재가치 평가를 바탕으로 이루어져야 하며, 이때의 평가는 이용 가능한 모든 정보를 바탕으로 철저하게 이루어져야 한다.<\/li>\n<li>회사를 가치 있게 만드는 요소는 자원, 경영진, 공장, 소매상, 특허, 인재, 브랜드, 인지도, 성장 가능성 그리고 무엇보다 소득과 현금 유동성을 창출할 수 있는 능력이다.<\/li>\n<li>가치투자는 유형자산과 현금 유동성과 같이 실재하는 요소를 중요시하고 투자 수완이나 유행하는 방식, 장기적 성장 가능성과 같은 무형자산에는 무게를 크게 두지 않는다.<\/li>\n<li>심지어 가치투자 유형 중에는 순운전자본 투자라는 방식이 있는데 어떤 기업의 순운전자본이 시가총액보다 클 때 그 기업을 매수하는 것이다.<\/li>\n<li>가치투자가 추구하는 것은 저가 매수고 소득이나 현금 유동성, 배당금, 유형자산, 기업 가치와 같은 재무지표를 특히 눈여겨보며 이를 기반으로 주식을 싸게 매수하는 것을 중요하게 생각한다.<\/li>\n<li>성장투자는 가치투자의 인내심과 모멘텀 투자의 성급함 사이 어디쯤엔가 자리한 투자 전략이라 할 수 있고 목적은 장밋빛 미래를 가진 기업을 찾는 것이다.<\/li>\n<li>성장투자는 미래에 실현될 수도 있고 실현되지 않을 수도 있는 기업의 실적에 투자하는 것인 반면, 가치투자는 기업의 현재가치 분석을 토대로 투자하는 것이다.<\/li>\n<li>한 기업의 현재가치를 규명하려면 그 기업의 미래에 관한 견해가 필요하고, 결과적으로 예측 가능한 거시경제 환경, 경쟁력 있는 제품 개발, 과학기술의 발전 등을 고려해야만 한다.<\/li>\n<li>가치투자와 성장투자 사이에는 명확한 경계선이 존재하지 않고 두 방식 모두 기업의 미래에 대한 평가가 필수적이며, 가치투자자 또한 기업의 성장 가능성을 고려해야 한다.<\/li>\n<li>가치와 성장투자는 서로 대립하는 개념이 아니라 정도의 차이에 불과하고 가치투자는 현재의 기업 가치를 강조하지만, 결국 미래 전망을 완전히 배제할 수 없다.<\/li>\n<li>현재보다 미래를 아는 것이 더 어려우므로 성장투자자의 성공률은 낮을 수밖에 없지만, 성공하기만 하면 그로 인해 얻는 것은 더 많을 것이기 때문이다.<\/li>\n<li>가치투자에서는 가치를 정확하게 평가하는 것이 무엇보다 중요하고 정확한 평가가 없으면 가치에 비해 더 많이 지불하거나 더 적게 지불하게 될 것이다.<\/li>\n<li>가치투자를 하기로 결심하고 증권이나 자산의 내재가치를 분석한다면, 다음으로 중요한 것은 그 자산을 계속 보유하는 것이다.<\/li>\n<li>투자자로서 지속적으로 옳은 일을 하기는 어렵고 지속적으로 옳은 일을 때맞춰 하기란 아예 불가능하다.<\/li>\n<li>가치에 대한 확고한 신념이 있어야만 수익이 발생하지 않는 기간을 버텨낼 수 있다.<\/li>\n<li>시대를 너무 앞서 나가면 오히려 일을 그르칠 수 있다.<\/li>\n<li>사람들은 가격이 비쌀수록 원하지 않게 되고, 쌀수록 더 원하지만 투자 세계에서는 항상 그렇지만은 않다.<\/li>\n<li>사람들은 자신이 매수한 주식의 가격이 오를수록 더 큰 애착을 느끼고 가격이 떨어지면 애착도 줄면서 후회하기 시작한다.<\/li>\n<li>이 때문에 가격이 떨어지면 보유하거나 물타기가 어렵게 되고 하락세가 계속될 것으로 확실시 될 때 특히 그렇다.<\/li>\n<li>수익이나 배당금, 가치평가, 사업 운영에 대한 정보가 없는 투자자들은 적절한 시기에 올바른 결정을 내리기가 어렵다.<\/li>\n<li>가치평가에 대해 정확한 의견이 있으되, 그에 대한 신념이 약하면 큰 도움이 안 되고 가치평가에 대해 정확하지 않은 의견을 갖고 있으면서 신념이 확고하면 문제는 훨씬 더 심각해진다.<\/li>\n<li>진지하게 수익을 추구한다면 보다 더 실재하는 것을 기반으로 해야 하고 그 중 가장 훌륭한 후보가 바로 내재가치이다.<\/li>\n<li>내재가치의 정확한 평가는 지속적이고, 이성적이며, 잠재적으로 수익을 낼 수 있는 투자를 위해 꼭 필요한 기본요소이다.<\/li>\n<li>가치투자자들이 가장 큰 수익을 올릴 때는, 실제 가치보다 싸게 자산을 매입할 때, 물타기에 성공할 때, 자신의 분석이 옳다는 것을 입증할 때이다.<\/li>\n<li>하락장에서 수익을 내기 위해 필요한 요소 두 가지는 내재가치에 대한 자신만의 견해가 있어야 하는 것과 끝까지 그 견해를 고수하고 설사 자신이 틀렸음을 시사하는 가격 하락이 발생하더라도 자신의 견해대로 사야 한다.<\/li>\n<li>더 중요한 세 번째 요소도 있다. 그것은 바로 그 견해가 옳은 것이어야만 한다는 것이다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 가격 판단의 기준점으로서 내재가치를 세운다.<\/li>\n<li>[추론] 막스의 가치 개념은 전통적 가치주 취향보다 넓다. 핵심은 유형/현금흐름 기반의 평가 앵커를 가져 가격을 재단하는 데 있다.<\/li>\n<li>[현대 적용] 성장주든 가치주든, 결국 질문은 동일하다. “현재 가격에 어떤 미래가 이미 포함되어 있는가?”<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 기업의 내재가치를 산정할 때 가장 중요한 가치 원천은 무엇인가?<\/li>\n<li>현재 가치 평가가 가장 크게 흔들리는 가정은 무엇인가?<\/li>\n<li>성장 기대를 지불하고 있다면, 그 기대는 얼마나 이미 가격에 반영되었는가?<\/li>\n<li>내 가치 평가가 틀릴 때 가장 먼저 무너질 근거는 무엇인가?<\/li>\n<li>나는 가격 하락이 왔을 때 추가 매수할 만큼 평가 논리를 이해하고 있는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(내재가치·안전마진), 린치(사업 이해와 현장감), 보글(가치보다 가격 과열 경계), 하우절(보유 기간의 심리), 코스톨라니(가격과 심리의 분리).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 가치평가는 숫자만의 문제가 아니다. 미래 가정이 들어가므로 항상 불확실성이 포함된다.<\/li>\n<li>[추론] 성장투자와 가치투자를 이분법으로 보면 안 된다. 막스의 포인트는 현재 가격 대비 가치다.<\/li>\n<\/ul>","text":"기존 노트 투자에서 확실히 성공하려면, 가장 먼저 내재가치의 정확한 평가가 이루어져야 하고 정확한 내재가치 평가 없이 투자자로서 지속적인 성공을 희망하는 것은 말 그대로 희망일 뿐이다. 가장 오래되고 가장 단순한 투자 규칙이 있는데 \"그것은 바로 싸게 사서 비싸게 팔라\"는 것이다. 비싼 것과 싼 것에 객관적인 기준이 있어야 하는데 그 기준은 자산의 내재가치를 바탕으로 할 때 가장 효과적이다. 내재가치보다 싼 가격에 사서 그보다 비싸게 팔면 된다. 내재가치는 기업의 가치를 분석하는 기본적 분석과 증권 가격의 동향을 분석하는 기술적 분석 크게 두 가지 기본적인 유형으로 나뉠 수 있다. 투자에는 두 가지 기본적인 선택이 가능하다. 증권의 기본적인 내재가치를 분석해서 가치와 동떨어질 때 매매하거나, 미래의 증권 가격 동향을 예측하여 매매를 결정하는 것이다. 기술적 분석 또는 과거의 주가 동향 분석은 오래전부터 꾸준히 실시되어 왔지만 현재는 하향세에 있고 그 이유 중 하나는 랜덤워크 가설에 있다. 기술적 분석과 마찬가지로 과거의 주가 동향에 의지하는 또 다른 유형으로 주가 흐름을 좇아가는 모멘텀 투자가 있다. 10달러에 산 주식을 11달러에 팔고 그 다음주에 다시 그 주식을 24달러에 사서 25달러에 팔아치우고 또 같은 주식을 39달러에 사서 곧바로 40달러에 파는 사람들이다. 이 과정에서 자신의 실수를 발견하지 못한 투자자라면 더 이상 이 책을 읽는 수고를 하지 않기를 바란다. 기본적 분석 과정에 충실하지 않은 모멘텀 투자와 같은 단순한 투자 방식을 제외하면, 우리에게는 기본적 분석에 속하는 두 가지 전략 \"가치투자\"와 \"성장투자\"가 있다. 가치투자자의 목적은 증권 가격이 현재의 내재가치보다 쌀 때 사는 것이고, 성장투자자의 목적은 미래에 가치가 빠르게 상승할 증권을 찾는 데 있다. 가치투자자의 현명한 투자는 내재가치 평가를 바탕으로 이루어져야 하며, 이때의 평가는 이용 가능한 모든 정보를 바탕으로 철저하게 이루어져야 한다. 회사를 가치 있게 만드는 요소는 자원, 경영진, 공장, 소매상, 특허, 인재, 브랜드, 인지도, 성장 가능성 그리고 무엇보다 소득과 현금 유동성을 창출할 수 있는 능력이다. 가치투자는 유형자산과 현금 유동성과 같이 실재하는 요소를 중요시하고 투자 수완이나 유행하는 방식, 장기적 성장 가능성과 같은 무형자산에는 무게를 크게 두지 않는다. 심지어 가치투자 유형 중에는 순운전자본 투자라는 방식이 있는데 어떤 기업의 순운전자본이 시가총액보다 클 때 그 기업을 매수하는 것이다. 가치투자가 추구하는 것은 저가 매수고 소득이나 현금 유동성, 배당금, 유형자산, 기업 가치와 같은 재무지표를 특히 눈여겨보며 이를 기반으로 주식을 싸게 매수하는 것을 중요하게 생각한다. 성장투자는 가치투자의 인내심과 모멘텀 투자의 성급함 사이 어디쯤엔가 자리한 투자 전략이라 할 수 있고 목적은 장밋빛 미래를 가진 기업을 찾는 것이다. 성장투자는 미래에 실현될 수도 있고 실현되지 않을 수도 있는 기업의 실적에 투자하는 것인 반면, 가치투자는 기업의 현재가치 분석을 토대로 투자하는 것이다. 한 기업의 현재가치를 규명하려면 그 기업의 미래에 관한 견해가 필요하고, 결과적으로 예측 가능한 거시경제 환경, 경쟁력 있는 제품 개발, 과학기술의 발전 등을 고려해야만 한다. 가치투자와 성장투자 사이에는 명확한 경계선이 존재하지 않고 두 방식 모두 기업의 미래에 대한 평가가 필수적이며, 가치투자자 또한 기업의 성장 가능성을 고려해야 한다. 가치와 성장투자는 서로 대립하는 개념이 아니라 정도의 차이에 불과하고 가치투자는 현재의 기업 가치를 강조하지만, 결국 미래 전망을 완전히 배제할 수 없다. 현재보다 미래를 아는 것이 더 어려우므로 성장투자자의 성공률은 낮을 수밖에 없지만, 성공하기만 하면 그로 인해 얻는 것은 더 많을 것이기 때문이다. 가치투자에서는 가치를 정확하게 평가하는 것이 무엇보다 중요하고 정확한 평가가 없으면 가치에 비해 더 많이 지불하거나 더 적게 지불하게 될 것이다. 가치투자를 하기로 결심하고 증권이나 자산의 내재가치를 분석한다면, 다음으로 중요한 것은 그 자산을 계속 보유하는 것이다. 투자자로서 지속적으로 옳은 일을 하기는 어렵고 지속적으로 옳은 일을 때맞춰 하기란 아예 불가능하다. 가치에 대한 확고한 신념이 있어야만 수익이 발생하지 않는 기간을 버텨낼 수 있다. 시대를 너무 앞서 나가면 오히려 일을 그르칠 수 있다. 사람들은 가격이 비쌀수록 원하지 않게 되고, 쌀수록 더 원하지만 투자 세계에서는 항상 그렇지만은 않다. 사람들은 자신이 매수한 주식의 가격이 오를수록 더 큰 애착을 느끼고 가격이 떨어지면 애착도 줄면서 후회하기 시작한다. 이 때문에 가격이 떨어지면 보유하거나 물타기가 어렵게 되고 하락세가 계속될 것으로 확실시 될 때 특히 그렇다. 수익이나 배당금, 가치평가, 사업 운영에 대한 정보가 없는 투자자들은 적절한 시기에 올바른 결정을 내리기가 어렵다. 가치평가에 대해 정확한 의견이 있으되, 그에 대한 신념이 약하면 큰 도움이 안 되고 가치평가에 대해 정확하지 않은 의견을 갖고 있으면서 신념이 확고하면 문제는 훨씬 더 심각해진다. 진지하게 수익을 추구한다면 보다 더 실재하는 것을 기반으로 해야 하고 그 중 가장 훌륭한 후보가 바로 내재가치이다. 내재가치의 정확한 평가는 지속적이고, 이성적이며, 잠재적으로 수익을 낼 수 있는 투자를 위해 꼭 필요한 기본요소이다. 가치투자자들이 가장 큰 수익을 올릴 때는, 실제 가치보다 싸게 자산을 매입할 때, 물타기에 성공할 때, 자신의 분석이 옳다는 것을 입증할 때이다. 하락장에서 수익을 내기 위해 필요한 요소 두 가지는 내재가치에 대한 자신만의 견해가 있어야 하는 것과 끝까지 그 견해를 고수하고 설사 자신이 틀렸음을 시사하는 가격 하락이 발생하더라도 자신의 견해대로 사야 한다. 더 중요한 세 번째 요소도 있다. 그것은 바로 그 견해가 옳은 것이어야만 한다는 것이다. [구조화] [막스 본문] 이 장은 가격 판단의 기준점으로서 내재가치를 세운다. [추론] 막스의 가치 개념은 전통적 가치주 취향보다 넓다. 핵심은 유형/현금흐름 기반의 평가 앵커를 가져 가격을 재단하는 데 있다. [현대 적용] 성장주든 가치주든, 결국 질문은 동일하다. “현재 가격에 어떤 미래가 이미 포함되어 있는가?” [실전 질문] 이 기업의 내재가치를 산정할 때 가장 중요한 가치 원천은 무엇인가? 현재 가치 평가가 가장 크게 흔들리는 가정은 무엇인가? 성장 기대를 지불하고 있다면, 그 기대는 얼마나 이미 가격에 반영되었는가? 내 가치 평가가 틀릴 때 가장 먼저 무너질 근거는 무엇인가? 나는 가격 하락이 왔을 때 추가 매수할 만큼 평가 논리를 이해하고 있는가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(내재가치·안전마진), 린치(사업 이해와 현장감), 보글(가치보다 가격 과열 경계), 하우절(보유 기간의 심리), 코스톨라니(가격과 심리의 분리). [오해 방지] [추론] 가치평가는 숫자만의 문제가 아니다. 미래 가정이 들어가므로 항상 불확실성이 포함된다. [추론] 성장투자와 가치투자를 이분법으로 보면 안 된다. 막스의 포인트는 현재 가격 대비 가치다."},{"i":5,"title":"04. 가격과 가치 사이의 관계를 이해하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>투자의 성공은 좋은 자산을 사는 것이 아니라, \"자산을 잘 사는 것에서 나온다.\"<\/li>\n<li>앞으로 어떤 조치를 취해야 할지 알기 위해서는 자산 가격을 가치와 비교해서 볼 수 있어야 하고 가치와 가격 사이에 건전한 관계를 확립하는 것은 성공적인 투자의 핵심이다.<\/li>\n<li>가치투자자에게 투자의 시작은 가격이어야 하고 너무 비싸게 매입하고도 나쁜 투자는 아닐 만큼 좋은 자산은 없으며, 충분히 싸게 매입하고도 좋은 투자가 아닐 만큼 나쁜 자산은 없다.<\/li>\n<li>가격의 적정성에 대해 신중하게 고려하지 않고 투자를 결정하는 것은 참으로 어리석은 일이지만 사람들은 소유하고 싶은 것의 가치를 평가함에 있어 충분히 고려하지 않고 매입을 결정해 버린다.<\/li>\n<li>어떤 것을 내재가치에 맞는 가격을 주고 사는 것은 사실 크게 자랑할 일이 아니다. 하지만 가치에 비해 더 많이 지불하는 것은 실수임에 틀림없다.<\/li>\n<li>잘 사기만 하면 절반은 판 것이나 다름없다. 보유 자산을 얼마에, 언제, 누구에게, 어떤 방법으로 팔지에 대해 고심하느라 많은 시간을 보내지 않아도 된다는 의미이다.<\/li>\n<li>자산을 저가에 매수했다면 위의 문제들은 저절로 해결될 것이고 내재가치의 평가가 정확하다면, 시간이 흐르면서 자산의 가격이 자산의 가치와 부합되어야 한다.<\/li>\n<li>기업의 가치는 얼마나 될까? 이 한마디로 가치투자의 핵심을 요약할 수 있다. 기업의 철학, 사업이 좋아서 주식을 사는 것만으로는 충분하지 않고 합리적인 가격 혹은 싼 가격에 사야만 한다.<\/li>\n<li>대부분의 경우 증권 가격은 내재가치 외에도 두 가지 요인의 영향을 받는데 특히 단기 등락은 심리적 요인과 기술적 요인이 주로 결정한다.<\/li>\n<li>기술적 요인은 기본적 가치와 무관한 요소이고 증권의 수요와 공급에 영향을 미친다. 대부분의 투자자는 기술적 요인에 대해 잘 알지 못한다.<\/li>\n<li>강제 청산, 뮤추얼 펀드로의 대규모 자금 유입으로 인해 포트폴리오 매니저들이 매수를 강행해야 하는 등의 상황이 기술적 요인의 예이다.<\/li>\n<li>단언하건대, 이 기간 동안 가격에 상관없이 강제로 매각해야 하는 사람으로부터 매수하는 것보다 더 좋은 것은 없고 우리가 했던 최고의 거래들 중에 많은 경우가 이런 식으로 일어났다.<\/li>\n<li>어쩔 수 없이 매도하는 사람에게 매수하고 어쩔 수 없이 매수해야 하는 사람에게 매도하는 상황은 흔치 않으며 극단적인 상황에만 일어난다.<\/li>\n<li>최악의 시기에도 상황을 잘 정리하여 주식을 팔지 않고 보유할 수 있어야 하는데 그러기 위해서는 장기 자본과 강한 의지력이 필요하다.<\/li>\n<li>심리의 중요성에 대해서는 아무리 강조해도 지나치지 않다.<\/li>\n<li>가치를 평가하는 핵심이 숙련된 재무 분석에 있는 반면, 가격과 가치의 관계를 이해하는 핵심은 대체로 다른 투자자들의 심리를 간파하는 데 있다.<\/li>\n<li>중요한 것은 현재 누가 이 투자 대상에 관심을 두고 있으며, 누가 관심을 두지 않는가이다.<\/li>\n<li>아무도 관심을 보이지 않을 때 사는 것이 가장 안전하고 잠재 수익도 가장 높다. 충분한 시간을 두고 기다리면 투자 대상의 인기, 가격 등이 오를 수밖에 없다.<\/li>\n<li>투자자 심리가 매우 중요하면서도, 완벽하게 파악하기가 극도로 어려운 영역이라는 것은 여전히 확실하다.<\/li>\n<li>내재가치는 당신의 증권을 사는 날 증권 가격을 결정하는 요인 중에 하나일 뿐이라는 점을 반드시 이해하고, 심리와 기술적 요인을 자신의 이점으로 활용할 수 있어야 한다.<\/li>\n<li>소수의 현명한 투자자들이 정확한 통찰력으로 자산에 투자하여 수익을 내기 시작하면 다른 사람들이 이 상황에 대해 파악하거나 아니면 단순히 돈을 버는 것을 알고서 현명한 투자자들을 따라 사면서 자산의 가격은 오른다.<\/li>\n<li>가격이 좀 더 오르면서 투자자들이 쉽게 돈을 벌 수 있을 거라는 가능성에 격앙되어 시장 가격이 적당한지에 대해서는 점차 생각하지 않고 극단적인 상황이 발생한다.<\/li>\n<li>어떤 물건의 가격이 오르면 사람들이 이를 덜 찾기 마련이지만, 투자에서는 가격이 오를수록 더 찾는 경향이 있다.<\/li>\n<li>더 큰 바보 이론에도 한계가 있고 추후 가치에 대한 평가가 작동되기 시작하면서 궁지에 몰린 사람들은 자신들이 초래한 결과를 받아들여야만 한다.<\/li>\n<li>주식의 긍정적인 면들이 진짜라고 해도, 가치보다 큰 금액을 지불하면 손실이 발생할 수 있다.<\/li>\n<li>그런 긍정적인 면들, 그리고 다른 사람들이 누리고 있는 것으로 보이는 엄청난 수익 때문에 테크주를 사지 않겠다고 결심한 사람들도 결국엔 굴복하게 된다.<\/li>\n<li>자산 관련 종목, 집단, 시장의 고점은 시장 참가를 거부했던 마지막 한 사람이 주식을 사면서 찍게 된다. 그 시기는 대체로 주식의 내재가치 변화와 무관하다.<\/li>\n<li>\"가격이 너무 비싸\"는 \"이제 떨어질 거야\"와 같은 말이 아니다. 비싼 가격이 오래갈 수도 있고, 그보다 더 비싸질 수도 있다.<\/li>\n<li>결국, 그래도 내재가치가 문제가 된다.<\/li>\n<li>\"받을 수 있는 만큼 다 받는군. 하지만 더 오르겠지\" 이런 근거를 바탕으로 매수하거나 보유하는 것은 극도로 위험하며, 결국 거품이 발생한다.<\/li>\n<li>거품이 발생하면 시장 모멘텀의 열풍이 가치와 적정가가 있던 자리를 차지하고, 탐욕은 분별력을 흐린다.<\/li>\n<li>확실한 가치를 기반으로 한 투자 전략이 가장 신뢰할 만하고 반대로 가치를 무시한 채 이익만을 위해 다른 어떤 것에 의지하는 방법은 가장 신뢰할 수 없는 방법이다.<\/li>\n<li>투자수익을 낼 수 있는 몇 가지 방법은 다음과 같다.<ul>\n<li>자산의 내재가치 상승으로 얻는 혜택: 가치 상승을 정확히 예측하기 어렵고 상승 잠재력에 대한 일반적인 견해가 자산 가격에 대체로 반영되기 때문에, 당신의 견해가 시장이나 직장 상사의 견해와 다르지 않다면 당신은 이미 그런 잠재력에 대해 비용을 지불하고 있을 가능성이 크다.<\/li>\n<li>레버리지 이용: 레버리지를 이용한다고 해서 더 나은 투자가 되는 것은 아니며 수익 가능성을 증가시키지도 않고 수익이나 손실을 확대시킬 뿐이다.<\/li>\n<li>가진 자산을 가치보다 비싸게 매각: 적정 가격이나 너무 고가인 자산에 가치 상승을 기대하는 것은 매입자의 입장에서 보면 불합리한 상황을 요구하는 것이다.<\/li>\n<li>가치에 비해 저가로 사는 것: 이 방법이 가장 믿을 수 있는 수익 창출 수단이고 이 경우 뜻밖의 행운을 필요로 하지 않고 단지 시장 참여자가 현실을 직시하는 것이 필요할 뿐이다.<\/li>\n<\/ul>\n<\/li>\n<li>투자수익을 낼 수 있는 모든 방법들 중에 저가 매수가 가장 신뢰할 만하다는 말을 위해서 했지만 이조차도 확실한 것은 아니며 그 이유는 현재가치에 대해 잘못 평가할 수도 있고, 가치를 하락시키는 사건이 발생할 수도 있기 때문이다.<\/li>\n<li>사고방식이나 시장이 퇴보하여 자산이 가치보다 훨씬 못 미치는 가격에 팔릴 수도 있고 가격과 내재가치가 하나로 합쳐지는 데 생각보다 오랜 시간이 걸릴 수도 있다.<\/li>\n<li>시장은 생각만큼 합리적이지 않아서, 당신의 부채 상환 능력이 바닥날 때까지 비합리적인 상태로 있을 수 있다.<\/li>\n<li>가치보다 싸게 사려는 노력이 실패할 때도 있지만, 그것이 우리가 할 수 있는 최선의 선택이다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 좋은 자산보다 좋은 매입이 중요하다는 장이다.<\/li>\n<li>[추론] 3장 <code>가치<\/code>가 측정이라면, 4장은 실행이다. 같은 가치도 가격에 따라 완전히 다른 투자 결과를 낳는다.<\/li>\n<li>[현대 적용] 가격 형성에는 펀더멘털 외에도 수급, 강제매매, 유행, FOMO가 개입한다. 따라서 투자 메모에는 반드시 “가격을 움직이는 비펀더멘털 요인” 항목이 필요하다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>지금 가격은 내재가치 대비 얼마나 할인 또는 할증되어 있는가?<\/li>\n<li>이 가격을 만든 심리적 요인은 무엇인가?<\/li>\n<li>강제매도·강제매수 주체가 존재하는가?<\/li>\n<li>비싼데 더 비싸질 수 있는 구간에서 내가 버틸 의사결정 원칙은 무엇인가?<\/li>\n<li>내가 기대하는 수익 원천은 가치 상승인가, 멀티플 확장인가, 단순한 유동성인가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(가격-가치 분리), 코스톨라니(군중과 가격), 하우절(심리적 과열), 린치(좋은 회사라도 비싸면 나쁜 투자), 보글(가격 과열을 장기 수익률이 교정).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] “싸다”는 최근 주가가 많이 떨어졌다는 뜻이 아니라 가치 대비 낮다는 뜻이다.<\/li>\n<li>[추론] “비싸다”는 즉시 하락을 뜻하지 않는다. 막스는 가치 판단과 타이밍 판단을 엄격히 구분한다.<\/li>\n<\/ul>","text":"기존 노트 투자의 성공은 좋은 자산을 사는 것이 아니라, \"자산을 잘 사는 것에서 나온다.\" 앞으로 어떤 조치를 취해야 할지 알기 위해서는 자산 가격을 가치와 비교해서 볼 수 있어야 하고 가치와 가격 사이에 건전한 관계를 확립하는 것은 성공적인 투자의 핵심이다. 가치투자자에게 투자의 시작은 가격이어야 하고 너무 비싸게 매입하고도 나쁜 투자는 아닐 만큼 좋은 자산은 없으며, 충분히 싸게 매입하고도 좋은 투자가 아닐 만큼 나쁜 자산은 없다. 가격의 적정성에 대해 신중하게 고려하지 않고 투자를 결정하는 것은 참으로 어리석은 일이지만 사람들은 소유하고 싶은 것의 가치를 평가함에 있어 충분히 고려하지 않고 매입을 결정해 버린다. 어떤 것을 내재가치에 맞는 가격을 주고 사는 것은 사실 크게 자랑할 일이 아니다. 하지만 가치에 비해 더 많이 지불하는 것은 실수임에 틀림없다. 잘 사기만 하면 절반은 판 것이나 다름없다. 보유 자산을 얼마에, 언제, 누구에게, 어떤 방법으로 팔지에 대해 고심하느라 많은 시간을 보내지 않아도 된다는 의미이다. 자산을 저가에 매수했다면 위의 문제들은 저절로 해결될 것이고 내재가치의 평가가 정확하다면, 시간이 흐르면서 자산의 가격이 자산의 가치와 부합되어야 한다. 기업의 가치는 얼마나 될까? 이 한마디로 가치투자의 핵심을 요약할 수 있다. 기업의 철학, 사업이 좋아서 주식을 사는 것만으로는 충분하지 않고 합리적인 가격 혹은 싼 가격에 사야만 한다. 대부분의 경우 증권 가격은 내재가치 외에도 두 가지 요인의 영향을 받는데 특히 단기 등락은 심리적 요인과 기술적 요인이 주로 결정한다. 기술적 요인은 기본적 가치와 무관한 요소이고 증권의 수요와 공급에 영향을 미친다. 대부분의 투자자는 기술적 요인에 대해 잘 알지 못한다. 강제 청산, 뮤추얼 펀드로의 대규모 자금 유입으로 인해 포트폴리오 매니저들이 매수를 강행해야 하는 등의 상황이 기술적 요인의 예이다. 단언하건대, 이 기간 동안 가격에 상관없이 강제로 매각해야 하는 사람으로부터 매수하는 것보다 더 좋은 것은 없고 우리가 했던 최고의 거래들 중에 많은 경우가 이런 식으로 일어났다. 어쩔 수 없이 매도하는 사람에게 매수하고 어쩔 수 없이 매수해야 하는 사람에게 매도하는 상황은 흔치 않으며 극단적인 상황에만 일어난다. 최악의 시기에도 상황을 잘 정리하여 주식을 팔지 않고 보유할 수 있어야 하는데 그러기 위해서는 장기 자본과 강한 의지력이 필요하다. 심리의 중요성에 대해서는 아무리 강조해도 지나치지 않다. 가치를 평가하는 핵심이 숙련된 재무 분석에 있는 반면, 가격과 가치의 관계를 이해하는 핵심은 대체로 다른 투자자들의 심리를 간파하는 데 있다. 중요한 것은 현재 누가 이 투자 대상에 관심을 두고 있으며, 누가 관심을 두지 않는가이다. 아무도 관심을 보이지 않을 때 사는 것이 가장 안전하고 잠재 수익도 가장 높다. 충분한 시간을 두고 기다리면 투자 대상의 인기, 가격 등이 오를 수밖에 없다. 투자자 심리가 매우 중요하면서도, 완벽하게 파악하기가 극도로 어려운 영역이라는 것은 여전히 확실하다. 내재가치는 당신의 증권을 사는 날 증권 가격을 결정하는 요인 중에 하나일 뿐이라는 점을 반드시 이해하고, 심리와 기술적 요인을 자신의 이점으로 활용할 수 있어야 한다. 소수의 현명한 투자자들이 정확한 통찰력으로 자산에 투자하여 수익을 내기 시작하면 다른 사람들이 이 상황에 대해 파악하거나 아니면 단순히 돈을 버는 것을 알고서 현명한 투자자들을 따라 사면서 자산의 가격은 오른다. 가격이 좀 더 오르면서 투자자들이 쉽게 돈을 벌 수 있을 거라는 가능성에 격앙되어 시장 가격이 적당한지에 대해서는 점차 생각하지 않고 극단적인 상황이 발생한다. 어떤 물건의 가격이 오르면 사람들이 이를 덜 찾기 마련이지만, 투자에서는 가격이 오를수록 더 찾는 경향이 있다. 더 큰 바보 이론에도 한계가 있고 추후 가치에 대한 평가가 작동되기 시작하면서 궁지에 몰린 사람들은 자신들이 초래한 결과를 받아들여야만 한다. 주식의 긍정적인 면들이 진짜라고 해도, 가치보다 큰 금액을 지불하면 손실이 발생할 수 있다. 그런 긍정적인 면들, 그리고 다른 사람들이 누리고 있는 것으로 보이는 엄청난 수익 때문에 테크주를 사지 않겠다고 결심한 사람들도 결국엔 굴복하게 된다. 자산 관련 종목, 집단, 시장의 고점은 시장 참가를 거부했던 마지막 한 사람이 주식을 사면서 찍게 된다. 그 시기는 대체로 주식의 내재가치 변화와 무관하다. \"가격이 너무 비싸\"는 \"이제 떨어질 거야\"와 같은 말이 아니다. 비싼 가격이 오래갈 수도 있고, 그보다 더 비싸질 수도 있다. 결국, 그래도 내재가치가 문제가 된다. \"받을 수 있는 만큼 다 받는군. 하지만 더 오르겠지\" 이런 근거를 바탕으로 매수하거나 보유하는 것은 극도로 위험하며, 결국 거품이 발생한다. 거품이 발생하면 시장 모멘텀의 열풍이 가치와 적정가가 있던 자리를 차지하고, 탐욕은 분별력을 흐린다. 확실한 가치를 기반으로 한 투자 전략이 가장 신뢰할 만하고 반대로 가치를 무시한 채 이익만을 위해 다른 어떤 것에 의지하는 방법은 가장 신뢰할 수 없는 방법이다. 투자수익을 낼 수 있는 몇 가지 방법은 다음과 같다. 자산의 내재가치 상승으로 얻는 혜택: 가치 상승을 정확히 예측하기 어렵고 상승 잠재력에 대한 일반적인 견해가 자산 가격에 대체로 반영되기 때문에, 당신의 견해가 시장이나 직장 상사의 견해와 다르지 않다면 당신은 이미 그런 잠재력에 대해 비용을 지불하고 있을 가능성이 크다. 레버리지 이용: 레버리지를 이용한다고 해서 더 나은 투자가 되는 것은 아니며 수익 가능성을 증가시키지도 않고 수익이나 손실을 확대시킬 뿐이다. 가진 자산을 가치보다 비싸게 매각: 적정 가격이나 너무 고가인 자산에 가치 상승을 기대하는 것은 매입자의 입장에서 보면 불합리한 상황을 요구하는 것이다. 가치에 비해 저가로 사는 것: 이 방법이 가장 믿을 수 있는 수익 창출 수단이고 이 경우 뜻밖의 행운을 필요로 하지 않고 단지 시장 참여자가 현실을 직시하는 것이 필요할 뿐이다. 투자수익을 낼 수 있는 모든 방법들 중에 저가 매수가 가장 신뢰할 만하다는 말을 위해서 했지만 이조차도 확실한 것은 아니며 그 이유는 현재가치에 대해 잘못 평가할 수도 있고, 가치를 하락시키는 사건이 발생할 수도 있기 때문이다. 사고방식이나 시장이 퇴보하여 자산이 가치보다 훨씬 못 미치는 가격에 팔릴 수도 있고 가격과 내재가치가 하나로 합쳐지는 데 생각보다 오랜 시간이 걸릴 수도 있다. 시장은 생각만큼 합리적이지 않아서, 당신의 부채 상환 능력이 바닥날 때까지 비합리적인 상태로 있을 수 있다. 가치보다 싸게 사려는 노력이 실패할 때도 있지만, 그것이 우리가 할 수 있는 최선의 선택이다. [구조화] [막스 본문] 좋은 자산보다 좋은 매입이 중요하다는 장이다. [추론] 3장 가치 가 측정이라면, 4장은 실행이다. 같은 가치도 가격에 따라 완전히 다른 투자 결과를 낳는다. [현대 적용] 가격 형성에는 펀더멘털 외에도 수급, 강제매매, 유행, FOMO가 개입한다. 따라서 투자 메모에는 반드시 “가격을 움직이는 비펀더멘털 요인” 항목이 필요하다. [실전 질문] 지금 가격은 내재가치 대비 얼마나 할인 또는 할증되어 있는가? 이 가격을 만든 심리적 요인은 무엇인가? 강제매도·강제매수 주체가 존재하는가? 비싼데 더 비싸질 수 있는 구간에서 내가 버틸 의사결정 원칙은 무엇인가? 내가 기대하는 수익 원천은 가치 상승인가, 멀티플 확장인가, 단순한 유동성인가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(가격-가치 분리), 코스톨라니(군중과 가격), 하우절(심리적 과열), 린치(좋은 회사라도 비싸면 나쁜 투자), 보글(가격 과열을 장기 수익률이 교정). [오해 방지] [추론] “싸다”는 최근 주가가 많이 떨어졌다는 뜻이 아니라 가치 대비 낮다는 뜻이다. [추론] “비싸다”는 즉시 하락을 뜻하지 않는다. 막스는 가치 판단과 타이밍 판단을 엄격히 구분한다."},{"i":6,"title":"05. 리스크란 무엇인가?","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>위험이란, 일어날 일보다 더 많은 일이 일어날 수 있음을 의미한다.<\/li>\n<li>투자는 정확히 한 가지로 이루어진다. 바로 미래를 상대하는 것이다.<\/li>\n<li>우리 누구도 미래에 대해 확실히 알지 못하므로 리스크를 피할 수 없어서 리스크에 대처하는 것은 투자의 필수 요소다.<\/li>\n<li>가격이 오를 투자 대상을 찾는 것은 그리 어려운 일만은 아니지만 리스크에 확실하게 대처하지 않는다면 장기간 성공하지는 못한다.<\/li>\n<li>그렇기에 첫 번째로 해야 할 일은 리스크를 이해하는 것이며 두 번째는 리스크가 높을 때 그것을 인지하는 것이고, 가장 중요한 세 번째는 리스크를 제어하는 것이다.<\/li>\n<li>리스크 평가가 투자 프로세스에서 필수적으로 다뤄야 할 요소라고 말하는 데는 세 가지 중요한 이유가 있다.<ul>\n<li>첫째, 리스크는 나쁜 것으로 간주되며, 대부분의 신중한 사람들은 이를 회피하거나 최소화하고 싶어 한다.<\/li>\n<li>특정 투자 대상을 고려하고 있는 투자자는 자신이 선택한 대상에 얼마큼의 리스크가 존재하는지, 그 리스크를 감수할 수 있을지에 대해 판단해야 한다.<\/li>\n<li>둘째, 어떤 투자 대상을 고려하는 중일 때 당신의 결정은 잠재 수익뿐만 아니라, 그에 수반되는 리스크도 직시하려는 노력을 해야 한다.<\/li>\n<li>투자자가 투자에 수반되는 절대량의 리스크를 부담할 수 있을지를 결정하는 것 이상으로 꼭 해야 할 두 번째 일은 투자수익이 그에 따르는 리스크 감수를 정당화하는지 알아내는 것이다.<\/li>\n<li>셋째, 투자 결과를 검토할 때 결과 하나만으로도 많은 것을 알 수 있기는 하지만, 투자를 하면서 감수했던 리스크 역시 꼭 평가해야 한다.<\/li>\n<li>안전vs위험, 채권vs주식, 우량주vs중소형주, 레버리지vs현금, 포트폴리오 집중vs분석 등을 평가<\/li>\n<\/ul>\n<\/li>\n<li>위험한 투자일수록 수익도 확실히 크다면, 이는 확실한 투자이지 위험한 투자가 아니기 때문에 리스크가 높을수록 수익을 많이 보장하는 것은 절대 아니다.<\/li>\n<li>자본을 유치하기 위해 리스크가 큰 투자들은 더 큰 수익을 낼 수 있다는 전망, 약속, 기대감을 제공해야만 하지만 그것이 실제 현실이 될 것인지에 대해서는 뭐라 할 말이 없다.<\/li>\n<li>리스크와 예상 수익 사이의 양의 관계뿐만 아니라, 리스크가 증가함에 따라 수익에 대한 불확실성과 손실 가능성이 증가한다는 사실을 알 수 있다.<\/li>\n<li>리스크를 정의하는 것 또한 매우 중요하며 학자가 말하는 변동성보다는 절대적으로 돈을 잃을 가능성이 리스크의 정의에 가깝다.<\/li>\n<li>현실적인 투자자들이 걱정하는 것은 영구 손실에 대한 가능성이며 리스크에는 더 많은 종류가 있으므로, 모든 종류의 리스크를 의식해야 한다.<\/li>\n<li>리스크는 다양한 유형으로 나타나고 어떤 리스크는 일부 투자자에게 문제가 되지만 나머지 투자자에게는 문제가 되지 않는 리스크도 있고 어떤 투자 대상에는 안전할 수 있지만 나머지 투자 대상에는 위험할 수 있는 리스크도 있다.<\/li>\n<li>목표에 못 미치는 것, 저조한 성과, 비유동성 등이 개인투자자들이 생각해 보아야 하는 주관적인 리스크 유형이다.<\/li>\n<li>손실 위험은 꼭 펀더멘털이 부실해서 생기는 것은 아니고 부실한 자산이라도 충분히 저가에 매입한다면 매우 성공적인 투자가 될 수도 있다.<\/li>\n<li>거시 환경 속에서 약점이 없어도 자만심, 리스크에 대한 무지, 불리한 상황 전개 등으로 리스크는 발생할 수 있다.<\/li>\n<li>그러므로 자산의 포트폴리오가 어떻게 운용되는지를 이해하는 데 시간과 노력을 들이지 않는 사람이라면 누구에게나 일어날 수 있다.<\/li>\n<li>손실 위험은 주로 지나친 낙관 심리, 그리고 그로 인해 지나치게 상승한 가격에 원인이 있다.<\/li>\n<li>가치투자자들은 어떤 자산을 가치보다 싸게 매입함으로써 고수익과 저위험이 동시에 달성될 수 있다고 믿는다.<\/li>\n<li>매출이 저조하고, 관심의 대상도 아니며, 평판이 안 좋아서 저평가된 증권의 특징을 가지는 주식은 가치투자자들이 고수익을 내기 위해 선호하는 투자 대상이다.<\/li>\n<li>이런 증권의 수익은 강세장에서 고점을 찍는 일은 드물어도 실적이 대체로 뛰어나고, 활황주의 실적보다 지속적이며, 변동성과 기본적인 리스크가 낮고, 시장이 불황일 때 손실이 더 적다는 특징이 있다.<\/li>\n<li>저가 투자 대상의 가장 큰 리스크는 과열된 강세장에서 저조한 성과를 낼 가능성에 있고 가치투자자가 떠안고 가야 할 문제이다.<\/li>\n<li>리스크가 크다는 것이 감지된 투자에 대해 투자자들이 예상 수익을 더 많이 바라야 하고 투자금 손실은 투자자들이 예상 수익에 대한 기대와, 그에 따라 투자비용을 정할 때 가장 신경 쓰이는 리스크다.<\/li>\n<li>리스크의 평가는 견해상의 문제일 뿐이고 학식과 전문적인 기술을 이용하여 미래를 추정해도 추정은 추정일 뿐이다.<\/li>\n<li>계량적 기준은 존재하지 않고 모든 투자자들의 의견은 각자 달라서 리스크와, 리스크수익에 대한 결정을 컴퓨터에 전가할 수 없다.<\/li>\n<li>\"다른 종류의 투자 대상들과 각각의 손실 위험 사이의 관계는 너무나 막연하고 변동이 심해서 수학 공식 같을 수 없다.\"<\/li>\n<li>리스크는 믿을 수 없고 반복되는 사건이 또다시 일어날 가능성처럼 일반적인 사항들은 계산에 넣기 쉽지만, 이례적이고 일생에 한 번 있을까 말까 한 사건들은 계량화하기 힘들다.<\/li>\n<li>요약하면 미래를 예측할 때 많은 리스크가 주관적이고, 보이지 않으며, 계량화될 수 없다는 것이다.<\/li>\n<li>손실 위험을 측정할 수 없고, 계량화할 수도 없으며, 심지어 눈에 보이지도 않고 또한 주관적인 문제라면 이에 어떻게 대처해야 할까?<\/li>\n<li>뛰어난 투자자들은 주로 가치의 안정성과 신뢰성, 그리고 가격과 가치의 관계를 토대로 리스크에 대한 판단을 한다.<\/li>\n<li>VaR, 퀀트 등 과학적 접근이 최고 투자자들의 주관적인 판단보다 결코 나을 것이 없다고 생각한다.<\/li>\n<li>샤프지수란, 수익률의 표준편차에 대한 포트폴리오의 초과 수익률을 나타내고 매매가 활발한 일반 증권에 적합하고 어느 정도 논리적으로 타당해서 샤프지수가 손실 가능성에 대해 명확하게 알려주는 것은 없지만 우리가 위험조정수익률을 객관적으로 참고할 수 있는 최선의 방법이다.<\/li>\n<li>리스크의 잠재적이고, 계량화할 수 없고, 주관적인 특성 때문에 투자리스크(손실가능성)는 사전에 측정될 수 없는 것처럼 시간이 지나고 나서도 측정될 수 없다는 것을 깨닫게 되었다.<\/li>\n<li>어떤 일이 과거에 일어났다고 해서 미래에도 일어날 것이라는 의미는 아니며, 어떤 일이 과거에 일어나지 않았다고 해서 미래에도 일어날 가능성이 없음을 의미하지 않는다는 것이다.<\/li>\n<li>잘못 선택한 투자를 전화위복으로 삼는 사람들이 얼마나 될까?<\/li>\n<li>투자가 성공했다고 해서 리스크가 없었다거나 반대로 실패했다고 해서 리스크가 컸다는 의미는 확실히 아니다.<\/li>\n<li>어떤 결과가 가장 가능성이 크며 예상되는 결과가 무엇인지를 알려주는 확률분포의 형태를 우리가 알고 정확하다고 해도 결국 우리가 아는 것은 가능성이나 경향일 뿐이다.<\/li>\n<li>확률과 결과 사이에는 큰 차이가 있어, 일어날 것 같은 일은 언제나 일어나지 않고, 일어나지 않을 것 같은 일이 일어난다는 점을 명심하라.<\/li>\n<li>투자자들이 앞으로 일어날 일에 대해 판단을 내려야 하는 것은 확실하며 미래에 대비하기 위해서는 한 가지 가능성만 중점적으로 예상해서는 안 되며, 각각의 가능성에 대해서도 대비해야만 한다.<\/li>\n<li>정규분포를 기반으로 활동해온 기관투자자들은 거의 일어나지 않는 일을 별로 감안하지 않아 실패하는 경우가 많았다.<\/li>\n<li>사람들이 단순화한 추정을 복잡한 현실 세계에 잘못 적용하는 것은 문제가 생길 가능성이 다분하고 경계해야 한다.<\/li>\n<li>투자 성과란 일련의 사건들이(지정학적, 거시경제학적, 기술적, 심리적, 기업 수준의 사건) 현재 보유 포트폴리오와 마찰이 생겼을 때 일어나는 것이다.<\/li>\n<li>다양한 미래가 가능하지만 단 하나의 미래만이 현실이 되고 내가 맞이할 미래는 나의 포트폴리오에 이익을 줄 수 있고 손실을 줄 수도 있으며 이는 나의 예지, 신중함, 운에 원인이 있을 수 있다.<\/li>\n<li>수익을 달성하기 위해 감수한 리스크의 양과 연관 지어 평가되어야 하지만 리스크는 측정할 수 없기 때문에 수익만으로는, 특히 단기간의 수익으로는 투자 결정의 질에 대해 말할 수 있는 것이 거의 없다.<\/li>\n<li>리스크는 측정할 수 있는 것은 확실히 아니며, 투자에 대한 지식과 경험이 많은 2차적 사고를 하는 사람들에 의해서만 판단될 수 있는 것이다.<\/li>\n<li>투자 리스크는 대체로 상황이 발생하기 전에는 눈에 보이지 않으며 심지어 투자가 끝난 다음에도 보이지 않을 수 있다.<\/li>\n<li>리스크는 미래에만 존재하며, 미래에 어떤 일이 생길지 확실히 알기는 불가능하다.<\/li>\n<li>리스크를 감수할 것인가, 말 것인가 하는 결정은 정상적인 패턴이 반복된다는 가정에서 나오고, 사람들은 대체로 그런 가정을 하지만 때때로는 매우 다른 상황, 일어나지 않을 것 같은 상황이 발생하기도 한다.<\/li>\n<li>예상이란, 과거의 기준을 중심으로 모여들고 작은 변화만을 요구하는 경향이 있고 사람들은 대체로 미래가 과거와 같기를 기대하고, 변화에 대한 가능성을 과소평가한다.<\/li>\n<li>우리는 최악의 경우를 예상하는 말을 많이 듣지만, 이 예상이 충분히 부정적이지 않은 것으로 드러나는 경우가 종종 있다.<\/li>\n<li>리스크는 불규칙적으로 나타나며 일부 투자자들, 특히 높은 레버리지 이용자들이 그 잠깐의 시기로 인해 투자 세계에서 사라지는 사례는 언제나 있다.<\/li>\n<li>사람들은 리스크를 추정하거나, 실제로 운용되는 것은 한 번도 본 적 없는 투자 기법을 이해함에 있어 자신이 가진 능력을 과대평가한다.<\/li>\n<li>이론상 인간은 어떤 것을 경험해보지 않고도 그것이 위험하다는 것을 알 수 있으나 호황기에는 사람들이 이런 인지 기능을 제대로 발휘하지 못하는 경향이 있다.<\/li>\n<li>가장 중요한 것으로, 대부분의 사람들은 리스크 감수를 수익을 내기 위한 방법의 하나로 보지만 그러나 문제는 투자가 늘 그런 식으로 되는 것은 아니라는 점이다.<\/li>\n<li>리스크가 클수록 무조건 수익도 크다면, 그 투자가 위험하다고 할 수 있을까? 리스크를 감수한 효과가 없을 때, 리스크는 무용지물이 되며 그럴 때 사람들은 리스크란 무엇인가에 대해 생각해보게 된다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 이 장은 리스크를 변동성이 아니라 영구 손실 가능성으로 재정의한다.<\/li>\n<li>[추론] 이후 6장과 7장은 각각 “리스크를 알아보는 법”과 “리스크를 줄이는 법”이므로, 5장은 정의 장이다.<\/li>\n<li>[막스 메모/인터뷰] 막스는 이후에도 리스크 감수 없이는 수익이 없지만, 리스크를 진다고 해서 자동으로 수익이 주어지지는 않는다고 반복했다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 투자의 진짜 리스크는 변동성인가, 영구 손실인가?<\/li>\n<li>내 예상 수익은 어떤 리스크를 보상하고 있는가?<\/li>\n<li>보이지 않는 리스크는 무엇인가?<\/li>\n<li>정상 시나리오가 아니라 나쁜 시나리오에서 이 포지션은 어떻게 망가지는가?<\/li>\n<li>결과가 좋았다는 이유만으로 내가 리스크를 잘 관리했다고 착각하고 있지 않은가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(안전마진), 보글(불필요한 위험 회피), 하우절(결과와 과정 분리), 코스톨라니(심리적 과열), 린치(사업 이해 부족이 리스크).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 리스크는 단순 표준편차가 아니다. 막스에게 핵심은 자본 훼손이다.<\/li>\n<li>[추론] 높은 기대수익은 리스크의 보상 “가능성”일 뿐, 보장된 대가가 아니다.<\/li>\n<\/ul>","text":"기존 노트 위험이란, 일어날 일보다 더 많은 일이 일어날 수 있음을 의미한다. 투자는 정확히 한 가지로 이루어진다. 바로 미래를 상대하는 것이다. 우리 누구도 미래에 대해 확실히 알지 못하므로 리스크를 피할 수 없어서 리스크에 대처하는 것은 투자의 필수 요소다. 가격이 오를 투자 대상을 찾는 것은 그리 어려운 일만은 아니지만 리스크에 확실하게 대처하지 않는다면 장기간 성공하지는 못한다. 그렇기에 첫 번째로 해야 할 일은 리스크를 이해하는 것이며 두 번째는 리스크가 높을 때 그것을 인지하는 것이고, 가장 중요한 세 번째는 리스크를 제어하는 것이다. 리스크 평가가 투자 프로세스에서 필수적으로 다뤄야 할 요소라고 말하는 데는 세 가지 중요한 이유가 있다. 첫째, 리스크는 나쁜 것으로 간주되며, 대부분의 신중한 사람들은 이를 회피하거나 최소화하고 싶어 한다. 특정 투자 대상을 고려하고 있는 투자자는 자신이 선택한 대상에 얼마큼의 리스크가 존재하는지, 그 리스크를 감수할 수 있을지에 대해 판단해야 한다. 둘째, 어떤 투자 대상을 고려하는 중일 때 당신의 결정은 잠재 수익뿐만 아니라, 그에 수반되는 리스크도 직시하려는 노력을 해야 한다. 투자자가 투자에 수반되는 절대량의 리스크를 부담할 수 있을지를 결정하는 것 이상으로 꼭 해야 할 두 번째 일은 투자수익이 그에 따르는 리스크 감수를 정당화하는지 알아내는 것이다. 셋째, 투자 결과를 검토할 때 결과 하나만으로도 많은 것을 알 수 있기는 하지만, 투자를 하면서 감수했던 리스크 역시 꼭 평가해야 한다. 안전vs위험, 채권vs주식, 우량주vs중소형주, 레버리지vs현금, 포트폴리오 집중vs분석 등을 평가 위험한 투자일수록 수익도 확실히 크다면, 이는 확실한 투자이지 위험한 투자가 아니기 때문에 리스크가 높을수록 수익을 많이 보장하는 것은 절대 아니다. 자본을 유치하기 위해 리스크가 큰 투자들은 더 큰 수익을 낼 수 있다는 전망, 약속, 기대감을 제공해야만 하지만 그것이 실제 현실이 될 것인지에 대해서는 뭐라 할 말이 없다. 리스크와 예상 수익 사이의 양의 관계뿐만 아니라, 리스크가 증가함에 따라 수익에 대한 불확실성과 손실 가능성이 증가한다는 사실을 알 수 있다. 리스크를 정의하는 것 또한 매우 중요하며 학자가 말하는 변동성보다는 절대적으로 돈을 잃을 가능성이 리스크의 정의에 가깝다. 현실적인 투자자들이 걱정하는 것은 영구 손실에 대한 가능성이며 리스크에는 더 많은 종류가 있으므로, 모든 종류의 리스크를 의식해야 한다. 리스크는 다양한 유형으로 나타나고 어떤 리스크는 일부 투자자에게 문제가 되지만 나머지 투자자에게는 문제가 되지 않는 리스크도 있고 어떤 투자 대상에는 안전할 수 있지만 나머지 투자 대상에는 위험할 수 있는 리스크도 있다. 목표에 못 미치는 것, 저조한 성과, 비유동성 등이 개인투자자들이 생각해 보아야 하는 주관적인 리스크 유형이다. 손실 위험은 꼭 펀더멘털이 부실해서 생기는 것은 아니고 부실한 자산이라도 충분히 저가에 매입한다면 매우 성공적인 투자가 될 수도 있다. 거시 환경 속에서 약점이 없어도 자만심, 리스크에 대한 무지, 불리한 상황 전개 등으로 리스크는 발생할 수 있다. 그러므로 자산의 포트폴리오가 어떻게 운용되는지를 이해하는 데 시간과 노력을 들이지 않는 사람이라면 누구에게나 일어날 수 있다. 손실 위험은 주로 지나친 낙관 심리, 그리고 그로 인해 지나치게 상승한 가격에 원인이 있다. 가치투자자들은 어떤 자산을 가치보다 싸게 매입함으로써 고수익과 저위험이 동시에 달성될 수 있다고 믿는다. 매출이 저조하고, 관심의 대상도 아니며, 평판이 안 좋아서 저평가된 증권의 특징을 가지는 주식은 가치투자자들이 고수익을 내기 위해 선호하는 투자 대상이다. 이런 증권의 수익은 강세장에서 고점을 찍는 일은 드물어도 실적이 대체로 뛰어나고, 활황주의 실적보다 지속적이며, 변동성과 기본적인 리스크가 낮고, 시장이 불황일 때 손실이 더 적다는 특징이 있다. 저가 투자 대상의 가장 큰 리스크는 과열된 강세장에서 저조한 성과를 낼 가능성에 있고 가치투자자가 떠안고 가야 할 문제이다. 리스크가 크다는 것이 감지된 투자에 대해 투자자들이 예상 수익을 더 많이 바라야 하고 투자금 손실은 투자자들이 예상 수익에 대한 기대와, 그에 따라 투자비용을 정할 때 가장 신경 쓰이는 리스크다. 리스크의 평가는 견해상의 문제일 뿐이고 학식과 전문적인 기술을 이용하여 미래를 추정해도 추정은 추정일 뿐이다. 계량적 기준은 존재하지 않고 모든 투자자들의 의견은 각자 달라서 리스크와, 리스크수익에 대한 결정을 컴퓨터에 전가할 수 없다. \"다른 종류의 투자 대상들과 각각의 손실 위험 사이의 관계는 너무나 막연하고 변동이 심해서 수학 공식 같을 수 없다.\" 리스크는 믿을 수 없고 반복되는 사건이 또다시 일어날 가능성처럼 일반적인 사항들은 계산에 넣기 쉽지만, 이례적이고 일생에 한 번 있을까 말까 한 사건들은 계량화하기 힘들다. 요약하면 미래를 예측할 때 많은 리스크가 주관적이고, 보이지 않으며, 계량화될 수 없다는 것이다. 손실 위험을 측정할 수 없고, 계량화할 수도 없으며, 심지어 눈에 보이지도 않고 또한 주관적인 문제라면 이에 어떻게 대처해야 할까? 뛰어난 투자자들은 주로 가치의 안정성과 신뢰성, 그리고 가격과 가치의 관계를 토대로 리스크에 대한 판단을 한다. VaR, 퀀트 등 과학적 접근이 최고 투자자들의 주관적인 판단보다 결코 나을 것이 없다고 생각한다. 샤프지수란, 수익률의 표준편차에 대한 포트폴리오의 초과 수익률을 나타내고 매매가 활발한 일반 증권에 적합하고 어느 정도 논리적으로 타당해서 샤프지수가 손실 가능성에 대해 명확하게 알려주는 것은 없지만 우리가 위험조정수익률을 객관적으로 참고할 수 있는 최선의 방법이다. 리스크의 잠재적이고, 계량화할 수 없고, 주관적인 특성 때문에 투자리스크(손실가능성)는 사전에 측정될 수 없는 것처럼 시간이 지나고 나서도 측정될 수 없다는 것을 깨닫게 되었다. 어떤 일이 과거에 일어났다고 해서 미래에도 일어날 것이라는 의미는 아니며, 어떤 일이 과거에 일어나지 않았다고 해서 미래에도 일어날 가능성이 없음을 의미하지 않는다는 것이다. 잘못 선택한 투자를 전화위복으로 삼는 사람들이 얼마나 될까? 투자가 성공했다고 해서 리스크가 없었다거나 반대로 실패했다고 해서 리스크가 컸다는 의미는 확실히 아니다. 어떤 결과가 가장 가능성이 크며 예상되는 결과가 무엇인지를 알려주는 확률분포의 형태를 우리가 알고 정확하다고 해도 결국 우리가 아는 것은 가능성이나 경향일 뿐이다. 확률과 결과 사이에는 큰 차이가 있어, 일어날 것 같은 일은 언제나 일어나지 않고, 일어나지 않을 것 같은 일이 일어난다는 점을 명심하라. 투자자들이 앞으로 일어날 일에 대해 판단을 내려야 하는 것은 확실하며 미래에 대비하기 위해서는 한 가지 가능성만 중점적으로 예상해서는 안 되며, 각각의 가능성에 대해서도 대비해야만 한다. 정규분포를 기반으로 활동해온 기관투자자들은 거의 일어나지 않는 일을 별로 감안하지 않아 실패하는 경우가 많았다. 사람들이 단순화한 추정을 복잡한 현실 세계에 잘못 적용하는 것은 문제가 생길 가능성이 다분하고 경계해야 한다. 투자 성과란 일련의 사건들이(지정학적, 거시경제학적, 기술적, 심리적, 기업 수준의 사건) 현재 보유 포트폴리오와 마찰이 생겼을 때 일어나는 것이다. 다양한 미래가 가능하지만 단 하나의 미래만이 현실이 되고 내가 맞이할 미래는 나의 포트폴리오에 이익을 줄 수 있고 손실을 줄 수도 있으며 이는 나의 예지, 신중함, 운에 원인이 있을 수 있다. 수익을 달성하기 위해 감수한 리스크의 양과 연관 지어 평가되어야 하지만 리스크는 측정할 수 없기 때문에 수익만으로는, 특히 단기간의 수익으로는 투자 결정의 질에 대해 말할 수 있는 것이 거의 없다. 리스크는 측정할 수 있는 것은 확실히 아니며, 투자에 대한 지식과 경험이 많은 2차적 사고를 하는 사람들에 의해서만 판단될 수 있는 것이다. 투자 리스크는 대체로 상황이 발생하기 전에는 눈에 보이지 않으며 심지어 투자가 끝난 다음에도 보이지 않을 수 있다. 리스크는 미래에만 존재하며, 미래에 어떤 일이 생길지 확실히 알기는 불가능하다. 리스크를 감수할 것인가, 말 것인가 하는 결정은 정상적인 패턴이 반복된다는 가정에서 나오고, 사람들은 대체로 그런 가정을 하지만 때때로는 매우 다른 상황, 일어나지 않을 것 같은 상황이 발생하기도 한다. 예상이란, 과거의 기준을 중심으로 모여들고 작은 변화만을 요구하는 경향이 있고 사람들은 대체로 미래가 과거와 같기를 기대하고, 변화에 대한 가능성을 과소평가한다. 우리는 최악의 경우를 예상하는 말을 많이 듣지만, 이 예상이 충분히 부정적이지 않은 것으로 드러나는 경우가 종종 있다. 리스크는 불규칙적으로 나타나며 일부 투자자들, 특히 높은 레버리지 이용자들이 그 잠깐의 시기로 인해 투자 세계에서 사라지는 사례는 언제나 있다. 사람들은 리스크를 추정하거나, 실제로 운용되는 것은 한 번도 본 적 없는 투자 기법을 이해함에 있어 자신이 가진 능력을 과대평가한다. 이론상 인간은 어떤 것을 경험해보지 않고도 그것이 위험하다는 것을 알 수 있으나 호황기에는 사람들이 이런 인지 기능을 제대로 발휘하지 못하는 경향이 있다. 가장 중요한 것으로, 대부분의 사람들은 리스크 감수를 수익을 내기 위한 방법의 하나로 보지만 그러나 문제는 투자가 늘 그런 식으로 되는 것은 아니라는 점이다. 리스크가 클수록 무조건 수익도 크다면, 그 투자가 위험하다고 할 수 있을까? 리스크를 감수한 효과가 없을 때, 리스크는 무용지물이 되며 그럴 때 사람들은 리스크란 무엇인가에 대해 생각해보게 된다. [구조화] [막스 본문] 이 장은 리스크를 변동성이 아니라 영구 손실 가능성으로 재정의한다. [추론] 이후 6장과 7장은 각각 “리스크를 알아보는 법”과 “리스크를 줄이는 법”이므로, 5장은 정의 장이다. [막스 메모/인터뷰] 막스는 이후에도 리스크 감수 없이는 수익이 없지만, 리스크를 진다고 해서 자동으로 수익이 주어지지는 않는다고 반복했다. [실전 질문] 이 투자의 진짜 리스크는 변동성인가, 영구 손실인가? 내 예상 수익은 어떤 리스크를 보상하고 있는가? 보이지 않는 리스크는 무엇인가? 정상 시나리오가 아니라 나쁜 시나리오에서 이 포지션은 어떻게 망가지는가? 결과가 좋았다는 이유만으로 내가 리스크를 잘 관리했다고 착각하고 있지 않은가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(안전마진), 보글(불필요한 위험 회피), 하우절(결과와 과정 분리), 코스톨라니(심리적 과열), 린치(사업 이해 부족이 리스크). [오해 방지] [추론] 리스크는 단순 표준편차가 아니다. 막스에게 핵심은 자본 훼손이다. [추론] 높은 기대수익은 리스크의 보상 “가능성”일 뿐, 보장된 대가가 아니다."},{"i":7,"title":"06. 리스크를 인식하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>금융 시스템이 지금은 더 안정적이라는 이유로, 사람들은 레버리지와 리스크 감수를 늘릴 것이고, 그로 인해 금융 시스템의 안정성은 다시 감소할 것임에 틀림없다. (마이런 숄즈, 노벨경제학상)<\/li>\n<li>경기가 침체되면 리스크가 증가하고, 호경기가 되면 리스크가 감소한다는 것은 일반적인 상식이다. 하지만 사실은 호황일 때는 금융불균형이 커지면서 리스크가 증가하고, 불황일 때 그 모습을 드러낼 뿐이다. (앤드류 크로켓, JP모건 사장)<\/li>\n<li>아무리 좋은 기본 조건을 갖추었더라도, 인간은 탐욕과 실수를 범하는 성향이 있기 때문에 언제라도 일을 그르칠 수 있다.<\/li>\n<li>훌륭한 투자는 수익을 창출하고 리스크를 제어할 수 있어야 하고 리스크를 제어하려면 리스크를 \"인식\"하는 것이 절대적으로 선행되어야 한다.<\/li>\n<li>리스크란 어떤 결과가 발생할 것인지, 그리고 원치 않는 결과가 나왔을 때 손실 가능성은 얼마나 되는지에 대해 불확실한 것을 의미한다.<\/li>\n<li>가격이 비쌀 때 피하지 않고 투자하는 것은 리스크의 주된 원인이고 리스크가 클수록 대체로 가격도 비싸다.<\/li>\n<li>가치투자자들은 높은 리스크와 낮은 예상 수익은 동전의 양면일 뿐이며 둘 다 가격이 높은 데서 비롯하는 것으로 생각한다.<\/li>\n<li>가격과 가치 사이의 관계를 아는 것은, 단일 증권에 대해서든 전체 시장에 대해서든 리스크를 성공적으로 관리하는 데 꼭 필요한 요소다.<\/li>\n<li>잠재 수익의 증가는 리스크를 부담하는 데에 대한 보상이며 추가 위험을 부담하지 않고 추가 수익을 달성하겠다는 계획을 세우면 안 된다.<\/li>\n<li>리스크 수용도는 성공적인 투자와는 거리가 먼 개념이다.<\/li>\n<li>리스크를 적절히 회피해야 적당한 리스크 프리미엄을 포함하는 예상 수익이 나오고 리스크가 없다는 믿음이 널리 퍼지는 것만큼 위험한 일도 없다.<\/li>\n<li>리스크를 두려워하는 것과 그에 대해 보상을 바라는 것을 잊지 말고 우리는 이를 계속 유념해야 한다.<\/li>\n<li>리스크가 생기는 주요 원인은 리스크가 낮다거나 심지어 완전히 사라졌다는 믿음 때문이고 그 이유로 가격이 오르고, 예상 수익이 낮음에도 불구하고 위험한 행동을 하게 된다.<\/li>\n<li>시장이 어떤 구조로 설계되었는지와 상관없이 투자자들이 신중하게 행동할 때만 리스크는 낮아질 것이다.<\/li>\n<li>리스크는 제거될 수 없으며, 다른 곳으로 전가되며 분배될 뿐이다. 세상을 덜 위험해 보이게 하는 현상들은 대체로 사실이 아니며, 이런 현상들은 세상을 더 위험하게 만드는 경향이 있다.<\/li>\n<li>리스크가 낮은 세상에 살고 있다고 믿은 투자자들은 지나치게 많은 레버리지를 이용하고, 너무 많은 자본을 유동성이 부족한 투자에 투입하여 위기가 발생했다.<\/li>\n<li>투자자들이 충분히 위험을 회피하지 않으면 시장은 충분한 리스크 프리미엄을 제공하지 않으려 할 것이고 걱정이 부족하면 위험한 채무자들과 미심쩍은 계획에 자본이 쉽게 제공될 것이고, 결국 금융제도는 위태로워질 것이다.<\/li>\n<li>수개월, 수년간의 잠복기를 두고 위기를 향해 가는 동안 소수의 참가자들만이 마땅히 해야 할 걱정을 한다.<\/li>\n<li>투자 리스크는 주로 너무 비싼 가격 때문에 생기고, 너무 비싼 가격은 지나치게 낙관하여 충분히 의심하지 않고 위험을 회피하지 않는 데서 나온다.<\/li>\n<li>그 밖에 투자 리스크는 안전한 투자일수록 예상 수익을 낮게 잡거나, 리스크가 큰 투자가 최근에 좋은 실적을 냈다거나, 자본 유입이 풍부하다거나, 쉽게 신용거래를 할 수 있는 것 등이 근본적인 요인에 포함된다.<\/li>\n<li>투자 프로세스가 '사치'를 부리게 되면서 PER를 상승시키고, 신용 스프레드를 감소시키며, 무절제한 행동을 하게 하고, 과도한 레버리지를 사용하게 만들며, 모든 종류의 투자 수단을 강구하게 만들면서 가격 상승과 예상 수익 감소라는 결과를 가져올 뿐만 아니라, 리스크가 높은 환경을 초래한다.<\/li>\n<li>리스크는 투자자들에게 대단히 중요하지만 일시적이고 측정이 불가능해 리스크를 인지하기가 매우 어려운데, 특히 투자자 심리가 고조되어 있을 때 그렇다.<\/li>\n<li>우리는 낙관적인 시기를 살고 있으며 리스크 프리미엄은 줄고, 의심은 신뢰로 바뀌고, 절제는 의욕으로 바뀌었지만 아무 일 없이 시간이 흐른다고 해서 그 상태가 지속될 것이라고 볼 수 없다.<\/li>\n<li>썰물일 때만 누가 벌거벗고 수영하는지 알 수 있다. (워런 버핏)<\/li>\n<li>위기가 닥치기 직전의 몇 년 동안 당신이 알아야 할 모든 것은, 현재 무슨 일이 일어나고 있는지를 아는 것에서 나온다.<\/li>\n<li>리스크의 본질은 생각보다 훨씬 더 복잡다단하다. 사람들은 리스크를 인지하는 자신의 능력을 대단히 과대평가하는 반면, 리스크를 피하기 위해 필요한 조건은 과소평가한다. 결과적으로 리스크가 있는지 모른 채 수용하게 되는데, 바로 이런 행동으로 인해 리스크가 발생한다.<\/li>\n<li>시장은 투자자들의 동향에 즉각적으로 반응하고, 그에 따라 형세를 바꾸는 역동적인 장소다.<\/li>\n<li>투자자는 자신감이 커질수록 더 많이 걱정해야 하고 커져가는 공포심과 리스크 회피가 합쳐져 리스크 프리미엄을 추가 요구할수록 리스크는 감소한다.<\/li>\n<li>다수의 투자자 집단의 \"무슨 일이 있어도 그건 사지 않을 거야. 누가 봐도 리스크가 크거든\"라는 의견은 반대로 최고의 투자 기회를 만들어 주기도 한다.<\/li>\n<li>투자에서 리스크는 가장 인지되지 못하는 곳에 가장 크게 도사리고 있고, 반대로 가장 큰 리스크가 있다고 사람들이 생각하는 곳에 가장 적은 리스크가 있다고 확신한다.<\/li>\n<li>모두가 어떤 자산에 리스크가 있다고 믿어서 매입을 꺼려 하면, 결국 자산 가격은 리스크가 전혀 없는 수준으로 떨어지고 리스크가 가장 적은 투자가 될 수 있다.<\/li>\n<li>어떤 자산이 리스크를 포함하지 않는다고 모두가 믿게 되면, 리스크는 엄청나게 커진다.<\/li>\n<li>자산에 대한 적극적인 관심과 호평이 커질수록 잠재 수익은 감소하고, 리스크는 증가하는 원천이 될 수 있다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 리스크는 나빠질 때 갑자기 생기는 것이 아니라, 좋아 보이는 시기에 누적된다.<\/li>\n<li>[막스 메모/인터뷰] 막스는 시장 체온이 높은 구간을 낮은 회의, 낮은 공포, 낮은 리스크 회피, 얇은 리스크 프리미엄으로 묘사했다. 또 최근 사모신용 메모에서는 신규 자본 유입, 낮은 수익률, 좁은 스프레드, 안전장치 약화가 같은 신호로 반복되었다.<\/li>\n<li>[추론] 따라서 리스크 인식의 핵심은 자산 분석보다 “시장 참가자들이 리스크를 어떻게 대하고 있는가”를 읽는 데 있다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>지금 시장은 리스크를 두려워하는가, 무시하는가?<\/li>\n<li>리스크 프리미엄이 충분한가, 얇은가?<\/li>\n<li>대출 기준과 펀드 출시, 신규 상품이 느슨해지고 있는가?<\/li>\n<li>이 자산의 인기는 기대수익을 어떻게 잠식하고 있는가?<\/li>\n<li>모두가 싫어하는 자산인지, 모두가 안심하는 자산인지 어느 쪽인가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 코스톨라니(군중의 극단), 하우절(심리와 과신), 보글(수수료·기대수익 현실화), 그레이엄(안전마진), 린치(스토리 인기의 함정).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 경기 확장이 곧 리스크 감소를 뜻하지 않는다. 종종 그 반대다.<\/li>\n<li>[추론] 투자자들이 가장 편안해할 때가 구조적으로 가장 취약할 수 있다.<\/li>\n<\/ul>","text":"기존 노트 금융 시스템이 지금은 더 안정적이라는 이유로, 사람들은 레버리지와 리스크 감수를 늘릴 것이고, 그로 인해 금융 시스템의 안정성은 다시 감소할 것임에 틀림없다. (마이런 숄즈, 노벨경제학상) 경기가 침체되면 리스크가 증가하고, 호경기가 되면 리스크가 감소한다는 것은 일반적인 상식이다. 하지만 사실은 호황일 때는 금융불균형이 커지면서 리스크가 증가하고, 불황일 때 그 모습을 드러낼 뿐이다. (앤드류 크로켓, JP모건 사장) 아무리 좋은 기본 조건을 갖추었더라도, 인간은 탐욕과 실수를 범하는 성향이 있기 때문에 언제라도 일을 그르칠 수 있다. 훌륭한 투자는 수익을 창출하고 리스크를 제어할 수 있어야 하고 리스크를 제어하려면 리스크를 \"인식\"하는 것이 절대적으로 선행되어야 한다. 리스크란 어떤 결과가 발생할 것인지, 그리고 원치 않는 결과가 나왔을 때 손실 가능성은 얼마나 되는지에 대해 불확실한 것을 의미한다. 가격이 비쌀 때 피하지 않고 투자하는 것은 리스크의 주된 원인이고 리스크가 클수록 대체로 가격도 비싸다. 가치투자자들은 높은 리스크와 낮은 예상 수익은 동전의 양면일 뿐이며 둘 다 가격이 높은 데서 비롯하는 것으로 생각한다. 가격과 가치 사이의 관계를 아는 것은, 단일 증권에 대해서든 전체 시장에 대해서든 리스크를 성공적으로 관리하는 데 꼭 필요한 요소다. 잠재 수익의 증가는 리스크를 부담하는 데에 대한 보상이며 추가 위험을 부담하지 않고 추가 수익을 달성하겠다는 계획을 세우면 안 된다. 리스크 수용도는 성공적인 투자와는 거리가 먼 개념이다. 리스크를 적절히 회피해야 적당한 리스크 프리미엄을 포함하는 예상 수익이 나오고 리스크가 없다는 믿음이 널리 퍼지는 것만큼 위험한 일도 없다. 리스크를 두려워하는 것과 그에 대해 보상을 바라는 것을 잊지 말고 우리는 이를 계속 유념해야 한다. 리스크가 생기는 주요 원인은 리스크가 낮다거나 심지어 완전히 사라졌다는 믿음 때문이고 그 이유로 가격이 오르고, 예상 수익이 낮음에도 불구하고 위험한 행동을 하게 된다. 시장이 어떤 구조로 설계되었는지와 상관없이 투자자들이 신중하게 행동할 때만 리스크는 낮아질 것이다. 리스크는 제거될 수 없으며, 다른 곳으로 전가되며 분배될 뿐이다. 세상을 덜 위험해 보이게 하는 현상들은 대체로 사실이 아니며, 이런 현상들은 세상을 더 위험하게 만드는 경향이 있다. 리스크가 낮은 세상에 살고 있다고 믿은 투자자들은 지나치게 많은 레버리지를 이용하고, 너무 많은 자본을 유동성이 부족한 투자에 투입하여 위기가 발생했다. 투자자들이 충분히 위험을 회피하지 않으면 시장은 충분한 리스크 프리미엄을 제공하지 않으려 할 것이고 걱정이 부족하면 위험한 채무자들과 미심쩍은 계획에 자본이 쉽게 제공될 것이고, 결국 금융제도는 위태로워질 것이다. 수개월, 수년간의 잠복기를 두고 위기를 향해 가는 동안 소수의 참가자들만이 마땅히 해야 할 걱정을 한다. 투자 리스크는 주로 너무 비싼 가격 때문에 생기고, 너무 비싼 가격은 지나치게 낙관하여 충분히 의심하지 않고 위험을 회피하지 않는 데서 나온다. 그 밖에 투자 리스크는 안전한 투자일수록 예상 수익을 낮게 잡거나, 리스크가 큰 투자가 최근에 좋은 실적을 냈다거나, 자본 유입이 풍부하다거나, 쉽게 신용거래를 할 수 있는 것 등이 근본적인 요인에 포함된다. 투자 프로세스가 '사치'를 부리게 되면서 PER를 상승시키고, 신용 스프레드를 감소시키며, 무절제한 행동을 하게 하고, 과도한 레버리지를 사용하게 만들며, 모든 종류의 투자 수단을 강구하게 만들면서 가격 상승과 예상 수익 감소라는 결과를 가져올 뿐만 아니라, 리스크가 높은 환경을 초래한다. 리스크는 투자자들에게 대단히 중요하지만 일시적이고 측정이 불가능해 리스크를 인지하기가 매우 어려운데, 특히 투자자 심리가 고조되어 있을 때 그렇다. 우리는 낙관적인 시기를 살고 있으며 리스크 프리미엄은 줄고, 의심은 신뢰로 바뀌고, 절제는 의욕으로 바뀌었지만 아무 일 없이 시간이 흐른다고 해서 그 상태가 지속될 것이라고 볼 수 없다. 썰물일 때만 누가 벌거벗고 수영하는지 알 수 있다. (워런 버핏) 위기가 닥치기 직전의 몇 년 동안 당신이 알아야 할 모든 것은, 현재 무슨 일이 일어나고 있는지를 아는 것에서 나온다. 리스크의 본질은 생각보다 훨씬 더 복잡다단하다. 사람들은 리스크를 인지하는 자신의 능력을 대단히 과대평가하는 반면, 리스크를 피하기 위해 필요한 조건은 과소평가한다. 결과적으로 리스크가 있는지 모른 채 수용하게 되는데, 바로 이런 행동으로 인해 리스크가 발생한다. 시장은 투자자들의 동향에 즉각적으로 반응하고, 그에 따라 형세를 바꾸는 역동적인 장소다. 투자자는 자신감이 커질수록 더 많이 걱정해야 하고 커져가는 공포심과 리스크 회피가 합쳐져 리스크 프리미엄을 추가 요구할수록 리스크는 감소한다. 다수의 투자자 집단의 \"무슨 일이 있어도 그건 사지 않을 거야. 누가 봐도 리스크가 크거든\"라는 의견은 반대로 최고의 투자 기회를 만들어 주기도 한다. 투자에서 리스크는 가장 인지되지 못하는 곳에 가장 크게 도사리고 있고, 반대로 가장 큰 리스크가 있다고 사람들이 생각하는 곳에 가장 적은 리스크가 있다고 확신한다. 모두가 어떤 자산에 리스크가 있다고 믿어서 매입을 꺼려 하면, 결국 자산 가격은 리스크가 전혀 없는 수준으로 떨어지고 리스크가 가장 적은 투자가 될 수 있다. 어떤 자산이 리스크를 포함하지 않는다고 모두가 믿게 되면, 리스크는 엄청나게 커진다. 자산에 대한 적극적인 관심과 호평이 커질수록 잠재 수익은 감소하고, 리스크는 증가하는 원천이 될 수 있다. [구조화] [막스 본문] 리스크는 나빠질 때 갑자기 생기는 것이 아니라, 좋아 보이는 시기에 누적된다. [막스 메모/인터뷰] 막스는 시장 체온이 높은 구간을 낮은 회의, 낮은 공포, 낮은 리스크 회피, 얇은 리스크 프리미엄으로 묘사했다. 또 최근 사모신용 메모에서는 신규 자본 유입, 낮은 수익률, 좁은 스프레드, 안전장치 약화가 같은 신호로 반복되었다. [추론] 따라서 리스크 인식의 핵심은 자산 분석보다 “시장 참가자들이 리스크를 어떻게 대하고 있는가”를 읽는 데 있다. [실전 질문] 지금 시장은 리스크를 두려워하는가, 무시하는가? 리스크 프리미엄이 충분한가, 얇은가? 대출 기준과 펀드 출시, 신규 상품이 느슨해지고 있는가? 이 자산의 인기는 기대수익을 어떻게 잠식하고 있는가? 모두가 싫어하는 자산인지, 모두가 안심하는 자산인지 어느 쪽인가? [다른 책과의 연결] [후대 해석] 강한 연결: 코스톨라니(군중의 극단), 하우절(심리와 과신), 보글(수수료·기대수익 현실화), 그레이엄(안전마진), 린치(스토리 인기의 함정). [오해 방지] [추론] 경기 확장이 곧 리스크 감소를 뜻하지 않는다. 종종 그 반대다. [추론] 투자자들이 가장 편안해할 때가 구조적으로 가장 취약할 수 있다."},{"i":8,"title":"07. 리스크를 제거하라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>투자자들이 해야 할 일은 수익을 위해 리스크를 현명하게 수용하는 것이고 이를 얼마나 잘하는가에 따라 최고가 되느냐, 그 나머지가 되느냐가 달려 있다.<\/li>\n<li>특출난 투자자들은 수익을 창출하는 능력 못지않게 리스크를 제어하는 능력 또한 뛰어나다.<\/li>\n<li>낮은 리스크로 중간 정도의 수익을 올리거나, 중간쯤 되는 리스크로 고수익을 올릴 수 있어야 한다. 즉, 자신이 거두어들인 수익에 상응하는 것보다 적은 리스크를 부담해야 한다.<\/li>\n<li>리스크는 숨어 있어서 잘 안 보이기 때문에 리스크 관리에 대한 보상은 후하지도 않고 그나마도 경기가 좋을 때는 절대로 주어지지 않는다.<\/li>\n<li>리스크는 식별할 수 있는 것이 아니고 눈에 보이는 것은 손실이며, 손실은 대체로 리스크가 부정적인 상황과 충돌했을 때만 발생한다.<\/li>\n<li>세균은 질병의 원인이 되지만 세균 자체로는 질병이 아니고 마찬가지로 손실은 리스크가 어려운 상황을 만났을 때 발생한다.<\/li>\n<li>리스크는 상황이 잘못될 경우 손실이 일어날 가능성이고 상황이 순조로운 한 손실은 발생하지 않으므로 리스크는 부정적인 상황이 발생할 때만 손실을 낳는다.<\/li>\n<li>상황이 나쁘지 않았다는 사실이 그럴 수밖에 없었음을 의미하거나, 리스크를 제어할 필요가 없었다는 의미는 아니라는 것을 잊지 말아야 한다.<\/li>\n<li>중요한 것은 손실이 발생하지 않더라도 리스크가 존재했을 수 있다는 것을 아는 것이다.<\/li>\n<li>노련하고 수준 높은 관찰자만이 호경기에 포트폴리오를 살피고, 거기에 포함된 리스크가 낮은지, 높은지를 예측할 수 있다.<\/li>\n<li>리스크 제어는 호황에는 눈에 보이지 않지만 그래도 꼭 필요하다. 그 이유는 호황이 쉽게 불황으로 바뀔 수 있기 때문이다.<\/li>\n<li>창출한 부가가치는 동일한 리스크로 더 큰 수익을 창출하는 데서 오는 게 아니라, 동일한 수익을 리스크를 줄이고 달성한 것에서 나온다.<\/li>\n<li>상승장에서는 그에 충분히 편승하고 하락장에서도 우수한 수익을 내려면 하락장의 리스크를 부담하면서 상승장의 수익을 확보하면 된다.<\/li>\n<li>수익을 위해 필요한 리스크를 현명하게 감수하는 것은 투자자가 해야 할 일이고 이를 잘하느냐 못하느냐에 따라 최고의 투자자와 그 나머지 평범한 투자자들로 구분된다.<\/li>\n<li>우리는 리스크에 대해 알려고 노력하며, 이는 어떤 사람들이 그저 단순하게 '위험하다'고 말하는 자산이, 우리가 하는 일에 얼마나 많이 포함되어 있는가를 고려했을 때 꼭 필요한 일이다.<\/li>\n<li>우리는 투자 대상을 분석하고, 리스크를 평가하는 실력이 출중한 전문가들을 고용하며, 대상을 분석하고, 포트폴리오를 적절하게 분산한다. 그리고 예상 수익이 리스크에 대한 보상보다 훨씬 크다는 확신이 들 때만 투자한다.<\/li>\n<li>리스크가 있는 자산이라도 충분히 낮은 가격이라면 좋은 투자가 될 수 있다.<\/li>\n<li>수익을 위해 현명하게 리스크를 감수하는 것이 중요하고 이를 판단할 수 있는 가장 좋은 수단은 오랜 기간 반복된 성공의 기록이다.<\/li>\n<li>리스크 관리가 필수적이기는 하나, 리스크 감수 그 자체는 현명하지도 미련하지도 않다.<\/li>\n<li>리스크 제어는 대부분의 투자 전략과 투자 니치에 불가피한 요소이며, 성공적일 수도 있고 실패할 수도 있으며, 적기에 이루어질 수도 있고 적절하지 못한 시기에 이루어질 수도 있다.<\/li>\n<li>주된 위험은 '얼마나 나쁜 것이 나쁜 것인가'를 모르는 것과, 그로 인해 잘못된 결정을 하는 것에서 나온다.<\/li>\n<li>극단적인 변동성과 손실은 드물게 나타나고 그런 상황은 발생하지 않고, 시간이 흐르면서 다시는 그런 일이 일어나지 않을 것처럼 보이고 이에 원칙을 완화하고 레버리지를 늘리는 것에 마음이 끌리는데 이런 일은 종종 리스크가 발생하기 직전에 일어난다.<\/li>\n<li>현실은 러시안 룰렛보다 훨씬 더 비정한데 투자자는 자신도 모르게 러시안 룰렛을 하면서 이를 '낮은 리스크'로 착각한다.<\/li>\n<li>인생의 모든 측면에서 우리는 앞으로 무슨 일이 일어날지 예상하며 그것을 바탕으로 결정을 내리고 미래를 예측할 때는 과거에 일반적으로 일어났던 일들에 크게 의지한다.<\/li>\n<li>우리는 대체로 결과가 표준에 가깝기를 희망하지만 그보다 더 낫거나 그에 못 미치는 결과가 나오는 것이 흔한 일임을 알고 또한 가끔은 결과가 예상 범위를 벗어날 수 있다는 것을 알고 있으면서도 아웃라이어가 나타날 가능성에 대해서는 망각하는 경향이 있다.<\/li>\n<li>대부분의 상황에서 최악의 경우를 대비할 필요는 없고 한 세대에 한 번 일어날 만한 상황들에 대비하는 것만으로 충분하지만 한 세대는 영원하지 않으며, 언젠가는 기준이 초과되는 순간이 있을 것이다.<\/li>\n<li>리스크 제어는 손실을 피하는 최고의 방법이고 리스크 회피는 수익마저도 회피하게 될 수 있다.<\/li>\n<li>리스크를 회피하지 말고 다만 시기와 사례와 가격이 적절할 때만 리스크를 환영하라.<\/li>\n<li>\"우리는 종종 위험을 감수해야 한다. 성공의 열매가 거기에 있기 때문이다.\" (윌 로저스)<\/li>\n<li>장기적인 투자 성공으로 가는 길은 공격적인 투자보다는 리스크 제어에 있고 리스크를 능숙하게 제어하는 것은 탁월한 투자자임의 징표다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 리스크 제어는 수익의 반대편이 아니라 장기 수익의 조건이다.<\/li>\n<li>[막스 메모/인터뷰] 막스는 리스크 제어와 리스크 회피를 구분하고, “손실 없는 기록”이 아니라 “패자 통제와 합리적 위험 부담의 균형”을 강조했다.<\/li>\n<li>[추론] 실무적으로는 종목선정 이전에 포지션 규모, 레버리지 한도, 유동성 요구, 상관관계, 추가매수 원칙을 먼저 정해야 한다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>이 투자에서 내가 제어할 수 있는 리스크와 제어할 수 없는 리스크는 무엇인가?<\/li>\n<li>최악의 분기·연도에도 살아남을 수 있는 포지션 크기인가?<\/li>\n<li>이 수익은 리스크를 줄인 상태에서도 충분히 매력적인가?<\/li>\n<li>평온한 시장에서 내가 리스크를 과소평가하고 있지 않은가?<\/li>\n<li>아웃라이어가 왔을 때 포트폴리오가 감당 가능한가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 그레이엄(안전마진), 보글(지나친 베팅 자제), 하우절(생존의 우선성). 린치·코스톨라니는 종목/심리 쪽 연결이 상대적으로 강하다.<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 리스크 제어는 수익 포기가 아니다. 막스에게는 더 적은 실수로 더 긴 게임을 하는 방식이다.<\/li>\n<li>[추론] 리스크 제어는 충격이 온 뒤의 반응이 아니라, 충격이 오기 전 구조 설계다.<\/li>\n<\/ul>","text":"기존 노트 투자자들이 해야 할 일은 수익을 위해 리스크를 현명하게 수용하는 것이고 이를 얼마나 잘하는가에 따라 최고가 되느냐, 그 나머지가 되느냐가 달려 있다. 특출난 투자자들은 수익을 창출하는 능력 못지않게 리스크를 제어하는 능력 또한 뛰어나다. 낮은 리스크로 중간 정도의 수익을 올리거나, 중간쯤 되는 리스크로 고수익을 올릴 수 있어야 한다. 즉, 자신이 거두어들인 수익에 상응하는 것보다 적은 리스크를 부담해야 한다. 리스크는 숨어 있어서 잘 안 보이기 때문에 리스크 관리에 대한 보상은 후하지도 않고 그나마도 경기가 좋을 때는 절대로 주어지지 않는다. 리스크는 식별할 수 있는 것이 아니고 눈에 보이는 것은 손실이며, 손실은 대체로 리스크가 부정적인 상황과 충돌했을 때만 발생한다. 세균은 질병의 원인이 되지만 세균 자체로는 질병이 아니고 마찬가지로 손실은 리스크가 어려운 상황을 만났을 때 발생한다. 리스크는 상황이 잘못될 경우 손실이 일어날 가능성이고 상황이 순조로운 한 손실은 발생하지 않으므로 리스크는 부정적인 상황이 발생할 때만 손실을 낳는다. 상황이 나쁘지 않았다는 사실이 그럴 수밖에 없었음을 의미하거나, 리스크를 제어할 필요가 없었다는 의미는 아니라는 것을 잊지 말아야 한다. 중요한 것은 손실이 발생하지 않더라도 리스크가 존재했을 수 있다는 것을 아는 것이다. 노련하고 수준 높은 관찰자만이 호경기에 포트폴리오를 살피고, 거기에 포함된 리스크가 낮은지, 높은지를 예측할 수 있다. 리스크 제어는 호황에는 눈에 보이지 않지만 그래도 꼭 필요하다. 그 이유는 호황이 쉽게 불황으로 바뀔 수 있기 때문이다. 창출한 부가가치는 동일한 리스크로 더 큰 수익을 창출하는 데서 오는 게 아니라, 동일한 수익을 리스크를 줄이고 달성한 것에서 나온다. 상승장에서는 그에 충분히 편승하고 하락장에서도 우수한 수익을 내려면 하락장의 리스크를 부담하면서 상승장의 수익을 확보하면 된다. 수익을 위해 필요한 리스크를 현명하게 감수하는 것은 투자자가 해야 할 일이고 이를 잘하느냐 못하느냐에 따라 최고의 투자자와 그 나머지 평범한 투자자들로 구분된다. 우리는 리스크에 대해 알려고 노력하며, 이는 어떤 사람들이 그저 단순하게 '위험하다'고 말하는 자산이, 우리가 하는 일에 얼마나 많이 포함되어 있는가를 고려했을 때 꼭 필요한 일이다. 우리는 투자 대상을 분석하고, 리스크를 평가하는 실력이 출중한 전문가들을 고용하며, 대상을 분석하고, 포트폴리오를 적절하게 분산한다. 그리고 예상 수익이 리스크에 대한 보상보다 훨씬 크다는 확신이 들 때만 투자한다. 리스크가 있는 자산이라도 충분히 낮은 가격이라면 좋은 투자가 될 수 있다. 수익을 위해 현명하게 리스크를 감수하는 것이 중요하고 이를 판단할 수 있는 가장 좋은 수단은 오랜 기간 반복된 성공의 기록이다. 리스크 관리가 필수적이기는 하나, 리스크 감수 그 자체는 현명하지도 미련하지도 않다. 리스크 제어는 대부분의 투자 전략과 투자 니치에 불가피한 요소이며, 성공적일 수도 있고 실패할 수도 있으며, 적기에 이루어질 수도 있고 적절하지 못한 시기에 이루어질 수도 있다. 주된 위험은 '얼마나 나쁜 것이 나쁜 것인가'를 모르는 것과, 그로 인해 잘못된 결정을 하는 것에서 나온다. 극단적인 변동성과 손실은 드물게 나타나고 그런 상황은 발생하지 않고, 시간이 흐르면서 다시는 그런 일이 일어나지 않을 것처럼 보이고 이에 원칙을 완화하고 레버리지를 늘리는 것에 마음이 끌리는데 이런 일은 종종 리스크가 발생하기 직전에 일어난다. 현실은 러시안 룰렛보다 훨씬 더 비정한데 투자자는 자신도 모르게 러시안 룰렛을 하면서 이를 '낮은 리스크'로 착각한다. 인생의 모든 측면에서 우리는 앞으로 무슨 일이 일어날지 예상하며 그것을 바탕으로 결정을 내리고 미래를 예측할 때는 과거에 일반적으로 일어났던 일들에 크게 의지한다. 우리는 대체로 결과가 표준에 가깝기를 희망하지만 그보다 더 낫거나 그에 못 미치는 결과가 나오는 것이 흔한 일임을 알고 또한 가끔은 결과가 예상 범위를 벗어날 수 있다는 것을 알고 있으면서도 아웃라이어가 나타날 가능성에 대해서는 망각하는 경향이 있다. 대부분의 상황에서 최악의 경우를 대비할 필요는 없고 한 세대에 한 번 일어날 만한 상황들에 대비하는 것만으로 충분하지만 한 세대는 영원하지 않으며, 언젠가는 기준이 초과되는 순간이 있을 것이다. 리스크 제어는 손실을 피하는 최고의 방법이고 리스크 회피는 수익마저도 회피하게 될 수 있다. 리스크를 회피하지 말고 다만 시기와 사례와 가격이 적절할 때만 리스크를 환영하라. \"우리는 종종 위험을 감수해야 한다. 성공의 열매가 거기에 있기 때문이다.\" (윌 로저스) 장기적인 투자 성공으로 가는 길은 공격적인 투자보다는 리스크 제어에 있고 리스크를 능숙하게 제어하는 것은 탁월한 투자자임의 징표다. [구조화] [막스 본문] 리스크 제어는 수익의 반대편이 아니라 장기 수익의 조건이다. [막스 메모/인터뷰] 막스는 리스크 제어와 리스크 회피를 구분하고, “손실 없는 기록”이 아니라 “패자 통제와 합리적 위험 부담의 균형”을 강조했다. [추론] 실무적으로는 종목선정 이전에 포지션 규모, 레버리지 한도, 유동성 요구, 상관관계, 추가매수 원칙을 먼저 정해야 한다. [실전 질문] 이 투자에서 내가 제어할 수 있는 리스크와 제어할 수 없는 리스크는 무엇인가? 최악의 분기·연도에도 살아남을 수 있는 포지션 크기인가? 이 수익은 리스크를 줄인 상태에서도 충분히 매력적인가? 평온한 시장에서 내가 리스크를 과소평가하고 있지 않은가? 아웃라이어가 왔을 때 포트폴리오가 감당 가능한가? [다른 책과의 연결] [후대 해석] 강한 연결: 그레이엄(안전마진), 보글(지나친 베팅 자제), 하우절(생존의 우선성). 린치·코스톨라니는 종목/심리 쪽 연결이 상대적으로 강하다. [오해 방지] [추론] 리스크 제어는 수익 포기가 아니다. 막스에게는 더 적은 실수로 더 긴 게임을 하는 방식이다. [추론] 리스크 제어는 충격이 온 뒤의 반응이 아니라, 충격이 오기 전 구조 설계다."},{"i":9,"title":"08. 주기에 주의를 기울여라","html":"<h3>기존 노트<\/h3>\n<ul>\n<li>거의 모든 것에는 '주기'가 있음을 꼭 기억해야 한다.<\/li>\n<li>주기에 대해 내가 확신할 수 있는 것은 많지 않지만, 주기는 언제나 이긴다는 것과, 그 어떤 것도 영원히 한 방향으로 움직이지 않는다.<\/li>\n<li>현재 상황이 미래에도 계속될 것이라고 굳게 믿는 것처럼 건전한 투자에 위험한 것은 없다.<\/li>\n<li>원칙1: 대부분의 것들이 주기를 따른다는 사실이 증명될 것이다.<\/li>\n<li>원칙2: 수익과 손실을 가져오는 가장 큰 기회들은, 다른 이들이 '원칙1'을 망각했을 때 찾아오는 경우가 많다.<\/li>\n<li>중요한 원칙은 무엇이든 커졌다 작아지고, 증가했다 하락한다는 것이다.<\/li>\n<li>역사나 경제 같은 분야의 프로세스는 인간을 포함하며, 인간을 포함할 때 결과는 다양해지고 주기적으로 변하는데 그 이유는 대개 인간이 감정적이고, 일관되지 못하며, 꾸준하지 않고, 단순하지도 않기 때문이다.<\/li>\n<li>주기는 자기교정적이며, 주기의 전환이 꼭 외부 사건에 의해 좌우되는 것은 아니고 주기가 영원히 계속되지 않고 스스로 전환하는 것은 추세가 그렇게 만들기 때문이다.<\/li>\n<li>성공은 그 자체로 실패의 씨앗을 품고 있으며, 실패는 그 자체로 성공의 씨앗을 품고 있다고 말할 수 있다.<\/li>\n<li>신용 주기는 불가피성, 극단적인 변동성, 투자자들이 이에 대해 적절히 대응할 기회를 만들 수 있다는 점에서 특별히 언급할 가치가 있다.<\/li>\n<li>신용 주기는 자산 가격에 지대한 영향을 미치고, 경제 자체를 지탱해주는 신용 가용성에 큰 변동을 생기게 하려면 경제에서 작은 변동만 있으면 된다.<\/li>\n<li>신용 가용성에 큰 변동을 생기게 하는 프로세스<ul>\n<li>경제는 번영의 시기를 향해 가고 자본 조달자들은 자본 기반을 늘리는 것으로 번영한다.<\/li>\n<li>나쁜 소식이 거의 들리지 않기 때문에 대출과 투자에 수반되는 리스크가 감소한 것처럼 보인다.<\/li>\n<li>리스크 회피가 사라진다.<\/li>\n<li>금융기관들은 사업을 확대하려고 조치를 취한다. 즉 더 많은 자본을 제공하려고 한다.<\/li>\n<li>금융기관들은 요구 수익을 낮추고 (예를 들면 금리인하), 신용 기준을 낮추고, 특정 거래에 더 많은 자본을 제공하고, 계약 조건을 완화하는 것으로 시장점유율을 두고 서로 경쟁한다.<\/li>\n<li>극단적인 경우 자본 조달자들은 이용 자격이 없는 대출자와 프로젝트에 자본을 제공한다.<\/li>\n<li>그로 인해 자본 파괴, 즉 자본비용이 자본 수익을 초과하는 프로젝트에 자본을 투자하여, 결국 자본 수익이 안 남는 사례가 발생한다.<\/li>\n<li>손실 때문에 대출자들은 의욕을 잃고 투자를 회피하게 된다.<\/li>\n<li>리스크 회피가 늘면서 금리가 오르고, 여신 규제, 계약 조건이 늘어난다.<\/li>\n<li>이용할 수 있는 자본금이 줄어든다. (주기의 저점에서는 가장 자격이 있는 사람에게만 대출된다.)<\/li>\n<li>기업들은 자금에 굶주리고, 대출자들은 부채 상환을 연장할 수 없게 되면서 채무불이행과 파산이 발생한다.<\/li>\n<li>이 프로세스는 경기 위축의 원인이자 악화 요인이다.<\/li>\n<\/ul>\n<\/li>\n<li>물론 극단적인 상황에서 프로세스는 다시 방향을 바꿀 준비를 한다.<\/li>\n<li>투자를 하려는 경쟁이 낮기 때문에 높은 신용도와 함께 고수익이 요구될 수 있고 이 시점에서 역투자가들은 자본을 이용하여 고수익을 시도하고, 귀를 솔깃하게 하는 잠재 수익이 자본을 유인하기 시작한다. 이런 식으로 경기회복이 시작된다.<\/li>\n<li>신용 주기에 자기교정 능력이 있고 위의 프로세스를 통해 스스로 제자리를 찾아가고, 이는 경제 주기에 변동성이 생기게 하는 요인 중에 하나이다.<\/li>\n<li>금융계에서는 저리 자금을 제공하면 사람들이 돈을 빌리고, 땅을 사고, 집을 지을 것이다. 그리고 많은 경우 무절제한 상황으로 인해 치명적인 결과가 발생할 것이다.<\/li>\n<li>특히 기본적인 주기들은 결코 끝이 없고 주기는 절대로 멈추는 법이 없다.<\/li>\n<li>과거에 대해 알고, 과거가 반복된다는 것을 이해하는 사람이라면 누구나 \"이번엔 달라\"라는 위험한 사고를 두려워해야 하고 이런 형태의 실수가 발생하면 반드시 알아볼 수 있어야 한다.<\/li>\n<li>우리는 대체로 미래는 과거와 많이 비슷할 것이고, 상승 주기가 있고 하락 주기가 있을 것이라고 결론 내린다.<\/li>\n<li>상황이 호전될 것이라고 주장하기에 적절한 때도 있는데, 이는 시세가 폭락해서 모두가 헐값에 자산을 팔고 있을 때다.<\/li>\n<li>시세가 기록적인 수준을 보이고 있어서 과거에 한 번도 진실이 아니었던 것을 긍정적으로 합리화하는 것도 위험하다.<\/li>\n<li>주기를 무시하고 추세를 추정하는 것은 투자자가 할 수 있는 가장 위험한 일 중 하나다.<\/li>\n<li>사람들은 성공하는 기업들은 끝까지 성공하고, 초과 성과를 내는 투자는 끝까지 초과 성과를 내며, 그렇지 못한 기업이나 투자는 끝까지 실패할 것처럼 행동하나 현실은 이와 반대로 될 가능성이 크다.<\/li>\n<li>두 번째나 세 번째로 도전하는 투자자들은 그쯤 되면 경험이 있으므로, 주기의 중단은 결코 일어나지 않는다는 것을 깨닫고, 그 깨달음을 유리하게 이용해야 한다.<\/li>\n<\/ul>\n<h3>[구조화]<\/h3>\n<ul>\n<li>[막스 본문] 주기는 예측의 도구가 아니라 과열과 침체를 읽는 사고틀이다.<\/li>\n<li>[추론] 이 장은 “이번엔 다르다”를 의심하는 장이며, 이어지는 9장 시계추와 15장 시장온도 점검표의 기반이 된다.<\/li>\n<li>[현대 적용] 신용 확장, 낮아진 기준, 넘치는 자본, 신상품 확산은 사이클 후반부의 반복 신호다.<\/li>\n<\/ul>\n<h3>[실전 질문]<\/h3>\n<ul>\n<li>지금 시장은 어떤 주기를 타고 있는가?<\/li>\n<li>참가자들은 현재 상태가 영구적이라고 가정하고 있지 않은가?<\/li>\n<li>신용 기준은 강화되는가, 완화되는가?<\/li>\n<li>자본이 부족해서 기회가 생기는가, 너무 많아서 가격이 망가지는가?<\/li>\n<li>“이번에는 다르다”는 어떤 서사로 정당화되고 있는가?<\/li>\n<\/ul>\n<h3>[다른 책과의 연결]<\/h3>\n<ul>\n<li>[후대 해석] 강한 연결: 코스톨라니(순환과 심리), 하우절(역사 반복과 인간 본성), 보글(주기 예측보다 규율), 그레이엄(인기와 비인기의 왕복).<\/li>\n<\/ul>\n<h3>[오해 방지]<\/h3>\n<ul>\n<li>[추론] 주기를 안다고 해서 전환 시점을 정밀 예측할 수 있는 것은 아니다.<\/li>\n<li>[추론] 주기 관찰은 전량 매수·전량 매도의 타이밍 기술이 아니라, 공격/방어 강도를 조절하는 기술이다.<\/li>\n<\/ul>","text":"기존 노트 거의 모든 것에는 '주기'가 있음을 꼭 기억해야 한다. 주기에 대해 내가 확신할 수 있는 것은 많지 않지만, 주기는 언제나 이긴다는 것과, 그 어떤 것도 영원히 한 방향으로 움직이지 않는다. 현재 상황이 미래에도 계속될 것이라고 굳게 믿는 것처럼 건전한 투자에 위험한 것은 없다. 원칙1: 대부분의 것들이 주기를 따른다는 사실이 증명될 것이다. 원칙2: 수익과 손실을 가져오는 가장 큰 기회들은, 다른 이들이 '원칙1'을 망각했을 때 찾아오는 경우가 많다. 중요한 원칙은 무엇이든 커졌다 작아지고, 증가했다 하락한다는 것이다. 역사나 경제 같은 분야의 프로세스는 인간을 포함하며, 인간을 포함할 때 결과는 다양해지고 주기적으로 변하는데 그 이유는 대개 인간이 감정적이고, 일관되지 못하며, 꾸준하지 않고, 단순하지도 않기 때문이다. 주기는 자기교정적이며, 주기의 전환이 꼭 외부 사건에 의해 좌우되는 것은 아니고 주기가 영원히 계속되지 않고 스스로 전환하는 것은 추세가 그렇게 만들기 때문이다. 성공은 그 자체로 실패의 씨앗을 품고 있으며, 실패는 그 자체로 성공의 씨앗을 품고 있다고 말할 수 있다. 신용 주기는 불가피성, 극단적인 변동성, 투자자들이 이에 대해 적절히 대응할 기회를 만들 수 있다는 점에서 특별히 언급할 가치가 있다. 신용 주기는 자산 가격에 지대한 영향을 미치고, 경제 자체를 지탱해주는 신용 가용성에 큰 변동을 생기게 하려면 경제에서 작은 변동만 있으면 된다. 신용 가용성에 큰 변동을 생기게 하는 프로세스 경제는 번영의 시기를 향해 가고 자본 조달자들은 자본 기반을 늘리는 것으로 번영한다. 나쁜 소식이 거의 들리지 않기 때문에 대출과 투자에 수반되는 리스크가 감소한 것처럼 보인다. 리스크 회피가 사라진다. 금융기관들은 사업을 확대하려고 조치를 취한다. 즉 더 많은 자본을 제공하려고 한다. 금융기관들은 요구 수익을 낮추고 (예를 들면 금리인하), 신용 기준을 낮추고, 특정 거래에 더 많은 자본을 제공하고, 계약 조건을 완화하는 것으로 시장점유율을 두고 서로 경쟁한다. 극단적인 경우 자본 조달자들은 이용 자격이 없는 대출자와 프로젝트에 자본을 제공한다. 그로 인해 자본 파괴, 즉 자본비용이 자본 수익을 초과하는 프로젝트에 자본을 투자하여, 결국 자본 수익이 안 남는 사례가 발생한다. 손실 때문에 대출자들은 의욕을 잃고 투자를 회피하게 된다. 리스크 회피가 늘면서 금리가 오르고, 여신 규제, 계약 조건이 늘어난다. 이용할 수 있는 자본금이 줄어든다. (주기의 저점에서는 가장 자격이 있는 사람에게만 대출된다.) 기업들은 자금에 굶주리고, 대출자들은 부채 상환을 연장할 수 없게 되면서 채무불이행과 파산이 발생한다. 이 프로세스는 경기 위축의 원인이자 악화 요인이다. 물론 극단적인 상황에서 프로세스는 다시 방향을 바꿀 준비를 한다. 투자를 하려는 경쟁이 낮기 때문에 높은 신용도와 함께 고수익이 요구될 수 있고 이 시점에서 역투자가들은 자본을 이용하여 고수익을 시도하고, 귀를 솔깃하게 하는 잠재 수익이 자본을 유인하기 시작한다. 이런 식으로 경기회복이 시작된다. 신용 주기에 자기교정 능력이 있고 위의 프로세스를 통해 스스로 제자리를 찾아가고, 이는 경제 주기에 변동성이 생기게 하는 요인 중에 하나이다. 금융계에서는 저리 자금을 제공하면 사람들이 돈을 빌리고, 땅을 사고, 집을 지을 것이다. 그리고
