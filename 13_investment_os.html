\/ul>\n<hr />","text":"이 절은 Run 7의 핵심이다. 여섯 권은 겉으로는 자주 충돌한다. 그러나 충돌의 대부분은 “원칙의 충돌”이라기보다 “적용 대상, 투자자 능력, 시간지평, 비용 구조, 시장온도”의 차이에서 발생한다. 4-1. 린치의 개별주 발굴 vs 보글의 인덱스 기본 해법 전선 린치는 개인투자자가 생활·업무 현장에서 월가보다 먼저 좋은 기업을 발견할 수 있다고 본다. 그는 6가지 유형, 2분 독백, 숫자 확인, 유형별 매도를 통해 텐베거를 찾을 수 있다고 말한다. (린치 서문·6~17장) 보글은 대다수 투자자가 비용 차감 후 시장을 이기기 어렵고, 바늘을 찾기보다 건초더미를 사는 편이 합리적이라고 본다. (보글 3·10·11·13장) 양측 최강 논거 린치 측 최강 논거: 기관은 제약이 많고, 이미 알려진 대형주·인기주에 몰리기 쉽다. (린치 2장) 개인은 직장, 소비, 지역, 공급망, 고객 경험에서 조기 신호를 볼 수 있다. (린치 6장) 그러나 유망기업 발견은 첫 단계일 뿐이다. 이익 전망, 재무상태, 경쟁, 확장 계획을 조사하기 전에는 투자해서는 안 된다. (린치 서문·11~15장) 종목 유형이 다르면 성공 조건과 매도 조건도 다르다. (린치 7·17장) 보글 측 최강 논거: 시장 참가자 전체의 평균은 시장이고, 비용 차감 후 평균 투자자는 시장보다 낮아진다. (보글 3~5장) 과거 성과가 좋은 펀드·매니저를 사전에 골라 장기간 유지하기는 어렵다. (보글 10·11장) 거래가 늘수록 비용·세금·감정 실수가 누적된다. (보글 1·4·7·8장) 전체시장을 저비용으로 오래 보유하면 종목·매니저 선택 위험을 제거하고 시장위험만 남긴다. (보글 13장) 실은 합의하는 것 둘 다 “조사 없는 확신”을 싫어한다. 린치는 “아는 회사”라는 친숙함만으로 사지 말라고 한다. (린치 서문·11장) 보글은 대다수가 자신이 평균 이상이라고 착각한다고 본다. (보글 10·11장) 막스는 이 논쟁에 판정 기준을 준다. 시장과 다르게 생각하는 것만으로는 부족하고, 다르면서 더 정확해야 한다. (막스 01·02장) 하우절은 또 다른 판정 기준을 준다. 내가 감정적으로 견딜 수 없는 전략은 수학적으로 맞아도 내 전략이 아니다. (하우절 11·16장) 그레이엄은 최종 제한을 준다. 분석·원금 안전·만족스러운 수익 구조가 없으면 투자라고 부르기 어렵다. (그레이엄 1장) 판정 변수 변수 질문 보글 쪽으로 기울 때 린치 쪽으로 열릴 때 시간 나는 기업을 지속적으로 추적할 시간이 있는가? 분기 실적·공시·스토리 점검 불가 정기 점검 가능 분석 재무제표와 사업 모델을 해석할 수 있는가? PER·부채·이익 질 해석 불가 이익·현금흐름·부채·경쟁 확인 가능 우위 내가 남보다 먼저 또는 다르게 볼 근거가 있는가? 단순 뉴스·커뮤니티 추종 업무·소비·공급망·비인기 영역의 관찰 우위 기질 하락장에서 스토리와 가격을 구분할 수 있는가? 가격 하락에 즉시 흔들림 가설 유지/훼손을 분리 가능 비용 거래 회전율을 낮게 유지할 수 있는가? 잦은 매매·세금·환전 비용 큼 낮은 회전율 유지 실패 비용 틀렸을 때 포트폴리오가 생존하는가? 집중·레버리지·단기자금 위성 비중 제한, 무레버리지 실행 절충 [추론] 통합 원칙은 다음이다. 기본 포트폴리오는 보글식 저비용·광범위·장기 구조로 둔다. (보글 13·18~20장) 개별주는 린치식 2분 독백과 유형 분류, 그레이엄식 가격/가치, 막스식 리스크 보상, 하우절식 지속 가능성을 통과한 경우에만 위성으로 둔다. (린치 7·11~17장, 그레이엄 20장, 막스 04~07장, 하우절 11·13장) 개별주 비중은 확신이 아니라 오판 시 생존 가능성으로 정한다. (하우절 5·13장, 막스 17장) 판정 린치와 보글의 충돌은 승패가 아니라 순서다. 보글은 기본값을 정하고, 린치는 기본값을 이탈하려면 필요한 절차를 정한다. 막스는 우위의 질을 묻고, 그레이엄은 가격과 안전마진을 묻고, 하우절은 지속 가능성을 묻는다. 4-2. 코스톨라니의 금리·달걀 프레임 vs 그레이엄·린치·막스의 예측 회의론 전선 코스톨라니는 돈과 심리가 중기 추세를 만든다고 본다. 금리와 유동성, 대중심리, 손바뀜, 달걀 국면을 관찰해야 한다고 말한다. (코스톨라니 5·7·8장) 반면 그레이엄, 린치, 막스는 시장·금리·거시 예측을 일관된 초과수익 원천으로 보지 않는다. 그레이엄은 가격과 가치에 집중하고, 린치는 시장을 묻지 말고 기업을 보라고 하며, 막스는 미래를 맞히려 하지 말고 현재 위치를 파악하라고 한다. (그레이엄 3·8·20장, 린치 5장, 막스 14·15장) 정밀 판정 이 충돌은 “예측을 할 것인가 말 것인가”가 아니라 “거시·심리 정보를 어디에 쓸 것인가”의 문제다. 코스톨라니는 거시와 심리를 버리라고 하지 않는다. 그는 돈+심리=트렌드라는 프레임으로 중기 흐름을 관찰한다. (코스톨라니 7장) 그레이엄은 가격 변동에 대응하되, 대응 기준을 예측이 아니라 가격과 가치에 둔다. (그레이엄 8·20장) 린치는 시장이 좋은지보다 기업이 좋은지, 그리고 가격이 합리적인지를 보라고 한다. (린치 5·10~12장) 막스는 미래를 맞히려 하지 말고 현재 시장의 온도를 재서 공격과 방어의 강도를 조절하라고 한다. (막스 14·15·17장) 허용되는 사용과 금지되는 사용 도구 허용되는 사용 금지되는 사용 코스톨라니 달걀 현재 시장이 무관심·불신·과열·투매 중 어디에 가까운지 보는 온도계. (코스톨라니 8장) A1이면 무조건 매수, A3이면 무조건 매도 같은 기계적 공식. 금리 관찰 주식과 채권의 상대 매력, 유동성, 신용환경을 점검. (코스톨라니 7장, 보글 14·18장) “금리 인하=무조건 주식 매수” 식의 단선적 예측. 막스 시장온도 리스크 프리미엄, 신용, 레버리지, 낙관·비관을 보고 공격/방어 조절. (막스 15·17장) 지수 고점·저점 타이밍 도구. 그레이엄 가격 신호 과열 시 기대수익률을 낮추고 리밸런싱. (그레이엄 3·8장) 고평가 판단만으로 전량 현금화. 린치 기업 중심 기업 스토리와 숫자를 우선. (린치 5·11~15장) 금리 변화가 기업 실적·PER에 주는 영향을 완전히 무시. 실행 결론 [추론] 코스톨라니의 금리·달걀 프레임은 매수/매도 버튼이 아니다. 그것은 신규 매수 허들, 현금 사용 속도, 레버리지 허용 여부, 포지션 집중도를 조절하는 온도계다. 금리 하락은 주식에 우호적일 수 있지만, 이미 가격에 반영되었는지 확인해야 한다. (코스톨라니 7장, 막스 04장) 금리 하락의 원인이 경기 붕괴라면 유동성 호재와 실적 악재가 동시에 존재할 수 있다. [추론] (코스톨라니 7장, 막스 15장) 시장이 뜨거우면 신규 매수 허들을 올리고, 레버리지와 집중을 줄인다. (막스 15·17장, 그레이엄 8장) 시장이 차가우면 현금과 후보군을 사용하되, 가치와 생존성을 더 엄격히 확인한다. (막스 11~13·17장, 그레이엄 20장) 판정 코스톨라니는 예측가로 쓰면 위험하고, 관찰자로 쓰면 강력하다. 막스는 이 관찰을 실행 규율로 번역한다. 그레이엄은 가격 규율을, 린치는 기업 검증을 붙인다. 4-3. 자산배분: 그레이엄 50:50, 보글 생애주기, 린치 주식 중심, 하우절 밤잠, 막스 방어투자 전선 저자 자산배분 관점 그레이엄 방어적 투자자는 우량채권과 우량주를 균형 있게 보유한다. 50:50은 기준점이며, 과열·침체에 따라 범위 안에서 조절한다. (그레이엄 4장) 보글 주식·채권 인덱스와 생애주기 자산배분을 중시한다. 낮은 비용과 단순성을 우선한다. (보글 14·18~20장) 린치 장기적으로 주식의 성장성을 강조하지만, 12개월~2·3년 내 필요한 돈은 주식에 넣지 말라고 한다. (린치 밀레니엄판 서문, 린치 4장) 하우절 수학적으로 최적보다 밤잠을 잘 수 있는 합리적 전략이 낫다. (하우절 11장) 막스 시장온도와 리스크 보상에 따라 공격/방어 강도를 조절한다. (막스 15·17장) 코스톨라니 주식은 핵심 투자수단이지만 채권·금리·돈의 흐름도 중요하다. (코스톨라니 3·7장) 실제 충돌의 핵심 이 충돌은 “정답 비중”의 충돌이 아니라 “비중을 정하는 기준”의 충돌이다. 그레이엄의 50:50은 최적화된 수익률 공식이 아니라 감정 폭주를 막는 기준점이다. (그레이엄 4장) 보글의 자산배분은 시장 예측보다 지속 가능한 포트폴리오 구조를 중시한다. (보글 18~20장) 린치의 주식 중심성은 장기자금이라는 전제가 붙는다. 12개월 뒤 학비·결혼비용으로 쓸 돈은 주식에 넣지 말라고 한다. (린치 밀레니엄판 서문, 린치 4장) 하우절의 밤잠 기준은 숫자 최적화보다 행동 지속성을 우선한다. (하우절 11장) 막스의 방어투자는 과열기에 큰 손실을 줄이고, 공포기에 기회를 잡을 수 있게 하는 동적 강도 조절이다. (막스 15·17장) 통합 자산배분 질문 5개 질문 연결 저자 판단 기준 이 돈은 언제 필요한가? 린치, 보글, 하우절 12개월~3년 내 필요 자금은 위험자산에서 분리. (린치 4장, 보글 18~19장, 하우절 10·13장) 하락장에서 나는 실제로 무엇을 할 사람인가? 하우절, 그레이엄 이론적 위험성향보다 과거 행동과 밤잠 기준. (하우절 1·11장, 그레이엄 4장) 시장온도는 어떤가? 막스, 코스톨라니, 그레이엄 뜨거우면 방어 강화, 차가우면 선별적 공격. (막스 15·17장, 코스톨라니 8장, 그레이엄 8장) 비용·세금·계좌 구조는 어떤가? 보글 같은 자산배분도 계좌와 비용에 따라 순수익이 달라진다. (보글 4~8·18~20장) 내 초과수익 우위는 존재하는가? 린치, 막스, 보글 우위가 없으면 개별주 비중을 줄이고 전체시장 비중을 높인다. (린치 6~15장, 막스 01~02장, 보글 10~13장) 실행 결론 [추론] 자산배분의 순서는 다음이다. 생활비·비상금·단기자금 분리. 장기자금의 저비용 분산 포트폴리오 구축. 감정적으로 유지 가능한 주식/채권/현금 비중 설정. 시장온도에 따라 신규 매수 허들과 리밸런싱 속도 조절. 개별주 위성 비중은 검증된 우위와 생존 가능성으로 제한. 공격적 투자자는 주식 비중이 높은 사람이 아니라, 하락장에도 분석·현금·기질·시간을 유지할 수 있는 사람이다. (그레이엄 7·15장, 막스 17장, 코스톨라니 8장) 4-4. 린치 유형별 매도 vs 보글 장기보유 vs 코스톨라니 국면 전환 vs 막스 시장온도 전선 관점 매도 기준 린치 유형별 스토리 훼손, 과열, 성장 둔화, 회복 완료, 자산가치 실현. (린치 14·17장) 보글 낮은 비용으로 전체시장을 오래 보유하라. 빈번한 매매는 수익을 갉아먹는다. (보글 1·13·20장) 코스톨라니 손바뀜, 대중 참여, 국면 변화, 과장국면을 관찰하라. (코스톨라니 5·8장) 막스 가격-가치 관계와 리스크 보상, 시장온도에 따라 공격/방어를 조절하라. (막스 04·15·17장) 그레이엄 Mr. Market의 가격 제안을 이용하되 휘둘리지 말라. (그레이엄 8장) 하우절 다른 게임의 신호에 설득되지 말라. 변동성은 벌금이 아니라 수수료다. (하우절 15~16장) 실제 충돌의 핵심 매도에는 두 종류가 있다. 소유권 자체를 팔아야 하는 매도. 개별 기업의 투자 가설이 훼손되었거나, 가격이 가치 대비 과도해졌거나, 리스크 보상이 사라진 경우다. (린치 17장, 그레이엄 20장, 막스 04장) 포트폴리오의 강도를 조절하는 매도. 시장온도가 높아져 기대수익률이 낮고 좌측 꼬리 리스크가 커질 때, 전체 위험 노출을 줄이는 경우다. (막스 15·17장, 코스톨라니 8장, 그레이엄 8장) 보글의 장기보유는 첫 번째 매도 판단이 필요 없는 “시장 전체 소유”에 가장 잘 맞는다. 그러나 개별주를 보유할 때 보글식 장기보유를 그대로 적용하면, 훼손된 기업을 영구 보유하는 오류가 생긴다. (보글 13·20장, 린치 17장) 대상별 매도 기준 보유 대상 기본 매도 기준 관련 저자 전체시장 인덱스 코어 자산배분·생활자금·세금·은퇴 현금흐름 변화가 아니면 매도 최소화 보글 13·18~20장, 하우절 11·19장 개별 우량주 이익선·PER·성장 둔화·경쟁우위 변화·과열 여부 린치 10·14·17장, 그레이엄 13~14장 가치주·염가주 가치 수렴, 안전마진 축소, 가치훼손, 자본배분 악화 그레이엄 15·20장, 막스 04·12장 회생주·자산주 회생 완료, 자산가치 실현, 부채 재악화, 촉매 소멸 린치 15·17장, 그레이엄 15장 고성장주 성장 공식 훼손, 확장 여지 감소, 과열 PER, 기관 과밀 린치 7·11·15·17장, 막스 04장 전체 위험 노출 시장온도 과열, 리스크 프리미엄 축소, 레버리지 확대, FOMO 막스 15·17장, 코스톨라니 7~8장, 그레이엄 8장 실행 결론 [추론] 인덱스는 보글식으로 오래 보유한다. 단, 자산배분 변화와 생활자금 필요는 예외다. (보글 13·18~20장) 개별주는 린치식으로 보유 중 스토리를 재확인하고, 유형별 매도 기준을 적용한다. (린치 14·17장) 시장 전체가 과열되면 막스·코스톨라니식으로 신규 매수 허들을 높이고 위험 노출을 낮춘다. 단, 이것은 시장 예측이 아니라 리스크 보상 변화에 대한 조절이다. (막스 15·17장, 코스톨라니 8장) 4-5. 보글의 미국 중심 주장 vs 한국 투자자 관점 전선 보글의 원전적 맥락은 미국 투자자에게 강하다. 미국 시장은 거대하고, 달러 생활비와 달러 자산이 일치하며, 미국 대기업은 글로벌 매출 노출을 가진다. 그러나 한국 투자자는 원화 생활비, 환율, 국내외 세금, 계좌 구조, 연금저축·IRP·ISA, 국내 기업 지배구조, 국내시장 규모 문제를 별도로 고려해야 한다. [현대 적용] (보글 4·8·13·18~20장, 하우절 11·16장) 통합 판정 보글 원칙 한국식 재해석 시장 전체를 사라. (보글 13장) “미국 전체”가 아니라 “내 생활통화와 장기 목표에 맞는 글로벌 소유권”을 정의한다. 비용을 최소화하라. (보글 4~5장) TER만 보지 말고 환전 스프레드, 배당 원천징수, 양도세, 금융소득, 계좌 과세를 함께 본다. 오래 보유하라. (보글 20장) 장기 보유가 환리스크를 제거하지 않는다. 원화 지출 계획과 함께 설계한다. ETF도 괜찮다. (보글 15장) 레버리지·인버스·테마·단일종목 ETF는 보글식 인덱스가 아니라 거래 도구다. 자산배분하라. (보글 18~19장) 은퇴자는 원화 인출, 세금, 건강보험료, 연금계좌 규칙까지 고려한다. 다른 저자와의 연결 그레이엄: 한국 개별주에 그레이엄식 기준을 적용할 때 PER/PBR, 배당기록, 재무건전성 수치를 기계적으로 쓰지 말고 산업·회계·지배구조 차이를 반영한다. [현대 적용] (그레이엄 5·13~14장) 린치: 한국 투자자는 생활·업무 현장에서 국내 기업 정보우위를 가질 수 있지만, 지배구조·유동성·단일 고객·계열 거래를 더 엄격히 봐야 한다. [현대 적용] (린치 6·12~15장) 하우절: 원화 생활비와 달러 자산의 변동성은 심리적 체감 손실을 키울 수 있다. 밤잠 기준이 중요하다. (하우절 11·16장) 막스: 한국 시장도 글로벌 유동성, 달러금리, 산업 사이클, 개인 레버리지에 영향을 받으므로 시장온도 점검이 필요하다. [현대 적용] (막스 15·18장) 코스톨라니: 돈+심리 프레임은 한국의 개인투자자 쏠림, 신용잔고, 테마 확산에도 적용 가능하다. 단, 일화가 아니라 프레임워크 중심으로만 쓴다. [현대 적용] (코스톨라니 7~8장) 4-6. 리스크 정의의 차이 저자 리스크 정의 장점 오용 위험 그레이엄 안전마진 부족, 원금 안전 훼손. (1·20장) 가격과 가치에 기반한 실전성 가치추정이 틀리면 안전마진도 착시 하우절 생존 실패, 레버리지, 충분함 부재, 다른 게임 추종. (3·5·13·16장) 인간 행동과 재무생활 전체 포함 지나치게 보수적으로 읽으면 성장 기회 회피 코스톨라니 빚, 군중심리, 돈 없는 확신, 손바뀜. (1·2·8장) 시장 심리와 유동성의 위험 포착 달걀을 예측 공식으로 오용할 위험 보글 시장위험은 남기되 종목·매니저·비용·세금·감정 위험 제거. (0·4~8·13장) 대다수 투자자에게 실행성 높음 시장 전체 고평가·국가 집중 리스크는 남음 린치 모르는 기업, 나쁜 가격, 부채, 유형 오판, 스토리 훼손. (4·7·9·13·15·17장) 개별주 실무 점검에 강함 개인의 “안다”는 착각이 위험 막스 변동성보다 영구 손실, 보이지 않는 리스크, 과열기 축적. (05~07·18장) 리스크의 비가시성과 주기성 설명 과도한 리스크 인식이 실행 마비로 이어질 수 있음 통합 정의 [추론] 리스크란 단기 변동성이 아니라, “내가 계획한 복리를 중단시키는 사건·구조·행동의 총합”이다. 다만 “변동성은 리스크가 아니다”라고 단순화해서는 안 된다. 막스식 정의로는 변동성 자체가 영구 손실은 아니지만, 보글·하우절·그레이엄식 실행 체계에서는 변동성이 행동오류를 유발하는 경로 위험이다. 즉 변동성은 독립적 원인이라기보다 레버리지, 단기 필요자금, 밤잠 손상, 리밸런싱 실패와 결합할 때 복리 중단 위험으로 바뀐다. (막스 05장, 하우절 11·15장, 보글 18~20장, 그레이엄 4·8장) 리스크 구성 요소: 가격 리스크: 가치보다 비싸게 사는 것. (그레이엄 20장, 막스 04장, 린치 10장) 행동 리스크: 공포·탐욕·비교·FOMO·본전 심리. (하우절 3·15~18장, 막스 10장, 코스톨라니 8장) 구조 리스크: 레버리지, 강제매도, 유동성 부족, 세금·비용, 단일 고객, 부채. (막스 07·18장, 보글 4~8장, 린치 9·13장) 지식 리스크: 모르는 기업, 모르는 상품, 모르는 게임. (린치 4·12장, 하우절 16장, 그레이엄 1장) 주기 리스크: 편안한 시기에 쌓여 불황에 드러나는 위험. (막스 06·15장, 코스톨라니 7~8장) 시간 리스크: 단기 필요자금을 변동성 자산에 넣는 것. (린치 4장, 하우절 10·13장, 보글 18~19장)"},{"i":6,"title":"5. 시장 사이클 통합 행동 모델","html":"<p>이 절은 4-2의 결론을 실행 모델로 확장한다. 이 모델은 시장 타이밍 공식이 아니다. 목적은 지수 고점·저점 예측이 아니라, 현재 시장의 온도를 보고 <strong>신규 매수 허들, 현금 사용 속도, 레버리지 허용 여부, 포지션 집중도, 리밸런싱 강도<\/strong>를 조절하는 것이다. (막스 08·09·15·17장, 코스톨라니 7·8장, 그레이엄 3·8장)<\/p>\n<h3>5-1. 모델의 전제<\/h3>\n<p>[명시] 막스의 주기 관찰은 “나는 모른다”는 전제에서 출발한다. 주기와 시계추를 알면 내일을 맞힐 수 있다는 뜻이 아니라, 현재 위치가 위험한 쪽인지 기회 쪽인지 가늠할 수 있다는 뜻이다. (막스 14·15장)<\/p>\n<p>[명시] 코스톨라니의 달걀은 시장의 손바뀜과 심리의 순환을 보는 프레임이다. 그러나 이를 기계적 예측 공식으로 쓰면 안 된다. (코스톨라니 7·8장)<\/p>\n<p>[명시] 그레이엄은 시장의 변동을 Mr. Market의 제안으로 보고, 가격이 가치와 크게 벌어질 때만 반응하라고 한다. (그레이엄 8장)<\/p>\n<p>[명시] 보글과 하우절은 많은 투자자에게 국면 대응 자체가 불필요하거나 위험할 수 있다고 본다. 코어 포트폴리오는 손대지 않는 것이 기본값이다. (보글 13·20장, 하우절 11·20장)<\/p>\n<p>[추론] 따라서 이 모델을 실제로 적용할 수 있는 사람은 제한적이다. 기록 습관, 감정 통제, 자산배분 규칙, 현금 여력, 리밸런싱 절차가 없다면 시장온도표는 오히려 과잉매매 도구가 된다.<\/p>\n<h3>5-2. 시장온도 신뢰도 등급<\/h3>\n<p>국면 이름만 붙이는 것은 위험하다. 같은 신호도 맥락에 따라 다르게 작동한다. 따라서 시장온도 판단에는 신뢰도 등급을 붙인다.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>등급<\/th>\n<th>조건<\/th>\n<th>허용 행동<\/th>\n<th>금지 행동<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>낮음<\/td>\n<td>신호가 1~2개뿐이고 가격-가치 괴리가 불명확<\/td>\n<td>관찰, 후보군 작성, 메모<\/td>\n<td>비중 변경, 전량 매수·매도<\/td>\n<td>막스 14·15장, 하우절 12장<\/td>\n<\/tr>\n<tr>\n<td>중간<\/td>\n<td>심리·밸류에이션·신용·거래량 중 3개 이상이 같은 방향<\/td>\n<td>신규 매수 허들 조정, 리밸런싱 검토<\/td>\n<td>레버리지, 단일 시나리오 몰입<\/td>\n<td>막스 15·17장, 코스톨라니 7·8장<\/td>\n<\/tr>\n<tr>\n<td>높음<\/td>\n<td>강제매도·과열·신용경색·대중 참여 등 복수 신호가 극단<\/td>\n<td>분할 공격 또는 방어 강화<\/td>\n<td>전량 진입·이탈, 예측 확신<\/td>\n<td>막스 12·13·15·17장, 코스톨라니 8장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>핵심은 맞히는 것이 아니라, 틀려도 망가지지 않는 방식으로 강도를 조절하는 것이다. 시장온도 판단이 틀릴 수 있으므로 모든 행동은 분할·밴드·체크리스트 안에서만 실행한다. (막스 05·15·17장, 하우절 13장)<\/p>\n<h3>5-3. 9단계 시장 행동 모델<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">단계<\/th>\n<th>시장 상태<\/th>\n<th>군중 심리<\/th>\n<th>가격/가치<\/th>\n<th>대표 위험<\/th>\n<th>통합 행동<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td>침체 후 무관심<\/td>\n<td>“주식은 끝났다”<\/td>\n<td>우량 자산도 할인 가능<\/td>\n<td>가치 함정, 너무 이른 매수<\/td>\n<td>후보군 작성, 재무 생존성 확인, 분할 매수 시작<\/td>\n<td>막스 12~13·15장, 코스톨라니 8장, 그레이엄 20장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>불신 랠리<\/td>\n<td>상승을 믿지 않음<\/td>\n<td>일부 가치 수렴 시작<\/td>\n<td>현금 과다, 기회 놓침<\/td>\n<td>코어 유지, 위성 후보 선별 매수<\/td>\n<td>코스톨라니 7~8장, 막스 11~13장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td>정상화<\/td>\n<td>신중한 낙관<\/td>\n<td>가격과 가치 균형<\/td>\n<td>무행동/과잉행동 모두 가능<\/td>\n<td>기본 자산배분 유지, 리밸런싱<\/td>\n<td>보글 13·18장, 그레이엄 4·8장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td>확산 상승<\/td>\n<td>자신감 증가<\/td>\n<td>우량주 프리미엄 확대<\/td>\n<td>기대수익률 하락<\/td>\n<td>신규 매수 허들 상향, 개별주 검증 강화<\/td>\n<td>막스 04·15장, 린치 10·17장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td>후기 과열<\/td>\n<td>FOMO, 서사 과잉<\/td>\n<td>가치보다 높은 가격<\/td>\n<td>얇은 리스크 프리미엄<\/td>\n<td>리스크 축소, 레버리지 제거, 부분 리밸런싱<\/td>\n<td>막스 06·15·17장, 그레이엄 3·8장, 코스톨라니 8장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td>균열<\/td>\n<td>불안과 부정 공존<\/td>\n<td>고평가 자산 흔들림<\/td>\n<td>낙폭 과소평가, 반등 착각<\/td>\n<td>취약 포지션 점검, 현금·채권·비상금 확인<\/td>\n<td>막스 18장, 보글 18~19장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td>강제매도<\/td>\n<td>공포, 환매, 마진콜<\/td>\n<td>가격이 가치 밑으로 이탈 가능<\/td>\n<td>유동성 경색, 상관관계 상승<\/td>\n<td>강제매도 주체 탐색, 분할 매수 후보 실행<\/td>\n<td>막스 04·12·13·18장, 코스톨라니 5·8장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td>투매 후 침묵<\/td>\n<td>체념, 혐오<\/td>\n<td>가장 큰 할인 가능<\/td>\n<td>구조적 부실과 저평가 혼동<\/td>\n<td>안전마진·생존성 기준으로 선별 공격<\/td>\n<td>그레이엄 20장, 막스 11~13·17장<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td>회복 초기<\/td>\n<td>여전히 회의적<\/td>\n<td>가치 수렴 시작<\/td>\n<td>너무 빨리 매도<\/td>\n<td>보유 가설 재확인, 승자 유지<\/td>\n<td>린치 14·17장, 하우절 6·15장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>5-4. 시장온도 점검표<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>점검 항목<\/th>\n<th>차가운 시장<\/th>\n<th>뜨거운 시장<\/th>\n<th>행동 번역<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>투자자 심리<\/td>\n<td>공포·무관심<\/td>\n<td>낙관·탐욕<\/td>\n<td>차가우면 후보 확대, 뜨거우면 허들 상향<\/td>\n<td>막스 15장, 코스톨라니 8장<\/td>\n<\/tr>\n<tr>\n<td>뉴스 반응<\/td>\n<td>악재 과대반응<\/td>\n<td>악재 무시<\/td>\n<td>악재 무시 구간은 방어 강화<\/td>\n<td>막스 15장, 하우절 17장<\/td>\n<\/tr>\n<tr>\n<td>신용·레버리지<\/td>\n<td>축소·경색<\/td>\n<td>확대·완화<\/td>\n<td>레버리지 확대 구간은 스트레스 테스트<\/td>\n<td>막스 06·18장, 코스톨라니 8장<\/td>\n<\/tr>\n<tr>\n<td>유동성<\/td>\n<td>자금 부족<\/td>\n<td>자금 넘침<\/td>\n<td>자금 넘침은 질 낮은 아이디어 확산 경고<\/td>\n<td>막스 18장, 코스톨라니 7장<\/td>\n<\/tr>\n<tr>\n<td>밸류에이션<\/td>\n<td>낮음<\/td>\n<td>높음<\/td>\n<td>낮으면 선별 매수, 높으면 기대수익률 낮춤<\/td>\n<td>그레이엄 3·8장, 막스 04장<\/td>\n<\/tr>\n<tr>\n<td>대중 참여<\/td>\n<td>관심 없음<\/td>\n<td>모두가 이야기함<\/td>\n<td>대중 참여 폭증은 손바뀜 경계<\/td>\n<td>코스톨라니 8장<\/td>\n<\/tr>\n<tr>\n<td>상품 출시<\/td>\n<td>드묾<\/td>\n<td>테마·ETF·펀드 우후죽순<\/td>\n<td>신규 상품 과열은 보류 또는 축소<\/td>\n<td>막스 18장, 보글 15~16장<\/td>\n<\/tr>\n<tr>\n<td>현금 보유 감정<\/td>\n<td>편안함<\/td>\n<td>고통스러움<\/td>\n<td>현금 보유가 고통스러울수록 FOMO 경계<\/td>\n<td>막스 13·15장, 하우절 11장<\/td>\n<\/tr>\n<tr>\n<td>내 행동 충동<\/td>\n<td>점검·관찰<\/td>\n<td>매수 충동·자랑 충동<\/td>\n<td>충동이 강할수록 매수 보류<\/td>\n<td>하우절 3·11·16장, 막스 10장<\/td>\n<\/tr>\n<tr>\n<td>가격-가치 괴리<\/td>\n<td>가치 대비 할인<\/td>\n<td>성장 서사 대비 과열<\/td>\n<td>가격이 없으면 판단하지 않음<\/td>\n<td>그레이엄 20장, 막스 04장, 린치 10장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>5-5. 국면별 포트폴리오 행동<\/h3>\n<h4>차가운 시장<\/h4>\n<p>명시적 근거:<\/p>\n<ul>\n<li>막스는 강제매도와 구조적 매도자가 기회를 만들 수 있다고 본다. (막스 04·12~13장)<\/li>\n<li>그레이엄은 안전마진이 확보될 때 저가매수가 가능하다고 본다. (그레이엄 20장)<\/li>\n<li>코스톨라니는 하락 과장국면에서 소신파가 물량을 받을 수 있다고 본다. (코스톨라니 8장)<\/li>\n<li>하우절은 공포의 순간에 평범한 행동을 지속하는 능력이 중요하다고 본다. (하우절 6·15장)<\/li>\n<\/ul>\n<p>행동:<\/p>\n<ul>\n<li>기존 보유분을 무조건 팔지 않는다.<\/li>\n<li>현금·비상금·단기 필요자금을 재확인한다.<\/li>\n<li>강제매도 후보와 구조적 부실 후보를 구분한다.<\/li>\n<li>개별주는 린치식 스토리 유지 여부와 그레이엄식 재무 생존성을 함께 확인한다. (린치 14·17장, 그레이엄 13·20장)<\/li>\n<li>매수는 한 번에 하지 않고 단계적으로 한다. 추가 하락을 견딜 구조가 있어야 한다. (막스 11~13장)<\/li>\n<li>레버리지는 사용하지 않는다. 맞아도 먼저 죽을 수 있기 때문이다. (막스 07·18장, 하우절 13장, 코스톨라니 8장)<\/li>\n<\/ul>\n<h4>중립 시장<\/h4>\n<p>명시적 근거:<\/p>\n<ul>\n<li>보글은 장기 저비용 보유와 자산배분을 강조한다. (보글 13·18~20장)<\/li>\n<li>그레이엄은 예측보다 균형과 리밸런싱을 중시한다. (그레이엄 4·8장)<\/li>\n<li>하우절은 적당히 합리적이고 지속 가능한 전략을 선호한다. (하우절 11장)<\/li>\n<\/ul>\n<p>행동:<\/p>\n<ul>\n<li>코어 포트폴리오는 손대지 않는다.<\/li>\n<li>위성 개별주는 린치식 체크리스트를 통과한 것만 보유한다.<\/li>\n<li>리밸런싱은 가격 예측이 아니라 원칙 복원으로 수행한다.<\/li>\n<li>새 아이디어보다 기존 보유 논리 점검에 시간을 더 쓴다.<\/li>\n<li>비용·세금·환전·계좌 구조를 최적화한다. [현대 적용] (보글 4~8장)<\/li>\n<\/ul>\n<h4>뜨거운 시장<\/h4>\n<p>명시적 근거:<\/p>\n<ul>\n<li>막스는 리스크가 편안한 시기에 쌓이고, 리스크가 낮다는 믿음이 가장 위험하다고 본다. (막스 06·15·18장)<\/li>\n<li>그레이엄은 강세장의 높은 PER, 낮은 배당수익률, 신용거래 투기 증가를 경고 신호로 본다. (그레이엄 3·8장)<\/li>\n<li>코스톨라니는 강세장 과장국면에서 대중 참여와 거래량 폭증을 경계한다. (코스톨라니 8장)<\/li>\n<li>보글은 ETF와 펀드가 단기투기 도구가 될 수 있음을 경계한다. (보글 15~16장)<\/li>\n<\/ul>\n<p>행동:<\/p>\n<ul>\n<li>신규 매수 허들을 올린다.<\/li>\n<li>레버리지와 집중 포지션을 줄인다.<\/li>\n<li>“이번엔 다르다” 서사를 문서화하고 반대 논거를 붙인다. (막스 18장, 하우절 18장)<\/li>\n<li>가격이 이익선·가치선보다 과도하게 앞선 개별주는 린치식 유형별 매도 기준을 적용한다. (린치 10·17장)<\/li>\n<li>인덱스 코어는 매도보다 리밸런싱으로 조절한다. (보글 13·18장)<\/li>\n<li>현금 보유의 불편함을 감수한다. 이는 기회비용이 아니라 선택권 비용이다. [추론] (하우절 10·13장, 막스 13장)<\/li>\n<\/ul>\n<h3>5-6. 사이클별 가장 위험한 착각<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>국면<\/th>\n<th>착각<\/th>\n<th>반박<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>폭락장<\/td>\n<td>“지금 팔지 않으면 끝장이다.”<\/td>\n<td>스토리 훼손과 가격 하락을 구분해야 한다.<\/td>\n<td>린치 14·17장, 그레이엄 8장<\/td>\n<\/tr>\n<tr>\n<td>바닥권<\/td>\n<td>“더 떨어질 수 없으니 몰빵한다.”<\/td>\n<td>극단은 더 극단으로 갈 수 있다. 장기자본·무레버리지·분할이 필요하다.<\/td>\n<td>막스 11·13·17장<\/td>\n<\/tr>\n<tr>\n<td>회복장<\/td>\n<td>“조금 올랐으니 수익 실현한다.”<\/td>\n<td>큰 승자는 시간이 필요하다.<\/td>\n<td>하우절 4·6장, 린치 17장<\/td>\n<\/tr>\n<tr>\n<td>상승장<\/td>\n<td>“내 실력이 좋아졌다.”<\/td>\n<td>상승장 베타와 알파를 구분해야 한다.<\/td>\n<td>막스 19장, 하우절 2장<\/td>\n<\/tr>\n<tr>\n<td>과열장<\/td>\n<td>“비싸지만 더 오를 것이다.”<\/td>\n<td>비싼 가격은 높은 기대수익이 아니라 낮은 미래수익률일 수 있다.<\/td>\n<td>막스 04·06장, 그레이엄 3·20장<\/td>\n<\/tr>\n<tr>\n<td>붕괴 직전<\/td>\n<td>“리스크가 사라졌다.”<\/td>\n<td>리스크가 안 보일 때 축적된다.<\/td>\n<td>막스 06장<\/td>\n<\/tr>\n<tr>\n<td>장기 횡보<\/td>\n<td>“전략이 틀렸다.”<\/td>\n<td>변동성·의심·지루함은 투자 수수료다.<\/td>\n<td>하우절 15장, 보글 20장<\/td>\n<\/tr>\n<tr>\n<td>남의 대박 목격<\/td>\n<td>“나도 같은 게임을 해야 한다.”<\/td>\n<td>다른 시간지평·자금구조·정보를 가진 사람은 다른 게임을 한다.<\/td>\n<td>하우절 16장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />","text":"이 절은 4-2의 결론을 실행 모델로 확장한다. 이 모델은 시장 타이밍 공식이 아니다. 목적은 지수 고점·저점 예측이 아니라, 현재 시장의 온도를 보고 신규 매수 허들, 현금 사용 속도, 레버리지 허용 여부, 포지션 집중도, 리밸런싱 강도 를 조절하는 것이다. (막스 08·09·15·17장, 코스톨라니 7·8장, 그레이엄 3·8장) 5-1. 모델의 전제 [명시] 막스의 주기 관찰은 “나는 모른다”는 전제에서 출발한다. 주기와 시계추를 알면 내일을 맞힐 수 있다는 뜻이 아니라, 현재 위치가 위험한 쪽인지 기회 쪽인지 가늠할 수 있다는 뜻이다. (막스 14·15장) [명시] 코스톨라니의 달걀은 시장의 손바뀜과 심리의 순환을 보는 프레임이다. 그러나 이를 기계적 예측 공식으로 쓰면 안 된다. (코스톨라니 7·8장) [명시] 그레이엄은 시장의 변동을 Mr. Market의 제안으로 보고, 가격이 가치와 크게 벌어질 때만 반응하라고 한다. (그레이엄 8장) [명시] 보글과 하우절은 많은 투자자에게 국면 대응 자체가 불필요하거나 위험할 수 있다고 본다. 코어 포트폴리오는 손대지 않는 것이 기본값이다. (보글 13·20장, 하우절 11·20장) [추론] 따라서 이 모델을 실제로 적용할 수 있는 사람은 제한적이다. 기록 습관, 감정 통제, 자산배분 규칙, 현금 여력, 리밸런싱 절차가 없다면 시장온도표는 오히려 과잉매매 도구가 된다. 5-2. 시장온도 신뢰도 등급 국면 이름만 붙이는 것은 위험하다. 같은 신호도 맥락에 따라 다르게 작동한다. 따라서 시장온도 판단에는 신뢰도 등급을 붙인다. 등급 조건 허용 행동 금지 행동 근거 낮음 신호가 1~2개뿐이고 가격-가치 괴리가 불명확 관찰, 후보군 작성, 메모 비중 변경, 전량 매수·매도 막스 14·15장, 하우절 12장 중간 심리·밸류에이션·신용·거래량 중 3개 이상이 같은 방향 신규 매수 허들 조정, 리밸런싱 검토 레버리지, 단일 시나리오 몰입 막스 15·17장, 코스톨라니 7·8장 높음 강제매도·과열·신용경색·대중 참여 등 복수 신호가 극단 분할 공격 또는 방어 강화 전량 진입·이탈, 예측 확신 막스 12·13·15·17장, 코스톨라니 8장 핵심은 맞히는 것이 아니라, 틀려도 망가지지 않는 방식으로 강도를 조절하는 것이다. 시장온도 판단이 틀릴 수 있으므로 모든 행동은 분할·밴드·체크리스트 안에서만 실행한다. (막스 05·15·17장, 하우절 13장) 5-3. 9단계 시장 행동 모델 단계 시장 상태 군중 심리 가격/가치 대표 위험 통합 행동 근거 1 침체 후 무관심 “주식은 끝났다” 우량 자산도 할인 가능 가치 함정, 너무 이른 매수 후보군 작성, 재무 생존성 확인, 분할 매수 시작 막스 12~13·15장, 코스톨라니 8장, 그레이엄 20장 2 불신 랠리 상승을 믿지 않음 일부 가치 수렴 시작 현금 과다, 기회 놓침 코어 유지, 위성 후보 선별 매수 코스톨라니 7~8장, 막스 11~13장 3 정상화 신중한 낙관 가격과 가치 균형 무행동/과잉행동 모두 가능 기본 자산배분 유지, 리밸런싱 보글 13·18장, 그레이엄 4·8장 4 확산 상승 자신감 증가 우량주 프리미엄 확대 기대수익률 하락 신규 매수 허들 상향, 개별주 검증 강화 막스 04·15장, 린치 10·17장 5 후기 과열 FOMO, 서사 과잉 가치보다 높은 가격 얇은 리스크 프리미엄 리스크 축소, 레버리지 제거, 부분 리밸런싱 막스 06·15·17장, 그레이엄 3·8장, 코스톨라니 8장 6 균열 불안과 부정 공존 고평가 자산 흔들림 낙폭 과소평가, 반등 착각 취약 포지션 점검, 현금·채권·비상금 확인 막스 18장, 보글 18~19장 7 강제매도 공포, 환매, 마진콜 가격이 가치 밑으로 이탈 가능 유동성 경색, 상관관계 상승 강제매도 주체 탐색, 분할 매수 후보 실행 막스 04·12·13·18장, 코스톨라니 5·8장 8 투매 후 침묵 체념, 혐오 가장 큰 할인 가능 구조적 부실과 저평가 혼동 안전마진·생존성 기준으로 선별 공격 그레이엄 20장, 막스 11~13·17장 9 회복 초기 여전히 회의적 가치 수렴 시작 너무 빨리 매도 보유 가설 재확인, 승자 유지 린치 14·17장, 하우절 6·15장 5-4. 시장온도 점검표 점검 항목 차가운 시장 뜨거운 시장 행동 번역 근거 투자자 심리 공포·무관심 낙관·탐욕 차가우면 후보 확대, 뜨거우면 허들 상향 막스 15장, 코스톨라니 8장 뉴스 반응 악재 과대반응 악재 무시 악재 무시 구간은 방어 강화 막스 15장, 하우절 17장 신용·레버리지 축소·경색 확대·완화 레버리지 확대 구간은 스트레스 테스트 막스 06·18장, 코스톨라니 8장 유동성 자금 부족 자금 넘침 자금 넘침은 질 낮은 아이디어 확산 경고 막스 18장, 코스톨라니 7장 밸류에이션 낮음 높음 낮으면 선별 매수, 높으면 기대수익률 낮춤 그레이엄 3·8장, 막스 04장 대중 참여 관심 없음 모두가 이야기함 대중 참여 폭증은 손바뀜 경계 코스톨라니 8장 상품 출시 드묾 테마·ETF·펀드 우후죽순 신규 상품 과열은 보류 또는 축소 막스 18장, 보글 15~16장 현금 보유 감정 편안함 고통스러움 현금 보유가 고통스러울수록 FOMO 경계 막스 13·15장, 하우절 11장 내 행동 충동 점검·관찰 매수 충동·자랑 충동 충동이 강할수록 매수 보류 하우절 3·11·16장, 막스 10장 가격-가치 괴리 가치 대비 할인 성장 서사 대비 과열 가격이 없으면 판단하지 않음 그레이엄 20장, 막스 04장, 린치 10장 5-5. 국면별 포트폴리오 행동 차가운 시장 명시적 근거: 막스는 강제매도와 구조적 매도자가 기회를 만들 수 있다고 본다. (막스 04·12~13장) 그레이엄은 안전마진이 확보될 때 저가매수가 가능하다고 본다. (그레이엄 20장) 코스톨라니는 하락 과장국면에서 소신파가 물량을 받을 수 있다고 본다. (코스톨라니 8장) 하우절은 공포의 순간에 평범한 행동을 지속하는 능력이 중요하다고 본다. (하우절 6·15장) 행동: 기존 보유분을 무조건 팔지 않는다. 현금·비상금·단기 필요자금을 재확인한다. 강제매도 후보와 구조적 부실 후보를 구분한다. 개별주는 린치식 스토리 유지 여부와 그레이엄식 재무 생존성을 함께 확인한다. (린치 14·17장, 그레이엄 13·20장) 매수는 한 번에 하지 않고 단계적으로 한다. 추가 하락을 견딜 구조가 있어야 한다. (막스 11~13장) 레버리지는 사용하지 않는다. 맞아도 먼저 죽을 수 있기 때문이다. (막스 07·18장, 하우절 13장, 코스톨라니 8장) 중립 시장 명시적 근거: 보글은 장기 저비용 보유와 자산배분을 강조한다. (보글 13·18~20장) 그레이엄은 예측보다 균형과 리밸런싱을 중시한다. (그레이엄 4·8장) 하우절은 적당히 합리적이고 지속 가능한 전략을 선호한다. (하우절 11장) 행동: 코어 포트폴리오는 손대지 않는다. 위성 개별주는 린치식 체크리스트를 통과한 것만 보유한다. 리밸런싱은 가격 예측이 아니라 원칙 복원으로 수행한다. 새 아이디어보다 기존 보유 논리 점검에 시간을 더 쓴다. 비용·세금·환전·계좌 구조를 최적화한다. [현대 적용] (보글 4~8장) 뜨거운 시장 명시적 근거: 막스는 리스크가 편안한 시기에 쌓이고, 리스크가 낮다는 믿음이 가장 위험하다고 본다. (막스 06·15·18장) 그레이엄은 강세장의 높은 PER, 낮은 배당수익률, 신용거래 투기 증가를 경고 신호로 본다. (그레이엄 3·8장) 코스톨라니는 강세장 과장국면에서 대중 참여와 거래량 폭증을 경계한다. (코스톨라니 8장) 보글은 ETF와 펀드가 단기투기 도구가 될 수 있음을 경계한다. (보글 15~16장) 행동: 신규 매수 허들을 올린다. 레버리지와 집중 포지션을 줄인다. “이번엔 다르다” 서사를 문서화하고 반대 논거를 붙인다. (막스 18장, 하우절 18장) 가격이 이익선·가치선보다 과도하게 앞선 개별주는 린치식 유형별 매도 기준을 적용한다. (린치 10·17장) 인덱스 코어는 매도보다 리밸런싱으로 조절한다. (보글 13·18장) 현금 보유의 불편함을 감수한다. 이는 기회비용이 아니라 선택권 비용이다. [추론] (하우절 10·13장, 막스 13장) 5-6. 사이클별 가장 위험한 착각 국면 착각 반박 근거 폭락장 “지금 팔지 않으면 끝장이다.” 스토리 훼손과 가격 하락을 구분해야 한다. 린치 14·17장, 그레이엄 8장 바닥권 “더 떨어질 수 없으니 몰빵한다.” 극단은 더 극단으로 갈 수 있다. 장기자본·무레버리지·분할이 필요하다. 막스 11·13·17장 회복장 “조금 올랐으니 수익 실현한다.” 큰 승자는 시간이 필요하다. 하우절 4·6장, 린치 17장 상승장 “내 실력이 좋아졌다.” 상승장 베타와 알파를 구분해야 한다. 막스 19장, 하우절 2장 과열장 “비싸지만 더 오를 것이다.” 비싼 가격은 높은 기대수익이 아니라 낮은 미래수익률일 수 있다. 막스 04·06장, 그레이엄 3·20장 붕괴 직전 “리스크가 사라졌다.” 리스크가 안 보일 때 축적된다. 막스 06장 장기 횡보 “전략이 틀렸다.” 변동성·의심·지루함은 투자 수수료다. 하우절 15장, 보글 20장 남의 대박 목격 “나도 같은 게임을 해야 한다.” 다른 시간지평·자금구조·정보를 가진 사람은 다른 게임을 한다. 하우절 16장"},{"i":7,"title":"6. 실행 체계","html":"<p>이 절은 여섯 권을 실제 투자 전·중·후 프로세스로 바꾼 것이다. 구조 자체는 [추론]이며, 각 부품의 근거는 항목마다 책과 장으로 표기한다.<\/p>\n<h3>6-0. 투자자 레벨 분기<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>레벨<\/th>\n<th>상태<\/th>\n<th>기본 전략<\/th>\n<th>허용 도구<\/th>\n<th>금지 도구<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0. 생존 우선<\/td>\n<td>비상금 부족, 단기 지출 예정, 레버리지 유혹, 감정 기복 큼<\/td>\n<td>현금·저축·부채 축소·투자 보류<\/td>\n<td>하우절식 저축과 안전마진, 린치식 단기자금 분리<\/td>\n<td>개별주, 레버리지, 테마, 시장온도 매매<\/td>\n<\/tr>\n<tr>\n<td>1. 기본값 투자자<\/td>\n<td>분석 시간 부족, 낮은 회전율 가능<\/td>\n<td>보글식 저비용 광범위 인덱스 + 그레이엄식 자산배분<\/td>\n<td>정기 매수, 리밸런싱, 비용·세금 최적화<\/td>\n<td>개별주 집중, 시장 예측 매매<\/td>\n<\/tr>\n<tr>\n<td>2. 제한적 개별주 투자자<\/td>\n<td>기업 이해·재무 분석·스토리 점검 가능<\/td>\n<td>코어 인덱스 + 위성 개별주<\/td>\n<td>린치식 6유형·2분 독백, 그레이엄식 안전마진<\/td>\n<td>조사 없는 친숙함, 인기주 추격<\/td>\n<\/tr>\n<tr>\n<td>3. 강도 조절 투자자<\/td>\n<td>기록 습관, 시장온도 판단, 리스크 관리 가능<\/td>\n<td>레벨 1~2 + 막스/코스톨라니식 공격·방어 조절<\/td>\n<td>시장온도표, 신뢰도 등급, 분할 실행<\/td>\n<td>전량 진입·전량 이탈, 국면 예측 확신<\/td>\n<\/tr>\n<tr>\n<td>4. 적극 가치/특수상황 투자자<\/td>\n<td>가치평가·비효율·강제매도 구조 분석 가능<\/td>\n<td>그레이엄/막스식 선별 공격<\/td>\n<td>염가, 특수상황, 역투자<\/td>\n<td>레버리지, 유동성 무시, 확신 과잉<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>[추론] 대부분의 투자자는 레벨 1을 기본값으로 삼고, 레벨 2~4는 “자격을 증명한 후” 일부 자본에만 적용한다. (보글 13·20장, 린치 4·6~17장, 막스 01~02·17장, 하우절 11·16장)<\/p>\n<h3>6-1. 전체 의사결정 흐름<\/h3>\n<ol>\n<li>\n<p>내 게임 정의<br />\n   시간지평, 필요 현금, 손실 허용, 세금·계좌, 투자 목적을 먼저 쓴다. (하우절 16·19장, 린치 4장, 보글 18~19장)<\/p>\n<\/li>\n<li>\n<p>기본 포트폴리오 설정<br />\n   저비용·분산·장기 구조를 코어로 둔다. (보글 13·20장, 그레이엄 4장)<\/p>\n<\/li>\n<li>\n<p>시장온도 측정<br />\n   금리·유동성·심리·밸류에이션·레버리지·대중 참여를 본다. 단, 시장 타이밍 공식으로 쓰지 않는다. (막스 15장, 코스톨라니 7~8장, 그레이엄 8장)<\/p>\n<\/li>\n<li>\n<p>투자 후보 분류<br />\n   전체시장 인덱스인지, 개별주인지, 채권인지, 특수상황인지 분리한다. (보글 13~14장, 린치 7장, 그레이엄 7·15장)<\/p>\n<\/li>\n<li>\n<p>개별 후보 검증<br />\n   린치식 사업 이해와 2분 독백, 그레이엄식 가격/가치, 막스식 리스크 보상, 하우절식 행동 지속성을 모두 통과해야 한다. (린치 11~15장, 그레이엄 20장, 막스 03~07장, 하우절 11·13장)<\/p>\n<\/li>\n<li>\n<p>포지션 크기 결정<br />\n   확신이 아니라 틀렸을 때 생존 가능성으로 정한다. (막스 05·17장, 하우절 5·13장)<\/p>\n<\/li>\n<li>\n<p>보유 중 점검<br />\n   가격보다 가설을 점검한다. (린치 14장, 막스 18장)<\/p>\n<\/li>\n<li>\n<p>매도·리밸런싱<br />\n   코어는 리밸런싱, 위성은 가설 훼손·가치 수렴·리스크 보상 변화로 판단한다. (보글 18~20장, 린치 17장, 막스 04·15장)<\/p>\n<\/li>\n<\/ol>\n<h3>6-2. 매수 전 체크리스트<\/h3>\n<h4>A. 내 게임 체크<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>질문<\/th>\n<th>통과 기준<\/th>\n<th>실패 시 행동<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이 돈은 12개월 안에 필요한가?<\/td>\n<td>필요 없음<\/td>\n<td>위험자산 매수 금지<\/td>\n<td>린치 밀레니엄판 서문, 린치 4장<\/td>\n<\/tr>\n<tr>\n<td>2~3년 내 큰 지출에 쓸 돈인가?<\/td>\n<td>아님<\/td>\n<td>현금·단기채 등으로 분리<\/td>\n<td>린치 4장<\/td>\n<\/tr>\n<tr>\n<td>하락 시 내가 실제로 버틸 수 있는가?<\/td>\n<td>과거 행동·밤잠 기준으로 가능<\/td>\n<td>비중 축소<\/td>\n<td>하우절 11장, 린치 4장<\/td>\n<\/tr>\n<tr>\n<td>이 전략은 내 시간지평과 맞는가?<\/td>\n<td>명확함<\/td>\n<td>다른 사람의 게임 추종 금지<\/td>\n<td>하우절 16장<\/td>\n<\/tr>\n<tr>\n<td>내 목표는 수익률인가, 자유·안정·선택권인가?<\/td>\n<td>목적 문장화<\/td>\n<td>목표 재정의<\/td>\n<td>하우절 7·9~10장<\/td>\n<\/tr>\n<tr>\n<td>투기 자금과 투자 자금이 분리되어 있는가?<\/td>\n<td>분리<\/td>\n<td>계좌·한도 분리<\/td>\n<td>그레이엄 1장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>B. 시장온도 체크<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>질문<\/th>\n<th>차가움<\/th>\n<th>뜨거움<\/th>\n<th>행동<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>대중은 무관심한가, 열광하는가?<\/td>\n<td>무관심<\/td>\n<td>열광<\/td>\n<td>무관심이면 후보 확대, 열광이면 허들 상향<\/td>\n<td>코스톨라니 8장, 막스 15장<\/td>\n<\/tr>\n<tr>\n<td>리스크 프리미엄은 충분한가?<\/td>\n<td>넓음<\/td>\n<td>얇음<\/td>\n<td>얇으면 진입 보류<\/td>\n<td>막스 06·15장<\/td>\n<\/tr>\n<tr>\n<td>신용과 레버리지는 늘고 있는가?<\/td>\n<td>축소<\/td>\n<td>확대<\/td>\n<td>확대 시 방어 강화<\/td>\n<td>막스 06·18장<\/td>\n<\/tr>\n<tr>\n<td>좋은 뉴스와 나쁜 뉴스에 시장은 어떻게 반응하는가?<\/td>\n<td>악재 과대반응<\/td>\n<td>악재 무시<\/td>\n<td>악재 무시는 과열 경고<\/td>\n<td>코스톨라니 8장, 하우절 17장<\/td>\n<\/tr>\n<tr>\n<td>현금 보유가 심리적으로 어려운가?<\/td>\n<td>낮음<\/td>\n<td>높음<\/td>\n<td>어려울수록 FOMO 경계<\/td>\n<td>막스 13·15장<\/td>\n<\/tr>\n<tr>\n<td>밸류에이션은 이익·배당·금리 대비 어떤가?<\/td>\n<td>낮음<\/td>\n<td>높음<\/td>\n<td>높으면 기대수익률 하향<\/td>\n<td>그레이엄 3·8장, 린치 10장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>C. 자산 유형 체크<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>대상<\/th>\n<th>핵심 질문<\/th>\n<th>통과 기준<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전체시장 인덱스<\/td>\n<td>비용·분산·추적오차·세금·계좌가 적절한가<\/td>\n<td>장기 보유 가능한 저비용 구조<\/td>\n<td>보글 13·15·18~20장<\/td>\n<\/tr>\n<tr>\n<td>채권·채권펀드<\/td>\n<td>듀레이션·신용위험·비용을 이해하는가<\/td>\n<td>금리 변동과 신용위험을 구분<\/td>\n<td>그레이엄 1장, 보글 14장<\/td>\n<\/tr>\n<tr>\n<td>개별주<\/td>\n<td>무엇으로 돈을 버는지 3문장으로 말할 수 있는가<\/td>\n<td>사업 구조 이해<\/td>\n<td>린치 8·12장<\/td>\n<\/tr>\n<tr>\n<td>가치주<\/td>\n<td>내재가치와 가격 차이가 충분한가<\/td>\n<td>안전마진 존재<\/td>\n<td>그레이엄 20장, 막스 03~04장<\/td>\n<\/tr>\n<tr>\n<td>성장주<\/td>\n<td>성장 기대가 이미 가격에 반영되었는가<\/td>\n<td>성장률 대비 가격 합리<\/td>\n<td>린치 7·10·15장, 막스 03장<\/td>\n<\/tr>\n<tr>\n<td>회생주<\/td>\n<td>부채와 생존 가능성을 계산했는가<\/td>\n<td>주주 몫이 남을 가능성<\/td>\n<td>린치 15·17장, 그레이엄 15장<\/td>\n<\/tr>\n<tr>\n<td>자산주<\/td>\n<td>자산가치 실현 촉매가 있는가<\/td>\n<td>가치와 촉매 확인<\/td>\n<td>린치 7·15·17장, 그레이엄 15장<\/td>\n<\/tr>\n<tr>\n<td>특수상황<\/td>\n<td>구조를 이해하고 유동성을 감당할 수 있는가<\/td>\n<td>복잡성보다 안전마진<\/td>\n<td>그레이엄 15장, 막스 18장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>D. 개별주 예외 허가서<\/h4>\n<p>보글식 기본값을 이탈해 린치식 개별주를 보유하려면 아래 8개 조건을 통과해야 한다.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>조건<\/th>\n<th>통과 기준<\/th>\n<th>실패 시 기본값<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>자금 조건<\/td>\n<td>12개월 내 쓸 돈이 아니고, 비상금과 생활비가 분리되어 있다. (린치 4장, 하우절 10·13장)<\/td>\n<td>인덱스/현금 중심<\/td>\n<\/tr>\n<tr>\n<td>관찰 우위<\/td>\n<td>생활·업무 현장에서 남보다 먼저 볼 수 있는 관찰 포인트가 있다. (린치 2·6장)<\/td>\n<td>인덱스 중심<\/td>\n<\/tr>\n<tr>\n<td>조사 능력<\/td>\n<td>이익 전망, 재무상태, 경쟁, 확장 계획을 확인했다. (린치 서문·11~15장)<\/td>\n<td>매수 보류<\/td>\n<\/tr>\n<tr>\n<td>유형 분류<\/td>\n<td>6가지 유형 중 무엇인지 분류했다. (린치 7장)<\/td>\n<td>매수 보류<\/td>\n<\/tr>\n<tr>\n<td>2분 독백<\/td>\n<td>사는 이유, 성공 조건, 위험, 매도 조건을 2분 안에 말할 수 있다. (린치 11장)<\/td>\n<td>매수 보류<\/td>\n<\/tr>\n<tr>\n<td>가격 규율<\/td>\n<td>좋은 회사와 좋은 주식을 구분하고, 가격-가치 관계를 검토했다. (린치 10장, 그레이엄 20장, 막스 04장)<\/td>\n<td>가격 재검토<\/td>\n<\/tr>\n<tr>\n<td>포지션 크기<\/td>\n<td>틀렸을 때도 생존 가능한 비중이다. (하우절 5·13장, 막스 05·17장)<\/td>\n<td>비중 축소<\/td>\n<\/tr>\n<tr>\n<td>매도 기준<\/td>\n<td>유형별 매도 신호와 가설 훼손 신호를 적었다. (린치 14·17장)<\/td>\n<td>매수 금지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>개별주 투자는 “흥미를 느꼈다”가 아니라 “조사했고, 가격을 검토했고, 틀렸을 때도 살아남으며, 매도 기준까지 적었다”일 때만 허용된다.<\/p>\n<h4>E. 비용·세금·구조 체크<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>질문<\/th>\n<th>통과 기준<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>총보수, 기타비용, 거래비용을 아는가?<\/td>\n<td>예상 순수익률에 반영<\/td>\n<td>보글 4~5장<\/td>\n<\/tr>\n<tr>\n<td>세금이 수익률을 얼마나 줄이는가?<\/td>\n<td>계좌별 세후수익 비교<\/td>\n<td>보글 8장<\/td>\n<\/tr>\n<tr>\n<td>환전·환노출이 체감 변동성을 키우는가?<\/td>\n<td>원화 생활비 기준 점검<\/td>\n<td>보글 18~20장 [현대 적용], 하우절 11장<\/td>\n<\/tr>\n<tr>\n<td>ETF가 실제로 보글식 인덱스인가?<\/td>\n<td>레버리지·테마·단일종목 아님<\/td>\n<td>보글 15~16장<\/td>\n<\/tr>\n<tr>\n<td>자문·운용보수가 행동 개선 효과보다 큰가?<\/td>\n<td>비용 대비 가치 확인<\/td>\n<td>보글 12장<\/td>\n<\/tr>\n<tr>\n<td>레버리지나 마진콜 가능성이 있는가?<\/td>\n<td>없음 또는 극히 제한<\/td>\n<td>막스 07·18장, 코스톨라니 8장, 하우절 13장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>6-3. 보유 점검 루틴<\/h3>\n<h4>월간 점검<\/h4>\n<p>목적: 가격 반응이 아니라 감정 반응 관리.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>점검 항목<\/th>\n<th>질문<\/th>\n<th>행동<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>가격 변동<\/td>\n<td>주가가 아니라 사업 가설이 바뀌었는가?<\/td>\n<td>가설 유지 시 관망<\/td>\n<td>린치 14장, 그레이엄 8장<\/td>\n<\/tr>\n<tr>\n<td>뉴스 소비<\/td>\n<td>내가 다른 사람의 게임을 보고 흔들리는가?<\/td>\n<td>뉴스 소비 제한<\/td>\n<td>하우절 16~17장<\/td>\n<\/tr>\n<tr>\n<td>포트폴리오 감정<\/td>\n<td>밤잠이 깨지는 비중인가?<\/td>\n<td>비중 축소<\/td>\n<td>하우절 11장<\/td>\n<\/tr>\n<tr>\n<td>시장온도<\/td>\n<td>FOMO·공포가 강해졌는가?<\/td>\n<td>체크리스트 재적용<\/td>\n<td>막스 15장, 코스톨라니 8장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>분기 점검<\/h4>\n<p>목적: 숫자와 스토리 일치 여부 확인.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>점검 항목<\/th>\n<th>질문<\/th>\n<th>행동<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이익<\/td>\n<td>EPS·매출·마진이 가설과 맞는가?<\/td>\n<td>약화 시 원인 분석<\/td>\n<td>린치 10·13·14장<\/td>\n<\/tr>\n<tr>\n<td>재무<\/td>\n<td>현금·부채·재고·운전자본 악화가 있는가?<\/td>\n<td>위험 신호면 비중 재평가<\/td>\n<td>린치 12~13장<\/td>\n<\/tr>\n<tr>\n<td>가치<\/td>\n<td>가격이 가치에 가까워졌는가?<\/td>\n<td>안전마진 축소 시 매도 검토<\/td>\n<td>그레이엄 20장, 막스 04장<\/td>\n<\/tr>\n<tr>\n<td>리스크<\/td>\n<td>숨은 상관관계나 레버리지 노출이 늘었는가?<\/td>\n<td>포트폴리오 재설계<\/td>\n<td>막스 18장<\/td>\n<\/tr>\n<tr>\n<td>비용<\/td>\n<td>회전율과 거래비용이 늘고 있는가?<\/td>\n<td>거래 빈도 축소<\/td>\n<td>보글 1·4~5장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>반기·연간 점검<\/h4>\n<p>목적: 자산배분과 투자자 자신을 재평가.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>점검 항목<\/th>\n<th>질문<\/th>\n<th>행동<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>자산배분<\/td>\n<td>주식·채권·현금 비중이 원래 정책에서 벗어났는가?<\/td>\n<td>리밸런싱<\/td>\n<td>그레이엄 4·8장, 보글 18~20장<\/td>\n<\/tr>\n<tr>\n<td>개별주 유형<\/td>\n<td>이 종목의 유형이 바뀌었는가?<\/td>\n<td>체크리스트 재작성<\/td>\n<td>린치 7·14·17장<\/td>\n<\/tr>\n<tr>\n<td>내 게임<\/td>\n<td>시간지평·소득·가족·목표가 바뀌었는가?<\/td>\n<td>투자정책서 수정<\/td>\n<td>하우절 14·16장<\/td>\n<\/tr>\n<tr>\n<td>시장온도<\/td>\n<td>공격/방어 강도를 바꿔야 하는가?<\/td>\n<td>신규 매수 허들 조정<\/td>\n<td>막스 15·17장<\/td>\n<\/tr>\n<tr>\n<td>한국 변수<\/td>\n<td>환율·세금·계좌·생활비 조건이 바뀌었는가?<\/td>\n<td>계좌·통화 구조 점검<\/td>\n<td>보글 18~20장 [현대 적용]<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>6-4. 매도 판단 트리<\/h3>\n<h4>1단계: 무엇을 팔려는가?<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>대상<\/th>\n<th>첫 질문<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전체시장 인덱스 코어<\/td>\n<td>내 목표·자산배분·생활자금·세금 조건이 바뀌었는가?<\/td>\n<\/tr>\n<tr>\n<td>개별주<\/td>\n<td>원래 산 이유가 훼손되었는가?<\/td>\n<\/tr>\n<tr>\n<td>채권·현금성 자산<\/td>\n<td>듀레이션·신용·유동성 목적이 바뀌었는가?<\/td>\n<\/tr>\n<tr>\n<td>테마·팩터·섹터 ETF<\/td>\n<td>이것이 보글식 코어인지 액티브 베팅인지 명확한가?<\/td>\n<\/tr>\n<tr>\n<td>특수상황<\/td>\n<td>촉매가 살아 있는가, 가치가 실현되었는가?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>2단계: 가격 하락인가, 가설 훼손인가?<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>상태<\/th>\n<th>판단<\/th>\n<th>행동<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>가격 하락, 가설 유지, 안전마진 확대<\/td>\n<td>Mr. Market의 제안일 수 있음<\/td>\n<td>추가 매수 후보<\/td>\n<td>그레이엄 8·20장, 막스 04·12장<\/td>\n<\/tr>\n<tr>\n<td>가격 하락, 가설 훼손<\/td>\n<td>손실 회피가 아니라 오류 수정<\/td>\n<td>매도 또는 축소<\/td>\n<td>린치 14·17장, 막스 18장<\/td>\n<\/tr>\n<tr>\n<td>가격 상승, 가설 유지, 가치 아직 큼<\/td>\n<td>승자 유지<\/td>\n<td>보유<\/td>\n<td>하우절 6장, 린치 17장<\/td>\n<\/tr>\n<tr>\n<td>가격 상승, 가치 수렴·과열<\/td>\n<td>기대수익률 하락<\/td>\n<td>부분 매도·리밸런싱<\/td>\n<td>그레이엄 8장, 막스 04·15장<\/td>\n<\/tr>\n<tr>\n<td>가격 횡보, 가설 유지<\/td>\n<td>변동성·지루함 수수료<\/td>\n<td>보유<\/td>\n<td>하우절 15장, 보글 20장<\/td>\n<\/tr>\n<tr>\n<td>가격 횡보, 기회비용 큼, 더 나은 대안 있음<\/td>\n<td>자본배분 문제<\/td>\n<td>교체 검토<\/td>\n<td>린치 16~17장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>3단계: 유형별 매도 기준<\/h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>유형<\/th>\n<th>매도 신호<\/th>\n<th>보유 조건<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>저성장주<\/td>\n<td>배당 매력 감소, 시장점유율 하락, 재평가 완료<\/td>\n<td>배당 안정, 저평가 유지<\/td>\n<td>린치 15·17장<\/td>\n<\/tr>\n<tr>\n<td>대형우량주<\/td>\n<td>PER 과열, 이익선 과도 상회, 성장 둔화<\/td>\n<td>정상 밸류에이션, 완만한 성장<\/td>\n<td>린치 15·17장<\/td>\n<\/tr>\n<tr>\n<td>고성장주<\/td>\n<td>확장 공식 훼손, 성장 둔화, 기관 과밀, 과열 PER<\/td>\n<td>성장 여지와 이익 증가 유지<\/td>\n<td>린치 7·15·17장<\/td>\n<\/tr>\n<tr>\n<td>경기순환주<\/td>\n<td>재고 증가, 상품가격 하락, 과잉 CAPEX<\/td>\n<td>사이클 초중반, 수급 개선<\/td>\n<td>린치 15·17장<\/td>\n<\/tr>\n<tr>\n<td>회생주<\/td>\n<td>부채 재악화, 회생 가설 소멸, 주주 몫 불확실<\/td>\n<td>부채 감소, 생존가설 유지<\/td>\n<td>린치 15·17장<\/td>\n<\/tr>\n<tr>\n<td>자산주<\/td>\n<td>할인 해소, 자산 훼손, 촉매 소멸<\/td>\n<td>자산가치 유지, 촉매 유효<\/td>\n<td>린치 15·17장, 그레이엄 15장<\/td>\n<\/tr>\n<tr>\n<td>염가주<\/td>\n<td>가치 훼손, 청산가치 감소, 거버넌스 악화<\/td>\n<td>안전마진 유지<\/td>\n<td>그레이엄 15·20장<\/td>\n<\/tr>\n<tr>\n<td>인덱스 코어<\/td>\n<td>자산배분·현금흐름 목적 변화<\/td>\n<td>장기 목표 유지<\/td>\n<td>보글 13·18~20장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>4단계: 심리 필터<\/h4>\n<p>매도 전 다음 문장을 확인한다.<\/p>\n<ul>\n<li>나는 단지 손실이 싫어서 파는가? (하우절 15·17장)<\/li>\n<li>나는 본전까지 기다리려는가, 아니면 현재 가치로 판단하는가? (하우절 14장, 린치 18장)<\/li>\n<li>나는 남들이 파니까 파는가? (그레이엄 8장, 하우절 16장)<\/li>\n<li>나는 “이번엔 다르다”를 믿고 보유하는가? (막스 18장, 하우절 12·18장)<\/li>\n<li>이 포지션이 내 생활을 해치고 있는가? 그렇다면 수학보다 지속 가능성을 우선한다. (하우절 11장)<\/li>\n<\/ul>\n<h3>6-5. 절대 금기<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>금기<\/th>\n<th>왜 위험한가<\/th>\n<th>관련 출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>레버리지로 장기투자를 가장하는 것<\/td>\n<td>맞아도 먼저 강제청산될 수 있다.<\/td>\n<td>하우절 13장, 막스 07·18장, 코스톨라니 8장<\/td>\n<\/tr>\n<tr>\n<td>좋은 회사라서 가격을 무시하는 것<\/td>\n<td>좋은 회사도 비싸면 나쁜 투자다.<\/td>\n<td>그레이엄 20장, 린치 10장, 막스 04장<\/td>\n<\/tr>\n<tr>\n<td>인덱스 ETF를 단타 도구로 쓰는 것<\/td>\n<td>보글식 인덱스의 본질은 저비용·분산·장기다.<\/td>\n<td>보글 15장<\/td>\n<\/tr>\n<tr>\n<td>인기 업종의 인기 종목을 뒤늦게 추격하는 것<\/td>\n<td>기대가 가격에 선반영되어 작은 실망에도 취약하다.<\/td>\n<td>린치 9장, 막스 06장<\/td>\n<\/tr>\n<tr>\n<td>남의 게임을 따라 하는 것<\/td>\n<td>시간지평·자금구조·정보가 다르면 합리 가격도 다르다.<\/td>\n<td>하우절 16장<\/td>\n<\/tr>\n<tr>\n<td>최근 수익률로 펀드·전략을 고르는 것<\/td>\n<td>평균회귀와 생존편향이 강하다.<\/td>\n<td>보글 10~11장<\/td>\n<\/tr>\n<tr>\n<td>구조를 모르는 상품에 투자하는 것<\/td>\n<td>복잡성은 안전이 아니라 판매의 언어일 수 있다.<\/td>\n<td>그레이엄 1·16장, 막스 18장<\/td>\n<\/tr>\n<tr>\n<td>손실 복구를 위해 포지션을 키우는 것<\/td>\n<td>복수매매는 생존 확률을 낮춘다.<\/td>\n<td>하우절 5장, 코스톨라니 8장<\/td>\n<\/tr>\n<tr>\n<td>시장 예측을 핵심 전략으로 삼는 것<\/td>\n<td>맞히기도 어렵고, 맞혀도 종목 선택이 틀리면 실패한다.<\/td>\n<td>린치 5장, 막스 14장<\/td>\n<\/tr>\n<tr>\n<td>비용·세금·환율을 무시하는 것<\/td>\n<td>확정 비용은 불확실 알파보다 강하다.<\/td>\n<td>보글 4~8장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>6-6. 심리 방어 프로토콜<\/h3>\n<h4>폭락장 프로토콜<\/h4>\n<ol>\n<li>화면을 보며 즉시 매도하지 않는다. (그레이엄 8장, 하우절 15장)<\/li>\n<li>가격 하락과 가설 훼손을 분리한다. (린치 14장)<\/li>\n<li>생활비·비상금·12개월 필요자금을 확인한다. (린치 4장, 하우절 10장)<\/li>\n<li>레버리지·마진콜·유동성 위험이 있는 포지션부터 점검한다. (막스 18장)<\/li>\n<li>코어 인덱스는 자산배분 규칙으로만 조정한다. (보글 18~20장)<\/li>\n<li>개별주는 유형별 체크리스트로 재검토한다. (린치 7·15·17장)<\/li>\n<li>매수 후보는 분할로 실행한다. 극단은 더 극단으로 갈 수 있다. (막스 11~13장)<\/li>\n<li>“지금 팔면 마음이 편해진다”와 “지금 파는 것이 합리적이다”를 구분한다. (하우절 11·15장)<\/li>\n<\/ol>\n<h4>과열장 프로토콜<\/h4>\n<ol>\n<li>최근 수익을 실력으로 해석하지 않는다. (하우절 2장, 막스 16·19장)<\/li>\n<li>포트폴리오의 베타와 알파를 구분한다. (막스 19장)<\/li>\n<li>신규 매수 허들을 올린다. (막스 15장)<\/li>\n<li>인기 업종·인기 종목·제2의 아무개 논리를 경계한다. (린치 9장)<\/li>\n<li>레버리지와 집중을 줄인다. (막스 17~18장)<\/li>\n<li>ETF·펀드·테마 상품의 비용과 구조를 재확인한다. (보글 15~16장)<\/li>\n<li>현금 보유의 불편함을 견딘다. (막스 13장, 하우절 10장)<\/li>\n<li>“이번엔 다르다” 서사를 반대 논거와 함께 문서화한다. (막스 18장, 하우절 12장)<\/li>\n<\/ol>\n<h4>횡보장 프로토콜<\/h4>\n<ol>\n<li>지루함을 전략 실패로 착각하지 않는다. (하우절 15장)<\/li>\n<li>매매 빈도 증가를 경계한다. 비용은 확정 손실이다. (보글 1·4~5장)<\/li>\n<li>개별주는 분기별 가설 점검만 수행한다. (린치 14장)<\/li>\n<li>인덱스 코어는 방치가 아니라 규율 유지로 본다. (보글 13·20장)<\/li>\n<li>새 전략을 찾기보다 기존 전략의 실행 품질을 개선한다. (하우절 19장, 막스 20장)<\/li>\n<\/ol>\n<hr />","text":"이 절은 여섯 권을 실제 투자 전·중·후 프로세스로 바꾼 것이다. 구조 자체는 [추론]이며, 각 부품의 근거는 항목마다 책과 장으로 표기한다. 6-0. 투자자 레벨 분기 레벨 상태 기본 전략 허용 도구 금지 도구 0. 생존 우선 비상금 부족, 단기 지출 예정, 레버리지 유혹, 감정 기복 큼 현금·저축·부채 축소·투자 보류 하우절식 저축과 안전마진, 린치식 단기자금 분리 개별주, 레버리지, 테마, 시장온도 매매 1. 기본값 투자자 분석 시간 부족, 낮은 회전율 가능 보글식 저비용 광범위 인덱스 + 그레이엄식 자산배분 정기 매수, 리밸런싱, 비용·세금 최적화 개별주 집중, 시장 예측 매매 2. 제한적 개별주 투자자 기업 이해·재무 분석·스토리 점검 가능 코어 인덱스 + 위성 개별주 린치식 6유형·2분 독백, 그레이엄식 안전마진 조사 없는 친숙함, 인기주 추격 3. 강도 조절 투자자 기록 습관, 시장온도 판단, 리스크 관리 가능 레벨 1~2 + 막스/코스톨라니식 공격·방어 조절 시장온도표, 신뢰도 등급, 분할 실행 전량 진입·전량 이탈, 국면 예측 확신 4. 적극 가치/특수상황 투자자 가치평가·비효율·강제매도 구조 분석 가능 그레이엄/막스식 선별 공격 염가, 특수상황, 역투자 레버리지, 유동성 무시, 확신 과잉 [추론] 대부분의 투자자는 레벨 1을 기본값으로 삼고, 레벨 2~4는 “자격을 증명한 후” 일부 자본에만 적용한다. (보글 13·20장, 린치 4·6~17장, 막스 01~02·17장, 하우절 11·16장) 6-1. 전체 의사결정 흐름 내 게임 정의 시간지평, 필요 현금, 손실 허용, 세금·계좌, 투자 목적을 먼저 쓴다. (하우절 16·19장, 린치 4장, 보글 18~19장) 기본 포트폴리오 설정 저비용·분산·장기 구조를 코어로 둔다. (보글 13·20장, 그레이엄 4장) 시장온도 측정 금리·유동성·심리·밸류에이션·레버리지·대중 참여를 본다. 단, 시장 타이밍 공식으로 쓰지 않는다. (막스 15장, 코스톨라니 7~8장, 그레이엄 8장) 투자 후보 분류 전체시장 인덱스인지, 개별주인지, 채권인지, 특수상황인지 분리한다. (보글 13~14장, 린치 7장, 그레이엄 7·15장) 개별 후보 검증 린치식 사업 이해와 2분 독백, 그레이엄식 가격/가치, 막스식 리스크 보상, 하우절식 행동 지속성을 모두 통과해야 한다. (린치 11~15장, 그레이엄 20장, 막스 03~07장, 하우절 11·13장) 포지션 크기 결정 확신이 아니라 틀렸을 때 생존 가능성으로 정한다. (막스 05·17장, 하우절 5·13장) 보유 중 점검 가격보다 가설을 점검한다. (린치 14장, 막스 18장) 매도·리밸런싱 코어는 리밸런싱, 위성은 가설 훼손·가치 수렴·리스크 보상 변화로 판단한다. (보글 18~20장, 린치 17장, 막스 04·15장) 6-2. 매수 전 체크리스트 A. 내 게임 체크 질문 통과 기준 실패 시 행동 출처 이 돈은 12개월 안에 필요한가? 필요 없음 위험자산 매수 금지 린치 밀레니엄판 서문, 린치 4장 2~3년 내 큰 지출에 쓸 돈인가? 아님 현금·단기채 등으로 분리 린치 4장 하락 시 내가 실제로 버틸 수 있는가? 과거 행동·밤잠 기준으로 가능 비중 축소 하우절 11장, 린치 4장 이 전략은 내 시간지평과 맞는가? 명확함 다른 사람의 게임 추종 금지 하우절 16장 내 목표는 수익률인가, 자유·안정·선택권인가? 목적 문장화 목표 재정의 하우절 7·9~10장 투기 자금과 투자 자금이 분리되어 있는가? 분리 계좌·한도 분리 그레이엄 1장 B. 시장온도 체크 질문 차가움 뜨거움 행동 출처 대중은 무관심한가, 열광하는가? 무관심 열광 무관심이면 후보 확대, 열광이면 허들 상향 코스톨라니 8장, 막스 15장 리스크 프리미엄은 충분한가? 넓음 얇음 얇으면 진입 보류 막스 06·15장 신용과 레버리지는 늘고 있는가? 축소 확대 확대 시 방어 강화 막스 06·18장 좋은 뉴스와 나쁜 뉴스에 시장은 어떻게 반응하는가? 악재 과대반응 악재 무시 악재 무시는 과열 경고 코스톨라니 8장, 하우절 17장 현금 보유가 심리적으로 어려운가? 낮음 높음 어려울수록 FOMO 경계 막스 13·15장 밸류에이션은 이익·배당·금리 대비 어떤가? 낮음 높음 높으면 기대수익률 하향 그레이엄 3·8장, 린치 10장 C. 자산 유형 체크 대상 핵심 질문 통과 기준 출처 전체시장 인덱스 비용·분산·추적오차·세금·계좌가 적절한가 장기 보유 가능한 저비용 구조 보글 13·15·18~20장 채권·채권펀드 듀레이션·신용위험·비용을 이해하는가 금리 변동과 신용위험을 구분 그레이엄 1장, 보글 14장 개별주 무엇으로 돈을 버는지 3문장으로 말할 수 있는가 사업 구조 이해 린치 8·12장 가치주 내재가치와 가격 차이가 충분한가 안전마진 존재 그레이엄 20장, 막스 03~04장 성장주 성장 기대가 이미 가격에 반영되었는가 성장률 대비 가격 합리 린치 7·10·15장, 막스 03장 회생주 부채와 생존 가능성을 계산했는가 주주 몫이 남을 가능성 린치 15·17장, 그레이엄 15장 자산주 자산가치 실현 촉매가 있는가 가치와 촉매 확인 린치 7·15·17장, 그레이엄 15장 특수상황 구조를 이해하고 유동성을 감당할 수 있는가 복잡성보다 안전마진 그레이엄 15장, 막스 18장 D. 개별주 예외 허가서 보글식 기본값을 이탈해 린치식 개별주를 보유하려면 아래 8개 조건을 통과해야 한다. 조건 통과 기준 실패 시 기본값 자금 조건 12개월 내 쓸 돈이 아니고, 비상금과 생활비가 분리되어 있다. (린치 4장, 하우절 10·13장) 인덱스/현금 중심 관찰 우위 생활·업무 현장에서 남보다 먼저 볼 수 있는 관찰 포인트가 있다. (린치 2·6장) 인덱스 중심 조사 능력 이익 전망, 재무상태, 경쟁, 확장 계획을 확인했다. (린치 서문·11~15장) 매수 보류 유형 분류 6가지 유형 중 무엇인지 분류했다. (린치 7장) 매수 보류 2분 독백 사는 이유, 성공 조건, 위험, 매도 조건을 2분 안에 말할 수 있다. (린치 11장) 매수 보류 가격 규율 좋은 회사와 좋은 주식을 구분하고, 가격-가치 관계를 검토했다. (린치 10장, 그레이엄 20장, 막스 04장) 가격 재검토 포지션 크기 틀렸을 때도 생존 가능한 비중이다. (하우절 5·13장, 막스 05·17장) 비중 축소 매도 기준 유형별 매도 신호와 가설 훼손 신호를 적었다. (린치 14·17장) 매수 금지 개별주 투자는 “흥미를 느꼈다”가 아니라 “조사했고, 가격을 검토했고, 틀렸을 때도 살아남으며, 매도 기준까지 적었다”일 때만 허용된다. E. 비용·세금·구조 체크 질문 통과 기준 출처 총보수, 기타비용, 거래비용을 아는가? 예상 순수익률에 반영 보글 4~5장 세금이 수익률을 얼마나 줄이는가? 계좌별 세후수익 비교 보글 8장 환전·환노출이 체감 변동성을 키우는가? 원화 생활비 기준 점검 보글 18~20장 [현대 적용], 하우절 11장 ETF가 실제로 보글식 인덱스인가? 레버리지·테마·단일종목 아님 보글 15~16장 자문·운용보수가 행동 개선 효과보다 큰가? 비용 대비 가치 확인 보글 12장 레버리지나 마진콜 가능성이 있는가? 없음 또는 극히 제한 막스 07·18장, 코스톨라니 8장, 하우절 13장 6-3. 보유 점검 루틴 월간 점검 목적: 가격 반응이 아니라 감정 반응 관리. 점검 항목 질문 행동 출처 가격 변동 주가가 아니라 사업 가설이 바뀌었는가? 가설 유지 시 관망 린치 14장, 그레이엄 8장 뉴스 소비 내가 다른 사람의 게임을 보고 흔들리는가? 뉴스 소비 제한 하우절 16~17장 포트폴리오 감정 밤잠이 깨지는 비중인가? 비중 축소 하우절 11장 시장온도 FOMO·공포가 강해졌는가? 체크리스트 재적용 막스 15장, 코스톨라니 8장 분기 점검 목적: 숫자와 스토리 일치 여부 확인. 점검 항목 질문 행동 출처 이익 EPS·매출·마진이 가설과 맞는가? 약화 시 원인 분석 린치 10·13·14장 재무 현금·부채·재고·운전자본 악화가 있는가? 위험 신호면 비중 재평가 린치 12~13장 가치 가격이 가치에 가까워졌는가? 안전마진 축소 시 매도 검토 그레이엄 20장, 막스 04장 리스크 숨은 상관관계나 레버리지 노출이 늘었는가? 포트폴리오 재설계 막스 18장 비용 회전율과 거래비용이 늘고 있는가? 거래 빈도 축소 보글 1·4~5장 반기·연간 점검 목적: 자산배분과 투자자 자신을 재평가. 점검 항목 질문 행동 출처 자산배분 주식·채권·현금 비중이 원래 정책에서 벗어났는가? 리밸런싱 그레이엄 4·8장, 보글 18~20장 개별주 유형 이 종목의 유형이 바뀌었는가? 체크리스트 재작성 린치 7·14·17장 내 게임 시간지평·소득·가족·목표가 바뀌었는가? 투자정책서 수정 하우절 14·16장 시장온도 공격/방어 강도를 바꿔야 하는가? 신규 매수 허들 조정 막스 15·17장 한국 변수 환율·세금·계좌·생활비 조건이 바뀌었는가? 계좌·통화 구조 점검 보글 18~20장 [현대 적용] 6-4. 매도 판단 트리 1단계: 무엇을 팔려는가? 대상 첫 질문 전체시장 인덱스 코어 내 목표·자산배분·생활자금·세금 조건이 바뀌었는가? 개별주 원래 산 이유가 훼손되었는가? 채권·현금성 자산 듀레이션·신용·유동성 목적이 바뀌었는가? 테마·팩터·섹터 ETF 이것이 보글식 코어인지 액티브 베팅인지 명확한가? 특수상황 촉매가 살아 있는가, 가치가 실현되었는가? 2단계: 가격 하락인가, 가설 훼손인가? 상태 판단 행동 근거 가격 하락, 가설 유지, 안전마진 확대 Mr. Market의 제안일 수 있음 추가 매수 후보 그레이엄 8·20장, 막스 04·12장 가격 하락, 가설 훼손 손실 회피가 아니라 오류 수정 매도 또는 축소 린치 14·17장, 막스 18장 가격 상승, 가설 유지, 가치 아직 큼 승자 유지 보유 하우절 6장, 린치 17장 가격 상승, 가치 수렴·과열 기대수익률 하락 부분 매도·리밸런싱 그레이엄 8장, 막스 04·15장 가격 횡보, 가설 유지 변동성·지루함 수수료 보유 하우절 15장, 보글 20장 가격 횡보, 기회비용 큼, 더 나은 대안 있음 자본배분 문제 교체 검토 린치 16~17장 3단계: 유형별 매도 기준 유형 매도 신호 보유 조건 출처 저성장주 배당 매력 감소, 시장점유율 하락, 재평가 완료 배당 안정, 저평가 유지 린치 15·17장 대형우량주 PER 과열, 이익선 과도 상회, 성장 둔화 정상 밸류에이션, 완만한 성장 린치 15·17장 고성장주 확장 공식 훼손, 성장 둔화, 기관 과밀, 과열 PER 성장 여지와 이익 증가 유지 린치 7·15·17장 경기순환주 재고 증가, 상품가격 하락, 과잉 CAPEX 사이클 초중반, 수급 개선 린치 15·17장 회생주 부채 재악화, 회생 가설 소멸, 주주 몫 불확실 부채 감소, 생존가설 유지 린치 15·17장 자산주 할인 해소, 자산 훼손, 촉매 소멸 자산가치 유지, 촉매 유효 린치 15·17장, 그레이엄 15장 염가주 가치 훼손, 청산가치 감소, 거버넌스 악화 안전마진 유지 그레이엄 15·20장 인덱스 코어 자산배분·현금흐름 목적 변화 장기 목표 유지 보글 13·18~20장 4단계: 심리 필터 매도 전 다음 문장을 확인한다. 나는 단지 손실이 싫어서 파는가? (하우절 15·17장) 나는 본전까지 기다리려는가, 아니면 현재 가치로 판단하는가? (하우절 14장, 린치 18장) 나는 남들이 파니까 파는가? (그레이엄 8장, 하우절 16장) 나는 “이번엔 다르다”를 믿고 보유하는가? (막스 18장, 하우절 12·18장) 이 포지션이 내 생활을 해치고 있는가? 그렇다면 수학보다 지속 가능성을 우선한다. (하우절 11장) 6-5. 절대 금기 금기 왜 위험한가 관련 출처 레버리지로 장기투자를 가장하는 것 맞아도 먼저 강제청산될 수 있다. 하우절 13장, 막스 07·18장, 코스톨라니 8장 좋은 회사라서 가격을 무시하는 것 좋은 회사도 비싸면 나쁜 투자다. 그레이엄 20장, 린치 10장, 막스 04장 인덱스 ETF를 단타 도구로 쓰는 것 보글식 인덱스의 본질은 저비용·분산·장기다. 보글 15장 인기 업종의 인기 종목을 뒤늦게 추격하는 것 기대가 가격에 선반영되어 작은 실망에도 취약하다. 린치 9장, 막스 06장 남의 게임을 따라 하는 것 시간지평·자금구조·정보가 다르면 합리 가격도 다르다. 하우절 16장 최근 수익률로 펀드·전략을 고르는 것 평균회귀와 생존편향이 강하다. 보글 10~11장 구조를 모르는 상품에 투자하는 것 복잡성은 안전이 아니라 판매의 언어일 수 있다. 그레이엄 1·16장, 막스 18장 손실 복구를 위해 포지션을 키우는 것 복수매매는 생존 확률을 낮춘다. 하우절 5장, 코스톨라니 8장 시장 예측을 핵심 전략으로 삼는 것 맞히기도 어렵고, 맞혀도 종목 선택이 틀리면 실패한다. 린치 5장, 막스 14장 비용·세금·환율을 무시하는 것 확정 비용은 불확실 알파보다 강하다. 보글 4~8장 6-6. 심리 방어 프로토콜 폭락장 프로토콜 화면을 보며 즉시 매도하지 않는다. (그레이엄 8장, 하우절 15장) 가격 하락과 가설 훼손을 분리한다. (린치 14장) 생활비·비상금·12개월 필요자금을 확인한다. (린치 4장, 하우절 10장) 레버리지·마진콜·유동성 위험이 있는 포지션부터 점검한다. (막스 18장) 코어 인덱스는 자산배분 규칙으로만 조정한다. (보글 18~20장) 개별주는 유형별 체크리스트로 재검토한다. (린치 7·15·17장) 매수 후보는 분할로 실행한다. 극단은 더 극단으로 갈 수 있다. (막스 11~13장) “지금 팔면 마음이 편해진다”와 “지금 파는 것이 합리적이다”를 구분한다. (하우절 11·15장) 과열장 프로토콜 최근 수익을 실력으로 해석하지 않는다. (하우절 2장, 막스 16·19장) 포트폴리오의 베타와 알파를 구분한다. (막스 19장) 신규 매수 허들을 올린다. (막스 15장) 인기 업종·인기 종목·제2의 아무개 논리를 경계한다. (린치 9장) 레버리지와 집중을 줄인다. (막스 17~18장) ETF·펀드·테마 상품의 비용과 구조를 재확인한다. (보글 15~16장) 현금 보유의 불편함을 견딘다. (막스 13장, 하우절 10장) “이번엔 다르다” 서사를 반대 논거와 함께 문서화한다. (막스 18장, 하우절 12장) 횡보장 프로토콜 지루함을 전략 실패로 착각하지 않는다. (하우절 15장) 매매 빈도 증가를 경계한다. 비용은 확정 손실이다. (보글 1·4~5장) 개별주는 분기별 가설 점검만 수행한다. (린치 14장) 인덱스 코어는 방치가 아니라 규율 유지로 본다. (보글 13·20장) 새 전략을 찾기보다 기존 전략의 실행 품질을 개선한다. (하우절 19장, 막스 20장)"},{"i":8,"title":"7. 한국 투자자 관점에서의 재해석","html":"<h3>7-1. 최상위 제약: 원화 생활비<\/h3>\n<p>[현대 적용] 한국 투자자에게 가장 먼저 오는 질문은 “무슨 ETF를 살까”가 아니라 “내 지출 통화와 자산 통화가 일치하는가”다. 달러 자산의 장기 기대수익이 좋아도, 원화 생활비 기준 변동성이 밤잠과 현금흐름을 흔들면 전략 지속성이 낮아진다. (하우절 11·16장, 보글 18~20장)<\/p>\n<p>따라서 한국 투자자의 기본 순서는 다음이다.<\/p>\n<ol>\n<li>원화 생활비와 단기 필요자금 분리. (린치 4장, 하우절 10·13장)<\/li>\n<li>생활통화와 자산통화의 불일치 점검. [현대 적용] (하우절 11·16장, 보글 18~20장)<\/li>\n<li>국내상장/해외상장 ETF의 총비용·세금·환전·계좌 구조 계산. [현대 적용] (보글 4·5·8장)<\/li>\n<li>미국 집중, 글로벌 분산, 한국 노출의 역할 정의. [현대 적용] (보글 13·18~20장)<\/li>\n<li>위성 개별주는 정보우위와 지배구조 리스크를 동시에 검토. [현대 적용] (린치 6·12~15장, 그레이엄 19장, 막스 05·18장)<\/li>\n<\/ol>\n<h3>7-2. 한국 투자자 주요 변수<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>변수<\/th>\n<th>왜 중요한가<\/th>\n<th>연결 원칙<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>원화 생활비<\/td>\n<td>달러 자산 수익률이 좋아도 원화 기준 변동성이 생활 안정성을 흔들 수 있다.<\/td>\n<td>하우절 11·16장, 보글 18~20장 [현대 적용]<\/td>\n<\/tr>\n<tr>\n<td>환노출<\/td>\n<td>장기 보유가 환리스크를 자동 제거하지 않는다.<\/td>\n<td>보글 18~20장 [현대 적용]<\/td>\n<\/tr>\n<tr>\n<td>국내상장 vs 해외상장 ETF<\/td>\n<td>보수보다 세금·환전·분배금·계좌 구조가 순수익률을 좌우할 수 있다.<\/td>\n<td>보글 4~8장<\/td>\n<\/tr>\n<tr>\n<td>연금저축·IRP·ISA<\/td>\n<td>상품 선택보다 계좌 위치가 더 중요할 수 있다.<\/td>\n<td>보글 8·18~19장 [현대 적용]<\/td>\n<\/tr>\n<tr>\n<td>미국 집중<\/td>\n<td>미국 시장은 강하지만 국가·통화·섹터 집중이 생긴다.<\/td>\n<td>보글 13·18장, 막스 18장<\/td>\n<\/tr>\n<tr>\n<td>한국 개별주 정보우위<\/td>\n<td>생활·업무 현장에서 린치식 우위가 가능하다.<\/td>\n<td>린치 6·12장<\/td>\n<\/tr>\n<tr>\n<td>지배구조 리스크<\/td>\n<td>회계·배당·자사주·대주주 이해상충을 더 엄격히 봐야 한다.<\/td>\n<td>그레이엄 19장, 린치 12~13장<\/td>\n<\/tr>\n<tr>\n<td>개인투자자 레버리지·테마 쏠림<\/td>\n<td>코스톨라니식 돈+심리와 막스식 시장온도 경고가 강하게 작동한다.<\/td>\n<td>코스톨라니 7~8장, 막스 15·18장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>7-3. 한국 투자자용 기본 포트폴리오 사고<\/h3>\n<p>한국 투자자에게 보글식 결론은 “무조건 미국 ETF 하나”가 아니라 다음 구조에 가깝다.<\/p>\n<ol>\n<li>\n<p>원화 생활비와 비상금<br />\n   최소 생활비와 12개월 내 필요자금은 위험자산과 분리한다. (린치 4장, 하우절 10·13장)<\/p>\n<\/li>\n<li>\n<p>장기 코어<br />\n   저비용·광범위·장기 인덱스가 기본이다. 이때 미국·글로벌·한국 비중은 생활통화, 세금, 직업소득, 부동산 노출과 함께 본다. [현대 적용] (보글 13·18~20장)<\/p>\n<\/li>\n<li>\n<p>채권·현금성 완충<br />\n   채권은 신용안전과 가격안전을 분리한다. 장기채는 금리 변동에 민감하다. (그레이엄 1장, 보글 14장)<\/p>\n<\/li>\n<li>\n<p>위성 개별주<br />\n   한국 개별주는 린치식 정보우위가 있을 때만 편입한다. 단, 그레이엄식 재무건전성, 막스식 리스크 보상, 지배구조 리스크를 함께 점검한다. (린치 6~15장, 그레이엄 13·19·20장, 막스 05~07장)<\/p>\n<\/li>\n<li>\n<p>시장온도 조절<br />\n   코스톨라니·막스식으로 대중심리, 레버리지, 거래대금, 금리, 신용, 뉴스 반응을 본다. 단, 예측 공식으로 쓰지 않는다. (코스톨라니 7~8장, 막스 15장)<\/p>\n<\/li>\n<\/ol>\n<h3>7-4. 한국 투자자에게 특히 위험한 오해<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>오해<\/th>\n<th>반박<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>미국 지수 하나면 완전 분산이다.<\/td>\n<td>미국 대형주·달러·특정 섹터 집중이 남을 수 있다. “전체시장”의 범위를 스스로 정의해야 한다. (보글 13장, 막스 18장)<\/td>\n<\/tr>\n<tr>\n<td>국내상장 해외 ETF와 해외상장 ETF는 보수만 보면 된다.<\/td>\n<td>세금, 환전, 분배금, 계좌 구조가 순수익률을 바꾼다. (보글 4·5·8장)<\/td>\n<\/tr>\n<tr>\n<td>한국 개별주는 내가 잘 아니까 유리하다.<\/td>\n<td>잘 안다는 느낌과 사업·재무·지배구조 이해는 다르다. (린치 12장, 그레이엄 19장)<\/td>\n<\/tr>\n<tr>\n<td>레버리지 ETF는 장기 보유하면 수익이 커진다.<\/td>\n<td>보글식 ETF가 아니라 투기 도구에 가깝고, 막스·하우절·코스톨라니가 경계하는 복리 중단 구조다. (보글 15장, 막스 07·18장, 하우절 13장, 코스톨라니 8장)<\/td>\n<\/tr>\n<tr>\n<td>환율은 장기적으로 평균회귀하니 무시해도 된다.<\/td>\n<td>내 생활비가 원화라면 환율 변동은 실제 감정과 현금흐름 리스크다. (하우절 11·16장, 보글 18~20장 [현대 적용])<\/td>\n<\/tr>\n<tr>\n<td>세금은 나중 문제다.<\/td>\n<td>세금은 비용이며, 비용은 복리로 누적된다. (보글 4~8장)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />","text":"7-1. 최상위 제약: 원화 생활비 [현대 적용] 한국 투자자에게 가장 먼저 오는 질문은 “무슨 ETF를 살까”가 아니라 “내 지출 통화와 자산 통화가 일치하는가”다. 달러 자산의 장기 기대수익이 좋아도, 원화 생활비 기준 변동성이 밤잠과 현금흐름을 흔들면 전략 지속성이 낮아진다. (하우절 11·16장, 보글 18~20장) 따라서 한국 투자자의 기본 순서는 다음이다. 원화 생활비와 단기 필요자금 분리. (린치 4장, 하우절 10·13장) 생활통화와 자산통화의 불일치 점검. [현대 적용] (하우절 11·16장, 보글 18~20장) 국내상장/해외상장 ETF의 총비용·세금·환전·계좌 구조 계산. [현대 적용] (보글 4·5·8장) 미국 집중, 글로벌 분산, 한국 노출의 역할 정의. [현대 적용] (보글 13·18~20장) 위성 개별주는 정보우위와 지배구조 리스크를 동시에 검토. [현대 적용] (린치 6·12~15장, 그레이엄 19장, 막스 05·18장) 7-2. 한국 투자자 주요 변수 변수 왜 중요한가 연결 원칙 원화 생활비 달러 자산 수익률이 좋아도 원화 기준 변동성이 생활 안정성을 흔들 수 있다. 하우절 11·16장, 보글 18~20장 [현대 적용] 환노출 장기 보유가 환리스크를 자동 제거하지 않는다. 보글 18~20장 [현대 적용] 국내상장 vs 해외상장 ETF 보수보다 세금·환전·분배금·계좌 구조가 순수익률을 좌우할 수 있다. 보글 4~8장 연금저축·IRP·ISA 상품 선택보다 계좌 위치가 더 중요할 수 있다. 보글 8·18~19장 [현대 적용] 미국 집중 미국 시장은 강하지만 국가·통화·섹터 집중이 생긴다. 보글 13·18장, 막스 18장 한국 개별주 정보우위 생활·업무 현장에서 린치식 우위가 가능하다. 린치 6·12장 지배구조 리스크 회계·배당·자사주·대주주 이해상충을 더 엄격히 봐야 한다. 그레이엄 19장, 린치 12~13장 개인투자자 레버리지·테마 쏠림 코스톨라니식 돈+심리와 막스식 시장온도 경고가 강하게 작동한다. 코스톨라니 7~8장, 막스 15·18장 7-3. 한국 투자자용 기본 포트폴리오 사고 한국 투자자에게 보글식 결론은 “무조건 미국 ETF 하나”가 아니라 다음 구조에 가깝다. 원화 생활비와 비상금 최소 생활비와 12개월 내 필요자금은 위험자산과 분리한다. (린치 4장, 하우절 10·13장) 장기 코어 저비용·광범위·장기 인덱스가 기본이다. 이때 미국·글로벌·한국 비중은 생활통화, 세금, 직업소득, 부동산 노출과 함께 본다. [현대 적용] (보글 13·18~20장) 채권·현금성 완충 채권은 신용안전과 가격안전을 분리한다. 장기채는 금리 변동에 민감하다. (그레이엄 1장, 보글 14장) 위성 개별주 한국 개별주는 린치식 정보우위가 있을 때만 편입한다. 단, 그레이엄식 재무건전성, 막스식 리스크 보상, 지배구조 리스크를 함께 점검한다. (린치 6~15장, 그레이엄 13·19·20장, 막스 05~07장) 시장온도 조절 코스톨라니·막스식으로 대중심리, 레버리지, 거래대금, 금리, 신용, 뉴스 반응을 본다. 단, 예측 공식으로 쓰지 않는다. (코스톨라니 7~8장, 막스 15장) 7-4. 한국 투자자에게 특히 위험한 오해 오해 반박 미국 지수 하나면 완전 분산이다. 미국 대형주·달러·특정 섹터 집중이 남을 수 있다. “전체시장”의 범위를 스스로 정의해야 한다. (보글 13장, 막스 18장) 국내상장 해외 ETF와 해외상장 ETF는 보수만 보면 된다. 세금, 환전, 분배금, 계좌 구조가 순수익률을 바꾼다. (보글 4·5·8장) 한국 개별주는 내가 잘 아니까 유리하다. 잘 안다는 느낌과 사업·재무·지배구조 이해는 다르다. (린치 12장, 그레이엄 19장) 레버리지 ETF는 장기 보유하면 수익이 커진다. 보글식 ETF가 아니라 투기 도구에 가깝고, 막스·하우절·코스톨라니가 경계하는 복리 중단 구조다. (보글 15장, 막스 07·18장, 하우절 13장, 코스톨라니 8장) 환율은 장기적으로 평균회귀하니 무시해도 된다. 내 생활비가 원화라면 환율 변동은 실제 감정과 현금흐름 리스크다. (하우절 11·16장, 보글 18~20장 [현대 적용]) 세금은 나중 문제다. 세금은 비용이며, 비용은 복리로 누적된다. (보글 4~8장)"},{"i":9,"title":"8. 후속 학습 로드맵","html":"<p>외부 책을 새 근거로 추가하지 않는다. 아래 로드맵은 6권 내부 재독 순서다.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>학습 목적<\/th>\n<th>재독 순서<\/th>\n<th>산출물<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>기본 포트폴리오 구축<\/td>\n<td>보글 13·18·20장 → 그레이엄 4장 → 하우절 11·19장<\/td>\n<td>개인 투자정책서, 기본 배분, 리밸런싱 규칙<\/td>\n<\/tr>\n<tr>\n<td>개별주 예외 전략<\/td>\n<td>린치 6·7·10·11·12·13·14·17장 → 그레이엄 13·14·15·20장 → 막스 03·04·05장<\/td>\n<td>2분 독백, 유형 분류표, 가격-가치 메모<\/td>\n<\/tr>\n<tr>\n<td>리스크와 생존<\/td>\n<td>하우절 5·6·13·16장 → 막스 05·06·07·17·18장 → 코스톨라니 1·2·8장<\/td>\n<td>레버리지 금지 규칙, 현금 버퍼, 손실 대응 프로토콜<\/td>\n<\/tr>\n<tr>\n<td>시장온도와 주기<\/td>\n<td>막스 08·09·15·17장 → 코스톨라니 7·8장 → 그레이엄 8장<\/td>\n<td>시장온도 기록표, 공격/방어 밴드<\/td>\n<\/tr>\n<tr>\n<td>한국 투자자 적용<\/td>\n<td>보글 4·8·13·18~20장 → 하우절 10·11·16장 → 린치 4·6·12장<\/td>\n<td>원화 생활비 기준표, 계좌별 비용표, 환노출 정책<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />","text":"외부 책을 새 근거로 추가하지 않는다. 아래 로드맵은 6권 내부 재독 순서다. 학습 목적 재독 순서 산출물 기본 포트폴리오 구축 보글 13·18·20장 → 그레이엄 4장 → 하우절 11·19장 개인 투자정책서, 기본 배분, 리밸런싱 규칙 개별주 예외 전략 린치 6·7·10·11·12·13·14·17장 → 그레이엄 13·14·15·20장 → 막스 03·04·05장 2분 독백, 유형 분류표, 가격-가치 메모 리스크와 생존 하우절 5·6·13·16장 → 막스 05·06·07·17·18장 → 코스톨라니 1·2·8장 레버리지 금지 규칙, 현금 버퍼, 손실 대응 프로토콜 시장온도와 주기 막스 08·09·15·17장 → 코스톨라니 7·8장 → 그레이엄 8장 시장온도 기록표, 공격/방어 밴드 한국 투자자 적용 보글 4·8·13·18~20장 → 하우절 10·11·16장 → 린치 4·6·12장 원화 생활비 기준표, 계좌별 비용표, 환노출 정책"},{"i":10,"title":"9. 최종 통합 선언문","html":"<p>투자는 예측 게임이 아니다.<br />\n투자는 불확실한 미래 앞에서 가격, 가치, 비용, 세금, 심리, 시간, 리스크, 자산배분, 자기 기질을 하나의 구조로 묶는 운영 게임이다.<\/p>\n<p>그레이엄은 기준을 준다.<br />\n투자는 철저한 분석, 원금 안전, 만족스러운 수익이어야 하며, 안전마진이 없으면 미래 예측의 작은 오차도 치명적이다. (그레이엄 1·20장)<\/p>\n<p>보글은 기본값을 준다.<br />\n대다수 투자자에게 시장 전체를 낮은 비용으로 오래 보유하는 것은 초라한 평균이 아니라, 비용과 감정이 만든 마이너스섬 게임에서 자신의 몫을 지키는 강한 전략이다. (보글 3~5·13·20장)<\/p>\n<p>린치는 예외의 조건을 준다.<br />\n개별주 우위는 가능하지만, 친숙함만으로는 부족하다. 유형 분류, 2분 독백, 이익·PER·부채·재고·현금 확인, 스토리 재점검, 유형별 매도 기준이 있어야 한다. (린치 6~17장)<\/p>\n<p>하우절은 지속 가능성을 준다.<br />\n돈 문제는 지식보다 행동이며, 복리는 높은 수익률보다 긴 생존 기간에서 나온다. 내가 버틸 수 없는 전략은 내 전략이 아니다. (하우절 0·4·5·11·19장)<\/p>\n<p>코스톨라니는 시장의 인간적 얼굴을 준다.<br />\n가격은 경제만이 아니라 돈과 심리, 수급과 손바뀜, 소신파와 부화뇌동파의 이동으로 흔들린다. 그러나 그의 달걀은 예언 공식이 아니라 현재 위치를 읽는 관찰 도구다. (코스톨라니 5·7·8장)<\/p>\n<p>막스는 방어적 지성을 준다.<br />\n시장을 이기려면 다르게 생각해야 하지만, 다르면서 더 정확해야 한다. 리스크는 보통 보이지 않을 때 커지고, 과열기에는 방어가, 공포기에는 준비된 공격이 필요하다. (막스 01~07·15·17~19장)<\/p>\n<p>따라서 6권의 통합 결론은 다음 한 문장으로 압축된다.<\/p>\n<p><strong>투자자는 먼저 보글식 기본값으로 생존 가능한 구조를 만들고, 그레이엄식 안전마진으로 가격을 통제하며, 하우절식 행동 규율로 복리를 지키고, 막스식 리스크·주기 인식으로 공격과 방어를 조절하며, 코스톨라니식 심리 관찰로 군중의 위치를 읽고, 린치식 조사 절차를 통과한 경우에만 개별주 예외를 허용해야 한다.<\/strong><\/p>\n<hr />","text":"투자는 예측 게임이 아니다. 투자는 불확실한 미래 앞에서 가격, 가치, 비용, 세금, 심리, 시간, 리스크, 자산배분, 자기 기질을 하나의 구조로 묶는 운영 게임이다. 그레이엄은 기준을 준다. 투자는 철저한 분석, 원금 안전, 만족스러운 수익이어야 하며, 안전마진이 없으면 미래 예측의 작은 오차도 치명적이다. (그레이엄 1·20장) 보글은 기본값을 준다. 대다수 투자자에게 시장 전체를 낮은 비용으로 오래 보유하는 것은 초라한 평균이 아니라, 비용과 감정이 만든 마이너스섬 게임에서 자신의 몫을 지키는 강한 전략이다. (보글 3~5·13·20장) 린치는 예외의 조건을 준다. 개별주 우위는 가능하지만, 친숙함만으로는 부족하다. 유형 분류, 2분 독백, 이익·PER·부채·재고·현금 확인, 스토리 재점검, 유형별 매도 기준이 있어야 한다. (린치 6~17장) 하우절은 지속 가능성을 준다. 돈 문제는 지식보다 행동이며, 복리는 높은 수익률보다 긴 생존 기간에서 나온다. 내가 버틸 수 없는 전략은 내 전략이 아니다. (하우절 0·4·5·11·19장) 코스톨라니는 시장의 인간적 얼굴을 준다. 가격은 경제만이 아니라 돈과 심리, 수급과 손바뀜, 소신파와 부화뇌동파의 이동으로 흔들린다. 그러나 그의 달걀은 예언 공식이 아니라 현재 위치를 읽는 관찰 도구다. (코스톨라니 5·7·8장) 막스는 방어적 지성을 준다. 시장을 이기려면 다르게 생각해야 하지만, 다르면서 더 정확해야 한다. 리스크는 보통 보이지 않을 때 커지고, 과열기에는 방어가, 공포기에는 준비된 공격이 필요하다. (막스 01~07·15·17~19장) 따라서 6권의 통합 결론은 다음 한 문장으로 압축된다. 투자자는 먼저 보글식 기본값으로 생존 가능한 구조를 만들고, 그레이엄식 안전마진으로 가격을 통제하며, 하우절식 행동 규율로 복리를 지키고, 막스식 리스크·주기 인식으로 공격과 방어를 조절하며, 코스톨라니식 심리 관찰로 군중의 위치를 읽고, 린치식 조사 절차를 통과한 경우에만 개별주 예외를 허용해야 한다."},{"i":11,"title":"10. 검증 체크리스트","html":"<h3>10-1. 문서 구조 검증<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>점검 결과<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>책별 단순 재요약이 아니라 교차 비교 중심인가<\/td>\n<td>예. 각 섹션은 2권 이상을 연결했다.<\/td>\n<\/tr>\n<tr>\n<td>모든 주요 주장에 책과 장 기준 출처를 붙였는가<\/td>\n<td>예. 문장 또는 표 단위로 책·장 출처를 표기했다.<\/td>\n<\/tr>\n<tr>\n<td>보강 노트의 부록 표기를 주 출처처럼 쓰지 않았는가<\/td>\n<td>예. 가능한 한 책과 장으로 환원했다.<\/td>\n<\/tr>\n<tr>\n<td>불확실 태그가 있는 내용을 확정 주장으로 쓰지 않았는가<\/td>\n<td>예. 그레이엄 16~18장 세부 사례, 하우절 일부 사례, 코스톨라니 일화·원어는 중심 근거로 쓰지 않았다.<\/td>\n<\/tr>\n<tr>\n<td>섹션 4·5·6을 깊게 작성했는가<\/td>\n<td>예. 충돌 해부, 사이클 모델, 실행 체계를 확장했다.<\/td>\n<\/tr>\n<tr>\n<td>개인 맞춤 종목·ETF 추천을 하지 않았는가<\/td>\n<td>예. 원칙과 프로세스만 제시했다.<\/td>\n<\/tr>\n<tr>\n<td>한국 투자자 관점을 분리했는가<\/td>\n<td>예. 미국 투자자 전제와 한국 투자자 변수를 구분했다.<\/td>\n<\/tr>\n<tr>\n<td>6권 외부 자료를 새 근거로 쓰지 않았는가<\/td>\n<td>예. 후속 학습도 6권 내부 재독 로드맵으로 제한했다.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>10-2. 해석 가드레일 검증<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>위험한 해석<\/th>\n<th>본문 처리<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>보글 = 개별주 절대 금지<\/td>\n<td>“대다수의 기본값”으로 해석하고, 린치식 예외 조건을 별도 제시했다.<\/td>\n<\/tr>\n<tr>\n<td>린치 = 아는 회사면 매수<\/td>\n<td>생활 관찰은 출발점일 뿐, 재무·경쟁·확장 계획 조사 필수로 정리했다.<\/td>\n<\/tr>\n<tr>\n<td>코스톨라니 = 시장 예측 공식<\/td>\n<td>달걀과 금리 프레임을 온도계·관찰 도구로만 사용했다.<\/td>\n<\/tr>\n<tr>\n<td>막스 = 역투자는 무조건 반대로 하기<\/td>\n<td>독립 가치판단, 가격/가치 괴리, 장기 자본, 무레버리지 조건을 명시했다.<\/td>\n<\/tr>\n<tr>\n<td>그레이엄 = 옛날 저PER/PBR 기계식 공식<\/td>\n<td>안전마진·가격 규율을 중심으로 두고 현대 적용 시 무형자산·세금·회계 차이를 언급했다.<\/td>\n<\/tr>\n<tr>\n<td>하우절 = 분석보다 감정만 중요<\/td>\n<td>행동 통제를 분석 위의 상위 레이어로 해석했다.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>10-3. 실제 사용 전 12문항<\/h3>\n<p>투자 실행 전 아래 12개 질문을 반드시 통과해야 한다.<\/p>\n<ol>\n<li>이 돈은 언제 필요한가? (린치 4장, 보글 18~19장)<\/li>\n<li>내 기본 포트폴리오는 저비용·분산·장기 구조인가? (보글 13·20장)<\/li>\n<li>이 투자는 전체시장 코어인가, 위성 개별주인가? (보글 13장, 린치 16장)<\/li>\n<li>개별주라면 6가지 유형 중 무엇인가? (린치 7장)<\/li>\n<li>2분 독백이 가능한가? (린치 11장)<\/li>\n<li>가격과 가치의 관계를 계산했는가? (그레이엄 20장, 막스 04장)<\/li>\n<li>안전마진이 있는가? (그레이엄 20장, 하우절 13장)<\/li>\n<li>리스크는 변동성이 아니라 영구 손실 관점에서 검토했는가? (막스 05장)<\/li>\n<li>비용·세금·환전·계좌 구조를 반영했는가? (보글 4~8장, 한국 적용)<\/li>\n<li>시장온도는 뜨거운가, 차가운가, 중립인가? (막스 15장, 코스톨라니 8장)<\/li>\n<li>내가 다른 사람의 게임을 따라 하고 있지는 않은가? (하우절 16장)<\/li>\n<li>틀렸을 때 먼저 보일 신호와 매도 기준을 적었는가? (린치 14·17장, 막스 18장)<\/li>\n<\/ol>\n<h3>10-4. 최종 운영 원칙<\/h3>\n<p>투자 실행 문서의 마지막 줄에는 항상 다음 문장을 붙인다.<\/p>\n<p><strong>나는 시장을 맞히려는 것이 아니라, 틀려도 살아남고, 맞았을 때 충분히 얻고, 비용과 감정으로 복리를 훼손하지 않으며, 내가 이해하는 게임만 하려는 것이다.<\/strong><\/p>","text":"10-1. 문서 구조 검증 항목 점검 결과 책별 단순 재요약이 아니라 교차 비교 중심인가 예. 각 섹션은 2권 이상을 연결했다. 모든 주요 주장에 책과 장 기준 출처를 붙였는가 예. 문장 또는 표 단위로 책·장 출처를 표기했다. 보강 노트의 부록 표기를 주 출처처럼 쓰지 않았는가 예. 가능한 한 책과 장으로 환원했다. 불확실 태그가 있는 내용을 확정 주장으로 쓰지 않았는가 예. 그레이엄 16~18장 세부 사례, 하우절 일부 사례, 코스톨라니 일화·원어는 중심 근거로 쓰지 않았다. 섹션 4·5·6을 깊게 작성했는가 예. 충돌 해부, 사이클 모델, 실행 체계를 확장했다. 개인 맞춤 종목·ETF 추천을 하지 않았는가 예. 원칙과 프로세스만 제시했다. 한국 투자자 관점을 분리했는가 예. 미국 투자자 전제와 한국 투자자 변수를 구분했다. 6권 외부 자료를 새 근거로 쓰지 않았는가 예. 후속 학습도 6권 내부 재독 로드맵으로 제한했다. 10-2. 해석 가드레일 검증 위험한 해석 본문 처리 보글 = 개별주 절대 금지 “대다수의 기본값”으로 해석하고, 린치식 예외 조건을 별도 제시했다. 린치 = 아는 회사면 매수 생활 관찰은 출발점일 뿐, 재무·경쟁·확장 계획 조사 필수로 정리했다. 코스톨라니 = 시장 예측 공식 달걀과 금리 프레임을 온도계·관찰 도구로만 사용했다. 막스 = 역투자는 무조건 반대로 하기 독립 가치판단, 가격/가치 괴리, 장기 자본, 무레버리지 조건을 명시했다. 그레이엄 = 옛날 저PER/PBR 기계식 공식 안전마진·가격 규율을 중심으로 두고 현대 적용 시 무형자산·세금·회계 차이를 언급했다. 하우절 = 분석보다 감정만 중요 행동 통제를 분석 위의 상위 레이어로 해석했다. 10-3. 실제 사용 전 12문항 투자 실행 전 아래 12개 질문을 반드시 통과해야 한다. 이 돈은 언제 필요한가? (린치 4장, 보글 18~19장) 내 기본 포트폴리오는 저비용·분산·장기 구조인가? (보글 13·20장) 이 투자는 전체시장 코어인가, 위성 개별주인가? (보글 13장, 린치 16장) 개별주라면 6가지 유형 중 무엇인가? (린치 7장) 2분 독백이 가능한가? (린치 11장) 가격과 가치의 관계를 계산했는가? (그레이엄 20장, 막스 04장) 안전마진이 있는가? (그레이엄 20장, 하우절 13장) 리스크는 변동성이 아니라 영구 손실 관점에서 검토했는가? (막스 05장) 비용·세금·환전·계좌 구조를 반영했는가? (보글 4~8장, 한국 적용) 시장온도는 뜨거운가, 차가운가, 중립인가? (막스 15장, 코스톨라니 8장) 내가 다른 사람의 게임을 따라 하고 있지는 않은가? (하우절 16장) 틀렸을 때 먼저 보일 신호와 매도 기준을 적었는가? (린치 14·17장, 막스 18장) 10-4. 최종 운영 원칙 투자 실행 문서의 마지막 줄에는 항상 다음 문장을 붙인다. 나는 시장을 맞히려는 것이 아니라, 틀려도 살아남고, 맞았을 때 충분히 얻고, 비용과 감정으로 복리를 훼손하지 않으며, 내가 이해하는 게임만 하려는 것이다."}]}]}</script>
<script>'use strict';
/* ============================================================
   PART 01 — 코어: 유틸 · 저장소 · 정적 데이터
   원본: 투자 고전 6권 노트 + 통합 지식체계 (사용자 작성)
   설계 원칙: 예측이 아니라 절차. 점수가 아니라 게이트.
   출처 태그는 통합 문서의 확실성 규칙([명시]·[간접]·[현대 적용]·[추론])을 따른다.
   ============================================================ */

/* ---------- 환경 가드 / 유틸 ---------- */
const HAS_DOM = (typeof document !== 'undefined');
const LS = (typeof localStorage !== 'undefined') ? localStorage
  : { _m: {}, getItem(k){ return (k in this._m) ? this._m[k] : null; },
      setItem(k, v){ this._m[k] = String(v); }, removeItem(k){ delete this._m[k]; } };

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad2(n){ return String(n).padStart(2, '0'); }
function todayISO(){ const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(iso, n){ const d = new Date((iso || todayISO()) + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function daysFrom(iso){ if(!iso) return null;
  const a = new Date(iso + 'T00:00:00'), b = new Date(todayISO() + 'T00:00:00');
  return Math.round((b - a) / 86400000); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }

/* ---------- 책 데이터 ---------- */
const RAW = HAS_DOM ? JSON.parse(document.getElementById('DATA').textContent)
                    : { built_at: '', chars: 0, books: [] };
const BOOK = {}; RAW.books.forEach(b => { BOOK[b.id] = b; });
function findChapter(bookId, prefix){
  const b = BOOK[bookId]; if(!b) return -1;
  return b.chapters.findIndex(c => c.title.indexOf(prefix) === 0);
}

/* ---------- 투자자 레벨 판정 (통합 6-0 [추론]) ----------
   제로 게이트(비상금·단기자금·규율붕괴)가 자격(q5~q8)보다 우선한다. */
function computeLevel(ans){
  if(ans.q1 === false || ans.q2 === true || ans.q3 === true || ans.q4 === true) return 0;
  let lv = 1;
  if(ans.q5 && ans.q6) lv = 2;
  if(lv >= 2 && ans.q7) lv = 3;
  if(lv >= 3 && ans.q8) lv = 4;
  return lv;
}

/* ---------- 시장온도 신뢰도 제안 (통합 5-2) ----------
   극단 신호(0~1점 또는 4~5점) 개수로 등급을 제안한다. */
function confSuggest(scores){
  let ext = 0;
  Object.keys(scores).forEach(k => { const v = scores[k]; if(v <= 1 || v >= 4) ext++; });
  return ext >= 6 ? '높음' : (ext >= 3 ? '중간' : '낮음');
}

/* ---------- 게이트 판정 (점수 합산이 아니라 게이트) ----------
   하드 게이트 1건 실패 = 무조건 보류. 소프트만 실패 = 조건부. */
function verdictFromGates(gates){
  const failsHard = gates.filter(g => !g.pass && g.hard);
  const failsSoft = gates.filter(g => !g.pass && !g.hard);
  if(failsHard.length) return { v:'보류', cls:'bad', label:'절차 미통과 — 매수 보류', failsHard, failsSoft };
  if(failsSoft.length) return { v:'조건부', cls:'warn', label:'조건부 통과 — 경고 해소 권장', failsHard, failsSoft };
  return { v:'통과', cls:'ok', label:'절차 통과 — 실행 여부는 본인 판단', failsHard, failsSoft };
}

/* ---------- 게이트 생성기 ---------- */
/* A. 내 게임 (6-2 A): ansArr[i] = 사용자의 예(true)/아니오(false), 통과 = 응답===passVal */
function gameGates(ansArr){
  return GAME_CHECK.map((g, i) => ({ grp:'내 게임', q:g.q,
    pass: ansArr[i] === g.passVal, hard:true, fail:g.fail, src:g.src }));
}
/* D. 예외 허가서 (6-2 D): 충족(true)만 통과 */
function permitGates(ansArr){
  return PERMIT.map((p, i) => ({ grp:'예외 허가서', q:p.q,
    pass: ansArr[i] === true, hard:true, fail:p.fail, src:p.src }));
}
/* E. 비용·세금 (6-2 E): 항목별 hard 플래그 */
function costGates(ansObj){
  return COST_CHECK.map(e => ({ grp:'비용·세금', q:e.q,
    pass: ansObj[e.k] === true, hard:e.hard, fail:e.fail, src:e.src }));
}
/* 감정 상태 (5-4 「내 행동 충동」, 6-6): FOMO·확신과잉 = 하드, 약간 흥분 = 소프트 */
function emotionGate(emotion){
  const i = EMOTIONS.indexOf(emotion);
  if(i < 0) return { grp:'심리', q:'감정 상태 기록', pass:false, hard:true,
    fail:'감정 상태를 선택해야 판정한다', src:'통합 5-4' };
  if(i >= 3) return { grp:'심리', q:'감정 상태: ' + emotion, pass:false, hard:true,
    fail:'24시간 보류 후 재검토 — 충동이 강할수록 매수 보류', src:'통합 5-4·6-6, 하우절 3·11장, 막스 10장' };
  if(i === 2) return { grp:'심리', q:'감정 상태: ' + emotion, pass:false, hard:false,
    fail:'흥분 상태 — 하루 묵힌 뒤 재확인 권장', src:'통합 6-6' };
  return null; // 통과 — 게이트 미생성
}
/* 필수 입력 게이트 */
function reqGate(grp, label, value, failMsg, src, hard){
  const ok = !!String(value == null ? '' : value).trim();
  return { grp, q:label, pass:ok, hard: hard !== false, fail:failMsg, src };
}
/* 포지션 크기 게이트 (IPS 대조) */
function posGates(pct, ips, assetType, satSum){
  const out = [];
  if(pct == null || pct <= 0){
    out.push({ grp:'포지션', q:'포지션 크기(%)', pass:false, hard:true,
      fail:'포지션 크기를 입력해야 한다 — 확신이 아니라 생존 가능성으로 정한다', src:'막스 05·17장, 하우절 5·13장' });
    return out;
  }
  if(ips && isStockish(assetType)){
    if(ips.singleMax != null && pct > ips.singleMax){
      out.push({ grp:'포지션', q:'단일 종목 비중 ' + pct + '%', pass:false, hard:true,
        fail:'비중 축소 — IPS 단일 종목 상한 ' + ips.singleMax + '% 초과', src:'IPS + 하우절 5·13장, 막스 05·17장' });
    }
    if(ips.satMax != null && (satSum || 0) + pct > ips.satMax){
      out.push({ grp:'포지션', q:'위성 총비중 ' + ((satSum || 0) + pct) + '%', pass:false, hard:false,
        fail:'위성(개별주 등) 총 한도 ' + ips.satMax + '% 초과 추정 — 비중 재배분 검토', src:'IPS + 보글 13·20장' });
    }
  }
  return out;
}

/* ---------- 매도 판정 (통합 6-4 2단계 매트릭스) ----------
   a: {thesis:'유지'|'약화'|'훼손', price:'하락'|'상승'|'횡보',
       marginWider, valueLeft, betterAlt: true/false} */
function sellStockVerdict(a){
  if(a.thesis === '훼손') return { v:'매도 또는 축소', cls:'bad',
    why:'손실 회피가 아니라 오류 수정이다.', src:'린치 14·17장, 막스 18장' };
  if(a.thesis === '약화') return { v:'부분 축소 검토 + 점검 강화', cls:'warn',
    why:'원인 분석 후 분기 점검을 강화한다. [추론]', src:'린치 14장, 막스 18장' };
  if(a.price === '하락'){
    return a.marginWider
      ? { v:'보유 — 추가 매수 후보', cls:'ok', why:'Mr. Market의 제안일 수 있다 (가설 유지 + 안전마진 확대).', src:'그레이엄 8·20장, 막스 04·12장' }
      : { v:'보유 유지', cls:'ok', why:'가격 하락은 가설 훼손이 아니다.', src:'린치 14장, 그레이엄 8장' };
  }

function makeCollapsibles(root){
  const frag = document.createDocumentFragment();
  let det = null;
  const nodes = Array.prototype.slice.call(root.childNodes);
  nodes.forEach(function(node){
    if(node.nodeType === 1 && node.tagName === 'H3'){
      det = document.createElement('details');
      const s = document.createElement('summary');
      s.innerHTML = node.innerHTML;
      det.appendChild(s);
      frag.appendChild(det);
    } else if(det){ det.appendChild(node); }
    else { frag.appendChild(node); }
  });
  root.innerHTML = '';
  root.appendChild(frag);
}

function enhanceReaderContent(root){
  if(!root) return;
  enhanceReaderSectionHeads(root);
  enhanceReaderTables(root);
}
function enhanceReaderSectionHeads(root){
  const rules = [
    [/기존 노트|개인투자자가 반드시|실제 투자 체크리스트|작성 원칙/, '📝'],
    [/\[사례\]|사례|인물|사건/, '🧩'],
    [/\[데이터\]|\[수치·공식\]|종합표|기준표|출처 목록/, '📊'],
    [/\[보강|논리 전개|그레이엄 본문|하우절 본문|막스 본문|본문/, '🔎'],
    [/현대적 적용|실전 적용|적용 논점|후대 해석/, '🧭'],
    [/오해 방지|금지|주의|위험|Red line/i, '⚠️'],
    [/주석|코멘트|츠바이크|버핏/, '💬'],
    [/검증|체크리스트|추가 검증|한계/, '🔗'],
    [/요약|핵심|한 문장/, '📌']
  ];
  Array.prototype.forEach.call(root.querySelectorAll('summary,h2,h3,h4'), function(h){
    const text = (h.textContent || '').trim();
    if(!text) return;
    for(let i=0;i<rules.length;i++){
      if(rules[i][0].test(text)){ h.setAttribute('data-icon', rules[i][1]); return; }
    }
    h.setAttribute('data-icon','§');
  });
}
function enhanceReaderTables(root){
  Array.prototype.forEach.call(root.querySelectorAll('.tw'), function(wrap){
    const table = wrap.querySelector('table');
    if(!table || table.dataset.enhanced === '1') return;
    table.dataset.enhanced = '1';
    table.classList.add('data-card-table');
    let headers = [];
    const ths = table.querySelectorAll('thead th');
    if(ths.length){ headers = Array.prototype.map.call(ths, function(th){ return th.textContent.trim(); }); }
    else {
      const first = table.querySelector('tr');
      if(first) headers = Array.prototype.map.call(first.children, function(cell){ return cell.textContent.trim(); });
    }
    const rows = table.querySelectorAll('tbody tr').length || Math.max(0, table.querySelectorAll('tr').length - 1);
    const cols = headers.length || (table.querySelector('tr') ? table.querySelector('tr').children.length : 0);
    wrap.classList.toggle('tw--wide', cols >= 4);
    Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function(tr){
      Array.prototype.forEach.call(tr.children, function(td, i){
        if(td.tagName === 'TD') td.setAttribute('data-label', headers[i] || ('항목 ' + (i + 1)));
      });
    });
    if(!wrap.querySelector('.table-tools')){
      const tool = document.createElement('div');
      tool.className = 'table-tools';
      tool.innerHTML = '<span class="table-title">📊 데이터 표</span><span class="table-hint">' + cols + '열 · ' + rows + '행 · 좌우 스크롤</span>';
      wrap.insertBefore(tool, table);
    }
  });
}

function highlight(el, q){
  if(!q) return 0;
  const ql = q.toLowerCase();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let n;
  while((n = walker.nextNode())){
    if(n.nodeValue.toLowerCase().indexOf(ql) > -1) nodes.push(n);
  }
  nodes.forEach(function(node){
    const frag = document.createDocumentFragment();
    let rest = node.nodeValue, idx;
    while((idx = rest.toLowerCase().indexOf(ql)) > -1){
      frag.appendChild(document.createTextNode(rest.slice(0, idx)));
      const m = document.createElement('mark');
      m.textContent = rest.slice(idx, idx + q.length);
      frag.appendChild(m);
      rest = rest.slice(idx + q.length);
    }
    frag.appendChild(document.createTextNode(rest));
    node.parentNode.replaceChild(frag, node);
  });
  const marks = el.querySelectorAll('mark');
  Array.prototype.forEach.call(marks, function(m){
    let p = m.parentElement;
    while(p && p !== el){ if(p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
  });
  if(marks[0]) setTimeout(function(){ marks[0].scrollIntoView({ block:'center' }); }, 80);
  return marks.length;
}

function doSearch(q){
  const ql = q.toLowerCase();
  const res = [];
  RAW.books.forEach(function(b){
    b.chapters.forEach(function(c, ci){
      const t = c.text.toLowerCase();
      let pos = t.indexOf(ql);
      if(pos < 0) return;
      let cnt = 0, p = pos;
      while(p > -1 && cnt < 99){ cnt++; p = t.indexOf(ql, p + ql.length); }
      const s = Math.max(0, pos - 50);
      res.push({ b:b.id, book:b.short, ci:ci, title:c.title, cnt:cnt, snip:c.text.slice(s, pos + 100) });
    });
  });
  res.sort(function(a, b){ return b.cnt - a.cnt; });
  return res.slice(0, 60);
}

    on('.hit', 'click', function(e){ goto(e.currentTarget.dataset.h); });
  }
  renderRes(q0);

      return { block:'특수상황은 레벨 4 도구다. 현재 Lv.' + lv + ' (' + LEVELS[lv].name + ') — 금지 도구: ' + LEVELS[lv].deny, link:'level', label:'레벨 재진단' };
    if(lv < 2)
      return { block:'위성 자산(개별주·테마·특수상황)은 레벨 2 이상 도구다. 현재 Lv.' + lv + ' (' + LEVELS[lv].name + ') — 금지 도구: ' + LEVELS[lv].deny, link:'level', label:'레벨 재진단' };
    if(!S.ips)
      return { block:'위성 자산 검토에는 IPS가 필수다 — 단일 종목·위성 상한 게이트의 기준이 없다.', link:'ips', label:'IPS 작성하러 가기' };
  }
  return { block:null, warnNoIps: !S.ips };
}

/* ---------- 판정 게이트 집계 ---------- */
function evalBuyGates(d){
  const gates = [];
  gates.push.apply(gates, gameGates(d.game));
  const tc = TYPE_CHECK[d.assetType];
  if(tc) gates.push({ grp:'유형 검증', q:tc.q, pass:d.typeOk === true, hard:true, fail:'통과 기준: ' + tc.pass, src:tc.src });
  if(d.assetType === '개별주' && STOCK_SUBCHECK[d.stockType]){
    const sc = STOCK_SUBCHECK[d.stockType];
    gates.push({ grp:'유형 검증', q:'[' + d.stockType + '] ' + sc.q, pass:d.subOk === true, hard:true, fail:'유형별 핵심 질문 미충족 — 재조사', src:sc.src });
  }
  if(d.assetType === '전체시장 인덱스')
    gates.push({ grp:'유형 검증', q:'레버리지·테마·단일종목 ETF가 아님을 확인했는가?', pass:d.etfCore === true, hard:true, fail:'구조 확인 전 보류', src:'보글 15~16장' });
  if(isStockish(d.assetType)) gates.push.apply(gates, permitGates(d.permit));
  gates.push(reqGate('가격·가치', '가격-가치 근거', d.valuation, '가격 없는 「좋은 회사」 메모는 반려한다', '합의 원칙 2 — 그레이엄 20장, 막스 04장, 린치 10장'));
  gates.push({ grp:'가격·가치', q:'가치 대비 가격 위치 판단', pass: !!d.pvv && d.pvv !== '모름', hard:true, fail:'가격-가치 괴리를 모르면 판단하지 않는다', src:'통합 5-4, 그레이엄 20장' });
  const hard2 = isStockish(d.assetType);
  gates.push(reqGate('가격·가치', '시장이 이미 반영한 기대', d.marketExpect, '2차적 사고 — 시장의 기대를 먼저 적어라', '막스 01~02장', hard2));
  gates.push(reqGate('가격·가치', '내 시각이 다른 지점', d.myView, '시장과 같은 생각이면 초과수익 근거가 없다', '막스 01~02장', hard2));
  gates.push(reqGate('리스크', '틀렸을 때 먼저 깨지는 것', d.whatBreaks, '리스크 시나리오를 적어야 한다', '막스 05~07장, 하우절 13장'));
  gates.push({ grp:'리스크', q:'레버리지·마진콜·강제매도 가능성', pass:d.leverage === '없음', hard:true, fail:'없앨 때까지 매수 금지 — 맞아도 먼저 죽을 수 있다', src:'막스 07·18장, 코스톨라니 8장, 하우절 13장' });
  gates.push.apply(gates, costGates(d.cost || {}));
  if(isStockish(d.assetType))
    gates.push(reqGate('2분 독백', '사는 이유·성공 조건·위험·매도 조건', d.monologue, '2분 독백 없이 위성 자산 매수 금지', '린치 11장'));
  gates.push.apply(gates, posGates(d.positionPct, S.ips, d.assetType, satSum()));
  gates.push(reqGate('매도 기준', '매도 기준 문서화', d.sellRule, '매도 기준 없는 매수는 절반의 계획이다', '린치 14·17장, 통합 6-2 D'));
  const eg = emotionGate(d.emotion); if(eg) gates.push(eg);
  const lt = lastTemp();
  if(lt && lt.score100 > 78 && isStockish(d.assetType))
    gates.push({ grp:'시장온도', q:'과열 국면(' + lt.score100 + '/100) 신규 매수', pass:false, hard:false, fail:'신규 매수 허들 상향 — 분할·축소·보류 검토', src:'통합 5-5 뜨거운 시장' });
  if(d.tempStale)
    gates.push({ grp:'시장온도', q:'시장온도 기록 최신성', pass:false, hard:false, fail:'30일 내 기록 없음 — 기록 후 검토 권장', src:'통합 5-2' });
  if(d.warnNoIps && !isStockish(d.assetType))
    gates.push({ grp:'관문', q:'IPS 작성 여부', pass:false, hard:false, fail:'IPS 없이 코어 매수 — 작성 권장', src:'통합 6-1' });
  return gates;
}

}

  return h;
}

/* ---------- 단계 수집 ---------- */
function collectBuyStep(d, si, strict){
  if(si === 0){
    d.name = val('#fName'); d.ticker = val('#fTick');
    d.assetType = val('#fType');
    d.stockType = (d.assetType === '개별주') ? val('#fStock') : '';
    if(strict && (!d.name || !d.assetType)) return '자산 이름과 유형을 입력하라.';
    if(strict && d.assetType === '개별주' && !d.stockType) return '린치 6유형 분류를 선택하라. (린치 7장)';
  }
  if(si === 1){
    const st = buyStructural(d);
    d.warnNoIps = !!st.warnNoIps;
    if(strict && st.block) return '관문 미통과 — ' + st.block;
  }
  if(si === 2){
    let miss = false;
    GAME_CHECK.forEach(function(g, i){ const v = pfVal('g_' + i); if(v === null) miss = true; d.game[i] = v; });
    if(strict && miss) return '6개 항목 모두 응답해야 한다.';
  }
  if(si === 3){
    const lt = lastTemp();
    d.tempStale = !lt || daysFrom(lt.date) > 30;
  }
  if(si === 4){
    d.typeOk = pfVal('t_ok'); d.typeNote = val('#fTypeNote');
    if(d.assetType === '개별주' && STOCK_SUBCHECK[d.stockType]) d.subOk = pfVal('t_sub');
    if(d.assetType === '전체시장 인덱스') d.etfCore = pfVal('t_etf');
    if(strict){
      if(d.typeOk === null) return '핵심 질문에 응답하라.';
      if(isStockish(d.assetType) && !d.typeNote) return '사업 구조 3문장을 적어라 — 말할 수 없으면 보유할 수 없다. (린치 8·12장)';
      if(d.assetType === '개별주' && STOCK_SUBCHECK[d.stockType] && d.subOk === null) return '유형별 질문에 응답하라.';
      if(d.assetType === '전체시장 인덱스' && d.etfCore === null) return 'ETF 구조 확인에 응답하라.';
    }
  }
  if(si === 5){
    let miss = false;
    PERMIT.forEach(function(p, i){ const v = pfVal('p_' + i); if(v === null) miss = true; d.permit[i] = v; });
    if(strict && miss) return '8개 조건 모두 응답해야 한다.';
  }
  if(si === 6){
    d.marketExpect = val('#fMkt'); d.myView = val('#fMy');
    d.valuation = val('#fVal'); d.pvv = val('#fPvv'); d.safety = val('#fSaf');
  }
  if(si === 7){
    d.whatBreaks = val('#fBrk'); d.leverage = val('#fLev');
    let miss = !d.leverage;
    COST_CHECK.forEach(function(e){ const v = pfVal('c_' + e.k); if(v === null) miss = true; d.cost[e.k] = v; });
    if(strict && miss) return '레버리지 여부와 비용 4항목에 응답해야 한다.';
  }
  if(si === 8){ d.monologue = val('#fMono'); }
  if(si === 9){
    d.positionPct = num(val('#fPct'));
    d.sellRule = val('#fSell'); d.emotion = val('#fEmo');
    const nr = val('#fNext'); if(nr) d.nextReview = nr;
    if(strict && !d.emotion) return '감정 상태를 선택하라 — 기록 없는 충동은 다음에 또 온다.';
  }
  return null;
}

/* ---------- 바인딩 ---------- */
function bindBuyStep(d, si){
  if(si === 0){
    const t = qs('#fType');
    if(t) t.addEventListener('change', function(){
      qs('#stockWrap').style.display = (t.value === '개별주') ? 'block' : 'none';
    });
  }
  if(si === 2 || si === 5 || si === 7 || si === 4){
    qsa('.gateitem input[type=radio]').forEach(function(r){
      r.addEventListener('change', function(){
        const box = r.closest('.gateitem');
        const name = r.name;
        let bad = (r.value === '0');
        if(name.indexOf('g_') === 0){
          const idx = parseInt(name.slice(2), 10);
          bad = (r.value === '1') !== GAME_CHECK[idx].passVal;
        }
        box.classList.toggle('failed', bad);
      });
    });
  }
  if(si === 9){
    const p = qs('#fPct'), info = qs('#posInfo');
    function upd(){
      if(!info) return;
      const v = num(p.value);
      if(v == null){ info.innerHTML = ''; return; }
      let m = [];
      if(S.ips && isStockish(d.assetType)){
        if(S.ips.singleMax != null) m.push(v > S.ips.singleMax
          ? '<span class="badge bad">단일 상한 ' + S.ips.singleMax + '% 초과</span>'
          : '<span class="badge ok">단일 상한 ' + S.ips.singleMax + '% 이내</span>');
        if(S.ips.satMax != null){
          const tot = satSum() + v;
          m.push(tot > S.ips.satMax
            ? '<span class="badge warn">위성 합계 ' + tot + '% / 한도 ' + S.ips.satMax + '%</span>'
            : '<span class="badge ok">위성 합계 ' + tot + '% / 한도 ' + S.ips.satMax + '%</span>');
        }
      }
      info.innerHTML = m.join(' ');
    }
    if(p){ p.addEventListener('input', upd); upd(); }
  }
  if(si === 10){
    const btn = qs('#bCommit');
    if(btn) btn.addEventListener('click', function(){ commitBuy(d); });
  }
}

/* ---------- 확정: 일지 레코드 + (선택) 보유 등록 ---------- */
function commitBuy(d){
  const gates = evalBuyGates(d);
  const V = verdictFromGates(gates);
  const lt = lastTemp();
  const memo = { id: uid(), schema:1, date: todayISO(),
    asset:d.name, ticker:d.ticker, assetType:d.assetType, stockType:d.stockType || null,
    action:'매수검토', verdict:V.v, verdictLabel:V.label,
    thesis: d.monologue || d.typeNote, marketExpect:d.marketExpect, myView:d.myView,
    valuation:d.valuation, pvv:d.pvv, safety:d.safety,
    whatBreaks:d.whatBreaks, leverage:d.leverage, cost:d.cost,
    sellRule:d.sellRule, positionPct:d.positionPct, emotion:d.emotion, nextReview:d.nextReview,
    levelSnapshot: S.level ? S.level.current : null,
    tempSnapshot: lt ? { date:lt.date, score100:lt.score100, regime:lt.regime, confidence:lt.confidence } : null,
    gates: gates };
  S.memos.push(memo);
  let regd = false;
  const exec = qs('#fExec');
  if(exec && exec.checked && V.v !== '보류'){
    S.holdings.push({ id: uid(), schema:1, name:d.name, ticker:d.ticker,
      type:d.assetType, stockType:d.stockType || null,
      thesis: d.monologue || d.typeNote, sellRule:d.sellRule,
      positionPct:d.positionPct, addedAt: todayISO(),
      lastReview:null, nextReview:d.nextReview, status:'보유', memoId: memo.id });
    regd = true;
  }
  S.buyDraft = null; save();
  MAIN.innerHTML = '<div class="card" style="text-align:center">' +
    '<div style="margin:10px 0">' + stamp(V.cls, V.label, true) + '</div>' +
    '<p class="sm">「' + esc(memo.asset) + '」 검토가 일지에 저장됐다.' + (regd ? ' 보유 목록에 등록됨 — 다음 점검일 ' + esc(memo.nextReview) + '.' : '') + '</p>' +
    '<div class="btnrow" style="justify-content:center"><a class="btn pri" href="#journal">일지 보기</a>' +
    (regd ? '<a class="btn" href="#holdings">보유 점검</a>' : '') +
    '<button class="btn" id="bNew">새 검토 시작</button><a class="btn" href="#home">홈</a></div></div>';
  const bn = qs('#bNew');
  if(bn) bn.addEventListener('click', function(){ viewBuy(); });
}

/* ---------- 위저드 본체 ---------- */
function viewBuy(){
  if(!S.buyDraft) S.buyDraft = newBuyDraft();
  const d = S.buyDraft;
  const seq = buySteps(d);
  if(d.step >= seq.length) d.step = seq.length - 1;
  if(d.step < 0) d.step = 0;
  const si = seq[d.step];

  let h = '<div class="steps">' + seq.map(function(x, i){
    const cls = i === d.step ? 'on' : (i < d.step ? 'done' : '');
    return '<span class="' + cls + '"' + (i < d.step ? ' data-jump="' + i + '" style="cursor:pointer"' : '') + '>' + BUY_STEPS[x] + '</span>';
  }).join('') + '</div>';
  h += '<div class="card" id="stepCard">' + renderBuyStep(d, si) + '<div id="stepMsg"></div></div>';
  h += '<div class="btnrow">' +
    (d.step > 0 ? '<button class="btn" id="bPrev">← 이전</button>' : '') +
    (si < 10 ? '<button class="btn pri" id="bNext">다음 →</button>' : '') +
    '<button class="btn danger sm" id="bReset" style="margin-left:auto">검토 초기화</button></div>';
  MAIN.innerHTML = h;

  bindBuyStep(d, si);
  const prev = qs('#bPrev');
  if(prev) prev.addEventListener('click', function(){
    collectBuyStep(d, si, false); d.step--; save(); viewBuy();
  });
  const next = qs('#bNext');
  if(next) next.addEventListener('click', function(){
    const err = collectBuyStep(d, si, true);
    if(err){ qs('#stepMsg').innerHTML = '<div class="alert warn" style="margin-top:10px">' + esc(err) + '</div>'; return; }
    d.step++; save(); viewBuy(); window.scrollTo(0, 0);
  });
  qs('#bReset').addEventListener('click', function(){
    if(confirm('작성 중인 매수 검토를 삭제할까?')){ S.buyDraft = null; save(); viewBuy(); }
  });
  qsa('[data-jump]').forEach(function(el){
    el.addEventListener('click', function(){
      collectBuyStep(d, si, false);
      d.step = parseInt(el.dataset.jump, 10); save(); viewBuy();
    });
  });
}
registerRoute('buy', viewBuy);

/* ---------- 매도 트리 ---------- */
function newSellDraft(){
  return { phase:'type', holdingId:null, asset:'', assetType:'', stockType:'',
    themeAns:null, themeCoreClaim:false, firstAns:null, spAlive:null, spRealized:null,
    thesis:'', price:'', third:null, sigSeen:null, taxOk:null,
    psych:[null,null,null,null,null], nextReview: addDays(todayISO(), 90) };
}
function sellEntryPhase(type){
  if(type === '개별주') return 'matrix';
  if(type === '테마·팩터·섹터 ETF') return 'theme';
  if(type === '특수상황') return 'special';
  return 'first';
}
function thirdQ(price){
  if(price === '하락') return '가격 하락에도 안전마진이 오히려 확대되었는가?';
  if(price === '상승') return '가치가 아직 충분히 남았는가? (이익·가치 대비)';
  return '더 나은 대안이 있고, 이 자산의 기회비용이 큰가?';
}
function sellCompute(d){
  if(d.assetType === '특수상황')
    return sellSimpleVerdict('특수상황', { alive: d.spAlive === true, realized: d.spRealized === true });
  if(d.assetType === '전체시장 인덱스' || d.assetType === '채권·현금성')
    return sellSimpleVerdict(d.assetType, { changed: d.firstAns === true });
  return sellStockVerdict({ thesis:d.thesis, price:d.price,
    marginWider: d.third === true, valueLeft: d.third === true, betterAlt: d.third === true });
}
