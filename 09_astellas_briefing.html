<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astellas Pharma Inc. — Company Briefing</title>
<style>
  /* ============ TOKENS ============ */
  :root{
    --red:#D91E49; --dark-red:#A62B4E;
    --gray:#939597; --light-gray:#A7A9AC;
    --blue:#004C97; --yellow:#F0B323; --green:#658D1B; --purple:#A20067;

    --bg:#ffffff; --surface:#f7f7f8; --surface-2:#f0f0f2;
    --line:#e6e6e8; --line-soft:#efeff1;
    --ink:#3a3a3c; --ink-strong:#2a2a2c; --muted:#6e6f72; --faint:#9a9b9e;
    --chip:#f0f0f2; --tooltip-bg:#2a2a2c; --tooltip-fg:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --shadow-lift:0 8px 28px rgba(0,0,0,.10);
    --font:-apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --nav-h:54px;
  }
  [data-theme="dark"]{
    --bg:#141619; --surface:#1b1e22; --surface-2:#22262b;
    --line:#2c3036; --line-soft:#24272c;
    --ink:#dfe0e2; --ink-strong:#f2f3f4; --muted:#a3a5a9; --faint:#777a7f;
    --chip:#262a30; --tooltip-bg:#e8e8ea; --tooltip-fg:#16181b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    --shadow-lift:0 10px 34px rgba(0,0,0,.55);
    --red:#F2305C;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; font-family:var(--font); color:var(--ink); background:var(--bg);
    line-height:1.7; font-size:15.5px; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums; transition:background .35s ease, color .35s ease;
  }
  /* fixed backdrop so the page bg always paints even if host forces body transparent */
  body::before{ content:""; position:fixed; inset:0; background:var(--bg); z-index:-1; transition:background .35s ease; }
  h1,h2,h3,h4{ color:var(--ink-strong); line-height:1.16; letter-spacing:-0.015em; margin:0; font-weight:700; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  svg{ display:block; }
  .num{ font-variant-numeric:tabular-nums; }

  .container{ max-width:1240px; margin:0 auto; padding:0 36px; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  :focus-visible{ outline:2px solid var(--red); outline-offset:2px; border-radius:3px; }

  /* ============ READING PROGRESS ============ */
  #progress{ position:fixed; top:0; left:0; height:3px; width:0; background:var(--red); z-index:200; transition:width .1s linear; }

  /* ============ TOP BAR / HERO ============ */
  .topbar{ border-bottom:1px solid var(--line); background:var(--bg); }
  .topbar .container{ display:flex; align-items:center; justify-content:space-between; padding:18px 36px; gap:20px; }
  .brand-lock{ display:flex; align-items:center; gap:16px; }
  .brand-lock img{ height:34px; width:auto; }
  .brand-lock .ph{ height:34px; display:flex; align-items:center; padding:0 14px; border:1px dashed var(--line); border-radius:5px; color:var(--faint); font-size:12px; letter-spacing:.16em; text-transform:uppercase; }
  .topbar .tools{ display:flex; align-items:center; gap:10px; }
  .iconbtn{ display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:7px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:border-color .18s, color .18s, background .18s; }
  .iconbtn:hover{ border-color:var(--red); color:var(--red); }

  .hero{ position:relative; overflow:hidden; border-bottom:1px solid var(--line); background:var(--bg); }
  .hero .container{ position:relative; z-index:2; padding-top:74px; padding-bottom:66px; }
  .hero .motif{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .hero .motif svg{ position:absolute; top:-180px; right:-200px; width:780px; height:780px; }
  .kicker{ font-size:12.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--red); font-weight:700; }
  .hero h1{ font-size:clamp(34px,5.4vw,62px); font-weight:800; letter-spacing:-0.03em; margin-top:16px; line-height:1.03; }
  .hero .sub{ margin-top:18px; max-width:42ch; font-size:clamp(16px,1.9vw,21px); color:var(--muted); font-weight:400; }
  .hero .meta{ margin-top:26px; display:flex; flex-wrap:wrap; gap:10px 22px; font-size:12.5px; color:var(--faint); letter-spacing:.04em; }
  .hero .meta b{ color:var(--muted); font-weight:600; }
  .summary{ margin-top:40px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; max-width:1000px; }
  .sum-card{ background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--red); border-radius:8px; padding:18px 20px; }
  .sum-card p{ font-size:14px; color:var(--ink); }
  .hero-note{ margin-top:30px; font-size:12px; color:var(--faint); max-width:80ch; line-height:1.6; }

  /* ============ STICKY NAV ============ */
  .nav{ position:sticky; top:0; z-index:100; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line); }
  .nav ul{ list-style:none; margin:0; padding:0; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; height:var(--nav-h); align-items:stretch; }
  .nav ul::-webkit-scrollbar{ display:none; }
  .nav a{ display:flex; align-items:center; white-space:nowrap; padding:0 13px; font-size:13px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; transition:color .16s, border-color .16s; }
  .nav a:hover{ color:var(--ink-strong); }
  .nav a.active{ color:var(--red); border-bottom-color:var(--red); }

  /* ============ SECTION SCAFFOLD ============ */
  section.block{ padding:72px 0; border-bottom:1px solid var(--line-soft); scroll-margin-top:var(--nav-h); background:var(--bg); }
  section.block.alt{ background:var(--surface); }
  .eyebrow{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .eyebrow .ix{ color:var(--red); font-weight:700; font-size:13px; }
  .eyebrow .lbl{ color:var(--faint); font-size:11.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
  .eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }
  .sec-title{ font-size:clamp(24px,3vw,36px); font-weight:700; max-width:22ch; }
  .sec-title .em{ color:var(--red); }
  .sec-lead{ margin-top:14px; max-width:70ch; color:var(--muted); font-size:16px; }

  /* ============ TAGS / BADGES / CONFIDENCE ============ */
  .tag{ display:inline-flex; align-items:center; height:20px; padding:0 9px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:.04em; white-space:nowrap; vertical-align:middle; }
  .tag.fact{ background:var(--ink-strong); color:var(--bg); }
  .tag.forecast{ background:color-mix(in srgb, var(--blue) 14%, transparent); color:var(--blue); border:1px solid color-mix(in srgb, var(--blue) 30%, transparent); }
  [data-theme="dark"] .tag.forecast{ color:#7fb0e6; }
  .tag.ambition{ background:color-mix(in srgb, var(--dark-red) 14%, transparent); color:var(--dark-red); border:1px solid color-mix(in srgb, var(--dark-red) 32%, transparent); }
  [data-theme="dark"] .tag.ambition{ color:#e88aa1; }
  .tag.interp{ background:transparent; color:var(--gray); border:1px solid var(--line); font-style:italic; font-weight:600; }

  .conf{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--faint); font-weight:600; }
  .conf .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 8px; }
  .conf.high .dot{ background:var(--green); }
  .conf.med .dot{ background:var(--yellow); }

  /* source chip */
  .schip{ display:inline-flex; align-items:center; height:18px; padding:0 7px; border-radius:5px; background:var(--chip); color:var(--faint); font-size:10px; font-weight:700; letter-spacing:.02em; cursor:pointer; border:1px solid transparent; transition:border-color .15s, color .15s; vertical-align:middle; }
  .schip:hover{ border-color:var(--red); color:var(--red); }

  .meta-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }

  /* ============ GRID + CARDS ============ */
  .grid{ display:grid; gap:18px; }
  .g2{ grid-template-columns:repeat(2,1fr); }
  .g3{ grid-template-columns:repeat(3,1fr); }
  .g4{ grid-template-columns:repeat(4,1fr); }
  .card{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:22px 24px; box-shadow:var(--shadow); }
  section.alt .card{ background:var(--bg); }

  /* KPI */
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:30px; }
  .kpi{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:18px 18px 16px; box-shadow:var(--shadow); position:relative; }
  .kpi .klabel{ font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.02em; min-height:32px; }
  .kpi .kval{ margin-top:8px; font-size:30px; font-weight:800; color:var(--red); letter-spacing:-0.02em; line-height:1; }
  .kpi .kval .u{ font-size:.42em; font-weight:600; color:var(--faint); margin-left:4px; letter-spacing:0; }
  .kpi .kfoot{ margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .kpi .kfy{ font-size:11px; color:var(--faint); font-weight:600; }
  .kpi .krw, .strip .krw{ margin-top:6px; font-size:12px; font-weight:700; color:var(--muted); }
  .krw-lbl{ font-size:9.5px; font-weight:600; color:var(--faint); letter-spacing:.02em; margin-left:3px; }
  .krw-cell{ font-size:10.5px; font-weight:600; color:var(--faint); margin-top:2px; white-space:nowrap; }

  /* Snapshot table */
  .snap{ margin-top:14px; display:grid; grid-template-columns:repeat(2,1fr); gap:0 40px; }
  .snap dl{ margin:0; }
  .snap .row{ display:grid; grid-template-columns:42% 1fr; gap:14px; padding:13px 0; border-bottom:1px solid var(--line-soft); }
  .snap dt{ color:var(--muted); font-weight:600; font-size:13.5px; }
  .snap dd{ margin:0; color:var(--ink-strong); font-weight:600; font-size:14.5px; }
  .ta-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .ta-chips span{ font-size:12px; font-weight:600; background:var(--chip); color:var(--ink); padding:4px 10px; border-radius:6px; }

  /* exec summary */
  .exec{ margin-top:20px; display:grid; gap:12px; }
  .exec .e{ display:flex; gap:16px; align-items:flex-start; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:16px 20px; }
  .exec .e .bar{ width:4px; align-self:stretch; border-radius:3px; background:var(--red); flex:0 0 4px; }
  .exec .e p{ font-size:14.5px; color:var(--ink); }

  /* timeline */
  .tl{ margin-top:34px; position:relative; padding-left:32px; }
  .tl::before{ content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .tl .node{ position:relative; padding-bottom:30px; }
  .tl .node:last-child{ padding-bottom:0; }
  .tl .node::before{ content:""; position:absolute; left:-32px; top:5px; width:16px; height:16px; border-radius:50%; background:var(--red); border:3px solid var(--bg); box-shadow:0 0 0 1px var(--line); }
  .tl .yr{ font-size:20px; font-weight:800; color:var(--red); }
  .tl .ev{ margin-top:3px; font-size:15.5px; font-weight:700; color:var(--ink-strong); }
  .tl .mn{ margin-top:3px; font-size:14px; color:var(--muted); max-width:64ch; }

  /* tables */
  .tbl-wrap{ position:relative; margin-top:22px; border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); }
  .tbl-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:680px; }
  thead th{ background:var(--surface-2); color:var(--ink-strong); font-weight:700; text-align:left; padding:13px 16px; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; border-bottom:1px solid var(--line); }
  tbody td{ padding:13px 16px; border-top:1px solid var(--line-soft); vertical-align:top; }
  tbody tr:hover td{ background:var(--surface); }
  td .b{ font-weight:700; color:var(--ink-strong); }
  .num-cell{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .na{ color:var(--faint); font-style:italic; }

  /* product / brand cards */
  .prodgrid{ margin-top:22px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .brand-acc{ margin-top:24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .bcard{ background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:22px; box-shadow:var(--shadow); cursor:pointer; transition:transform .2s ease, box-shadow .2s ease, border-color .2s; }
  .bcard:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb,var(--red) 40%, var(--line)); }
  .bcard .bh{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .bcard .bn{ font-size:20px; font-weight:800; color:var(--ink-strong); letter-spacing:-0.01em; }
  .bcard .gen{ font-size:12px; color:var(--faint); margin-top:2px; font-style:italic; }
  .bcard .stat{ margin-top:16px; display:flex; align-items:baseline; gap:10px; }
  .bcard .stat .v{ font-size:24px; font-weight:800; color:var(--red); }
  .bcard .stat .yoy{ font-size:13px; font-weight:700; color:var(--green); }
  .bcard .why{ margin-top:12px; font-size:13.5px; color:var(--muted); }
  .bcard .detail{ overflow:hidden; max-height:0; transition:max-height .4s ease; }
  .bcard.open .detail{ max-height:420px; }
  .bcard .detail-inner{ padding-top:16px; margin-top:16px; border-top:1px solid var(--line-soft); display:grid; gap:10px; }
  .bcard .dl{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .bcard .dv{ font-size:13.5px; color:var(--ink); margin-top:2px; }
  .bcard .toggle{ margin-top:14px; font-size:12px; font-weight:700; color:var(--red); display:flex; align-items:center; gap:6px; }
  .bcard .toggle .ar{ transition:transform .3s; }
  .bcard.open .toggle .ar{ transform:rotate(180deg); }

  /* phase steppers / pipeline */
  .filterbar{ margin-top:22px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .fbtn{ height:34px; padding:0 16px; border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:999px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:all .16s; }
  .fbtn:hover{ border-color:var(--red); color:var(--red); }
  .fbtn.active{ background:var(--red); border-color:var(--red); color:#fff; }
  .pipegrid{ margin-top:20px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .pcard{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:20px; box-shadow:var(--shadow); transition:opacity .35s ease, transform .35s ease, border-color .2s; }
  .pcard.hide{ display:none; }
  .pcard .pcode{ font-size:16px; font-weight:800; color:var(--ink-strong); }
  .pcard .pind{ font-size:13px; color:var(--muted); margin-top:4px; min-height:36px; }
  .pcard .pmoa{ font-size:12px; color:var(--faint); margin-top:6px; }
  .stepper{ margin-top:16px; display:flex; align-items:center; gap:0; }
  .stepper .st{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; }
  .stepper .st .d{ width:13px; height:13px; border-radius:50%; background:var(--line); border:2px solid var(--bg); z-index:2; }
  .stepper .st.on .d{ background:var(--red); }
  .stepper .st .pl{ font-size:10px; font-weight:700; color:var(--faint); }
  .stepper .st.on .pl{ color:var(--red); }
  .stepper .st::before{ content:""; position:absolute; top:6px; left:-50%; width:100%; height:2px; background:var(--line); z-index:1; }
  .stepper .st:first-child::before{ display:none; }
  .stepper .st.on::before{ background:var(--red); }
  .pnote{ margin-top:14px; font-size:11.5px; color:var(--faint); font-style:italic; line-height:1.5; }

  /* CSP */
  .pillars{ margin-top:24px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .pillar{ background:var(--bg); border:1px solid var(--line); border-left:3px solid var(--dark-red); border-radius:9px; padding:20px 22px; box-shadow:var(--shadow); }
  .pillar .pt{ font-size:16px; font-weight:800; color:var(--ink-strong); }
  .pillar .pc{ font-size:14px; color:var(--muted); margin-top:8px; }
  .goals{ margin-top:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .goal{ background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:24px; text-align:center; box-shadow:var(--shadow); }
  .goal .gv{ font-size:38px; font-weight:800; color:var(--red); line-height:1; }
  .goal .gk{ margin-top:10px; font-size:13px; color:var(--muted); font-weight:600; }

  /* charts */
  .charts{ margin-top:26px; display:grid; gap:20px; }
  .chart{ background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:24px 24px 18px; box-shadow:var(--shadow); }
  .chart svg{ width:100%; height:auto; display:block; }
  .chart .ct{ font-size:15px; font-weight:800; color:var(--ink-strong); }
  .chart .cs{ font-size:12.5px; color:var(--faint); margin-top:3px; }
  .chart svg text.lbl{ paint-order:stroke; stroke:var(--bg); stroke-width:3.2px; stroke-linejoin:round; }
  .legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin:14px 0 6px; font-size:12px; color:var(--muted); font-weight:600; }
  .legend span{ display:inline-flex; align-items:center; gap:7px; }
  .legend i{ width:14px; height:4px; border-radius:2px; display:inline-block; }
  .legend i.dash{ height:0; border-top:2px dashed currentColor; width:16px; }
  .tabs{ display:inline-flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:9px; margin-top:18px; }
  .tabs button{ border:0; background:transparent; font-family:inherit; font-size:13px; font-weight:700; color:var(--muted); padding:7px 16px; border-radius:7px; cursor:pointer; transition:all .16s; }
  .tabs button.active{ background:var(--bg); color:var(--red); box-shadow:var(--shadow); }
  .tabpane{ display:none; }
  .tabpane.active{ display:block; }

  /* heat table */
  .heat{ display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:12px; }
  .heat .sq{ width:11px; height:11px; border-radius:3px; }
  .h-high{ background:color-mix(in srgb,var(--red) 16%, transparent); color:var(--red); }
  .h-high .sq{ background:var(--red); }
  .h-med{ background:color-mix(in srgb,var(--yellow) 22%, transparent); color:#9a7400; }
  .h-med .sq{ background:var(--yellow); }
  [data-theme="dark"] .h-med{ color:var(--yellow); }
  .h-low{ background:color-mix(in srgb,var(--green) 16%, transparent); color:var(--green); }
  .h-low .sq{ background:var(--green); }
  .itrel{ font-size:10.5px; font-weight:800; letter-spacing:.04em; padding:2px 7px; border-radius:5px; background:var(--chip); color:var(--muted); }
  .itrel.hi{ background:color-mix(in srgb,var(--red) 14%, transparent); color:var(--red); }

  /* digital / opp cards */
  .topicgrid{ margin-top:22px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .topic{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:22px; box-shadow:var(--shadow); }
  .topic .tn{ font-size:16px; font-weight:800; color:var(--ink-strong); }
  .topic .field{ margin-top:12px; }
  .topic .fl{ font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .topic .fv{ font-size:13.5px; color:var(--ink); margin-top:2px; }
  .topic .kpiline{ margin-top:12px; font-size:12px; color:var(--blue); font-weight:700; }
  [data-theme="dark"] .topic .kpiline{ color:#7fb0e6; }

  /* digital — upgraded topic cards */
  .digi-band{ margin-top:24px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1px solid var(--line); border-radius:11px; overflow:hidden; box-shadow:var(--shadow); }
  .digi-band .db{ padding:18px 22px; border-right:1px solid var(--line); }
  .digi-band .db:last-child{ border-right:none; }
  .digi-band .db .v{ font-size:24px; font-weight:800; color:var(--red); line-height:1; }
  .digi-band .db .k{ margin-top:7px; font-size:12.5px; color:var(--muted); font-weight:600; }
  .dgrid{ margin-top:18px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .dtopic{ background:var(--bg); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; transition:transform .2s, box-shadow .2s, border-color .2s; }

  function axisColor(){ return 'var(--line)'; }
  function chartRevenueMargin(F){
    var W=760,H=344,pL=46,pR=52,pB=44,pT=42;
    var pw=W-pL-pR, ph=H-pT-pB, n=F.length, band=pw/n, bw=band*0.46;
    var revMax=2400, marMax=30;
    function yR(v){ return pT+ph-(v/revMax)*ph; }
    function yM(v){ return pT+ph-(v/marMax)*ph; }
    var bars='', i, f, x, cx;
    for(i=0;i<n;i++){ f=F[i]; x=pL+band*i+(band-bw)/2; var y=yR(f.rev); var fc=f.af==='forecast';
      bars+='<rect class="bar-rect" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(pT+ph-y).toFixed(1)+'" rx="2" fill="'+(fc?'color-mix(in srgb,var(--red) 32%, transparent)':'var(--red)')+'"'+(fc?' stroke="var(--red)" stroke-width="1.3" stroke-dasharray="4 3"':'')+' style="transition-delay:'+(i*70)+'ms"></rect>';
      bars+='<text class="'+(fc?'lbl':'')+'" x="'+(x+bw/2).toFixed(1)+'" y="'+(pT+ph-14).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" fill="'+(fc?'var(--red)':'#fff')+'">'+fmt(f.rev)+'</text>';
    }
    var pts=F.map(function(f,i){ return (pL+band*i+band/2).toFixed(1)+','+yM(f.m).toFixed(1); }).join(' ');
    // revenue values sit inside bar tops; margin % labels clear BOTH the dot and the bar top (min y) so they never collide with the inside-bar value
    var dots=F.map(function(f,i){ var ly=Math.min(yM(f.m)-12, yR(f.rev)-14); return '<circle cx="'+(pL+band*i+band/2).toFixed(1)+'" cy="'+yM(f.m).toFixed(1)+'" r="3.6" fill="var(--blue)" stroke="var(--bg)" stroke-width="1.5"></circle><text class="lbl" x="'+(pL+band*i+band/2).toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--blue)">'+fmt(f.m)+'%</text>'; }).join('');
    var yticksR='',v; for(v=0;v<=revMax;v+=800){ yticksR+='<line x1="'+pL+'" y1="'+yR(v)+'" x2="'+(W-pR)+'" y2="'+yR(v)+'" stroke="'+axisColor()+'" stroke-width="1"></line><text x="'+(pL-8)+'" y="'+(yR(v)+3)+'" text-anchor="end" font-size="9.5" fill="var(--faint)">'+v+'</text>'; }
    var yticksM=''; for(v=0;v<=marMax;v+=10){ yticksM+='<text x="'+(W-pR+8)+'" y="'+(yM(v)+3)+'" text-anchor="start" font-size="9.5" fill="var(--blue)">'+v+'%</text>'; }
    var xlab=F.map(function(f,i){ return '<text x="'+(pL+band*i+band/2).toFixed(1)+'" y="'+(H-pB+18)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">'+f.fy+'</text>'; }).join('');
    return '<div class="chart reveal"><div class="ct">매출 & Core OP 마진 (FY2021–FY2026)</div><div class="cs">막대 = 매출(좌, 십억엔) · 라인 = Core OP 마진%(우). FY2026은 전망(점선)</div>'+
      '<div class="legend"><span style="color:var(--red)"><i style="background:var(--red)"></i>매출(실적)</span><span style="color:var(--red)"><i class="dash"></i>매출(전망)</span><span style="color:var(--blue)"><i style="background:var(--blue)"></i>Core OP 마진%</span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="FY2021부터 FY2026까지 매출과 Core OP 마진 추세 차트">'+
      yticksR+yticksM+bars+'<polyline class="draw" points="'+pts+'" fill="none" stroke="var(--blue)" stroke-width="2.5"></polyline>'+dots+xlab+'</svg>'+
      tableFallback(['FY','매출','Core OP 마진%'], F.map(function(f){return [f.fy, fmt(f.rev), fmt(f.m)+'%'];}))+'</div>';
  }

  function chartXtandiVsSb(F){
    var W=760,H=300,pL=46,pR=24,pB=44,pT=18;
    var pw=W-pL-pR, ph=H-pT-pB, n=F.length, band=pw/(n-1), max=1000;
    function y(v){ return pT+ph-(v/max)*ph; }
    function cx(i){ return pL+band*i; }
    // XTANDI: split actual (i 0..4) and forecast (4..5)
    var xtA=[],xtF=[]; F.forEach(function(f,i){ if(i<=4) xtA.push(cx(i)+','+y(f.xt)); if(i>=4) xtF.push(cx(i)+','+y(f.xt)); });
    // SB starts at i=2 (FY2023)
    var sbA=[],sbF=[]; F.forEach(function(f,i){ if(f.sb!=null){ if(i<=4) sbA.push(cx(i)+','+y(f.sb)); if(i>=4) sbF.push(cx(i)+','+y(f.sb)); } });
    function dots(arr,color){ return F.map(function(f,i){ var val=arr==='xt'?f.xt:f.sb; if(val==null) return ''; return '<circle cx="'+cx(i)+'" cy="'+y(val)+'" r="3.4" fill="'+color+'" stroke="var(--bg)" stroke-width="1.5"></circle>'; }).join(''); }
    var labels=''; F.forEach(function(f,i){ labels+='<text class="lbl" x="'+cx(i)+'" y="'+(y(f.xt)-10)+'" text-anchor="middle" font-size="10" font-weight="800" fill="var(--red)">'+fmt(f.xt)+'</text>'; if(f.sb!=null) labels+='<text class="lbl" x="'+cx(i)+'" y="'+(y(f.sb)+17)+'" text-anchor="middle" font-size="10" font-weight="800" fill="var(--dark-red)">'+fmt(f.sb)+'</text>'; });
    var yt='',v; for(v=0;v<=max;v+=200){ yt+='<line x1="'+pL+'" y1="'+y(v)+'" x2="'+(W-pR)+'" y2="'+y(v)+'" stroke="'+axisColor()+'"></line><text x="'+(pL-8)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="9.5" fill="var(--faint)">'+v+'</text>'; }
    var xlab=F.map(function(f,i){ return '<text x="'+cx(i)+'" y="'+(H-pB+18)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">'+f.fy+'</text>'; }).join('');
    return '<div class="chart reveal"><div class="ct">전환 서사: XTANDI vs 전략 브랜드 (FY2021–FY2026)</div><div class="cs">XTANDI 하강과 전략브랜드 상승 — post-XTANDI 전환. 십억엔 · FY2026 전망(점선) <span class="tag forecast" style="margin-left:6px">전망</span></div>'+
      '<div class="legend"><span style="color:var(--red)"><i style="background:var(--red)"></i>XTANDI</span><span style="color:var(--dark-red)"><i style="background:var(--dark-red)"></i>전략 브랜드 합계</span><span><i class="dash"></i>전망 구간</span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="XTANDI와 전략브랜드 매출 전환 차트">'+
      yt+'<polyline class="draw" points="'+xtA.join(' ')+'" fill="none" stroke="var(--red)" stroke-width="2.8"></polyline>'+
      '<polyline points="'+xtF.join(' ')+'" fill="none" stroke="var(--red)" stroke-width="2.8" stroke-dasharray="6 4" opacity="0.7"></polyline>'+
      '<polyline class="draw" points="'+sbA.join(' ')+'" fill="none" stroke="var(--dark-red)" stroke-width="2.8"></polyline>'+
      '<polyline points="'+sbF.join(' ')+'" fill="none" stroke="var(--dark-red)" stroke-width="2.8" stroke-dasharray="6 4" opacity="0.7"></polyline>'+
      dots('xt','var(--red)')+dots('sb','var(--dark-red)')+labels+xlab+'</svg>'+
      tableFallback(['FY','XTANDI','전략브랜드'], F.map(function(f){return [f.fy, fmt(f.xt), f.sb==null?'N/A':fmt(f.sb)];}))+'</div>';
  }

  function chartRevenueMix(){
    var segs=[
      {l:'XTANDI',v:960.8,c:'var(--red)'},
      {l:'전략 브랜드',v:480.3,c:'var(--dark-red)'},
      {l:'PROGRAF 계열',v:207.7,c:'var(--blue)'},
      {l:'mirabegron',v:189.7,c:'var(--gray)'},
      {l:'기타 (잔여)',v:300.7,c:'var(--light-gray)'}
    ];
    var total=2139.2, W=760,H=120, x=46, bh=58, y=30, scale=(W-92)/total;
    var rects='',labels='',cum=x;
    segs.forEach(function(sg,i){ var w=sg.v*scale; rects+='<rect class="grow-x" x="'+cum.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+bh+'" fill="'+sg.c+'" style="transition-delay:'+(i*90)+'ms"></rect>'; if(w>42) rects+='<text x="'+(cum+w/2).toFixed(1)+'" y="'+(y+bh/2+4)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">'+(sg.v/total*100).toFixed(0)+'%</text>'; cum+=w; });
    var leg=segs.map(function(sg){ return '<span style="color:var(--ink)"><i style="background:'+sg.c+';height:12px;width:12px;border-radius:3px"></i>'+sg.l+' · '+fmt(sg.v)+'십억엔</span>'; }).join('');
    return '<div class="chart reveal"><div class="ct">FY2025 매출 구성 (100% 스택)</div><div class="cs">총 매출 2,139.2십억엔. "기타"는 매출에서 명시 제품 합계를 제외한 잔여(약 300.7).</div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="FY2025 매출 구성 스택 바">'+rects+'</svg>'+
      '<div class="legend" style="gap:10px 20px">'+leg+'</div>'+
      tableFallback(['구성','십억엔'], segs.map(function(sg){return [sg.l, fmt(sg.v)];}))+'</div>';
  }

  function chartSbComposition(){
    var b=[
      {l:'PADCEV',v:221.2,yoy:'+34.8%'},
      {l:'IZERVAY',v:77.6,yoy:'+33.2%'},
      {l:'XOSPATA',v:71.8,yoy:'+5.7%'},
      {l:'VYLOY',v:63.1,yoy:'+415.6%'},
      {l:'VEOZAH',v:46.6,yoy:'+37.7%'}
    ];
    var W=760,H=300,pL=46,pR=20,pB=58,pT=20, pw=W-pL-pR, ph=H-pT-pB, n=b.length, band=pw/n, bw=band*0.5, max=240;
    function yv(v){ return pT+ph-(v/max)*ph; }
    var bars=b.map(function(d,i){ var x=pL+band*i+(band-bw)/2, y=yv(d.v);
      return '<rect class="bar-rect" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(pT+ph-y).toFixed(1)+'" rx="2" fill="var(--dark-red)" style="transition-delay:'+(i*70)+'ms"></rect>'+
        '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-20).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink-strong)">'+fmt(d.v)+'</text>'+
        '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--green)">'+d.yoy+'</text>'+
        '<text x="'+(pL+band*i+band/2).toFixed(1)+'" y="'+(H-pB+20)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">'+d.l+'</text>'; }).join('');
    var yt='',v; for(v=0;v<=max;v+=60){ yt+='<line x1="'+pL+'" y1="'+yv(v)+'" x2="'+(W-pR)+'" y2="'+yv(v)+'" stroke="'+axisColor()+'"></line><text x="'+(pL-8)+'" y="'+(yv(v)+3)+'" text-anchor="end" font-size="9.5" fill="var(--faint)">'+v+'</text>'; }
    return '<div class="chart reveal"><div class="ct">전략 브랜드 구성 (FY2025) · 합계 480.3십억엔</div><div class="cs">막대 위 라벨은 YoY 성장률 (비반올림 원수치 기준)</div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="전략 브랜드 FY2025 매출 구성">'+yt+bars+'</svg>'+
      tableFallback(['브랜드','십억엔','YoY'], b.map(function(d){return [d.l, fmt(d.v), d.yoy];}))+'</div>';
  }

  function financialTable(F){
    function c(v){ return v==null?'<span class="na">N/A</span>':fmt(v); }
    return '<div class="tbl-wrap reveal" style="margin-top:24px"><div class="tbl-scroll"><table><thead><tr>'+
      '<th>FY</th><th>구분</th><th class="num-cell">매출</th><th class="num-cell">Core OP</th><th class="num-cell">영업이익</th><th class="num-cell">순이익</th><th class="num-cell">R&D</th><th class="num-cell">Core OP 마진</th><th class="num-cell">전략브랜드</th><th class="num-cell">XTANDI</th></tr></thead><tbody>'+
      F.map(function(f){ return '<tr><td class="b">'+f.fy+'</td><td>'+(f.af==='forecast'?'<span class="tag forecast">전망</span>':'<span class="tag fact">실적</span>')+'</td>'+
        '<td class="num-cell">'+c(f.rev)+(f.rev!=null?'<div class="krw-cell">'+toKRW(f.rev)+'</div>':'')+'</td><td class="num-cell">'+c(f.op)+(f.op!=null?'<div class="krw-cell">'+toKRW(f.op)+'</div>':'')+'</td><td class="num-cell">'+c(f.opo)+'</td><td class="num-cell">'+c(f.profit)+'</td><td class="num-cell">'+c(f.rnd)+'</td><td class="num-cell">'+c(f.m)+'%</td><td class="num-cell">'+c(f.sb)+'</td><td class="num-cell">'+c(f.xt)+'</td></tr>'; }).join('')+
      '</tbody></table></div></div>'+
      '<p class="sec-lead" style="font-size:12.5px;margin-top:12px;font-style:italic">단위: 십억엔. 매출·Core OP 행의 ₩ 값은 1 JPY ≈ 9.4원 가정의 개념적 참고치(공식 수치 아님). '+esc(D.fy23_note)+' 개별 전략브랜드의 FY2026 전망은 미공개(N/A).</p>';
  }

  function tableFallback(headers, rows){
    return '<table class="sr-only"><thead><tr>'+headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>'; }).join('')+'</tbody></table>';
  }

  /* ============ INTERACTIONS ============ */
  // count-up
  function countUp(el){
    var to=parseFloat(el.getAttribute('data-to')), dec=parseInt(el.getAttribute('data-dec'),10)||0;
    if(RM){ el.textContent=to.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return; }
    var dur=900, st=null;
    function step(ts){ if(!st) st=ts; var p=Math.min((ts-st)/dur,1); var e=1-Math.pow(1-p,3); var val=to*e;
      el.textContent=val.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  // reveal + chart draw + countup observer
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(!en.isIntersecting) return; var el=en.target;
      el.classList.add('in');
      Array.prototype.forEach.call(el.querySelectorAll('.cv'), countUp);
      Array.prototype.forEach.call(el.querySelectorAll('svg .draw'), function(p){
        if(RM) return; try{ var len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len; p.getBoundingClientRect(); p.style.transition='stroke-dashoffset 1.1s ease'; requestAnimationFrame(function(){ p.style.strokeDashoffset=0; }); }catch(e){}
      });
      io.unobserve(el);
    });
  },{ rootMargin:'0px 0px -8% 0px', threshold:0.08 });
  Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function(el){ io.observe(el); });

  // chart bar grow (CSS handles via .in on .chart)
  // add style for bar-rect + grow-x
  var st=document.createElement('style');
  st.textContent='.chart svg .bar-rect{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.2,.7,.2,1);}'+
    '.chart.in svg .bar-rect{transform:scaleY(1);}'+
    '.chart svg .grow-x{transform-box:fill-box;transform-origin:left;transform:scaleX(0);transition:transform .8s cubic-bezier(.2,.7,.2,1);}'+
    '.chart.in svg .grow-x{transform:scaleX(1);}';
  document.head.appendChild(st);
  if(RM){ var s2=document.createElement('style'); s2.textContent='.chart svg .bar-rect{transform:scaleY(1)!important}.chart svg .grow-x{transform:scaleX(1)!important}'; document.head.appendChild(s2); }

  // scrollspy
  var navLinks=Array.prototype.slice.call(document.querySelectorAll('.nav a'));
  var linkMap={}; navLinks.forEach(function(a){ linkMap[a.getAttribute('href').slice(1)]=a; });
  var spy=new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ navLinks.forEach(function(a){a.classList.remove('active');}); var l=linkMap[en.target.id]; if(l){ l.classList.add('active'); var nr=l.parentNode.parentNode.getBoundingClientRect(), r=l.getBoundingClientRect(); if(r.left<nr.left||r.right>nr.right){ l.parentNode.parentNode.scrollLeft+=(r.left-nr.left)-16; } } } });
  },{ rootMargin:'-48% 0px -50% 0px' });
  Array.prototype.forEach.call(document.querySelectorAll('main section[id]'), function(s){ spy.observe(s); });

  // progress bar
  var prog=$('#progress');
  function onScroll(){ var h=document.documentElement; var max=h.scrollHeight-h.clientHeight; prog.style.width=(max>0?(h.scrollTop/max*100):0)+'%'; }
  window.addEventListener('scroll',onScroll,{passive:true}); onScroll();

  // brand accordion
  document.addEventListener('click', function(e){
    var card=e.target.closest && e.target.closest('.bcard'); if(card){ var open=card.classList.toggle('open'); card.setAttribute('aria-expanded', open?'true':'false'); }
  });
  document.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('bcard')){ e.preventDefault(); e.target.classList.toggle('open'); } });

  // pipeline filter
  document.querySelector('#pipeline .filterbar').addEventListener('click', function(e){
    var b=e.target.closest('.fbtn'); if(!b) return; var ph=b.dataset.phase;
    Array.prototype.forEach.call(this.querySelectorAll('.fbtn'), function(x){x.classList.remove('active');}); b.classList.add('active');
    Array.prototype.forEach.call(document.querySelectorAll('#pipeline .pcard'), function(c){ c.classList.toggle('hide', !(ph==='all'||c.dataset.phase===ph)); });
  });

  // risk filter
  $('#riskFilter').addEventListener('click', function(e){
    var b=e.target.closest('.fbtn'); if(!b) return; var cat=b.dataset.cat;
    Array.prototype.forEach.call(this.querySelectorAll('.fbtn'), function(x){x.classList.remove('active');}); b.classList.add('active');
    $('#riskBody').innerHTML=riskRows(cat);
  });

  // finance tabs
  document.querySelector('#financials .tabs').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return; var t=b.dataset.tab;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){x.classList.toggle('active', x===b);});
    Array.prototype.forEach.call(document.querySelectorAll('#financials .tabpane'), function(p){
      var on=p.dataset.pane===t; p.classList.toggle('active', on);
      if(on){ Array.prototype.forEach.call(p.querySelectorAll('.chart'), function(c){ c.classList.add('in'); }); }
    });
  });

  // source chip tooltip + click
  var tip=$('#tooltip'); var srcTitle={}; D.sources.forEach(function(s){ srcTitle[s.id]=s.title; });
  function showTip(el){ var id=el.dataset.src; tip.textContent=srcTitle[id]||id; var r=el.getBoundingClientRect(); tip.style.left=Math.min(window.innerWidth-300, r.left)+'px'; tip.style.top=(r.bottom+8)+'px'; tip.classList.add('show'); }
  function hideTip(){ tip.classList.remove('show'); }
  document.addEventListener('mouseover', function(e){ var c=e.target.closest && e.target.closest('.schip'); if(c) showTip(c); });
  document.addEventListener('mouseout', function(e){ if(e.target.closest && e.target.closest('.schip')) hideTip(); });
  document.addEventListener('focusin', function(e){ var c=e.target.closest && e.target.closest('.schip'); if(c) showTip(c); });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('click', function(e){ var c=e.target.closest && e.target.closest('.schip'); if(!c) return; var id=c.dataset.src; var t=document.getElementById('src-'+id); if(t){ hideTip(); location.hash='src-'+id; } });

  // dark mode (default light; dark is opt-in via toggle to preserve the editorial light design)
  var root=document.documentElement;
  function syncTheme(){ var dark=root.getAttribute('data-theme')==='dark'; $('#themeLabel').textContent=dark?'라이트':'다크'; $('#themeIcon').textContent=dark?'☀':'◐'; }
  syncTheme();
  $('#themeToggle').addEventListener('click', function(){ root.setAttribute('data-theme', root.getAttribute('data-theme')==='dark'?'light':'dark'); syncTheme(); });

})();
</script>
</body>
